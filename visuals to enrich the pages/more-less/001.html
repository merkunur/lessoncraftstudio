<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>More or Less - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(180deg, #F5FFFE 0%, #FFF8F7 100%); font-family: 'Fredoka', sans-serif;">

        <!-- Top decorative bar -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #1E88E5 0%, #FF9800 50%, #4CAF50 100%);"></div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #FF6B6B 0%, #FF5252 100%); color: white; padding: 10px 24px; font-size: 22px; font-weight: 700; border-radius: 25px; box-shadow: 0 4px 15px rgba(255,107,107,0.4); letter-spacing: 2px;">FREE</div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 28px; right: 25px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #26A69A 0%, #00897B 100%); color: white; padding: 8px 20px; font-size: 16px; font-weight: 600; border-radius: 20px; box-shadow: 0 4px 12px rgba(38,166,154,0.4); font-family: 'Nunito', sans-serif;">PreK-K</div>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 85px; left: 0; right: 0; text-align: center;">
            <div style="font-size: 56px; font-weight: 700; color: #5E35B1; text-shadow: 2px 2px 0 rgba(94,53,177,0.1);">3 Comparison Types!</div>
            <div style="width: 200px; height: 5px; background: linear-gradient(90deg, transparent, #5E35B1, transparent); margin: 12px auto 0; border-radius: 3px;"></div>
        </div>

        <!-- Three Panels Container -->
        <div style="position: absolute; top: 185px; left: 25px; right: 25px; height: 590px; display: flex; gap: 18px;">

            <!-- Panel 1: Greater Than (>) -->
            <div style="flex: 1; background: linear-gradient(180deg, #E3F2FD 0%, #BBDEFB 100%); border-radius: 24px; position: relative; border: 3px solid #90CAF9; overflow: hidden; box-shadow: 0 10px 30px rgba(30,136,229,0.15);">
                <!-- Panel header -->
                <div style="background: linear-gradient(135deg, #1E88E5 0%, #1565C0 100%); padding: 14px 10px; text-align: center;">
                    <div style="color: white; font-size: 22px; font-weight: 700; text-shadow: 1px 1px 0 rgba(0,0,0,0.1);">Greater Than</div>
                </div>

                <!-- Giant Symbol -->
                <div style="text-align: center; margin-top: 10px;">
                    <div style="font-size: 100px; font-weight: 700; color: #1E88E5; line-height: 1; text-shadow: 3px 3px 0 rgba(30,136,229,0.2);">></div>
                </div>

                <!-- Label -->
                <div style="text-align: center; padding: 0 10px;">
                    <div style="font-size: 15px; color: #1565C0; font-weight: 600; font-family: 'Nunito', sans-serif;">"More than"</div>
                    <div style="font-size: 12px; color: #42A5F5; font-family: 'Nunito', sans-serif; margin-top: 2px;">Bigger group wins!</div>
                </div>

                <!-- Worksheet preview -->
                <div style="padding: 12px; margin-top: 5px;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/more%20less/sample-1.jpeg" style="width: 100%; height: auto; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); border: 3px solid white;">
                </div>

                <!-- Decorative elements -->
                <div style="position: absolute; bottom: 12px; left: 12px; width: 10px; height: 10px; background: #1E88E5; border-radius: 50%; opacity: 0.5;"></div>
                <div style="position: absolute; bottom: 22px; left: 27px; width: 6px; height: 6px; background: #1E88E5; border-radius: 50%; opacity: 0.3;"></div>
            </div>

            <!-- Panel 2: Less Than (<) -->
            <div style="flex: 1; background: linear-gradient(180deg, #FFF3E0 0%, #FFE0B2 100%); border-radius: 24px; position: relative; border: 3px solid #FFCC80; overflow: hidden; box-shadow: 0 10px 30px rgba(255,152,0,0.15);">
                <!-- Panel header -->
                <div style="background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%); padding: 14px 10px; text-align: center;">
                    <div style="color: white; font-size: 22px; font-weight: 700; text-shadow: 1px 1px 0 rgba(0,0,0,0.1);">Less Than</div>
                </div>

                <!-- Giant Symbol -->
                <div style="text-align: center; margin-top: 10px;">
                    <div style="font-size: 100px; font-weight: 700; color: #FF9800; line-height: 1; text-shadow: 3px 3px 0 rgba(255,152,0,0.2);"><</div>
                </div>

                <!-- Label -->
                <div style="text-align: center; padding: 0 10px;">
                    <div style="font-size: 15px; color: #E65100; font-weight: 600; font-family: 'Nunito', sans-serif;">"Fewer than"</div>
                    <div style="font-size: 12px; color: #FFB74D; font-family: 'Nunito', sans-serif; margin-top: 2px;">Smaller group side!</div>
                </div>

                <!-- Worksheet preview -->
                <div style="padding: 12px; margin-top: 5px;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/more%20less/sample-10.jpeg" style="width: 100%; height: auto; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); border: 3px solid white;">
                </div>

                <!-- Decorative elements -->
                <div style="position: absolute; bottom: 12px; right: 12px; width: 10px; height: 10px; background: #FF9800; border-radius: 50%; opacity: 0.5;"></div>
                <div style="position: absolute; bottom: 22px; right: 27px; width: 6px; height: 6px; background: #FF9800; border-radius: 50%; opacity: 0.3;"></div>
            </div>

            <!-- Panel 3: Equal To (=) -->
            <div style="flex: 1; background: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 100%); border-radius: 24px; position: relative; border: 3px solid #A5D6A7; overflow: hidden; box-shadow: 0 10px 30px rgba(76,175,80,0.15);">
                <!-- Panel header -->
                <div style="background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%); padding: 14px 10px; text-align: center;">
                    <div style="color: white; font-size: 22px; font-weight: 700; text-shadow: 1px 1px 0 rgba(0,0,0,0.1);">Equal To</div>
                </div>

                <!-- Giant Symbol -->
                <div style="text-align: center; margin-top: 10px;">
                    <div style="font-size: 100px; font-weight: 700; color: #4CAF50; line-height: 1; text-shadow: 3px 3px 0 rgba(76,175,80,0.2);">=</div>
                </div>

                <!-- Label -->
                <div style="text-align: center; padding: 0 10px;">
                    <div style="font-size: 15px; color: #2E7D32; font-weight: 600; font-family: 'Nunito', sans-serif;">"Same as"</div>
                    <div style="font-size: 12px; color: #66BB6A; font-family: 'Nunito', sans-serif; margin-top: 2px;">Both groups match!</div>
                </div>

                <!-- Worksheet preview -->
                <div style="padding: 12px; margin-top: 5px;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/more%20less/sample-5.jpeg" style="width: 100%; height: auto; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); border: 3px solid white;">
                </div>

                <!-- Decorative elements -->
                <div style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px;">
                    <div style="width: 8px; height: 8px; background: #4CAF50; border-radius: 50%; opacity: 0.5;"></div>
                    <div style="width: 8px; height: 8px; background: #4CAF50; border-radius: 50%; opacity: 0.4;"></div>
                    <div style="width: 8px; height: 8px; background: #4CAF50; border-radius: 50%; opacity: 0.3;"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Section -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 115px; background: linear-gradient(180deg, transparent 0%, rgba(38,166,154,0.05) 100%); display: flex; align-items: center; justify-content: center; gap: 25px; padding-bottom: 15px;">
            <!-- Answer Keys badge -->
            <div style="background: linear-gradient(135deg, #4CAF50 0%, #43A047 100%); color: white; padding: 14px 28px; border-radius: 30px; font-size: 20px; font-weight: 700; box-shadow: 0 6px 20px rgba(76,175,80,0.35); display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 24px;">✓</span> Answer Keys Included!
            </div>

            <!-- Print & Go badge -->
            <div style="background: linear-gradient(135deg, #26A69A 0%, #00897B 100%); color: white; padding: 14px 28px; border-radius: 30px; font-size: 20px; font-weight: 700; box-shadow: 0 6px 20px rgba(38,166,154,0.35);">
                🖨️ Print & Go!
            </div>
        </div>

        <!-- Bottom decorative bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #1E88E5 0%, #FF9800 50%, #4CAF50 100%);"></div>

    </div>
</body>
</html>
