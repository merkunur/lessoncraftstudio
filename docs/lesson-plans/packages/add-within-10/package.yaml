# Teaching package — add within 10
# Arc 11 Phase 1 (Path B; early-numeracy / addition-subtraction strand
# deepening 1/14 → 2/14). Builds on Arc 1 add-within-5. Foundational
# arithmetic step toward formal addition.

targetSlug: add-within-10
language: en
title:
  en: "Adding Within 10 — sums up to 10"
description:
  en: "Kindergarten / Grade 1 early-numeracy package teaching addition with sums up to 10. Builds on Arc 1 add-within-5 — kids now extend addition strategies to a wider sum range. Foundational arithmetic skill bridging counting (Arc 1+3+8+9) into formal addition. Kids learn count-on strategy (start with larger number, count up by smaller) + use of fingers + part-whole models. Vocab-anchored — addition-relevant vocabulary (more, plus, equals, sum, total). Composes against math-puzzle + math-worksheet apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class addition-fact routine. Teacher says: "I have 3 apples
      and 2 more apples. How many altogether?" Class counts: 1, 2, 3
      + 1, 2 = 5. Repeat with sums up to 10: "4 and 3," "5 and 5,"
      "6 and 2." Reinforces COUNT-ON strategy — kids start with the
      larger group + count up by the smaller. Teacher writes addition
      sentences (3 + 2 = 5) on board to connect concrete counting
      to symbolic notation.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + manipulative addition routine. Each pair receives
      cut-out objects + a 10-frame template. Pair plays addition
      games: kid A puts 4 objects in the frame; kid B adds 3 more;
      together they count to find the sum (7). Recast errors with
      explanation ("you said 4 + 3 = 6 — let's count: 1, 2, 3, 4
      + 1, 2, 3 — that's 7 not 6. Use the COUNT-ON strategy: start
      at 4, count UP 3 more — 5, 6, 7"). Optional extension: kids
      construct their own addition number-stories using their cut-out
      objects.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: math-worksheet (kids solve sums-
      to-10 problems). Station 2: math-puzzle (sums-to-10 puzzle
      pieces). Station 3: manipulative cut-outs hands-on addition
      (kids combine 2 groups + count totals; reinforces concrete
      basis). Station 4: matching worksheet (number to quantity
      matching).
  closure:
    durationMinutes: 5
    body: |
      Whole-class addition-quiz routine. Teacher displays addition
      problems with sums to 10; class answers chorally. Forward-
      pointer: "Today we added within 10. When we come back to
      addition next, we'll add within 20 — bigger sums using the
      same count-on strategy."

