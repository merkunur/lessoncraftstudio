<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Prepositions Worksheets - Progression Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(160deg, #E0F2FE 0%, #BAE6FD 50%, #E0F2FE 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Subtle dot pattern -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.06; pointer-events: none;" viewBox="0 0 1000 1000">
            <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
                <circle cx="15" cy="15" r="2" fill="#6D28D9"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#dots)"/>
        </svg>

        <!-- FREE Badge - Top Left -->
        <div style="
            position: absolute;
            top: 35px;
            left: 40px;
            z-index: 20;
        ">
            <div style="
                width: 85px;
                height: 85px;
                background: linear-gradient(135deg, #F97066 0%, #EF4444 100%);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 6px 20px rgba(249, 112, 102, 0.45);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 26px;
                    color: white;
                    letter-spacing: 1px;
                ">FREE</span>
            </div>
        </div>

        <!-- Grade Badge - Top Right -->
        <div style="
            position: absolute;
            top: 45px;
            right: 40px;
            background: linear-gradient(135deg, #6D28D9 0%, #7C3AED 100%);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 20px;
            padding: 10px 22px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.35);
            z-index: 20;
        ">GRADES PreK-2</div>

        <!-- Title -->
        <div style="
            position: absolute;
            top: 35px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 62px;
                color: #1E293B;
                margin: 0;
                text-shadow: 0 2px 8px rgba(0,0,0,0.08);
            ">Learn Step by Step!</h1>
        </div>

        <!-- Winding path SVG connecting the 3 stations -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;" viewBox="0 0 1000 1000">
            <!-- Main winding path -->
            <path d="M 200 820 Q 100 700 250 620 Q 400 540 500 500 Q 600 460 700 380 Q 850 280 780 200" stroke="#8B5CF6" stroke-width="6" fill="none" stroke-dasharray="18 12" opacity="0.5"/>
            <!-- Arrow at end -->
            <polygon points="775,205 790,185 765,190" fill="#8B5CF6" opacity="0.6"/>
        </svg>

        <!-- Station 1: SIMPLE (Bottom-Left) -->
        <div style="
            position: absolute;
            bottom: 130px;
            left: 60px;
            z-index: 15;
        ">
            <!-- Green platform -->
            <div style="
                background: linear-gradient(135deg, #10B981 0%, #059669 100%);
                border-radius: 20px;
                padding: 20px;
                box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
                width: 260px;
            ">
                <!-- Station header -->
                <div style="
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    margin-bottom: 12px;
                ">
                    <div style="
                        background: rgba(255,255,255,0.25);
                        border-radius: 50%;
                        width: 36px;
                        height: 36px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 700;
                        font-size: 18px;
                        color: white;
                    ">1</div>
                    <span style="
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 700;
                        font-size: 24px;
                        color: white;
                    ">SIMPLE</span>
                    <!-- 1 star -->
                    <svg width="24" height="24" viewBox="0 0 100 100" style="margin-left: auto;">
                        <polygon points="50,8 61,40 95,40 67,60 78,92 50,72 22,92 33,60 5,40 39,40" fill="#FBBF24"/>
                    </svg>
                </div>
                <!-- Word pills -->
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <span style="background: rgba(255,255,255,0.9); padding: 4px 14px; border-radius: 12px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #059669;">on</span>
                    <span style="background: rgba(255,255,255,0.9); padding: 4px 14px; border-radius: 12px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #059669;">in</span>
                </div>
                <!-- Worksheet preview -->
                <div style="
                    background: white;
                    padding: 6px;
                    border-radius: 8px;
                    display: inline-block;
                ">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-4.jpeg"
                        alt="Simple Prepositions Worksheet"
                        style="
                            width: 150px;
                            height: 194px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 4px;
                            display: block;
                        "
                    />
                </div>
            </div>
        </div>

        <!-- Station 2: GROWING (Center) -->
        <div style="
            position: absolute;
            top: 340px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        ">
            <!-- Orange platform -->
            <div style="
                background: linear-gradient(135deg, #F97066 0%, #EF4444 100%);
                border-radius: 20px;
                padding: 20px;
                box-shadow: 0 10px 30px rgba(249, 112, 102, 0.3);
                width: 260px;
            ">
                <!-- Station header -->
                <div style="
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    margin-bottom: 12px;
                ">
                    <div style="
                        background: rgba(255,255,255,0.25);
                        border-radius: 50%;
                        width: 36px;
                        height: 36px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 700;
                        font-size: 18px;
                        color: white;
                    ">2</div>
                    <span style="
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 700;
                        font-size: 24px;
                        color: white;
                    ">GROWING</span>
                    <!-- 2 stars -->
                    <div style="margin-left: auto; display: flex; gap: 2px;">
                        <svg width="20" height="20" viewBox="0 0 100 100">
                            <polygon points="50,8 61,40 95,40 67,60 78,92 50,72 22,92 33,60 5,40 39,40" fill="#FBBF24"/>
                        </svg>
                        <svg width="20" height="20" viewBox="0 0 100 100">
                            <polygon points="50,8 61,40 95,40 67,60 78,92 50,72 22,92 33,60 5,40 39,40" fill="#FBBF24"/>
                        </svg>
                    </div>
                </div>
                <!-- Word pills -->
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <span style="background: rgba(255,255,255,0.9); padding: 4px 14px; border-radius: 12px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #EF4444;">under</span>
                    <span style="background: rgba(255,255,255,0.9); padding: 4px 14px; border-radius: 12px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #EF4444;">beside</span>
                </div>
                <!-- Worksheet preview -->
                <div style="
                    background: white;
                    padding: 6px;
                    border-radius: 8px;
                    display: inline-block;
                ">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-8.jpeg"
                        alt="Growing Prepositions Worksheet"
                        style="
                            width: 150px;
                            height: 194px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 4px;
                            display: block;
                        "
                    />
                </div>
            </div>
        </div>

        <!-- Station 3: ADVANCED (Top-Right) -->
        <div style="
            position: absolute;
            top: 115px;
            right: 60px;
            z-index: 15;
        ">
            <!-- Purple platform -->
            <div style="
                background: linear-gradient(135deg, #6D28D9 0%, #7C3AED 100%);
                border-radius: 20px;
                padding: 20px;
                box-shadow: 0 10px 30px rgba(109, 40, 217, 0.3);
                width: 260px;
            ">
                <!-- Station header -->
                <div style="
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    margin-bottom: 12px;
                ">
                    <div style="
                        background: rgba(255,255,255,0.25);
                        border-radius: 50%;
                        width: 36px;
                        height: 36px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 700;
                        font-size: 18px;
                        color: white;
                    ">3</div>
                    <span style="
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 700;
                        font-size: 24px;
                        color: white;
                    ">ADVANCED</span>
                    <!-- 3 stars -->
                    <div style="margin-left: auto; display: flex; gap: 2px;">
                        <svg width="18" height="18" viewBox="0 0 100 100">
                            <polygon points="50,8 61,40 95,40 67,60 78,92 50,72 22,92 33,60 5,40 39,40" fill="#FBBF24"/>
                        </svg>
                        <svg width="18" height="18" viewBox="0 0 100 100">
                            <polygon points="50,8 61,40 95,40 67,60 78,92 50,72 22,92 33,60 5,40 39,40" fill="#FBBF24"/>
                        </svg>
                        <svg width="18" height="18" viewBox="0 0 100 100">
                            <polygon points="50,8 61,40 95,40 67,60 78,92 50,72 22,92 33,60 5,40 39,40" fill="#FBBF24"/>
                        </svg>
                    </div>
                </div>
                <!-- Word pills -->
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <span style="background: rgba(255,255,255,0.9); padding: 4px 14px; border-radius: 12px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #7C3AED;">between</span>
                    <span style="background: rgba(255,255,255,0.9); padding: 4px 14px; border-radius: 12px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #7C3AED;">behind</span>
                </div>
                <!-- Worksheet preview -->
                <div style="
                    background: white;
                    padding: 6px;
                    border-radius: 8px;
                    display: inline-block;
                ">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-12.jpeg"
                        alt="Advanced Prepositions Worksheet"
                        style="
                            width: 150px;
                            height: 194px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 4px;
                            display: block;
                        "
                    />
                </div>
            </div>
        </div>

        <!-- Bottom progression bar -->
        <div style="
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        ">
            <div style="
                background: white;
                border-radius: 50px;
                padding: 14px 30px;
                box-shadow: 0 6px 20px rgba(0,0,0,0.1);
                display: flex;
                align-items: center;
                gap: 16px;
            ">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: #10B981;">Simple Start</span>
                <svg width="24" height="24" viewBox="0 0 100 100">
                    <polygon points="20,50 80,50 60,30" fill="#8B5CF6" transform="rotate(90 50 50)"/>
                </svg>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: #F97066;">Build Skills</span>
                <svg width="24" height="24" viewBox="0 0 100 100">
                    <polygon points="20,50 80,50 60,30" fill="#8B5CF6" transform="rotate(90 50 50)"/>
                </svg>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: #6D28D9;">Master Level</span>
            </div>
        </div>
    </div>
</body>
</html>
