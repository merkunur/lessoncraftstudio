assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify which of 2 objects is longer / shorter in 8 of 10
        trials.
      - Use the comparative frame ('the X is longer than the Y') in 7
        of 10 productive-language attempts.
      - Order 3 objects shortest-to-longest using direct comparison in
        6 of 10 attempts.

    Differentiation:
    - Pre-K: 2-object direct comparison only; productive vocab limited
      to single-word ('longer' / 'shorter').
    - K: 2-3-object comparison + comparative-grammar frame.
    - Grade 1+: extend to length-with-units (informal units like 'how
      many paperclips long?'); bridge to ruler-based measurement
      (Arc 10+ candidate).

