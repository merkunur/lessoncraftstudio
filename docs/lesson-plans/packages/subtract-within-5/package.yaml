# Teaching package — subtract within 5
# Arc 14 Phase 4 (math / addition-subtraction +1 from Arc 12 baseline).
# Resolves Arc 12 add-within-5 forward-pointer.

targetSlug: subtract-within-5
language: en
title:
  en: "Subtract Within 5 — taking away small numbers"
description:
  en: "Kindergarten / Grade 1 math package teaching kids to subtract numbers within 5 (5-3=2, 4-1=3, 3-2=1, etc.). Builds on Arc 12 add-within-5 + add-within-10 + add-within-20 addition foundation. RESOLVES Arc 12 add-within-5 forward-pointer ('next we extend numeracy work to subtraction within 5 + within 10'). Subtraction within 5 is the canonical K-1 entry point to subtraction: small enough numbers for finger-counting + concrete-manipulative work; takeaway concept introduced with explicit physical demonstrations. Pairs with subtract-within-10 (this Phase 4 sibling). Critical bridge from counting + addition to inverse-operation subtraction. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + subtraction introduction. Teacher displays
      5 cubes. "I have 5 cubes. If I TAKE AWAY 2 cubes, how many
      are left?" Teacher removes 2 cubes physically; class counts
      remaining: "3!" Teacher writes "5 - 2 = 3" on board.
      Repeat with several small subtraction problems (4-1, 3-2,
      5-3, 4-2). Subtraction = TAKING AWAY. Visual + tactile
      anchor with physical manipulatives. "Subtraction is like
      addition in reverse — instead of putting together, we take
      away."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + subtraction routine. Each pair receives a
      worksheet with 6 subtraction problems (5-2, 4-1, 3-2, 5-3,
      4-3, 5-1) plus countable manipulatives (small cubes or
      counters). Pair takes turns: kid A reads problem; kid B
      counts out the first number + removes the second number +
      counts remaining. Recast errors with re-count ("you said
      5-2=2. Let's recount: start with 5, take away 2 — 1, 2 —
      that leaves 3. So 5-2=3.").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: subtraction worksheet (cross-out
      method: visual countable items with crossed-out cross-outs).
      Station 2: matching worksheet (subtraction problem to
      pictorial answer). Station 3: math-worksheet (vertical
      subtraction format introduction; simple 5-3, 4-2 problems).
      Station 4: vocabulary-tracing-strips for subtraction
      vocabulary (minus, take away, subtract, equals, difference).
  closure:
    durationMinutes: 5
    body: |
      Whole-class subtraction review. Teacher presents 5 fast-paced
      subtraction problems; class collectively answers using
      fingers or mental math. "5-1? 4-2? 3-3? 5-4? 4-0?"
      Forward-pointer: "Today we subtracted within 5. When we come
      back next, we'll subtract within 10 — bigger numbers but
      same TAKE AWAY idea — and later within 20 and beyond!"

