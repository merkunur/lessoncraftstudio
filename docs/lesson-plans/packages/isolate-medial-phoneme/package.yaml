assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Isolate the medial vowel of a spoken CVC word in 7 of
        10 trials.
      - Match a pictured CVC word to its middle-vowel letter
        in 7 of 10 trials.
      - Sort 12 pictures into middle-vowel groups (3-5 groups
        for the 5 short vowels) correctly in 6 of 10 attempts.
      - Discriminate high-contrast minimal pairs (cat/cot, mat/
        mit) in 7 of 10 trials.
      - Discriminate high-similarity minimal pairs (pen/pin,
        cup/cap) in 5 of 10 trials (extension).
      - Use vocabulary 'middle sound' / 'middle vowel' / 'short
        vowel' correctly in 5 of 10 productive-language trials.
      - Identify ALL THREE phonemes of a CVC word (initial +
        medial + final) in 5 of 8 attempts.

    Differentiation:
    - Pre-K: focus on rhyme + syllable + initial-phoneme work;
      defer medial-vowel isolation to K-Grade 1.
    - K: high-contrast minimal-pair work only (cat/cot/cut
      with maximally-distant vowel sounds); defer high-
      similarity pairs (pen/pin/pun) to Grade 1.
    - Grade 1: full 5-vowel medial-isolation including high-
      similarity pairs; bridge to vowel-substitution decoding
      + word-family work (-at, -et, -it, -ot, -ut).
    - Grade 2+: extend to long-vowel pattern recognition
      (CVCe silent-e; vowel teams ai/ay/ee/ea/oa); bridge to
      full systematic phonics decoding.

