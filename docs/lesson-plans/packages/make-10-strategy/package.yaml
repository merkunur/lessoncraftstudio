compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (make-10
    strategy — deepens strand 11/14 → 12/14). Secondary
    strand: math / number-decomposition (the load-bearing
    mental move is decomposing one addend to fill the other
    to 10; this is the same decomposition skill that grounds
    later place-value work). Tertiary strand: working-memory
    + strategy-selection (kid holds the partner-pair in mind
    while breaking the second addend; named-strategy fluency
    is a precondition for flexible mental arithmetic).

    Architectural significance: strategy-isolation companion
    to Arc 12 add-within-20. In add-within-20, make-10 is
    the core fluency lesson embedded inside a broader sums-
    within-20 unit; this package isolates the make-10
    mechanic as a named, focused skill. Kids who need extra
    strategy-fluency practice get a dedicated unit; the make-
    10 move becomes a memorable named strategy rather than
    something that happens incidentally. The within-20
    package and this strategy-isolation package compose
    naturally — teachers can teach within-20 first and then
    pull this strategy-isolation package for a targeted
    second pass, OR teach this package first as preparation
    for within-20.

    Paired strand-anchor companion: find-missing-addend-
    within-10 (same arc phase) — the make-10 partner work
    overlaps directly with missing-addend recall (knowing
    7 + ? = 10 IS finding a missing addend within 10). The
    two packages share addition-fluency strand DNA without
    being inverse partners (unlike the 2-digit-without-
    regrouping pair); their pairing is thematic rather than
    operationally inverse.

    Distinctive composition: 1 math-puzzle addition + 2
    math-worksheet (sums-within-20 with make-10 problems
    weighted) + 1 addition find-addend (constrained to make-
    10-partner problems) + 1 matching (match sum to make-10
    decomposition path). The find-addend exercise at
    position 3 is the load-bearing strategy-practice slot —
    by isolating the partner-recall move (8 + ? = 10) it
    builds the fluency the larger sums depend on. Materials
    drop place-value-mat (not load-bearing for single-digit
    make-10 work); the 10-frame role lives inside the
    manipulative-cut-outs material in single-repeat mode
    (kids arrange counters in a 10-frame layout themselves).

    Class B FLEXIBLE substrate: composes against breakfast
    theme (foods with discrete, countable items — toast
    pieces, eggs, pancakes — that visually support the
    decomposition story; cross-strand diversification away
    from animals-dominant addition packages per §1
    acquisition-flywheel reuse-density principle).

    K-3 multilingual classroom relevance: make-10 strategy
    is universal K-3 numeracy bridge. The make-10 mental
    move is locale-portable — the decomposition is the same
    in every locale; only the vocabulary varies. Cross-locale
    make-10 vocabulary: en 'make ten / bond to ten / partner
    to ten'; de 'Zehnerübergang / Zerlegung zur 10'; es
    'formar diez / descomponer hasta diez'; pt 'fazer dez /
    decompor para chegar a dez'; fr 'compléter à dix /
    décomposer pour faire dix'; fi 'kymmeneen täydentäminen'.
    Teen-number naming irregularities (Arc 12 add-within-20
    rationale) become especially salient here: kids who say
    '10 + 3 = thirteen' have to coordinate the decomposition
    pattern with the irregular teen-word; the make-10
    strategy makes the 'ten and three' structure of teen
    numbers operationally visible.

