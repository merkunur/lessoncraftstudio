<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Big or Small - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(180deg, #F5FFFE 0%, #FFF8F7 100%); font-family: 'Fredoka', sans-serif;">

        <!-- Top decorative bar -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #26A69A 0%, #FF8A80 50%, #26A69A 100%);"></div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #FF8A80 0%, #FF6B6B 100%); color: white; padding: 10px 24px; font-size: 22px; font-weight: 700; border-radius: 25px; box-shadow: 0 4px 15px rgba(255,138,128,0.4); letter-spacing: 2px;">FREE</div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 28px; right: 25px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #26A69A 0%, #00897B 100%); color: white; padding: 8px 20px; font-size: 16px; font-weight: 600; border-radius: 20px; box-shadow: 0 4px 12px rgba(38,166,154,0.4); font-family: 'Nunito', sans-serif;">PreK-K</div>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 85px; left: 0; right: 0; text-align: center;">
            <div style="font-size: 58px; font-weight: 700; color: #26A69A; text-shadow: 2px 2px 0 rgba(38,166,154,0.1);">3 Activity Types!</div>
            <div style="width: 200px; height: 5px; background: linear-gradient(90deg, transparent, #FF8A80, transparent); margin: 12px auto 0; border-radius: 3px;"></div>
        </div>

        <!-- Three Panels Container -->
        <div style="position: absolute; top: 190px; left: 30px; right: 30px; height: 580px; display: flex; gap: 20px;">

            <!-- Panel 1: Circle the Biggest (Identical Images) -->
            <div style="flex: 1; background: linear-gradient(180deg, #FFEFED 0%, #FFE5E2 100%); border-radius: 24px; position: relative; border: 3px solid #FFD5D0; overflow: hidden; box-shadow: 0 10px 30px rgba(255,138,128,0.15);">
                <!-- Panel header -->
                <div style="background: linear-gradient(135deg, #FF8A80 0%, #FF6B6B 100%); padding: 16px 10px; text-align: center;">
                    <div style="color: white; font-size: 22px; font-weight: 700; text-shadow: 1px 1px 0 rgba(0,0,0,0.1);">Circle the Biggest</div>
                </div>

                <!-- Icon badge -->
                <div style="position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255,138,128,0.3); border: 3px solid #FF8A80;">
                    <span style="font-size: 24px;">👁️</span>
                </div>

                <!-- Label -->
                <div style="text-align: center; margin-top: 50px; padding: 0 10px;">
                    <div style="font-size: 16px; color: #D4726A; font-weight: 600; font-family: 'Nunito', sans-serif;">Same Items</div>
                    <div style="font-size: 13px; color: #E8938C; font-family: 'Nunito', sans-serif; margin-top: 4px;">2 identical images</div>
                </div>

                <!-- Worksheet preview -->
                <div style="padding: 15px; margin-top: 10px;">
                    <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/big%20small/big-small%20identical%20images.jpeg" style="width: 100%; height: auto; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); border: 3px solid white;">
                </div>

                <!-- Decorative elements -->
                <div style="position: absolute; bottom: 15px; left: 15px; width: 10px; height: 10px; background: #FF8A80; border-radius: 50%; opacity: 0.5;"></div>
                <div style="position: absolute; bottom: 25px; left: 30px; width: 6px; height: 6px; background: #FF8A80; border-radius: 50%; opacity: 0.3;"></div>
            </div>

            <!-- Panel 2: Compare Different -->
            <div style="flex: 1; background: linear-gradient(180deg, #E8F8F7 0%, #D8F2F0 100%); border-radius: 24px; position: relative; border: 3px solid #B8E8E4; overflow: hidden; box-shadow: 0 10px 30px rgba(38,166,154,0.15);">
                <!-- Panel header -->
                <div style="background: linear-gradient(135deg, #26A69A 0%, #00897B 100%); padding: 16px 10px; text-align: center;">
                    <div style="color: white; font-size: 22px; font-weight: 700; text-shadow: 1px 1px 0 rgba(0,0,0,0.1);">Compare Different</div>
                </div>

                <!-- Icon badge -->
                <div style="position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(38,166,154,0.3); border: 3px solid #26A69A;">
                    <span style="font-size: 24px;">🔄</span>
                </div>

                <!-- Label -->
                <div style="text-align: center; margin-top: 50px; padding: 0 10px;">
                    <div style="font-size: 16px; color: #1D8A80; font-weight: 600; font-family: 'Nunito', sans-serif;">Different Items</div>
                    <div style="font-size: 13px; color: #4DB6AC; font-family: 'Nunito', sans-serif; margin-top: 4px;">2 different images</div>
                </div>

                <!-- Worksheet preview -->
                <div style="padding: 15px; margin-top: 10px;">
                    <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/big%20small/big-small-different%20images.jpeg" style="width: 100%; height: auto; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); border: 3px solid white;">
                </div>

                <!-- Decorative elements -->
                <div style="position: absolute; bottom: 15px; right: 15px; width: 10px; height: 10px; background: #26A69A; border-radius: 50%; opacity: 0.5;"></div>
                <div style="position: absolute; bottom: 25px; right: 30px; width: 6px; height: 6px; background: #26A69A; border-radius: 50%; opacity: 0.3;"></div>
            </div>

            <!-- Panel 3: Order 1-2-3 -->
            <div style="flex: 1; background: linear-gradient(180deg, #FFF9E6 0%, #FFF3CC 100%); border-radius: 24px; position: relative; border: 3px solid #FFE699; overflow: hidden; box-shadow: 0 10px 30px rgba(255,193,7,0.15);">
                <!-- Panel header -->
                <div style="background: linear-gradient(135deg, #FFC107 0%, #FFB300 100%); padding: 16px 10px; text-align: center;">
                    <div style="color: white; font-size: 22px; font-weight: 700; text-shadow: 1px 1px 0 rgba(0,0,0,0.15);">Order 1-2-3</div>
                </div>

                <!-- Icon badge -->
                <div style="position: absolute; top: 65px; left: 50%; transform: translateX(-50%); background: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255,193,7,0.3); border: 3px solid #FFC107;">
                    <span style="font-size: 24px;">📊</span>
                </div>

                <!-- Label -->
                <div style="text-align: center; margin-top: 50px; padding: 0 10px;">
                    <div style="font-size: 16px; color: #C79100; font-weight: 600; font-family: 'Nunito', sans-serif;">Size Order</div>
                    <div style="font-size: 13px; color: #E0A800; font-family: 'Nunito', sans-serif; margin-top: 4px;">3 items to order</div>
                </div>

                <!-- Worksheet preview -->
                <div style="padding: 15px; margin-top: 10px;">
                    <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/big%20small/big-small%20number%201-2-3.jpeg" style="width: 100%; height: auto; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); border: 3px solid white;">
                </div>

                <!-- Decorative elements -->
                <div style="position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px;">
                    <div style="width: 8px; height: 8px; background: #FFC107; border-radius: 50%; opacity: 0.5;"></div>
                    <div style="width: 8px; height: 8px; background: #FFC107; border-radius: 50%; opacity: 0.4;"></div>
                    <div style="width: 8px; height: 8px; background: #FFC107; border-radius: 50%; opacity: 0.3;"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Section -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: linear-gradient(180deg, transparent 0%, rgba(38,166,154,0.05) 100%); display: flex; align-items: center; justify-content: center; gap: 25px; padding-bottom: 20px;">
            <!-- Answer Keys badge -->
            <div style="background: linear-gradient(135deg, #4CAF50 0%, #43A047 100%); color: white; padding: 14px 28px; border-radius: 30px; font-size: 20px; font-weight: 700; box-shadow: 0 6px 20px rgba(76,175,80,0.35); display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 24px;">✓</span> Answer Keys Included!
            </div>

            <!-- Print & Go badge -->
            <div style="background: linear-gradient(135deg, #26A69A 0%, #00897B 100%); color: white; padding: 14px 28px; border-radius: 30px; font-size: 20px; font-weight: 700; box-shadow: 0 6px 20px rgba(38,166,154,0.35);">
                🖨️ Print & Go!
            </div>
        </div>

        <!-- Bottom decorative bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #FF8A80 0%, #26A69A 50%, #FFC107 100%);"></div>

    </div>
</body>
</html>
