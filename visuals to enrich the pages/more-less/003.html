<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>More or Less - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(135deg, #7C4DFF 0%, #E040FB 40%, #FF4081 100%); font-family: 'Fredoka', sans-serif;">

        <!-- Radial burst from center -->
        <div style="position: absolute; top: 50%; left: 50%; width: 900px; height: 900px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 55%); border-radius: 50%;"></div>

        <!-- Confetti elements -->
        <div style="position: absolute; top: 50px; left: 80px; width: 22px; height: 22px; background: #00E5FF; border-radius: 50%; opacity: 0.9;"></div>
        <div style="position: absolute; top: 120px; left: 200px; width: 16px; height: 16px; background: #FFD600; transform: rotate(45deg); opacity: 0.8;"></div>
        <div style="position: absolute; top: 80px; right: 150px; width: 20px; height: 20px; background: #76FF03; border-radius: 50%; opacity: 0.9;"></div>
        <div style="position: absolute; top: 200px; right: 80px; width: 14px; height: 14px; background: #FF6E40; transform: rotate(30deg); opacity: 0.7;"></div>
        <div style="position: absolute; top: 300px; left: 50px; width: 18px; height: 18px; background: #00E5FF; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; bottom: 250px; left: 100px; width: 15px; height: 15px; background: #FFEB3B; transform: rotate(60deg); opacity: 0.9;"></div>
        <div style="position: absolute; bottom: 200px; right: 120px; width: 20px; height: 20px; background: #00E676; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; top: 400px; right: 40px; width: 14px; height: 14px; background: #40C4FF; transform: rotate(15deg); opacity: 0.9;"></div>
        <div style="position: absolute; bottom: 350px; left: 40px; width: 22px; height: 22px; background: #FFD740; border-radius: 50%; opacity: 0.85;"></div>

        <!-- Sparkle stars -->
        <div style="position: absolute; top: 160px; left: 120px; font-size: 34px; transform: rotate(-15deg);">✨</div>
        <div style="position: absolute; top: 100px; right: 100px; font-size: 30px; transform: rotate(20deg);">⭐</div>
        <div style="position: absolute; bottom: 280px; right: 60px; font-size: 26px; transform: rotate(-10deg);">✨</div>
        <div style="position: absolute; bottom: 200px; left: 60px; font-size: 32px; transform: rotate(10deg);">🌟</div>
        <div style="position: absolute; top: 350px; left: 25px; font-size: 24px; transform: rotate(5deg);">⭐</div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 20px; left: 20px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #00E5FF 0%, #00B8D4 100%); color: #1A237E; padding: 12px 28px; font-size: 26px; font-weight: 700; border-radius: 30px; box-shadow: 0 6px 20px rgba(0,229,255,0.5), inset 0 2px 0 rgba(255,255,255,0.4); letter-spacing: 2px; transform: rotate(-5deg);">FREE</div>
        </div>

        <!-- Main Title - Comic burst style -->
        <div style="position: absolute; top: 55px; left: 0; right: 0; text-align: center; z-index: 50;">
            <!-- Comic burst background -->
            <div style="position: absolute; top: 50%; left: 50%; width: 700px; height: 180px; background: white; transform: translate(-50%, -50%); border-radius: 50%; box-shadow: 0 0 0 10px #FFD600, 0 15px 50px rgba(0,0,0,0.2);"></div>

            <div style="position: relative; z-index: 10;">
                <div style="font-size: 68px; font-weight: 700; letter-spacing: -2px;">
                    <span style="color: #7C4DFF; font-size: 78px; display: inline-block; transform: rotate(-8deg) translateY(-3px); text-shadow: 4px 4px 0 rgba(124,77,255,0.2);">W</span><span style="color: #E040FB; font-size: 68px;">H</span><span style="color: #FF4081; font-size: 72px;">I</span><span style="color: #7C4DFF; font-size: 65px;">C</span><span style="color: #E040FB; font-size: 70px;">H</span>
                    <span style="color: #666; font-size: 50px; margin: 0 8px;">HAS</span>
                </div>
                <div style="font-size: 90px; font-weight: 700; margin-top: -18px;">
                    <span style="color: #7C4DFF; font-size: 110px; text-shadow: 5px 5px 0 rgba(124,77,255,0.2);">M</span><span style="color: #E040FB; font-size: 105px;">O</span><span style="color: #FF4081; font-size: 110px;">R</span><span style="color: #7C4DFF; font-size: 100px;">E</span><span style="color: #FFD600; font-size: 95px;">?!</span>
                </div>
            </div>
        </div>

        <!-- Central VS Badge -->
        <div style="position: absolute; top: 260px; left: 50%; transform: translateX(-50%); z-index: 60;">
            <div style="width: 90px; height: 90px; background: linear-gradient(135deg, #FFD600 0%, #FF9100 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(255,214,0,0.5), 0 0 0 6px white;">
                <span style="font-size: 40px; font-weight: 700; color: white; text-shadow: 2px 2px 0 rgba(0,0,0,0.2);">VS</span>
            </div>
        </div>

        <!-- Worksheet - Large and tilted -->
        <div style="position: absolute; top: 300px; left: 50%; transform: translateX(-50%); z-index: 30;">
            <img src="https://www.lessoncraftstudio.com/samples/english/more%20less/sample-1.jpeg" style="width: 400px; height: auto; border-radius: 18px; box-shadow: 0 25px 60px rgba(0,0,0,0.3), 0 0 0 6px white; border: none;">
        </div>

        <!-- Speech bubbles -->
        <div style="position: absolute; top: 330px; left: 80px; z-index: 40;">
            <div style="background: white; padding: 14px 22px; border-radius: 25px; font-size: 24px; font-weight: 700; color: #7C4DFF; box-shadow: 0 6px 20px rgba(0,0,0,0.15); position: relative; border: 4px solid #7C4DFF;">
                I have MORE!
                <div style="position: absolute; bottom: -15px; right: 30px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 20px solid #7C4DFF;"></div>
                <div style="position: absolute; bottom: -8px; right: 33px; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 15px solid white;"></div>
            </div>
        </div>

        <div style="position: absolute; top: 400px; right: 70px; z-index: 40;">
            <div style="background: white; padding: 12px 18px; border-radius: 22px; font-size: 20px; font-weight: 700; color: #FF4081; box-shadow: 0 5px 18px rgba(0,0,0,0.15); position: relative; border: 3px solid #FF4081;">
                I have less!
                <div style="position: absolute; bottom: -12px; left: 25px; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 15px solid #FF4081;"></div>
                <div style="position: absolute; bottom: -6px; left: 27px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 12px solid white;"></div>
            </div>
        </div>

        <!-- "Kids LOVE This!" heart badge -->
        <div style="position: absolute; top: 25px; right: 25px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #FF4081 0%, #F50057 100%); color: white; padding: 14px 24px; border-radius: 28px; font-size: 22px; font-weight: 700; box-shadow: 0 6px 22px rgba(255,64,129,0.5); display: flex; align-items: center; gap: 10px; transform: rotate(5deg);">
                <span style="font-size: 24px;">❤️</span> Kids LOVE This!
            </div>
        </div>

        <!-- Comic burst "SO MUCH FUN!" -->
        <div style="position: absolute; bottom: 180px; right: 50px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #FFD600 0%, #FF9100 100%); padding: 20px 28px; border-radius: 50%; font-size: 20px; font-weight: 700; color: #D84315; box-shadow: 0 8px 25px rgba(255,214,0,0.5); transform: rotate(10deg); text-align: center; line-height: 1.2;">
                SO MUCH<br>FUN!
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 115px; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.95) 35%, white 100%);">
            <div style="position: absolute; bottom: 22px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 22px;">
                <div style="background: linear-gradient(135deg, #7C4DFF 0%, #651FFF 100%); color: white; padding: 16px 32px; border-radius: 35px; font-size: 26px; font-weight: 700; box-shadow: 0 6px 25px rgba(124,77,255,0.4);">🎉 Count & Compare!</div>
                <div style="background: linear-gradient(135deg, #FF4081 0%, #F50057 100%); color: white; padding: 14px 26px; border-radius: 30px; font-size: 20px; font-weight: 700; box-shadow: 0 5px 20px rgba(255,64,129,0.4);">PreK-K</div>
            </div>
        </div>

        <!-- Additional floating confetti at top layer -->
        <div style="position: absolute; top: 450px; left: 15px; width: 26px; height: 9px; background: #00E5FF; border-radius: 5px; transform: rotate(-20deg); opacity: 0.8;"></div>
        <div style="position: absolute; top: 500px; right: 25px; width: 22px; height: 8px; background: #FFD600; border-radius: 4px; transform: rotate(25deg); opacity: 0.85;"></div>
        <div style="position: absolute; bottom: 150px; left: 200px; width: 24px; height: 8px; background: #E040FB; border-radius: 4px; transform: rotate(40deg); opacity: 0.7;"></div>

    </div>
</body>
</html>
