<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Bilder-Kryptogramm - Schatzkarte Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(160deg, #1E3A5F 0%, #172554 40%, #0F172A 100%);">

        <!-- Stars in sky -->
        <div style="position: absolute; top: 30px; left: 80px; width: 4px; height: 4px; background: white; border-radius: 50%; box-shadow: 0 0 6px white;"></div>
        <div style="position: absolute; top: 60px; left: 250px; width: 3px; height: 3px; background: white; border-radius: 50%; box-shadow: 0 0 4px white;"></div>
        <div style="position: absolute; top: 20px; right: 200px; width: 5px; height: 5px; background: white; border-radius: 50%; box-shadow: 0 0 8px white;"></div>
        <div style="position: absolute; top: 80px; right: 80px; width: 3px; height: 3px; background: white; border-radius: 50%; box-shadow: 0 0 5px white;"></div>

        <!-- Parchment scroll background -->
        <div style="position: absolute; top: 160px; left: 50px; right: 50px; bottom: 90px; background: linear-gradient(145deg, #F5E6C8 0%, #EDD9B3 30%, #E6CFA0 60%, #DFC58D 100%); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 2px 8px rgba(255,255,255,0.3); z-index: 2;">
            <!-- Scroll burn edges -->
            <div style="position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 40px rgba(139,90,43,0.3); pointer-events: none;"></div>
            <!-- Parchment lines (faint) -->
            <div style="position: absolute; top: 60px; left: 30px; right: 30px; height: 1px; background: rgba(139,90,43,0.12);"></div>
            <div style="position: absolute; top: 140px; left: 30px; right: 30px; height: 1px; background: rgba(139,90,43,0.12);"></div>
            <div style="position: absolute; top: 220px; left: 30px; right: 30px; height: 1px; background: rgba(139,90,43,0.12);"></div>
            <div style="position: absolute; top: 300px; left: 30px; right: 30px; height: 1px; background: rgba(139,90,43,0.12);"></div>
            <div style="position: absolute; top: 380px; left: 30px; right: 30px; height: 1px; background: rgba(139,90,43,0.12);"></div>
            <div style="position: absolute; top: 460px; left: 30px; right: 30px; height: 1px; background: rgba(139,90,43,0.12);"></div>
            <div style="position: absolute; top: 540px; left: 30px; right: 30px; height: 1px; background: rgba(139,90,43,0.12);"></div>
        </div>

        <!-- GRATIS Badge - compass/gold style -->
        <div style="position: absolute; top: 30px; left: 30px; z-index: 20;">
            <div style="width: 100px; height: 100px; background: radial-gradient(circle at 40% 40%, #FBBF24 0%, #D97706 60%, #B45309 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(217,119,6,0.5), inset 0 2px 4px rgba(255,255,255,0.3);">
                <div style="width: 84px; height: 84px; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: #1E3A5F; text-shadow: 0 1px 2px rgba(255,255,255,0.3);">GRATIS</span>
                </div>
            </div>
        </div>

        <!-- KLASSE K-3 Badge -->
        <div style="position: absolute; top: 40px; right: 35px; z-index: 20;">
            <div style="background: rgba(255,255,255,0.95); padding: 12px 26px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 800; color: #1E3A5F; letter-spacing: 1px;">KLASSE K-3</span>
            </div>
        </div>

        <!-- Main Headline -->
        <div style="position: absolute; top: 60px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 80px; font-weight: 700; color: white; text-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 40px rgba(251,191,36,0.3); letter-spacing: -1px;">ABENTEUER</h1>
            <h1 style="margin: -8px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 80px; font-weight: 700; color: #FBBF24; text-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 40px rgba(251,191,36,0.4); letter-spacing: -1px;">WARTET!</h1>
        </div>

        <!-- Tagline on parchment -->
        <div style="position: absolute; top: 195px; left: 50%; transform: translateX(-50%); z-index: 10;">
            <p style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 700; color: #78350F; letter-spacing: 1px;">Jedes Blatt eine neue Entdeckung</p>
        </div>

        <!-- Trail with worksheets as stations -->
        <!-- Red dashed trail line (SVG-like via borders) -->
        <div style="position: absolute; top: 270px; left: 100px; width: 800px; height: 400px; z-index: 5;">
            <!-- Trail segment 1 (horizontal) -->
            <div style="position: absolute; top: 60px; left: 30px; width: 180px; height: 4px; border-top: 4px dashed #DC2626;"></div>
            <!-- Trail segment 2 (diagonal down) -->
            <div style="position: absolute; top: 62px; left: 210px; width: 120px; height: 100px; border-top: 4px dashed #DC2626; transform: rotate(35deg); transform-origin: left top;"></div>
            <!-- Trail segment 3 (horizontal) -->
            <div style="position: absolute; top: 170px; left: 290px; width: 160px; height: 4px; border-top: 4px dashed #DC2626;"></div>
            <!-- Trail segment 4 (diagonal up) -->
            <div style="position: absolute; top: 80px; left: 450px; width: 120px; height: 100px; border-top: 4px dashed #DC2626; transform: rotate(-35deg); transform-origin: left bottom;"></div>
            <!-- Trail segment 5 (horizontal to X) -->
            <div style="position: absolute; top: 60px; left: 550px; width: 180px; height: 4px; border-top: 4px dashed #DC2626;"></div>
        </div>

        <!-- Worksheet stations -->
        <!-- Station 1 -->
        <div style="position: absolute; top: 260px; left: 90px; z-index: 8;">
            <div style="width: 145px; height: 188px; background: white; border-radius: 5px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); overflow: hidden; border: 2px solid #E6CFA0;">
                <img src="https://www.lessoncraftstudio.com/samples/german/cryptogram/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilder-Kryptogramm">
            </div>
            <div style="text-align: center; margin-top: 4px;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #F5E6C8; background: rgba(220,38,38,0.8); padding: 3px 10px; border-radius: 8px;">Leicht</span>
            </div>
        </div>

        <!-- Red X mark near station 1 -->
        <div style="position: absolute; top: 310px; left: 70px; z-index: 7;">
            <span style="font-family: 'Fredoka', sans-serif; font-size: 36px; font-weight: 700; color: #DC2626; text-shadow: 0 2px 6px rgba(0,0,0,0.3); transform: rotate(-10deg); display: inline-block;">X</span>
        </div>

        <!-- Station 2 -->
        <div style="position: absolute; top: 355px; left: 260px; z-index: 8;">
            <div style="width: 145px; height: 188px; background: white; border-radius: 5px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); overflow: hidden; border: 2px solid #E6CFA0;">
                <img src="https://www.lessoncraftstudio.com/samples/german/cryptogram/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilder-Kryptogramm">
            </div>
            <div style="text-align: center; margin-top: 4px;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #F5E6C8; background: rgba(220,38,38,0.8); padding: 3px 10px; border-radius: 8px;">Leicht</span>
            </div>
        </div>

        <!-- Station 3 (center) -->
        <div style="position: absolute; top: 280px; left: 418px; z-index: 8;">
            <div style="width: 155px; height: 201px; background: white; border-radius: 5px; box-shadow: 0 8px 25px rgba(0,0,0,0.35); overflow: hidden; border: 2px solid #FBBF24;">
                <img src="https://www.lessoncraftstudio.com/samples/german/cryptogram/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilder-Kryptogramm">
            </div>
            <div style="text-align: center; margin-top: 4px;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #F5E6C8; background: rgba(220,38,38,0.8); padding: 3px 10px; border-radius: 8px;">Mittel</span>
            </div>
        </div>

        <!-- Red X near station 3 -->
        <div style="position: absolute; top: 420px; right: 415px; z-index: 7;">
            <span style="font-family: 'Fredoka', sans-serif; font-size: 30px; font-weight: 700; color: #DC2626; text-shadow: 0 2px 6px rgba(0,0,0,0.3); transform: rotate(15deg); display: inline-block;">X</span>
        </div>

        <!-- Station 4 -->
        <div style="position: absolute; top: 345px; left: 600px; z-index: 8;">
            <div style="width: 145px; height: 188px; background: white; border-radius: 5px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); overflow: hidden; border: 2px solid #E6CFA0;">
                <img src="https://www.lessoncraftstudio.com/samples/german/cryptogram/sample-4.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilder-Kryptogramm">
            </div>
            <div style="text-align: center; margin-top: 4px;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #F5E6C8; background: rgba(220,38,38,0.8); padding: 3px 10px; border-radius: 8px;">Mittel</span>
            </div>
        </div>

        <!-- Station 5 -->
        <div style="position: absolute; top: 260px; right: 70px; z-index: 8;">
            <div style="width: 145px; height: 188px; background: white; border-radius: 5px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); overflow: hidden; border: 2px solid #E6CFA0;">
                <img src="https://www.lessoncraftstudio.com/samples/german/cryptogram/sample-5.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilder-Kryptogramm">
            </div>
            <div style="text-align: center; margin-top: 4px;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #F5E6C8; background: rgba(220,38,38,0.8); padding: 3px 10px; border-radius: 8px;">Knifflig</span>
            </div>
        </div>

        <!-- Red X near station 5 (treasure!) -->
        <div style="position: absolute; top: 305px; right: 55px; z-index: 7;">
            <span style="font-family: 'Fredoka', sans-serif; font-size: 42px; font-weight: 700; color: #DC2626; text-shadow: 0 3px 8px rgba(0,0,0,0.4); transform: rotate(-8deg); display: inline-block;">X</span>
        </div>

        <!-- Compass Rose (bottom-left) -->
        <div style="position: absolute; bottom: 105px; left: 80px; z-index: 12;">
            <div style="width: 100px; height: 100px; border: 3px solid #B8860B; border-radius: 50%; background: rgba(245,230,200,0.9); display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                <!-- Inner circle -->
                <div style="width: 70px; height: 70px; border: 2px solid #B8860B; border-radius: 50%; position: relative;">
                    <!-- N -->
                    <span style="position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700; color: #DC2626;">N</span>
                    <!-- S -->
                    <span style="position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 600; color: #78350F;">S</span>
                    <!-- O (Ost = East in German) -->
                    <span style="position: absolute; top: 50%; right: 4px; transform: translateY(-50%); font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 600; color: #78350F;">O</span>
                    <!-- W -->
                    <span style="position: absolute; top: 50%; left: 4px; transform: translateY(-50%); font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 600; color: #78350F;">W</span>
                    <!-- Center diamond -->
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(45deg); width: 10px; height: 10px; background: #B8860B;"></div>
                </div>
            </div>
        </div>

        <!-- Bottom feature pills -->
        <div style="position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; z-index: 20;">
            <div style="background: rgba(251,191,36,0.2); backdrop-filter: blur(8px); padding: 12px 22px; border-radius: 25px; border: 2px solid rgba(251,191,36,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: #FBBF24;">Abenteuer wartet</span>
            </div>
            <div style="background: rgba(251,191,36,0.2); backdrop-filter: blur(8px); padding: 12px 22px; border-radius: 25px; border: 2px solid rgba(251,191,36,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: #FBBF24;">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: rgba(251,191,36,0.2); backdrop-filter: blur(8px); padding: 12px 22px; border-radius: 25px; border: 2px solid rgba(251,191,36,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: #FBBF24;">Sofort drucken</span>
            </div>
        </div>

    </div>
</body>
</html>
