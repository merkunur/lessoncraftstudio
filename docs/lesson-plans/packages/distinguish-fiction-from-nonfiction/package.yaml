compositionalRationale:
  en: |
    Primary strand: early-literacy / reading-comprehension
    (distinguish-fiction-from-nonfiction — strand 8/10 → 9/10).
    Pair-coherent with Phase 1.1 Slot 2 read-and-follow-2-sentence-
    instruction; together they SAT-close reading-comprehension
    at 10/10 (20th parent-class strand SAT in catalog).

    Architectural significance: penultimate canonical target in
    reading-comprehension strand. Continues Arc 17 P1.5 + Arc 18
    P1.2/1.3/1.4 narrative-comprehension cluster (identify-main-
    character + identify-setting + answer-who-what-where-questions
    + infer-character-feeling-from-picture-cue + identify-problem-
    and-solution + sequence-3-event-story). This package shifts
    from narrative-element-recognition WITHIN a story to GENRE-
    LEVEL classification ABOUT the story. Cognitive progression:
    individual story elements → story-as-whole genre identification.

    Per §A.13.30 K-1 informal framing: fiction-vs-nonfiction
    work is CONCRETE CUE RECOGNITION — kids identify pictorial +
    contextual signals that mark a story as make-believe (talking
    animals + magic + made-up creatures) vs real (photographs +
    real-world activities + factual content). NOT formal genre-
    theory pedagogy (terms like 'realism' / 'fantasy' / 'memoir' /
    'biography' are Grade 3+ work); the K-1 pedagogy uses everyday
    language ('make-believe' / 'real') to surface the underlying
    genre pattern. Story sources are everyday K-1 contexts (animal
    stories + family stories + simple informational books — kids
    recognize the genre distinction from their own reading
    experience).

    Materials note: 8-material Literacy class stack per §A.13.37
    + pair-coherent with identify-main-character (Arc 17 P1.5) +
    identify-setting (Arc 18 P1.2) on every dimension. Manipulative-
    cut-outs at position 6 emits canonical-correct `mode: single-
    repeat` per §A.13.35 + identify-main-character/setting precedent
    (themeName: miscellaneous; itemCount 24; itemSize small-1in).
    Sentence-strips at position 4 with framePreset 'this-is-a'
    accommodates genre-framing work ("This is fiction." / "This is
    nonfiction." / "This is a real photograph." / "This is a make-
    believe story.").

    Distinctive composition: picture-sort (position 1) + matching
    ×2 (positions 2+5) + missing-pieces (position 3) + pattern-train
    (position 4). Picture-sort surfaces fiction-vs-nonfiction
    classification as binary sort; matching builds genre-cue-to-
    story pairing; missing-pieces tests genre-completeness
    understanding; pattern-train reinforces narrative-comprehension
    sequencing inheriting from sequence-3-event-story precedent.

    Class B FLEXIBLE substrate: composes against miscellaneous
    theme (fiction-vs-nonfiction work spans all theme contexts).
    No substrate gaps; ships clean.

    K-3 multilingual classroom relevance: genre distinction is
    universal K-1 literacy content. Cross-locale genre vocabulary:
    en 'fiction / nonfiction / make-believe / real'; de 'Fiktion
    / Sachbuch / erfunden / echt'; es 'ficción / no-ficción /
    inventado / real'; pt 'ficção / não-ficção / inventado / real';
    fr 'fiction / documentaire / imaginaire / réel'; nordic locales
    use parallel constructions. Multilingual K-3 classrooms benefit
    from explicit genre-pattern naming in the language-of-
    instruction + bridges to home-language genre traditions.

