<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Muster-Zug Arbeitsbl&auml;tter - Variety Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(165deg, #E8F5E9 0%, #C8E6C9 40%, #A5D6A7 100%); overflow: hidden;">

        <!-- Subtle topographic pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.05; background-image: repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(27,94,32,0.3) 30px, rgba(27,94,32,0.3) 31px);"></div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 22px; left: 25px; z-index: 100;">
            <div style="background: linear-gradient(145deg, #E53935, #C62828); padding: 10px 22px; border-radius: 24px; box-shadow: 0 6px 20px rgba(229,57,53,0.4); border: 3px solid rgba(255,255,255,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white; letter-spacing: 2px;">GRATIS</span>
            </div>
        </div>

        <!-- Header -->
        <div style="position: absolute; top: 25px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 48px; color: #1A237E; margin: 0; text-shadow: 2px 2px 0 rgba(26,35,126,0.06);">Verschiedene Mustertypen</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; color: #2E7D32; margin: 6px 0 0 0;">W&auml;hle deine Lernroute!</h2>
        </div>

        <!-- TRANSIT MAP LINES -->

        <!-- GREEN LINE - Easy (AB-Muster) -->
        <div style="position: absolute; top: 155px; left: 0; right: 0; height: 220px;">
            <!-- Route line -->
            <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" viewBox="0 0 1000 220">
                <line x1="0" y1="110" x2="1000" y2="110" stroke="#4CAF50" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
                <line x1="40" y1="110" x2="960" y2="110" stroke="#4CAF50" stroke-width="8" stroke-linecap="round"/>
                <!-- Station dots -->
                <circle cx="100" cy="110" r="14" fill="white" stroke="#4CAF50" stroke-width="5"/>
                <circle cx="300" cy="110" r="14" fill="white" stroke="#4CAF50" stroke-width="5"/>
                <circle cx="520" cy="110" r="10" fill="#4CAF50"/>
                <circle cx="620" cy="110" r="10" fill="#4CAF50"/>
                <circle cx="720" cy="110" r="10" fill="#4CAF50"/>
                <circle cx="880" cy="110" r="14" fill="white" stroke="#4CAF50" stroke-width="5"/>
            </svg>
            <!-- Train emoji at start -->
            <div style="position: absolute; top: 68px; left: 48px; font-size: 34px;">&#x1F682;</div>
            <!-- Pattern badge -->
            <div style="position: absolute; top: 30px; left: 155px; background: #4CAF50; padding: 8px 20px; border-radius: 20px; box-shadow: 0 4px 12px rgba(76,175,80,0.35);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">AB-Muster</span>
            </div>
            <!-- Difficulty label -->
            <div style="position: absolute; top: 130px; left: 170px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #2E7D32; letter-spacing: 3px;">EINFACH</span>
            </div>
            <!-- Worksheet preview -->
            <div style="position: absolute; top: 18px; right: 60px;">
                <div style="width: 120px; height: 155px; background: white; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); border: 3px solid #4CAF50; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/pattern%20train/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="AB-Muster Arbeitsblatt">
                </div>
            </div>
        </div>

        <!-- YELLOW LINE - Medium (AAB-Muster) -->
        <div style="position: absolute; top: 395px; left: 0; right: 0; height: 220px;">
            <!-- Route line -->
            <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" viewBox="0 0 1000 220">
                <line x1="0" y1="110" x2="1000" y2="110" stroke="#FFC107" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
                <line x1="40" y1="110" x2="960" y2="110" stroke="#FFC107" stroke-width="8" stroke-linecap="round"/>
                <!-- Station dots -->
                <circle cx="100" cy="110" r="14" fill="white" stroke="#FFC107" stroke-width="5"/>
                <circle cx="300" cy="110" r="14" fill="white" stroke="#FFC107" stroke-width="5"/>
                <circle cx="500" cy="110" r="10" fill="#FFC107"/>
                <circle cx="600" cy="110" r="10" fill="#FFC107"/>
                <circle cx="700" cy="110" r="10" fill="#FFC107"/>
                <circle cx="880" cy="110" r="14" fill="white" stroke="#FFC107" stroke-width="5"/>
            </svg>
            <!-- Train emoji -->
            <div style="position: absolute; top: 68px; left: 48px; font-size: 34px;">&#x1F683;</div>
            <!-- Pattern badge -->
            <div style="position: absolute; top: 30px; left: 155px; background: #FFC107; padding: 8px 20px; border-radius: 20px; box-shadow: 0 4px 12px rgba(255,193,7,0.35);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #3E2723;">AAB-Muster</span>
            </div>
            <!-- Difficulty label -->
            <div style="position: absolute; top: 130px; left: 170px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #F57F17; letter-spacing: 3px;">MITTEL</span>
            </div>
            <!-- Worksheet preview -->
            <div style="position: absolute; top: 18px; right: 60px;">
                <div style="width: 120px; height: 155px; background: white; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); border: 3px solid #FFC107; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/pattern%20train/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="AAB-Muster Arbeitsblatt">
                </div>
            </div>
        </div>

        <!-- RED LINE - Challenge (AABB-Muster) -->
        <div style="position: absolute; top: 635px; left: 0; right: 0; height: 220px;">
            <!-- Route line -->
            <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" viewBox="0 0 1000 220">
                <line x1="0" y1="110" x2="1000" y2="110" stroke="#E53935" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
                <line x1="40" y1="110" x2="960" y2="110" stroke="#E53935" stroke-width="8" stroke-linecap="round"/>
                <!-- Station dots -->
                <circle cx="100" cy="110" r="14" fill="white" stroke="#E53935" stroke-width="5"/>
                <circle cx="300" cy="110" r="14" fill="white" stroke="#E53935" stroke-width="5"/>
                <circle cx="480" cy="110" r="10" fill="#E53935"/>
                <circle cx="580" cy="110" r="10" fill="#E53935"/>
                <circle cx="680" cy="110" r="10" fill="#E53935"/>
                <circle cx="880" cy="110" r="14" fill="white" stroke="#E53935" stroke-width="5"/>
            </svg>
            <!-- Train emoji -->
            <div style="position: absolute; top: 68px; left: 48px; font-size: 34px;">&#x1F685;</div>
            <!-- Pattern badge -->
            <div style="position: absolute; top: 30px; left: 155px; background: #E53935; padding: 8px 20px; border-radius: 20px; box-shadow: 0 4px 12px rgba(229,57,53,0.35);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">AABB-Muster</span>
            </div>
            <!-- Difficulty label -->
            <div style="position: absolute; top: 130px; left: 170px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #C62828; letter-spacing: 3px;">KNIFFLIG</span>
            </div>
            <!-- Worksheet preview -->
            <div style="position: absolute; top: 18px; right: 60px;">
                <div style="width: 120px; height: 155px; background: white; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.15); border: 3px solid #E53935; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/pattern%20train/sample-5.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="AABB-Muster Arbeitsblatt">
                </div>
            </div>
        </div>

        <!-- Legend at bottom -->
        <div style="position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; align-items: center; z-index: 50;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 22px; height: 22px; background: #4CAF50; border-radius: 50%; box-shadow: 0 2px 6px rgba(76,175,80,0.4);"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #2E7D32;">Einfach</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 22px; height: 22px; background: #FFC107; border-radius: 50%; box-shadow: 0 2px 6px rgba(255,193,7,0.4);"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #F57F17;">Mittel</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 22px; height: 22px; background: #E53935; border-radius: 50%; box-shadow: 0 2px 6px rgba(229,57,53,0.4);"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #C62828;">Knifflig</span>
            </div>
        </div>

        <!-- Footer text -->
        <div style="position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 15px; color: #558B2F; opacity: 0.8;">F&uuml;r jeden Lernstand die passende Route</span>
        </div>

    </div>
</body>
</html>
