# Teaching package — identify and continue AB patterns (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 7 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# FIRST pt sparse-override for cognitive-and-executive-function / pattern-recognition
# strand. BR Portuguese register per CLAUDE.md §6 (pt = BR canonical); formal "você"
# address per §17.9.

title:
  pt: "Padrões AB — identifica e continua padrões alternados"
description:
  pt: "Pacote de função executiva para Pré-K e K que ensina o reconhecimento de padrões AB. Habilidade fundamental de reconhecimento de padrões: as crianças identificam a regra alternada (gato-cachorro-gato-cachorro-?) e preveem o próximo item. Ancorado em vocabulário — nomear os objetos no padrão reforça o vocabulário. PRIMEIRO pacote da estrutura de reconhecimento de padrões; abre profundidade de padrões através do Arco 7 Fase 1+2."

structure:
  warmup:
    body: |
      Rotina de ação para toda a turma. A professora ou o professor cria um
      padrão AB físico no tapete usando recortes de papel: gato, cachorro,
      gato, cachorro, gato, cachorro. "Qual vem em seguida? Gato ou cachorro?"
      A turma responde em coro. Repita com diferentes pares de objetos
      (vermelho, azul, vermelho, azul → vermelho; ou maçã, banana, maçã,
      banana → maçã). Reforça o conceito de padrão AB + vocabulário (as
      crianças nomeiam os itens alternados em voz alta). Fixe os cartões
      de padrão na área "Padrões" do mural de palavras.
  contentActivity:
    body: |
      Rotina de mural de bolso. A professora ou o professor exibe 5-6 tiras
      de padrão AB com diferentes pares de objetos; a turma continua cada
      um colaborativamente. Trabalho em duplas: a criança A cria um padrão
      AB com recortes de papel; a criança B continua. Refraseie os erros
      com explicação ("o padrão é gato, cachorro, gato, cachorro — então
      o próximo deve ser... gato!"). Extensão opcional: as crianças criam
      padrões AB usando os próprios corpos (em pé, sentado, em pé, sentado,
      em pé, sentado — padrão de ação AB) — reconhecimento de padrão
      corporificado.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios pattern-train no
      modo AB (as crianças identificam e completam padrões AB; visual
      temático de trem). Estação 2: emparelhamento (imagem-nome reforça
      o vocabulário de objetos usados em padrões). Estação 3: construção
      de padrão prática com recortes manipulativos (as crianças constroem
      padrões AB com objetos recortados em um modelo impresso de tira de
      padrão; descrevem o padrão em voz alta).
  closure:
    body: |
      Recordação rápida com toda a turma. A professora ou o professor exibe
      um padrão AB com lacunas; a turma preenche coletivamente os itens
      em falta. Indicador adiante: "Hoje aprendemos padrões AB. Quando
      voltarmos a padrões na próxima vez, aprenderemos padrões mais
      complexos — AAB, ABB, ABC — mantendo uma regra diferente em mente."

assessmentCriteria:
  pt: |
    Identificar e completar padrões AB com 2-3 itens em falta em 8 de 10
    tentativas. Criar um padrão AB de 6 itens a partir de manipulativos
    em 7 de 10 tentativas. Nomear os objetos alternados em 8 de 10 padrões
    (verificação da âncora de vocabulário).

    Diferenciação:
      - Pré-K: padrões AB de 4 itens; com apoio de manipulativos.
      - K: padrões de 6 itens; conclusão independente da folha de exercícios.
      - Primeiro ano em diante: estender para padrões AAB/ABB/ABC/AABB
        (companheiros do Arco 7 Fases 1+2) + create-original-pattern
        (criação de padrão de final aberto).

compositionalRationale:
  pt: |
    Fio principal: função cognitiva e executiva / reconhecimento de padrões.
    Fio secundário: aquisição de vocabulário (ancorado em vocabulário —
    nomear os objetos no padrão reforça o vocabulário adquirido nos Arcos
    1-6 + Arco 7 Fase 1). Fio terciário: predição + memória de trabalho
    (as crianças retêm a regra do padrão na mente enquanto preveem o
    próximo item).

    Significância arquitetural: este é o PRIMEIRO pacote da estrutura
    de reconhecimento de padrões no catálogo (variante pt). Valida a
    integração do aplicativo pattern-train + abre a profundidade de
    padrões através das Fases 1+2 (pacotes companheiros AAB/ABB/ABC/
    AABB transportam-se ao longo das fases do Arco 7). Domínio de função
    cognitiva e executiva recebe reconhecimento de padrões como segunda
    cobertura de fio (após classificação + raciocínio lógico + memória
    e atenção dos Arcos 5+6).

    Enquadramento da âncora de vocabulário continua dos Arcos 6 Fase 2
    + 7: a tarefa cognitiva (reconhecimento de padrões) é a forma
    arquitetural; a âncora de vocabulário é o fio pedagógico. O
    reconhecimento de padrões exercita naturalmente o vocabulário porque
    as crianças nomeiam os objetos alternados.

    Relevância cultural pt-BR específica: padrões AB são culturalmente
    universais; vocabulário-âncora preservado. Brincadeiras de padrão
    (claps, batidas, sons) são canônicas em jogos folclóricos brasileiros
    para crianças K-3; a professora ou o professor pode incorporar
    elementos de cultura pop-K-3 brasileira nos exemplos quando relevante.

    Substrato Class B FLEXIBLE: compõe-se contra a amplitude da biblioteca
    de imagens. Padrões AB funcionam com QUAISQUER 2 objetos distintos;
    prontidão de substrato é universal através de temas.
