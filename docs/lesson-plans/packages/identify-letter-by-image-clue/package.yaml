compositionalRationale:
  en: |
    Primary strand: early-literacy / letter-recognition. Secondary
    strand: vocabulary acquisition (vocab-anchored — letter-recognition
    DEPENDS ON vocabulary because kids identify initial letters of
    words they already know). Tertiary strand: phonological awareness
    (kids hear initial sounds + map them to letter symbols).

    Architectural significance: FIRST letter-recognition strand package
    in the catalog. Pre-reading bridge: kids who already know
    object-vocabulary (Arc 1+5+6+8) can use that vocabulary as a
    BRIDGE to letter knowledge. Letter-recognition mediated by
    familiar vocabulary is more effective than abstract letter drill —
    kids have a meaningful anchor for each letter.

    Distinctive composition: 2 alphabet-train exercises (positions 1, 3)
    using imgname mode + 1 matching imgname (position 2) + 1 word-guess
    (position 4) + 1 matching letter mode (position 5). The matching
    letter mode at position 5 is a new app/mode combination — image to
    LETTER directly (rather than image to NAME). FIRST package to use
    matching's letter mode for letter-recognition.

    Cross-strand integration: leverages Arc 1+5+6+8 vocabulary work
    as input. Kids who know "apple" can identify A; kids who know
    "banana" can identify B. The package is a SYNTHESIS surface for
    vocabulary acquired across many prior packages — a natural
    progression from naming to letter-recognition.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Letter-recognition works with any vocabulary-rich theme; substrate-
    readiness universal across vocabulary-rich themes (animals, fruits,
    foods, school-objects, body-parts, clothing).

    K-3 multilingual classroom relevance: letter-recognition is target-
    LANGUAGE-specific (the letter A in en doesn't mean what it means
    in es 'á' for example; phonological values differ across locales).
    The package's en-only authoring + locale-variant sparse-overrides
    pattern handles this — each locale gets its own letter-recognition
    package adapted to its alphabet + phonology. Pt-BR variant could
    address pt-specific letter sounds (cedilha ç, til ã/õ) in Phase 3
    sparse-override.

