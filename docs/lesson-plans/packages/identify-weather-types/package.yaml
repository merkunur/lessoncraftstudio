compositionalRationale:
  en: |
    Primary strand: world-knowledge / environment-and-weather (extended
    weather-type vocabulary). Secondary strand: vocabulary acquisition
    (vocab-anchored). Tertiary strand: observation skills (kids
    develop precision in everyday weather observation).

    Architectural significance: deepens environment-and-weather strand
    1/4 → 2/4. Builds on Arc 8 weather-words foundation + Arc 10
    seasons. Extends vocabulary precision — kids who already know
    'rainy' add 'light-rain', 'storm', 'shower' for more nuanced
    daily-weather descriptions.

    Distinctive composition: matching + bingo + matching + word-guess
    + odd-one-out — multi-app composition spans recognition,
    listening-and-scanning (bingo), recall, exclusion. bingo is
    second appearance of FIRST-introduction at Arc 8 weather-words —
    pedagogical pattern carries forward.

    Cross-strand integration: world-knowledge + extended vocabulary
    + observation skills. Daily-weather-chart routine (from Arc 8)
    benefits directly from extended vocabulary.

    Class B FLEXIBLE substrate: composes against weather theme. Image-
    library has weather diversity supporting extended weather-type
    work.

    K-3 multilingual classroom relevance: extended weather vocabulary
    is mid-frequency K-3 target — varies by climate region (locales
    with diverse climates have richer everyday weather vocabulary;
    locales with stable climates have less). Cross-locale: every K-3
    classroom can extend basic weather to more nuanced types.

