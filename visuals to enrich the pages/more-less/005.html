<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Mehr Weniger - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(170deg, #FAFAFA 0%, #FFF8E1 50%, #FAFAFA 100%); overflow: hidden;">

        <!-- Top accent bar -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #1E88E5, #42A5F5, #FF9800, #FFB74D, #4CAF50, #66BB6A); z-index: 50;"></div>

        <!-- Subtle dot pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image: radial-gradient(circle, #333 1px, transparent 1px); background-size: 24px 24px;"></div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 22px; left: 28px; z-index: 100;">
            <div style="background: linear-gradient(145deg, #FF6B6B, #EF5350); padding: 10px 22px; border-radius: 26px; box-shadow: 0 6px 20px rgba(239,83,80,0.4); border: 3px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 1px;">GRATIS</span>
            </div>
        </div>

        <!-- Vorschule Badge -->
        <div style="position: absolute; top: 22px; right: 28px; z-index: 100;">
            <div style="background: rgba(255,255,255,0.95); padding: 10px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #009688;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: #009688; letter-spacing: 1px;">Vorschule</span>
            </div>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 68px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 56px; color: #37474F; margin: 0; text-shadow: 2px 2px 0 rgba(0,0,0,0.05);">3 Vergleichszeichen!</h1>
        </div>

        <!-- Three Panels -->
        <div style="position: absolute; top: 148px; left: 30px; right: 30px; display: flex; gap: 18px; height: 680px;">

            <!-- Panel 1: Gr&ouml;&szlig;er als (>) -->
            <div style="flex: 1; background: #E3F2FD; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 28px rgba(30,136,229,0.15); display: flex; flex-direction: column; border: 3px solid #BBDEFB;">
                <!-- Header -->
                <div style="background: linear-gradient(145deg, #1E88E5, #1565C0); padding: 16px 0; text-align: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; letter-spacing: 1px;">Gr&ouml;&szlig;er als</span>
                </div>
                <!-- Giant symbol -->
                <div style="text-align: center; padding: 18px 0 10px 0;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 110px; color: #1E88E5; line-height: 1; text-shadow: 3px 3px 0 rgba(30,136,229,0.15);">&gt;</span>
                </div>
                <!-- Description -->
                <div style="text-align: center; padding: 0 14px 14px 14px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #1565C0;">Die gr&ouml;&szlig;ere Gruppe gewinnt!</span>
                </div>
                <!-- Worksheet preview -->
                <div style="flex: 1; padding: 0 16px 18px 16px; display: flex; align-items: flex-end; justify-content: center;">
                    <div style="width: 100%; max-width: 220px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.12); border: 3px solid #90CAF9;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/more%20less/sample-1.jpeg" style="width: 100%; height: 280px; object-fit: cover; object-position: top;" alt="Vergleichsarbeitsblatt">
                    </div>
                </div>
            </div>

            <!-- Panel 2: Kleiner als (<) -->
            <div style="flex: 1; background: #FFF3E0; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 28px rgba(255,152,0,0.15); display: flex; flex-direction: column; border: 3px solid #FFE0B2;">
                <!-- Header -->
                <div style="background: linear-gradient(145deg, #FF9800, #EF6C00); padding: 16px 0; text-align: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; letter-spacing: 1px;">Kleiner als</span>
                </div>
                <!-- Giant symbol -->
                <div style="text-align: center; padding: 18px 0 10px 0;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 110px; color: #FF9800; line-height: 1; text-shadow: 3px 3px 0 rgba(255,152,0,0.15);">&lt;</span>
                </div>
                <!-- Description -->
                <div style="text-align: center; padding: 0 14px 14px 14px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #E65100;">Die kleinere Seite!</span>
                </div>
                <!-- Worksheet preview -->
                <div style="flex: 1; padding: 0 16px 18px 16px; display: flex; align-items: flex-end; justify-content: center;">
                    <div style="width: 100%; max-width: 220px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.12); border: 3px solid #FFCC80;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/more%20less/sample-2.jpeg" style="width: 100%; height: 280px; object-fit: cover; object-position: top;" alt="Vergleichsarbeitsblatt">
                    </div>
                </div>
            </div>

            <!-- Panel 3: Gleich (=) -->
            <div style="flex: 1; background: #E8F5E9; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 28px rgba(76,175,80,0.15); display: flex; flex-direction: column; border: 3px solid #C8E6C9;">
                <!-- Header -->
                <div style="background: linear-gradient(145deg, #4CAF50, #2E7D32); padding: 16px 0; text-align: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; letter-spacing: 1px;">Gleich</span>
                </div>
                <!-- Giant symbol -->
                <div style="text-align: center; padding: 18px 0 10px 0;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 110px; color: #4CAF50; line-height: 1; text-shadow: 3px 3px 0 rgba(76,175,80,0.15);">=</span>
                </div>
                <!-- Description -->
                <div style="text-align: center; padding: 0 14px 14px 14px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #2E7D32;">Beide Gruppen passen!</span>
                </div>
                <!-- Worksheet preview -->
                <div style="flex: 1; padding: 0 16px 18px 16px; display: flex; align-items: flex-end; justify-content: center;">
                    <div style="width: 100%; max-width: 220px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.12); border: 3px solid #A5D6A7;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/more%20less/sample-3.jpeg" style="width: 100%; height: 280px; object-fit: cover; object-position: top;" alt="Vergleichsarbeitsblatt">
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom badges -->
        <div style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px;">
            <div style="background: linear-gradient(145deg, #4CAF50, #388E3C); padding: 12px 24px; border-radius: 28px; box-shadow: 0 5px 18px rgba(76,175,80,0.35); border: 3px solid rgba(255,255,255,0.5);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: white; letter-spacing: 0.5px;">&#10003; L&ouml;sungsbl&auml;tter dabei!</span>
            </div>
            <div style="background: linear-gradient(145deg, #009688, #00796B); padding: 12px 24px; border-radius: 28px; box-shadow: 0 5px 18px rgba(0,150,136,0.35); border: 3px solid rgba(255,255,255,0.5);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: white; letter-spacing: 0.5px;">&#9997; Einfach ausdrucken!</span>
            </div>
        </div>

        <!-- Bottom accent bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #1E88E5, #42A5F5, #FF9800, #FFB74D, #4CAF50, #66BB6A); z-index: 50;"></div>

    </div>
</body>
</html>
