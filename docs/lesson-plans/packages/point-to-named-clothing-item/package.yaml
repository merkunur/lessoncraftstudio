assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify 8 of 10 clothing items by point in 9 of 10 trials.
      - Name 6 of 10 clothing items productively in 7 of 10 trials.
      - Articulate clothing-routine connections ('I wear pants
        today') in 6 of 10 trials.

    Differentiation:
    - Pre-K: 6 most-frequent clothing items; receptive-only.
    - K: 10 clothing items; receptive + productive.
    - Grade 1+: extend to clothing-and-weather work (sweater for
      winter; shorts for summer); bridge to seasonal-clothing
      classification.

