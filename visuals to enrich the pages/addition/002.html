<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Addition Arbeitsbl&auml;tter - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #E3F2FD 0%, #FFF3E0 35%, #FFCC80 60%, #FF8A65 85%, #E64A19 100%); overflow: hidden;">

        <!-- Cloud shapes at top -->
        <div style="position: absolute; top: 30px; left: 60px; width: 120px; height: 45px; background: rgba(255,255,255,0.7); border-radius: 45px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);"></div>
        <div style="position: absolute; top: 18px; left: 100px; width: 80px; height: 35px; background: rgba(255,255,255,0.6); border-radius: 35px;"></div>
        <div style="position: absolute; top: 50px; right: 80px; width: 100px; height: 40px; background: rgba(255,255,255,0.6); border-radius: 40px;"></div>
        <div style="position: absolute; top: 38px; right: 110px; width: 70px; height: 30px; background: rgba(255,255,255,0.5); border-radius: 30px;"></div>

        <!-- Warm number bubbles (decorative) -->
        <div style="position: absolute; top: 200px; left: 30px; width: 38px; height: 38px; background: rgba(255,183,77,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: rgba(230,81,0,0.4);">3</span>
        </div>
        <div style="position: absolute; top: 350px; right: 35px; width: 34px; height: 34px; background: rgba(255,138,101,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: rgba(230,81,0,0.4);">7</span>
        </div>
        <div style="position: absolute; top: 480px; left: 45px; width: 32px; height: 32px; background: rgba(255,204,128,0.35); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; color: rgba(230,81,0,0.4);">+</span>
        </div>
        <div style="position: absolute; bottom: 200px; right: 40px; width: 36px; height: 36px; background: rgba(255,255,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; color: rgba(255,255,255,0.6);">5</span>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 80px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; color: #3E2723; margin: 0; text-shadow: 2px 2px 0 rgba(255,255,255,0.3);">ADDITION</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 40px; color: white; margin: 4px 0 0 0; text-shadow: 2px 2px 6px rgba(0,0,0,0.2);">LERNSTUFEN</h2>
        </div>

        <!-- 3 Ascending Levels -->
        <div style="position: absolute; top: 210px; left: 50%; transform: translateX(-50%); width: 900px; height: 530px;">

            <!-- Level 1: EINSTEIGER (left, lowest) -->
            <div style="position: absolute; left: 20px; bottom: 40px; width: 260px; text-align: center;">
                <!-- Sun icon (1 sun) -->
                <div style="margin-bottom: 10px;">
                    <div style="display: inline-block; width: 36px; height: 36px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 0 16px rgba(253,216,53,0.6);"></div>
                </div>
                <!-- Label -->
                <div style="background: linear-gradient(135deg, #2E7D32, #388E3C); padding: 10px 24px; border-radius: 30px; display: inline-block; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(46,125,50,0.35);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white; letter-spacing: 1px;">EINSTEIGER</span>
                </div>
                <!-- Range -->
                <div style="margin-bottom: 12px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; color: #2E7D32; background: rgba(255,255,255,0.85); padding: 4px 16px; border-radius: 12px;">1 - 5</span>
                </div>
                <!-- Worksheet frame -->
                <div style="width: 180px; height: 233px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,0.18); border: 4px solid #2E7D32; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/addition/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Einsteiger Arbeitsblatt">
                </div>
            </div>

            <!-- Level 2: ENTDECKER (center, middle) -->
            <div style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 100px; width: 260px; text-align: center;">
                <!-- Sun icons (2 suns) -->
                <div style="margin-bottom: 10px; display: flex; gap: 8px; justify-content: center;">
                    <div style="width: 36px; height: 36px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 0 16px rgba(253,216,53,0.6);"></div>
                    <div style="width: 36px; height: 36px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 0 16px rgba(253,216,53,0.6);"></div>
                </div>
                <!-- Label -->
                <div style="background: linear-gradient(135deg, #FF8F00, #F57F17); padding: 10px 24px; border-radius: 30px; display: inline-block; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(255,143,0,0.35);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white; letter-spacing: 1px;">ENTDECKER</span>
                </div>
                <!-- Range -->
                <div style="margin-bottom: 12px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; color: #FF8F00; background: rgba(255,255,255,0.85); padding: 4px 16px; border-radius: 12px;">1 - 10</span>
                </div>
                <!-- Worksheet frame -->
                <div style="width: 190px; height: 246px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 10px 32px rgba(0,0,0,0.2); border: 4px solid #FF8F00; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/addition/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Entdecker Arbeitsblatt">
                </div>
            </div>

            <!-- Level 3: PROFI (right, highest) -->
            <div style="position: absolute; right: 20px; bottom: 160px; width: 260px; text-align: center;">
                <!-- Sun icons (3 suns) + trophy -->
                <div style="margin-bottom: 10px; display: flex; gap: 6px; justify-content: center; align-items: center;">
                    <div style="width: 32px; height: 32px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 0 14px rgba(253,216,53,0.6);"></div>
                    <div style="width: 32px; height: 32px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 0 14px rgba(253,216,53,0.6);"></div>
                    <div style="width: 32px; height: 32px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 0 14px rgba(253,216,53,0.6);"></div>
                    <span style="font-size: 28px; margin-left: 4px;">🏆</span>
                </div>
                <!-- Label -->
                <div style="background: linear-gradient(135deg, #C62828, #B71C1C); padding: 10px 24px; border-radius: 30px; display: inline-block; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(198,40,40,0.35);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white; letter-spacing: 1px;">PROFI</span>
                </div>
                <!-- Range -->
                <div style="margin-bottom: 12px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; color: #C62828; background: rgba(255,255,255,0.85); padding: 4px 16px; border-radius: 12px;">1 - 20</span>
                </div>
                <!-- Worksheet frame -->
                <div style="width: 200px; height: 259px; margin: 0 auto; background: white; border-radius: 10px; box-shadow: 0 12px 36px rgba(0,0,0,0.22); border: 4px solid #C62828; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/addition/sample-5.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Profi Arbeitsblatt">
                </div>
            </div>

            <!-- Connecting ascending arrow line (decorative) -->
            <div style="position: absolute; bottom: 25px; left: 140px; right: 140px; height: 4px; background: linear-gradient(90deg, #2E7D32, #FF8F00, #C62828); border-radius: 2px; opacity: 0.5;"></div>
            <!-- Arrow tip -->
            <div style="position: absolute; bottom: 18px; right: 135px; width: 0; height: 0; border-left: 10px solid #C62828; border-top: 7px solid transparent; border-bottom: 7px solid transparent; opacity: 0.5;"></div>
        </div>

        <!-- Bottom bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(90deg, rgba(62,39,35,0.92), rgba(78,52,46,0.92)); padding: 18px 0;">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; letter-spacing: 3px; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">DIFFERENZIERTES LERNEN F&Uuml;R JEDES KIND</span>
            </div>
        </div>

    </div>
</body>
</html>
