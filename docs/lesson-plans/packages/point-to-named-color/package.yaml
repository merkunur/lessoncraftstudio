# Teaching package — point to a named color (receptive)
# Arc 6 Phase 1 (Path B) — early-literacy / vocabulary-acquisition strand.
# Receptive variant of Arc 2's use-color-words (productive). 10-key cluster
# CLEAN against IMAGE_VOCABULARY (red/blue/yellow/green/orange/purple/pink/
# brown/black/white). Same receptive-pairing pattern as Arc 5 Phase 3 and
# Arc 6 Phase 1 companions.

targetSlug: point-to-named-color
language: en
title:
  en: "Colors (Receptive) — point to the named color"
description:
  en: "Pre-K to K vocabulary-acquisition package teaching receptive recognition of 10 common colors: red, blue, yellow, green, orange, purple, pink, brown, black, white. Receptive variant of use-color-words (Arc 2 productive). Color-recognition is universally early-acquired and provides high-success early-literacy reinforcement. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher places 10 large color-swatches
      or color-flashcards on the carpet or board. Names each color in
      target language; class points to the matching swatch chorally.
      Sensory engagement: kids touch colored objects in the classroom
      (red book, blue marker, yellow notebook) as the teacher names each
      color. Reinforces color-vocabulary + the meta-skill of "recognizing
      this color in the real world." Pin to "Colors" word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with color-flashcards. Teacher names a color
      in target language; class points to the matching color-flashcard.
      Pair work: kid A names a color; kid B finds it on a multi-colored
      object (e.g., a poster with mixed colors) or in the classroom
      environment. Recast errors gently. Optional extension: kids share
      their favorite color ("My favorite color is {item}") — productive
      bridge for confident learners; receptive comprehension still
      sufficient for the rest.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (image-name matching
      reinforces color-swatch to color-word). Station 2: find-and-count
      worksheet (count instances of named color across a busy multi-color
      grid). Station 3: manipulative cut-outs color sorting (kids
      physically place cut-out objects onto color-mats; receptive surface
      since the kid hears the color name and finds the matching mat).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names colors rapidly; kids point
      to classroom objects matching each color. Forward-pointer: "Today
      we practiced understanding color words. When we come back to colors
      next, we'll start saying the color words ourselves and use them
      to describe objects."

