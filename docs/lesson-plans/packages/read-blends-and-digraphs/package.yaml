compositionalRationale:
  en: |
    Primary strand: early-literacy / phonics-decoding (consonant
    blends + digraphs reading). Secondary strand: vocabulary-
    acquisition (anchor words for each blend + digraph).

    Architectural significance: forward-pointer resolution from Arc
    13 read-cvce-words ('next we extend phonics work to consonant
    blends and digraphs'). Builds on Arc 12-13 phonics-decoding
    foundation: read-cvc-words → read-cvce-words → read-blends-
    and-digraphs. Critical bridge from simple CVC reading to more
    complex word reading; enables decoding of 60-70% of Tier-1
    sight-word vocabulary that contains blends/digraphs.

    Distinctive composition: 2 word-guess (cloze decoding) + 2
    matching + 1 word-scramble. Heavy decoding emphasis; distinctly
    word-decoding-focused composition.

    Class B FLEXIBLE substrate: composes against animals + foods
    image-library themes (animals + foods rich in blend/digraph
    words: cat, dog, fish, sheep, chicken, three (count); blue
    blanket, brown bear, black bird).

    K-3 multilingual classroom relevance: blend + digraph PHONICS
    is largely English-specific. Other locales have different
    consonant-cluster systems (es: heavy use of /tr/, /pr/, /cr/;
    de: /sch/, /st/ at word-start; etc.). Locale-variant sparse-
    overrides at Phase 3 will need substantial adaptation per
    locale's phonological inventory; some locales may not need
    this concept (e.g., it primarily teaches digraphs not blends
    in early literacy).

