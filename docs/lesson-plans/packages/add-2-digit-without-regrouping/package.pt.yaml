# Teaching package — somar dois dígitos sem reagrupamento (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT per Arc 7 Phase 3 + Arc 3 Phase 1 sparse-override pattern.
# Arc 17 Phase 1.2 pt-cadence continuation (15th consecutive arc).
# pt sparse-override for math / addition-subtraction strand. Conteúdo matemático
# universal — tradução direta sem reestruturação pedagógica. BR-MEC ensino
# fundamental anos iniciais register per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Somar Dois Dígitos Sem Reagrupamento — adição em colunas onde as unidades não passam de 10"

description:
  pt: "Pacote de matemática para 1º ano que ensina adição de dois dígitos onde a soma das unidades fica abaixo de 10 (problemas como 23+45=68, 60+30=90, 14+25=39, 72+17=89). Constrói sobre Arc 12 add-within-20 + Arco 15 tens-and-ones-1-to-20 / 21-50 / 51-100 como base de valor posicional. Degrau conceitual para Arco 16 add-within-100 (onde o reagrupamento é introduzido) — este pacote isola a mecânica da adição de dois dígitos no caso sem transporte, para que as crianças encontrem adição-em-colunas + adição com consciência-de-valor-posicional SEM ter que gerenciar também a operação de transporte. Quando a rotina de adição-em-colunas fica familiar (alinhe dezenas com dezenas, unidades com unidades, some cada coluna), o reagrupamento se torna um acréscimo a uma rotina existente em vez de um procedimento totalmente novo. Faixa de operandos 10–99; restrição: unidades-de-A + unidades-de-B < 10. Diversidade de estratégias enfatizada: adição-em-colunas, decomposição (23+45 = 20+40 + 3+5 = 60+8 = 68), contar-de-frente, encenação no tapete de valor-posicional. 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana. Companheiro inverso emparelhado: subtract-2-digit-without-regrouping (sem-empréstimo)."

structure:
  warmup:
    body: |
      Iniciador com toda a turma + introdução de adição com
      consciência-de-valor-posicional sem reagrupamento. A
      professora ou o professor exibe 23+45 escrito verticalmente
      com colunas de dezenas-e-unidades claramente marcadas.
      "Hoje vamos somar números MAIORES — dois dígitos mais
      dois dígitos. Vamos somar 23 + 45. Somamos as UNIDADES
      primeiro: 3+5 = 8. Depois as DEZENAS: 2+4 = 6 dezenas =
      60. Mais 8 unidades = 68." Repete com 60+30 (unidades:
      0+0=0; dezenas: 6+3=9 dezenas = 90) e 14+25 (unidades:
      4+5=9; dezenas: 1+2=3 dezenas = 30; total 39). Ênfase
      do padrão: "Alinhe as dezenas. Alinhe as unidades. Some
      cada coluna. Hoje as unidades não se amontoam — sempre
      cabem abaixo de 10." A professora ou o professor faz um
      breve contraste com uma prévia do reagrupamento: "Amanhã
      quando somarmos 27 + 38, as unidades somarão 15 — e
      teremos que REAGRUPAR. Mas hoje, todas as nossas unidades
      ficam comportadas — abaixo de 10."
  contentActivity:
    body: |
      Trabalho em duplas + rotina com manipulativo base-dez.
      Cada dupla recebe kits base-dez (barras-de-dez + unidades-
      avulsas) + uma folha com 6 problemas sem reagrupamento
      (23+45, 60+30, 14+25, 72+17, 31+58, 46+22). Dupla alterna:
      criança A constrói primeiro número com manipulativos
      (coloca dezenas na coluna das dezenas do tapete de valor-
      posicional, unidades na coluna das unidades); criança B
      constrói segundo número embaixo; juntos deslizam as peças
      de cada coluna, contam dezenas e unidades separadamente,
      escrevem resposta. A estrutura em colunas do tapete torna
      o invariante de valor-posicional visível — dezenas nunca
      vão parar na coluna das unidades e vice-versa. Refraseie
      erros com pista-de-coluna ("você tem 6 dezenas e 8
      unidades — isso é sessenta-e-oito, não seis-dezenas-oito").
      Escolhas de estratégia: crianças podem usar manipulativos
      + tapete de valor-posicional, adição-em-colunas escrita,
      decomposição, OU contar-de-frente; a professora ou o
      professor aceita qualquer estratégia que produza resposta
      correta + possa ser explicada.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios de
      adição (formato vertical com operandos sem reagrupamento
      — prática de adição-em-colunas sem a operação de
      transporte). Estação 2: math-worksheet (problemas de
      adição mistos sem reagrupamento). Estação 3: math-puzzle
      (adendo faltante: 23+?=68; ?+45=68 — crianças trabalham
      do total para encontrar o adendo faltante). Estação 4:
      more-less (compare dois resultados de adição: qual soma
      é maior, 23+45 ou 32+34?). Manipulative-cut-outs base-
      dez disponíveis em qualquer estação para crianças que
      queiram apoio concreto. Vocabulário pt-BR canônico para
      adição-de-dois-dígitos-sem-reagrupamento: somar / mais /
      total / soma; coluna das dezenas / coluna das unidades;
      alinhar; valor posicional. Use "somar" + "mais" como
      formas K-3 mais naturais; "alinhar as colunas" + "coluna
      das dezenas" / "coluna das unidades" são os termos K-3
      operacionais canônicos.
  closure:
    body: |
      Quiz de adição-sem-reagrupamento com toda a turma. A
      professora ou o professor apresenta 5 problemas rápidos;
      turma responde coletivamente + nomeia os resultados de
      dezenas e unidades. "23+45? 60+30? 14+25? 72+17? 31+58?"
      Indicador adiante: "Hoje somamos números de dois dígitos
      quando as unidades ficam abaixo de 10. Quando voltarmos,
      conheceremos SOMAR ATÉ 100 — mesma rotina de adição-em-
      colunas, mas agora as unidades às vezes somam 10 ou
      mais e aprenderemos a REAGRUPAR (levar a dezena extra
      adiante). E emparelhado com o trabalho de hoje: SUBTRAIR
      DOIS DÍGITOS SEM EMPRÉSTIMO — mesma estrutura em colunas,
      tirando em vez de somar."

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Calcular adição de dois dígitos sem reagrupamento
        corretamente em 7 de 10 tentativas.
      - Alinhar dezenas-com-dezenas e unidades-com-unidades em
        formato de colunas em 8 de 10 problemas.
      - Usar pelo menos 2 estratégias de adição (e.g., adição-
        em-colunas + decomposição) em 5 de 10 tentativas.
      - Resolver problemas de adendo-faltante dentro da faixa
        sem reagrupamento (23+?=68) em 5 de 10 tentativas.

    Diferenciação:
      - Pré-K (3-5 anos): pular dois dígitos; revisar add-within-10.
      - Educação infantil (5-7 anos): introduzir dois-dígitos +
        unidades (23+5, 60+4) antes de dois-dígitos + dois-
        dígitos; suporte de manipulativo enfatizado.
      - 1º ano: dois-dígitos + dois-dígitos sem reagrupamento
        completo; formato adição-em-colunas praticado;
        transições para somar-até-100 (2º ano) quando o
        reagrupamento for o próximo passo conceitual.
      - 2º ano em diante: reforço breve; o caso sem
        reagrupamento se torna o subconjunto fácil de somar-
        até-100; meta de fluência é adição mental de dois
        dígitos no caso sem transporte.

compositionalRationale:
  pt: |
    Fio principal: matemática / adição-subtração (adição de
    dois dígitos sem reagrupamento — aprofunda fio 9/14 →
    10/14). Fio secundário: matemática / valor-posicional
    (adição-em-colunas torna a estrutura dezenas-e-unidades
    operacionalmente explícita; a restrição sem-reagrupamento
    mantém o invariante de valor-posicional limpo — dezenas
    ficam na coluna das dezenas, unidades ficam na coluna
    das unidades, sem transbordamento). Fio terciário:
    numeracia (adição baseada-em-estratégia: adição-em-
    colunas, decomposição, contar-de-frente, encenação no
    tapete de valor-posicional).

    Significância arquitetural: faz ponte entre a base Arc 12
    add-within-20 → Arc 16 Phase 1.1 add-within-100
    (reagrupamento introduzido lá). Este pacote isola a
    mecânica de adição-em-colunas de dois dígitos no caso
    sem-transporte, para que as crianças encontrem adição
    com consciência-de-valor-posicional + a rotina em
    colunas SEM ter que gerenciar também o reagrupamento.
    Quando a rotina de adição-em-colunas fica familiar, o
    reagrupamento em somar-até-100 se torna um acréscimo a
    uma rotina existente em vez de um procedimento totalmente
    novo. O sequenciamento pedagógico corresponde à progressão
    curricular padrão K-3 (sem-reagrupamento antes do
    reagrupamento introduz o algoritmo em etapas).

    Companheiro inverso emparelhado: subtract-2-digit-without-
    regrouping (mesma fase do arco) — crianças encontram
    subtração-em-colunas no caso sem-empréstimo em paralelo.
    Os dois pacotes compartilham infraestrutura de tapete de
    valor-posicional + manipulativos base-dez + formato
    adição-em-colunas, diferindo apenas na operação. Juntos,
    preparam o terreno para a introdução de reagrupamento/
    empréstimo em add-within-100 + subtract-within-100.

    Especificidade pt-BR: adição-de-dois-dígitos-sem-
    reagrupamento é conceito universal + traduzível 1:1 do
    en. Vocabulário pt-BR canônico:
    - **"somar"** (informal K-3) / **"adicionar"** (técnico
      formal) — K-3 contexto natural usa "somar".
    - **"mais"** — universal pt-BR; usado para sinal + e
      vocabulário comparativo.
    - **"soma"** / **"total"** — termos técnicos para resultado.
    - **"coluna das dezenas"** / **"coluna das unidades"** —
      formas pt-BR canônicas para a estrutura de adição-em-
      colunas; vocabulário operacional K-3.
    - **"alinhar"** — verbo K-3 natural para a ação de pôr
      dezena-sob-dezena, unidade-sob-unidade.

    Sistema de palavras-número pt-BR para 21-99: regular com
    "e" conector ("vinte e três, sessenta e oito, setenta e
    dois"); o conector "e" é load-bearing — sem ele a palavra-
    número soa errada. A pronúncia das dezenas é regular
    ("vinte, trinta, quarenta, cinquenta, sessenta, setenta,
    oitenta, noventa"). A restrição sem-reagrupamento mantém
    o foco do trabalho transcultural na fluência das
    palavras-número sem introduzir simultaneamente vocabulário
    de transporte (que entra em somar-até-100).

    Currículo BNCC EF01MA08 (1º ano) + EF02MA05 (2º ano):
    cálculo de adição com números de até duas ordens; uso de
    estratégias pessoais; algoritmo + composição/decomposição.

    Substrato Class B FLEXIBLE: composta contra tema animals
    (contável para trabalho de adição; cross-arc com Arc 12-
    16 addition/subtraction themes para consistência; pair-
    coherence com subtract-2-digit-without-regrouping que
    usa o mesmo tema).
