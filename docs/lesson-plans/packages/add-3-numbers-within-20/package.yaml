compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (add
    three numbers with sum within 20 — STRAND-SAT-
    CLOSING 13/14 → 14/14 SAT). **19th parent-class
    strand SATISFIED in the catalog** (advances
    aggregate strand-saturation 18/30 → 19/30 =
    63.3%). Final canonical target per learning-
    targets.json addition-subtraction strand
    enumeration (14 targets total at lines 221-234;
    add-3-numbers-within-20 at line 232 closes the
    strand). Secondary strand: numeracy (strategy-
    flexibility + commutative/associative property
    awareness + make-10 strategy + count-on / find-
    doubles / decomposition strategy work). Tertiary
    strand: cognitive-and-executive-function /
    pattern-recognition (kids recognize number-
    pairs that make 10 + flexibly apply strategies
    based on problem-pair recognition).

    Architectural significance: SAT-CLOSES the math
    / addition-subtraction strand at 14/14. Per
    learning-targets.json the strand has 14
    canonical targets; Phase 1.3 Slot 3 add-2-digit-
    numbers advanced 11/14 → 12/14; Phase 1.4 Slot
    3 subtract-2-digit-numbers advanced 12/14 →
    13/14; this Phase 1.5 Slot 2 package closes
    the strand at 14/14 SAT. **19th parent-class
    strand SATISFIED**. Arc 18 ships 2 parent-
    class strand SAT closures total (materials-
    and-properties at Phase 1.4 Slot 1 + addition-
    subtraction at Phase 1.5 Slot 2) — saturation-
    arc shape per §A.13.36 commission-shape
    flexibility (distinct from Arc 17 P1.5's
    foundation strand-start framing).

    Pair-coherent with Phase 1.3 Slot 3 add-2-
    digit-numbers + Phase 1.4 Slot 3 subtract-2-
    digit-numbers (numeracy cluster). Together
    these 3 packages form the Grade 1-2 numeracy
    canonical cluster: add-2-digit-numbers (2-
    digit + 2-digit with regrouping) + subtract-
    2-digit-numbers (2-digit - 2-digit with
    borrowing) + add-3-numbers-within-20 (Grade 1
    strategy-flexible 3-addend addition closing
    the strand). The pedagogy progresses from 2-
    digit column work (Phase 1.3 + Phase 1.4) to
    strategy-flexibility within-20 work (this
    package) — covering both place-value-grounded
    AND strategy-flexible numeracy work.

    Per §A.13.30 K-3 informal framing: Grade 1
    3-addend addition is STRATEGY-AWARE FLUENCY.
    Kids understand that addition is FLEXIBLE
    (can add in any order; same answer) and that
    some orderings are EASIER (make-10 pair
    first → easier counting). Kids learn the
    make-10 strategy as a concrete pattern-
    recognition skill (recognize 4+6, 3+7, 2+8,
    1+9, 5+5 as 'make-10 pairs'). Formal
    property-naming pedagogy (commutative /
    associative property formal terms) is Grade
    2+ vocabulary; this package uses 'you can
    add in any order' / 'make-10 first' as K-1-
    accessible language. The strategy-flexibility
    is the cognitive load-bearing skill — kids
    who can choose pair-ordering wisely show
    addition fluency that supports future
    multiplication work (multiplication = repeated
    addition; strategic pair-choosing in 3-addend
    work scaffolds the conceptual progression).

    Cross-reference to Phase 1.3 Slot 3 add-2-
    digit-numbers + Phase 1.4 Slot 3 subtract-2-
    digit-numbers (pair-coherent precedents): those
    packages established the structural-place-
    value column work with regrouping/borrowing.
    This package DIVERGES from the 2-digit cluster
    on TWO dimensions (intentional pedagogical
    fit):
    - Position 3 (matching-mat vs place-value-mat):
      add-3-numbers-within-20 is within-20 single-
      digit work, NOT 2-digit column work. Place-
      value column structure is NOT load-bearing
      for within-20 3-addend work; matching-mat
      (expression-to-sum pairing for 3-addend
      patterns) is the right pedagogical fit.
      **Lock: matching-mat at position 3**. Does
      NOT inherit the place-value-mat (C) DEFER
      carry-forward from the 2-digit cluster
      (different pedagogical surface; place-value-
      mat generator gap stays at 4 packages —
      add-within-100 + subtract-within-100 + add-
      2-digit-numbers + subtract-2-digit-numbers
      — NOT 5).
    - Position 5 (themeName: animals vs base-ten
      vocabKeys): add-3-numbers-within-20 pedagogy
      uses discrete counting tokens (a+b+c kids
      physically place a animal-tokens + b animal-
      tokens + c animal-tokens; count total to
      check sum). Base-ten vocabKeys (ten-stick +
      ones-counter) are NOT relevant for within-
      20 single-digit work. **Lock: themeName:
      animals + mode: single-repeat + itemCount
      20**. Does NOT inherit the base-ten
      vocabKey substrate gap from the 2-digit
      cluster (different pedagogical surface; the
      base-ten substrate gap stays at 2 packages
      — add-2-digit-numbers + subtract-2-digit-
      numbers).

    Distinctive composition: 1 addition (horizontal-
    addition format with addendCount 3) + 2 math-
    worksheet (3-addend horizontal practice) + 1
    math-puzzle (missing-addend in 3-addend
    equation: a + ? + c = sum) + 1 more-less
    (compare two 3-addend addition results).
    Composition shape mirrors add-2-digit-numbers
    + subtract-2-digit-numbers 5-exercise numeracy
    shape with addendCount: 3 parameter substituted
    for the 3-addend specificity. The addendCount
    parameter (or equivalent app-level configuration)
    triggers the 3-addend mode in addition + math-
    worksheet + math-puzzle apps.

    Materials note: 7-material Numeracy class stack
    per §A.13.37. **Pair-coherent with Phase 1.3
    Slot 3 add-2-digit-numbers + Phase 1.4 Slot 3
    subtract-2-digit-numbers on 5 of 7 dimensions
    (flashcards + picture-cards + vocabulary-
    tracing-strips + parent-take-home-letter +
    answer-key)** with 2 intentional divergences
    (matching-mat at position 3 vs place-value-
    mat; themeName: animals at position 5 vs
    base-ten vocabKeys; see Cross-reference
    above). Matching-mat at position 3 is the
    LOAD-BEARING material for 3-addend pedagogy —
    it surfaces the expression-to-sum pattern
    that lets kids practice strategy-recognition
    (matching 4+6+5 to 15 reinforces both add-
    fact fluency AND the make-10 pair pattern).
    Vocabulary-tracing-strips at position 4
    traces 3-addend vocabulary ('plus', 'sum',
    'three numbers', 'make-10', 'strategy',
    'addend'). Manipulative-cut-outs at position
    5 emits canonical-correct `mode: single-
    repeat` per §A.13.35 with theme: animals at
    itemCount 20 (enough discrete tokens for kids
    to physically model a+b+c with sum ≤ 20).

    **NO SUBSTRATE CARRY-FORWARD from this
    package**: matching-mat is a shipped generator
    (no DEFER); animals theme + manipulative-cut-
    outs single-repeat are canonical substrate; no
    new vocabKeys introduced (animals theme images
    are pre-existing). The substrate carry-forward
    queue stays at 3 cumulative (currency + base-
    ten + materials-and-properties) — this Phase
    1.5 Slot 2 package does NOT add to it.

    Class B FLEXIBLE substrate: composes against
    animals theme (countable for addition work;
    cross-arc with Arc 12-16+18 addition themes
    for consistency + cross-package coherence
    with add-2-digit-numbers + subtract-2-digit-
    numbers which used animals theme). The
    animals theme is decorative for Grade 1
    3-addend work — the COMPUTATIONAL skill is
    abstract numerical; the theme provides
    visual interest + vocabulary anchor for the
    flashcards + picture-cards + matching-mat.

    K-3 multilingual classroom relevance: 3-addend
    addition within 20 is universal Grade 1
    content. The PROCEDURE (find pairs, add
    flexibly, use make-10 strategy) is locale-
    portable; the SPOKEN number-word naming
    varies (same considerations as add-2-digit-
    numbers per Phase 1.3 Slot 3; the within-20
    range has FEWER cross-locale irregularities
    than 2-digit work because within-20 numbers
    are mostly counting-foundation vocabulary).
    Cross-locale strategy vocabulary varies: en
    'make-10 / pair / strategy / addend'; de
    'Zehnerübergang / Paar / Strategie /
    Summand'; es 'formar-10 / par / estrategia /
    sumando'; pt 'fazer-10 / par / estratégia /
    parcela'; fr 'compléter-à-10 / paire /
    stratégie / addend'; nordic locales use
    parallel constructions. Locale-variant work
    at Phase 3+ adapts to each locale's
    arithmetic-strategy vocabulary register.

