description:
  en: "K-3 bundle centered on reptiles and amphibians as biological-classification + biodiversity anchor. 10th animal-cluster bundle extending substantial-coverage (animals + farm-animals + pets + birds + insects + ocean-life + forest-creatures + dinosaurs + zoo-animals + reptiles-and-amphibians). 5 packages span vocabulary-acquisition (identify-and-name-10-zoo-animals — extended subset focused on reptiles + amphibians: snake, lizard, turtle, alligator, crocodile, frog, toad, salamander, gecko, iguana) + biological-classification (identify-living-vs-nonliving — all 10 are living + distinguish from rocks/logs/water in their habitats) + numeracy (count-objects-1-to-10 — counting reptiles + amphibians in habitat scenes) + cognitive-sorting (sort-by-category — reptiles vs amphibians; or by habitat: water vs land; or by skin-type: scaly vs smooth) + comparison (use-size-comparison-words — big alligator vs small gecko; long snake vs short turtle). Cross-strand animal-cluster bundle distinguished by reptile-vs-amphibian biological-classification work — introduces K-3 to fundamental cold-blooded-vertebrate classification distinct from mammals/birds/insects. Suitable for a 4-5 week classroom unit; supports K-3 multilingual classrooms with biology + cross-cultural-creature-mythology (dragons + serpents across cultures) extensions."

