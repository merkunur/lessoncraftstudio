compositionalRationale:
  en: |
    Primary strand: counting (target count-on-from-given-number; learning-targets.json
    places this in early-numeracy / counting-and-cardinality strand).
    Secondary strand: addition prep (image-number addition exercise at
    position 2 lets kids practice "I have 6, count on 4 more — that's 10" —
    which IS addition with count-on as the strategy).
    Tertiary strand: pattern recognition (pattern-train at position 3 trains
    sequential-number patterns adjacent to count-on).

    Distinctive material weighting: numeral-cards 1-20 (full count-on range
    target). matching-mat lets kids pair a numeral with an image-count for
    cross-representation transfer. addition app composed in 2 modes
    (image-number for practice, mixed for assessment) — image-number is the
    natural surface for "what number do you land on after counting on?".

curriculumStandards:
  - CCSS.K.CC.A.2
  - CCSS.K.OA.A.1
  - EYFS.ELG.M

assessmentCriteria:
  en: |
    By end of 1-2 week unit:
      - Count on by 1-3 from any starting number 1-20 in 8 of 10 trials.
      - Count on by 4-5 from any starting number 1-15 in 6 of 10 trials.
      - Use count-on strategy spontaneously to solve image-number addition
        problems (no longer restarts from 1).

    Differentiation:
    - Pre-K: count on by 1 only.
    - K: full range count on by 1-5 from start 1-15.
    - Grade 1+: extend to add-within-10 + add-within-20 (count-on becomes
      the dominant addition strategy through Grade 1).

