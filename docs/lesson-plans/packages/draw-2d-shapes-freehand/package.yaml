assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Draw 6 shapes freehand with recognizable form in 8 of 10
        trials.
      - Maintain reasonable proportions (square ≈ equal sides;
        rectangle ≈ longer-than-wide) in 6 of 10 freehand drawings.
      - Name + draw a requested shape on demand in 7 of 10 trials.

    Differentiation:
    - Pre-K: 3-shape scope (circle, square, triangle); accept
      approximate forms; provide tracing-fallback as needed.
    - K: 6-shape scope (add rectangle, oval, diamond); freehand
      drawing required.
    - Grade 1+: extend to combined-shape compositions (house = sq
      + tri; sun = circle + radial lines) + bridge to label-with-
      noun-phrase work where kids label their drawings.

