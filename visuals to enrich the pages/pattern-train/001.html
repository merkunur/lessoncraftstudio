<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Pattern Train - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #FFF8E1 0%, #FFCC80 100%); overflow: hidden;">

        <!-- Railroad track pattern at bottom -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: #8D6E63;">
            <div style="position: absolute; top: 15px; left: 0; right: 0; height: 10px; background: repeating-linear-gradient(90deg, #5D4037 0px, #5D4037 60px, #8D6E63 60px, #8D6E63 80px);"></div>
            <div style="position: absolute; top: 40px; left: 0; right: 0; height: 6px; background: #4E342E;"></div>
            <div style="position: absolute; top: 55px; left: 0; right: 0; height: 6px; background: #4E342E;"></div>
            <!-- Railroad ties -->
            <div style="position: absolute; top: 30px; left: 0; right: 0; height: 40px; background: repeating-linear-gradient(90deg, #3E2723 0px, #3E2723 18px, transparent 18px, transparent 50px);"></div>
        </div>

        <!-- Decorative steam puffs -->
        <div style="position: absolute; top: 380px; left: 20px; width: 100px; height: 100px; background: rgba(255,255,255,0.8); border-radius: 50%; filter: blur(12px);"></div>
        <div style="position: absolute; top: 340px; left: 80px; width: 70px; height: 70px; background: rgba(255,255,255,0.6); border-radius: 50%; filter: blur(10px);"></div>
        <div style="position: absolute; top: 300px; left: 50px; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; filter: blur(8px);"></div>
        <div style="position: absolute; top: 260px; left: 100px; width: 40px; height: 40px; background: rgba(255,255,255,0.4); border-radius: 50%; filter: blur(6px);"></div>

        <!-- Decorative locomotive on left -->
        <div style="position: absolute; left: -20px; top: 450px; width: 220px; height: 180px;">
            <!-- Train body -->
            <div style="position: absolute; bottom: 30px; left: 30px; width: 160px; height: 100px; background: linear-gradient(180deg, #F7941D 0%, #E67E00 100%); border-radius: 15px 50px 10px 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.3);">
                <!-- Window -->
                <div style="position: absolute; top: 15px; right: 20px; width: 45px; height: 35px; background: #87CEEB; border-radius: 8px; border: 4px solid #FFD200;"></div>
                <!-- Train front -->
                <div style="position: absolute; top: 20px; left: -15px; width: 30px; height: 60px; background: linear-gradient(180deg, #E74C3C 0%, #C0392B 100%); border-radius: 15px 0 0 15px;"></div>
            </div>
            <!-- Chimney -->
            <div style="position: absolute; bottom: 130px; left: 50px; width: 30px; height: 50px; background: linear-gradient(180deg, #333 0%, #555 100%); border-radius: 5px 5px 0 0;"></div>
            <div style="position: absolute; bottom: 175px; left: 43px; width: 44px; height: 15px; background: #444; border-radius: 5px;"></div>
            <!-- Wheels -->
            <div style="position: absolute; bottom: 10px; left: 50px; width: 50px; height: 50px; background: radial-gradient(circle, #666 40%, #333 60%, #666 80%); border-radius: 50%; border: 5px solid #444;"></div>
            <div style="position: absolute; bottom: 10px; left: 130px; width: 50px; height: 50px; background: radial-gradient(circle, #666 40%, #333 60%, #666 80%); border-radius: 50%; border: 5px solid #444;"></div>
        </div>

        <!-- FREE Badge - Train Ticket Style -->
        <div style="position: absolute; top: 30px; left: 30px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #F7941D 0%, #E67E00 100%); padding: 14px 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(247,148,29,0.4); transform: rotate(-5deg); position: relative;">
                <!-- Ticket punch holes -->
                <div style="position: absolute; left: -10px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; background: #FFF8E1; border-radius: 50%;"></div>
                <div style="position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; background: #FFF8E1; border-radius: 50%;"></div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); letter-spacing: 3px;">FREE</div>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 40px; right: 40px; background: #26A69A; padding: 12px 24px; border-radius: 30px; box-shadow: 0 4px 15px rgba(38,166,154,0.4);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 20px; color: white;">GRADES PreK-K</span>
        </div>

        <!-- Main Title Area -->
        <div style="position: absolute; top: 110px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 68px; color: #1A237E; margin: 0; text-shadow: 3px 3px 0 rgba(255,255,255,0.9); letter-spacing: -1px;">Pattern Train</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 42px; color: #F7941D; margin: 8px 0 0 0; text-shadow: 2px 2px 0 rgba(255,255,255,0.8);">Worksheets</h2>
        </div>

        <!-- Worksheet Stack Display - NO ROTATION on images -->
        <div style="position: absolute; top: 260px; left: 50%; transform: translateX(-50%); width: 700px; height: 420px;">
            <!-- Back worksheet (offset left) -->
            <div style="position: absolute; left: 40px; top: 50px; box-shadow: 0 8px 30px rgba(0,0,0,0.2);">
                <img src="https://www.lessoncraftstudio.com/samples/english/pattern%20train/sample-3.jpeg" style="width: 220px; height: auto; border-radius: 8px; border: 4px solid white;">
            </div>

            <!-- Back worksheet (offset right) -->
            <div style="position: absolute; right: 40px; top: 50px; box-shadow: 0 8px 30px rgba(0,0,0,0.2);">
                <img src="https://www.lessoncraftstudio.com/samples/english/pattern%20train/sample-5.jpeg" style="width: 220px; height: auto; border-radius: 8px; border: 4px solid white;">
            </div>

            <!-- Front worksheet (center, larger) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); box-shadow: 0 12px 45px rgba(0,0,0,0.25); z-index: 10;">
                <img src="https://www.lessoncraftstudio.com/samples/english/pattern%20train/sample-1.jpeg" style="width: 280px; height: auto; border-radius: 10px; border: 5px solid white;">
            </div>
        </div>

        <!-- Orange Banner -->
        <div style="position: absolute; bottom: 120px; left: 0; right: 0; background: linear-gradient(90deg, #E65100 0%, #F7941D 50%, #E65100 100%); padding: 16px 0; box-shadow: 0 4px 20px rgba(230,81,0,0.4);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); letter-spacing: 2px;">All Aboard the Pattern Express!</span>
            </div>
        </div>

        <!-- Feature Badges -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px;">
            <div style="background: white; padding: 12px 24px; border-radius: 25px; box-shadow: 0 3px 15px rgba(0,0,0,0.15); border: 3px solid #26A69A;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #26A69A;">Answer Keys</span>
            </div>
            <div style="background: white; padding: 12px 24px; border-radius: 25px; box-shadow: 0 3px 15px rgba(0,0,0,0.15); border: 3px solid #F7941D;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #F7941D;">Cut & Paste</span>
            </div>
            <div style="background: white; padding: 12px 24px; border-radius: 25px; box-shadow: 0 3px 15px rgba(0,0,0,0.15); border: 3px solid #E74C3C;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #E74C3C;">Print Ready</span>
            </div>
        </div>

    </div>
</body>
</html>
