description:
  en: "K-3 bundle centered on space as STEM-cluster anchor for cross-strand exploration. 1st STEM-cluster bundle on the platform — opens science cluster alongside the existing environment + biological clusters. 5 packages span numeracy (count-objects-1-to-10 — counting planets, stars, ships, astronauts in space imagery) + science-cognition (describe-day-night-cycle — Earth-Sun-Moon orbital relationship; day/night caused by Earth rotation) + cognitive-sorting (sort-by-color — colored planets: red Mars, blue Earth, yellow Sun + sort-by-category — planets vs stars vs spacecraft vs astronauts) + comparison (use-size-comparison-words — Sun bigger than planets; planets bigger than moons; spacecraft smaller than planets). Exploration-first pedagogy (vs vocab-first) — K-3 space-content engagement typically leads with wonder + observation rather than formal vocabulary acquisition. Suitable for a 4-5 week classroom unit; supports K-3 multilingual classrooms with science-imagination + cross-cultural-space-celebration (lunar-new-year + summer-solstice + space-mission-news) extensions."

