compositionalRationale:
  en: |
    Primary strand: language-and-communication / reading-
    comprehension (answer who/what/where questions —
    advances strand 5/10 → 6/10). Secondary strand:
    vocabulary-acquisition (question-word vocabulary:
    who, what, where, when, why, how — though Phase 1.3
    covers only the foundational triad who/what/where).
    Tertiary strand: speaking-and-listening (the
    productive-language work of articulating answers in
    full-sentence responses).

    Architectural significance: continues reading-
    comprehension strand expansion. Per learning-targets.
    json the strand has 10 canonical targets; current
    state at Arc 18 P1.3 commencement is 5 authored
    (match-sentence-to-picture + predict-from-picture-cue
    + sequence-3-event-story + identify-main-character +
    identify-setting); answer-who-what-where-questions
    is the sixth, bringing the strand to 6/10. Per
    learning-targets.json prerequisite: match-sentence-to-
    picture is the prerequisite — kids must be able to
    connect a sentence to a picture before they can
    extract specific elements (WHO/WHAT/WHERE) from that
    sentence-and-picture-paired material.

    Pair-coherent ship pattern with infer-character-
    feeling-from-picture-cue (Slot 2 of Phase 1.3). The
    two packages together extend the existing K-level
    character+setting work (Arc 17 P1.5 identify-main-
    character + Arc 18 P1.2 identify-setting) into a
    full K→Grade-1 character-knowledge cluster:
    - identify-main-character (K, Arc 17 P1.5): WHO
      extraction at the character-as-protagonist level
    - identify-setting (K, Arc 18 P1.2): WHERE extraction
      at the place-as-context level
    - answer-who-what-where-questions (K, THIS PACKAGE):
      WHO + WHAT + WHERE extraction at the
      receptive-comprehension level — generalizes the
      element-extraction skill across all three question
      types
    - infer-character-feeling-from-picture-cue (Grade 1,
      Slot 2): extends the WHO axis to character-emotion
      inference; the K→Grade-1 jump
    Together this 4-package cluster covers the
    foundational K narrative-element extraction
    (character + setting + action) plus the Grade 1
    inferential extension (character feelings).

    Reading-comprehension strand future (Phase 1.4+
    candidates per learning-targets.json residual):
    identify-problem-and-solution (forward-pointer from
    identify-setting closing rationale), distinguish-
    fiction-from-nonfiction, read-and-follow-2-sentence-
    instruction. Phase 1.4+ closes the strand at 8-10/10.

    Per §A.13.30 K-1-informal framing: K work is
    question-answering in TEACHER-LED READ-ALOUD or
    PICTURE-SUPPORTED text. Kids do NOT need to be
    independent readers to answer WHO/WHAT/WHERE — they
    can identify the elements from picture cues + teacher
    reading aloud + question-word matching. The K
    identifier signals are deliberately simple:
    - WHO answers identify a PERSON or ANIMAL in the
      picture
    - WHAT answers identify an ACTION (verb) or OBJECT
      (noun) in the picture
    - WHERE answers identify a PLACE (location) shown in
      the picture or named in the text
    These signals make question-answering accessible at K
    ages without requiring formal literary-analysis
    vocabulary or independent decoding fluency. Grade 2+
    work extends to WHEN questions (time-of-story), WHY
    questions (causation), HOW questions (process) — all
    beyond K scope here.

    Cross-reference to match-sentence-to-picture
    (prerequisite): that package established sentence-
    to-picture connection (kids read a sentence + match
    it to the image it describes). This package extends
    that connection by surfacing the FOUR sub-elements
    of a sentence-picture pair: WHO + WHAT + WHERE +
    WHEN (we focus on WHO/WHAT/WHERE; WHEN is Grade 1+
    extension). The sentence-to-picture skill grounds
    the question-answering skill.

    Distinctive composition: 3 matching exercises
    (canonical reading-comp pattern — match scene-card
    to element-card across multiple practice slots) +
    1 picture-sort (categorize answers by question-type:
    WHO answers vs WHAT answers vs WHERE answers) + 1
    missing-pieces (complete a partial scene — surfaces
    which element is missing and which question-type
    that completes). Composition shape mirrors identify-
    setting + identify-main-character precedents exactly
    (3 matching + 1 picture-sort + 1 missing-pieces) —
    the canonical K-level reading-comp app pattern.

    Materials note: 8-material Literacy class stack per
    §A.13.37. Sentence-strips at position 4 with
    framePreset 'this-is-a' (element-anchor frames:
    "This is the WHO. This is the WHAT. This is the
    WHERE.") is the load-bearing material — the literal
    element-vocabulary substrate kids work with.
    Vocabulary-tracing-strips at position 5 traces
    question-word vocabulary ('who', 'what', 'where',
    'when'). The combination surfaces both the
    receptive-comprehension work (extract elements from
    pictures) AND the productive-language work (use
    question-words in their own retellings).

    Class B FLEXIBLE substrate: composes against
    miscellaneous theme (scenes span home / school /
    park / family / animals / activities — no single
    semantic theme captures the breadth of possible
    scene contexts; miscellaneous is the appropriate
    abstract theme choice). The picture-sort exercise
    uses animals + vehicles theme contrast (a who-vs-
    what proxy — animals are typical WHO answers,
    vehicles are typical WHAT/WHERE answers).

    K-3 multilingual classroom relevance: question-word
    extraction is universal K-3 comprehension content.
    The three-question-word framework is locale-portable;
    only the vocabulary varies. Cross-locale question-
    word triad: en 'who/what/where'; de 'wer/was/wo';
    es 'quién/qué/dónde'; pt 'quem/o que/onde'; fr 'qui/
    quoi/où'; it 'chi/cosa/dove'; nl 'wie/wat/waar'; fi
    'kuka/mitä/missä'; sv 'vem/vad/var'; da 'hvem/hvad/
    hvor'; no 'hvem/hva/hvor'. The question-word
    structural pattern is remarkably stable across
    European languages — each locale has a clean three-
    word triad for the K-level WHO/WHAT/WHERE
    extraction. Locale-variant work at Phase 3+ adapts
    to each locale's question-word register +
    locally-appropriate scene illustrations with
    culturally-familiar characters and settings.

