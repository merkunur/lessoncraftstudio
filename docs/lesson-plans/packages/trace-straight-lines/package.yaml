# Teaching package — trace straight lines (horizontal, vertical, diagonal)
# Arc 10 Phase 1 (Path B; fine-motor-and-visual-spatial / drawing-and-
# tracing strand FIRST package). Class B FLEXIBLE; vocab-anchored.
# Foundational fine-motor skill: kids trace straight lines as building
# block for later letter formation + shape construction.

targetSlug: trace-straight-lines
language: en
title:
  en: "Tracing Straight Lines — horizontal, vertical, and diagonal"
description:
  en: "Preschool / Kindergarten fine-motor-and-visual-spatial package teaching straight-line tracing. FIRST drawing-and-tracing strand package in the catalog. Foundational fine-motor skill: kids practice horizontal, vertical, and diagonal straight-line tracing as building blocks for later letter formation (uppercase letters use straight lines: A, E, F, H, I, K, L, M, N, T, V, W, X, Y, Z) + shape construction. Develops pencil control + visual-motor coordination + line-following accuracy. Composes against alphabet-train + matching apps for vocab support; vocabulary-tracing-strips material is the load-bearing tracing surface. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class large-motor-to-fine-motor routine. Teacher leads
      class in tracing straight lines IN THE AIR with arms — first
      vertical (up-down), then horizontal (side-to-side), then
      diagonal (corner-to-corner). Class follows. "Now we'll trace
      the same lines on paper." Reinforces line-direction
      kinesthetically before pencil work begins.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + tracing routine. Each kid receives a tracing strip
      with horizontal, vertical, and diagonal dotted lines + a thick
      crayon or pencil. Kid traces each line slowly, trying to stay
      ON the dots. Partner verifies. Recast errors with explanation
      ("you're going off the line — let's slow down. Trace from the
      START dot to the END dot, staying on the dotted path"). Optional
      extension: kids progress from dotted-line tracing to outline-
      tracing (lighter guidance) to free-hand drawing of straight
      lines (no guidance).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: vocabulary-tracing-strips (kids
      trace dotted-line letters of vocab words; reinforces straight-
      line tracing within letter context). Station 2: alphabet-train
      worksheet (kids identify letters; reinforces letter-shape
      awareness that tracing supports). Station 3: manipulative cut-
      outs hands-on line-construction (kids assemble paper-cut straight
      lines into shapes — square = 4 lines; triangle = 3 lines).
      Station 4: matching worksheet (image-name pairs reinforce vocab
      base).
  closure:
    durationMinutes: 5
    body: |
      Whole-class progress-display. Kids share their tracing work +
      describe which line direction was hardest (most kids report
      diagonal). Teacher affirms: "Diagonal lines are hardest because
      our hand has to move in two directions at once." Forward-pointer:
      "Today we traced straight lines. When we come back to tracing
      next, we'll trace CURVED lines — the building blocks for letters
      like O, C, G, U, S, J."

