# Teaching package — spell high-frequency sight words tier 1 (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 13 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# pt sparse-override for early-literacy / spelling-and-encoding strand.
# pt-BR sight-word inventory radically different from en — pt has gendered
# articles (o/a) + frequent prepositions (de/em/com) + verb-de-ligação (é).
# BR-MEC educação infantil register per CLAUDE.md §6 + formal "você"
# address per §17.9.

title:
  pt: "Palavrinhas — escreva as palavras mais usadas"
description:
  pt: "Pacote de letramento inicial para a educação infantil / 1º ano que ensina escrita de palavras-de-alta-frequência (palavrinhas) pt-BR. Constrói sobre o trabalho de letras-sons + escrita-do-próprio-nome dos Arcos 9-12 + spell-cvc-words do Arco 12. RESOLVE o indicador adiante do Arco 12 spell-cvc-words. As crianças escrevem as 10 palavrinhas mais frequentes em pt-BR (o, a, e, em, de, que, é, um, uma, com). Bridging skill: palavras de alta frequência aparecem em quase todas as frases pt-BR; automatização libera carga cognitiva para decoding-de-palavras-novas. Especificidade pt-BR: lista de palavrinhas pt-BR difere RADICALMENTE da lista en — pt tem artigos gendrados (o/a), preposições essenciais (de, em, com), verbo-de-ligação (é). 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Rotina de palavrinha-do-dia com toda a turma. A professora ou o
      professor exibe uma palavrinha pt-BR (a primeira: 'o'). Diz:
      "Esta palavrinha é 'o'. É o ARTIGO MASCULINO singular. Diz: o
      gato. o livro. o cachorro. Vamos escrever: O." Turma escreve
      em quadro-branco-pessoal. Repita com 'a' (artigo feminino: a
      mãe, a casa, a flor) + 'e' (conjunção: gato e cachorro; mãe
      e pai). Reforça palavrinha-como-palavra-mais-frequente +
      memorização-por-vista (não decodificação-fonética).
      Especificidade pt-BR: enfatize que 'o' + 'a' são artigos
      gendrados — característica fundamental do pt-BR ausente em
      en.
  contentActivity:
    body: |
      Trabalho em duplas + rotina de escreva-e-verifique. Cada dupla
      recebe 6 cartas com palavrinhas pt-BR (o, a, e, em, de, com).
      A criança A diz uma palavrinha em voz alta; a criança B
      escreve. Refraseie os erros com explicação ("você escreveu 'em'
      mas escreveu E-N — vamos olhar de novo: 'em' termina com M, não
      N. E-M. Escreva de novo: E-M"). Especificidade pt-BR: ênfase
      em palavrinhas pt-BR-específicas — 'é' (verbo-de-ligação com
      acento agudo: o gato É preto), 'um' + 'uma' (artigos
      indefinidos gendrados: um livro / uma flor), 'com' + 'em' +
      'de' (preposições essenciais).
  scaffold:
    body: |
      Rotação de estações. Estação 1: vocabulary-tracing-strips com
      palavrinhas pt-BR (as crianças traçam o, a, e, em, de, que, é,
      um, uma, com). Estação 2: folha de exercícios de
      emparelhamento (palavrinha-para-frase-canônica: 'o' →
      'O cachorro late'; 'a' → 'A bola é vermelha'; 'é' → 'O sol é
      amarelo'). Estação 3: word-guess (as crianças preenchem letras
      de palavrinhas pt-BR). Estação 4: recortes manipulativos
      prático monte-frase (as crianças montam frases simples a partir
      de recortes de palavrinhas + palavras-conteúdo).
  closure:
    body: |
      Rotina de palavrinha-quiz com toda a turma. A professora ou o
      professor exibe uma frase-com-palavrinhas (ex: 'O gato é
      bonito'); a turma identifica + escreve as palavrinhas (O + é).
      Indicador adiante: "Hoje aprendemos as primeiras 10
      palavrinhas pt-BR. Quando voltarmos à escrita na próxima vez,
      aprenderemos o segundo nível de palavrinhas — 'do', 'da',
      'no', 'na', 'mas', 'também', 'aqui', 'lá', 'meu', 'minha'
      — palavras de uso diário que vão aparecer em quase tudo que
      lemos."

assessmentCriteria:
  pt: |
    Escrever 8 de 10 palavrinhas pt-BR-tier-1 corretamente em 7 de
    10 tentativas. Reconhecer palavrinhas em frase em 8 de 10
    tentativas. Construir frase simples usando 3+ palavrinhas (ex:
    'O gato é bonito' = 'O' + 'é' + outras 4 palavras de conteúdo)
    em 6 de 10 tentativas.

    Diferenciação:
      - Pré-K (3-5 anos): 4 palavrinhas mais frequentes (o, a, e, é);
        traço-com-suporte; reconhecimento receptivo.
      - Educação infantil (5-7 anos): todas 10 palavrinhas-tier-1;
        escrita independente.
      - 1º ano em diante: estender para tier-2 palavrinhas (do, da,
        no, na, mas, também, aqui, lá, meu, minha); ponte para
        leitura-de-frases-simples completas.

compositionalRationale:
  pt: |
    Fio principal: letramento inicial / spelling-and-encoding (escrita
    de palavrinhas-de-alta-frequência). Fio secundário: phonics-
    decoding (palavrinhas frequentemente irregulares — escrita-de-
    vista necessária). Fio terciário: aquisição de vocabulário
    (palavrinhas + suas combinações sintáticas em pt-BR).

    Significância arquitetural: aprofunda o fio spelling-and-encoding
    1/5 → 2/5. RESOLVE o indicador adiante do Arco 12 spell-cvc-
    words. Reciprocidade leitura-escrita: spell-high-frequency-sight-
    words pareia com read-cvce-words do Arco 13 Fase 2 (decode ↔
    encode reciprocidade no mesmo arco).

    Especificidade pt-BR: a lista de palavrinhas pt-BR difere
    radicalmente da lista en — analogia direta NÃO funciona:
    - **en tier-1: the / is / and / I / a / to / of / you / for / in**
      → palavras de origem germânica + sintaxe-SVO simples
    - **pt tier-1: o / a / e / em / de / que / é / um / uma / com**
      → palavras de origem latina + artigos gendrados + verbo-de-
      ligação acentuado + preposições essenciais

    Diferenças estruturais críticas:
    - **Artigos gendrados**: pt tem 'o' (masculino) + 'a' (feminino);
      en não tem gênero gramatical (apenas 'the').
    - **Verbo-de-ligação acentuado**: 'é' (3a-pessoa-singular do verbo
      'ser') é palavrinha; 'is' é o equivalente em en mas 'é' tem
      acento agudo crítico para soletrar (sem acento, 'e' é
      conjunção 'and', mudando completamente o significado).
    - **Preposições essenciais**: pt 'em' + 'de' + 'com' são tier-1
      por frequência; en 'in' + 'of' + 'with' são tier-1 também,
      mas as construções diferem (pt 'estou em casa' vs en 'I'm at
      home' — diferentes preposições).
    - **'que' como conjunção + pronome relativo**: tier-1 em pt-BR
      por aparecer em quase todas as frases compostas; en 'that'
      é tier-2-3.

    Crianças brasileiras letrando em pt encontram estas palavrinhas
    pela primeira vez como ALVOS-DE-ESCRITA específicos — antes,
    elas usam essas palavras na fala automaticamente sem
    consciência explícita.

    Currículo BNCC EI03EF09 + 1º ano EF01LP05 + EF01LP12: escrever
    palavras de uso frequente; identificar palavras em frases.

    Substrato Class B FLEXIBLE: composta contra a amplitude da
    biblioteca de imagens. As crianças praticam palavrinhas em
    contextos visualmente-ancorados.
