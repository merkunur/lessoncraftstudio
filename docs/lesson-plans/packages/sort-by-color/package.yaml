compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / sorting-and-
    classification. Secondary strand: vocabulary acquisition (color names
    as a closed-class lexical set; supports productive use through
    sorting work). Tertiary strand: cross-domain integration (sorting
    fruits / vegetables / animals / vehicles by color exercises object-
    vocabulary recall in cognitive context).

    Architectural significance: this is the FIRST cognitive-and-executive-
    function domain package in the catalog. Closes Condition 4 (5-of-5
    domain coverage) at Arc 5 ship. Per §A.14 scaling-checkpoint discipline:
    cross-strand validation must complete for all 5 domains before strand-
    volume commits. Phase 2's 4-domain coverage (early-literacy +
    early-numeracy + world-knowledge + fine-motor-and-visual-spatial)
    plus this Phase 3 cognitive-and-executive-function package gives
    full 5-domain coverage — the architectural milestone for Arc 5
    ship.

    Distinctive composition vs vocabulary or geometry packages: 3 picture-
    sort exercises (positions 1, 2, 5) — sorting IS the target. Each
    picture-sort uses different theme-pair contrasts (fruits/vegetables;
    animals/vehicles; shapes/animals) to validate that the picture-sort
    architecture handles diverse theme-pair combinations.

    Sorting-by-attribute distinguished from classification-by-membership:
    sort-by-color asks kids to apply a single attribute (color) across
    diverse objects (fruits, vegetables, animals, vehicles) — different
    cognitive shape from classify-animals-by-habitat which asks kids to
    apply category-membership thinking (this animal IS a farm animal;
    that one IS a zoo animal). Both shapes ship in Phase 3 (sort-by-color
    + classify-animals-by-diet); validates that the architecture
    handles both reasoning patterns.

    Class B FLEXIBLE substrate: this package composes against image-
    library breadth (any image with a recognizable color works) plus
    the colors cluster (10 keys; CLEAN). Substrate-readiness measured by
    color-cluster coverage + image-library color diversity, not specific
    keys.

    K-3 multilingual classroom relevance: color-naming is universally
    early-acquired vocabulary; sorting-by-color is the canonical first
    sorting target in Pre-K. Sorting-by-attribute develops executive
    function — holding a rule in working memory while filtering perception.

