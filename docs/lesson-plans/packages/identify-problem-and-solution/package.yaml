compositionalRationale:
  en: |
    Primary strand: early-literacy / reading-comprehension
    (identify problem-and-solution in story — strand 7/10
    → 8/10). Secondary strand: vocabulary-acquisition
    (problem / solution / fix / help / helper vocabulary).
    Tertiary strand: cognitive-and-executive-function /
    causal-reasoning (kids identify cause-and-effect
    structure WITHIN narrative events).

    Architectural significance: extends Arc 14 Phase 2
    sequence-3-event-story (the prerequisite per
    learning-targets.json). That package taught kids to
    SEQUENCE 3-event stories (first / next / last —
    structural ordering); this package teaches kids to
    identify the CAUSAL STRUCTURE WITHIN that 3-event
    sequence (problem in event 1-2; solution in event 3).
    Cognitive progression: structural ordering →
    causal-pattern recognition. Reading-comprehension
    strand advances 7/10 → 8/10. Closes the gap to
    9/10 + 10/10 SAT (the strand's last 2 unsatisfied
    targets — distinguish-fiction-from-nonfiction +
    read-and-follow-2-sentence-instruction — are
    Phase 1.5+ candidates).

    Per §A.13.30 K-1 informal framing: K problem-and-
    solution work is CONCRETE STORY-STRUCTURE
    recognition. Kids learn the structural pattern
    using everyday language ('what went wrong' / 'how
    it was fixed') BEFORE encountering formal narrative
    terms ('conflict' / 'resolution' / 'rising action'
    are Grade 3+ terms). The K-1 pedagogy is pattern-
    recognition-through-examples; multiple problem-
    solution stories build the implicit pattern; the
    teacher-led narration ("the problem is X; the
    solution is Y") names the pattern explicitly. Story
    sources are everyday K-1 situations (spilled
    food, lost objects, can't reach, can't open,
    feeling cold/hungry/tired — kids recognize the
    problem-and-solution structure from their own
    daily experience). Formal narrative-element
    analysis (Grade 3+) extends to multi-element
    structures (character + setting + conflict + rising
    action + climax + resolution); this package
    establishes the foundation problem-solution
    pattern.

    Cross-reference to sequence-3-event-story (Arc 14
    Phase 2; prerequisite): that package established
    structural-ordering of 3 events. This package
    LAYERS causal-recognition ON TOP of the structural-
    ordering — same 3-event story format, deeper
    cognitive operation. The materials list MIRRORS
    sequence-3-event-story precedent on every dimension
    (sequencing-mat at position 1; flashcards;
    picture-cards; vocabulary-tracing-strips;
    manipulative-cut-outs `mode: story-set`; parent-
    take-home-letter; answer-key — 7 materials per
    narrative-comprehension subset of literacy-class).
    The composedExercises also mirror precedent (2
    pattern-train + 2 matching + 1 missing-pieces) —
    same exercise mechanics, different narrative
    interpretation work.

    Distinctive composition: 2 pattern-train (sequence-
    learning, extending sequence-3-event-story precedent)
    + 2 matching (problem-to-solution pairing) + 1
    missing-pieces (identify the missing problem-or-
    solution event). Same shape as Arc 14 P2 sequence-
    3-event-story precedent + Arc 14 P1 describe-
    butterfly-life-cycle + describe-water-cycle-basic;
    pattern-train is the canonical sequence-comprehension
    exercise across both science-cycle work AND
    narrative-sequence work; matching surfaces the
    causal pairing (problem-solution as a paired
    relationship); missing-pieces tests structural
    completeness understanding.

    Materials note: 8-material Literacy class stack per
    §A.13.37 + pair-coherent with identify-main-character
    (Arc 17 P1.5) + identify-setting (Arc 18 P1.2)
    narrative-structure precedents. Those precedents
    ship the 8-material literacy canonical (flashcards
    + picture-cards + matching-mat + sentence-strips +
    vocabulary-tracing-strips + manipulative-cut-outs +
    parent-take-home-letter + answer-key). This package
    matches the count + most positions but DIVERGES on
    one dimension: sequencing-mat REPLACES sentence-
    strips at the language-frame substrate role.
    Sequencing-mat at position 1 is the LOAD-BEARING
    material — it's the structural substrate (the 3-
    event sequence) that problem-solution recognition
    layers on top of. The replacement is pedagogically-
    motivated: problem-solution narration is multi-
    clause causal structure ("The problem is X. The
    solution is Y.") rather than single-clause
    descriptive frames ("This is X." / "I see X." /
    "I feel X.") that sentence-strips templates support.
    The 3-event sequencing substrate IS the narrative-
    structure language-anchor for problem-solution
    work; sequencing-mat carries that load.

    Matching-mat at position 4 provides problem-to-
    solution pairing work (kids match problem-pictures
    to corresponding solution-pictures); inherits the
    matching-mat position + role from identify-main-
    character + identify-setting precedents.
    Vocabulary-tracing-strips at position 5 traces the
    problem-solution vocabulary ('problem' / 'solution'
    / 'fix' / 'help' / 'wrong' / 'right').
    Manipulative-cut-outs at position 6 emits
    canonical-correct `mode: single-repeat` per §A.13.35
    canonical-mode discipline (the canonical CutOutMode
    type at `frontend/scripts/lib/manipulative-cut-
    outs-package-loader.ts:30` is `'single-repeat' |
    'variety'` only). Earlier staging inherited `mode:
    story-set` from sequence-3-event-story (Arc 14 P2)
    precedent which predates the §A.13.35 canonical-
    mode lock at `694f9823` — story-set is NOT in the
    canonical mode set. Round 1 review surfaced this
    as §A.13.6 firing per §A.13.32 canonical-artifact-
    grounding-at-composition-time; Round 2 amendment
    aligned to single-repeat at itemCount 24 + itemSize
    small-1in matching the identify-main-character +
    identify-setting configuration.

    Class B FLEXIBLE substrate: composes against
    miscellaneous + animals + foods themes (problem-
    solution stories span everyday contexts; theme
    diversity provides narrative variety). The
    miscellaneous theme is dominant for sequencing-mat
    + flashcards + picture-cards + vocabulary-tracing-
    strips + manipulative-cut-outs because problem-
    solution stories aren't theme-bound; the
    composedExercises diversify across animals + foods
    for variety.

    K-3 multilingual classroom relevance: problem-and-
    solution narrative structure is universal across
    cultures (every culture's stories have problem-
    solution patterns — folktales, fables, family
    stories all use the structure). The VOCABULARY
    varies across locales: en 'problem / solution / fix
    / help'; de 'Problem / Lösung / lösen / helfen'; es
    'problema / solución / arreglar / ayuda'; pt
    'problema / solução / consertar / ajuda'; fr
    'problème / solution / résoudre / aider'; it
    'problema / soluzione / risolvere / aiutare'; nl
    'probleem / oplossing / oplossen / helpen'; fi
    'ongelma / ratkaisu / korjata / auttaa'; sv
    'problem / lösning / lösa / hjälpa'; da 'problem /
    løsning / løse / hjælpe'; no 'problem / løsning /
    løse / hjelpe'. Cross-locale story-structure
    awareness is universally relevant; multilingual
    K-3 classrooms benefit from explicit pattern-
    naming work in the language-of-instruction +
    bridges to the home-language story patterns kids
    encounter at home (folktales + family stories +
    bedtime stories all use the same problem-solution
    pattern).

