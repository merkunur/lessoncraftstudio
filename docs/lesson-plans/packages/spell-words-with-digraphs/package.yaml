compositionalRationale:
  en: |
    Primary strand: early-literacy / spelling-and-encoding (consonant-
    digraph word encoding; canonical strand-advancement toward SAT —
    23rd parent-class strand SAT closure trajectory). Secondary
    strand: phonics-decoding (kids leverage Arc 14 read-blends-and-
    digraphs HYBRID for digraph reading-side). Tertiary strand:
    vocabulary acquisition (digraph-anchor words drawn from
    familiar K-3 vocabulary).

    Architectural significance: spelling-and-encoding strand-
    advancement (3 → 4 canonical-slug authored; trajectory toward
    SAT 4-5/5). Phase 1.5 close-out responsibility per Arc 19
    final-arc-cycle slot; 23rd parent-class strand SAT closure if
    spell-tier-2-sight-words slug-divergence is treated as canonical-
    equivalent (5/5 SAT), 22 SAT-equivalent + 23rd SAT-closure-
    trajectory if treated as not-yet-canonical (4/5).

    **Phonetic-reciprocity with Arc 14 read-blends-and-digraphs**
    (digraph half of the HYBRID — decoding direction). The kid first
    learned to READ digraph words at Arc 14 (recognize sh-/ch-/th-/
    wh-/ph- patterns in print + sound them out). This package
    teaches the WRITING side — the kid hears a digraph word +
    reproduces the spelling. Encoding-direction canonical-distinct
    from the decoding-direction Arc 14 HYBRID per §A.13.34 sub-class
    threshold-class adjudication (Firing 5 doctrine candidate
    Phase 1.5 empirical input).

    Pair-coherent ship pattern with Phase 1.4 spell-words-with-blends
    (parallel-cluster spelling pair: blends + digraphs covers both
    canonical CCSS.L.1.2d consonant-cluster encoding categories).

    Distinctive composition: 2 word-scramble + 2 word-guess + 1
    matching. Same composition shape as Phase 1.4 spell-words-with-
    blends (pair-coherence in materials structure too). Word-scramble
    surfaces digraph-letter-ordering work; word-guess fills the
    digraph in cloze context.

    Class B FLEXIBLE substrate: composes against animals + foods
    image-library themes (digraph-rich vocabulary: ship / fish /
    sheep / cheese / chair / three / thumb / white / when / phone /
    photo / shark).

    K-3 multilingual classroom relevance: consonant-digraph spelling
    is English-specific. The English digraph inventory (sh/ch/th/wh/
    ph) does not have direct cognates in most platform locales —
    pt-BR uses different digraph set (lh/nh/rr/ss/ch); German has
    sch (Schule) + ch (machen) — different inventory; Spanish has
    ll (llave) + ñ (niño) + rr (carro) — also different. Locale-
    variant sparse-overrides per Phase 3 REFRAME per locale's
    canonical digraph inventory (NOT direct transposition of English
    digraphs). This is §A.13.34 sub-class pedagogy-level locale-
    canonical-curriculum-divergence — surfaces FULL-OVERRIDE
    adjudication candidates (Firing 5 doctrine candidate threshold-
    class enumeration empirical input).

