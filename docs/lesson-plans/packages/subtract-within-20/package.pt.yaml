# Teaching package — subtrair até 20 (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 15 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# pt sparse-override for math / addition-subtraction strand. Conteúdo matemático
# universal — tradução direta sem reestruturação pedagógica. BR-MEC educação
# infantil register per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Subtrair até 20 — tirando números maiores"
description:
  pt: "Pacote de matemática para 1º / 2º ano que ensina as crianças a subtrair números até 20 (15-7=8, 18-6=12, 20-13=7, etc.). Constrói sobre Arc 14 Fase 4 subtract-within-5 + subtract-within-10 + Arc 12 add-within-20 como base. Estende o trabalho de subtração da faixa até-10 para a faixa até-20. Ponte crítica da subtração mental (até 10) para subtração de dois-dígitos (a faixa até-20 introduz o conceito de 'emprestar' / 'reagrupar' quando o minuendo tem 1 no lugar das dezenas e o subtraendo excede o lugar das unidades). Completa a sequência básica de subtração (5 → 10 → 20). 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Iniciador com toda a turma + introdução de subtração até 20.
      A professora ou o professor exibe uma linha numérica 1-20.
      "Hoje vamos subtrair números MAIORES — até 20. Vamos começar
      com 15-7. COMEÇAMOS no 15 na linha numérica + CONTAMOS DE
      VOLTA 7 saltos." Desenha 7 saltos-de-arco na linha numérica.
      "15-14-13-12-11-10-9-8. Aterrizamos no 8. Então 15-7=8." A
      turma repete com 3-4 problemas (18-6, 16-9, 20-13, 17-5). A
      professora ou o professor introduz variações de estratégia:
      contar-de-volta; decompor ("15-7: tire 5 primeiro para
      chegar a 10, depois mais 2 = 8"); usar-fatos-conhecidos
      ("15-7? Eu sei que 7+8=15, então 15-7=8").
  contentActivity:
    body: |
      Trabalho em duplas + rotina de subtração. Cada dupla recebe
      uma folha de exercícios com 6 problemas de subtração até 20
      (15-7, 18-6, 16-9, 20-13, 17-5, 14-8). Dupla alterna:
      criança A lê problema; criança B escolhe estratégia (linha
      numérica / contar-de-volta / decomposição / usar-fatos-
      conhecidos) + calcula a resposta. Refraseie erros com
      demonstração-de-estratégia ("18-6 — vamos tentar decomposição:
      tire 6 em dois passos. 18-3=15, 15-3=12. Então 18-6=12.").
      Estratégias diferentes introduzidas progressivamente;
      crianças escolhem estratégias que funcionam para elas.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios de
      subtração (método de risque-fora até 20 — itens contáveis
      visuais). Estação 2: math-worksheet (subtração vertical até
      20; ainda sem reagrupar — empréstimo introduzido
      gentilmente). Estação 3: math-puzzle (encontrar operando
      faltante: 15-?=8; ?-7=12). Estação 4: more-less (comparar
      2 resultados de subtração: qual é maior, 18-9 ou 17-7?).
      Vocabulário pt-BR canônico para subtração: tirar / subtrair
      / menos / diferença / resto. Use "tirar" + "menos" como
      formas K-3 mais naturais; "subtrair" técnico mais formal.
  closure:
    body: |
      Quiz de subtração até 20 com toda a turma. A professora ou
      o professor apresenta 5 problemas rápidos; turma responde
      coletivamente usando estratégia preferida. "20-5? 18-9?
      15-6? 17-10? 19-12?" Indicador adiante: "Hoje subtraímos
      até 20. Quando voltarmos na próxima vez, aprenderemos
      SUBTRAÇÃO DE DOIS DÍGITOS (25-13, 48-29) onde às vezes
      precisamos EMPRESTAR do lugar das dezenas — + adicionar e
      subtrair juntos em problemas mistos!"

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Calcular subtração até 20 corretamente em 7 de 10
        tentativas.
      - Usar pelo menos 2 estratégias de subtração ao resolver
        problemas em 6 de 10 tentativas.
      - Resolver problemas simples de operando-faltante (20-?=8;
        ?-7=12) em 5 de 10 tentativas.
      - Comparar resultados de subtração (qual é maior: 18-9 ou
        17-7?) em 5 de 10 tentativas.

    Diferenciação:
      - Pré-K (3-5 anos): revisar subtração até 10; sem trabalho
        até 20.
      - Educação infantil (5-7 anos): subtração até 15; suporte
        de estratégia enfatizado.
      - 1º ano: subtração até 20 fluente; múltiplas estratégias.
      - 2º ano em diante: estender para subtração de dois dígitos
        com reagrupamento; ponte para subtract-within-100.

compositionalRationale:
  pt: |
    Fio principal: matemática / adição-subtração (subtração até
    20 — estende fio aprofundando a cobertura de subtração). Fio
    secundário: numeracia (subtração baseada-em-estratégia:
    contar-de-volta, decomposição, usar-fatos-conhecidos). Fio
    terciário: matemática / lugar-valor (subtração até 20
    introduz base conceitual para lugar-das-dezenas).

    Significância arquitetural: estende Arc 14 Fase 4 subtract-
    within-5 + subtract-within-10 para a faixa até-20. Completa
    a sequência básica de subtração (5 → 10 → 20). Ponte crítica
    da subtração mental (até 10) para subtração de dois-dígitos;
    a faixa até-20 introduz subtração-cruzando-o-10 (15-7 requer
    cruzar o 10) que prepara para o trabalho de
    emprestar/reagrupar em subtração futura com consciência-de-
    lugar-valor.

    Especificidade pt-BR: subtração até 20 é conceito universal
    + traduzível 1:1 do en. Vocabulário pt-BR canônico:
    - **"tirar"** (informal K-3) / **"subtrair"** (técnico
      formal) — K-3 contexto natural usa "tirar"; "subtrair" é
      escolar formal.
    - **"menos"** — universal pt-BR; usado para sinal − e
      vocabulário comparativo.
    - **"diferença"** — termo técnico para resultado da subtração;
      acessível K-3 quando introduzido.
    - **"resto"** — informal K-3 para o que sobra após tirar
      ("se tenho 8 e tiro 3, sobra 5").

    Sistema de palavras-número pt-BR para 11-20: tem
    irregularidades — "onze, doze, treze, catorze, quinze,
    dezesseis, dezessete, dezoito, dezenove, vinte". A regra
    "dez+número" começa em 16 (dez-e-seis); 11-15 são formas
    irregulares completamente distintas. Trabalho de subtração
    cruzando-o-10 deve consolidar essas palavras-número
    pt-BR-irregulares.

    Currículo BNCC EF01MA08 + 1º ano EF01MA09 + 2º ano EF02MA05:
    cálculo de subtração com números até 20; uso de estratégias
    pessoais + diferentes representações.

    Substrato Class B FLEXIBLE: composta contra tema animals
    (contável para trabalho de subtração; cross-arc com Arc 12-15
    addition/subtraction themes).
