# Teaching package — subitize quantities 1-5
# Arc 4 Phase 3 numeracy package. Foundational K skill: recognize small
# quantities (1-5) at a glance without counting. Builds toward count-on +
# add-within strategies. CCSS.K.CC.B.4 alignment.

targetSlug: subitize-quantities-1-to-5
language: en

title:
  en: "Subitize Quantities 1-5 — see-and-know small numbers"
description:
  en: "Kindergarten numeracy package teaching subitization (instant recognition of 1-5 items without counting). Foundational pre-numeracy skill: kids who subitize fluently transition smoothly to count-on and add-within strategies. find-and-count + chart-count app heavy; manipulative-cut-outs for repeated short-burst exposure. 5 exercises + 6 materials over a 1-2 week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class flash routine. Teacher holds up a dot card (or finger pattern)
      for ~1 second, then hides it. "How many?" Kids call out the count without
      counting. Start with 1-2 dots, build to 5. Recast counting attempts:
      "I want you to SEE the number, not count it." Subitization = pattern
      recognition, not enumeration.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair-flash routine with picture-cards. Kid A flashes a card showing N
      objects (1-5) for 1 second; kid B says the number. Switch roles. Then
      group game: teacher flashes a card to whole class, kids show the
      number on their fingers as fast as possible. Variant: dot patterns vs
      pictured objects (5 fish vs 5 dots) — both should be subitizable at
      this range.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: find-and-count worksheet (small grids,
      counts 1-5 per item). Station 2: chart-count worksheet (kids count
      and write totals). Station 3: manipulative cut-outs flash drill —
      kids partner up, one shows N items, the other names the count
      without counting.
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher flashes 5 cards in succession; kids
      track the running tally on fingers. Forward-pointer: "Today we learned
      to SEE numbers without counting them. When we come back to numbers
      next, this fast-seeing will help us count bigger groups and add
      numbers together."

