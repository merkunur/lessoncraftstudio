assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify feeling on another person's face/body in 8 of 10
        trials (notice step).
      - Use NAME-the-feeling language ("you look sad") in 7 of 10
        trials.
      - Suggest empathic helping response in 6 of 10 trials.
      - Demonstrate full 3-step empathy in role-play in 5 of 10
        trials.

    Differentiation:
    - Pre-K: 1-step only (NOTICE); identification only.
    - K: 2-step (NOTICE + NAME); receptive vocabulary.
    - Grade 1+: full 3-step including HELP; productive use of
      empathy vocabulary.
    - Grade 2+: extend to conflict-resolution + perspective-taking
      with disagreements + bridge to friendship + cooperation work.

