assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Produce both short and long sounds for 4 of 5 vowels in 8 of
        10 trials.
      - Match vowel sound (short OR long) to picture-anchor-word in 7
        of 10 trials.
      - Identify the vowel sound (short or long) in NEW CVC or CVCe
        word in 6 of 10 trials.

    Differentiation:
    - Pre-K: short-vowel-only scope (A, E, I, O, U short sounds).
    - K: short + long for all 5 vowels.
    - Grade 1+: extend to vowel-team patterns (ai, ee, ie, oa, ue) +
      bridge to read-cvce-words + r-controlled-vowels work.

