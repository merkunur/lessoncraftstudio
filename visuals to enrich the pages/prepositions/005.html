<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Prepositions Worksheets - Professional Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="

        <!-- Subtle radial glow -->
        <div style="
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
            border-radius: 50%;
        "></div>

        <!-- Gold corner brackets -->
        <!-- Top-left -->
        <svg style="position: absolute; top: 30px; left: 30px;" width="70" height="70" viewBox="0 0 70 70">
            <path d="M 5 45 L 5 5 L 45 5" stroke="#FBBF24" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
        <!-- Top-right -->
        <svg style="position: absolute; top: 30px; right: 30px;" width="70" height="70" viewBox="0 0 70 70">
            <path d="M 25 5 L 65 5 L 65 45" stroke="#FBBF24" stroke-width="4" fill="none" stroke-linecap="round"/>

        <svg style="position: absolute; bottom: 30px; left: 30px;" width="70" height="70" viewBox="0 0 70 70">

            <path d="M 25 65 L 65 65 L 65 25" stroke="#FBBF24" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>

        <!-- Premium Quality seal - top center -->
        <div style="
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        ">
            <svg width="120" height="120" viewBox="0 0 120 120">
                <!-- Seal rays -->
                <g transform="translate(60, 60)">
                    <polygon points="0,-55 7,-38 -7,-38" fill="#FBBF24" transform="rotate(0)"/>

                <circle cx="60" cy="60" r="40" fill="#1E1B4B"/>

                <circle cx="60" cy="60" r="32" fill="#1E1B4B"/>

            <div style="
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                text-align: center;

                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 11px;
                    color: #FBBF24;
                    display: block;
                    letter-spacing: 1px;

                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 12px;
                    color: #FBBF24;
                    display: block;
                ">QUALITY</span>
            </div>
        </div>

        <!-- FREE Badge - Top Left -->
        <div style="
            position: absolute;
            top: 45px;
            left: 50px;
            z-index: 20;

            <div style="
                background: linear-gradient(135deg, #F97066 0%, #EF4444 100%);
                color: white;
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 24px;
                padding: 10px 22px;
                border-radius: 25px;
                box-shadow: 0 4px 15px rgba(249, 112, 102, 0.5);
                letter-spacing: 1px;

        </div>

        <div style="
            position: absolute;
            top: 50px;
            right: 50px;
            border: 2px solid #FBBF24;

            font-weight: 600;
            font-size: 18px;
            padding: 8px 20px;
            border-radius: 25px;
            z-index: 20;

        <div style="
            position: absolute;
            top: 155px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">

                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 52px;
                color: white;
                margin: 0;
                text-shadow: 0 3px 15px rgba(0,0,0,0.3);
            ">Prepositions</h1>
            <h2 style="
                font-family: 'Nunito', sans-serif;
                font-weight: 700;
                font-size: 24px;
                color: #FBBF24;
                margin: 6px 0 0 0;
                letter-spacing: 6px;
                text-transform: uppercase;

        </div>

        <!-- Central large worksheet with gold border and glow -->
        <div style="
            position: absolute;
            top: 270px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        ">
            <div style="
                background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
                padding: 10px;
                border-radius: 12px;
                box-shadow: 0 0 40px rgba(251, 191, 36, 0.3), 0 20px 60px rgba(0,0,0,0.4);
            ">
                <div style="
                    background: white;
                    padding: 8px;
                    border-radius: 8px;
                ">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-5.jpeg"
                        alt="Prepositions Worksheet"
                        style="
                            width: 300px;
                            height: 388px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 5px;
                            display: block;
                        "
                    />
                </div>
            </div>
        </div>

        <!-- Flanking preview - Answer key (left, smaller, tilted) -->
        <div style="
            position: absolute;
            top: 340px;
            left: 60px;
            transform: rotate(-5deg);
            z-index: 10;

                background: rgba(255,255,255,0.1);
                padding: 6px;
                border-radius: 8px;
                border: 1px solid rgba(251, 191, 36, 0.3);
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);

                    src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-5-answer.jpeg"
                    alt="Answer Key"
                    style="
                        width: 160px;
                        height: 207px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 4px;
                        display: block;
                        opacity: 0.85;
                    "
                />
            </div>
            <div style="
                text-align: center;
                margin-top: 8px;
                font-family: 'Nunito', sans-serif;
                font-weight: 600;
                font-size: 14px;
                color: rgba(255,255,255,0.6);
            ">Answer Key</div>
        </div>

        <!-- Flanking preview - Another worksheet (right, smaller, tilted) -->
        <div style="
            position: absolute;
            top: 340px;
            right: 60px;
            transform: rotate(5deg);
            z-index: 10;
        ">
            <div style="
                background: rgba(255,255,255,0.1);
                padding: 6px;
                border-radius: 8px;
                border: 1px solid rgba(251, 191, 36, 0.3);
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-10.jpeg"
                    alt="Prepositions Worksheet"
                    style="
                        width: 160px;
                        height: 207px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 4px;
                        display: block;
                        opacity: 0.85;
                    "
                />
            </div>
            <div style="
                text-align: center;
                margin-top: 8px;
                font-family: 'Nunito', sans-serif;
                font-weight: 600;
                font-size: 14px;
                color: rgba(255,255,255,0.6);
            ">More Themes</div>
        </div>

        <!-- Frosted glass feature cards - bottom -->
        <div style="
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 20;
        ">
            <div style="
                background: rgba(255,255,255,0.08);
                border: 1px solid rgba(255,255,255,0.15);
                border-radius: 14px;
                padding: 14px 18px;
                text-align: center;
                backdrop-filter: blur(10px);
            ">
                <svg width="28" height="28" viewBox="0 0 100 100" style="display: block; margin: 0 auto 6px;">
                    <rect x="20" y="15" width="60" height="18" rx="3" fill="#FBBF24"/>
                    <rect x="15" y="33" width="70" height="35" rx="5" fill="#FBBF24"/>
                    <rect x="25" y="55" width="50" height="28" fill="#FBBF24"/>
                </svg>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white; display: block; line-height: 1.2;">Print Ready<br/>300 DPI</span>
            </div>
            <div style="
                background: rgba(255,255,255,0.08);
                border: 1px solid rgba(255,255,255,0.15);
                border-radius: 14px;
                padding: 14px 18px;
                text-align: center;
                backdrop-filter: blur(10px);
            ">
                <svg width="28" height="28" viewBox="0 0 100 100" style="display: block; margin: 0 auto 6px;">
                    <circle cx="35" cy="35" r="18" fill="none" stroke="#FBBF24" stroke-width="5"/>
                    <circle cx="35" cy="35" r="7" fill="#FBBF24"/>
                    <line x1="48" y1="48" x2="80" y2="80" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>

                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white; display: block; line-height: 1.2;">Answer<br/>Keys</span>
            </div>
            <div style="
                background: rgba(255,255,255,0.08);
                border: 1px solid rgba(255,255,255,0.15);
                border-radius: 14px;
                padding: 14px 18px;
                text-align: center;
                backdrop-filter: blur(10px);
            ">
                <svg width="28" height="28" viewBox="0 0 100 100" style="display: block; margin: 0 auto 6px;">
                    <path d="M 30 50 L 45 65 L 75 35" stroke="#FBBF24" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white; display: block; line-height: 1.2;">No<br/>Prep</span>
            </div>
            <div style="
                background: rgba(255,255,255,0.08);
                border: 1px solid rgba(255,255,255,0.15);
                border-radius: 14px;
                padding: 14px 18px;
                text-align: center;
                backdrop-filter: blur(10px);
            ">
                <svg width="28" height="28" viewBox="0 0 100 100" style="display: block; margin: 0 auto 6px;">
                    <circle cx="50" cy="30" r="12" fill="#FBBF24"/>
                    <circle cx="30" cy="55" r="12" fill="#FBBF24"/>
                    <circle cx="70" cy="55" r="12" fill="#FBBF24"/>
                    <circle cx="50" cy="75" r="12" fill="#FBBF24"/>
                </svg>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white; display: block; line-height: 1.2;">Themed<br/>Content</span>
            </div>
        </div>

        <!-- Bottom gold strip -->
        <div style="
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        ">
            <div style="
                background: linear-gradient(90deg, transparent, #FBBF24, transparent);
                padding: 2px 0;
                width: 700px;
                text-align: center;
            ">
                <div style="
                    background: #1E1B4B;
                    padding: 10px 0;
                ">
                    <span style="
                        font-family: 'Nunito', sans-serif;
                        font-weight: 800;
                        font-size: 20px;
                        color: #FBBF24;
                        letter-spacing: 5px;
                        text-transform: uppercase;
                    ">TEACHER-READY QUALITY</span>
                </div>
            </div>
        </div>
    </div>
</body>
