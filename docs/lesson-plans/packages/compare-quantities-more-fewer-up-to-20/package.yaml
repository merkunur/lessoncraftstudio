compositionalRationale:
  en: |
    Primary strand: math / comparison (more/fewer/equal in teen
    range 11-20; extends existing 1-10 range package). Secondary
    strand: math / place-value (teen-range comparison foregrounds
    1-tens-place; bridges to two-digit comparison reasoning).
    Tertiary strand: numeracy / counting-and-cardinality (counts
    to 20 reinforced).

    Architectural significance: extends Arc 12+ compare-quantities-
    more-fewer 1-10 range into teen range (11-20). Critical bridge
    to two-digit comparison reasoning: teen numbers all have 1
    ten, so ones-digit-tiebreak strategy emerges as canonical.
    Foundation for compare-quantities-up-to-100 + up-to-999 future
    work (where tens AND hundreds-digit-tiebreaks layer in). Note:
    distinct from existing compare-quantities-more-fewer (1-10
    range) — this package SPECIFICALLY targets 11-20.

    Distinctive composition: 2 more-less + 1 matching + 1 math-
    puzzle + 1 chart-count. more-less mode varied (image-to-number
    first, then number-to-number for advanced kids); matching
    surfaces equivalent representations (numeral / tally / dots /
    word); chart-count bar-graph comparison consolidates strategy.

    Class B FLEXIBLE substrate: composes against animals theme
    (countable for comparison work; cross-arc with Arc 12-15
    numeracy themes).

    Cross-bundle reuse opportunity: food-context bundles per
    Pillar 2 cycle close 4-bundle precedent (food-prep +
    restaurant + breakfast-foods + snacks); cooking-themed
    quantity comparison aligns naturally ("you have 14 apples;
    your friend has 17 apples — who has more?"). Bundle.yaml
    update deferred to arc-close consolidated cycle per Arc
    14/15 decoupled-ship pattern.

    K-3 multilingual classroom relevance: teen-number naming
    varies significantly across locales (Romance partial-cognate
    11-20 onze/doze... vs Germanic distinct 11-19 elf/zwölf...
    + Finnic agglutinative; teen-range comparison work surfaces
    these number-word irregularities). Comparison vocabulary
    "more/fewer/equal" translates locale-specific: en "more /
    fewer / equal"; de "mehr / weniger / gleich"; es "más /
    menos / igual"; pt "mais / menos / igual" / "igual a". Locale-
    variant work at Phase 3+ adapts.

