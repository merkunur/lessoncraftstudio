<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Picture Cryptogram - Variety Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(160deg, #7C3AED 0%, #6D28D9 30%, #92400E 70%, #D97706 100%);">

        <!-- Atmospheric glow -->
        <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 60%, rgba(251,191,36,0.2) 0%, transparent 50%);"></div>

        <!-- Stars/sparkles scattered -->
        <div style="position: absolute; top: 80px; left: 120px; font-size: 24px; opacity: 0.8;">✨</div>
        <div style="position: absolute; top: 150px; right: 80px; font-size: 20px; opacity: 0.7;">✨</div>
        <div style="position: absolute; top: 200px; left: 60px; font-size: 16px; opacity: 0.6;">⭐</div>
        <div style="position: absolute; bottom: 300px; right: 60px; font-size: 22px; opacity: 0.8;">✨</div>
        <div style="position: absolute; bottom: 200px; left: 100px; font-size: 18px; opacity: 0.7;">⭐</div>
        <div style="position: absolute; top: 350px; right: 150px; font-size: 14px; opacity: 0.6;">✨</div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 28px; left: 28px; z-index: 30;">
            <div style="width: 85px; height: 85px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 25px rgba(249,115,22,0.6), inset 0 2px 0 rgba(255,255,255,0.3); position: relative;">
                <div style="position: absolute; top: 50%; left: -3px; transform: translateY(-50%); width: 10px; height: 10px; background: #6D28D9; border-radius: 50%;"></div>
                <div style="position: absolute; top: 50%; right: -3px; transform: translateY(-50%); width: 10px; height: 10px; background: #6D28D9; border-radius: 50%;"></div>
                <span style="font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">FREE</span>
            </div>
        </div>

        <!-- GRADES Badge -->
        <div style="position: absolute; top: 32px; right: 32px; z-index: 30;">
            <div style="background: rgba(255,255,255,0.95); padding: 12px 24px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 800; color: #7C3AED; letter-spacing: 1px;">GRADES K-3</span>
            </div>
        </div>

        <!-- Main Headline -->
        <div style="position: absolute; top: 100px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 20;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 78px; font-weight: 700; color: white; text-shadow: 0 4px 20px rgba(0,0,0,0.3), 0 0 40px rgba(251,191,36,0.3); letter-spacing: -1px;">ENDLESS</h1>
            <h1 style="margin: -5px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 78px; font-weight: 700; color: #FCD34D; text-shadow: 0 4px 20px rgba(0,0,0,0.3), 0 0 40px rgba(251,191,36,0.4); letter-spacing: -1px;">DISCOVERIES</h1>
        </div>

        <!-- Tagline -->
        <div style="position: absolute; top: 270px; left: 50%; transform: translateX(-50%); z-index: 20;">
            <p style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.9); letter-spacing: 2px;">From Simple Starts to Challenging Codes</p>
        </div>

        <!-- Parchment Scroll -->
        <div style="position: absolute; top: 300px; left: 50%; transform: translateX(-50%) rotate(-5deg); width: 850px; height: 550px; z-index: 10;">

            <!-- Scroll paper body -->
            <div style="position: absolute; top: 60px; left: 80px; right: 80px; bottom: 60px; background: linear-gradient(180deg, #F5E6D3 0%, #E8D4BC 20%, #DCC7A8 50%, #E8D4BC 80%, #F5E6D3 100%); border-radius: 8px; box-shadow: inset 0 0 30px rgba(139,90,43,0.2), 0 15px 50px rgba(0,0,0,0.4);"></div>

            <!-- Top scroll roll -->
            <div style="position: absolute; top: 30px; left: 50px; right: 50px; height: 60px; background: linear-gradient(180deg, #C4A97A 0%, #8B5A2B 30%, #6B4423 60%, #8B5A2B 80%, #C4A97A 100%); border-radius: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.4);"></div>

            <!-- Bottom scroll roll -->
            <div style="position: absolute; bottom: 30px; left: 50px; right: 50px; height: 60px; background: linear-gradient(180deg, #C4A97A 0%, #8B5A2B 30%, #6B4423 60%, #8B5A2B 80%, #C4A97A 100%); border-radius: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.4);"></div>

            <!-- Worksheets emerging from scroll -->
            <!-- Worksheet 1 - Far left -->
            <div style="position: absolute; top: 100px; left: 60px; transform: rotate(-12deg); width: 180px; height: 240px; background: white; border-radius: 6px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); overflow: hidden; border: 2px solid #d4c4a8; z-index: 5;">
                <img src="https://www.lessoncraftstudio.com/samples/english/cryptogram/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
            </div>

            <!-- Worksheet 2 - Left -->
            <div style="position: absolute; top: 80px; left: 180px; transform: rotate(-6deg); width: 190px; height: 250px; background: white; border-radius: 6px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); overflow: hidden; border: 2px solid #d4c4a8; z-index: 6;">
                <img src="https://www.lessoncraftstudio.com/samples/english/cryptogram/sample-2-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
            </div>

            <!-- Worksheet 3 - CENTER (Hero) -->
            <div style="position: absolute; top: 60px; left: 320px; transform: rotate(0deg); width: 220px; height: 290px; background: white; border-radius: 8px; box-shadow: 0 12px 40px rgba(249,115,22,0.4), 0 10px 30px rgba(0,0,0,0.4); overflow: hidden; border: 4px solid #F97316; z-index: 10;">
                <img src="https://www.lessoncraftstudio.com/samples/english/cryptogram/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
                <!-- X marks the spot -->
                <div style="position: absolute; top: 10px; right: 10px; font-size: 32px; color: #DC2626; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">✗</div>
            </div>

            <!-- Worksheet 4 - Right -->
            <div style="position: absolute; top: 80px; left: 490px; transform: rotate(6deg); width: 190px; height: 250px; background: white; border-radius: 6px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); overflow: hidden; border: 2px solid #d4c4a8; z-index: 6;">
                <img src="https://www.lessoncraftstudio.com/samples/english/cryptogram/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
            </div>

            <!-- Worksheet 5 - Far right -->
            <div style="position: absolute; top: 100px; left: 620px; transform: rotate(12deg); width: 180px; height: 240px; background: white; border-radius: 6px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); overflow: hidden; border: 2px solid #d4c4a8; z-index: 5;">
                <img src="https://www.lessoncraftstudio.com/samples/english/cryptogram/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
        </div>

        <!-- Compass Rose -->
        <div style="position: absolute; bottom: 100px; left: 60px; z-index: 25;">
            <div style="width: 120px; height: 120px; position: relative;">
                <!-- Outer ring -->
                <div style="position: absolute; inset: 0; border: 4px solid #F97316; border-radius: 50%; opacity: 0.8;"></div>
                <!-- Inner design -->
                <div style="position: absolute; inset: 15px; background: linear-gradient(45deg, #7C3AED 25%, transparent 25%, transparent 75%, #7C3AED 75%), linear-gradient(-45deg, #F97316 25%, transparent 25%, transparent 75%, #F97316 75%); background-size: 50px 50px; border-radius: 50%; opacity: 0.9;"></div>
                <!-- Center dot -->
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; background: #FCD34D; border-radius: 50%; box-shadow: 0 0 15px rgba(251,191,36,0.6);"></div>
                <!-- Direction markers -->
                <div style="position: absolute; top: 5px; left: 50%; transform: translateX(-50%); font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700; color: white;">N</div>
                <div style="position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700; color: white;">S</div>
                <div style="position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700; color: white;">W</div>
                <div style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 700; color: white;">E</div>
            </div>
        </div>

        <!-- Difficulty level indicators -->
        <div style="position: absolute; bottom: 115px; right: 80px; display: flex; gap: 15px; z-index: 25;">
            <div style="text-align: center;">
                <div style="display: flex; gap: 4px; margin-bottom: 4px;">
                    <div style="width: 18px; height: 18px; background: #FCD34D; border-radius: 50%; box-shadow: 0 0 8px rgba(251,191,36,0.5);"></div>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; color: white;">Easy</span>
            </div>
            <div style="text-align: center;">
                <div style="display: flex; gap: 4px; margin-bottom: 4px;">
                    <div style="width: 18px; height: 18px; background: #FCD34D; border-radius: 50%; box-shadow: 0 0 8px rgba(251,191,36,0.5);"></div>
                    <div style="width: 18px; height: 18px; background: #FCD34D; border-radius: 50%; box-shadow: 0 0 8px rgba(251,191,36,0.5);"></div>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; color: white;">Medium</span>
            </div>
            <div style="text-align: center;">
                <div style="display: flex; gap: 4px; margin-bottom: 4px;">
                    <div style="width: 18px; height: 18px; background: #FCD34D; border-radius: 50%; box-shadow: 0 0 8px rgba(251,191,36,0.5);"></div>
                    <div style="width: 18px; height: 18px; background: #FCD34D; border-radius: 50%; box-shadow: 0 0 8px rgba(251,191,36,0.5);"></div>
                    <div style="width: 18px; height: 18px; background: #FCD34D; border-radius: 50%; box-shadow: 0 0 8px rgba(251,191,36,0.5);"></div>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; color: white;">Challenge</span>
            </div>
        </div>

        <!-- Bottom feature pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; z-index: 25;">
            <div style="background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); padding: 12px 22px; border-radius: 25px; border: 2px solid rgba(255,255,255,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: white;">🗺️ Adventure Awaits</span>
            </div>
            <div style="background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); padding: 12px 22px; border-radius: 25px; border: 2px solid rgba(255,255,255,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: white;">🔑 Answer Keys</span>
            </div>
            <div style="background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); padding: 12px 22px; border-radius: 25px; border: 2px solid rgba(255,255,255,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: white;">🖨️ Print & Play</span>
            </div>
        </div>

    </div>
</body>
</html>
