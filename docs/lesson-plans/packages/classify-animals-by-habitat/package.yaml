assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Classify 12 mixed-habitat animals into 4 habitat categories with
        80%+ accuracy.
      - Use habitat-vocabulary ("farm," "zoo," "ocean," "home/pet") in oral
        sorting work.
      - Explain 1-2 reasons why an animal lives in its habitat (food/shelter/
        safety) when prompted.

    Differentiation:
    - Pre-K: 2-habitat sorting only (farm vs zoo OR pets vs zoo).
    - K / Grade 1: full 4-habitat classification.
    - Grade 2+: extend to classify-animals-by-diet (Phase 3) + describe-plant-
      life-cycle + ecosystem-vocabulary (food chain, predator-prey).

    Prerequisite check: kids who haven't completed identify-and-name-10-farm-
    animals (Arc 1) should review animal names at warmup. Classification
    requires names-as-prerequisite.

