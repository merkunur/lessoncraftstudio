assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compute 2-digit + 2-digit addition correctly in
        7 of 10 trials.
      - Identify regrouping moments + execute regrouping
        correctly in 6 of 8 problems requiring carrying.
      - Use place-value-mat + base-ten manipulatives to
        build 2-digit numbers + perform addition in 6
        of 8 trials.
      - Use at least 2 addition strategies (e.g.,
        column-add-with-regrouping + decomposition) in
        5 of 10 trials.
      - Solve missing-addend problems (27+?=65) in 5 of
        10 trials.
      - Use vocabulary 'tens' / 'ones' / 'place value' /
        'regroup' / 'column' / 'two-digit' correctly in
        5 of 10 productive-language trials.

    Differentiation:
    - Pre-K: skip 2-digit addition; review counting +
      add-within-10 first.
    - K: introduce 2-digit numbers + place-value (Arc
      15 tens-and-ones); defer 2-digit addition to
      Grade 1+.
    - Grade 1: introduce 2-digit + 1-digit addition
      (45+3); save 2-digit + 2-digit for Grade 2.
    - Grade 2: full 2-digit + 2-digit addition with
      regrouping mastery; multiple strategies practiced;
      bridge to pair partner subtract-2-digit-numbers
      (Phase 1.4+ candidate).
    - Grade 3+: extend to 3-digit addition; mental
      2-digit addition fluency; bridge to standard-
      algorithm efficiency without manipulative
      support.

