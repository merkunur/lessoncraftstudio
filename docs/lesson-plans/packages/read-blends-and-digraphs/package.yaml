# Teaching package — read consonant blends and digraphs
# Arc 14 Phase 2 (early-literacy / phonics-decoding +1 from Arc 13 baseline).
# Resolves Arc 13 read-cvce-words forward-pointer.

targetSlug: read-blends-and-digraphs
language: en
title:
  en: "Blends and Digraphs — bl, br, ch, sh, th, st"
description:
  en: "Grade 1 / Grade 2 early-literacy package teaching kids to read consonant blends (bl, br, cl, cr, dr, fl, fr, gl, gr, pl, pr, sl, sm, sn, sp, st, sw, tr) and consonant digraphs (ch, sh, th, wh, ph, ng). Builds on Arc 12-13 read-cvc-words + read-cvce-words foundation. RESOLVES Arc 13 read-cvce-words forward-pointer ('next we extend phonics work to consonant blends and digraphs'). Blends are 2-letter consonant clusters where each letter retains its sound (bl in blue: /b/+/l/); digraphs are 2-letter combinations producing a NEW single sound (sh in ship: /sh/, not /s/+/h/). Critical phonics-decoding bridge enabling complex-word reading. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook: blends vs digraphs distinction. Teacher
      writes 'BL' and 'SH' on the board. "BL is a BLEND — when we
      say it, we hear BOTH letters: /b/-/l/ — blue, black, blanket.
      SH is a DIGRAPH — TWO letters but only ONE sound: /sh/ —
      ship, shoe, sheep. Listen carefully!" Class chants blends
      (bl, br, cl, cr) + digraphs (ch, sh, th, wh) with anchor
      words. Establishes the 2-letters-1-sound vs 2-letters-2-sounds
      distinction.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + word-decoding routine. Each pair receives 12
      picture cards + 12 word cards (mix of blend-words: blue,
      blanket, brown; digraph-words: ship, chair, three; CVC-
      review: cat, dog, sun). Pair takes turns: kid A reads a word
      aloud + identifies the blend or digraph; kid B finds the
      matching picture. Recast errors with sound-stretching ("you
      said /sh-i-p/ — slow it down — /shhh/ — /i/ — /p/. Ship.")
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: word-guess worksheet (kids fill
      blend or digraph in CVCC frames: bl_ck = black; sh_p =
      ship). Station 2: matching worksheet (blend/digraph to
      picture-anchor). Station 3: word-scramble (rearrange letters
      to form blend/digraph words). Station 4: vocabulary-tracing-
      strips for blend/digraph anchor words.
  closure:
    durationMinutes: 5
    body: |
      Whole-class blend/digraph review. Teacher displays picture
      anchors (bl=blue / sh=ship / ch=chair / th=three / st=stop);
      class names blend or digraph + reads associated word.
      Forward-pointer: "Today we read blends + digraphs. When we
      come back next, we'll read longer words with VOWEL TEAMS
      (ai, ee, oa, ie) where TWO vowels work together!"

