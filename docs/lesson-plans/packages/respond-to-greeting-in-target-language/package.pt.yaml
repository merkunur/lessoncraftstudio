# Teaching package — respond to a greeting in target language (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 19 Phase 1.4 per Arc 13 Phase 3 sparse-override pattern).
# pt sparse-override for early-literacy / speaking-and-listening strand.
# Greeting routines in pt-BR follow distinct register patterns: oi (informal),
# olá (neutral), bom dia / boa tarde / boa noite (time-of-day formal),
# tchau (informal farewell), até logo / até amanhã (formal farewell).
# Pt-BR teachers use formal "você" with kids + with family contacts.
# BR-MEC educação infantil register per CLAUDE.md §6 + formal "você"
# address per §17.9. BNCC EI03EO04 + EF01LP01 crosswalk.

title:
  pt: "Oi e Tchau — responder cumprimentos em pt-BR"
description:
  pt: "Pacote de letramento inicial para a educação infantil que ensina crianças a responder apropriadamente a cumprimentos falados em pt-BR. Habilidade oral fundacional para salas de aula K-3 multilíngues — escolas bilíngues no Brasil, programas de imersão pt-BR em escolas internacionais, contextos de família-com-pt-BR-como-segunda-língua. As crianças aprendem as rotinas de cumprimento canônicas pt-BR: oi (informal) / olá (neutro) / bom dia / boa tarde / boa noite / tchau (informal) / até logo (formal). Especificidade pt-BR: o pt-BR tem distinção forte entre cumprimentos informais (oi, tchau) + cumprimentos formais (olá, até logo) + cumprimentos por hora-do-dia (bom dia / boa tarde / boa noite). Crianças brasileiras tipicamente usam 'oi' + 'tchau' entre si + com a família + usam 'bom dia' / 'boa tarde' com adultos não-familiares + em contextos escolares. 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Rotina de oi-e-tchau com toda a turma. A professora ou o
      professor entra na sala + diz 'Bom dia, turma!' As crianças
      respondem 'Bom dia, professora!' Repita 2-3 vezes com energia.
      Em seguida, a professora modela outros cumprimentos pt-BR:
      'Oi!' (crianças respondem 'oi!'); 'Tudo bem?' (crianças
      respondem 'tudo bem!'); 'Tchau!' (crianças respondem 'tchau!').
      Estabelece a estrutura chamada-e-resposta dos cumprimentos —
      todo cumprimento espera uma resposta específica.
      Especificidade pt-BR: enfatize a distinção entre cumprimentos
      INFORMAIS (oi, tchau — usados entre crianças + na família)
      vs cumprimentos FORMAIS (olá, bom dia, até logo — usados com
      adultos + em contextos escolares). Use seu nome formalmente:
      'Bom dia, Maria!' (não 'Oi, Maria!') em saudação à professora.
  contentActivity:
    body: |
      Trabalho em duplas + rotina de role-play. Cada dupla recebe 6
      cartas com cumprimentos pt-BR (oi / olá / bom dia / boa tarde
      / boa noite / tchau). A dupla alterna: criança A escolhe uma
      carta + diz o cumprimento; criança B responde apropriadamente
      ('oi' responde 'oi' ou 'olá'; 'bom dia' responde 'bom dia';
      'tchau' responde 'tchau' ou 'até logo'). Refraseie os erros
      gentilmente ('você disse 'bom dia' quando eu disse 'tchau' —
      ouça de novo: tchau. Quando alguém diz 'tchau', dizemos
      'tchau' de volta, ou 'até logo'. Vamos tentar de novo.').
      Especificidade pt-BR: extensão opcional — encene situações por
      hora-do-dia (chegada na escola pela manhã → 'bom dia'; lanche
      da tarde → 'boa tarde'; antes de dormir → 'boa noite'). pt-BR
      tem 3 cumprimentos por hora-do-dia (en só tem 2: 'good
      morning' + 'good afternoon' + 'good evening'; pt-BR adiciona
      'boa madrugada' em alguns contextos mas raramente para
      crianças).
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios de
      emparelhamento (cumprimento-para-cena — 'bom dia' para cena de
      amanhecer; 'boa noite' para cena de lua-e-estrelas). Estação
      2: folha de exercícios de emparelhamento (cumprimento para sua
      resposta apropriada — 'oi' → 'oi'; 'tudo bem?' → 'tudo bem'!).
      Estação 3: folha de exercícios prepositions com vocabulário de
      contexto-de-cumprimento ('dizemos bom dia NA escola'; 'dizemos
      tchau QUANDO saímos'). Estação 4: vocabulary-tracing-strips
      para palavras-de-cumprimento. As crianças traçam OI / OLÁ / BOM
      DIA / BOA TARDE / BOA NOITE / TCHAU.
  closure:
    body: |
      Rotina de despedida com toda a turma. Cada criança diz 'tchau'
      a uma colega (gire de modo que todas digam oi + tchau a 3-4
      amigas diferentes). Reforça a rotina de cumprimento como
      habilidade relacional genuína — não apenas vocabulário.
      Indicador adiante: "Hoje praticamos dizer oi e tchau em pt-BR.
      Quando voltarmos a conversar juntos na próxima vez,
      aprenderemos a FAZER e RESPONDER perguntas de sim/não — 'Você
      está feliz?' 'Sim, estou feliz!' — para podermos ter pequenas
      conversas sobre sentimentos + tempo + o que gostamos."

assessmentCriteria:
  pt: |
    Responder apropriadamente a 6 de 6 cumprimentos falados pt-BR
    comuns (oi / olá / bom dia / boa tarde / boa noite / tchau) em
    8 de 10 tentativas. Iniciar um cumprimento apropriadamente
    conforme hora-do-dia ou contexto em 7 de 10 oportunidades
    (chegada matinal; lanche da tarde; despedida no fim do dia).
    Distinguir cumprimento de outras falas pt-BR em 8 de 10
    tentativas (reconhecer 'oi' como cumprimento mesmo quando
    cercado por outras palavras desconhecidas).

    Diferenciação:
      - Pré-K (3-5 anos): apenas 3 cumprimentos mais frequentes (oi /
        tchau / bom dia); compreensão receptiva prioritária sobre
        resposta produtiva.
      - Educação infantil (5-7 anos): conjunto completo de 6
        cumprimentos; resposta produtiva independente.
      - 1º ano em diante: estender para registro variado (cumprimentos
        formais vs informais; escolha apropriada do cumprimento por
        contexto: uma professora vs uma colega vs um membro da
        família); ponte para ask-and-answer-yes-no-questions pt-BR
        ('você gosta de...?' / 'sim/não').

compositionalRationale:
  pt: |
    Fio principal: letramento inicial / speaking-and-listening
    (responder a cumprimentos no idioma-alvo — strand-advancement).
    Fio secundário: multilingual-language-awareness (as crianças
    percebem que cumprimentos diferem entre culturas + podem
    reconhecer um cumprimento mesmo quando as palavras diferem). Fio
    terciário: aquisição de vocabulário (cumprimentos em pt-BR).

    Significância arquitetural: aprofunda o fio speaking-and-listening
    pt-BR. Primeira interação oral que uma criança precisa dominar ao
    entrar em ambiente pt-BR — a professora da educação infantil
    ouve 'bom dia, profe!' de uma criança de 4 anos como sinal
    canônico de conforto crescente com o idioma.

    Especificidade pt-BR: as rotinas de cumprimento pt-BR têm
    distinções de registro mais marcadas do que en:

    - **Informal vs formal**: 'oi' + 'tchau' são exclusivamente
      informais — usados entre crianças, com família, com amigos
      próximos. 'olá' + 'até logo' são neutros/formais — usados com
      adultos não-familiares, em escolas, em contextos profissionais.
      Crianças brasileiras aprendem cedo a distinguir: dizer 'oi' a
      uma professora pode parecer desrespeitoso em algumas regiões;
      'bom dia, professora' é a forma canônica.

    - **Por hora-do-dia (3 categorias)**: 'bom dia' (manhã até ~12h);
      'boa tarde' (12h até pôr-do-sol); 'boa noite' (pôr-do-sol em
      diante). Maior granularidade do que en ('good morning' vs
      'good afternoon' vs 'good evening' tem usos sobrepostos).

    - **'Tudo bem?'** como cumprimento-pergunta: pt-BR usa 'tudo
      bem?' como cumprimento-de-saudação que espera resposta 'tudo
      bem!'. Não é literal 'como você está?' (essa seria 'como vai
      você?'); é uma rotina-de-saudação automática.

    Em escolas internacionais com pt-BR como L2 + em programas de
    imersão pt-BR no exterior, crianças falantes de en frequentemente
    confundem registros (dizendo 'oi' a uma professora) ou hora-do-dia
    (dizendo 'bom dia' à tarde). O ensino explícito das rotinas
    canônicas + dos contextos apropriados é fundacional.

    Currículo BNCC EI03EO04 (interagir com adultos demonstrando
    atitudes de respeito + cordialidade); EF01LP01 (identificar +
    produzir cumprimentos apropriados ao contexto).

    Substrato Class B FLEXIBLE: composta contra a amplitude da
    biblioteca de imagens. Cenas pt-BR canônicas: chegada na escola
    + saudação à professora (bom dia); lanche da tarde (boa tarde);
    despedida ao final do dia (tchau / até amanhã); contextos
    familiares (oi mãe / oi pai); reuniões formais (olá).
