compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / logical-reasoning.
    Secondary strand: working-memory + attention (sudoku requires holding
    the rule + the partial grid state in mind simultaneously).

    Architectural significance: validates the sudoku app's integration into
    teaching-package architecture. Different exercise composition shape
    from vocabulary, classification, sorting work — logic-puzzle palette
    weighting (3 of 5 exercises are sudoku at varying difficulty +
    theme). Per Arc 5 ratification 2026-05-08: cognitive-domain packages
    are the first where exercise composition diverges meaningfully from
    Arc 1-3 + Phase 2 patterns; this package validates that divergence.

    Distinctive composition: 4 sudoku exercises across 4 different theme-
    sets (animals, fruits, shapes, vehicles) — same logic-puzzle structure;
    different picture content. Validates that sudoku architecture is
    theme-agnostic at the package layer (per CLAUDE.md §1 SEO flywheel:
    targets are theme-agnostic; theme picked at material-render time).
    matching at position 2 reinforces vocabulary connected to one of the
    theme-sets used in sudoku (animals; the introductory theme).

    Difficulty progression: 2 easy puzzles (positions 1, 3) then 2 medium
    (positions 4, 5). The progression mirrors Arc 1-4 numeracy package
    patterns (introduction → practice → consolidation → assessment) but
    in puzzle-difficulty terms.

    Class B FLEXIBLE substrate: composes against any 4-key picture set;
    Phase 2's identify-2d-shapes-basic CLEAN cluster + Arc 4's pet-animals
    + zoo-animals + farm-animals (Arc 1) all work as picture substrate.
    Substrate-readiness is theme-coverage diversity, not specific keys.

    K-3 multilingual classroom relevance: picture-sudoku is language-
    agnostic at the puzzle level (the rule is logic-only); the picture
    content can support target-language vocabulary acquisition simul-
    taneously (kids name the pictures as they place them — scaffolds
    productive vocabulary). This is the canonical "vocabulary integrated
    with cognitive task" surface.

