# Teaching package — identify fractions (halves, thirds, quarters)
# Arc 18 Phase 1.1 (geometry 8/8 SAT — 23rd saturated strand in catalog; paired with partition-shape-halves-quarters at slot 1). Together with the slot-1 pair partner, this package completes the geometry strand. Builds on slot-1 partition work + Arc 9 identify-2d-shapes-basic + Arc 17 P1.3 compose-shapes-from-parts.

targetSlug: identify-fractions-half-third-quarter
language: en
title:
  en: "Identify Fractions — name the shaded part as half, third, or quarter"

description:
  en: "Grade 1-2 math + geometry package teaching kids to IDENTIFY a partitioned shape by its equal-part name — HALF (one of 2 equal parts), THIRD (one of 3 equal parts), or QUARTER / FOURTH (one of 4 equal parts). Where pair-partner partition-shape-halves-quarters (slot 1) taught the ACTION of partitioning + the named-equal-parts vocabulary in context of cutting wholes, this package teaches RECOGNITION — kids see a partitioned shape WITHOUT seeing the cutting + name the equal-part share. Extends the slot-1 work by adding THIRDS (3 equal parts) — which CCSS.2.G.A.3 introduces at Grade 2 alongside halves + quarters. Critical insight: 'a half' is one of two equal pieces; 'a third' is one of three equal pieces; 'a quarter' is one of four equal pieces. The NUMBER of equal pieces (the denominator concept, informally) determines the NAME. Per §A.13.30 K-foundational-informal framing: K-1-Grade 2 fraction-naming work introduces the equal-part NAMES + the visual structure (counting equal pieces; identifying the shaded share); formal fraction notation (1/2 + 1/3 + 1/4 written symbolically) is Grade 3+ work per CCSS.3.NF.A and explicitly out of scope. CCSS.1.G.A.3 + CCSS.2.G.A.3 dual anchor. Pair partner: partition-shape-halves-quarters (slot 1 of Phase 1.1). Together the pair saturates the geometry strand 8/8 — the 23rd saturated strand in the catalog. 5 worksheet exercises + 7 printable materials over a 1-week unit. Manipulative-cut-outs with vocabKey-enumerated fraction-piece shapes is the load-bearing material — kids physically pick up + sort fraction-pieces by equal-part name."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + equal-part naming review. Teacher
      displays three partitioned shapes side-by-side: a
      circle in halves (2 equal pieces); a circle in thirds
      (3 equal pieces); a circle in quarters (4 equal
      pieces). "Yesterday we learned to CUT shapes into
      equal pieces. Today we learn to NAME them when we
      see them already cut." Teacher points to each in
      turn: "This circle is cut into 2 equal pieces. Each
      piece is a HALF. This circle is cut into 3 equal
      pieces. Each piece is a THIRD. This circle is cut
      into 4 equal pieces. Each piece is a QUARTER — or a
      FOURTH; the two words mean the same thing." Class
      chants: "Two equal pieces — halves! Three equal
      pieces — thirds! Four equal pieces — quarters!"
      Teacher shades one piece of each: "When we see a
      shaded shape like this, we say 'one half is shaded'
      or 'one third is shaded' or 'one quarter is shaded'.
      We can also say 'half of the shape', 'a third of the
      shape', 'a quarter of the shape'." Pattern emphasis:
      "Count the equal pieces. 2 = halves. 3 = thirds.
      4 = quarters."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + fraction-recognition routine with paper
      shape pieces. Each pair receives a mix of partitioned
      shape pieces (whole-circle, half-circle, third-
      circle, quarter-circle; whole-square, half-square,
      third-square, quarter-square; mix of shapes + mix of
      partitions). Pair plays the naming challenge: kid A
      picks any piece from the mix; kid B names the
      partition ('that's a half', 'that's a third', 'that's
      a quarter'). Kid A verifies by counting how many of
      the same piece make a whole (2 of these halves =
      whole; 3 of these thirds = whole; 4 of these quarters
      = whole). Then swap. Recast errors with the equal-
      pieces-counting cue ("How many of these pieces fit
      together to make the whole shape? Two — so each piece
      is a HALF"). Free time at end: kids sort the entire
      pile by equal-part name (halves pile, thirds pile,
      quarters pile). Counting-to-the-whole is the load-
      bearing skill — kids learn to identify the partition
      not by visual similarity but by COUNTING how many
      equal pieces make the whole.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity —
      match each partitioned shape image to its name
      (half, third, quarter). Station 2: missing-pieces
      activity — kids see a shape with one equal-part
      shaded + identify which partition it represents
      (half / third / quarter). Station 3: picture-sort
      activity — sort partitioned shapes into 'halves',
      'thirds', 'quarters' bins. Station 4: math-puzzle
      activity (given a name + a base shape, kids select
      the matching partitioned form). The picture-sort
      at station 3 is the load-bearing diagnostic — kids
      must mentally count the equal pieces in each shape +
      route it to the correct bin.
  closure:
    durationMinutes: 5
    body: |
      Whole-class fraction-recognition quick-recall.
      Teacher displays shapes on the board with one
      equal-part shaded; class chorally names the partition.
      "Circle, 2 equal pieces — half is shaded! Square, 4
      equal pieces — quarter is shaded! Rectangle, 3 equal
      pieces — third is shaded! Circle, 4 equal pieces —
      quarter is shaded!" Teacher asks the diagnostic:
      "What if the shape has 2 pieces but they're NOT
      equal — is one piece a half?" (Class: No! Halves
      have to be EQUAL.) Then: "What if I cut a shape into
      3 equal pieces? What's each piece called?" (Class:
      Third!) Forward-pointer: "Today we named partitioned
      shapes — halves, thirds, quarters. Equal pieces have
      names; the NUMBER of pieces gives the NAME (2 =
      halves; 3 = thirds; 4 = quarters). We've completed
      our GEOMETRY work for K-1! All 8 geometry skills
      learned. Later in school you'll meet FRACTION
      NUMBERS — written like 1/2 or 1/3 or 1/4 — but the
      names you learned today are the foundation. A half
      is always a half, whether you say the word or write
      the number."

