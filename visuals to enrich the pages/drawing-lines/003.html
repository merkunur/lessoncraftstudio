<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Lines - Progression Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; background: linear-gradient(180deg, #E3F2FD 0%, #BBDEFB 50%, #90CAF9 100%); position: relative; overflow: hidden;">

        <!-- Cloud decorations -->
        <div style="position: absolute; top: 60px; left: 80px; width: 120px; height: 50px; background: white; border-radius: 50px; opacity: 0.8;"></div>
        <div style="position: absolute; top: 45px; left: 110px; width: 80px; height: 60px; background: white; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; top: 80px; right: 120px; width: 100px; height: 40px; background: white; border-radius: 40px; opacity: 0.7;"></div>
        <div style="position: absolute; top: 65px; right: 150px; width: 60px; height: 50px; background: white; border-radius: 50%; opacity: 0.7;"></div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 20;">
            <div style="background: linear-gradient(135deg, #FF6B6B 0%, #FF5252 100%); color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; padding: 12px 24px; border-radius: 30px; box-shadow: 0 5px 20px rgba(255,107,107,0.5); transform: rotate(-5deg); border: 3px solid white;">
                FREE!
            </div>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 25px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; color: #1565C0; margin: 0; text-shadow: 2px 2px 0 white;">
                Build Line Skills!
            </h1>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 24px; color: #1976D2; margin: 5px 0 0 0;">
                From Simple to Complex
            </p>
        </div>

        <!-- Staircase Structure -->
        <div style="position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 900px; height: 700px;">

            <!-- Step 1 - Horizontal (Bottom) -->
            <div style="position: absolute; bottom: 0; left: 0;">
                <!-- Platform -->
                <div style="width: 220px; height: 130px; background: linear-gradient(180deg, #81C784 0%, #66BB6A 50%, #4CAF50 100%); border-radius: 15px 15px 20px 20px; box-shadow: 0 10px 30px rgba(76,175,80,0.4); position: relative;">
                    <!-- Platform top highlight -->
                    <div style="position: absolute; top: 0; left: 0; right: 0; height: 20px; background: linear-gradient(180deg, #A5D6A7 0%, transparent 100%); border-radius: 15px 15px 0 0;"></div>
                </div>
                <!-- Worksheet on platform -->
                <div style="position: absolute; bottom: 110px; left: 20px; width: 180px; height: 140px; background: white; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); overflow: hidden; border: 3px solid #4CAF50;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/drawing%20lines/sample-1.jpeg"
                         style="width: 100%; height: 100%; object-fit: cover;" alt="Horizontal lines"/>
                </div>
                <!-- Line type icon -->
                <div style="position: absolute; bottom: 265px; left: 65px; width: 70px; height: 70px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid #4CAF50;">
                    <svg width="40" height="40" viewBox="0 0 40 40"><line x1="5" y1="20" x2="35" y2="20" stroke="#4CAF50" stroke-width="5" stroke-dasharray="6 4"/></svg>
                </div>
                <!-- Badge -->
                <div style="position: absolute; bottom: 345px; left: 30px; background: #4CAF50; color: white; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; padding: 8px 16px; border-radius: 20px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                    START HERE ➡️
                </div>
            </div>

            <!-- Step 2 - Vertical -->
            <div style="position: absolute; bottom: 130px; left: 230px;">
                <!-- Platform -->
                <div style="width: 220px; height: 130px; background: linear-gradient(180deg, #FFE082 0%, #FFD54F 50%, #FFC107 100%); border-radius: 15px 15px 20px 20px; box-shadow: 0 10px 30px rgba(255,193,7,0.4); position: relative;">
                    <div style="position: absolute; top: 0; left: 0; right: 0; height: 20px; background: linear-gradient(180deg, #FFECB3 0%, transparent 100%); border-radius: 15px 15px 0 0;"></div>
                </div>
                <!-- Worksheet -->
                <div style="position: absolute; bottom: 110px; left: 20px; width: 180px; height: 140px; background: white; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); overflow: hidden; border: 3px solid #FFC107;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/drawing%20lines/sample-10.jpeg"
                         style="width: 100%; height: 100%; object-fit: cover;" alt="Vertical lines"/>
                </div>
                <!-- Line type icon -->
                <div style="position: absolute; bottom: 265px; left: 65px; width: 70px; height: 70px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid #FFC107;">
                    <svg width="40" height="40" viewBox="0 0 40 40"><line x1="20" y1="5" x2="20" y2="35" stroke="#FFC107" stroke-width="5" stroke-dasharray="6 4"/></svg>
                </div>
                <!-- Badge -->
                <div style="position: absolute; bottom: 345px; left: 40px; background: #FFC107; color: #5D4037; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; padding: 8px 16px; border-radius: 20px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                    LEVEL UP! ⬆️
                </div>
            </div>

            <!-- Step 3 - Diagonal -->
            <div style="position: absolute; bottom: 260px; left: 460px;">
                <!-- Platform -->
                <div style="width: 220px; height: 130px; background: linear-gradient(180deg, #FFAB91 0%, #FF8A65 50%, #FF7043 100%); border-radius: 15px 15px 20px 20px; box-shadow: 0 10px 30px rgba(255,112,67,0.4); position: relative;">
                    <div style="position: absolute; top: 0; left: 0; right: 0; height: 20px; background: linear-gradient(180deg, #FFCCBC 0%, transparent 100%); border-radius: 15px 15px 0 0;"></div>
                </div>
                <!-- Worksheet -->
                <div style="position: absolute; bottom: 110px; left: 20px; width: 180px; height: 140px; background: white; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); overflow: hidden; border: 3px solid #FF7043;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/drawing%20lines/sample-25.jpeg"
                         style="width: 100%; height: 100%; object-fit: cover;" alt="Diagonal lines"/>
                </div>
                <!-- Line type icon -->
                <div style="position: absolute; bottom: 265px; left: 65px; width: 70px; height: 70px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid #FF7043;">
                    <svg width="40" height="40" viewBox="0 0 40 40"><line x1="8" y1="32" x2="32" y2="8" stroke="#FF7043" stroke-width="5" stroke-dasharray="6 4"/></svg>
                </div>
                <!-- Badge -->
                <div style="position: absolute; bottom: 345px; left: 35px; background: #FF7043; color: white; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; padding: 8px 16px; border-radius: 20px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                    CHALLENGE! 🔥
                </div>
            </div>

            <!-- Step 4 - Curves (Top) -->
            <div style="position: absolute; bottom: 390px; left: 680px;">
                <!-- Platform -->
                <div style="width: 220px; height: 130px; background: linear-gradient(180deg, #CE93D8 0%, #BA68C8 50%, #9C27B0 100%); border-radius: 15px 15px 20px 20px; box-shadow: 0 10px 30px rgba(156,39,176,0.4); position: relative;">
                    <div style="position: absolute; top: 0; left: 0; right: 0; height: 20px; background: linear-gradient(180deg, #E1BEE7 0%, transparent 100%); border-radius: 15px 15px 0 0;"></div>
                </div>
                <!-- Worksheet -->
                <div style="position: absolute; bottom: 110px; left: 20px; width: 180px; height: 140px; background: white; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); overflow: hidden; border: 3px solid #9C27B0;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/drawing%20lines/sample-40.jpeg"
                         style="width: 100%; height: 100%; object-fit: cover;" alt="Curved lines"/>
                </div>
                <!-- Line type icon -->
                <div style="position: absolute; bottom: 265px; left: 65px; width: 70px; height: 70px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid #9C27B0;">
                    <svg width="40" height="40" viewBox="0 0 40 40"><path d="M5 30 Q20 5 35 30" stroke="#9C27B0" stroke-width="5" fill="none" stroke-dasharray="6 4"/></svg>
                </div>
                <!-- Badge -->
                <div style="position: absolute; bottom: 345px; left: 45px; background: linear-gradient(135deg, #9C27B0, #7B1FA2); color: white; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; padding: 8px 16px; border-radius: 20px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                    MASTER! 🏆
                </div>
                <!-- Star burst -->
                <div style="position: absolute; bottom: 395px; left: 80px; font-size: 35px;">⭐</div>
            </div>

            <!-- Connecting arrows -->
            <svg style="position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 900 700">
                <!-- Arrow 1 to 2 -->
                <path d="M200 540 Q280 520 280 480" stroke="#666" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#arrowhead)"/>
                <!-- Arrow 2 to 3 -->
                <path d="M430 410 Q500 390 510 350" stroke="#666" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#arrowhead)"/>
                <!-- Arrow 3 to 4 -->
                <path d="M660 280 Q730 260 740 220" stroke="#666" stroke-width="4" fill="none" stroke-dasharray="8 6" marker-end="url(#arrowhead)"/>
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
                    </marker>
                </defs>
            </svg>
        </div>

        <!-- Bottom info strip -->
        <div style="position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: white; padding: 12px 40px; border-radius: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.15);">
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 20px; color: #37474F; margin: 0;">
                From wobbly to wow — one line at a time ✨
            </p>
        </div>
    </div>
</body>
</html>
