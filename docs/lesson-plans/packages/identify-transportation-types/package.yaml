# Teaching package — classify transportation as land / sea / air
# Arc 5 Phase 2 (world-knowledge / community-and-roles strand). Second
# world-knowledge domain validation; complements classify-animals-by-habitat
# in same Phase 2 by exercising classification architecture across two
# distinct subject areas. Multi-cluster transportation substrate (land + sea
# + air) — all CLEAN against IMAGE_VOCABULARY. Prerequisite: identify-and-
# name-vehicles (Arc 2).

targetSlug: identify-transportation-types
language: en
title:
  en: "Transportation Types — classify vehicles as land, sea, or air"
description:
  en: "Kindergarten-Grade 1 world-knowledge package teaching transportation classification (land / sea / air). Bridges from vehicle-naming (Arc 2 vocabulary work) to environment-aware classification thinking. Composed from existing transportation-land + transportation-sea + transportation-air clusters in IMAGE_VOCABULARY. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher places 3 large mats on the carpet
      labeled "Land," "Sea," "Air." Holds up a vehicle flashcard (car);
      asks "where does the car travel?" Class answers chorally; teacher
      places the card on the Land mat. Repeat with 3-4 mixed-environment
      vehicles (boat → Sea; airplane → Air; train → Land). Establishes the
      3-environment schema visually. Reinforce vocabulary: "land," "sea,"
      "air" — environmental context vocab kids will use across world-
      knowledge work.
  contentActivity:
    durationMinutes: 12
    body: |
      Whole-class sorting routine. Teacher names a vehicle in target
      language; class points to the matching environment-mat. Pair work:
      kid A names a vehicle; kid B says the environment. Recast errors
      ("Yes, a boat travels on the SEA, not on the land — boats need
      water"). Optional extension: kids share a vehicle they've ridden
      (car, school bus, airplane, ferry) to anchor classification in
      personal experience. Discussion question: "What do all sea vehicles
      need?" (water) — bridges to environment-aware reasoning.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (sort vehicle
      cards between two contrasting environments — land vs sea, or land
      vs air). Station 2: matching worksheet (vehicle image-name matching
      to consolidate Arc 2 vocab in classification context). Station 3:
      manipulative cut-outs environment sorting (kids physically place
      cut-out vehicles on the 3 environment mats from warmup).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names a vehicle; kids show with
      hand-signal which environment (point down = land; point sideways
      = sea/water; point up = air). Forward-pointer: "Today we sorted
      vehicles by where they travel. When we come back to community next,
      we'll think about who DRIVES these vehicles — drivers, captains,
      pilots — and where they take us."

