# Teaching package — respond to a greeting in the target language
# Arc 19 Phase 1.4 (early-literacy / speaking-and-listening strand-advancement 4/10 → 5/10).
# K-pre-K foundational; receptive precursor to ask-and-answer-yes-no-
# questions + ask-and-answer-wh-questions. Heavy alignment with the
# platform's K-3 multilingual classroom positioning per CLAUDE.md §1.

targetSlug: respond-to-greeting-in-target-language
language: en
title:
  en: "Hello and Goodbye — answer greetings in your new language"
description:
  en: "Pre-K / Kindergarten speaking-and-listening package teaching kids to respond appropriately to spoken greetings in the language they are learning. Foundational oral-language skill for multilingual K-3 classrooms — international schools, dual-language programs, bilingual European schools, and any setting where children meet adults and peers who speak a language other than their home language. Kids learn the canonical greeting routines: hello / hi / good morning / good afternoon / good night / goodbye / see you tomorrow — plus the appropriate response to each ('hello' answers 'hello'; 'I'm fine, thanks' answers 'how are you'). The package teaches both receptive comprehension (hearing the greeting and recognizing it) and productive response (saying the correct reply back) at K-pre-K-natural register. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hello routine. The teacher walks to the front of
      the room + says 'Good morning, class!' Kids respond 'Good
      morning, teacher!' Repeat 2-3 times with energy. Then teacher
      models other greetings: 'Hello!' (kids reply 'hello!'); 'How
      are you?' (kids reply 'I'm fine, thanks!'); 'Goodbye!' (kids
      reply 'goodbye!'). Establishes the call-and-response shape of
      greetings — every greeting expects a specific reply. Visual
      anchor: poster with 5 greeting pictures + their replies.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + greeting role-play routine. Each pair receives 6
      greeting cards (hello / hi / good morning / good afternoon /
      goodbye / see you tomorrow). Pair takes turns: kid A picks a
      card + says the greeting; kid B responds appropriately ("hi"
      answers "hi" or "hello"; "good morning" answers "good
      morning"; "goodbye" answers "goodbye" or "see you
      tomorrow"). Recast errors gently ("you said 'good morning'
      when I said 'goodbye' — listen again: goodbye. When someone
      says 'goodbye', we say 'goodbye' back, or 'see you tomorrow'.
      Let's try again."). Optional extension: kids role-play
      different times of day (waking-up morning greeting / leaving-
      school goodbye / before-bed goodnight).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (greeting word
      to scene picture — 'good morning' to a sunrise scene; 'good
      night' to a moon-and-stars scene). Station 2: matching
      worksheet (greeting to its appropriate response — 'hello' →
      'hello'; 'how are you' → 'I'm fine'). Station 3: prepositions-
      based worksheet for greeting-context vocabulary ('we say
      good morning AT school'; 'we say goodbye WHEN we leave').
      Station 4: vocabulary-tracing-strips for greeting words.
  closure:
    durationMinutes: 5
    body: |
      Whole-class farewell routine. Each kid says 'goodbye' to a
      classmate (rotate so everyone says hello + goodbye to 3-4
      different friends). Reinforces the greeting routine as a
      genuine relational skill — not just vocabulary. Forward-
      pointer: "Today we practiced saying hello and goodbye in our
      new language. When we come back to talking together next,
      we'll learn to ASK and ANSWER yes/no questions — 'Are you
      happy?' 'Yes, I am happy!' — so we can have small
      conversations about feelings and weather and what we like."

