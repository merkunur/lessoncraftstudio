# Teaching package — identify common materials (wood, plastic, metal, paper, fabric, glass)
# Arc 18 Phase 1.3 (world-knowledge / materials-and-properties — STRAND-OPENER 0/2 → 1/2). First package in the materials-and-properties zero-coverage strand. Pair partner describe-material-properties (the 2nd canonical target in the strand) is a Phase 1.4+ candidate that would saturate the strand 2/2 SAT.

targetSlug: identify-common-materials
language: en
title:
  en: "What's It Made Of? — identify common materials"

description:
  en: "Kindergarten world-knowledge package teaching kids to identify the COMMON MATERIALS that everyday objects are made of: WOOD (chairs, pencils, trees), PLASTIC (toys, bottles, containers), METAL (forks, coins, cars), PAPER (books, notebooks, tissues), FABRIC (clothes, blankets, curtains), and GLASS (windows, drinking glasses, mirrors). Builds on Arc 11 identify-living-vs-nonliving (the broader classification foundation; kids who can sort living vs non-living can now sort non-living objects BY THE MATERIAL THEY ARE MADE OF). STRAND-OPENER for the world-knowledge / materials-and-properties strand (currently 0/2 ZERO-COVERAGE). Phase 1.3 opens the strand to 1/2; describe-material-properties (the 2nd canonical target — describing PROPERTIES of materials like hard/soft, smooth/rough, transparent/opaque) is a Phase 1.4+ candidate that would saturate the strand 2/2 SAT. Per §A.13.30 K-1-informal framing: K materials science is CONCRETE MATERIAL IDENTIFICATION — kids LEARN material vocabulary + RECOGNIZE which material an object is made of by SEEING and TOUCHING + grouping similar materials. NOT formal materials-property classification (which is upper-elementary scope per NGSS 2-PS1 progression). NGSS K-PS1-1 informal anchor ('Plan and conduct an investigation to describe and classify different kinds of materials by their observable properties' — Kindergarten level introduces material-identification as the foundational science skill); CCSS pedagogically aligns at the cross-disciplinary K-3 science-and-literacy bridge. 5 worksheet exercises + 7 printable materials over a 1-week unit. Load-bearing material: manipulative-cut-outs with `mode: variety` enumerating 6 material-type vocabKeys (wood, plastic, metal, paper, fabric, glass) — kids physically sort cut-outs of objects by their material category."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class material-identification introduction.
      Teacher displays 6 everyday classroom objects, one
      per material: a wooden pencil (wood); a plastic
      water bottle (plastic); a metal spoon (metal); a
      paper notebook (paper); a fabric scarf (fabric); a
      glass jar (glass). Teacher picks up each object in
      turn: "What is this pencil made of? WOOD. Wood
      comes from TREES. You can feel that wood is HARD
      and a little ROUGH." Class touches a wooden surface
      (table or block). "What is this water bottle made
      of? PLASTIC. Plastic is HARD but LIGHTER than wood,
      and it's SMOOTH. We use plastic for bottles,
      toys, containers." Continue with each material:
      metal ("HARD, COLD, SHINY — knives, coins, cars"),
      paper ("THIN, can RIP, made from trees but
      different from wood — books, notebooks"), fabric
      ("SOFT, can FOLD, made from cotton or wool or
      silk — clothes, blankets"), glass ("HARD, SMOOTH,
      see-through — windows, drinking glasses"). Pattern
      emphasis: "Every object is MADE OF something.
      Looking at WHAT it's MADE OF tells you about the
      object. Six common materials: WOOD, PLASTIC, METAL,
      PAPER, FABRIC, GLASS."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + material-sorting routine. Each pair
      receives a collection of 12-18 object cards (mix of
      objects made from the 6 materials: 2-3 wooden
      items, 2-3 plastic, 2-3 metal, 2-3 paper, 2-3
      fabric, 2-3 glass) + 6 material category cards
      (WOOD, PLASTIC, METAL, PAPER, FABRIC, GLASS). Pair
      takes turns: kid A picks an object card; kid B
      identifies the material + places the card in the
      matching category. Both kids say aloud: "This [object]
      is made of [material]." Recast errors with material-
      cue ("you put the chair in METAL, but most chairs
      are WOOD — chairs are usually wooden. Some chairs
      ARE metal — metal chairs are usually shinier and
      colder than wooden ones. Let me show you a metal
      chair vs a wooden chair."). Optional extension: kids
      walk around the classroom + find one object of each
      material; report back with "I found a [object] made
      of [material]." Note for the teacher: K kids
      sometimes confuse paper with fabric (both are thin)
      or metal with plastic (some plastics look shiny).
      Explicit side-by-side comparison work supports
      disambiguation. Some objects have MULTIPLE materials
      (a book has paper pages + a cardboard cover; a
      stuffed animal has fabric outside + cotton/plastic
      inside) — for K work, classify by the MAIN material
      visible.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity —
      match each object image to its material word (e.g.,
      pencil → wood; spoon → metal). Station 2: picture-
      sort activity — sort object cards into the 6
      material-category bins; surfaces the categorical
      classification skill. Station 3: missing-pieces —
      complete a partial object image; the kid identifies
      which material the completed object is made of.
      Station 4: matching activity at consolidation
      (object image to material word; reinforces the
      canonical pairing).
  closure:
    durationMinutes: 5
    body: |
      Whole-class material-identification quick-recall.
      Teacher names everyday objects; class chorally
      identifies the material. "Chair? WOOD! Cup? GLASS!
      Coin? METAL! Sweater? FABRIC! Newspaper? PAPER!
      Toy car? PLASTIC! Window? GLASS! Pencil? WOOD!"
      Teacher then poses the material-property diagnostic:
      "Which material is the HARDEST?" (Class: METAL!
      or GLASS! depends on which they consider — both
      are valid.) "Which material is the SOFTEST?"
      (Class: FABRIC!) "Which material can you SEE
      THROUGH?" (Class: GLASS!) Forward-pointer: "Today
      we opened our MATERIALS WORK! We learned 6 common
      materials: WOOD, PLASTIC, METAL, PAPER, FABRIC,
      GLASS. Next we'll learn the PROPERTIES of these
      materials — hard or soft? smooth or rough? see-
      through or not? Materials have PROPERTIES we can
      observe + describe. When we know what something is
      made of + what properties that material has, we
      understand why it's used the way it is — why
      windows are glass, why blankets are fabric, why
      forks are metal. Materials science answers WHY
      our world is built the way it is."

