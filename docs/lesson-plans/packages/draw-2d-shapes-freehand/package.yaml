# Teaching package — draw 2D shapes freehand
# Arc 14 Phase 2 (fine-motor-and-visual-spatial / drawing-and-tracing 3/4 → 4/4 SATURATE).
# Pairs with trace-2d-shapes (Phase 2 sibling); saturates strand at 4/4.

targetSlug: draw-2d-shapes-freehand
language: en
title:
  en: "Draw 2D Shapes Freehand — circles, squares, triangles, rectangles"
description:
  en: "Kindergarten / Grade 1 fine-motor + visual-spatial package teaching kids to DRAW fundamental 2D shapes freehand without tracing-template guides. Builds directly on Arc 14 Phase 2 sibling trace-2d-shapes (which extended drawing-and-tracing 2/4 → 3/4); SATURATES drawing-and-tracing strand at 4/4 — 12th saturated strand on the platform. Freehand drawing is the canonical completion of the drawing-and-tracing pedagogical progression: kids start with line tracing (Arc 9-12 trace-straight-lines + trace-curved-lines) → closed-shape tracing (Phase 2 trace-2d-shapes) → freehand shape drawing (this package). Critical fine-motor + visual-memory bridge enabling subsequent drawing-as-communication work (label-with-noun-phrase, etc.). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + freehand demonstration. Teacher displays a
      blank piece of paper + draws each of 6 shapes (circle,
      square, triangle, rectangle, oval, diamond) freehand on the
      board, narrating: "I start at the top + go all the way around
      back to start — that's a circle. Now I make 4 corners + 4
      sides — square. Now 3 corners + 3 sides — triangle." Class
      watches + makes finger-shapes in the air following along.
      Visual + tactile anchor for freehand drawing without dotted
      guides.
  contentActivity:
    durationMinutes: 12
    body: |
      Independent drawing routine. Each kid receives a worksheet
      with 6 shape-name labels ("circle", "square", etc.) and an
      empty box next to each label (no dotted guides). Kids draw
      each shape freehand in its labeled box. 3 attempts per shape
      = 18 total drawings. Teacher circulates; recasts errors with
      verbal cues + offers tracing-template fallback for kids
      struggling to hold the closed-shape coordination ("if you
      need help, here's a dotted square — but try freehand first").
      Pencil-control + visual-memory feedback individualized.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: shape-recognition matching
      worksheet (review prior arc). Station 2: vocabulary-tracing-
      strips (shape names + dotted shapes for kids needing
      pencil-control reinforcement). Station 3: missing-pieces
      worksheet (which shape is missing — visual-memory work
      relevant to freehand drawing). Station 4: drawing-pad
      independent practice (kids draw their own shape compositions:
      house = square + triangle; sun = circle with lines).
  closure:
    durationMinutes: 5
    body: |
      Whole-class shape-drawing review. Teacher names each shape;
      class draws it on individual mini-whiteboards or in sketchpads
      freehand. Quick visual scan checks freehand quality. "Today
      we DREW shapes by ourselves — no dotted lines! When we come
      back next, we can use our shape-drawing skills to draw
      simple pictures (house, sun, tree) and write our name with
      shape-letters."

