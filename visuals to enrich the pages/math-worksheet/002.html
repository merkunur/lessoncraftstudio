<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPT Thumbnail - Features</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(180deg, #FFFFFF 0%, #F3E8FF 40%, #DBEAFE 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Decorative circles -->
        <div style="position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: rgba(124, 58, 237, 0.08); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: -80px; left: -80px; width: 250px; height: 250px; background: rgba(59, 130, 246, 0.08); border-radius: 50%;"></div>

        <!-- Title -->
        <div style="
            position: absolute;
            top: 35px;
            left: 0;
            right: 0;
            text-align: center;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 64px;
                color: #5B21B6;
                margin: 0;
                text-shadow: 0 3px 6px rgba(91, 33, 182, 0.12);
            ">WHAT'S INSIDE</h1>
        </div>

        <!-- 2x2 Worksheet Grid -->
        <div style="
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 680px;
        ">
            <!-- Worksheet 1 - Animals -->
            <div style="
                background: white;
                border-radius: 16px;
                padding: 10px;
                box-shadow: 0 8px 25px rgba(124, 58, 237, 0.15);
                position: relative;
            ">
                <img src="https://www.lessoncraftstudio.com/samples/english/math%20worksheet/sample-1.jpeg"
                     alt="Animal Theme"
                     style="width: 100%; height: 260px; object-fit: cover; border-radius: 10px;">
                <div style="
                    position: absolute;
                    bottom: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: linear-gradient(135deg, #7C3AED, #6D28D9);
                    padding: 8px 20px;
                    border-radius: 20px;
                    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
                ">
                    <span style="
                        font-family: 'Nunito', sans-serif;
                        font-weight: 700;
                        font-size: 16px;
                        color: white;
                    ">🐧 Animals</span>
                </div>
            </div>

            <!-- Worksheet 2 - Food -->
            <div style="
                background: white;
                border-radius: 16px;
                padding: 10px;
                box-shadow: 0 8px 25px rgba(249, 115, 22, 0.15);
                position: relative;
            ">
                <img src="https://www.lessoncraftstudio.com/samples/english/math%20worksheet/sample-5.jpeg"
                     alt="Food Theme"
                     style="width: 100%; height: 260px; object-fit: cover; border-radius: 10px;">
                <div style="
                    position: absolute;
                    bottom: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: linear-gradient(135deg, #F97316, #EA580C);
                    padding: 8px 20px;
                    border-radius: 20px;
                    box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
                ">
                    <span style="
                        font-family: 'Nunito', sans-serif;
                        font-weight: 700;
                        font-size: 16px;
                        color: white;
                    ">🍪 Food</span>
                </div>
            </div>

            <!-- Worksheet 3 - Dinosaurs -->
            <div style="
                background: white;
                border-radius: 16px;
                padding: 10px;
                box-shadow: 0 8px 25px rgba(59, 130, 246, 0.15);
                position: relative;
            ">
                <img src="https://www.lessoncraftstudio.com/samples/english/math%20worksheet/sample-10.jpeg"
                     alt="Dinosaur Theme"
                     style="width: 100%; height: 260px; object-fit: cover; border-radius: 10px;">
                <div style="
                    position: absolute;
                    bottom: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: linear-gradient(135deg, #3B82F6, #2563EB);
                    padding: 8px 20px;
                    border-radius: 20px;
                    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
                ">
                    <span style="
                        font-family: 'Nunito', sans-serif;
                        font-weight: 700;
                        font-size: 16px;
                        color: white;
                    ">🦕 Dinosaurs</span>
                </div>
            </div>

            <!-- Worksheet 4 - Birds -->
            <div style="
                background: white;
                border-radius: 16px;
                padding: 10px;
                box-shadow: 0 8px 25px rgba(34, 197, 94, 0.15);
                position: relative;
            ">
                <img src="https://www.lessoncraftstudio.com/samples/english/math%20worksheet/sample-15.jpeg"
                     alt="Birds Theme"
                     style="width: 100%; height: 260px; object-fit: cover; border-radius: 10px;">
                <div style="
                    position: absolute;
                    bottom: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: linear-gradient(135deg, #22C55E, #16A34A);
                    padding: 8px 20px;
                    border-radius: 20px;
                    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
                ">
                    <span style="
                        font-family: 'Nunito', sans-serif;
                        font-weight: 700;
                        font-size: 16px;
                        color: white;
                    ">🦜 Birds</span>
                </div>
            </div>
        </div>

        <!-- Feature Checklist -->
        <div style="
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: white;
            padding: 28px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(91, 33, 182, 0.12);
        ">
            <div style="display: flex; align-items: center; gap: 14px;">
                <div style="
                    width: 32px;
                    height: 32px;
                    background: linear-gradient(135deg, #7C3AED, #6D28D9);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                ">
                    <span style="color: white; font-size: 18px;">✓</span>
                </div>
                <span style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 22px;
                    color: #5B21B6;
                ">Multiple Themes for Engagement</span>
            </div>
            <div style="display: flex; align-items: center; gap: 14px;">
                <div style="
                    width: 32px;
                    height: 32px;
                    background: linear-gradient(135deg, #F97316, #EA580C);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                ">
                    <span style="color: white; font-size: 18px;">✓</span>
                </div>
                <span style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 22px;
                    color: #5B21B6;
                ">Answer Keys Included</span>
            </div>
            <div style="display: flex; align-items: center; gap: 14px;">
                <div style="
                    width: 32px;
                    height: 32px;
                    background: linear-gradient(135deg, #3B82F6, #2563EB);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                ">
                    <span style="color: white; font-size: 18px;">✓</span>
                </div>
                <span style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 22px;
                    color: #5B21B6;
                ">Builds Algebraic Thinking</span>
            </div>
            <div style="display: flex; align-items: center; gap: 14px;">
                <div style="
                    width: 32px;
                    height: 32px;
                    background: linear-gradient(135deg, #22C55E, #16A34A);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                ">
                    <span style="color: white; font-size: 18px;">✓</span>
                </div>
                <span style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 22px;
                    color: #5B21B6;
                ">Print & Go Ready</span>
            </div>
        </div>
    </div>
</body>
</html>
