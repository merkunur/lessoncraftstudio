assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Blend onset + rime into a CVC word in 7 of 10 trials.
      - Identify the onset of a heard CVC word ("what's the
        start sound?") in 7 of 10 trials.
      - Identify the rime of a heard CVC word ("what's the
        end chunk?") in 6 of 10 trials.
      - Sort 12 pictures into word-family groups by shared
        rime in 6 of 10 attempts.
      - Generate at least 3 onset substitutions for a given
        rime (extension: -at family → cat/hat/bat/mat) in
        4 of 8 attempts.
      - Use vocabulary 'onset' / 'rime' / 'start sound' /
        'end chunk' / 'word family' correctly in 5 of 10
        productive-language trials.

    Differentiation:
    - Pre-K: focus on rhyme + syllable work first; defer
      onset-rime decomposition to K.
    - K: full onset-rime work with single-consonant onsets;
      defer consonant-cluster onsets (/bl/, /str/) to Grade
      1.
    - Grade 1: extend to consonant-cluster onsets + word-
      family decoding (-at, -an, -in, -ot, -un, -ig, -en
      families); bridge to written word-family decoding
      (read-cvc-words; Arc 6 P1).
    - Grade 2+: extend to multi-syllable onset-rime
      decomposition (compound + multi-syllable words via
      syllable-segmentation then onset-rime within each
      syllable).

