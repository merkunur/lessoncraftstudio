compositionalRationale:
  en: |
    Primary strand: science / community-and-roles (school-staff
    role identification — saturates strand 2/2). Secondary strand:
    vocabulary-acquisition (school-staff role names). Tertiary
    strand: social-and-cultural understanding (recognizing who
    helps in immediate school community).

    Architectural significance: SATURATES community-and-roles
    strand at 2/2 — 13th saturated strand on the platform. Builds
    on Arc 11 identify-community-helpers foundation; extends from
    broad community (firefighter, doctor, police) to school-
    specific staff (teacher, principal, librarian). Critical
    bridge from broad community-roles to immediate-classroom-
    context relevance for K-3 students.

    Distinctive composition: 2 matching + 1 missing-pieces + 1
    pattern-train + 1 matching (cross-theme assessment). Heavy
    role-identification + role-association work; matching
    dominates because role-name + role-task mapping is the
    primary cognitive task.

    Class B FLEXIBLE substrate: composes against occupations +
    classroom themes (occupations image library covers
    professional roles; classroom adds school-specific items).

    K-3 multilingual classroom relevance: school-staff vocabulary
    varied across 11 platform locales — teacher (maestro/maestra
    / Lehrer / lärare); principal (director / Direktor / rector);
    librarian (bibliotecario / Bibliothekar). Most school-staff
    terms cognate Romance + Germanic with locale variations.
    Particularly valuable for multilingual classrooms where
    school-staff vocabulary varies between home-language + school-
    language contexts.

curriculumStandards:
  - CCSS.K.SS.1
