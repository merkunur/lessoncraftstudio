# Teaching package — match an image to its shadow/silhouette
# Arc 6 Phase 2 (Option A vocab-depth) — fine-motor-and-visual-spatial /
# visual-discrimination strand. Vocab-anchored: kids name the image while
# matching it to its shadow. Class B FLEXIBLE; substrate-ready via
# shadow-match app + image-library breadth.

targetSlug: match-image-to-shadow
language: en
title:
  en: "Match Image to Shadow — visual discrimination through silhouettes"
description:
  en: "Pre-K to Kindergarten visual-discrimination package teaching kids to match colored images to their shadow/silhouette outlines. Foundational visual-discrimination skill: kids learn to recognize an object's defining shape independent of its color/texture. Vocab-anchored — naming the image reinforces vocabulary. Composes against shadow-match app + image-library breadth. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up a real object (e.g., a
      cup), shines a flashlight from behind, casts a shadow on a wall.
      Asks "what's the shadow of?" Class identifies. Repeat with 3-4
      objects. Reinforces the conceptual link: object → shadow → object.
      Build vocabulary: "shadow," "silhouette," "outline." Pin to "Visual
      Skills" word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine: teacher shows a colored picture; class names
      it; then teacher shows a corresponding shadow silhouette below; class
      verifies the shadow matches. Pair work: kid A holds a colored card;
      kid B picks a shadow that matches. Recast errors. Optional
      extension: kids look around the classroom for objects, name them,
      describe their shadows ("a chair has 4 legs in its shadow").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: shadow-match worksheet (kids draw
      lines connecting colored images to their shadow silhouettes).
      Station 2: matching worksheet (image-name reinforces image
      vocabulary). Station 3: manipulative cut-outs shadow play (kids
      use cut-outs and a flashlight at the carpet to make their own
      shadows; identify each other's shadows by partner play).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays 3 colored images + 3
      mixed-up shadow silhouettes; class collectively matches them.
      Forward-pointer: "Today we matched pictures to shadows. When we
      come back to visual puzzles next, we'll match pieces to wholes —
      finding the right shaped piece to fit a picture."

