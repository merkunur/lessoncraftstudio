compositionalRationale:
  en: |
    Primary strand: math / measurement (tell time to the hour
    on an analog clock — opens canonical measurement-strand
    sub-track for tell-time work). Secondary strand: math /
    time-and-routine (parallel framing — see cross-reference
    to read-time-on-analog-clock below). Tertiary strand:
    vocabulary-acquisition (clock-reading vocabulary: hour,
    minute, o'clock, hand, clock face).

    Architectural significance: opens the measurement-strand
    tell-time canonical pair (Slot 1 + Slot 4 of Phase 1.4).
    Per learning-targets.json `tell-time-to-the-hour` lives
    in the measurement strand (CCSS.1.MD.B.3); this package
    is its canonical fill. Together with tell-time-to-half-
    hour (Slot 4), it covers the first 2 of 3 tell-time
    canonical targets (tell-time-to-quarter-hour, CCSS.2.MD.
    C.7, is the 3rd; deferred to Phase 1.5+).

    Cross-reference to read-time-on-analog-clock (Arc 15
    Phase 1): the existing read-time-on-analog-clock package
    saturates the cognitive-and-executive-function / time-
    and-routine strand at 4/4 and ALSO covers hour + half-
    hour clock-reading pedagogically. Phase 1.4's tell-time
    pair coexists with that work as a parallel measurement-
    strand framing. The two framings emphasize different
    pedagogical aspects of the same observable activity:
    - read-time-on-analog-clock: clock-reading as a daily-
      life skill (WHEN things happen in the day; schedule
      reading; time-and-routine awareness).
    - tell-time-to-the-hour (this package): clock-reading
      as quantitative measurement (TIME AS A MEASURABLE
      DIMENSION parallel to length, weight, capacity,
      duration). The clock is a measurement instrument that
      reads off the quantity 'time of day'.
    Both framings are valuable; teachers can pull whichever
    framing fits their curriculum context. The two packages
    share material precedents (clock-mat, clock-pieces mode
    on manipulative-cut-outs, time-format labelDisplay on
    flashcards) — the canonical clock-reading material
    infrastructure is shared across both strand framings.

    Pair partner (within Phase 1.4): tell-time-to-half-hour
    (Slot 4) — extends hour-only reading to half-hour
    positions. The two packages share infrastructure and
    composition shape; only the time-content varies (hour
    times vs half-hour times).

    Distinctive composition: 2 matching + 1 chart-count +
    1 math-puzzle + 1 math-worksheet. Matching is load-
    bearing for clock-reading (analog face → digital time
    is the canonical pairing exercise). Chart-count at
    position 2 surfaces the 12-position circular structure
    of the clock face (kids count 1, 2, 3, ... 12 around
    the rim). Math-puzzle work at position 3 inverts the
    pairing (given a digital time, set the analog hands —
    the missing-element shape).

    Class B FLEXIBLE substrate: composes against
    miscellaneous theme (clock-faces don't compose against
    animal/food themes naturally; aligns with read-time-on-
    analog-clock + tens-and-ones-1-to-20 abstract-numerical
    package precedent).

    K-3 multilingual classroom relevance: hour-reading
    universal across K-3 + locale-portable conceptually,
    but the SPOKEN time-expression varies substantially:
    en 'o'clock' is en-specific syntax ('three o'clock');
    de 'es ist drei Uhr' (literally 'it is three clock');
    es 'son las tres' (literally 'they are the three' —
    plural-only construction); pt 'são três horas'
    (literally 'they are three hours'); fr 'il est trois
    heures' (literally 'it is three hours'); fi 'kello on
    kolme' (literally 'clock is three'). The clock-face
    visual is locale-portable; the verbal time-expression
    requires locale-specific adaptation. Locale-variant
    work at Phase 3+ adapts to each locale's time-
    expression idiom.

curriculumStandards:
  - CCSS.1.MD.B.3
  - CCSS.2.MD.C.7
  - EYFS.ELG.M
  - IB-PYP.WhereWeAreInPlaceAndTime

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Read 8 analog clock faces showing hour-only times
        correctly in 7 of 10 trials.
      - Distinguish hour hand from minute hand in 9 of 10
        trials (the SHORT hand is hours; the LONG hand is
        minutes).
      - Set the movable-hand paper clock to a given hour
        time (e.g., 'show me 4 o'clock') in 7 of 10 trials.
      - Use vocabulary 'o'clock' / 'hour hand' / 'minute
        hand' / 'twelve' (the minute-hand-position-at-the-
        hour) correctly in 7 of 10 productive-language
        trials.

    Differentiation:
    - Pre-K: skip analog clock reading; review days-of-week
      + months-of-year sequence first.
    - K: hour-only reading with 4-6 hour positions (1, 3,
      6, 9, 12 are most accessible at K — the cardinal
      compass-point positions); skip half-past entirely.
    - Grade 1: full hour-only reading; movable-hand work
      heavily scaffolded; bridge to tell-time-to-half-hour
      (sibling package).
    - Grade 2+: extend to tell-time-to-quarter-hour (Phase
      1.5+ candidate) + tell-time-to-five-minutes + AM/PM
      distinction + digital clock format.

