compositionalRationale:
  en: |
    Primary strand: world-knowledge / environment-and-weather (day-
    night cycle). Secondary strand: time-and-routine (day-night-cycle
    is the canonical 24-hour time framework). Tertiary strand:
    classification + sorting (day vs night activity sorting).

    Architectural significance: deepens environment-and-weather strand
    2/4 → 3/4. Resolves Arc 10 identify-four-seasons forward-pointer.
    Strand cohort: identify-and-name-weather-words (Arc 8) + identify-
    four-seasons (Arc 10) + identify-weather-types (Arc 11) + describe-
    day-night-cycle (this); 1 unauthored (describe-water-cycle-basic).

    K-3 multilingual classroom relevance: day-night cycle universal
    across all 11 platform locales; vocabulary cognate-rich Romance
    (día/dia/jour; noche/noite/nuit).

