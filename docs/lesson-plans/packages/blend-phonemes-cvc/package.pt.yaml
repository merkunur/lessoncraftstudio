# Teaching package — blend phonemes into CVC words (pt sparse-override)
# Arc 19 Phase 1.2 Slot 4 (24th-consecutive arc pt cadence per Arc 7+ convention; pt cadence increments per-arc, not per-package; all 4 Phase 1.2 pt variants share the same Arc-19 cadence anchor). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF01LP06 (consciência fonológica) + EF01LP08 (relação fonema-grafema). **Phonological-awareness pedagogy is locale-specific — blending pedagogy differs structurally: pt-BR is traditionally syllable-blending-dominant (gato = ga+to) per BR-MEC framework, NOT phoneme-blending-dominant (cat = c+a+t) like English.** §A.13.34 locale-canonical-curriculum-divergence sub-class applies — sparse-override locked per Phase 1.1 precedent; FULL-OVERRIDE flagged as future-arc candidate because syllabic-vs-phonemic blending divergence is most structurally distinct of the 3 phoneme-isolation/synthesis positions.

targetSlug: blend-phonemes-cvc
language: pt

title:
  pt: "Juntar Sons — combinando sons para formar uma palavra"

description:
  pt: "Pacote de alfabetização para a educação infantil brasileira (5-7 anos) ensinando crianças a COMBINAR fonemas individuais em palavras CVC faladas. Operação inversa direta do cluster de isolamento (Phase 1.1 Slot 3 isolate-initial + Phase 1.2 Slot 2 isolate-final + Phase 1.2 Slot 3 isolate-medial): as crianças ouvem /g/ + /a/ + /t/ + /u/ + suavemente os combinam em 'gato'. Pedagogia do lado de síntese: onde isolamento separa uma palavra, combinação JUNTA sons. O strand de phonological-awareness avança 6/9 → 7/9. Por learning-targets.json linha 40 pré-requisitos: isolate-initial-phoneme (Phase 1.1 ✓ ENVIADO) + isolate-final-phoneme (Phase 1.2 Slot 2; envia simultaneamente). **NOTA pt-BR ESTRUTURALMENTE CRÍTICA: pt-BR é tradicionalmente SÍLABA-BLENDING-DOMINANTE (gato = ga+to) per BR-MEC framework, NÃO fonema-blending-dominante (cat = c+a+t) como inglês.** Este pacote adapta a pedagogia: ensina FONEMA-BLENDING explicitamente como ponte para decodificação fônica + introduz SÍLABA-BLENDING canônica pt-BR como abordagem irmã. Por §A.13.30 enquadramento informal K-1: trabalho de combinação no K é COMBINAÇÃO-DE-SOM CONCRETA via progressão lenta-para-rápida — você diz /g/.../a/.../t/.../u/ devagar então acelera + a palavra emerge 'gato'. Alinhamento BNCC: EF01LP06 (consciência fonológica) + EF01LP08 (relação fonema-grafema). 5 exercícios + 8 materiais imprimíveis ao longo de 1 semana."

structure:
  warmup:
    body: |
      Atividade combinação com toda a turma. Você demonstra
      combinação de fonemas dramaticamente: "Eu vou dizer 4
      sons devagar, depois COMBINÁ-los em uma palavra. Escutem:
      /g/.../a/.../t/.../u/. Que palavra? /g-a-t-u/. GATO!" As
      crianças notam o truque: sons separados → palavra
      combinada. Repete com: "/p/.../a/.../t/.../u/. Que palavra?
      /p-a-t-u/. PATO!" "/s/.../o/.../l/. /s-o-l/. SOL!" Ênfase
      do padrão: "Quando COMBINAMOS sons, nós os colocamos
      JUNTOS. Sons separados se tornam UMA PALAVRA. É como
      deslizar os sons juntos até fazerem uma palavra que
      conhecemos." Enquadramento pedagógico crítico — a
      operação-inversa: "Nas últimas semanas SEPARAMOS palavras
      em sons. Esta semana estamos colocando sons JUNTOS para
      fazer palavras. Mesmos sons — direção oposta." Visualização
      opcional: você levanta 4 dedos para /g/ /a/ /t/ /u/
      depois junta as mãos ao dizer GATO. **Nota didática pt-
      BR: em pt-BR canônico, dizemos também 'GA-TO' (sílabas)
      como ponte natural — escolas brasileiras frequentemente
      ensinam sílaba-blending primeiro, depois fonema-blending.
      Este pacote ensina fonema-blending como abordagem técnica
      para preparação fônica + mantém sílaba-blending como
      referência didática.**
  contentActivity:
    body: |
      Trabalho em duplas + rotina de combinação lenta-para-
      rápida. Cada dupla recebe 8 cartões-de-imagem com
      vocabulário CVC (gato, pato, peixe, mão, sol, mel, pão,
      cão). A dupla se reveza: a criança A dá os 3-4 fonemas
      DEVAGAR ("/g/.../a/.../t/.../u/"); a criança B combina
      os fonemas + nomeia a palavra ilustrada ('gato').
      Técnica pedagógica crítica: progressão LENTA-PARA-RÁPIDA.
      Começar com fonemas separados por pausa de ~1 segundo;
      acelerar progressivamente até os fonemas se tocarem
      ('/g-a-t-u/'); então a palavra emerge ('gato'). Crianças
      que têm dificuldade com combinação se beneficiam de
      modelo do professor da transição lenta-para-rápida
      explicitamente + co-combinação ao lado da criança
      ("vamos combinar juntos: /g/.../a/.../t/.../u/. /g-a-t-u/.
      GATO!"). Recapture erros via RE-MODELO — NÃO correção —
      porque combinação é uma habilidade de integração
      cognitiva que se fortalece através da repetição mais do
      que através da correção. Padrões comuns de erro: (a)
      manter fonemas separados mesmo em ritmo rápido ("/g/,
      /a/, /t/, /u/" com pausas entre — ensine o deslize
      suave); (b) substituir um fonema similar durante
      combinação ("/g/.../a/.../t/.../u/" → 'gota' — re-modele
      com ênfase vocálica; o trabalho de isolamento-medial do
      Slot 3 apoia isso); (c) reverter ordem de fonema.
      **Apoio sílaba-blending pt-BR: muitas crianças pt-BR K-1
      têm fluência sílaba-blending primeiro (ga-to → gato).
      Use esse fundamento: ensine 'agora vamos puxar mais
      perto — em vez de GA-TO, dizemos /g/+/a/+/t/+/u/, são
      OS MESMOS sons mas mais devagar'. Sílabas pt-BR
      decompõem em fonemas — esta é a transição.** Extensão
      opcional: a criança A diz os fonemas RÁPIDO + a criança
      B identifica a palavra; troque papéis. Algumas crianças
      se beneficiam de combinação MOVIMENTO-CORPORAL (uma
      palma por fonema depois junte em um deslize).
  scaffold:
    body: |
      Rotação por estações. Estação 1: folha word-guess (as
      crianças preenchem uma palavra CVC dadas pistas de
      fonemas separados — ponte de combinação a decodificação).
      Estação 2: folha de emparelhamento (pista-de-3/4-fonemas
      → imagem CVC; as crianças combinam pista de fonema-
      separado à figura-da-palavra-resultante). Estação 3:
      folha picture-sort (as crianças classificam imagens CVC
      por correspondência de fonema-inicial-ou-final — reforça
      consciência fonêmica que apoia combinação). Estação 4:
      folha word-scramble (as crianças desembaralham palavras
      CVC; a pedagogia de embaralhar-depois-remontar paraleliza
      combinação — colocar partes de volta em um todo).
  closure:
    body: |
      Recapitulação rápida de combinação + relatório de status-
      de-cluster com toda a turma. Você dá 3-4 fonemas
      separados; a turma grita a palavra combinada.
      "/s/.../o/.../l/" → SOL! "/p/.../a/.../u/" → PAU!
      "/g/.../a/.../t/.../u/" → GATO! "/m/.../e/.../l/" →
      MEL! Você então relata o progresso phono-awareness:
      "Aprendemos a ISOLAR sons nas posições inicial, do meio,
      E final de uma palavra. Aprendemos a COMBINAR sons
      juntos para fazer uma palavra. Essas são 4 das 5
      principais habilidades de consciência fonológica — rima
      foi a 1.ª (Arc 10), contagem de sílabas foi a 2.ª,
      isolamento-de-fonema foi a 3.ª (Slots 3+2+3 de Phase
      1.1/1.2), combinação é a 4.ª. A seguir aprenderemos a
      5.ª: SEGMENTAÇÃO — separar palavras em sons distintos.
      Combinação junta; segmentação separa. Mesma habilidade,
      direção oposta. Estamos quase terminando consciência
      fonológica!"

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Combinar 3-4 fonemas falados separadamente em uma
        palavra CVC em 7 de 10 tentativas.
      - Combinar em ritmo lento (separação de 1 segundo) em 8
        de 10 tentativas.
      - Combinar em ritmo rápido (sem separação) em 6 de 10
        tentativas.
      - Combinar uma pista de 3-4 fonemas (ouvida separadamente)
        à imagem CVC correta em 7 de 10 tentativas.
      - Usar o vocabulário 'combinar' / 'juntar sons' / 'deslizar
        sons juntos' corretamente em 5 de 10 tentativas de
        produção verbal.
      - PRODUZIR uma palavra CVC a partir de 3-4 fonemas
        separados dados oralmente (não apenas RECONHECER) em
        5 de 8 tentativas.
      - Demonstrar transição sílaba-blending → fonema-blending
        para o mesmo conjunto de palavras (extensão pt-BR
        canônica) em 5 de 10 tentativas.

    Diferenciação:
    - Pré-escola: foco em sílaba-blending + trabalho de rima
      primeiro; adiar fonema-blending para o K.
    - Educação infantil (5-7 anos): combinação de fonemas CVC
      de 3-4 sons com progressão lenta-para-rápida; adiar
      combinação de início consonantal-cluster (raro em pt-
      BR; encontros não-canônicos K-1) + combinação de 5+
      fonemas para o 1.º ano EF.
    - 1.º ano EF: combinação CVC completa + introdução de
      combinação de encontro consonantal (pr-, br-, tr- em
      palavras como 'prato', 'bravo', 'três') + ponte para
      decodificação CVC escrita (read-cvc-words; Arc 6 P1).
    - 2.º ano EF em diante: estender para combinação multi-
      silábica (palavras compostas; palavras de 2 sílabas via
      sílaba-blending depois fonema-blending dentro de
      sílabas); ponte para decodificação fluente de palavras
      multi-silábicas.

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en). Os
    campos materials, composedExercises, curriculumStandards
    e learningObjectives são herdados do package.yaml via
    merge sparse-override e não são repetidos aqui per a
    convenção Arc 7+.

    **NOTA LOCALE-CRÍTICA: estratégia de blending pt-BR difere
    ESTRUTURALMENTE do inglês — esta é uma divergência locale-
    canônica fundamental.** Padrões de blending em português
    brasileiro:
    - **Sílaba-blending dominante:** pt-BR tradicionalmente
      ensina blending no nível silábico (CV unidades). 'Gato'
      = 'ga' + 'to' (2 sílabas), NÃO /g/+/a/+/t/+/u/ (4
      fonemas). Sílaba-blending é a abordagem canônica pt-BR
      per BR-MEC framework + 'método-fônico-silábico' brasileiro.
    - **Fonema-blending introduzido posteriormente:** após
      sílaba-blending estabelecido, fonema-blending pode ser
      introduzido como técnica de decodificação fônica avançada.
      Esta é tipicamente pedagogia do 1.º-2.º ano EF brasileiro.
    - **Estrutura silábica CV-dominante:** pt-BR favorece
      sílabas CV-abertas (terminadas em vogal). Sílabas CVC
      (terminadas em consoante) são menos frequentes que em
      inglês. Fonema-blending CVC en (cat) tem equivalente pt-
      BR mais raro (sol /sol/, mal /mal/) ou requer sílaba
      tônica CV+coda.
    - **Encontros consonantais iniciais:** pt-BR tem encontros
      consonantais iniciais (pr-, br-, tr-, cl-, fl-) que
      requerem blending consonant-cluster. Estes são tipicamente
      trabalho do 1.º-2.º ano EF + são canônicos pt-BR.
    - **Total: divergência estrutural significativa entre
      pedagogia pt-BR sílaba-dominante + pedagogia inglês
      fonema-dominante** para mesmo objetivo (decodificação
      sistemática).

    Famílias-de-blending pt-BR canônicas K-1 EF:
    - **Sílaba CV simples:** ga-to → gato; pa-to → pato; me-sa
      → mesa
    - **Sílaba CV+CV+CV:** sa-pa-to → sapato; ba-na-na → banana
    - **Sílaba CVC:** sol, mar, lar (raras em pt-BR K-1; foco
      em sílabas tônicas)
    - **Encontros consonantais iniciais:** pra-to → prato;
      brin-co → brinco; tres → três (diferido a 1.º-2.º ano
      EF na maioria das pedagogias brasileiras)

    Vocabulário pt-BR canônico para combinação K-1:
    - 'combinar' (to combine) — pt-BR canônico
    - 'juntar' (to join together) — pt-BR canônico mais
      simples K-1
    - 'sons juntos' (sounds together) — pt-BR canônico
    - 'deslizar' (to slide) — metáfora pedagógica pt-BR para
      blending suave
    - 'sílaba' (syllable) — fundacional pt-BR
    - 'fonema' (phoneme) — técnico pt-BR; introduzido apenas
      quando a turma adquiriu vocabulário formal
    - 'CVC' / 'CV' (consonant-vowel patterns) — pt-BR usa
      mesma notação técnica
    - Frases-modelo K-1: "Vamos juntar os sons: ga + to =
      GATO." / "Sons juntos formam palavras." / "Deslizando
      os sons: /g-a-t-u/, gato!"

    Particularidade pt-BR para abordagem pedagógica:
    Português-BR K-1 EF tradicionalmente integra sílaba-
    blending + fonema-blending como abordagens irmãs em vez
    de sequenciais. Pedagogias brasileiras modernas
    frequentemente apresentam ambas: sílaba-blending para
    palavras canônicas + fonema-blending para decodificação
    técnica + transição entre as duas conforme apropriado.
    Este pacote pode ser ensinado em qualquer ordem (sílaba
    primeiro depois fonema, OU fonema primeiro depois sílaba)
    dependendo da abordagem pedagógica da escola.

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF01LP06 ('Segmentar oralmente palavras em sílabas') é o
    anchor BNCC do 1.º ano EF para consciência silábica.
    EF01LP08 ('Relacionar elementos sonoros — sílabas, fonemas,
    partes de palavras — com sua representação escrita') é o
    anchor BNCC para fonema-blending + relação fonema-grafema.
    EF02LP02 ('Segmentar palavras em sílabas e remover e
    substituir sílabas iniciais, mediais ou finais para criar
    novas palavras') estende para manipulação silábica no 2.º
    ano EF — operação inversa de sílaba-blending. Juntas,
    EF01LP06 + EF01LP08 + EF02LP02 cobrem a progressão
    blending → segmentação para sílabas + fonemas.

    Currículo brasileiro K-1 EF para blending:
    A BNCC brasileira EF Língua Portuguesa Anos Iniciais
    coloca o blending entre as competências fundacionais de
    alfabetização K-1. O 'método fônico silábico' brasileiro
    enfatiza sílaba-blending primeiro com transição gradual
    para fonema-blending. Este pacote alinha com abordagem
    integrada que respeita a estrutura silábica pt-BR enquanto
    introduz fonema-blending como técnica complementar.

    Por §A.13.30 enquadramento informal K-1: este pacote NÃO
    ensina teoria formal de processamento fonológico
    (modelo do dual-route de decodificação; processamento
    parallel-distributed são trabalho de pesquisa pós-graduada).
    A ênfase do K-1 é COMBINAÇÃO-DE-SOM CONCRETA via
    progressão lenta-para-rápida + transição sílaba-fonema.

    Pacote pair-coherent com Phase 1.2 Slots 2+3 isolate-final/
    medial-phoneme + Phase 1.1 Slot 3 isolate-initial-phoneme
    (já enviado): completa o cluster de isolamento +
    introdução-de-síntese + avança o strand phonological-
    awareness 4/9 → 7/9 (77.8%). Posiciona Phase 1.3 para
    SAT-fechamento do strand com segmentation + blend-onset-
    rime.

    **§A.13.34 sub-class adjudication — locale-canonical-
    curriculum-divergence:**
    Phonological-awareness pedagogy has structural divergence
    between English + pt-BR (English consonant-final-dominance
    rhyme + CVC phoneme inventory vs pt-BR vowel-ending-
    dominance + nasal-vowel rhyme + 7 oral + 5 nasal vowel
    phonemes). **For blending pedagogy specifically the
    divergence is most pedagogically significant: pt-BR is
    syllabic-blending-dominant per BR-MEC framework vs English
    phonemic-blending-dominant. Same skill (combining sounds)
    operates on DIFFERENT-SIZED units (syllables vs phonemes).**
    This is a canonical §A.13.34 locale-canonical-curriculum-
    divergence case. SPARSE-OVERRIDE locked for current
    commission per minimal-amendment principle (structure body
    + assessmentCriteria + compositionalRationale.pt carry pt-
    BR-specific pedagogical content including syllable-blending
    + phoneme-blending integration approach; materials +
    composedExercises pedagogically translate cleanly across
    locale-divergence because the underlying app surfaces are
    locale-portable at the mechanic level even when the
    canonical pedagogical sequencing diverges). **FULL-OVERRIDE
    strongly flagged as future-arc candidate** when Phase 1.3
    phonological-awareness continuation OR a dedicated pt-BR-
    syllable-pedagogy commission justifies full re-authoring
    of materials + composedExercises against pt-BR syllable-
    blending canonical pedagogy.

    Per §A.13.36 cadência de cooperação CC↔assistant: o
    pacote pt herda materials, composedExercises,
    curriculumStandards via sparse-override per convenção
    Arc 7+; quaisquer emendas en (se Round 2 surgir) se
    propagam automaticamente para esta variante pt.
