compositionalRationale:
  en: |
    Primary strand: math / place-value (tens-and-ones for 21-50;
    deepens Phase 1 foundation 1/8 → 2/8). Secondary strand:
    numeracy (counting + number-recognition for 21-50 range).
    Tertiary strand: cognitive-and-executive-function / pattern-
    recognition (extending tens-and-ones pattern from 1-2 tens to
    2-5 tens).

    Architectural significance: deepens place-value strand from
    1/8 to 2/8 at Phase 2 close. Builds directly on Arc 15 Phase
    1 tens-and-ones-1-to-20 foundation; extends pattern to
    multi-tens-place numbers. Critical scaling work — pattern-
    generalization from 1-tens (10-20) to 2-5-tens (21-50).
    Foundation for full place-value-to-100 + later place-value-
    with-regrouping (addition + subtraction).

    Distinctive composition: 1 matching + 2 math-puzzle
    (decomposition) + 1 pattern-train + 1 more-less. Place-value
    decomposition + comparison emphasized; sequencing work
    reinforces 10s-place pattern.

    Class B FLEXIBLE substrate: composes against miscellaneous
    theme; place-value work uses abstract numerical representation.

    K-3 multilingual classroom relevance: place-value concept
    universal across 11 platform locales. Number-word patterns
    for 21-50 vary: en regular "twenty-one through fifty"; es
    "veintiuno-veintidós-veintitrés..." (compound); de
    "einundzwanzig" (reverse: "one-and-twenty"); fi
    agglutinative. Locale-variant work at Phase 3+ adapts to
    each locale's two-digit number-word system.

