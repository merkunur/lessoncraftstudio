targetSlug: identify-and-name-10-farm-animals
language: es

title:
  es: "Animales de granja — identifica y nombra 10"
description:
  es: "Paquete de adquisición de vocabulario para K-Primer Grado sobre 10 animales de granja universales: vaca, oveja, cerdo, gallina, gallo, caballo, pato, cabra, conejo, burro. Compone 5 ejercicios de hoja de trabajo y 8 materiales imprimibles a lo largo de una unidad de 1-2 semanas. Diseñado para aulas K-3 multilingües — el operador selecciona el idioma de instrucción al renderizar los materiales; el vocabulario se resuelve automáticamente a través de los datos IMAGE_VOCABULARY de 11 locales."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Reúna a los niños en la alfombra. Levante las tarjetas didácticas una por una,
      diga el nombre de cada animal en español, la clase repite a coro. Después
      de la introducción, fije las tarjetas en el muro de palabras agrupadas en
      "Animales de granja".
  contentActivity:
    durationMinutes: 12
    body: |
      Rutina del bolsillo de pared con tiras de oraciones ("Veo una vaca", "Veo un
      cerdo", etc.). Primero lectura coral, luego lecturas individuales. Trabajo
      en parejas: los niños sujetan una tarjeta de imagen, el compañero nombra el
      animal en español. Reformule los errores en la estructura modelo (si el niño
      dice "es vaca", reformule a "veo una vaca").
  scaffold:
    durationMinutes: 8
    body: |
      Rotación de estaciones. Estación 1: hoja de emparejamiento imagen-letra
      (aplicación matching, modo letra) — los niños emparejan cada animal con
      su letra inicial. Estación 2: clasificación de tarjetas de imagen en la
      alfombra (animales de granja vs otros animales). Estación 3: recortes
      manipulables para contar (cuente N animales de granja).
  closure:
    durationMinutes: 5
    body: |
      Puesta en común con toda la clase. Un último desafío: la maestra o el maestro
      nombra un animal, los niños señalan la tarjeta correspondiente. Nombre el
      patrón: "Hoy aprendimos los nombres de 10 animales de granja. Cuando
      volvamos a los animales de granja la próxima vez, este mismo conjunto
      estará aquí para nosotros."

