thematicCoherence:
  en: |
    All 4 packages cohere around the dinosaurs theme + form a
    cross-strand bundle anchored at dinosaur vocabulary +
    classification work.

    **Pedagogical sequencing:**
    1. **identify-and-name-action-verbs** — Action vocabulary
       anchored at dinosaur-specific verbs (roar, stomp, hunt,
       graze, hatch, swim, glide). Same shared package across
       occupations + toys + pets + birds + camping + dinosaurs
       (6 bundles). Dinosaur action verbs particularly engaging
       for K-3 (dramatic + observable in media).
    2. **classify-animals-by-diet** — Cognitive classification
       using dinosaur-diet contrasts (T-rex = carnivore; bronto-
       saurus = herbivore; omnivores = some dinosaurs). Same
       shared package across animals + farm-animals + pets +
       dinosaurs. Dinosaur-diet classification combines vocab
       (dinosaur names) + biology (diet categories).
    3. **identify-living-vs-nonliving** — Biological-reasoning
       work with unique twist: dinosaurs WERE living things; now
       they are extinct. Pairs naturally with the past-tense
       concept. Same shared package across 7 prior bundles;
       dinosaurs add 8th use. Special pedagogical opportunity:
       dinosaur-extinction discussion bridges living-vs-nonliving
       to past-vs-present distinction.
    4. **find-hidden-target-in-busy-scene** — Visual-discrimination
       work in prehistoric scenes. Spot a stegosaurus in busy
       Jurassic forest; spot a flying pterodactyl in sky-scene.
       Same shared package across vehicles + insects + ocean-life
       + birds (4 bundles); dinosaurs add 5th.

    **Strand spread:** 1 vocabulary-acquisition + 1 cognitive-
    sorting (diet) + 1 world-knowledge (living things; extinction
    concept) + 1 visual-discrimination. 4 distinct strands;
    cross-strand pattern.

    **Suggested unit duration:** 4 weeks (1 package per week).
    Dinosaur-themed creative writing + drawing + museum-trip
    extensions natural fit. High K-3 engagement (dinosaur topic
    is canonical K-3 high-interest).

    **Multilingual classroom relevance:** dinosaur vocabulary
    universally cognate across 11 platform locales (dinosaur /
    dinosaurio / dinosauro / Dinosaurier — all Greek-derived).
    Specific dinosaur names (Tyrannosaurus, Stegosaurus) are
    scientific Latin-cognate universal. Cross-locale lesson-plan
    delivery exceptionally clean for this bundle.

    **Pillar 2 architectural pattern:** dinosaurs-bundle COMPLETES
    the 8th animal-related bundle at Pillar 2 Arc 4 Phase 2 close
    (animals + farm-animals + pets + birds + insects + ocean-life
    + forest-creatures + dinosaurs). Animals theme cluster
    demonstrates extensive sub-theme expansion sustainable to 8+
    bundles. Sub-theme dimensions covered: habitat (farm-animals,
    forest-creatures, ocean-life); domestication (pets, farm-
    animals); biological-class (birds, insects); temporal (extinct
    via dinosaurs). Each sub-theme bundle uses distinct package
    combinations from shared package pool.
