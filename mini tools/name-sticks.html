<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Name Sticks — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=18">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. Rosters live ONLY in this device's
       storage (lcs:my-classes:v1) — names are never transmitted. -->
  <script src="/mini-tools/lcs-shell.js?v=4"></script>
  <script src="/mini-tools/name-sticks.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=sv  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1 / ?embed=compact
    // Tool-specific deep links: ?mode=groups | ?cups=<2-6> | ?class=<id>
    // (Never any name data in URLs.)
    LCS.mount(NameSticks, { mount: '#lcs-root' });
  </script>
</body>
</html>
