compositionalRationale:
  en: |
    Primary strand: science / materials-and-properties (natural-
    vs-manmade classification — founds strand at 1/2). Secondary
    strand: cognitive-and-executive-function / sorting-and-
    classification (binary classification work). Tertiary strand:
    vocabulary-acquisition (materials vocabulary: natural, manmade,
    wood, stone, plastic, metal, paper, fabric).

    Architectural significance: founds the materials-and-properties
    strand at 1/2 — second strand foundation established at Arc 15
    Phase 1+2 (numeral-recognition + place-value at Phase 1; this
    package founds materials-and-properties at Phase 2). Critical
    bridge from observation-of-objects to source-classification
    thinking. Connects to forest-creatures-bundle + camping-bundle
    (nature contexts) + classroom-bundle (manmade objects); cross-
    bundle pedagogical coherence.

    Distinctive composition: 2 picture-sort (binary classification)
    + 2 matching + 1 odd-one-out. Classification-focused exercise
    composition; sorting-emphasis throughout.

    Class B FLEXIBLE substrate: composes against miscellaneous +
    classroom themes (mix of natural + manmade everyday objects).

    K-3 multilingual classroom relevance: natural-vs-manmade
    classification is universal across 11 platform locales.
    Vocabulary varies: "natural" universally cognate (natural /
    naturel / natural); "manmade" varies more (artificial /
    manufactured / man-made / hecho-por-el-hombre / fabriqué /
    künstlich). Locale-variant work at Phase 3+ adapts to each
    locale's materials-vocabulary register.

