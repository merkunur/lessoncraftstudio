  - IB-PYP.SharingThePlanet

assessmentCriteria:
  en: |
    Receptive 10/10; productive 8/10; frame use 6/10.

    Differentiation:
    - Pre-K: receptive only (point-to-named-vegetable).
    - K / Grade 1: full productive + sentence-frame use.
    - Grade 2+: extend to vegetable-color categorization (red/orange/green/
      yellow/purple vegetables) + nutrition vocabulary (vegetables we eat raw,
      vegetables we cook) + preference conversation.

