compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (subtraction within
    10 — extends strand by deepening subtraction coverage).
    Secondary strand: numeracy (count-back strategy; mental-math
    foundations). Tertiary strand: vocabulary-acquisition
    (subtraction vocabulary continuing from subtract-within-5).

    Architectural significance: extends subtract-within-5 (Phase 4
    sibling) into within-10 range. Builds on Arc 12 add-within-10
    inverse operation. Critical bridge from finger-counting
    subtraction to mental subtraction; enables subtraction
    strategies beyond 1-to-1 finger correspondence (count-back;
    decomposition).

    Distinctive composition: 2 math-worksheet (vertical format) +
    1 subtraction (cross-out) + 1 math-puzzle (missing-operand
    introduction) + 1 matching. Math-puzzle introduces missing-
    operand subtraction (10-?=6; ?-3=4) preparing for algebraic-
    thinking foundations.

    Class B FLEXIBLE substrate: composes against foods theme
    (foods countable for subtraction work; cross-arc with subtract-
    within-5's animals theme).

    K-3 multilingual classroom relevance: subtraction within 10 is
    universal K-3 math content across 11 platform locales. Number
    words varied (one/uno/uno/один — Romance partial-cognate;
    Germanic numbers distinct). Locale-variant work at Phase 3+
    adapts to each locale's number-word system.

