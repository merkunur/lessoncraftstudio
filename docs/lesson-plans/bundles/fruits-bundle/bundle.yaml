title:
  en: "Fruits — Complete K-3 Bundle"

description:
  en: "Comprehensive K-3 bundle centered on fruits vocabulary + counting + plant-as-living-thing science. 4 packages span vocabulary-acquisition (identify-and-name-fruits) + early-numeracy counting (count-objects-1-to-10 — fruits as canonical counting subjects) + world-knowledge living-things (describe-plant-life-cycle — fruits ARE the produce stage of plant life-cycle) + cognitive sorting (sort-by-color — fruits theme rich in color contrasts). Cross-strand bundle composition demonstrates how a single theme (fruits) can anchor work across 4 distinct strands. Suitable for a 4-week classroom unit on fruits + healthy-eating + plant-science."

