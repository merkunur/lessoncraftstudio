# Teaching package — describe day-night cycle
# Arc 13 Phase 1 (world-knowledge / environment-and-weather 2/4 → 3/4).
# Resolves Arc 10 identify-four-seasons forward-pointer.

targetSlug: describe-day-night-cycle
language: en
title:
  en: "Day and Night — what happens when the sun is up vs down"
description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching day-night cycle. Builds on Arc 10 identify-four-seasons + Arc 11 identify-weather-types. RESOLVES Arc 10 forward-pointer ('explore the DAY-NIGHT cycle — what happens during day and night, and why we have both'). Kids learn day = sun-up + activity; night = sun-down + sleep; cycle repeats every 24 hours due to Earth rotation. Foundational science + supports daily-routine awareness. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class day-night routine. Teacher displays paired pictures:
      'morning sun rising' / 'noon sun overhead' / 'evening sun
      setting' / 'night moon + stars'. Class names what's happening +
      what people typically do at each time. Reinforces day-as-active-
      time + night-as-rest-time + cycle-repeats framing.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + day-night-sort routine. Each pair receives 12
      activity pictures; pair sorts into DAY activities (school,
      playing outside, lunch) vs NIGHT activities (sleeping, brushing
      teeth before bed, reading bedtime story). Recast errors with
      explanation. Optional extension: kids draw their own day-night
      schedule.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (day/night
      activities). Station 2: picture-sort (day vs night categorization).
      Station 3: manipulative cut-outs hands-on routine-construction.
      Station 4: word-guess (day-night vocabulary letters).
  closure:
    durationMinutes: 5
    body: |
      Whole-class day-night recall. Teacher names an activity; class
      identifies day or night. Forward-pointer: 'Today we learned
      day-night cycle. When we come back to environment next, we'll
      learn the WATER CYCLE — how water moves between sky + ocean +
      ground in another natural cycle.'

