# Teaching package — sequence a 3-event story
# Arc 14 Phase 2 (early-literacy / narrative-comprehension +1 from Arc 13).
# Resolves Arc 13 predict-from-picture-cue forward-pointer.

targetSlug: sequence-3-event-story
language: en
title:
  en: "Story Sequencing — what happens first, next, last"
description:
  en: "Kindergarten / Grade 1 narrative-comprehension package teaching kids to sequence a 3-event story (first / next / last). Builds on Arc 13 predict-from-picture-cue + label-a-picture-with-1-word foundation. RESOLVES Arc 13 predict-from-picture forward-pointer ('next we extend single-picture work to story-sequencing across multiple events'). Story-sequencing is a foundational narrative-comprehension skill: kids look at 3 pictures depicting a story (e.g., kid plants seed → sprout grows → flower blooms), arrange them in chronological order, then describe the sequence using first/next/last vocabulary. Critical bridge from picture-comprehension (single image) to narrative-comprehension (multiple-image causal sequence). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + sequencing introduction. Teacher displays
      3 pictures shuffled (e.g., empty cup → cup being filled with
      water → full cup). "These 3 pictures tell a story. What
      happens FIRST? What happens NEXT? What happens LAST? Let's
      put them in order!" Class collectively sequences the cards.
      Teacher narrates: "FIRST — the cup is empty. NEXT — water is
      being poured in. LAST — the cup is full." Visual + verbal
      anchor establishes first/next/last vocabulary.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + story-sequencing routine. Each pair receives 4
      sets of 3-event story cards (e.g., set A: kid puts on shoes
      → ties laces → walks; set B: ice cream falls → kid cries →
      mom buys new one; set C: seed planted → sprout grows →
      flower blooms; set D: kid sees cake → blows out candles →
      eats cake). Pair takes turns: kid A shuffles a set + lays
      out the 3 cards; kid B sequences first/next/last + narrates.
      Recast errors with verbal cause-effect cues ("the cup can't
      be FULL before water is poured — what comes BEFORE?").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet
      sequencing 3-event sequences. Station 2: matching worksheet
      (story sequence-position to picture). Station 3: missing-
      pieces worksheet (3-event story with one event missing —
      kid identifies which is missing). Station 4: vocabulary-
      tracing-strips for first/next/last + sequence vocabulary.
  closure:
    durationMinutes: 5
    body: |
      Whole-class story-sequencing review. Teacher displays a new
      3-event story (e.g., bird builds nest → bird lays egg → egg
      hatches into chick). Class chants the sequence: "First, the
      bird builds a nest. Next, the bird lays an egg. Last, the
      egg hatches!" Forward-pointer: "Today we sequenced 3-event
      stories. When we come back next, we'll sequence longer
      stories with 4 or 5 events — beginning, middle, end + more
      detail."

