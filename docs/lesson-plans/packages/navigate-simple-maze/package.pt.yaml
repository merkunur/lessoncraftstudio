# Teaching package — navigate simple mazes (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 8 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# pt sparse-override for fine-motor-and-visual-spatial / spatial-reasoning
# strand. FIRST pt sparse-override for spatial-reasoning maze-navigation
# context. BR Portuguese register per CLAUDE.md §6 + formal "você" address
# per §17.9.

title:
  pt: "Navegação em Labirintos — encontre o caminho do início ao fim"
description:
  pt: "Pacote de motricidade fina e visual-espacial para o jardim de infância que ensina navegação em labirintos simples. PRIMEIRO pacote de labirinto no catálogo. Constrói sobre follow-directions-on-grid do Arco 7 (precursor de travessia em grade) — as crianças agora navegam caminhos com paredes + becos sem saída em vez de grades abertas. Desenvolve raciocínio espacial + função executiva (planejamento adiante, simulação mental de rotas) + motricidade fina (desenhando o caminho com o dedo ou lápis). Usa o aplicativo picture-path no modo classic-maze. Ancorado em vocabulário."

structure:
  warmup:
    body: |
      Introdução com toda a turma. A professora ou o professor desenha
      um labirinto simples de 5×5 no quadro com Início e Fim claramente
      marcados. A turma traça coletivamente o caminho com pontas de
      dedo (as crianças apontam no ar para a próxima célula). A
      professora ou o professor narra: "Do Início, vamos um passo à
      direita. Depois para baixo. Depois à direita. Agora batemos numa
      parede — vamos para baixo em vez disso." Reforça o enquadramento
      de parede-como-obstáculo + constrói sobre o vocabulário de
      direção em grade do Arco 7 (direita/esquerda/cima/baixo).
  contentActivity:
    body: |
      Trabalho em duplas + rotina de traçado com dedo. Cada criança
      recebe um labirinto simples impresso + usa o dedo para traçar o
      caminho. Os parceiros verificam a correção. Após traçar com o
      dedo, as crianças desenham o caminho com lápis. A professora ou
      o professor circula: refraseia erros com explicação ("você foi
      contra uma parede — escolha uma direção diferente desta célula").
      Extensão opcional: as crianças constroem seus próprios labirintos
      simples em papel quadriculado para os parceiros resolverem. O
      ciclo de construir-e-resolver reforça o enquadramento de
      parede-e-caminho também do lado do produtor.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios picture-path
      classic-maze (grade pequena; caminho claro). Estação 2: folha de
      exercícios picture-path classic-maze (grade maior; múltiplos
      becos sem saída; mais difícil). Estação 3: construção prática de
      labirintos com recortes manipulativos (as crianças constroem
      labirintos com recortes de paredes + peças de caminho; parceiro
      resolve). Estação 4: folha de exercícios de emparelhamento
      (imagem-nome reforça vocabulário de objetos de início/fim que
      os prompts de labirinto usam).
  closure:
    body: |
      Recordação rápida com toda a turma. A professora ou o professor
      exibe um labirinto final no quadro; a turma traça coletivamente
      o caminho enquanto narra direções. Indicador adiante: "Hoje
      navegamos labirintos simples. Quando voltarmos a labirintos na
      próxima vez, exploraremos labirintos com MÚLTIPLOS CAMINHOS — as
      crianças escolhem entre caminhos, escolhendo o mais curto ou o
      que coleta mais tesouros."

assessmentCriteria:
  pt: |
    Traçar o caminho correto através de um labirinto simples de grade
    15 em 8 de 10 tentativas. Traçar o caminho correto através de um
    labirinto de grade 18 com múltiplos becos sem saída em 6 de 10
    tentativas. Articular as direções do caminho ao narrar ("direita,
    baixo, direita, baixo") em 7 de 10 tentativas.

    Diferenciação:
      - Pré-K: labirintos de grade 15 com rotas de caminho único muito
        claras; apenas traçado com dedo.
      - K: labirintos de grade 16-18 com 1-2 becos sem saída; traçado
        com lápis.
      - Primeiro ano em diante: labirintos de grade 20 com múltiplos
        becos sem saída + ponte para labirintos choose-path com
        múltiplas rotas (candidato Arco 9+).

compositionalRationale:
  pt: |
    Fio principal: motricidade fina e visual-espacial / raciocínio
    espacial. Fio secundário: função executiva (planejamento de
    caminho + simulação mental; as crianças pensam 2-3 passos
    adiante antes de comprometer-se). Fio terciário: motricidade
    fina (traçado com dedo transita para traçado com lápis à medida
    que o controle motor se desenvolve).

    Significância arquitetural: PRIMEIRO pacote de labirinto no
    catálogo. Conecta follow-directions-on-grid do Arco 7
    (travessia de grade aberta com direções dadas externamente) à
    navegação de labirinto autodirigida (a criança planeja + executa
    o caminho). A progressão Arco 7 → Arco 8 valida que vocabulário
    de travessia de grade + habilidade de raciocínio espacial do Arco
    7 transferem-se de forma limpa para contextos de resolução de
    labirintos. Resolve o indicador adiante de follow-directions-on-
    grid do Arco 7.

    Relevância cultural pt-BR específica: labirintos são uma forma de
    quebra-cabeça culturalmente universal; vocabulário de direção
    (direita/esquerda/cima/baixo) é alvo precoce de aquisição de
    linguagem em pt-BR. Verbalização de direções de caminho ("Primeiro
    vai à DIREITA, depois para BAIXO, depois à DIREITA novamente") é
    exatamente o tipo de prática de narração de sequência de frase
    completa de que as salas de aula multilíngues K-3 precisam.
