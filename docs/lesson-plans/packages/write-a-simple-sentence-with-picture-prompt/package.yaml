assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Write 5 complete simple sentences (subject-verb-object) with
        picture prompts in 8 of 10 trials.
      - Apply capital-letter-at-sentence-start convention in 8 of 10
        attempts.
      - Apply period-at-sentence-end convention in 8 of 10 attempts.
      - Choose appropriate noun + adjective + verb from picture in 7
        of 10 sentence constructions.

    Differentiation:
    - Pre-K: oral sentence-frame completion (kid SAYS the sentence;
      teacher writes); copy a written sentence-frame template.
    - K: independent sentence-writing with sentence-frame scaffolding
      ('I see a ___ ___.' template visible).
    - Grade 1+: extend to varied sentence-frame templates ('The ___
      is ___.' / 'A ___ can ___.'); bridge to write-2-sentences-on-
      a-topic + use-capital-letter-at-sentence-start + use-period-
      at-sentence-end refinement work.

