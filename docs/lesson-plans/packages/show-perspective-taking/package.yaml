compositionalRationale:
  en: |
    Primary strand: science / personal-social-emotional-development
    (perspective-taking + theory-of-mind foundation; deepens PSED
    strand 4/6 → 5/6). Secondary strand: cognitive-and-executive-
    function / social-cognition (recognizing distinct inner states
    in others). Tertiary strand: early-literacy / vocabulary-
    acquisition (perspective-vocabulary: perspective, different,
    view, opinion, etc.).

    Architectural significance: pairs to Arc 16 Phase 1.2 name-
    and-describe-feelings-detailed at PSED strand-depth surface
    (emotion-self-awareness → emotion-other-awareness
    developmental sequence). Extends Arc 15 Phase 4 show-empathy-
    toward-others by adding the COGNITIVE FOUNDATION layer
    beneath empathy-response (perspective-taking → empathy →
    helping is the canonical SEL developmental sequence).
    EXPLICITLY DISTINCT from show-empathy-toward-others — that
    package teaches the RESPONSE side (how to act caringly); this
    package teaches the COGNITION side (recognizing distinct
    inner states). PSED strand: 4/6 → 5/6 at this Phase 1.3 close
    + completes Arc 16 PSED strand-depth contribution.

    Distinctive composition: 2 matching + 1 pattern-train (3-step
    perspective-taking sequence: RECOGNIZE → INFER → PREDICT) + 1
    picture-sort (same-view vs different-views classification) +
    1 missing-pieces. Sequence-emphasis via pattern-train +
    missing-pieces parallels Arc 15 show-empathy-toward-others
    structural pattern (3-step model + sequence work + binary
    classification). Sentence-strips frame preset "i-think-they-
    feel" emphasizes perspective-taking productive-language work.

    SEL class-conditional material composition (per Phase 1.2 SEL
    adjudication carried forward + verified per Phase 1.3
    perspective-taking instructional workflow):
    - flashcards (KEEP): perspective-vocabulary word-flash
    - picture-cards (KEEP): emotion-face production prompts
      (recognize-other-feelings substrate)
    - sentence-strips (KEEP): "i-think-they-feel" frame; "I
      think Sam feels ___" canonical perspective-taking
      sentence-frame
    - vocabulary-tracing-strips (KEEP per Arc 15 show-empathy-
      toward-others empirical precedent; tracing perspective-
      vocabulary supports motor + word-recognition)
    - manipulative-cut-outs (KEEP): perspective-icon cut-outs
      for scenario-perspective tracker activity
    - parent-take-home-letter (KEEP): home-school SEL bridge;
      parent introduction to perspective-taking framework
    - answer-key (KEEP per universal disposition): teacher-
      reference with classic false-belief task answer guidance
    - matching-mat (REMOVE per audit fan-out SEL class disposition):
      perspective-taking isn't pair-matching shape
    Total: 7 materials per Arc 15 PSED canonical pattern (note:
    this differs from Phase 1.2 name-and-describe-feelings-
    detailed which used 6 materials; Phase 1.3 follows Arc 15
    show-empathy-toward-others' 7-material precedent including
    voc-tracing-strips KEEP per §A.13.6 firing surfaced at
    Phase 1.3 substrate verification).

    Class B FLEXIBLE substrate: composes against emotions theme
    (canonical for facial-expression + social-interaction imagery
    surfaced in Arc 15 + Phase 1.2). Cross-bundle reuse
    opportunity: emotions-bundle (paired with name-and-describe-
    feelings-detailed + show-empathy-toward-others as 3-package
    SEL-cluster bundle composition) + future SEL-cluster bundles
    (Arc 17+ candidates).

    K-3 multilingual classroom relevance: perspective-taking is
    universal cognitive developmental milestone across cultures —
    theory-of-mind emerges around age 4-5 in all studied
    populations. Cross-cultural variation exists in HOW perspective-
    taking is taught — some cultures emphasize collective-
    perspective (group-views) early; others emphasize individual-
    perspective. Vocabulary varies: en "perspective"; de
    "Perspektive" + "Sichtweise"; es "perspectiva"; pt "perspectiva";
    fr "perspective" + "point de vue"; it "prospettiva"; fi
    "näkökulma". Some cultures have culturally-specific perspective
    concepts (Japanese "tatemae/honne" public-vs-private; Indian
    "darshan" view-from-the-other). Per K-3 international register,
    the 3-step (RECOGNIZE → INFER → PREDICT) framework is
    universally applicable; locale-variant work at Phase 3+ adapts
    to each locale's perspective-vocabulary register + culturally-
    appropriate examples.

