# Teaching package — follow 3-step oral instructions (pt sparse-override)
# Arc 19 Phase 1.3 Slot 4 (24th-consecutive arc pt cadence per Arc 7+ convention; pt cadence increments per-arc, not per-package; all 4 Phase 1.3 pt variants share the same Arc-19 cadence anchor). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF01LP17 (compreensão de instruções escritas curtas — paraleliza oral) + EF02LP14 (leitura para ação no 2.º ano EF — paraleliza oral). **Speaking-and-listening pedagogy is structurally locale-invariant** — instruction-following operates identically across languages; only the language-of-instruction differs. **NO §A.13.34 sub-class firing** — standard sparse-override per Arc 7+ convention.

targetSlug: follow-3-step-oral-instruction
language: pt

title:
  pt: "Instruções de 3 Passos — primeiro isso, depois aquilo, depois aquilo"

description:
  pt: "Pacote de alfabetização + função executiva para a educação infantil brasileira (5-7 anos) / 1.º ano do ensino fundamental ensinando crianças a seguir instruções orais de 3 passos em sequência. Extensão direta de Arc 14 P4 follow-2-step-oral-instruction + Arc 11 follow-1-step-oral-instruction cadeia-de-prerrequisito. Resolve forward-pointer de Arc 14 P4 ('Quando voltarmos, podemos tentar instruções de 3 passos — primeiro X, depois Y, depois Z — para crianças prontas'). O strand de speaking-and-listening avança 3/10 → 4/10. Exemplos: 'Levante-se, caminhe até a porta, toque na maçaneta' / 'Pegue o lápis vermelho, coloque na caixa, sente-se' / 'Primeiro bata palmas, depois toque seu nariz, finalmente levante os braços'. Ponte crítica de carga-de-memória-de-trabalho de 2 passos para trabalho executivo-de-múltiplos-passos. Aumenta demandas de memória-de-trabalho + introduz estratégias de rastreamento-de-sequência (ensaio mental; aceno-por-passo; contagem-de-dedos). Por §A.13.30 enquadramento informal K-1: trabalho de instrução de 3 passos no K-1 é EXECUÇÃO MULTI-PASSO CONCRETA — crianças ouvem instrução curta de 3 passos + IMEDIATAMENTE executam todos os 3 passos em ordem usando rotinas concretas de sala-de-aula (levantar/sentar/caminhar/tocar/bater-palmas/acenar). Alinhamento BNCC: EF01LP17 (compreensão de instruções escritas curtas — paraleliza oral) + EF02LP14 (leitura para ação no 2.º ano EF — paraleliza oral). 5 exercícios + 8 materiais imprimíveis ao longo de 1 semana."

structure:
  warmup:
    body: |
      Atividade introdutória de instrução de 3 passos com toda
      a turma + modelagem. Você demonstra: "Observem-me seguir
      uma instrução de 3 passos. A professora diz: 'Levante-se,
      caminhe até a janela, toque no vidro.' Eu LEVANTO-ME
      (faz), CAMINHO ATÉ A JANELA (faz), TOQUE NO VIDRO (faz).
      Três coisas em ordem. Agora vocês tentam!" Você dá várias
      instruções de 3 passos com âncoras-de-sequência fortes
      (PRIMEIRO, DEPOIS, FINALMENTE, POR ÚLTIMO): "Primeiro
      batam palmas. Depois toquem seu nariz. Finalmente
      levantem os braços." / "Peguem um lápis. Coloquem na
      mesa. Sentem-se." / "Levantem-se, depois caminhem até a
      porta, depois voltem ao seu lugar." Âncora visual +
      tátil estabelece o padrão de 3 passos + vocabulário-de-
      conector-de-sequência. Enquadramento pedagógico crítico
      — introdução de estratégia rastreamento-de-sequência:
      "Três passos é mais difícil de lembrar que dois. Tentem
      um TRUQUE: contem nos dedos enquanto escutam. Um dedo
      para o primeiro passo. Dois dedos para o segundo. Três
      dedos para o terceiro. Depois olhem para os três dedos
      + façam cada passo em ordem."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de escuta de 3 passos. Cada
      dupla recebe uma folha com 6 imagens-de-resultado
      (criança levantando-se após sentar, criança desenhando
      depois circulando, criança acenando depois inclinando-
      se). A dupla se reveza: a criança A recebe uma instrução
      de 3 passos da professora ("Levante-se, levante as mãos,
      depois sente-se"); a criança B observa para verificar a
      sequência correta. Inverter papéis. A professora
      circula com cartões-de-instrução. Movimento pedagógico
      crítico: USE ESTRATÉGIAS DE RASTREAMENTO-DE-SEQUÊNCIA.
      Incentive contagem-de-dedos (um dedo por passo
      ouvido); aceno-por-passo (as crianças acenam uma vez
      para cada passo conforme a instrução é dada); ensaio
      mental ("repitam a instrução para si mesmos antes de
      começar"). Instruções de 3 passos excedem a capacidade
      simples de memória-de-trabalho para muitas crianças K
      — os andaimes importam. Recapture erros com nomeação-
      explícita-de-passo: ("você se levantou + levantou as
      mãos, mas pulou o passo 'sente-se'. Vamos verificar:
      passo 1 foi levantar-se, passo 2 foi levantar as mãos,
      passo 3 foi sentar-se. Você fez o 1 e o 2 — vamos
      voltar + fazer o passo 3."). Padrões comuns de erro:
      (a) pular passo do meio (muito comum; ensaio mental
      + contagem-de-dedos são andaimes); (b) reordenar
      passos; (c) fazer apenas o primeiro passo + congelar
      no segundo (sobrecarga de memória-de-trabalho;
      reduzir a 2 passos + reconstruir). Extensão opcional:
      a criança gera sua própria instrução de 3 passos +
      testa em outra dupla (trabalho de linguagem produtiva
      reforça trabalho de escuta receptiva).
  scaffold:
    body: |
      Rotação por estações. Estação 1: folha pattern-train
      (sequenciar ações de 3 passos em ordem via layout de
      cartão-ícone). Estação 2: folha de emparelhamento
      (frase-de-instrução de 3 passos → sequência de imagens
      de resultado; as crianças combinam textos impressos de
      3 passos a ilustrações de resultado-executado). Estação
      3: folha missing-pieces (sequência de 3 passos com um
      passo faltando — qual passo está faltando?). Estação 4:
      vocabulary-tracing-strips para palavras-de-conector
      (primeiro, depois, finalmente, em seguida, por último,
      após).
  closure:
    body: |
      Recapitulação rápida de 3 passos + revisão de estratégia
      com toda a turma. Você dá 5 diferentes instruções de 3
      passos; a turma coletivamente segue cada uma. "Toquem
      seu ombro, toquem seu joelho, depois pulem." / "Primeiro
      bater palmas, depois estalar dedos, finalmente bater na
      mesa." / "Levantem-se, virem-se, sentem-se." Você
      encerra: "Hoje seguimos instruções de 3 passos — um
      passo a mais que da última vez! Instruções de TRÊS
      passos são mais difíceis que de 2 passos porque
      precisamos LEMBRAR mais. Os truques ajudam: contagem-
      de-dedos, aceno-de-cabeça, ensaio mental. Usem-nos
      quando precisarem lembrar uma instrução longa. Três
      passos é um ótimo alongamento de memória-de-trabalho
      para a educação infantil / 1.º ano EF." Aponte adiante:
      "Qual é a próxima habilidade de escuta? PERGUNTAR +
      RESPONDER PERGUNTAS sobre o que ouvimos. Hoje
      EXECUTAMOS instruções. A seguir PARTICIPAREMOS na
      dação-de-instruções perguntando de volta à professora:
      'Espera, qual foi o segundo passo?' ou 'Pode dizer de
      novo?'. Essa é a próxima habilidade de speaking-and-
      listening."

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Seguir instruções de 3 passos com precisão em 7 de 10
        tentativas.
      - Usar pelo menos uma estratégia de rastreamento-de-
        sequência (contagem-de-dedos / aceno-por-passo /
        ensaio mental) em 6 de 8 instâncias observadas.
      - Identificar a palavra-de-conector / âncora-de-sequência
        em uma instrução de 3 passos (PRIMEIRO / DEPOIS /
        FINALMENTE / EM SEGUIDA / POR ÚLTIMO) em 6 de 10
        tentativas.
      - Restatear uma instrução de 3 passos em palavras
        próprias em 5 de 8 tentativas.
      - Evitar o padrão de erro pulando-passo-do-meio em 5 de
        8 tentativas após treinamento de estratégia
        rastreamento-de-sequência.
      - Gerar uma própria instrução de 3 passos para um colega
        (extensão de linguagem produtiva) em 4 de 6
        tentativas.
      - Usar o vocabulário 'instrução' / 'direção' / 'passo' /
        'primeiro' / 'depois' / 'finalmente' / 'seguir'
        corretamente em 5 de 10 tentativas de produção verbal.

    Diferenciação:
    - Pré-escola: instruções de 2 passos apenas com ações
      físicas concretas; adiar 3 passos para o K-1.º ano EF.
    - Educação infantil (5-7 anos): instruções de 3 passos
      com ações físicas + visuais; treinamento de estratégia
      rastreamento-de-sequência é carga-suportada.
    - 1.º ano EF: leitura + execução completa de instrução
      de 3 passos + estratégias de rastreamento-de-sequência;
      ponte para geração de instrução-para-colega (linguagem
      produtiva) + extensão de 4 passos para crianças
      prontas.
    - 2.º ano EF: estender para instruções de 4 + 5 passos +
      frases multi-cláusula; introduzir consciência-de-
      feição-de-texto-instrucional (listas-numeradas;
      marcadores-de-sequência em contextos escritos; ponte
      para trabalho de instrução escrita Phase 1.1 Slot 2).
    - 3.º ano EF em diante: pedagogia completa de escuta-
      procedimental (instruções técnicas; receitas;
      procedimentos sequenciados); ponte para problemas-
      de-palavra multi-passo + autoria de procedimentos-
      de-sala-de-aula.

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en). Os
    campos materials, composedExercises, curriculumStandards
    e learningObjectives são herdados do package.yaml via
    merge sparse-override e não são repetidos aqui per a
    convenção Arc 7+.

    Vocabulário pt-BR canônico para seguir-instrução-de-3-
    passos K-1 EF:
    - 'instrução' (instruction) — pt-BR canônico
    - 'direção' (direction) — sinônimo de 'instrução'
    - 'passo' (step) — pt-BR canônico para parte-de-sequência
    - 'primeiro' / 'depois' / 'em seguida' / 'finalmente' /
      'por último' (first / then / next / finally / last) —
      locuções de sequenciamento K-1
    - 'seguir' (to follow) — verbo canônico para execução-
      de-instrução
    - 'lembrar' (to remember) — pt-BR canônico para retenção-
      de-memória-de-trabalho
    - 'rastreamento' / 'rastrear' (tracking / to track) —
      pt-BR canônico para estratégias de sequência
    - 'aceno' (nod) — pt-BR canônico para gesto-de-aceno
    - 'ensaio mental' (mental rehearsal) — pt-BR canônico
      pedagógico para estratégia de repetição-silenciosa
    - Frases-modelo K-1: "Primeiro... Depois... Finalmente..."
      / "Faça isso, depois isso, depois isso." / "Eu ouvi,
      lembrei, fiz."

    Particularidade pt-BR para imperativo de 3 passos:
    Português-BR K-1 EF usa imperativo do 'você' canônico
    para instrução escolar formal (registro sala-de-aula).
    Exemplos: "Levante-se, caminhe até a porta, toque na
    maçaneta." A forma 'você' implícita + verbo no
    imperativo afirmativo de 3.ª pessoa subjuntiva é a
    convenção BR-MEC anos-iniciais.

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF01LP17 ('Identificar e reproduzir, em textos
    instrucionais e prescritivos, a formatação própria
    desses textos: vocativos, lista de ingredientes ou
    materiais, instruções de execução') é o anchor BNCC do
    1.º ano EF para compreensão de instruções — paraleliza-
    se ao trabalho oral aqui. EF02LP14 ('Ler e compreender
    textos instrucionais, identificando a sequência de
    passos a serem seguidos para realizar um experimento,
    uma receita etc.') é o anchor do 2.º ano EF para
    sequência-de-passos. Juntos cobrem a progressão K-1 →
    2.º ano para instrução-procedimental oral + escrita.

    Currículo brasileiro K-1 EF para escuta procedimental:
    A BNCC brasileira EF Língua Portuguesa Anos Iniciais
    coloca a compreensão de textos instrucionais entre os
    gêneros textuais nucleares de K-1. Escutar e seguir
    instruções de 3 passos é a habilidade oral equivalente
    + precursor de ler-e-seguir-instrução escrita. Este
    pacote alinha com essa abordagem.

    Por §A.13.30 enquadramento informal K-1: este pacote NÃO
    ensina pedagogia formal de escuta procedimental
    (instruções técnicas + receitas elaboradas +
    procedimentos sequenciados são trabalho do 3.º ano EF
    em diante). A ênfase do K-1 é escuta-em-ação como ponte
    entre simples-direção + escuta-procedimental-complexa.

    Pacote PARTIAL-advancement em speaking-and-listening
    strand (3/10 → 4/10). Pair-coherent positioning com
    Phase 1.3 Slots 1+2 phonological-awareness SAT-closing
    pair + Slot 3 phonics-decoding PARTIAL advancement
    (clusters distintos mas contemporary commit cycle).

    **§A.13.34 sub-class adjudication — locale-invariant:**
    Speaking-and-listening pedagogy (instruction-following)
    is structurally locale-invariant. The cognitive
    operation (multi-step receptive listening + sequential
    execution) is universal across languages; only the
    language-of-instruction vocabulary differs. Connector
    words vary across locales (first/then = primeiro/depois
    in pt-BR; first/then = first/dann in German; first/then
    = primero/luego in Spanish; first/then = ensin/sitten
    in Finnish) but the cognitive operation is identical.
    **NO §A.13.34 sub-class firing** — standard sparse-
    override per Arc 7+ convention; pt variant ships with
    pt-BR-specific connector vocabulary + BR-MEC ensino-
    fundamental register but inherits materials +
    composedExercises + curriculumStandards from package.yaml
    cleanly.

    Per §A.13.36 cadência de cooperação CC↔assistant: o
    pacote pt herda materials, composedExercises,
    curriculumStandards via sparse-override per convenção
    Arc 7+; quaisquer emendas en (se Round 2 surgir) se
    propagam automaticamente para esta variante pt.
