compositionalRationale:
  en: |
    Primary strand: world-knowledge / environment-and-weather (four
    seasons recognition). Secondary strand: vocabulary acquisition
    (vocab-anchored — season names + season-characteristic vocabulary).
    Tertiary strand: classification + sorting (kids sort seasonal
    items by season — cognitive sorting strand from Arc 5+7+8 applied
    to seasonal context).

    Architectural significance: FIRST environment-and-weather strand
    package in the catalog. Opens the strand for additional packages:
    identify-weather-types, describe-day-night-cycle, describe-water-
    cycle-basic (3 unauthored targets remaining). Builds on Arc 8
    identify-and-name-weather-words — weather vocabulary now applied
    to season classification.

    Distinctive composition: matching + picture-sort + word-guess +
    odd-one-out alternating composition leverages multiple cognitive
    operations on season knowledge (recognize, classify, recall,
    exclude). The picture-sort exercise across weather + clothing
    themes demonstrates how seasonal classification spans multiple
    domains (weather phenomena + season-appropriate clothing).

    Cross-strand integration: world-knowledge / environment-and-weather
    + cognitive sorting (Arc 5+7+8) + vocabulary acquisition (Arc 1+5+6+
    8). Seasonal classification is rich cross-strand surface — kids
    use sorting skills to organize seasonal vocabulary while building
    world-knowledge.

    Class B FLEXIBLE substrate: composes against weather + clothing
    + nature themes. Substrate-readiness universal across themes that
    have meaningful season-characteristic items.

    K-3 multilingual classroom relevance: season experiences vary
    significantly across the platform's 11 locales — Nordic locales
    have extreme winter; Mediterranean locales have mild winter;
    pt-BR has tropical seasons (estação chuvosa vs estação seca rather
    than 4 distinct seasons). The package's universal-4-seasons
    framing handles temperate-zone locales (en, de, fr, sv, da, no,
    fi, etc.); Phase 3 sparse-overrides can adapt for tropical locales
    (pt-BR specifically would describe Brazilian regional climate
    variation rather than 4 universal seasons).

