assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify and produce sound for 8 common blends (bl, br, cl,
        cr, dr, fl, gr, st) in 8 of 10 trials.
      - Identify and produce sound for 4 common digraphs (ch, sh,
        th, wh) in 8 of 10 trials.
      - Read 8 unfamiliar blend/digraph words (e.g., 'flag',
        'shop', 'thin', 'crab') correctly in 7 of 10 trials.

    Differentiation:
    - Pre-K: blend-only scope (bl, br, st as 3 most-frequent
      blends); skip digraphs.
    - K: 8 blends + 4 digraphs.
    - Grade 1+: extend full set (18 blends + 6 digraphs) + bridge
      to vowel-teams + r-controlled-vowels phonics work.

