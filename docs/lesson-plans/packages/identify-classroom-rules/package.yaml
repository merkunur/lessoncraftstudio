compositionalRationale:
  en: |
    Primary strand: world-knowledge / personal-social-
    emotional-development (PSED; identify-classroom-
    rules — strand 3/8 → 4/8). Secondary strand:
    early-literacy / speaking-and-listening (rules-
    naming + rules-explaining is productive-language
    work; kids state rules + reasons in classroom-
    register). Tertiary strand: cognitive-and-
    executive-function / social-cognition (kids reason
    about WHY rules exist + connect rule-following
    to underlying values of safety + fairness +
    learning).

    Architectural significance: advances PSED canonical
    strand 3/8 → 4/8 (37.5% → 50.0%). PSED is one of
    the lower-saturation parent-class strands at Arc 18
    P1.4 commencement (the lowest-SAT world-knowledge
    domain strand still partial after Slot 1
    saturates materials-and-properties to 2/2). Per
    learning-targets.json the PSED strand has 8
    canonical targets; current state pre-Phase-1.4
    is 3/8 (share-and-take-turns + name-and-describe-
    feelings + show-perspective-taking + regulate-
    emotions-with-strategies — 4 of 8 actually, may
    differ by exact enumeration). This Phase 1.4
    package adds 1 to advance to 4/8 (50.0%
    midpoint). Remaining unsatisfied PSED targets
    (5 after Phase 1.4) are Phase 1.5+ + Arc 19+
    candidates: name-things-i-can-do-myself, wait-
    my-turn, identify-safe-vs-unsafe-situations,
    make-and-name-a-friend, and 1 additional.

    Per §A.13.30 K-1 informal framing: K-1 classroom-
    rules work is CONCRETE RULES-NAMING + RULES-
    EXPLAINING. Kids learn that rules are SHARED
    CLASSROOM AGREEMENTS (not adult-imposed law) and
    that each rule has a REASON connected to safety
    or fairness or learning. The pedagogy uses
    everyday classroom situations (the actual rules
    of the kids' actual classroom) BEFORE encountering
    formal civics terms ('laws' / 'rights' /
    'government' / 'authority' are Grade 3+ social
    studies terms). The K-1 framing is COMMUNITY-OF-
    LEARNERS-AGREEMENT: rules are shared-norms-that-
    let-many-people-learn-together. Formal civics and
    legal-system pedagogy (Grade 3+) extends to laws-
    and-government work; this package establishes the
    foundation rules-as-shared-agreements pattern that
    civics work depends on.

    Multilingual / international-school context
    emphasis: classroom rules vary significantly
    across school cultures globally. International
    schools serve kids from multiple home-school-
    cultural backgrounds; the implicit RULES of one
    school may differ from another (some schools
    expect kids to raise hand silently before
    speaking; others expect kids to call out
    spontaneously; some schools have shoes-off
    norms; others don't; some schools start each day
    with prayer; others don't). The package
    deliberately frames CO-CREATED CLASSROOM
    AGREEMENTS that can be authored per-classroom
    rather than absolute universal rules. This
    framing aligns with EYFS.ELG.PSED ('children
    follow instructions involving several ideas or
    actions; they answer 'how' and 'why' questions
    about their experiences') + IB-PYP.WhoWeAre
    (community-and-identity work) + CASEL.SOCIAL_
    AWARENESS (perspective-taking + cultural-
    sensitivity).

    Cross-reference to Arc 17 P1.1 share-and-take-
    turns (PSED-class precedent + SAT-CLOSER for the
    Arc 16 SEL triad-pair): that package shipped the
    SEL-class material composition pattern (6
    materials per Arc 16 §A.13.6-firing-corrected SEL
    class-conditional disposition; REMOVE matching-
    mat + vocabulary-tracing-strips; KEEP flashcards
    + picture-cards + sentence-strips +
    manipulative-cut-outs + parent-take-home-letter
    + answer-key). **This package MIRRORS share-and-
    take-turns SEL-class composition exactly**:
    sentence-strips at position 3 with framePreset
    'i-feel' (the i-feel frame accommodates rules-
    register work: "I feel safe when we walk." / "I
    feel happy when we share."); manipulative-cut-
    outs at position 4 emits `mode: single-repeat`
    with theme 'emotions' at itemCount 24 — same
    configuration as share-and-take-turns precedent
    for SEL-class consistency. The 6-material shape
    (vs 7 or 8 in numeracy/literacy/world-knowledge
    classes) reflects the SEL pedagogy emphasis on
    behavioral-script work + scenario-recognition
    rather than image-to-word pairing or single-
    word-tracing reinforcement.

    Distinctive composition: 5 exercises across 4 apps
    — picture-sort (position 1) surfaces appropriate-
    vs-inappropriate scenario sorting (kids sort
    classroom-behavior pictures into following-the-
    rule vs not-following-the-rule); matching
    (positions 2 + 5) builds rule-to-reason pairing
    (kids match rule-pictures to reason-text);
    math-worksheet (position 3) introduces fairness-
    as-counting work (a rules-arithmetic substrate:
    if 6 kids share 1 toy and each gets 1 turn, how
    many minutes per turn for 30 minutes total? = 5
    each); word-guess (position 4) provides puzzle-
    format practice in the emotions vocabulary domain
    (the cluster theme inherited from share-and-take-
    turns precedent + the broader Arc 16+17 SEL
    cluster). The rule-vocabulary scaffolding work
    (walk / kind / listen / share / hand / help) lives
    at the lesson-body level — specifically the
    scaffold station-3 activity (line 91-95 of
    structure body) which explicitly authors the
    rule-vocabulary puzzle — NOT via the
    composedExercise's auto-generated worksheet
    content. The abstraction is pedagogically clean:
    composedExercises ship as auto-generated
    catalog-ingestion artifacts within the cluster
    theme; lesson-body scaffolding (teacher-authored)
    carries the package-specific vocabulary that the
    cluster theme cannot deliver. Same abstraction
    layer as Arc 17 P1.1 share-and-take-turns
    precedent (which also uses emotions theme for
    composedExercises despite the prosocial-skills
    content focus). Same composition shape as
    share-and-take-turns precedent EXACTLY — preserves
    cross-package SEL-class coherence within the
    developing emotions-bundle (which is now
    positioned to grow to 4-package SEL anchor
    bundle: name-and-describe-feelings + show-
    perspective-taking + share-and-take-turns +
    identify-classroom-rules; cross-bundle reuse
    density advancement opportunity at Arc 18 P2
    close-out).

    Round 1 review note (§A.13.6 firing surfaced +
    Path B locked): word-guess composedExercise
    `themeSelect: emotions` does not deliver the rule-
    vocabulary that the scaffold station-3 activity
    body promises. Path B recommendation locked: the
    composedExercise IS the cluster-theme puzzle-
    format practice (emotion-vocabulary); the rule-
    vocabulary scaffold IS the lesson-body station-3
    activity (teacher-authored from the package's
    canonical rule-vocabulary set walk / kind /
    listen / share / hand / help). The two roles
    are layered, not conflated. Path A (custom-
    vocabulary word-guess parameter) was rejected
    because (a) it would diverge from share-and-take-
    turns precedent that uses theme-based word-guess
    identically, and (b) the lesson-body station-3
    authoring already covers rule-vocabulary
    scaffolding without app-side custom-vocabulary
    capability. Path C (replace word-guess) was
    rejected because it would lose word-puzzle
    variety in the exercise mix.

    Materials note: 6-material SEL class-conditional
    composition per §A.13.37 + Arc 17 P1.1 share-and-
    take-turns precedent. SEL class is case-by-case
    per §A.13.37 row; the share-and-take-turns
    precedent established the 6-material SEL-typical
    pattern (REMOVE matching-mat + vocabulary-tracing-
    strips because rules-naming work doesn't anchor
    on image-to-word pairing or single-word-tracing
    reinforcement; KEEP flashcards + picture-cards +
    sentence-strips + manipulative-cut-outs + parent-
    take-home-letter + answer-key). This package
    inherits the 6-material SEL composition exactly.
    Sentence-strips at position 3 with framePreset
    'i-feel' (the i-feel frame accommodates BOTH
    emotion work AND rules-register work via
    feeling-anchored frames: "I feel safe when we
    walk inside." / "I feel happy when we use kind
    words." — connecting rule-following to felt
    classroom-experience).

    Class B FLEXIBLE substrate: composes against
    emotions theme. The Arc 16 + Arc 17 SEL package
    cluster (name-and-describe-feelings + show-
    perspective-taking + share-and-take-turns) used
    emotions theme; identify-classroom-rules
    continues the theme to preserve cross-package
    cluster coherence. emotions-bundle becomes the
    4-package SEL anchor bundle post-Arc-18 Phase 1.4
    (cross-bundle reuse density advancement
    opportunity for Arc 18 P2 close-out cycle).

    K-3 multilingual classroom relevance: classroom
    rules + classroom-norms vary significantly across
    school cultures globally with K-3-relevant
    divergence. The 4-6 rule starter set is locale-
    portable but specific rules vary per school
    culture. Cross-locale rule-vocabulary varies:
    en 'walk / kind words / raise hand / put away /
    listen / help'; de 'gehen / nett sprechen / Hand
    heben / aufräumen / zuhören / helfen'; es
    'caminar / palabras amables / levantar la mano /
    guardar / escuchar / ayudar'; pt 'andar / palavras
    gentis / levantar a mão / guardar / escutar /
    ajudar'; fr 'marcher / mots gentils / lever la
    main / ranger / écouter / aider'; nordic locales
    use shorter verb-forms matching local
    communication style. Cross-cultural classroom-
    norm awareness is universally relevant for
    international schools + dual-language programs
    where kids' home-school-cultural defaults
    diverge in classroom-shared contexts.

    Cross-cultural affirmation discipline: package
    affirms cultural variation in classroom rules
    ('different schools have different rules; all
    rules that help everyone feel safe and able to
    learn are good rules') rather than prescribing
    one universal rule set. Particularly load-bearing
    for international school + dual-language program
    contexts where kids' home-school-cultural
    backgrounds diverge significantly (some kids
    come from schools with very strict raise-hand
    norms; others from spontaneous-call-out norms;
    others from sit-in-circles vs sit-in-rows norms;
    teacher work is to honor the kids' variety while
    establishing CLASSROOM-SHARED agreements that
    work for the current shared classroom).

