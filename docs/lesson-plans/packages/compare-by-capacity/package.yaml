# Teaching package — compare objects by capacity
# Arc 14 Phase 4 (math / measurement +1 from Arc 11 baseline).
# Resolves Arc 11 compare-by-weight forward-pointer.

targetSlug: compare-by-capacity
language: en
title:
  en: "More or Less Inside — comparing how much containers hold"
description:
  en: "Kindergarten / Grade 1 math + measurement package teaching kids to compare objects by capacity (how much they hold). Builds on Arc 11 compare-by-length + compare-by-weight measurement foundation. RESOLVES Arc 11 compare-by-weight forward-pointer ('next we extend comparison work to capacity — comparing how much containers hold'). Examples: 'Which cup holds MORE water?' / 'Which jar holds LESS?' / 'Order 3 containers from smallest to largest capacity'. Critical bridge from spatial measurement (length/weight) to volumetric measurement. Foundation for later customary + metric unit work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + capacity introduction. Teacher displays 3
      containers (small cup, medium glass, large pitcher). "How
      much can each hold? Today we compare CAPACITY — how much
      something can hold INSIDE. The small cup holds the LEAST.
      The pitcher holds the MOST. The glass is IN BETWEEN."
      Teacher demonstrates by pouring water from one to another:
      "If I pour all the water from the cup into the glass, the
      glass is still not full. The glass holds MORE than the cup."
      Visual + tactile anchor for capacity comparison.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + capacity-comparison routine. Each pair receives
      a worksheet with 6 container-pair pictures (small bottle vs
      large bottle; tiny vase vs big vase; etc.). Pair takes turns:
      kid A points to the larger-capacity container; kid B explains
      why ("the big bottle is bigger inside; it holds more water").
      Recast errors with visual size-comparison anchors ("the BIG
      bottle holds MORE than the SMALL bottle — capacity = how
      much INSIDE").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (container
      pictures + capacity-labels: MORE / LESS / EQUAL). Station 2:
      more-less worksheet (compare 2 containers; pick more or less).
      Station 3: pattern-train worksheet (order 3-4 containers
      from smallest to largest capacity). Station 4: vocabulary-
      tracing-strips for capacity vocabulary (more, less, equal,
      empty, full, half).
  closure:
    durationMinutes: 5
    body: |
      Whole-class capacity review. Teacher shows new container
      pairs; class identifies which holds more, less, or equal.
      "Cup vs pitcher — pitcher holds MORE. Glass vs bottle — they
      look the same; can hold EQUAL amounts." Forward-pointer:
      "Today we compared capacity. When we come back next, we can
      measure capacity exactly using cups, ounces, or liters — or
      we can compare other things like TIME (how long things last)
      and TEMPERATURE (how hot or cold)!"

