<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Gro&szlig; oder Klein - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(175deg, #ECEFF1 0%, #F5F5F5 50%, #E8EAF6 100%); overflow: hidden;">

        <!-- Subtle grid pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.035; background-image: linear-gradient(#37474F 1px, transparent 1px), linear-gradient(90deg, #37474F 1px, transparent 1px); background-size: 40px 40px;"></div>

        <!-- Dark Slate Header -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 155px; background: linear-gradient(135deg, #37474F 0%, #455A64 50%, #37474F 100%); z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,0.25);">
            <!-- Decorative bottom edge -->
            <div style="position: absolute; bottom: -12px; left: 0; right: 0; height: 12px; background: linear-gradient(135deg, #37474F 0%, #455A64 50%, #37474F 100%); clip-path: polygon(0 0, 100% 0, 100% 100%, 95% 0%, 85% 100%, 75% 0%, 65% 100%, 55% 0%, 45% 100%, 35% 0%, 25% 100%, 15% 0%, 5% 100%, 0 0%);"></div>

            <div style="text-align: center; padding-top: 28px;">
                <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; color: white; margin: 0; text-shadow: 2px 3px 6px rgba(0,0,0,0.3);">Drei Aufgabentypen!</h1>
                <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 20px; color: rgba(255,255,255,0.8); margin: 6px 0 0 0; letter-spacing: 2px;">GR&Ouml;SSENVERGLEICH ARBEITSBL&Auml;TTER</p>
            </div>
        </div>

        <!-- Three Clipboard Columns -->
        <div style="position: absolute; top: 185px; left: 0; right: 0; display: flex; justify-content: center; gap: 24px; z-index: 10;">

            <!-- Column 1: Gleiche Bilder (Mint) -->
            <div style="width: 285px;">
                <!-- Clipboard clip -->
                <div style="width: 80px; height: 22px; background: linear-gradient(180deg, #B0BEC5, #90A4AE); border-radius: 4px 4px 10px 10px; margin: 0 auto -8px auto; position: relative; z-index: 5; box-shadow: 0 2px 6px rgba(0,0,0,0.2);">
                    <div style="width: 36px; height: 8px; background: #78909C; border-radius: 4px; position: absolute; top: 5px; left: 50%; transform: translateX(-50%);"></div>
                </div>
                <!-- Clipboard body -->
                <div style="background: white; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); border: 3px solid #E0E0E0; overflow: hidden;">
                    <!-- Colored header -->
                    <div style="background: linear-gradient(135deg, #00BFA5 0%, #26A69A 100%); padding: 16px 14px; text-align: center;">
                        <h3 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; margin: 0; text-shadow: 1px 1px 3px rgba(0,0,0,0.2);">Gleiche Bilder</h3>
                        <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: rgba(255,255,255,0.9); margin: 4px 0 0 0;">Welches ist gr&ouml;&szlig;er?</p>
                    </div>
                    <!-- Worksheet image -->
                    <div style="padding: 14px;">
                        <div style="border-radius: 8px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.1); border: 2px solid #E0F2F1;">
                            <img src="https://www.lessoncraftstudio.com/samples/german/big%20small/sample-2.jpeg" style="width: 100%; height: 310px; object-fit: cover; display: block;" alt="Gleiche Bilder Arbeitsblatt">
                        </div>
                    </div>
                    <!-- Mint accent bar -->
                    <div style="height: 6px; background: linear-gradient(90deg, #00BFA5, #4DB6AC);"></div>
                </div>
            </div>

            <!-- Column 2: Verschiedene Bilder (Amber) -->
            <div style="width: 285px;">
                <!-- Clipboard clip -->
                <div style="width: 80px; height: 22px; background: linear-gradient(180deg, #B0BEC5, #90A4AE); border-radius: 4px 4px 10px 10px; margin: 0 auto -8px auto; position: relative; z-index: 5; box-shadow: 0 2px 6px rgba(0,0,0,0.2);">
                    <div style="width: 36px; height: 8px; background: #78909C; border-radius: 4px; position: absolute; top: 5px; left: 50%; transform: translateX(-50%);"></div>
                </div>
                <!-- Clipboard body -->
                <div style="background: white; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); border: 3px solid #E0E0E0; overflow: hidden;">
                    <!-- Colored header -->
                    <div style="background: linear-gradient(135deg, #FF8F00 0%, #FFA000 100%); padding: 16px 14px; text-align: center;">
                        <h3 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; margin: 0; text-shadow: 1px 1px 3px rgba(0,0,0,0.2);">Verschiedene Bilder</h3>
                        <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: rgba(255,255,255,0.9); margin: 4px 0 0 0;">Vergleiche die Gr&ouml;&szlig;e!</p>
                    </div>
                    <!-- Worksheet image -->
                    <div style="padding: 14px;">
                        <div style="border-radius: 8px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.1); border: 2px solid #FFF3E0;">
                            <img src="https://www.lessoncraftstudio.com/samples/german/big%20small/sample-1.jpeg" style="width: 100%; height: 310px; object-fit: cover; display: block;" alt="Verschiedene Bilder Arbeitsblatt">
                        </div>
                    </div>
                    <!-- Amber accent bar -->
                    <div style="height: 6px; background: linear-gradient(90deg, #FF8F00, #FFB74D);"></div>
                </div>
            </div>

            <!-- Column 3: Ordne nach Gr&ouml;&szlig;e (Violet) -->
            <div style="width: 285px;">
                <!-- Clipboard clip -->
                <div style="width: 80px; height: 22px; background: linear-gradient(180deg, #B0BEC5, #90A4AE); border-radius: 4px 4px 10px 10px; margin: 0 auto -8px auto; position: relative; z-index: 5; box-shadow: 0 2px 6px rgba(0,0,0,0.2);">
                    <div style="width: 36px; height: 8px; background: #78909C; border-radius: 4px; position: absolute; top: 5px; left: 50%; transform: translateX(-50%);"></div>
                </div>
                <!-- Clipboard body -->
                <div style="background: white; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); border: 3px solid #E0E0E0; overflow: hidden;">
                    <!-- Colored header -->
                    <div style="background: linear-gradient(135deg, #7E57C2 0%, #9575CD 100%); padding: 16px 14px; text-align: center;">
                        <h3 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; margin: 0; text-shadow: 1px 1px 3px rgba(0,0,0,0.2);">Ordne nach Gr&ouml;&szlig;e</h3>
                        <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: rgba(255,255,255,0.9); margin: 4px 0 0 0;">Sortiere 1-2-3!</p>
                    </div>
                    <!-- Worksheet image -->
                    <div style="padding: 14px;">
                        <div style="border-radius: 8px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.1); border: 2px solid #EDE7F6;">
                            <img src="https://www.lessoncraftstudio.com/samples/german/big%20small/sample-3.jpeg" style="width: 100%; height: 310px; object-fit: cover; display: block;" alt="Ordne nach Gr&ouml;&szlig;e Arbeitsblatt">
                        </div>
                    </div>
                    <!-- Violet accent bar -->
                    <div style="height: 6px; background: linear-gradient(90deg, #7E57C2, #B39DDB);"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Feature Pills -->
        <div style="position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; z-index: 20;">
            <div style="background: white; padding: 13px 22px; border-radius: 28px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #00BFA5;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #00BFA5;">L&ouml;sungsbl&auml;tter dabei</span>
            </div>
            <div style="background: white; padding: 13px 22px; border-radius: 28px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #FF8F00;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #FF8F00;">S&uuml;&szlig;e Tierbilder</span>
            </div>
            <div style="background: white; padding: 13px 22px; border-radius: 28px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #7E57C2;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #7E57C2;">Druckfertig</span>
            </div>
        </div>

    </div>
</body>
</html>
