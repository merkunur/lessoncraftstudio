assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compare two teen-range quantities correctly in 7 of 10
        trials (more/fewer/equal identified accurately).
      - Use ones-digit-tiebreak strategy explicitly ("both teens,
        so compare ones") in 5 of 10 trials.
      - Identify equal pairs (same quantity) reliably in 5 of 6
        trials.
      - Bridge teen-range comparison to single-digit + teen
        comparison (9 vs 12; 18 vs 7) in 5 of 8 cross-range
        trials.

    Differentiation:
    - Pre-K: skip teen-range; review compare-quantities-more-
      fewer (1-5 range).
    - K: visual comparison up to 15; concrete manipulative
      support; "more" + "fewer" only (no "equal" initially).
    - Grade 1: full teen-range comparison; introduce "equal";
      ones-digit-tiebreak strategy practiced.
    - Grade 2+: extend to compare-quantities-up-to-100 (Arc 17+
      candidate); bridge to abstract numerical comparison.

