<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Find Objects - Safari Spotter Variety Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1000px;
            height: 1000px;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }
        .container {
            width: 1000px;
            height: 1000px;
            background: linear-gradient(180deg, #E0F2FE 0%, #FEF3C7 60%, #FDE68A 100%);
            position: relative;
            overflow: hidden;
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 40px;
            right: 80px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #FACC15 0%, #F59E0B 70%, #D97706 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(250,204,21,0.6);
        }

        /* Safari hat */
        .safari-hat {
            position: absolute;
            top: 15px;
            left: 25px;
            font-size: 70px;
            transform: rotate(-15deg);
            z-index: 20;
        }

        /* Main title */
        .title-section {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }

        .main-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            line-height: 0.95;
        }

        .safari {
            font-size: 70px;
            color: #0F766E;
            text-shadow:
                3px 3px 0 rgba(15,118,110,0.2);
            letter-spacing: -2px;
        }

        .spotter {
            font-size: 70px;
            color: #F97316;
            text-shadow:
                3px 3px 0 rgba(249,115,22,0.2);
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 28px;
            color: #0F766E;
            font-weight: 800;
            margin-top: 8px;
        }

        /* Binoculars */
        .binoculars {
            position: absolute;
            top: 250px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .binocular-body {
            display: flex;
            gap: 30px;
            position: relative;
        }

        .lens {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: #1F2937;
            padding: 15px;
            box-shadow:
                0 10px 40px rgba(0,0,0,0.4),
                inset 0 5px 15px rgba(255,255,255,0.1);
            position: relative;
        }

        .lens::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 6px solid #374151;
            border-radius: 50%;
        }

        .lens-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            background: white;
        }

        .lens-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Binocular bridge */
        .binocular-bridge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 60px;
            background: linear-gradient(180deg, #374151 0%, #1F2937 100%);
            border-radius: 10px;
            z-index: 5;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Focus ring detail */
        .focus-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 40px;
            background: #6B7280;
            border-radius: 5px;
        }

        /* Safari animals scattered */
        .safari-animal {
            position: absolute;
            font-size: 40px;
            z-index: 5;
        }
        .animal-1 { top: 200px; left: 50px; }
        .animal-2 { top: 320px; left: 30px; }
        .animal-3 { top: 200px; right: 60px; }
        .animal-4 { top: 350px; right: 40px; }
        .animal-5 { bottom: 200px; left: 100px; }
        .animal-6 { bottom: 230px; right: 90px; }

        /* Palm trees */
        .palm {
            position: absolute;
            font-size: 60px;
            opacity: 0.4;
        }
        .palm-1 { top: 400px; left: 10px; }
        .palm-2 { top: 380px; right: 20px; transform: scaleX(-1); }

        /* Theme category circles */
        .theme-circles {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 15;
        }

        .theme-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border: 4px solid;
        }

        .theme-animals { border-color: #22C55E; }
        .theme-food { border-color: #F97316; }
        .theme-toys { border-color: #EC4899; }
        .theme-vehicles { border-color: #3B82F6; }
        .theme-nature { border-color: #14B8A6; }

        .theme-icon {
            font-size: 36px;
            margin-bottom: 2px;
        }

        .theme-label {
            font-size: 12px;
            font-weight: 800;
            color: #374151;
            text-transform: uppercase;
        }

        /* Grass silhouette */
        .grass {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(to top, #22C55E 0%, transparent 100%);
            opacity: 0.3;
        }

        /* Grade badge */
        .grade-badge {
            position: absolute;
            top: 30px;
            left: 120px;
            background: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #0F766E;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 20;
        }

        /* FREE badge */
        .free-badge {
            position: absolute;
            top: 100px;
            right: 30px;
            background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
            padding: 12px 22px;
            border-radius: 25px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 22px;
            color: white;
            box-shadow: 0 4px 15px rgba(34,197,94,0.4);
            z-index: 20;
        }

        /* Bottom features */
        .features-bar {
            position: absolute;
            bottom: 35px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 15;
        }

        .feature-pill {
            background: #0F766E;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 16px;
            color: white;
            box-shadow: 0 4px 15px rgba(15,118,110,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sun -->
        <div class="sun"></div>

        <!-- Safari hat -->
        <div class="safari-hat">🎩</div>

        <!-- Palm trees -->
        <div class="palm palm-1">🌴</div>
        <div class="palm palm-2">🌴</div>

        <!-- Safari animals -->
        <div class="safari-animal animal-1">🦁</div>
        <div class="safari-animal animal-2">🦓</div>
        <div class="safari-animal animal-3">🐘</div>
        <div class="safari-animal animal-4">🦒</div>
        <div class="safari-animal animal-5">🦜</div>
        <div class="safari-animal animal-6">🐒</div>

        <!-- Grade badge -->
        <div class="grade-badge">GRADES PreK-2</div>

        <!-- FREE badge -->
        <div class="free-badge">FREE</div>

        <!-- Main title -->
        <div class="title-section">
            <div class="main-title">
                <div class="safari">SAFARI</div>
                <div class="spotter">SPOTTER</div>
            </div>
            <div class="subtitle">Explore Multiple Themes!</div>
        </div>

        <!-- Binoculars with worksheets -->
        <div class="binoculars">
            <div class="binocular-body">
                <div class="lens">
                    <div class="lens-inner">
                        <img src="https://www.lessoncraftstudio.com/samples/english/find%20objects/sample-8.jpeg" alt="Worksheet Theme 1">
                    </div>
                </div>
                <div class="lens">
                    <div class="lens-inner">
                        <img src="https://www.lessoncraftstudio.com/samples/english/find%20objects/sample-12.jpeg" alt="Worksheet Theme 2">
                    </div>
                </div>
                <div class="binocular-bridge">
                    <div class="focus-ring"></div>
                </div>
            </div>
        </div>

        <!-- Theme category circles -->
        <div class="theme-circles">
            <div class="theme-circle theme-animals">
                <div class="theme-icon">🐾</div>
                <div class="theme-label">Animals</div>
            </div>
            <div class="theme-circle theme-food">
                <div class="theme-icon">🍎</div>
                <div class="theme-label">Food</div>
            </div>
            <div class="theme-circle theme-toys">
                <div class="theme-icon">🧸</div>
                <div class="theme-label">Toys</div>
            </div>
            <div class="theme-circle theme-vehicles">
                <div class="theme-icon">🚗</div>
                <div class="theme-label">Vehicles</div>
            </div>
            <div class="theme-circle theme-nature">
                <div class="theme-icon">🌸</div>
                <div class="theme-label">Nature</div>
            </div>
        </div>

        <!-- Grass -->
        <div class="grass"></div>

        <!-- Features bar -->
        <div class="features-bar">
            <div class="feature-pill">Animals</div>
            <div class="feature-pill">Food</div>
            <div class="feature-pill">Toys</div>
            <div class="feature-pill">Vehicles</div>
            <div class="feature-pill">Nature</div>
        </div>
    </div>
</body>
</html>
