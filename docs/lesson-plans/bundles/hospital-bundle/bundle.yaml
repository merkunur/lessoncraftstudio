description:
  en: "K-3 bundle centered on hospital as community-context anchor for cross-strand work with emotional-preparation focus. 5 packages span vocabulary-acquisition (identify-and-name-action-verbs — examine, listen, bandage, heal, rest, medicine + medical-specific verbs) + community-roles (identify-community-helpers — doctor, nurse, paramedic, surgeon as hospital workers) + emotion-regulation (regulate-emotions-with-strategies — calming strategies for kids who feel scared, worried, sick at doctor visits) + numeracy (count-objects-1-to-10 — counting bandaids, pills, thermometers, hospital beds) + cognitive-sorting (sort-by-category — emergency vs routine vs preventive care OR by body-system: heart vs lungs vs bones). Cross-strand community-context bundle with strong real-world relevance — most K-3 kids have hospital experiences (visits, checkups, sick relatives) requiring emotional preparation. Suitable for a 4-5 week classroom unit; supports K-3 multilingual classrooms with health-awareness + family-emotional-bridge extensions."

