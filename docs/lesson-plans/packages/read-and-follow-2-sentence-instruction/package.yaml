# Teaching package — read and follow a 2-sentence instruction
# Arc 19 Phase 1.1 Slot 2 (early-literacy / reading-comprehension strand 9/10 → 14/14 → 10/10 SAT — STRAND-SAT-CLOSING; 20th parent-class strand SAT). Pair partner of Phase 1.1 Slot 1 distinguish-fiction-from-nonfiction. Final canonical target in the reading-comprehension strand. Prerequisite per learning-targets.json: read-cvc-words.

targetSlug: read-and-follow-2-sentence-instruction
language: en
title:
  en: "Read and Follow — putting reading into action with 2-sentence directions"

description:
  en: "Grade 1 / Grade 2 reading-comprehension package teaching kids to READ a short 2-sentence instruction and DO what it says. Critical bridge from decoding to action: kids who can decode CVC words now apply that reading to follow simple multi-step directions ('Color the cat blue. Draw a hat on the cat.' / 'Put 3 stars on your paper. Then circle the biggest star.'). STRAND-SAT-CLOSING package: completes reading-comprehension at 10/10 SAT — final canonical target per learning-targets.json. **20th parent-class strand SATISFIED in the catalog** (advances aggregate parent-class strand-saturation 19/30 → 20/30 = 66.7% per §A.13.33 parent-class methodology; sub-track strand count at 25/30 → 26/30 per Phase 0 audit alternative methodology — documented as detail; parent-class count is canonical-state-of-record per Arc 18 close commit body). Builds on read-cvc-words prerequisite + Arc 17/18 reading-comprehension cluster. Per §A.13.30 K-3 informal framing: read-and-follow-instruction work is CONCRETE READING-AS-ACTION — kids read short directions + immediately execute them in concrete classroom routines (draw, color, sort, find, point). NOT formal procedural-reading pedagogy (which is Grade 3+ work introducing multi-step technical instructions, recipes, sequenced procedures); the Grade 1-2 emphasis is reading-into-doing as the bridge between decoding-fluency + functional-reading. CCSS.RI.1.6 primary anchor + CCSS.RF.1.4 (read with sufficient accuracy + fluency to support comprehension). 5 worksheet exercises + 8 printable materials over a 1-week unit. Materials list mirrors reading-comprehension cluster 8-material Literacy class canonical."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class read-and-do hook. Teacher writes a short 2-
      sentence instruction on the board: "Stand up. Touch your
      nose." Reads it aloud first, then asks the class to read +
      do. Kids stand + touch their noses. Teacher writes another:
      "Sit down. Wave at a friend." Kids do it. Pattern emphasis:
      "When we READ instructions, we don't just say the words —
      we DO what the words tell us. Reading is for DOING things,
      not just for saying sounds." Teacher then introduces the
      sequence-of-2 frame: "These instructions have TWO PARTS.
      First sentence: what to do. Second sentence: what to do
      next. Read BOTH parts. Do BOTH parts in order."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + read-and-do execution routine. Each pair
      receives 6 instruction cards (2-sentence each) + materials
      to execute (crayons, paper, counters, picture cards).
      Examples: "Color the apple red. Draw a leaf on top." / "Put
      3 dots on your paper. Circle the biggest one." / "Find the
      cat card. Place it next to the dog card." Pair takes turns:
      kid A reads the instruction aloud; kid B (or both together)
      executes both sentences in order. Teacher circulates +
      catches errors with re-reading ("you colored the apple
      but skipped the leaf — let's read again: 'Color the apple
      red. Draw a leaf on top.' What's the SECOND thing the
      instruction says to do?"). Critical pedagogical move:
      RE-READ instead of correcting — instruction-following errors
      usually mean kid didn't fully process sentence 2; re-reading
      surfaces the missed step. Optional extension: pair writes
      their own 2-sentence instruction + tests it on the other
      pair (kids LOVE creating instructions for peers; the
      productive-language work reinforces the reading work).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet
      (sequence 2-step instructions in order). Station 2:
      matching worksheet (instruction text → outcome picture).
      Station 3: missing-pieces (kids complete a partial 2-
      sentence instruction with the missing step). Station 4:
      vocabulary-tracing-strips for action vocabulary (color,
      draw, circle, point, find, put, place, write).
  closure:
    durationMinutes: 5
    body: |
      Whole-class strand-SAT-CLOSING celebration + read-and-do
      quick-round. Teacher gives 3 fast instructions; class
      executes each. "Clap twice. Then sit down." "Touch your
      hair. Then wave goodbye." "Smile at a friend. Then stretch
      your arms." Teacher then makes the STRAND-SAT-CLOSING
      announcement: "Today we CLOSED our reading-comprehension
      strand! We started in Pre-K with match-sentence-to-picture,
      then identify-rhyming-pairs, then read-cvc-words... and
      across many packages we built up the FULL set of K-3
      reading-comprehension skills. 10 of 10 targets DONE —
      that's the COMPLETE reading-comprehension strand for K-3.
      Reading isn't just sounding out words; reading is for
      KNOWING and DOING things. Every page you read can teach
      you something or tell you what to do." Forward-pointer:
      "When we come back to reading work, we'll move into more
      advanced phonological awareness (hearing all the sounds
      in words) and phonics decoding (matching letters to
      sounds in longer words). Those are the foundations of
      Grade 2+ independent reading."

