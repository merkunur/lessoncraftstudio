# Teaching package — interpret simple bar graphs
# Arc 13 Phase 1 (early-numeracy / data-and-graphs 2/4 → 3/4).
# Resolves Arc 11 count-and-graph-categories forward-pointer.

targetSlug: interpret-simple-bar-graph
language: en
title:
  en: "Reading Bar Graphs — answer questions from data"
description:
  en: "Grade 1 early-numeracy package teaching bar-graph interpretation. Builds on Arc 9 sort-objects-by-attribute + Arc 11 count-and-graph-categories. RESOLVES Arc 11 forward-pointer ('READ charts that someone ELSE built — and answer questions about the data'). Kids read pre-built bar graphs + answer comparison questions: which category has MOST? LEAST? How many MORE X than Y? Foundational data-literacy bridge from data-construction to data-interpretation. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class graph-reading routine. Teacher displays a sample
      bar graph: 'Favorite fruits — Apples 8; Bananas 5; Oranges 3.'
      Class reads each bar's count. 'Which fruit is MOST favorite?'
      Apples (tallest bar). 'LEAST?' Oranges (shortest). 'How many
      more apple-fans than orange-fans?' 8 - 3 = 5. Reinforces
      MOST/LEAST + COMPARE-AMOUNT framing.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + interpret-the-graph routine. Each pair receives
      6 sample bar graphs + question cards. Pair takes turns: kid A
      reads a question; kid B answers from the graph data. Recast
      errors with explanation ('you said apples + bananas equal — but
      look at the bar heights: apples bar reaches 8; bananas reaches
      5. Apples > bananas').
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: chart-count worksheet. Station 2:
      picture-sort + bar-graph (kids construct + read graphs).
      Station 3: manipulative cut-outs hands-on graph-construction.
      Station 4: matching worksheet (numerical comparison).
  closure:
    durationMinutes: 5
    body: |
      Whole-class graph-quiz. Teacher displays bar graph; class
      collectively answers MOST/LEAST + comparison questions.
      Forward-pointer: 'Today we read bar graphs. When we come back
      to data next, we'll read PICTOGRAPHS — graphs where each picture
      represents a count of items, instead of bar heights.'

