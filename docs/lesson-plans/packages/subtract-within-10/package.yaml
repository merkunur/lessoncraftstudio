assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compute subtraction within 10 correctly in 8 of 10 trials.
      - Use count-back strategy when prompted in 6 of 10 trials.
      - Solve simple missing-operand problems (10-?=6) in 5 of 10
        trials.

    Differentiation:
    - Pre-K: review subtract-within-5; no within-10 work yet.
    - K: subtraction within 7; intro to within 10.
    - Grade 1+: subtraction within 10 fluent; extend to within-20
      + bridge to subtraction-with-regrouping (two-digit minus
      one-digit with regrouping).

