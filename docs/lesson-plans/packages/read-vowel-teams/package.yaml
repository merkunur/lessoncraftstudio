assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the vowel-team in a written word (rain, see, boat)
        and produce the corresponding long-vowel sound in 8 of 10
        trials.
      - Read 8 unfamiliar vowel-team words (e.g., 'snail', 'green',
        'soap', 'sigh') correctly in 7 of 10 trials.
      - Apply the two-vowels-walking rule to predict the long-vowel
        sound from spelling pattern in 6 of 10 trials.

    Differentiation:
    - Pre-K: read-only vowel-team review with picture support; long-
      vowel sound matching only.
    - Kindergarten: 4 most-frequent vowel teams (ai, ee, oa, ay) +
      independent reading.
    - Grade 1+: extend full vowel-team set (ai, ay, ee, ea, oa, ow,
      ie, igh) + bridge to r-controlled-vowel phonics work +
      diphthong patterns (ou, oy, oi).

