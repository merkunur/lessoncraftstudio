compositionalRationale:
  en: |
    Primary strand: world-knowledge / living-things (plant life cycle).
    Secondary strand: vocabulary acquisition (vocab-anchored — plant-
    parts vocabulary: seed, sprout, root, stem, leaf, flower, petal).
    Tertiary strand: sequencing + cyclic reasoning (kids order stages
    + recognize the cycle returns to beginning).

    Architectural significance: deepens living-things strand from 2/6
    → 3/6. Builds on Arc 5 classify-animals-by-diet + classify-animals-
    by-habitat (existing living-things packages). Plant life cycle
    extends "living-things" from animal-classification to plant-process
    — covers both kingdoms in living-things strand.

    Distinctive composition: matching + picture-sort + matching + word-
    guess + odd-one-out — multi-app composition spans recognition,
    classification, recall, and exclusion. The 5-exercise composition
    targets life-cycle knowledge from multiple cognitive angles.

    Cross-strand integration: world-knowledge living-things + sequencing
    cognition (Arc 5 ordering work) + vocabulary acquisition. Life-
    cycle work is rich cross-strand surface — sequential reasoning
    + new vocabulary + scientific concept all activated simultaneously.

    Class B FLEXIBLE substrate: composes against fruits theme (which
    contains plant-products) + image-library breadth. Substrate-
    readiness universal across themes that have plant-related items.

    K-3 multilingual classroom relevance: plant-life-cycle vocabulary
    is high-frequency K-3 science target across all 11 platform
    locales. Cognate richness across Romance locales: seed (en) /
    semilla (es) / semente (pt-BR) / semence (fr) / seme (it). Plant
    growing observations are universal — kids in any locale can
    observe plants growing; the package's universality makes it
    cross-locale-portable. Sequential narrative ('first the seed,
    then the sprout, then...') is exactly the kind of sequence-
    narration grammatical practice K-3 multilingual classrooms need.

