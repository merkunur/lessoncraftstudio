<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Find the Odd One Out - Theme Safari Variety Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1000px;
            height: 1000px;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }
        .container {
            width: 1000px;
            height: 1000px;
            background: linear-gradient(180deg, #E0F2FE 0%, #FEF3C7 60%, #FDE68A 100%);
            position: relative;
            overflow: hidden;
        }
        .sun {
            position: absolute;
            top: 30px;
            right: 70px;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #FACC15 0%, #F59E0B 70%, #D97706 100%);
            border-radius: 50%;
            box-shadow: 0 0 70px rgba(250,204,21,0.6);
        }
        .safari-hat {
            position: absolute;
            top: 15px;
            left: 25px;
            font-size: 75px;
            transform: rotate(-12deg);
            z-index: 20;
        }
        .title-section {
            position: absolute;
            top: 45px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }
        .main-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            line-height: 0.95;
        }
        .explore {
            font-size: 65px;
            color: #0F766E;
            text-shadow: 3px 3px 0 rgba(15,118,110,0.15);
            letter-spacing: -1px;
        }
        .themes {
            font-size: 72px;
            color: #F97316;
            text-shadow: 3px 3px 0 rgba(249,115,22,0.15);
            letter-spacing: -2px;
        }
        .subtitle {
            font-size: 26px;
            color: #0F766E;
            font-weight: 800;
            margin-top: 5px;
        }
        .grade-badge {
            position: absolute;
            top: 30px;
            left: 115px;
            background: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 16px;
            color: #0F766E;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            z-index: 20;
        }
        .free-badge {
            position: absolute;
            top: 85px;
            right: 35px;
            background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
            padding: 12px 24px;
            border-radius: 25px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: white;
            box-shadow: 0 5px 18px rgba(34,197,94,0.45);
            z-index: 20;
        }
        .theme-grid {
            position: absolute;
            top: 230px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: 240px 240px;
            grid-template-rows: 200px 200px;
            gap: 25px;
            z-index: 15;
        }
        .theme-card {
            background: white;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
            position: relative;
        }
        .theme-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            object-position: top;
            border-radius: 10px;
        }
        .theme-badge {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 18px;
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 14px;
            color: white;
            white-space: nowrap;
        }
        .badge-green { background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%); box-shadow: 0 4px 12px rgba(34,197,94,0.4); }
        .badge-blue { background: linear-gradient(135deg, #5BC0EB 0%, #3B82F6 100%); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
        .badge-orange { background: linear-gradient(135deg, #F97316 0%, #EA580C 100%); box-shadow: 0 4px 12px rgba(249,115,22,0.4); }
        .badge-pink { background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%); box-shadow: 0 4px 12px rgba(236,72,153,0.4); }

        .dotted-trail {
            position: absolute;
            z-index: 5;
        }
        .theme-icons {
            position: absolute;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            z-index: 15;
        }
        .theme-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.12);
            border: 3px solid;
        }
        .grass {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: linear-gradient(to top, #22C55E 0%, transparent 100%);
            opacity: 0.25;
        }
        .features-bar {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 15;
        }
        .feature-pill {
            background: #0F766E;
            padding: 11px 22px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 16px;
            color: white;
            box-shadow: 0 4px 15px rgba(15,118,110,0.35);
        }
        .safari-animal {
            position: absolute;
            font-size: 38px;
            z-index: 5;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sun -->
        <div class="sun"></div>

        <!-- Safari hat -->
        <div class="safari-hat">🎩</div>

        <!-- Safari animals -->
        <div class="safari-animal" style="top: 200px; left: 55px;">🦁</div>
        <div class="safari-animal" style="top: 350px; left: 40px;">🐠</div>
        <div class="safari-animal" style="top: 200px; right: 60px;">🦌</div>
        <div class="safari-animal" style="top: 380px; right: 45px;">🎄</div>
        <div class="safari-animal" style="bottom: 200px; left: 90px;">🐢</div>
        <div class="safari-animal" style="bottom: 220px; right: 85px;">🍎</div>

        <!-- Grade badge -->
        <div class="grade-badge">GRADES PreK-2</div>

        <!-- FREE badge -->
        <div class="free-badge">FREE</div>

        <!-- Main title -->
        <div class="title-section">
            <div class="main-title">
                <div class="explore">EXPLORE</div>
                <div class="themes">THEMES</div>
            </div>
            <div class="subtitle">Discover Multiple Categories!</div>
        </div>

        <!-- Dotted trails connecting cards -->
        <svg class="dotted-trail" style="top: 280px; left: 280px;" width="450" height="350" viewBox="0 0 450 350">
            <path d="M 100 50 Q 225 100 350 50" stroke="#0F766E" stroke-width="3" fill="none" stroke-dasharray="8 6" opacity="0.3"/>
            <path d="M 100 50 Q 100 175 100 300" stroke="#0F766E" stroke-width="3" fill="none" stroke-dasharray="8 6" opacity="0.3"/>
            <path d="M 350 50 Q 350 175 350 300" stroke="#0F766E" stroke-width="3" fill="none" stroke-dasharray="8 6" opacity="0.3"/>
            <path d="M 100 300 Q 225 250 350 300" stroke="#0F766E" stroke-width="3" fill="none" stroke-dasharray="8 6" opacity="0.3"/>
        </svg>

        <!-- Theme preview cards - 2x2 grid -->
        <div class="theme-grid">
            <!-- Animals -->
            <div class="theme-card" style="transform: rotate(-2deg);">
                <img src="https://www.lessoncraftstudio.com/samples/english/odd%20one%20out/sample-1.jpeg" alt="Animals Theme">
                <div class="theme-badge badge-green">Animals</div>
            </div>

            <!-- Sea Creatures -->
            <div class="theme-card" style="transform: rotate(2deg);">
                <img src="https://www.lessoncraftstudio.com/samples/english/odd%20one%20out/sample-5.jpeg" alt="Sea Creatures Theme">
                <div class="theme-badge badge-blue">Sea Creatures</div>
            </div>

            <!-- Nature -->
            <div class="theme-card" style="transform: rotate(1deg);">
                <img src="https://www.lessoncraftstudio.com/samples/english/odd%20one%20out/sample-8.jpeg" alt="Nature Theme">
                <div class="theme-badge badge-orange">Nature</div>
            </div>

            <!-- Christmas -->
            <div class="theme-card" style="transform: rotate(-1deg);">
                <img src="https://www.lessoncraftstudio.com/samples/english/odd%20one%20out/sample-12.jpeg" alt="Christmas Theme">
                <div class="theme-badge badge-pink">Christmas</div>
            </div>
        </div>

        <!-- Theme icon row -->
        <div class="theme-icons">
            <div class="theme-icon" style="border-color: #22C55E;">🐾</div>
            <div class="theme-icon" style="border-color: #5BC0EB;">🐟</div>
            <div class="theme-icon" style="border-color: #F97316;">🍕</div>
            <div class="theme-icon" style="border-color: #EC4899;">🎄</div>
            <div class="theme-icon" style="border-color: #14B8A6;">🌸</div>
            <div class="theme-icon" style="border-color: #8B5CF6;">🚗</div>
        </div>

        <!-- Grass -->
        <div class="grass"></div>

        <!-- Features bar -->
        <div class="features-bar">
            <div class="feature-pill">Animals</div>
            <div class="feature-pill">Sea Life</div>
            <div class="feature-pill">Food</div>
            <div class="feature-pill">Nature</div>
            <div class="feature-pill">Holiday</div>
        </div>
    </div>
</body>
</html>
