<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Number Line — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=13">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then the tool, then boot. Absolute /mini-tools/ paths
       so embeds + cross-context loads resolve identically. -->
  <script src="/mini-tools/lcs-shell.js"></script>
  <script src="/mini-tools/number-line.js"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    //   ?sound=off      — start with the sound control muted
    LCS.mount(NumberLine, { mount: '#lcs-root' });
  </script>
</body>
</html>
