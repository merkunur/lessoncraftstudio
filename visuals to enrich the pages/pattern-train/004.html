<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Pattern Train - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #64B5F6 0%, #90CAF9 40%, #FFF59D 100%); overflow: hidden;">

        <!-- Decorative clouds -->
        <div style="position: absolute; top: 60px; left: 50px; width: 180px; height: 80px; background: white; border-radius: 50px; opacity: 0.9; box-shadow: 0 5px 15px rgba(0,0,0,0.1);"></div>
        <div style="position: absolute; top: 40px; left: 100px; width: 100px; height: 60px; background: white; border-radius: 50px; opacity: 0.9;"></div>
        <div style="position: absolute; top: 100px; right: 80px; width: 150px; height: 70px; background: white; border-radius: 50px; opacity: 0.9; box-shadow: 0 5px 15px rgba(0,0,0,0.1);"></div>
        <div style="position: absolute; top: 70px; right: 150px; width: 90px; height: 50px; background: white; border-radius: 50px; opacity: 0.9;"></div>

        <!-- Confetti dots scattered throughout -->
        <div style="position: absolute; top: 180px; left: 80px; width: 18px; height: 18px; background: #E53935; border-radius: 50%;"></div>
        <div style="position: absolute; top: 220px; left: 150px; width: 14px; height: 14px; background: #4CAF50; border-radius: 50%;"></div>
        <div style="position: absolute; top: 160px; right: 120px; width: 16px; height: 16px; background: #FF9800; border-radius: 50%;"></div>
        <div style="position: absolute; top: 240px; right: 200px; width: 12px; height: 12px; background: #9C27B0; border-radius: 50%;"></div>
        <div style="position: absolute; top: 300px; left: 40px; width: 14px; height: 14px; background: #2196F3; border-radius: 50%;"></div>
        <div style="position: absolute; top: 350px; right: 60px; width: 16px; height: 16px; background: #E91E63; border-radius: 50%;"></div>
        <div style="position: absolute; top: 550px; left: 60px; width: 12px; height: 12px; background: #FFEB3B; border-radius: 50%;"></div>
        <div style="position: absolute; top: 600px; right: 100px; width: 18px; height: 18px; background: #00BCD4; border-radius: 50%;"></div>

        <!-- Stars scattered -->
        <div style="position: absolute; top: 200px; left: 200px; font-size: 28px;">⭐</div>
        <div style="position: absolute; top: 280px; right: 150px; font-size: 24px;">✨</div>
        <div style="position: absolute; top: 480px; left: 100px; font-size: 22px;">⭐</div>
        <div style="position: absolute; top: 520px; right: 80px; font-size: 26px;">✨</div>
        <div style="position: absolute; top: 380px; left: 50px; font-size: 20px;">⭐</div>

        <!-- ALL ABOARD! Comic burst badge -->
        <div style="position: absolute; top: 25px; left: 50%; transform: translateX(-50%); z-index: 100;">
            <div style="background: linear-gradient(135deg, #E53935 0%, #C62828 100%); padding: 20px 40px; border-radius: 10px; box-shadow: 0 6px 25px rgba(229,57,53,0.5); position: relative;">
                <!-- Burst effect -->
                <div style="position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; background: #FFEB3B; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); z-index: -1; transform: scale(1.3);"></div>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 42px; color: white; text-shadow: 3px 3px 0 rgba(0,0,0,0.3); letter-spacing: 3px;">ALL ABOARD!</span>
            </div>
        </div>

        <!-- Floating ABC letter blocks - these CAN rotate -->
        <div style="position: absolute; top: 170px; left: 60px; transform: rotate(-15deg);">
            <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #E53935 0%, #C62828 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(229,57,53,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 42px; color: white;">A</span>
            </div>
        </div>
        <div style="position: absolute; top: 150px; right: 100px; transform: rotate(12deg);">
            <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #3498DB 0%, #2980B9 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(52,152,219,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 42px; color: white;">B</span>
            </div>
        </div>
        <div style="position: absolute; top: 250px; left: 150px; transform: rotate(8deg);">
            <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #F7941D 0%, #E67E00 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(247,148,29,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; color: white;">A</span>
            </div>
        </div>
        <div style="position: absolute; top: 280px; right: 70px; transform: rotate(-10deg);">
            <div style="width: 55px; height: 55px; background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(156,39,176,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; color: white;">B</span>
            </div>
        </div>

        <!-- PATTERN FUN! rainbow gradient text -->
        <div style="position: absolute; top: 320px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 80px; margin: 0; background: linear-gradient(90deg, #E53935, #FF9800, #FFEB3B, #4CAF50, #2196F3, #9C27B0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-shadow: none; filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.1));">PATTERN FUN!</h1>
        </div>

        <!-- Large detailed locomotive -->
        <div style="position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); width: 450px; height: 200px;">
            <!-- Train body -->
            <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 350px; height: 130px; background: linear-gradient(180deg, #F7941D 0%, #E67E00 100%); border-radius: 20px 80px 15px 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.25);">
                <!-- Window -->
                <div style="position: absolute; top: 20px; right: 40px; width: 70px; height: 50px; background: linear-gradient(180deg, #87CEEB 0%, #64B5F6 100%); border-radius: 12px; border: 6px solid #FFD200;"></div>
                <!-- Train front bumper -->
                <div style="position: absolute; top: 25px; left: -25px; width: 50px; height: 80px; background: linear-gradient(180deg, #E74C3C 0%, #C0392B 100%); border-radius: 25px 0 0 25px;"></div>
                <!-- Decorative stripe -->
                <div style="position: absolute; bottom: 25px; left: 20px; right: 20px; height: 15px; background: #FFD200; border-radius: 8px;"></div>
            </div>
            <!-- Chimney -->
            <div style="position: absolute; bottom: 170px; left: 120px; width: 45px; height: 70px; background: linear-gradient(180deg, #333 0%, #555 100%); border-radius: 8px 8px 0 0;"></div>
            <div style="position: absolute; bottom: 235px; left: 110px; width: 65px; height: 20px; background: #444; border-radius: 8px;"></div>
            <!-- Steam puffs from chimney -->
            <div style="position: absolute; bottom: 260px; left: 115px; width: 55px; height: 55px; background: rgba(255,255,255,0.9); border-radius: 50%; filter: blur(5px);"></div>
            <div style="position: absolute; bottom: 290px; left: 140px; width: 40px; height: 40px; background: rgba(255,255,255,0.7); border-radius: 50%; filter: blur(5px);"></div>
            <div style="position: absolute; bottom: 310px; left: 125px; width: 30px; height: 30px; background: rgba(255,255,255,0.5); border-radius: 50%; filter: blur(4px);"></div>
            <!-- Wheels -->
            <div style="position: absolute; bottom: 15px; left: 100px; width: 70px; height: 70px; background: radial-gradient(circle, #666 35%, #333 55%, #666 75%); border-radius: 50%; border: 8px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.3);"></div>
            <div style="position: absolute; bottom: 15px; left: 220px; width: 70px; height: 70px; background: radial-gradient(circle, #666 35%, #333 55%, #666 75%); border-radius: 50%; border: 8px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.3);"></div>
            <div style="position: absolute; bottom: 15px; right: 50px; width: 60px; height: 60px; background: radial-gradient(circle, #666 35%, #333 55%, #666 75%); border-radius: 50%; border: 6px solid #444; box-shadow: 0 4px 15px rgba(0,0,0,0.3);"></div>
        </div>

        <!-- Cute animal emojis from worksheets -->
        <div style="position: absolute; top: 450px; left: 40px; font-size: 50px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));">🦊</div>
        <div style="position: absolute; top: 420px; right: 50px; font-size: 50px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));">🐦</div>
        <div style="position: absolute; top: 500px; left: 120px; font-size: 40px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));">🐭</div>

        <!-- Scissors with dashed cut line -->
        <div style="position: absolute; bottom: 120px; left: 60px;">
            <span style="font-size: 50px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));">✂️</span>
            <div style="position: absolute; top: 25px; left: 55px; width: 200px; height: 4px; border-top: 4px dashed #333;"></div>
        </div>

        <!-- Kids LOVE This! pink banner -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #E91E63 0%, #C2185B 100%); padding: 18px 50px; border-radius: 40px; box-shadow: 0 6px 25px rgba(233,30,99,0.4);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.2);">Kids LOVE This!</span>
        </div>

        <!-- FREE badge -->
        <div style="position: absolute; bottom: 100px; right: 40px; background: #4CAF50; padding: 10px 22px; border-radius: 20px; box-shadow: 0 4px 15px rgba(76,175,80,0.4); transform: rotate(5deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">FREE</span>
        </div>

    </div>
</body>
</html>
