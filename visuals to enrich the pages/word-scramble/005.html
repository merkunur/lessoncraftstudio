<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Word Scramble - Professional Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(145deg, #042F2E 0%, #134E4A 50%, #042F2E 100%);">

        <!-- Subtle gold grid pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image:
            linear-gradient(to right, #D4A439 1px, transparent 1px),
            linear-gradient(to bottom, #D4A439 1px, transparent 1px);
            background-size: 50px 50px;"></div>

        <!-- Gold corner brackets -->
        <div style="position: absolute; top: 20px; left: 20px; width: 80px; height: 80px; border-left: 4px solid #D4A439; border-top: 4px solid #D4A439;"></div>
        <div style="position: absolute; top: 20px; right: 20px; width: 80px; height: 80px; border-right: 4px solid #D4A439; border-top: 4px solid #D4A439;"></div>
        <div style="position: absolute; bottom: 20px; left: 20px; width: 80px; height: 80px; border-left: 4px solid #D4A439; border-bottom: 4px solid #D4A439;"></div>
        <div style="position: absolute; bottom: 20px; right: 20px; width: 80px; height: 80px; border-right: 4px solid #D4A439; border-bottom: 4px solid #D4A439;"></div>

        <!-- Premium Quality Seal - top center -->
        <div style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%);">
            <div style="width: 130px; height: 130px; background: linear-gradient(145deg, #D4A439 0%, #B8860B 50%, #D4A439 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(212,164,57,0.4), inset 0 2px 4px rgba(255,255,255,0.3); border: 4px solid #042F2E;">
                <div style="width: 105px; height: 105px; background: #042F2E; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #D4A439;">
                    <span style="font-size: 28px;">🏆</span>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 800; color: #D4A439; text-align: center; line-height: 1.1; letter-spacing: 1px;">PREMIUM<br>QUALITY</span>
                </div>
            </div>
        </div>

        <!-- FREE pill - top left -->
        <div style="position: absolute; top: 40px; left: 50px;">
            <div style="background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); padding: 10px 22px; border-radius: 25px; box-shadow: 0 4px 15px rgba(249,115,22,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: white;">FREE</span>
            </div>
        </div>

        <!-- Grade Badge - gold-bordered pill -->
        <div style="position: absolute; top: 45px; right: 50px;">
            <div style="background: rgba(212,164,57,0.2); padding: 10px 20px; border-radius: 20px; border: 2px solid #D4A439;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; color: #D4A439; letter-spacing: 1px;">GRADES K-1</span>
            </div>
        </div>

        <!-- Product Title -->
        <div style="position: absolute; top: 175px; left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 48px; font-weight: 700; color: #F0FDFA; letter-spacing: 2px;">Word Scramble</h1>
            <p style="margin: 6px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 600; color: #D4A439; letter-spacing: 4px;">WORKSHEET GENERATOR</p>
        </div>

        <!-- Decorative gold accent lines -->
        <div style="position: absolute; top: 250px; left: 50px; width: 60px; height: 2px; background: linear-gradient(90deg, transparent, #D4A439);"></div>
        <div style="position: absolute; top: 250px; right: 50px; width: 60px; height: 2px; background: linear-gradient(90deg, #D4A439, transparent);"></div>

        <!-- Golden ambient glow behind center worksheet -->
        <div style="position: absolute; top: 350px; left: 50%; transform: translateX(-50%); width: 400px; height: 500px; background: radial-gradient(ellipse, rgba(212,164,57,0.25) 0%, transparent 70%); pointer-events: none;"></div>

        <!-- Center worksheet display -->
        <div style="position: absolute; top: 300px; left: 50%; transform: translateX(-50%); z-index: 10;">
            <div style="width: 270px; height: 351px; background: white; border-radius: 10px; box-shadow: 0 15px 50px rgba(0,0,0,0.5), 0 0 60px rgba(212,164,57,0.3); overflow: hidden; border: 4px solid #D4A439;">
                <img src="https://www.lessoncraftstudio.com/samples/english/word%20scramble/sample-5.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Professional Worksheet">
            </div>
        </div>

        <!-- Side preview - Answer Key (left) -->
        <div style="position: absolute; top: 360px; left: 75px; z-index: 5;">
            <div style="width: 190px; height: 247px; background: white; border-radius: 8px; box-shadow: 0 10px 35px rgba(0,0,0,0.4); overflow: hidden; border: 3px solid #4A5568;">
                <img src="https://www.lessoncraftstudio.com/samples/english/word%20scramble/sample-5-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Answer Key">
            </div>
            <div style="position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); background: #0D9488; padding: 5px 15px; border-radius: 12px;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; color: white;">ANSWER KEY</span>
            </div>
        </div>

        <!-- Side preview - Different theme (right) -->
        <div style="position: absolute; top: 360px; right: 75px; z-index: 5;">
            <div style="width: 190px; height: 247px; background: white; border-radius: 8px; box-shadow: 0 10px 35px rgba(0,0,0,0.4); overflow: hidden; border: 3px solid #4A5568;">
                <img src="https://www.lessoncraftstudio.com/samples/english/word%20scramble/sample-10.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Different Theme Worksheet">
            </div>
            <div style="position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); background: #134E4A; padding: 5px 15px; border-radius: 12px; border: 1px solid #D4A439;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; color: #D4A439;">MULTIPLE THEMES</span>
            </div>
        </div>

        <!-- Feature cards - frosted glass effect -->
        <div style="position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px;">
            <!-- Card 1 - No Prep -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(212,164,57,0.3); text-align: center; min-width: 135px;">
                <span style="font-size: 24px;">✅</span>
                <p style="margin: 6px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #F0FDFA; line-height: 1.2;">No Prep<br><span style="color: #D4A439; font-size: 11px;">Ready to Print</span></p>
            </div>
            <!-- Card 2 - 4 Levels -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(212,164,57,0.3); text-align: center; min-width: 135px;">
                <span style="font-size: 24px;">📊</span>
                <p style="margin: 6px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #F0FDFA; line-height: 1.2;">4 Levels<br><span style="color: #D4A439; font-size: 11px;">Easy to Expert</span></p>
            </div>
            <!-- Card 3 - Answer Keys -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(212,164,57,0.3); text-align: center; min-width: 135px;">
                <span style="font-size: 24px;">🔑</span>
                <p style="margin: 6px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #F0FDFA; line-height: 1.2;">Answer Keys<br><span style="color: #D4A439; font-size: 11px;">Included</span></p>
            </div>
            <!-- Card 4 - Picture Clues -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(212,164,57,0.3); text-align: center; min-width: 135px;">
                <span style="font-size: 24px;">🖼️</span>
                <p style="margin: 6px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #F0FDFA; line-height: 1.2;">Picture<br><span style="color: #D4A439; font-size: 11px;">Clues</span></p>
            </div>
        </div>

        <!-- Bottom gold strip -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: linear-gradient(90deg, #042F2E 0%, #D4A439 20%, #D4A439 80%, #042F2E 100%); display: flex; align-items: center; justify-content: center;">
            <span style="font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 800; color: #042F2E; letter-spacing: 5px;">TEACHER-READY QUALITY</span>
        </div>

    </div>
</body>
</html>
