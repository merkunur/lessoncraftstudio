assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Follow 3-step instructions accurately in 7 of 10
        trials.
      - Use at least one sequence-tracking strategy (finger-
        counting / head-nod-per-step / mental rehearsal) in
        6 of 8 observed instances.
      - Identify the connector / sequence-anchor word in a 3-
        step instruction (FIRST / THEN / FINALLY / NEXT /
        LAST) in 6 of 10 trials.
      - Restate a 3-step instruction in own words in 5 of 8
        trials.
      - Avoid skipping-middle-step error pattern in 5 of 8
        attempts after sequence-tracking strategy training.
      - Generate own 3-step instruction for a peer
        (productive-language extension) in 4 of 6 trials.
      - Use vocabulary 'instruction' / 'direction' / 'step' /
        'first' / 'then' / 'finally' / 'follow' correctly in
        5 of 10 productive-language trials.

    Differentiation:
    - Pre-K: 2-step instructions only with concrete physical
      actions; defer 3-step to K-Grade 1.
    - K: 3-step instructions with both physical + visual
      actions; sequence-tracking strategy training is
      load-bearing.
    - Grade 1: full 3-step instruction reading + execution +
      sequence-tracking strategies; bridge to peer-instruction
      generation (productive-language) + 4-step extension for
      ready kids.
    - Grade 2+: extend to 4-step + 5-step instructions +
      multi-clause sentences; introduce instructional-text-
      feature awareness (numbered lists; sequence markers in
      written contexts; bridge to Phase 1.1 Slot 2 written-
      instruction work).
    - Grade 3+: full procedural-listening pedagogy (technical
      instructions; recipes; sequenced procedures); bridge
      to multi-step word problems + classroom-procedure
      authoring.

