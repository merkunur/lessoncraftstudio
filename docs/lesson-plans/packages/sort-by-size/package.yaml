# Teaching package — sort objects by size
# Arc 7 Phase 1 (Path B; cognitive-and-executive-function / sorting-and-
# classification strand). Closes the basic-attribute-sorting trilogy with
# Arc 5 Phase 3 sort-by-color + sort-by-shape. Class B FLEXIBLE; substrate-
# clean against image-library breadth + use-size-comparison-words (Arc 6
# Phase 1) provides the size-vocabulary substrate.

targetSlug: sort-by-size
language: en
title:
  en: "Sort by Size — group objects by size attribute"
description:
  en: "Pre-K to Grade 1 cognitive-and-executive-function package teaching size-based attribute sorting. Closes the basic-attribute-sorting trilogy: sort-by-color (Arc 5 Phase 3) + sort-by-shape (Arc 5 Phase 3) + sort-by-size (this package). Cognitive transfer surface: kids who learned color/shape sorting now hold 'size' as the rule. Vocab-anchored against use-size-comparison-words (Arc 6 Phase 1). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher places 3 objects of contrasting
      sizes on the carpet (e.g., a large stuffed bear, a medium-sized
      stuffed bear, a small stuffed bear). Names each: "This is BIG,
      this is MEDIUM, this is SMALL." Class repeats. Then mixes more
      objects of varied sizes; class collaboratively places each on
      labeled "BIG / MEDIUM / SMALL" mats. Reinforces size-vocabulary
      (from use-size-comparison-words; Arc 6 Phase 1) + the meta-skill
      of "looking through" a group for one attribute (size).
  contentActivity:
    durationMinutes: 12
    body: |
      Whole-class sorting routine. Teacher places 3 size-mat cards (BIG /
      MEDIUM / SMALL) on the carpet. Holds up mixed objects of varied
      sizes; class collaboratively places each on the matching mat.
      Pair work: kid A picks an object; kid B identifies its size and
      places it. Recast errors. Optional extension: kids notice that
      size is RELATIVE (a small dog is small compared to a horse but big
      compared to a mouse) — discuss attribute-context dependency.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (sort objects
      between 2 size contrasts — big vs small). Station 2: big-small
      worksheet (kids identify which of 2 objects is bigger/smaller).
      Station 3: manipulative cut-outs hands-on size sorting (kids
      physically place 20+ cut-outs on 3 size-mats; emphasizes multiple-
      object sustained sorting attention).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names a size; kids show with
      classroom objects ("everyone find something SMALL!"). Forward-
      pointer: "Today we sorted by size. Now we know how to sort by
      COLOR, SHAPE, and SIZE — three different ways to look at the
      same objects."

