compositionalRationale:
  en: |
    Primary strand: early-numeracy / measurement
    (order-3-objects-by-length — STRAND-SAT-CLOSING 8/9 → 9/9 SAT).
    **21st parent-class strand SATISFIED in the catalog** (advances
    aggregate parent-class strand-saturation 20/30 → 21/30 = 70.0%
    per §A.13.33 parent-class methodology). Final canonical target
    per learning-targets.json measurement strand enumeration (9
    targets total; order-3-objects-by-length at line 255 closes the
    strand). Per §A.13.31 per-instance content-awareness:
    `compare-by-length/package.yaml` (Arc 9 P1; FIRST measurement
    strand package) is the canonical Numeracy/Measurement 7-material
    precedent — this package mirrors compare-by-length's materials
    + composedExercises shape with transitive-ordering pedagogical
    extension.

    Architectural significance: SAT-CLOSES the measurement strand
    at 9/9. Direct extension of compare-by-length (Arc 9 P1) from
    pairwise comparison to 3-object ordering requiring TRANSITIVE
    REASONING. Cognitive progression: 2-object direct comparison
    (compare-by-length) → 3-object transitive ordering (this
    package). Transitive reasoning is the cognitive bridge from
    pre-formal comparison to formal measurement-unit application
    (Grade 1-2+ work outside K-3 catalog scope). Closing the
    measurement strand here completes the pre-formal-measurement
    foundation across all 5 measurement attributes (length +
    weight + capacity + time + money/value).

    Per §A.13.30 K-1 informal framing: Grade 1 ordering work is
    CONCRETE PHYSICAL ORDERING. Kids handle 3 objects + arrange
    them in a line shortest-to-longest, naming the order verbally
    ('the shortest is the worm; the middle is the snake; the
    longest is the ribbon'). The pedagogy uses everyday language
    + the side-by-side direct-comparison technique (line objects
    up with bottom edges aligned). NOT formal measurement-unit
    application — rulers + numerical units are Grade 1-2+ work;
    this package stays pre-formal. Critical pedagogical move
    documented in contentActivity: TRANSITIVE REASONING explicit
    chaining ('A < B and B < C, so A < C too — A must be
    shortest of all three'). Kids who mastered compare-by-length
    pairwise sometimes struggle to chain comparisons across 3
    objects; the explicit chaining scaffolds the cognitive
    operation.

    Per §A.13.29 ground-truth source-citation: composedExercises
    cite `REFERENCE APPS/big-small.html` (find-one + order-n
    modes for biggest/smallest + ordering work) + `REFERENCE
    APPS/matching.html` (imgname mode for vocab-anchored
    length-relevant words) + `REFERENCE APPS/picture-sort.html`
    (theme mode for size-categorization work) + `REFERENCE
    APPS/odd-one-out.html` (unified mode for triplet
    odd-out-by-size pedagogy).

    Cross-reference to compare-by-length (prerequisite per
    learning-targets.json line 255): kids must master pairwise
    comparison ('which is longer?') before ordering 3 objects.
    This package operationalizes the transitive extension via
    explicit 3-object scaffolding + side-by-side direct
    comparison technique.

    Cross-reference to compare-by-weight + compare-by-capacity
    (sibling measurement-attribute packages): those packages
    established pre-formal comparison work for weight + capacity
    attributes. Length is the canonical entry-point because
    visual length-difference is the most perceptually-direct of
    the 5 measurement attributes (weight + capacity require
    physical lifting + filling; time + money are abstract).
    Closing length-strand with the 3-object ordering target
    completes the canonical K-1 pre-formal measurement
    pedagogy.

    Materials note: 7-material Numeracy/Measurement class stack
    per §A.13.37 + canonical compare-by-length precedent.
    Materials structure mirrors compare-by-length's vocab-
    anchored Class B FLEXIBLE substrate (themes: animals +
    vehicles provide meaningful length-variation across familiar
    K-1 vocabulary — snake/worm + bus/car/motorcycle have
    visually-distinct length ranges). Manipulative-cut-outs at
    position 5 emits canonical-correct `mode: single-repeat`
    per §A.13.35.

    Distinctive composition: big-small ×2 (positions 1+3 with
    `order-n` exerciseMode for explicit 3-object ordering) +
    matching (position 2) + picture-sort (position 4) +
    odd-one-out (position 5). big-small `order-n` mode is the
    closest existing surface for 3-object ordering work — its
    core mechanic (order N items by size attribute) maps
    naturally to length-ordering. Substitution from "size" to
    "length" framing is operator-strategic at composition time
    — same app surface, different vocabulary frame.

    Class B FLEXIBLE substrate: composes against image-library
    breadth. Length-ordering works with ANY 3 objects of
    distinct length; substrate-readiness universal across themes
    with meaningful length-variation. No substrate gaps; ships
    clean.

    K-3 multilingual classroom relevance: superlative grammar
    structures ('shortest' / 'longest') are mid-frequency K-1
    grammatical targets across all 11 platform locales. Kids
    in target-language-immersion contexts often acquire base
    vocabulary + comparative grammar (longer/shorter) before
    superlative grammar (shortest/longest). This package
    surfaces superlative grammar as explicit pedagogical
    target. Productive-language frames ('the shortest is the
    X / the longest is the Y / the middle is the Z') give
    structured grammatical practice.

