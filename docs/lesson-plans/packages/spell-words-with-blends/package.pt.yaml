# Teaching package — spell words with consonant blends (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 19 Phase 1.4 per Arc 13 Phase 3 sparse-override pattern).
# pt sparse-override for early-literacy / spelling-and-encoding strand.
# Pt-BR uses consonant-cluster blends in initial position similar to en
# (tr-/pr-/br-/cr- common), so the package transfers structurally with
# locale-canonical vocabulary substitutions. Reciprocidade leitura-escrita
# pairs with pt-BR phonics-decoding work.
# BR-MEC educação infantil register per CLAUDE.md §6 + formal "você"
# address per §17.9. BNCC EF01LP08 + EF02LP05 crosswalk.

title:
  pt: "Escrever Encontros Consonantais — trem, prato, bruxa, flor, plano"
description:
  pt: "Pacote de letramento inicial para o 1º-2º ano que ensina crianças a escrever palavras pt-BR com encontros consonantais — clusters de duas consoantes no início da palavra (tr-, pr-, br-, cr-, dr-, fr-, gr-, fl-, pl-, gl-, cl-, bl-). Constrói sobre o trabalho spell-cvc-words do Arco 12. Reciprocidade leitura-escrita: pareia foneticamente com o trabalho read-consonant-blends pt-BR-equivalente. As crianças ouvem uma palavra com encontro consonantal + escrevem o cluster correto no início. Especificidade pt-BR: o pt-BR usa encontros consonantais semelhantes ao en, mas o R em pt-BR tem realização diferente — tr- (trem, /tɾ/), pr- (prato, /pɾ/), br- (bruxa, /bɾ/), cr- (cravo, /kɾ/), dr- (dragão, /dɾ/), fr- (frio, /fɾ/), gr- (grande, /gɾ/). pt-BR também usa fl- (flor), pl- (plano), gl- (glóbulo, raro), cl- (clarão), bl- (bloco, raro). 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Rotina de escreva-o-encontro com toda a turma. A professora ou
      o professor diz 'trem' + escreve T-R-E-M no quadro
      lentamente, soletrando cada letra: 't-r-e-m... trem. As duas
      primeiras letras são TR — é um encontro consonantal. Tanto T
      quanto R fazem som: /t/-/ɾ/.' A turma repete. Depois a
      professora esconde a palavra + diz 'prato' em voz alta. A
      turma soletra as duas primeiras letras: 'P... R... prato começa
      com PR.' Repita com: 'bruxa' (B-R); 'flor' (F-L); 'plano'
      (P-L); 'cravo' (C-R). Ancora o encontro-consonantal como uma
      UNIDADE DE ESCRITA — a criança escreve as 2 letras juntas
      porque ouve os dois sons. Especificidade pt-BR: enfatize que o
      R nos encontros consonantais pt-BR é flap leve /ɾ/, não R-forte
      — diferente do R-inicial pt-BR (rato).
  contentActivity:
    body: |
      Trabalho em duplas + rotina de ditado. Cada dupla recebe folha
      com 8 cartas de imagem (trem, prato, bruxa, flor, plano, cravo,
      gravata, frio). A dupla alterna: criança A diz a palavra;
      criança B escreve em quadro-branco de memória, começando com o
      encontro. A dupla verifica cada grafia contra a carta-imagem.
      Refraseie os erros com soletração-letra-a-letra ('você escreveu
      'rem' para 'trem' — vamos ouvir o início: /t-r/ trem. Dois sons
      no começo — T + R. Tente de novo: T-R-E-M.'). Especificidade
      pt-BR: extensão opcional — as crianças procuram objetos na sala
      começando com cada encontro + escrevem as palavras em lista de
      turma (animal: gato → não-encontro; trator → TR; cravo → CR).
  scaffold:
    body: |
      Rotação de estações. Estação 1: word-scramble (rearranje letras
      para formar palavras-com-encontro: M-T-R-E = trem; T-O-P-R-A =
      prato; X-A-B-R-U = bruxa). Estação 2: word-guess (preencha o
      encontro a partir da pista-imagem — __em = trem; __ato = prato;
      __or = flor). Estação 3: vocabulary-tracing-strips com
      palavras-âncora-de-encontro pt-BR. Estação 4: folha de
      exercícios de emparelhamento (cluster ao par-âncora — tr ↔
      trem; pr ↔ prato; br ↔ bruxa; fl ↔ flor; pl ↔ plano).
  closure:
    body: |
      Mini-ditado-de-encontros com toda a turma. A professora ou o
      professor lê 5 palavras-com-encontro em voz alta (trem / prato
      / bruxa / flor / plano); as crianças escrevem cada uma em
      quadro-branco individual. Verificação visual rápida confere a
      precisão. Indicador adiante: "Hoje escrevemos palavras com
      encontros consonantais. Quando voltarmos à escrita na próxima
      vez, aprenderemos a escrever palavras com DÍGRAFOS pt-BR
      especiais — CH (chuva), LH (filho), NH (sonho), RR (carro) —
      combinações de duas letras que fazem apenas UM som."

assessmentCriteria:
  pt: |
    Escrever 6 de 8 palavras-com-encontro ditadas corretamente em 8
    de 10 tentativas (com suporte de pista-imagem). Identificar +
    escrever o encontro correto (tr/pr/br/cr/dr/fr/gr/fl/pl/cl) quando
    dada a parte medial-final do som da palavra em 7 de 10 tentativas.
    Aplicar a estratégia de escrita-de-encontro a palavras novas
    desconhecidas (ex: 'tribo', 'prece', 'broa') em 6 de 10
    tentativas.

    Diferenciação:
      - Pré-K (3-5 anos): apenas reconhecimento-de-encontro (sem
        escrita); circule a palavra-com-encontro que combina com a
        imagem entre 2-3 opções.
      - 1º ano (6-8 anos): 8 encontros mais frequentes em pt-BR (tr,
        pr, br, cr, fr, gr, fl, pl) + escrita independente.
      - 2º ano em diante: estender o conjunto completo de encontros
        + ponte para spell-words-with-digraphs pt-BR (CH, LH, NH, RR,
        Ç) no Phase 1.5.

compositionalRationale:
  pt: |
    Fio principal: letramento inicial / spelling-and-encoding (escrita
    de palavras com encontros consonantais; strand-advancement em
    direção à SAT). Fio secundário: phonics-decoding (as crianças
    aproveitam o trabalho-de-leitura para escrever o que aprenderam
    a ler). Fio terciário: aquisição de vocabulário (palavras-âncora
    com encontros consonantais comuns no vocabulário pt-BR K-3).

    Significância arquitetural: aprofunda o fio spelling-and-encoding
    pt-BR. **Reciprocidade fonética com read-consonant-blends pt-BR-
    equivalente** (par decoding-encoding canônico). A criança
    primeiro aprende a LER palavras-com-encontro + agora aprende a
    ESCREVER as mesmas palavras — habilidade de mão-dupla.

    Especificidade pt-BR: os encontros consonantais pt-BR têm
    realização fonética distinta + frequência diferente do en:

    - **TR / PR / BR / CR / DR / FR / GR**: encontros com R em pt-BR
      são realizados com flap leve /ɾ/ — som-de-toque-curto. Diferente
      do R-inicial pt-BR (rato, /h/ em SP/RJ) e do RR (carro). O R
      em encontro consonantal NÃO é o R-forte. As crianças aprendem
      a distinguir: 'rato' começa com R-forte /h/; 'trator' começa
      com encontro TR + tem flap /ɾ/.

    - **FL / PL / CL / BL / GL**: encontros com L em pt-BR. FL + PL
      + CL são frequentes (flor, plano, clarão); BL + GL são raros
      em pt-BR (bloco, glóbulo) — quase só em palavras de origem
      latina/grega culta. Bem diferente do en, onde BL + GL são
      muito frequentes (blue, glue, glass).

    - **Encontros com S em início (sp-/st-/sk-/sl-)**: NÃO existem em
      pt-BR como encontros consonantais. O pt-BR insere E inicial:
      espelho (NÃO speglio), estrela (NÃO strela), escola (NÃO
      scola), eslogan (NÃO slogan). Esta é uma diferença ortográfica
      crucial para crianças brasileiras letrando em ambiente
      bilíngue: en 'star' = pt 'estrela'; en 'school' = pt 'escola';
      en 'sport' = pt 'esporte'.

    Em contextos de imersão pt-BR + ambientes bilíngues, crianças
    falantes de en frequentemente esquecem o E inicial em palavras
    pt-BR derivadas de origens cognatas (escrevendo 'porte' em vez
    de 'esporte'). O ensino explícito + foco nas formas pt-BR
    canônicas é fundamental.

    Currículo BNCC EF01LP08 (identificar regularidades + irregularidades
    no sistema ortográfico pt-BR); EF02LP05 (escrever palavras com
    diferentes estruturas silábicas + encontros consonantais).

    Substrato Class B FLEXIBLE: composta contra a amplitude da
    biblioteca de imagens. Vocabulário pt-BR rico em encontros:
    animais (bruxa, dragão, gralha, grilo); transportes (trem, trator,
    bicicleta); ambiente (floresta, planta, frio, chuva); ações
    (brincar, gritar, gritar, plantar).
