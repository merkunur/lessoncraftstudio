thematicCoherence:
  en: |
    All 4 packages cohere around the insects theme + form a
    cross-strand bundle leveraging Phase 1's freshly-shipped
    describe-butterfly-life-cycle package as the science anchor.

    **Pedagogical sequencing:**
    1. **describe-butterfly-life-cycle** — 4-stage metamorphosis
       (egg → caterpillar → chrysalis → butterfly). Science anchor
       for the bundle; butterflies as canonical insect-life-cycle
       subjects. NEW package from Arc 14 Phase 1; first cross-bundle
       reuse demonstrates Phase-N-package-into-bundle integration.
    2. **count-objects-1-to-10** — Counting practice using insects
       as countable subjects (count 5 ladybugs; 8 ants; 3
       butterflies). Same shared package with fruits-bundle +
       flowers-bundle.
    3. **identify-living-vs-nonliving** — Biological-reasoning
       work. Insects ARE living-things; pairs with butterfly-life-
       cycle for whole-organism understanding. Same shared package
       with animals-bundle + farm-animals-bundle + pets-bundle.
    4. **find-hidden-target-in-busy-scene** — Visual-discrimination
       work. Insects often blend into natural backgrounds (camouflage
       relevance); find-the-insect game in busy scenes. Same shared
       package with vehicles-bundle.

    **Strand spread:** 1 world-knowledge living-things (life cycle) +
    1 numeracy + 1 cognitive-sorting (living-vs-nonliving) + 1
    visual-discrimination. 4 distinct strands; cross-strand pattern.

    **Suggested unit duration:** 4 weeks (1 package per week);
    spring-extension natural fit (outdoor insect observation).

    **Multilingual classroom relevance:** insect vocabulary varied
    across 11 platform locales — Romance distinct (insecto / insecte
    / insetto) + Germanic distinct (Insekt / insect). Specific
    insect-type vocabulary (butterfly / mariposa / papillon /
    Schmetterling) more varied. Visual content (life-cycle stages,
    busy-scene insects) translates universally; vocabulary anchor
    varies.

    **Pillar 2 architectural pattern:** insects-bundle exemplifies
    Phase-N-package-into-Phase-N+1-bundle pattern — Arc 14 Phase 1
    shipped describe-butterfly-life-cycle; Pillar 2 Arc 3 Phase 2
    leverages it as bundle anchor in same session. Demonstrates that
    concurrent-arc bundling can create cross-arc package reuse
    immediately rather than waiting for next-arc consumption.
