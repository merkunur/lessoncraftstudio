<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Subtraction Worksheets - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: #FFF8E1; overflow: hidden;">

        <!-- Diagonal line pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image: repeating-linear-gradient(45deg, #C2185B 0, #C2185B 1px, transparent 1px, transparent 30px); background-size: 42px 42px;"></div>

        <!-- Title Section -->
        <div style="position: absolute; top: 28px; left: 0; right: 0; text-align: center; z-index: 10;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #C2185B; margin: 0; text-shadow: 2px 2px 0 rgba(194,24,91,0.1);">4 ACTIVITY TYPES</h1>
            <p style="font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 28px; color: #7B1FA2; margin: 4px 0 0 0;">One Powerful Bundle</p>
            <div style="width: 180px; height: 4px; background: linear-gradient(90deg, transparent, #FFE082, transparent); margin: 10px auto 0;"></div>
        </div>

        <!-- 2x2 Feature Grid -->
        <div style="position: absolute; top: 152px; left: 50%; transform: translateX(-50%); width: 920px; height: 560px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 18px;">

            <!-- Panel 1: Cross Out (top-left) -->
            <div style="background: white; border-radius: 16px; border: 4px solid #7B1FA2; box-shadow: 0 6px 20px rgba(0,0,0,0.1); padding: 16px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden;">
                <!-- Accent bar top -->
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #7B1FA2, #B39DDB);"></div>
                <!-- Icon circle -->
                <div style="width: 48px; height: 48px; background: linear-gradient(145deg, #7B1FA2, #9C27B0); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 8px; box-shadow: 0 4px 12px rgba(123,31,162,0.3);">
                    <span style="font-size: 24px; color: white; font-family: 'Fredoka', sans-serif; font-weight: 700;">X</span>
                </div>
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #4A0E4E; margin: 8px 0 6px 0;">Cross Out</p>
                <!-- Mini worksheet -->
                <div style="flex: 1; width: 140px; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.12); border: 2px solid #E1BEE7;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/subtraction/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Cross Out worksheet">
                </div>
                <p style="font-family: 'Nunito', sans-serif; font-size: 12px; color: #888; margin: 6px 0 0 0; text-align: center;">Cross out images to subtract</p>
            </div>

            <!-- Panel 2: Image & Number (top-right) -->
            <div style="background: white; border-radius: 16px; border: 4px solid #00897B; box-shadow: 0 6px 20px rgba(0,0,0,0.1); padding: 16px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden;">
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #00897B, #4DB6AC);"></div>
                <div style="width: 48px; height: 48px; background: linear-gradient(145deg, #00897B, #009688); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 8px; box-shadow: 0 4px 12px rgba(0,137,123,0.3);">
                    <span style="font-size: 22px; color: white; font-family: 'Fredoka', sans-serif; font-weight: 700;">#</span>
                </div>
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #4A0E4E; margin: 8px 0 6px 0;">Image & Number</p>
                <div style="flex: 1; width: 140px; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.12); border: 2px solid #B2DFDB;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/subtraction/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Image Number worksheet">
                </div>
                <p style="font-family: 'Nunito', sans-serif; font-size: 12px; color: #888; margin: 6px 0 0 0; text-align: center;">Count images, write the number</p>
            </div>

            <!-- Panel 3: Find Missing Number (bottom-left) -->
            <div style="background: white; border-radius: 16px; border: 4px solid #EF6C00; box-shadow: 0 6px 20px rgba(0,0,0,0.1); padding: 16px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden;">
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #EF6C00, #FFB74D);"></div>
                <div style="width: 48px; height: 48px; background: linear-gradient(145deg, #EF6C00, #FF9800); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 8px; box-shadow: 0 4px 12px rgba(239,108,0,0.3);">
                    <span style="font-size: 22px; color: white; font-family: 'Fredoka', sans-serif; font-weight: 700;">?</span>
                </div>
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #4A0E4E; margin: 8px 0 6px 0;">Find Missing Number</p>
                <div style="flex: 1; width: 140px; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.12); border: 2px solid #FFE0B2;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/subtraction/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Find Subtrahend worksheet">
                </div>
                <p style="font-family: 'Nunito', sans-serif; font-size: 12px; color: #888; margin: 6px 0 0 0; text-align: center;">Discover the missing subtrahend</p>
            </div>

            <!-- Panel 4: Mixed Practice (bottom-right) -->
            <div style="background: white; border-radius: 16px; border: 4px solid #1565C0; box-shadow: 0 6px 20px rgba(0,0,0,0.1); padding: 16px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden;">
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #1565C0, #64B5F6);"></div>
                <div style="width: 48px; height: 48px; background: linear-gradient(145deg, #1565C0, #1976D2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 8px; box-shadow: 0 4px 12px rgba(21,101,192,0.3);">
                    <span style="font-size: 22px; color: white; font-family: 'Fredoka', sans-serif; font-weight: 700;">M</span>
                </div>
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #4A0E4E; margin: 8px 0 6px 0;">Mixed Practice</p>
                <div style="flex: 1; width: 140px; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.12); border: 2px solid #BBDEFB;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/subtraction/sample-4.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Mixed Practice worksheet">
                </div>
                <p style="font-family: 'Nunito', sans-serif; font-size: 12px; color: #888; margin: 6px 0 0 0; text-align: center;">All types combined for review</p>
            </div>
        </div>

        <!-- Feature Pills at Bottom -->
        <div style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;">
            <div style="background: linear-gradient(145deg, #C2185B, #AD1457); padding: 11px 20px; border-radius: 24px; box-shadow: 0 4px 14px rgba(194,24,91,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Answer Keys Included</span>
            </div>
            <div style="background: linear-gradient(145deg, #7B1FA2, #6A1B9A); padding: 11px 20px; border-radius: 24px; box-shadow: 0 4px 14px rgba(123,31,162,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Numbers 1-20</span>
            </div>
            <div style="background: linear-gradient(145deg, #EF6C00, #E65100); padding: 11px 20px; border-radius: 24px; box-shadow: 0 4px 14px rgba(239,108,0,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Print & Go</span>
            </div>
        </div>

    </div>
</body>
</html>
