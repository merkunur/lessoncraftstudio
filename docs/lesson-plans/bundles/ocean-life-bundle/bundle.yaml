thematicCoherence:
  en: |
    All 5 packages cohere around the ocean-life theme + form a
    cross-strand progression from habitat classification through
    counting + sorting work to visual-discrimination practice.

    **Pedagogical sequencing:**
    1. **classify-animals-by-habitat** — Cognitive classification
       using ocean as the focal habitat (ocean vs farm vs forest
       vs zoo). Establishes ocean as a recognized animal habitat.
       Same shared package with animals-bundle + farm-animals-bundle.
    2. **identify-living-vs-nonliving** — Biological-reasoning
       work. Ocean creatures (fish, octopus, jellyfish) ARE
       living-things; ocean rocks + sand ARE non-living. Same
       shared package with animals-bundle + farm-animals-bundle +
       pets-bundle + insects-bundle.
    3. **count-objects-1-to-10** — Counting practice using ocean
       creatures (count 5 fish; 3 starfish; 8 sea-shells). Same
       shared package with fruits-bundle + flowers-bundle +
       insects-bundle.
    4. **sort-by-color** — Cognitive sorting using ocean creatures'
       rich color diversity (red coral vs blue fish vs orange
       clownfish vs purple anemone). Same shared package with
       multiple bundles.
    5. **find-hidden-target-in-busy-scene** — Visual-discrimination
       work in ocean-reef contexts (busy reef scenes with hidden
       creatures). Camouflage-relevance and observation-skill work.
       Same shared package with vehicles-bundle + insects-bundle.

    **Strand spread:** 1 world-knowledge (habitat) + 1 world-
    knowledge (living things) + 1 numeracy + 1 cognitive-sorting +
    1 visual-discrimination. **5 distinct strands in single bundle**
    — broadest cross-strand pattern (parallel to occupations-
    bundle + pets-bundle).

    **Suggested unit duration:** 5 weeks (1 package per week).

    **Multilingual classroom relevance:** ocean-creature vocabulary
    varied across 11 platform locales — fish (poisson / pesce / pez)
    Romance cognate-rich; Germanic distinct (Fisch / vis / kala).
    Specific creature vocabulary (octopus / pulpo / pieuvre /
    Krake) more variable. Visual ocean content translates
    universally; vocabulary anchor varies.

    **Pillar 2 architectural pattern:** ocean-life-bundle exemplifies
    broadest cross-strand bundle composition + animal-habitat sub-
    theme architecture. Sea-creatures sit conceptually parallel to
    farm-animals + pets but in distinct habitat context. Bundle
    demonstrates that habitat-anchored sub-theme bundles can pair
    with animal-anchored sub-theme bundles (farm-animals, pets) for
    diverse animal-context classroom coverage.
