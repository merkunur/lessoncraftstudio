assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Read 7 of 10 consonant-blend words (mix of initial-
        blend + final-blend) when shown printed words +
        pictures.
      - Decode consonant-blend words via sound-out-then-
        slide 3-step scaffold in 7 of 10 trials.
      - Distinguish initial-blend (BLAST, STOP, FROG) from
        final-blend (JUMP, NEST, MILK) word categories in
        6 of 10 trials.
      - Avoid common error patterns (drop-a-consonant, vowel-
        insertion) in 6 of 8 attempts after re-modeling.
      - Use vocabulary 'blend' / 'consonant blend' / 'sound
        out' / 'slide together' correctly in 5 of 10
        productive-language trials.
      - Read 5 of 8 consonant-blend words independently
        (without picture support) — assessment-level skill.

    Differentiation:
    - K: focus on CVC + CVCe decoding first; defer consonant-
      blend reading to Grade 1.
    - Grade 1: full single-blend reading (initial OR final
      blend; rarely both in one word) with sound-out-then-
      slide scaffold; defer 3-consonant clusters (/str/, /spl/)
      + double-blend words to Grade 2.
    - Grade 2: extend to 3-consonant cluster reading (STREET,
      SPLAT, SCRUB) + double-blend words (FROST, BLAST has
      both); bridge to multi-syllable word decoding.
    - Grade 3+: full systematic phonics decoding including
      consonant digraphs + vowel teams + r-controlled vowels;
      bridge to vocabulary-level reading fluency.

