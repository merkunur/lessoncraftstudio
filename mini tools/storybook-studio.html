<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Storybook Studio — LessonCraftStudio</title>
<style>
  :root { --teal:#146B5E; --coral:#F2784B; --cream:#FBF3E4; --ink:#2b241d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family:"Nunito","Segoe UI",system-ui,sans-serif; color:var(--ink); background:#efe7d8; }
  #stu-banner { display:none; background:#7A3016; color:#fff; padding:14px 18px; font-weight:700; }
  #stu-app { display:grid; grid-template-rows:52px 1fr; grid-template-columns:120px 1fr 360px; height:100vh; }
  #stu-topbar { grid-column:1/4; display:flex; align-items:center; gap:10px; padding:0 14px; background:var(--teal); }
  #stu-rail { overflow-y:auto; background:#e5dbc6; padding:8px; display:flex; flex-direction:column; gap:8px; }
  #stu-canvas-host { position:relative; overflow:hidden; background:#d8cdb6; }
  #stu-panel { overflow-y:auto; background:#fffdf7; border-left:1px solid #d8cdb6; padding:14px; }
  /* topbar */
  .stu-title { flex:0 1 340px; font-size:17px; font-weight:800; padding:6px 10px; border-radius:8px; border:none; background:rgba(255,255,255,.92); }
  .stu-savestate { margin-left:auto; color:#dff3ee; font-size:13px; font-weight:700; }
  .stu-savebad { color:#ffd9a8; }
  /* buttons */
  .stu-btn { border:none; border-radius:10px; background:#e8dfc9; color:var(--ink); font-weight:800; padding:8px 14px; cursor:pointer; font-size:14px; }
  .stu-btn:hover { filter:brightness(.97); }
  .stu-btn:disabled { opacity:.4; cursor:default; }
  .stu-btn-primary { background:var(--coral); color:#fff; }
  .stu-btn-danger { background:#e2b7ae; }
  .stu-btn-small { padding:4px 10px; font-size:12.5px; }
  .stu-x { border:none; background:transparent; cursor:pointer; font-size:13px; color:#8a6d5c; }
  /* rail */
  .stu-thumb { position:relative; border:3px solid transparent; border-radius:10px; background:#fff; min-height:64px; cursor:pointer; overflow:hidden; padding:0; }
  .stu-thumb img { width:100%; height:64px; object-fit:cover; display:block; }
  .stu-thumb.stu-on { border-color:var(--coral); }
  .stu-thumb-n { position:absolute; left:4px; top:4px; background:rgba(28,26,23,.75); color:#fff; border-radius:8px; padding:0 7px; font-size:12px; font-weight:800; }
  .stu-thumb-badge { position:absolute; right:3px; bottom:3px; background:#f6d2a4; border-radius:6px; font-size:10px; padding:1px 5px; }
  .stu-thumb-move { position:absolute; right:3px; top:3px; border:none; border-radius:6px; background:rgba(255,255,255,.9); cursor:pointer; }
  .stu-thumb-add { display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--teal); min-height:44px; }
  /* canvas */
  .stu-stage { position:absolute; width:1600px; height:1000px; transform-origin:top left; background:#fff; box-shadow:0 6px 30px rgba(0,0,0,.25); }
  .stu-scene { position:absolute; inset:0; width:1600px; height:1000px; pointer-events:none; user-select:none; }
  .stu-scene-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#8a6d5c; font-size:34px; font-weight:800; text-align:center; padding:80px; }
  .stu-layer { position:absolute; pointer-events:none; }
  /* z-order: zone body UNDER characters (chars stay directly grabbable);
     drawables + points above; the zone stays grabbable on its uncovered area */
  .stu-zone { z-index:10; }
  .stu-char { z-index:20; }
  .stu-drect { z-index:30; }
  .stu-dpoint { z-index:35; }
  .stu-char { position:absolute; cursor:grab; }
  .stu-char img { width:100%; height:100%; pointer-events:none; user-select:none; }
  .stu-char.stu-selected { outline:4px dashed var(--coral); outline-offset:4px; }
  .stu-feet { position:absolute; left:50%; bottom:-9px; width:18px; height:18px; transform:translateX(-50%); border-radius:50%; background:var(--coral); border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.4); pointer-events:none; }
  .stu-scale-handle { position:absolute; right:-16px; bottom:-16px; width:32px; height:32px; border-radius:50%; background:var(--teal); border:3px solid #fff; cursor:nwse-resize; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .stu-zone { position:absolute; border:5px dashed var(--teal); border-radius:14px; background:rgba(20,107,94,.07); cursor:move; }
  .stu-zone.stu-selected { border-style:solid; }
  .stu-zone.stu-amber { border-color:#d99b26; background:rgba(217,155,38,.12); }
  .stu-zone-label { position:absolute; left:8px; top:-34px; background:var(--teal); color:#fff; border-radius:8px; padding:2px 10px; font-size:20px; font-weight:800; pointer-events:none; }
  .stu-handle { position:absolute; width:26px; height:26px; background:#fff; border:4px solid var(--teal); border-radius:50%; }
  .stu-handle-nw { left:-14px; top:-14px; cursor:nwse-resize; } .stu-handle-ne { right:-14px; top:-14px; cursor:nesw-resize; }
  .stu-handle-sw { left:-14px; bottom:-14px; cursor:nesw-resize; } .stu-handle-se { right:-14px; bottom:-14px; cursor:nwse-resize; }
  .stu-drect { position:absolute; border:4px solid var(--coral); border-radius:12px; background:rgba(242,120,75,.10); cursor:move; }
  .stu-drect img { position:absolute; inset:6px; width:calc(100% - 12px); height:calc(100% - 12px); object-fit:contain; pointer-events:none; }
  .stu-drect.stu-selected { box-shadow:0 0 0 4px rgba(242,120,75,.4); }
  .stu-drect.stu-amber { border-color:#d99b26; }
  .stu-drect-badge { position:absolute; left:2px; top:-26px; background:var(--coral); color:#fff; border-radius:7px; padding:0 8px; font-size:16px; font-weight:800; pointer-events:none; }
  .stu-dpoint { position:absolute; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:#fff; border:5px solid var(--teal); color:var(--teal); font-weight:900; font-size:22px; display:flex; align-items:center; justify-content:center; cursor:move; }
  .stu-dpoint.stu-selected { border-color:var(--coral); color:var(--coral); }
  .stu-offstage { position:absolute; left:16px; bottom:16px; background:#f6d2a4; border-radius:10px; padding:6px 12px; font-weight:800; font-size:20px; }
  .stu-placing .stu-stage { cursor:crosshair; }
  /* inspector */
  .stu-h2 { margin:4px 0 10px; font-size:19px; }
  .stu-h3 { margin:0 0 8px; font-size:14px; color:var(--teal); text-transform:uppercase; letter-spacing:.4px; }
  .stu-section { border-top:1px solid #eee3cf; padding:12px 0; }
  .stu-checklist { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .stu-checkitem { background:#f3ecd9; border-radius:8px; padding:3px 9px; font-size:12.5px; font-weight:700; color:#8a6d5c; }
  .stu-checkitem.stu-ok { background:#d9ece7; color:var(--teal); }
  .stu-frow { margin:8px 0; }
  .stu-flabel { display:block; font-size:12.5px; font-weight:800; color:#7c6a52; margin-bottom:3px; }
  .stu-frow input[type=text], .stu-frow input:not([type]), .stu-frow input[type=number], .stu-frow select, .stu-frow textarea { width:100%; padding:7px 9px; border:2px solid #e3d8bf; border-radius:9px; font:inherit; background:#fff; }
  .stu-note { font-size:12px; color:#8a6d5c; margin-top:4px; }
  .stu-check { display:flex; align-items:center; gap:6px; font-weight:700; font-size:13.5px; }
  .stu-chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .stu-chip { background:#e8dfc9; border-radius:9px; padding:4px 8px; font-weight:800; font-size:13px; border:none; }
  .stu-chip-btn { cursor:pointer; }
  .stu-chip.stu-on { background:var(--teal); color:#fff; }
  .stu-chip-x { border:none; background:transparent; cursor:pointer; margin-left:3px; }
  .stu-chip-in { flex:1 1 90px; min-width:90px; padding:5px 8px; border:2px dashed #d8cdb6; border-radius:9px; }
  .stu-group { border-left:3px solid #eee3cf; padding-left:10px; margin:6px 0; }
  .stu-list-item { border:1px solid #eee3cf; border-radius:10px; padding:8px; margin:6px 0; background:#fffef9; }
  .stu-list-head { display:flex; align-items:center; gap:8px; }
  .stu-list-n { background:var(--teal); color:#fff; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; }
  .stu-list-key { font-weight:800; color:#7c6a52; flex:1; }
  .stu-radios { display:flex; flex-direction:column; gap:4px; }
  .stu-radio { display:flex; align-items:center; gap:6px; font-weight:700; }
  .stu-radio img.stu-mini { width:34px; height:34px; object-fit:contain; }
  .stu-imgpick { display:flex; align-items:center; gap:10px; }
  .stu-imgpick img { width:56px; height:56px; object-fit:contain; background:#fff; border-radius:9px; border:1px solid #eee3cf; }
  .stu-errors { margin-top:8px; background:#fdeee9; border-radius:10px; padding:8px 10px; }
  .stu-error { color:#a4442f; font-size:13px; font-weight:700; margin:2px 0; }
  .stu-okline { margin-top:8px; color:var(--teal); font-weight:800; }
  .stu-mech-head { display:flex; align-items:center; gap:8px; }
  .stu-mech-head strong { flex:1; }
  .stu-adv { margin-top:10px; }
  .stu-json { width:100%; height:150px; font-family:Consolas,monospace; font-size:12px; }
  .stu-cue { display:flex; flex-wrap:wrap; gap:6px; align-items:flex-start; border:1px solid #eee3cf; border-radius:10px; padding:8px; margin:6px 0; background:#fffef9; }
  .stu-cue select { flex:0 0 110px; }
  .stu-cuetext { flex:1 1 100%; }
  .stu-cue-meta { display:flex; align-items:center; gap:8px; width:100%; }
  .stu-audiodot { font-size:11.5px; color:#8a6d5c; }
  .stu-audiodot.stu-have { color:var(--teal); font-weight:800; }
  /* drawers */
  .stu-drawer-scrim { position:fixed; inset:0; background:rgba(30,24,17,.45); z-index:100; display:flex; justify-content:flex-end; }
  .stu-drawer { width:440px; max-width:92vw; background:#fffdf7; height:100%; display:flex; flex-direction:column; box-shadow:-8px 0 30px rgba(0,0,0,.3); }
  .stu-drawer-wide { width:1000px; }
  .stu-drawer-head { display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid #eee3cf; }
  .stu-drawer-title { font-weight:900; font-size:17px; flex:1; }
  .stu-drawer-body { overflow-y:auto; padding:14px 16px; flex:1; }
  .stu-cards { display:flex; flex-wrap:wrap; gap:10px; }
  .stu-card { width:212px; text-align:left; border:2px solid #eee3cf; border-radius:12px; background:#fff; padding:10px; cursor:pointer; }
  .stu-card:hover { border-color:var(--coral); }
  .stu-card-icon { font-size:26px; }
  .stu-card-label { font-weight:900; margin:4px 0 2px; }
  .stu-card-blurb { font-size:12.5px; color:#7c6a52; }
  .stu-card-min { font-size:11px; color:#a49478; margin-top:5px; }
  .stu-card-thumb { width:100%; height:96px; object-fit:contain; }
  .stu-card-new { display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--teal); font-size:17px; min-height:110px; }
  .stu-libbar { display:flex; gap:8px; margin-bottom:10px; }
  .stu-libbar select, .stu-libbar input { padding:7px 9px; border:2px solid #e3d8bf; border-radius:9px; font:inherit; }
  .stu-libbar input { flex:1; }
  .stu-libgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:8px; }
  .stu-libcard { border:2px solid #eee3cf; border-radius:10px; background:#fff; cursor:pointer; padding:6px; }
  .stu-libcard:hover { border-color:var(--coral); }
  .stu-libcard img { width:100%; height:74px; object-fit:contain; }
  .stu-scenecard img { height:64px; object-fit:cover; }
  .stu-libname { font-size:11.5px; font-weight:800; margin-top:3px; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stu-empty { color:#8a6d5c; font-weight:700; padding:16px 4px; }
  .stu-preview { height:calc(100vh - 130px); border:1px solid #d8cdb6; border-radius:10px; background:#fff; max-width:100%; }
  .stu-vcard { display:flex; align-items:center; gap:10px; border:1px solid #f0d9c9; background:#fdf4ec; border-radius:10px; padding:9px 12px; margin:6px 0; font-weight:700; }
  .stu-vcard > div { flex:1; }
  .stu-ready { background:#e7f3ef; border-radius:12px; padding:14px 16px; }
  .stu-launcher { padding:36px; }
  .stu-launcher h1 { color:var(--teal); }
  /* pattern + spot-diff editors */
  .stu-tilechip { width:52px; height:52px; border:2px solid #eee3cf; border-radius:9px; background:#fff; cursor:pointer; }
  .stu-tilechip img { width:100%; height:100%; object-fit:contain; }
  .stu-strip { display:flex; gap:5px; margin:8px 0; flex-wrap:wrap; }
  .stu-stripcell { width:46px; height:46px; border:2px solid #d8cdb6; border-radius:8px; background:#fff; cursor:pointer; font-weight:900; color:var(--coral); font-size:18px; }
  .stu-stripcell img { width:100%; height:100%; object-fit:contain; }
  .stu-stripcell.stu-gap { border-style:dashed; border-color:var(--coral); }
  .stu-sdgrid { display:grid; gap:5px; margin:8px 0; }
  .stu-sdcell { position:relative; width:64px; height:64px; border:2px solid #d8cdb6; border-radius:8px; background:#fff; cursor:pointer; font-size:20px; color:var(--teal); }
  .stu-sdcell img { width:100%; height:100%; object-fit:contain; }
  .stu-sdcell.stu-sd-diff { border-color:var(--coral); border-width:3px; }
  .stu-sdmark { position:absolute; left:0; right:0; bottom:-1px; background:var(--coral); color:#fff; font-size:9.5px; font-weight:800; border-radius:0 0 5px 5px; }
</style>
</head>
<body>
<div id="stu-banner"></div>
<div id="stu-app">
  <div id="stu-topbar"></div>
  <div id="stu-rail"></div>
  <div id="stu-canvas-host"></div>
  <div id="stu-panel"></div>
</div>
<div id="stu-drawers"></div>

<!-- the modules ARE the schema: their meta.studio drives the forms;
     their validateTask drives inline validation -->
<script src="/mini-tools/storybook-interaction.js?v=2"></script>
<script src="/mini-tools/sb-legacy-adapter.js?v=2"></script>
<script src="/mini-tools/sb-mod-choice-board.js?v=3"></script>
<script src="/mini-tools/sb-mod-sort-bins.js?v=2"></script>
<script src="/mini-tools/sb-mod-fractions.js?v=2"></script>
<script src="/mini-tools/sb-mod-clock.js?v=2"></script>
<script src="/mini-tools/sb-mod-match-pairs.js?v=2"></script>
<script src="/mini-tools/sb-mod-number-bond.js?v=2"></script>
<script src="/mini-tools/sb-mod-cvc-builder.js?v=2"></script>
<script src="/mini-tools/sb-mod-word-builder.js?v=2"></script>
<script src="/mini-tools/sb-mod-find-object.js?v=3"></script>
<script src="/mini-tools/sb-mod-sequence.js?v=2"></script>
<script src="/mini-tools/sb-mod-pattern.js?v=2"></script>
<script src="/mini-tools/sb-mod-memory.js?v=2"></script>
<script src="/mini-tools/sb-mod-listen.js?v=2"></script>
<script src="/mini-tools/sb-mod-connect-dots.js?v=2"></script>
<script src="/mini-tools/sb-mod-spot-diff.js?v=2"></script>
<script src="/mini-tools/sb-mod-count-tap.js?v=2"></script>
<script src="/mini-tools/sb-preschool-kit.js?v=1"></script>
<script src="/mini-tools/sb-mod-trace.js?v=1"></script>
<script src="/mini-tools/sb-mod-dot-stamp.js?v=1"></script>
<script src="/mini-tools/sb-mod-color-code.js?v=1"></script>
<script src="/mini-tools/sb-mod-shape-fit.js?v=1"></script>
<script src="/mini-tools/sb-mod-complete-picture.js?v=1"></script>
<script src="/mini-tools/sb-mod-listen-place.js?v=1"></script>
<script src="/mini-tools/sb-mod-maze.js?v=1"></script>
<script src="/mini-tools/sb-mod-worksheet-exercise.js?v=3"></script>
<script src="/worksheet-generators/js/image-vocabulary.js?v=3"></script>

<script src="/mini-tools/studio-core.js?v=2"></script>
<script src="/mini-tools/studio-canvas.js?v=1"></script>
<script src="/mini-tools/studio-inspector.js?v=2"></script>
<script>
  (function () {
    var expected = 24;
    var got = window.SBModules ? window.SBModules.types().length : 0;
    if (got !== expected) {
      document.getElementById('stu-banner').textContent =
        'Heads up: ' + got + ' of ' + expected + ' activities loaded — a script may have failed. Reload, or tell the tech side.';
      document.getElementById('stu-banner').style.display = 'block';
    }
    StudioInspector.mount({
      topbar: document.getElementById('stu-topbar'),
      rail: document.getElementById('stu-rail'),
      panel: document.getElementById('stu-panel'),
      canvasHost: document.getElementById('stu-canvas-host'),
      drawerHost: document.getElementById('stu-drawers'),
      banner: document.getElementById('stu-banner')
    });
  }());
</script>
</body>
</html>
