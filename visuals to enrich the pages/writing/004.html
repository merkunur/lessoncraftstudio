<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Worksheets - Fun Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; background: #37474F; position: relative; overflow: hidden;">

        <!-- Chalkboard texture overlay -->
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 40% 30%, rgba(69,90,100,0.6) 0%, transparent 60%), radial-gradient(ellipse at 70% 70%, rgba(55,71,79,0.8) 0%, transparent 50%);"></div>

        <!-- Floating scattered letters -->
        <div style="position: absolute; top: 60px; left: 80px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 48px; color: #FF6B6B; opacity: 0.7; transform: rotate(-15deg);">A</div>
        <div style="position: absolute; top: 180px; left: 40px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; color: #4FC3F7; opacity: 0.6; transform: rotate(12deg);">b</div>
        <div style="position: absolute; top: 100px; right: 60px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 42px; color: #FFD54F; opacity: 0.65; transform: rotate(8deg);">C</div>
        <div style="position: absolute; top: 250px; right: 40px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; color: #66BB6A; opacity: 0.55; transform: rotate(-10deg);">d</div>
        <div style="position: absolute; bottom: 280px; left: 30px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 50px; color: #F48FB1; opacity: 0.6; transform: rotate(18deg);">W</div>
        <div style="position: absolute; bottom: 200px; right: 35px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 38px; color: #CE93D8; opacity: 0.5; transform: rotate(-6deg);">z</div>
        <div style="position: absolute; top: 350px; left: 55px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: #FFB74D; opacity: 0.5; transform: rotate(22deg);">e</div>
        <div style="position: absolute; top: 320px; right: 70px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; color: #81C784; opacity: 0.55; transform: rotate(-14deg);">M</div>
        <div style="position: absolute; bottom: 350px; left: 100px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: #4DD0E1; opacity: 0.5; transform: rotate(5deg);">k</div>
        <div style="position: absolute; bottom: 320px; right: 90px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 44px; color: #FF8A65; opacity: 0.6; transform: rotate(-20deg);">R</div>
        <div style="position: absolute; top: 450px; right: 50px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #AED581; opacity: 0.45; transform: rotate(15deg);">p</div>
        <div style="position: absolute; bottom: 160px; left: 70px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 40px; color: #FFF176; opacity: 0.5; transform: rotate(-8deg);">G</div>

        <!-- Sparkle decorations -->
        <svg style="position: absolute; top: 80px; right: 130px; opacity: 0.7;" width="30" height="30" viewBox="0 0 30 30">
            <polygon points="15,0 18,11 30,11 20,18 24,30 15,22 6,30 10,18 0,11 12,11" fill="#FFF176"/>
        </svg>
        <svg style="position: absolute; top: 200px; left: 130px; opacity: 0.5;" width="22" height="22" viewBox="0 0 30 30">
            <polygon points="15,0 18,11 30,11 20,18 24,30 15,22 6,30 10,18 0,11 12,11" fill="white"/>
        </svg>
        <svg style="position: absolute; bottom: 250px; right: 130px; opacity: 0.6;" width="26" height="26" viewBox="0 0 30 30">
            <polygon points="15,0 18,11 30,11 20,18 24,30 15,22 6,30 10,18 0,11 12,11" fill="#FFD54F"/>
        </svg>
        <svg style="position: absolute; top: 400px; left: 30px; opacity: 0.4;" width="18" height="18" viewBox="0 0 30 30">
            <polygon points="15,0 18,11 30,11 20,18 24,30 15,22 6,30 10,18 0,11 12,11" fill="white"/>
        </svg>

        <!-- Title - Rainbow gradient text -->
        <div style="position: absolute; top: 35px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 15; width: 800px;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 68px; margin: 0; line-height: 1.05; background: linear-gradient(90deg, #FF6B6B, #FFD54F, #66BB6A, #4FC3F7, #CE93D8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
                Their Name,
            </h1>
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 68px; color: #FFD54F; margin: -5px 0 0 0; text-shadow: 3px 3px 6px rgba(0,0,0,0.4);">
                Their Practice!
            </h1>
        </div>

        <!-- Notebook Paper Frame -->
        <div style="position: absolute; top: 230px; left: 50%; transform: translateX(-50%); z-index: 10;">
            <div style="width: 520px; height: 520px; background: white; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.2); position: relative; overflow: hidden;">
                <!-- Red margin line -->
                <div style="position: absolute; top: 0; left: 60px; width: 2px; height: 100%; background: #FF7F7F; opacity: 0.6;"></div>
                <!-- Blue ruled lines -->
                <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0;">
                    <div style="position: absolute; top: 50px; left: 0; right: 0; height: 1px; background: #B3D4FC;"></div>
                    <div style="position: absolute; top: 80px; left: 0; right: 0; height: 1px; background: #B3D4FC;"></div>
                    <div style="position: absolute; top: 110px; left: 0; right: 0; height: 1px; background: #B3D4FC;"></div>
                    <div style="position: absolute; top: 140px; left: 0; right: 0; height: 1px; background: #B3D4FC;"></div>
                    <div style="position: absolute; top: 170px; left: 0; right: 0; height: 1px; background: #B3D4FC;"></div>
                    <div style="position: absolute; top: 200px; left: 0; right: 0; height: 1px; background: #B3D4FC;"></div>
                </div>
                <!-- Spiral binding dots -->
                <div style="position: absolute; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 28px;">
                    <div style="width: 16px; height: 16px; border: 3px solid #999; border-radius: 50%; background: #f5f5f5;"></div>
                    <div style="width: 16px; height: 16px; border: 3px solid #999; border-radius: 50%; background: #f5f5f5;"></div>
                    <div style="width: 16px; height: 16px; border: 3px solid #999; border-radius: 50%; background: #f5f5f5;"></div>
                    <div style="width: 16px; height: 16px; border: 3px solid #999; border-radius: 50%; background: #f5f5f5;"></div>
                    <div style="width: 16px; height: 16px; border: 3px solid #999; border-radius: 50%; background: #f5f5f5;"></div>
                    <div style="width: 16px; height: 16px; border: 3px solid #999; border-radius: 50%; background: #f5f5f5;"></div>
                    <div style="width: 16px; height: 16px; border: 3px solid #999; border-radius: 50%; background: #f5f5f5;"></div>
                    <div style="width: 16px; height: 16px; border: 3px solid #999; border-radius: 50%; background: #f5f5f5;"></div>
                    <div style="width: 16px; height: 16px; border: 3px solid #999; border-radius: 50%; background: #f5f5f5;"></div>
                    <div style="width: 16px; height: 16px; border: 3px solid #999; border-radius: 50%; background: #f5f5f5;"></div>
                    <div style="width: 16px; height: 16px; border: 3px solid #999; border-radius: 50%; background: #f5f5f5;"></div>
                </div>
                <!-- Worksheet inside -->
                <div style="position: absolute; top: 20px; left: 45px; right: 20px; bottom: 20px; border-radius: 6px; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/writing/sample-2.jpeg"
                         style="width: 100%; height: 100%; object-fit: cover; object-position: top;" alt="Writing worksheet in notebook"/>
                </div>
            </div>
        </div>

        <!-- Pencil crayon row at bottom -->
        <div style="position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 12; display: flex; gap: 30px;">
            <!-- Red pencil -->
            <svg width="160" height="30" viewBox="0 0 160 30" style="transform: rotate(-3deg);">
                <rect x="0" y="5" width="120" height="20" fill="#FF6B6B" rx="3"/>
                <rect x="0" y="5" width="120" height="7" fill="#FF8A80" rx="3"/>
                <polygon points="120,5 145,15 120,25" fill="#DEB887"/>
                <polygon points="135,10 145,15 135,20" fill="#37474F"/>
            </svg>
            <!-- Blue pencil -->
            <svg width="160" height="30" viewBox="0 0 160 30" style="transform: rotate(2deg);">
                <rect x="0" y="5" width="120" height="20" fill="#4FC3F7" rx="3"/>
                <rect x="0" y="5" width="120" height="7" fill="#81D4FA" rx="3"/>
                <polygon points="120,5 145,15 120,25" fill="#DEB887"/>
                <polygon points="135,10 145,15 135,20" fill="#37474F"/>
            </svg>
            <!-- Green pencil -->
            <svg width="160" height="30" viewBox="0 0 160 30" style="transform: rotate(-1deg);">
                <rect x="0" y="5" width="120" height="20" fill="#66BB6A" rx="3"/>
                <rect x="0" y="5" width="120" height="7" fill="#81C784" rx="3"/>
                <polygon points="120,5 145,15 120,25" fill="#DEB887"/>
                <polygon points="135,10 145,15 135,20" fill="#37474F"/>
            </svg>
            <!-- Yellow pencil -->
            <svg width="160" height="30" viewBox="0 0 160 30" style="transform: rotate(3deg);">
                <rect x="0" y="5" width="120" height="20" fill="#FFD54F" rx="3"/>
                <rect x="0" y="5" width="120" height="7" fill="#FFEB99" rx="3"/>
                <polygon points="120,5 145,15 120,25" fill="#DEB887"/>
                <polygon points="135,10 145,15 135,20" fill="#37474F"/>
            </svg>
        </div>

        <!-- Bottom Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 15;">
            <div style="background: linear-gradient(135deg, #FF6B6B 0%, #E53935 100%); color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; padding: 10px 24px; border-radius: 25px; box-shadow: 0 4px 15px rgba(255,107,107,0.4); border: 2px solid rgba(255,255,255,0.3);">
                FREE
            </div>
            <div style="background: linear-gradient(135deg, #F48FB1 0%, #EC407A 100%); color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; padding: 10px 24px; border-radius: 25px; box-shadow: 0 4px 15px rgba(244,143,177,0.4); border: 2px solid rgba(255,255,255,0.3);">
                Cute Animals
            </div>
            <div style="background: linear-gradient(135deg, #26A69A 0%, #00897B 100%); color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; padding: 10px 24px; border-radius: 25px; box-shadow: 0 4px 15px rgba(38,166,154,0.4); border: 2px solid rgba(255,255,255,0.3);">
                PreK-1
            </div>
        </div>
    </div>
</body>
</html>
