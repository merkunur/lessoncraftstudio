# Teaching package — tell time to the hour
# Arc 17 Phase 1.4 (math / measurement strand — opens tell-time canonical pair). Measurement-strand framing of clock-reading work; parallel to Arc 15 Phase 1 read-time-on-analog-clock which framed the same observable activity in the cognitive-and-executive-function / time-and-routine strand. Pair partner: tell-time-to-half-hour (same arc phase).

targetSlug: tell-time-to-the-hour
language: en
title:
  en: "Tell Time to the Hour — when the minute hand points straight up"

description:
  en: "Grade 1 math/measurement package teaching kids to read analog clocks at the hour. Kids learn the structural features of an analog clock — 12 numbered positions, a SHORT hand (the hour hand) that points to a number 1-12, and a LONG hand (the minute hand) that points straight up to 12 when it's exactly the hour. 1:00 = hour hand on 1, minute hand on 12. CCSS.1.MD.B.3 anchor (canonical measurement-strand fill per learning-targets.json). Parallel to Arc 15 Phase 1 read-time-on-analog-clock (which saturated the cognitive-and-executive-function / time-and-routine strand by framing clock-reading as a daily-life skill); this package frames the same activity through the measurement-strand lens — clock-reading as quantitative measurement of time as a measurable dimension (parallel to length, weight, capacity, duration). Both framings coexist intentionally: the time-and-routine framing emphasizes WHEN things happen in the day; the measurement framing emphasizes time as a quantity that can be read off an instrument. Pair partner: tell-time-to-half-hour (Slot 4 of Phase 1.4; extends hour-only reading to half-hour positions). Together they form the canonical measurement-strand tell-time pair, opening the broader measurement-strand work that continues with tell-time-to-quarter-hour (Phase 1.5+), elapsed-time + minute work (Arc 18+). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + analog-clock structure introduction.
      Teacher displays a large analog clock face. "This is a
      clock — a tool that MEASURES time. See the 12 numbers
      around the edge? Each number is a HOUR-position. See
      TWO hands? The SHORT hand is the HOUR HAND — it shows
      us the hour. The LONG hand is the MINUTE HAND — it
      shows us the minutes. When it's exactly an HOUR (no
      extra minutes), the minute hand points STRAIGHT UP to
      12. The hour hand points to the hour number." Teacher
      demonstrates 3 hour-only positions: 3:00 (hour hand
      pointing at 3; minute hand pointing straight up at 12);
      9:00 (hour hand at 9; minute hand at 12); 12:00 (both
      hands together at 12). Class chants: "Three o'clock!
      Nine o'clock! Twelve o'clock!" Pattern emphasis: "When
      the long hand points straight up, the time is EXACTLY
      the hour. Read the hour hand to know which hour."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + clock-reading routine with movable-hand
      paper clocks. Each pair receives a movable-hand paper
      clock (clock-mat material with movable hour + minute
      hands) + a set of 8 hour-time cards (1:00, 4:00, 7:00,
      10:00, 2:00, 5:00, 8:00, 11:00). Pair takes turns: kid
      A draws a time card; kid B sets the paper clock to
      that time by moving the hands — minute hand to 12,
      hour hand to the named number. Kid A verifies the
      placement. Then swap. Recast errors with hand-cue ("8
      o'clock: long hand POINTS STRAIGHT UP to 12; short
      hand points to 8"). The movable hands let kids
      physically enact the position rather than just see it
      printed — measurement work is hands-on.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity — match
      each analog clock face (drawn at hour positions) to
      its digital time (1:00, 2:00, ... 12:00). Station 2:
      chart-count activity — count through hour positions
      around the clock face (1, 2, 3, ... 12). Station 3:
      math-puzzle activity (set the clock to a given time:
      missing-element prompt). Station 4: matching variant
      with vocabulary (clock face → "X o'clock" written
      form).
  closure:
    durationMinutes: 5
    body: |
      Whole-class hour-reading quick-recall. Teacher displays
      6 clock faces; class chorally reads each. "Four
      o'clock! Seven o'clock! Eleven o'clock! Twelve
      o'clock! Two o'clock! Nine o'clock!" Forward-pointer:
      "Today we read hour times — when the minute hand
      points straight up to 12. Next we'll learn HALF-PAST
      — when the minute hand points straight down to 6. And
      after that, QUARTER-PAST + QUARTER-TO — when the
      minute hand points to 3 or 9. Step by step, we're
      learning to MEASURE time on the clock."

