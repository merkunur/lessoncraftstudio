# Teaching package — remember image-pair positions (matching memory game)
# Arc 7 Phase 1 (Path B; cognitive-and-executive-function / memory-and-
# attention strand). Classic concentration / memory game format. Class B
# FLEXIBLE; composes against image-library breadth via grid-match app.
# Vocab-anchored — kids name images as they flip cards.

targetSlug: remember-image-pair-positions
language: en
title:
  en: "Memory Game — remember where each image-pair is"
description:
  en: "Pre-K to Grade 1 cognitive-and-executive-function package teaching working-memory through the classic concentration / memory game. Kids flip pairs of face-down cards and remember the positions of cards they've seen, building toward matching pairs. Vocab-anchored — kids name each image as they flip. Composes against grid-match app + image-library breadth. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher demonstrates the classic memory
      game: places 6 paired cards face-up in a 4×3 grid. "Look carefully —
      remember WHERE each picture is." Then flips all cards face-down.
      Selects 2 cards by position; reveals; class watches. If they
      match, leaves face-up; if not, flips back. Repeat 2-3 cycles. The
      meta-skill being built: kids hold visual-position memory in
      working memory while attempting matches.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work memory game: kids play in pairs with a 4×3 grid of 12
      cards (6 pairs). Take turns flipping 2 cards per turn; if matched,
      keep the pair; if not, flip back. Continue until all pairs found.
      Reinforce vocabulary: kids name each image they flip ("This is a
      cat... this is a dog... they don't match"). The naming requirement
      embeds vocabulary practice in cognitive-task. Optional extension:
      kids construct their own 4×3 grids using cut-outs; partners play
      each other's grids.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: grid-match worksheet (kids see partial
      grid information; deduce matching pairs from visual context).
      Station 2: matching worksheet (image-name reinforces image
      vocabulary). Station 3: manipulative cut-outs concentration grids
      (kids play with their own cut-out card sets in pairs of 4-8 pairs;
      build memory-game stamina).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher runs a final group memory game
      with 4-pair grid (8 cards); class works together to find all
      pairs collectively. Forward-pointer: "Today we played memory
      games to train our brains. When we come back to memory next, we'll
      try LARGER grids — 6 pairs, 8 pairs, 10 pairs."

