# Teaching package — medir o tempo em horas (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 16 Phase 1.2; 13th consecutive arc continuation).
# pt sparse-override for math / measurement strand. Conteúdo matemático universal —
# tradução direta sem reestruturação pedagógica. BR-MEC ensino fundamental anos
# iniciais register per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Medindo o Tempo em Horas — quanto tempo algo leva?"

description:
  pt: "Pacote de matemática/medida para educação infantil / 1º ano que ensina as crianças a MEDIR DURAÇÕES em unidades de hora. EXPLICITAMENTE distinto do read-time-on-analog-clock existente (que ensina leitura de relógio mecânico de tempo-do-dia): este pacote ensina medição de DURAÇÃO — quanto tempo uma atividade leva, quanto tempo até o almoço, quanto tempo durou o recreio. Constrói sobre Arc 15 Fase 2 measure-length-with-non-standard-units (que estabeleceu vocabulário de medida + rotinas de estimativa) + Arc 14 compare-by-time-duration (que comparou durações qualitativamente: mais-longo/mais-curto sem unidade). Extensão crítica para medição de duração BASEADA-EM-UNIDADE (hora como unidade canônica primeira para escalas-de-tempo K-3). Crianças aprendem: 'um dia escolar é cerca de 6 horas', 'dormir é cerca de 10-12 horas', 'um episódio de desenho é cerca de 1 hora'. Base para trabalho de tempo-decorrido + leitura de horário (candidato para Arc 17+). 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Iniciador com toda a turma + introdução de vocabulário de
      duração. A professora ou o professor exibe uma linha-do-
      tempo de rotina (dia escolar): acordar → café-da-manhã →
      início da aula → almoço → fim da aula → casa → hora-de-
      dormir. "Hoje vamos MEDIR O TEMPO — não que horas ESTÃO
      no relógio, mas quanto tempo as coisas LEVAM. Dormir é
      LONGO — cerca de 10 horas. Tomar café-da-manhã é CURTO
      — cerca de meia hora. A aula dura CERCA DE 6 horas." A
      professora introduz "hora" como a unidade canônica de
      duração K-3: "Uma hora é mais ou menos quanto tempo
      almoço + recreio levam, OU um episódio de desenho, OU
      uma aula de natação." A turma nomeia atividades familiares
      de 1 hora; a professora escreve no quadro. Distingue do
      trabalho de leitura-de-relógio: "NÃO estamos perguntando
      'que horas?' Estamos perguntando 'quanto tempo?'"
  contentActivity:
    body: |
      Trabalho em duplas + rotina de estimativa de duração. Cada
      dupla recebe um tapete "classificação de duração" (3
      colunas: menos-de-uma-hora / cerca-de-uma-hora / mais-de-
      uma-hora) + 12 cartões-de-atividade (escovar dentes, comer
      almoço, dormir à noite, assistir um desenho, ir para
      escola, brincar lá fora, fazer um quebra-cabeça, tomar
      banho, frequentar dia escolar, ler um livro, aula de
      natação, dirigir pela cidade). Dupla alterna: criança A
      lê um cartão; juntas estimam duração + colocam na coluna
      correta. Refraseie erros com demonstração-de-âncora-
      familiar ("dormir a noite toda é MUITO mais que uma hora
      — geralmente 10 horas. Então isso vai na coluna 'mais-
      de-uma-hora'."). Extensão: crianças inventam seus próprios
      cartões-de-duração.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios
      matching (atividade-para-duração; e.g., "escovar dentes" ↔
      "menos-de-uma-hora"; "dia escolar" ↔ "mais-de-uma-hora").
      Estação 2: math-worksheet (problemas de estimativa-de-
      duração: "Quanto dura o recreio? ____ hora(s)"). Estação
      3: chart-count (contar unidades-hora numa rotina diária:
      "das 8h às 12h são ____ horas"). Estação 4: more-less
      (compare duas durações: "Comer almoço é MAIS LONGO ou
      MAIS CURTO que dormir?"). Vocabulário pt-BR canônico para
      duração: hora / minuto / dia; quanto tempo / quanto dura
      / duração; mais longo / mais curto / mesma duração. Use
      "quanto tempo" como forma K-3 mais natural; "duração" mais
      técnica.
  closure:
    body: |
      Quiz de duração com toda a turma. A professora ou o
      professor nomeia atividades; turma coletivamente estima:
      "Quanto dura um episódio de desenho? Cerca de 1 hora!
      Quanto você dorme à noite? Cerca de 10 horas! Quanto leva
      escovar os dentes? Menos de 1 hora!" Indicador adiante:
      "Hoje medimos o tempo em HORAS. Quando voltarmos na
      próxima vez, mediremos durações MAIS CURTAS (minutos) +
      MAIS LONGAS (dias, semanas) + leremos RELÓGIOS para
      descobrir quando atividades COMEÇAM + quando TERMINAM —
      e quantas horas entre elas ('tempo decorrido')!"

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Estimar a duração de atividades familiares em unidades-
        hora corretamente em 6 de 8 tentativas (e.g., "dormir à
        noite leva cerca de 10 horas" / "escovar dentes leva
        menos de uma hora").
      - Classificar atividades em categorias menos-de-uma-hora /
        cerca-de-uma-hora / mais-de-uma-hora com precisão em 7
        de 10 tentativas.
      - Comparar duas durações de atividade corretamente usando
        "mais longo que" / "mais curto que" / "cerca da mesma"
        em 5 de 8 tentativas.
      - Usar "hora" como unidade canônica de duração em 5 de
        10 tentativas de linguagem produtiva.

    Diferenciação:
      - Pré-K (3-5 anos): comparação qualitativa de duração
        (mais-longo/mais-curto) apenas; sem trabalho em
        unidade-hora.
      - Educação infantil (5-7 anos): introdução a "hora" como
        âncora-de-atividade-familiar; classificação de duração
        com exemplos concretos.
      - 1º ano: estimativa completa em unidade-hora; ponte para
        trabalho de meia-hora e minuto; âncora de rotina-
        familiar.
      - 2º ano em diante: estender para problemas de tempo-
        decorrido + medição em unidade-minuto/dia/semana; ponte
        para leitura formal de horário-de-tempo.

compositionalRationale:
  pt: |
    Fio principal: matemática / medida (medição de duração em
    unidades-hora; aprofunda fio 2/4 → 3/4). Fio secundário:
    matemática / tempo-e-rotina (âncora-de-atividade-familiar
    de conceitos de duração). Fio terciário: numeracia
    (contagem de unidades-hora; trabalho de estimativa).

    Significância arquitetural: estende Arc 15 Fase 2 measure-
    length-with-non-standard-units (que estabeleceu vocabulário
    de medida + rotina de estimativa) para o domínio de medida-
    de-tempo. Companheiro de Arc 14 compare-by-time-duration
    (que comparou durações qualitativamente sem unidade) —
    este pacote estabelece a camada QUANTITATIVA (baseada-em-
    unidade) de medição de duração. EXPLICITAMENTE DISTINTO de
    read-time-on-analog-clock existente (Arc 14 Fase X, saturando
    fio time-and-routine 4/4) — aquele pacote ensina leitura
    MECÂNICA-DE-RELÓGIO (12:00, 1:30); este pacote ensina
    MEDIÇÃO DE DURAÇÃO (quanto tempo X leva em unidades-hora).
    Base para trabalho de tempo-decorrido + leitura de
    horário + extensões de medida Arc 17+ (minutos, dias,
    semanas).

    Especificidade pt-BR: hora-como-unidade-de-duração universal
    através de culturas + locales. Vocabulário pt-BR canônico:
    - **"hora"** — pt-BR direto cognato; usado tanto para
      tempo-de-dia quanto para duração; contexto desambigua.
    - **"quanto tempo"** — forma K-3 canônica para perguntar
      sobre duração; mais natural que "qual é a duração?"
    - **"duração"** — termo técnico; acessível K-3 quando
      introduzido em contexto.
    - **"mais longo / mais curto / mesma duração"** — vocabulário
      comparativo K-3-canônico.

    Contextos de duração (dormir / escola / refeição) são
    culturalmente universais no registro K-3; contextos brasileiros
    específicos (cafezinho, novela, recreio em escola pública)
    podem ser substituídos por equivalentes locais sem perda de
    coerência pedagógica.

    Currículo BNCC EF01MA17 (1º ano) + EF02MA10 + EF02MA20 (2º
    ano): leitura de medida de tempo em horas; resolução de
    problemas envolvendo medidas-de-tempo.

    Substrato Class B FLEXIBLE: composta contra tema animals
    para cartões de âncora de vocabulário (contável para
    trabalho de chart-count); conteúdo de duração usa
    atividades-de-rotina-cotidiana (não imagens-temáticas-
    específicas).
