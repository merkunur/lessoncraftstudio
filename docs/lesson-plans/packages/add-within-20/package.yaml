compositionalRationale:
  en: |
    Primary strand: early-numeracy / addition-subtraction (sums to 20).
    Secondary strand: counting-and-cardinality (count-on + make-10
    strategies). Tertiary strand: working-memory + strategy-selection
    (kids choose between counting + make-10 + recall).

    Architectural significance: deepens addition-subtraction strand
    2/14 → 3/14. RESOLVES Arc 11 add-within-10 forward-pointer.
    Make-10 strategy is the canonical Grade 1 numeracy bridge — kids
    use 10 as anchor for sums up to 20.

    Distinctive composition: 2 math-worksheet at medium difficulty +
    1 math-puzzle addition + 1 chart-count + 1 matching. Multi-app
    composition spans symbolic addition + concrete addition + count-
    with-chart + vocab-anchor.

    Class B FLEXIBLE substrate: composes against image-library breadth
    + numerals 1-20.

    K-3 multilingual classroom relevance: addition vocabulary +
    make-10 strategy is universal K-3 numeracy target. Cross-locale
    teen-number naming varies meaningfully (English 'eleven, twelve,
    thirteen' vs French 'onze, douze, treize' — irregular forms in
    most locales; teen-number fluency requires explicit work).

