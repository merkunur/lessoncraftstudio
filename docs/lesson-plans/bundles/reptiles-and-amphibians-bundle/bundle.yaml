thematicCoherence:
  en: |
    All 5 packages cohere around the reptiles-and-amphibians theme +
    extend animal-cluster substantial-coverage to cold-blooded-
    vertebrate biological-classification work.

    **Pedagogical sequencing:**
    1. **identify-and-name-10-zoo-animals** — Foundational reptile/
       amphibian vocabulary (snake, lizard, turtle, alligator,
       crocodile, frog, toad, salamander, gecko, iguana). Same
       shared package with zoo-animals-bundle + animals-bundle
       (cluster reuse — broader animal vocab; reptiles-and-
       amphibians-bundle anchors at cold-blooded subset).
    2. **identify-living-vs-nonliving** — Biological-classification
       work applied to reptile/amphibian habitats (all 10 species
       are living; distinguish from rocks + logs + water + bark in
       habitat-photographs). Same shared package with 9 prior
       animal-cluster bundles (10th instance at this bundle); cross-
       bundle reuse density continues compounding.
    3. **count-objects-1-to-10** — Counting practice using reptile/
       amphibian items as countable subjects (5 turtles in a row;
       3 frogs on a lily pad; 7 lizards on a rock; 8 snake eggs).
       Same shared package across many bundles.
    4. **sort-by-category** — Category-classification work
       distinguishing reptiles (snake, lizard, turtle, alligator,
       gecko, iguana) vs amphibians (frog, toad, salamander) OR by
       habitat (water-dwelling: alligator + turtle + frog; land-
       dwelling: lizard + snake + gecko) OR by skin-type (scaly:
       snake + lizard; smooth + moist: frog + salamander). Same
       shared package; reptile-vs-amphibian context introduces
       fundamental K-3 biology distinction.
    5. **use-size-comparison-words** — Comparison work using
       reptile/amphibian-size contrasts (big alligator vs small
       gecko; long snake vs short turtle; heavy crocodile vs light
       frog; wide python vs narrow chameleon). Same shared package;
       reptile/amphibian-size variation provides vivid contrast.

    **Strand spread:** 1 vocabulary-acquisition (cold-blooded
    vertebrates) + 1 living-things (classification) + 1 numeracy + 1
    cognitive-sorting + 1 comparison. **5 distinct strands.** 10th
    animal-cluster bundle; cluster substantial-coverage milestone
    (9 prior + this bundle = 10; broader animal-cluster scope
    coverage well beyond minimum bundle-architecture threshold).

    **Suggested unit duration:** 4-5 weeks (1 package per week).
    Natural fit alongside biology units OR zoo + nature-walk field-
    trips. Particularly engaging for K-3 — reptiles + amphibians
    have high curiosity-appeal + appear in many K-3 picture-books +
    mythology.

    **Multilingual classroom relevance:** reptile/amphibian
    vocabulary cognate-rich Romance (reptil / reptile / rettile /
    réptil); Germanic-distinct (Reptil / reptiel / kräldjur / krybdyr
    / matelijä). Specific species vocabulary varies (snake / Schlange
    / serpiente / serpent / serpente / cobra; frog / Frosch / rana /
    grenouille / rana / sapo). Cross-cultural-creature-mythology
    rich — dragons (Western European) + serpents (Mesoamerican
    Quetzalcoatl + Hindu Naga + Chinese long) + turtle (Native
    American symbolism). Bundle materials welcome diverse cultural-
    creature-mythology traditions.

    **Pillar 2 architectural pattern:** reptiles-and-amphibians-
    bundle exemplifies animal-cluster substantial-coverage extension
    (10 bundles: animals + farm-animals + pets + birds + insects +
    ocean-life + forest-creatures + dinosaurs + zoo-animals +
    reptiles-and-amphibians). Theme-axis-key animal-cluster-cold-
    blooded-vertebrates (vs birds at warm-blooded-vertebrates; vs
    mammals implicit at warm-blooded-mammal). Animal-cluster now at
    10-bundle substantial-coverage; further animal-cluster expansion
    (e.g., spiders + worms; predator-vs-prey crossover; nocturnal-
    animals; safari-animals; arctic-animals) reaches overkill class.
