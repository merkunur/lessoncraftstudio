assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Classify 8 mixed-diet animals into 3 diet categories with 70%+
        accuracy (Grade 1-2 target; lower for K).
      - Use diet-vocabulary ("herbivore," "carnivore," "omnivore") in oral
        sorting work — receptive understanding more important than
        productive technical-vocab use at this age.
      - Explain 1 reason why an animal has its diet (cow eats grass
        because it's a herbivore; lion eats meat because it's a carnivore)
        when prompted.

    Differentiation:
    - Pre-K: 2-category sorting only (plant-eaters vs meat-eaters); skip
      omnivore.
    - K: 3-category receptive; herbivore + carnivore productive.
    - Grade 1+: full 3-category productive + diet-reasoning.
    - Grade 2+: extend to food-chain vocabulary (predator, prey, primary
      consumer) + ecosystem-network thinking.

    Prerequisite check: kids who completed classify-animals-by-habitat
    (Phase 2) have the meta-cognitive skill of "I can sort animals into
    categories" already in place. Diet-classification builds on this.

