<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Which One Doesn’t Belong? — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/wodb.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=sv  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1 / ?embed=compact
    // Tool-specific deep links: ?grid=<grid-id>
    // (Free resolves ONLY the weekly featured grid — a ?grid= deep link
    //  cannot leak a premium grid; data: /mini-tools/wodb-grids.json)
    LCS.mount(Wodb, { mount: '#lcs-root' });
  </script>
</body>
</html>
