compositionalRationale:
  en: |
    Primary strand: early-literacy / letter-recognition (consonant
    letter-sound association). Secondary strand: phonics-decoding
    (foundation for word-decoding). Tertiary strand: vocabulary
    acquisition (anchor words per letter).

    Architectural significance: deepens letter-recognition strand 4/6
    → 5/6. Resolves Arc 12 match-uppercase-lowercase forward-pointer.
    Letter-sound work is the canonical bridge from letter-recognition
    (knowing letter shapes) to phonics-decoding (using letter sounds
    to read words). Pairs naturally with Arc 12 read-cvc-words.

    Distinctive composition: 2 alphabet-train + 2 matching + 1 word-
    guess. Letter-sound emphasis throughout. Vocab-anchor words
    chosen for clear consonant onsets (cat /k/; dog /d/; mouse /m/).

    Class B FLEXIBLE substrate: composes against image-library breadth.

    K-3 multilingual classroom relevance: consonant sounds are target-
    language-specific (en /th/ doesn't exist in es; es /rr/ trill
    doesn't exist in en). Locale-variant sparse-overrides handle
    locale-specific consonant inventories.

