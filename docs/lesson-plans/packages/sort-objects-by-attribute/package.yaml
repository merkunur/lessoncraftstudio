compositionalRationale:
  en: |
    Primary strand: early-numeracy / data-and-graphs (sorting-as-data-
    collection). Secondary strand: cognitive-and-executive-function /
    sorting (sorting cognition is the input to data work). Tertiary
    strand: counting + comparison (kids count groups + compare counts
    using more/less/same vocabulary).

    Architectural significance: FIRST data-and-graphs strand package
    in the catalog. Bridges cognitive sorting work (Arc 5+7+8) to
    numeracy data work — same sorting mechanic, different pedagogical
    framing (data-collection rather than category-membership). The
    bridge validates that strand-distinction is meaningful (sorting
    is BOTH cognitive AND numeracy depending on framing).

    Distinctive composition: alternating picture-sort + chart-count
    rhythm (positions 1, 2, 3, 4) mirrors the sort-then-count-then-
    chart pedagogical sequence. matching at position 5 reinforces
    vocabulary base. The 2 picture-sort exercises across 2 different
    theme contexts demonstrate that data-collection works across
    domains.

    Cross-strand integration: connects cognitive sorting strand (Arc
    5+7+8) + counting strand (Arc 1+3+8) + emerging data strand (this
    package). Future data-and-graphs packages can build on this
    foundation: read-charts-and-graphs, answer-questions-from-data,
    represent-data-with-bar-graph.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Sorting-as-data works with ANY theme that supports meaningful
    sorting (multiple-category themes); substrate-readiness universal.

    K-3 multilingual classroom relevance: data + graph vocabulary
    (more, less, fewer, equal, most, least, same) is high-frequency
    K-3 target across all 11 platform locales. Comparative grammar
    structures from compare-by-length (Phase 1 sibling) compose
    naturally with data work — kids learn to express data
    relationships using comparative language. Productive-language
    frames ('there are more reds than blues') give structured
    grammatical practice.

