description:
  en: "K-3 bundle centered on Thanksgiving as autumn-anchored North-American holiday for cross-strand cultural-awareness + seasonal work. 3rd holiday-themed bundle extending holiday-template established at Pillar 2 Arc 5 (easter + christmas). 5 packages span vocabulary-acquisition (identify-and-name-action-verbs — gather, share, give-thanks, harvest, feast, celebrate + thanksgiving-specific verbs) + numeracy (count-objects-1-to-10 — counting turkeys, pumpkins, place-settings, family-members at the table, autumn-leaves) + color-cognition (sort-by-color — autumn-palette: red leaves vs orange leaves vs yellow leaves vs brown leaves) + cultural-awareness (compare-greeting-routines-across-cultures — Thanksgiving traditions vary widely: US/Canadian Thanksgiving vs harvest-festivals in other cultures: Chuseok in Korea + Mid-Autumn Festival in China + Sukkot in Jewish tradition + Pongal in India + Erntedankfest in Germany) + autumn-seasonal (identify-four-seasons — Thanksgiving as autumn-anchored celebration). Holiday-template inheritance (action-verbs + counting + color-sorting + cross-cultural-greetings + four-seasons) per pattern locked at easter + christmas. Suitable for a 3-4 week classroom unit timed to late-November (US Thanksgiving) or mid-October (Canadian Thanksgiving). Supports K-3 multilingual classrooms with cross-cultural-harvest-tradition + family-gratitude extensions."

