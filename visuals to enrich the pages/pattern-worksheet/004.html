<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Pattern Worksheets - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(150deg, #FDEDEC 0%, #FADBD8 40%, #F5B7B1 100%); overflow: hidden;">

        <!-- Radial burst from center -->
        <div style="position: absolute; top: 50%; left: 50%; width: 1200px; height: 1200px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 50%);"></div>

        <!-- Confetti - scattered shapes throughout -->
        <!-- Circles -->
        <div style="position: absolute; top: 80px; left: 100px; width: 18px; height: 18px; background: #E74C3C; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; top: 150px; left: 200px; width: 14px; height: 14px; background: #17A589; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; top: 200px; right: 150px; width: 16px; height: 16px; background: #F39C12; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; top: 120px; right: 80px; width: 12px; height: 12px; background: #3498DB; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; bottom: 200px; left: 80px; width: 15px; height: 15px; background: #6C3483; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; bottom: 250px; right: 100px; width: 13px; height: 13px; background: #E74C3C; border-radius: 50%; opacity: 0.8;"></div>

        <!-- Squares -->
        <div style="position: absolute; top: 100px; left: 300px; width: 16px; height: 16px; background: #3498DB; border-radius: 3px; transform: rotate(15deg); opacity: 0.8;"></div>
        <div style="position: absolute; top: 180px; right: 250px; width: 14px; height: 14px; background: #E74C3C; border-radius: 3px; transform: rotate(-20deg); opacity: 0.8;"></div>
        <div style="position: absolute; bottom: 300px; left: 150px; width: 12px; height: 12px; background: #F39C12; border-radius: 3px; transform: rotate(30deg); opacity: 0.8;"></div>
        <div style="position: absolute; bottom: 180px; right: 200px; width: 15px; height: 15px; background: #17A589; border-radius: 3px; transform: rotate(-10deg); opacity: 0.8;"></div>

        <!-- Triangles -->
        <div style="position: absolute; top: 140px; left: 450px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 17px solid #6C3483; transform: rotate(20deg); opacity: 0.8;"></div>
        <div style="position: absolute; top: 90px; right: 300px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #17A589; transform: rotate(-15deg); opacity: 0.8;"></div>
        <div style="position: absolute; bottom: 220px; left: 250px; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 15px solid #3498DB; transform: rotate(25deg); opacity: 0.8;"></div>

        <!-- FREE Badge as yellow balloon -->
        <div style="position: absolute; top: 30px; left: 40px; z-index: 100;">
            <!-- Balloon -->
            <div style="width: 90px; height: 110px; background: linear-gradient(145deg, #F1C40F 0%, #D4AC0D 100%); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; box-shadow: 0 8px 25px rgba(241,196,15,0.5), inset -15px -15px 30px rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; position: relative;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #4A235A; text-shadow: 1px 1px 2px rgba(255,255,255,0.5);">FREE</span>
                <!-- Balloon tie -->
                <div style="position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 12px solid #D4AC0D;"></div>
            </div>
            <!-- String -->
            <div style="position: absolute; bottom: -50px; left: 50%; width: 2px; height: 50px; background: linear-gradient(to bottom, #D4AC0D, #888); transform: translateX(-50%);"></div>
        </div>

        <!-- Heart badge "Kids Love It!" -->
        <div style="position: absolute; top: 35px; right: 40px; z-index: 100;">
            <div style="position: relative;">
                <!-- Heart shape -->
                <div style="width: 120px; height: 110px; position: relative;">
                    <div style="position: absolute; top: 0; left: 60px; width: 60px; height: 95px; background: linear-gradient(145deg, #E74C3C 0%, #C0392B 100%); border-radius: 60px 60px 0 0; transform: rotate(-45deg); transform-origin: 0 100%;"></div>
                    <div style="position: absolute; top: 0; left: 0; width: 60px; height: 95px; background: linear-gradient(145deg, #E74C3C 0%, #C0392B 100%); border-radius: 60px 60px 0 0; transform: rotate(45deg); transform-origin: 100% 100%;"></div>
                </div>
                <span style="position: absolute; top: 32px; left: 50%; transform: translateX(-50%); font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white; text-align: center; line-height: 1.2; width: 80px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">Kids Love It!</span>
            </div>
        </div>

        <!-- 3D Title -->
        <div style="position: absolute; top: 120px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 100px; color: white; margin: 0; text-shadow: 6px 6px 0 #6C3483, 10px 10px 0 rgba(74,35,90,0.3); letter-spacing: -2px;">PATTERN</h1>
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 100px; color: #F1C40F; margin: -25px 0 0 0; text-shadow: 6px 6px 0 #E67E22, 10px 10px 0 rgba(230,126,34,0.3); letter-spacing: -2px;">FUN!</h1>
        </div>

        <!-- Subtitle cloud -->
        <div style="position: absolute; top: 320px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <div style="background: white; padding: 12px 35px; border-radius: 30px; box-shadow: 0 6px 20px rgba(0,0,0,0.15);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; color: #6C3483;">Spot the Sequence!</span>
            </div>
        </div>

        <!-- Center worksheet -->
        <div style="position: absolute; top: 380px; left: 50%; transform: translateX(-50%); z-index: 30;">
            <img src="https://www.lessoncraftstudio.com/samples/english/pattern%20worksheet/sample-10.jpeg" style="width: 260px; height: 337px; object-fit: cover; border-radius: 14px; border: 7px solid white; box-shadow: 0 20px 50px rgba(0,0,0,0.3);">
        </div>

        <!-- Pattern Character Squad -->

        <!-- Happy Circle character (left) -->
        <div style="position: absolute; left: 80px; top: 450px; z-index: 40;">
            <div style="position: relative;">
                <!-- Body -->
                <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #E74C3C 0%, #C0392B 100%); border-radius: 50%; box-shadow: 0 8px 25px rgba(231,76,60,0.4); position: relative;">
                    <!-- Eyes -->
                    <div style="position: absolute; top: 28px; left: 22px; width: 22px; height: 26px; background: white; border-radius: 50%;"></div>
                    <div style="position: absolute; top: 28px; right: 22px; width: 22px; height: 26px; background: white; border-radius: 50%;"></div>
                    <!-- Pupils -->
                    <div style="position: absolute; top: 34px; left: 30px; width: 10px; height: 12px; background: #1A1A2E; border-radius: 50%;"></div>
                    <div style="position: absolute; top: 34px; right: 28px; width: 10px; height: 12px; background: #1A1A2E; border-radius: 50%;"></div>
                    <!-- Smile -->
                    <div style="position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); width: 40px; height: 20px; border: 4px solid #1A1A2E; border-top: none; border-radius: 0 0 25px 25px;"></div>
                </div>
                <!-- Arms -->
                <div style="position: absolute; top: 35px; left: -25px; width: 30px; height: 12px; background: #C0392B; border-radius: 10px; transform: rotate(-30deg);"></div>
                <div style="position: absolute; top: 35px; right: -25px; width: 30px; height: 12px; background: #C0392B; border-radius: 10px; transform: rotate(30deg);"></div>
                <!-- Legs -->
                <div style="position: absolute; bottom: -25px; left: 20px; width: 12px; height: 30px; background: #C0392B; border-radius: 10px; transform: rotate(-10deg);"></div>
                <div style="position: absolute; bottom: -25px; right: 20px; width: 12px; height: 30px; background: #C0392B; border-radius: 10px; transform: rotate(10deg);"></div>
            </div>
        </div>

        <!-- Smiling Square character (right) -->
        <div style="position: absolute; right: 80px; top: 430px; z-index: 40;">
            <div style="position: relative;">
                <!-- Body -->
                <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #3498DB 0%, #2980B9 100%); border-radius: 15px; box-shadow: 0 8px 25px rgba(52,152,219,0.4); position: relative;">
                    <!-- Eyes -->
                    <div style="position: absolute; top: 25px; left: 18px; width: 20px; height: 24px; background: white; border-radius: 50%;"></div>
                    <div style="position: absolute; top: 25px; right: 18px; width: 20px; height: 24px; background: white; border-radius: 50%;"></div>
                    <!-- Pupils -->
                    <div style="position: absolute; top: 31px; left: 25px; width: 9px; height: 11px; background: #1A1A2E; border-radius: 50%;"></div>
                    <div style="position: absolute; top: 31px; right: 24px; width: 9px; height: 11px; background: #1A1A2E; border-radius: 50%;"></div>
                    <!-- Smile -->
                    <div style="position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: 35px; height: 18px; border: 4px solid #1A1A2E; border-top: none; border-radius: 0 0 22px 22px;"></div>
                </div>
                <!-- Arms -->
                <div style="position: absolute; top: 32px; left: -22px; width: 28px; height: 11px; background: #2980B9; border-radius: 8px; transform: rotate(20deg);"></div>
                <div style="position: absolute; top: 32px; right: -22px; width: 28px; height: 11px; background: #2980B9; border-radius: 8px; transform: rotate(-20deg);"></div>
                <!-- Legs -->
                <div style="position: absolute; bottom: -22px; left: 18px; width: 11px; height: 28px; background: #2980B9; border-radius: 8px;"></div>
                <div style="position: absolute; bottom: -22px; right: 18px; width: 11px; height: 28px; background: #2980B9; border-radius: 8px;"></div>
            </div>
        </div>

        <!-- Excited Triangle character (bottom) -->
        <div style="position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); z-index: 40;">
            <div style="position: relative;">
                <!-- Triangle body -->
                <div style="width: 0; height: 0; border-left: 55px solid transparent; border-right: 55px solid transparent; border-bottom: 95px solid #F39C12; filter: drop-shadow(0 8px 20px rgba(243,156,18,0.4)); position: relative;"></div>
                <!-- Face container (positioned over triangle) -->
                <div style="position: absolute; top: 45px; left: 50%; transform: translateX(-50%); width: 70px; height: 50px;">
                    <!-- Eyes -->
                    <div style="position: absolute; top: 0; left: 8px; width: 18px; height: 22px; background: white; border-radius: 50%;"></div>
                    <div style="position: absolute; top: 0; right: 8px; width: 18px; height: 22px; background: white; border-radius: 50%;"></div>
                    <!-- Pupils -->
                    <div style="position: absolute; top: 5px; left: 14px; width: 8px; height: 10px; background: #1A1A2E; border-radius: 50%;"></div>
                    <div style="position: absolute; top: 5px; right: 12px; width: 8px; height: 10px; background: #1A1A2E; border-radius: 50%;"></div>
                    <!-- Open mouth (excited) -->
                    <div style="position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 25px; height: 18px; background: #1A1A2E; border-radius: 0 0 15px 15px;"></div>
                </div>
                <!-- Arms -->
                <div style="position: absolute; top: 60px; left: -15px; width: 25px; height: 10px; background: #D68910; border-radius: 8px; transform: rotate(-45deg);"></div>
                <div style="position: absolute; top: 60px; right: -15px; width: 25px; height: 10px; background: #D68910; border-radius: 8px; transform: rotate(45deg);"></div>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 95px; left: 0; right: 0; background: linear-gradient(90deg, rgba(108,52,131,0.95) 0%, rgba(74,35,90,0.95) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.2);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: white; letter-spacing: 2px;">Learning in Disguise!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: white; padding: 12px 20px; border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); border: 3px solid #17A589;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #17A589;">Perfect for Centers!</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); border: 3px solid #F39C12;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #D68910;">Brain Boost!</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); border: 3px solid #E74C3C;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #C0392B;">Early Finishers!</span>
            </div>
        </div>

    </div>
</body>
</html>
