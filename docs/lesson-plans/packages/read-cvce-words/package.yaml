compositionalRationale:
  en: |
    Primary strand: early-literacy / phonics-decoding (CVCe word
    decoding). Secondary strand: phonological awareness (long-vowel
    sound discrimination). Tertiary strand: vocabulary acquisition.

    Architectural significance: deepens phonics-decoding strand 1/11
    → 2/11. Resolves Arc 12 read-cvc-words forward-pointer. CVCe
    pattern is canonical Grade 1 phonics rule (silent-e magic).
    Builds reading-progression from CVC → CVCe → consonant-blends
    → digraphs → vowel-teams across phonics-decoding strand.

    K-3 multilingual classroom relevance: CVCe is en-specific. Locale
    sparse-overrides handle locale-specific phonics patterns.

curriculumStandards:
