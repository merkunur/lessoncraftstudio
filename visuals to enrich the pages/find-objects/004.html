<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Find Objects - Spot It Challenge Fun Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1000px;
            height: 1000px;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }
        .container {
            width: 1000px;
            height: 1000px;
            background: linear-gradient(135deg, #E91E63 0%, #FF8A80 50%, #FFAB91 100%);
            position: relative;
            overflow: hidden;
        }

        /* Confetti background */
        .confetti {
            position: absolute;
            width: 20px;
            height: 20px;
            opacity: 0.7;
        }
        .confetti-1 { top: 80px; left: 100px; background: #FACC15; transform: rotate(45deg); }
        .confetti-2 { top: 150px; left: 250px; background: #00BFA5; transform: rotate(-20deg); border-radius: 50%; }
        .confetti-3 { top: 100px; right: 200px; background: #03A9F4; transform: rotate(30deg); }
        .confetti-4 { top: 200px; right: 100px; background: #FACC15; transform: rotate(-45deg); border-radius: 50%; }
        .confetti-5 { top: 600px; left: 80px; background: #00BFA5; transform: rotate(15deg); }
        .confetti-6 { top: 700px; left: 200px; background: #03A9F4; transform: rotate(-30deg); border-radius: 50%; }
        .confetti-7 { top: 650px; right: 150px; background: #FACC15; transform: rotate(60deg); }
        .confetti-8 { top: 750px; right: 80px; background: #00BFA5; transform: rotate(-15deg); border-radius: 50%; }
        .confetti-9 { top: 300px; left: 50px; background: #FF8A80; transform: rotate(25deg); }
        .confetti-10 { top: 400px; right: 60px; background: #FFAB91; transform: rotate(-35deg); border-radius: 50%; }

        /* Sparkle stars */
        .sparkle {
            position: absolute;
            font-size: 35px;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }
        .sparkle-1 { top: 120px; left: 60px; }
        .sparkle-2 { top: 180px; right: 80px; }
        .sparkle-3 { top: 500px; left: 40px; }
        .sparkle-4 { top: 580px; right: 50px; }
        .sparkle-5 { bottom: 200px; left: 100px; }
        .sparkle-6 { bottom: 250px; right: 120px; }

        /* Main title - SPOT IT! */
        .title-section {
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }

        .spot-it {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 90px;
            color: #FACC15;
            text-shadow:
                5px 5px 0 #E91E63,
                8px 8px 0 rgba(0,0,0,0.2);
            letter-spacing: -3px;
            -webkit-text-stroke: 4px #C2185B;
        }

        /* Speech bubble */
        .speech-bubble {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 40px;
            border-radius: 40px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border: 15px solid transparent;
            border-top-color: white;
        }

        .bubble-text {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 28px;
            color: #E91E63;
        }

        /* Worksheet with checkmarks */
        .worksheet-area {
            position: absolute;
            top: 280px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
        }

        .worksheet-frame {
            background: white;
            padding: 12px;
            border-radius: 16px;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.3),
                0 0 0 6px rgba(255,255,255,0.4);
            position: relative;
            transform: rotate(-2deg);
        }

        .worksheet-frame img {
            width: 380px;
            height: auto;
            border-radius: 10px;
            display: block;
        }

        /* Animated checkmarks on worksheet */
        .check {
            position: absolute;
            font-size: 45px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }
        .check-1 { top: 80px; left: 60px; transform: rotate(-10deg); }
        .check-2 { top: 150px; right: 50px; transform: rotate(15deg); }
        .check-3 { top: 250px; left: 80px; transform: rotate(5deg); }
        .check-4 { bottom: 150px; right: 70px; transform: rotate(-8deg); }

        /* FOUND IT! celebration burst */
        .found-it {
            position: absolute;
            top: 250px;
            right: 60px;
            background: #00BFA5;
            padding: 15px 25px;
            border-radius: 20px;
            transform: rotate(12deg);
            box-shadow: 0 8px 25px rgba(0,191,165,0.4);
            z-index: 15;
        }

        .found-it-text {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 28px;
            color: white;
        }

        /* Peeking cartoon eyes */
        .peeking-eyes {
            position: absolute;
            display: flex;
            gap: 20px;
        }

        .eyes-left {
            bottom: 220px;
            left: 30px;
        }

        .eyes-right {
            top: 350px;
            right: 30px;
        }

        .eye {
            width: 50px;
            height: 60px;
            background: white;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .pupil {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 25px;
            background: #1a1a1a;
            border-radius: 50%;
        }

        .eyes-left .pupil { left: 70%; }
        .eyes-right .pupil { left: 30%; }

        /* Trophy */
        .trophy {
            position: absolute;
            top: 280px;
            left: 50px;
            font-size: 55px;
            transform: rotate(-15deg);
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Grade badge */
        .grade-badge {
            position: absolute;
            top: 30px;
            left: 30px;
            background: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #E91E63;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 20;
        }

        /* FREE badge */
        .free-badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: #FACC15;
            padding: 12px 24px;
            border-radius: 25px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: #E91E63;
            box-shadow: 0 4px 15px rgba(250,204,21,0.5);
            z-index: 20;
        }

        /* CLASSROOM FAVORITE banner */
        .favorite-banner {
            position: absolute;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            background: #00BFA5;
            padding: 12px 35px;
            border-radius: 30px;
            z-index: 15;
            box-shadow: 0 6px 20px rgba(0,191,165,0.4);
        }

        .favorite-text {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 26px;
            color: white;
            letter-spacing: 1px;
        }

        /* Bottom features */
        .features-bar {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 15;
        }

        .feature-pill {
            background: rgba(255,255,255,0.95);
            padding: 12px 22px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 17px;
            color: #E91E63;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Confetti -->
        <div class="confetti confetti-1"></div>
        <div class="confetti confetti-2"></div>
        <div class="confetti confetti-3"></div>
        <div class="confetti confetti-4"></div>
        <div class="confetti confetti-5"></div>
        <div class="confetti confetti-6"></div>
        <div class="confetti confetti-7"></div>
        <div class="confetti confetti-8"></div>
        <div class="confetti confetti-9"></div>
        <div class="confetti confetti-10"></div>

        <!-- Sparkle stars -->
        <div class="sparkle sparkle-1">✨</div>
        <div class="sparkle sparkle-2">✨</div>
        <div class="sparkle sparkle-3">✨</div>
        <div class="sparkle sparkle-4">✨</div>
        <div class="sparkle sparkle-5">✨</div>
        <div class="sparkle sparkle-6">✨</div>

        <!-- Grade badge -->
        <div class="grade-badge">GRADES PreK-2</div>

        <!-- FREE badge -->
        <div class="free-badge">FREE</div>

        <!-- Main title -->
        <div class="title-section">
            <div class="spot-it">SPOT IT!</div>
        </div>

        <!-- Speech bubble -->
        <div class="speech-bubble">
            <div class="bubble-text">The Picture Challenge!</div>
        </div>

        <!-- Trophy -->
        <div class="trophy">🏆</div>

        <!-- FOUND IT burst -->
        <div class="found-it">
            <div class="found-it-text">FOUND IT!</div>
        </div>

        <!-- Peeking eyes left -->
        <div class="peeking-eyes eyes-left">
            <div class="eye"><div class="pupil"></div></div>
            <div class="eye"><div class="pupil"></div></div>
        </div>

        <!-- Peeking eyes right -->
        <div class="peeking-eyes eyes-right">
            <div class="eye"><div class="pupil"></div></div>
            <div class="eye"><div class="pupil"></div></div>
        </div>

        <!-- Worksheet with checkmarks -->
        <div class="worksheet-area">
            <div class="worksheet-frame">
                <img src="https://www.lessoncraftstudio.com/samples/english/find%20objects/sample-15.jpeg" alt="Find Objects Worksheet">
                <div class="check check-1">✅</div>
                <div class="check check-2">✅</div>
                <div class="check check-3">✅</div>
                <div class="check check-4">✅</div>
            </div>
        </div>

        <!-- CLASSROOM FAVORITE banner -->
        <div class="favorite-banner">
            <div class="favorite-text">CLASSROOM FAVORITE!</div>
        </div>

        <!-- Features bar -->
        <div class="features-bar">
            <div class="feature-pill">Perfect for Centers</div>
            <div class="feature-pill">Brain Breaks</div>
            <div class="feature-pill">Early Finishers</div>
        </div>
    </div>
</body>
</html>
