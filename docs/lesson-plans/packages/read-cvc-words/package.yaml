compositionalRationale:
  en: |
    Primary strand: early-literacy / phonics-decoding (CVC word
    decoding). Secondary strand: phonological awareness (kids segment
    + blend phonemes). Tertiary strand: vocabulary acquisition (vocab-
    anchored — CVC words drawn from familiar vocabulary).

    **Architectural significance: STRAND-FIRST in phonics-decoding (0/11
    → 1/11).** Foundational decoding skill bridging letter-recognition
    (Arc 9-11) + phonological-awareness (Arc 10-11) into actual word-
    reading. Phonics-decoding is the canonical path from pre-reading
    to reading; this package opens the strand for sibling targets
    (read-cvce-words, read-consonant-blends, read-consonant-digraphs,
    read-vowel-teams + 7 more unauthored).

    Distinctive composition: matching + word-guess + alphabet-train +
    word-scramble + matching letter mode. Multi-app composition spans
    word-recognition + spelling reinforcement + letter-recognition +
    image-letter pairing. Heavy emphasis on letter-recognition apps
    because phonics relies on rapid letter-sound mapping.

    Cross-strand integration: leverages letter-recognition (Arc 9-11) +
    phonological-awareness (rhyme + syllable from Arc 10-11) +
    vocabulary as base. Future arcs build on this: spelling-and-encoding
    + reading-comprehension + writing-composition all assume
    phonics-decoding fluency.

    Class B FLEXIBLE substrate: composes against vocabulary-rich themes
    that contain CVC-word vocabulary (cat, dog, sun, hat, pig, bus,
    car, bag, cup, jam, etc.). animals + foods + clothing + colors
    themes all rich in CVC words.

    K-3 multilingual classroom relevance: CVC pattern is en-specific
    (other locales have different phonological structures — Spanish:
    open syllables; German: consonant-clusters; Finnish: vowel-
    harmony). Locale-variant sparse-overrides per Phase 3 handle
    locale-specific decoding patterns. For en target-language-immersion
    contexts: CVC reading is the gateway to early literacy.

