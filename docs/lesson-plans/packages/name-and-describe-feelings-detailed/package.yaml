compositionalRationale:
  en: |
    Primary strand: science / personal-social-emotional-development
    (complex-emotion vocabulary expansion; deepens PSED strand
    3/6 → 4/6). Secondary strand: early-literacy / vocabulary-
    acquisition (10 new emotion-vocabulary words added per
    package). Tertiary strand: cognitive-and-executive-function
    / self-awareness (scenario-emotion matching builds metacognitive
    awareness of internal states).

    Architectural significance: extends Arc 8-12 express-feelings-
    with-words (basic 4 emotions: happy/sad/angry/scared) into
    COMPLEX-EMOTION territory (10 new vocabulary words covering
    frustrated/anxious/proud/embarrassed/jealous/surprised/curious/
    disappointed/bored/excited). EXPLICITLY DISTINCT from express-
    feelings-with-words — that package teaches BASIC emotion
    recognize + name + verbal-express; this package teaches
    NUANCED VOCABULARY for complex emotions kids feel daily but
    often can't articulate. Foundation for regulate-emotions-
    with-strategies (Arc 15; already shipped) + show-empathy-
    toward-others (Arc 15; already shipped) — kids with richer
    emotion-vocabulary regulate + empathize better. PSED strand
    advancement: 3/6 → 4/6 at this Phase 1.2 close.

    Distinctive composition: 1 picture-sort (emotion-categories)
    + 2 matching (scenario-to-emotion) + 1 math-worksheet
    (feeling-frequency tally) + 1 word-guess (emotion-word
    spelling practice). picture-sort surfaces emotion-family
    groupings (happy/excited/proud/curious cluster vs sad/
    disappointed/bored cluster vs angry/frustrated cluster vs
    scared/anxious/embarrassed/jealous cluster); matching
    emphasizes scenario-anchoring per developmental-norm pattern.

    Class B FLEXIBLE substrate: composes against emotions theme
    (theme is canonical for SEL work; face-image library covers
    the 14+ emotion expressions surfaced in this package).
    Cross-bundle reuse opportunity: emotions-bundle (Pillar 2
    cycle close 1-bundle SEL anchor) + future SEL-cluster
    bundles (Arc 17+ candidates).

    SEL class-conditional material composition (per CC↔assistant
    adjudication during Phase 1.2 execution):
    - flashcards (KEEP): emotion-vocabulary word-flash work
    - picture-cards (KEEP): emotion-face production prompts
    - sentence-strips (KEEP): "i-feel" frame preset; "I feel
      FRUSTRATED when ___" canonical SEL sentence-frame
    - manipulative-cut-outs (KEEP): emotion-icon cut-outs for
      feeling-day tracker activity
    - parent-take-home-letter (KEEP): home-school SEL bridge;
      parent introduction to complex-emotion vocabulary
    - answer-key (KEEP): teacher-reference for scenario-emotion
      pairings + classroom-culture-sensitive discussion guidance
    - matching-mat (REMOVE per audit fan-out SEL class disposition):
      emotion-vocabulary doesn't fit pair-matching shape
    - vocabulary-tracing-strips (REMOVE per audit fan-out):
      emotion-vocabulary tracing isn't pedagogically additive
      at K-Grade-1 register
    Total: 6 materials per SEL class-conditional adjudication.

    K-3 multilingual classroom relevance: complex-emotion
    vocabulary varies significantly across locales + cultures —
    some locales have direct cognate words ("frustrated" → de
    "frustriert" / pt "frustrado"); others have culturally-
    specific emotion concepts (de "Schadenfreude" / pt
    "saudade"). Per CLAUDE.md §1 international K-3 multilingual
    classroom audience, this package emphasizes the 10 most-
    universally-applicable complex emotions; locale-variant
    work at Phase 3+ adapts to each locale's culturally-specific
    emotion-vocabulary register. Classroom-culture sensitivity
    preserved: NO judgment about "right" or "wrong" feelings;
    all feelings are normal + can be named.

