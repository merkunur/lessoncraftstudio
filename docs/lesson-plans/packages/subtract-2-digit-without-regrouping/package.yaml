assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compute two-digit subtraction without borrowing
        correctly in 7 of 10 trials.
      - Align tens-under-tens and ones-under-ones in column
        format in 8 of 10 problems.
      - Use at least 2 subtraction strategies (e.g., column-
        subtract + decomposition) in 5 of 10 trials.
      - Solve missing-operand problems within the no-borrow
        range (67-?=44) in 5 of 10 trials.

    Differentiation:
    - Pre-K: skip two-digit; review subtract-within-10.
    - K: introduce two-digit minus ones (47-3, 60-4) before
      two-digit minus two-digit; manipulative support
      emphasized; avoid problems requiring borrowing
      initially.
    - Grade 1: full two-digit minus two-digit without
      borrowing; column-subtract format practiced;
      transitions to subtract-within-100 (Grade 2) when
      borrowing is the next conceptual step.
    - Grade 2+: brief reinforcement; the no-borrow case
      becomes the easy subset of subtract-within-100;
      fluency target is mental two-digit subtraction in
      the no-borrow case.

