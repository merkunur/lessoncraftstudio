# Teaching package — tens and ones (place value 51 to 100)
# Arc 15 Phase 4 (math / place-value 2/8 → 3/8; deepens Arc 15 Phase 1+2 foundation).

targetSlug: tens-and-ones-51-to-100
language: en
title:
  en: "Tens and Ones to 100 — completing the full two-digit range"
description:
  en: "Grade 1 / Grade 2 math package completing place-value coverage from 51-100. Builds directly on Arc 15 Phase 1 tens-and-ones-1-to-20 + Phase 2 tens-and-ones-21-to-50. Examples: 67 = 6 tens + 7 ones; 85 = 8 tens + 5 ones; 100 = 10 tens + 0 ones (or 1 hundred). Critical completion of full two-digit range work. Place-value strand: 2/8 → 3/8 at Phase 4 close. Foundation for full place-value-aware addition/subtraction + three-digit place-value extension (Arc 16+ work). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + completion-of-range introduction. Teacher
      displays 67 single-counters + groups them as 6 BUNDLES OF
      10 + 7 LOOSE COUNTERS. "Last time we did tens-and-ones up
      to 50. Today we COMPLETE the journey — all the way to 100!
      67 has 6 tens (60) + 7 ones (7) = 67." Teacher repeats with
      85 (8 tens + 5 ones), 73 (7 tens + 3 ones), 100 (10 tens
      OR 1 hundred). Pattern emphasis: "Same rule: TENS digit
      first, ONES digit second. Now we go all the way to 9 tens,
      then 100!"
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + place-value routine. Each pair receives base-ten
      manipulative kits for numbers 51-100. Pair takes turns: kid
      A shows a number with manipulatives; kid B writes digital
      number. Recast errors with regrouping demo for kids who
      try to use 10+ ones-counters ("you have 13 ones for 73.
      Let's regroup — 10 ones become 1 ten-stick. So 73 = 7
      tens + 3 ones."). 100 is special — introduce as either 10
      tens (extending two-digit pattern) OR 1 hundred (preview
      of three-digit work).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (number to
      tens-and-ones representation for 51-100 range). Station 2:
      math-puzzle (decompose: 85 = ? tens + ? ones). Station 3:
      pattern-train (sequence: 67, 68, 69, 70, 71...). Station 4:
      more-less (compare two two-digit numbers in 51-100 range:
      67 vs 76 — which is greater?).
  closure:
    durationMinutes: 5
    body: |
      Whole-class place-value quiz. Teacher shows 6 numbers (62,
      78, 95, 84, 99, 100); class collectively names tens + ones.
      "62 = 6 tens + 2 ones! 100 = 10 tens OR 1 HUNDRED!"
      Forward-pointer: "Today we completed tens-and-ones up to
      100. When we come back next, we can start THREE-DIGIT
      place value (hundreds + tens + ones for 101+) + use
      place-value in ADDITION + SUBTRACTION with regrouping
      (carrying + borrowing)!"

