<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Poison Good (static-gate fixture, not a game)</title>
  <style>
    html, body { margin: 0; padding: 0; background: #FBF3E4; }
    #game { width: 100%; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="../_lib/theme.js"></script>
  <script src="../_lib/ui-strings.js"></script>
  <script src="../_lib/art.js"></script>
  <script src="../_lib/phaser-3.90.0.min.js"></script>
  <script src="../_lib/game-core.js"></script>
  <script>
    GameCore.init({});
    GameCore.reportHeight();
    const ART = {
      fox:   { kind: "svg", value: LCSArt.get("_probe.dot"), size: 96 },
      berry: { kind: "emoji", value: "🍓", size: 56 },
      tile:  { kind: "shape", shape: "roundRect", w: 80, h: 80, fill: "surface", stroke: "line" }
    };
    const ANIM = { pop: { scale: 1.12, duration: 140, ease: "Back.Out", yoyo: true } };
    const STRINGS = {
      en: { title: "Poison" }, de: { title: "Poison" }, fr: { title: "Poison" }, it: { title: "Poison" }, es: { title: "Poison" }, pt: { title: "Poison" },
      nl: { title: "Poison" }, sv: { title: "Poison" }, da: { title: "Poison" }, no: { title: "Poison" }, fi: { title: "Poison" }
    };
    var sceneName = "Boot";
    window.LCS_TEST = {
      ready: function () { return true; }, scene: function () { return sceneName; }, strings: function () { return { start: GameCore.t("start") }; },
      start: function () { sceneName = "Play"; }, wrong: function () {}, correct: function () { sceneName = "Finish"; }, targets: function () { return []; }
    };
    var Boot = new Phaser.Class({ Extends: Phaser.Scene, initialize: function Boot() { Phaser.Scene.call(this, "Boot"); },
      create: function () { GameCore.makeStartScreen(this, STRINGS.en.title, function () {}); GameCore.tone("tap"); GameCore.drawArt(this, ART, "fox", 100, 100); } });
    new Phaser.Game({ type: Phaser.AUTO, parent: "game", width: 720, height: 560, backgroundColor: THEME.colour.bg.hex, scene: [Boot] });
  </script>
</body>
</html>
