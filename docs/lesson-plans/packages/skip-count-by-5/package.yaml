compositionalRationale:
  en: |
    Primary strand: early-numeracy / counting-and-cardinality (skip-
    counting). Secondary strand: pattern-recognition (skip-counting
    by 5s produces a geometric pattern on the 100-chart). Tertiary
    strand: vocabulary acquisition (vocab-anchored — multiples-of-5
    number names reinforced through chant + matching).

    Architectural significance: SECOND skip-counting package; resolves
    Arc 8 skip-count-by-2's forward-pointer to count-by-5s + count-by-
    10s trilogy completion. Skip-counting fluency at 2s + 5s + 10s
    is the canonical pre-multiplication numeracy substrate. The
    trilogy completes at Arc 9+ skip-count-by-10 (Arc 9 Path B
    candidate not selected for Phase 1; queued for future arc).

    Multiplication-readiness framing: counting by 5s is exactly
    multiplication-by-5 ('5×1=5, 5×2=10, 5×3=15...'). Kids who develop
    skip-counting fluency at 5s arrive at formal multiplication
    (Grade 2-3) with the conceptual foundation already established.
    Pre-formal-multiplication work is high-leverage K-3 numeracy
    investment.

    Distinctive composition: 3 chart-count exercises (positions 1, 2,
    5) with the chart-count app's unified mode. math-worksheet at
    position 3 reinforces the +5 arithmetic. matching at position 4
    reinforces multiples-of-5 number vocabulary.

    Class B FLEXIBLE substrate: composes against image-library breadth
    + numerals theme (1-100 range for numeral-cards). Counting-by-5s
    works with any countable object set; substrate-readiness universal.

    K-3 multilingual classroom relevance: number names are early-
    language-acquisition targets across all 11 platform locales;
    multiples-of-5 chants ("five, ten, fifteen, twenty, twenty-five,
    thirty...") embed multi-syllable number names in a memorable
    rhythmic structure. Cross-locale: every platform locale has its
    own number-name set + skip-counting cultural conventions (Spanish
    'cinco, diez, quince, veinte...'; French 'cinq, dix, quinze,
    vingt...').

