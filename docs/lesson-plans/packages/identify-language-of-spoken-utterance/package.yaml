compositionalRationale:
  en: |
    Primary strand: early-literacy / multilingual-language-awareness
    (language-discrimination by ear). Secondary strand: phonological
    awareness (cross-language sound-pattern noticing). Tertiary strand:
    cultural awareness (each language carries its own community of
    speakers).

    Architectural significance: 4th multilingual-language-awareness
    strand package (after name-this-object-in-two-languages + notice-
    cognate-word-pairs + compare-greeting-routines-across-cultures).
    Strand depth growing 2 → 3 → 4. Receptive-language counterpart
    to respond-in-target-language-when-prompted (Phase 2 sibling) —
    LISTEN before SPEAK pairing.

    Distinctive composition: emotions theme as pedagogical proxy for
    multilingual context (emotions vocabulary varies across languages
    and provides good practice surface for translation-to-locale
    flashcard-back parameter use). FIRST package to use 2 flashcards
    materials with different homeLanguageForBack (es + fr) — kids
    practice receptive language across multiple home-language
    configurations.

    Cross-strand integration: connects multilingual-language-awareness
    + phonological-awareness (early-literacy) + receptive-language
    skills. Phonological-discrimination across languages is precursor
    to in-language phonological awareness (initial sounds, rhyming,
    syllable counting) — the package's listening-by-ear mechanic
    transfers to within-target-language phonological work.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Language-discrimination is theme-agnostic at the cognitive level;
    substrate-readiness universal.

    K-3 multilingual classroom relevance: HIGH. Multilingual-K-3 audience
    contains classrooms where multiple languages are heard daily —
    parents speaking home language, classmates speaking different home
    languages, target-language instruction. Explicit language-
    discrimination work helps kids parse this multilingual sound-
    landscape rather than treating it as undifferentiated noise.

