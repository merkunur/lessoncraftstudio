# Teaching package — segment CVC words into phonemes
# Arc 19 Phase 1.3 Slot 2 (early-literacy / phonological-awareness strand 8/9 → 9/9 SAT — STRAND-SAT-CLOSING; 22nd parent-class strand SAT closure). Pair-coherent with Phase 1.3 Slot 1 blend-onset-rime. Final canonical target in the phonological-awareness strand. Reverse-operation pair with Phase 1.2 Slot 4 blend-phonemes-cvc. Prerequisites per learning-targets.json line 41: blend-phonemes-cvc (Phase 1.2 Slot 4; ✓ filesystem-staged).

targetSlug: segment-cvc-into-phonemes
language: en
title:
  en: "Segment Sounds — pulling words apart into separate sounds"
description:
  en: "Kindergarten early-literacy package teaching kids to SEGMENT CVC words into individual phonemes. Direct reverse-operation of Phase 1.2 Slot 4 blend-phonemes-cvc synthesis: kids hear 'cat' + decompose it into /c/ + /a/ + /t/. Most analytically-demanding of the phonological-awareness skills + the canonical bridge to systematic phonics-decoding via Elkonin-box methodology (3 boxes = 3 sounds; kid taps each box while saying each phoneme). STRAND-SAT-CLOSING package: completes phonological-awareness strand at 9/9 SAT — final canonical target per learning-targets.json line 41. **22nd parent-class strand SATISFIED in the catalog** (advances aggregate parent-class strand-saturation 21/30 → 22/30 = 73.3% per §A.13.33 parent-class methodology). 3-consecutive-SAT-closure momentum: Phase 1.1 reading-comprehension + Phase 1.2 measurement + Phase 1.3 phonological-awareness = 3 SAT closures across 3 phases of Arc 19. Per learning-targets.json line 41 prerequisite: blend-phonemes-cvc (Phase 1.2 Slot 4 ✓ filesystem-staged). Per §A.13.30 K-1 informal framing: K segmentation work is CONCRETE SOUND-DECOMPOSITION via Elkonin-box methodology — kid sees 3 empty boxes drawn on paper + taps each box while pronouncing each phoneme of a CVC word slowly ('/c/.../a/.../t/'). NOT formal phonological-decomposition theory pedagogy. CCSS.RF.K.2e primary anchor ('Add or substitute individual sounds (phonemes) in simple, one-syllable words to make new words'). 5 worksheet exercises + 8 printable materials over a 1-week unit. **Phonological-awareness pedagogy is locale-specific — segmentation pedagogy differs per locale. pt-BR uses syllabic-segmentation primarily; phonemic-segmentation introduced later per BR-MEC framework.** Materials list mirrors Phase 1.1+1.2 phonological-awareness cluster Literacy 8-material canonical."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class segmentation hook + Elkonin-box introduction.
      Teacher draws 3 empty boxes on the board side by side:
      [ ] [ ] [ ]. "These are SOUND BOXES. Each box is for ONE
      sound. A 3-sound word fits in 3 boxes. Let's try with
      CAT." Teacher slowly pronounces: "C-A-T. That's 3 sounds:
      /c/.../a/.../t/. We can put one sound in each box."
      Teacher writes a letter in each box as the sound is said:
      [C] [A] [T]. "Now we can SEE the 3 sounds + HEAR the 3
      sounds." Repeats with DOG → [D] [O] [G]; SUN → [S] [U]
      [N]; PIG → [P] [I] [G]. Pattern emphasis: "Every CVC word
      has 3 SOUNDS. Segmenting means pulling the word APART
      into the 3 sounds. Blending puts them together; segmenting
      pulls them apart. SAME SOUNDS, OPPOSITE DIRECTION."
      Critical pedagogical framing — the reverse-operation
      insight (mirrors Phase 1.2 Slot 4): "Yesterday we BLENDED
      sounds together. Today we're SEGMENTING — pulling words
      APART into separate sounds. Both skills use the same
      3 sounds; the difference is direction."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + Elkonin-box segmentation routine. Each pair
      receives 8 picture cards with CVC vocabulary (cat, dog,
      pig, hen, bat, mat, sun, bus) + Elkonin-box paper strips
      (3 empty boxes per strip). Pair takes turns: kid A names
      a picture (cat); kid B says the word slowly + TAPS each
      box while saying each phoneme ("/c/" tap-box-1; "/a/"
      tap-box-2; "/t/" tap-box-3). Kid B then says how many
      sounds (3). Critical pedagogical technique: SLOW-STRETCHED
      PRONUNCIATION + box-tapping. The box-tap is the
      kinesthetic anchor that makes phoneme-segmentation
      concrete. K-1 kids often segment incorrectly without
      kinesthetic anchoring (saying 2 sounds for cat /c-at/
      or 4 sounds /c-a-t-h/); the box-tap forces exactly 3
      taps for 3 phonemes. Recast errors with re-segmentation
      ("you said /c/.../at/ — that's 2 sounds, but CAT has 3
      boxes. Let's try again, ONE sound per box: /c/.../a/...
      /t/. Three taps for three sounds."). Common error
      patterns: (a) treating consonant blend as one sound
      (BLAST → 4 sounds instead of 5; defer blend-onset
      segmentation to Grade 1); (b) treating long-vowel/silent-
      e words as 4 sounds (CAKE → /c/+/a/+/k/+/e/ — actually
      3 sounds /c/+/a/+/k/ with silent-e; defer to Grade 1
      CVCe work); (c) miscounting due to letter-name confusion
      (saying "C-A-T" letter-names = 3 letter-names but
      phoneme-segmentation requires sound-not-letter-name).
      Optional extension: kid A says a CVC word; kid B
      segments + writes each sound in its Elkonin box (using
      single-letter representation per phoneme). This bridges
      segmentation directly to phonemic encoding (early
      spelling).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: word-guess worksheet (kids
      fill in missing-letter positions of a CVC word given a
      picture — segmentation supports letter-position
      identification). Station 2: matching worksheet (CVC
      picture → 3-box Elkonin representation; kids match
      pictures to the correct number of sound-boxes filled).
      Station 3: picture-sort (kids sort pictures by phoneme
      count — 3-phoneme CVCs vs 4-phoneme words). Station 4:
      word-scramble (kids unscramble CVC words; reinforces
      that each letter-position holds one sound).
  closure:
    durationMinutes: 5
    body: |
      Whole-class STRAND-SAT-CLOSING celebration + segmentation
      quick-recall. Teacher names a CVC word; class shouts the
      3 sounds in order. "Sun!" → /s/-/u/-/n/! "Cat!" →
      /c/-/a/-/t/! "Pig!" → /p/-/i/-/g/! "Bat!" → /b/-/a/-/t/!
      Teacher then makes the STRAND-SAT-CLOSING announcement:
      "Today we CLOSED our phonological-awareness strand! We
      started with rhyme back in Pre-K + Arc 10 (identify-
      rhyming-pairs + produce-rhyming-words), then syllable-
      counting (count-syllables-1-to-3), then phoneme-isolation
      at the first / last / middle positions (isolate-initial/
      final/medial-phoneme), then phoneme-blending (blend-
      phonemes-cvc) + onset-rime blending (blend-onset-rime
      yesterday), and TODAY we finished with phoneme-
      segmentation. 9 of 9 phonological-awareness targets
      DONE — that's the COMPLETE phonological-awareness
      strand for K. ALL the sound-skills before reading: rhyme
      + syllable + phoneme-isolation + phoneme-blending + onset-
      rime + segmentation. Now we have ALL the listening-skills
      we need for reading." Forward-pointer: "Phonological
      awareness is the foundation. Reading sits on top of
      phonological awareness + PHONICS (letter-sound work).
      We've been learning phonics alongside phonological-
      awareness all year — letter-recognition + letter-sounds
      + read-cvc-words. Now those skills can come together.
      Next we'll work on more advanced phonics — reading words
      with CONSONANT BLENDS like 'blast', 'stop', 'fresh'.
      That's our next strand to fill in!"

