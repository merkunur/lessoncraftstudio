assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Find all pairs in a 6-pair (4×3) memory-game grid in 8 of 10
        attempts.
      - Find all pairs in an 8-pair (4×4) memory-game grid in 6 of 10
        attempts.
      - Name each image as flipped in 8 of 10 grid-flips (vocabulary-
        anchor verification).

    Differentiation:
    - Pre-K: 4-pair (4×2) grids; adult-supported play.
    - K: 6-pair (4×3) grids; partner play; 8-pair as challenge.
    - Grade 1+: 8-pair (4×4) grids standard; 10-pair (5×4) as challenge;
      bridge to spot-the-difference + complete-analogy-image-pair
      (cognitive-domain depth).

