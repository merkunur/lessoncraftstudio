# Teaching package — segment CVC words into phonemes (pt sparse-override)
# Arc 19 Phase 1.3 Slot 2 (24th-consecutive arc pt cadence per Arc 7+ convention; pt cadence increments per-arc, not per-package; all 4 Phase 1.3 pt variants share the same Arc-19 cadence anchor). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF01LP06 (consciência fonológica) + EF01LP08 (relação fonema-grafema). STRAND-SAT-CLOSING package: completa phonological-awareness em 9/9 SAT (22º strand de classe-pai SAT). **Phonological-awareness pedagogy is locale-specific — segmentation pedagogy differs structurally: pt-BR uses syllabic-segmentation primarily; phonemic-segmentation introduced later per BR-MEC framework.** §A.13.34 locale-canonical-curriculum-divergence sub-class applies — sparse-override locked per Phase 1.1+1.2 precedent.

targetSlug: segment-cvc-into-phonemes
language: pt

title:
  pt: "Separar Sons — puxando palavras apartes em sons distintos"

description:
  pt: "Pacote de alfabetização para a educação infantil brasileira (5-7 anos) ensinando crianças a SEGMENTAR palavras CVC em fonemas individuais. Operação inversa direta de Phase 1.2 Slot 4 blend-phonemes-cvc síntese: as crianças ouvem 'gato' + a decompõem em /g/ + /a/ + /t/ + /u/. Mais analiticamente exigente das habilidades de phonological-awareness + a ponte canônica para decodificação fônica sistemática via metodologia de Caixa-de-Elkonin (4 caixas para gato; criança bate cada caixa enquanto diz cada fonema). Pacote STRAND-SAT-CLOSING: completa phonological-awareness em 9/9 SAT — alvo canônico final per learning-targets.json linha 41. **22º strand de classe-pai SATISFEITO no catálogo** (avança saturação agregada 21/30 → 22/30 = 73,3% per §A.13.33 metodologia de classe-pai). Momentum de 3-fechamentos-SAT-consecutivos: Phase 1.1 reading-comprehension + Phase 1.2 measurement + Phase 1.3 phonological-awareness = 3 fechamentos SAT em 3 fases consecutivas de Arc 19. Por learning-targets.json linha 41 pré-requisito: blend-phonemes-cvc (Phase 1.2 Slot 4 ✓ filesystem-staged). Por §A.13.30 enquadramento informal K-1: trabalho de segmentação no K é DECOMPOSIÇÃO-DE-SOM CONCRETA via metodologia de Caixa-de-Elkonin — a criança vê caixas vazias desenhadas no papel + bate cada caixa enquanto pronuncia cada fonema da palavra devagar. **NOTA pt-BR ESTRUTURAL CRÍTICA: pt-BR usa segmentação SILÁBICA primariamente per BR-MEC framework. Segmentação FONÊMICA é introduzida posteriormente (tipicamente 1.º-2.º ano EF) após domínio silábico. Este pacote ensina segmentação fonêmica explicitamente como ponte para decodificação fônica + integra abordagem silábica como referência didática.** Alinhamento BNCC: EF01LP06 (consciência fonológica) + EF01LP08 (relação fonema-grafema). 5 exercícios + 8 materiais imprimíveis ao longo de 1 semana."

structure:
  warmup:
    body: |
      Atividade de segmentação com toda a turma + introdução
      Caixa-de-Elkonin. Você desenha caixas vazias no quadro
      lado a lado para uma palavra CV+CV pt-BR de 4 fonemas
      (gato): [ ] [ ] [ ] [ ]. "Essas são CAIXAS DE SOM. Cada
      caixa é para UM som. Uma palavra de 4 sons cabe em 4
      caixas. Vamos tentar com GATO." Você pronuncia
      devagar: "G-A-T-O. Isso são 4 sons: /g/.../a/.../t/.../u/.
      Podemos colocar um som em cada caixa." Você escreve uma
      letra em cada caixa conforme o som é dito: [G] [A] [T]
      [O]. "Agora podemos VER os 4 sons + OUVIR os 4 sons."
      Repete com PATO → [P] [A] [T] [O]; SAPO → [S] [A] [P]
      [O]; MESA → [M] [E] [S] [A]. **Nota didática pt-BR:** em
      pt-BR canônico, palavras CV+CV (paroxítonas) têm 4
      fonemas. Para palavras CVC monossilábicas pt-BR (sol,
      mar, lar — menos frequentes em K-1), use 3 caixas. Ênfase
      do padrão: "Toda palavra tem SONS. Segmentar significa
      puxar a palavra APARTE nos sons. Combinar coloca eles
      juntos; segmentar puxa eles APARTE. MESMOS SONS, DIREÇÃO
      OPOSTA." Enquadramento pedagógico crítico — operação-
      inversa (paraleliza Phase 1.2 Slot 4): "Ontem COMBINAMOS
      sons juntos. Hoje estamos SEGMENTANDO — puxando palavras
      APARTE em sons distintos. Ambas habilidades usam os
      mesmos sons; a diferença é a direção." **Apoio silaba-
      vs-fonema pt-BR: em pt-BR canônico, segmentação silábica
      vem antes: GATO = GA + TO (2 sílabas). Segmentação
      fonêmica é uma camada MAIS PROFUNDA: GA = /g/+/a/ + TO =
      /t/+/u/. Use a ponte: 'Já sabemos que GATO tem 2
      SÍLABAS. Hoje aprenderemos que cada sílaba tem SONS — e
      podemos contar os sons também.'**
  contentActivity:
    body: |
      Trabalho em duplas + rotina de segmentação Caixa-de-
      Elkonin. Cada dupla recebe 8 cartões-de-imagem com
      vocabulário CV+CV pt-BR (gato, pato, peixe, mesa, sapo,
      bola, lua, dado) + tiras de papel com Caixas-de-Elkonin
      (4 caixas vazias por tira para CV+CV; 3 caixas para
      CVC monossilábicas se trabalhar com elas). A dupla se
      reveza: a criança A nomeia uma imagem (gato); a criança
      B diz a palavra devagar + BATE cada caixa enquanto diz
      cada fonema ("/g/" bate-caixa-1; "/a/" bate-caixa-2;
      "/t/" bate-caixa-3; "/u/" bate-caixa-4). A criança B
      então diz quantos sons (4). Técnica pedagógica crítica:
      PRONÚNCIA-LENTA-ALONGADA + batimento-de-caixa. O
      batimento-de-caixa é a âncora cinestésica que torna a
      segmentação-fonêmica concreta. Crianças K-1 pt-BR
      frequentemente segmentam silabicamente em vez de
      fonemicamente (dizendo 2 sons para gato GA-TO em vez
      de 4 sons /g/-/a/-/t/-/u/); o batimento-de-caixa força
      exatamente 4 batidas para 4 fonemas. Recapture erros com
      re-segmentação ("você disse /ga/+/to/ — são 2 PEDAÇOS
      SILÁBICOS, mas GATO tem 4 SONS individuais. Vamos tentar
      de novo, UM SOM por caixa: /g/.../a/.../t/.../u/. Quatro
      batidas para quatro sons."). Padrões comuns de erro: (a)
      segmentar silabicamente em vez de fonemicamente (mais
      comum em pt-BR; reforça com batimento-explícito); (b)
      perder vogal-final-átona (gato → 3 sons em vez de 4
      porque a vogal /u/ final é fonética/reduzida em fala
      rápida; recapture com pronúncia-lenta-citação); (c)
      confusão letra-vs-som (dizer 'G-A-T-O' nomes-de-letra =
      4 nomes mas segmentação fonêmica requer som-não-nome-
      de-letra). Extensão opcional: a criança A diz uma
      palavra CV+CV; a criança B segmenta + escreve cada som
      em sua Caixa-de-Elkonin (usando representação de letra-
      única por fonema). Isso conecta segmentação diretamente
      a codificação fonêmica (alfabetização inicial).
  scaffold:
    body: |
      Rotação por estações. Estação 1: folha word-guess (as
      crianças preenchem posições de letra-faltante de uma
      palavra CVC dada uma imagem — segmentação apoia
      identificação de posição-de-letra). Estação 2: folha
      de emparelhamento (imagem CV+CV → representação Caixa-
      de-Elkonin de 4 caixas; as crianças combinam imagens ao
      número correto de caixas-de-som preenchidas). Estação 3:
      folha picture-sort (as crianças classificam imagens por
      contagem-de-fonema — palavras de 3 fonemas vs palavras
      de 4 fonemas). Estação 4: folha word-scramble (as
      crianças desembaralham palavras CVC; reforça que cada
      posição-de-letra contém um som).
  closure:
    body: |
      Celebração STRAND-SAT-CLOSING + recapitulação rápida
      de segmentação com toda a turma. Você nomeia uma palavra
      CV+CV; a turma grita os sons em ordem. "Gato!" → /g/-/a/-
      /t/-/u/! "Pato!" → /p/-/a/-/t/-/u/! "Mesa!" → /m/-/e/-/s/-
      /a/! "Bola!" → /b/-/o/-/l/-/a/! Você então faz o anúncio
      STRAND-SAT-CLOSING: "Hoje FECHAMOS nosso strand de
      phonological-awareness! Começamos com rima na pré-escola
      + Arc 10 (identify-rhyming-pairs + produce-rhyming-
      words), depois contagem-de-sílabas (count-syllables-1-
      to-3), depois isolamento-de-fonema nas posições primeira
      / última / mediana (isolate-initial/final/medial-
      phoneme), depois combinação-de-fonemas (blend-phonemes-
      cvc) + combinação início-rima (blend-onset-rime ontem),
      e HOJE terminamos com segmentação-de-fonema. 9 de 9
      alvos de phonological-awareness PRONTOS — esse é o
      strand COMPLETO de phonological-awareness para K. TODAS
      as habilidades-de-som antes da leitura: rima + sílaba +
      isolamento-de-fonema + combinação-de-fonemas + início-
      rima + segmentação. Agora temos TODAS as habilidades-de-
      audição que precisamos para a leitura." Aponte adiante:
      "Consciência fonológica é a fundação. A leitura assenta
      em cima da consciência fonológica + FÔNICA (trabalho
      letra-som). Temos aprendido fônica ao longo da
      consciência fonológica o ano todo — reconhecimento-de-
      letra + sons-de-letra + read-cvc-words. Agora essas
      habilidades podem se juntar. A seguir trabalharemos em
      fônica mais avançada — lendo palavras com ENCONTROS
      CONSONANTAIS como 'prato', 'bravo', 'três'. Esse é
      nosso próximo strand para preencher!"

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Segmentar uma palavra CV+CV ouvida em 4 fonemas em 7
        de 10 tentativas.
      - Usar metodologia Caixa-de-Elkonin (uma batida por
        fonema) em 8 de 10 tentativas.
      - Identificar a contagem-de-fonema de uma palavra CV+CV
        ouvida em 7 de 10 tentativas.
      - Combinar uma palavra CV+CV ouvida à sua representação
        Caixa-de-Elkonin de 4 caixas em 7 de 10 tentativas.
      - Escrever cada fonema em sua posição Caixa-de-Elkonin
        (segmentação → codificação ponte) em 5 de 8 tentativas.
      - Distinguir segmentação silábica (2 sílabas) de
        segmentação fonêmica (4 fonemas) para a mesma palavra
        CV+CV em 5 de 10 tentativas (extensão pt-BR canônica).
      - Usar o vocabulário 'segmentar' / 'puxar aparte' /
        'separar sons' / 'caixa de som' / 'fonema' (se
        introduzido formalmente) corretamente em 5 de 10
        tentativas de produção verbal.

    Diferenciação:
    - Pré-escola: foco em rima + sílaba + trabalho de fonema-
      inicial; adiar segmentação fonêmica completa para o K.
    - Educação infantil (5-7 anos): segmentação CVC de 3
      fonemas (palavras monossilábicas pt-BR canônicas) +
      segmentação CV+CV de 4 fonemas (palavras paroxítonas
      pt-BR canônicas) com andaime Caixa-de-Elkonin; adiar
      segmentação de encontro consonantal + de 5+ fonemas
      para o 1.º ano EF.
    - 1.º ano EF: segmentação CVC + CVCC + CCVC completa;
      ponte para segmentação-de-palavra escrita + alfabetização
      inicial (as crianças segmentam DEPOIS codificam cada
      fonema como uma letra).
    - 2.º ano EF em diante: estender para segmentação multi-
      silábica (palavras compostas + palavras de 2 sílabas via
      segmentação-silábica depois segmentação-fonêmica dentro
      de cada sílaba); ponte para decodificação fônica
      sistemática + estratégias de ataque-de-palavra.

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en). Os
    campos materials, composedExercises, curriculumStandards
    e learningObjectives são herdados do package.yaml via
    merge sparse-override e não são repetidos aqui per a
    convenção Arc 7+.

    **NOTA LOCALE-CRÍTICA: estratégia de segmentação pt-BR
    difere ESTRUTURALMENTE do inglês — esta é a divergência
    locale-canônica mais significativa do par segmentação-
    síntese.** Padrões de segmentação em português brasileiro:
    - **Segmentação silábica dominante:** pt-BR tradicionalmente
      ensina segmentação no nível silábico (CV unidades).
      'Gato' = 'ga' + 'to' (2 sílabas), NÃO /g/+/a/+/t/+/u/
      (4 fonemas). Segmentação silábica é a abordagem canônica
      pt-BR per BR-MEC framework + 'método-fônico-silábico'
      brasileiro.
    - **Segmentação fonêmica introduzida posteriormente:** após
      segmentação silábica estabelecida, segmentação fonêmica
      pode ser introduzida como técnica de decodificação
      fônica avançada. Esta é tipicamente pedagogia do 1.º-
      2.º ano EF brasileiro.
    - **Vogal-final-átona:** palavras paroxítonas pt-BR têm
      vogal-final-átona que pode ser perceptualmente reduzida
      em fala rápida (gato pode soar como [gatu] ou [gat]).
      Em pronúncia-lenta-citação (forma de aula), a vogal
      final é audível + segmentável. Crianças K-1 devem
      aprender a segmentar a forma de aula, não a forma rápida.
    - **Caixa-de-Elkonin pt-BR:** a metodologia Caixa-de-
      Elkonin é universal mas o número de caixas varia per
      estrutura silábica. CVC monossilábicas pt-BR (sol, mar)
      = 3 caixas. CV+CV paroxítonas pt-BR (gato, mesa) = 4
      caixas. CV+CV+CV trissilábicas pt-BR (sapato, banana)
      = 6 caixas. Este pacote foca em 3+4 caixas como ponto-
      de-entrada K.

    Vocabulário pt-BR canônico para segmentação K-1:
    - 'segmentar' (to segment) — pt-BR canônico técnico
    - 'separar' (to separate) — pt-BR canônico mais simples
      K-1
    - 'puxar aparte' (to pull apart) — pt-BR canônico
      metafórico
    - 'sons separados' (separate sounds) — pt-BR canônico
    - 'caixa de som' (sound box) — pt-BR canônico pedagógico
      para Caixa-de-Elkonin
    - 'fonema' (phoneme) — técnico pt-BR; introduzido apenas
      quando a turma adquiriu vocabulário formal
    - 'sílaba' (syllable) — fundacional pt-BR (estabelecido
      em count-syllables-1-to-3 Arc 10 P1)
    - 'batida' / 'batimento' (tap / tapping) — pt-BR canônico
      para metodologia cinestésica
    - Frases-modelo K-1: "Gato tem 4 sons: /g/-/a/-/t/-/u/. Uma
      batida para cada som." / "Vamos puxar a palavra aparte:
      g-a-t-o. Quantos sons você ouviu?"

    Particularidade pt-BR para distinção silábica-vs-fonêmica:
    Português-BR K-1 EF integra consciência silábica +
    consciência fonêmica como camadas de profundidade
    crescente: criança primeiro segmenta silabicamente
    (GA-TO = 2 sílabas), depois aprofunda para segmentação
    fonêmica (/g/-/a/-/t/-/u/ = 4 fonemas). Este pacote
    explicita essa progressão pedagogicamente — diferente
    do inglês onde a consciência fonêmica é frequentemente
    o ponto-de-entrada pedagógico canônico.

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF01LP06 ('Segmentar oralmente palavras em sílabas') é o
    anchor BNCC do 1.º ano EF para consciência silábica
    (camada fundacional). EF01LP08 ('Relacionar elementos
    sonoros — sílabas, fonemas, partes de palavras — com sua
    representação escrita') é o anchor BNCC para segmentação
    fonêmica (camada de profundidade adicional) + ponte
    fonema-grafema. EF02LP02 ('Segmentar palavras em sílabas
    e remover e substituir sílabas iniciais, mediais ou
    finais para criar novas palavras') estende para
    manipulação silábica + fonêmica no 2.º ano EF. Juntos,
    EF01LP06 + EF01LP08 + EF02LP02 cobrem a progressão
    segmentação-silábica → segmentação-fonêmica → manipulação
    fonêmica.

    Currículo brasileiro K-1 EF para segmentação:
    A BNCC brasileira EF Língua Portuguesa Anos Iniciais
    coloca a segmentação entre as competências fundacionais
    de alfabetização K-1. O 'método fônico silábico'
    brasileiro enfatiza segmentação silábica primeiro com
    transição gradual para segmentação fonêmica. Este pacote
    alinha com abordagem integrada que respeita a estrutura
    silábica pt-BR enquanto introduz segmentação fonêmica
    como técnica complementar via Caixa-de-Elkonin.

    Por §A.13.30 enquadramento informal K-1: este pacote NÃO
    ensina teoria formal de processamento fonológico
    (decomposição fonêmica em pesquisa de leitura;
    metodologia de Elkonin em pesquisa pedagógica avançada
    são trabalho de pesquisa pós-graduada). A ênfase do K-1
    é DECOMPOSIÇÃO-DE-SOM CONCRETA via metodologia Caixa-
    de-Elkonin acessível.

    Pacote STRAND-SAT-CLOSING: SAT-fecha o strand
    phonological-awareness em 9/9 — o 22º strand de classe-
    pai SAT no catálogo. Pair-coherent com Phase 1.3 Slot 1
    blend-onset-rime. Cluster de phonological-awareness
    completo (7 pacotes Phase 1.1-1.3 + 2 pré-existentes =
    9-pacote cluster) — CANDIDATO para Arc 19 P2 close-out
    NEW phonological-awareness-bundle creation per §A.13.38.

    **§A.13.34 sub-class adjudication — locale-canonical-
    curriculum-divergence:**
    Phonological-awareness pedagogy has structural divergence
    between English + pt-BR (English consonant-final-dominance
    rhyme + CVC phoneme inventory vs pt-BR vowel-ending-
    dominance + nasal-vowel rhyme + 7 oral + 5 nasal vowel
    phonemes). **For segmentation pedagogy specifically the
    divergence is most pedagogically significant: pt-BR is
    syllabic-segmentation-dominant per BR-MEC framework vs
    English phonemic-segmentation-dominant. Same skill
    (decomposing sounds) operates on DIFFERENT-SIZED units
    (syllables vs phonemes).** This is a canonical §A.13.34
    locale-canonical-curriculum-divergence case. SPARSE-
    OVERRIDE locked for current commission per minimal-
    amendment principle (structure body + assessmentCriteria
    + compositionalRationale.pt carry pt-BR-specific
    pedagogical content including syllable-segmentation +
    phoneme-segmentation integration approach + 4-box
    Elkonin for CV+CV paroxytones; materials +
    composedExercises pedagogically translate cleanly across
    locale-divergence at the mechanic level). **FULL-OVERRIDE
    strongly flagged as future-arc candidate** when post-Arc-
    19 dedicated pt-BR-syllable-pedagogy commission justifies
    full re-authoring of materials + composedExercises against
    pt-BR syllable-segmentation canonical pedagogy.

    Per §A.13.36 cadência de cooperação CC↔assistant: o
    pacote pt herda materials, composedExercises,
    curriculumStandards via sparse-override per convenção
    Arc 7+; quaisquer emendas en (se Round 2 surgir) se
    propagam automaticamente para esta variante pt.
