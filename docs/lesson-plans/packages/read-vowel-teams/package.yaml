# Teaching package — read vowel-team words
# Arc 19 Phase 1.4 (early-literacy / phonics-decoding strand-advancement 3 → 4).
# Builds on Arc 12 read-cvc-words + Arc 13 read-cvce-words foundation.
# Resolves the long-vowel forward-pointer chain at the canonical
# vowel-team layer.

targetSlug: read-vowel-teams
language: en
title:
  en: "Vowel Teams — read rain, see, boat, day, light"
description:
  en: "Grade 1 / Grade 2 early-literacy package teaching kids to read words with common vowel teams. Builds on Arc 12 read-cvc-words + Arc 13 read-cvce-words foundation. Vowel teams are two-letter vowel combinations that work together to make one long-vowel sound: ai (rain), ay (day), ee (see), ea (eat), oa (boat), ow (snow), ie (pie), igh (light). When kids see two vowels side-by-side, they learn 'when two vowels go walking, the first one does the talking' — the team makes the first vowel's long sound. Critical phonics-decoding bridge from single-vowel + silent-e patterns to multi-letter vowel patterns; opens the door to 70% of Tier-1 reading vocabulary. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook: the vowel-team rule. Teacher writes "rain"
      on the board + sounds it out: "r-ai-n. The 'a' and 'i' work
      together — they make ONE long-A sound. Rain. Train. Brain."
      Class repeats. Teacher introduces the saying: "When two vowels
      go walking, the first one does the talking." Repeat with: "see"
      (ee → long E); "boat" (oa → long O); "day" (ay → long A);
      "light" (igh → long I). Anchor words establish memorable
      handles for each team.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sound-out routine. Each pair receives 8 picture
      cards with vowel-team labels (rain, train, see, tree, boat,
      goat, day, hay). Pair takes turns: kid A points to a card; kid
      B sounds out the word using the vowel-team rule ("r-ai-n... I
      see 'ai', so it makes long A... rain!"). Recast errors with
      sound-stretching ("you said 'rin' for 'rain' — let's look at
      the vowels: a-i. Two vowels walking. The first one talks. So
      what sound does A make when it's walking with I? Long A. /ay/.
      Rain.") Optional extension: kids use letter-cut-outs to BUILD
      vowel-team words.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (vowel-team
      word to picture). Station 2: word-guess (kids fill in
      missing vowel-team letters from picture clues — r__n = rain;
      tr__ = tree; b__t = boat). Station 3: word-scramble (rearrange
      letters to form vowel-team words). Station 4: vocabulary-
      tracing-strips for vowel-team anchor words.
  closure:
    durationMinutes: 5
    body: |
      Whole-class vowel-team review. Teacher writes 5 vowel-team
      words; class reads each by spotting the team + saying the long
      sound. Forward-pointer: "Today we read vowel-team words. When
      we come back to reading next, we'll read words with R-CONTROLLED
      vowels — 'car', 'bird', 'horn' — where the letter R changes
      how the vowel sounds altogether."

