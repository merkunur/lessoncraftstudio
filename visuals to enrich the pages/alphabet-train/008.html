<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Alphabet-Zug Arbeitsbl&auml;tter - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #E3F2FD 0%, #BBDEFB 30%, #90CAF9 60%, #64B5F6 100%); overflow: hidden;">

        <!-- Cloud shapes -->
        <div style="position: absolute; top: 30px; left: 100px; width: 130px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 30px; filter: blur(2px);"></div>
        <div style="position: absolute; top: 15px; left: 140px; width: 80px; height: 55px; background: rgba(255,255,255,0.85); border-radius: 30px; filter: blur(2px);"></div>
        <div style="position: absolute; top: 55px; right: 120px; width: 110px; height: 40px; background: rgba(255,255,255,0.7); border-radius: 25px; filter: blur(2px);"></div>
        <div style="position: absolute; top: 40px; right: 150px; width: 70px; height: 45px; background: rgba(255,255,255,0.75); border-radius: 25px; filter: blur(2px);"></div>

        <!-- Mountain silhouettes (back) -->
        <div style="position: absolute; bottom: 0; left: -50px; width: 0; height: 0; border-left: 350px solid transparent; border-right: 350px solid transparent; border-bottom: 550px solid #90A4AE; opacity: 0.3;"></div>
        <div style="position: absolute; bottom: 0; right: -80px; width: 0; height: 0; border-left: 400px solid transparent; border-right: 300px solid transparent; border-bottom: 650px solid #78909C; opacity: 0.25;"></div>

        <!-- Mountain silhouettes (front) -->
        <div style="position: absolute; bottom: 0; left: 150px; width: 0; height: 0; border-left: 300px solid transparent; border-right: 300px solid transparent; border-bottom: 500px solid #B0BEC5; opacity: 0.35;"></div>
        <div style="position: absolute; bottom: 0; right: 50px; width: 0; height: 0; border-left: 250px solid transparent; border-right: 250px solid transparent; border-bottom: 420px solid #CFD8DC; opacity: 0.3;"></div>

        <!-- Snow cap on tallest mountain -->
        <div style="position: absolute; bottom: 600px; right: -15px; width: 0; height: 0; border-left: 55px solid transparent; border-right: 55px solid transparent; border-bottom: 50px solid rgba(255,255,255,0.7);"></div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 28px; right: 35px; z-index: 100;">
            <div style="width: 90px; height: 90px; background: linear-gradient(145deg, #FF7043 0%, #E64A19 100%); border-radius: 50%; box-shadow: 0 6px 22px rgba(230,74,25,0.4); display: flex; align-items: center; justify-content: center; transform: rotate(8deg); border: 4px solid rgba(255,255,255,0.8);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">GRATIS</span>
            </div>
        </div>

        <!-- Header -->
        <div style="position: absolute; top: 25px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 46px; color: #1A237E; margin: 0; text-shadow: 2px 2px 0 rgba(255,255,255,0.7);">F&uuml;r jedes Lernniveau</h1>
            <h2 style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 22px; color: #546E7A; margin: 6px 0 0 0;">Alphabet-Zug &bull; Vorschule</h2>
        </div>

        <!-- Diagonal climbing track -->
        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10;">
            <!-- Track line (diagonal dashed) -->
            <svg width="1000" height="1000" viewBox="0 0 1000 1000" style="position: absolute; inset: 0;">
                <line x1="80" y1="780" x2="920" y2="200" stroke="#5D4037" stroke-width="8" stroke-dasharray="30,15" opacity="0.5"/>
                <line x1="80" y1="790" x2="920" y2="210" stroke="#4E342E" stroke-width="4" opacity="0.3"/>
            </svg>
        </div>

        <!-- Station 1: LEICHT (Valley - bottom-left) -->
        <div style="position: absolute; bottom: 130px; left: 40px; z-index: 20;">
            <!-- Station platform -->
            <div style="background: white; border-radius: 14px; padding: 10px; box-shadow: 0 10px 35px rgba(0,0,0,0.2); border: 4px solid #4CAF50;">
                <img src="https://www.lessoncraftstudio.com/samples/german/alphabet%20train/sample-1.jpeg" style="width: 230px; height: 178px; object-fit: cover; border-radius: 8px;" alt="Leicht Arbeitsblatt">
            </div>
            <!-- Station label -->
            <div style="position: absolute; top: -18px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #4CAF50, #388E3C); padding: 8px 24px; border-radius: 22px; box-shadow: 0 4px 14px rgba(76,175,80,0.4); white-space: nowrap;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white; letter-spacing: 2px;">LEICHT</span>
            </div>
            <!-- Description -->
            <div style="text-align: center; margin-top: 8px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #2E7D32; background: rgba(76,175,80,0.12); padding: 4px 14px; border-radius: 12px;">Viele Hinweise</span>
            </div>
            <!-- Station marker -->
            <div style="position: absolute; top: -40px; right: -10px; width: 30px; height: 30px; background: #4CAF50; border-radius: 50%; border: 3px solid white; box-shadow: 0 3px 10px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white;">1</span>
            </div>
        </div>

        <!-- Station 2: MITTEL (Mid-mountain - center) -->
        <div style="position: absolute; top: 330px; left: 50%; transform: translateX(-50%); z-index: 20;">
            <!-- Station platform -->
            <div style="background: white; border-radius: 14px; padding: 10px; box-shadow: 0 10px 35px rgba(0,0,0,0.2); border: 4px solid #FF9800;">
                <img src="https://www.lessoncraftstudio.com/samples/german/alphabet%20train/sample-3.jpeg" style="width: 230px; height: 178px; object-fit: cover; border-radius: 8px;" alt="Mittel Arbeitsblatt">
            </div>
            <!-- Station label -->
            <div style="position: absolute; top: -18px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #FF9800, #F57C00); padding: 8px 24px; border-radius: 22px; box-shadow: 0 4px 14px rgba(255,152,0,0.4); white-space: nowrap;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white; letter-spacing: 2px;">MITTEL</span>
            </div>
            <!-- Description -->
            <div style="text-align: center; margin-top: 8px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #E65100; background: rgba(255,152,0,0.12); padding: 4px 14px; border-radius: 12px;">Ausgewogen</span>
            </div>
            <!-- Station marker -->
            <div style="position: absolute; top: -40px; right: -10px; width: 30px; height: 30px; background: #FF9800; border-radius: 50%; border: 3px solid white; box-shadow: 0 3px 10px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white;">2</span>
            </div>
        </div>

        <!-- Station 3: KNIFFLIG (Summit - top-right) -->
        <div style="position: absolute; top: 115px; right: 40px; z-index: 20;">
            <!-- Station platform -->
            <div style="background: white; border-radius: 14px; padding: 10px; box-shadow: 0 10px 35px rgba(0,0,0,0.2); border: 4px solid #F44336;">
                <img src="https://www.lessoncraftstudio.com/samples/german/alphabet%20train/sample-5.jpeg" style="width: 230px; height: 178px; object-fit: cover; border-radius: 8px;" alt="Knifflig Arbeitsblatt">
            </div>
            <!-- Station label -->
            <div style="position: absolute; top: -18px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #F44336, #D32F2F); padding: 8px 24px; border-radius: 22px; box-shadow: 0 4px 14px rgba(244,67,54,0.4); white-space: nowrap;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white; letter-spacing: 2px;">KNIFFLIG</span>
            </div>
            <!-- Description -->
            <div style="text-align: center; margin-top: 8px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #C62828; background: rgba(244,67,54,0.12); padding: 4px 14px; border-radius: 12px;">Selbstst&auml;ndig</span>
            </div>
            <!-- Goal flag at summit -->
            <div style="position: absolute; top: -50px; right: 10px;">
                <div style="width: 4px; height: 40px; background: #F44336;"></div>
                <div style="position: absolute; top: 0; left: 4px; width: 28px; height: 18px; background: linear-gradient(180deg, #F44336, #D32F2F); border-radius: 0 4px 4px 0;"></div>
            </div>
        </div>

        <!-- Bottom Legend -->
        <div style="position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; align-items: center; background: rgba(255,255,255,0.9); padding: 14px 30px; border-radius: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); z-index: 30;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 16px; height: 16px; background: #4CAF50; border-radius: 50%;"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #2E7D32;">Leicht</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 16px; height: 16px; background: #FF9800; border-radius: 50%;"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #E65100;">Mittel</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 16px; height: 16px; background: #F44336; border-radius: 50%;"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #C62828;">Knifflig</span>
            </div>
        </div>

        <!-- Small train on tracks -->
        <div style="position: absolute; bottom: 260px; left: 310px; z-index: 15; transform: rotate(-30deg);">
            <!-- Locomotive body -->
            <div style="width: 50px; height: 30px; background: linear-gradient(180deg, #F44336, #D32F2F); border-radius: 6px 12px 4px 4px; position: relative;">
                <!-- Smokestack -->
                <div style="position: absolute; top: -12px; left: 8px; width: 10px; height: 14px; background: #424242; border-radius: 3px 3px 0 0;"></div>
                <!-- Window -->
                <div style="position: absolute; top: 4px; right: 6px; width: 14px; height: 12px; background: #BBDEFB; border-radius: 3px; border: 2px solid #B71C1C;"></div>
                <!-- Wheels -->
                <div style="position: absolute; bottom: -6px; left: 6px; width: 12px; height: 12px; background: #424242; border-radius: 50%; border: 2px solid #757575;"></div>
                <div style="position: absolute; bottom: -6px; right: 6px; width: 12px; height: 12px; background: #424242; border-radius: 50%; border: 2px solid #757575;"></div>
            </div>
        </div>

    </div>
</body>
</html>
