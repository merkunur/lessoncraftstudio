thematicCoherence:
  en: |
    All 4 packages cohere around the breakfast theme + form a
    cross-strand progression from vocabulary through counting +
    comparison to category sorting.

    **Pedagogical sequencing:**
    1. **identify-and-name-foods** — Foundational food vocabulary
       (pancakes, cereal, eggs, toast, fruit, milk, juice).
       Breakfast-specific subset of broader food vocabulary. NEW
       cross-bundle anchor for daily-life food contexts (foods-
       bundle would be broader; this anchors at meal-context).
    2. **count-objects-1-to-10** — Counting practice using
       breakfast items as countable subjects (5 pancakes; 2 eggs;
       3 strawberries; 8 cheerios). Same shared package with
       fruits-bundle + flowers-bundle + insects-bundle + ocean-
       life-bundle.
    3. **compare-quantities-more-fewer** — Comparison work using
       breakfast contexts ("more pancakes than waffles?"; "fewer
       eggs than slices of toast?"). Connects counting to
       comparison vocabulary in concrete daily-life context.
    4. **sort-by-category** — Category-classification work
       distinguishing breakfast foods from lunch + dinner foods
       (cereal vs spaghetti vs steak). Connects breakfast-specific
       vocabulary to broader meal-categorization.

    **Strand spread:** 1 vocabulary-acquisition (foods) + 1
    numeracy + 1 comparison + 1 cognitive-sorting (category).
    4 distinct strands; cross-strand pattern parallel to fruits-
    bundle + flowers-bundle precedent.

    **Suggested unit duration:** 4 weeks (1 package per week).
    Morning-routine + family-meal extensions natural fit.

    **Multilingual classroom relevance:** breakfast vocabulary
    moderate-cognate Romance (desayuno / petit-déjeuner / colazione)
    + Germanic distinct (Frühstück / ontbijt / frukost). Specific
    food vocabulary (pancake / panqueque / crêpe / Pfannkuchen)
    varies. Universal daily-life relevance — breakfast routine
    shared across cultures with locale-specific food choices.

    **Pillar 2 architectural pattern:** breakfast-bundle exemplifies
    daily-life cross-strand bundle composition. Theme-axis-key
    daily-life-narrow (breakfast as meal-context vs broader food)
    — meal-specific anchor enables routine-relevant classroom
    delivery. Companion bundles (lunch-bundle + dinner-bundle
    candidates for future Arcs) would parallel this pattern.
    First daily-life-meal-themed bundle on the platform; precedent
    for similar contexts (snack, dessert, drinks, etc.).
