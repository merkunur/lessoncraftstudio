# Teaching package — tell time to the quarter-hour
# Arc 18 Phase 1.1 (math / measurement strand — completes tell-time canonical triple at 3/3 SAT). Extends Arc 17 P1.4 pair (tell-time-to-the-hour + tell-time-to-half-hour) to quarter-hour reading. Pair-coherent ship pattern with Arc 17 P1.4 on materials-list shape (clock-mat at position 3); canonical-correct on manipulative-cut-outs `mode: variety` (divergence-ratified from Arc 17 P1.4 data debt).

targetSlug: tell-time-to-quarter-hour
language: en
title:
  en: "Tell Time to the Quarter-Hour — when the minute hand points to 3 or 9"

description:
  en: "Grade 2 math/measurement package completing the canonical tell-time triple (3/3 SAT in the measurement strand's tell-time sub-track) by teaching quarter-hour reading on analog clocks. After the Arc 17 P1.4 pair (tell-time-to-the-hour at 1:00 + tell-time-to-half-hour at 1:30), this package adds the QUARTER-HOUR positions: 1:15 (QUARTER PAST 1 — minute hand pointing straight right at 3) + 1:45 (QUARTER TO 2 — minute hand pointing straight left at 9). The minute hand's position around the clock face encodes the partition into 4 equal quarters: 12 (full hour, 0 minutes), 3 (quarter past, 15 minutes), 6 (half past, 30 minutes), 9 (quarter to, 45 minutes). At quarter-past, the hour hand sits between the named hour and the next; at quarter-to, the hour hand sits closer to the next hour than to the named one. CCSS.2.MD.C.7 primary anchor ('tell and write time from analog and digital clocks to the nearest five minutes, using a.m. and p.m.' — quarter-hour precision is the canonical Grade 2 entry point). Parallel to Arc 15 Phase 1 read-time-on-analog-clock per the same measurement-strand vs time-and-routine-strand framing distinction documented in tell-time-to-the-hour (Arc 17 P1.4 Slot 1). Together with the Arc 17 P1.4 pair, this package completes the canonical measurement-strand tell-time triple 3/3 SAT. 5 worksheet exercises + 7 printable materials over a 1-week unit. NOTE: This package internally diverges from the Arc 17 P1.4 pair on manipulative-cut-outs mode dimension — Arc 17 P1.4 ships `mode: clock-pieces` (non-canonical, pre-§A.13.35-correction data debt); Phase 1.1 ships canonical-correct `mode: variety` with vocabKey enumeration per operator adjudication at Arc 18 Phase 0 §A.13.6 firings batch. Pair-coherence preserved on materials-list shape (clock-mat at position 3); divergence-ratified on cut-outs mode."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + quarter-hour position introduction.
      Teacher displays a large analog clock + reviews the
      hour + half-hour work from the prior tell-time pair:
      "When the minute hand points STRAIGHT UP to 12, the
      time is exactly the hour — three o'clock. When it
      points STRAIGHT DOWN to 6, the time is half-past —
      three thirty." Then the new content: "Today we meet
      the OTHER two positions where the minute hand points
      to a special place. When it points STRAIGHT RIGHT to
      3, we say QUARTER PAST. When it points STRAIGHT LEFT
      to 9, we say QUARTER TO the next hour." Teacher
      demonstrates 4:15 (hour hand just past 4; minute hand
      at 3 — "quarter past 4 — fifteen minutes after 4");
      7:45 (hour hand close to 8; minute hand at 9 —
      "quarter to 8 — fifteen minutes before 8"); 2:15
      ("quarter past 2"); 10:45 ("quarter to 11"). Pattern
      emphasis: "The clock face has FOUR special positions —
      12 for the hour, 3 for quarter-past, 6 for half-past,
      9 for quarter-to. The minute hand visits these four
      positions as the hour goes by." Teacher writes digital
      forms: 4:15, 7:45, 2:15, 10:45. "Quarter-past means
      :15 in digital form. Quarter-to means :45 in digital
      form."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + quarter-hour clock-reading routine with
      movable-hand paper clocks. Each pair receives the
      same movable-hand clock-mat material as the Arc 17
      P1.4 pair + a set of 8 quarter-hour time cards
      (2:15, 5:15, 8:15, 11:15, 1:45, 4:45, 7:45, 10:45).
      Pair takes turns: kid A draws a quarter-time card
      (e.g., 5:15); kid B sets the paper clock — for
      quarter-past, minute hand straight right to 3, hour
      hand just past 5; for quarter-to, minute hand
      straight left to 9, hour hand close to the NEXT hour
      (so 5:45 has hour hand close to 6). Kid A verifies
      the placement. Then swap. Recast the quarter-to
      catch with the next-hour-cue ("7:45 means almost 8 —
      the hour hand has moved MOSTLY past 7, getting close
      to 8. The minute hand at 9 means the 8 is coming
      soon."). The two quarter-positions (past vs to) are
      the load-bearing visual distinction — kids who
      conflate them get systematically wrong answers. Free
      time at end: kids mix all four hour-positions (full,
      quarter-past, half, quarter-to) on the movable clock
      + name aloud what they set.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity — match
      each analog clock face (drawn at quarter-hour
      positions) to its digital time (e.g., 1:15 — 4:45 —
      9:15 — 11:45). Station 2: chart-count activity —
      count through hour + quarter-hour positions in
      sequence (1:00, 1:15, 1:30, 1:45, 2:00, 2:15...).
      Station 3: math-puzzle (set the clock to a given
      quarter-hour time: missing-element prompt). Station
      4: mixed full/quarter-past/half/quarter-to matching
      (kids must distinguish all four positions based on
      minute-hand placement). The mixed-positions matching
      at station 4 is the load-bearing diagnostic — by this
      point kids should fluently read all four canonical
      positions.
  closure:
    durationMinutes: 5
    body: |
      Whole-class quarter-hour quick-recall. Teacher
      displays 6 clock faces (mix of all four positions);
      class chorally reads each. "Three o'clock! Quarter
      past 5! Half-past 8! Quarter to 11! Two o'clock!
      Quarter past 9!" Forward-pointer: "Today we completed
      the four CANONICAL quarter positions on the clock —
      o'clock (12), quarter-past (3), half-past (6),
      quarter-to (9). With these four positions, you can
      read MOST of the times you see in daily life. Next
      we'll learn the IN-BETWEEN times — every five minutes
      around the clock (1:10, 1:20, 1:25, etc.) — and AM
      vs PM, and ELAPSED TIME (how many hours pass between
      two times). Reading time keeps getting more precise."

