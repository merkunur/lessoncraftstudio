<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fraction Kitchen — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/fraction-kitchen.js?v=6"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=sv  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1 / ?embed=compact
    // Tool-specific deep links: ?food=pizza|bar|cake  ?n=2|3|4|6|8
    // (Free resolves ONLY pizza halves/fourths — a deep link cannot
    //  leak a premium food or denominator; the menu is structural.)
    LCS.mount(FractionKitchen, { mount: '#lcs-root' });
  </script>
</body>
</html>
