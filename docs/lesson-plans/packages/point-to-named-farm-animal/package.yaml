# Teaching package — point to a named farm animal (receptive)
# Arc 5 Phase 3 (early-literacy / vocabulary-acquisition strand). Receptive
# variant of identify-and-name-10-farm-animals (Arc 1 productive package).
# 10-key cluster CLEAN against IMAGE_VOCABULARY (cow/pig/sheep/horse/chicken/
# duck/goat/rabbit/donkey/dog). Same receptive-pairing pattern as point-to-
# named-body-part (Phase 3 companion).

targetSlug: point-to-named-farm-animal
language: en
title:
  en: "Farm Animals (Receptive) — point to the named farm animal"
description:
  en: "Pre-K to K vocabulary-acquisition package teaching receptive recognition of 10 common farm animals: cow, pig, sheep, horse, chicken, duck, goat, rabbit, donkey, dog. Receptive variant of identify-and-name-10-farm-animals (Arc 1 productive). Receptive comprehension precedes productive use in K-3 multilingual classrooms. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher places 10 large farm-animal
      picture-cards on the carpet or board. Names each animal in target
      language; class points to the matching card chorally. Faster pace
      after kids establish recognition. Optional: animal-sound game
      ("the animal that goes 'moo' is the {cow}") — bridges
      receptive recognition with sensory anchors.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with picture cards. Teacher names a farm animal
      in target language; class points to the matching picture-card. Pair
      work: kid A names a farm animal; kid B points to it on a farm-scene
      poster (or picture-card set). Recast errors gently — receptive
      packages emphasize correct understanding over correct production.
      Optional extension: "Touch your nose if the next animal is a
      mammal" (game-based receptive variation that mixes vocabulary
      recognition with simple classification).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (image-name matching
      reinforces farm-animal-image to farm-animal-word; receptive surface).
      Station 2: shadow-match worksheet (animal silhouette to animal —
      pure visual recognition + receptive vocabulary). Station 3:
      manipulative cut-outs counting (kids count out specific named
      animals: "Show me 3 cows; show me 2 ducks"). Receptive surface;
      no production required.
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names farm animals rapidly; kids
      point to the matching card on the carpet. Forward-pointer: "Today
      we practiced understanding farm-animal words. When we come back to
      farm animals next, we'll start saying the words ourselves —
      moving from 'pointing' to 'naming'."

