# Teaching package — use position vocabulary (in / on / under / next-to)
# Arc 5 Phase 2 (fine-motor-and-visual-spatial / spatial-reasoning strand).
# First fine-motor-and-visual-spatial domain validation per §A.14 scaling-
# checkpoint discipline. Abstract concept (prepositions); image-vocabulary
# supports rendering object-in-position scenes via existing prepositions
# app integration. Substrate-clean: composes against existing image-library
# breadth + the prepositions app's mechanical action (item-anchor scene
# rendering).

targetSlug: use-position-vocabulary
language: en
title:
  en: "Position Vocabulary — using in, on, under, next to, behind, between"
description:
  en: "Kindergarten-Grade 1 spatial-reasoning package teaching the use of position prepositions: in, on, under, next-to, behind, between, above, in-front-of. Bridges from spatial perception to spatial language. Composed against the prepositions app's item-anchor scene rendering plus matching + sentence-strip materials. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher uses a real classroom object
      (a small toy or an apple); positions it in different spots while
      naming the position in target language: "The apple is IN the box.
      The apple is ON the table. The apple is UNDER the chair. The apple
      is NEXT TO the book." Class repeats each sentence chorally + does
      the matching gesture (hand over an imaginary box for "in"; flat
      hand for "on"; below the desk for "under"; arm sideways for
      "next to"). Pin position-words to the spatial-reasoning area of the
      math-language word wall.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("The {item} is {position}
      the {anchor}"). Class reads chorally + acts out each strip with their
      own bodies (kids stand IN, ON, UNDER, NEXT-TO classroom items). Pair
      work: kid A places a small object in a position; kid B describes the
      position aloud using the target preposition. Recast errors. Optional
      extension: simon-says-style game where teacher names a position and
      kids put their hands or bodies in that position relative to a desk
      or book.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: prepositions worksheet (kids fill in or
      multiple-choice the correct preposition for each item-anchor scene
      shown). Station 2: matching worksheet (preposition word matched to
      its visual representation — "in" matched to a "ball-in-box" scene).
      Station 3: manipulative cut-outs spatial play (kids physically place
      cut-out animals in / on / under / next-to a cut-out house, then
      describe their work to a partner).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher shows a position-scene picture;
      kids respond chorally with the preposition. Forward-pointer: "Today
      we learned 4-6 position words. When we come back to spatial words
      next, we'll talk about directions — left, right, up, down — and
      use them to navigate around the classroom."

