<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Subtraktion Arbeitsbl&auml;tter - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: #F0F9FF; overflow: hidden;">

        <!-- Top accent bar - arctic gradient -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #0277BD, #00838F, #80DEEA, #00838F, #0277BD);"></div>

        <!-- Subtle hexagonal dot pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image: radial-gradient(circle, #01579B 1.2px, transparent 1.2px); background-size: 32px 32px;"></div>

        <!-- Title Section -->
        <div style="position: absolute; top: 30px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #01579B; margin: 0; letter-spacing: 3px;">4 AUFGABENTYPEN</h1>
            <div style="margin-top: 6px;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 22px; color: #00838F;">Ein vielseitiges Paket</span>
            </div>
            <!-- Teal divider -->
            <div style="width: 180px; height: 3px; background: linear-gradient(90deg, transparent, #0277BD, #80DEEA, #0277BD, transparent); margin: 12px auto 0 auto; border-radius: 2px;"></div>
        </div>

        <!-- 4 Feature Cards Grid -->
        <div style="position: absolute; top: 155px; left: 50%; transform: translateX(-50%); width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 22px;">

            <!-- Card 1: Durchstreich-Modus -->
            <div style="background: white; border-radius: 18px; padding: 26px; box-shadow: 0 6px 24px rgba(2,119,189,0.12); border: 3px solid #0277BD; position: relative; overflow: hidden;">
                <!-- Color accent stripe -->
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #0277BD, #039BE5);"></div>
                <div style="display: flex; align-items: flex-start; gap: 18px;">
                    <!-- Icon circle -->
                    <div style="width: 58px; height: 58px; min-width: 58px; background: linear-gradient(145deg, #0277BD, #039BE5); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(2,119,189,0.35);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white;">X</span>
                    </div>
                    <div>
                        <h3 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #0277BD; margin: 0;">Durchstreichen</h3>
                        <p style="font-family: 'Nunito', sans-serif; font-weight: 400; font-size: 15px; color: #546E7A; margin: 6px 0 0 0; line-height: 1.3;">Bilder durchstreichen und abziehen</p>
                    </div>
                </div>
                <!-- Mini worksheet preview -->
                <div style="margin-top: 14px; display: flex; justify-content: center;">
                    <div style="width: 130px; height: 168px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 2px solid #E0F7FA;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Durchstreichen Arbeitsblatt">
                    </div>
                </div>
            </div>

            <!-- Card 2: Bild-Zahl-Modus -->
            <div style="background: white; border-radius: 18px; padding: 26px; box-shadow: 0 6px 24px rgba(0,105,92,0.12); border: 3px solid #00695C; position: relative; overflow: hidden;">
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #00695C, #00897B);"></div>
                <div style="display: flex; align-items: flex-start; gap: 18px;">
                    <div style="width: 58px; height: 58px; min-width: 58px; background: linear-gradient(145deg, #00695C, #00897B); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,105,92,0.35);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white;">#</span>
                    </div>
                    <div>
                        <h3 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #00695C; margin: 0;">Bild &amp; Zahl</h3>
                        <p style="font-family: 'Nunito', sans-serif; font-weight: 400; font-size: 15px; color: #546E7A; margin: 6px 0 0 0; line-height: 1.3;">Bilder z&auml;hlen, Ergebnis schreiben</p>
                    </div>
                </div>
                <div style="margin-top: 14px; display: flex; justify-content: center;">
                    <div style="width: 130px; height: 168px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 2px solid #E0F2F1;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bild und Zahl Arbeitsblatt">
                    </div>
                </div>
            </div>

            <!-- Card 3: Subtrahend finden -->
            <div style="background: white; border-radius: 18px; padding: 26px; box-shadow: 0 6px 24px rgba(106,27,154,0.12); border: 3px solid #6A1B9A; position: relative; overflow: hidden;">
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #6A1B9A, #8E24AA);"></div>
                <div style="display: flex; align-items: flex-start; gap: 18px;">
                    <div style="width: 58px; height: 58px; min-width: 58px; background: linear-gradient(145deg, #6A1B9A, #8E24AA); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(106,27,154,0.35);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white;">?</span>
                    </div>
                    <div>
                        <h3 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #6A1B9A; margin: 0;">Subtrahend finden</h3>
                        <p style="font-family: 'Nunito', sans-serif; font-weight: 400; font-size: 15px; color: #546E7A; margin: 6px 0 0 0; line-height: 1.3;">Fehlende Zahl erg&auml;nzen</p>
                    </div>
                </div>
                <div style="margin-top: 14px; display: flex; justify-content: center;">
                    <div style="width: 130px; height: 168px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 2px solid #F3E5F5;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Subtrahend finden Arbeitsblatt">
                    </div>
                </div>
            </div>

            <!-- Card 4: Gemischter Modus -->
            <div style="background: white; border-radius: 18px; padding: 26px; box-shadow: 0 6px 24px rgba(191,54,12,0.12); border: 3px solid #BF360C; position: relative; overflow: hidden;">
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #BF360C, #E64A19);"></div>
                <div style="display: flex; align-items: flex-start; gap: 18px;">
                    <div style="width: 58px; height: 58px; min-width: 58px; background: linear-gradient(145deg, #BF360C, #E64A19); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(191,54,12,0.35);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white;">M</span>
                    </div>
                    <div>
                        <h3 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #BF360C; margin: 0;">Gemischt</h3>
                        <p style="font-family: 'Nunito', sans-serif; font-weight: 400; font-size: 15px; color: #546E7A; margin: 6px 0 0 0; line-height: 1.3;">Alle Aufgabentypen kombiniert</p>
                    </div>
                </div>
                <div style="margin-top: 14px; display: flex; justify-content: center;">
                    <div style="width: 130px; height: 168px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 2px solid #FBE9E7;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-4.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Gemischtes Arbeitsblatt">
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom accent bar -->
        <div style="position: absolute; bottom: 95px; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent 5%, #0277BD 20%, #00838F 50%, #0277BD 80%, transparent 95%); opacity: 0.3;"></div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;">
            <div style="background: white; padding: 11px 18px; border-radius: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #0277BD;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #0277BD;">L&ouml;sungen inklusive</span>
            </div>
            <div style="background: white; padding: 11px 18px; border-radius: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #00838F;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #00838F;">Zahlenraum 1-20</span>
            </div>
            <div style="background: white; padding: 11px 18px; border-radius: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #01579B;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #01579B;">Sofort einsetzbar</span>
            </div>
        </div>

    </div>
</body>
</html>
