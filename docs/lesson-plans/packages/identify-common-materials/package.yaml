compositionalRationale:
  en: |
    Primary strand: world-knowledge / materials-and-
    properties (identify common materials — STRAND-OPENER
    0/2 → 1/2 ZERO-COVERAGE strand opens). Secondary
    strand: vocabulary-acquisition (material-vocabulary:
    wood, plastic, metal, paper, fabric, glass).
    Tertiary strand: scientific-reasoning + classification
    (kids classify objects by the material they are made
    of; foundation for materials-property reasoning).

    Architectural significance: OPENS the world-knowledge
    / materials-and-properties strand. Per learning-
    targets.json the strand has 2 canonical targets;
    current state is 0/2 (ZERO-COVERAGE; the strand has
    been entirely unaddressed in arcs 1-17 + Arc 18 P1.1
    + P1.2). Phase 1.3 opens the strand with the
    foundation skill (material identification); pair
    partner describe-material-properties (the 2nd
    canonical target — describing PROPERTIES of materials
    like hard/soft, smooth/rough, transparent/opaque) is
    a Phase 1.4+ candidate that would saturate the strand
    2/2 SAT (adding 1 saturated strand to the catalog).
    Strand-opener status documented for future-arc
    coordination.

    Per learning-targets.json the materials-and-properties
    strand sits under the world-knowledge domain
    alongside living-things (saturated 6/6 at Arc 11 +
    descendants) + environment-and-weather (saturated
    4/4 at Arc 5 + descendants) + community-and-roles
    (saturated 3/3 at Arc 17 P1.1 + descendants) + time-
    and-routine (partial 2/4) + personal-social-emotional-
    development (partial 3/8). Materials-and-properties
    is the LAST ZERO-COVERAGE strand in world-knowledge
    that opens at Phase 1.3. Phase 1.4+ candidates from
    world-knowledge domain include: describe-material-
    properties (pair partner; saturates this strand);
    sequence-daily-routine + use-before-after-vocabulary
    (saturates time-and-routine); various PSED targets.

    Cross-reference to identify-living-vs-nonliving
    (Arc 11; classification prerequisite): that package
    established the broader living-vs-nonliving
    classification (kids learned that some things are
    LIVING with growth/eating/reproduction; other things
    are NON-LIVING). This package extends the
    classification work to NON-LIVING objects: WHAT ARE
    THEY MADE OF? Kids who can identify non-living
    objects now classify them by material composition.
    The cognitive progression: things → living-vs-non-
    living → for-non-living-things-what-material → for-
    each-material-what-properties.

    Per §A.13.30 K-1-informal framing: K materials
    science is CONCRETE MATERIAL IDENTIFICATION (kid
    sees object → kid names material from 6-vocabulary
    set). The 6-material vocabulary (wood, plastic,
    metal, paper, fabric, glass) is deliberately the
    K-foundational set; some materials (rubber,
    ceramic, leather, stone, cardboard) are out-of-
    scope at K for vocabulary-load reasons. K kids
    learn to recognize material by SEEING + TOUCHING +
    matching against the 6-vocabulary set. Formal
    materials-property classification (NGSS 2-PS1-1
    'Plan and conduct an investigation to describe and
    classify different kinds of materials by their
    observable properties') is Grade 2+ work that builds
    on this K-level identification foundation.

    Distinctive composition: 2 picture-sort exercises +
    2 matching exercises + 1 odd-one-out. Same
    composition shape as Arc 11 identify-living-vs-
    nonliving precedent. The picture-sort + matching
    + odd-one-out triad surfaces both categorical-
    classification (picture-sort) AND vocabulary-
    pairing (matching) AND exclusion-reasoning (odd-
    one-out) — the canonical K-level classification-
    pedagogy app set.

    Materials note: 7-material World-knowledge class
    stack per §A.13.37. Mirrors Arc 11 identify-living-
    vs-nonliving precedent on materials-list shape
    exactly (flashcards + picture-cards + matching-mat
    + sentence-strips + manipulative-cut-outs + parent-
    take-home-letter + answer-key; NO vocabulary-
    tracing-strips — World-knowledge 7 differs from
    Numeracy 7 in this dimension; vocabulary-tracing-
    strips is a Literacy/Numeracy material). Sentence-
    strips at position 4 with framePreset 'this-is-a'
    (material-anchor frames: "This is wood. This is
    made of plastic.") is the load-bearing material —
    the literal material-vocabulary substrate kids work
    with. Manipulative-cut-outs at position 5 emits
    canonical-correct `mode: variety` with vocabKey
    enumeration of 6 material-type vocabKeys (wood,
    plastic, metal, paper, fabric, glass) at itemCount
    4. This is the canonical §A.13.35 mode-correct
    shape — different from Arc 11 identify-living-vs-
    nonliving precedent which used `mode: single-repeat
    itemCount: 24 themeName: animals` (pre-§A.13.35-
    correction data debt; that package is on the retro-
    fix carry-forward queue alongside Arc 17 P1.4 tell-
    time + Arc 16 P1.1 add-within-100 mode-retro-fix
    candidates).

    **SUBSTRATE CARRY-FORWARD TO P2 per §A.13.32 sub-
    doctrine (d) generator-executability:**
    The vocabKey image substrate (wood / plastic /
    metal / paper / fabric / glass images in image
    library + corresponding entries in image-
    vocabulary.js) does NOT yet exist at Phase 1.3
    ship. Substrate creation is deferred to Pillar 5
    P2 close-out cycle per §A.13.38 decoupled-ship
    discipline. This is a NEW carry-forward at Arc 18
    P1.3 (alongside the existing currency substrate
    carry-forward from Phase 1.2 + clock-mat + place-
    value-mat generator carry-forwards from earlier).

    Class B FLEXIBLE substrate: composes against
    miscellaneous theme for composedExercises (materials
    are object-property attributes; no single semantic
    theme captures the breadth of material-bearing
    objects). The picture-sort exercises use animals +
    vehicles + fruits theme contrasts (a material-
    indirect proxy — kids sort by object-type, which
    correlates with material-type: vehicles tend to be
    metal/plastic; fruits are organic; animals are
    living-not-materials).

    K-3 multilingual classroom relevance: material
    identification is universal K-3 science content.
    The 6-material vocabulary is locale-portable;
    every locale has K-1 vocabulary for these common
    materials. Cross-locale material vocabulary:
    en 'wood/plastic/metal/paper/fabric/glass'; de
    'Holz/Plastik/Metall/Papier/Stoff/Glas'; es
    'madera/plástico/metal/papel/tela/vidrio'; pt
    'madeira/plástico/metal/papel/tecido/vidro'; fr
    'bois/plastique/métal/papier/tissu/verre'; it
    'legno/plastica/metallo/carta/tessuto/vetro'; nl
    'hout/plastic/metaal/papier/stof/glas'; fi 'puu/
    muovi/metalli/paperi/kangas/lasi'; sv 'trä/plast/
    metall/papper/tyg/glas'; da 'træ/plast/metal/
    papir/stof/glas'; no 'tre/plast/metall/papir/stoff/
    glass'. The 6-material set is universal in K-1
    materials science curricula across the 11 locale
    variants. Locale-variant work at Phase 3+ adapts
    to each locale's material-vocabulary register +
    culturally-familiar object examples (some material
    examples are culture-specific — e.g., common
    fabrics differ between linen-tradition vs cotton-
    tradition locales).

