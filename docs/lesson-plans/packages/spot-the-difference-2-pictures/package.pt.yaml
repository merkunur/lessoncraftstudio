# Teaching package — spot the differences between 2 similar pictures (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 7 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# FIRST pt sparse-override for fine-motor-and-visual-spatial / visual-discrimination
# strand. BR Portuguese register per CLAUDE.md §6 + §17.9. Builds on Arc 6 Phase 2
# visual-discrimination trio (não totalmente ainda em pt; primeiro pt pacote do fio
# visual-discriminação).

title:
  pt: "Encontra as diferenças — descobre o que mudou entre duas imagens"
description:
  pt: "Pacote para K e Primeiro Ano que ensina atenção a detalhes através de quebra-cabeças de 'encontre as diferenças'. As crianças comparam duas imagens semelhantes e identificam 3-5 pequenas diferenças. Constrói sobre o trio de discriminação visual do Arco 6 Fase 2. Ancorado em vocabulário — as crianças nomeiam as diferenças que encontram."

structure:
  warmup:
    body: |
      Apresentação para toda a turma. A professora ou o professor exibe 2
      imagens da mesma cena com 3-5 diferenças sutis (mudança de cor; item
      em falta; pose diferente). "Olhem com atenção — o que está
      diferente?" A turma encontra colaborativamente diferenças em coro.
      Reforça a habilidade de atenção aos detalhes + vocabulário (as
      crianças nomeiam os itens diferentes). Fixe na área "Habilidades
      Visuais" do mural de palavras.
  contentActivity:
    body: |
      Rotina de mural de bolso. A professora ou o professor exibe novos
      conjuntos de pares de imagens; a turma identifica todas as diferenças.
      Trabalho em duplas: a criança A segura uma imagem; a criança B segura
      uma imagem semelhante mas diferente; juntas descrevem o que está
      diferente em cada uma ("Na MINHA imagem há uma bola vermelha; na
      SUA imagem a bola é azul"). Desenvolve vocabulário produtivo enquanto
      treina atenção à discriminação visual.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios spot-the-
      difference (as crianças circulam diferenças entre pares de imagens).
      Estação 2: emparelhamento (imagem-nome reforça vocabulário usado
      nas imagens). Estação 3: classificação igual/diferente com recortes
      manipulativos (as crianças classificam objetos como "exatamente
      iguais" vs "diferentes de alguma forma" — reforça discriminação
      visual no nível macro).
  closure:
    body: |
      Recordação rápida com toda a turma. A professora ou o professor exibe
      um par final de imagens; a turma encontra coletivamente todas as
      diferenças. Indicador adiante: "Hoje treinamos os nossos olhos para
      detectar pequenas diferenças. Quando voltarmos a quebra-cabeças
      visuais próxima vez, faremos quebra-cabeças MAIS de atenção aos
      detalhes — encontrando objetos escondidos em cenas movimentadas."

assessmentCriteria:
  pt: |
    Encontrar 3 de 5 diferenças entre pares de imagens em 8 de 10
    tentativas. Encontrar 4-5 de 5 diferenças com tempo estendido em 6
    de 10 tentativas. Articular as diferenças em português ("o X é Y em
    uma imagem; Z na outra") em 6 de 10 tentativas.

    Diferenciação:
      - Pré-K: 2-3 pares de imagens com diferenças grandes.
      - K: 3-5 diferenças; dificuldade mista.
      - Primeiro ano em diante: 5-7 diferenças com distinções subtis;
        ponte para find-hidden-target-in-busy-scene + count-instances-of-
        target-in-grid (primos cognitivos do Arco 6 Fase 2).

compositionalRationale:
  pt: |
    Fio principal: motricidade fina e visual-espacial / discriminação
    visual. Fio secundário: aquisição de vocabulário (ancorado em
    vocabulário — as crianças nomeiam os itens diferentes). Fio terciário:
    atenção aos detalhes + raciocínio de comparação sustentada.

    Significância arquitetural: 4º pacote no fio de discriminação visual
    (variantes pt agora começam a cobrir o fio). O Arco 6 Fase 2 trio
    (match-image-to-shadow + match-image-piece-to-whole + find-missing-
    piece) cobriu 3 superfícies de discriminação visual em en; este
    pacote do Arco 7 Fase 2 + sparse-override pt adiciona spot-the-
    difference como a 4ª superfície. Profundidade do fio de
    discriminação visual substancial: 4 pacotes em en; 1 pacote em pt
    (este).

    Enquadramento da âncora de vocabulário continua: a tarefa cognitiva
    (discriminação visual + comparação) é a forma arquitetural; a
    âncora de vocabulário é o fio pedagógico. Spot-the-difference é
    uma das atividades de discriminação visual mais ricas em
    vocabulário porque as crianças têm de NOMEAR o que está diferente.

    Relevância cultural pt-BR específica: jogos de "encontre as
    diferenças" são canônicos em revistas infantis brasileiras
    ("Recreio", "Turma da Mônica", etc.); culturalmente familiares
    e altamente engajadores. As crianças brasileiras adoram o formato;
    a alta-relevância cultural + a alta-engajamento + a integração de
    vocabulário em sala de aula multilíngue K-3 = uso de tempo de
    altíssima alavancagem.
