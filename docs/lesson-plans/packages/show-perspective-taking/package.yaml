# Teaching package — show perspective taking (theory-of-mind foundation)
# Arc 16 Phase 1.3 (science / personal-social-emotional-development 4/6 → 5/6).
# Pairs to Phase 1.2 name-and-describe-feelings-detailed at PSED strand-depth.
# Deepens Arc 15 Phase 4 show-empathy-toward-others by adding cognitive-foundation layer beneath empathy-response.

targetSlug: show-perspective-taking
language: en
title:
  en: "Seeing It Their Way — recognizing that others have different feelings, thoughts, and views"

description:
  en: "Kindergarten / Grade 1-2 social-emotional package teaching theory-of-mind foundation: the recognition that OTHERS have feelings, thoughts, and views DIFFERENT from yours. Pairs to Arc 16 Phase 1.2 name-and-describe-feelings-detailed (emotion-self-awareness) — this package extends to emotion-OTHER-awareness via perspective-taking developmental sequence. Distinct from Arc 15 show-empathy-toward-others (which teaches how to RESPOND caringly): this package teaches the COGNITIVE FOUNDATION beneath empathic response — recognizing that another person's inner state can differ from your own. Three-stage developmental sequence: (1) RECOGNIZE-OTHER-FEELINGS — Sara feels sad even though I feel happy; (2) INFER-OTHER-THOUGHTS — my friend doesn't know about the surprise because they weren't there; (3) PREDICT-OTHER-ACTIONS — Sam will look in the drawer where he last put his toy, even though it was moved. Critical bridge from emotion-self-awareness to social-cognition. Foundation for show-empathy-toward-others' RESPONSE work + later conflict-resolution + friendship work. PSED strand: 4/6 → 5/6 at this Phase 1.3 close. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + theory-of-mind introduction. Teacher
      shows two photos side-by-side: a child smiling at a slice
      of cake + a child with a sad face looking at the same
      cake. "Look — same cake, two different feelings. Why might
      one child be HAPPY about the cake and the other be SAD?"
      Class brainstorms (one is hungry, the other is full; one
      likes the flavor, the other is allergic; one had a birthday
      surprise, the other had to share their own cake). "Different
      people see the SAME thing in DIFFERENT ways. Today we
      practice SEEING IT THEIR WAY — understanding that other
      people's feelings and thoughts can be different from yours,
      even about the same thing." Teacher introduces three steps:
      (1) RECOGNIZE: that other people's feelings can be different
      from yours; (2) INFER: what others might be thinking when
      they don't have the same information you do; (3) PREDICT:
      what others might do based on what THEY know (not what
      YOU know). Pattern emphasis: "Your view is not the only
      view — and that's actually really useful to notice!"
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + perspective-taking scenario routine. Each pair
      receives 8 scenario cards spanning the 3 stages:
      RECOGNIZE-FEELINGS scenarios (e.g., "Maria sees a spider
      and screams; you think spiders are cool — how does Maria
      feel? How might it feel different from you?"); INFER-
      THOUGHTS scenarios (e.g., "Mom hid a present in the closet
      while you weren't home; later when you came home you
      didn't know about it — what did you think when you saw
      Mom looking strangely at the closet?"); PREDICT-ACTIONS
      scenarios (e.g., "Sam put his teddy bear on his bed before
      lunch; while he was eating, you moved the teddy to the
      shelf; after lunch, where will Sam LOOK FIRST for his
      teddy?" — classic false-belief task: kids who answer "the
      bed" demonstrate theory-of-mind). Pair takes turns: kid A
      reads scenario; kid B walks through perspective-taking
      thinking aloud. Recast errors with perspective-prompt
      ("you know the teddy moved — but Sam DIDN'T see you move
      it. So what does SAM think? What will Sam DO?"). NO
      PRESSURE — perspective-taking emerges at different ages
      (4-5yo for basic; 5-7yo for cognitive-empathy; 7-9yo for
      social-perspective).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (scenario-
      to-perspective-response; e.g., "Sam looking for teddy in
      moved location" ↔ "Sam doesn't know teddy was moved").
      Station 2: pattern-train (sequence the 3 perspective-
      taking steps: RECOGNIZE → INFER → PREDICT). Station 3:
      picture-sort (sort scenarios into "same view" vs
      "different views" categories based on whether characters
      share the same information). Station 4: vocabulary-
      tracing-strips for perspective vocabulary (perspective,
      different, view, opinion, think, feel, notice, understand).
  closure:
    durationMinutes: 5
    body: |
      Whole-class perspective-taking circle. Each child shares a
      time they realized someone else SAW something differently
      from them. "I thought my brother would love the toy I
      gave him, but he wanted a different one." OR "I was sad
      when my friend moved away, but my friend was actually
      EXCITED to see their cousin." Teacher validates each
      response. Forward-pointer: "Today we practiced SEEING IT
      THEIR WAY. When we come back next, we'll combine
      perspective-taking with EMPATHY — once you can recognize
      that someone feels different from you, you can RESPOND
      with care (like we learned in show-empathy-toward-others).
      Perspective-taking + empathy together build the friendship
      and cooperation skills we'll work on in future weeks!"

