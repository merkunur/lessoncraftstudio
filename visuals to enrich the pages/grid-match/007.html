<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Raster-Puzzle - Knobelspa&szlig;</title>
</head>
<body style="margin:0;padding:0;width:1000px;height:1000px;overflow:hidden;font-family:'Nunito',sans-serif;">
    <div style="width:1000px;height:1000px;position:relative;background:linear-gradient(150deg,#7E57C2 0%,#5E35B1 40%,#4527A0 100%);overflow:hidden;">

        <!-- Starburst radial glow -->
        <div style="position:absolute;top:40%;left:50%;width:1200px;height:1200px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,214,0,0.12) 0%,rgba(126,87,194,0.05) 35%,transparent 55%);border-radius:50%;"></div>

        <!-- Scattered semi-transparent "?" characters -->
        <div style="position:absolute;top:140px;left:55px;font-family:'Fredoka',sans-serif;font-size:80px;color:rgba(255,255,255,0.06);transform:rotate(-15deg);">?</div>
        <div style="position:absolute;top:310px;right:45px;font-family:'Fredoka',sans-serif;font-size:60px;color:rgba(255,255,255,0.05);transform:rotate(20deg);">?</div>
        <div style="position:absolute;bottom:320px;left:35px;font-family:'Fredoka',sans-serif;font-size:70px;color:rgba(255,255,255,0.06);transform:rotate(10deg);">?</div>
        <div style="position:absolute;top:520px;right:90px;font-family:'Fredoka',sans-serif;font-size:50px;color:rgba(255,255,255,0.04);transform:rotate(-25deg);">?</div>
        <div style="position:absolute;top:210px;left:290px;font-family:'Fredoka',sans-serif;font-size:45px;color:rgba(255,255,255,0.04);transform:rotate(30deg);">?</div>
        <div style="position:absolute;bottom:220px;right:240px;font-family:'Fredoka',sans-serif;font-size:55px;color:rgba(255,255,255,0.05);transform:rotate(-8deg);">?</div>

        <!-- GRATIS badge: Gold starburst -->
        <div style="position:absolute;top:20px;left:22px;z-index:100;">
            <div style="width:105px;height:105px;background:linear-gradient(145deg,#FFD600 0%,#FFAB00 100%);box-shadow:0 8px 28px rgba(255,214,0,0.5);display:flex;align-items:center;justify-content:center;transform:rotate(-10deg);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);">
                <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:19px;color:#4527A0;text-shadow:0 1px 2px rgba(255,255,255,0.3);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position:absolute;top:32px;right:32px;background:rgba(255,255,255,0.95);padding:10px 22px;border-radius:28px;box-shadow:0 4px 16px rgba(0,0,0,0.2);border:3px solid #FFD600;z-index:100;">
            <span style="font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;color:#4527A0;letter-spacing:1px;">KLASSE K-2</span>
        </div>

        <!-- Main Title: Staggered RASTER / PUZZLE -->
        <div style="position:absolute;top:80px;left:0;right:0;text-align:center;z-index:40;">
            <h1 style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:88px;color:white;margin:0;line-height:0.9;text-shadow:4px 4px 0 rgba(69,39,160,0.6),8px 8px 0 rgba(0,0,0,0.15),0 0 40px rgba(255,214,0,0.15);">RASTER</h1>
            <h1 style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:88px;color:#FFD600;margin:0;line-height:0.9;text-shadow:4px 4px 0 rgba(69,39,160,0.6),8px 8px 0 rgba(0,0,0,0.15);margin-left:60px;">PUZZLE</h1>
        </div>

        <!-- Center area: worksheets and CSS grid -->
        <div style="position:absolute;top:290px;left:50%;transform:translateX(-50%);width:900px;height:400px;">

            <!-- Left landscape worksheet: Sample 3 (Panda) -->
            <div style="position:absolute;left:25px;top:40px;transform:rotate(-5deg);z-index:10;">
                <div style="width:260px;height:201px;background:white;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.3);border:5px solid rgba(255,255,255,0.8);overflow:hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/grid%20match/sample-3.jpeg" style="width:100%;height:100%;object-fit:cover;" alt="Panda Raster-Puzzle">
                </div>
            </div>

            <!-- Right landscape worksheet: Sample 4 (Elephant) -->
            <div style="position:absolute;right:25px;top:50px;transform:rotate(4deg);z-index:10;">
                <div style="width:260px;height:201px;background:white;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.3);border:5px solid rgba(255,255,255,0.8);overflow:hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/grid%20match/sample-4.jpeg" style="width:100%;height:100%;object-fit:cover;" alt="Elefant Raster-Puzzle">
                </div>
            </div>

            <!-- CSS 3x3 Grid visualization (centered, overlapping worksheets) -->
            <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,72px);gap:6px;background:rgba(0,0,0,0.35);padding:10px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,0.4);backdrop-filter:blur(3px);">
                <!-- Row 1 -->
                <div style="background:linear-gradient(135deg,#26C6DA,#00ACC1);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2px 4px rgba(0,0,0,0.15);">
                    <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px;color:white;text-shadow:1px 1px 2px rgba(0,0,0,0.2);">1</span>
                </div>
                <div style="border:3px dashed rgba(255,255,255,0.4);border-radius:8px;display:flex;align-items:center;justify-content:center;">
                    <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px;color:rgba(255,255,255,0.5);">?</span>
                </div>
                <div style="background:linear-gradient(135deg,#26C6DA,#00ACC1);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2px 4px rgba(0,0,0,0.15);">
                    <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px;color:white;text-shadow:1px 1px 2px rgba(0,0,0,0.2);">3</span>
                </div>
                <!-- Row 2 -->
                <div style="border:3px dashed rgba(255,255,255,0.4);border-radius:8px;display:flex;align-items:center;justify-content:center;">
                    <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px;color:rgba(255,255,255,0.5);">?</span>
                </div>
                <div style="background:linear-gradient(135deg,#FFD600,#FFAB00);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2px 4px rgba(0,0,0,0.15);">
                    <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px;color:#4527A0;text-shadow:1px 1px 2px rgba(255,255,255,0.3);">5</span>
                </div>
                <div style="border:3px dashed rgba(255,255,255,0.4);border-radius:8px;display:flex;align-items:center;justify-content:center;">
                    <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px;color:rgba(255,255,255,0.5);">?</span>
                </div>
                <!-- Row 3 -->
                <div style="background:linear-gradient(135deg,#FF7043,#F4511E);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2px 4px rgba(0,0,0,0.15);">
                    <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px;color:white;text-shadow:1px 1px 2px rgba(0,0,0,0.2);">7</span>
                </div>
                <div style="background:linear-gradient(135deg,#26C6DA,#00ACC1);border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2px 4px rgba(0,0,0,0.15);">
                    <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px;color:white;text-shadow:1px 1px 2px rgba(0,0,0,0.2);">8</span>
                </div>
                <div style="border:3px dashed rgba(255,255,255,0.4);border-radius:8px;display:flex;align-items:center;justify-content:center;">
                    <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px;color:rgba(255,255,255,0.5);">?</span>
                </div>
            </div>
        </div>

        <!-- Sample 1 (Owl) peeking from bottom -->
        <div style="position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);z-index:15;">
            <div style="width:170px;height:130px;background:white;border-radius:10px 10px 0 0;box-shadow:0 -5px 25px rgba(0,0,0,0.25);border:5px solid rgba(255,255,255,0.8);border-bottom:0;overflow:hidden;">
                <img src="https://www.lessoncraftstudio.com/samples/german/grid%20match/sample-1.jpeg" style="width:100%;height:200px;object-fit:cover;object-position:top;" alt="Eule Raster-Puzzle">
            </div>
        </div>

        <!-- Speech bubble: "Schaffst du das?" -->
        <div style="position:absolute;top:720px;left:50%;transform:translateX(-50%);z-index:35;">
            <div style="background:white;padding:10px 24px;border-radius:22px;box-shadow:0 4px 15px rgba(0,0,0,0.2);position:relative;">
                <span style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;color:#4527A0;">Schaffst du das?</span>
                <!-- Tail pointing down -->
                <div style="position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:12px solid white;"></div>
            </div>
        </div>

        <!-- Banner -->
        <div style="position:absolute;bottom:115px;left:0;right:0;background:linear-gradient(90deg,rgba(255,112,67,0.95) 0%,rgba(244,81,30,0.95) 100%);padding:14px 0;box-shadow:0 -4px 20px rgba(0,0,0,0.15),0 4px 20px rgba(0,0,0,0.15);z-index:40;">
            <div style="text-align:center;">
                <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:28px;color:white;text-shadow:2px 2px 4px rgba(0,0,0,0.2);letter-spacing:1px;">Knobelspa&szlig; f&uuml;r kleine Denker!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position:absolute;bottom:35px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:50;">
            <div style="background:rgba(255,255,255,0.95);padding:12px 20px;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,0.2);border:3px solid #26C6DA;">
                <span style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#00838F;">Niedliche Tiere</span>
            </div>
            <div style="background:rgba(255,255,255,0.95);padding:12px 20px;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,0.2);border:3px solid #FFD600;">
                <span style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#F9A825;">Mit L&ouml;sungen</span>
            </div>
            <div style="background:rgba(255,255,255,0.95);padding:12px 20px;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,0.2);border:3px solid #FF7043;">
                <span style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#F4511E;">Druckfertig</span>
            </div>
        </div>

    </div>
</body>
</html>
