<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Draw and Color - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #E8D5F5 0%, #F5E6F0 40%, #FFE0E0 100%); overflow: hidden;">

        <!-- Subtle sparkle texture -->
        <div style="position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.6) 0%, transparent 25%), radial-gradient(circle at 70% 80%, rgba(255,255,255,0.5) 0%, transparent 20%);"></div>

        <!-- Confetti dots scattered -->
        <div style="position: absolute; top: 100px; left: 80px; width: 14px; height: 14px; background: #9C27B0; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; top: 150px; right: 120px; width: 12px; height: 12px; background: #FF6B6B; border-radius: 50%; opacity: 0.6;"></div>
        <div style="position: absolute; top: 250px; left: 150px; width: 10px; height: 10px; background: #009688; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; top: 180px; right: 200px; width: 11px; height: 11px; background: #FFD600; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; bottom: 350px; left: 100px; width: 13px; height: 13px; background: #E91E63; border-radius: 50%; opacity: 0.6;"></div>
        <div style="position: absolute; bottom: 380px; right: 90px; width: 9px; height: 9px; background: #8BC34A; border-radius: 50%; opacity: 0.7;"></div>

        <!-- Sparkle stars -->
        <div style="position: absolute; top: 120px; left: 200px; font-size: 22px; color: #FFD600; transform: rotate(15deg);">✦</div>
        <div style="position: absolute; top: 90px; right: 180px; font-size: 18px; color: #FFD600; transform: rotate(-10deg);">✦</div>
        <div style="position: absolute; bottom: 420px; left: 60px; font-size: 20px; color: #FFD600; transform: rotate(25deg);">✦</div>
        <div style="position: absolute; bottom: 400px; right: 70px; font-size: 16px; color: #FFD600; transform: rotate(-20deg);">✦</div>

        <!-- FREE Badge - Purple Circle -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(145deg, #9C27B0 0%, #7B1FA2 100%); box-shadow: 0 6px 25px rgba(156,39,176,0.5), inset 0 -3px 10px rgba(0,0,0,0.15), inset 0 3px 6px rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">FREE</span>
            </div>
        </div>

        <!-- Main Title with playful arc -->
        <div style="position: absolute; top: 30px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 64px; color: #9C27B0; margin: 0; text-shadow: 3px 3px 0 rgba(255,255,255,0.8);">What's Inside?</h1>
        </div>

        <!-- Central Art Supply Box -->
        <div style="position: absolute; top: 110px; left: 50%; transform: translateX(-50%); z-index: 20;">
            <!-- Box body -->
            <div style="width: 240px; height: 160px; background: linear-gradient(180deg, #9C27B0 0%, #7B1FA2 100%); border-radius: 12px; box-shadow: 0 20px 50px rgba(123,31,162,0.4); position: relative;">
                <!-- Box pattern stripes -->
                <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.05) 20px, rgba(255,255,255,0.05) 40px); border-radius: 12px;"></div>
                <!-- Box lid (open, tilted back) -->
                <div style="position: absolute; top: -60px; left: -10px; width: 260px; height: 80px; background: linear-gradient(180deg, #AB47BC 0%, #9C27B0 100%); border-radius: 10px 10px 0 0; transform: perspective(200px) rotateX(40deg); transform-origin: bottom center; box-shadow: 0 -5px 20px rgba(0,0,0,0.2);">
                    <!-- Ribbon on lid -->
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 20px; background: linear-gradient(90deg, #FFD600 0%, #FFC107 50%, #FFD600 100%); border-radius: 3px;"></div>
                </div>
                <!-- Front label -->
                <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 8px 20px; border-radius: 20px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 600; color: #9C27B0;">GRID DRAWING</span>
                </div>
            </div>
        </div>

        <!-- Feature Cards Bursting Out -->

        <!-- Card 1: Grid Method - Top Left -->
        <div style="position: absolute; top: 280px; left: 60px; z-index: 30;">
            <div style="background: linear-gradient(135deg, #009688 0%, #00796B 100%); padding: 22px 26px; border-radius: 18px; box-shadow: 0 10px 35px rgba(0,150,136,0.4); transform: rotate(-8deg); width: 180px;">
                <div style="font-size: 36px; margin-bottom: 8px;">📐</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">Grid Method</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 4px;">Step-by-step guidance</div>
            </div>
        </div>

        <!-- Card 2: Cute Animals - Top Center (Larger/Featured) -->
        <div style="position: absolute; top: 260px; left: 50%; transform: translateX(-50%); z-index: 35;">
            <div style="background: linear-gradient(135deg, #FF6B6B 0%, #E53935 100%); padding: 26px 32px; border-radius: 20px; box-shadow: 0 12px 40px rgba(255,107,107,0.45); width: 200px;">
                <div style="font-size: 42px; margin-bottom: 10px;">🐰</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white;">Cute Animals</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: rgba(255,255,255,0.9); margin-top: 5px;">Kids love to draw!</div>
            </div>
        </div>

        <!-- Card 3: Fine Motor Practice - Top Right -->
        <div style="position: absolute; top: 280px; right: 60px; z-index: 30;">
            <div style="background: linear-gradient(135deg, #FFD600 0%, #FFC107 100%); padding: 22px 26px; border-radius: 18px; box-shadow: 0 10px 35px rgba(255,214,0,0.4); transform: rotate(8deg); width: 180px;">
                <div style="font-size: 36px; margin-bottom: 8px;">✏️</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #5D4037;">Fine Motor</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 13px; color: rgba(93,64,55,0.85); margin-top: 4px;">Pencil control skills</div>
            </div>
        </div>

        <!-- Card 4: Copy & Draw - Below Center -->
        <div style="position: absolute; top: 450px; left: 50%; transform: translateX(-50%); z-index: 32;">
            <div style="background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%); padding: 20px 28px; border-radius: 18px; box-shadow: 0 10px 35px rgba(156,39,176,0.4); width: 190px;">
                <div style="font-size: 34px; margin-bottom: 8px;">🎯</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">Copy & Draw</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 13px; color: rgba(255,255,255,0.85); margin-top: 4px;">Scaffolded success</div>
            </div>
        </div>

        <!-- Sample Pages Fanned at Bottom -->
        <div style="position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 40;">
            <!-- Page 1 -->
            <div style="transform: rotate(-10deg); box-shadow: 0 12px 35px rgba(0,0,0,0.25);">
                <img src="https://www.lessoncraftstudio.com/samples/english/draw%20and%20color/sample-1.jpeg" style="width: 170px; height: auto; border-radius: 10px; border: 5px solid white;">
            </div>
            <!-- Page 2 -->
            <div style="transform: rotate(0deg) translateY(-20px); box-shadow: 0 15px 40px rgba(0,0,0,0.3); z-index: 5;">
                <img src="https://www.lessoncraftstudio.com/samples/english/draw%20and%20color/sample-4.jpeg" style="width: 190px; height: auto; border-radius: 12px; border: 6px solid white;">
            </div>
            <!-- Page 3 -->
            <div style="transform: rotate(10deg); box-shadow: 0 12px 35px rgba(0,0,0,0.25);">
                <img src="https://www.lessoncraftstudio.com/samples/english/draw%20and%20color/sample-5.jpeg" style="width: 170px; height: auto; border-radius: 10px; border: 5px solid white;">
            </div>
        </div>

        <!-- Bottom Theme Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px;">
            <div style="background: #009688; padding: 10px 18px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,150,136,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white;">Bat</span>
            </div>
            <div style="background: #FF6B6B; padding: 10px 18px; border-radius: 20px; box-shadow: 0 4px 15px rgba(255,107,107,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white;">Hamster</span>
            </div>
            <div style="background: #9C27B0; padding: 10px 18px; border-radius: 20px; box-shadow: 0 4px 15px rgba(156,39,176,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white;">Hippo</span>
            </div>
            <div style="background: #FFD600; padding: 10px 18px; border-radius: 20px; box-shadow: 0 4px 15px rgba(255,214,0,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #5D4037;">Raccoon</span>
            </div>
            <div style="background: #8BC34A; padding: 10px 18px; border-radius: 20px; box-shadow: 0 4px 15px rgba(139,195,74,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white;">& More!</span>
            </div>
        </div>

    </div>
</body>
</html>
