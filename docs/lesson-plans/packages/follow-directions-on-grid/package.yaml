compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial / spatial-reasoning.
    Secondary strand: vocabulary acquisition (direction vocabulary:
    left/right/up/down). Tertiary strand: sequence-following (kids hold
    a sequence of directions in working memory while executing).

    Architectural significance: spatial-reasoning strand depth (4th
    package after Arc 5 Phase 2's use-position-vocabulary + Arc 6 Phase
    1's use-spatial-position-words + Arc 7 Phase 2's other packages).
    Validates spatial-reasoning architecture across 4 distinct surfaces:
    position-vocabulary (4 prepositions) → expanded-position (8
    prepositions) → directional-navigation (this package).

    Pairing pattern with prereq packages: use-position-vocabulary +
    use-spatial-position-words establish PREPOSITION vocabulary (in,
    on, under, between, behind, etc.); follow-directions-on-grid adds
    DIRECTION vocabulary (left, right, up, down) — different but
    complementary spatial-language layers. Sequential prereq-chain.

    Distinctive composition: 3 picture-path exercises across 3 theme
    contexts (animals, vehicles, shapes) + 1 matching + 1 prepositions
    multiplechoice. picture-path app's grid-navigation mechanic is the
    canonical surface for direction-following; theme-context variation
    validates that picture-path generalizes across themes.

    Cross-strand integration: follow-directions-on-grid bridges
    spatial-reasoning + sequence-following + working-memory. Multi-
    strand integration similar to remember-image-pair-positions
    (memory-and-attention).

    K-3 multilingual classroom relevance: direction vocabulary varies
    per locale (German: links/rechts/oben/unten; Spanish: izquierda/
    derecha/arriba/abajo); cardinal-direction conventions universal but
    morphology varies. Vocab-anchor preserved.

