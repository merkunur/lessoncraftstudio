assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Spell 6 of 8 dictated digraph-words correctly in 8 of 10
        trials (with picture-cue support).
      - Identify and write the correct digraph cluster (sh/ch/th/wh/
        ph) when given a word's medial-and-final sound pattern in
        7 of 10 trials.
      - Distinguish digraph (two-letters-one-sound: sh = /sh/) from
        blend (two-letters-two-sounds: bl = /b/+/l/) in 7 of 10
        trials.
      - Apply the digraph-spelling strategy to NEW unfamiliar digraph
        words (e.g., 'shop', 'chip', 'that', 'whip') in 6 of 10
        trials.

    Differentiation:
    - Pre-K: digraph-recognition only (no writing); circle the
      digraph-word matching picture from 2-3 options.
    - Kindergarten: 3 most-frequent digraphs (sh / ch / th) +
      independent writing.
    - Grade 1+: extend full digraph set (sh / ch / th / wh / ph) +
      bridge to compound-cluster work (shr-/spl-/spr-/str-) +
      sight-word spelling refinement.

