compositionalRationale:
  en: |
    Primary strand: world-knowledge / time-and-routine (days-of-week
    recognition + sequencing). Secondary strand: vocabulary acquisition
    (vocab-anchored — day names are high-frequency K-3 vocabulary).
    Tertiary strand: sequencing + cyclic reasoning (kids order days
    + recognize week-cycle).

    Architectural significance: FIRST time-and-routine strand package
    in the catalog. Opens 4-target strand for future arcs (identify-
    months-of-year, sequence-daily-routine, use-before-after-vocabulary).
    Time-and-routine strand is foundational for K-3 classroom-context
    awareness — kids who know days-of-week can navigate weekly
    routines independently.

    Distinctive composition: 3 matching exercises across same theme
    (school-objects) — repetition reinforces day-name + school-object
    pairing (school days vs weekend days; school-supplies for school
    days). word-scramble + word-guess add spelling reinforcement.
    The 5-exercise composition targets day-name knowledge from
    multiple cognitive angles.

    Cross-strand integration: world-knowledge time-and-routine +
    vocabulary acquisition + sequencing. Days-of-week work is a
    natural classroom-context anchor — every K-3 classroom uses days-
    of-week vocabulary daily in attendance, calendar-time, schedule
    review.

    Class B FLEXIBLE substrate: composes against school-objects theme.
    Substrate-readiness universal — school context is universally
    relevant to K-3 audience.

    K-3 multilingual classroom relevance: day names are high-frequency
    vocabulary across all 11 platform locales (Monday/lunes/lundi/
    lunedì/segunda-feira/montag/maandag/måndag/mandag/mandag/maanantai).
    Cross-locale: weekly cycle is universal (7 days everywhere); only
    the names + ordering conventions differ (some locales start week
    on Sunday, some on Monday). Phase 3 sparse-overrides handle locale-
    specific conventions.

