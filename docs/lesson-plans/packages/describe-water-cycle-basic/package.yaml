compositionalRationale:
  en: |
    Primary strand: science / environment-and-weather (water cycle —
    saturates strand 4/4). Secondary strand: vocabulary-acquisition
    (4 stage names: evaporation, condensation, precipitation,
    collection + weather vocabulary). Tertiary strand: cognitive-and-
    executive-function / sequencing (cyclical sequence comprehension).

    Architectural significance: SATURATES environment-and-weather
    strand at 4/4. Builds on Arc 12 describe-day-night-cycle's cycle-
    sequencing pattern; extends to a 4-stage cycle (vs day-night's
    2-stage cycle) with continuous-process framing. Water cycle is
    the canonical K-3 weather-driver concept; saturating this strand
    completes K-3 environment-and-weather foundation.

    Distinctive composition: 2 pattern-train (sequence learning) + 2
    matching + 1 missing-pieces. Same compositional shape as
    describe-butterfly-life-cycle (this Phase 1 ship's saturation
    sibling) — both packages emphasize sequence + cycle comprehension
    via pattern-train + matching + missing-pieces. Demonstrates that
    cycle-learning is a recurring K-3 pedagogical pattern.

    Class B FLEXIBLE substrate: composes primarily against weather
    image-library theme; nature_bw fallback for natural-water-system
    imagery (rivers, lakes, oceans).

    K-3 multilingual classroom relevance: water-cycle vocabulary
    moderate-cognate Romance (evaporación / évaporation / evaporazione)
    + Germanic distinct (Verdunstung / verdamping / avdunstning).
    Visual cycle stages translate universally; vocabulary anchor
    varies. Sparse-overrides at Phase 3 will substitute locale-natural
    stage-names; some locales may use simpler terms in K-3 context
    (e.g., 'water rises' vs 'evaporation') for accessibility.

