compositionalRationale:
  en: |
    Primary strand: early-literacy / speaking-and-listening (receptive
    1-step instruction-following). Secondary strand: vocabulary
    acquisition (vocab-anchored — body parts + classroom objects +
    action verbs all activated). Tertiary strand: working-memory +
    executive-function (kids hold instruction in mind while executing).

    Architectural significance: deepens speaking-and-listening strand
    1/10 → 2/10. Receptive language is foundational — kids build
    instruction-following before they generate productive language.
    Classroom-routine load-bearing: every K-3 classroom uses 1-step
    instructions daily ('line up', 'sit down', 'open your book').

    Distinctive composition: 3 matching exercises across multiple
    themes (body-parts + school-objects) + 1 prepositions exercise +
    1 word-guess. Multi-theme rotation reinforces that instruction-
    following spans diverse vocabulary domains.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Universal substrate-readiness — instructions can target any vocab
    domain.

    K-3 multilingual classroom relevance: instruction-following in
    TARGET LANGUAGE is the core ESL/EFL skill — kids in target-
    language-immersion contexts encounter 1-step target-language
    instructions hourly. Locale-variant sparse-overrides handle
    locale-specific instruction-vocabulary.

