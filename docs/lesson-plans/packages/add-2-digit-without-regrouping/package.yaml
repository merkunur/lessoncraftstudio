compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (two-digit
    addition without regrouping — deepens strand 9/14 → 10/14).
    Secondary strand: math / place-value (column-addition makes
    tens-and-ones structure operationally explicit; the no-
    regroup constraint keeps the place-value invariant clean —
    tens stay in the tens column, ones stay in the ones column,
    no spillover). Tertiary strand: numeracy (strategy-based
    addition: column-add, decomposition, count-on, place-value-
    mat enactment).

    Architectural significance: bridges Arc 12 add-within-20
    foundation → Arc 16 Phase 1.1 add-within-100 (regrouping
    introduced there). This package isolates the two-digit
    column-addition mechanic in the no-carry case, so kids meet
    place-value-aware addition + the column routine WITHOUT
    also having to manage regrouping. Once the column-addition
    routine is familiar, regrouping at add-within-100 becomes
    an addition to an existing routine rather than a whole new
    procedure. Pedagogical sequencing matches the standard K-3
    curriculum progression (no-regrouping before regrouping
    introduces the algorithm in stages).

    Paired inverse: subtract-2-digit-without-regrouping (same
    arc phase) — kids meet column-subtraction in the no-borrow
    case in parallel. The two packages share place-value-mat
    infrastructure + base-ten manipulatives + column-add format,
    differing only in operation. Together they prepare the
    ground for the regrouping/borrowing introduction at add-
    within-100 + subtract-within-100.

    Distinctive composition: 1 addition (vertical format) + 2
    math-worksheet (vertical addition with no-regroup operands)
    + 1 math-puzzle (missing-addend) + 1 more-less (compare
    addition results). Vertical format emphasized — column
    alignment is the load-bearing visual structure; kids learn
    to align tens-under-tens and ones-under-ones BEFORE they
    have to manage carry-marks. The math-puzzle missing-addend
    work at position 3 introduces inverse-thinking (23+?=68)
    which complements the same package's straightforward addition.

    Class B FLEXIBLE substrate: composes against animals theme
    (countable for addition work; cross-arc with Arc 12-16
    addition/subtraction themes for consistency; pair-coherence
    with subtract-2-digit-without-regrouping which uses the
    same theme).

    K-3 multilingual classroom relevance: two-digit addition
    universal K-3 content. Two-digit number-word naming varies
    significantly across locales: en regular "twenty-three";
    de reverse-decade "dreiundzwanzig" (three-and-twenty);
    es "veintitrés" with elision; fr "vingt-trois" regular at
    20s but "soixante-treize" for 73 (sixty-thirteen) —
    French presents striking irregularity at 70-79 + 80-99;
    fi agglutinative compounds. The no-regrouping constraint
    keeps the cross-locale work focused on number-word
    fluency without simultaneously introducing carry-vocabulary
    (which lands at add-within-100). Locale-variant work at
    Phase 3+ adapts to each locale's two-digit number-word
    register without regrouping-vocabulary complexity.

