<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Say It Board — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell, then this tool. Absolute /mini-tools/ paths so embeds and
       cross-context loads resolve identically. No core import and NO data
       file: the twelve phrases and the twelve icons are inline, and the
       gate fails the build if this tool ever fetches pww-index — the
       bilingual word list belongs inside Picture Word Wall, whose
       compose(loc, card, plural) already takes locale as an argument. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/home-language-bridge.js?v=4"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    // The page locale is the CLASSROOM language; the child's home language
    // is chosen once in the tool and remembered. It is deliberately not a
    // URL parameter: which language a particular child speaks at home is
    // not something to put in a shareable link.
    LCS.mount(HomeLanguageBridge, { mount: '#lcs-root' });
  </script>
</body>
</html>
