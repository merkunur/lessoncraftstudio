# Teaching package — match numeral to quantity (1-10)
# Arc 3 Phase 3 numeracy package. Previously-unimplementable target — required
# numeral-cards material from Arc 3 Phase 1. Numeracy-package distinctive: the
# matching-mat material is now central (numeral-card ↔ quantity-image pairs).

targetSlug: match-numeral-to-quantity-1-to-10
language: en

title:
  en: "Match Numeral to Quantity 1 to 10"
description:
  en: "K-Grade 1 numeracy package teaching the numeral ↔ quantity correspondence (the '5' written symbol matches a group of 5 objects). Required Arc 3 Phase 1 numeral-cards material to unlock; previously-unimplementable target. Matching-mat material is central. 5 exercises + 7 materials over a 1-2 week unit."

durationMinutes: 25

structure:
  warmup:
    durationMinutes: 4
    body: |
      Whole-class introduction. Teacher holds up a numeral card (e.g., '3'),
      then holds up a picture-card showing 3 animals. "Three. Three cats." The
      kids say both — the numeral name + the count. Cycle through 1-10. The
      target IS the pairing: numeral and quantity are the same thing.
  contentActivity:
    durationMinutes: 10
    body: |
      Pair work with matching-mat. Kid A holds up a numeral card; kid B places
      that many manipulative-cut-out animals on the mat; both kids say "{N}
      cats" or "{N} cows." Switch roles. Recast errors via remodeling: "show me
      five — one, two, three, four, five — five cats."
  scaffold:
    durationMinutes: 7
    body: |
      Station rotation. Station 1: matching-mat with 6 numeral-quantity pairs
      (kid draws lines or places counters). Station 2: numeral-card sorting on
      the carpet (group cards 1-3 / 4-6 / 7-10 by magnitude). Station 3:
      find-and-count worksheet then fill in the matching numeral.
  closure:
    durationMinutes: 4
    body: |
      Whole-class share-out. Teacher names a numeral, kid produces both: hold
      up the matching numeral card AND that many fingers. Forward-pointer:
      "Today we matched numerals to quantities. When we come back to numbers
      next, we'll compare them — which is more, which is less."

