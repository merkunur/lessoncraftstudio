<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Picture Cryptogram - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(160deg, #FDF8F3 0%, #F5EDE4 40%, #EDE4D8 100%);">

        <!-- Subtle dotted pattern overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.4; background-image: radial-gradient(#7C3AED 1px, transparent 1px); background-size: 30px 30px;"></div>

        <!-- Decorative corner flourishes -->
        <div style="position: absolute; top: 0; left: 0; width: 200px; height: 200px; background: linear-gradient(135deg, rgba(124,58,237,0.08) 0%, transparent 60%);"></div>
        <div style="position: absolute; bottom: 0; right: 0; width: 250px; height: 250px; background: linear-gradient(-45deg, rgba(249,115,22,0.08) 0%, transparent 60%);"></div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 28px; left: 28px; z-index: 20;">
            <div style="width: 85px; height: 85px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 20px rgba(249,115,22,0.5), inset 0 2px 0 rgba(255,255,255,0.3); position: relative;">
                <div style="position: absolute; top: 50%; left: -3px; transform: translateY(-50%); width: 10px; height: 10px; background: #F5EDE4; border-radius: 50%;"></div>
                <div style="position: absolute; top: 50%; right: -3px; transform: translateY(-50%); width: 10px; height: 10px; background: #F5EDE4; border-radius: 50%;"></div>
                <span style="font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">FREE</span>
            </div>
        </div>

        <!-- GRADES Badge -->
        <div style="position: absolute; top: 32px; right: 32px;">
            <div style="background: linear-gradient(145deg, #7C3AED 0%, #6D28D9 100%); padding: 12px 24px; border-radius: 25px; box-shadow: 0 4px 15px rgba(124,58,237,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 800; color: white; letter-spacing: 1px;">GRADES K-3</span>
            </div>
        </div>

        <!-- Main Headline -->
        <div style="position: absolute; top: 100px; left: 50%; transform: translateX(-50%); text-align: center;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 82px; font-weight: 700; color: #7C3AED; text-shadow: 0 3px 0 rgba(124,58,237,0.15); letter-spacing: -1px;">DECODE</h1>
            <h1 style="margin: -10px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 82px; font-weight: 700; color: #F97316; text-shadow: 0 3px 0 rgba(249,115,22,0.15); letter-spacing: -1px;">& LEARN</h1>
        </div>

        <!-- Visual progression flow -->
        <div style="position: absolute; top: 280px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 15px;">
            <!-- Step 1: Picture -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <div style="width: 70px; height: 70px; background: linear-gradient(145deg, #fff 0%, #f8f4ff 100%); border-radius: 12px; box-shadow: 0 4px 15px rgba(124,58,237,0.2); display: flex; align-items: center; justify-content: center; border: 3px solid #7C3AED;">
                    <span style="font-size: 36px;">🍎</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: #7C3AED;">Pictures</span>
            </div>

            <!-- Arrow -->
            <div style="font-size: 28px; color: #F97316; font-weight: bold;">→</div>

            <!-- Step 2: Letter -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <div style="width: 70px; height: 70px; background: linear-gradient(145deg, #fff 0%, #fff5f0 100%); border-radius: 12px; box-shadow: 0 4px 15px rgba(249,115,22,0.2); display: flex; align-items: center; justify-content: center; border: 3px solid #F97316;">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 40px; font-weight: 700; color: #F97316;">A</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: #F97316;">Letters</span>
            </div>

            <!-- Arrow -->
            <div style="font-size: 28px; color: #7C3AED; font-weight: bold;">→</div>

            <!-- Step 3: Word -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <div style="width: 100px; height: 70px; background: linear-gradient(145deg, #fff 0%, #f8f4ff 100%); border-radius: 12px; box-shadow: 0 4px 15px rgba(124,58,237,0.2); display: flex; align-items: center; justify-content: center; border: 3px solid #7C3AED;">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700; color: #7C3AED;">CAT</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: #7C3AED;">Words</span>
            </div>

            <!-- Arrow -->
            <div style="font-size: 28px; color: #F97316; font-weight: bold;">→</div>

            <!-- Step 4: Message -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <div style="width: 130px; height: 70px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 12px; box-shadow: 0 4px 15px rgba(249,115,22,0.4); display: flex; align-items: center; justify-content: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; color: white; text-align: center; line-height: 1.2;">SECRET<br>MESSAGE!</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: #F97316;">Messages</span>
            </div>
        </div>

        <!-- Worksheet Display - Side by Side -->
        <div style="position: absolute; top: 420px; left: 50%; transform: translateX(-50%); display: flex; gap: 50px; align-items: center;">
            <!-- Worksheet (puzzle) -->
            <div style="position: relative;">
                <div style="width: 260px; height: 340px; background: white; border-radius: 10px; box-shadow: 0 10px 35px rgba(124,58,237,0.25), 0 5px 15px rgba(0,0,0,0.1); overflow: hidden; border: 4px solid #7C3AED; transform: rotate(-3deg);">
                    <img src="https://www.lessoncraftstudio.com/samples/english/cryptogram/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div style="position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); background: #7C3AED; padding: 6px 18px; border-radius: 15px;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: white;">PUZZLE</span>
                </div>
            </div>

            <!-- Plus sign -->
            <div style="width: 50px; height: 50px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(249,115,22,0.4);">
                <span style="font-size: 30px; color: white; font-weight: bold;">+</span>
            </div>

            <!-- Answer Key -->
            <div style="position: relative;">
                <div style="width: 260px; height: 340px; background: white; border-radius: 10px; box-shadow: 0 10px 35px rgba(249,115,22,0.25), 0 5px 15px rgba(0,0,0,0.1); overflow: hidden; border: 4px solid #F97316; transform: rotate(3deg);">
                    <img src="https://www.lessoncraftstudio.com/samples/english/cryptogram/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div style="position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); background: #F97316; padding: 6px 18px; border-radius: 15px;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: white;">ANSWER KEY</span>
                </div>
            </div>
        </div>

        <!-- Feature Cards - Bottom Row -->
        <div style="position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px;">
            <!-- Critical Thinking -->
            <div style="background: white; padding: 16px 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(124,58,237,0.15); border: 2px solid rgba(124,58,237,0.2); display: flex; align-items: center; gap: 10px;">
                <div style="width: 40px; height: 40px; background: linear-gradient(145deg, #7C3AED 0%, #6D28D9 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <span style="font-size: 20px;">🧠</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #5B21B6; line-height: 1.2;">Critical<br>Thinking</span>
            </div>

            <!-- Letter Recognition -->
            <div style="background: white; padding: 16px 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(249,115,22,0.15); border: 2px solid rgba(249,115,22,0.2); display: flex; align-items: center; gap: 10px;">
                <div style="width: 40px; height: 40px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <span style="font-size: 20px;">🔤</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #C2410C; line-height: 1.2;">Letter<br>Recognition</span>
            </div>

            <!-- Reading Comprehension -->
            <div style="background: white; padding: 16px 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(124,58,237,0.15); border: 2px solid rgba(124,58,237,0.2); display: flex; align-items: center; gap: 10px;">
                <div style="width: 40px; height: 40px; background: linear-gradient(145deg, #7C3AED 0%, #6D28D9 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <span style="font-size: 20px;">📖</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #5B21B6; line-height: 1.2;">Reading<br>Comprehension</span>
            </div>

            <!-- Visual Processing -->
            <div style="background: white; padding: 16px 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(249,115,22,0.15); border: 2px solid rgba(249,115,22,0.2); display: flex; align-items: center; gap: 10px;">
                <div style="width: 40px; height: 40px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <span style="font-size: 20px;">👁️</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #C2410C; line-height: 1.2;">Visual<br>Processing</span>
            </div>
        </div>

        <!-- "Answer Keys Included" floating badge -->
        <div style="position: absolute; top: 410px; right: 50px; transform: rotate(8deg);">
            <div style="background: linear-gradient(145deg, #10B981 0%, #059669 100%); padding: 12px 22px; border-radius: 20px; box-shadow: 0 5px 20px rgba(16,185,129,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; color: white;">✓ Answer Keys Included</span>
            </div>
        </div>

    </div>
</body>
</html>
