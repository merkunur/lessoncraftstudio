compositionalRationale:
  en: |
    Primary strand: early-literacy / phonics-decoding (vowel-team
    word reading; canonical strand-advancement 3 → 4). Secondary
    strand: phonological awareness (kids hear the long-vowel sounds
    produced by vowel teams). Tertiary strand: vocabulary acquisition
    (vowel-team anchor words drawn from familiar K-3 vocabulary).

    Architectural significance: phonics-decoding strand-advancement
    (3 → 4 base canonical authored). Reading-CVCe at Arc 13 introduced
    long-vowel patterns via silent-e; vowel-teams extend long-vowel
    work to a second canonical multi-letter pattern (ai/ay/ee/ea/
    oa/ow/ie/igh). Phonetic-reciprocity-with-spelling: vowel-team
    decoding work pairs with future spell-vowel-team-words (NOT in
    canonical 5-target spelling-and-encoding strand; could surface as
    Phase 2+ candidate per learning-targets.json doctrine_notes).

    Pair-coherent ship pattern (per Arc 19 cadence): paired with
    read-r-controlled-vowels in this Phase 1.4 commission. Together
    the pair completes the long-vowel + r-controlled phonics-decoding
    extension for English-CVC-pattern locales.

    Distinctive composition: 2 matching + 2 word-guess + 1 word-
    scramble. Word-guess as cloze-decoding practice surfaces the
    vowel-team pattern in fill-in-the-blank context; word-scramble
    reinforces the team-stays-together ordering.

    Class B FLEXIBLE substrate: composes against animals + foods
    image-library themes (vowel-team-rich vocabulary: rain, train,
    bee, tree, boat, goat, pie, light, day, hay, sea, beach, soap,
    coat). Manipulative-cut-outs in variety mode supplies the 4
    canonical vowel-team patterns (long-A, long-E, long-O, long-I)
    as letter-tile prompt set.

    K-3 multilingual classroom relevance: vowel-team phonics is
    English-CVC-pattern-specific. Other locales use different
    long-vowel marking strategies — Spanish has open-syllable
    structure (no long-vowel-by-team need); Italian + Portuguese
    use accent marks (não, à); Finnish uses doubled-vowel-letters
    (tuli vs tuuli) for length contrast; German uses h-as-vowel-
    lengthener (Bahn) + doubled-vowels (Boot). Locale-variant
    sparse-overrides per Phase 3 will reframe vowel-pattern work
    against locale-canonical orthographic conventions, not transpose
    English vowel-teams.

