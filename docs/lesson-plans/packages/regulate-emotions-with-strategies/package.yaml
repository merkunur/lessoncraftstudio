assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify 4 of 5 calming strategies by name in 7 of 10
        trials.
      - Demonstrate deep-breathing technique correctly in 9 of 10
        trials (4-count inhale + 4-count exhale).
      - Match scenario to appropriate strategy in 7 of 10 trials.
      - Use a calming strategy independently when emotionally
        activated (teacher observation) in 4 of 5 weekly trials.

    Differentiation:
    - Pre-K: 2 strategies only (deep breathing + ask for help);
      guided practice.
    - K: 4 strategies; some independent use.
    - Grade 1+: all 5 strategies; independent use expected; bridge
      to peer-regulation-support work + conflict-resolution.

