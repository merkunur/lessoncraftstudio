<!DOCTYPE html>

            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 30px; background: white; transform-origin: left center; transform: rotate(180deg); border-radius: 0 15px 15px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 30px; background: white; transform-origin: left center; transform: rotate(210deg); border-radius: 0 15px 15px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 30px; background: white; transform-origin: left center; transform: rotate(240deg); border-radius: 0 15px 15px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 30px; background: white; transform-origin: left center; transform: rotate(270deg); border-radius: 0 15px 15px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 30px; background: white; transform-origin: left center; transform: rotate(300deg); border-radius: 0 15px 15px 0;"></div>

        <div style="position: absolute; top: 200px; right: 90px; width: 14px; height: 14px; background: #FFD54F; border-radius: 50%; opacity: 0.75;"></div>
        <div style="position: absolute; top: 80px; right: 200px; width: 10px; height: 10px; background: #69F0AE; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 200px; left: 100px; width: 13px; height: 13px; background: #FF8A80; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 280px; right: 80px; width: 11px; height: 11px; background: #B388FF; border-radius: 50%; opacity: 0.7;"></div>

        <div style="position: absolute; top: 500px; right: 55px; width: 15px; height: 15px; background: #84FFFF; border-radius: 50%; opacity: 0.6;"></div>

        <!-- Confetti - rectangles -->

        <div style="position: absolute; top: 90px; right: 120px; width: 16px; height: 7px; background: #FFD54F; border-radius: 3px; transform: rotate(-20deg); opacity: 0.7;"></div>
        <div style="position: absolute; top: 280px; left: 60px; width: 14px; height: 6px; background: #FF8A80; border-radius: 3px; transform: rotate(55deg); opacity: 0.65;"></div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 22px; left: 28px; z-index: 100; transform: rotate(-5deg);">

                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 1px;">GRATIS</span>

        <!-- Kinder lieben es! Badge -->
        <div style="position: absolute; top: 22px; right: 28px; z-index: 100; transform: rotate(5deg);">

        <!-- Title - Comic burst -->
        <div style="position: absolute; top: 70px; left: 50%; transform: translateX(-50%); z-index: 40;">

            <div style="background: white; border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%; padding: 22px 60px 28px 60px; box-shadow: 0 8px 35px rgba(0,0,0,0.15); border: 5px solid #FFD54F; text-align: center;">

            </div>
        </div>

        <!-- Main worksheet -->
        <div style="position: absolute; top: 330px; left: 50%; transform: translateX(-50%); z-index: 30;">
            <img src="https://www.lessoncraftstudio.com/samples/german/more%20less/sample-1.jpeg" style="width: 280px; height: 363px; object-fit: cover; border-radius: 14px; border: 7px solid white; box-shadow: 0 20px 55px rgba(0,0,0,0.35), 0 0 40px rgba(124,77,255,0.15);">
        </div>

        <!-- Speech bubble - left -->
        <div style="position: absolute; top: 390px; left: 55px; z-index: 35;">
            <div style="background: white; border-radius: 20px; padding: 12px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #7C4DFF; position: relative; max-width: 150px;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #7C4DFF;">Ich hab mehr!</span>
                <!-- Speech tail -->
                <div style="position: absolute; bottom: -12px; right: 25px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 14px solid white;"></div>
                <div style="position: absolute; bottom: -16px; right: 24px; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 15px solid #7C4DFF; z-index: -1;"></div>
            </div>
        </div>

        <!-- Speech bubble - right -->
        <div style="position: absolute; top: 440px; right: 55px; z-index: 35;">
            <div style="background: white; border-radius: 20px; padding: 12px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #FF4081; position: relative; max-width: 160px;">

                <div style="position: absolute; bottom: -12px; left: 25px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 14px solid white;"></div>
                <div style="position: absolute; bottom: -16px; left: 24px; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 15px solid #FF4081; z-index: -1;"></div>

            <div style="background: linear-gradient(145deg, #FDD835, #FFB300); padding: 10px 22px; border-radius: 30px; box-shadow: 0 6px 20px rgba(255,179,0,0.45); border: 3px solid white;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: #3E2723;">SO VIEL SPASS!</span>

        </div>

        <!-- Bottom fade to white + badges -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.95) 50%); z-index: 40;">
            <div style="position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px;">
                <div style="background: linear-gradient(145deg, #7C4DFF, #651FFF); padding: 12px 24px; border-radius: 28px; box-shadow: 0 5px 18px rgba(124,77,255,0.4); border: 3px solid rgba(255,255,255,0.5);">

                </div>
                <div style="background: linear-gradient(145deg, #FF4081, #F50057); padding: 12px 24px; border-radius: 28px; box-shadow: 0 5px 18px rgba(245,0,87,0.35); border: 3px solid rgba(255,255,255,0.5);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: white;">Vorschule</span>
