# Teaching package — partition shapes into halves and quarters (pt sparse-override)
# Arc 18 Phase 1.1 (19th-consecutive pt cadence per Arc 7+ convention). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF01MA13 (geometria; comparar e ordenar figuras geométricas) + EF02MA15 (identificar e nomear figuras planas; reconhecer partes iguais).

targetSlug: partition-shape-halves-quarters
language: pt

title:
  pt: "Repartir formas em metades e quartos — cortar uma forma em partes iguais"

description:
  pt: "Pacote de matemática + geometria para o 1.º ano do ensino fundamental, ensinando crianças a REPARTIR formas geométricas simples (círculos, quadrados, retângulos) em 2 partes iguais (METADES) ou 4 partes iguais (QUARTOS). Apoia-se no Arc 17 P1.3 compose-shapes-from-parts (onde as crianças aprenderam que as formas têm estrutura de partes-todo) revertendo a ação: repartir é decompor com a RESTRIÇÃO DE PARTES IGUAIS. As crianças aprendem a diferença entre cortar uma forma em peças QUAISQUER e cortar em peças IGUAIS — peças iguais ganham um NOME (duas peças iguais = METADES; quatro peças iguais = QUARTOS). Por §A.13.30 enquadramento informal K-1: o trabalho de repartição K-1 introduz o VOCABULÁRIO das partes iguais + a estrutura visual de formas repartidas; a notação fracionária formal (1/2, 1/4) é conteúdo do 3.º ano em diante e está explicitamente fora deste escopo. Alinhamento BNCC: EF01MA13 + EF02MA15. Parceiro do par: identify-fractions-half-third-quarter (slot 4 da Fase 1.1; estende o trabalho de nomeação de partes iguais também para os TERÇOS, conforme CCSS.2.G.A.3 no nível do 2.º ano). O par satura o strand de geometria em 8/8 — o 23.º strand saturado no catálogo. 5 exercícios + 7 materiais imprimíveis ao longo de 1 semana."

structure:
  warmup:
    body: |
      Atividade introdutória com toda a turma e formas de
      papel. Você segura um círculo de papel. "Vejam o que
      acontece quando corto este círculo em DUAS partes
      iguais." Você dobra o círculo exatamente ao meio e
      corta na dobra. "Duas partes iguais. Cada parte é uma
      METADE do círculo inteiro. Duas metades formam um
      inteiro." Você junta as duas metades de volta. A turma
      repete em coro: "Duas metades formam um inteiro!"
      Depois, com um quadrado: você dobra o quadrado uma vez
      e corta (dois retângulos — duas METADES do quadrado);
      depois dobra novamente perpendicular e corta as duas
      metades (quatro quadrados pequenos — quatro QUARTOS do
      quadrado original). "Quatro partes iguais. Cada parte
      é um QUARTO do quadrado inteiro. Quatro quartos formam
      um inteiro." Ênfase do padrão: "Quando cortamos uma
      forma em partes IGUAIS, as partes ganham um NOME. Duas
      partes iguais são METADES. Quatro partes iguais são
      QUARTOS. Partes desiguais não recebem esses nomes —
      são apenas pedaços."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de repartição com peças de
      papel. Cada dupla recebe um saco com formas inteiras
      (círculos, quadrados, retângulos em 3 tamanhos) + as
      versões repartidas (metades de cada forma; quartos de
      cada forma). A dupla joga o desafio de
      correspondência: você nomeia uma repartição (ex.:
      "mostrem-me as metades de um círculo"); as crianças
      encontram as duas peças de meio-círculo e as
      reorganizam de volta na forma do círculo inteiro.
      Depois "mostrem-me os quartos de um quadrado" e as
      crianças organizam quatro quadradinhos pequenos na
      forma do quadrado original. Recapture erros
      demonstrando: "Estas duas peças têm TAMANHOS DIFERENTES
      — não são metades. Metades têm de ser IGUAIS. Deixe-me
      mostrar as peças iguais." Tempo livre no fim: as
      crianças combinam todos os inteiros com suas formas
      repartidas no saco. A remontagem manual é
      determinante — as crianças veem que as partes SÃO o
      inteiro (apenas cortado) ao recompô-lo fisicamente.
  scaffold:
    body: |
      Rotação por estações. Estação 1: atividade de
      correspondência — combinar cada forma repartida
      (círculo cortado em duas metades; quadrado cortado em
      quatro quartos; etc.) com sua contraparte inteira.
      Estação 2: atividade missing-pieces — as crianças veem
      uma repartição parcial (uma metade-círculo desenhada;
      uma metade faltando) e identificam qual peça completa
      o inteiro. Estação 3: atividade grid-match — encaixar
      peças repartidas em uma grade para reconstruir a forma
      inteira. Estação 4: atividade picture-sort — separar
      formas repartidas nas categorias "cortadas em metades"
      vs "cortadas em quartos". O picture-sort da estação 4
      revela a estrutura de contagem das partes iguais
      (metades = 2; quartos = 4).
  closure:
    body: |
      Recapitulação rápida com toda a turma. Você mostra
      formas no quadro; a turma nomeia em coro a repartição.
      "Círculo cortado em duas partes iguais — metades!
      Quadrado cortado em quatro partes iguais — quartos!
      Retângulo cortado em duas partes iguais — metades!"
      Você faz a pergunta diagnóstica: "E se eu cortar uma
      forma em DUAS peças que NÃO são iguais — são metades?"
      (Turma: Não! São só pedaços. Metades têm de ser
      iguais.) Aponte adiante: "Hoje repartimos formas em
      metades e quartos — peças iguais com nome. A seguir,
      vamos aprender como chamar essas peças iguais quando
      as vemos SOZINHAS (sem ver o corte acontecer) + vamos
      conhecer um novo nome de partes iguais: TERÇOS (três
      partes iguais). Mais para a frente na escola, metades,
      quartos e terços vão se tornar FRAÇÕES — escritas com
      números. Por agora, os nomes e a estrutura visual são
      o que estamos aprendendo."

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Identificar um círculo, quadrado ou retângulo
        repartido em 2 partes iguais como 'metades' em 7 de
        10 tentativas.
      - Identificar um círculo, quadrado ou retângulo
        repartido em 4 partes iguais como 'quartos' em 7 de
        10 tentativas.
      - Distinguir a repartição em partes iguais (metades,
        quartos) da repartição em partes desiguais (apenas
        pedaços, sem nome) em 6 de 10 tentativas.
      - Reconstruir uma forma inteira a partir de suas
        partes repartidas (ex.: duas meias-círculos em um
        círculo inteiro; quatro quartos de quadrado em um
        quadrado inteiro) em 7 de 10 tentativas.
      - Usar o vocabulário 'metades' / 'quartos' / 'partes
        iguais' / 'inteiro' corretamente em 6 de 10
        tentativas de produção verbal.

    Diferenciação:
    - Pré-escola: pular a repartição inteiramente; revisar
      antes o reconhecimento de formas inteiras (per Arc 9
      identify-2d-shapes-basic).
    - Educação infantil (5-7 anos): introduzir apenas as
      metades (pular os quartos); usar dobragem e
      manipulação de peças recortadas como modo principal;
      adiar a recordação formal do vocabulário.
    - 1.º ano do ensino fundamental: fluência completa em
      metades + quartos; tanto identificação visual quanto
      nomeação verbal e reconstrução manual praticadas.
    - 2.º ano em diante: estender aos terços (per parceiro
      do par identify-fractions-half-third-quarter no slot
      4); ponte para CCSS.2.G.A.3 'repartir em 2, 3 ou 4
      partes iguais'. Notação fracionária formal (1/2, 1/4,
      1/3) permanece explicitamente adiada para o 3.º ano em
      diante per CCSS.3.NF.A.

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en).
    Os campos materials, composedExercises,
    curriculumStandards e learningObjectives são herdados
    do package.yaml via merge sparse-override e não são
    repetidos aqui per a convenção Arc 7+.

    Vocabulário pt-BR canônico para repartição:
    - 'repartir' (verbo de ação — equivalente a partition em
      en); alternativas: 'dividir em partes iguais', 'cortar
      em pedaços iguais'
    - 'metade' / 'metades' (substantivo); 'meia/meio' como
      adjetivo (meia-laranja, meio-círculo)
    - 'quarto' / 'quartos' (substantivo); alternativa
      'quarta parte' em registro mais formal — pt-BR K-1
      prefere 'quarto'
    - 'terço' / 'terços' (não usado neste pacote; conteúdo
      do pacote parceiro identify-fractions-half-third-
      quarter)
    - 'partes iguais' (frase canônica; a estrutura central
      do conceito de repartição)
    - 'inteiro' (whole — o todo antes da repartição)

    Convenção pt-BR vs Portugal: ambas as variantes usam
    'metade' + 'quarto' identicamente no registro K-1; não
    há divergência regional significativa para este
    conteúdo. A adaptação locale-específica concentra-se na
    estrutura sintática de instrução (uso de 'você' formal
    para o professor; uso de imperativo direto para
    instruções à turma — 'vejam', 'mostrem', 'cortem').

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF01MA13 ('Comparar comprimentos de dois ou mais objetos
    de forma direta... e indiretamente, por meio de uma
    terceira figura ou a unidade de medida convencional ou
    não') + EF02MA15 ('Reconhecer, comparar e nomear figuras
    planas') cobrem o trabalho de geometria + repartição
    do pacote. O foco BNCC do 1.º + 2.º ano no
    reconhecimento de figuras planas + suas partes
    iguais alinha-se naturalmente com o conteúdo
    informal K-1 deste pacote (vocabulário + estrutura
    visual; notação fracionária formal apenas a partir do
    5.º ano EF05MA03).

    Material concreto + manipulação manual é
    pedagogicamente determinante na cultura escolar
    brasileira K-1 — o ensino fundamental brasileiro
    valoriza a aprendizagem 'pé no chão' antes da abstração
    simbólica. O manipulative-cut-outs com vocabKeys
    enumerando peças fracionárias (whole-circle, half-
    circle, quarter-circle, etc.) sustenta exatamente esse
    modo de ensino: as crianças cortam, dobram, e remontam
    formas físicas antes de qualquer trabalho com
    representação simbólica.

    Por §A.13.30 enquadramento informal K-1: este pacote
    NÃO ensina notação fracionária 1/2 + 1/4 — apenas o
    vocabulário (metade, quarto, partes iguais) + a
    estrutura visual. Famílias brasileiras frequentemente
    perguntam por notação fracionária mais cedo; o parent-
    take-home-letter material explicita que o
    desenvolvimento de fração simbólica tem seu momento
    canônico no 3.º + 4.º ano do EF.
