compositionalRationale:
  en: |
    Primary strand: early-literacy / writing-composition (single-word
    labeling). Secondary strand: spelling-and-encoding (kids encode the
    target word's sounds into letters). Tertiary strand: vocabulary +
    letter-recognition (anchor words drawn from familiar vocabulary).

    Architectural significance: deepens writing-composition strand 1/8
    → 2/8. Builds on Arc 12 write-own-name (kids' first written word →
    kids' first written word that's NOT their own name). Reciprocity
    pair with Arc 13 predict-from-picture-cue (comprehend-from-image /
    produce-from-image): the same image-as-prompt mechanism powers
    receptive comprehension AND productive writing.

    Distinctive composition: tracing-heavy material set (vocabulary-
    tracing-strips with dotted-trace + writing-line) supporting the
    spell-then-write progression. word-scramble exercise reinforces
    letter-order-matters at the writing-composition boundary.

    K-3 multilingual classroom relevance: labeling-with-one-word is
    universal across all 11 platform locales but spelling complexity
    varies (en cat = 3 letters; de Katze = 5 letters; fi kissa = 5
    letters with double-consonant). Locale-variant arcs may differentiate
    target word-length per locale.

