# Teaching package — point to a named vehicle (receptive)
# Arc 6 Phase 1 (Path B) — early-literacy / vocabulary-acquisition strand.
# Receptive variant of Arc 2's identify-and-name-vehicles (productive).
# 10-key cluster CLEAN against IMAGE_VOCABULARY (car/bus/truck/bicycle/
# motorcycle/airplane/boat/train/helicopter/ambulance). Same receptive-
# pairing pattern as Arc 5 Phase 3 + Arc 6 Phase 1 companions.

targetSlug: point-to-named-vehicle
language: en
title:
  en: "Vehicles (Receptive) — point to the named vehicle"
description:
  en: "Pre-K to K vocabulary-acquisition package teaching receptive recognition of 10 common vehicles: car, bus, truck, bicycle, motorcycle, airplane, boat, train, helicopter, ambulance. Receptive variant of identify-and-name-vehicles (Arc 2 productive). Vehicle vocabulary is high-interest content in K-3 classrooms; receptive comprehension precedes productive naming. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher places 10 large vehicle picture-
      cards on the carpet or board. Names each vehicle in target language;
      class points to the matching card chorally. Optional: vehicle-sound
      game ("the vehicle that goes 'beep beep' is the {car}; the vehicle
      that flies is the {airplane}") — bridges receptive recognition with
      sensory + functional anchors. Pin to "Vehicles" word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with picture cards. Teacher names a vehicle in
      target language; class points to the matching picture-card. Pair
      work: kid A names a vehicle; kid B points to it on a transportation-
      scene poster (or picture-card set). Optional extension: kids share
      whether they have ridden each vehicle ("I ride the bus to school";
      "I rode an airplane on vacation") — anchors recognition in lived
      experience.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (image-name matching
      reinforces vehicle-image to vehicle-word). Station 2: shadow-match
      worksheet (vehicle silhouette to vehicle — pure visual recognition
      + receptive vocabulary). Station 3: manipulative cut-outs counting
      and sorting (kids count out specific named vehicles: "Show me 3
      cars; show me 2 buses"; or sort vehicles by environment — land/sea/
      air; bridges to identify-transportation-types per Phase 2).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names vehicles rapidly; kids point
      to the matching card on the carpet. Forward-pointer: "Today we
      practiced understanding vehicle words. When we come back to vehicles
      next, we'll start saying the words ourselves and use them to talk
      about how we get around."

