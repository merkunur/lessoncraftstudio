<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. The colloquial time engine
       (TIME_RULES) lives inline — the moat in one file. -->

  <script src="/mini-tools/learning-clock.js?v=3"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=sv  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1 / ?embed=compact
    LCS.mount(LearningClock, { mount: '#lcs-root' });
  </script>
</body>
