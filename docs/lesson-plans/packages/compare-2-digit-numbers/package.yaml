# Teaching package — compare 2-digit numbers
# Arc 17 Phase 1.4 (math / place-value canonical 2/3 → 3/3 SAT close — closes place-value canonical sub-track at 22nd saturated strand at canonical-sub-track level). Closes the Phase 1.3 sibling cluster (decompose-tens-and-ones-within-19 + identify-tens-and-ones-2-digit + this) into the full canonical place-value introduction sequence.

targetSlug: compare-2-digit-numbers
language: en
title:
  en: "Compare Two-Digit Numbers — look at the tens first"

description:
  en: "Grade 1 math package teaching kids to compare two-digit numbers using place-value structure. To decide which is bigger (47 vs 53), compare the TENS first — 5 tens (50) is more than 4 tens (40), so 53 > 47 regardless of the ones digit. When tens are equal (47 vs 43), THEN compare the ones — 7 > 3, so 47 > 43. Builds on the Phase 1.3 sibling cluster (decompose-tens-and-ones-within-19 + identify-tens-and-ones-2-digit) by USING the tens-and-ones decomposition kids learned there as the operational basis for comparison. CCSS.1.NBT.B.3 primary anchor ('Compare two two-digit numbers based on meanings of the tens and ones digits'). Closes math/place-value canonical sub-track at 3/3 SAT — the 22nd saturated strand at canonical sub-track level on the platform. After this package the K-3 place-value canonical work is complete (operational extensions like compare-by-tens-and-ones and 3-digit comparison are post-K-3 / extension territory). 5 worksheet exercises + 7 printable materials over a 1-week unit. Place-value-mat material deferred to Pillar 5 per Arc 17 Phase 0 §8 (C); matching-mat + manipulative-cut-outs in base-ten-blocks mode carry the place-value enactment role."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + place-value comparison introduction.
      Teacher writes 47 vs 53 on the board, vertically aligned.
      "Which number is BIGGER? Let's use what we know about
      TENS and ONES. 47 = 4 tens + 7 ones. 53 = 5 tens + 3
      ones. Look at the TENS first. 4 tens is 40. 5 tens is
      50. 50 is bigger than 40, so 53 is bigger than 47.
      Even though 7 ones is bigger than 3 ones, the TENS
      decide first." Teacher writes: 53 > 47 (using the
      'mouth opens to the bigger number' notation kids may
      already know from earlier work). Teacher repeats with
      29 vs 31 (tens: 2 vs 3 → 31 wins; ones don't matter)
      and 80 vs 78 (tens: 8 vs 7 → 80 wins; ones-comparison
      9-vs-0 is irrelevant). Then a same-tens case: 47 vs
      43. "Same tens! 4 = 4. So we look at the ONES. 7 vs 3:
      7 > 3, so 47 > 43." Pattern emphasis: "Tens FIRST. Only
      compare ones if tens are equal."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + base-ten comparison routine. Each pair
      receives a 'comparison mat' (two side-by-side spaces
      for building two numbers) + animal-themed base-ten
      manipulative cut-outs (ten-sticks + single counters).
      Pair plays the comparison game: teacher gives two
      2-digit numbers (e.g., 47 and 53); kid A builds the
      first number with manipulatives (4 ten-sticks + 7
      single counters); kid B builds the second number (5
      ten-sticks + 3 single counters). Together they
      compare the TEN-STICKS first — whoever has more ten-
      sticks built the bigger number. They write the
      comparison: 47 < 53 (or 53 > 47). Pair swaps + repeats
      with new pairs: 29 vs 31, 80 vs 78, 47 vs 43, 60 vs
      66, 91 vs 89. Recast errors with tens-cue ("count the
      ten-sticks first — who has MORE ten-sticks? That
      number is bigger, no matter how many ones"). The
      manipulatives make the tens-first comparison visible
      — kids SEE that 5 ten-sticks dominates 4 ten-sticks
      regardless of how many ones sit beside each.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: more-less app (the
      canonical comparison app — compare two numbers via
      a simple comparison interface). Station 2: matching
      activity — match each two-digit-number pair (47 vs
      53; 80 vs 78; 47 vs 43) to its comparison statement
      (47<53; 80>78; 47>43). Station 3: math-puzzle (find
      missing relation: 47 ? 53; ? > 47 — which number
      could fit). Station 4: math-worksheet with mixed
      2-digit comparison problems. The more-less app at
      position 1 + 5 (assessment) is load-bearing — it's
      the canonical comparison-mechanic app.
  closure:
    durationMinutes: 5
    body: |
      Whole-class place-value comparison quick-recall.
      Teacher presents pairs; class collectively names the
      bigger number + reasoning. "47 vs 53? — 53 is bigger,
      5 tens beats 4 tens." "80 vs 78? — 80 is bigger, 8
      tens beats 7 tens." "47 vs 43? — 47 is bigger, same
      tens (4=4) but 7 ones beats 3 ones." Forward-pointer:
      "Today we closed our two-digit place-value work — we
      can DECOMPOSE numbers (Phase 1.3 first sibling
      package), IDENTIFY their tens and ones (second
      sibling), and now COMPARE them (this package). The
      same tens-first idea grows: when we meet THREE-DIGIT
      numbers (Grade 2), we'll look at HUNDREDS first, then
      tens, then ones — same place-value structure, more
      digits. Next we'll meet bigger numbers + measurement
      work."

