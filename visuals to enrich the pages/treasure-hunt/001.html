<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Treasure Hunt - Hero Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(145deg, #0B3D5B 0%, #006064 55%, #004D40 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Radial gold glow from center -->
        <div style="
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            width: 800px;
            height: 800px;
            background: radial-gradient(ellipse, rgba(212,160,23,0.18) 0%, rgba(212,160,23,0.05) 40%, transparent 70%);
            pointer-events: none;
        "></div>

        <!-- Dotted trail path with gold coin dots -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 1000 1000">
            <!-- Main winding trail -->
            <path d="M 80 920 Q 120 800 200 720 Q 300 620 250 520 Q 200 420 300 340 Q 420 240 550 260 Q 680 280 780 200 Q 860 140 940 80"
                  stroke="#D4A017" stroke-width="4" fill="none" stroke-dasharray="18 12" opacity="0.35"/>
            <!-- Secondary trail -->
            <path d="M 900 950 Q 920 840 880 740 Q 840 640 870 540"
                  stroke="#FFB300" stroke-width="3" fill="none" stroke-dasharray="14 10" opacity="0.25"/>
            <!-- Gold coin dots along trail -->
            <circle cx="130" cy="860" r="6" fill="#D4A017" opacity="0.5"/>
            <circle cx="220" cy="740" r="5" fill="#FFB300" opacity="0.5"/>
            <circle cx="260" cy="620" r="6" fill="#D4A017" opacity="0.45"/>
            <circle cx="230" cy="500" r="5" fill="#FFB300" opacity="0.4"/>
            <circle cx="310" cy="380" r="6" fill="#D4A017" opacity="0.45"/>
            <circle cx="460" cy="270" r="5" fill="#FFB300" opacity="0.4"/>
            <circle cx="620" cy="270" r="6" fill="#D4A017" opacity="0.45"/>
            <circle cx="760" cy="210" r="5" fill="#FFB300" opacity="0.4"/>
            <circle cx="880" cy="120" r="6" fill="#D4A017" opacity="0.45"/>
        </svg>

        <!-- Decorative compass rose - top center -->
        <div style="
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.18;
            z-index: 5;
        ">
            <svg width="120" height="120" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="46" stroke="#F5E6CA" stroke-width="2" fill="none"/>
                <circle cx="50" cy="50" r="36" stroke="#F5E6CA" stroke-width="1" fill="none"/>
                <!-- Cardinal ticks -->
                <line x1="50" y1="4" x2="50" y2="18" stroke="#F5E6CA" stroke-width="3"/>
                <line x1="50" y1="82" x2="50" y2="96" stroke="#F5E6CA" stroke-width="3"/>
                <line x1="4" y1="50" x2="18" y2="50" stroke="#F5E6CA" stroke-width="3"/>
                <line x1="82" y1="50" x2="96" y2="50" stroke="#F5E6CA" stroke-width="3"/>
                <!-- Diagonal ticks -->
                <line x1="17" y1="17" x2="25" y2="25" stroke="#F5E6CA" stroke-width="1.5"/>
                <line x1="83" y1="17" x2="75" y2="25" stroke="#F5E6CA" stroke-width="1.5"/>
                <line x1="17" y1="83" x2="25" y2="75" stroke="#F5E6CA" stroke-width="1.5"/>
                <line x1="83" y1="83" x2="75" y2="75" stroke="#F5E6CA" stroke-width="1.5"/>
                <!-- North pointer -->
                <polygon points="50,14 45,38 55,38" fill="#D4A017"/>
                <polygon points="50,86 45,62 55,62" fill="#F5E6CA" opacity="0.6"/>
                <text x="50" y="11" text-anchor="middle" fill="#F5E6CA" font-size="9" font-weight="bold" font-family="Fredoka, sans-serif">N</text>
                <text x="50" y="99" text-anchor="middle" fill="#F5E6CA" font-size="9" font-weight="bold" font-family="Fredoka, sans-serif">S</text>
                <text x="99" y="53" text-anchor="end" fill="#F5E6CA" font-size="9" font-weight="bold" font-family="Fredoka, sans-serif">E</text>
                <text x="2" y="53" text-anchor="start" fill="#F5E6CA" font-size="9" font-weight="bold" font-family="Fredoka, sans-serif">W</text>
            </svg>
        </div>

        <!-- FREE Badge - Top Left -->
        <div style="
            position: absolute;
            top: 35px;
            left: 35px;
            transform: rotate(-8deg);
            z-index: 20;
        ">
            <div style="
                width: 90px;
                height: 90px;
                background: linear-gradient(135deg, #FFB300 0%, #D4A017 100%);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 6px 25px rgba(255,179,0,0.5), inset 0 2px 0 rgba(255,255,255,0.3);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 30px;
                    color: #0B3D5B;
                    letter-spacing: 1px;
                ">FREE</span>
            </div>
        </div>

        <!-- Grade Badge - Top Right -->
        <div style="
            position: absolute;
            top: 45px;
            right: 35px;
            background: linear-gradient(135deg, #F5E6CA 0%, #E8D5B0 100%);
            color: #0B3D5B;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 22px;
            padding: 10px 22px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            z-index: 20;
        ">GRADES K-2</div>

        <!-- Main Title -->
        <div style="
            position: absolute;
            top: 140px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 72px;
                color: white;
                margin: 0;
                text-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 2px 0 rgba(0,0,0,0.2);
                letter-spacing: 2px;
            ">TREASURE</h1>
            <h2 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 68px;
                color: #FFB300;
                margin: -10px 0 0 0;
                text-shadow: 0 3px 15px rgba(0,0,0,0.3), 0 1px 0 rgba(0,0,0,0.15);
                letter-spacing: 2px;
            ">HUNT</h2>
            <p style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 30px;
                color: #F5E6CA;
                margin: 2px 0 0 0;
                text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            ">Following Directions Worksheets</p>
        </div>

        <!-- 3-Worksheet Fan Display -->
        <div style="
            position: absolute;
            top: 380px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 420px;
            z-index: 15;
        ">
            <!-- Left worksheet (answer key) - offset left -->
            <div style="
                position: absolute;
                left: 60px;
                top: 30px;
                z-index: 13;
            ">
                <div style="
                    background: white;
                    padding: 8px;
                    border-radius: 10px;
                    box-shadow: 0 12px 35px rgba(0,0,0,0.3);
                ">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/treasure%20hunt/sample-1-answer.jpeg"
                        alt="Treasure Hunt Answer Key"
                        style="
                            width: 200px;
                            height: 259px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 6px;
                            display: block;
                        "
                    />
                </div>
            </div>

            <!-- Center worksheet (main, largest, gold border) -->
            <div style="
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                top: 0;
                z-index: 15;
            ">
                <div style="
                    background: linear-gradient(135deg, #D4A017, #FFB300);
                    padding: 6px;
                    border-radius: 14px;
                    box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px rgba(212,160,23,0.3);
                ">
                    <div style="
                        background: white;
                        padding: 8px;
                        border-radius: 10px;
                    ">
                        <img
                            src="https://www.lessoncraftstudio.com/samples/english/treasure%20hunt/sample-1.jpeg"
                            alt="Treasure Hunt Worksheet"
                            style="
                                width: 260px;
                                height: 336px;
                                object-fit: cover;
                                object-position: top;
                                border-radius: 6px;
                                display: block;
                            "
                        />
                    </div>
                </div>
            </div>

            <!-- Right worksheet - offset right -->
            <div style="
                position: absolute;
                right: 60px;
                top: 30px;
                z-index: 13;
            ">
                <div style="
                    background: white;
                    padding: 8px;
                    border-radius: 10px;
                    box-shadow: 0 12px 35px rgba(0,0,0,0.3);
                ">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/treasure%20hunt/sample-2.jpeg"
                        alt="Treasure Hunt Cardinal Directions"
                        style="
                            width: 200px;
                            height: 259px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 6px;
                            display: block;
                        "
                    />
                </div>
            </div>
        </div>

        <!-- Bottom Ribbon Banner -->
        <div style="
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        ">
            <div style="
                background: linear-gradient(135deg, #D4A017 0%, #B8860B 100%);
                padding: 14px 50px;
                border-radius: 8px;
                box-shadow: 0 6px 20px rgba(212,160,23,0.4);
                position: relative;
            ">
                <!-- Ribbon notch left -->
                <div style="position: absolute; left: -12px; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 14px solid transparent; border-bottom: 14px solid transparent; border-right: 12px solid #D4A017;"></div>
                <!-- Ribbon notch right -->
                <div style="position: absolute; right: -12px; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 14px solid transparent; border-bottom: 14px solid transparent; border-left: 12px solid #B8860B;"></div>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 24px;
                    color: white;
                    letter-spacing: 2px;
                    text-shadow: 0 2px 4px rgba(0,0,0,0.3);
                ">FIND THE HIDDEN TREASURE!</span>
            </div>
        </div>

        <!-- Bottom Pills Row -->
        <div style="
            position: absolute;
            bottom: 35px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 14px;
            z-index: 20;
        ">
            <div style="background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.3); padding: 8px 18px; border-radius: 25px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: white;">5x5 Grid</span>
            </div>
            <div style="background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.3); padding: 8px 18px; border-radius: 25px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: white;">Answer Keys</span>
            </div>
            <div style="background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.3); padding: 8px 18px; border-radius: 25px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: white;">Multiple Themes</span>
            </div>
            <div style="background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.3); padding: 8px 18px; border-radius: 25px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: white;">Print Ready</span>
            </div>
        </div>

        <!-- Decorative gold sparkles -->
        <div style="position: absolute; top: 350px; left: 40px; width: 8px; height: 8px; background: #FFB300; border-radius: 50%; opacity: 0.6;"></div>
        <div style="position: absolute; top: 420px; right: 30px; width: 12px; height: 12px; background: #D4A017; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; bottom: 200px; left: 60px; width: 10px; height: 10px; background: #FFB300; border-radius: 50%; opacity: 0.4;"></div>
        <div style="position: absolute; bottom: 250px; right: 50px; width: 7px; height: 7px; background: #F5E6CA; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; top: 300px; left: 200px; width: 6px; height: 6px; background: #FFB300; border-radius: 50%; opacity: 0.35;"></div>
    </div>
</body>
</html>
