# Teaching package — identificar dezenas e unidades em números de dois dígitos (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT per Arc 7 Phase 3 + Arc 3 Phase 1 sparse-override pattern.
# Arc 17 Phase 1.3 pt-cadence continuation (16th consecutive arc).
# pt sparse-override for math / place-value strand. Conteúdo matemático
# universal — tradução direta sem reestruturação pedagógica. BR-MEC ensino
# fundamental anos iniciais register per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Dezenas e Unidades em Números de Dois Dígitos — 47 é quatro dezenas e sete unidades"

description:
  pt: "Pacote de matemática para 1º ano que ensina as crianças que qualquer número de dois dígitos de 20 a 99 se estrutura como 'N dezenas e M unidades'. 47 = 4 dezenas + 7 unidades; 60 = 6 dezenas + 0 unidades; 92 = 9 dezenas + 2 unidades; 35 = 3 dezenas + 5 unidades. Extensão-irmã do trabalho K-fundamental decompose-tens-and-ones-within-19 (que cobriu a faixa especial 10-19 onde o dígito das dezenas é sempre 1); este pacote estende a mesma ideia de decomposição para todos os números de dois dígitos, onde o dígito das dezenas varia de 2 a 9. Constrói sobre Arc 15 Phase 1 tens-and-ones-1-to-20 + Phase 4 tens-and-ones-51-to-100 + o pacote irmão Phase 1.3 decompose-tens-and-ones-within-19. Percepção crítica: os dois dígitos de um numeral de dois dígitos não são apenas dois dígitos separados — o dígito da ESQUERDA nomeia dezenas (4 em 47 significa '4 dezenas' = 40) e o dígito da DIREITA nomeia unidades. Esta é a percepção load-bearing de valor-posicional para toda aritmética multi-dígito de 1º ano em diante; os pacotes Phase 1.2 add-2-digit-without-regrouping + subtract-2-digit-without-regrouping assumem que as crianças possam ler esta estrutura. Âncora primária CCSS.1.NBT.B.2 ('entender que os dois dígitos de um número de dois dígitos representam quantidades de dezenas e unidades'). 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana. Material place-value-mat diferido para Pillar 5 per Arc 17 Phase 0 §8 (C); matching-mat + manipulative-cut-outs em modo base-dez carregam o papel de encenação de valor-posicional."

structure:
  warmup:
    body: |
      Iniciador com toda a turma + introdução de valor-
      posicional de 2 dígitos. A professora ou o professor
      escreve 47 no quadro. "O que este número nos diz? É um
      número de DOIS DÍGITOS. O número tem DUAS partes: 4 à
      ESQUERDA e 7 à DIREITA. O 4 da esquerda nos diz
      DEZENAS — quatro dezenas, que é quarenta. O 7 da direita
      nos diz UNIDADES — sete unidades. Então 47 é QUATRO
      DEZENAS e SETE UNIDADES. Quarenta mais sete é igual a
      quarenta-e-sete." Desenha 4 barras-de-dez + 7
      contadores avulsos para mostrar a estrutura visualmente.
      Repete com 35 (três dezenas + cinco unidades), 60 (seis
      dezenas + ZERO unidades — o dígito da direita é zero,
      então sem unidades), 92 (nove dezenas + duas unidades),
      21 (duas dezenas + uma unidade). Ênfase do padrão: "O
      dígito da ESQUERDA nomeia dezenas. O dígito da DIREITA
      nomeia unidades. Sempre os leem como um par." Faz
      também um contraste com os números de ontem (10-19):
      "Lembram-se de 14 era uma dezena e quatro unidades?
      Os números de hoje têm MAIS dezenas — não apenas uma
      dezena, mas duas ou três ou até nove dezenas. Mesmo
      padrão, mais dezenas."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de identificação de valor-
      posicional. Cada dupla recebe um conjunto de cartas de
      numerais de 2 dígitos (24, 53, 87, 60, 32, 99, 41) +
      cut-outs base-dez com tema animals (barras-de-dez +
      contadores avulsos). Dupla alterna: criança A puxa uma
      carta de numeral (e.g., 53); criança B lê em voz alta
      "cinco dezenas e três unidades" + constrói 53 com 5
      barras-de-dez + 3 contadores avulsos. Criança A
      verifica contando os manipulativos da criança B —
      cinco dezenas é cinquenta, mais três unidades é
      cinquenta-e-três. Depois trocam. Refraseie erros com
      pista-de-dígito ("você usou seis barras-de-dez para
      53 — conte o dígito da ESQUERDA, é 5, então usamos
      CINCO barras-de-dez"). Casos difíceis recebem atenção
      extra: números terminando em 0 (60 tem zero unidades —
      crianças podem querer colocar uma ou duas unidades);
      números com os dois dígitos iguais (33, 55 — crianças
      precisam lembrar que o 3 da ESQUERDA é dezenas e o 3
      da DIREITA é unidades, não 'três trêses').
  scaffold:
    body: |
      Rotação de estações. Estação 1: atividade matching —
      combine cada numeral de 2 dígitos à sua carta de
      decomposição 'N dezenas e M unidades'. Estação 2:
      atividade chart-count onde crianças contam visuais
      base-dez organizados em fileiras de dez (uma grade
      chart-count mostrando 4 fileiras completas + 7 extras
      = 47). Estação 3: math-puzzle modo decomposition
      (crianças preenchem N + M: 47 = ? dezenas + ?
      unidades; 60 = ? dezenas + ? unidades). Estação 4:
      math-worksheet com tarefas mistas de reconhecimento de
      números de 2 dígitos — dado um numeral, escreva a
      decomposição; dada uma decomposição, escreva o numeral.
      Vocabulário pt-BR canônico: dezena / dezenas; unidade
      / unidades; dígito da esquerda / dígito da direita;
      valor posicional. Reforço da forma BNCC canônica
      "dezenas e unidades" como termo K-3 padrão.
  closure:
    body: |
      Recuperação rápida de valor-posicional de 2 dígitos
      com toda a turma. A professora ou o professor mostra
      numerais; a turma articula coletivamente a decomposição.
      "47? — Quatro dezenas e sete unidades." "60? — Seis
      dezenas e zero unidades." "92? — Nove dezenas e duas
      unidades." "33? — Três dezenas e três unidades."
      Indicador adiante: "Hoje aprendemos que números de
      dois dígitos são N DEZENAS e M UNIDADES — o dígito da
      ESQUERDA nomeia dezenas, o dígito da DIREITA nomeia
      unidades. Este é o MESMO padrão dos números de 10 a 19
      de ontem, com dígitos de dezenas maiores. E é assim que
      o trabalho SOMAR DOIS DÍGITOS e SUBTRAIR DOIS DÍGITOS
      que aprendemos antes realmente FUNCIONA — quando
      alinhamos a coluna das dezenas e a coluna das unidades
      para adição-em-colunas, estamos usando exatamente
      esta percepção 'dígito da esquerda = dezenas, dígito
      da direita = unidades'. Na próxima vez aprenderemos a
      COMPARAR números de dois dígitos usando valor-
      posicional (qual é maior: 47 ou 53? Compare primeiro
      as dezenas)."

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Identificar o dígito das dezenas e o dígito das
        unidades em um numeral de 2 dígitos em 8 de 10
        tentativas.
      - Decompor um número de 2 dígitos em representação 'N
        dezenas e M unidades' em 7 de 10 tentativas na faixa
        completa 20-99.
      - Construir um número de 2 dígitos com manipulativos
        base-dez (N barras-de-dez + M contadores avulsos)
        em 7 de 10 tentativas.
      - Traduzir entre decomposição e numeral (dado '5
        dezenas e 3 unidades', escrever 53; dado 47, dizer
        'quatro dezenas e sete unidades') em 6 de 10
        tentativas.
      - Lidar com o caso especial de números terminando em
        0 (60 = 6 dezenas + 0 unidades, não 6 dezenas + 10
        unidades) em 4 de 5 tentativas.

    Diferenciação:
      - Pré-K (3-5 anos): pular o trabalho de 2 dígitos
        inteiramente; construir familiaridade com números
        de 10 a 19 primeiro via o pacote irmão decompose-
        tens-and-ones-within-19.
      - Educação infantil (5-7 anos): introduzir decomposição
        de 2 dígitos apenas para a faixa 20-50; suporte de
        manipulativo fortemente apoiado; o nomeamento dos
        dígitos das dezenas (vinte, trinta, quarenta,
        cinquenta) recebe trabalho explícito de vocabulário.
      - 1º ano: fluência completa de decomposição 20-99;
        ambas as direções praticadas (numeral → decomposição
        E decomposição → numeral).
      - 2º ano em diante: estender para valor-posicional de
        3 dígitos (centenas + dezenas + unidades) per o
        pacote Arc 15 Phase 4 identify-place-value-hundreds;
        ponte para forma expandida (47 = 40 + 7 como equação
        escrita, não apenas uma decomposição verbal).

compositionalRationale:
  pt: |
    Fio principal: matemática / valor-posicional (identificar
    dezenas e unidades em números de 2 dígitos — segundo fill
    canônico no fio de valor-posicional; 1/3 → 2/3 canônico).
    Fio secundário: contagem-e-cardinalidade (reconhecimento
    de números de 2 dígitos + contagem-por-dezenas). Fio
    terciário: precursor de numeracia (a percepção de
    decomposição de valor-posicional fundamenta toda aritmética
    multi-dígito posterior — adição-em-colunas, reagrupamento,
    empréstimo todos assumem esta percepção).

    Significância arquitetural: extensão-irmã de decompose-
    tens-and-ones-within-19 (mesma fase do arco) — o trabalho
    K de decomposição-de-10-a-19 faz surgir o padrão de valor-
    posicional com o dígito das dezenas fixo em 1; este
    pacote estende o padrão para a faixa completa de 2
    dígitos 20-99 onde o dígito das dezenas varia de 2 a 9.
    Juntos formam a sequência de introdução de valor-
    posicional K → 1º ano. O pacote é especificamente nomeado
    como pré-requisito para Phase 1.2 add-2-digit-without-
    regrouping + subtract-2-digit-without-regrouping em
    learning-targets.json (as rotinas de operação-em-colunas
    assumem esta percepção). Após este pacote, o fio canônico
    de valor-posicional tem um alvo restante: compare-2-
    digit-numbers (que usa a decomposição N dezenas + M
    unidades para comparar magnitudes examinando primeiro as
    dezenas).

    Especificidade pt-BR: valor-posicional de 2 dígitos é
    conceito universal + traduzível 1:1 do en. Vocabulário
    pt-BR canônico:
    - **"dezena"** / **"dezenas"** — forma BNCC canônica K-3.
    - **"unidade"** / **"unidades"** — forma BNCC canônica
      K-3.
    - **"dígito da esquerda"** / **"dígito da direita"** —
      formas K-3 operacionais; "ordem das dezenas" / "ordem
      das unidades" também aparece em material BNCC.
    - **"valor posicional"** — termo BNCC canônico.

    Sistema de palavras-número pt-BR para 20-99: regular com
    "e" conector ("vinte e três, quarenta e sete, noventa e
    nove"); o conector "e" é load-bearing — sem ele a palavra-
    número soa errada. A pronúncia das dezenas é regular
    ("vinte, trinta, quarenta, cinquenta, sessenta, setenta,
    oitenta, noventa"). Em pt-BR, a palavra-número expõe a
    estrutura de valor-posicional de forma audível: "quarenta-
    e-sete" literalmente diz "quarenta" (4 dezenas = 40) "e"
    (mais) "sete" (7 unidades). Esta transparência linguística
    do pt-BR torna o trabalho de decomposição mais fácil do
    que em locales onde a palavra-número esconde a estrutura
    (como en 'forty-seven' onde 'forty' não é audivelmente
    'four-tens', ou de 'siebenundvierzig' onde a ordem é
    invertida — 'seven-and-forty').

    Currículo BNCC EF01MA01 (1º ano) + EF01MA07 (1º ano) +
    EF02MA01 (2º ano) + EF02MA04 (2º ano): reconhecer e
    expressar quantidades por representação posicional;
    compor e decompor números até 99 em dezenas e unidades;
    sistema de numeração decimal.

    Substrato Class B FLEXIBLE: composta contra tema animals
    (pair-coherent com pacote irmão decompose-tens-and-ones-
    within-19 + Arc 16 + Phase 1.2 cluster adição-subtração).

    Nota sobre place-value-mat: a esteira de valor-posicional
    é diferida para Pillar 5 per Arc 17 Phase 0 §8 (C); ver
    racional do pacote-irmão decompose-tens-and-ones-within-
    19 para o padrão de substituição. Matching-mat ocupa
    posição 3 com pedagogicalRole 'place-value-decomposition-
    game'; manipulative-cut-outs em modo base-dez (posição 5,
    itemCount 100 para apoiar a faixa completa de 2 dígitos)
    fornece os manipulativos concretos de barras-de-dez +
    unidades.
