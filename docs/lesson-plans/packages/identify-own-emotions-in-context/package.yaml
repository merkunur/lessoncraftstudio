# Teaching package — identify own emotions in context
# Arc 10 Phase 2 (Option E world-knowledge depth; world-knowledge / personal-
# social-emotional-development strand FIRST package). Class B FLEXIBLE; vocab-
# anchored. Foundational SEL skill: kids identify their own emotions in
# specific situational contexts (happy when playing, sad when missing family,
# frustrated when toy breaks, proud when finishing puzzle).

targetSlug: identify-own-emotions-in-context
language: en
title:
  en: "How Do You Feel? — name emotions you experience in different situations"
description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching emotional self-awareness in situational contexts. FIRST personal-social-emotional-development strand package in the catalog. Builds on Arc 5 identify-and-name-emotions (emotion-vocabulary acquisition) — kids now move from naming emotions to RECOGNIZING which emotion they feel in specific situations (happy when playing with friends, sad when grandparent leaves, frustrated when puzzle is hard, proud when completing a task). Foundational social-emotional-learning (SEL) skill. Vocab-anchored — emotion vocabulary connects to situational reasoning. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class emotion-and-situation routine. Teacher poses
      situations: "How would you feel if your friend gave you a
      birthday present?" Class responds with emotion words ("Happy!"
      "Excited!"). "How would you feel if you couldn't find your
      favorite toy?" ("Sad," "Frustrated"). Reinforces emotion-as-
      response-to-situation framing — emotions aren't random; they
      ARISE from things that happen to us.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + situation-and-emotion routine. Each pair receives 8
      situation cards (depicting K-3 relatable scenarios: birthday,
      first day of school, lost toy, finishing a puzzle, grandparent
      visit, scary movie, sharing snack, etc.) + emotion-face cards
      (happy, sad, scared, surprised, proud, frustrated, excited).
      Pair takes turns: kid A picks a situation; kid B picks the
      matching emotion-face. Recast errors with explanation ("you
      said you'd feel happy when your toy is lost — let's think:
      losing a favorite toy makes most kids feel sad or frustrated.
      Have you ever felt happy when you lost something? Maybe not —
      let's try sad"). Optional extension: kids share a real situation
      from their life + the emotion they felt.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (emotion-face
      to emotion-name pairs; reinforces vocab base). Station 2:
      picture-sort worksheet (kids sort situations into 'happy
      situations' vs 'sad situations'). Station 3: manipulative cut-
      outs hands-on emotion-situation construction (kids assemble
      story-cards pairing situation + emotion + appropriate response).
      Station 4: sentence-strips (kids construct full sentences: 'I
      feel ___ when ___').
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-circle. Each kid shares an emotion they felt
      today + what situation caused it ("I felt happy at recess
      because I played tag with my friend"). Forward-pointer: "Today
      we noticed how situations cause emotions. When we come back to
      emotions next, we'll learn to RECOGNIZE OTHER PEOPLE'S emotions
      — looking at faces and noticing how a friend or family member
      feels — and how to RESPOND kindly."

