compositionalRationale:
  en: |
    Primary strand: world-knowledge / living-things classification. Secondary
    strand: vocabulary acquisition (consolidates Arc 1+4 animal vocabulary
    in classification-context).

    Architectural significance: this is the FIRST world-knowledge domain
    package in the catalog (Arc 1-4 covered early-literacy + early-numeracy
    only). Validates the world-knowledge architecture by composing against
    multi-cluster substrate (4 animal clusters: farm-animals + zoo-animals
    + pet-animals + ocean-life). Per §A.14 scaling-checkpoint discipline:
    cross-strand validation must complete before strand-volume commits.

    Distinctive composition vs vocabulary packages: the 5 composedExercises
    are weighted toward picture-sort (3 of 5) — classification IS sorting
    pedagogically. matching at position 3 keeps the vocabulary-anchor
    surface present (kids reinforce animal names while classifying); odd-
    one-out at position 4 introduces classification-by-attribute thinking
    (which animal doesn't fit the habitat).

    Multi-cluster substrate: vocabKeys spans 4 animal clusters with 12
    representative animals — broader than any Arc 1-4 vocabulary package.
    This stress-tests the materials catalog's multi-cluster vocabKeyList
    handling at Phase 2 close.

    Cultural-variation acknowledgment: habitat categorization is largely
    universal but specific examples vary by region. Penguins live "in the
    Antarctic" not "at the zoo" technically; for K-3 the zoo-as-habitat
    abstraction holds because most kids encounter penguins via zoos or
    media. Operator-side teachers can layer in nuance for older grades.

