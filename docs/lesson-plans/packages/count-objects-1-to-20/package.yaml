compositionalRationale:
  en: |
    Primary strand: counting and cardinality (target count-objects-1-to-20).
    Secondary strand: place-value precursor (the teen-numbers tens-and-ones
    structure introduces decomposition; bridges to the place-value strand
    targets identify-tens-and-ones-2-digit + decompose-tens-and-ones-within-19).
    Tertiary strand: arithmetic (addition image-image with sums to 20 + more-less
    quantity comparison).

curriculumStandards:
  - CCSS.K.CC.A.2
  - CCSS.1.NBT.B.2
  - EYFS.ELG.M

assessmentCriteria:
  en: |
    By end of 1-2 week unit:
      - Count one-to-one to 20 accurately in 4 of 5 trials.
      - Match numeral 11-20 to matching quantity 8 of 10 trials.
      - Count to 20 chorally without error.
      - Recognize teen numbers as tens-and-ones ("17 = 10 + 7") in 6 of 10 trials.
      - Use "There are N {item:plural}" frame productively with N up to 20.

    Differentiation:
    - K: count to 15; emphasize teen numbers as ten + ones.
    - Grade 1: full count to 20 + tens-and-ones recognition + addition with
      sums to 20.
    - Grade 1+: extend to skip-count by 2 to 20 (adjacent target skip-count-by-2)
      and decompose-tens-and-ones-within-19.

