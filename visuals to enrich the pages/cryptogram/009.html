<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Bilder-Kryptogramm - Zauberbuch Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(160deg, #1E1B4B 0%, #312E81 30%, #2563EB 100%);">

        <!-- Magical atmosphere overlay -->
        <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(236,72,153,0.12) 0%, transparent 60%), radial-gradient(ellipse at 20% 80%, rgba(37,99,235,0.15) 0%, transparent 40%), radial-gradient(ellipse at 80% 20%, rgba(251,191,36,0.1) 0%, transparent 40%);"></div>

        <!-- GRATIS Badge - magenta circle -->
        <div style="position: absolute; top: 30px; left: 30px; z-index: 20;">
            <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #EC4899 0%, #DB2777 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 25px rgba(236,72,153,0.5), 0 0 30px rgba(236,72,153,0.3), inset 0 2px 0 rgba(255,255,255,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">GRATIS</span>
            </div>
        </div>

        <!-- KLASSE K-3 Badge - frosted pill -->
        <div style="position: absolute; top: 38px; right: 35px; z-index: 20;">
            <div style="background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); padding: 14px 28px; border-radius: 30px; border: 2px solid rgba(255,255,255,0.3); box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 800; color: white; letter-spacing: 1px;">KLASSE K-3</span>
            </div>
        </div>

        <!-- Main Headline -->
        <div style="position: absolute; top: 110px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 75px; font-weight: 700; color: rgba(255,255,255,0.95); text-shadow: 0 0 40px rgba(255,255,255,0.4), 0 4px 20px rgba(0,0,0,0.3); letter-spacing: 2px;">PSST...</h1>
            <h1 style="margin: 5px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 75px; font-weight: 700; color: #EC4899; text-shadow: 0 0 40px rgba(236,72,153,0.5), 0 4px 20px rgba(0,0,0,0.3); letter-spacing: -1px;">PURE MAGIE!</h1>
        </div>

        <!-- Tagline -->
        <div style="position: absolute; top: 280px; left: 50%; transform: translateX(-50%); z-index: 10;">
            <p style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 24px; font-weight: 700; color: rgba(255,255,255,0.8); letter-spacing: 1px;">Lernen, das sich wie Zauberei anf&uuml;hlt</p>
        </div>

        <!-- Magic Book Frame -->
        <div style="position: absolute; top: 330px; left: 50%; transform: translateX(-50%); width: 600px; height: 400px; z-index: 5;">
            <!-- Book cover (dark with gold corners) -->
            <div style="position: absolute; inset: 0; background: linear-gradient(145deg, #1a1145 0%, #0f0a2e 100%); border-radius: 8px; box-shadow: 0 15px 50px rgba(0,0,0,0.5), 0 0 40px rgba(236,72,153,0.15);">
                <!-- Gold corner brackets -->
                <!-- Top-left -->
                <div style="position: absolute; top: 10px; left: 10px; width: 40px; height: 40px; border-top: 4px solid #FBBF24; border-left: 4px solid #FBBF24; border-radius: 4px 0 0 0;"></div>
                <!-- Top-right -->
                <div style="position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-top: 4px solid #FBBF24; border-right: 4px solid #FBBF24; border-radius: 0 4px 0 0;"></div>
                <!-- Bottom-left -->
                <div style="position: absolute; bottom: 10px; left: 10px; width: 40px; height: 40px; border-bottom: 4px solid #FBBF24; border-left: 4px solid #FBBF24; border-radius: 0 0 0 4px;"></div>
                <!-- Bottom-right -->
                <div style="position: absolute; bottom: 10px; right: 10px; width: 40px; height: 40px; border-bottom: 4px solid #FBBF24; border-right: 4px solid #FBBF24; border-radius: 0 0 4px 0;"></div>

                <!-- Book spine line -->
                <div style="position: absolute; left: 50%; top: 15px; bottom: 15px; width: 2px; background: rgba(251,191,36,0.2);"></div>
            </div>

            <!-- Hero worksheet on book's "page" -->
            <div style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 210px; height: 273px; background: white; border-radius: 5px; box-shadow: 0 8px 30px rgba(236,72,153,0.3), 0 6px 20px rgba(0,0,0,0.3); overflow: hidden; border: 2px solid rgba(251,191,36,0.5); z-index: 10;">
                <img src="https://www.lessoncraftstudio.com/samples/german/cryptogram/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilder-Kryptogramm">
            </div>

            <!-- "ENTZIFFERN..." text below worksheet inside book -->
            <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10;">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 600; color: #FBBF24; letter-spacing: 4px; text-shadow: 0 0 15px rgba(251,191,36,0.5);">ENTZIFFERN...</span>
            </div>
        </div>

        <!-- Floating worksheet left (with glow) -->
        <div style="position: absolute; top: 420px; left: 50px; width: 160px; height: 208px; z-index: 8;">
            <div style="width: 100%; height: 100%; background: white; border-radius: 5px; box-shadow: 0 0 30px rgba(236,72,153,0.25), 0 8px 25px rgba(0,0,0,0.35); overflow: hidden; border: 2px solid rgba(236,72,153,0.3);">
                <img src="https://www.lessoncraftstudio.com/samples/german/cryptogram/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilder-Kryptogramm">
            </div>
        </div>

        <!-- Floating worksheet right (answer key, with glow) -->
        <div style="position: absolute; top: 420px; right: 50px; width: 160px; height: 208px; z-index: 8;">
            <div style="width: 100%; height: 100%; background: white; border-radius: 5px; box-shadow: 0 0 30px rgba(251,191,36,0.25), 0 8px 25px rgba(0,0,0,0.35); overflow: hidden; border: 2px solid rgba(251,191,36,0.3);">
                <img src="https://www.lessoncraftstudio.com/samples/german/cryptogram/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilder-Kryptogramm L&ouml;sung">
            </div>
        </div>

        <!-- Sparkle/star emojis scattered -->
        <div style="position: absolute; top: 340px; left: 230px; font-size: 28px; z-index: 12;">&#x2728;</div>
        <div style="position: absolute; top: 380px; right: 230px; font-size: 24px; z-index: 12;">&#x2728;</div>
        <div style="position: absolute; top: 500px; left: 230px; font-size: 20px; z-index: 12;">&#x2B50;</div>
        <div style="position: absolute; top: 450px; right: 240px; font-size: 22px; z-index: 12;">&#x2B50;</div>
        <div style="position: absolute; top: 310px; left: 380px; font-size: 18px; z-index: 12;">&#x2728;</div>
        <div style="position: absolute; top: 310px; right: 370px; font-size: 18px; z-index: 12;">&#x2728;</div>
        <div style="position: absolute; bottom: 120px; left: 320px; font-size: 22px; z-index: 12;">&#x2B50;</div>
        <div style="position: absolute; bottom: 130px; right: 310px; font-size: 20px; z-index: 12;">&#x2728;</div>

        <!-- Decorative magic swirl lines (CSS arcs) -->
        <div style="position: absolute; top: 350px; left: 160px; width: 60px; height: 60px; border: 3px solid rgba(236,72,153,0.3); border-radius: 50%; border-top-color: transparent; border-left-color: transparent; z-index: 3;"></div>
        <div style="position: absolute; top: 370px; right: 170px; width: 50px; height: 50px; border: 3px solid rgba(251,191,36,0.3); border-radius: 50%; border-bottom-color: transparent; border-right-color: transparent; z-index: 3;"></div>
        <div style="position: absolute; bottom: 140px; left: 240px; width: 40px; height: 40px; border: 2px solid rgba(236,72,153,0.25); border-radius: 50%; border-top-color: transparent; border-right-color: transparent; z-index: 3;"></div>

        <!-- Bottom feature pills -->
        <div style="position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; z-index: 20;">
            <div style="background: rgba(236,72,153,0.2); backdrop-filter: blur(8px); padding: 12px 22px; border-radius: 25px; border: 2px solid rgba(236,72,153,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: #F9A8D4;">Spielerisch lernen</span>
            </div>
            <div style="background: rgba(236,72,153,0.2); backdrop-filter: blur(8px); padding: 12px 22px; border-radius: 25px; border: 2px solid rgba(236,72,153,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: #F9A8D4;">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: rgba(236,72,153,0.2); backdrop-filter: blur(8px); padding: 12px 22px; border-radius: 25px; border: 2px solid rgba(236,72,153,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: #F9A8D4;">Druckfertig</span>
            </div>
        </div>

    </div>
</body>
</html>
