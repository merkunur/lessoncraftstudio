<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Estimation Jar — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. Absolute /mini-tools/ paths so embeds +
       cross-context loads resolve identically. The tool fetches its object
       sets from /mini-tools/estimation-jar-sets.json at runtime — the sets
       are locale-NEUTRAL, so there is no per-locale bank to load. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/estimation-jar.js?v=3"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    // Tool-specific deep links: ?set=<setId>&count=<n>
    //   A link to a PREMIUM filling is refused for free visitors, and a
    //   count above the free ceiling is clamped down rather than honoured —
    //   premium fillings never reach the DOM.
    LCS.mount(EstimationJar, { mount: '#lcs-root' });
  </script>
</body>
</html>
