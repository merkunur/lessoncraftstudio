thematicCoherence:
  en: |
    All 5 packages cohere around the zoo-animal theme + form a
    cross-strand progression from zoo-animal vocabulary through
    biological-classification + counting + sorting to size comparison.

    **Pedagogical sequencing:**
    1. **identify-and-name-10-zoo-animals** — Foundational zoo-animal
       vocabulary (lion, tiger, elephant, giraffe, monkey, zebra,
       kangaroo, panda, hippopotamus, rhinoceros). Same shared package
       with animals-bundle (subset relationship).
    2. **identify-living-vs-nonliving** — Biological-classification work
       applied to zoo context (all 10 zoo animals are living; distinguish
       from cage / enclosure / fence / sign objects at the zoo). Same
       shared package with 8 animal-cluster bundles (extends pattern to
       9 with zoo-animals); cross-bundle reuse compounding continues.
    3. **count-objects-1-to-10** — Counting practice using zoo animals
       as countable subjects (5 lions in the pride; 3 elephants in the
       family; 7 monkeys in the troop). Same shared package across many
       bundles; zoo-context particularly engaging for K-3 group-counting.
    4. **sort-by-category** — Category-classification work distinguishing
       predators (lion, tiger) vs herbivores (giraffe, elephant, panda)
       OR sorting by continent-of-origin (African: lion, elephant, zebra;
       Asian: tiger, panda, kangaroo) OR mammals vs reptiles vs birds at
       zoo. Same shared package; zoo-context enables multi-axis
       classification work.
    5. **use-size-comparison-words** — Comparison work using zoo-animal-
       size contrasts (big elephant vs small monkey; tall giraffe vs
       short panda; heavy hippopotamus vs light kangaroo; long crocodile
       vs short turtle). Same shared package; zoo-animal-size variation
       provides vivid contrast substrate.

    **Strand spread:** 1 vocabulary-acquisition (zoo-animals) + 1
    living-things (classification) + 1 numeracy + 1 cognitive-sorting + 1
    comparison. **5 distinct strands.** Cross-strand animal-cluster
    bundle parallel to farm-animals-bundle + forest-creatures-bundle but
    anchored at zoo-trip + classroom-imagination context.

    **Suggested unit duration:** 4-5 weeks (1 package per week).
    Natural fit alongside zoo field-trip OR zoo-themed classroom-week.
    Particularly engaging for K-3 — zoo-imagery is high-interest +
    high-vivid + classroom-accessible-via-video.

    **Multilingual classroom relevance:** zoo vocabulary cognate-rich
    Romance (zoológico / zoo / zoo / zoo); Germanic-distinct (Zoo /
    dierentuin / zoo / zoo / eläintarha). Specific zoo-animal vocabulary
    varies extensively (giraffe / Giraffe / jirafa / girafe / giraffa;
    panda universal cognate). Cross-cultural zoo-animal awareness —
    multilingual K-3 kids may know home-country animal vocabulary; bundle
    materials support discussion of regional vs zoo-imported species.

    **Pillar 2 architectural pattern:** zoo-animals-bundle exemplifies
    animal-cluster substantial-coverage milestone (9 of 9+ animal
    contexts). Theme-axis-key animal-cluster-zoo (vs animals-bundle at
    general-animal-vocabulary; vs farm-animals at everyday-farm; vs
    forest-creatures at wilderness). 9-bundle animal-cluster mature
    architecture: habitat (farm + forest + ocean + zoo) + domestication
    (pets + farm-animals) + biological-class (birds + insects + reptiles
    + dinosaurs implicit-extinct) + special-context (zoo + dinosaurs).
    Cluster substantial-coverage achieved.
