# Teaching package — name this object in two languages
# Arc 6 Phase 2 (Option A vocab-depth) — early-literacy / multilingual-language-
# awareness strand. FIRST multilingual-language-awareness domain package.
# Class B FLEXIBLE; substrate-ready against any existing image-library content
# (kid names objects in BOTH the school instruction language AND home language).

targetSlug: name-this-object-in-two-languages
language: en
title:
  en: "Name This Object in Two Languages — bilingual vocabulary practice"
description:
  en: "Kindergarten-Grade 1 multilingual-language-awareness package teaching kids to name common objects in TWO languages — typically the school instruction language plus their home language. Validates kids' bilingual identity by celebrating both languages as legitimate vocabulary. Composes against any image-library content (animals, fruits, vehicles, body-parts, etc.) — kids name what they see in both languages. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up a picture-card (e.g., a
      cat). Names the object in school language: "This is a cat." Then
      asks kids: "What is this called in YOUR language?" Different kids
      offer different home-language names — Spanish "gato," German
      "Katze," Polish "kot," etc. Class repeats each home-language name
      chorally; teacher writes them on a class chart titled "Cat in our
      languages." Validates kids' bilingual identity; celebrates linguistic
      diversity in the classroom. Repeat with 2-3 more objects.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine: teacher names object in school language; class
      repeats it; teacher invites the bilingual classroom voice — "Who
      knows another language? What is this in your language?" Pair work
      across language pairs: kids who speak the same home language work
      together to name objects in their home language; kids who speak
      different home languages share their words across pairs. Optional
      extension: kids draw a "language tree" — their home language,
      school language, and any other languages they hear at home (some
      kids have grandparents who speak yet another language).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (image to school-
      language name). Station 2: picture-cards bilingual labeling (kids
      label cards with both school-language word + home-language word
      — emergent bilingual writing). Station 3: manipulative cut-outs
      bilingual sorting game (kids place cut-outs on a 2-column mat:
      "in school we say..." vs "at home I say..." — concretizes the
      two-name reality of their bilingual life).
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Each kid offers one new word they learned
      from a classmate's language today. Teacher celebrates the multi-
      language vocabulary added to the class. Forward-pointer: "Today
      we learned that one object has many names — in English, in
      {language A}, in {language B}, and so on. When we come back to
      languages next, we'll think about words that are SIMILAR across
      languages — like 'tomate' in Spanish and 'tomato' in English."

