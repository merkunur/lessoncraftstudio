<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Picture Path - Features Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(160deg, #1A237E 0%, #283593 50%, #3949AB 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Decorative background pattern -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.1;" viewBox="0 0 1000 1000">
            <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                <path d="M 50 0 L 0 0 0 50" fill="none" stroke="white" stroke-width="1"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#grid)"/>
        </svg>

        <!-- Main Title - Top -->
        <div style="
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 65px;
                color: white;
                margin: 0;
                text-shadow: 0 4px 15px rgba(0,0,0,0.3);
                letter-spacing: -1px;
            ">3 MAZE MODES</h1>
            <h2 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 40px;
                background: linear-gradient(90deg, #2979FF, #FF6D00, #E91E63);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                margin: 5px 0 0 0;
            ">IN ONE AMAZING TOOL</h2>
        </div>

        <!-- Three Cards Container -->
        <div style="
            position: absolute;
            top: 200px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            z-index: 15;
        ">
            <!-- Card 1: Picture Pathway (Blue) -->
            <div style="
                background: white;
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 15px 40px rgba(41, 121, 255, 0.4);
                transform: rotate(-5deg) translateY(20px);
            ">
                <!-- Color stripe header -->
                <div style="
                    background: linear-gradient(135deg, #2979FF, #448AFF);
                    padding: 10px 20px;
                    text-align: center;
                ">
                    <span style="
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 600;
                        font-size: 16px;
                        color: white;
                        text-transform: uppercase;
                        letter-spacing: 1px;
                    ">Picture Pathway</span>
                </div>
                <!-- Worksheet preview -->
                <div style="padding: 10px;">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/picture%20path/sample-1.jpeg"
                        alt="Picture Pathway Mode"
                        style="
                            width: 200px;
                            height: 259px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 6px;
                            display: block;
                        "
                    />
                </div>
                <!-- Icon badge -->
                <div style="
                    display: flex;
                    justify-content: center;
                    padding-bottom: 12px;
                ">
                    <div style="
                        background: #E3F2FD;
                        border-radius: 20px;
                        padding: 6px 14px;
                        display: flex;
                        align-items: center;
                        gap: 6px;
                    ">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="#2979FF">
                            <path d="M12 2L4 6v6c0 5.5 3.4 10.6 8 12 4.6-1.4 8-6.5 8-12V6l-8-4zm-1 13l-3-3 1.4-1.4L11 12.2l4.6-4.6L17 9l-6 6z"/>
                        </svg>
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 12px; color: #2979FF;">Grid Path</span>
                    </div>
                </div>
            </div>

            <!-- Card 2: Classic Maze (Orange) - Center, elevated -->
            <div style="
                background: white;
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 20px 50px rgba(255, 109, 0, 0.5);
                transform: scale(1.08);
                z-index: 2;
            ">
                <!-- Color stripe header -->
                <div style="
                    background: linear-gradient(135deg, #FF6D00, #FF9100);
                    padding: 12px 20px;
                    text-align: center;
                ">
                    <span style="
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 600;
                        font-size: 18px;
                        color: white;
                        text-transform: uppercase;
                        letter-spacing: 1px;
                    ">Classic Maze</span>
                </div>
                <!-- Worksheet preview -->
                <div style="padding: 12px;">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/picture%20path/sample-5.jpeg"
                        alt="Classic Maze Mode"
                        style="
                            width: 240px;
                            height: 310px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 6px;
                            display: block;
                        "
                    />
                </div>
                <!-- Icon badge -->
                <div style="
                    display: flex;
                    justify-content: center;
                    padding-bottom: 14px;
                ">
                    <div style="
                        background: #FFF3E0;
                        border-radius: 20px;
                        padding: 8px 16px;
                        display: flex;
                        align-items: center;
                        gap: 6px;
                    ">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#FF6D00">
                            <path d="M3 3h18v18H3V3zm2 2v14h14V5H5zm2 2h2v2H7V7zm4 0h2v2h-2V7zm4 0h2v2h-2V7zM7 11h2v2H7v-2zm8 0h2v2h-2v-2zM7 15h10v2H7v-2z"/>
                        </svg>
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 13px; color: #FF6D00;">Wall Maze</span>
                    </div>
                </div>
            </div>

            <!-- Card 3: Choose Path (Pink) -->
            <div style="
                background: white;
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 15px 40px rgba(233, 30, 99, 0.4);
                transform: rotate(5deg) translateY(20px);
            ">
                <!-- Color stripe header -->
                <div style="
                    background: linear-gradient(135deg, #E91E63, #F06292);
                    padding: 10px 20px;
                    text-align: center;
                ">
                    <span style="
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 600;
                        font-size: 16px;
                        color: white;
                        text-transform: uppercase;
                        letter-spacing: 1px;
                    ">Choose Path</span>
                </div>
                <!-- Worksheet preview -->
                <div style="padding: 10px;">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/picture%20path/sample-10.jpeg"
                        alt="Choose Path Mode"
                        style="
                            width: 200px;
                            height: 259px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 6px;
                            display: block;
                        "
                    />
                </div>
                <!-- Icon badge -->
                <div style="
                    display: flex;
                    justify-content: center;
                    padding-bottom: 12px;
                ">
                    <div style="
                        background: #FCE4EC;
                        border-radius: 20px;
                        padding: 6px 14px;
                        display: flex;
                        align-items: center;
                        gap: 6px;
                    ">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="#E91E63">
                            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-2 15l-5-5 1.4-1.4 3.6 3.6 7.6-7.6L19 8l-9 9z"/>
                        </svg>
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 12px; color: #E91E63;">Fork Road</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Feature Pills -->
        <div style="
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 15;
        ">
            <div style="
                background: rgba(255,255,255,0.15);
                border: 2px solid rgba(255,255,255,0.3);
                border-radius: 30px;
                padding: 12px 24px;
                backdrop-filter: blur(5px);
            ">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 18px; color: white;">🎯 Multiple Difficulties</span>
            </div>
            <div style="
                background: rgba(255,255,255,0.15);
                border: 2px solid rgba(255,255,255,0.3);
                border-radius: 30px;
                padding: 12px 24px;
                backdrop-filter: blur(5px);
            ">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 18px; color: white;">📝 Answer Keys</span>
            </div>
            <div style="
                background: rgba(255,255,255,0.15);
                border: 2px solid rgba(255,255,255,0.3);
                border-radius: 30px;
                padding: 12px 24px;
                backdrop-filter: blur(5px);
            ">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 18px; color: white;">🖨️ Print Ready</span>
            </div>
        </div>

        <!-- Decorative stars -->
        <div style="position: absolute; top: 160px; left: 60px; z-index: 5;">
            <svg width="30" height="30" viewBox="0 0 100 100">
                <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="white" opacity="0.3"/>
            </svg>
        </div>
        <div style="position: absolute; top: 100px; right: 80px; z-index: 5;">
            <svg width="25" height="25" viewBox="0 0 100 100">
                <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FFD600" opacity="0.5"/>
            </svg>
        </div>
        <div style="position: absolute; bottom: 130px; left: 40px; z-index: 5;">
            <svg width="20" height="20" viewBox="0 0 100 100">
                <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="white" opacity="0.25"/>
            </svg>
        </div>
    </div>
</body>
</html>
