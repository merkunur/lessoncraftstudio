<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Lines - Features Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; background: linear-gradient(160deg, #E8F5E9 0%, #FFF8E1 60%, #FFECB3 100%); position: relative; overflow: hidden;">

        <!-- Subtle pattern overlay -->
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.03; background-image: repeating-linear-gradient(45deg, #000 0, #000 1px, transparent 1px, transparent 20px);"></div>

        <!-- Title -->
        <div style="position: absolute; top: 35px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #FF6B6B; margin: 0; text-shadow: 3px 3px 0 white;">
                Everything You Need!
            </h1>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 26px; color: #5D4037; margin: 8px 0 0 0;">
                Complete Line Practice Set
            </p>
        </div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 30px; left: 30px; z-index: 20;">
            <div style="background: linear-gradient(135deg, #FF6B6B 0%, #FF5252 100%); color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; padding: 10px 22px; border-radius: 30px; box-shadow: 0 4px 15px rgba(255,107,107,0.5); transform: rotate(-8deg); border: 3px solid white;">
                FREE!
            </div>
        </div>

        <!-- Toolbox -->
        <div style="position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 5;">
            <!-- Toolbox body -->
            <div style="width: 700px; height: 220px; background: linear-gradient(180deg, #FF7B7B 0%, #FF6B6B 30%, #E55A5A 100%); border-radius: 20px 20px 30px 30px; position: relative; box-shadow: 0 15px 40px rgba(255,107,107,0.4), inset 0 -5px 15px rgba(0,0,0,0.1);">
                <!-- Toolbox rim -->
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 25px; background: linear-gradient(180deg, #FF9999 0%, #FF8585 100%); border-radius: 20px 20px 0 0;"></div>

                <!-- Toolbox label -->
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #FFE066; padding: 12px 35px; border-radius: 10px; border: 3px solid #E6C84A;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: #5D4037;">Drawing Lines Bundle</span>
                </div>

                <!-- Toolbox handle -->
                <div style="position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 200px; height: 50px; border: 12px solid #E55A5A; border-bottom: none; border-radius: 100px 100px 0 0; background: transparent;"></div>

                <!-- Metal clasp left -->
                <div style="position: absolute; top: 40px; left: 30px; width: 30px; height: 50px; background: linear-gradient(90deg, #C0C0C0, #E8E8E8, #C0C0C0); border-radius: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.2);"></div>

                <!-- Metal clasp right -->
                <div style="position: absolute; top: 40px; right: 30px; width: 30px; height: 50px; background: linear-gradient(90deg, #C0C0C0, #E8E8E8, #C0C0C0); border-radius: 5px; box-shadow: 2px 2px 5px rgba(0,0,0,0.2);"></div>
            </div>
        </div>

        <!-- Features emerging from toolbox -->

        <!-- Line Type Icons (left side) -->
        <div style="position: absolute; bottom: 320px; left: 100px; z-index: 10;">
            <div style="background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); border: 3px solid #8BC34A;">
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: #5D4037; margin: 0 0 12px 0; text-align: center;">All Line Types</p>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                    <div style="width: 55px; height: 55px; background: #E3F2FD; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        <svg width="35" height="35" viewBox="0 0 35 35"><line x1="5" y1="17.5" x2="30" y2="17.5" stroke="#2196F3" stroke-width="4" stroke-dasharray="5 3"/></svg>
                    </div>
                    <div style="width: 55px; height: 55px; background: #F3E5F5; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        <svg width="35" height="35" viewBox="0 0 35 35"><line x1="17.5" y1="5" x2="17.5" y2="30" stroke="#9C27B0" stroke-width="4" stroke-dasharray="5 3"/></svg>
                    </div>
                    <div style="width: 55px; height: 55px; background: #FFF3E0; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        <svg width="35" height="35" viewBox="0 0 35 35"><line x1="5" y1="30" x2="30" y2="5" stroke="#FF9800" stroke-width="4" stroke-dasharray="5 3"/></svg>
                    </div>
                    <div style="width: 55px; height: 55px; background: #E8F5E9; border-radius: 10px; display: flex; align-items: center; justify-content: center;">
                        <svg width="35" height="35" viewBox="0 0 35 35"><path d="M5 25 Q17.5 5 30 25" stroke="#4CAF50" stroke-width="4" fill="none" stroke-dasharray="5 3"/></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Worksheets floating above toolbox -->
        <div style="position: absolute; bottom: 280px; left: 50%; transform: translateX(-50%); z-index: 8;">
            <!-- Left worksheet -->
            <div style="position: absolute; left: -260px; top: 40px; transform: rotate(-8deg);">
                <div style="width: 240px; height: 185px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; border: 3px solid #FFE066;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/drawing%20lines/sample-20.jpeg"
                         style="width: 100%; height: 100%; object-fit: cover;" alt="Sample worksheet"/>
                </div>
            </div>

            <!-- Right worksheet -->
            <div style="position: absolute; right: -260px; top: 40px; transform: rotate(8deg);">
                <div style="width: 240px; height: 185px; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); overflow: hidden; border: 3px solid #8BC34A;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/drawing%20lines/sample-35.jpeg"
                         style="width: 100%; height: 100%; object-fit: cover;" alt="Sample worksheet"/>
                </div>
            </div>
        </div>

        <!-- Matching Activities badge (right side) -->
        <div style="position: absolute; bottom: 380px; right: 100px; z-index: 10;">
            <div style="background: white; padding: 18px 25px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); border: 3px solid #AB47BC;">
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #7B1FA2; margin: 0;">
                    🎯 Matching Activities
                </p>
            </div>
        </div>

        <!-- Print Ready badge (top right) -->
        <div style="position: absolute; top: 140px; right: 60px; z-index: 10;">
            <div style="background: white; padding: 15px 22px; border-radius: 15px; box-shadow: 0 6px 20px rgba(0,0,0,0.12); border: 3px solid #26A69A;">
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: #00897B; margin: 0;">
                    📄 Print Ready PDF
                </p>
            </div>
        </div>

        <!-- Cute animal peeking -->
        <div style="position: absolute; bottom: 240px; right: 180px; z-index: 12;">
            <div style="width: 90px; height: 90px; background: #FFE0B2; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.15); border: 4px solid white;">
                <span style="font-size: 50px;">🦉</span>
            </div>
        </div>

        <!-- Answer key indicator -->
        <div style="position: absolute; top: 140px; left: 60px; z-index: 10;">
            <div style="background: #E8F5E9; padding: 12px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 2px solid #81C784;">
                <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 18px; color: #388E3C; margin: 0;">
                    ✓ Answer Key Included
                </p>
            </div>
        </div>

        <!-- Bottom tagline -->
        <div style="position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 15;">
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 20px; color: #5D4037; margin: 0; background: white; padding: 10px 30px; border-radius: 30px; box-shadow: 0 3px 10px rgba(0,0,0,0.1);">
                Every line type your students need ✨
            </p>
        </div>

        <!-- Decorative elements -->
        <div style="position: absolute; top: 220px; left: 280px; font-size: 30px; transform: rotate(15deg); opacity: 0.7;">✏️</div>
        <div style="position: absolute; top: 250px; right: 300px; font-size: 25px; transform: rotate(-10deg); opacity: 0.7;">⭐</div>
        <div style="position: absolute; bottom: 350px; left: 300px; font-size: 20px; opacity: 0.6;">💫</div>
    </div>
</body>
</html>
