# Teaching package — spell words with consonant blends
# Arc 19 Phase 1.4 (early-literacy / spelling-and-encoding strand-advancement
# 2 → 3 canonical). Builds on Arc 12 spell-cvc-words foundation.
# Phonetic-reciprocity pair with Phase 1.3 read-consonant-blends
# (decoding ↔ encoding canonical pair).

targetSlug: spell-words-with-blends
language: en
title:
  en: "Spelling Blends — write blue, frog, stop, swim, drop"
description:
  en: "Grade 1 / Grade 2 early-literacy spelling package teaching kids to encode (write) words with common consonant blends. Builds on Arc 12 spell-cvc-words foundation + pairs phonetically with Phase 1.3 read-consonant-blends (the decoding-encoding canonical pair). Consonant blends are 2-letter consonant clusters where each letter retains its sound: bl- (blue, black), br- (brown, brick), cl- (clap, cloud), cr- (crab, cry), dr- (drop, draw), fl- (flag, flat), fr- (frog, fruit), gl- (glue, glass), gr- (green, grow), pl- (plant, play), pr- (press, pretty), sl- (slow, slip), sm- (smile, small), sn- (snake, snow), sp- (spoon, spin), st- (stop, star), sw- (swim, swing), tr- (tree, train). The kid hears a blend word + writes the correct 2-letter cluster at the start. Critical encoding work because blends appear in 30% of grade-1 high-frequency spelling vocabulary. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook: spelling the blend. Teacher says 'blue' +
      writes B-L-U-E on the board slowly, sounding out each letter:
      "b-l-u-e... blue. The first two letters are BL — that's a
      blend. Both B and L make sound: /b/-/l/." Class repeats. Then
      teacher hides the word + says 'brown' aloud. Class chants the
      first two letters: 'B... R... brown starts with BR.' Repeat
      with: 'frog' (F-R); 'stop' (S-T); 'swim' (S-W); 'drop' (D-R).
      Anchors the blend-cluster as a SPELLING UNIT — the kid writes
      the 2 letters together because they hear both sounds.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + dictation routine. Each pair receives a worksheet
      with 8 picture cards (frog, flag, snake, spoon, tree, train,
      glass, swing). Pair takes turns: kid A says the word; kid B
      writes it on a whiteboard from memory, starting with the
      blend. Pair checks each spelling against the picture-card
      reference. Recast errors with letter-by-letter sound-out
      ("you wrote 'rog' for 'frog' — let's listen to the start:
      /f-r/ frog. Two sounds at the start — F + R. Try again:
      F-R-O-G."). Optional extension: kids hunt the room for objects
      starting with each blend + write the words on a class list.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: word-scramble worksheet
      (rearrange letters to form blend-words: G-O-F-R = frog;
      P-S-O-T = stop). Station 2: word-guess (fill in blend from
      picture clue — __ee = tree; __ow = snow; __ap = clap).
      Station 3: vocabulary-tracing-strips for blend-anchor words.
      Station 4: matching worksheet (blend cluster to anchor-word
      pair — bl ↔ blue; br ↔ brown; tr ↔ tree).
  closure:
    durationMinutes: 5
    body: |
      Whole-class spelling mini-quiz. Teacher reads 5 blend-words
      aloud (frog / blue / stop / swim / tree); kids write each on
      individual whiteboards. Quick visual scan checks accuracy.
      Forward-pointer: "Today we spelled blend words. When we come
      back to writing next, we'll spell words with DIGRAPHS — sh /
      ch / th / wh — two-letter combinations that make just ONE
      sound (ship, chair, three, whale)."

