compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (RECEPTIVE — pointing to named
    farm animal, not naming the animal). Secondary strand: visual
    discrimination (animal silhouette recognition, animal-vs-non-animal
    odd-one-out).

    Pairing pattern with productive package: identify-and-name-10-farm-
    animals (Arc 1 first authored package) was the canonical productive
    reference; this receptive variant uses the same 10-key cluster but
    composes against receptive-surface exercises (matching is image-to-
    word; shadow-match is image-to-silhouette; find-and-count counts
    image instances; odd-one-out picks images NOT in the cluster — all
    surfaces require recognition, not production).

    Architectural validation: paired-receptive packages validate the
    productive↔receptive architecture across the vocabulary-acquisition
    strand. The pattern generalizes to point-to-named-zoo-animal,
    point-to-named-color, point-to-named-vehicle, point-to-named-clothing-
    item — all CLEAN-substrate receptive variants ready for future arcs.

    Vocabulary-tracing-strips note: kept smaller (4 keys: cow, pig, dog,
    duck — all 3-letter or short words) for K-3 handwriting-readiness
    layer. Tracing the simplest farm-animal names builds pre-writing
    motor skill alongside receptive vocabulary practice.

    K-3 multilingual classroom relevance: receptive packages are
    particularly important for kids in target-language-immersion contexts
    where they may understand much more than they can produce. This
    package validates teacher receptive comprehension before expecting
    productive performance — a more pedagogically appropriate assessment
    for early-immersion learners.

curriculumStandards:
  - EYFS.ELG.UW
  - EYFS.ELG.LL
  - IB-PYP.SharingThePlanet

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Point to the correct farm-animal picture-card when teacher names it
        in target language in 9 of 10 trials.
      - Point to the correct farm-animal in a farm-scene context (mixed
        animals visible; child finds the named one) in 8 of 10 trials.
      - Match farm-animal pictures to farm-animal words in 8 of 10 trials.

    Differentiation:
    - Pre-K: 6-key receptive set (subset of the 10); flashcard recognition
      only.
    - K: 10-key receptive set; flashcard + farm-scene context.
    - Grade 1+: bridge to productive identify-and-name-10-farm-animals
      (Arc 1) — kids transition from pointing to naming.

