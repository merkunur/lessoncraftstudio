assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Segment a heard CVC word into 3 phonemes in 7 of 10
        trials.
      - Use Elkonin-box methodology (one tap per phoneme) in
        8 of 10 trials.
      - Identify the phoneme-count of a heard CVC word in 7
        of 10 trials.
      - Match a heard CVC word to its 3-box Elkonin
        representation in 7 of 10 trials.
      - Write each phoneme in its Elkonin-box position
        (segmentation → encoding bridge) in 5 of 8 attempts.
      - Use vocabulary 'segment' / 'pull apart' / 'separate
        sounds' / 'sound box' / 'phoneme' (if introduced
        formally) correctly in 5 of 10 productive-language
        trials.

    Differentiation:
    - Pre-K: focus on rhyme + syllable + initial-phoneme work;
      defer full phoneme-segmentation to K.
    - K: 3-phoneme CVC segmentation with Elkonin-box scaffold;
      defer 4+ phoneme segmentation + consonant-blend
      decomposition to Grade 1.
    - Grade 1: full CVC + CVCC + CCVC segmentation; bridge to
      written-word segmentation + early spelling (kids
      segment THEN encode each phoneme as a letter).
    - Grade 2+: extend to multi-syllable segmentation
      (compound + 2-syllable words via syllable-segmentation
      then phoneme-segmentation within each syllable); bridge
      to systematic phonics decoding + word-attack strategies.

