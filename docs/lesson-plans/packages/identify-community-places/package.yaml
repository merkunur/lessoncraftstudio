compositionalRationale:
  en: |
    Primary strand: world-knowledge / community-and-roles (SAT-
    CLOSING canonical fill at 2/3 → 3/3). Secondary strand: early-
    literacy / vocabulary-acquisition (place names + function
    vocabulary). Tertiary strand: world-knowledge / time-and-routine
    (when-do-we-go-to-X daily-life sequencing: weekday-routines
    visit certain places; weekend-routines visit others).

    Architectural significance: this package CLOSES the community-
    and-roles canonical strand at 3/3 — final canonical target for
    the strand. Pairs to Arc 11 identify-community-helpers: helpers
    identifies WHO works in the community; places identifies WHERE
    those helpers work + WHAT happens at each place. Together the
    pair builds a complete community-vocabulary substrate: K-3 kids
    can now name the people + the places + the functions of their
    civic context. community-and-roles strand now fully saturated;
    world-knowledge domain coverage advances: 6 of 6 strands
    saturated post-Arc-17 P1.1 (alongside share-and-take-turns
    PSED close at the same phase).

    Distinctive composition: 5 exercises across 4 apps — matching
    (positions 1 + 3) establishes place-image to place-name pairing
    + place-to-function pairing; picture-sort (position 2) surfaces
    community-place-vs-home-place categorical distinction (kids
    sort places-out-in-the-community vs places-inside-our-home —
    a foundational spatial-civic awareness); math-worksheet
    (position 4) introduces counting-as-community-engagement
    reflection; odd-one-out (position 5) tests categorical
    discrimination as assessment (which item doesn't fit the
    community-place set — a non-civic-place outlier).

    World-knowledge class material composition: 7-material per
    fan-out class-conditional disposition. REMOVE vocabulary-
    tracing-strips per world-knowledge class convention —
    place-name tracing surfaces at letter-recognition + handwriting
    strand intersections, not at world-knowledge primary
    contribution where the load-bearing work is conceptual
    place-function pairing rather than letter-form practice. KEEP:
    flashcards (place-name vocabulary anchor) + picture-cards
    (visual community-place reference) + matching-mat (place →
    function pairing game) + sentence-strips (\"we go to the __
    to __\" function frame) + manipulative-cut-outs (community-
    map cut-outs for spatial-arrangement work) + parent-take-home-
    letter (parents reinforce community-place visits at home) +
    answer-key.

    Substrate note: image library does NOT contain a dedicated
    community-places theme. Substrate proxy uses school-objects
    theme (which contains some place-relevant imagery — books +
    chalkboards for school; bread + utensils for bakery/kitchen
    contexts; tools for various civic-place contexts). This is a
    KNOWN SUBSTRATE LIMITATION per identify-community-helpers
    precedent (Arc 11) — image-library extension to dedicated
    community-places imagery would expand this package's substrate;
    until then, kids work with available place-adjacent imagery
    + teacher supplements with photographs of local community
    places where possible.

    Class B FLEXIBLE substrate: composes against school-objects
    theme. Substrate limitation acknowledged + class-conditional
    REMOVE applies per world-knowledge class.

    K-3 multilingual classroom relevance: community-place
    vocabulary is HIGHLY culturally specific — place names + place
    types vary across locales. International school + dual-language
    classroom contexts encounter rich diversity (e.g., a Spanish-
    Brazilian K-3 student knows \"padaria\" + \"farmácia\" as
    common community places; a German-international K-3 student
    knows \"Apotheke\" as a distinct pharmacy concept separate
    from the supermarket; a Nordic K-3 student knows
    \"bibliotek\" as a heavily-used civic space). Locale-variant
    sparse-overrides preserve local-civic-vocabulary register
    while maintaining the place-function-coupling cognitive
    work. Particularly load-bearing for international school +
    dual-language program contexts where kids bring diverse
    civic-experience to classroom discussion + benefit from
    explicit vocabulary work to share their community-knowledge
    in the classroom target language.

