assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Trace the correct path through a 15-grid simple maze in 8 of 10
        attempts.
      - Trace the correct path through an 18-grid maze with multiple
        dead-ends in 6 of 10 attempts.
      - Articulate path directions when narrating ("right, down, right,
        down") in 7 of 10 trials.

    Differentiation:
    - Pre-K: 15-grid mazes with very clear single-path routes; finger-
      trace only.
    - K: 16-18 grid mazes with 1-2 dead-ends; pencil-trace.
    - Grade 1+: 20-grid mazes with multiple dead-ends + bridge to
      choose-path multi-route mazes (Arc 9+ candidate).

