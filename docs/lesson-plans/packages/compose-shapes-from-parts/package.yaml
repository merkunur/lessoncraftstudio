compositionalRationale:
  en: |
    Primary strand: math / geometry (compose 2D shapes from
    smaller shapes — extends strand 5/8 → 6/8 via spatial-
    composition work). Secondary strand: spatial-reasoning
    (kids manipulate pieces in space + reason about part-
    whole relationships). Tertiary strand: vocabulary-
    acquisition (composition vocabulary: compose, decompose,
    part, whole, primitive, composite).

    Architectural significance: extends geometry strand from
    shape-recognition + attribute-analysis (Arc 9 identify-
    2d-shapes-basic + Arc 9 identify-2d-shapes-extended +
    Arc 14 describe-shape-attributes) into spatial-
    composition reasoning. First package to surface the part-
    whole structure of shapes — kids learn that familiar
    composite shapes (house, fish, rocket) decompose into
    primitive shapes (triangle, square, rectangle), and
    primitives compose into composites. This is the K-3
    anchor for later geometric reasoning: area calculation
    treats a complex shape as a sum of simpler areas;
    fraction-of-shape work (Arc 17+ candidate partition-
    shape-halves-quarters) is composition with the
    constraint of equal parts.

    Distinctive composition: 2 matching (intro + assessment,
    bookending the primitive-to-composite pairing work) + 1
    missing-pieces (the canonical app for composition gap-
    filling work — kids see a composite with one primitive
    missing and identify the missing piece) + 1 grid-match
    (spatial-fit work, drag pieces into a grid layout) + 1
    picture-sort (sorting shapes by composition category).
    Missing-pieces at position 2 is load-bearing: the app's
    shape-masked placed pieces + 1-to-N options-with-
    distractors palette is purpose-built for composition
    work where kids must identify which primitive completes
    a partial composite.

    Class B FLEXIBLE substrate: composes against shapes
    theme (geometry strand canonical theme — used by
    identify-2d-shapes-basic + identify-3d-shapes + identify-
    3d-shape-properties + describe-shape-attributes; cross-
    arc consistency).

    K-3 multilingual classroom relevance: shape-composition
    is universal K-3 geometry content. The composition
    relationships (two triangles → square; six triangles →
    hexagon) are locale-portable — the geometry is the same
    in every locale. Shape-name vocabulary is cognate-rich
    in Romance (triangle / triángulo / triângulo / triangolo;
    square / cuadrado / quadrado / quadrato) but distinct in
    Germanic (Dreieck = three-corner = triangle; Quadrat =
    square; Sechseck = six-corner = hexagon — German shape
    names are descriptive compounds that already encode
    composition structure). Composition vocabulary (compose,
    decompose, part, whole, primitive, composite) is more
    varied: en 'compose'; de 'zusammensetzen' (compound:
    together-set); es 'componer'; pt 'compor'; fr 'composer';
    fi 'koota' (to assemble). The hands-on cut-out work
    bypasses much of the vocabulary load — kids can do the
    composition manipulation regardless of which vocabulary
    is being introduced. Locale-variant work at Phase 3+
    adapts to each locale's shape + composition register.

