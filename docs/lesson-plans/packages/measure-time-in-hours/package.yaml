# Teaching package — measure time in hours (duration measurement)
# Arc 16 Phase 1.2 (math / measurement strand-depth 2/4 → 3/4; extends Arc 15 Phase 2 measure-length-with-non-standard-units; distinct from Arc 14 read-time-on-analog-clock which covers clock-mechanic reading).

targetSlug: measure-time-in-hours
language: en
title:
  en: "Measuring Time in Hours — how long does something take?"

description:
  en: "K-Grade 1 math/measurement package teaching kids to MEASURE DURATIONS in hour-units. EXPLICITLY distinct from existing read-time-on-analog-clock (which teaches clock-mechanic reading of time-of-day): this package teaches DURATION measurement — how long does an activity take, how long until lunch, how long was recess. Builds on Arc 15 Phase 2 measure-length-with-non-standard-units (which established measurement vocabulary + estimation routines) + Arc 14 compare-by-time-duration (which compared durations qualitatively: longer/shorter without unit). Critical extension into UNIT-BASED duration measurement (hour as canonical first unit for K-3 timescales). Kids learn: 'school day is about 6 hours', 'sleep is about 10-12 hours', 'one TV show is about 1 hour'. Foundation for elapsed-time work + schedule reading (Arc 17+ candidate). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + duration-vocabulary introduction.
      Teacher displays a routine timeline (school day): wake-up
      → breakfast → school start → lunch → school end → home →
      bedtime. "Today we MEASURE TIME — not what time it IS on
      the clock, but how LONG things take. Sleeping is LONG —
      about 10 hours. Eating breakfast is SHORT — about half an
      hour. School lasts ABOUT 6 hours." Teacher introduces
      "hour" as the canonical K-3 duration unit: "One hour is
      about how long lunch + recess takes, OR one TV show, OR
      one swim class." Class names familiar 1-hour activities;
      Teacher writes them on board. Distinguishes from clock-
      reading work: "We're NOT asking 'what time?' We're asking
      'how long?'"
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + duration-estimation routine. Each pair receives
      a "duration sort" mat (3 columns: less-than-an-hour /
      about-an-hour / more-than-an-hour) + 12 activity-cards
      (brush teeth, eat lunch, sleep at night, watch one cartoon,
      ride to school, play outside, do a puzzle, take a bath,
      attend school day, read one book, swim class, drive across
      town). Pair takes turns: kid A reads a card; together they
      estimate duration + place in the correct column. Recast
      errors with familiar-anchor demo ("sleeping all night is
      MUCH more than an hour — usually 10 hours. So that goes
      in 'more-than-an-hour' column."). Extension: kids invent
      their own duration-cards.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (activity-
      to-duration; e.g., "brush teeth" ↔ "less-than-an-hour";
      "school day" ↔ "more-than-an-hour"). Station 2: math-
      worksheet (estimate-duration problems: "How long is recess?
      ____ hour(s)"). Station 3: chart-count (count hour-units
      in a daily routine: "from 8am to 12pm is ____ hours").
      Station 4: more-less (compare two durations: "Is eating
      lunch LONGER or SHORTER than sleeping?").
  closure:
    durationMinutes: 5
    body: |
      Whole-class duration-quiz. Teacher names activities; class
      collectively estimates: "How long is one cartoon episode?
      About 1 hour! How long do you sleep at night? About 10
      hours! How long does brushing teeth take? Less than 1
      hour!" Forward-pointer: "Today we measured time in HOURS.
      When we come back next, we'll measure SHORTER durations
      (minutes) + LONGER durations (days, weeks) + read CLOCKS
      to figure out when activities START + when they FINISH —
      and how many hours between them ('elapsed time')!"

