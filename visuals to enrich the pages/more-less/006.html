<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Mehr Weniger - Variety Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(165deg, #E3F2FD 0%, #FFF8E1 40%, #FFFDE7 60%, #FFF3E0 100%); overflow: hidden;">

        <!-- Floating clouds -->
        <div style="position: absolute; top: 60px; left: 60px; width: 120px; height: 45px; background: rgba(255,255,255,0.6); border-radius: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);"></div>
        <div style="position: absolute; top: 45px; left: 95px; width: 70px; height: 35px; background: rgba(255,255,255,0.5); border-radius: 30px;"></div>
        <div style="position: absolute; top: 100px; right: 80px; width: 100px; height: 40px; background: rgba(255,255,255,0.5); border-radius: 35px;"></div>
        <div style="position: absolute; top: 85px; right: 105px; width: 60px; height: 30px; background: rgba(255,255,255,0.4); border-radius: 25px;"></div>

        <!-- Subtle radial warmth -->
        <div style="position: absolute; top: 50%; left: 50%; width: 900px; height: 900px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,179,0,0.06) 0%, transparent 60%); border-radius: 50%;"></div>

        <!-- Floating animal emojis -->
        <div style="position: absolute; top: 175px; left: 40px; font-size: 32px; opacity: 0.7; transform: rotate(-10deg);">&#128059;</div>
        <div style="position: absolute; top: 340px; left: 25px; font-size: 28px; opacity: 0.6; transform: rotate(8deg);">&#128039;</div>
        <div style="position: absolute; top: 510px; right: 30px; font-size: 30px; opacity: 0.65; transform: rotate(-5deg);">&#128056;</div>
        <div style="position: absolute; top: 680px; left: 35px; font-size: 26px; opacity: 0.55; transform: rotate(12deg);">&#128049;</div>
        <div style="position: absolute; top: 250px; right: 35px; font-size: 28px; opacity: 0.6; transform: rotate(-8deg);">&#129446;</div>
        <div style="position: absolute; top: 600px; right: 55px; font-size: 24px; opacity: 0.5; transform: rotate(15deg);">&#128054;</div>

        <!-- Sparkle stars along path -->
        <div style="position: absolute; top: 320px; left: 320px; width: 14px; height: 14px; opacity: 0.7;">
            <div style="position: absolute; top: 5px; left: 0; width: 14px; height: 4px; background: #FFD54F; border-radius: 2px;"></div>
            <div style="position: absolute; top: 0; left: 5px; width: 4px; height: 14px; background: #FFD54F; border-radius: 2px;"></div>
        </div>
        <div style="position: absolute; top: 530px; right: 270px; width: 12px; height: 12px; opacity: 0.6;">
            <div style="position: absolute; top: 4px; left: 0; width: 12px; height: 4px; background: #4DD0E1; border-radius: 2px;"></div>
            <div style="position: absolute; top: 0; left: 4px; width: 4px; height: 12px; background: #4DD0E1; border-radius: 2px;"></div>
        </div>
        <div style="position: absolute; top: 430px; left: 480px; width: 10px; height: 10px; opacity: 0.6;">
            <div style="position: absolute; top: 3px; left: 0; width: 10px; height: 4px; background: #FF8A80; border-radius: 2px;"></div>
            <div style="position: absolute; top: 0; left: 3px; width: 4px; height: 10px; background: #FF8A80; border-radius: 2px;"></div>
        </div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 22px; left: 28px; z-index: 100;">
            <div style="background: linear-gradient(145deg, #FF6B6B, #EF5350); padding: 10px 22px; border-radius: 26px; box-shadow: 0 6px 20px rgba(239,83,80,0.4); border: 3px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 1px;">GRATIS</span>
            </div>
        </div>

        <!-- Vorschule Badge -->
        <div style="position: absolute; top: 22px; right: 28px; z-index: 100;">
            <div style="background: rgba(255,255,255,0.95); padding: 10px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #009688;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: #009688; letter-spacing: 1px;">Vorschule</span>
            </div>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 72px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 54px; color: #00796B; margin: 0; text-shadow: 2px 2px 0 rgba(0,121,107,0.08);">Viele Themen &amp; Aufgaben!</h1>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 22px; color: #26A69A; margin: 6px 0 0 0; letter-spacing: 1px;">S&uuml;&szlig;e Tierbilder zum Vergleichen</p>
        </div>

        <!-- Winding dotted path -->
        <svg style="position: absolute; top: 180px; left: 0; width: 1000px; height: 620px; z-index: 5;" viewBox="0 0 1000 620">
            <path d="M 220 80 C 350 80, 400 180, 500 200 S 650 250, 700 350 S 600 450, 450 470" stroke="#26A69A" stroke-width="4" stroke-dasharray="12 8" fill="none" opacity="0.35"/>
        </svg>

        <!-- Worksheet 1: Top-left -->
        <div style="position: absolute; top: 200px; left: 90px; z-index: 20;">
            <div style="position: relative;">
                <div style="width: 210px; height: 272px; background: white; border-radius: 12px; box-shadow: 0 12px 35px rgba(0,0,0,0.18); overflow: hidden; border: 4px solid #E0F2F1;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/more%20less/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Tiere vergleichen">
                </div>
                <!-- Badge -->
                <div style="position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #009688, #00796B); padding: 7px 16px; border-radius: 20px; box-shadow: 0 4px 12px rgba(0,150,136,0.35); white-space: nowrap; border: 2px solid rgba(255,255,255,0.6);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: white;">Tiere vergleichen</span>
                </div>
            </div>
            <!-- Step number -->
            <div style="position: absolute; top: -18px; left: -18px; width: 42px; height: 42px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 4px 12px rgba(249,168,37,0.4); display: flex; align-items: center; justify-content: center; border: 3px solid white; z-index: 30;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #3E2723;">1</span>
            </div>
        </div>

        <!-- Worksheet 2: Middle-right -->
        <div style="position: absolute; top: 360px; left: 400px; z-index: 20;">
            <div style="position: relative;">
                <div style="width: 210px; height: 272px; background: white; border-radius: 12px; box-shadow: 0 12px 35px rgba(0,0,0,0.18); overflow: hidden; border: 4px solid #FFF3E0;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/more%20less/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Symbol einsetzen">
                </div>
                <!-- Badge -->
                <div style="position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #FF9800, #EF6C00); padding: 7px 16px; border-radius: 20px; box-shadow: 0 4px 12px rgba(255,152,0,0.35); white-space: nowrap; border: 2px solid rgba(255,255,255,0.6);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: white;">Symbol einsetzen</span>
                </div>
            </div>
            <!-- Step number -->
            <div style="position: absolute; top: -18px; left: -18px; width: 42px; height: 42px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 4px 12px rgba(249,168,37,0.4); display: flex; align-items: center; justify-content: center; border: 3px solid white; z-index: 30;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #3E2723;">2</span>
            </div>
        </div>

        <!-- Worksheet 3: Bottom-right -->
        <div style="position: absolute; top: 500px; left: 700px; z-index: 20;">
            <div style="position: relative;">
                <div style="width: 210px; height: 272px; background: white; border-radius: 12px; box-shadow: 0 12px 35px rgba(0,0,0,0.18); overflow: hidden; border: 4px solid #E3F2FD;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/more%20less/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bild und Zahl">
                </div>
                <!-- Badge -->
                <div style="position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #1E88E5, #1565C0); padding: 7px 16px; border-radius: 20px; box-shadow: 0 4px 12px rgba(30,136,229,0.35); white-space: nowrap; border: 2px solid rgba(255,255,255,0.6);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: white;">Bild &amp; Zahl</span>
                </div>
            </div>
            <!-- Step number -->
            <div style="position: absolute; top: -18px; left: -18px; width: 42px; height: 42px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 4px 12px rgba(249,168,37,0.4); display: flex; align-items: center; justify-content: center; border: 3px solid white; z-index: 30;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #3E2723;">3</span>
            </div>
        </div>

        <!-- Arrow connectors -->
        <div style="position: absolute; top: 365px; left: 315px; z-index: 15; font-size: 32px; color: #26A69A; opacity: 0.6; transform: rotate(25deg);">&#10140;</div>
        <div style="position: absolute; top: 560px; left: 625px; z-index: 15; font-size: 32px; color: #26A69A; opacity: 0.6; transform: rotate(15deg);">&#10140;</div>

        <!-- Bottom pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 50;">
            <div style="background: linear-gradient(145deg, #FDD835, #F9A825); padding: 12px 24px; border-radius: 28px; box-shadow: 0 5px 18px rgba(249,168,37,0.4); border: 3px solid rgba(255,255,255,0.6);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: #3E2723;">&#9733; Das ganze Jahr einsetzbar!</span>
            </div>
            <div style="background: linear-gradient(145deg, #009688, #00796B); padding: 12px 24px; border-radius: 28px; box-shadow: 0 5px 18px rgba(0,150,136,0.4); border: 3px solid rgba(255,255,255,0.5);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: white;">&#8595; Sofort-Download</span>
            </div>
        </div>

    </div>
</body>
</html>
