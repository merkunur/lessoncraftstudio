# Teaching package — identify the setting of a story
# Arc 18 Phase 1.2 (language-and-communication / reading-comprehension 4/10 → 5/10). Pair-coherent ship pattern with Arc 17 P1.5 identify-main-character — together forms the K-level character+setting dual-extraction reading-comprehension module. Builds on Arc 12 Phase 2 match-sentence-to-picture (the strand-FIRST 0/10 → 1/10 reading-comp foundation).

targetSlug: identify-setting
language: en
title:
  en: "Identify the Setting — where does the story happen?"

description:
  en: "Kindergarten / Grade 1 reading-comprehension package teaching kids to identify the SETTING in a story — the PLACE where the story happens. Builds on Arc 12 Phase 2 match-sentence-to-picture (the strand-FIRST reading-comprehension foundation) AND pair-coherent with Arc 17 P1.5 identify-main-character — together the two packages form the K-level character+setting dual-extraction module. Kids who can identify WHO the story is about (the main character) can now also identify WHERE the story happens (the setting). Reading-comprehension strand advances 4/10 → 5/10 (match-sentence-to-picture + predict-from-picture-cue + sequence-3-event-story + identify-main-character are the existing siblings). Per §A.13.30 K-1-informal framing: K-1 work is setting-identification in TEACHER-LED READ-ALOUD or PICTURE-SUPPORTED text, NOT independent decoding + advanced literary analysis. Kids listen to or follow along with a short story; teacher asks 'where does this story happen?' and kids identify the setting (typically shown in background pictures or named in the opening sentence). The setting at K-1 is most often a recognizable PLACE — home, school, park, playground, farm, forest, beach, store. Indoor vs outdoor distinction is the foundational sorting dimension. CCSS.RL.K.3 primary anchor ('With prompting and support, identify characters, settings, and major events in a story'); CCSS.1.RL.3 Grade 1 extension. 5 worksheet exercises + 8 printable materials over a 1-week unit. Load-bearing material: sentence-strips with this-is-a framePreset (story-setting anchor frames: 'This is a [setting]. The story happens at the [setting].')."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class story-setting introduction with read-aloud.
      Teacher reads a short familiar picture-book aloud
      (e.g., 'The Very Hungry Caterpillar' by Eric Carle —
      the caterpillar moves through a garden + a forest;
      or 'Where the Wild Things Are' by Maurice Sendak —
      Max travels from his bedroom to the island of the
      wild things). After reading: "Where did this story
      happen?" Class names the setting (the garden; the
      bedroom + the island). "How did you know? What did
      the pictures show us?" Class explains they saw the
      setting in the background of most pages, the opening
      sentence sometimes named the place, the characters
      did their actions IN that place. Teacher then
      introduces vocabulary: "We call this the SETTING —
      the PLACE where the story happens. Some stories have
      ONE setting; some stories travel between SEVERAL
      settings. We ask: where does this story happen?"
      Teacher repeats with a second short story featuring
      a clearly-pictured setting (e.g., 'Goodnight Moon'
      by Margaret Wise Brown — the bunny is in a bedroom).
      Class identifies the bedroom as the foundational
      setting. Pattern emphasis: "When we read a story,
      ASK: where does this happen? The SETTING appears in
      the BACKGROUND of the pictures, the opening sentence
      sometimes NAMES it, the characters do their actions
      IN that place."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + story-and-setting routine. Each pair
      receives 6 short story cards (3-4 sentences each
      with picture-support; clear background-setting in
      each picture) + 6 setting cards (the setting of each
      story shown alone — a picture of the place without
      characters in it). Pair takes turns: kid A reads a
      story card aloud (or teacher reads if reading-
      fluency not yet there); kid B identifies the setting
      + finds the matching setting card. Both kids say
      aloud: "The story happens at the [setting]." Recast
      errors with cue-pointing ("you said the setting was
      the farm, but look at this picture — there are
      buildings + sidewalks + people walking past stores
      — this story happens at the supermarket, not the
      farm."). The setting cards provide the matching
      scaffold; the story cards provide the narrative
      context. Optional extension: kids re-tell their
      favorite story to their partner using the setting
      cards as visual aid + practice the setting
      vocabulary in retelling. Note for the teacher: K-1
      kids will sometimes confuse the setting (where) with
      the character (who) — explicit side-by-side
      contrasting work supports the distinction ("the
      character is the bunny; the setting is the
      bedroom").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity
      (setting-image to setting-name; vocabulary anchor
      for the place-vocabulary kids encounter across
      stories). Station 2: picture-sort activity (sort
      setting cards into 'indoor places' vs 'outdoor
      places' categories — surfaces the foundational
      setting-type distinction K-1 kids work with).
      Station 3: missing-pieces (complete the setting
      image — supports the visual setting-recognition
      the comprehension skill builds on). Station 4:
      matching activity (story-card to setting-card; the
      canonical comprehension-skill exercise).
  closure:
    durationMinutes: 5
    body: |
      Whole-class setting quick-recall. Teacher displays 3
      story cards; class chorally identifies the setting
      of each. "This story happens at the FARM! This one
      is at the BEACH! This one is at SCHOOL!" Teacher
      then asks the reflection question: "How do you find
      the setting?" Class chants: "Look at the
      BACKGROUND! Listen to the OPENING SENTENCE! See
      where the characters do their actions!" Then the
      character+setting integration: "Now we know two
      story parts — the MAIN CHARACTER (who the story is
      about) + the SETTING (where the story happens).
      Together they tell us most of what a story is."
      Forward-pointer: "Today we identified settings.
      Reading is about understanding STORIES — and stories
      have CHARACTERS doing things in SETTINGS. Next
      we'll meet IDENTIFY THE PROBLEM AND SOLUTION (what
      goes wrong, and how is it fixed?). Stories almost
      always have a problem — that's what makes them
      stories. We're building toward telling stories
      ourselves."

