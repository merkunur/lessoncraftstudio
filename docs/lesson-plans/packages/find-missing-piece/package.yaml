compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial / visual-discrimination.
    Secondary strand: vocabulary acquisition (vocab-anchored). Tertiary
    strand: shape recognition (kids identify the SHAPE of the missing
    piece — circle, rectangle, ellipse — before evaluating candidate
    pieces).

    Vocab-anchor framing: same Phase 2 interpretation. Visual-spatial
    domain target with vocabulary-anchor pedagogical thread.

    Distinctive composition vs Phase 2 visual-discrimination siblings:
    uses missing-pieces app (5 modes available); 4 of 5 composedExercises
    use missing-pieces across 4 different shape-types (circle / rect-
    portrait / ellipse-landscape / circle again at assessment) +
    multiple theme contexts. Validates that missing-pieces architecture
    handles diverse shape types within teaching-package framework.

    Trio integration: match-image-to-shadow + match-image-piece-to-whole +
    find-missing-piece form a visual-discrimination trio in Arc 6 Phase 2.
    Each tackles a distinct visual-spatial reasoning surface:
    - shadow-match: full-image vs silhouette
    - piece-to-whole: fragmented partial vs full
    - find-missing-piece: image-with-hole vs candidate-piece-with-shape
    Together they validate the visual-discrimination strand at depth;
    fine-motor-and-visual-spatial domain receives 4 packages by Arc 6
    Phase 2 close (Arc 5 use-position-vocabulary + 3 Phase 2 trio).

    K-3 multilingual classroom relevance: missing-piece reasoning is a
    canonical visual-spatial K-3 skill (kids' jigsaw puzzles). Vocab-
    anchor pattern continues; high-leverage K-3 multilingual classroom
    time use.

curriculumStandards:
  - EYFS.ELG.M
  - EYFS.ELG.UW
  - IB-PYP.HowTheWorldWorks

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Find the correct missing piece in 8 of 10 trials when 3 candidates
        are offered.
      - Name the whole image before/after finding the piece in 8 of 10
        trials (vocabulary-anchor verification).
      - Articulate the strategy ("the piece must match the SHAPE of the
        hole AND the COLOR of the surrounding image") when prompted.

    Differentiation:
    - Pre-K: 2 candidate pieces; large hole shapes.
    - K: 3 candidate pieces; varied hole shapes.
    - Grade 1+: 4-5 candidate pieces; subtle distinctions between
      candidate pieces (similar colors; close shapes); extend to
      multi-piece jigsaw puzzles (visual-spatial-strand depth).

