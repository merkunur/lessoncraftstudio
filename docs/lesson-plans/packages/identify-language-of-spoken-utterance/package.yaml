assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify 3 of 5 spoken languages by ear in 7 of 10 listening
        trials.
      - Match a heard utterance to its country/flag in 6 of 10 trials.
      - Articulate that "different languages have different sound
        patterns" in 6 of 10 trials.

    Differentiation:
    - Pre-K: 2 strongly-contrasting languages (e.g., English vs Mandarin
      tonal contrast); listening-only; no flag-match.
    - K: 4-5 languages; flag-pairing; matching exercises.
    - Grade 1+: extend to language-discrimination by writing-system
      (e.g., Roman vs Cyrillic vs Arabic vs Chinese); bridge to
      multilingual-text recognition (Arc 10+ candidate).

