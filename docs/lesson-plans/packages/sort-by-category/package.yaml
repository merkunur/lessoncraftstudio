# Teaching package — sort objects by semantic category
# Arc 7 Phase 2 (Option A continuation; cognitive-and-executive-function /
# sorting-and-classification strand). Different from basic-attribute sorting
# (color/shape/size); this is SEMANTIC category sorting (animals vs vehicles;
# fruits vs vegetables; living vs nonliving). Class B FLEXIBLE; vocab-
# anchored.

targetSlug: sort-by-category
language: en
title:
  en: "Sort by Category — group objects by semantic category"
description:
  en: "Kindergarten cognitive-and-executive-function package teaching semantic category sorting. Distinct from basic-attribute sorting (color/shape/size from sort-by-color/shape/size trilogy) — this teaches kids to sort by MEANING (animals vs vehicles; fruits vs vegetables; tools vs toys). Bridges sorting-strand work with vocabulary-acquisition work. Vocab-anchored. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher places mixed objects (paper-cuts
      from various theme clusters: animals + vehicles + fruits + tools)
      on the carpet. "Let's group these. What goes together?" Class
      collaboratively sorts into semantic groups. Reinforces vocabulary
      across multiple clusters + the meta-skill of "what category does
      this belong to." Pin sample category cards to the math-language
      word wall.
  contentActivity:
    durationMinutes: 12
    body: |
      Whole-class sorting routine. Teacher places 2 large category-mat
      cards on the carpet (e.g., "Animals" and "Vehicles"). Holds up
      mixed objects from a pile; class collaboratively sorts onto
      matching mats. Pair work: kid A picks an object; kid B identifies
      its category and places it. Recast errors with explanation
      ("the cat is an animal, not a vehicle — animals are living things
      that move on their own"). Optional extension: 3-category sorting
      (animals vs vehicles vs fruits) increases cognitive load.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (sort objects
      between 2 semantic categories — animals vs vehicles; fruits vs
      vegetables). Station 2: matching worksheet (image-name reinforces
      target vocabulary). Station 3: manipulative cut-outs hands-on
      semantic sorting (kids physically place 20+ cut-outs on category
      mats; emphasizes sustained semantic-categorization attention).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names a category; kids show with
      classroom objects ("everyone find something that's a tool!").
      Forward-pointer: "Today we sorted by what things ARE — animals,
      vehicles, fruits. When we come back to sorting next, we'll sort
      by MULTIPLE things at once — like 'red AND round' or 'animal AND
      small'."

