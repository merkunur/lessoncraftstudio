assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Spot 3 of 5 differences between picture-pairs in 8 of 10 trials.
      - Spot 4-5 of 5 differences with extended time in 6 of 10 trials.
      - Articulate the differences in target language ("the X is Y in
        one picture; Z in the other") in 6 of 10 trials.

    Differentiation:
    - Pre-K: 2-3 large-difference picture-pairs.
    - K: 3-5 differences; mixed difficulty.
    - Grade 1+: 5-7 differences with subtle distinctions; bridge to
      find-hidden-target-in-busy-scene + count-instances-of-target-in-
      grid (Arc 6 Phase 2 cognitive cousins).

