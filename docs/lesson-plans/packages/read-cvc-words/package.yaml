# Teaching package — read CVC words (consonant-vowel-consonant)
# Arc 12 Phase 2 (Option G; early-literacy / phonics-decoding STRAND-FIRST
# 0/11 → 1/11). Foundational decoding skill.

targetSlug: read-cvc-words
language: en
title:
  en: "Reading CVC Words — sound out cat, dog, sun, hat"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching CVC (consonant-vowel-consonant) word decoding. **FIRST phonics-decoding strand package in the catalog.** Builds on Arc 10 identify-rhyming-pairs + Arc 11 count-syllables + Arc 11 identify-uppercase-letters + Arc 12 identify-lowercase-letters foundation. Kids sound out 3-letter CVC words by blending individual phonemes (c-a-t = 'cat'; d-o-g = 'dog'; s-u-n = 'sun'). Foundational decoding bridge from letter-recognition + phonological-awareness to actual word-reading. Vocab-anchored — CVC words drawn from familiar K-3 vocabulary. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class blend-the-sounds routine. Teacher writes "cat" on
      the board + sounds it out slowly: "c... a... t... cat!" Class
      repeats. Teacher emphasizes the BLEND — saying each sound +
      then running them together. Repeat with: "dog" (d-o-g); "sun"
      (s-u-n); "hat" (h-a-t); "pig" (p-i-g). Reinforces blend-as-
      reading-strategy.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sound-out routine. Each pair receives 8 picture
      cards with CVC-word labels. Pair takes turns: kid A points to
      a card; kid B sounds out the word ("c-a-t... cat") + then
      reads it fluently. Recast errors with explanation ("you said
      'sat' for 'cat' — let's listen to the first sound: 'cat'
      starts with /c/ not /s/. Read the letters left-to-right:
      c-a-t makes /k-a-t/ which is 'cat'"). Optional extension: kids
      use letter-cut-outs to BUILD their own CVC words; partner
      reads.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (CVC word to
      picture). Station 2: word-guess (kids fill in CVC-word letters
      from picture clues; reinforces letter-sound association).
      Station 3: manipulative cut-outs hands-on CVC-construction
      (kids build CVC words using letter-tile cut-outs; partner
      reads). Station 4: alphabet-train worksheet (letter recognition
      reinforces CVC-word letter components).
  closure:
    durationMinutes: 5
    body: |
      Whole-class read-aloud. Teacher writes 5 CVC words; class
      collectively reads each by sounding out + then fluently.
      Forward-pointer: "Today we read CVC words by sounding out the
      letters. When we come back to reading next, we'll read CVCe
      words — 'cake', 'bike', 'home' — where the silent 'e' at the
      end makes the vowel say its NAME (long-vowel sound) instead
      of its SHORT sound."

