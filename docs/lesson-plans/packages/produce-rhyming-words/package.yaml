# Teaching package — produce rhyming words
# Arc 19 Phase 1.1 Slot 4 (early-literacy / phonological-awareness strand 3/9 → 4/9). Pair-coherent with Phase 1.1 Slot 3 isolate-initial-phoneme. Foundational pre-reading skill: kids hear or see a word and GENERATE rhyming words (cat → hat, bat, mat, rat). Per learning-targets.json prerequisites: identify-rhyming-pairs (Arc 10; already shipped).

targetSlug: produce-rhyming-words
language: en
title:
  en: "Make a Rhyme — generate words that sound the same at the end"
description:
  en: "Kindergarten early-literacy package teaching kids to PRODUCE rhyming words. Builds on identify-rhyming-pairs prerequisite (Arc 10): kids who can recognize rhyming pairs now generate new rhymes themselves. Given 'cat', kids produce 'hat', 'bat', 'mat', 'rat', 'sat'. Phonological-awareness strand advances 3/9 → 4/9 (if Slot 3 isolate-initial-phoneme also ships). Critical productive-phonological skill: rhyme-production exercises the kid's mental representation of word-ending sound patterns + builds the foundation for word-family decoding. Per §A.13.30 K-1 informal framing: K rhyme-production work is CONCRETE PATTERN-COMPLETION — kids hear a target word + generate words matching its ending sound. NOT formal poetic-form pedagogy (terms like 'perfect rhyme' / 'slant rhyme' / 'rhyme scheme' are post-Grade-3 work); the K pedagogy uses everyday language ('words that sound the same at the end') to surface the rhyme pattern. CCSS.RF.K.2a primary anchor ('Recognize and produce rhyming words'). 5 worksheet exercises + 8 printable materials over a 1-week unit. Materials list mirrors identify-rhyming-pairs Class B FLEXIBLE substrate."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class rhyme-production hook. Teacher says: "I'm
      thinking of a word: CAT. Who can tell me a word that
      rhymes with CAT? Same sound at the end!" Class
      brainstorms: hat, bat, mat, rat, sat, fat, that, pat...
      Teacher writes them on the board in a column. "Look —
      all these words end with -at. They all RHYME with CAT
      because they share the same ending sound." Teacher
      repeats with: "BALL — what rhymes with BALL?" Class:
      fall, tall, wall, call, hall, small... "SUN — what
      rhymes with SUN?" Class: fun, run, bun, one, ton, none...
      Pattern emphasis: "When we MAKE rhymes, we keep the ending
      sound the same + change the beginning. -at family, -all
      family, -un family. These are RHYMING FAMILIES."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + rhyme-generation routine. Each pair receives
      6 target word cards (cat, ball, sun, pig, bed, sock) +
      blank paper. Pair takes turns: kid A picks a target
      card; kid B generates as many rhyming words as they can
      orally + kid A writes them down (or kid B writes if they
      can). Pair switches roles. Recast errors with rhyme-
      checking ("you said BIRD rhymes with CAT — do they sound
      the same at the end? CAT ends in -at; BIRD ends in -ird.
      Different! Let's try again: what ends in -at? HAT? Yes!
      MAT? Yes! BAT? Yes!"). Build rhyme-family fluency first
      with simple CVC families (-at, -an, -ot, -ig); defer more
      complex rhyme families (-ake, -ight, -ound) to later
      work. Critical pedagogical move: REAL or NONSENSE? K
      kids may generate nonsense rhymes (rat, kat, lat, plat).
      Accept nonsense rhymes as valid PHONOLOGICAL output (the
      rhyme-pattern is correct) while gently distinguishing
      real vs nonsense words. The phonological skill ALWAYS
      wins; spelling/meaning constraints come later.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (kids
      match target words to lists of rhyming words). Station 2:
      word-guess (kids fill in a rhyming word given a clue +
      partial spelling). Station 3: word-scramble (kids
      unscramble rhyming-family words; reinforces spelling of
      rhyme patterns). Station 4: missing-pieces (kids complete
      a rhyming-poem stanza by supplying the missing final
      word).
  closure:
    durationMinutes: 5
    body: |
      Whole-class rhyme-share-out. Teacher calls out a target
      word; class generates rhymes orally as fast as possible.
      "CAR!" (Class: jar, far, star, bar, scar...) "BUG!" (rug,
      mug, hug, jug, tug, dug...) "TREE!" (bee, see, free,
      knee, three, me...) Teacher closes: "Making rhymes
      EXERCISES our phonological-awareness MUSCLES. The more
      rhymes we make, the easier it becomes to hear ending
      sounds in NEW words we encounter when we read. Rhyme
      is one of the BIGGEST helpers for early reading."
      Forward-pointer: "Next we'll move to other phonological
      skills — segmenting words into sounds + blending sounds
      into words. Those work at the BEGINNING + MIDDLE of
      words, complementing the END-of-word rhyme work."

