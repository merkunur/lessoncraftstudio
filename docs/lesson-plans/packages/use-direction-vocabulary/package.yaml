compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial / spatial-reasoning
    (direction-vocabulary as motion language). Secondary strand: early-
    literacy / vocabulary-acquisition (vocab-anchored — direction words
    learned in motion contexts). Tertiary strand: speaking-and-listening
    (productive narration of direction sequences).

    Architectural significance: completes the spatial-vocabulary +
    direction-following progression spanning Arc 5+7+8. Arc 5 use-
    spatial-position-words covered POSITION vocab (on, under, next
    to); Arc 7 follow-directions-on-grid used direction vocab
    receptively (kids follow given directions); Arc 8 Phase 1
    navigate-simple-maze applied direction reasoning to maze-solving.
    This package makes direction vocab EXPLICIT + productive (kids
    NARRATE direction sequences themselves).

    Cross-strand integration: leverages prepositions app (positional
    + directional), picture-path app (motion through grid), matching
    app (vocabulary anchor). The 5-exercise composition reflects
    multi-app cross-strand pedagogy.

    Distinctive composition: 2 prepositions exercises spanning fillin
    + multiplechoice modes (positions 1 + 4) — the FIRST package to
    use both prepositions modes in single composition. picture-path
    pathway mode at position 3 + classic-maze at position 5 — same
    app at 2 difficulty progressions.

    Class B FLEXIBLE substrate: direction vocabulary is theme-agnostic
    at the cognitive level; composes against any image-library theme
    that provides anchor objects for direction prompts.

    K-3 multilingual classroom relevance: direction vocabulary is
    high-frequency K-3 target across all 11 platform locales. Kids
    encounter direction words in classroom routines daily ("line up
    behind Maya," "walk to the LEFT side of the room"). Productive-
    use of direction vocab in narration ("First I went FORWARD, then
    I turned RIGHT") is exactly the kind of sequenced-narration
    practice K-3 multilingual classrooms need. Position-vs-direction
    distinction is meaningful pedagogically — kids who know "next to"
    don't automatically know "right" / "left" without explicit
    direction-word work.

