# Teaching package — isolate medial phoneme
# Arc 19 Phase 1.2 Slot 3 (early-literacy / phonological-awareness strand 5/9 → 6/9). Completes the 3-position phoneme-isolation cluster (initial + final + medial). Pair-coherent with Phase 1.1 Slot 3 isolate-initial-phoneme + Phase 1.2 Slot 2 isolate-final-phoneme + Phase 1.2 Slot 4 blend-phonemes-cvc. Most cognitively-demanding of the 3 isolation positions: kids identify the MIDDLE VOWEL in spoken CVC words (cat → /a/; cot → /o/; cut → /u/). Prerequisites per learning-targets.json line 39: isolate-initial-phoneme + isolate-final-phoneme.

targetSlug: isolate-medial-phoneme
language: en
title:
  en: "Middle Sounds — what vowel is in the MIDDLE of the word?"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching kids to isolate the MEDIAL VOWEL PHONEME (middle sound) in spoken CVC words. Completes the 3-position phoneme-isolation cluster: initial (Phase 1.1 Slot 3) + final (Phase 1.2 Slot 2) + medial (this package). Phonological-awareness strand advances 5/9 → 6/9. Per learning-targets.json line 39 prerequisites: isolate-initial-phoneme (Phase 1.1 ✓ SHIPPED) + isolate-final-phoneme (Phase 1.2 Slot 2; ships concurrently this commission). MOST COGNITIVELY DEMANDING of the 3 phoneme-isolation positions because the medial vowel is the least perceptually-salient of the three sound positions — kids most easily perceive word-start (first-attended) + word-end (last-heard); the middle-vowel is sandwiched between. Distinct vowel-quality isolation matters for systematic phonics decoding: kids who hear cat/cot/cut as identical (all /k_t/ frame) cannot decode by vowel-substitution; this package teaches the vowel-quality distinction explicitly. Per §A.13.30 K-1 informal framing: K medial-vowel isolation work is CONCRETE VOWEL-DISCRIMINATION via minimal-pair contrasts (cat/cot/cut differ ONLY in middle-vowel; kids hear all three + name the middle vowel for each). NOT formal vowel-phonology pedagogy (IPA vowel chart + tongue-position diagrams are post-Grade-3 academic work). CCSS.RF.1.2c primary anchor ('Isolate and pronounce initial, medial vowel, and final sounds (phonemes) in spoken single-syllable words'). 5 worksheet exercises + 8 printable materials over a 1-week unit. **Phonological-awareness pedagogy is locale-specific — medial-vowel pedagogy especially so because vowel inventories differ structurally per language (English 5 short vowels vs pt-BR 7 oral + 5 nasal vowels).** Materials list mirrors isolate-initial-phoneme + isolate-final-phoneme Literacy 8-material canonical."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class middle-vowel hook. Teacher writes 3 CVC words
      on the board sharing the same consonant frame but different
      vowels: CAT — COT — CUT. "These three words have the SAME
      first sound /k/ + the SAME last sound /t/. What's
      DIFFERENT?" Class identifies: the middle sound. Teacher
      slow-pronounces each, EXTRA-stressing the middle vowel:
      "C-AAA-T. The middle sound of CAT is /a/." "C-OOO-T. The
      middle sound of COT is /o/." "C-UUU-T. The middle sound
      of CUT is /u/." Repeats with another minimal-pair set:
      MAT — MET — MIT. Pattern emphasis: "Every CVC word has a
      vowel in the MIDDLE. The middle vowel is the SHORT VOWEL
      SOUND between the first + last consonants. We learn the
      middle by listening BETWEEN the start and the end."
      Critical pedagogical framing — minimal-pair contrast:
      "When 3 words have the same first sound AND the same last
      sound, the ONLY difference is the middle vowel. Listen
      VERY closely to the middle to tell them apart."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + middle-vowel discrimination routine. Each pair
      receives 8 picture cards organized into minimal-pair sets
      (cat/cot/cut; pen/pin/pun; map/mop/mug) + 5 letter cards
      for the 5 short vowels (A, E, I, O, U). Pair takes turns:
      kid A picks a card; kid B says the word slowly, isolates
      the middle vowel, + places the picture under the matching
      vowel card. Critical pedagogical move: STRETCH the middle
      vowel during slow-pronunciation. K-1 kids often
      perceive the middle vowel as a brief transition + miss its
      distinct quality. Recast errors with vowel-stretching ("you
      said the middle of CAT is /e/ — let's stretch it: c-AAAAA-t.
      That's /a/ as in apple, not /e/ as in elephant. The /e/
      sound is different — listen: c-EEEEE-t would be a different
      word."). Use anchor-word imagery to make vowel-sounds
      memorable: /a/ as in APPLE, /e/ as in ELEPHANT, /i/ as in
      IGLOO, /o/ as in OCTOPUS, /u/ as in UMBRELLA. Some kids
      benefit from mouth-shape imitation ("watch my mouth: for
      /a/ the mouth opens wide; for /o/ it makes a round shape;
      for /u/ it pushes forward"). Build vowel-discrimination
      fluency progressively with high-contrast pairs first (cat/
      cot — /a/ vs /o/ are perceptually distant); defer high-
      similarity pairs (pen/pin — /e/ vs /i/ are perceptually
      close) to later work.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (picture →
      middle-vowel letter; kids match pictures to the vowel
      letter representing their middle sound). Station 2: word-
      guess (kids fill in the missing MIDDLE letter of a
      picture's name — most are vowels). Station 3: picture-
      sort (kids sort pictures into groups by middle-vowel —
      5 categories for 5 vowels OR 2 categories for high-
      contrast pairs). Station 4: word-scramble (kids unscramble
      simple CVC words; reinforces sound-letter mapping at the
      middle-vowel position which is the hardest position to
      acquire spelling-wise).
  closure:
    durationMinutes: 5
    body: |
      Whole-class CLUSTER-COMPLETION celebration + middle-vowel
      quick-recall. Teacher names a word; class shouts the
      middle vowel. "Cat!" /a/! "Big!" /i/! "Dog!" /o/! "Sun!"
      /u/! "Pen!" /e/! Teacher then announces the CLUSTER-
      COMPLETION: "Today we finished learning all THREE phoneme
      positions! First sound (Phase 1.1 Slot 3 isolate-initial-
      phoneme), last sound (Phase 1.2 Slot 2 isolate-final-
      phoneme), and now MIDDLE sound. CVC words have 3 sounds:
      first + middle + last. We can hear all three. That's
      called PHONEMIC AWARENESS — being able to hear every
      sound in a word." Forward-pointer: "Next we'll PUT the
      sounds TOGETHER (synthesis: /c/ + /a/ + /t/ = cat) and
      BREAK words APART (segmentation: cat = /c/ + /a/ + /t/).
      Synthesis is Phase 1.2 Slot 4 blend-phonemes-cvc; we
      learn that this week too. Then phoneme-segmentation comes
      next."

