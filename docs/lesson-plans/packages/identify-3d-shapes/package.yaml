compositionalRationale:
  en: |
    Primary strand: geometry / spatial-reasoning. Secondary strand: vocabulary
    acquisition (3D-shape names + 2D↔3D mapping vocabulary).

    Pedagogical bridge from 2D to 3D: every 3D shape relates to a 2D shape
    (sphere↔circle, cube↔square, cylinder↔circle/rectangle, cone↔triangle/circle,
    pyramid↔triangle). The package exploits this mapping in the contentActivity
    + scaffold sections; matching exercise at position 1 + 3 lets kids practice
    naming 3D-shapes; shadow-match at position 2 reinforces the 2D↔3D projection
    relationship (cube projects as square; sphere projects as circle).

    Distinctive material weighting: 7 materials (matches identify-2d-shapes-basic
    structure for cross-package consistency in geometry strand). Real-world
    objects (tennis ball, cube box, soup can, party hat) recommended in
    contentActivity; not formally bundled in materials but standard K-3
    classroom availability.

    K-3 multilingual classroom relevance: 3D-shape names are slightly later-
    acquired than 2D-shape names; many locales have shape-name patterns where
    2D + 3D forms differ minimally (English: square vs cube; Spanish: cuadrado
    vs cubo). Operator-side teachers can emphasize this pattern in the target
    language to reinforce shape-name morphology.

