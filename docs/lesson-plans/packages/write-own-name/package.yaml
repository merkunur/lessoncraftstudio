assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Trace own name correctly (legible) in 8 of 10 attempts.
      - Write own name independently (no tracing aid) in 6 of 10
        attempts.
      - Identify own name in print among classmates' names in 8 of 10
        trials.

    Differentiation:
    - Pre-K: trace own name with teacher hand-over-hand support;
      receptive name-recognition.
    - K: independent name-writing; legible if not perfectly formed.
    - Grade 1+: extend to FULL name (first + last); bridge to label-
      a-picture-with-1-word (Arc 13+ candidate) + writing-simple-
      sentences.

