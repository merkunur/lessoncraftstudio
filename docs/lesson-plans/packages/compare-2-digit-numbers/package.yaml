assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compare 2-digit number pairs correctly in 8 of 10
        trials.
      - Apply the tens-first algorithm (compare tens
        digits first; only compare ones if tens are equal)
        in 7 of 10 trials.
      - Use comparison vocabulary 'greater than' / 'less
        than' / 'equal to' (or culture-appropriate
        synonyms like 'bigger / smaller / same') in 7 of
        10 productive-language trials.
      - Write comparison statements using >, <, = symbols
        correctly in 6 of 10 trials.

    Differentiation:
    - Pre-K: skip 2-digit comparison entirely; build 1-
      digit comparison foundation first.
    - K: introduce 2-digit comparison only with multiples
      of 10 (10, 20, 30, ... 90) where tens-comparison is
      trivial; full no-same-tens range only.
    - Grade 1: full 2-digit comparison fluency; both
      cases practiced (different-tens + same-tens with
      ones-tiebreaker); comparison-symbol notation
      introduced.
    - Grade 2+: extend to 3-digit comparison (hundreds-
      first then tens then ones); bridge to ordering
      multiple numbers + number-line placement.

