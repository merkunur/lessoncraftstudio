compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial / visual-discrimination.
    Secondary strand: vocabulary acquisition (vocab-anchored — kids
    name the differing items). Tertiary strand: detail-attention +
    sustained-comparison reasoning.

    Architectural significance: 4th package in visual-discrimination
    strand. Arc 6 Phase 2 trio (match-image-to-shadow + match-image-
    piece-to-whole + find-missing-piece) covered 3 visual-discrimination
    surfaces; this Arc 7 Phase 2 package adds spot-the-difference as
    the 4th surface. Visual-discrimination strand depth substantial:
    4 packages.

    Distinctive composition: 3 find-objects oddoneout exercises across
    3 theme contexts (animals, vehicles, fruits) + 1 matching at
    position 2 + 1 shadow-match at position 4. find-objects oddoneout
    mode is the canonical spot-the-difference surface; shadow-match
    at position 4 reintroduces the Arc 6 Phase 2 visual-discrimination
    architecture for cross-package consistency.

    Cross-strand integration: spot-the-difference combines vocabulary
    acquisition (kids name what they see) + cognitive flexibility
    (kids switch attention between two similar visual fields) + fine-
    motor work (circling differences on worksheets).

    K-3 multilingual classroom relevance: spot-the-difference is high-
    engagement for K-3 (kids love finding differences); vocab-anchor
    embeds language acquisition. The package's discussion surfaces
    ("what's different about the cat?" → "the cat in MY picture is
    BLACK; in YOUR picture it's ORANGE") are key productive-vocabulary
    opportunities.

curriculumStandards:
  - EYFS.ELG.M
