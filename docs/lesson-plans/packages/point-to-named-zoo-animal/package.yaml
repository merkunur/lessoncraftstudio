# Teaching package — point to a named zoo animal (receptive)
# Arc 6 Phase 1 (Path B) — early-literacy / vocabulary-acquisition strand.
# Receptive variant of Arc 4's identify-and-name-10-zoo-animals (productive).
# 10-key cluster CLEAN against IMAGE_VOCABULARY (lion/tiger/elephant/giraffe/
# zebra/monkey/panda/kangaroo/penguin/koala). Same receptive-pairing pattern
# as Arc 5 Phase 3's point-to-named-body-part + point-to-named-farm-animal.

targetSlug: point-to-named-zoo-animal
language: en
title:
  en: "Zoo Animals (Receptive) — point to the named zoo animal"
description:
  en: "Pre-K to K vocabulary-acquisition package teaching receptive recognition of 10 iconic zoo animals: lion, tiger, elephant, giraffe, zebra, monkey, panda, kangaroo, penguin, koala. Receptive variant of identify-and-name-10-zoo-animals (Arc 4 productive). Receptive comprehension precedes productive use in K-3 multilingual classrooms. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher places 10 large zoo-animal
      picture-cards on the carpet or board. Names each animal in target
      language; class points to the matching card chorally. Optional:
      animal-sound game (the animal that roars is the {lion}; the animal
      with a long neck is the {giraffe}) — bridges receptive recognition
      with sensory + visual anchors. Pin to "Zoo Animals" word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with picture cards. Teacher names a zoo animal
      in target language; class points to the matching picture-card. Pair
      work: kid A names a zoo animal; kid B points to it on a zoo-scene
      poster (or picture-card set). Recast errors gently — receptive
      packages emphasize correct understanding over correct production.
      Optional extension: kids share whether they have seen each animal
      at a zoo, in a book, or on TV — anchors recognition in lived
      experience.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (image-name matching
      reinforces zoo-animal-image to zoo-animal-word; receptive surface).
      Station 2: shadow-match worksheet (animal silhouette to animal —
      pure visual-recognition + receptive vocabulary). Station 3:
      manipulative cut-outs counting (kids count out specific named
      animals: "Show me 3 lions; show me 2 monkeys"). Receptive surface;
      no production required.
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names zoo animals rapidly; kids
      point to the matching card on the carpet. Forward-pointer: "Today
      we practiced understanding zoo-animal words. When we come back to
      zoo animals next, we'll start saying the words ourselves —
      moving from 'pointing' to 'naming'."

