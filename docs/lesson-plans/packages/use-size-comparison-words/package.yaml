compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (size-comparison adjectives as
    a closed-class function-word lexicon). Secondary strand: comparative
    reasoning (kids form size relations between 2-3 objects). Tertiary
    strand: cross-domain integration (size-comparison applies to
    objects from any theme cluster — animals, vehicles, fruits, shapes).

    App-package layer relationship: the big-small app (catalog deck-
    producer) generates worksheet decks for individual size-comparison
    exercises; this teaching package COMPOSES the app's exercises across
    multiple theme contexts (animals, vehicles, fruits) plus complementary
    matching + sentence-strip materials + concrete manipulative play.
    Different layers, complementary not redundant.

    Distinctive composition: 3 of 5 composedExercises use the big-small
    app (positions 1, 3, 5) — the app's mechanical action IS the target.
    Three theme contexts (animals, vehicles, fruits) ensure size-comparison
    vocabulary generalizes across object categories. matching at position
    2 reinforces vocabulary connection in non-comparative context. odd-
    one-out at position 4 introduces "which one doesn't fit the size
    pattern" reasoning.

    Comparative-superlative cognitive load: K kids handle big/small +
    bigger/smaller cleanly; biggest/smallest (superlative) is Grade 1+
    cognitive territory. The package title + assessment criteria reflect
    this graduated complexity.

    Cross-strand integration: size-comparison vocabulary feeds compare-
    quantities-more-fewer (Arc 3 numeracy) — kids who understand size
    comparison transfer the comparative-reasoning skill to quantity
    comparison. Reinforcement loop with measurement-strand targets
    (compare-by-length, compare-by-weight, compare-by-capacity from
    early-numeracy / measurement) for Grade 1+ extension.

    K-3 multilingual classroom relevance: size-comparison adjectives are
    early-acquired vocabulary across all 11 platform locales; comparative
    morphology varies (English -er suffix; German + Nordic -er-ish; Romance
    "más X" analytic; Finnish comparative-stem). Operator-side teachers
    layer in locale-specific morphology at the language-render layer.

