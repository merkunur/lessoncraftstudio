# Teaching package — count objects 1 to 20 (Grade 1 extension)
# Arc 3 Phase 3 numeracy package. Extends count-objects-1-to-10 to teen numbers.

targetSlug: count-objects-1-to-20
language: en

title:
  en: "Count Objects 1 to 20 — Grade 1 extension"
description:
  en: "K-Grade 1 numeracy package extending count-objects-1-to-10 to teen numbers (11-20). Same architecture (theme-mode visuals + math-app-heavy exercises + numeral-cards primary anchor) at extended range. 5 exercises + 7 materials over a 1-2 week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up numeral cards 1-10 (review),
      then 11-20 (new). Count chorally with class — touch each numeral as you
      say it. The teen numbers (11-20) are the new content; emphasize the
      tens-and-ones structure verbally ("eleven = ten and one. twelve = ten and
      two. thirteen = ten and three.")
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("There are {count} {item:plural}").
      Pair work: kids hold a picture-card with N animals (N=11-20), partner counts
      to 10 chorus + then continues to N. Recast errors in plural form + emphasize
      the tens-and-ones decomposition.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: numeral-cards 11-20 + manipulative-cut-outs
      ("show me the '17' card + 17 animals"). Station 2: addition image-image
      worksheet with operands 1-10 (sums up to 20). Station 3: chart-count
      with categories totaling 11-20.
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Teacher names a number 11-20, kids hold up that
      many fingers (5+5+...) + that many cut-out animals. Forward-pointer:
      "Today we counted to 20. When we come back to counting next, we'll go
      farther — into the 30s and 40s."

