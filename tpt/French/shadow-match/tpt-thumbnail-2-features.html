<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Discrimination Visuelle — Miniature Téléchargement</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: #F5F5F5; overflow: hidden;">

        <!-- Red top banner -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 120px; background: linear-gradient(180deg, #D32F2F 0%, #B71C1C 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 44px; color: white; letter-spacing: 4px;">TÉLÉCHARGEMENT GRATUIT</span>
            <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 18px; color: rgba(255,255,255,0.85); margin-top: 2px;">Accès instantané — Aucune inscription</span>
        </div>

        <!-- Grade badge -->
        <div style="position: absolute; top: 140px; right: 40px; background: #7B1FA2; padding: 10px 22px; border-radius: 20px; box-shadow: 0 4px 12px rgba(123,31,162,0.35); z-index: 10;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: white;">MS GS CP</span>
        </div>

        <!-- Print & Go subtitle -->
        <div style="position: absolute; top: 138px; left: 0; right: 0; text-align: center;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #7B1FA2; letter-spacing: 3px;">IMPRIMER ET C'EST PARTI</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 165px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #311B92; margin: 0;">Discrimination Visuelle</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 36px; color: #7B1FA2; margin: 2px 0 0 0;">Fiches d'exercices</h2>
        </div>

        <!-- Main worksheet (center) -->
        <div style="position: absolute; top: 310px; left: 50%; transform: translateX(-50%); z-index: 20;">
            <div style="width: 380px; height: 480px; background: white; border-radius: 14px; box-shadow: 0 16px 48px rgba(0,0,0,0.2); border: 5px solid #9C27B0; overflow: hidden;">
                <img src="https://www.lessoncraftstudio.com/samples/french/shadow%20match/Trouve%20l'Ombre%201.webp" style="width: 100%; height: 100%; object-fit: cover;" alt="Fiche discrimination visuelle">
            </div>
        </div>

        <!-- Floating badge: Answer Keys -->
        <div style="position: absolute; top: 430px; left: 60px; background: white; padding: 14px 22px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 10px; z-index: 30;">
            <div style="width: 36px; height: 36px; background: #7B1FA2; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                <span style="color: white; font-size: 20px; font-weight: 700;">✓</span>
            </div>
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #333;">Corrigés</span>
        </div>

        <!-- Floating badge: PDF Format -->
        <div style="position: absolute; top: 560px; right: 55px; background: white; padding: 14px 22px; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 10px; z-index: 30;">
            <div style="width: 36px; height: 36px; background: #4A148C; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                <span style="color: white; font-size: 18px; font-weight: 700;">📄</span>
            </div>
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #333;">Format PDF</span>
        </div>

        <!-- Instant download circle -->
        <div style="position: absolute; bottom: 200px; right: 250px; z-index: 30;">
            <div style="width: 70px; height: 70px; background: #7B1FA2; border-radius: 50%; box-shadow: 0 6px 18px rgba(123,31,162,0.4); display: flex; align-items: center; justify-content: center;">
                <span style="color: white; font-size: 30px;">↓</span>
            </div>
            <span style="position: absolute; top: 50px; left: 50%; transform: translateX(-50%); font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 10px; color: white; white-space: nowrap;">TÉLÉCHARGER</span>
        </div>

        <!-- Bottom bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: white; border-top: 3px solid #eee; display: flex; align-items: center; justify-content: center; gap: 50px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 36px; height: 36px; background: #7B1FA2; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                    <span style="color: white; font-size: 18px;">🖨️</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #333;">Prêt à imprimer</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 36px; height: 36px; background: #4A148C; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                    <span style="color: white; font-size: 18px;">📋</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #333;">Sans préparation</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 36px; height: 36px; background: #311B92; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                    <span style="color: white; font-size: 18px;">🎨</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #333;">Images mignonnes</span>
            </div>
        </div>

    </div>
</body>
</html>
