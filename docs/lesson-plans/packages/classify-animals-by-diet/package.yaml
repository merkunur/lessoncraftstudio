compositionalRationale:
  en: |
    Primary strand: world-knowledge / living-things classification. Secondary
    strand: vocabulary acquisition (consolidates animal vocabulary in
    diet-classification context). Tertiary strand: scientific-vocabulary
    introduction (herbivore / carnivore / omnivore are technical terms;
    package introduces them naturally through example).

    Architectural significance vs Phase 2 classify-animals-by-habitat: same
    theme axis (animals), different classification dimension (diet vs
    habitat). Validates whether classification architecture handles
    multiple classification dimensions on the same substrate without
    duplication/conflict at material-render time. Per §A.14 scaling-
    checkpoint discipline: paired classification-dimension packages
    stress-test the multi-classification architecture.

    Distinctive composition vs habitat-classification: 3 picture-sort
    exercises (vs habitat's 3) but with different theme-pair contrasts to
    avoid collision at material-render time (habitat used farm/zoo/pets/
    ocean theme contrasts; diet uses farm/zoo, animals/vegetables, zoo/
    pets — overlapping theme axes but distinct contrasts). odd-one-out
    at position 4 introduces diet-attribute reasoning ("which animal
    doesn't fit the herbivore set").

    Cultural-variation acknowledgment: dietary classifications are
    universal scientific concepts but specific examples vary by region
    (e.g., elephants are universal herbivores; bears are universal
    omnivores; what counts as a "common pet that eats meat" varies —
    cats are universal carnivores; dogs are technically omnivores but
    often categorized as carnivores in K-3 contexts). Operator-side
    teachers can layer in regional-fauna examples to anchor classification
    in locally-familiar species.

    Note on "omnivore" K-3 register: 3-category classification (vs binary
    plants-vs-meat) is more cognitively demanding for K-3 than 2-category.
    Pre-K + early K kids may benefit from binary herbivore-vs-carnivore
    framing first (the picture-sort at position 1 uses 2-category contrast);
    omnivore introduced at scaffold + closure for kids ready for the
    3-category cognitive load.

