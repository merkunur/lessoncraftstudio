assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compute addition within 100 correctly in 7 of 10 trials.
      - Identify regrouping moments + execute regrouping correctly
        in 6 of 8 problems requiring carrying.
      - Use at least 2 addition strategies (e.g., column-add-with-
        carrying + decomposition) in 5 of 10 trials.
      - Solve missing-addend problems (27+?=65) in 5 of 10 trials.

    Differentiation:
    - Pre-K: skip within-100; review add-within-10 + add-within-20.
    - K: addition within 50; manipulative support emphasized.
    - Grade 1: addition within 100 with regrouping introduced;
      column-add format practiced.
    - Grade 2+: extend to three-digit addition (Arc 16+ candidate);
      bridge to mental two-digit addition fluency + algorithm
      automaticity.

