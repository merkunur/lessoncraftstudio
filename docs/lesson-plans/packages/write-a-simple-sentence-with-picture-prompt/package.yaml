compositionalRationale:
  en: |
    Primary strand: early-literacy / writing-composition (simple-
    sentence-with-picture-prompt; canonical strand-advancement
    2/8 → 3/8). Secondary strand: vocabulary-acquisition (noun +
    adjective + verb vocabulary mobilized in sentence construction).
    Tertiary strand: fine-motor (writing the sentence).

    Architectural significance: writing-composition strand-advancement
    (2/8 → 3/8 canonical-slug authored — 3/8 if counting Arc 14
    label-with-noun-phrase intent-equivalent). Critical pedagogical
    bridge from labeling work (write-own-name + label-a-picture-with-
    1-word + label-with-noun-phrase) to sentence-level writing
    (write-2-sentences-on-a-topic + write-a-3-sentence-story).
    The sentence-frame "I see a [adjective] [noun]." is the canonical
    first-sentence shape in K-3 ELA pedagogy — meaningful + scaffolded
    + reproducible across hundreds of pictures.

    Final-arc-cycle Phase 1.5 slot per Arc 19 close-out responsibility.
    Phase 1.5 is the final canonical-trajectory commission cycle slot
    of the Pillar 1 master-authoring trajectory; reaching C1 SATISFIED
    at Arc 19 close marks the canonical end-state.

    Distinctive composition: 2 word-scramble + 1 word-guess + 2
    matching. Word-scramble at positions 1 + 4 surfaces sentence-
    structure-ordering work (subject-verb-object); word-guess at
    position 2 surfaces fill-in-the-blank sentence completion;
    matching at positions 3 + 5 reinforces picture-sentence pairing.

    Cross-strand integration: writing-composition + label-a-picture-
    with-1-word (Arc 13) + label-with-noun-phrase (Arc 14) as
    sentence-structure prerequisites + vocabulary-acquisition
    (noun + adjective + verb vocab from Arcs 1-19).

    Class B FLEXIBLE substrate: composes against animals + foods
    image-library themes (vocabulary rich in noun-adjective-verb
    sentence combinations: red apple / brown dog / blue fish / big
    tree / small bird / happy cat / fast car).

    K-3 multilingual classroom relevance: sentence-structure varies
    significantly across 11 platform locales. English uses SVO
    (subject-verb-object) order strictly: "I see a red apple."
    Romance languages (es/fr/it/pt) typically use SVO too but
    permit pro-drop ("Veo una manzana roja" without explicit
    'yo'); adjective placement varies (Romance languages put
    adjective POST-noun: "una manzana roja"; en places PRE-noun:
    "a red apple"). Germanic languages (de/nl) have V2 word-order
    (verb in second position) for main clauses + verb-final order
    for subordinate clauses. Locale-variant sparse-overrides per
    Phase 3 reframe sentence-frame templates per locale's canonical
    syntax — NOT direct translation of English sentence frames.

