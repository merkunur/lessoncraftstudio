compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial / visual-discrimination.
    Secondary strand: vocabulary acquisition (vocab-anchored). Tertiary
    strand: spatial-reasoning + mental-rotation (matching a piece to
    whole requires mentally completing the partial visual).

    Vocab-anchor framing: same Phase 2 interpretation. Visual-spatial
    domain target is the architectural shape; vocabulary-anchor is the
    pedagogical thread.

    Distinctive composition vs match-image-to-shadow (sibling): same
    high app-density (4 shadow-match exercises in makeItWhole mode +
    1 matching) but DIFFERENT shadow-match mode. shadow-match supports
    two modes — shadowMatch (silhouette outline of whole image) and
    makeItWhole (fragmented piece to assemble back to whole). The two
    modes validate that shadow-match architecture handles distinct
    visual-discrimination tasks.

    Cross-package architectural validation: match-image-to-shadow
    (sibling) uses shadowMatch mode; this package uses makeItWhole mode.
    Together they validate both shadow-match modes work cleanly in
    teaching-package architecture; gives operator-side teachers two
    distinct visual-discrimination surfaces from the same app.

    K-3 multilingual classroom relevance: piece-to-whole reasoning is
    an early-acquired visual-spatial skill that transfers to jigsaw
    puzzles (high-engagement K-3 activity). Vocab-anchor makes the
    package contribute to language acquisition simultaneously — same
    high-leverage time use as the shadow-match sibling.

curriculumStandards:
  - EYFS.ELG.M
  - EYFS.ELG.UW
  - IB-PYP.HowTheWorldWorks

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Match a fragmented image piece to its whole image in 8 of 10
        trials.
      - Name the whole image before/after matching in 8 of 10 trials
        (vocabulary-anchor verification).
      - Reassemble a 2-3-piece picture independently in 6 of 10 attempts.

    Differentiation:
    - Pre-K: 2-piece reassembly only.
    - K: 3-piece reassembly + piece-to-whole worksheet matching.
    - Grade 1+: extend to find-missing-piece (Phase 2 companion) +
      multi-piece jigsaw puzzles (4-6 pieces).

