<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Syllable Splitter — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. Absolute /mini-tools/ paths so embeds +
       cross-context loads resolve identically. The tool fetches its word
       deck from /mini-tools/syllable-splitter-<lang>.json at runtime. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/syllable-splitter.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=fi  ?lang=de  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    // Tool-specific deep links: ?set=<shelfId>&word=<wordId>&mode=clap|build|sort
    //   A deep link to a PREMIUM set (or to sort mode) is HELD until
    //   entitlement resolves and then discarded for free visitors —
    //   premium words never reach the DOM.
    LCS.mount(SyllableSplitter, { mount: '#lcs-root' });
  </script>
</body>
</html>
