assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compute two-digit addition without regrouping correctly
        in 7 of 10 trials.
      - Align tens-under-tens and ones-under-ones in column
        format in 8 of 10 problems.
      - Use at least 2 addition strategies (e.g., column-add +
        decomposition) in 5 of 10 trials.
      - Solve missing-addend problems within the no-regroup
        range (23+?=68) in 5 of 10 trials.

    Differentiation:
    - Pre-K: skip two-digit; review add-within-10.
    - K: introduce two-digit + ones (23+5, 60+4) before two-
      digit + two-digit; manipulative support emphasized.
    - Grade 1: full two-digit + two-digit without regrouping;
      column-add format practiced; transitions to add-within-100
      (Grade 2) when regrouping is the next conceptual step.
    - Grade 2+: brief reinforcement; the no-regroup case becomes
      the easy subset of add-within-100; fluency target is
      mental two-digit addition in the no-carry case.

