<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Find Objects - Eagle Eyes Hero Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1000px;
            height: 1000px;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }
        .container {
            width: 1000px;
            height: 1000px;
            background: linear-gradient(135deg, #D32F2F 0%, #FF5722 50%, #FF7043 100%);
            position: relative;
            overflow: hidden;
        }

        /* Animated background rays */
        .rays {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1400px;
            height: 1400px;
            transform: translate(-50%, -50%);
            background: repeating-conic-gradient(
                from 0deg,
                rgba(255,255,255,0.08) 0deg 10deg,
                transparent 10deg 20deg
            );
            opacity: 0.6;
        }

        /* Speed lines */
        .speed-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .speed-line {
            position: absolute;
            background: rgba(255,255,255,0.3);
            transform: rotate(-35deg);
        }
        .speed-line:nth-child(1) { top: 100px; left: -50px; width: 200px; height: 4px; }
        .speed-line:nth-child(2) { top: 180px; left: 20px; width: 150px; height: 3px; }
        .speed-line:nth-child(3) { top: 750px; right: -30px; width: 180px; height: 4px; }
        .speed-line:nth-child(4) { top: 850px; right: 50px; width: 120px; height: 3px; }

        /* Main title area */
        .title-section {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }

        .main-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            line-height: 0.95;
        }

        .eagle {
            font-size: 85px;
            color: white;
            text-shadow:
                4px 4px 0 #B71C1C,
                6px 6px 0 rgba(0,0,0,0.3);
            letter-spacing: -2px;
        }

        .eyes {
            font-size: 85px;
            color: #FACC15;
            text-shadow:
                4px 4px 0 #B45309,
                6px 6px 0 rgba(0,0,0,0.3);
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 30px;
            color: white;
            font-weight: 800;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }

        /* Eagle eye graphic */
        .eagle-eye {
            position: absolute;
            top: 250px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 100px;
            z-index: 5;
        }

        .eye-shape {
            width: 160px;
            height: 100px;
            background: linear-gradient(135deg, #FACC15 0%, #F59E0B 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            box-shadow:
                0 0 30px rgba(250,204,21,0.6),
                inset 0 -10px 20px rgba(0,0,0,0.1);
            border: 4px solid #B45309;
        }

        .pupil {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #1a1a1a 0%, #000 70%);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .pupil::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 12px;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
        }

        /* Vision rays emanating from eye */
        .vision-rays {
            position: absolute;
            top: 290px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            z-index: 2;
        }

        .vision-ray {
            position: absolute;
            top: 30px;
            left: 50%;
            transform-origin: top center;
            width: 8px;
            height: 350px;
            background: linear-gradient(to bottom, rgba(3,169,244,0.8) 0%, rgba(3,169,244,0) 100%);
            border-radius: 4px;
        }
        .vision-ray:nth-child(1) { transform: translateX(-50%) rotate(-30deg); }
        .vision-ray:nth-child(2) { transform: translateX(-50%) rotate(-15deg); }
        .vision-ray:nth-child(3) { transform: translateX(-50%) rotate(0deg); }
        .vision-ray:nth-child(4) { transform: translateX(-50%) rotate(15deg); }
        .vision-ray:nth-child(5) { transform: translateX(-50%) rotate(30deg); }

        /* Worksheet display */
        .worksheet-display {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
        }

        .worksheet-frame {
            background: white;
            padding: 8px;
            border-radius: 12px;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.4),
                0 0 0 4px rgba(255,255,255,0.3);
            transform: perspective(800px) rotateX(5deg);
        }

        .worksheet-frame img {
            width: 320px;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        /* Energy bursts */
        .burst {
            position: absolute;
            font-size: 40px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .burst-1 { top: 380px; left: 80px; transform: rotate(-15deg); }
        .burst-2 { top: 450px; right: 70px; transform: rotate(20deg); }
        .burst-3 { top: 320px; right: 120px; transform: rotate(-10deg); }

        /* Badges */
        .free-badge {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 20;
        }

        .starburst {
            width: 100px;
            height: 100px;
            background: #FACC15;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%,
                50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%
            );
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .starburst span {
            font-family: 'Fredoka', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #D32F2F;
        }

        .grade-badge {
            position: absolute;
            top: 30px;
            left: 30px;
            background: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #D32F2F;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 20;
        }

        /* Bottom features */
        .features-bar {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 15;
        }

        .feature-pill {
            background: rgba(255,255,255,0.95);
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 18px;
            color: #D32F2F;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Sparkle effects */
        .sparkle {
            position: absolute;
            color: #FACC15;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(250,204,21,0.8);
        }
        .sparkle-1 { top: 200px; left: 150px; }
        .sparkle-2 { top: 280px; right: 180px; }
        .sparkle-3 { bottom: 250px; left: 120px; }
        .sparkle-4 { bottom: 300px; right: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Background rays -->
        <div class="rays"></div>

        <!-- Speed lines -->
        <div class="speed-lines">
            <div class="speed-line"></div>
            <div class="speed-line"></div>
            <div class="speed-line"></div>
            <div class="speed-line"></div>
        </div>

        <!-- Vision rays from eye -->
        <div class="vision-rays">
            <div class="vision-ray"></div>
            <div class="vision-ray"></div>
            <div class="vision-ray"></div>
            <div class="vision-ray"></div>
            <div class="vision-ray"></div>
        </div>

        <!-- Grade badge -->
        <div class="grade-badge">GRADES PreK-2</div>

        <!-- FREE badge -->
        <div class="free-badge">
            <div class="starburst">
                <span>FREE</span>
            </div>
        </div>

        <!-- Main title -->
        <div class="title-section">
            <div class="main-title">
                <div class="eagle">EAGLE</div>
                <div class="eyes">EYES</div>
            </div>
            <div class="subtitle">Test Your Super Vision!</div>
        </div>

        <!-- Eagle eye graphic -->
        <div class="eagle-eye">
            <div class="eye-shape">
                <div class="pupil"></div>
            </div>
        </div>

        <!-- Energy bursts -->
        <div class="burst burst-1">💥</div>
        <div class="burst burst-2">⚡</div>
        <div class="burst burst-3">✨</div>

        <!-- Sparkles -->
        <div class="sparkle sparkle-1">★</div>
        <div class="sparkle sparkle-2">★</div>
        <div class="sparkle sparkle-3">★</div>
        <div class="sparkle sparkle-4">★</div>

        <!-- Worksheet display -->
        <div class="worksheet-display">
            <div class="worksheet-frame">
                <img src="https://www.lessoncraftstudio.com/samples/english/find%20objects/sample-1.jpeg" alt="Find Objects Worksheet">
            </div>
        </div>

        <!-- Features bar -->
        <div class="features-bar">
            <div class="feature-pill">Visual Skills</div>
            <div class="feature-pill">Multiple Themes</div>
            <div class="feature-pill">Answer Keys</div>
        </div>
    </div>
</body>
</html>
