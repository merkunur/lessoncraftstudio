compositionalRationale:
  en: |
    Primary strand: early-literacy / speaking-and-listening (productive
    language; full-sentence narrative output). Secondary strand:
    vocabulary acquisition (vocab-anchored — established vocabulary
    becomes input for narrative production). Tertiary strand: spatial-
    reasoning (kids describe WHERE things are — leverages prepositions
    + position vocabulary).

    Architectural significance: productive-language counterpart to the
    Arc 1+5+6 vocabulary-acquisition packages. Those packages target
    receptive vocabulary (kids point to / name objects); this package
    targets productive narrative (kids construct connected sentences
    about a scene). The receptive-to-productive progression is a
    canonical K-3 language-development arc; this package is the
    catalog's first multi-sentence productive-narrative target.

    Distinctive composition: 3 matching exercises spanning 3 theme
    contexts (animals, foods, house-rooms — vocabulary-rich for
    description) + 1 prepositions exercise (positional vocab for
    spatial description) + 1 word-guess. The picture-cards material
    at 4-up density (vs 9-up in vocab-acquisition packages) provides
    larger images suitable for whole-class display + sustained
    description work.

    Cross-strand integration: connects vocabulary-acquisition (Arc 1+5+6)
    + prepositions/spatial-position-words (Arc 5) + sentence-frames
    (Arc 1+ flashcards). The package is a SYNTHESIS surface for
    vocabulary acquired across many prior packages.

    Class B FLEXIBLE substrate: composes against any vocabulary-rich
    image-library theme (animals, foods, house-rooms, school-objects,
    body-parts, clothing). Substrate-readiness universal across
    vocabulary-rich themes.

    K-3 multilingual classroom relevance: full-sentence productive
    narrative is the gateway between receptive language ("I understand
    English") and productive language ("I can speak in English"). The
    multi-sentence target ("I see X. X is on Y. X is Z.") gives kids
    a structured starting point. Particularly valuable for kids in
    target-language-immersion contexts who can name objects but
    struggle to construct connected utterances.

