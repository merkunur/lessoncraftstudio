# Teaching package — use size-comparison vocabulary
# Arc 6 Phase 1 (Path B) — early-literacy / vocabulary-acquisition strand.
# Abstract concept (size-comparison adjectives: big/small/bigger/smaller/
# biggest/smallest/tall/short/long); image-vocabulary supports rendering
# big/small comparisons via existing big-small app integration. Substrate-
# clean: composes against image-library breadth + the big-small app's
# mechanical action.

targetSlug: use-size-comparison-words
language: en
title:
  en: "Size Comparison Words — using big/small, bigger/smaller, tall/short"
description:
  en: "Kindergarten-Grade 1 vocabulary-acquisition package teaching the use of size-comparison vocabulary: big, small, bigger, smaller, biggest, smallest, tall, short, long. Bridges from spatial perception to comparative language. Composed against the big-small app's size-comparison rendering plus matching + sentence-strip materials. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher uses real classroom objects of
      contrasting sizes (a small toy + a big toy; a short pencil + a long
      ruler). Names each size-pair: "The car is BIG. The mouse is SMALL.
      The truck is BIGGER than the car. The mouse is SMALLER than the
      car." Class repeats chorally + mimics big/small with their hands
      (arms wide for big; pinch-fingers for small). Pin size-words to
      the math-language word wall.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("The {item} is {size}").
      Class reads chorally + acts out each strip (kids stretch tall for
      "tall"; squat low for "short"). Pair work: kid A picks two objects
      of different sizes; kid B compares them aloud using the target
      size-word. Recast errors. Optional extension: comparative-
      superlative game ("the biggest animal in the zoo is the {elephant};
      the smallest pet is the {hamster}") — connects size-vocabulary
      to other vocabulary clusters kids already know.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: big-small worksheet (kid identifies
      which of 2 objects is the bigger/smaller one). Station 2: matching
      worksheet (size-word matched to its visual representation —
      "biggest" matched to a 3-bear lineup with the largest bear).
      Station 3: manipulative cut-outs size-sorting (kids physically
      sort cut-out objects from smallest to largest, then describe the
      sequence aloud).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names two classroom objects;
      kids respond chorally with bigger/smaller. Forward-pointer: "Today
      we learned size words. When we come back to math next, we'll use
      these words to compare numbers — bigger numbers, smaller numbers,
      and which is the biggest."

