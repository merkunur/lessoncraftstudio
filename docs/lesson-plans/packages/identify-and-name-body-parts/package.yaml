# Teaching package — identify and name 10 body parts
# Arc 2 Phase 3a (en authoring; mirrors Arc 1 farm-animals template).
# Pedagogical learning target: identify-and-name-body-parts
#   (early-literacy → vocabulary-acquisition strand)
# Verified vocab keys: head, arm, leg, hand, foot, eye, ear, nose, mouth, hair
# (10/10 with full 11-locale IMAGE_VOCABULARY entries).
#
# Body-parts is structurally distinct from farm-animals/clothing/vehicles in one
# important way: kids identify ON THEIR OWN BODY. The package leverages this with
# a "touch your ___" routine throughout. This makes body-parts a high-engagement
# entry-level vocabulary package — earlier acquisition than abstract-categorical
# vocabulary.

targetSlug: identify-and-name-body-parts
language: en

title:
  en: "Body Parts — identify and name 10"
description:
  en: "Pre-K / K vocabulary-acquisition package for 10 universal body parts: head, arm, leg, hand, foot, eye, ear, nose, mouth, hair. 5 worksheet exercises + 8 printable materials. High kinesthetic engagement — kids identify on their own body. Theme-agnostic; operator selects target instruction language at material-render time."

durationMinutes: 25

structure:
  warmup:
    durationMinutes: 4
    body: |
      Whole-class introduction with a "touch your ___" routine. Teacher names a
      body part in target language, kids touch the matching part on their own
      body. High engagement; receptive identification first. Cycle through all
      10 parts × 2 reps. No flashcards needed at warmup — the kid's body IS the
      flashcard.
  contentActivity:
    durationMinutes: 10
    body: |
      Whole-class introduction with flashcards. Hold up flashcard, point to teacher's
      own matching body part, name in target language. Class repeats name + touches
      own body part. Pin cards to "Body Parts" word wall. Pair work: kids touch each
      other's body parts on cue (gentle touch — partner's hand, foot, ear).
  scaffold:
    durationMinutes: 7
    body: |
      Station rotation. Station 1: matching app (imgname mode) — image-to-word.
      Station 2: picture-card "Simon Says" (kid draws a card, says "touch your
      ___"). Station 3: tracing (operator may add vocabulary-tracing-strips
      material as a station addition for K kids).
  closure:
    durationMinutes: 4
    body: |
      Whole-class share-out. "Touch your ___ if I name it." Teacher names a part,
      kids touch. Final challenge: head-shoulders-knees-toes-style chant in target
      language with 4-5 of the 10 body parts. Forward-pointer: "Today we learned
      10 body words. When we come back to body words next, this same set will be
      here."

