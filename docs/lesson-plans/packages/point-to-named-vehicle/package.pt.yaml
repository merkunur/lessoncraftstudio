# Teaching package — point to a named vehicle (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 6 Phase 3 per Arc 3 Phase 1 sparse-override
# pattern). Validator deep-merges with package.yaml canonical at validation
# time.
#
# Brazilian Portuguese register per CLAUDE.md §6 (pt = BR canonical;
# caminhão / ônibus / trem — NOT EU "camião"/"autocarro"/"comboio").
# Formal "você" address per §17.9 cross-locale teacher-address-register lock.

title:
  pt: "Veículos (Receptivo) — aponta para o veículo nomeado"
description:
  pt: "Pacote de aquisição de vocabulário para Pré-K e K sobre o reconhecimento receptivo de 10 veículos comuns: carro, ônibus, caminhão, bicicleta, motocicleta, avião, barco, trem, helicóptero, ambulância. Variante receptiva de identify-and-name-vehicles (Arc 2 produtivo). Vocabulário de veículos é conteúdo de alto interesse em salas de aula K-3; a compreensão receptiva precede a nomeação produtiva."

structure:
  warmup:
    body: |
      Rotina de ação para toda a turma. A professora ou o professor coloca
      10 cartões grandes de imagens de veículos no tapete ou no quadro.
      Nomeia cada veículo em português; a turma aponta para o cartão
      correspondente em coro. Opcional: jogo de sons de veículos (o
      veículo que faz "bip-bip" é o {carro}; o veículo que voa é o
      {avião}) — conecta o reconhecimento receptivo a âncoras sensoriais
      e funcionais. Fixe os cartões no mural de palavras "Veículos".
  contentActivity:
    body: |
      Rotina de mural de bolso com cartões de imagem. A professora ou o
      professor nomeia um veículo em português; a turma aponta para o
      cartão correspondente. Trabalho em duplas: a criança A nomeia um
      veículo; a criança B aponta para ele em um pôster de cena de
      transporte (ou conjunto de cartões de imagem). Extensão opcional:
      as crianças compartilham se já andaram em cada veículo ("Eu pego
      ônibus para a escola"; "Eu andei de avião nas férias") — ancora
      o reconhecimento na experiência vivida.
  scaffold:
    body: |
      Rotação de estações. Estação 1: emparelhamento (aplicativo matching,
      modo imagem-nome). Estação 2: emparelhamento de sombras (silhueta
      de veículo para o veículo — reconhecimento visual + vocabulário
      receptivo). Estação 3: contagem e classificação com recortes
      manipulativos (as crianças contam veículos nomeados específicos:
      "mostra-me 3 carros; mostra-me 2 ônibus"; ou classificam veículos
      por ambiente — terra/mar/ar; faz ponte com identify-transportation-
      types da Fase 2 do Arco 5).
  closure:
    body: |
      Recordação rápida com toda a turma. A professora ou o professor
      nomeia veículos rapidamente; as crianças apontam para o cartão
      correspondente no tapete. Indicador adiante: "Hoje praticamos
      a compreensão de palavras de veículos. Quando voltarmos aos
      veículos próxima vez, começaremos a dizer as palavras nós mesmos
      e usá-las para falar sobre como nos deslocamos."

assessmentCriteria:
  pt: |
    Receptivo 10/10; transferência para contexto de cena de transporte
    8/10; emparelhamento imagem-palavra 8/10.

    Diferenciação:
      - Pré-K: 6 veículos receptivamente; apenas reconhecimento de cartões.
      - K: 10 veículos receptivamente; cartões + cena de transporte.
      - Primeiro ano em diante: ponte para o produtivo identify-and-name-
        vehicles (Arc 2) + identify-transportation-types (Arc 5) — as
        crianças passam de apontar para nomear + classificar.

compositionalRationale:
  pt: |
    Fio principal: aquisição de vocabulário (RECEPTIVO — apontar para o
    veículo nomeado, não nomeá-lo). Fio secundário: discriminação visual
    (reconhecimento de silhueta de veículos).

    Padrão de pareamento com pacote produtivo: identify-and-name-vehicles
    (Arc 2) fornece a superfície produtiva; esta variante receptiva usa
    o mesmo cluster de 10 chaves mas compõe-se contra exercícios de
    superfície receptiva.

    Validação arquitetural: quarto pacote variante receptiva nos Arcos
    5 Fase 3 + 6 Fase 1 (após body-part + farm-animal + zoo-animal +
    color). Continua a validação do padrão de pareamento receptivo↔
    produtivo. O padrão continua a se manter limpo em diversos eixos
    temáticos; os modelos são estáveis.

    Complemento temático interpacotes: point-to-named-vehicle pareia
    naturalmente com identify-transportation-types (Arc 5 Fase 2) — a
    variante receptiva ensina os nomes dos veículos; o pacote de
    classificação ensina a qual categoria cada veículo pertence. Juntas
    formam o núcleo de vocabulário de veículos para salas de aula
    multilíngues K-3.

    Reconhecimento da variação cultural: vocabulário de veículos varia
    modestamente nos 11 locales da plataforma. Em português brasileiro
    canônico: "carro" (NÃO "automóvel" formal, embora ambos são corretos
    — "carro" é mais comum em K-3); "ônibus" (NÃO EU "autocarro");
    "caminhão" (NÃO EU "camião"); "trem" (NÃO EU "comboio"). O pacote
    valida que as crianças entendem os nomes BR-canônicos de veículos
    independentemente da morfologia específica do locale.

    Notas de tracing-strips: 4 chaves selecionadas (carro, ônibus, trem,
    barco) — palavras curtas; alta-frequência em livros de imagens K-3
    com tema de transporte em pt-BR.
