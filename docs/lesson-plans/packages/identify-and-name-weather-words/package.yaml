compositionalRationale:
  en: |
    Primary strand: early-literacy / vocabulary-acquisition. Secondary
    strand: speaking-and-listening (full-sentence weather descriptions
    using language frames). Tertiary strand: world-knowledge /
    environment-and-weather (weather phenomena are real-world
    observable — vocabulary anchors to direct observation outside the
    window).

    Class A CLEAN substrate: weather vocabulary present in
    IMAGE_VOCABULARY across all 11 platform locales (sun, cloud, rain,
    snow, wind, storm, rainbow + adjective forms sunny/cloudy/rainy/
    snowy/windy). Pre-existing weather theme in image library
    (animals_bw equivalent expected; verifiable at material-render
    time).

    Daily-routine integration distinctive: weather is uniquely
    suited to morning-circle routine because kids observe today's
    weather every day. Vocabulary practice happens daily in the
    routine, not just during the 1-week unit. Long-tail exposure
    pattern strongest for weather among Arc 1-7 vocabulary packages.

    Distinctive composition: 5 weather-themed exercises (matching at
    1+4 + bingo at 2 + word-guess at 3 + odd-one-out at 5). Bingo
    is FIRST consolidation surface for weather — uses the bingo app's
    listening + scanning to reinforce auditory-to-visual weather-word
    mapping.

    Cross-locale sensitivity: weather vocabulary varies meaningfully
    across locales — Nordic locales have richer snow + rain
    vocabulary; Romance + Mediterranean locales have richer sun +
    heat vocabulary. Platform's 11-locale coverage means kids in
    each locale see locally-relevant weather vocabulary. K-3
    multilingual classroom relevance: HIGH.

    K-3 multilingual classroom relevance: weather vocabulary is
    morning-circle bedrock across virtually every K-3 classroom
    globally; cross-locale weather vocabulary acquisition is a
    universal early-childhood-language target. The package's daily-
    routine integration makes it self-reinforcing — kids see the
    weather chart updated every morning.

