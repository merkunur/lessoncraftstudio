# Teaching package — show empathy toward others
# Arc 15 Phase 4 (science / personal-social-emotional-development 2/6 → 3/6).
# Deepens Arc 15 Phase 2 + Phase 4 emotion-regulation foundation.

targetSlug: show-empathy-toward-others
language: en
title:
  en: "Caring About Others — noticing and responding to feelings"
description:
  en: "Kindergarten / Grade 1 social-emotional package teaching kids to NOTICE others' emotions + RESPOND with care + empathy. Builds on Arc 8-12 identify-emotions-of-others-from-faces (perception foundation) + Arc 15 Phase 2 express-feelings-with-words (own-feeling vocabulary) + Phase 4 regulate-emotions-with-strategies (emotion-management). Extends to OUTWARD social-emotional work — perspective-taking + caring response. 3-step empathy model: (1) NOTICE feeling on someone's face/body; (2) NAME the feeling you see ('You look sad'); (3) HELP somehow (offer comfort, give space, ask if they need help). Critical bridge from emotion-self-management to social-emotional engagement with peers. Foundation for later friendship + conflict-resolution + cooperation work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + empathy-model introduction. Teacher
      displays a photo of a sad child. "What feeling does this
      child show? (class: SAD). How can you tell? (eyes down,
      mouth turned down). Today we learn EMPATHY — caring about
      OTHERS' feelings. Three steps: (1) NOTICE the feeling on
      someone's face or body. (2) NAME the feeling you see —
      'You look sad' or 'You seem frustrated'. (3) HELP somehow
      — offer comfort, give space, or ask if they need
      something." Class repeats the 3 steps. Visual + verbal
      anchor for empathy model.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + empathy-response routine. Each pair receives 8
      scenario cards (e.g., "your friend's pet died — they look
      sad" / "your sibling can't tie shoes — they look frustrated"
      / "a classmate fell — they look hurt and embarrassed" /
      "your grandma got good news — she looks happy"). Pair takes
      turns: kid A reads scenario; kid B walks through 3-step
      empathy: NOTICE feeling + NAME it + suggest HELP. Recast
      errors with empathy-prompts ("you noticed she's frustrated.
      What could you SAY? Maybe 'I see you're frustrated. Do you
      want me to help with your shoes?'").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (situation
      to empathic response). Station 2: pattern-train worksheet
      (sequence the 3-step empathy model: NOTICE → NAME → HELP).
      Station 3: picture-sort worksheet (sort responses into
      EMPATHIC vs UNHELPFUL bins). Station 4: vocabulary-tracing-
      strips for empathy vocabulary (empathy, caring, kindness,
      notice, listen, comfort, help, support).
  closure:
    durationMinutes: 5
    body: |
      Whole-class empathy circle. Each child shares a time they
      SHOWED empathy this week OR a time someone showed empathy
      to them. "I noticed my brother was sad, so I gave him a
      hug." Teacher validates each response with active listening.
      Forward-pointer: "Today we showed empathy to others. When
      we come back next, we can learn FRIENDSHIP skills — how to
      include others + how to be a good friend + how to handle
      conflicts kindly!"

