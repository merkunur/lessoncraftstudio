assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Read 8 analog clock faces (mix of o'clock + half-past)
        correctly in 7 of 10 trials.
      - Distinguish hour hand from minute hand in 9 of 10 trials.
      - Set clock hands to a given time (e.g., "show me 3:30") in
        6 of 10 trials.
      - Use vocabulary OCLOCK / HALF-PAST / HOUR / MINUTE
        correctly in 7 of 10 trials.

    Differentiation:
    - Pre-K: skip analog clock reading; review days-of-week +
      months-of-year only.
    - K: hour-only analog reading (skip half-past); 6 hour
      positions max.
    - Grade 1+: hour + half-past full coverage.
    - Grade 2+: extend to quarter-hours (15 + 45 minutes past) +
      every-5-minute reading + AM/PM distinction + bridge to
      digital clock + 24-hour format.

