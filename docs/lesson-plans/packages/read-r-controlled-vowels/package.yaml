# Teaching package — read r-controlled vowel words
# Arc 19 Phase 1.4 (early-literacy / phonics-decoding strand-advancement 4 → 5).
# Builds on Arc 12 read-cvc-words + Arc 13 read-cvce-words + Arc 19
# Phase 1.4 read-vowel-teams foundation. Pair-coherent with
# read-vowel-teams per Arc 19 Phase 1.4 ship pattern.

targetSlug: read-r-controlled-vowels
language: en
title:
  en: "R-Controlled Vowels — read car, bird, horn, turn, her"
description:
  en: "Grade 1 / Grade 2 early-literacy package teaching kids to read words with r-controlled vowels — the five vowel-plus-R patterns: ar (car), er (her), ir (bird), or (horn), ur (turn). Builds on Arc 12-13 phonics-decoding foundation + Arc 19 Phase 1.4 read-vowel-teams pair. The letter R is special — when it follows a vowel, the R 'bosses' the vowel, changing the vowel sound entirely. Car doesn't say 'cay-r' (with the long-A); it says /kar/ — the A becomes the R-controlled /ar/ sound. Same with: bird /bɜrd/, horn /hɔrn/, turn /tɜrn/. The 3 single-syllable sounds (ar / or / and the merged er-ir-ur) make up the canonical r-controlled set. Foundational decoding work because r-controlled vowels appear in 30% of grade-1 reading vocabulary. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook: the bossy-R rule. Teacher writes "car" on
      the board + sounds it out slowly: "c-ar. The A doesn't make
      its short-A sound (/a/ like apple) or its long-A sound (/ay/
      like cake). The R changes it. The A becomes /ar/. Car. Star.
      Far." Class repeats. Teacher introduces the rule: "When a
      vowel is followed by R, the R bosses the vowel. The vowel
      doesn't make its own sound anymore — it makes the R-controlled
      sound." Repeat with: "her" (er → /ɜr/); "bird" (ir → /ɜr/);
      "horn" (or → /ɔr/); "turn" (ur → /ɜr/). Notice the er-ir-ur
      sound the same — kids accept this as the bossy-R rule.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + R-pattern-spotting routine. Each pair receives 10
      picture cards with r-controlled-vowel labels (car, star, jar,
      her, bird, girl, horn, corn, turn, fur). Pair takes turns: kid
      A points to a card; kid B reads the word + identifies the
      r-controlled pattern ("c-ar... I see 'ar', so it makes /ar/.
      Car.") Recast errors with sound-stretching ("you said 'cat'
      for 'car' — let's look at the end: c-a-r. There's an R after
      the A. When R follows a vowel, it changes the sound. /kar/.
      Car.") Optional extension: kids sort cards into 3 piles by
      R-pattern (ar / or / er-ir-ur).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (r-controlled
      word to picture). Station 2: word-guess (kids fill in r-
      controlled letters from picture clues — c_r = car; b_rd =
      bird; h_rn = horn). Station 3: word-scramble with r-controlled
      words. Station 4: vocabulary-tracing-strips for r-controlled
      anchor words (car / her / bird / horn / turn).
  closure:
    durationMinutes: 5
    body: |
      Whole-class r-controlled review. Teacher writes 5 words; class
      reads each by spotting the R-pattern + saying the bossy-R
      sound. Forward-pointer: "Today we read r-controlled-vowel
      words. When we come back to reading next, we'll work on
      reading common prefixes and suffixes — un-, re-, -ed, -ing,
      -er — the little word-parts that change what a word means."

