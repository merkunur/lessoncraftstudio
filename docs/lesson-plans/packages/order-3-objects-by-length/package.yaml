assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Arrange 3 objects shortest-to-longest in 7 of 10 trials.
      - Use the superlative frame ('the shortest / longest /
        middle is the X') in 6 of 10 productive-language trials.
      - Apply transitive reasoning to predict the longest of 3
        objects given 2 pairwise comparisons in 5 of 8
        observed instances.
      - Use the vocabulary 'shortest' / 'longest' / 'middle' /
        'in between' correctly in 5 of 10 productive-language
        trials.
      - Order 4 objects shortest-to-longest (extension) in 4 of
        8 attempts.

    Differentiation:
    - Pre-K: stay with 2-object pairwise comparison; defer 3-
      object ordering to K.
    - K: 3-object ordering with concrete physical objects; defer
      transitive-reasoning chaining to Grade 1.
    - Grade 1: full 3-object ordering + transitive reasoning +
      extension to 4-object ordering; bridge to numerical-unit
      measurement (informal units: 'how many paperclips long?').
    - Grade 2+: 5+ object ordering + bridge to ruler-based
      measurement (formal numerical units: centimeters, inches)
      + measurement-attribute conservation (an object's length
      doesn't change when rotated or moved).

