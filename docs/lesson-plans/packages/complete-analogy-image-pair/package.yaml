compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / logical-reasoning
    (analogy completion; SAT-CLOSING canonical fill at 4/5 → 5/5).
    Secondary strand: early-literacy / vocabulary-acquisition (relation
    vocabulary + paired-object naming). Tertiary strand: cognitive-and-
    executive-function / sorting-and-classification (analogy is a
    relational-categorization operation — kids group pairs by the
    relation that holds between their items).

    Architectural significance: this package CLOSES the logical-reasoning
    canonical strand at 5/5. Final canonical target for the strand
    (preceding work covered AB pattern recognition + AAB/ABB extensions
    + cause-and-effect at Arc 7-8). Analogy completion adds
    PARALLEL-RELATION reasoning to the strand — distinct from pattern
    work (which exercises sequential rule application) and cause-effect
    work (which exercises temporal-causal reasoning). Logical-reasoning
    strand now fully saturated; cognitive-and-executive-function domain
    coverage advances: pattern-recognition + sorting-and-classification
    + logical-reasoning + memory-and-attention all SAT post-Arc-17 P1.1.

    Distinctive composition: 2 matching exercises (positions 1 + 2)
    establish image-pair vocabulary substrate; pattern-worksheet
    (position 3) applies analogy mechanic in puzzle form; word-guess
    (position 4) bridges to written language frames; odd-one-out
    (position 5) tests relational discrimination as assessment. Note:
    matching app at positions 1+2 produces image-pair sets that the
    pair-work routine adapts into 4-card analogy sets at scaffold time
    (worksheets supply substrate; pair-work adapts substrate into
    relational task).

    Class B FLEXIBLE substrate: composes against animals theme primarily,
    because animals are the K-3 highest-leverage substrate for
    analogy relations: young-grown (puppy↔dog), home (bird↔nest),
    food (dog↔bone), body-cover (animals don't wear clothes but human-
    body-with-clothes work surfaces in scaffold).

    Logic-class material composition: 8-material composition (full set
    including vocabulary-tracing-strips). Departs slightly from Arc 7
    identify-AB-pattern (7-material with no voc-tracing) to add
    voc-tracing for analogy-vocabulary reinforcement: kids trace
    relation-vocabulary words (\"grown\", \"baby\", \"home\", \"food\")
    that name the analogy types. Logic-class composition canonical
    going forward: 8-material standard set; per-package adjustment
    surfaces at draft review (e.g., pattern-recognition packages may
    skip voc-tracing where the mechanic doesn't surface load-bearing
    vocabulary).

    K-3 multilingual classroom relevance: analogy work is HIGHLY
    transferable across locales — the cognitive operation (find the
    relation, apply it again) is language-portable. Locale-variant
    work adapts the relation-vocabulary register (en \"grown / baby\";
    de \"erwachsen / Baby\"; es \"adulto / bebé\"; pt-BR
    \"adulto / filhote\"). Some analogy domains land more naturally
    in some locales than others (e.g., \"sock↔foot as glove↔hand\"
    works universally; \"chopstick↔rice\" works less well outside
    Asian-cultural contexts — locale-variant adapts substrate).
    Particularly load-bearing for international multilingual classroom
    contexts where kids' relational-reasoning is exercised in
    multiple languages simultaneously, accelerating cross-language
    transfer of cognitive skills.

