<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Treasure Hunt - Progression Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        position: relative;
        overflow: hidden;
    ">
        <!-- Diagonal split background -->
        <!-- Left zone: soft teal -->
        <div style="
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #E0F2F1 0%, #B2DFDB 100%);
        "></div>
        <!-- Right zone: soft rose -->
        <div style="
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #FCE4EC 0%, #F8BBD0 100%);
            clip-path: polygon(55% 0, 100% 0, 100% 100%, 45% 100%);
        "></div>

        <!-- Diagonal gold dashed line -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;" viewBox="0 0 1000 1000">
            <line x1="520" y1="0" x2="460" y2="1000" stroke="#D4A017" stroke-width="4" stroke-dasharray="16 10" opacity="0.5"/>
        </svg>

        <!-- Title - centered top -->
        <div style="
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 56px;
                color: #0B3D5B;
                margin: 0;
                text-shadow: 0 2px 8px rgba(0,0,0,0.08);
            ">Two Levels of Adventure!</h1>
            <div style="width: 180px; height: 4px; background: linear-gradient(90deg, #00897B, #D4A017, #C62828); margin: 8px auto 0; border-radius: 2px;"></div>
        </div>

        <!-- LEFT ZONE: Basic Mode -->
        <div style="
            position: absolute;
            top: 120px;
            left: 30px;
            width: 440px;
            z-index: 15;
        ">
            <!-- BASIC pill badge -->
            <div style="text-align: center; margin-bottom: 15px;">
                <div style="display: inline-block; background: linear-gradient(135deg, #00897B 0%, #00695C 100%); padding: 10px 35px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,137,123,0.35);">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; color: white; letter-spacing: 2px;">BASIC</span>
                </div>
            </div>

            <!-- Arrow shapes 2x2 grid -->
            <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 15px;">
                <!-- Up arrow -->
                <div style="width: 52px; height: 52px; background: #00897B; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,137,123,0.3);">
                    <svg width="24" height="24" viewBox="0 0 24 24"><polygon points="12,4 20,16 4,16" fill="white"/></svg>
                </div>
                <!-- Down arrow -->
                <div style="width: 52px; height: 52px; background: #00897B; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,137,123,0.3);">
                    <svg width="24" height="24" viewBox="0 0 24 24"><polygon points="12,20 20,8 4,8" fill="white"/></svg>
                </div>
                <!-- Left arrow -->
                <div style="width: 52px; height: 52px; background: #00897B; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,137,123,0.3);">
                    <svg width="24" height="24" viewBox="0 0 24 24"><polygon points="4,12 16,4 16,20" fill="white"/></svg>
                </div>
                <!-- Right arrow -->
                <div style="width: 52px; height: 52px; background: #00897B; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,137,123,0.3);">
                    <svg width="24" height="24" viewBox="0 0 24 24"><polygon points="20,12 8,4 8,20" fill="white"/></svg>
                </div>
            </div>

            <!-- Worksheet with answer key peeking behind -->
            <div style="position: relative; width: 300px; margin: 0 auto;">
                <!-- Answer key behind -->
                <div style="
                    position: absolute;
                    top: 10px;
                    left: 20px;
                    width: 250px;
                    height: 323px;
                    background: white;
                    border-radius: 10px;
                    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
                    overflow: hidden;
                    z-index: 1;
                ">
                    <img src="https://www.lessoncraftstudio.com/samples/english/treasure%20hunt/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover; object-position: top;" alt="Answer Key">
                </div>
                <!-- Main worksheet in front -->
                <div style="
                    position: relative;
                    width: 250px;
                    height: 323px;
                    background: white;
                    border-radius: 10px;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.2), 0 0 0 3px #00897B;
                    overflow: hidden;
                    z-index: 2;
                ">
                    <img src="https://www.lessoncraftstudio.com/samples/english/treasure%20hunt/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover; object-position: top;" alt="Basic Mode Worksheet">
                </div>
            </div>

            <!-- Label -->
            <p style="text-align: center; font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; color: #00695C; margin: 14px 0 0 0;">Up / Down / Left / Right</p>
        </div>

        <!-- RIGHT ZONE: Cardinal Mode -->
        <div style="
            position: absolute;
            top: 120px;
            right: 30px;
            width: 440px;
            z-index: 15;
        ">
            <!-- CARDINAL pill badge -->
            <div style="text-align: center; margin-bottom: 15px;">
                <div style="display: inline-block; background: linear-gradient(135deg, #C62828 0%, #B71C1C 100%); padding: 10px 30px; border-radius: 30px; box-shadow: 0 4px 15px rgba(198,40,40,0.35);">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; color: white; letter-spacing: 2px;">CARDINAL</span>
                </div>
            </div>

            <!-- Small SVG compass rose -->
            <div style="display: flex; justify-content: center; margin-bottom: 15px;">
                <svg width="70" height="70" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="42" stroke="#C62828" stroke-width="3" fill="none" opacity="0.6"/>
                    <circle cx="50" cy="50" r="32" stroke="#C62828" stroke-width="1.5" fill="none" opacity="0.4"/>
                    <polygon points="50,12 46,38 54,38" fill="#C62828"/>
                    <polygon points="50,88 46,62 54,62" fill="#C62828" opacity="0.5"/>
                    <polygon points="12,50 38,46 38,54" fill="#C62828" opacity="0.5"/>
                    <polygon points="88,50 62,46 62,54" fill="#C62828" opacity="0.5"/>
                    <text x="50" y="9" text-anchor="middle" fill="#C62828" font-size="12" font-weight="bold" font-family="Fredoka, sans-serif">N</text>
                    <text x="50" y="98" text-anchor="middle" fill="#C62828" font-size="12" font-weight="bold" font-family="Fredoka, sans-serif">S</text>
                    <text x="96" y="54" text-anchor="end" fill="#C62828" font-size="12" font-weight="bold" font-family="Fredoka, sans-serif">E</text>
                    <text x="5" y="54" text-anchor="start" fill="#C62828" font-size="12" font-weight="bold" font-family="Fredoka, sans-serif">W</text>
                </svg>
            </div>

            <!-- Worksheet with answer key peeking behind -->
            <div style="position: relative; width: 300px; margin: 0 auto;">
                <!-- Answer key behind -->
                <div style="
                    position: absolute;
                    top: 10px;
                    right: 20px;
                    width: 250px;
                    height: 323px;
                    background: white;
                    border-radius: 10px;
                    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
                    overflow: hidden;
                    z-index: 1;
                ">
                    <img src="https://www.lessoncraftstudio.com/samples/english/treasure%20hunt/sample-2-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover; object-position: top;" alt="Cardinal Answer Key">
                </div>
                <!-- Main worksheet in front -->
                <div style="
                    position: relative;
                    width: 250px;
                    height: 323px;
                    background: white;
                    border-radius: 10px;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.2), 0 0 0 3px #C62828;
                    overflow: hidden;
                    z-index: 2;
                    margin-left: auto;
                ">
                    <img src="https://www.lessoncraftstudio.com/samples/english/treasure%20hunt/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover; object-position: top;" alt="Cardinal Mode Worksheet">
                </div>
            </div>

            <!-- Label -->
            <p style="text-align: center; font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; color: #B71C1C; margin: 14px 0 0 0;">North / South / East / West</p>
        </div>

        <!-- Bottom progression bar -->
        <div style="
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 20;
        ">
            <div style="background: #00897B; padding: 10px 25px; border-radius: 25px; box-shadow: 0 3px 12px rgba(0,137,123,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; color: white;">Easy Start</span>
            </div>
            <!-- Arrow -->
            <svg width="50" height="24" viewBox="0 0 50 24">
                <line x1="0" y1="12" x2="40" y2="12" stroke="#D4A017" stroke-width="4" stroke-linecap="round"/>
                <polygon points="38,4 50,12 38,20" fill="#D4A017"/>
            </svg>
            <div style="background: #C62828; padding: 10px 25px; border-radius: 25px; box-shadow: 0 3px 12px rgba(198,40,40,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 700; color: white;">Level Up!</span>
            </div>
        </div>

        <!-- Subtitle under progression -->
        <div style="
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
        ">
            <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #0B3D5B; opacity: 0.7;">Differentiated for Every Learner</span>
        </div>
    </div>
</body>
</html>
