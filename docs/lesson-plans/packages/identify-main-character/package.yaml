# Teaching package — identify the main character in a story
# Arc 17 Phase 1.5 (language-and-communication / reading-comprehension 2/10 → 3/10). Builds on Arc 12 Phase 2 match-sentence-to-picture (the strand-FIRST 0/10 → 1/10 reading-comp foundation).

targetSlug: identify-main-character
language: en
title:
  en: "Identify the Main Character — who is the story about?"

description:
  en: "Kindergarten / Grade 1 reading-comprehension package teaching kids to identify the MAIN CHARACTER in a story — the person (or animal, or thing) the story is about. Builds on Arc 12 Phase 2 match-sentence-to-picture (the strand-FIRST reading-comprehension foundation; kids who can match sentences to pictures can now extract a CHARACTER from a sentence-and-picture pair). Reading-comprehension strand advances 2/10 → 3/10 (predict-from-picture-cue is the other existing sibling; match-sentence-to-picture is the strand-opener). Per §A.13.30 K-1-informal framing: K-1 work is character-identification in TEACHER-LED READ-ALOUD or PICTURE-SUPPORTED text, NOT independent decoding + literary analysis. Kids listen to or follow along with a short story; teacher asks 'who is this story about?' and kids identify the main character (typically named in the story title or shown prominently in pictures). The character is most often the protagonist whose actions drive the narrative — but at K-1, the simpler 'whose name appears most / who appears in most pictures' is the recognizable signal. CCSS.RL.K.3 primary anchor ('With prompting and support, identify characters, settings, and major events in a story'); CCSS.1.RL.3 Grade 1 extension. 5 worksheet exercises + 8 printable materials over a 1-week unit. Load-bearing material: sentence-strips with story-context framePreset (the literal story-frame substrate kids work with)."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class story-character introduction with read-
      aloud. Teacher reads a short familiar picture-book
      aloud (e.g., 'The Very Hungry Caterpillar' by Eric
      Carle; or a culturally-equivalent simple animal-
      protagonist story). After reading: "Who was this
      story about?" Class names the main character (the
      Caterpillar). "How did you know it was the Caterpillar?
      What clues did the story give us?" Class explains
      they saw the Caterpillar on most pages, the title
      named the Caterpillar, the Caterpillar did most of
      the actions. Teacher then introduces vocabulary:
      "We call this the MAIN CHARACTER — the person or
      animal the story is mostly about." Teacher repeats
      with a second short story featuring a different
      animal-protagonist (e.g., 'Brown Bear, Brown Bear,
      What Do You See?' — the bear and the sequence of
      animals). Class identifies the bear as the
      foundational protagonist. Pattern emphasis: "When
      we read a story, ASK: who is this about? The
      MAIN CHARACTER appears most, the title often names
      them, they do the important actions."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + story-and-character routine. Each pair
      receives 6 short story cards (3-4 sentences each
      with picture-support) + 6 character cards (the main
      character of each story shown in isolation). Pair
      takes turns: kid A reads a story card aloud (or
      teacher reads if reading-fluency not yet there);
      kid B identifies the main character + finds the
      matching character card. Both kids say aloud: "The
      main character of this story is the [character]."
      Recast errors with cue-pointing ("you said the
      character was the fox, but look at this picture —
      the dog appears in every picture and the title says
      'Where's My Bone?' — the main character is the dog
      looking for the bone."). The character cards
      provide the matching scaffold; the story cards
      provide the narrative context. Optional extension:
      kids retell a favorite story to their partner using
      the character cards as visual aid + practice the
      main-character vocabulary in retelling.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity
      (character-image to character-name; vocabulary
      anchor for the character-vocabulary kids encounter
      across stories). Station 2: picture-sort activity
      (sort character cards into categories — e.g.,
      'animal characters' / 'people characters' / 'other'
      — surfaces character-types without requiring
      reading). Station 3: missing-pieces (complete the
      character image — supports the visual character-
      recognition the comprehension skill builds on).
      Station 4: matching activity (story-card to
      character-card; the canonical comprehension-skill
      exercise).
  closure:
    durationMinutes: 5
    body: |
      Whole-class main-character quick-recall. Teacher
      displays 3 story cards; class chorally identifies
      the main character of each. "This story has the
      Caterpillar! This one is about the Bear! This one
      is about the Rabbit!" Teacher then asks the
      reflection question: "How do you find the main
      character?" Class chants: "Look at the pictures!
      Look at the title! See who does the actions!"
      Forward-pointer: "Today we identified main
      characters. Reading is about understanding STORIES
      — and stories are about CHARACTERS doing things in
      SETTINGS. Next we'll meet IDENTIFY THE SETTING
      (where does the story happen?) and SEQUENCE THE
      STORY EVENTS (what happened first, next, last?).
      We're building toward telling stories ourselves."

