assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Chant counting by 2s from 0 to 20 with no errors in 8 of 10
        attempts.
      - Fill in missing numbers in a counting-by-2s sequence (e.g.,
        2, ___, 6, ___, 10) in 7 of 10 trials.
      - Use counting-by-2s to count a set of 20 objects (instead of
        counting by 1s) in 6 of 10 trials.

    Differentiation:
    - Pre-K: chant only; 0 to 10 (5 even numbers); manipulative-
      supported.
    - K: chant + fill-in 0 to 20; pencil-and-paper.
    - Grade 1+: extend to count-by-5s + count-by-10s (Arc 9+ candidate);
      bridge to multiplication readiness.

