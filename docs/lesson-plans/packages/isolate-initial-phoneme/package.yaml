assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Isolate the initial phoneme of a spoken CVC word in 7
        of 10 trials.
      - Match a pictured CVC word to its initial-sound letter
        in 7 of 10 trials.
      - Sort 12 pictures into beginning-sound groups (3-4
        groups) correctly in 6 of 10 attempts.
      - Use vocabulary 'first sound' / 'beginning sound' /
        'starting sound' correctly in 5 of 10 productive-
        language trials.

    Differentiation:
    - Pre-K: focus on rhyme + syllable work first; defer
      phoneme-level isolation to K.
    - K: single-consonant initial-phoneme isolation + picture-
      to-letter matching; consonant-blend onsets deferred.
    - Grade 1: extend to consonant-blend onsets (/bl/, /str/,
      /sn/) + medial-vowel + final-phoneme isolation; bridge
      to full CVC phoneme-segmentation.
    - Grade 2+: formal phonemic-awareness assessments + bridge
      to systematic phonics decoding (phoneme-grapheme
      correspondence + decoding fluency).

