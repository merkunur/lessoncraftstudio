assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify initial letter of 8 of 10 familiar object names.
      - Match a picture to its initial letter on an alphabet strip in 8
        of 10 trials.
      - Articulate the initial-letter mapping productively ("APPLE
        starts with A") in 7 of 10 trials.

    Differentiation:
    - Pre-K: 5 letter-image pairs with strong acoustic salience
      (A-apple, B-ball, C-cat, D-dog, E-egg).
    - K: 10-15 letter-image pairs across themes; lowercase letters.
    - Grade 1+: extend to FINAL letters + MIDDLE letters (Arc 10+
      candidate); bridge to whole-word reading.

