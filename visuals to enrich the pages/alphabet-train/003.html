<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Alphabet Train - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: #F5F5F5; overflow: hidden;">

        <!-- Subtle grid pattern -->
        <div style="position: absolute; inset: 0; background-image:
            linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 50px 50px;"></div>

        <!-- Header -->
        <div style="position: absolute; top: 30px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 48px; color: #1A237E; margin: 0;">Every Learner's Journey</h1>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 22px; color: #546E7A; margin: 8px 0 0 0;">Alphabet Train • PreK-K</p>
        </div>

        <!-- Transit Map Area -->
        <div style="position: absolute; top: 140px; left: 50px; right: 50px; bottom: 120px;">

            <!-- GREEN ROUTE - Easy -->
            <div style="position: absolute; top: 30px; left: 0; right: 0; height: 180px;">
                <!-- Route line -->
                <div style="position: absolute; top: 50%; left: 80px; right: 80px; height: 12px; background: #4CAF50; border-radius: 6px; transform: translateY(-50%);"></div>

                <!-- Start station -->
                <div style="position: absolute; left: 60px; top: 50%; transform: translateY(-50%);">
                    <div style="width: 30px; height: 30px; background: white; border: 5px solid #4CAF50; border-radius: 50%;"></div>
                </div>

                <!-- Middle station dots -->
                <div style="position: absolute; left: 200px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; background: #4CAF50; border-radius: 50%;"></div>
                <div style="position: absolute; left: 340px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; background: #4CAF50; border-radius: 50%;"></div>

                <!-- Worksheet station -->
                <div style="position: absolute; left: 420px; top: 50%; transform: translateY(-50%);">
                    <div style="width: 40px; height: 40px; background: white; border: 6px solid #4CAF50; border-radius: 50%; position: relative; z-index: 10;"></div>
                    <!-- Worksheet preview -->
                    <div style="position: absolute; left: 60px; top: -55px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); border-radius: 6px; overflow: hidden; border: 3px solid #4CAF50;">
                        <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/alphabet%20train/Alphabet%20Train%201.jpeg" style="width: 120px; height: auto; display: block;">
                    </div>
                </div>

                <!-- End stations -->
                <div style="position: absolute; right: 200px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; background: #4CAF50; border-radius: 50%;"></div>

                <!-- Train icon -->
                <div style="position: absolute; left: 120px; top: 50%; transform: translateY(-50%); font-size: 32px;">🚂</div>

                <!-- Route label -->
                <div style="position: absolute; left: 0; top: 50%; transform: translateY(-50%);">
                    <div style="background: #4CAF50; padding: 6px 14px; border-radius: 15px;">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white;">EASY</span>
                    </div>
                </div>

                <!-- Clue indicator -->
                <div style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); text-align: right;">
                    <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #4CAF50;">8-11 Clues</div>
                    <div style="font-family: 'Nunito', sans-serif; font-size: 14px; color: #66BB6A;">Most Support</div>
                </div>
            </div>

            <!-- YELLOW ROUTE - Medium -->
            <div style="position: absolute; top: 230px; left: 0; right: 0; height: 180px;">
                <!-- Route line -->
                <div style="position: absolute; top: 50%; left: 80px; right: 80px; height: 12px; background: #FFC107; border-radius: 6px; transform: translateY(-50%);"></div>

                <!-- Start station -->
                <div style="position: absolute; left: 60px; top: 50%; transform: translateY(-50%);">
                    <div style="width: 30px; height: 30px; background: white; border: 5px solid #FFC107; border-radius: 50%;"></div>
                </div>

                <!-- Middle station dots -->
                <div style="position: absolute; left: 220px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; background: #FFC107; border-radius: 50%;"></div>

                <!-- Worksheet station -->
                <div style="position: absolute; left: 440px; top: 50%; transform: translateY(-50%);">
                    <div style="width: 40px; height: 40px; background: white; border: 6px solid #FFC107; border-radius: 50%; position: relative; z-index: 10;"></div>
                    <!-- Worksheet preview -->
                    <div style="position: absolute; left: 60px; top: -55px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); border-radius: 6px; overflow: hidden; border: 3px solid #FFC107;">
                        <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/alphabet%20train/Alphabet%20Train%205.jpeg" style="width: 120px; height: auto; display: block;">
                    </div>
                </div>

                <!-- End stations -->
                <div style="position: absolute; right: 220px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; background: #FFC107; border-radius: 50%;"></div>

                <!-- Train icon -->
                <div style="position: absolute; left: 280px; top: 50%; transform: translateY(-50%); font-size: 32px;">🚃</div>

                <!-- Route label -->
                <div style="position: absolute; left: 0; top: 50%; transform: translateY(-50%);">
                    <div style="background: #FFC107; padding: 6px 14px; border-radius: 15px;">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: #5D4037;">JUST RIGHT</span>
                    </div>
                </div>

                <!-- Clue indicator -->
                <div style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); text-align: right;">
                    <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #FFA000;">5-7 Clues</div>
                    <div style="font-family: 'Nunito', sans-serif; font-size: 14px; color: #FFB300;">Balanced</div>
                </div>
            </div>

            <!-- RED ROUTE - Challenge -->
            <div style="position: absolute; top: 430px; left: 0; right: 0; height: 180px;">
                <!-- Route line -->
                <div style="position: absolute; top: 50%; left: 80px; right: 80px; height: 12px; background: #F44336; border-radius: 6px; transform: translateY(-50%);"></div>

                <!-- Start station -->
                <div style="position: absolute; left: 60px; top: 50%; transform: translateY(-50%);">
                    <div style="width: 30px; height: 30px; background: white; border: 5px solid #F44336; border-radius: 50%;"></div>
                </div>

                <!-- Worksheet station -->
                <div style="position: absolute; left: 460px; top: 50%; transform: translateY(-50%);">
                    <div style="width: 40px; height: 40px; background: white; border: 6px solid #F44336; border-radius: 50%; position: relative; z-index: 10;"></div>
                    <!-- Worksheet preview -->
                    <div style="position: absolute; left: 60px; top: -55px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); border-radius: 6px; overflow: hidden; border: 3px solid #F44336;">
                        <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/alphabet%20train/Alphabet%20Train%2010.jpeg" style="width: 120px; height: auto; display: block;">
                    </div>
                </div>

                <!-- Train icon -->
                <div style="position: absolute; left: 350px; top: 50%; transform: translateY(-50%); font-size: 32px;">🚃</div>

                <!-- Route label -->
                <div style="position: absolute; left: 0; top: 50%; transform: translateY(-50%);">
                    <div style="background: #F44336; padding: 6px 14px; border-radius: 15px;">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white;">CHALLENGE</span>
                    </div>
                </div>

                <!-- Clue indicator -->
                <div style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); text-align: right;">
                    <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #F44336;">3-4 Clues</div>
                    <div style="font-family: 'Nunito', sans-serif; font-size: 14px; color: #EF5350;">Independent</div>
                </div>
            </div>

            <!-- Destination convergence point -->
            <div style="position: absolute; right: 80px; top: 230px; width: 80px; height: 200px;">
                <!-- Converging lines -->
                <div style="position: absolute; left: 0; top: 0; width: 4px; height: 100%; background: linear-gradient(180deg, #4CAF50 0%, #FFC107 50%, #F44336 100%); border-radius: 2px;"></div>

                <!-- Destination badge -->
                <div style="position: absolute; left: -60px; top: 50%; transform: translateY(-50%);">
                    <div style="background: linear-gradient(135deg, #1A237E 0%, #283593 100%); padding: 15px 20px; border-radius: 12px; box-shadow: 0 6px 25px rgba(26,35,126,0.4); text-align: center;">
                        <div style="font-size: 30px; margin-bottom: 5px;">🎯</div>
                        <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white; line-height: 1.3;">Letter<br>Recognition<br>Station</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom bar -->
        <div style="position: absolute; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; gap: 30px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 20px; height: 20px; background: #4CAF50; border-radius: 50%;"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #37474F;">Easy Route</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 20px; height: 20px; background: #FFC107; border-radius: 50%;"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #37474F;">Just Right</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 20px; height: 20px; background: #F44336; border-radius: 50%;"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #37474F;">Challenge Track</span>
            </div>
        </div>

        <!-- FREE badge -->
        <div style="position: absolute; top: 30px; right: 40px; background: #E53935; padding: 8px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(229,57,53,0.4);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">FREE</span>
        </div>

    </div>
</body>
</html>
