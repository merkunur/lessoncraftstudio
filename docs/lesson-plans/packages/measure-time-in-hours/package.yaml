assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Estimate duration of familiar activities in hour-units
        correctly in 6 of 8 trials (e.g., "sleeping at night
        takes about 10 hours" / "brushing teeth takes less than
        an hour").
      - Sort activities into less-than-an-hour / about-an-hour /
        more-than-an-hour categories accurately in 7 of 10
        trials.
      - Compare two activity durations correctly using "longer
        than" / "shorter than" / "about the same" in 5 of 8
        trials.
      - Use "hour" as canonical duration unit in 5 of 10
        productive-language trials.

    Differentiation:
    - Pre-K: qualitative duration comparison (longer/shorter)
      only; no hour-unit work.
    - K: introduction to "hour" as familiar-activity anchor;
      duration sorting with concrete examples.
    - Grade 1: full hour-unit estimation; bridge to half-hour
      and minute work; familiar-routine anchoring.
    - Grade 2+: extend to elapsed-time problems + minute/day/
      week-unit measurement; bridge to formal time-schedule
      reading.

