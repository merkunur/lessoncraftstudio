<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Missing Question — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- TOOL #55 - THE MISSING QUESTION. Three empty places and no numbers
       at all: nothing has been said yet, so there is nothing to answer
       and the class's only job is to decide what could be ASKED. Then
       one fact arrives per press - how the three go together, then one
       number, then another - and the one still unsaid becomes the
       question. It ACCRETES; it never covers, which is what keeps it
       clear of part-whole-frame's three cloths. Nothing is ever
       enumerated, because there is only ever one unknown. It loads NO
       ART and NO AUDIO beyond the shell's own pop. -->

  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/missing-question.js?v=2"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    LCS.mount(MissingQuestion, { mount: '#lcs-root' });
  </script>
</body>
</html>
