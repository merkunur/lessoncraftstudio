<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Schattenbilder - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(90deg, #0D1B2A 0%, #1A1A3E 45%, #3C1874 100%); overflow: hidden;">

        <!-- Subtle dot pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image: radial-gradient(circle, #E8E0F0 1px, transparent 1px); background-size: 28px 28px;"></div>

        <!-- Title Section -->
        <div style="position: absolute; top: 32px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 44px; color: #FFFFFF; margin: 0; text-shadow: 0 0 30px rgba(0,229,255,0.12), 2px 2px 0 rgba(0,0,0,0.35); letter-spacing: 2px;">VOM EINFACHEN ZUM KNIFFLIGEN</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; color: #FFB300; margin: 10px 0 0 0; text-shadow: 0 0 15px rgba(255,179,0,0.2), 1px 1px 3px rgba(0,0,0,0.4);">Stufenweise Schwierigkeit</h2>
        </div>

        <!-- Three Columns with Arrows -->
        <div style="position: absolute; top: 155px; left: 50%; transform: translateX(-50%); width: 920px; height: 560px; display: flex; align-items: flex-start; justify-content: center;">

            <!-- Column 1: Einsteiger (Green) -->
            <div style="width: 260px; text-align: center; padding-top: 10px;">
                <!-- Icon circle -->
                <div style="width: 60px; height: 60px; background: linear-gradient(145deg, #00C853, #00897B); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto; box-shadow: 0 6px 22px rgba(0,200,83,0.35);">
                    <span style="font-size: 28px;">&#11088;</span>
                </div>
                <!-- Level Label -->
                <div style="margin-bottom: 16px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #00C853; text-shadow: 0 0 12px rgba(0,200,83,0.25);">Einsteiger</span>
                </div>
                <!-- Worksheet Frame -->
                <div style="width: 220px; height: 170px; background: white; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.35), 0 0 0 3px rgba(0,200,83,0.35); overflow: hidden; margin: 0 auto 14px auto;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/shadow%20match/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Einsteiger Arbeitsblatt">
                </div>
                <!-- Caption -->
                <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 15px; color: rgba(255,255,255,0.8);">Deutliche Formen</span>
            </div>

            <!-- Arrow 1 (Amber) -->
            <div style="display: flex; align-items: center; padding-top: 170px; margin: 0 10px;">
                <div style="width: 0; height: 0; border-top: 18px solid transparent; border-bottom: 18px solid transparent; border-left: 28px solid #FFB300; filter: drop-shadow(0 2px 6px rgba(255,179,0,0.4));"></div>
            </div>

            <!-- Column 2: Fortgeschritten (Amber) -->
            <div style="width: 260px; text-align: center; padding-top: 10px;">
                <!-- Icon circle -->
                <div style="width: 60px; height: 60px; background: linear-gradient(145deg, #FFB300, #FF8F00); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto; box-shadow: 0 6px 22px rgba(255,179,0,0.35);">
                    <span style="font-size: 28px;">&#127919;</span>
                </div>
                <!-- Level Label -->
                <div style="margin-bottom: 16px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #FFB300; text-shadow: 0 0 12px rgba(255,179,0,0.25);">Fortgeschritten</span>
                </div>
                <!-- Worksheet Frame -->
                <div style="width: 220px; height: 170px; background: white; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.35), 0 0 0 3px rgba(255,179,0,0.35); overflow: hidden; margin: 0 auto 14px auto;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/shadow%20match/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Fortgeschritten Arbeitsblatt">
                </div>
                <!-- Caption -->
                <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 15px; color: rgba(255,255,255,0.8);">&Auml;hnliche Umrisse</span>
            </div>

            <!-- Arrow 2 (Red-orange) -->
            <div style="display: flex; align-items: center; padding-top: 170px; margin: 0 10px;">
                <div style="width: 0; height: 0; border-top: 18px solid transparent; border-bottom: 18px solid transparent; border-left: 28px solid #FF5252; filter: drop-shadow(0 2px 6px rgba(255,82,82,0.4));"></div>
            </div>

            <!-- Column 3: Profi (Red-orange) -->
            <div style="width: 260px; text-align: center; padding-top: 10px;">
                <!-- Icon circle -->
                <div style="width: 60px; height: 60px; background: linear-gradient(145deg, #FF5252, #D32F2F); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px auto; box-shadow: 0 6px 22px rgba(255,82,82,0.35);">
                    <span style="font-size: 28px;">&#127942;</span>
                </div>
                <!-- Level Label -->
                <div style="margin-bottom: 16px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #FF5252; text-shadow: 0 0 12px rgba(255,82,82,0.25);">Profi</span>
                </div>
                <!-- Worksheet Frame -->
                <div style="width: 220px; height: 170px; background: white; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.35), 0 0 0 3px rgba(255,82,82,0.35); overflow: hidden; margin: 0 auto 14px auto;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/shadow%20match/sample-6.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Profi Arbeitsblatt">
                </div>
                <!-- Caption -->
                <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 15px; color: rgba(255,255,255,0.8);">Zusammenf&uuml;gen-Modus</span>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 110px; left: 0; right: 0; background: linear-gradient(90deg, rgba(13,27,42,0.95) 0%, rgba(60,24,116,0.95) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.3); border-top: 2px solid rgba(255,179,0,0.2); border-bottom: 2px solid rgba(255,179,0,0.2);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 0 0 15px rgba(255,179,0,0.2), 2px 2px 4px rgba(0,0,0,0.4); letter-spacing: 1.5px;">Jedes Kind lernt in seinem Tempo!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(6px); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); border: 2px solid rgba(0,200,83,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #00C853;">Differenzierung</span>
            </div>
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(6px); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); border: 2px solid rgba(255,179,0,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #FFB300;">Alle Niveaus</span>
            </div>
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(6px); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); border: 2px solid rgba(255,82,82,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #FF5252;">F&ouml;rderunterricht</span>
            </div>
        </div>

    </div>
</body>
</html>
