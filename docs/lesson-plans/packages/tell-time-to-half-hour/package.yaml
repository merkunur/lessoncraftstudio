# Teaching package — tell time to the half-hour
# Arc 17 Phase 1.4 (math / measurement strand — completes tell-time canonical pair). Extends tell-time-to-the-hour (Slot 1) to half-hour reading. Pair partner: tell-time-to-the-hour (same arc phase).

targetSlug: tell-time-to-half-hour
language: en
title:
  en: "Tell Time to the Half-Hour — when the minute hand points straight down"

description:
  en: "Grade 1 math/measurement package extending tell-time-to-the-hour (Slot 1 of Phase 1.4) to half-hour reading on analog clocks. At the half-hour, the minute hand points straight DOWN to 6 (instead of straight up to 12 at the hour). The hour hand sits BETWEEN the previous hour and the next hour — 3:30 has the hour hand halfway between 3 and 4. Bridges hour-only reading to fully-quantitative time reading. CCSS.1.MD.B.3 anchor (the same standard covers both hour + half-hour reading; per learning-targets.json `tell-time-to-half-hour` is a distinct canonical target). Parallel to Arc 15 Phase 1 read-time-on-analog-clock per the same measurement-strand vs time-and-routine-strand framing distinction documented in tell-time-to-the-hour (Slot 1). Together with tell-time-to-the-hour, this package completes the canonical measurement-strand tell-time pair (2 of 3 tell-time canonical targets shipped; tell-time-to-quarter-hour deferred to Phase 1.5+). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + half-hour position introduction.
      Teacher displays a large analog clock + reviews the
      hour-only work from yesterday: "Remember when the
      minute hand points straight UP to 12, the time is
      exactly the hour — three o'clock, five o'clock." Then
      the new content: "Today we learn what happens when
      30 MINUTES have passed since the hour. We're HALFWAY
      THROUGH the hour. The minute hand has moved from 12
      all the way around to point straight DOWN to 6. We
      call this HALF-PAST." Teacher demonstrates 3:30 (hour
      hand between 3 and 4; minute hand pointing straight
      down at 6); 7:30 (hour hand between 7 and 8; minute
      hand at 6); 11:30 (hour hand between 11 and 12;
      minute hand at 6). Pattern emphasis: "At HALF-PAST,
      the LONG hand points STRAIGHT DOWN to 6. The SHORT
      hand sits BETWEEN two hour numbers — between 3 and
      4 means half-past 3. The hour hand has already
      MOVED PAST 3 but hasn't reached 4 yet, because we're
      still in the 3-something time." Teacher writes
      digital forms: 3:30, 7:30, 11:30.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + half-hour clock-reading routine with
      movable-hand paper clocks. Each pair receives the
      same movable-hand clock-mat material as Slot 1 + a
      set of 8 half-hour time cards (2:30, 5:30, 8:30,
      11:30, 1:30, 4:30, 7:30, 10:30). Pair takes turns:
      kid A draws a half-hour time card (e.g., 5:30); kid
      B sets the paper clock — minute hand straight down
      to 6, hour hand BETWEEN 5 and 6. Kid A verifies the
      placement, especially checking the hour-hand
      between-position. Then swap. Recast errors with
      between-hand cue ("5:30: the hour hand isn't ON 5,
      it isn't ON 6 — it's BETWEEN 5 and 6. The minute
      hand has moved halfway around, so the hour hand has
      also moved halfway between the hours."). The
      between-position of the hour hand is the load-
      bearing visual insight that distinguishes half-hour
      from hour reading — kids who think the hour hand
      stays exactly on the named number will get half-hour
      reading wrong.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity —
      match each analog clock face (drawn at half-hour
      positions) to its digital time (1:30, 2:30, ... 12:30).
      Station 2: chart-count activity — count through hour
      AND half-hour positions in sequence (1:00, 1:30,
      2:00, 2:30, 3:00, 3:30...). Station 3: math-puzzle
      (set the clock to a given half-hour time:
      missing-element prompt). Station 4: mixed-hour-and-
      half-hour matching (kids must distinguish between
      o'clock and half-past based on minute-hand position).
  closure:
    durationMinutes: 5
    body: |
      Whole-class half-hour quick-recall. Teacher displays
      6 clock faces (mix of o'clock + half-past); class
      chorally reads each. "Three o'clock! Half-past four!
      Eight o'clock! Half-past eleven! Half-past one!
      Twelve o'clock!" Forward-pointer: "Today we read
      half-hour times — when the minute hand points
      straight DOWN to 6. Together with yesterday's hour
      reading, we now read both EXACT hour times and
      HALF-PAST times. Next we'll meet QUARTER-HOUR
      reading — when the minute hand points to 3 or 9
      (15 minutes past or quarter-to-the-next-hour) — and
      eventually we'll read EVERY-5-MINUTES, AM vs PM,
      and ELAPSED TIME (how many hours between two
      times). The measurement of time keeps getting more
      precise."

