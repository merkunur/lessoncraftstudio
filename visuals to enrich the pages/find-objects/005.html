<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Find Objects - Visual Excellence Professional Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1000px;
            height: 1000px;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }
        .container {
            width: 1000px;
            height: 1000px;
            background: linear-gradient(135deg, #166534 0%, #059669 50%, #10B981 100%);
            position: relative;
            overflow: hidden;
        }

        /* Subtle pattern overlay */
        .pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.05) 0%, transparent 50%);
        }

        /* Gold sparkles */
        .gold-sparkle {
            position: absolute;
            color: #CA8A04;
            font-size: 20px;
            opacity: 0.6;
            text-shadow: 0 0 10px rgba(202,138,4,0.5);
        }
        .sparkle-1 { top: 100px; left: 80px; }
        .sparkle-2 { top: 150px; right: 100px; }
        .sparkle-3 { top: 400px; left: 50px; }
        .sparkle-4 { top: 500px; right: 60px; }
        .sparkle-5 { bottom: 300px; left: 100px; }
        .sparkle-6 { bottom: 250px; right: 80px; }
        .sparkle-7 { top: 250px; left: 150px; }
        .sparkle-8 { top: 350px; right: 130px; }

        /* Main title */
        .title-section {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }

        .main-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            line-height: 0.95;
        }

        .visual {
            font-size: 65px;
            background: linear-gradient(135deg, #FACC15 0%, #CA8A04 50%, #FACC15 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.3));
            letter-spacing: -2px;
        }

        .excellence {
            font-size: 65px;
            background: linear-gradient(135deg, #FACC15 0%, #CA8A04 50%, #FACC15 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.3));
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 26px;
            color: #FFF8E1;
            font-weight: 700;
            margin-top: 10px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* Gold quality seal */
        .quality-seal {
            position: absolute;
            top: 220px;
            right: 80px;
            width: 140px;
            height: 140px;
            z-index: 15;
        }

        .seal-outer {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #FACC15 0%, #CA8A04 50%, #92400E 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.3),
                inset 0 -5px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .seal-outer::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 3px solid rgba(255,255,255,0.4);
            border-radius: 50%;
        }

        .seal-inner {
            text-align: center;
        }

        .seal-icon {
            font-size: 40px;
        }

        .seal-text {
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #166534;
            margin-top: -5px;
        }

        /* Owl icon */
        .owl {
            position: absolute;
            top: 220px;
            left: 80px;
            font-size: 80px;
            text-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* Fanned worksheets */
        .worksheets-fan {
            position: absolute;
            top: 300px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
        }

        .worksheet-card {
            position: absolute;
            background: white;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .worksheet-card img {
            width: 240px;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .card-1 {
            transform: rotate(-12deg) translateX(-180px);
            z-index: 1;
        }

        .card-2 {
            transform: rotate(0deg) translateX(0px) translateY(-10px);
            z-index: 3;
        }

        .card-3 {
            transform: rotate(12deg) translateX(180px);
            z-index: 2;
        }

        /* Answer key badge on middle card */
        .answer-badge {
            position: absolute;
            bottom: -15px;
            right: -15px;
            background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(34,197,94,0.4);
            z-index: 10;
        }

        .answer-badge-icon {
            font-size: 35px;
        }

        /* Quality indicators at bottom */
        .quality-indicators {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 15;
        }

        .indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.15);
            padding: 12px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .indicator-icon {
            font-size: 24px;
        }

        .indicator-text {
            font-weight: 700;
            font-size: 16px;
            color: #FFF8E1;
        }

        /* Grade badge */
        .grade-badge {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(255,255,255,0.95);
            padding: 10px 20px;
            border-radius: 25px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #166534;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 20;
        }

        /* FREE badge */
        .free-badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, #FACC15 0%, #CA8A04 100%);
            padding: 12px 24px;
            border-radius: 25px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: #166534;
            box-shadow: 0 4px 15px rgba(202,138,4,0.4);
            z-index: 20;
        }

        /* Bottom tagline */
        .tagline {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,248,225,0.95);
            padding: 15px 40px;
            border-radius: 35px;
            z-index: 15;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .tagline-text {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 22px;
            color: #166534;
        }

        /* Decorative border */
        .border-decoration {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 3px solid rgba(202,138,4,0.3);
            border-radius: 20px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Pattern overlay -->
        <div class="pattern"></div>

        <!-- Decorative border -->
        <div class="border-decoration"></div>

        <!-- Gold sparkles -->
        <div class="gold-sparkle sparkle-1">✦</div>
        <div class="gold-sparkle sparkle-2">✦</div>
        <div class="gold-sparkle sparkle-3">✦</div>
        <div class="gold-sparkle sparkle-4">✦</div>
        <div class="gold-sparkle sparkle-5">✦</div>
        <div class="gold-sparkle sparkle-6">✦</div>
        <div class="gold-sparkle sparkle-7">✦</div>
        <div class="gold-sparkle sparkle-8">✦</div>

        <!-- Grade badge -->
        <div class="grade-badge">GRADES PreK-2</div>

        <!-- FREE badge -->
        <div class="free-badge">FREE</div>

        <!-- Main title -->
        <div class="title-section">
            <div class="main-title">
                <div class="visual">VISUAL</div>
                <div class="excellence">EXCELLENCE</div>
            </div>
            <div class="subtitle">Build Sharp Observation Skills</div>
        </div>

        <!-- Owl -->
        <div class="owl">🦉</div>

        <!-- Quality seal -->
        <div class="quality-seal">
            <div class="seal-outer">
                <div class="seal-inner">
                    <div class="seal-icon">⭐</div>
                    <div class="seal-text">PREMIUM<br>QUALITY</div>
                </div>
            </div>
        </div>

        <!-- Fanned worksheets -->
        <div class="worksheets-fan">
            <div class="worksheet-card card-1">
                <img src="https://www.lessoncraftstudio.com/samples/english/find%20objects/sample-20.jpeg" alt="Worksheet 1">
            </div>
            <div class="worksheet-card card-2">
                <img src="https://www.lessoncraftstudio.com/samples/english/find%20objects/sample-22.jpeg" alt="Worksheet 2">
                <div class="answer-badge">
                    <span class="answer-badge-icon">✓</span>
                </div>
            </div>
            <div class="worksheet-card card-3">
                <img src="https://www.lessoncraftstudio.com/samples/english/find%20objects/sample-25.jpeg" alt="Worksheet 3">
            </div>
        </div>

        <!-- Quality indicators -->
        <div class="quality-indicators">
            <div class="indicator">
                <span class="indicator-icon">✓</span>
                <span class="indicator-text">Answer Keys Included</span>
            </div>
            <div class="indicator">
                <span class="indicator-icon">🖨️</span>
                <span class="indicator-text">Print Ready PDF</span>
            </div>
            <div class="indicator">
                <span class="indicator-icon">⭐</span>
                <span class="indicator-text">Teacher Tested</span>
            </div>
        </div>

        <!-- Bottom tagline -->
        <div class="tagline">
            <div class="tagline-text">Professional Quality - Trusted by Teachers</div>
        </div>
    </div>
</body>
</html>
