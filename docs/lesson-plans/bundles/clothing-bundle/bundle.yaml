thematicCoherence:
  en: |
    All 3 packages cohere around the clothing theme + form a
    pedagogical progression from receptive vocabulary through
    productive vocabulary to seasonal-context application.

    **Pedagogical sequencing:**
    1. **point-to-named-clothing-item** — Receptive clothing vocabulary.
       Foundational starting point: kid hears "point to the shirt" +
       identifies shirt among displayed clothing items.
    2. **identify-and-name-clothing** — Productive clothing vocabulary.
       Kids name clothing items + use clothing words in describing
       what they wear. Bridges receptive identification to productive
       use.
    3. **identify-four-seasons** — Cross-strand world-knowledge package
       connecting clothing choices to seasonal contexts. Kids associate
       sweaters + jackets with winter; shorts + sandals with summer.
       Practical-life application of clothing vocabulary.

    **Strand spread:** 2 vocabulary-acquisition + 1 world-knowledge
    seasons (cross-strand integration). Tight bundle with cross-
    strand bridge.

    **Suggested unit duration:** 3 weeks (1 package per week).

    **Multilingual classroom relevance:** clothing vocabulary high-
    frequency K-3 target across all 11 platform locales. Romance
    cognates strong (camisa/chemise/camicia); Germanic less cognate-
    rich but still high-frequency. Pt-BR sparse-overrides at point-to-
    named-clothing-item handle Brazilian climate-relevant clothing
    (mais bermudas + camisetas + chinelos do que casacos pesados em
    maioria do Brasil).

    **Pillar 2 architectural pattern:** clothing-bundle illustrates
    minimum-viable bundle composition — 3 packages, sufficient
    pedagogical depth via receptive→productive→cross-strand-context
    progression. Smaller than animals-bundle (6 packages) or colors-
    bundle (5 packages) but still pedagogically coherent.
