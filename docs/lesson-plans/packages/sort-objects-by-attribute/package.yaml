# Teaching package — sort objects by attribute (data-and-graphs)
# Arc 9 Phase 1 (Path B; early-numeracy / data-and-graphs strand FIRST
# package). Class B FLEXIBLE; vocab-anchored. Builds on cognitive sorting
# work (Arc 5+7+8 sort-by-color/shape/size/category/multiple-attributes)
# but in DATA-AND-GRAPHS strand: kids sort objects + use the resulting
# groups as data points for simple charts/graphs/tally counts.

targetSlug: sort-objects-by-attribute
language: en
title:
  en: "Sorting for Data — sort objects, count groups, build a graph"
description:
  en: "Kindergarten / Grade 1 early-numeracy package teaching sorting-as-data-collection. FIRST data-and-graphs strand package. Builds on cognitive sorting work (Arc 5+7+8 sort-by-color/shape/size/category/multiple-attributes) but with a DATA framing: kids sort objects, then COUNT each group, then BUILD a simple chart or tally to display the counts. Bridges sorting-as-cognition (cognitive strand) to sorting-as-data-collection (numeracy strand). Composes against picture-sort + chart-count apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class data-collection routine. Teacher displays 12 paper-
      cuts (mix of 4 red, 5 blue, 3 yellow). "Let's sort these by
      color." Class sorts: 4 red in one pile, 5 blue, 3 yellow.
      "Now let's COUNT each pile." Class counts. "Which pile has the
      MOST?" Blue. "The LEAST?" Yellow. Reinforces sort-then-count-
      then-compare framing — the canonical data-and-graphs sequence.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sort-count-graph routine. Each pair receives a mixed
      set of 12-15 paper-cuts. Pair sorts by chosen attribute, counts
      each group, fills in a tally-mark chart. Recast errors with
      explanation ("you said the red pile has 3 — let's count again:
      1, 2, 3, 4 — 4. The chart needs 4 tally marks for red"). Optional
      extension: kids construct a bar-style chart (column heights match
      counts) using grid paper.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (kids sort
      objects into 2 categories; data-collection precursor). Station
      2: chart-count worksheet (kids count + record counts in chart
      format; reinforces graph-construction). Station 3: manipulative
      cut-outs hands-on data-collection (kids sort + count + build
      tally charts). Station 4: matching worksheet (image-name pairs;
      reinforces vocabulary used in sort categories).
  closure:
    durationMinutes: 5
    body: |
      Whole-class data-display share. Pairs share their charts; class
      compares which categories had MOST and LEAST across different
      pairs' data. Forward-pointer: "Today we sorted, counted, and
      built charts. When we come back to data next, we'll READ
      charts that someone else built — and ANSWER QUESTIONS using
      data: how many more reds than blues?"

