# Teaching package — add within 20
# Arc 12 Phase 1 (early-numeracy / addition-subtraction 2/14 → 3/14).
# RESOLVES Arc 11 add-within-10 forward-pointer.

targetSlug: add-within-20
language: en
title:
  en: "Adding Within 20 — sums up to 20"
description:
  en: "Grade 1 early-numeracy package teaching addition with sums up to 20. Builds on Arc 11 add-within-10 + Arc 1 add-within-5 (count-on strategy + part-whole reasoning). RESOLVES Arc 11 forward-pointer ('add within 20 — bigger sums using same count-on strategy'). Bigger sums require sustained working memory + strategy refinement (use 10 as anchor: 8+5 = 8+2+3 = 10+3 = 13). Vocab-anchored — addition vocabulary continued. Composes against math-puzzle + math-worksheet apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class addition-fact routine using 10-as-anchor strategy.
      Teacher introduces: "We know 10+something is easy: 10+5=15;
      10+3=13. Let's use 10 as a friend to help us with bigger sums."
      Teacher shows: "8+5 — let's break 5 into 2+3. 8+2=10. 10+3=13.
      So 8+5=13." Class follows along. Repeat with 9+4 (= 9+1+3 =
      10+3 = 13); 7+6 (= 7+3+3 = 10+3 = 13). Reinforces make-10
      strategy as efficient bridge to sums-within-20.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + manipulative routine using 20-frame template. Each
      pair receives 20 cut-out objects + a 20-frame (2 rows of 10).
      Pair plays addition games: kid A puts 8 objects in the frame;
      kid B adds 5 more; together they count to find sum = 13. Use
      the make-10 visual aid: fill first row to 10, then count
      remainder in second row. Recast errors with make-10 prompt
      ('how many more do you need to fill to 10? Then how many left?').
      Optional extension: kids invent their own sums-within-20
      problems for partners.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: math-worksheet (sums-within-20
      problems). Station 2: math-puzzle addition mode. Station 3:
      manipulative cut-outs hands-on addition with 20-frame
      reinforcing make-10 strategy. Station 4: matching worksheet
      (number-to-quantity matching).
  closure:
    durationMinutes: 5
    body: |
      Whole-class addition-quiz. Teacher displays sums-within-20
      problems; class answers using make-10 strategy chorally.
      Forward-pointer: "Today we added within 20. When we come back
      to addition next, we'll learn SUBTRACTION — taking away —
      starting with subtract-within-5 + subtract-within-10."

