# Teaching package — identify and name 10 zoo animals
# Arc 4 Phase 1. Vocab keys verified: lion, tiger, elephant, giraffe, zebra,
# monkey, panda, kangaroo, penguin, koala (10/10 with full 11-locale
# IMAGE_VOCABULARY entries). Iconic zoo cohort across cultures; high mental-
# image recognizability for K-3 via books, media, and (in many locales)
# field-trip experience. Equally framed as "wild animals you'd see in a
# documentary" for cultures without a Western-zoo institution.

targetSlug: identify-and-name-10-zoo-animals
language: en

title:
  en: "Zoo animals — identify and name 10"
description:
  en: "K-Grade 1 vocabulary-acquisition package for 10 iconic zoo animals: lion, tiger, elephant, giraffe, zebra, monkey, panda, kangaroo, penguin, koala. 5 worksheet exercises + 8 printable materials. Theme-agnostic; operator selects target instruction language at material-render time."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up flashcards, names each animal
      in target language, class repeats chorally. Optional: animal-sound
      mimicry round (lion roars, monkey chatters, elephant trumpets) — high
      kid-engagement bridge. Pin cards to "Zoo animals" word wall cluster.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("I see a {item}"). Choral
      reading first, then individual reads. Pair work: kids hold a picture-card,
      partner names the animal. Recast errors in the target frame. Optional
      extension: "where does this animal live?" prompt connecting to habitats
      (savanna / forest / Arctic / Australia).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: image-letter matching (matching app, letter
      mode). Station 2: picture-card sorting on the carpet (big animals vs
      small animals — size-attribute sort; or stripes/spots/no-stripes pattern
      sort). Station 3: manipulative cut-outs counting ("count out 4 lions").
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Final challenge: teacher names an animal, kids
      point to flashcard. Forward-pointer: "Today we learned 10 zoo-animal
      words. When we come back to zoo animals next, this same set will be
      here for us."

