compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / memory-and-attention.
    Secondary strand: vocabulary acquisition (vocab-anchored — naming
    images as kids flip cards). Tertiary strand: turn-taking + social
    play (concentration is a paired game; bridges cognitive task with
    social-emotional development).

    Vocab-anchor framing continues from Arc 6 Phase 2: cognitive task
    (working-memory + position-memory) is the architectural shape;
    vocabulary-anchor is the pedagogical thread. Memory-game is one of
    the most natural vocab-anchored cognitive activities in K-3
    classrooms — kids must say what they see to remember it.

    Distinctive composition: 4 grid-match exercises (positions 1, 3, 4,
    5) across 4 theme contexts + 1 matching at position 2. Higher
    grid-match density reflects the memory-game-as-target nature; kids
    practice memory across diverse vocabulary contexts. Difficulty
    progression: 4×3 (12 cards = 6 pairs) → 4×4 (16 cards = 8 pairs)
    matches the cognitive-load step-up.

    Cross-package thematic complement: remember-image-pair-positions
    pairs with matching-app packages (which use static image-name
    matching). Memory-game adds the WORKING-MEMORY dimension — kids
    have to FIND the match, not just identify it.

    Class B FLEXIBLE substrate: composes against image-library breadth
    via grid-match app. Substrate-readiness measured by theme-coverage
    diversity (4 themes used here all CLEAN per Arc 1-5 work).

    K-3 multilingual classroom relevance: memory-game vocabulary practice
    is high-engagement (kids love the game format). Per CLAUDE.md §1
    multilingual-K-3 framing: vocabulary-anchored cognitive games are
    canonical platform sweet-spot — high-leverage time use.

