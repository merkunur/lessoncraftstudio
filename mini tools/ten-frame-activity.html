<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ten Frame — Activity — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=2">
  <!-- Prototype-only overrides per the activity-page redesign commission.
       Scoped to THIS wrapper only — choice-board / cvc-builder /
       syllable-builder wrappers do not include this <style> block and
       therefore keep the shell's existing 4%-scale celebrate + cream
       iframe-body background. When the redesign cascades, this block
       lifts into lcs-shell.css. -->
  <style>
    /* v2: transparent iframe body so the parent page's sage field
       (#DBE7DF) shows through everywhere the card itself doesn't cover.
       Overrides lcs-shell.css's `html, body { background: var(--lcs-bg); }`
       (cream #FBF3E4) which would otherwise hide the field behind the
       iframe's own document. */
    html, body { background: transparent !important; }

    /* v1: gentle bounce on the success prompt. Lands at scale(1.04) so
       the resting state matches every other activity's existing 4%-scale
       celebrate; the keyframe is purely additive entry motion. */
    @keyframes lcs-celebrate-bounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.08); }
      60%  { transform: scale(0.97); }
      100% { transform: scale(1.04); }
    }
    .lcs-activity-prompt.celebrate {
      animation: lcs-celebrate-bounce 360ms cubic-bezier(.2,.8,.2,1) 1;
    }
    @media (prefers-reduced-motion: reduce) {
      .lcs-activity-prompt.celebrate { animation: none; }
    }
  </style>
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then the shared ten-frame core, then this activity wrapper. -->
  <script src="/mini-tools/lcs-shell.js"></script>
  <script src="/mini-tools/ten-frame-core.js"></script>
  <script src="/mini-tools/ten-frame-activity.js"></script>
  <script>
    LCS.mount(TenFrameActivity, { mount: '#lcs-root' });
  </script>
</body>
</html>
