# Teaching package — solve a 4×4 picture sudoku
# Arc 5 Phase 3 (cognitive-and-executive-function / logical-reasoning strand).
# Different exercise composition shape from sorting (sort-by-color +
# sort-by-shape) — logic-puzzle palette weighting. Class B FLEXIBLE; composes
# against any 4-key picture set (any vocab cluster works as substrate).

targetSlug: solve-4x4-picture-sudoku
language: en
title:
  en: "Picture Sudoku 4×4 — solve a logic puzzle with pictures"
description:
  en: "Kindergarten-Grade 1 cognitive-and-executive-function package teaching 4×4 picture-sudoku puzzle-solving. Foundational logical-reasoning skill: kids hold the rule 'each row, column, and 2×2 box must contain each picture exactly once' in working memory and apply it through deduction. Composes against any 4-key picture set in IMAGE_VOCABULARY (animals, fruits, shapes, vehicles all work). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 35

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher draws a 4×4 grid on the board.
      Demonstrates the sudoku rule with concrete picture-cards: 4 animals
      (e.g., cow, sheep, pig, horse) — each must appear exactly once in
      every row, every column, and every 2×2 box. "Watch — if a row has
      cow, sheep, pig... what's missing? horse!" Class deduces the missing
      picture. Repeat 2-3 times with simpler partial grids before kids
      attempt their own.
  contentActivity:
    durationMinutes: 15
    body: |
      Whole-class guided sudoku: teacher projects a partial 4×4 puzzle on
      the board (or on a worksheet); class collaboratively decides what
      goes in each empty cell. Use thinking-aloud strategies: "What do I
      see in this row already? What's missing? Can it go here?" Kids
      take turns pointing at cells and naming the missing picture.
      Reinforce the "process of elimination" cognitive surface — kids
      narrate their reasoning aloud to make thinking visible. Pair work:
      kids work on simpler puzzles together; partners check each other's
      logic.
  scaffold:
    durationMinutes: 10
    body: |
      Station rotation. Station 1: sudoku worksheet (4×4 difficulty:easy
      with 8+ given clues; kid solves alone). Station 2: matching worksheet
      (image-name reinforces the picture vocabulary used in sudoku).
      Station 3: manipulative cut-outs sudoku-construction (kids physically
      build their own 4×4 puzzle with cut-out pictures, hand it to a
      partner to solve — peer-teaching reinforces the rule).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher shows a partial sudoku grid; kids
      collectively decide what's missing. Forward-pointer: "Today we
      solved 4×4 picture sudoku puzzles. When we come back to logic
      puzzles next, we'll try 6×6 puzzles — bigger grid, more pictures
      to keep track of."

