<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Mathe-R&auml;tsel - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(150deg, #1A237E 0%, #283593 50%, #1B2A6B 100%); overflow: hidden;">

        <!-- Radial glow behind worksheet -->
        <div style="position: absolute; top: 52%; left: 50%; width: 700px; height: 700px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(118,255,3,0.10) 0%, transparent 60%); border-radius: 50%;"></div>

        <!-- Subtle hexagon pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image:
            linear-gradient(60deg, #fff 1px, transparent 1px),
            linear-gradient(-60deg, #fff 1px, transparent 1px),
            linear-gradient(0deg, #fff 1px, transparent 1px);
            background-size: 52px 90px;"></div>

        <!-- Lime sparkle dots -->
        <div style="position: absolute; top: 170px; left: 75px; width: 10px; height: 10px; background: #76FF03; border-radius: 50%; box-shadow: 0 0 20px 8px rgba(118,255,3,0.6);"></div>
        <div style="position: absolute; top: 310px; left: 45px; width: 6px; height: 6px; background: #FFB300; border-radius: 50%; box-shadow: 0 0 14px 5px rgba(255,179,0,0.5);"></div>
        <div style="position: absolute; top: 210px; right: 65px; width: 8px; height: 8px; background: #76FF03; border-radius: 50%; box-shadow: 0 0 18px 6px rgba(118,255,3,0.5);"></div>
        <div style="position: absolute; top: 400px; right: 50px; width: 7px; height: 7px; background: #FFB300; border-radius: 50%; box-shadow: 0 0 16px 6px rgba(255,179,0,0.5);"></div>
        <div style="position: absolute; bottom: 310px; left: 55px; width: 5px; height: 5px; background: #76FF03; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(118,255,3,0.4);"></div>
        <div style="position: absolute; bottom: 270px; right: 75px; width: 9px; height: 9px; background: #FFB300; border-radius: 50%; box-shadow: 0 0 18px 7px rgba(255,179,0,0.6);"></div>

        <!-- GRATIS Badge - Hexagonal -->
        <div style="position: absolute; top: 22px; left: 25px; z-index: 100;">
            <div style="width: 105px; height: 95px; background: linear-gradient(145deg, #FFB300 0%, #FF8F00 100%); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); box-shadow: 0 8px 30px rgba(255,179,0,0.5); display: flex; align-items: center; justify-content: center; transform: rotate(-5deg);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #1A237E; text-shadow: 0 1px 2px rgba(255,255,255,0.3);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: rgba(255,255,255,0.95); padding: 11px 22px; border-radius: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); border: 3px solid #1A237E;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #1A237E; letter-spacing: 1px;">KLASSE K-2</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 95px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 82px; color: white; margin: 0; text-shadow: 4px 4px 0 rgba(0,0,0,0.3), 0 0 50px rgba(118,255,3,0.3);">MATHE-R&Auml;TSEL</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 38px; color: #76FF03; margin: 8px 0 0 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.4);">Knobeln &amp; Entdecken!</h2>
        </div>

        <!-- Main Worksheet Display with Floating Equation Tiles -->
        <div style="position: absolute; top: 255px; left: 50%; transform: translateX(-50%); width: 920px; height: 470px;">

            <!-- Central worksheet - prominent -->
            <div style="position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 20;">
                <div style="position: relative;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/math%20puzzle/sample-1.jpeg" style="width: 280px; height: 362px; object-fit: cover; border-radius: 14px; border: 7px solid white; box-shadow: 0 20px 60px rgba(0,0,0,0.45), 0 0 40px rgba(118,255,3,0.2);">
                    <!-- Glow effect -->
                    <div style="position: absolute; inset: -20px; background: radial-gradient(ellipse, rgba(118,255,3,0.12) 0%, transparent 70%); z-index: -1; border-radius: 30px;"></div>
                </div>
            </div>

            <!-- Floating equation tile 1 (top left) - orange with + -->
            <div style="position: absolute; left: 95px; top: 35px; transform: rotate(-15deg); z-index: 30;">
                <div style="width: 78px; height: 78px; background: linear-gradient(145deg, #FFB300 0%, #FF8F00 100%); border-radius: 14px; box-shadow: 0 12px 35px rgba(255,179,0,0.45); display: flex; align-items: center; justify-content: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 38px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">+</span>
                </div>
            </div>

            <!-- Floating equation tile 2 (top right) - lime with = -->
            <div style="position: absolute; right: 100px; top: 55px; transform: rotate(12deg); z-index: 30;">
                <div style="width: 72px; height: 72px; background: linear-gradient(145deg, #76FF03 0%, #64DD17 100%); border-radius: 14px; box-shadow: 0 12px 35px rgba(118,255,3,0.45); display: flex; align-items: center; justify-content: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; color: #1A237E; text-shadow: 1px 1px 2px rgba(255,255,255,0.4);">=</span>
                </div>
            </div>

            <!-- Floating equation tile 3 (bottom left) - indigo with ? -->
            <div style="position: absolute; left: 115px; bottom: 75px; transform: rotate(20deg); z-index: 30;">
                <div style="width: 70px; height: 70px; background: linear-gradient(145deg, #3949AB 0%, #283593 100%); border-radius: 14px; box-shadow: 0 12px 35px rgba(57,73,171,0.45); display: flex; align-items: center; justify-content: center; border: 3px solid rgba(255,255,255,0.25);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; color: #76FF03; text-shadow: 0 0 12px rgba(118,255,3,0.6);">?</span>
                </div>
            </div>

            <!-- Floating equation tile 4 (bottom right) - white with number -->
            <div style="position: absolute; right: 110px; bottom: 55px; transform: rotate(-12deg); z-index: 30;">
                <div style="width: 74px; height: 74px; background: linear-gradient(145deg, #ffffff 0%, #E8EAF6 100%); border-radius: 14px; box-shadow: 0 12px 35px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; border: 3px solid #283593;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; color: #1A237E;">7</span>
                </div>
            </div>

            <!-- Sparkle effects -->
            <div style="position: absolute; left: 270px; top: 110px; width: 12px; height: 12px; background: #76FF03; border-radius: 50%; box-shadow: 0 0 20px 8px rgba(118,255,3,0.7);"></div>
            <div style="position: absolute; right: 265px; bottom: 130px; width: 10px; height: 10px; background: #FFB300; border-radius: 50%; box-shadow: 0 0 18px 6px rgba(255,179,0,0.6);"></div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 115px; left: 0; right: 0; background: linear-gradient(90deg, rgba(118,255,3,0.95) 0%, rgba(100,221,23,0.95) 50%, rgba(76,175,80,0.95) 100%); padding: 18px 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.25), 0 5px 25px rgba(0,0,0,0.25);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: #1A237E; text-shadow: 1px 1px 2px rgba(255,255,255,0.3); letter-spacing: 3px;">TIERE ENTSCHL&Uuml;SSELN!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 5px 18px rgba(0,0,0,0.22); border: 3px solid #76FF03;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #1A237E;">Bildergleichungen</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 5px 18px rgba(0,0,0,0.22); border: 3px solid #FFB300;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #FF8F00;">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 5px 18px rgba(0,0,0,0.22); border: 3px solid #283593;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #1A237E;">Druckfertig</span>
            </div>
        </div>

    </div>
</body>
</html>
