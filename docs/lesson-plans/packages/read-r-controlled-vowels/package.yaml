assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the r-controlled vowel pattern (ar / or / er-ir-ur)
        in a written word and produce the corresponding bossy-R
        sound in 8 of 10 trials.
      - Read 8 unfamiliar r-controlled-vowel words (e.g., 'shark',
        'first', 'storm', 'burn') correctly in 7 of 10 trials.
      - Apply the bossy-R rule to predict the vowel sound from the
        ar/or/er/ir/ur pattern in 6 of 10 trials.

    Differentiation:
    - Pre-K: read-only r-controlled-vowel review with picture support;
      ar + or sound matching only.
    - Kindergarten: 3 r-controlled patterns (ar / or / er) +
      independent reading.
    - Grade 1+: extend full r-controlled set (ar / or / er-ir-ur) +
      bridge to read-common-prefixes-suffixes (un-, re-, -ed, -ing,
      -er) for morphological-decoding work.

