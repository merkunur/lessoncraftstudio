# Teaching package — subtract within 100
# Arc 16 Phase 1.1 (math / addition-subtraction 4/14 → 5/14). Extends Arc 15 Phase 1 subtract-within-20 + Arc 16 Phase 1.1 add-within-100 into the inverse-operation companion.

targetSlug: subtract-within-100
language: en
title:
  en: "Subtracting Within 100 — two-digit subtraction with borrowing"

description:
  en: "Grade 2 math package teaching subtraction within 100 (problems like 73-28=45, 50-17=33, 100-46=54). Builds on Arc 15 Phase 1 subtract-within-20 + paired companion to Arc 16 Phase 1.1 add-within-100 (regrouping/carrying introduced there; borrowing introduced here as the inverse). Completes the basic addition-subtraction sequence (5 → 10 → 20 → 100). Critical bridge from single-digit + within-20 subtraction (Arc 14-15 foundation) into two-digit subtraction where the within-10 'crossing-zero' idea generalizes to 'borrowing from the tens place when ones digit of subtrahend exceeds ones digit of minuend' (the canonical Grade 2 algorithm). Strategy diversity emphasized: standard-algorithm column-subtract-with-borrowing; decomposition (73-28 = 73-30+2 = 43+2 = 45); count-back; use-known-facts. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + place-value-aware subtraction introduction.
      Teacher displays 73-28 written vertically with tens-and-ones
      columns clearly marked. "Today we subtract BIGGER numbers —
      up to 100. Let's solve 73-28. Look at the ONES column first:
      we need 3 minus 8. But 3 is SMALLER than 8 — we can't take
      8 away from 3! We need to BORROW from the tens. We take 1
      ten from the 7 tens (leaves 6 tens) + bring it to the ones
      (3 + 10 = 13). Now we can subtract: 13-8 = 5 ones; 6-2 = 4
      tens = 40. Answer: 45." Teacher repeats with 50-17 (5 tens
      0 ones; need to borrow because 0-7 impossible: borrow 1 ten
      → 4 tens 10 ones; 10-7=3 ones, 4-1=3 tens = 33) and 100-46
      (100 = 10 tens 0 ones; borrow cascades through tens; result
      54). Pattern emphasis: "When ones digit of bottom number is
      BIGGER, BORROW from the tens. Then subtract normally."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + base-ten manipulative routine. Each pair receives
      base-ten kits (ten-sticks + single-counters) + a worksheet
      with 6 subtraction problems within 100 (73-28, 50-17, 100-46,
      82-35, 64-19, 91-47). Pair takes turns: kid A builds the
      minuend (top number) with manipulatives; kid B physically
      removes the subtrahend (bottom number) — breaking a ten-
      stick into 10 single-counters when needed for borrowing.
      Together they count what remains + write the answer. Recast
      errors with borrow-demo ("you need 8 ones to take away, but
      only 3 are sitting in the ones column. Break a ten-stick:
      one ten becomes ten ones. Now you have 13 ones to subtract
      from."). Strategy choices: kids may use manipulatives,
      vertical column-subtract with borrowing, decomposition,
      count-back, OR use-known-facts; teacher accepts any
      strategy that produces correct answer + can be explained.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: subtraction worksheet (vertical
      format within 100 — practice with borrowing). Station 2:
      math-worksheet (mixed subtraction problems within 100).
      Station 3: math-puzzle (find missing operand: 73-?=45;
      ?-28=45). Station 4: more-less (compare two subtraction
      results: which difference is greater, 73-28 or 82-35?).
  closure:
    durationMinutes: 5
    body: |
      Whole-class within-100 subtraction quiz. Teacher presents 5
      fast problems; class collectively answers + identifies
      borrowing moments. "73-28? 50-17? 92-45? 100-37? 85-49?"
      Forward-pointer: "Today we subtracted within 100 + learned
      BORROWING. Together with add-within-100 + add-and-subtract-
      mixed-within-100 work, we now have full two-digit operation
      fluency. When we come back next, we can start three-digit
      operations (addition + subtraction within 1000) + mixed-
      operation word problems!"

