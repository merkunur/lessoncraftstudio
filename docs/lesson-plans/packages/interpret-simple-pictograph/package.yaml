assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Count picture-icons in 4 categories accurately in 8 of 10
        trials.
      - Identify category with MOST in 8 of 10 trials.
      - Identify category with LEAST in 7 of 10 trials.
      - Compute difference between two categories ("4 dogs and 3
        cats — 1 more dog") in 6 of 10 trials.

    Differentiation:
    - Pre-K: 2-3 categories with max 5 icons each.
    - K: 3-4 categories with max 8 icons each.
    - Grade 1+: extend to scaled pictographs (one picture = 2 items
      OR 5 items) + bridge to tally-charts + bar-graphs.

