compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / time-and-
    routine (analog clock reading — saturates strand 4/4). Secondary
    strand: math / measurement (time as measurable dimension —
    parallel to length/weight/capacity/duration). Tertiary strand:
    vocabulary-acquisition (clock-reading vocabulary).

    Architectural significance: SATURATES time-and-routine strand
    at 4/4 — 14th saturated strand on the platform. Builds on Arc
    14 Phase 4 compare-by-time-duration + earlier time-and-routine
    foundation (days-of-week, months-of-year). Critical bridge
    from time-duration comparison (qualitative) to formal time-
    reading (quantitative). Foundation for elapsed-time + schedule-
    reading + daily-routine sequencing.

    Distinctive composition: 2 matching + 2 pattern-train/missing-
    pieces + 1 math-puzzle (assessment). Heavy clock-face
    interpretation emphasis throughout exercise composition.

    Class B FLEXIBLE substrate: composes against miscellaneous
    image-library theme (clocks + clock-related imagery + abstract
    time-related visuals); clock-mat material is the canonical
    clock-practice substrate.

    K-3 multilingual classroom relevance: clock-reading vocabulary
    varied across 11 platform locales — hour cognate Romance
    (hora/heure/ora) + Germanic (Stunde / uur / timme); minute
    universally cognate. "O'clock" structure en-specific (Romance
    uses "la una", "las dos"; Germanic uses different formula).
    Half-past idiom locale-specific (en "half past 5"; de "halb
    sechs" = literally "half six" but means 5:30). Locale-variant
    work at Phase 3+ requires substantial idiomatic adaptation per
    locale's time-expression conventions.

