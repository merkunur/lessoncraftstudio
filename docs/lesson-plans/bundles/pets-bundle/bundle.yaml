description:
  en: "Comprehensive K-3 bundle centered on pet-animal vocabulary + receptive identification + cross-strand classification + action-verb work. 5 packages span vocabulary-acquisition (identify-and-name-10-pet-animals — productive pet vocabulary across cat, dog, fish, hamster, rabbit, etc.) + cognitive classification (classify-animals-by-diet — pets across carnivore/omnivore range; identify-living-vs-nonliving — pets as canonical living-things) + action-verbs (identify-and-name-action-verbs — pets do recognizable actions: sleep, eat, play, run) + multi-attribute description (point-to-named-color — pets vary in color richly). Sub-theme bundle (animals → pets) demonstrating pet-context relevance for K-3 students with home-pet exposure. Suitable for a 5-week classroom unit; supports K-3 multilingual classrooms in residential contexts where pet vocabulary is daily-life accessible."

