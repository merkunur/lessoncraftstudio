compositionalRationale:
  en: |
    Primary strand: language-and-communication / reading-
    comprehension (infer character feelings from picture
    cues — advances strand 6/10 → 7/10). Secondary
    strand: vocabulary-acquisition (emotion vocabulary
    is the substrate; depends on Arc 4 identify-and-name-
    emotions packaging). Tertiary strand: cognitive-and-
    executive-function / social-emotional-learning (the
    inferential work of reading another person's
    emotional state is foundational to perspective-
    taking — a CEF + SEL skill).

    Architectural significance: continues reading-
    comprehension strand expansion. Per learning-targets.
    json the strand has 10 canonical targets; current
    state at Arc 18 P1.3 commencement is 5 authored
    + 1 (slot 1 of Phase 1.3); this package is the
    seventh, bringing the strand to 7/10. Per learning-
    targets.json prerequisite chain: identify-main-
    character (Arc 17 P1.5) establishes WHO-identification
    foundation; identify-and-name-emotions (Arc 4 in
    vocabulary-acquisition strand) establishes emotion-
    word vocabulary foundation. THIS PACKAGE synthesizes
    both prerequisites: kids must KNOW the character
    (WHO) AND KNOW emotion words (HAPPY/SAD/etc.) to
    INFER the character's feeling from picture cues.

    Pair-coherent ship pattern with answer-who-what-
    where-questions (Slot 1 of Phase 1.3). The two
    packages teach incremental cognitive layers:
    - answer-who-what-where-questions (Slot 1, K): K-level
      EXPLICIT element extraction. Kids identify WHO,
      WHAT, WHERE — elements that are DIRECTLY shown in
      the picture or NAMED in the text.
    - infer-character-feeling-from-picture-cue (THIS
      PACKAGE, Grade 1): Grade-1 INFERENTIAL element
      extraction. Kids identify HOW THE CHARACTER FEELS
      — an element that is IMPLIED by picture cues +
      story context, NOT directly stated in words.
    The K → Grade 1 cognitive jump is from EXPLICIT to
    INFERENTIAL reading. The pair-coherent ship surfaces
    this progression as a natural learning trajectory:
    a kid who answers WHO + WHAT + WHERE questions
    fluently is ready to take the inferential step to
    HOW-DOES-THE-CHARACTER-FEEL.

    Together with Arc 17 P1.5 identify-main-character
    (the WHO precedent) + Arc 18 P1.2 identify-setting
    (the WHERE precedent) + Slot 1 answer-who-what-
    where-questions (the WHO/WHAT/WHERE generalization)
    + this package (the WHO+feeling extension), forms
    the K → Grade 1 character-knowledge cluster of 4
    pair-coherent packages.

    Reading-comprehension strand future (Phase 1.4+
    candidates per learning-targets.json residual):
    identify-problem-and-solution (forward-pointer from
    identify-setting closing rationale), distinguish-
    fiction-from-nonfiction, read-and-follow-2-sentence-
    instruction. Phase 1.4+ closes the strand at 9-10/10.

    Per §A.13.30 K-1-informal framing: Grade 1
    character-feeling-inference is PICTURE-CUE READING
    + EMOTION-VOCABULARY MATCHING, NOT formal
    psychological analysis. The K-1-Grade-1 identifier
    signals are deliberately concrete:
    - FACIAL EXPRESSION (eyebrows, mouth, eyes) gives
      the most direct emotion cue
    - BODY LANGUAGE (posture, gesture) reinforces the
      facial cue
    - SITUATION CONTEXT (what's happening; what objects
      are in the picture) provides the WHY for the
      emotion
    These signals make the inference accessible at
    Grade 1 without requiring formal literary-analysis
    vocabulary or independent decoding fluency. Grade
    2+ work extends to character-motivation analysis
    (WHY the character feels this; what their goals
    are), character-arc work (how feelings CHANGE
    across the story), and emotional-complexity
    recognition (mixed feelings; conflicted emotions) —
    all beyond Grade 1 scope here.

    Cross-reference to identify-main-character
    (Arc 17 P1.5; WHO-extraction prerequisite): that
    package established that K-1 kids can identify the
    protagonist of a story. This package extends that
    work by asking what the protagonist is FEELING —
    the inferential next step. The character-extraction
    + character-feeling combination grounds the broader
    character-knowledge work kids do throughout
    elementary reading.

    Cross-reference to identify-and-name-emotions (Arc 4
    vocabulary-acquisition; emotion-word substrate):
    that package established the emotion-vocabulary
    (happy, sad, angry, scared, etc.) kids use to label
    their own feelings. This package extends that work
    by applying the emotion-vocabulary to STORY
    CHARACTERS — reading another person's feelings
    rather than naming one's own. The vocabulary-to-
    application bridge is the cognitive lift.

    Distinctive composition: 3 matching exercises
    (canonical reading-comp pattern — match character-
    image to emotion-word across multiple practice
    slots) + 1 picture-sort (sort character images by
    emotion category) + 1 missing-pieces (complete a
    partial character image — the missing piece is
    often the mouth or eyebrows, which determines the
    emotion). Composition shape mirrors identify-
    setting + identify-main-character + Slot 1 answer-
    who-what-where-questions precedents exactly (3
    matching + 1 picture-sort + 1 missing-pieces) —
    the canonical K-Grade-1 reading-comp app pattern.

    Materials note: 8-material Literacy class stack per
    §A.13.37. Sentence-strips at position 4 with
    framePreset 'this-is-a' (character-emotion frames:
    "This character is [emotion]. The character feels
    [emotion] because [reason from picture].") is the
    load-bearing material — the literal feeling-
    vocabulary substrate kids work with. Vocabulary-
    tracing-strips at position 5 traces emotion-
    vocabulary words ('happy', 'sad', 'angry',
    'scared', 'surprised', 'excited', 'proud',
    'frustrated'). The combination surfaces both the
    receptive inferential work (read character feelings
    from picture cues) AND the productive-language
    work (use emotion-vocabulary in retellings of
    character feelings).

    Class B FLEXIBLE substrate: composes against
    animals theme (animal-character emotions are K-1-
    accessible per identify-main-character precedent;
    early picture books overwhelmingly feature
    emotional animal-protagonists — Pete the Cat happy,
    The Pigeon angry, Splat the Cat scared, etc. The
    genre is animal-rich + culturally universal across
    the 11 locale variants).

    K-3 multilingual classroom relevance: character-
    feeling-inference is universal K-3 comprehension
    content. The emotional concept-set (happy, sad,
    angry, scared, surprised, excited, proud,
    frustrated) is locale-portable; only the
    vocabulary varies. Cross-locale emotion vocabulary:
    en 'happy/sad/angry/scared/surprised/excited/proud/
    frustrated'; de 'glücklich/traurig/wütend/ängstlich/
    überrascht/aufgeregt/stolz/frustriert'; es 'feliz/
    triste/enojado/asustado/sorprendido/emocionado/
    orgulloso/frustrado'; pt 'feliz/triste/bravo/com
    medo/surpreso/animado/orgulhoso/frustrado'; fr
    'heureux/triste/en colère/effrayé/surpris/excité/
    fier/frustré'; it 'felice/triste/arrabbiato/
    spaventato/sorpreso/eccitato/orgoglioso/frustrato'.
    The Romance + Germanic emotion vocabulary is
    cognate-rich (frustrated / frustriert / frustrado /
    frustré / frustrato show clear cognate pattern;
    surprised has more variation). Locale-variant work
    at Phase 3+ adapts to each locale's emotion-
    vocabulary register + culturally-familiar emotional-
    situation contexts (some emotion expressions are
    culture-bound; what makes a character 'proud' in
    one culture may differ from another).

