# Teaching package — spell words with consonant digraphs
# Arc 19 Phase 1.5 (early-literacy / spelling-and-encoding strand-advancement
# 3/5 → 4/5; trajectory toward SAT). Builds on Arc 12 spell-cvc-words + Phase
# 1.4 spell-words-with-blends foundation. Phonetic-reciprocity pair with Arc
# 14 read-blends-and-digraphs HYBRID (digraph half). Final-arc-cycle Phase
# 1.5 slot per Arc 19 close-out responsibility.

targetSlug: spell-words-with-digraphs
language: en
title:
  en: "Spelling Digraphs — write ship, chair, three, when, phone"
description:
  en: "Grade 1 / Grade 2 early-literacy spelling package teaching kids to encode (write) words with common consonant digraphs. Builds on Arc 12 spell-cvc-words + Phase 1.4 spell-words-with-blends. Phonetic-reciprocity pair with Arc 14 read-blends-and-digraphs (digraph half — decoding direction). Consonant digraphs are 2-letter combinations where the two letters together produce ONE new sound, different from either letter alone: sh- (ship — /sh/), ch- (chair — /ch/), th- (three — /θ/ or /ð/), wh- (when — /w/ or /hw/), ph- (phone — /f/). Critical distinction from blends: blends keep both sounds (bl- = /b/+/l/); digraphs replace both sounds with one new sound (sh- = /sh/ NOT /s/+/h/). Kids hear a digraph word + write the correct 2-letter cluster at the start. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook: blends vs digraphs distinction (revisited).
      Teacher writes 'BL' and 'SH' on the board. "Last week we
      learned to spell BLEND words — BL says /b/-/l/, both letters
      sound. Today we spell DIGRAPH words — SH says /sh/, just ONE
      sound for TWO letters. Listen: ship. /sh-i-p/. Only three
      sounds — but FOUR letters. S + H work together. /sh/." Class
      chants. Repeat with: 'chair' (CH — /ch/); 'three' (TH — /θ/);
      'when' (WH — /w/); 'phone' (PH — /f/). Each digraph anchored
      to a memorable image-word. The 'two-letters-one-sound' rule is
      the central teaching point.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + dictation routine. Each pair receives a worksheet
      with 10 picture cards (ship, fish, chair, cheese, three,
      thumb, when, white, phone, photo). Pair takes turns: kid A
      says the word; kid B writes it on a whiteboard from memory,
      starting with the digraph. Pair checks each spelling against
      the picture-card reference. Recast errors with letter-by-
      letter sound-out ("you wrote 'sip' for 'ship' — let's listen
      to the start: /sh/ ship. ONE sound — but spelled with TWO
      letters: S + H. Try again: S-H-I-P."). Optional extension:
      kids hunt the room for objects starting with each digraph +
      write the words on a class list.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: word-scramble worksheet
      (rearrange letters to form digraph-words: P-S-H-I = ship;
      H-A-I-C-R = chair; R-E-E-H-T = three). Station 2: word-guess
      (fill in digraph from picture clue — __ip = ship; __air =
      chair; __ree = three; __one = phone). Station 3: vocabulary-
      tracing-strips for digraph-anchor words. Station 4: matching
      worksheet (digraph cluster to anchor-word pair — sh ↔ ship;
      ch ↔ chair; th ↔ three; wh ↔ when; ph ↔ phone).
  closure:
    durationMinutes: 5
    body: |
      Whole-class spelling mini-quiz. Teacher reads 5 digraph-words
      aloud (ship / chair / three / when / phone); kids write each
      on individual whiteboards. Quick visual scan checks accuracy.
      Forward-pointer: "Today we spelled digraph words — two letters
      that make one sound. When we come back to writing next, we'll
      learn to write LONGER words that combine BOTH skills — words
      like 'splash' (S-P-L = blend + S-H wait that's not right;
      'splash' is S-P-L-A-S-H so two clusters: SP-L at start +
      S-H at end) or 'shrink' (S-H-R = digraph + R: SHR-cluster).
      Two-skills-together is the next step in our spelling work."

