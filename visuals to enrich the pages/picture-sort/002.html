<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Bilder Sortieren - Variety Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: radial-gradient(circle at 50% 45%, #880E4F 0%, #6A0038 40%, #4A0028 100%); overflow: hidden;">

        <!-- Soft glowing circles -->
        <div style="position: absolute; top: 180px; left: 120px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(244,143,177,0.1) 0%, transparent 70%); border-radius: 50%;"></div>
        <div style="position: absolute; top: 300px; right: 80px; width: 250px; height: 250px; background: radial-gradient(circle, rgba(255,110,64,0.08) 0%, transparent 70%); border-radius: 50%;"></div>
        <div style="position: absolute; top: 500px; left: 350px; width: 350px; height: 350px; background: radial-gradient(circle, rgba(194,24,91,0.1) 0%, transparent 70%); border-radius: 50%;"></div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 22px; left: 25px; z-index: 100;">
            <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #C2185B 0%, #F48FB1 100%); border-radius: 50%; box-shadow: 0 8px 28px rgba(173,20,87,0.5), inset 0 -4px 10px rgba(0,0,0,0.15), inset 0 4px 8px rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.6);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 21px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">GRATIS</span>
            </div>
        </div>

        <!-- Top title -->
        <div style="position: absolute; top: 30px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 64px; color: white; margin: 0; text-shadow: 3px 3px 0 rgba(0,0,0,0.2);">Themenvielfalt</h1>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 28px; color: #F48FB1; margin: 4px 0 0 0; text-shadow: 1px 1px 0 rgba(0,0,0,0.2);">Endlose Sortierm&ouml;glichkeiten</p>
        </div>

        <!-- Fan of 5 worksheets -->
        <!-- Worksheet 1 (leftmost) -->
        <div style="position: absolute; top: 280px; left: 68px; z-index: 20;">
            <div style="width: 140px; height: 181px; background: white; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); padding: 4px; box-sizing: border-box;">
                <img src="https://www.lessoncraftstudio.com/samples/german/picture-sort/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover; border-radius: 5px;" alt="Sortierblatt Tiere">
            </div>
            <!-- Theme label -->
            <div style="text-align: center; margin-top: 8px;">
                <span style="background: #C2185B; padding: 5px 14px; border-radius: 12px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white;">Tiere</span>
            </div>
        </div>

        <!-- Worksheet 2 -->
        <div style="position: absolute; top: 255px; left: 230px; z-index: 25;">
            <div style="width: 150px; height: 194px; background: white; border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,0.3); padding: 4px; box-sizing: border-box;">
                <img src="https://www.lessoncraftstudio.com/samples/german/picture-sort/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover; border-radius: 5px;" alt="Sortierblatt Essen">
            </div>
            <!-- Theme label -->
            <div style="text-align: center; margin-top: 8px;">
                <span style="background: #FF6E40; padding: 5px 14px; border-radius: 12px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white;">Essen</span>
            </div>
        </div>

        <!-- Worksheet 3 (center, largest, elevated) -->
        <div style="position: absolute; top: 210px; left: 410px; z-index: 30;">
            <div style="width: 180px; height: 233px; background: white; border-radius: 10px; box-shadow: 0 16px 45px rgba(0,0,0,0.4), 0 0 0 3px rgba(244,143,177,0.4); padding: 5px; box-sizing: border-box;">
                <img src="https://www.lessoncraftstudio.com/samples/german/picture-sort/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px;" alt="Sortierblatt Natur">
            </div>
            <!-- Theme label -->
            <div style="text-align: center; margin-top: 10px;">
                <span style="background: linear-gradient(90deg, #C2185B, #FF6E40); padding: 6px 18px; border-radius: 14px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Natur</span>
            </div>
        </div>

        <!-- Worksheet 4 -->
        <div style="position: absolute; top: 255px; left: 618px; z-index: 25;">
            <div style="width: 150px; height: 194px; background: white; border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,0.3); padding: 4px; box-sizing: border-box;">
                <img src="https://www.lessoncraftstudio.com/samples/german/picture-sort/sample-4.jpeg" style="width: 100%; height: 100%; object-fit: cover; border-radius: 5px;" alt="Sortierblatt Fahrzeuge">
            </div>
            <!-- Theme label -->
            <div style="text-align: center; margin-top: 8px;">
                <span style="background: #FF6E40; padding: 5px 14px; border-radius: 12px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white;">Fahrzeuge</span>
            </div>
        </div>

        <!-- Worksheet 5 (rightmost) -->
        <div style="position: absolute; top: 280px; left: 790px; z-index: 20;">
            <div style="width: 140px; height: 181px; background: white; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); padding: 4px; box-sizing: border-box;">
                <img src="https://www.lessoncraftstudio.com/samples/german/picture-sort/sample-5.jpeg" style="width: 100%; height: 100%; object-fit: cover; border-radius: 5px;" alt="Sortierblatt Farben">
            </div>
            <!-- Theme label -->
            <div style="text-align: center; margin-top: 8px;">
                <span style="background: #C2185B; padding: 5px 14px; border-radius: 12px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: white;">Farben</span>
            </div>
        </div>

        <!-- Bottom banner -->
        <div style="position: absolute; bottom: 95px; left: 0; right: 0; background: linear-gradient(90deg, rgba(255,110,64,0.95) 0%, rgba(255,138,101,0.95) 50%, rgba(255,110,64,0.95) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.2), 0 4px 20px rgba(0,0,0,0.2); z-index: 60;">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2); letter-spacing: 1px;">F&uuml;r jeden Unterricht das passende Thema</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; z-index: 60;">
            <div style="background: rgba(255,255,255,0.12); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); border: 2px solid rgba(244,143,177,0.5); backdrop-filter: blur(4px);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #F48FB1;">3000+ Bilder</span>
            </div>
            <div style="background: rgba(255,255,255,0.12); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); border: 2px solid rgba(255,138,101,0.5); backdrop-filter: blur(4px);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #FF8A65;">Eigene Bilder m&ouml;glich</span>
            </div>
            <div style="background: rgba(255,255,255,0.12); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.3); backdrop-filter: blur(4px);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Sofort einsatzbereit</span>
            </div>
        </div>

    </div>
</body>
</html>
