<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Treasure Hunt - Professional Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(160deg, #0B3D5B 0%, #072A40 50%, #051E2E 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Subtle SVG grid pattern -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.04;" viewBox="0 0 1000 1000">
            <pattern id="profGrid" width="50" height="50" patternUnits="userSpaceOnUse">
                <path d="M 50 0 L 0 0 0 50" fill="none" stroke="white" stroke-width="1"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#profGrid)"/>
        </svg>

        <!-- Gold corner brackets -->
        <!-- Top-left -->
        <div style="position: absolute; top: 20px; left: 20px; z-index: 20;">
            <svg width="60" height="60" viewBox="0 0 60 60">
                <path d="M 0 50 L 0 0 L 50 0" fill="none" stroke="#D4A017" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
        <!-- Top-right -->
        <div style="position: absolute; top: 20px; right: 20px; z-index: 20;">
            <svg width="60" height="60" viewBox="0 0 60 60">
                <path d="M 10 0 L 60 0 L 60 50" fill="none" stroke="#D4A017" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
        <!-- Bottom-left -->
        <div style="position: absolute; bottom: 20px; left: 20px; z-index: 20;">
            <svg width="60" height="60" viewBox="0 0 60 60">
                <path d="M 0 10 L 0 60 L 50 60" fill="none" stroke="#D4A017" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
        <!-- Bottom-right -->
        <div style="position: absolute; bottom: 20px; right: 20px; z-index: 20;">
            <svg width="60" height="60" viewBox="0 0 60 60">
                <path d="M 10 60 L 60 60 L 60 10" fill="none" stroke="#D4A017" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Quality seal - top right -->
        <div style="
            position: absolute;
            top: 40px;
            right: 50px;
            z-index: 20;
        ">
            <div style="
                width: 110px;
                height: 110px;
                background: linear-gradient(135deg, #FFB300 0%, #D4A017 100%);
                border-radius: 50%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                box-shadow: 0 8px 30px rgba(212,160,23,0.5), inset 0 2px 0 rgba(255,255,255,0.3);
                border: 3px solid rgba(255,255,255,0.3);
            ">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #0B3D5B; line-height: 1;">FREE</span>
                <div style="width: 50px; height: 2px; background: #0B3D5B; margin: 3px 0; opacity: 0.4;"></div>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; color: #0B3D5B; line-height: 1; letter-spacing: 1px;">PREMIUM</span>
            </div>
        </div>

        <!-- Title -->
        <div style="
            position: absolute;
            top: 50px;
            left: 60px;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 52px;
                color: white;
                margin: 0;
                text-shadow: 0 3px 15px rgba(0,0,0,0.3);
            ">Treasure Hunt</h1>
            <p style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 28px;
                color: #D4A017;
                margin: 2px 0 0 0;
                text-shadow: 0 2px 8px rgba(0,0,0,0.2);
            ">Following Directions Worksheets</p>
        </div>

        <!-- Main worksheet display - center -->
        <div style="
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        ">
            <!-- Gold glow behind -->
            <div style="
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 380px;
                height: 450px;
                background: radial-gradient(ellipse, rgba(212,160,23,0.2) 0%, transparent 70%);
                pointer-events: none;
            "></div>

            <!-- Main worksheet (center, white border) -->
            <div style="
                background: white;
                padding: 10px;
                border-radius: 12px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 40px rgba(212,160,23,0.15);
                position: relative;
                z-index: 15;
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/treasure%20hunt/sample-3.jpeg"
                    alt="Treasure Hunt Worksheet"
                    style="
                        width: 300px;
                        height: 388px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 6px;
                        display: block;
                    "
                />
            </div>
        </div>

        <!-- Flanking left: cardinal mode worksheet -->
        <div style="
            position: absolute;
            top: 260px;
            left: 55px;
            z-index: 12;
        ">
            <div style="
                background: white;
                padding: 6px;
                border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/treasure%20hunt/sample-4.jpeg"
                    alt="Cardinal Mode Worksheet"
                    style="
                        width: 150px;
                        height: 194px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 5px;
                        display: block;
                    "
                />
            </div>
            <!-- Label -->
            <div style="text-align: center; margin-top: 8px;">
                <div style="display: inline-block; background: #C62828; padding: 4px 14px; border-radius: 12px;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; color: white; letter-spacing: 0.5px;">CARDINAL MODE</span>
                </div>
            </div>
        </div>

        <!-- Flanking right: answer key -->
        <div style="
            position: absolute;
            top: 240px;
            right: 55px;
            z-index: 12;
        ">
            <div style="
                background: white;
                padding: 6px;
                border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/treasure%20hunt/sample-3-answer.jpeg"
                    alt="Answer Key"
                    style="
                        width: 150px;
                        height: 194px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 5px;
                        display: block;
                    "
                />
            </div>
            <!-- Label -->
            <div style="text-align: center; margin-top: 8px;">
                <div style="display: inline-block; background: #00897B; padding: 4px 14px; border-radius: 12px;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; color: white; letter-spacing: 0.5px;">ANSWER KEY</span>
                </div>
            </div>
        </div>

        <!-- Glass-morphism feature cards row -->
        <div style="
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 20;
        ">
            <!-- Card 1: Two Modes -->
            <div style="
                background: rgba(255,255,255,0.08);
                border: 1.5px solid rgba(255,255,255,0.2);
                border-radius: 14px;
                padding: 16px 20px;
                text-align: center;
                width: 140px;
                backdrop-filter: blur(8px);
            ">
                <svg width="32" height="32" viewBox="0 0 100 100" style="display: block; margin: 0 auto 8px;">
                    <circle cx="50" cy="50" r="35" stroke="white" stroke-width="4" fill="none" opacity="0.8"/>
                    <polygon points="50,18 47,38 53,38" fill="#D4A017"/>
                    <polygon points="50,82 47,62 53,62" fill="white" opacity="0.5"/>
                </svg>
                <span style="font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; color: white;">Two Modes</span>
            </div>

            <!-- Card 2: 5x5 Grid -->
            <div style="
                background: rgba(255,255,255,0.08);
                border: 1.5px solid rgba(255,255,255,0.2);
                border-radius: 14px;
                padding: 16px 20px;
                text-align: center;
                width: 140px;
                backdrop-filter: blur(8px);
            ">
                <svg width="32" height="32" viewBox="0 0 50 50" style="display: block; margin: 0 auto 8px;">
                    <rect x="2" y="2" width="9" height="9" rx="1" fill="white" opacity="0.8"/>
                    <rect x="13" y="2" width="9" height="9" rx="1" fill="white" opacity="0.6"/>
                    <rect x="24" y="2" width="9" height="9" rx="1" fill="white" opacity="0.8"/>
                    <rect x="2" y="13" width="9" height="9" rx="1" fill="white" opacity="0.6"/>
                    <rect x="13" y="13" width="9" height="9" rx="1" fill="#D4A017"/>
                    <rect x="24" y="13" width="9" height="9" rx="1" fill="white" opacity="0.6"/>
                    <rect x="2" y="24" width="9" height="9" rx="1" fill="white" opacity="0.8"/>
                    <rect x="13" y="24" width="9" height="9" rx="1" fill="white" opacity="0.6"/>
                    <rect x="24" y="24" width="9" height="9" rx="1" fill="white" opacity="0.8"/>
                </svg>
                <span style="font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; color: white;">5x5 Grid</span>
            </div>

            <!-- Card 3: Answer Keys -->
            <div style="
                background: rgba(255,255,255,0.08);
                border: 1.5px solid rgba(255,255,255,0.2);
                border-radius: 14px;
                padding: 16px 20px;
                text-align: center;
                width: 140px;
                backdrop-filter: blur(8px);
            ">
                <svg width="32" height="32" viewBox="0 0 100 100" style="display: block; margin: 0 auto 8px;">
                    <circle cx="35" cy="35" r="20" stroke="white" stroke-width="5" fill="none" opacity="0.8"/>
                    <rect x="50" y="50" width="8" height="35" rx="3" fill="white" opacity="0.8" transform="rotate(45 54 67)"/>
                    <rect x="65" y="65" width="12" height="5" rx="2" fill="#D4A017" transform="rotate(45 71 67)"/>
                </svg>
                <span style="font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; color: white;">Answer Keys</span>
            </div>

            <!-- Card 4: 11 Languages -->
            <div style="
                background: rgba(255,255,255,0.08);
                border: 1.5px solid rgba(255,255,255,0.2);
                border-radius: 14px;
                padding: 16px 20px;
                text-align: center;
                width: 140px;
                backdrop-filter: blur(8px);
            ">
                <svg width="32" height="32" viewBox="0 0 100 100" style="display: block; margin: 0 auto 8px;">
                    <circle cx="50" cy="50" r="32" stroke="white" stroke-width="4" fill="none" opacity="0.8"/>
                    <ellipse cx="50" cy="50" rx="16" ry="32" stroke="white" stroke-width="2" fill="none" opacity="0.6"/>
                    <line x1="18" y1="40" x2="82" y2="40" stroke="white" stroke-width="2" opacity="0.6"/>
                    <line x1="18" y1="60" x2="82" y2="60" stroke="white" stroke-width="2" opacity="0.6"/>
                </svg>
                <span style="font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; color: white;">Languages</span>
            </div>
        </div>

        <!-- Bottom tagline -->
        <div style="
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
        ">
            <span style="
                font-family: 'Nunito', sans-serif;
                font-weight: 800;
                font-size: 20px;
                color: #D4A017;
                letter-spacing: 5px;
                text-transform: uppercase;
            ">TEACHER-READY QUALITY</span>
        </div>

        <!-- Subtle decorative elements -->
        <div style="position: absolute; top: 170px; right: 35px; width: 30px; height: 30px; background: #0288D1; border-radius: 50%; opacity: 0.15;"></div>
        <div style="position: absolute; bottom: 200px; left: 35px; width: 20px; height: 20px; background: #D4A017; border-radius: 50%; opacity: 0.15;"></div>
    </div>
</body>
</html>
