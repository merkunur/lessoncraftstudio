assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Construct 6 correct noun phrases (article + adj + noun) on
        worksheet labels in 8 of 10 trials.
      - Use color adjectives correctly in noun phrases in 8 of 10
        trials.
      - Use size adjectives (big/small) correctly in noun phrases
        in 7 of 10 trials.
      - Use number adjectives (one/two/three) correctly in noun
        phrases in 7 of 10 trials.

    Differentiation:
    - Pre-K: 2-word phrases only (article + noun: 'the apple', 'a
      dog').
    - K: 3-word phrases (article + adjective + noun).
    - Grade 1+: extend to 4-word phrases ('the small red apple') +
      bridge to simple sentences ('The red apple is shiny.').

