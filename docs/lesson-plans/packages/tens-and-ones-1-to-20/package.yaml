compositionalRationale:
  en: |
    Primary strand: math / place-value (tens-and-ones for numbers
    1-20 — first place-value strand package). Secondary strand:
    numeracy (counting + number-recognition for 1-20 range). Tertiary
    strand: vocabulary-acquisition (place-value vocabulary: ten,
    ones, place, digit).

    Architectural significance: founds the place-value strand
    (currently 0/8; this package brings to 1/8). Builds on Arc 7-12
    count-objects + add-within-20 numeracy foundation. Critical
    bridge from counting-by-1s (works for 1-20 via single-numeral
    counting) to understanding two-digit structure (generalizes to
    all multi-digit numbers). Foundation for regrouping work in
    future addition/subtraction.

    Distinctive composition: 2 matching + 2 math-puzzle
    (decomposition) + 1 pattern-train. Decomposition work
    emphasized; place-value understanding fundamentally about
    decomposing numbers into tens-and-ones structure.

    Class B FLEXIBLE substrate: composes against miscellaneous
    image-library theme; place-value work uses abstract numerical
    representation (no specific theme content needed). Tens-and-
    ones representation primarily visual (ten-sticks + single-
    counters) handled via manipulative-cut-outs material.

    K-3 multilingual classroom relevance: place-value concept
    universal across 11 platform locales. Number words for 11-19
    vary significantly — Germanic + Romance follow regular pattern
    (eleven/twelve break; thirteen-nineteen regular). Vocabulary
    for "tens" + "ones" varied: "tens place" in en, "decenas" in
    es, "dizenas" in pt, "Zehner" in de. Locale-variant work at
    Phase 3+ adapts to each locale's number-word + place-value
    vocabulary system.

