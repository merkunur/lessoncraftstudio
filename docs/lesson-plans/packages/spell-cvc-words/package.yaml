# Teaching package — spell CVC words
# Arc 12 Phase 2 (Option G; early-literacy / spelling-and-encoding STRAND-FIRST
# 0/5 → 1/5). Foundational encoding sibling to Arc 12 read-cvc-words.

targetSlug: spell-cvc-words
language: en
title:
  en: "Spelling CVC Words — write cat, dog, sun"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching CVC word spelling. **FIRST spelling-and-encoding strand package in the catalog.** Productive-encoding sibling to Arc 12 read-cvc-words (Phase 2). Kids hear a CVC word + spell it letter-by-letter (segment phonemes + map to letters). Foundational encoding bridge — kids who can READ CVC words now learn to WRITE them. Reading-and-writing reciprocity strengthens both skills. Vocab-anchored. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class segment-and-spell routine. Teacher says a CVC word
      slowly: "Listen — CAT. What sounds do you hear? /c/.../a/.../t/.
      Three sounds, three letters: c-a-t. Cat." Class chants. Repeat
      with: dog (d-o-g); sun (s-u-n); hat (h-a-t); pig (p-i-g).
      Reinforces phoneme-segmentation as spelling foundation.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + dictation routine. Each pair receives 8 picture
      cards + paper for writing. Pair takes turns: kid A says the
      word in the picture; kid B writes the word using letter-by-
      letter segmenting. Recast errors with explanation ("you wrote
      'kat' — let's hear the sounds: /k/.../a/.../t/. The first
      sound /k/ can be spelled with C or K. For 'cat', it's spelled
      with C: c-a-t"). Optional extension: kids dictate to each
      other from picture-card decks.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: vocabulary-tracing-strips with
      CVC words (kids trace dotted CVC words; reinforces letter-form
      + spelling). Station 2: word-scramble (kids unscramble CVC-
      word letters into correct spelling order). Station 3:
      manipulative cut-outs hands-on letter-tile spelling (kids
      build CVC words from letter-tile cut-outs). Station 4: matching
      worksheet (image to written-word reinforcement).
  closure:
    durationMinutes: 5
    body: |
      Whole-class spelling-quiz. Teacher dictates 4 CVC words; class
      writes each on whiteboards or paper + teacher reveals correct
      spelling. Forward-pointer: "Today we spelled CVC words by
      hearing the sounds. When we come back to spelling next, we'll
      spell HIGH-FREQUENCY SIGHT WORDS — common short words like
      'the', 'is', 'and', 'I' that don't follow CVC patterns +
      need to be memorized."

