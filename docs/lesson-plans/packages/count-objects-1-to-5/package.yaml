compositionalRationale:
  en: |
    Primary strand: counting and cardinality (target count-objects-1-to-5 — Pre-K
    precursor). Secondary strand: vocabulary acquisition (instrumental). Tertiary
    strand: arithmetic introduction (addition slot 3 + more-less slot 4).
    Mirrors count-objects-1-to-10 architecture at smaller-range cap.

curriculumStandards:
  - CCSS.K.CC.A.1
  - CCSS.K.CC.B.4
  - EYFS.ELG.M

assessmentCriteria:
  en: |
    By end of 1-2 week unit:
      - Count one-to-one to 5 accurately in 4 of 5 trials.
      - Match numeral 1-5 to matching quantity 4 of 5 trials (uses numeral-cards).
      - Count to 5 chorally without error.
      - Use "There are N {item:plural}" frame productively for 3+ counts.

    Differentiation:
    - Pre-K: receptive only via touch + count.
    - K: full productive + numeral-quantity matching.
    - K+: extend to count-objects-1-to-10 (next adjacent target).

