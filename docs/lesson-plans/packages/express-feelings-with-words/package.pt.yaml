# Teaching package — expressar sentimentos com palavras (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 15 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# pt sparse-override for science / personal-social-emotional-development strand.
# Conteúdo socioemocional universal — pt-BR specific emotional-vocabulary register
# particularly valuable for multilingual classrooms. BR-MEC educação infantil
# register per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Nomeando Meus Sentimentos — encontrando palavras para emoções"
description:
  pt: "Pacote socioemocional para educação infantil / 1º ano que ensina as crianças a RECONHECER + NOMEAR + EXPRESSAR sentimentos básicos usando vocabulário emocional específico. Constrói sobre Arc 8-12 identify-and-name-emotions + identify-own-emotions-in-context + identify-emotions-of-others-from-faces como base; estende o trabalho de apenas-reconhecimento para o trabalho de expressão-verbal. Pacote fundacional do fio personal-social-emotional-development (0/6 → 1/6). Ponte crítica do reconhecimento-emocional (identificação passiva) para a expressão-emocional (comunicação ativa) — as crianças aprendem a dizer 'Eu SINTO frustrado' em vez de agir destrutivamente. Base para o trabalho futuro de regulação-emocional + resolução-de-conflito + desenvolvimento-de-empatia. 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Iniciador + introdução do vocabulário-de-sentimentos com
      toda a turma. A professora ou o professor exibe 8 cartas
      de rostos-com-sentimento (feliz, triste, bravo / com raiva,
      assustado, animado, frustrado, surpreso, calmo). "Hoje
      aprendemos a DIZER como nos sentimos. Quando usamos
      PALAVRAS para nossos sentimentos, ajudamos os outros a nos
      entender — + nos ajudamos a entender nossos próprios
      sentimentos." Turma repete em coro: "Eu me sinto feliz!
      Eu me sinto triste! Eu me sinto animado! Eu me sinto
      calmo!" A professora ou o professor demonstra auto-
      modelagem: "Quando eu me sinto FELIZ, eu posso DIZER: Eu
      me sinto feliz hoje. Quando eu me sinto FRUSTRADO, eu posso
      DIZER: Eu me sinto frustrado porque..." Especificidade
      pt-BR: enfatize a estrutura reflexiva "Eu ME sinto" (NÃO
      "Eu sinto" sem pronome reflexivo) — pt-BR canônico
      requer o reflexivo. Para "angry": "bravo" + "com raiva"
      são ambos K-3-naturais; "com raiva" mais formal +
      preciso, "bravo" mais coloquial.
  contentActivity:
    body: |
      Trabalho em duplas + rotina de expressão-de-sentimentos.
      Cada dupla recebe 8 cartas de cenário (ex: "você ganhou um
      presente" / "você não consegue achar seu brinquedo
      favorito" / "seu amigo compartilhou com você" / "alguém
      rasgou seu desenho"). Dupla alterna: criança A lê cenário;
      criança B diz "Eu me sentiria ___ porque ___". Refraseie
      erros com suporte de vocabulário-de-sentimentos ("quando
      seu desenho é rasgado, você pode se sentir TRISTE ou
      FRUSTRADO. Pode tentar: Eu me sentiria triste porque meu
      desenho foi destruído?"). Use cartas de rosto-com-
      sentimento como dicas visuais; crianças apontam para o
      rosto que combina com seu sentimento.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios de
      emparelhamento (palavra-sentimento para imagem-rosto-com-
      sentimento). Estação 2: folha de exercícios prepositions
      (frames-de-frase como "Eu me sinto FELIZ quando ___" +
      "Eu me sinto TRISTE quando ___"). Estação 3: folha de
      exercícios picture-sort (separar cenários em sentimentos
      POSITIVOS + sentimentos DIFÍCEIS). Estação 4: vocabulary-
      tracing-strips para palavras-sentimento. Vocabulário pt-BR
      canônico: feliz / contente / alegre (positivos); triste /
      bravo / com raiva / com medo / assustado (difíceis);
      animado / surpreso / orgulhoso / calmo / cansado /
      entediado / sozinho (matizados).
  closure:
    body: |
      Check-in de sentimentos com toda a turma. Cada criança
      compartilha um sentimento que teve ESTA SEMANA + descreve
      a situação em 1 frase. "Eu me senti ANIMADO quando tivemos
      aula de arte!" "Eu me senti TRISTE quando meu animalzinho
      estava doente." A professora ou o professor valida cada
      resposta com escuta ativa. Indicador adiante: "Hoje
      dissemos nossos sentimentos. Quando voltarmos na próxima
      vez, podemos aprender o que FAZER quando temos sentimentos
      GRANDES — estratégias-para-acalmar + pedir-ajuda + resolver
      problemas com amigos!" Especificidade cultural pt-BR: o
      Brasil tem cultura particularmente acolhedora de
      conversação-sobre-sentimentos; abraços + contato-físico-
      próximo são culturalmente normativos em momentos de check-
      in emocional. Adapte conforme apropriado ao contexto
      regional + escolar.

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Nomear 6 de 8 palavras-de-sentimento básicas corretamente
        quando mostrado o rosto-com-sentimento em 7 de 10
        tentativas.
      - Usar o frame-de-frase "Eu me sinto ___ quando ___"
        corretamente em 6 de 10 tentativas.
      - Combinar cenário com o sentimento mais provável em 7 de
        10 tentativas.
      - Identificar próprio sentimento atual usando 4+ palavras-
        de-sentimento com precisão em auto-verificação.

    Diferenciação:
      - Pré-K (3-5 anos): apenas 4 sentimentos básicos (feliz,
        triste, bravo, assustado); vocabulário receptivo.
      - Educação infantil (5-7 anos): 6-8 sentimentos com frame-
        de-frase.
      - 1º ano em diante: estender para sentimentos matizados
        (frustrado, orgulhoso, sozinho, entediado) + estratégias
        de regulação-emocional + ponte para resolução-de-conflito
        + trabalho de empatia.

compositionalRationale:
  pt: |
    Fio principal: science / personal-social-emotional-development
    (expressão-de-sentimentos — funda fio em 1/6). Fio secundário:
    aquisição-de-vocabulário (vocabulário de sentimentos: feliz,
    triste, bravo, com medo, animado, frustrado, surpreso,
    calmo). Fio terciário: comunicação (expressão verbal de
    estados internos).

    Significância arquitetural: FUNDA o fio personal-social-
    emotional-development em 1/6 — quarta fundação-de-fio
    estabelecida no Arc 15 (numeral-recognition + place-value na
    Fase 1; materials-and-properties + personal-social-emotional-
    development na Fase 2). Constrói sobre Arc 8-12 base de
    emoções (identify-and-name-emotions + identify-own-emotions-
    in-context + identify-emotions-of-others-from-faces); estende
    o trabalho de apenas-reconhecimento para o trabalho de
    expressão-verbal. Ponte crítica do reconhecimento-emocional
    (identificação passiva) para a expressão-emocional
    (comunicação ativa).

    Especificidade pt-BR: o vocabulário emocional em pt-BR tem
    nuances culturalmente específicas particularmente valiosas
    para classrooms multilíngues:
    - **"Eu me sinto..."** vs inglês "I feel..." — pt-BR usa
      pronome reflexivo "me" canonicamente em K-3 contexto. O
      reflexivo enfatiza a interioridade do sentimento.
    - **"bravo"** vs **"com raiva"** — pt-BR K-3 tem dois
      registros para anger: "bravo" coloquial (próximo a
      "annoyed") + "com raiva" formal (mais próximo a "angry").
      Distinção sutil + culturalmente significativa.
    - **"contente"** vs **"feliz"** — pt-BR distingue felicidade
      momentânea (contente / alegre) de felicidade-de-estado
      (feliz). Em inglês K-3, "happy" cobre ambos. Distinção
      útil para precisão emocional.
    - **"saudade"** — termo pt-BR culturalmente único (ausência-
      sentida-com-carinho); difícil de traduzir literalmente
      para inglês. Não introduzido este Pacote K-3 mas vale notar
      como vocabulário emocional pt-BR distintivo para futura
      complexidade.

    Contexto cultural pt-BR: cultura brasileira tem expressão-
    emocional mais aberta + corporificada do que em alguns
    contextos anglófonos. Trabalho de feelings-expression em
    classroom pt-BR pode integrar movimento + contato-físico-
    próximo (abraços; bater-na-mão) como suporte para verbal
    expression. Adapte conforme cultura escolar + diretrizes
    regionais.

    Currículo BNCC EI03EO01 + 1º ano EF01ER02: identificação +
    expressão de sentimentos em diferentes contextos; relações
    interpessoais positivas.

    Substrato Class B FLEXIBLE: composta contra tema emotions
    (canônico para imagens-de-rosto-com-sentimento).
