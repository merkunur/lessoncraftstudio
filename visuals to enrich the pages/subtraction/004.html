                <div style="position: absolute; bottom: -8px; left: 20px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid white;"></div>

        </div>

                <div style="position: absolute; top: 25px; left: 22px; width: 22px; height: 26px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;">

                <div style="position: absolute; top: 25px; right: 22px; width: 22px; height: 26px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <div style="width: 11px; height: 13px; background: #1A1A2E; border-radius: 50%; margin-top: 4px;"></div>
                </div>
                <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; background: #E65100; border-radius: 50%;"></div>

                <div style="position: absolute; top: 20px; left: 18px; width: 20px; height: 24px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;">

                <div style="position: absolute; top: 20px; right: 18px; width: 20px; height: 24px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;">

                </div>

        <!-- Center worksheet -->
        <div style="position: absolute; top: 265px; left: 50%; transform: translateX(-50%); z-index: 10;">

                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #2E7D32;">Perfect for Centers!</span>

            <div style="background: white; padding: 10px 18px; border-radius: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.12); border: 3px solid #FF9800;">

            <div style="background: white; padding: 10px 18px; border-radius: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.12); border: 3px solid #B39DDB;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #7B1FA2;">Early Finishers!</span>
