thematicCoherence:
  en: |
    All 5 packages cohere around the Christmas theme + form a cross-strand
    winter-seasonal + cultural-awareness composition. Mirrors easter-bundle
    structural composition (parallel holiday-bundle architectural pattern)
    while differentiating by seasonal anchor + cultural traditions.

    **Pedagogical sequencing:**
    1. **identify-and-name-action-verbs** — Foundational Christmas-action
       vocabulary (decorate, wrap, give, sing, celebrate, share, gather,
       light). Same shared package across many bundles (~11 bundles
       reuse this package now). Christmas-context substantiates verb-
       vocabulary with concrete celebratory actions kids physically
       perform during Christmas activities.
    2. **count-objects-1-to-10** — Counting practice using Christmas
       items as countable subjects (5 ornaments on the tree; 3 presents
       under the tree; 2 candles; 8 snowflakes; 7 reindeer in a line).
       Same shared package across many bundles; Christmas-context
       particularly engaging for K-3 counting via gift-counting + ornament-
       counting + advent-calendar-counting activities.
    3. **sort-by-color** — Color-cognition work using ornament-color
       contexts (red ornaments vs green ornaments vs gold ornaments vs
       silver ornaments). Christmas decorations are canonical color-
       sorting substrate — traditional red+green+gold+silver palette
       supports vivid color discrimination work.
    4. **compare-greeting-routines-across-cultures** — Multilingual-
       awareness work via Christmas-greeting traditions (English Merry
       Christmas / Spanish Feliz Navidad / German Frohe Weihnachten /
       French Joyeux Noël / Italian Buon Natale / Dutch Vrolijk Kerstfeest
       / Portuguese Feliz Natal / Swedish God Jul / Danish Glædelig Jul
       / Norwegian God Jul / Finnish Hyvää Joulua). Particularly load-
       bearing for multilingual classrooms — across all 11 platform
       locales there are distinctive Christmas-greeting traditions
       worth comparing. Connects holiday-vocabulary to cross-cultural-
       awareness work. Inclusive framing essential — many classroom
       kids celebrate non-Christian winter holidays (Hanukkah +
       Kwanzaa + Diwali + winter-solstice) — package framing welcomes
       all winter-celebration traditions.
    5. **identify-four-seasons** — Seasonal-cognition work situating
       Christmas as winter-anchored celebration in Northern Hemisphere
       (snowy weather, evergreen trees, indoor-gathering rituals) OR
       summer-anchored celebration in Southern Hemisphere (Australian
       beach Christmas; Brazilian summer Natal). Same shared package
       with winter + summer + spring + tree + beach + easter bundles.
       Locale-aware seasonal-anchoring is important for international
       school contexts.

    **Strand spread:** 1 vocabulary-acquisition (action-verbs) + 1
    numeracy + 1 cognitive-sorting (color) + 1 multilingual-language-
    awareness (cross-cultural-greetings) + 1 environment-and-weather
    (four-seasons). **5 distinct strands.** Mirrors easter-bundle's
    strand-spread architecture — parallel holiday-bundle architectural
    pattern with distinctive seasonal + cultural differentiation.

    **Suggested unit duration:** 3-4 weeks (1 package per week).
    Timed to December — natural fit early-December through Christmas
    weekend. Time-bounded relevance like easter-bundle differentiates
    holiday bundles from year-round bundles.

    **Multilingual classroom relevance:** Christmas vocabulary varies
    significantly across the 11 platform locales (Christmas / Weihnachten
    / Navidad / Kerstmis / Noël / Natale / Natal / Jul / Joulu). Cultural-
    traditions vary even more (German Christkindlmarkt + Advent
    candles; Italian Befana + presepe; Mexican Las Posadas;
    Scandinavian Lucia; Finnish sauna + ham; Dutch Sinterklaas
    Dec 5 separate from Christmas Dec 25). Particularly load-bearing
    for international school + dual-language program contexts where
    kids share home-country Christmas customs enriching classroom
    multicultural discussion. Critical inclusive framing — many
    multilingual K-3 classrooms have non-Christmas-celebrating families
    (Jewish + Muslim + Hindu + Buddhist + secular); bundle materials
    should welcome all winter-holiday traditions + family choices.

    **Pillar 2 architectural pattern:** christmas-bundle exemplifies
    holiday-themed bundle composition (2nd instance after easter-bundle).
    Establishes holiday-bundle template at 2-instance pattern emergence
    threshold. Theme-axis-key holiday-christmas (vs holiday-easter at
    spring-anchored holiday). Mirrors easter-bundle's strand-spread
    architecture (action-verbs + counting + color-sorting + cross-cultural-
    awareness + four-seasons) — emerging holiday-bundle template applicable
    to future thanksgiving + halloween + diwali + ramadan + hanukkah +
    chinese-new-year candidates. Multilingual-classroom relevance peaks
    for Christmas due to cross-locale cultural-tradition variety.
