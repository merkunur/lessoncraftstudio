<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Pr&auml;positionen - Wegweiser Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden;">

        <!-- Sky (top 35%) -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 350px; background: linear-gradient(180deg, #B3E5FC 0%, #E1F5FE 100%);"></div>
        <!-- Meadow (bottom 65%) -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 650px; background: linear-gradient(180deg, #C8E6C9 0%, #A5D6A7 30%, #81C784 100%);"></div>
        <!-- Horizon glow -->
        <div style="position: absolute; top: 310px; left: 0; right: 0; height: 80px; background: linear-gradient(180deg, rgba(255,255,255,0.3), transparent);"></div>

        <!-- Grass texture -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 650px; opacity: 0.06; background-image: radial-gradient(circle, #2E7D32 1px, transparent 1px); background-size: 25px 25px;"></div>

        <!-- Tiny bird V-shapes in sky -->
        <div style="position: absolute; top: 60px; left: 180px; font-size: 16px; color: #546E7A; opacity: 0.4; transform: scaleX(1.5);">&#8744;</div>
        <div style="position: absolute; top: 90px; left: 250px; font-size: 12px; color: #546E7A; opacity: 0.3; transform: scaleX(1.5);">&#8744;</div>
        <div style="position: absolute; top: 45px; right: 220px; font-size: 14px; color: #546E7A; opacity: 0.35; transform: scaleX(1.5);">&#8744;</div>

        <!-- CSS Flowers -->
        <div style="position: absolute; bottom: 180px; left: 60px;">
            <div style="width: 14px; height: 14px; background: #F06292; border-radius: 50%; box-shadow: -6px -6px 0 #F06292, 6px -6px 0 #F06292, -6px 6px 0 #F06292, 6px 6px 0 #F06292; opacity: 0.7;"></div>
            <div style="width: 6px; height: 6px; background: #FDD835; border-radius: 50%; position: absolute; top: 4px; left: 4px;"></div>
        </div>
        <div style="position: absolute; bottom: 250px; right: 90px;">
            <div style="width: 12px; height: 12px; background: #CE93D8; border-radius: 50%; box-shadow: -5px -5px 0 #CE93D8, 5px -5px 0 #CE93D8, -5px 5px 0 #CE93D8, 5px 5px 0 #CE93D8; opacity: 0.65;"></div>
            <div style="width: 5px; height: 5px; background: #FFD54F; border-radius: 50%; position: absolute; top: 3px; left: 3px;"></div>
        </div>
        <div style="position: absolute; bottom: 100px; left: 350px;">
            <div style="width: 10px; height: 10px; background: #FFAB91; border-radius: 50%; box-shadow: -4px -4px 0 #FFAB91, 4px -4px 0 #FFAB91, -4px 4px 0 #FFAB91, 4px 4px 0 #FFAB91; opacity: 0.6;"></div>
            <div style="width: 4px; height: 4px; background: #FFF176; border-radius: 50%; position: absolute; top: 3px; left: 3px;"></div>
        </div>

        <!-- Grass tufts -->
        <div style="position: absolute; bottom: 130px; left: 130px; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 18px solid #4CAF50; opacity: 0.5;"></div>
        <div style="position: absolute; bottom: 130px; left: 138px; width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 14px solid #66BB6A; opacity: 0.4; transform: rotate(10deg);"></div>
        <div style="position: absolute; bottom: 200px; right: 170px; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 16px solid #4CAF50; opacity: 0.45;"></div>

        <!-- GRATIS Badge (white + green leaf style) -->
        <div style="position: absolute; top: 28px; left: 30px; z-index: 100;">
            <div style="background: white; padding: 10px 24px; border-radius: 26px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); border: 3px solid #43A047;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #2E7D32;">GRATIS</span>
            </div>
        </div>

        <!-- KLASSE Badge (white cloud pill) -->
        <div style="position: absolute; top: 32px; right: 34px; z-index: 100;">
            <div style="background: white; padding: 10px 22px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.1);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: #2E7D32; letter-spacing: 1px;">KLASSE 1-2</span>
            </div>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 20px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 54px; color: #1A237E; margin: 0; text-shadow: 0 2px 8px rgba(26,35,126,0.1); line-height: 1.1;">Wohin zeigt</h1>
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 54px; color: #1A237E; margin: 2px 0 0 0; text-shadow: 0 2px 8px rgba(26,35,126,0.1); line-height: 1.1;">der Weg?</h1>
            <p style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; color: #FF7043; margin: 8px 0 0 0; letter-spacing: 1px;">Pr&auml;positionen lernen</p>
        </div>

        <!-- SIGNPOST (central) -->
        <div style="position: absolute; top: 230px; left: 50%; transform: translateX(-50%); z-index: 30;">
            <!-- Post -->
            <div style="width: 14px; height: 300px; background: linear-gradient(90deg, #8D6E63, #6D4C41); border-radius: 4px; margin: 0 auto; box-shadow: 2px 0 6px rgba(0,0,0,0.15);">
                <!-- Post cap -->
                <div style="width: 24px; height: 12px; background: linear-gradient(180deg, #A1887F, #8D6E63); border-radius: 4px 4px 0 0; position: absolute; top: -6px; left: -5px;"></div>
            </div>

            <!-- Arrow boards -->
            <!-- AUF - coral, pointing right -->
            <div style="position: absolute; top: 10px; left: 18px; z-index: 31;">
                <div style="display: flex; align-items: center;">
                    <div style="background: linear-gradient(90deg, #FF7043, #E64A19); padding: 8px 16px 8px 14px; border-radius: 4px 0 0 4px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 1px;">AUF</span>
                    </div>
                    <div style="width: 0; height: 0; border-top: 18px solid transparent; border-bottom: 18px solid transparent; border-left: 16px solid #E64A19;"></div>
                </div>
            </div>

            <!-- UNTER - blue, pointing left -->
            <div style="position: absolute; top: 55px; right: 18px; z-index: 31;">
                <div style="display: flex; align-items: center;">
                    <div style="width: 0; height: 0; border-top: 18px solid transparent; border-bottom: 18px solid transparent; border-right: 16px solid #1565C0;"></div>
                    <div style="background: linear-gradient(90deg, #1565C0, #1E88E5); padding: 8px 14px 8px 16px; border-radius: 0 4px 4px 0; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 1px;">UNTER</span>
                    </div>
                </div>
            </div>

            <!-- NEBEN - green, pointing right -->
            <div style="position: absolute; top: 100px; left: 18px; z-index: 31;">
                <div style="display: flex; align-items: center;">
                    <div style="background: linear-gradient(90deg, #43A047, #2E7D32); padding: 8px 16px 8px 14px; border-radius: 4px 0 0 4px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 1px;">NEBEN</span>
                    </div>
                    <div style="width: 0; height: 0; border-top: 18px solid transparent; border-bottom: 18px solid transparent; border-left: 16px solid #2E7D32;"></div>
                </div>
            </div>

            <!-- HINTER - amber, pointing left -->
            <div style="position: absolute; top: 145px; right: 18px; z-index: 31;">
                <div style="display: flex; align-items: center;">
                    <div style="width: 0; height: 0; border-top: 18px solid transparent; border-bottom: 18px solid transparent; border-right: 16px solid #E65100;"></div>
                    <div style="background: linear-gradient(90deg, #E65100, #FF8F00); padding: 8px 14px 8px 16px; border-radius: 0 4px 4px 0; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 1px;">HINTER</span>
                    </div>
                </div>
            </div>

            <!-- IN - purple, pointing right -->
            <div style="position: absolute; top: 190px; left: 18px; z-index: 31;">
                <div style="display: flex; align-items: center;">
                    <div style="background: linear-gradient(90deg, #7B1FA2, #9C27B0); padding: 8px 16px 8px 14px; border-radius: 4px 0 0 4px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 1px;">IN</span>
                    </div>
                    <div style="width: 0; height: 0; border-top: 18px solid transparent; border-bottom: 18px solid transparent; border-left: 16px solid #9C27B0;"></div>
                </div>
            </div>
        </div>

        <!-- SVG dashed path connecting stations -->
        <svg style="position: absolute; top: 0; left: 0; width: 1000px; height: 1000px; z-index: 5; pointer-events: none;">
            <path d="M 180 700 Q 300 620, 500 650 Q 700 680, 820 580" fill="none" stroke="#5D4037" stroke-width="4" stroke-dasharray="12,8" opacity="0.3"/>
        </svg>

        <!-- Worksheet Station 1: EINFACH (left) -->
        <div style="position: absolute; top: 530px; left: 60px; z-index: 20;">
            <div style="width: 185px; height: 239px; background: white; border-radius: 8px; box-shadow: 0 8px 26px rgba(0,0,0,0.25); overflow: hidden; border: 4px solid #E53935;">
                <img src="https://www.lessoncraftstudio.com/samples/german/prepositions/sample-4.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Pr&auml;positionen Arbeitsblatt Einfach">
            </div>
            <!-- EINFACH label -->
            <div style="position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); background: #E53935; padding: 5px 16px; border-radius: 14px; box-shadow: 0 3px 10px rgba(229,57,53,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white; letter-spacing: 1px;">EINFACH</span>
            </div>
        </div>

        <!-- Worksheet Station 2: MITTEL (center) -->
        <div style="position: absolute; top: 480px; left: 50%; transform: translateX(-50%); z-index: 22;">
            <div style="width: 205px; height: 265px; background: white; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.3); overflow: hidden; border: 4px solid #1A237E;">
                <img src="https://www.lessoncraftstudio.com/samples/german/prepositions/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Pr&auml;positionen Arbeitsblatt Mittel">
            </div>
            <!-- MITTEL label -->
            <div style="position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); background: #1A237E; padding: 5px 16px; border-radius: 14px; box-shadow: 0 3px 10px rgba(26,35,126,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white; letter-spacing: 1px;">MITTEL</span>
            </div>
        </div>

        <!-- Worksheet Station 3: KNIFFLIG (right) -->
        <div style="position: absolute; top: 440px; right: 60px; z-index: 20;">
            <div style="width: 220px; height: 285px; background: white; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.28); overflow: hidden; border: 4px solid #2E7D32;">
                <img src="https://www.lessoncraftstudio.com/samples/german/prepositions/sample-5.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Pr&auml;positionen Arbeitsblatt Knifflig">
            </div>
            <!-- KNIFFLIG label -->
            <div style="position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); background: #2E7D32; padding: 5px 16px; border-radius: 14px; box-shadow: 0 3px 10px rgba(46,125,50,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white; letter-spacing: 1px;">KNIFFLIG</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 50;">
            <div style="background: white; padding: 10px 20px; border-radius: 24px; box-shadow: 0 3px 12px rgba(0,0,0,0.1); border: 2px solid #43A047;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #2E7D32;">8 Pr&auml;positionen</span>
            </div>
            <div style="background: white; padding: 10px 20px; border-radius: 24px; box-shadow: 0 3px 12px rgba(0,0,0,0.1); border: 2px solid #43A047;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #2E7D32;">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: white; padding: 10px 20px; border-radius: 24px; box-shadow: 0 3px 12px rgba(0,0,0,0.1); border: 2px solid #43A047;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #2E7D32;">Schritt f&uuml;r Schritt</span>
            </div>
        </div>

    </div>
</body>
</html>
