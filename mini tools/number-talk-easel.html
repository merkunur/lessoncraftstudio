<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Number Talk Easel — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. The string library is fetched from
       /mini-tools/number-talk-easel-strings.json at runtime. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/number-talk-easel.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=sv  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1 / ?embed=compact
    // Tool-specific deep links: ?string=<id> | ?repr=<repr>&n=<qty>&range=1-10
    LCS.mount(NumberTalkEasel, { mount: '#lcs-root' });
  </script>
</body>
</html>
