<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Unrolling Tape — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell, then this tool. Absolute /mini-tools/ paths so embeds and
       cross-context loads resolve identically. No core import.
       This tool loads ONE data file — /mini-tools/unroll-tape-shapes.json,
       the shape book — so the deploy cp MUST include *.json or the book
       404s and the tool falls back to its five free shapes (never to
       nothing). It loads NO ART: every outline is a formula, because
       there is no contour data for any object in this repo. And NO
       AUDIO: nothing here can 404 into silence. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/unroll-tape.js?v=3"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    LCS.mount(UnrollTape, { mount: '#lcs-root' });
  </script>
</body>
</html>
