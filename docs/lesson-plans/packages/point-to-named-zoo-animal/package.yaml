compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (RECEPTIVE — pointing to named
    zoo animal, not naming it). Secondary strand: visual discrimination
    (zoo-animal silhouette recognition; iconic-species discrimination
    via pattern markings — stripes/spots/solid-color).

    Pairing pattern with productive package: identify-and-name-10-zoo-
    animals (Arc 4) provides the productive surface; this receptive
    variant uses the same 10-key cluster but composes against receptive-
    surface exercises (matching is image-to-word; shadow-match is image-
    to-silhouette; find-and-count counts image instances; odd-one-out
    picks images NOT in the cluster — all surfaces require recognition,
    not production).

    Architectural validation: third receptive-variant package (after Arc
    5 Phase 3's point-to-named-body-part + point-to-named-farm-animal).
    Continues validation of the productive↔receptive pairing pattern
    across the vocabulary-acquisition strand. The pattern continues to
    generalize cleanly — same 5-exercise + 7-material shape works across
    diverse theme axes (body-parts + farm-animals + zoo-animals).

    Vocabulary-tracing-strips note: 4 keys (lion, tiger, panda, koala)
    selected for K-3 handwriting-readiness — short words; high-frequency
    in zoo-animal-themed K-3 picture books.

    Cultural-variation acknowledgment: zoo-as-institution varies by
    region (per Arc 4 Phase 1 zoo-animals package framing); the 10-key
    cluster prioritizes universally-recognizable iconic species.
    Operator-side teachers can layer in regionally-prominent zoo-animals
    not in the cluster (e.g., bears for North American contexts; pandas
    are already in the cluster which serves Chinese cultural context).

    K-3 multilingual classroom relevance: zoo-animal vocabulary is high-
    interest content for K-3; receptive understanding precedes productive
    naming. The package is particularly suited for early-immersion
    learners who recognize zoo animals visually but haven't yet acquired
    target-language names productively.

curriculumStandards:
  - EYFS.ELG.UW
  - EYFS.ELG.LL
