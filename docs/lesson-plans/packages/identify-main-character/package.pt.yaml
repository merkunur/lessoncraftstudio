# Teaching package — identificar o personagem principal (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT per Arc 7 Phase 3 + Arc 3 Phase 1 sparse-override pattern.
# Arc 17 Phase 1.5 pt-cadence continuation (18th consecutive arc).
# pt sparse-override for language-and-communication / reading-comprehension strand
# (2/10 → 3/10). Conteúdo de comprehension-de-leitura universal — adaptação locale-
# específica para vocabulário de personagem pt-BR + seleções de histórias culturalmente
# apropriadas. BR-MEC ensino fundamental anos iniciais register per CLAUDE.md §6 +
# formal "você" address per §17.9.

title:
  pt: "Identificar o Personagem Principal — sobre quem é a história?"

description:
  pt: "Pacote de comprehension-de-leitura para Educação Infantil / 1º ano que ensina as crianças a identificar o PERSONAGEM PRINCIPAL em uma história — a pessoa (ou animal, ou coisa) sobre quem a história é. Constrói sobre Arc 12 Phase 2 match-sentence-to-picture (a fundação de comprehension-de-leitura strand-FIRST; crianças que conseguem combinar frases com imagens agora podem extrair um PERSONAGEM de um par frase-e-imagem). Fio reading-comprehension avança 2/10 → 3/10 (predict-from-picture-cue é o outro irmão existente; match-sentence-to-picture é o abridor-de-fio). Per enquadramento §A.13.30 K-1-informal: o trabalho K-1 é identificação-de-personagem em LEITURA EM VOZ ALTA CONDUZIDA POR QUEM ENSINA ou texto APOIADO POR IMAGENS, NÃO decodificação independente + análise literária. As crianças ouvem ou acompanham uma história curta; quem ensina pergunta 'sobre quem é esta história?' e as crianças identificam o personagem principal (geralmente nomeado no título da história ou mostrado proeminentemente nas imagens). O personagem é mais frequentemente o protagonista cujas ações conduzem a narrativa — mas no K-1, o sinal mais simples 'cujo nome aparece mais / quem aparece em mais imagens' é o sinal reconhecível. Âncora primária CCSS.RL.K.3 ('Com prompting e suporte, identificar personagens, cenários e eventos principais em uma história'); CCSS.1.RL.3 extensão Grade 1. 5 exercícios + 8 materiais imprimíveis em uma unidade de 1 semana. Material load-bearing: sentence-strips com framePreset de story-context (o substrato literal de story-frame com que as crianças trabalham)."

structure:
  warmup:
    body: |
      Introdução de personagem-de-história com toda a turma
      com leitura em voz alta. Quem ensina lê em voz alta
      um livro-ilustrado curto familiar (e.g., 'A Lagarta
      Comilona' por Eric Carle; ou uma história
      culturalmente equivalente com animal-protagonista
      simples). Após a leitura: "Sobre quem era esta
      história?" Turma nomeia o personagem principal (a
      Lagarta). "Como você sabia que era a Lagarta? Que
      pistas a história nos deu?" Turma explica que viram
      a Lagarta na maioria das páginas, o título nomeava
      a Lagarta, a Lagarta fazia a maioria das ações.
      Depois introduz vocabulário: "Chamamos isso de
      PERSONAGEM PRINCIPAL — a pessoa ou animal sobre quem
      a história é principalmente." Repete com uma segunda
      história curta com um animal-protagonista diferente
      (e.g., 'Urso Marrom, Urso Marrom, O Que Você Vê?' —
      o urso e a sequência de animais). Turma identifica o
      urso como o protagonista fundacional. Ênfase do
      padrão: "Quando lemos uma história, PERGUNTEM: sobre
      quem é isto? O PERSONAGEM PRINCIPAL aparece mais, o
      título frequentemente os nomeia, eles fazem as ações
      importantes."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de história-e-personagem.
      Cada dupla recebe 6 cartas de história curta (3-4
      frases cada com suporte de imagem) + 6 cartas de
      personagem (o personagem principal de cada história
      mostrado isoladamente). Dupla alterna: criança A lê
      uma carta de história em voz alta (ou quem ensina lê
      se a fluência de leitura ainda não está lá); criança
      B identifica o personagem principal + encontra a
      carta de personagem correspondente. Ambas as crianças
      dizem em voz alta: "O personagem principal desta
      história é o(a) [personagem]." Refraseie erros com
      apontamento-de-pistas ("você disse que o personagem
      era a raposa, mas olha esta imagem — o cachorro
      aparece em cada imagem e o título diz 'Onde Está
      Meu Osso?' — o personagem principal é o cachorro
      procurando o osso."). As cartas de personagem
      fornecem o andaime de matching; as cartas de
      história fornecem o contexto narrativo. Extensão
      opcional: crianças recontam uma história favorita
      para sua parceira usando as cartas de personagem
      como auxílio visual + praticam o vocabulário
      personagem-principal na recontagem. Vocabulário
      pt-BR canônico para identificação-de-personagem:
      personagem / personagem principal / protagonista /
      herói; história / livro / título; ações principais.
      Use "personagem" + "personagem principal" como
      termos K-3 canônicos; "protagonista" é mais formal
      escolar; "herói" coloquial para protagonistas-bons.
  scaffold:
    body: |
      Rotação de estações. Estação 1: atividade matching
      (imagem-de-personagem para nome-de-personagem;
      âncora de vocabulário para o vocabulário-de-
      personagem que as crianças encontram através das
      histórias). Estação 2: atividade picture-sort
      (classifique cartas de personagem em categorias —
      e.g., 'personagens-animais' / 'personagens-pessoas'
      / 'outros' — faz surgir tipos-de-personagem sem
      exigir leitura). Estação 3: missing-pieces (complete
      a imagem do personagem — apoia o reconhecimento
      visual de personagem em que a habilidade de
      compreensão se baseia). Estação 4: atividade
      matching (carta-de-história para carta-de-
      personagem; o exercício canônico de habilidade-de-
      compreensão).
  closure:
    body: |
      Recuperação rápida de personagem-principal com toda
      a turma. Quem ensina exibe 3 cartas de história;
      a turma identifica coletivamente o personagem
      principal de cada uma. "Esta história tem a
      Lagarta! Esta é sobre o Urso! Esta é sobre o
      Coelho!" Depois faz a pergunta de reflexão: "Como
      você encontra o personagem principal?" Turma
      repete: "Olhe as imagens! Olhe o título! Veja
      quem faz as ações!" Indicador adiante: "Hoje
      identificamos personagens principais. Ler é sobre
      entender HISTÓRIAS — e histórias são sobre
      PERSONAGENS fazendo coisas em CENÁRIOS. A seguir
      conheceremos IDENTIFICAR O CENÁRIO (onde a história
      acontece?) e SEQUENCIAR OS EVENTOS DA HISTÓRIA (o
      que aconteceu primeiro, depois, por último?).
      Estamos construindo em direção a contar histórias
      nós mesmos."

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Identificar o personagem principal de uma história
        familiar lida em voz alta em 8 de 10 tentativas.
      - Identificar o personagem principal de uma NOVA
        história (com leitura em voz alta por quem ensina)
        em 6 de 10 tentativas.
      - Articular o raciocínio da identificação ('Eu sei
        que o urso é o personagem principal porque o urso
        está em cada imagem e o título diz urso marrom')
        em 5 de 10 tentativas de linguagem produtiva.
      - Usar vocabulário 'personagem principal' /
        'personagem' / 'história' corretamente em 6 de 10
        tentativas de linguagem produtiva.

    Diferenciação:
      - Pré-K (3-5 anos): leitura em voz alta + spotting
        de personagem com pista-de-imagem (sem distinção
        formal de personagem-principal); as crianças
        simplesmente nomeiam 'quem está na história'.
      - Educação infantil (5-7 anos): identificação
        completa de personagem-principal com histórias
        familiares + histórias novas simples; leitura em
        voz alta por quem ensina fortemente apoiada.
      - 1º ano: identificação independente de personagem-
        principal em histórias novas simples; ponte para
        distinção personagem-vs-cenário.
      - 2º ano em diante: distinção personagem-principal-
        vs-secundário; trabalho de sentimentos /
        motivações dos personagens (o candidato Arc 18+
        infer-character-feeling-from-picture-cue é o
        próximo alvo-de-fio reading-comp após este).

compositionalRationale:
  pt: |
    Fio principal: linguagem-e-comunicação / reading-
    comprehension (identificar o personagem principal —
    avança fio 2/10 → 3/10). Fio secundário: aquisição-
    de-vocabulário (vocabulário-de-personagem +
    vocabulário-de-história: 'personagem', 'principal',
    'história', 'protagonista' para crianças mais velhas).
    Fio terciário: falar-e-ouvir (o trabalho de linguagem-
    produtiva de articular SOBRE QUEM a história é +
    recontar).

    Significância arquitetural: continua expansão do fio
    reading-comprehension. Per learning-targets.json o
    fio tem 10 alvos canônicos; estado atual é 2 autorados
    (match-sentence-to-picture do Arc 12 Phase 2 como o
    abridor-de-fio + predict-from-picture-cue como o
    segundo irmão); identify-main-character é o terceiro
    pacote, levando o fio para 3/10. Per pré-requisito
    learning-targets.json: match-sentence-to-picture é o
    pré-requisito — as crianças devem ser capazes de
    conectar uma frase a uma imagem antes de poderem
    extrair um personagem de uma história em par frase-e-
    imagem.

    Per enquadramento §A.13.30 K-1-informal: trabalho K-1
    é identificação-de-personagem em LEITURA EM VOZ ALTA
    CONDUZIDA POR QUEM ENSINA ou texto APOIADO POR
    IMAGENS. As crianças NÃO precisam ser leitores
    independentes para identificar um personagem
    principal — elas podem identificar o protagonista a
    partir de pistas-de-imagem + leitura em voz alta por
    quem ensina + pista-de-título. Os sinais
    identificadores K-1 são deliberadamente simples:
    - QUEM APARECE MAIS nas imagens?
    - QUEM É NOMEADO no título?
    - QUEM FAZ AS AÇÕES IMPORTANTES?
    Esses sinais tornam a identificação de personagem-
    principal acessível em idades K-1 sem exigir
    vocabulário formal de análise-literária ou fluência
    de decodificação independente.

    Referência cruzada a match-sentence-to-picture (pré-
    requisito): aquele pacote estabeleceu a conexão
    frase-para-imagem (as crianças leem uma frase + a
    combinam com a imagem que ela descreve). Este pacote
    estende essa conexão: agora as crianças leem uma
    HISTÓRIA CURTA (3-4 frases com suporte de imagem) +
    identificam o PERSONAGEM que aparece através das
    frases. A habilidade frase-para-imagem fundamenta a
    habilidade de rastreamento-de-personagem-em-múltiplas-
    frases.

    Especificidade pt-BR: identificação-de-personagem-
    principal é conceito universal + traduzível 1:1 do en.
    O conceito narrativo de 'personagem' é locale-
    portátil; apenas o vocabulário varia. Vocabulário
    pt-BR canônico:
    - **"personagem"** — termo BNCC canônico K-3 para
      character; cognato com en.
    - **"personagem principal"** — forma K-3 canônica
      para 'main character'; estruturalmente similar a
      en (adjetivo + substantivo).
    - **"protagonista"** — termo mais formal escolar;
      acessível K-3 com contexto mas menos coloquial.
    - **"herói"** / **"heroína"** — termos K-3
      coloquiais para protagonistas-bons; vocabulário de
      conto-de-fadas + livros de aventura infantis.
    - **"história"** / **"livro"** — termos K-3 cognatos
      com en.
    - **"título"** — termo K-3 para title; cognato.

    Seleções de histórias pt-BR culturalmente apropriadas:
    além de 'A Lagarta Comilona' (universal — Eric Carle
    traduzido), incluir histórias da literatura infantil
    brasileira como 'O Menino Maluquinho' (Ziraldo;
    protagonista nomeado), 'A Bolsa Amarela' (Lygia
    Bojunga; protagonista Raquel), 'Marcelo, Marmelo,
    Martelo' (Ruth Rocha; protagonista Marcelo). Em
    locale-variant work, quem ensina seleciona histórias
    do cânone literário infantil local; a habilidade de
    identificação-de-personagem-principal transfere entre
    histórias regardless de qual história específica é
    usada.

    Currículo BNCC EF01LP01 (1º ano) + EF02LP14 (2º ano):
    reconhecer que textos são lidos e escritos da esquerda
    para a direita e de cima para baixo da página;
    identificar personagens, cenário e enredo em contos.

    Substrato Class B FLEXIBLE: composta contra tema
    animals (livros-ilustrados iniciais predominantemente
    apresentam animais-protagonistas; precedente de classe-
    de-alfabetização + encaixe natural para trabalho de
    identificação-de-personagem K-1). Histórias com
    animais-protagonistas em K-1 pt-BR: 'A Lagarta
    Comilona' (lagarta) / 'O Patinho Feio' (patinho) /
    'O Lobo e os Sete Cabritinhos' (lobo + cabritinhos)
    / contos populares brasileiros com bichos como Saci,
    Curupira (locale-variant cultural anchors).
