<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Subtraction Worksheets - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #1A1A2E 0%, #2D1B3D 50%, #1A1A2E 100%); overflow: hidden;">

        <!-- Star field dots -->
        <div style="position: absolute; top: 80px; left: 120px; width: 3px; height: 3px; background: white; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; top: 50px; left: 350px; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0.4;"></div>
        <div style="position: absolute; top: 130px; left: 600px; width: 3px; height: 3px; background: white; border-radius: 50%; opacity: 0.6;"></div>
        <div style="position: absolute; top: 40px; right: 150px; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0.35;"></div>
        <div style="position: absolute; top: 100px; right: 300px; width: 4px; height: 4px; background: #FFE082; border-radius: 50%; opacity: 0.3; box-shadow: 0 0 8px 2px rgba(255,224,130,0.3);"></div>
        <div style="position: absolute; top: 180px; left: 80px; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0.3;"></div>
        <div style="position: absolute; top: 60px; left: 800px; width: 3px; height: 3px; background: white; border-radius: 50%; opacity: 0.45;"></div>
        <div style="position: absolute; top: 160px; left: 450px; width: 2px; height: 2px; background: #B39DDB; border-radius: 50%; opacity: 0.4; box-shadow: 0 0 6px 2px rgba(179,157,219,0.3);"></div>
        <div style="position: absolute; bottom: 100px; left: 50px; width: 3px; height: 3px; background: white; border-radius: 50%; opacity: 0.35;"></div>
        <div style="position: absolute; bottom: 60px; right: 120px; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0.4;"></div>

        <!-- Subtle nebula glow -->
        <div style="position: absolute; top: 30%; left: 20%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(179,157,219,0.06) 0%, transparent 60%); border-radius: 50%;"></div>
        <div style="position: absolute; top: 40%; right: 10%; width: 350px; height: 350px; background: radial-gradient(circle, rgba(194,24,91,0.05) 0%, transparent 60%); border-radius: 50%;"></div>

        <!-- Title -->
        <div style="position: absolute; top: 30px; left: 0; right: 0; text-align: center; z-index: 10;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 56px; color: #FFE082; margin: 0; text-shadow: 3px 3px 0 rgba(0,0,0,0.4), 0 0 30px rgba(255,224,130,0.3);">SUBTRACTION</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 42px; color: white; margin: 4px 0 0 0; text-shadow: 2px 2px 6px rgba(0,0,0,0.5);">LEVELS</h2>
        </div>

        <!-- Ascending path line (drawn with a gradient div) -->
        <div style="position: absolute; top: 160px; left: 100px; right: 100px; bottom: 120px; z-index: 1;">
            <!-- Dashed path effect -->
            <div style="position: absolute; bottom: 80px; left: 80px; width: 250px; height: 4px; background: repeating-linear-gradient(90deg, rgba(255,224,130,0.3) 0, rgba(255,224,130,0.3) 10px, transparent 10px, transparent 20px); transform: rotate(-20deg); transform-origin: left center;"></div>
            <div style="position: absolute; bottom: 220px; left: 340px; width: 250px; height: 4px; background: repeating-linear-gradient(90deg, rgba(255,224,130,0.3) 0, rgba(255,224,130,0.3) 10px, transparent 10px, transparent 20px); transform: rotate(-20deg); transform-origin: left center;"></div>
        </div>

        <!-- Step 1: STARTER (bottom-left) -->
        <div style="position: absolute; bottom: 130px; left: 50px; z-index: 10; text-align: center;">
            <!-- Level badge -->
            <div style="background: linear-gradient(145deg, #4CAF50, #388E3C); padding: 8px 20px; border-radius: 20px; display: inline-block; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(76,175,80,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; color: white; letter-spacing: 2px;">STARTER</span>
            </div>
            <!-- Worksheet card -->
            <div style="position: relative;">
                <div style="width: 185px; height: 240px; background: white; border-radius: 12px; box-shadow: 0 12px 35px rgba(0,0,0,0.4), 0 0 20px rgba(76,175,80,0.2); overflow: hidden; border: 4px solid #4CAF50;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/subtraction/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Starter worksheet">
                </div>
                <!-- Green glow -->
                <div style="position: absolute; inset: -15px; background: radial-gradient(ellipse, rgba(76,175,80,0.12) 0%, transparent 60%); z-index: -1; border-radius: 25px;"></div>
            </div>
            <!-- Range badge -->
            <div style="margin-top: 10px; background: rgba(76,175,80,0.15); border: 2px solid #4CAF50; padding: 6px 16px; border-radius: 14px; display: inline-block;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: #4CAF50;">1 - 5</span>
            </div>
            <!-- Star rating -->
            <div style="margin-top: 6px;">
                <span style="font-size: 20px; color: #FFE082; text-shadow: 0 0 6px rgba(255,224,130,0.5);">&#9733;</span>
                <span style="font-size: 20px; color: rgba(255,255,255,0.2);">&#9733;</span>
                <span style="font-size: 20px; color: rgba(255,255,255,0.2);">&#9733;</span>
            </div>
        </div>

        <!-- Step 2: EXPLORER (center) -->
        <div style="position: absolute; bottom: 270px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center;">
            <!-- Level badge -->
            <div style="background: linear-gradient(145deg, #FF9800, #EF6C00); padding: 8px 22px; border-radius: 20px; display: inline-block; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(255,152,0,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; color: white; letter-spacing: 2px;">EXPLORER</span>
            </div>
            <!-- Worksheet card -->
            <div style="position: relative;">
                <div style="width: 200px; height: 259px; background: white; border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,0.45), 0 0 25px rgba(255,152,0,0.2); overflow: hidden; border: 4px solid #FF9800;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/subtraction/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Explorer worksheet">
                </div>
                <div style="position: absolute; inset: -18px; background: radial-gradient(ellipse, rgba(255,152,0,0.12) 0%, transparent 60%); z-index: -1; border-radius: 28px;"></div>
            </div>
            <!-- Range badge -->
            <div style="margin-top: 10px; background: rgba(255,152,0,0.15); border: 2px solid #FF9800; padding: 6px 16px; border-radius: 14px; display: inline-block;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 19px; color: #FF9800;">1 - 10</span>
            </div>
            <!-- Star rating -->
            <div style="margin-top: 6px;">
                <span style="font-size: 20px; color: #FFE082; text-shadow: 0 0 6px rgba(255,224,130,0.5);">&#9733;</span>
                <span style="font-size: 20px; color: #FFE082; text-shadow: 0 0 6px rgba(255,224,130,0.5);">&#9733;</span>
                <span style="font-size: 20px; color: rgba(255,255,255,0.2);">&#9733;</span>
            </div>
        </div>

        <!-- Step 3: CHAMPION (top-right) -->
        <div style="position: absolute; top: 130px; right: 60px; z-index: 10; text-align: center;">
            <!-- Crown above badge -->
            <div style="margin-bottom: 4px;">
                <span style="font-size: 32px; filter: drop-shadow(0 0 8px rgba(255,224,130,0.6));">&#128081;</span>
            </div>
            <!-- Level badge -->
            <div style="background: linear-gradient(145deg, #C2185B, #AD1457); padding: 9px 24px; border-radius: 20px; display: inline-block; margin-bottom: 10px; box-shadow: 0 4px 14px rgba(194,24,91,0.5);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 2px;">CHAMPION</span>
            </div>
            <!-- Worksheet card -->
            <div style="position: relative;">
                <div style="width: 220px; height: 285px; background: white; border-radius: 12px; box-shadow: 0 16px 45px rgba(0,0,0,0.5), 0 0 30px rgba(194,24,91,0.2); overflow: hidden; border: 4px solid #C2185B;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/subtraction/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Champion worksheet">
                </div>
                <div style="position: absolute; inset: -20px; background: radial-gradient(ellipse, rgba(194,24,91,0.12) 0%, transparent 60%); z-index: -1; border-radius: 30px;"></div>
            </div>
            <!-- Range badge -->
            <div style="margin-top: 10px; background: rgba(194,24,91,0.15); border: 2px solid #C2185B; padding: 6px 16px; border-radius: 14px; display: inline-block;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: #C2185B;">1 - 20</span>
            </div>
            <!-- Star rating -->
            <div style="margin-top: 6px;">
                <span style="font-size: 22px; color: #FFE082; text-shadow: 0 0 8px rgba(255,224,130,0.6);">&#9733;</span>
                <span style="font-size: 22px; color: #FFE082; text-shadow: 0 0 8px rgba(255,224,130,0.6);">&#9733;</span>
                <span style="font-size: 22px; color: #FFE082; text-shadow: 0 0 8px rgba(255,224,130,0.6);">&#9733;</span>
            </div>
        </div>

        <!-- Floating number bubbles along the path -->
        <div style="position: absolute; bottom: 200px; left: 280px; width: 42px; height: 42px; background: rgba(179,157,219,0.2); border: 2px solid rgba(179,157,219,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #B39DDB;">3</span>
        </div>
        <div style="position: absolute; bottom: 340px; left: 420px; width: 38px; height: 38px; background: rgba(255,224,130,0.15); border: 2px solid rgba(255,224,130,0.35); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: #FFE082;">7</span>
        </div>
        <div style="position: absolute; top: 280px; right: 310px; width: 36px; height: 36px; background: rgba(194,24,91,0.15); border: 2px solid rgba(194,24,91,0.35); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; color: #C2185B;">15</span>
        </div>

        <!-- Bottom bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(90deg, rgba(74,14,78,0.9) 0%, rgba(45,27,61,0.9) 100%); padding: 20px 0; border-top: 3px solid rgba(255,224,130,0.3);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: rgba(255,255,255,0.9); letter-spacing: 3px;">DIFFERENTIATED PRACTICE FOR EVERY LEARNER</span>
            </div>
        </div>

    </div>
</body>
</html>
