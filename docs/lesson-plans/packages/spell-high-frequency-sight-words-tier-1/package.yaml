compositionalRationale:
  en: |
    Primary strand: early-literacy / spelling-and-encoding (sight word
    spelling). Secondary strand: vocabulary acquisition. Tertiary
    strand: reading fluency (sight words drive reading-speed +
    automaticity).

    Architectural significance: deepens spelling-and-encoding strand
    1/5 → 2/5. Resolves Arc 12 spell-cvc-words forward-pointer.
    Sight words are non-CVC — pattern-irregular high-frequency words
    that resist phonics-decoding (the, of, you don't follow CVC rule).
    Memorization-via-repetition is the canonical strategy.

    K-3 multilingual classroom relevance: en sight words target-
    language-specific. Locale sparse-overrides handle locale-specific
    high-frequency words (es high-frequency: el, la, es, y, yo;
    pt-BR: o, a, é, e, eu; etc.).

curriculumStandards:
  - CCSS.K.RF.3.C
  - CCSS.1.RF.3.G
  - EYFS.ELG.LIT
  - IB-PYP.HowWeExpressOurselves

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Read 8 of 10 tier-1 sight words instantly (no sounding-out)
        in 9 of 10 trials.
      - Spell 8 of 10 tier-1 sight words from dictation in 8 of 10
        trials.
      - Recognize tier-1 sight words within sentences in 7 of 10 trials.

    Differentiation:
    - Pre-K: 5 sight words (the, is, a, I, to); receptive recognition.
    - K: 10 sight words; receptive + productive spelling.
    - Grade 1+: extend to spell-high-frequency-sight-words-tier-2
      (Arc 14+ candidate); bridge to fluent reading.

