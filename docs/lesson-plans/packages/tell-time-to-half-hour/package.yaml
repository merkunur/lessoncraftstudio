compositionalRationale:
  en: |
    Primary strand: math / measurement (tell time to the
    half-hour on an analog clock — completes canonical
    tell-time pair within measurement strand). Secondary
    strand: math / time-and-routine (parallel framing —
    see cross-reference below). Tertiary strand:
    vocabulary-acquisition (half-past, halfway, between).

    Architectural significance: completes the measurement-
    strand tell-time canonical pair opened by tell-time-
    to-the-hour (Slot 1). Per learning-targets.json `tell-
    time-to-half-hour` is a distinct canonical target with
    `tell-time-to-the-hour` as prerequisite. The two
    packages together cover 2 of 3 tell-time canonical
    targets (tell-time-to-quarter-hour, CCSS.2.MD.C.7, is
    the 3rd; deferred to Phase 1.5+).

    Cross-reference to read-time-on-analog-clock (Arc 15
    Phase 1) and to tell-time-to-the-hour (Slot 1): same
    framing as Slot 1 — the existing read-time-on-analog-
    clock package saturates the cognitive-and-executive-
    function / time-and-routine strand AND covers both
    hour + half-hour pedagogically; Phase 1.4's tell-time
    pair coexists as parallel measurement-strand framing.
    See Slot 1 compositionalRationale for the full
    framing-distinction documentation; this package
    inherits that framing distinction.

    Pair partner: tell-time-to-the-hour (Slot 1 of Phase
    1.4). Shares material infrastructure (clock-mat,
    clock-pieces mode, time-format labelDisplay), shares
    composition shape, differs only in time-content
    (half-hour times instead of hour-only times). The
    pair-coherent structure mirrors Phase 1.2 add-2-
    digit + subtract-2-digit pair and Phase 1.3
    decompose-tens-and-ones + identify-tens-and-ones
    sibling pair — measurement-strand work follows the
    same pair-coherent ship pattern.

    Distinctive composition: 2 matching + 1 chart-count
    + 1 math-puzzle + 1 math-worksheet — same shape as
    Slot 1 with content adjusted for half-hour scope.
    Chart-count at position 2 surfaces the hour-AND-half-
    hour sequence (1:00, 1:30, 2:00, 2:30...) which
    visually shows half-hour positions as the midpoint
    between consecutive hours. The mixed-time matching
    at consolidation (position 4) distinguishes o'clock
    from half-past — the load-bearing diagnostic skill
    that tests whether kids really internalized the
    minute-hand-position distinction.

    Materials note: same canonical clock-reading material
    set as Slot 1 (clock-mat + clock-pieces manipulative-
    cut-outs + time-format flashcards). The materials
    infrastructure for clock-reading is shared across
    both tell-time packages.

    Class B FLEXIBLE substrate: composes against
    miscellaneous theme (pair-coherent with Slot 1).

    K-3 multilingual classroom relevance: half-hour
    reading universal across K-3 + locale-portable
    conceptually. The spoken time-expression for half-
    past varies significantly across locales — and one
    locale-specific idiom is particularly tricky:
    - en 'half-past 3' = 3:30 (HALF PAST the previous
      hour)
    - de 'halb 4' (literally 'half 4') = 3:30 (HALF
      TOWARD the next hour — German uses the upcoming
      hour, NOT the past hour!)
    - es 'tres y media' (literally 'three and half') =
      3:30
    - pt 'três e meia' (literally 'three and half') =
      3:30
    - fr 'trois heures et demie' (literally 'three hours
      and half') = 3:30
    - fi 'puoli neljä' (literally 'half four') = 3:30
      (Finnish, like German, uses the UPCOMING hour!)
    The de + fi idiom is the cross-locale teaching
    challenge: kids who know en 'half-past' must remember
    that de 'halb 4' = 3:30 NOT 4:30. This is a notable
    locale-variant adaptation at Phase 3+. Locale-variant
    work adapts to each locale's half-past convention.

