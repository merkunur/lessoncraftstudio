compositionalRationale:
  en: |
    Primary strand: world-knowledge / living-things (plant anatomy +
    function). Secondary strand: vocabulary acquisition (plant-part
    vocab). Tertiary strand: scientific reasoning (parts have
    functions; structure-function connection foundational science).

    Architectural significance: deepens living-things strand 4/6 → 5/6.
    Resolves Arc 10 describe-plant-life-cycle forward-pointer.
    Strand cohort: classify-animals-by-diet (Arc 5) + classify-animals-
    by-habitat (Arc 5) + describe-plant-life-cycle (Arc 10) + identify-
    living-vs-nonliving (Arc 11) + identify-plant-parts (this package).
    5/6 packages; 1 unauthored remaining (describe-butterfly-life-cycle).

    K-3 multilingual classroom relevance: plant-part vocabulary high-
    frequency K-3 science target across 11 platform locales; cognate-
    rich Romance (raíz/raiz/racine; flor/flor/fleur).

