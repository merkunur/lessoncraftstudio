# Teaching package — identify and continue AAB / ABB patterns
# Arc 7 Phase 1 (Path B; pattern-recognition strand). Companion to identify-AB-
# pattern (same Phase 1). 3-element repeating patterns with double-then-single
# (AAB) or single-then-double (ABB) structure. Class B FLEXIBLE; vocab-anchored.

targetSlug: identify-AAB-ABB-patterns
language: en
title:
  en: "AAB and ABB Patterns — 3-element repeating patterns with doubling"
description:
  en: "Kindergarten cognitive-and-executive-function package teaching AAB and ABB pattern recognition. Builds on identify-AB-pattern (Arc 7 Phase 1 companion). 3-element patterns require holding more rule complexity in working memory: AAB = double-then-single (cat-cat-dog-cat-cat-dog); ABB = single-then-double (cat-dog-dog-cat-dog-dog). Vocab-anchored. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher reviews AB pattern (from
      identify-AB-pattern), then introduces AAB. "Now watch — I'll do
      a NEW pattern: cat, cat, dog, cat, cat, dog, cat, cat, ?" Class
      predicts "dog." Repeat with ABB: "cat, dog, dog, cat, dog, dog,
      cat, dog, ?" Class predicts "dog" (the double pattern continues).
      Reinforces the double-element pattern types. Pin to "Patterns"
      word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine. Teacher displays AAB and ABB patterns mixed
      together; class identifies which type each is + continues each.
      Pair work: kid A creates an AAB OR ABB pattern with paper-cuts;
      kid B identifies the type and continues. Recast errors. Optional
      extension: kids translate body-action patterns into AAB/ABB form
      (clap-clap-stomp; clap-stomp-stomp) — embodied pattern-recognition
      with auditory rhythm.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet AAB mode (kids
      complete AAB patterns). Station 2: pattern-train worksheet ABB mode
      (kids complete ABB patterns). Station 3: pattern-worksheet mixed
      (kids identify and complete both AAB and ABB patterns; cognitive
      load of switching between pattern types). Station 4: manipulative
      cut-outs hands-on AAB/ABB construction.
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays mixed AAB and ABB
      patterns; class collectively identifies each type + completes.
      Forward-pointer: "Today we learned AAB and ABB patterns. When we
      come back to patterns next, we'll learn ABC patterns — three
      different items in repeating sequence."

