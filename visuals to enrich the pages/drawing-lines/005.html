<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">

                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: #FFD54F;">PDF</span>

                    <span style="font-size: 32px;">⚡</span>

                <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #37474F; margin: 0;">Zero Prep</p>

            <!-- Gold accent line top -->
            <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent 0%, #FFC107 20%, #FFD54F 50%, #FFC107 80%, transparent 100%);"></div>

        <div style="position: absolute; top: 160px; left: 50px; width: 40px; height: 40px; border: 3px solid #C5CAE9; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; top: 180px; left: 70px; width: 20px; height: 20px; border: 2px solid #9FA8DA; border-radius: 50%; opacity: 0.4;"></div>
        <div style="position: absolute; top: 160px; right: 50px; width: 40px; height: 40px; border: 3px solid #C5CAE9; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; top: 180px; right: 70px; width: 20px; height: 20px; border: 2px solid #9FA8DA; border-radius: 50%; opacity: 0.4;"></div>

        <div style="position: absolute; bottom: 220px; right: 100px; width: 5px; height: 5px; background: #FFD54F; border-radius: 50%; opacity: 0.5;"></div>
