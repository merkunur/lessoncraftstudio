# Teaching package — identify basic 2D shapes
# Arc 5 Phase 2 (early-numeracy / geometry strand). Foundational geometry;
# 4-key cluster: circle, square, triangle, rectangle. CLEAN against
# IMAGE_VOCABULARY (all 4 shapes have full 11-locale entries). No
# prerequisites; first geometry-strand package in the catalog.

targetSlug: identify-2d-shapes-basic
language: en
title:
  en: "Basic 2D Shapes — identify circle, square, triangle, rectangle"
description:
  en: "Kindergarten geometry package teaching identification of the 4 foundational 2D shapes: circle, square, triangle, rectangle. The first geometry-strand package in the catalog. 5 worksheet exercises + 7 printable materials over a 1-week unit. Theme-agnostic at the package layer; rendered against the shapes theme at material-render time."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up large paper-cut shapes, names
      each in target language ("This is a circle. Circle has no corners. This
      is a square. Square has 4 corners and 4 equal sides."). Class repeats
      chorally. Sensory engagement: kids trace shape outlines in the air with
      one finger as the teacher names each. Pin shape cards to the "Shapes"
      area of the math word wall.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("This is a {shape}"). Choral
      reading first, then individual reads. Shape hunt around the classroom:
      kids find real-world objects matching each shape (clock = circle; book
      = rectangle; door-sign = triangle; window = square). Pair work: kid A
      points at a real-world shape; kid B names it.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: shadow-match worksheet (match each shape
      to its outline silhouette — pure shape-recognition without color cues).
      Station 2: find-and-count worksheet (count how many circles / squares
      / triangles / rectangles are in a busy shape grid). Station 3:
      manipulative cut-outs sorting (sort paper-cut shapes onto labeled
      mats: circles here, squares there, triangles here, rectangles here).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher says a shape name; kids draw it in
      the air with one finger. Forward-pointer: "Today we learned 4 basic
      shapes. When we come back to shapes next, we'll add more shapes —
      stars, hearts, diamonds, and more — to our shape vocabulary."

