compositionalRationale:
  en: |
    Primary strand: world-knowledge / time-and-routine (months-of-year
    recognition + sequencing). Secondary strand: vocabulary acquisition
    (vocab-anchored — month names). Tertiary strand: cyclic + seasonal
    reasoning (kids connect months to year-cycle + seasons).

    Architectural significance: deepens time-and-routine strand 1/4 →
    2/4. RESOLVES Arc 10 identify-days-of-week forward-pointer.
    **Closes last single-package strand from Arc 11 close.**

    Distinctive composition: 3 matching exercises + 1 word-scramble +
    1 word-guess. weather theme used as best-available proxy for month
    imagery. The 5-exercise composition targets month knowledge
    multi-angle (recognition, spelling, recall, exclusion).

    Cross-strand integration: time-and-routine + vocabulary +
    sequencing + cyclic reasoning + seasonal-context (Arc 10
    identify-four-seasons composes). Calendar-time knowledge is
    foundational K-3 classroom-context.

    Class B FLEXIBLE substrate: composes against weather theme +
    available image library. Substrate-readiness universal.

    K-3 multilingual classroom relevance: month names are mid-
    frequency K-3 target across all 11 platform locales (cognate-rich
    Romance: enero/janeiro/janvier/gennaio; cognate-distinct Germanic:
    Januar/januari/januari/januar/tammikuu).

