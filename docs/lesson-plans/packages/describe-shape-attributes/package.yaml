# Teaching package — describe shape attributes (sides, corners, curves)
# Arc 9 Phase 1 (Path B; early-numeracy / geometry strand). Class B FLEXIBLE;
# vocab-anchored. Builds on Arc 1+5 shape work (identify-2d-shapes-basic +
# identify-2d-shapes-extended + identify-3d-shapes) — kids now move from
# shape NAMING to shape DESCRIBING using attribute vocabulary (sides,
# corners, curves, edges, faces).

targetSlug: describe-shape-attributes
language: en
title:
  en: "Shape Attributes — count sides, find corners, name curves"
description:
  en: "Kindergarten / Grade 1 early-numeracy package teaching shape-attribute description. Builds on Arc 1+5 shape work (identify-2d-shapes-basic + identify-2d-shapes-extended + identify-3d-shapes) — kids now move from shape NAMING to shape DESCRIBING using attribute vocabulary (sides, corners, curves, faces, edges). Productive-language target: kids articulate shape attributes ('a triangle has 3 sides and 3 corners'). Pairs with Phase 2 multilingual-language-awareness work where attribute vocabulary surfaces across locales. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class shape-attribute introduction. Teacher displays a
      large triangle on the board. "What can we say about this
      triangle? Let's count its SIDES." Class counts: 1, 2, 3. "How
      many CORNERS?" Class counts: 1, 2, 3. Repeat with square
      (4 sides + 4 corners), circle (curve, no sides, no corners),
      rectangle (4 sides + 4 corners). Reinforces attribute
      vocabulary: sides, corners, curves.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + describe-and-listen routine. Each pair receives 8-10
      shape cards. Pair takes turns: kid A describes a shape using
      attributes ("3 sides, 3 corners, all sides equal"); kid B
      identifies which shape matches the description without seeing
      it. Recast errors with explanation ("you said a square has 5
      corners — let's count: 1, 2, 3, 4 — 4 corners. Each corner is
      where 2 sides meet"). Optional extension: kids construct shapes
      from manipulative cut-out sides + count their attributes.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (shape-name pairs;
      reinforces shape-vocabulary base). Station 2: matching worksheet
      with attribute-cards (e.g., '4 sides, 4 corners' card matched to
      square card). Station 3: manipulative cut-outs hands-on shape-
      construction (kids assemble shapes from cut-out sides + count
      sides/corners). Station 4: sentence-strips (kids fill in attribute
      sentences: 'A triangle has ___ sides and ___ corners').
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher describes a shape using only
      attributes ("3 sides, 3 corners"); class identifies the shape.
      Reverse: teacher names a shape; class describes its attributes.
      Forward-pointer: "Today we described 2D shapes by their sides and
      corners. When we come back to shapes next, we'll describe 3D
      shapes — by their faces, edges, and vertices — building from
      flat shapes to solid shapes."

