# Teaching package — identify and name 10 zoo animals (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 4 Phase 2 authoring per Arc 3 Phase 2 sparse-override
# pattern). Validator deep-merges with package.yaml canonical at validation time.
#
# Brazilian Portuguese register per CLAUDE.md §6 (pt = BR canonical). Formal
# "você" address per §17.9 cross-locale teacher-address-register lock.

title:
  pt: "Animais de zoológico — identifica e nomeia 10"
description:
  pt: "Pacote de aquisição de vocabulário para K-Primeiro Ano sobre 10 animais de zoológico icônicos: leão, tigre, elefante, girafa, zebra, macaco, panda, canguru, pinguim, coala. Compõe 5 exercícios de folha de exercícios e 8 materiais imprimíveis. Tema-agnóstico; o operador seleciona o idioma de instrução ao renderizar os materiais."

structure:
  warmup:
    body: |
      Apresentação para toda a turma. A professora ou o professor levanta os
      cartões didáticos, nomeia cada animal em português, a turma repete em
      coro. Opcional: rodada de imitação de sons de animais (o leão ruge, o
      macaco grita, o elefante trompeteia) — ponte de alto engajamento. Fixe
      os cartões no mural de palavras agrupados em "Animais de zoológico".
  contentActivity:
    body: |
      Rotina de mural de bolso com tiras de frases ("Vejo um leão", "Vejo uma
      girafa", etc.). Primeiro leitura coral, depois leituras individuais.
      Trabalho em duplas: as crianças seguram um cartão de imagem, o colega
      nomeia o animal. Refraseie os erros na estrutura modelo. Extensão
      opcional: pergunta "onde mora este animal?" conectando aos habitats
      (savana / floresta / Ártico / Austrália).
  scaffold:
    body: |
      Rotação de estações. Estação 1: emparelhamento imagem-letra (aplicativo
      matching, modo letra). Estação 2: classificação de cartões de imagem no
      tapete (animais grandes vs animais pequenos — classificação por atributo
      tamanho; ou listras/manchas/sem-listras, classificação por padrão).
      Estação 3: recortes manipulativos para contar ("conte 4 leões").
  closure:
    body: |
      Compartilhamento com toda a turma. Desafio final: a professora ou o
      professor nomeia um animal, as crianças apontam para o cartão. Indicador
      adiante: "Hoje aprendemos 10 nomes de animais de zoológico. Quando
      voltarmos aos animais de zoológico na próxima vez, este mesmo conjunto
      estará aqui para nós."

assessmentCriteria:
  pt: |
    Receptivo 10/10; produtivo 8/10; uso de estrutura 6/10.

    Diferenciação:
      - Pré-K: apenas receptivo (apontar-para-animal-de-zoológico-nomeado).
      - K / Primeiro ano: produção completa + uso da estrutura de frases.
      - Segundo ano em diante: estender para emparelhamento de habitat
        ("o leão vive na savana / o pinguim vive no frio Antártico") +
        descrição de característica do animal ("a girafa tem o pescoço
        comprido") + comparação simples ("qual é maior, o elefante ou
        o canguru?").

compositionalRationale:
  pt: |
    Fio principal: aquisição de vocabulário. Fio secundário: fonética
    (matching modo letra). Fio terciário: classificação + categorização
    (classificação por atributo tamanho + classificação por padrão de
    pelo do animal).

    Reconhecimento da variação cultural (disciplina do Arc 4 Phase 1): a
    instituição "zoológico" é uma convenção ocidental. Algumas culturas podem
    não ter zoológicos físicos, ou podem ter instituições de vida selvagem
    organizadas de forma diferente (por exemplo, santuários de vida silvestre,
    parques nacionais). O pacote foca no reconhecimento visual de espécies
    icônicas que as crianças encontram em livros, filmes e mídia online,
    independentemente da disponibilidade do zoológico. Igualmente válido
    enquadramento como "animais selvagens que você pode ver em um documentário"
    ou "animais famosos do mundo todo". As 10 espécies escolhidas abrangem
    continentes principais (África: leão/tigre/elefante/girafa/zebra/macaco;
    Ásia: panda; Austrália: canguru/coala; Antártida: pinguim) — dá às
    crianças um mapa-mundi implícito através do conjunto.

    Variante de tira de frases para a semana 2: this-is-a ("Este é um leão")
    cresce naturalmente de i-see-a (semana 1) em direção à descrição
    declarativa. Ambas se estendem para descrição de cor/tamanho/característica
    no Primeiro ano em diante ("Este é um leão grande / O leão tem juba").
