                <div style="position: absolute; top: -14px; right: 14px; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-bottom: 13px solid #00BCD4; z-index: -1;"></div>

        <!-- Mid-right: "So macht Lernen Spa&szlig;!" -->
        <div style="position: absolute; top: 490px; right: 30px; z-index: 35;">
            <div style="background: white; padding: 12px 18px; border-radius: 18px; border: 3px solid #F06292; box-shadow: 0 4px 14px rgba(0,0,0,0.12); position: relative; max-width: 160px;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; color: #AD1457;">So macht Lernen Spa&szlig;!</span>

                <div style="position: absolute; top: -14px; left: 17px; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-bottom: 13px solid #F06292; z-index: -1;"></div>

        <!-- CSS animal silhouettes peeking from corners -->

        <div style="position: absolute; bottom: 0; left: 30px; z-index: 8;">

            <div style="position: absolute; top: -18px; right: 5px; width: 16px; height: 22px; background: rgba(78,52,46,0.12); border-radius: 50% 50% 0 0; transform: rotate(15deg);"></div>

            <div style="width: 45px; height: 32px; background: rgba(78,52,46,0.1); border-radius: 50% 50% 0 0;"></div>

                <span style="font-size: 18px;">&#128062;</span>
