compositionalRationale:
  en: |
    Primary strand: math / measurement (duration measurement in
    hour-units; deepens strand 2/4 → 3/4). Secondary strand:
    math / time-and-routine (familiar-activity anchoring of
    duration concepts). Tertiary strand: numeracy (counting hour-
    units; estimation work).

    Architectural significance: extends Arc 15 Phase 2 measure-
    length-with-non-standard-units (which established measurement
    vocabulary + estimation routine) into the time-measurement
    domain. Companion to Arc 14 compare-by-time-duration (which
    compared durations qualitatively without unit) — this package
    establishes the QUANTITATIVE (unit-based) duration measurement
    layer. EXPLICITLY DISTINCT from existing read-time-on-analog-
    clock (Arc 14 Phase X, saturating time-and-routine strand
    4/4) — that package teaches CLOCK-MECHANIC reading (12:00,
    1:30); this package teaches DURATION MEASUREMENT (how long
    does X take in hour-units). Foundation for elapsed-time work
    + schedule reading + Arc 17+ measurement extensions
    (minutes, days, weeks).

    Distinctive composition: 1 matching + 1 math-worksheet + 1
    chart-count + 1 more-less + 1 math-puzzle. Duration-sort
    routine emphasized in contentActivity; familiar-anchor
    activities surface throughout (sleep ~10hrs, lunch ~0.5hr,
    school day ~6hrs).

    Class B FLEXIBLE substrate: composes against animals theme
    for vocabulary anchor cards (countable for chart-count work);
    duration content uses everyday-routine activities (not theme-
    specific imagery).

    K-3 multilingual classroom relevance: hour-as-duration-unit
    universal across cultures + locales. Number-word for hour
    counts (1-24) regular across most locales; "hour" word
    varies: en "hour"; de "Stunde"; es "hora"; pt "hora"; fr
    "heure"; it "ora"; sv "timme"; nl "uur"; fi "tunti". Duration
    estimation contexts (sleep / school / meal) are culturally
    universal at K-3 register. Locale-variant work at Phase 3+
    adapts to each locale's duration-vocabulary register.

