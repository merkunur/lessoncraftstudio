assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Follow 3-step direction sequences on 3×3 grid in 8 of 10 trials.
      - Follow 4-5-step sequences on 4×4 grid in 6 of 10 trials.
      - Use direction vocabulary (left/right/up/down) productively in
        8 of 10 navigation tasks.

    Differentiation:
    - Pre-K: 1-2 step sequences on 3×3 grid; strong adult support.
    - K: 3-step sequences on 3×3 grid; pair-work practice.
    - Grade 1+: 4-5+ step sequences on 4×4 grid; bridge to navigate-
      simple-maze (future-arc fine-motor-and-visual-spatial depth).

