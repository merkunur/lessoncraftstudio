<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Picture Path - Hero Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(145deg, #2E7D32 0%, #00C853 50%, #4CAF50 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Decorative dotted trail path winding around -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 1000 1000">
            <!-- Main winding trail from bottom-left to top-right -->
            <path d="M 50 850 Q 150 750 200 650 Q 250 550 180 450 Q 120 380 200 300 Q 300 200 450 180 Q 600 160 750 120 Q 850 90 950 50"
                  stroke="#8D6E63" stroke-width="6" fill="none" stroke-dasharray="20 12" opacity="0.6"/>
            <!-- Secondary decorative trail -->
            <path d="M 850 950 Q 900 850 870 750 Q 830 650 880 550"
                  stroke="#FFD600" stroke-width="4" fill="none" stroke-dasharray="15 10" opacity="0.5"/>
            <!-- Footprint dots along the trail -->
            <circle cx="100" cy="800" r="6" fill="#8D6E63" opacity="0.7"/>
            <circle cx="180" cy="700" r="5" fill="#8D6E63" opacity="0.7"/>
            <circle cx="200" cy="600" r="6" fill="#8D6E63" opacity="0.7"/>
            <circle cx="160" cy="500" r="5" fill="#8D6E63" opacity="0.7"/>
            <circle cx="180" cy="400" r="6" fill="#8D6E63" opacity="0.7"/>
            <circle cx="280" cy="300" r="5" fill="#8D6E63" opacity="0.7"/>
            <circle cx="400" cy="200" r="6" fill="#8D6E63" opacity="0.7"/>
        </svg>

        <!-- Compass decoration - top right area -->
        <div style="
            position: absolute;
            top: 180px;
            right: 50px;
            opacity: 0.25;
            z-index: 5;
        ">
            <svg width="120" height="120" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" stroke="#FFF8E1" stroke-width="3" fill="none"/>
                <circle cx="50" cy="50" r="35" stroke="#FFF8E1" stroke-width="1" fill="none"/>
                <line x1="50" y1="5" x2="50" y2="20" stroke="#FFF8E1" stroke-width="3"/>
                <line x1="50" y1="80" x2="50" y2="95" stroke="#FFF8E1" stroke-width="3"/>
                <line x1="5" y1="50" x2="20" y2="50" stroke="#FFF8E1" stroke-width="3"/>
                <line x1="80" y1="50" x2="95" y2="50" stroke="#FFF8E1" stroke-width="3"/>
                <polygon points="50,15 45,40 55,40" fill="#FFD600"/>
                <polygon points="50,85 45,60 55,60" fill="#FFF8E1"/>
                <text x="50" y="12" text-anchor="middle" fill="#FFF8E1" font-size="10" font-weight="bold">N</text>
            </svg>
        </div>

        <!-- FREE Badge - Top Left -->
        <div style="
            position: absolute;
            top: 40px;
            left: 40px;
            transform: rotate(-12deg);
            z-index: 20;
        ">
            <div style="
                background: linear-gradient(135deg, #FFD600 0%, #FFC107 100%);
                color: #2E7D32;
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 32px;
                padding: 14px 28px;
                border-radius: 12px;
                box-shadow: 0 6px 20px rgba(255, 214, 0, 0.5), inset 0 2px 0 rgba(255,255,255,0.3);
                text-transform: uppercase;
                letter-spacing: 2px;
            ">FREE</div>
        </div>

        <!-- Grade Badge - Top Right -->
        <div style="
            position: absolute;
            top: 50px;
            right: 40px;
            background: linear-gradient(135deg, #8D6E63 0%, #6D4C41 100%);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 24px;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(109, 76, 65, 0.4);
            z-index: 20;
        ">GRADES K-3</div>

        <!-- Main Title -->
        <div style="
            position: absolute;
            top: 130px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 72px;
                color: #FFF8E1;
                margin: 0;
                text-shadow: 0 4px 15px rgba(0,0,0,0.3), 0 2px 0 rgba(0,0,0,0.2);
                letter-spacing: -1px;
            ">PICTURE</h1>
            <h2 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 68px;
                color: #FFD600;
                margin: -8px 0 0 0;
                text-shadow: 0 3px 10px rgba(0,0,0,0.2);
            ">PATHWAY</h2>
        </div>

        <!-- START Flag - Bottom Left of worksheet -->
        <div style="
            position: absolute;
            left: 160px;
            top: 680px;
            z-index: 20;
        ">
            <svg width="80" height="80" viewBox="0 0 100 100">
                <!-- Flag pole -->
                <rect x="15" y="20" width="6" height="70" fill="#8D6E63" rx="2"/>
                <!-- Flag -->
                <path d="M 21 20 L 80 35 L 21 55 Z" fill="#FFD600"/>
                <text x="45" y="42" font-family="Fredoka, sans-serif" font-size="14" font-weight="700" fill="#2E7D32">START</text>
            </svg>
        </div>

        <!-- FINISH Star - Top Right of worksheet -->
        <div style="
            position: absolute;
            right: 140px;
            top: 280px;
            z-index: 20;
        ">
            <svg width="90" height="90" viewBox="0 0 100 100">
                <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40"
                         fill="#FFD600" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))"/>
                <text x="50" y="58" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="12" font-weight="700" fill="#2E7D32">FINISH</text>
            </svg>
        </div>

        <!-- Main Worksheet Display - Center -->
        <div style="
            position: absolute;
            top: 300px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        ">
            <div style="
                background: white;
                padding: 12px;
                border-radius: 12px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.35), 0 8px 25px rgba(0,0,0,0.25);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/picture%20path/sample-1.jpeg"
                    alt="Picture Path Worksheet Sample"
                    style="
                        width: 320px;
                        height: 414px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 6px;
                        display: block;
                    "
                />
            </div>
        </div>

        <!-- Footprint decorations scattered -->
        <div style="position: absolute; left: 80px; top: 600px; opacity: 0.4; z-index: 5;">
            <svg width="30" height="40" viewBox="0 0 30 40">
                <ellipse cx="15" cy="25" rx="10" ry="14" fill="#FFF8E1"/>
                <circle cx="8" cy="8" r="4" fill="#FFF8E1"/>
                <circle cx="17" cy="5" r="3" fill="#FFF8E1"/>
                <circle cx="24" cy="10" r="3" fill="#FFF8E1"/>
            </svg>
        </div>
        <div style="position: absolute; right: 100px; bottom: 180px; opacity: 0.35; transform: rotate(25deg); z-index: 5;">
            <svg width="30" height="40" viewBox="0 0 30 40">
                <ellipse cx="15" cy="25" rx="10" ry="14" fill="#FFF8E1"/>
                <circle cx="8" cy="8" r="4" fill="#FFF8E1"/>
                <circle cx="17" cy="5" r="3" fill="#FFF8E1"/>
                <circle cx="24" cy="10" r="3" fill="#FFF8E1"/>
            </svg>
        </div>

        <!-- Subtitle Banner - Bottom -->
        <div style="
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <div style="
                display: inline-block;
                background: rgba(255,248,225,0.95);
                padding: 16px 40px;
                border-radius: 50px;
                box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            ">
                <span style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 26px;
                    color: #2E7D32;
                    letter-spacing: 0.5px;
                ">Find Your Way!</span>
            </div>
        </div>

        <!-- Decorative circles -->
        <div style="
            position: absolute;
            top: 400px;
            left: 30px;
            width: 25px;
            height: 25px;
            background: #FFD600;
            border-radius: 50%;
            opacity: 0.5;
        "></div>
        <div style="
            position: absolute;
            bottom: 250px;
            right: 35px;
            width: 35px;
            height: 35px;
            background: #FFF8E1;
            border-radius: 50%;
            opacity: 0.4;
        "></div>
    </div>
</body>
</html>
