<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Code Breaker Addition - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #81D4FA 0%, #B3E5FC 40%, #E1F5FE 100%); overflow: hidden;">

        <!-- Confetti explosion - lots of colorful pieces -->

        <div style="position: absolute; top: 50px; left: 120px; width: 18px; height: 18px; background: #E53935; border-radius: 50%; opacity: 0.9;"></div>
        <div style="position: absolute; top: 180px; left: 60px; width: 12px; height: 12px; background: #E53935; transform: rotate(45deg); opacity: 0.8;"></div>
        <div style="position: absolute; top: 300px; left: 30px; width: 20px; height: 8px; background: #E53935; border-radius: 4px; transform: rotate(-20deg); opacity: 0.7;"></div>
        <div style="position: absolute; top: 120px; right: 100px; width: 16px; height: 16px; background: #E53935; border-radius: 50%; opacity: 0.85;"></div>

        <!-- Yellow confetti -->
        <div style="position: absolute; top: 80px; left: 250px; width: 15px; height: 15px; background: #FFD600; border-radius: 50%; opacity: 0.9;"></div>
        <div style="position: absolute; top: 200px; right: 180px; width: 20px; height: 8px; background: #FFD600; border-radius: 4px; transform: rotate(30deg); opacity: 0.8;"></div>
        <div style="position: absolute; top: 350px; right: 50px; width: 14px; height: 14px; background: #FFD600; transform: rotate(60deg); opacity: 0.75;"></div>
        <div style="position: absolute; bottom: 350px; left: 80px; width: 16px; height: 16px; background: #FFD600; border-radius: 50%; opacity: 0.85;"></div>

        <!-- Purple confetti -->
        <div style="position: absolute; top: 100px; left: 400px; width: 14px; height: 14px; background: #7B1FA2; border-radius: 50%; opacity: 0.85;"></div>
        <div style="position: absolute; top: 250px; left: 100px; width: 18px; height: 8px; background: #7B1FA2; border-radius: 4px; transform: rotate(-40deg); opacity: 0.7;"></div>
        <div style="position: absolute; top: 150px; right: 250px; width: 12px; height: 12px; background: #7B1FA2; transform: rotate(15deg); opacity: 0.8;"></div>
        <div style="position: absolute; bottom: 280px; right: 100px; width: 16px; height: 16px; background: #7B1FA2; border-radius: 50%; opacity: 0.8;"></div>

        <!-- Green confetti -->
        <div style="position: absolute; top: 60px; right: 350px; width: 16px; height: 16px; background: #43A047; border-radius: 50%; opacity: 0.9;"></div>
        <div style="position: absolute; top: 220px; right: 80px; width: 14px; height: 14px; background: #43A047; transform: rotate(30deg); opacity: 0.75;"></div>
        <div style="position: absolute; bottom: 320px; left: 150px; width: 18px; height: 8px; background: #43A047; border-radius: 4px; transform: rotate(50deg); opacity: 0.8;"></div>

        <!-- Teal confetti -->
        <div style="position: absolute; top: 130px; left: 180px; width: 14px; height: 14px; background: #00BCD4; border-radius: 50%; opacity: 0.85;"></div>
        <div style="position: absolute; top: 280px; right: 150px; width: 16px; height: 8px; background: #00BCD4; border-radius: 4px; transform: rotate(-35deg); opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 400px; right: 200px; width: 12px; height: 12px; background: #00BCD4; transform: rotate(20deg); opacity: 0.8;"></div>

        <!-- Orange confetti -->
        <div style="position: absolute; top: 170px; left: 350px; width: 15px; height: 15px; background: #FF6D00; border-radius: 50%; opacity: 0.85;"></div>
        <div style="position: absolute; top: 90px; right: 200px; width: 18px; height: 8px; background: #FF6D00; border-radius: 4px; transform: rotate(45deg); opacity: 0.75;"></div>
        <div style="position: absolute; bottom: 350px; right: 30px; width: 14px; height: 14px; background: #FF6D00; transform: rotate(-25deg); opacity: 0.8;"></div>

        <!-- Floating gold code number circles (like confetti but themed) -->
        <div style="position: absolute; top: 160px; left: 50px; width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(145deg, #FFD600 0%, #FFA000 100%); box-shadow: 0 4px 15px rgba(255,214,0,0.4); display: flex; align-items: center; justify-content: center; transform: rotate(-10deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">3</span>
        </div>
        <div style="position: absolute; top: 250px; right: 60px; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(145deg, #FFD600 0%, #FFA000 100%); box-shadow: 0 4px 12px rgba(255,214,0,0.4); display: flex; align-items: center; justify-content: center; transform: rotate(15deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">7</span>
        </div>
        <div style="position: absolute; bottom: 350px; left: 120px; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(145deg, #FFD600 0%, #FFA000 100%); box-shadow: 0 3px 10px rgba(255,214,0,0.4); display: flex; align-items: center; justify-content: center; transform: rotate(5deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">5</span>
        </div>
        <div style="position: absolute; bottom: 300px; right: 80px; width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(145deg, #FFD600 0%, #FFA000 100%); box-shadow: 0 4px 12px rgba(255,214,0,0.4); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">2</span>
        </div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #FF6D00 0%, #E65100 100%); color: white; padding: 12px 26px; font-size: 26px; font-weight: 700; font-family: 'Fredoka', sans-serif; border-radius: 30px; box-shadow: 0 5px 20px rgba(255,109,0,0.5); transform: rotate(-3deg);">FREE</div>
        </div>

        <!-- "Kids LOVE This!" badge -->
        <div style="position: absolute; top: 20px; right: 25px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #E91E63 0%, #C2185B 100%); color: white; padding: 12px 22px; border-radius: 25px; font-size: 18px; font-weight: 700; font-family: 'Nunito', sans-serif; box-shadow: 0 5px 18px rgba(233,30,99,0.4); display: flex; align-items: center; gap: 8px; transform: rotate(5deg);">
                <span style="font-size: 20px;">❤️</span> Kids LOVE This!
            </div>
        </div>

        <!-- Comic burst "MATH HAS NEVER BEEN THIS FUN!" -->
        <div style="position: absolute; top: 100px; left: 50%; transform: translateX(-50%); z-index: 60;">
            <div style="position: relative;">
                <!-- Burst background -->
                <div style="position: absolute; top: 50%; left: 50%; width: 520px; height: 130px; transform: translate(-50%, -50%); background: white; border-radius: 50%; box-shadow: 0 0 0 8px #7B1FA2, 0 10px 40px rgba(0,0,0,0.2);"></div>
                <!-- Text -->
                <div style="position: relative; z-index: 10; text-align: center; padding: 20px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; color: #7B1FA2; display: block;">MATH HAS NEVER BEEN</span>
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; color: #E53935; text-shadow: 3px 3px 0 #FFD600;">THIS FUN!</span>
                </div>
            </div>
        </div>

        <!-- Central worksheet with "cracked" effect -->
        <div style="position: absolute; top: 300px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <div style="position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.25);">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/code addition/Code Breaker Addition 1.jpeg" style="width: 360px; height: auto; border-radius: 16px; border: 8px solid white;">

                <!-- "Cracked" checkmarks overlay -->
                <div style="position: absolute; top: 80px; left: 60px; width: 35px; height: 35px; border-radius: 50%; background: linear-gradient(145deg, #43A047 0%, #2E7D32 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(67,160,71,0.4);">
                    <span style="color: white; font-size: 20px; font-weight: bold;">✓</span>
                </div>
                <div style="position: absolute; top: 150px; right: 80px; width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(145deg, #43A047 0%, #2E7D32 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(67,160,71,0.4);">
                    <span style="color: white; font-size: 18px; font-weight: bold;">✓</span>
                </div>
                <div style="position: absolute; bottom: 120px; left: 100px; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(145deg, #43A047 0%, #2E7D32 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 12px rgba(67,160,71,0.4);">
                    <span style="color: white; font-size: 22px; font-weight: bold;">✓</span>
                </div>
            </div>
        </div>

        <!-- Speech bubble "CRACK IT!" -->
        <div style="position: absolute; top: 350px; right: 60px; z-index: 70;">
            <div style="background: linear-gradient(145deg, #7B1FA2 0%, #4A148C 100%); padding: 16px 26px; border-radius: 25px; font-size: 26px; font-weight: 700; font-family: 'Fredoka', sans-serif; color: white; box-shadow: 0 6px 20px rgba(123,31,162,0.4); position: relative; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">
                CRACK IT!
                <div style="position: absolute; bottom: -16px; left: 30px; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 20px solid #4A148C;"></div>
            </div>
        </div>

        <!-- Speech bubble "WE SOLVED IT!" -->
        <div style="position: absolute; top: 450px; left: 50px; z-index: 70;">
            <div style="background: white; padding: 14px 22px; border-radius: 25px; font-size: 22px; font-weight: 700; font-family: 'Fredoka', sans-serif; color: #43A047; box-shadow: 0 6px 20px rgba(0,0,0,0.15); position: relative; border: 4px solid #43A047;">
                WE SOLVED IT!
                <div style="position: absolute; bottom: -18px; right: 30px; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 22px solid #43A047;"></div>
                <div style="position: absolute; bottom: -10px; right: 33px; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 16px solid white;"></div>
            </div>
        </div>

        <!-- Celebration emojis -->
        <div style="position: absolute; top: 280px; left: 100px; font-size: 40px; transform: rotate(-10deg);">🎉</div>
        <div style="position: absolute; top: 260px; right: 120px; font-size: 35px; transform: rotate(15deg);">🎊</div>
        <div style="position: absolute; bottom: 230px; left: 200px; font-size: 32px; transform: rotate(-5deg);">✨</div>
        <div style="position: absolute; bottom: 220px; right: 180px; font-size: 38px; transform: rotate(8deg);">🌟</div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.9) 40%, white 100%);">
            <div style="position: absolute; bottom: 25px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 25px;">
                <div style="background: linear-gradient(135deg, #7B1FA2 0%, #4A148C 100%); color: white; padding: 14px 28px; border-radius: 30px; font-size: 22px; font-weight: 700; font-family: 'Fredoka', sans-serif; box-shadow: 0 5px 20px rgba(123,31,162,0.4);">Classroom Fun!</div>
                <div style="background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%); color: white; padding: 14px 22px; border-radius: 30px; font-size: 18px; font-weight: 700; font-family: 'Nunito', sans-serif; box-shadow: 0 5px 18px rgba(0,188,212,0.4);">GRADES K-2</div>
            </div>
        </div>

    </div>
</body>
</html>
