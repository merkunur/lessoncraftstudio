<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Draw and Color - Professional Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(160deg, #2D2D2D 0%, #1a1a1a 50%, #0f0f0f 100%);">

        <!-- Velvet texture overlay -->
        <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(212,164,57,0.06) 0%, transparent 50%);"></div>

        <!-- Spotlight beams for gallery lighting -->
        <div style="position: absolute; top: -150px; left: 25%; width: 350px; height: 800px; background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%); transform: rotate(-12deg); pointer-events: none;"></div>
        <div style="position: absolute; top: -100px; left: 45%; width: 250px; height: 900px; background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, transparent 100%); transform: rotate(0deg); pointer-events: none;"></div>
        <div style="position: absolute; top: -150px; right: 20%; width: 350px; height: 800px; background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 100%); transform: rotate(12deg); pointer-events: none;"></div>

        <!-- FREE Badge - Ticket Punch Style -->
        <div style="position: absolute; top: 28px; left: 28px; z-index: 30;">
            <div style="width: 90px; height: 90px; background: linear-gradient(145deg, #D4A439 0%, #A07B1A 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 30px rgba(212,164,57,0.5), inset 0 2px 0 rgba(255,255,255,0.3); position: relative;">
                <!-- Ticket punch holes -->
                <div style="position: absolute; top: 50%; left: -4px; transform: translateY(-50%); width: 10px; height: 10px; background: #2D2D2D; border-radius: 50%;"></div>
                <div style="position: absolute; top: 50%; right: -4px; transform: translateY(-50%); width: 10px; height: 10px; background: #2D2D2D; border-radius: 50%;"></div>
                <span style="font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; color: #2D2D2D; text-shadow: 0 1px 0 rgba(255,255,255,0.3);">FREE</span>
            </div>
        </div>

        <!-- GRADES Badge -->
        <div style="position: absolute; top: 35px; right: 35px; z-index: 30;">
            <div style="background: linear-gradient(145deg, #FFF8E1 0%, #F5E6C8 100%); padding: 12px 26px; border-radius: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 800; color: #2D2D2D; letter-spacing: 1px;">GRADES PreK-2</span>
            </div>
        </div>

        <!-- Main Headline -->
        <div style="position: absolute; top: 95px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 20;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 72px; font-weight: 700; color: #FFF8E1; text-shadow: 0 4px 25px rgba(0,0,0,0.5); letter-spacing: -1px;">Draw and Color</h1>
            <h2 style="margin: 5px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 42px; font-weight: 600; color: #D4A439; text-shadow: 0 2px 15px rgba(212,164,57,0.4);">Worksheets Bundle</h2>
        </div>

        <!-- Tagline -->
        <div style="position: absolute; top: 215px; left: 50%; transform: translateX(-50%); z-index: 20;">
            <p style="margin: 0; font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700; color: rgba(255,248,225,0.6); letter-spacing: 5px; text-transform: uppercase;">TEACHER-READY QUALITY</p>
        </div>

        <!-- Gallery Wall Display -->
        <div style="position: absolute; top: 280px; left: 50%; transform: translateX(-50%); display: flex; gap: 45px; align-items: center; z-index: 15;">

            <!-- Left Frame (smaller) - Teal matte -->
            <div style="position: relative;">
                <!-- Ornate gold frame -->
                <div style="width: 200px; height: 270px; background: linear-gradient(145deg, #8B6914 0%, #D4A439 20%, #8B6914 40%, #D4A439 60%, #8B6914 80%, #D4A439 100%); border-radius: 8px; padding: 14px; box-shadow: 0 18px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.3);">
                    <!-- Inner matte - Teal -->
                    <div style="width: 100%; height: 100%; background: linear-gradient(145deg, #00897B 0%, #00695C 100%); border-radius: 4px; padding: 10px;">
                        <!-- Image container -->
                        <div style="width: 100%; height: 100%; background: white; border-radius: 3px; overflow: hidden; box-shadow: inset 0 0 25px rgba(0,0,0,0.1);">
                            <img src="https://www.lessoncraftstudio.com/samples/english/draw%20and%20color/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    </div>
                </div>
                <!-- Spotlight glow -->
                <div style="position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);"></div>
            </div>

            <!-- Center Frame (largest - hero) - Burgundy matte -->
            <div style="position: relative;">
                <!-- Ornate gold frame with extra detail -->
                <div style="width: 300px; height: 400px; background: linear-gradient(145deg, #8B6914 0%, #D4A439 15%, #FCD34D 30%, #D4A439 50%, #8B6914 70%, #D4A439 85%, #8B6914 100%); border-radius: 10px; padding: 18px; box-shadow: 0 25px 70px rgba(0,0,0,0.7), 0 0 50px rgba(212,164,57,0.25), inset 0 2px 0 rgba(255,255,255,0.4);">
                    <!-- Inner matte - Burgundy -->
                    <div style="width: 100%; height: 100%; background: linear-gradient(145deg, #8B1E3F 0%, #6A1730 100%); border-radius: 6px; padding: 12px; box-shadow: inset 0 0 20px rgba(0,0,0,0.3);">
                        <!-- Image container -->
                        <div style="width: 100%; height: 100%; background: white; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 35px rgba(0,0,0,0.1);">
                            <img src="https://www.lessoncraftstudio.com/samples/english/draw%20and%20color/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    </div>
                </div>
                <!-- Spotlight glow -->
                <div style="position: absolute; top: -60px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%);"></div>

                <!-- Museum Plaque -->
                <div style="position: absolute; bottom: -55px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #D4A439 0%, #8B6914 100%); padding: 10px 30px; border-radius: 4px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; color: #1a1a1a; letter-spacing: 2px; text-transform: uppercase;">The Art of Grid Drawing</span>
                </div>
            </div>

            <!-- Right Frame (smaller) - Teal matte -->
            <div style="position: relative;">
                <!-- Ornate gold frame -->
                <div style="width: 200px; height: 270px; background: linear-gradient(145deg, #8B6914 0%, #D4A439 20%, #8B6914 40%, #D4A439 60%, #8B6914 80%, #D4A439 100%); border-radius: 8px; padding: 14px; box-shadow: 0 18px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.3);">
                    <!-- Inner matte - Teal -->
                    <div style="width: 100%; height: 100%; background: linear-gradient(145deg, #00897B 0%, #00695C 100%); border-radius: 4px; padding: 10px;">
                        <!-- Image container -->
                        <div style="width: 100%; height: 100%; background: white; border-radius: 3px; overflow: hidden; box-shadow: inset 0 0 25px rgba(0,0,0,0.1);">
                            <img src="https://www.lessoncraftstudio.com/samples/english/draw%20and%20color/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    </div>
                </div>
                <!-- Spotlight glow -->
                <div style="position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);"></div>
            </div>
        </div>

        <!-- Glass-morphism Feature Cards -->
        <div style="position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; z-index: 25;">
            <!-- Print Ready -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); padding: 16px 22px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.25);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 32px; height: 32px; background: linear-gradient(145deg, #D4A439 0%, #A07B1A 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <span style="font-size: 16px;">🖨️</span>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: #FFF8E1;">Print Ready</span>
                </div>
            </div>

            <!-- Clean Line Art -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); padding: 16px 22px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.25);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 32px; height: 32px; background: linear-gradient(145deg, #00897B 0%, #00695C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <span style="font-size: 16px;">✏️</span>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: #FFF8E1;">Clean Line Art</span>
                </div>
            </div>

            <!-- Grid Method -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); padding: 16px 22px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.25);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 32px; height: 32px; background: linear-gradient(145deg, #D4A439 0%, #A07B1A 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <span style="font-size: 16px;">📐</span>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: #FFF8E1;">Grid Method</span>
                </div>
            </div>

            <!-- Cute Animals -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); padding: 16px 22px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.25);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 32px; height: 32px; background: linear-gradient(145deg, #8B1E3F 0%, #6A1730 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <span style="font-size: 16px;">🐰</span>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: #FFF8E1;">Cute Animals</span>
                </div>
            </div>
        </div>

        <!-- Bottom gold accent line -->
        <div style="position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); width: 250px; height: 3px; background: linear-gradient(90deg, transparent 0%, #D4A439 50%, transparent 100%); border-radius: 2px;"></div>

    </div>
</body>
</html>
