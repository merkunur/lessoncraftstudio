compositionalRationale:
  en: |
    Primary strand: world-knowledge / personal-social-emotional-
    development (situational emotion-recognition). Secondary strand:
    vocabulary acquisition (vocab-anchored — emotion vocabulary
    reinforced through situational application). Tertiary strand:
    speaking-and-listening (productive emotion-narration: 'I feel ___
    when ___').

    Architectural significance: FIRST personal-social-emotional-
    development strand package in the catalog. Opens 8-target strand
    for future arcs (identify-emotions-of-others-from-faces, name-
    things-i-can-do-myself, share-and-take-turns, wait-my-turn, etc.).
    SEL is research-validated as foundational for academic achievement
    + classroom-community functioning (CASEL framework; Durlak meta-
    analysis).

    Distinctive composition: matching + picture-sort + matching +
    word-guess + odd-one-out — multi-app composition spans recognition,
    classification, recall, exclusion. emotions theme used heavily
    (4 of 5 exercises) because emotion vocabulary is the primary
    surface kids practice. The picture-sort emotions-vs-animals
    exercise is structurally unusual but pedagogically meaningful —
    kids distinguish emotional states from non-emotional categories.

    Cross-strand integration: world-knowledge personal-social-emotional
    + vocabulary acquisition (Arc 1+5+6) + speaking-and-listening
    (productive language). Sentence-strips with `framePreset: i-feel`
    gives kids a structured way to talk about emotions — load-bearing
    for SEL development.

    Class B FLEXIBLE substrate: composes against emotions theme.
    Substrate-readiness universal — emotions are universal; emotional
    contexts vary culturally but core emotion categories cross-cultural.

    K-3 multilingual classroom relevance: emotional self-awareness is
    cognitively universal; emotion vocabulary is high-frequency K-3
    target across all 11 platform locales. Cross-cultural variation
    in emotional EXPRESSION (some cultures express emotions openly;
    others more reservedly) — the package's universal-emotion-categories
    framing handles this; locale-variant sparse-overrides can adapt
    cultural expression-norms (e.g., pt-BR caloroso emotional expression
    vs nordic understatement). High platform-fit.

