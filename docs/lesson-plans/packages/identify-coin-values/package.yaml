# Teaching package — identify coin values (USD canonical)
# Arc 18 Phase 1.2 (math / measurement strand — OPENS money sub-track 0/2 → 1/2). Pair-coherent ship pattern with recognize-money-amounts-up-to-1-unit (slot 3 of Phase 1.2; closes sub-track 1/2 → 2/2 SAT). Builds on Arc 12-13 count-objects-1-to-20 (number-value recognition prerequisite) + compare-quantities-more-fewer (relative-value ordering prerequisite).

targetSlug: identify-coin-values
language: en
title:
  en: "Identify Coin Values — how much is each coin worth?"

description:
  en: "Grade 2 math/measurement package OPENING the money sub-track in the measurement strand. Teaches kids to identify common US coins by their value: the PENNY (worth 1¢ / one cent), the NICKEL (worth 5¢ / five cents), the DIME (worth 10¢ / ten cents), the QUARTER (worth 25¢ / twenty-five cents), and the DOLLAR BILL (worth $1 / one dollar / 100 cents). Each coin is a DIFFERENT amount even though they're all small round metal — kids must recognize coins by appearance + know each one's value. Pair-coherent ship pattern with recognize-money-amounts-up-to-1-unit (slot 3 of Phase 1.2). Together the pair closes the money sub-track 0/2 → 2/2 SAT. CCSS.2.MD.C.8 primary anchor ('Solve word problems involving dollar bills, quarters, dimes, nickels, and pennies, using $ and ¢ symbols appropriately' — this package handles the prerequisite coin-identification layer; pair partner handles the word-problem counting layer). Per §A.13.30 K-3 informal framing: Grade 2 coin-recognition pedagogy is COIN-VALUE IDENTIFICATION (recognize coin → know value) + count-by-coin-value (count by 1s for pennies, 5s for nickels, 10s for dimes, 25s for quarters); NOT formal currency arithmetic (which is upper-elementary scope). 5 worksheet exercises + 7 printable materials over a 1-week unit. **LOCALE-MONEY-SYSTEM NOTE per operator-locked Path A at Arc 18 Phase 0 §A.13.6 firings batch:** this en package authors USD canonical (penny / nickel / dime / quarter / dollar bill); pt sibling at `package.pt.yaml` authors BRL canonical (5/10/25/50 centavos + R$1 real) with FULL OVERRIDE of materials list per §A.13.34 parallel-strand-framing. The Arc 7+ sparse-override convention is INTENTIONALLY DEPARTED for this commission to surface locale-authentic currency pedagogy."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class coin-value introduction. Teacher displays
      a real or large-printed PENNY: "This is a penny. A
      penny is worth ONE CENT. We write it as 1¢ — the
      number 1 and the cents symbol." Then a NICKEL:
      "This is a nickel. A nickel is BIGGER than a penny.
      A nickel is worth FIVE CENTS. We write it as 5¢."
      Then a DIME: "This is a dime. The dime is the
      SMALLEST coin we use — but it's worth MORE than a
      penny OR a nickel. A dime is worth TEN CENTS. We
      write it as 10¢." Then a QUARTER: "This is a
      quarter. A quarter is the BIGGEST common coin. A
      quarter is worth TWENTY-FIVE CENTS. We write it as
      25¢." Finally a DOLLAR BILL: "This is a dollar
      bill. A dollar is paper, not metal. A dollar is
      worth ONE HUNDRED CENTS — or, we say, ONE DOLLAR.
      We write it as $1 — the dollar sign and the
      number 1." Pattern emphasis: "Coins are DIFFERENT
      SIZES but the SIZE doesn't tell you the value —
      a DIME (small) is worth MORE than a NICKEL (big).
      You have to LEARN each coin's value by RECOGNIZING
      the coin: pennies are brown / copper-colored,
      nickels are bigger and silver, dimes are smaller
      and silver, quarters are bigger and silver, dollar
      bills are paper and green."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + coin-value matching routine. Each pair
      receives a set of cardboard or laminated coin
      cutouts (multiple of each: pennies, nickels, dimes,
      quarters; plus 1-2 dollar-bill cutouts) + value
      cards (1¢, 5¢, 10¢, 25¢, $1). Pair takes turns:
      kid A picks a coin from the pile; kid B identifies
      the coin + finds the matching value card. Both kids
      say aloud: "This is a [coin name]. It's worth
      [value]." Recast errors with appearance-cues ("you
      said this is a quarter, but look — it's actually a
      NICKEL. The nickel and quarter are both silver and
      round, but the QUARTER is BIGGER. Let me show you
      side by side."). Optional extension: kids sort the
      entire pile into 5 stacks (pennies, nickels, dimes,
      quarters, dollar bills) + count how many of each.
      Coin-recognition is load-bearing — kids who can't
      distinguish a nickel from a quarter will fail at
      the slot-3 word-problem work.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity —
      match each coin image to its value (penny → 1¢;
      nickel → 5¢; dime → 10¢; quarter → 25¢; dollar bill
      → $1 / 100¢). Station 2: chart-count activity —
      count by coin values (count by 1s with pennies;
      count by 5s with nickels; count by 10s with dimes;
      count by 25s with quarters). Station 3: picture-
      sort activity — sort coins by value into bins
      labeled with the coin value or coin name. Station
      4: math-worksheet activity — given a single coin
      image, write its value (1¢ / 5¢ / 10¢ / 25¢ / $1).
  closure:
    durationMinutes: 5
    body: |
      Whole-class coin-value quick-recall. Teacher
      displays a coin; class chorally names it + its
      value. "Penny! 1 cent!" "Quarter! 25 cents!"
      "Dime! 10 cents!" "Nickel! 5 cents!" "Dollar bill!
      100 cents! 1 dollar!" Teacher then poses the
      diagnostic comparison: "Which is worth more — a
      penny or a dime?" (Class: DIME!) "Which is BIGGER
      — a penny or a dime?" (Class: PENNY — but it's
      worth LESS!) "Coin size doesn't tell you coin
      value!" Forward-pointer: "Today we identified five
      coin values. Tomorrow we use these values to COUNT
      AMOUNTS — how much is 3 dimes + 2 nickels +
      1 penny? When you can COUNT amounts up to ONE
      DOLLAR, you've mastered Grade 2 money math."

