assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify faces, edges, and corners on 5 of 6 common 3D
        shapes correctly in 7 of 10 trials.
      - Use vocabulary FACE / EDGE / CORNER / VERTEX accurately
        in 7 of 10 trials.
      - Identify a 3D shape from its property list (e.g., "5
        faces + 8 edges + 5 corners = square-based pyramid") in
        6 of 10 trials.

    Differentiation:
    - Pre-K: review 3D shape names only; no property counting.
    - K: face-counting only (skip edges + corners); 3 shape types
      (cube, sphere, cylinder).
    - Grade 1: face + edge + corner counting for 5-6 shape types.
    - Grade 2+: extend to area + volume + surface-area conceptual
      foundations + bridge to formal geometric measurement work.

