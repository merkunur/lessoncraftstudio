description:
  en: "Comprehensive K-3 bundle centered on winter season concepts spanning weather + clothing + day-night cycle + seasonal classification work. 5 packages span vocabulary-acquisition (identify-and-name-clothing — winter-specific clothing + identify-and-name-weather-words — winter weather vocabulary) + cognitive classification (identify-four-seasons — winter as one of 4 seasons; identify-weather-types — winter weather variety: snowy, cold, windy) + cycle science (describe-day-night-cycle — winter has long nights and short days). Cross-strand seasonal bundle anchored in winter context for K-3 students in temperate + cold-climate regions. Suitable for a 5-week classroom unit during winter season; supports K-3 multilingual classrooms in northern-hemisphere settings during December-February or southern-hemisphere settings during June-August."

