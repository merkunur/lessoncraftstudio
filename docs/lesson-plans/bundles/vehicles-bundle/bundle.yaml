thematicCoherence:
  en: |
    All 4 packages cohere around vehicles + transportation theme.
    Pedagogical progression: receptive vocab (point-to-named-vehicle)
    → productive vocab (identify-and-name-vehicles) → classification
    (identify-transportation-types: land/water/air vehicles) → visual
    discrimination (find-hidden-target-in-busy-scene composes against
    vehicles theme).

    **Strand spread:** 2 vocabulary-acquisition + 1 world-knowledge
    transportation + 1 visual-discrimination. Multi-strand bundle
    with vehicle-theme anchor.

    **Suggested unit duration:** 3-4 weeks. Vehicle theme is high-
    interest for K-3; substrate intentionally narrower than Animals
    bundle (4 packages vs 6) reflecting smaller available substrate
    in vehicle-themed packages.

    **Multilingual classroom relevance:** vehicle vocabulary high-
    frequency K-3 target across all 11 platform locales; cognate-
    rich Romance + Germanic locales for many vehicles (auto / Auto;
    bicicleta / Fahrrad / cykel — varied roots).
