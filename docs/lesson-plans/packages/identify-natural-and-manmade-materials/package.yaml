# Teaching package — identify natural and manmade materials
# Arc 15 Phase 2 (science / materials-and-properties 0/2 → 1/2; founds strand).

targetSlug: identify-natural-and-manmade-materials
language: en
title:
  en: "Natural and Manmade — what is made by nature vs people?"
description:
  en: "Kindergarten / Grade 1 science package teaching kids to distinguish NATURAL materials (made by nature: wood, stone, water, leaf, sand, shell) from MANMADE materials (made by people: plastic, metal, paper, fabric, glass, brick). Foundational science package introducing materials-and-properties strand on the platform (0/2 → 1/2). Critical bridge from observation-of-objects to source-classification thinking. Connects naturally to forest-creatures-bundle + camping-bundle (nature contexts) + classroom-bundle (manmade objects). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + natural-vs-manmade introduction. Teacher
      displays 4 objects: a leaf + a stone + a plastic toy + a
      metal spoon. "Look at these objects. Some are NATURAL —
      made by NATURE (leaf grew on a tree; stone formed in the
      earth). Some are MANMADE — made by PEOPLE in factories
      (plastic toy + metal spoon are manufactured). Let's
      classify!" Class chants: "Natural is from NATURE! Manmade
      is from PEOPLE!" Teacher repeats with sand (natural) vs
      glass (manmade); wood (natural) vs paper (manmade — made
      FROM wood by people).
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + classification routine. Each pair receives 12
      picture cards (mix of natural + manmade objects). Pair
      takes turns: kid A picks a card; kid B places it in
      NATURAL or MANMADE pile + explains. Recast errors with
      origin-thinking ("you put glass in NATURAL. But where did
      glass come from? People MAKE glass from sand by heating
      it. So glass goes in MANMADE."). Tricky cases: paper (natural
      origin + manmade processing); cotton fabric (natural origin
      + manmade processing); cooked food (manmade from natural
      ingredients).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (sort
      pictures into NATURAL vs MANMADE bins). Station 2: matching
      worksheet (object picture to category label). Station 3:
      odd-one-out worksheet (find the natural item in a group of
      manmade items; or vice versa). Station 4: vocabulary-
      tracing-strips for materials vocabulary (natural, manmade,
      wood, stone, plastic, metal, paper, fabric).
  closure:
    durationMinutes: 5
    body: |
      Whole-class classification review. Teacher displays 8
      objects; class collectively classifies each as natural or
      manmade. "Leaf — NATURAL! Plastic bottle — MANMADE! River
      water — NATURAL! Toy car — MANMADE!" Forward-pointer: "Today
      we sorted natural from manmade. When we come back next, we
      can describe MATERIAL PROPERTIES — hard vs soft, smooth vs
      rough, transparent vs opaque, flexible vs rigid!"

