compositionalRationale:
  en: |
    Primary strand: language-and-communication / reading-
    comprehension (identify the main character — advances
    strand 2/10 → 3/10). Secondary strand: vocabulary-
    acquisition (character-vocabulary + story-vocabulary:
    'character', 'main', 'story', 'protagonist' for older
    kids). Tertiary strand: speaking-and-listening (the
    productive-language work of articulating WHO the story
    is about + retelling).

    Architectural significance: continues reading-
    comprehension strand expansion. Per learning-targets.
    json the strand has 10 canonical targets; current
    state is 2 authored (match-sentence-to-picture from
    Arc 12 Phase 2 as the strand-opener + predict-from-
    picture-cue as the second sibling); identify-main-
    character is the third package, bringing the strand
    to 3/10. Per learning-targets.json prerequisite:
    match-sentence-to-picture is the prerequisite — kids
    must be able to connect a sentence to a picture
    before they can extract a character from a sentence-
    and-picture-paired story.

    Reading-comprehension strand future (Arc 18+
    candidates per learning-targets.json residual):
    identify-setting, sequence-3-event-story, identify-
    problem-and-solution, distinguish-fiction-from-
    nonfiction, read-and-follow-2-sentence-instruction,
    infer-character-feeling-from-picture-cue. Together
    these 6 + this package + the 2 existing siblings
    will close the strand at 9/10 (1 remaining
    canonical target unfilled at Arc 18+ close
    projection).

    Per §A.13.30 K-1-informal framing: K-1 work is
    character-identification in TEACHER-LED READ-ALOUD
    or PICTURE-SUPPORTED text. Kids do NOT need to be
    independent readers to identify a main character —
    they can identify the protagonist from picture cues
    + teacher reading aloud + title-cue. The K-1
    identifier signals are deliberately simple:
    - WHO APPEARS MOST in the pictures?
    - WHO IS NAMED in the title?
    - WHO DOES THE IMPORTANT ACTIONS?
    These signals make the main-character identification
    accessible at K-1 ages without requiring formal
    literary-analysis vocabulary or independent decoding
    fluency. Grade 2+ work extends to characters in
    longer chapter-book contexts, distinguishing main
    from secondary characters, identifying character
    arcs — all beyond K-1 scope.

    Cross-reference to match-sentence-to-picture
    (prerequisite): that package established sentence-
    to-picture connection (kids read a sentence + match
    it to the image it describes). This package extends
    that connection: now kids read a SHORT STORY (3-4
    sentences with picture support) + identify the
    CHARACTER who appears across the sentences. The
    sentence-to-picture skill grounds the multi-sentence
    character-tracking skill.

    Distinctive composition: 3 matching exercises
    (canonical reading-comp pattern — match story-card to
    character-card across multiple practice slots) + 1
    picture-sort (character categorization) + 1 missing-
    pieces (character-image completion supporting
    character-recognition). Multi-matching weighting
    surfaces the character-identification skill as the
    package's load-bearing exercise pattern; the picture-
    sort + missing-pieces variation prevents pure-
    repetition fatigue while reinforcing the underlying
    character-recognition substrate.

    Materials note: 8-material literacy class stack per
    Phase 1.5 commission spec. Sentence-strips at
    position 4 with framePreset 'this-is-a' (story-
    character anchor frames: "This is a [character].
    The [character] is the main character.") is the
    load-bearing material — the literal story-frame
    substrate kids work with. Vocabulary-tracing-strips
    at position 5 with `traceStyle: dotted` traces
    character-vocabulary words ('character', 'story',
    'hero', 'main'). The combination of sentence-strips
    + vocabulary-tracing-strips surfaces both the read-
    aloud / picture-supported text work AND the
    character-vocabulary acquisition work that ground
    the comprehension skill.

    Class B FLEXIBLE substrate: composes against animals
    theme (early picture books overwhelmingly feature
    animal-protagonists; literacy-class precedent +
    natural fit for K-1 character-identification work).
    Animal-protagonist stories at K-1: 'The Very Hungry
    Caterpillar' (caterpillar) / 'Brown Bear, Brown
    Bear' (bear) / 'The Tale of Peter Rabbit' (rabbit)
    / 'Where the Wild Things Are' (Max, the boy + the
    wild things) — the genre is animal-rich + culturally
    universal across the 11 locale variants.

    K-3 multilingual classroom relevance: main-character
    identification is universal K-3 comprehension content.
    The narrative concept of 'character' is locale-
    portable; only the vocabulary varies. Cross-locale
    character-vocabulary: en 'character' / 'main
    character' / 'hero' / 'protagonist'; de 'Figur' /
    'Hauptfigur' / 'Held'; es 'personaje' / 'personaje
    principal' / 'protagonista' / 'héroe'; pt
    'personagem' / 'personagem principal' /
    'protagonista'; fr 'personnage' / 'personnage
    principal'; fi 'hahmo' / 'päähenkilö'. The 'main
    character' compound is structurally similar across
    Romance + Germanic locales (all use adjective +
    'character/figure' construction); Finnish uses
    'päähenkilö' (head-person, agglutinative compound).
    Locale-variant work at Phase 3+ adapts to each
    locale's character-vocabulary register + locally-
    appropriate read-aloud story selections.

