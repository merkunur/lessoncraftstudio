compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (target use-color-words). Secondary
    strand: phonics + handwriting (matching letter mode + vocabulary-tracing-strips
    for color-name handwriting practice). Tertiary strand: attribute-categorization
    (color-attribute sorting at scaffold station 3 + picture-sort assessment).

    Departure from farm-animals 8-material baseline: 7 materials. Manipulative-cut-outs
    OMITTED — color words don't naturally compose with discrete-counting prop;
    counting "5 reds" is unusual K-3 talk vs counting "5 cats" which is natural.
    Vocabulary-tracing-strips substituted as the K-Grade-1 handwriting integration
    (color words are short, tracing-friendly).

curriculumStandards:
  - EYFS.ELG.UW
  - IB-PYP.HowWeOrganize

assessmentCriteria:
  en: |
    Receptive 10/10 (point to named color); productive 8/10 (name color from card);
    frame use 6/10 ("The {item} is {color}").

    Differentiation:
    - Pre-K: receptive only via touch-something-{color} routine.
    - K / Grade 1: full productive + sentence-frame use.
    - Grade 2+: extend to multi-color descriptions ("The bird is red and blue.")
      + color comparisons ("The apple is redder than the strawberry.").

