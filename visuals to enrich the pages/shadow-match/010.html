<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Schattenbilder - Professional Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: #FAFAFA; overflow: hidden;">

        <!-- Subtle geometric pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image: repeating-linear-gradient(0deg, #4A148C 0px, #4A148C 1px, transparent 1px, transparent 40px), repeating-linear-gradient(90deg, #4A148C 0px, #4A148C 1px, transparent 1px, transparent 40px);"></div>

        <!-- Top accent bar (purple → gold) -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #4A148C 0%, #7B1FA2 40%, #FFC107 70%, #FFD54F 100%);"></div>

        <!-- Quality Seal (top-left) -->
        <div style="position: absolute; top: 25px; left: 30px; z-index: 20;">
            <div style="width: 80px; height: 80px; background: linear-gradient(145deg, #4A148C, #7B1FA2); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(74,20,140,0.35); border: 3px solid rgba(255,255,255,0.3);">
                <span style="font-size: 36px; filter: brightness(1.1);">&#9989;</span>
            </div>
        </div>

        <!-- 300 DPI Badge (top-right) -->
        <div style="position: absolute; top: 30px; right: 35px; z-index: 20;">
            <div style="background: white; padding: 10px 20px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); border: 3px solid #FFC107;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #4A148C;">300 DPI</span>
            </div>
        </div>

        <!-- Title Section -->
        <div style="position: absolute; top: 35px; left: 0; right: 0; text-align: center; z-index: 15;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 46px; color: #4A148C; margin: 0; text-shadow: 1px 1px 0 rgba(74,20,140,0.08); letter-spacing: 2px;">PROFESSIONELLE</h1>
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 46px; color: #4A148C; margin: -2px 0 0 0; text-shadow: 1px 1px 0 rgba(74,20,140,0.08); letter-spacing: 2px;">QUALIT&Auml;T</h1>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 22px; color: #757575; margin: 8px 0 0 0;">F&uuml;r Ihren Unterricht</p>
        </div>

        <!-- Side-by-side Worksheet + Answer Key -->
        <div style="position: absolute; top: 240px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 30px; z-index: 10;">

            <!-- Worksheet Frame -->
            <div style="text-align: center;">
                <!-- Tag -->
                <div style="margin-bottom: 10px;">
                    <span style="background: #4A148C; color: white; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; padding: 5px 16px; border-radius: 12px;">Arbeitsblatt</span>
                </div>
                <!-- Frame -->
                <div style="width: 300px; height: 232px; background: white; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.15), 0 0 0 3px rgba(74,20,140,0.15); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/shadow%20match/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Schattenbilder Arbeitsblatt">
                </div>
            </div>

            <!-- Arrow / Plus connector -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 25px;">
                <div style="width: 50px; height: 50px; background: linear-gradient(145deg, #FFC107, #FFD54F); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(255,193,7,0.4);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: #4A148C;">+</span>
                </div>
            </div>

            <!-- Answer Key Frame -->
            <div style="text-align: center;">
                <!-- Tag -->
                <div style="margin-bottom: 10px;">
                    <span style="background: #FFC107; color: #4A148C; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; padding: 5px 16px; border-radius: 12px;">L&ouml;sungsblatt</span>
                </div>
                <!-- Frame -->
                <div style="width: 300px; height: 232px; background: white; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.15), 0 0 0 3px rgba(255,193,7,0.25); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/shadow%20match/sample-2-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Schattenbilder L&ouml;sungsblatt">
                </div>
            </div>
        </div>

        <!-- Feature Checklist -->
        <div style="position: absolute; top: 560px; left: 50%; transform: translateX(-50%); z-index: 10;">
            <div style="display: flex; gap: 40px; justify-content: center;">
                <!-- Check 1 -->
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 30px; height: 30px; background: linear-gradient(145deg, #4A148C, #7B1FA2); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(74,20,140,0.3);">
                        <span style="color: white; font-size: 16px; font-weight: 700;">&#10003;</span>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; color: #4A148C;">Druckfertig in 300 DPI</span>
                </div>
                <!-- Check 2 -->
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 30px; height: 30px; background: linear-gradient(145deg, #4A148C, #7B1FA2); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(74,20,140,0.3);">
                        <span style="color: white; font-size: 16px; font-weight: 700;">&#10003;</span>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; color: #4A148C;">L&ouml;sungsbl&auml;tter inklusive</span>
                </div>
                <!-- Check 3 -->
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 30px; height: 30px; background: linear-gradient(145deg, #4A148C, #7B1FA2); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(74,20,140,0.3);">
                        <span style="color: white; font-size: 16px; font-weight: 700;">&#10003;</span>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; color: #4A148C;">Kommerzielle Lizenz</span>
                </div>
            </div>
        </div>

        <!-- Bottom Banner (Gold) -->
        <div style="position: absolute; bottom: 110px; left: 0; right: 0; background: linear-gradient(90deg, #FFC107 0%, #FFD54F 50%, #FFC107 100%); padding: 16px 0; box-shadow: 0 -4px 16px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.08);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #4A148C; text-shadow: 1px 1px 0 rgba(255,255,255,0.4); letter-spacing: 1.5px;">Vertrauen Sie auf bew&auml;hrte Qualit&auml;t!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); border: 3px solid #4A148C;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #4A148C;">PDF &amp; JPEG</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); border: 3px solid #7B1FA2;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #7B1FA2;">Sofort einsetzbar</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); border: 3px solid #FFC107;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #FF8F00;">Keine Vorbereitung</span>
            </div>
        </div>

    </div>
</body>
</html>
