# Teaching package — produce rhyming words (pt sparse-override)
# Arc 19 Phase 1.1 Slot 4 (24th-consecutive arc pt cadence per Arc 7+ convention; pt cadence increments per-arc, not per-package; all 4 Phase 1.1 pt variants share the same Arc-19 cadence anchor). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF01LP04 (rima e aliteração) + EF01LP06 (consciência fonológica). **Phonological-awareness pedagogy is locale-specific: pt-BR rhyme-patterns differ structurally from English (vowel-ending dominance; nasal-vowel ending rhymes; stress-pattern rhyming).**

targetSlug: produce-rhyming-words
language: pt

title:
  pt: "Fazer Rimas — gerar palavras que terminam com o mesmo som"

description:
  pt: "Pacote de alfabetização para a educação infantil brasileira (5-7 anos) ensinando crianças a PRODUZIR palavras que rimam. Apoia-se no pré-requisito identify-rhyming-pairs (Arc 10; já enviado): crianças que reconhecem pares-de-rima agora geram novas rimas elas mesmas. Dada 'gato', as crianças produzem 'pato', 'rato', 'sapato', 'mato'. O strand phonological-awareness avança 3/9 → 4/9 (se Slot 3 isolate-initial-phoneme também enviar). Habilidade produtiva-fonológica crítica: produção-de-rima exercita a representação mental do padrão-sonoro-de-final-de-palavra + constrói a fundação para decodificação de famílias-de-palavras. Por §A.13.30 enquadramento informal K-1: trabalho de produção-de-rima no K é COMPLETAMENTO DE PADRÃO CONCRETO — as crianças ouvem uma palavra-alvo + geram palavras que correspondem ao seu som final. Alinhamento BNCC: EF01LP04 (rima e aliteração) + EF01LP06 (consciência fonológica). 5 exercícios + 8 materiais imprimíveis ao longo de 1 semana. **Pedagogia de consciência fonológica é locale-específica: rimas pt-BR diferem estruturalmente do inglês (terminação vocálica dominante; rimas com vogais nasais; rima-de-padrão-tônico).**"

structure:
  warmup:
    body: |
      Atividade fazer-rima com toda a turma. Você diz:
      "Estou pensando em uma palavra: GATO. Quem pode me
      dizer uma palavra que rima com GATO? Mesmo som no
      final!" A turma faz chuva-de-ideias: pato, rato, sapato,
      mato, fato, prato, peixe-gato... Você escreve no quadro
      em uma coluna. "Olhem — todas essas palavras terminam
      com -ato. Todas RIMAM com GATO porque compartilham o
      mesmo som final." Você repete com: "BOLA — o que rima
      com BOLA?" A turma: cola, mola, fila, viola, escola...
      "SOL — o que rima com SOL?" Lençol, anzol, espanhol,
      futebol... Ênfase do padrão: "Quando FAZEMOS rimas,
      mantemos o som-final igual + mudamos o início. Família
      -ato, família -ola, família -ol. Essas são FAMÍLIAS-DE-
      RIMA."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de geração-de-rima. Cada
      dupla recebe 6 cartões de palavra-alvo (gato, bola,
      sol, pão, dedo, mão) + papel em branco. A dupla se
      reveza: a criança A escolha um cartão-alvo; a criança
      B gera quantas palavras-que-rimam puder oralmente + a
      criança A escreve (ou a criança B escreve se conseguir).
      A dupla troca papéis. Recapture erros com verificação-
      de-rima ("você disse que CASA rima com GATO — elas têm
      o mesmo som no final? GATO termina em -ato; CASA
      termina em -asa. Diferentes! Vamos tentar de novo: o
      que termina em -ato? PATO? Sim! RATO? Sim! MATO?
      Sim!"). Construa fluência de família-de-rima primeiro
      com famílias-CVC simples (-ato, -ola, -ão, -or); adie
      famílias-de-rima mais complexas (-ação, -idade,
      -ência) para trabalho posterior. Movimento pedagógico
      crítico: REAL ou NÃO-SENSO? Crianças K podem gerar
      rimas-nãosenso (gato, kato, lato, zato). Aceite
      rimas-nãosenso como saída FONOLÓGICA válida (o padrão-
      de-rima está correto) enquanto distingue gentilmente
      palavras reais vs nãosenso. A habilidade fonológica
      SEMPRE vence; restrições de ortografia/significado
      vêm depois.
  scaffold:
    body: |
      Rotação por estações. Estação 1: folha de
      emparelhamento (as crianças combinam palavras-alvo a
      listas de palavras-que-rimam). Estação 2: folha word-
      guess (as crianças preenchem uma palavra-que-rima
      dadas uma pista + ortografia parcial). Estação 3:
      folha word-scramble (as crianças desembaralham
      palavras de família-de-rima; reforça ortografia de
      padrões-de-rima). Estação 4: folha missing-pieces (as
      crianças completam uma estrofe de poema-com-rima
      fornecendo a palavra-final faltante).
  closure:
    body: |
      Compartilhamento-de-rima com toda a turma. Você diz
      uma palavra-alvo; a turma gera rimas oralmente o mais
      rápido possível. "CARRO!" (A turma: barro, jarro,
      sarro, alvar...) "BICHO!" (capricho, riacho, nicho...)
      "MÃO!" (pão, cão, chão, irmão, ração, opinião...) Você
      encerra: "Fazer rimas EXERCITA nossos MÚSCULOS de
      consciência fonológica. Quanto mais rimas fazemos,
      mais fácil fica ouvir sons-finais em NOVAS palavras
      que encontramos quando lemos. A rima é uma das
      MAIORES ajudantes para a leitura inicial." Aponte
      adiante: "A seguir vamos passar para outras
      habilidades fonológicas — segmentar palavras em sons
      + juntar sons em palavras. Esses trabalham no INÍCIO
      + MEIO das palavras, complementando o trabalho de
      rima no FIM da palavra."

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Produzir 3+ palavras que rimam para uma palavra-alvo
        CVC em 7 de 10 tentativas.
      - Reconhecer o padrão família-de-rima (-ato, -ão,
        -ola, -or) em 6 de 8 tentativas.
      - Classificar 12 cartões-de-imagem em grupos de
        família-de-rima (3-4 grupos) corretamente em 6 de
        10 tentativas.
      - Distinguir pares-que-rimam de pares-que-não-rimam
        em 7 de 10 tentativas (revisão receptiva de
        identify-rhyming-pairs).
      - Usar o vocabulário 'rima' / 'rimando' / 'som no
        final' / 'mesmo som' / 'família-de-rima'
        corretamente em 5 de 10 tentativas de produção
        verbal.

    Diferenciação:
    - Pré-escola: foco apenas em identify-rhyming-pairs
      (receptivo); adiar rima produtiva para o K.
    - Educação infantil (5-7 anos): produção completa de
      famílias-de-rima CVC com famílias simples (-ato,
      -ola, -ão); rimas-nãosenso aceitas; adiar famílias-
      de-rima complexas.
    - 1.º ano EF: estender para famílias-de-rima complexas
      (-ação, -idade, -ência); introduzir distinção
      palavra-real vs nãosenso mais formalmente; ponte para
      escrita-de-poema-com-rima.
    - 2.º ano EF em diante: estender para consciência de
      rima-imperfeita; ponte para pedagogia formal de
      forma-poética + composição-de-escrita-criativa.

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en). Os
    campos materials, composedExercises, curriculumStandards
    e learningObjectives são herdados do package.yaml via
    merge sparse-override e não são repetidos aqui per a
    convenção Arc 7+.

    **NOTA LOCALE-CRÍTICA: rimas pt-BR diferem estruturalmente
    do inglês.** Padrões de rima em português brasileiro:
    - **Terminação vocálica dominante:** rimas pt-BR
      frequentemente correspondem por VOGAL FINAL + às
      vezes consoante final (gato/pato/sapato = -ato; bola/
      cola/mola = -ola). Inglês tem mais consoantes-finais
      diversas; pt-BR é mais vocálico-final.
    - **Rimas com vogais nasais:** pt-BR tem família rica
      de rimas-nasais (pão/cão/chão/mão = -ão; pomba/bomba/
      pomba = -omba). Inglês não tem vogais nasais
      fonêmicas; este é um padrão de rima exclusivamente
      pt-BR.
    - **Rima-de-padrão-tônico:** pt-BR é língua acento-
      timing-de-sílaba; rimas ocorrem na sílaba tônica final.
      Inglês é stress-timing-de-tempo; rimas podem ocorrer
      em sílabas não-finais às vezes.
    - **Rimas trissilábicas + tetrasilábicas comuns em pt-
      BR:** pt-BR tem rica família-de-rima em palavras
      longas (-ação: ação, oração, situação; -idade:
      cidade, idade, qualidade). Inglês K-1 tende a focar
      em CVC monossilábico-de-rima.

    Famílias-de-rima pt-BR canônicas K-1 EF:
    - -ato: gato, pato, rato, mato, sapato, fato, prato,
      retrato
    - -ola: bola, cola, mola, fila (não), escola, sacola,
      gaiola, sandália (não — diferente)
    - -ão: pão, cão, chão, mão, irmão, opinião
    - -ar: lar, mar, par, lugar, andar, dar, falar
    - -or: dor, cor, ator, professor, valor, suor
    - -al: animal, mal, sal, capital, casal
    - -el: papel, anel, mel, hotel
    - -il: mil, abril, ril, cantil
    - -ol: sol, anzol, lençol, futebol

    Vocabulário pt-BR canônico para produção-de-rima K-1:
    - 'rima' (rhyme) — pt-BR canônico
    - 'rimar' (to rhyme) — pt-BR canônico verbo
    - 'palavras que rimam' (rhyming words) — pt-BR canônico
    - 'som no final' (ending sound) — pt-BR canônico
    - 'mesmo som' (same sound) — pt-BR canônico
    - 'família-de-rima' (rhyme family) — locução pedagógica
      pt-BR K-1 (algumas escolas usam 'rima-em-família')
    - 'parquinho-de-rimas' (rhyming-playground) — registro
      coloquial K-1 BR para atividade lúdica de rima
    - 'aliteração' (alliteration) — termo BNCC EF01LP04;
      conceito distinto de rima (sons-iniciais
      repetidos vs sons-finais correspondentes)

    Particularidade pt-BR para rima vs aliteração:
    Português-BR K-1 EF distingue claramente RIMA (sons-
    finais correspondentes — gato/pato) de ALITERAÇÃO
    (sons-iniciais repetidos — pato-pequeno-prateado). Este
    pacote ensina RIMA especificamente; aliteração é um
    tópico irmão na consciência fonológica (compre/coberto/
    com em outro pacote phonological-awareness).

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF01LP04 ('Distinguir as letras do alfabeto de outros
    sinais gráficos. Identificar as letras do alfabeto.
    Recitar o alfabeto na ordem das letras. Nomear as letras
    do alfabeto e recitá-lo. Identificar a posição das letras
    no alfabeto') estabelece o substrato alfabético. EF01LP04
    canonicamente cobre 'rima e aliteração' como tópico
    BNCC central da consciência fonológica K-1. EF01LP06
    (segmentação silábica) é anchor adjacente para o
    trabalho fonológico mais amplo.

    Por §A.13.30 enquadramento informal K-1: este pacote
    NÃO ensina formas-poéticas-formais (rima perfeita vs
    rima toante; esquema de rima; métrica são trabalho
    pós-3.º ano EF). Famílias brasileiras podem reconhecer
    a tradição de poesia infantil brasileira (Vinicius de
    Moraes 'A Arca de Noé'; Cecília Meireles; Manuel
    Bandeira); este pacote prepara as crianças para
    encontrar essas tradições poéticas com consciência-de-
    rima já desenvolvida.

    Pacote pair-coherent com Phase 1.1 Slot 3 isolate-
    initial-phoneme: juntos avançam o strand phonological-
    awareness 2/9 → 4/9. Foundation cluster para Arc 19
    P1.2-1.4 continuação de phonological-awareness.

    **§A.13.34 sub-class adjudication — locale-canonical-
    curriculum-divergence:**
    Phonological-awareness pedagogy has structural divergence
    between English + pt-BR (English consonant-final-dominance
    rhyme + CVC phoneme inventory vs pt-BR vowel-ending-
    dominance + nasal-vowel rhyme + 7 oral + 5 nasal vowel
    phonemes). This is a canonical §A.13.34 locale-canonical-
    curriculum-divergence case. SPARSE-OVERRIDE locked for
    current commission per minimal-amendment principle
    (structure body + assessmentCriteria + compositionalRationale.pt
    carry pt-BR-specific pedagogical content; materials +
    composedExercises pedagogically translate cleanly across
    locale-divergence). FULL-OVERRIDE flagged as future-arc
    candidate when Phase 1.2 phonological-awareness continuation
    surfaces additional locale-divergence patterns warranting
    full re-authoring of materials + composedExercises against
    pt-BR canonical pedagogy.

    Per §A.13.36 cadência de cooperação CC↔assistant: o
    pacote pt herda materials, composedExercises,
    curriculumStandards via sparse-override per convenção
    Arc 7+; quaisquer emendas en (se Round 2 surgir) se
    propagam automaticamente para esta variante pt.
