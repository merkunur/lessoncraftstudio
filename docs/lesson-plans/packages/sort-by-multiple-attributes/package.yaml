compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / sorting (multi-
    attribute). Secondary strand: working-memory + executive-function
    (kids hold 2 sort criteria in mind simultaneously; meaningful
    cognitive load). Tertiary strand: vocabulary acquisition (vocab-
    anchored — color + shape + size words reinforced through multi-
    attribute reasoning).

    Architectural significance: completes the Arc 5+7+8 sorting strand
    progression. Single-attribute trilogy (sort-by-color + sort-by-shape
    + sort-by-size) shipped at Arc 5+7; multi-attribute as Grade 1+
    extension. The 4-package set covers the fundamental sorting
    cognitive surface from preschool simple-attribute discrimination
    through Grade 1+ multi-attribute reasoning. Resolves sort-by-color's
    explicit forward-pointer to multi-attribute work.

    Distinctive composition: 3 picture-sort exercises spanning theme
    mode + custom-words mode (positions 1, 2, 4) — the FIRST package
    to use picture-sort's custom-words mode for multi-attribute bucket
    labeling. Custom-words mode lets the operator construct compound
    labels ("red shapes" / "blue shapes") that single-attribute theme
    mode can't express. Validates picture-sort architecture for multi-
    attribute work.

    Working-memory progression: single-attribute sorting requires 1
    decision per item (does this match attribute X?). Multi-attribute
    sorting requires 2 decisions per item (matches attribute X? AND
    matches attribute Y?). Cognitive-load doubles. Pre-K kids
    typically can't hold 2 criteria simultaneously; K kids hit it
    inconsistently; Grade 1+ kids can sustain multi-attribute
    reasoning. Package targets Grade 1+ as primary audience.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Multi-attribute sorting works with ANY 2 cross-cutting attribute
    dimensions; substrate-readiness is universal across themes that
    have meaningful within-theme attribute variation (colors theme
    × shapes theme + variants).

    K-3 multilingual classroom relevance: multi-attribute reasoning
    is cognitively universal; verbalization of multi-attribute
    decisions ("This is a RED CIRCLE — it goes in the red-circle
    bucket") is exactly the kind of compound-grammar full-sentence
    practice K-3 multilingual classrooms need. The 2-attribute
    decision becomes a 2-clause sentence. High language-acquisition
    leverage.

