<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Gro&szlig; oder Klein - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(155deg, #FCE4EC 0%, #F8BBD0 30%, #F48FB1 70%, #EC407A 100%); overflow: hidden;">

        <!-- Subtle dot pattern overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image: radial-gradient(circle, #AD1457 1px, transparent 1px); background-size: 22px 22px;"></div>

        <!-- Warm radial glow -->
        <div style="position: absolute; top: 50%; left: 55%; width: 800px; height: 700px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,171,145,0.15) 0%, transparent 65%); border-radius: 50%;"></div>

        <!-- CSS Measuring Ruler (left side) -->
        <div style="position: absolute; left: 22px; top: 130px; bottom: 180px; width: 38px; background: linear-gradient(180deg, #FFD740, #FFC107); border-radius: 6px; box-shadow: 2px 3px 12px rgba(0,0,0,0.15); z-index: 5;">
            <div style="position: absolute; top: 15px; left: 0; width: 20px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 55px; left: 0; width: 14px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 95px; left: 0; width: 20px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 135px; left: 0; width: 14px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 175px; left: 0; width: 20px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 215px; left: 0; width: 14px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 255px; left: 0; width: 20px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 295px; left: 0; width: 14px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 335px; left: 0; width: 20px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 375px; left: 0; width: 14px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 415px; left: 0; width: 20px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 455px; left: 0; width: 14px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 495px; left: 0; width: 20px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 535px; left: 0; width: 14px; height: 2px; background: #5D4037;"></div>
            <div style="position: absolute; top: 575px; left: 0; width: 20px; height: 2px; background: #5D4037;"></div>
        </div>

        <!-- Paw print shapes (low opacity) -->
        <div style="position: absolute; top: 190px; right: 65px; opacity: 0.08; z-index: 1;">
            <div style="width: 22px; height: 28px; background: #AD1457; border-radius: 50% 50% 50% 50%; transform: rotate(-10deg);"></div>
            <div style="position: absolute; top: -12px; left: -6px; width: 10px; height: 12px; background: #AD1457; border-radius: 50%;"></div>
            <div style="position: absolute; top: -14px; left: 6px; width: 10px; height: 12px; background: #AD1457; border-radius: 50%;"></div>
            <div style="position: absolute; top: -10px; left: 18px; width: 10px; height: 12px; background: #AD1457; border-radius: 50%;"></div>
        </div>
        <div style="position: absolute; bottom: 260px; left: 90px; opacity: 0.07; z-index: 1; transform: rotate(25deg);">
            <div style="width: 18px; height: 24px; background: #AD1457; border-radius: 50%;"></div>
            <div style="position: absolute; top: -10px; left: -5px; width: 8px; height: 10px; background: #AD1457; border-radius: 50%;"></div>
            <div style="position: absolute; top: -12px; left: 5px; width: 8px; height: 10px; background: #AD1457; border-radius: 50%;"></div>
            <div style="position: absolute; top: -9px; left: 14px; width: 8px; height: 10px; background: #AD1457; border-radius: 50%;"></div>
        </div>

        <!-- Gold sparkle dots -->
        <div style="position: absolute; top: 165px; left: 120px; width: 8px; height: 8px; background: #FFD740; border-radius: 50%; box-shadow: 0 0 16px 5px rgba(255,215,64,0.5);"></div>
        <div style="position: absolute; top: 310px; right: 55px; width: 6px; height: 6px; background: #FFD740; border-radius: 50%; box-shadow: 0 0 14px 4px rgba(255,215,64,0.4);"></div>
        <div style="position: absolute; top: 480px; left: 85px; width: 7px; height: 7px; background: #FFAB91; border-radius: 50%; box-shadow: 0 0 14px 5px rgba(255,171,145,0.5);"></div>
        <div style="position: absolute; bottom: 300px; right: 120px; width: 5px; height: 5px; background: #FFD740; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(255,215,64,0.4);"></div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 22px; left: 80px; z-index: 100;">
            <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #FFD740 0%, #FFC107 100%); border-radius: 50%; box-shadow: 0 8px 28px rgba(255,193,7,0.5), inset 0 -4px 10px rgba(0,0,0,0.1), inset 0 4px 8px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 23px; color: #3E2723; text-shadow: 0 1px 2px rgba(255,255,255,0.4);">GRATIS</span>
            </div>
        </div>

        <!-- VORSCHULE Badge -->
        <div style="position: absolute; top: 32px; right: 30px; background: rgba(255,255,255,0.95); padding: 11px 22px; border-radius: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #AD1457; z-index: 100;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #AD1457; letter-spacing: 1px;">VORSCHULE</span>
        </div>

        <!-- Main Title — size contrast demonstrates the concept -->
        <div style="position: absolute; top: 115px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 120px; color: #3E2723; margin: 0; line-height: 1; text-shadow: 3px 3px 0 rgba(173,20,87,0.1), 0 0 40px rgba(173,20,87,0.06);">GRO&szlig;</h1>
            <div style="display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: -5px;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 38px; color: #AD1457;">oder</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; color: #3E2723;">klein?</span>
            </div>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 22px; color: #AD1457; margin: 8px 0 0 0; letter-spacing: 1px; opacity: 0.85;">Gr&ouml;&szlig;envergleich Arbeitsbl&auml;tter</p>
        </div>

        <!-- 3-Worksheet Cascading Display (staggered heights, NO rotation) -->
        <div style="position: absolute; top: 320px; left: 50%; transform: translateX(-50%); width: 780px; height: 420px; z-index: 30;">

            <!-- Left worksheet (lowest) -->
            <div style="position: absolute; left: 80px; top: 90px; z-index: 10;">
                <div style="width: 180px; height: 233px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #F48FB1; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/big%20small/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Gr&ouml;&szlig;envergleich Arbeitsblatt">
                </div>
            </div>

            <!-- Center worksheet (highest, largest — hero) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 20;">
                <div style="position: relative;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/big%20small/sample-2.jpeg" style="width: 235px; height: 304px; object-fit: cover; border-radius: 12px; border: 6px solid white; box-shadow: 0 18px 50px rgba(0,0,0,0.28), 0 0 30px rgba(173,20,87,0.1);">
                    <div style="position: absolute; inset: -20px; background: radial-gradient(ellipse, rgba(255,171,145,0.1) 0%, transparent 60%); z-index: -1; border-radius: 30px;"></div>
                </div>
            </div>

            <!-- Right worksheet (mid height) -->
            <div style="position: absolute; right: 80px; top: 45px; z-index: 10;">
                <div style="width: 190px; height: 246px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #FFAB91; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/big%20small/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Gr&ouml;&szlig;envergleich Arbeitsblatt">
                </div>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 108px; left: 0; right: 0; background: linear-gradient(90deg, rgba(173,20,87,0.95) 0%, rgba(136,14,79,0.95) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.1), 0 4px 20px rgba(0,0,0,0.1); z-index: 50;">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 27px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.25); letter-spacing: 2px;">Gr&ouml;&szlig;en spielerisch entdecken!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; z-index: 50;">
            <div style="background: white; padding: 12px 18px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #AD1457;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #AD1457;">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: white; padding: 12px 18px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #FF8F00;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #FF8F00;">Sofort drucken</span>
            </div>
            <div style="background: white; padding: 12px 18px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #3E2723;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #3E2723;">Verschiedene Themen</span>
            </div>
        </div>

    </div>
</body>
</html>
