# Teaching package — make-10 strategy
# Arc 17 Phase 1.2 (math / addition-subtraction 11/14 → 12/14). Strategy-isolation companion to Arc 12 add-within-20 (where make-10 is the core fluency lesson). This package narrowly drills the decomposition mechanic. Paired strand-anchor: find-missing-addend-within-10 (same arc phase).

targetSlug: make-10-strategy
language: en
title:
  en: "Make-10 Strategy — decompose to reach ten, then add the rest"

description:
  en: "Grade 1 math package teaching the make-10 mental-math strategy as a discrete skill. Solver decomposes one addend so the other can be filled up to 10, then adds the remainder. Example: 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13. Companion to Arc 12 add-within-20 (where make-10 is the core fluency lesson embedded inside a broader within-20 unit); this package isolates the decomposition mechanic so kids who need extra strategy-fluency practice get a focused unit, and the make-10 move becomes a named, memorable strategy rather than something that happens incidentally inside larger addition work. Number-bond practice + 10-frame visual support + 'find the make-10 partner' games make the decomposition routine concrete before kids carry it mentally. CCSS.1.OA.C.6 anchor; CCSS.K.OA.A.4 cross-walk ('find the number that makes 10 when added'). 5 worksheet exercises + 6 printable materials over a 1-week unit. Paired strand-anchor companion: find-missing-addend-within-10 (algebraic-thinking precursor on the same addition-fluency strand)."

durationMinutes: 25

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + make-10 partner introduction. Teacher
      uses a 10-frame on the board (2 rows of 5 squares). "Here
      are 8 dots." (Teacher fills 8 squares.) "How many EMPTY
      squares?" Kids answer 2. "So 8 and 2 are make-10 PARTNERS.
      What about 6 and 4? 7 and 3? 9 and 1?" Quick partner
      naming around the room. Then the strategy move: "When we
      add 8 + 5, we don't have to count from 8 all the way to
      13. We can use the make-10 partner. 8 needs 2 to make 10.
      So we BREAK 5 into 2 and 3. 8 + 2 = 10. 10 + 3 = 13. Done."
      Teacher walks through 9 + 4 (9's partner is 1; break 4 into
      1 and 3; 10 + 3 = 13) and 7 + 6 (7's partner is 3; break
      6 into 3 and 3; 10 + 3 = 13). Pattern emphasis: "Look at
      the FIRST number. Find its make-10 partner. BREAK the
      second number. ADD the leftover."
  contentActivity:
    durationMinutes: 10
    body: |
      Pair work with 10-frame manipulatives. Each pair receives
      a 10-frame + two-color counters (e.g., breakfast-themed
      cutouts: yellow toast pieces + brown eggs). Pair plays
      make-10 partner round: kid A places N counters of the
      first color (N ≤ 9). Kid B counts the empty squares (this
      is N's make-10 partner). Both say aloud: "8 toast pieces.
      8 plus 2 makes 10." Then the strategy round: kid A
      writes a sum like 8 + 5 on a slip. Kid B places 8 toast,
      thinks "8 needs 2", takes 2 eggs out of the 5 to fill the
      frame, then names the 3 leftover eggs: "10 plus 3 is 13."
      Pair swaps roles. Recast errors with partner-cue ("you
      have 7 in the frame — what's 7's make-10 partner?"). The
      counters' breakfast theme is incidental — make-10 is the
      load-bearing structure; the theme provides recognizable
      countable objects so kids stay grounded in real things
      rather than abstract dots.
  scaffold:
    durationMinutes: 7
    body: |
      Station rotation. Station 1: math-puzzle addition mode
      (sums up to 20 — teacher curates the problems that fit
      the make-10 strategy cleanly: 8+5, 9+4, 7+6, 8+6, 9+3,
      7+5). Station 2: math-worksheet sums-within-20; teacher
      circulates and prompts make-10 thinking on eligible
      problems. Station 3: addition app find-addend mode with
      single-digit operands; kids practice the missing-addend
      recall move that overlaps with make-10 partner work
      (when the displayed sum lands on 10, that problem IS a
      make-10 partner question). Station 4: matching activity
      — match each sum (8+5, 9+4, 7+6) to its make-10
      decomposition path (8+2+3, 9+1+3, 7+3+3). Teacher
      curation across stations is load-bearing — the apps
      produce a range of sums, and the make-10 strategy work
      lives in how the teacher frames each problem.
  closure:
    durationMinutes: 3
    body: |
      Whole-class make-10 quick-recall. Teacher names sums; kids
      chorally articulate the make-10 path. "8 + 5? — 8 plus 2
      makes 10, plus 3 leftover, equals 13." "9 + 6? — 9 plus 1
      makes 10, plus 5 leftover, equals 15." "7 + 8? — 7 plus 3
      makes 10, plus 5 leftover, equals 15." Forward-pointer:
      "Today we made the make-10 strategy its own lesson. The
      same move helps with FIND THE MISSING ADDEND — if I know
      3 + ? = 10, I'm using a make-10 partner. And as we grow
      into bigger numbers, the make-10 idea extends — when we
      meet ADD WITHIN 100, we'll make ten again to manage the
      regrouping move."

