<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Pattern Worksheets - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(150deg, #FEF9E7 0%, #FCF3CF 60%, #F9E79F 100%); overflow: hidden;">

        <!-- Subtle pattern background -->
        <div style="position: absolute; inset: 0; opacity: 0.08; background-image:
            radial-gradient(circle at 20% 30%, #6C3483 4px, transparent 4px),
            radial-gradient(circle at 60% 20%, #17A589 3px, transparent 3px),
            radial-gradient(circle at 80% 50%, #E74C3C 4px, transparent 4px),
            radial-gradient(circle at 40% 70%, #F39C12 3px, transparent 3px),
            radial-gradient(circle at 90% 80%, #3498DB 4px, transparent 4px);
            background-size: 200px 200px;"></div>

        <!-- FREE Badge - Starburst style -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #E74C3C 0%, #C0392B 100%); box-shadow: 0 8px 25px rgba(231,76,60,0.5); display: flex; align-items: center; justify-content: center; position: relative; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">FREE</span>
            </div>
        </div>

        <!-- Header -->
        <div style="position: absolute; top: 35px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 56px; color: #6C3483; margin: 0; text-shadow: 3px 3px 0 rgba(255,255,255,0.8);">Everything Inside!</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; color: #F39C12; margin: 8px 0 0 0; text-shadow: 1px 1px 2px rgba(0,0,0,0.15);">Pattern Worksheets</h2>
        </div>

        <!-- Left side: Open gift box with blocks tumbling out -->
        <div style="position: absolute; left: 40px; top: 160px; width: 420px; height: 650px;">

            <!-- Gift box base -->
            <div style="position: absolute; bottom: 80px; left: 60px; width: 240px; height: 160px; background: linear-gradient(145deg, #6C3483 0%, #4A235A 100%); border-radius: 12px; box-shadow: 0 15px 40px rgba(74,35,90,0.4);">
                <!-- Box inner shadow -->
                <div style="position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; background: rgba(0,0,0,0.15); border-radius: 8px;"></div>
                <!-- Ribbon vertical -->
                <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 28px; transform: translateX(-50%); background: linear-gradient(90deg, #F39C12 0%, #D68910 50%, #F39C12 100%);"></div>
            </div>

            <!-- Gift box lid (tilted open) -->
            <div style="position: absolute; bottom: 210px; left: 30px; width: 260px; height: 50px; background: linear-gradient(145deg, #7D3C98 0%, #6C3483 100%); border-radius: 10px 10px 4px 4px; box-shadow: 0 8px 25px rgba(74,35,90,0.3); transform: rotate(-25deg) translateY(-20px);">
                <!-- Ribbon on lid -->
                <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 28px; transform: translateX(-50%); background: linear-gradient(90deg, #F39C12 0%, #D68910 50%, #F39C12 100%);"></div>
                <!-- Bow -->
                <div style="position: absolute; top: -35px; left: 50%; transform: translateX(-50%);">
                    <div style="width: 70px; height: 40px; background: linear-gradient(145deg, #F39C12 0%, #D68910 100%); border-radius: 50%; box-shadow: 0 4px 12px rgba(243,156,18,0.4);"></div>
                    <div style="position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; background: #B7950B; border-radius: 50%;"></div>
                </div>
            </div>

            <!-- Tumbling geometric blocks -->
            <!-- Circle block -->
            <div style="position: absolute; bottom: 320px; left: 140px; width: 55px; height: 55px; background: linear-gradient(145deg, #17A589 0%, #138D75 100%); border-radius: 50%; box-shadow: 0 8px 25px rgba(23,165,137,0.4); transform: rotate(15deg);"></div>

            <!-- Square block -->
            <div style="position: absolute; bottom: 380px; left: 80px; width: 50px; height: 50px; background: linear-gradient(145deg, #E74C3C 0%, #C0392B 100%); border-radius: 8px; box-shadow: 0 8px 25px rgba(231,76,60,0.4); transform: rotate(-20deg);"></div>

            <!-- Triangle block -->
            <div style="position: absolute; bottom: 430px; left: 170px; width: 0; height: 0; border-left: 30px solid transparent; border-right: 30px solid transparent; border-bottom: 52px solid #F39C12; filter: drop-shadow(0 8px 15px rgba(243,156,18,0.4)); transform: rotate(10deg);"></div>

            <!-- Another circle -->
            <div style="position: absolute; bottom: 480px; left: 100px; width: 42px; height: 42px; background: linear-gradient(145deg, #3498DB 0%, #2980B9 100%); border-radius: 50%; box-shadow: 0 6px 20px rgba(52,152,219,0.4); transform: rotate(-8deg);"></div>

            <!-- Small square -->
            <div style="position: absolute; bottom: 350px; left: 200px; width: 38px; height: 38px; background: linear-gradient(145deg, #F39C12 0%, #D68910 100%); border-radius: 6px; box-shadow: 0 6px 18px rgba(243,156,18,0.4); transform: rotate(25deg);"></div>

            <!-- Pentagon-ish block -->
            <div style="position: absolute; bottom: 520px; left: 160px; width: 45px; height: 45px; background: linear-gradient(145deg, #6C3483 0%, #4A235A 100%); border-radius: 10px; box-shadow: 0 6px 20px rgba(108,52,131,0.4); transform: rotate(-15deg);"></div>
        </div>

        <!-- Right side: Feature checklist as interlocking blocks -->
        <div style="position: absolute; right: 40px; top: 150px; width: 480px;">

            <!-- Feature block 1: AB Patterns -->
            <div style="display: flex; align-items: center; margin-bottom: 18px; transform: translateX(10px);">
                <div style="width: 65px; height: 65px; background: linear-gradient(145deg, #17A589 0%, #138D75 100%); border-radius: 10px; box-shadow: 0 6px 20px rgba(23,165,137,0.35); display: flex; align-items: center; justify-content: center; margin-right: 18px; position: relative;">
                    <!-- Connector nub -->
                    <div style="position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; background: linear-gradient(145deg, #17A589 0%, #138D75 100%); border-radius: 0 8px 8px 0;"></div>
                    <span style="font-size: 28px;">✓</span>
                </div>
                <div style="background: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-left: 5px solid #17A589;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #4A235A;">AB Patterns</span>
                </div>
            </div>

            <!-- Feature block 2: ABC Patterns -->
            <div style="display: flex; align-items: center; margin-bottom: 18px; transform: translateX(-5px);">
                <div style="width: 65px; height: 65px; background: linear-gradient(145deg, #F39C12 0%, #D68910 100%); border-radius: 10px; box-shadow: 0 6px 20px rgba(243,156,18,0.35); display: flex; align-items: center; justify-content: center; margin-right: 18px; position: relative;">
                    <div style="position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; background: linear-gradient(145deg, #F39C12 0%, #D68910 100%); border-radius: 0 8px 8px 0;"></div>
                    <span style="font-size: 28px;">✓</span>
                </div>
                <div style="background: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-left: 5px solid #F39C12;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #4A235A;">ABC Patterns</span>
                </div>
            </div>

            <!-- Feature block 3: ABCD Patterns -->
            <div style="display: flex; align-items: center; margin-bottom: 18px; transform: translateX(15px);">
                <div style="width: 65px; height: 65px; background: linear-gradient(145deg, #3498DB 0%, #2980B9 100%); border-radius: 10px; box-shadow: 0 6px 20px rgba(52,152,219,0.35); display: flex; align-items: center; justify-content: center; margin-right: 18px; position: relative;">
                    <div style="position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; background: linear-gradient(145deg, #3498DB 0%, #2980B9 100%); border-radius: 0 8px 8px 0;"></div>
                    <span style="font-size: 28px;">✓</span>
                </div>
                <div style="background: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-left: 5px solid #3498DB;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #4A235A;">ABCD Patterns</span>
                </div>
            </div>

            <!-- Feature block 4: Answer Keys -->
            <div style="display: flex; align-items: center; margin-bottom: 18px; transform: translateX(0px);">
                <div style="width: 65px; height: 65px; background: linear-gradient(145deg, #27AE60 0%, #1E8449 100%); border-radius: 10px; box-shadow: 0 6px 20px rgba(39,174,96,0.35); display: flex; align-items: center; justify-content: center; margin-right: 18px; position: relative;">
                    <div style="position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; background: linear-gradient(145deg, #27AE60 0%, #1E8449 100%); border-radius: 0 8px 8px 0;"></div>
                    <span style="font-size: 28px;">✓</span>
                </div>
                <div style="background: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-left: 5px solid #27AE60;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #4A235A;">Answer Keys Included</span>
                </div>
            </div>

            <!-- Feature block 5: Multiple Choice -->
            <div style="display: flex; align-items: center; margin-bottom: 18px; transform: translateX(8px);">
                <div style="width: 65px; height: 65px; background: linear-gradient(145deg, #E74C3C 0%, #C0392B 100%); border-radius: 10px; box-shadow: 0 6px 20px rgba(231,76,60,0.35); display: flex; align-items: center; justify-content: center; margin-right: 18px; position: relative;">
                    <div style="position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; background: linear-gradient(145deg, #E74C3C 0%, #C0392B 100%); border-radius: 0 8px 8px 0;"></div>
                    <span style="font-size: 28px;">✓</span>
                </div>
                <div style="background: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-left: 5px solid #E74C3C;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #4A235A;">Multiple Choice</span>
                </div>
            </div>

            <!-- Feature block 6: Fill-in-Blank -->
            <div style="display: flex; align-items: center; transform: translateX(-8px);">
                <div style="width: 65px; height: 65px; background: linear-gradient(145deg, #6C3483 0%, #4A235A 100%); border-radius: 10px; box-shadow: 0 6px 20px rgba(108,52,131,0.35); display: flex; align-items: center; justify-content: center; margin-right: 18px; position: relative;">
                    <div style="position: absolute; right: -10px; top: 50%; transform: translateY(-50%); width: 12px; height: 24px; background: linear-gradient(145deg, #6C3483 0%, #4A235A 100%); border-radius: 0 8px 8px 0;"></div>
                    <span style="font-size: 28px;">✓</span>
                </div>
                <div style="background: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-left: 5px solid #6C3483;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #4A235A;">Fill-in-Blank</span>
                </div>
            </div>
        </div>

        <!-- Dotted connecting lines (decorative) -->
        <svg style="position: absolute; top: 180px; left: 280px; width: 250px; height: 500px; pointer-events: none; z-index: 5;">
            <path d="M 0 150 Q 80 180, 120 250 T 200 320" stroke="#6C3483" stroke-width="3" stroke-dasharray="8,8" fill="none" opacity="0.3"/>
            <path d="M 30 80 Q 100 120, 140 180 T 220 240" stroke="#F39C12" stroke-width="3" stroke-dasharray="8,8" fill="none" opacity="0.3"/>
        </svg>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); background: linear-gradient(90deg, #6C3483 0%, #4A235A 100%); padding: 20px 60px; border-radius: 40px; box-shadow: 0 8px 30px rgba(74,35,90,0.4);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: white; letter-spacing: 2px;">Ready for Any Learning Style!</span>
        </div>

    </div>
</body>
</html>
