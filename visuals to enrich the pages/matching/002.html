<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Matching Worksheets - Features Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(160deg, #6B5BCD 0%, #5B4B9E 40%, #4A3C8C 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Background pattern - subtle puzzle shapes -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.08;" viewBox="0 0 1000 1000">
            <pattern id="puzzlePattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
                <path d="M 0 50 L 50 50 Q 50 25 75 25 Q 100 25 100 50 L 150 50 L 150 100 Q 175 100 175 125 Q 175 150 150 150 L 150 200 L 0 200 L 0 150 Q 25 150 25 125 Q 25 100 0 100 Z" fill="white"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#puzzlePattern)"/>
        </svg>

        <!-- Title Section -->
        <div style="
            position: absolute;
            top: 35px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 58px;
                color: white;
                margin: 0;
                text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            ">MATCHING WORKSHEETS</h1>
            <p style="
                font-family: 'Nunito', sans-serif;
                font-weight: 600;
                font-size: 26px;
                color: #FFD93D;
                margin: 8px 0 0 0;
            ">Everything You Need!</p>
        </div>

        <!-- Puzzle Grid - 2x2 Layout -->
        <div style="
            position: absolute;
            top: 170px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: 220px 220px;
            grid-template-rows: 180px 180px;
            gap: 15px;
            z-index: 15;
        ">
            <!-- Puzzle Piece 1 - Answer Keys (Top Left) -->
            <div style="
                background: linear-gradient(135deg, #5DCEA8 0%, #4AB890 100%);
                border-radius: 20px;
                padding: 20px;
                position: relative;
                box-shadow: 0 8px 25px rgba(93, 206, 168, 0.4);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            ">
                <!-- Puzzle notch right -->
                <div style="
                    position: absolute;
                    right: -18px;
                    top: 50%;
                    transform: translateY(-50%);
                    width: 36px;
                    height: 50px;
                    background: linear-gradient(135deg, #5DCEA8 0%, #4AB890 100%);
                    border-radius: 0 25px 25px 0;
                "></div>
                <!-- Puzzle notch bottom -->
                <div style="
                    position: absolute;
                    bottom: -18px;
                    left: 50%;
                    transform: translateX(-50%);
                    width: 50px;
                    height: 36px;
                    background: linear-gradient(180deg, #5DCEA8 0%, #4AB890 100%);
                    border-radius: 0 0 25px 25px;
                "></div>
                <svg width="55" height="55" viewBox="0 0 100 100" style="margin-bottom: 10px;">
                    <circle cx="50" cy="50" r="45" fill="white" opacity="0.25"/>
                    <path d="M 30 50 L 45 65 L 75 35" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 22px;
                    color: white;
                    text-align: center;
                    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
                ">Answer Keys<br/>Included</span>
            </div>

            <!-- Puzzle Piece 2 - Multiple Themes (Top Right) -->
            <div style="
                background: linear-gradient(135deg, #FF8A5C 0%, #FF6B4A 100%);
                border-radius: 20px;
                padding: 20px;
                position: relative;
                box-shadow: 0 8px 25px rgba(255, 138, 92, 0.4);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            ">
                <!-- Puzzle indent left -->
                <div style="
                    position: absolute;
                    left: -3px;
                    top: 50%;
                    transform: translateY(-50%);
                    width: 36px;
                    height: 50px;
                    background: linear-gradient(160deg, #6B5BCD 0%, #5B4B9E 100%);
                    border-radius: 0 25px 25px 0;
                "></div>
                <!-- Puzzle notch bottom -->
                <div style="
                    position: absolute;
                    bottom: -18px;
                    left: 50%;
                    transform: translateX(-50%);
                    width: 50px;
                    height: 36px;
                    background: linear-gradient(180deg, #FF8A5C 0%, #FF6B4A 100%);
                    border-radius: 0 0 25px 25px;
                "></div>
                <svg width="55" height="55" viewBox="0 0 100 100" style="margin-bottom: 10px;">
                    <circle cx="50" cy="50" r="45" fill="white" opacity="0.25"/>
                    <!-- Rainbow icon -->
                    <path d="M 20 70 Q 50 20 80 70" stroke="#FF6B6B" stroke-width="8" fill="none"/>
                    <path d="M 28 70 Q 50 30 72 70" stroke="#FFD93D" stroke-width="6" fill="none"/>
                    <path d="M 35 70 Q 50 40 65 70" stroke="#5DCEA8" stroke-width="5" fill="none"/>
                </svg>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 22px;
                    color: white;
                    text-align: center;
                    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
                ">Multiple<br/>Themes</span>
            </div>

            <!-- Puzzle Piece 3 - Varied Difficulty (Bottom Left) -->
            <div style="
                background: linear-gradient(135deg, #5BC0EB 0%, #4AA8D4 100%);
                border-radius: 20px;
                padding: 20px;
                position: relative;
                box-shadow: 0 8px 25px rgba(91, 192, 235, 0.4);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            ">
                <!-- Puzzle indent top -->
                <div style="
                    position: absolute;
                    top: -3px;
                    left: 50%;
                    transform: translateX(-50%);
                    width: 50px;
                    height: 36px;
                    background: linear-gradient(160deg, #6B5BCD 0%, #5B4B9E 100%);
                    border-radius: 0 0 25px 25px;
                "></div>
                <!-- Puzzle notch right -->
                <div style="
                    position: absolute;
                    right: -18px;
                    top: 50%;
                    transform: translateY(-50%);
                    width: 36px;
                    height: 50px;
                    background: linear-gradient(135deg, #5BC0EB 0%, #4AA8D4 100%);
                    border-radius: 0 25px 25px 0;
                "></div>
                <svg width="55" height="55" viewBox="0 0 100 100" style="margin-bottom: 10px;">
                    <circle cx="50" cy="50" r="45" fill="white" opacity="0.25"/>
                    <!-- Stairs icon -->
                    <rect x="20" y="70" width="20" height="15" fill="white"/>
                    <rect x="40" y="55" width="20" height="30" fill="white"/>
                    <rect x="60" y="40" width="20" height="45" fill="white"/>
                </svg>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 22px;
                    color: white;
                    text-align: center;
                    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
                ">Varied<br/>Difficulty</span>
            </div>

            <!-- Puzzle Piece 4 - Print & Go (Bottom Right) -->
            <div style="
                background: linear-gradient(135deg, #FFD93D 0%, #FFC107 100%);
                border-radius: 20px;
                padding: 20px;
                position: relative;
                box-shadow: 0 8px 25px rgba(255, 217, 61, 0.4);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            ">
                <!-- Puzzle indent top -->
                <div style="
                    position: absolute;
                    top: -3px;
                    left: 50%;
                    transform: translateX(-50%);
                    width: 50px;
                    height: 36px;
                    background: linear-gradient(160deg, #6B5BCD 0%, #5B4B9E 100%);
                    border-radius: 0 0 25px 25px;
                "></div>
                <!-- Puzzle indent left -->
                <div style="
                    position: absolute;
                    left: -3px;
                    top: 50%;
                    transform: translateY(-50%);
                    width: 36px;
                    height: 50px;
                    background: linear-gradient(160deg, #6B5BCD 0%, #5B4B9E 100%);
                    border-radius: 0 25px 25px 0;
                "></div>
                <svg width="55" height="55" viewBox="0 0 100 100" style="margin-bottom: 10px;">
                    <circle cx="50" cy="50" r="45" fill="white" opacity="0.25"/>
                    <!-- Printer icon -->
                    <rect x="25" y="25" width="50" height="15" rx="3" fill="white"/>
                    <rect x="20" y="40" width="60" height="30" rx="5" fill="white"/>
                    <rect x="30" y="55" width="40" height="25" fill="white"/>
                    <rect x="35" y="60" width="30" height="3" fill="#FFD93D"/>
                    <rect x="35" y="66" width="25" height="3" fill="#FFD93D"/>
                </svg>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 22px;
                    color: #5B4B9E;
                    text-align: center;
                    text-shadow: 0 1px 3px rgba(255,255,255,0.5);
                ">Print<br/>& Go!</span>
            </div>
        </div>

        <!-- Worksheet Preview - Bottom Center -->
        <div style="
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        ">
            <div style="
                background: white;
                padding: 10px;
                border-radius: 10px;
                box-shadow: 0 15px 40px rgba(0,0,0,0.35);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/matching/sample-5.jpeg"
                    alt="Matching Worksheet Preview"
                    style="
                        width: 170px;
                        height: 220px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 5px;
                        display: block;
                    "
                />
            </div>
        </div>

        <!-- Grade badge -->
        <div style="
            position: absolute;
            bottom: 25px;
            right: 40px;
            background: rgba(255,255,255,0.95);
            padding: 10px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        ">
            <span style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 20px;
                color: #5B4B9E;
            ">Grades K-2</span>
        </div>

        <!-- FREE badge -->
        <div style="
            position: absolute;
            bottom: 25px;
            left: 40px;
            background: linear-gradient(135deg, #FF6B4A 0%, #FF8A5C 100%);
            padding: 10px 22px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(255, 107, 74, 0.4);
            transform: rotate(-5deg);
        ">
            <span style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 22px;
                color: white;
                letter-spacing: 1px;
            ">FREE</span>
        </div>

        <!-- Decorative floating elements -->
        <div style="
            position: absolute;
            top: 200px;
            left: 30px;
            width: 20px;
            height: 20px;
            background: #FFD93D;
            border-radius: 50%;
            opacity: 0.7;
        "></div>
        <div style="
            position: absolute;
            top: 300px;
            right: 35px;
            width: 25px;
            height: 25px;
            background: #5DCEA8;
            border-radius: 50%;
            opacity: 0.7;
        "></div>
    </div>
</body>
</html>
