<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Pattern Worksheets - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #1A1A2E 0%, #16213E 60%, #0F3460 100%); overflow: hidden;">

        <!-- Subtle grid pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.05; background-image:
            linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;"></div>

        <!-- Glowing orbs in background -->
        <div style="position: absolute; top: 100px; left: 80px; width: 200px; height: 200px; background: radial-gradient(circle, rgba(39,174,96,0.15) 0%, transparent 70%); border-radius: 50%;"></div>
        <div style="position: absolute; top: 200px; right: 100px; width: 250px; height: 250px; background: radial-gradient(circle, rgba(241,196,15,0.12) 0%, transparent 70%); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 150px; left: 50%; width: 300px; height: 300px; background: radial-gradient(circle, rgba(230,126,34,0.1) 0%, transparent 70%); border-radius: 50%; transform: translateX(-50%);"></div>

        <!-- Title -->
        <div style="position: absolute; top: 40px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 72px; color: white; margin: 0; text-shadow: 4px 4px 0 rgba(108,52,131,0.6), 0 0 40px rgba(243,156,18,0.3);">LEVEL UP!</h1>
            <h2 style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 28px; color: #F39C12; margin: 10px 0 0 0; letter-spacing: 3px;">From Simple to Complex</h2>
        </div>

        <!-- Three ascending hexagonal platforms -->
        <div style="position: absolute; top: 200px; left: 0; right: 0; height: 600px;">

            <!-- Step 1: Lowest (AB Patterns) - Green -->
            <div style="position: absolute; left: 60px; bottom: 50px; z-index: 20;">
                <!-- Hexagonal platform -->
                <div style="position: relative;">
                    <!-- Platform glow -->
                    <div style="position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); width: 250px; height: 40px; background: radial-gradient(ellipse, rgba(39,174,96,0.5) 0%, transparent 70%);"></div>

                    <!-- Platform base -->
                    <div style="width: 220px; height: 50px; background: linear-gradient(180deg, #27AE60 0%, #1E8449 100%); clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%); box-shadow: 0 10px 30px rgba(39,174,96,0.4);"></div>

                    <!-- Label -->
                    <div style="position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background: rgba(39,174,96,0.9); padding: 8px 20px; border-radius: 20px;">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: white;">AB Patterns</span>
                    </div>

                    <!-- Worksheet on platform -->
                    <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);">
                        <img src="https://www.lessoncraftstudio.com/samples/english/pattern%20worksheet/sample-10.jpeg" style="width: 170px; height: 220px; object-fit: cover; border-radius: 10px; border: 5px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.4);">
                    </div>

                    <!-- START HERE badge -->
                    <div style="position: absolute; bottom: 280px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #27AE60 0%, #1E8449 100%); padding: 10px 18px; border-radius: 25px; box-shadow: 0 5px 15px rgba(39,174,96,0.5);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white; letter-spacing: 1px;">START HERE</span>
                    </div>
                </div>
            </div>

            <!-- Step 2: Middle (ABC Patterns) - Yellow -->
            <div style="position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 20;">
                <!-- Hexagonal platform -->
                <div style="position: relative;">
                    <!-- Platform glow -->
                    <div style="position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); width: 270px; height: 45px; background: radial-gradient(ellipse, rgba(241,196,15,0.5) 0%, transparent 70%);"></div>

                    <!-- Platform base -->
                    <div style="width: 240px; height: 55px; background: linear-gradient(180deg, #F1C40F 0%, #D4AC0D 100%); clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%); box-shadow: 0 12px 35px rgba(241,196,15,0.4);"></div>

                    <!-- Label -->
                    <div style="position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background: rgba(241,196,15,0.9); padding: 8px 20px; border-radius: 20px;">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: #1A1A2E;">ABC Patterns</span>
                    </div>

                    <!-- Worksheet on platform -->
                    <div style="position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%);">
                        <img src="https://www.lessoncraftstudio.com/samples/english/pattern%20worksheet/sample-11.jpeg" style="width: 190px; height: 246px; object-fit: cover; border-radius: 10px; border: 5px solid white; box-shadow: 0 12px 35px rgba(0,0,0,0.4);">
                    </div>

                    <!-- GROWING badge -->
                    <div style="position: absolute; bottom: 310px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #F1C40F 0%, #D4AC0D 100%); padding: 10px 20px; border-radius: 25px; box-shadow: 0 5px 15px rgba(241,196,15,0.5);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: #1A1A2E; letter-spacing: 1px;">GROWING!</span>
                    </div>
                </div>
            </div>

            <!-- Step 3: Highest (ABCD Patterns) - Orange -->
            <div style="position: absolute; right: 60px; bottom: 260px; z-index: 20;">
                <!-- Hexagonal platform -->
                <div style="position: relative;">
                    <!-- Platform glow (extra bright) -->
                    <div style="position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); width: 300px; height: 50px; background: radial-gradient(ellipse, rgba(230,126,34,0.6) 0%, transparent 70%);"></div>

                    <!-- Platform base -->
                    <div style="width: 260px; height: 60px; background: linear-gradient(180deg, #E67E22 0%, #CA6F1E 100%); clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%); box-shadow: 0 15px 40px rgba(230,126,34,0.5);"></div>

                    <!-- Label -->
                    <div style="position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background: rgba(230,126,34,0.9); padding: 8px 22px; border-radius: 20px;">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: white;">ABCD Patterns</span>
                    </div>

                    <!-- Worksheet on platform -->
                    <div style="position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);">
                        <img src="https://www.lessoncraftstudio.com/samples/english/pattern%20worksheet/sample-12.jpeg" style="width: 200px; height: 260px; object-fit: cover; border-radius: 10px; border: 5px solid white; box-shadow: 0 15px 40px rgba(0,0,0,0.45);">
                    </div>

                    <!-- MASTER badge with star -->
                    <div style="position: absolute; bottom: 330px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #E67E22 0%, #CA6F1E 100%); padding: 10px 22px; border-radius: 25px; box-shadow: 0 5px 15px rgba(230,126,34,0.5); display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 18px;">⭐</span>
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white; letter-spacing: 1px;">MASTER!</span>
                    </div>
                </div>
            </div>

            <!-- Curved dotted arrow path connecting levels -->
            <svg style="position: absolute; inset: 0; pointer-events: none; z-index: 10;" viewBox="0 0 1000 600">
                <!-- Arrow from step 1 to step 2 -->
                <path d="M 200 380 Q 320 350, 420 280" stroke="white" stroke-width="4" stroke-dasharray="12,8" fill="none" opacity="0.5"/>
                <polygon points="420,270 435,285 415,290" fill="white" opacity="0.6" transform="rotate(-30, 420, 280)"/>

                <!-- Arrow from step 2 to step 3 -->
                <path d="M 580 210 Q 680 180, 780 120" stroke="white" stroke-width="4" stroke-dasharray="12,8" fill="none" opacity="0.5"/>
                <polygon points="780,110 795,125 775,130" fill="white" opacity="0.6" transform="rotate(-30, 780, 120)"/>
            </svg>
        </div>

        <!-- Bottom Pills -->
        <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px;">
            <div style="background: rgba(255,255,255,0.95); padding: 14px 26px; border-radius: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); border: 3px solid #27AE60;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #1E8449;">All Skill Levels</span>
            </div>
            <div style="background: rgba(255,255,255,0.95); padding: 14px 26px; border-radius: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); border: 3px solid #F1C40F;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #B7950B;">Self-Paced</span>
            </div>
            <div style="background: rgba(255,255,255,0.95); padding: 14px 26px; border-radius: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); border: 3px solid #E67E22;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #CA6F1E;">Grades K-1</span>
            </div>
        </div>

    </div>
</body>
</html>
