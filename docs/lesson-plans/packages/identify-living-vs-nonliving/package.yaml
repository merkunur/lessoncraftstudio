assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Sort 12 mixed items into living vs non-living categories
        correctly in 8 of 10 attempts.
      - Articulate the living criteria ('living things grow + eat +
        reproduce') in 6 of 10 trials.
      - Identify edge cases (doll, robot, statue) as non-living with
        reasoning in 5 of 10 trials.

    Differentiation:
    - Pre-K: clear-contrast pairs only (real animal vs vehicle); 2
      categories.
    - K: 12-item mixed sort + 1 reasoning criterion.
    - Grade 1+: edge cases + 3 reasoning criteria; bridge to
      describe-plant-life-cycle living-process work.

