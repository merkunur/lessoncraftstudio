# Teaching package — read CVCe words (silent-e words)
# Arc 13 Phase 2 (Option G CONTINUATION; phonics-decoding 1/11 → 2/11).
# Resolves Arc 12 read-cvc-words forward-pointer.

targetSlug: read-cvce-words
language: en
title:
  en: "Reading CVCe Words — silent-e magic (cake, bike, home)"
description:
  en: "Grade 1 early-literacy package teaching CVCe (consonant-vowel-consonant-silent-e) word decoding. Builds on Arc 12 read-cvc-words. RESOLVES Arc 12 forward-pointer ('CVCe words — cake, bike, home — silent e at the end makes the vowel say its NAME'). Kids decode CVCe words by recognizing that silent-e changes the vowel from short (cap, bit, hop) to long (cape, bite, hope). 'Magic-e' or 'silent-e' phonics rule. 5 exercises + 7 materials over 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class magic-e routine. Teacher writes CVC + CVCe pairs:
      cap → cape; bit → bite; hop → hope. 'Watch the magic e — when
      we add e at the end, the vowel SAYS ITS NAME instead of its
      short sound.' Sound out each pair. Reinforces silent-e
      transformation rule.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + magic-e routine. Each pair receives 8 CVCe word
      cards. Pair takes turns: kid A points; kid B sounds out.
      Recast errors with explanation ('you said /bit/ for bite —
      look at the e at the end. Silent e makes the i say long-i:
      /b-aɪ-t/ — bite').
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (CVCe word to
      picture). Station 2: word-guess (CVCe filling). Station 3:
      manipulative cut-outs CVCe construction. Station 4: alphabet-
      train + word-scramble.
  closure:
    durationMinutes: 5
    body: |
      Whole-class read-aloud. Teacher writes 5 CVCe words; class
      reads. Forward-pointer: 'Today we read silent-e words. When
      we come back to phonics next, we will read CONSONANT BLENDS —
      tr, st, br, pl — where two consonants make a smooth-blended
      sound.'

