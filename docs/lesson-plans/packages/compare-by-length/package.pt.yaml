# Teaching package — compare 2 objects by length (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 9 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# pt sparse-override for early-numeracy / measurement strand (FIRST measurement
# pt sparse-override). BR Portuguese register per CLAUDE.md §6 + formal "você"
# address per §17.9.

title:
  pt: "Comparar por Comprimento — mais comprido, mais curto ou do mesmo tamanho?"
description:
  pt: "Pacote de matemática inicial para a Educação Infantil que ensina a comparação de comprimento. PRIMEIRO pacote do fio de medição no catálogo (sparse-override pt). Habilidade fundamental de medição: as crianças comparam diretamente dois objetos + nomeiam a comparação ('a cobra é mais comprida que a minhoca'). Trabalho pré-formal de medição — as crianças desenvolvem intuição de comparação de comprimento antes de encontrarem réguas + unidades numéricas. Ancorado em vocabulário — vocabulário comparativo (mais comprido / mais curto / do mesmo tamanho) reforçado."

structure:
  warmup:
    body: |
      Rotina de comparação direta com toda a turma. A professora ou o
      professor segura 2 objetos (por exemplo, um lápis + uma régua).
      "Qual é mais comprido?" A turma identifica. "Qual é mais
      curto?" A turma identifica. Repita com 4-5 pares de objetos com
      diferenças de comprimento variáveis. Reforça a habilidade de
      comparação visual que sustenta todo o trabalho de medição.
  contentActivity:
    body: |
      Trabalho em duplas + rotina de comparação lado a lado. Cada dupla
      recebe um conjunto de 6-8 recortes de papel de comprimento
      variável (cobra, minhoca, lápis, giz, régua, fita). A dupla
      compara cada item com um objeto de referência usando o modelo
      comparativo: "A cobra é mais comprida que a minhoca." / "A
      minhoca é mais curta que a cobra." Refraseie os erros com
      explicação ("você disse 'a cobra é curta' — vamos comparar com
      algo. A cobra é mais curta do que o quê? A cobra é mais comprida
      que a minhoca. Use 'mais comprida' ou 'mais curta' COM 'que X'
      para sabermos o que estamos comparando"). Extensão opcional: as
      crianças ordenam 3 objetos do mais curto ao mais comprido usando
      comparação direta.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios big-small (as
      crianças identificam maior/menor — conceito irmão que introduz
      raciocínio comparativo). Estação 2: folha de exercícios de
      emparelhamento (pares imagem-nome; reforça vocabulário que
      sustenta descrições de comprimento). Estação 3: comparação de
      comprimento prática com recortes manipulativos (as crianças
      ordenam objetos por comprimento usando comparação direta).
      Estação 4: tiras de frases (as crianças preenchem frases
      comparativas usando os modelos 'mais comprido' / 'mais curto'
      / 'do mesmo tamanho').
  closure:
    body: |
      Recordação rápida com toda a turma. A professora ou o professor
      exibe 4 objetos de comprimento variável; a turma os ordena
      coletivamente do mais curto ao mais comprido usando comparação
      direta. Indicador adiante: "Hoje comparamos 2 coisas por
      comprimento. Quando voltarmos a medir na próxima vez, compararemos
      o PESO — qual coisa é mais pesada e qual é mais leve — e a
      CAPACIDADE — qual recipiente comporta mais."

assessmentCriteria:
  pt: |
    Identificar qual de 2 objetos é mais comprido / mais curto em 8 de
    10 tentativas. Usar o modelo comparativo ('o X é mais comprido
    que o Y') em 7 de 10 tentativas de linguagem produtiva. Ordenar 3
    objetos do mais curto ao mais comprido usando comparação direta em
    6 de 10 tentativas.

    Diferenciação:
      - Pré-K: comparação direta de apenas 2 objetos; vocabulário
        produtivo limitado a uma única palavra ('mais comprido' / 'mais
        curto').
      - K: comparação de 2-3 objetos + modelo de gramática comparativa.
      - Primeiro ano em diante: estender para comprimento com unidades
        (unidades informais como 'quantos clipes de papel de
        comprimento?'); ponte para medição com régua (candidato Arco
        10+).

compositionalRationale:
  pt: |
    Fio principal: matemática inicial / medição (comparação de
    comprimento). Fio secundário: aquisição de vocabulário (ancorado
    em vocabulário — vocabulário comparativo mais comprido / mais
    curto / do mesmo tamanho é alvo de alta frequência K-3). Fio
    terciário: discriminação visual + raciocínio espacial (as crianças
    comparam visualmente comprimentos de objetos — mesmo substrato
    cognitivo do trabalho big-small / size-comparison).

    Significância arquitetural: PRIMEIRO sparse-override pt do fio de
    medição. Trabalho pré-formal de medição estabelece a fundação de
    raciocínio comparativo na qual a medição formal (réguas +
    unidades numéricas) é construída. Comparação de comprimento é o
    ponto canônico de partida K-3 — as crianças dominam comparação
    de comprimento antes de peso e capacidade (que requerem estratégias
    de comparação menos diretas).

    Relevância cultural pt-BR específica: vocabulário comparativo
    pt-BR ("mais comprido que" / "mais curto que" / "do mesmo
    tamanho") é alvo de alta frequência na educação infantil
    brasileira. Estruturas gramaticais comparativas em pt-BR usam
    "mais X que Y" (consistente com o padrão romance — francês "plus
    X que Y"; espanhol "más X que Y"; italiano "più X di Y"); este
    padrão romance é cognato-rico e dá às crianças em programas
    bilíngues pt-BR/es uma vantagem de transferência.

    Substrato Class B FLEXIBLE: composta contra a amplitude da
    biblioteca de imagens. Comparações de comprimento funcionam com
    QUAISQUER 2 objetos de comprimento distinto; prontidão de
    substrato é universal através de temas que tenham variação
    significativa de comprimento.
