compositionalRationale:
  en: |
    Primary strand: addition (target add-within-5; learning-targets.json places
    this in early-numeracy / addition-and-subtraction strand).
    Secondary strand: counting (count-on strategy operationally underlies
    every add-within-5 problem — kid sees N, counts on by M).
    Tertiary strand: phonics (code-addition exercise at position 3 maps a sum
    to a letter — light phonics integration without dilution of math focus).

    Distinctive material weighting: numeral-cards 1-5 (matches operand range).
    addition app composed in 4 different modes (image-image, image-number,
    find-addend, mixed) — heavy single-app load justified by the target's
    natural fit with addition as the only sensible mechanic. find-addend
    at position 4 introduces inverse thinking (3 + ? = 5) which bridges
    to find-missing-addend-within-10 (Grade 1+ adjacent target).
    code-addition at position 3 keeps the package vocabulary-bridged for
    multilingual K-3 contexts without compromising the numeracy focus.

curriculumStandards:
