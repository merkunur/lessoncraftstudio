# Teaching package — blend phonemes into CVC words
# Arc 19 Phase 1.2 Slot 4 (early-literacy / phonological-awareness strand 6/9 → 7/9). Opens phoneme-synthesis work: kids combine 3 individual phonemes into a single CVC word (/c/ + /a/ + /t/ → 'cat'). Reverse operation of the isolation cluster (Phase 1.1 Slot 3 + Phase 1.2 Slots 2+3). Pair-coherent prerequisite for Phase 1.3 candidate segment-cvc-into-phonemes (analysis-side; full 3-phoneme decomposition). Prerequisites per learning-targets.json line 40: isolate-initial-phoneme + isolate-final-phoneme (both ship by Phase 1.2 close).

targetSlug: blend-phonemes-cvc
language: en
title:
  en: "Blend Sounds — putting sounds together to make a word"
description:
  en: "Kindergarten early-literacy package teaching kids to BLEND individual phonemes into spoken CVC words. Direct reverse-operation of the isolation cluster (Phase 1.1 Slot 3 isolate-initial + Phase 1.2 Slot 2 isolate-final + Phase 1.2 Slot 3 isolate-medial): kids hear /c/ + /a/ + /t/ + smoothly combine them into 'cat'. Synthesis-side pedagogy: where isolation pulls a word APART, blending puts sounds TOGETHER. Phonological-awareness strand advances 6/9 → 7/9. Per learning-targets.json line 40 prerequisites: isolate-initial-phoneme (Phase 1.1 ✓ SHIPPED) + isolate-final-phoneme (Phase 1.2 Slot 2; ships concurrently). Critical decoding-bridge skill: blending is the cognitive operation underlying systematic phonics decoding — kids see a printed CVC word, sound out each letter, then blend the sounds to read the word. Per §A.13.30 K-1 informal framing: K blending work is CONCRETE SOUND-COMBINING via slow-to-fast blending — teacher says /c/.../a/.../t/ slowly then speeds up '/c-a-t/' then says 'cat'; kids copy. NOT formal phonological-encoding pedagogy. CCSS.RF.K.2e primary anchor ('Add or substitute individual sounds (phonemes) in simple, one-syllable words to make new words'). 5 worksheet exercises + 8 printable materials over a 1-week unit. **Phonological-awareness pedagogy is locale-specific — blending pedagogy differs per locale's syllabic structure.** Materials list mirrors isolate-initial/final/medial-phoneme Literacy 8-material canonical."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class blending hook. Teacher demonstrates phoneme-
      blending dramatically: "I'm going to say 3 sounds slowly,
      then BLEND them into a word. Listen: /c/.../a/.../t/.
      What word? /c-a-t/. CAT!" Kids notice the trick: separate
      sounds → combined word. Repeats with: "/d/.../o/.../g/.
      What's the word? /d-o-g/. DOG!" "/m/.../o/.../m/. /m-o-m/.
      MOM!" Pattern emphasis: "When we BLEND sounds, we put
      them TOGETHER. Three sounds become ONE WORD. It's like
      sliding the sounds together until they make a word we
      know." Critical pedagogical framing — the reverse-
      operation insight: "Last week we PULLED words APART into
      sounds. This week we're putting sounds TOGETHER to make
      words. Same sounds — opposite direction." Optional
      visualization: teacher holds 3 fingers up for /c/ /a/ /t/
      then claps them together when saying CAT.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + slow-to-fast blending routine. Each pair
      receives 8 picture cards with CVC vocabulary (cat, dog,
      pig, hen, bat, mat, sun, bus). Pair takes turns: kid A
      gives the 3 phonemes SLOWLY ("/c/.../a/.../t/"); kid B
      blends the phonemes + names the pictured word ('cat').
      Critical pedagogical technique: SLOW-TO-FAST progression.
      Start with phonemes separated by ~1 second pause; speed
      up progressively until phonemes touch ('/c-a-t/'); then
      the word emerges ('cat'). Kids who struggle with
      blending benefit from teacher modeling the slow-to-fast
      transition explicitly + co-blending alongside the kid
      ("let's blend together: /c/.../a/.../t/. /c-a-t/. CAT!").
      Recast errors with re-modeling — NOT correction —
      because blending is a cognitive integration skill that
      strengthens through repetition more than through
      correction. Common error patterns: (a) holding phonemes
      separated even at fast pace ("/c/, /a/, /t/" with stops
      between — teach the smooth slide); (b) substituting a
      similar phoneme during blending ("/c/.../a/.../t/" →
      'cot' — re-model with vowel emphasis; the medial-
      isolation work from Slot 3 supports this); (c) reversing
      phoneme order. Optional extension: kid A says the
      phonemes FAST + kid B identifies the word; reverse
      roles. Some kids benefit from BODY-MOVEMENT blending
      (clap once per phoneme then merge into one slide).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (3-
      phoneme cue → CVC picture; kids match a separated-
      phoneme cue to the resulting word picture). Station 2:
      word-guess (kids fill in a CVC word given separated
      phoneme cues — bridges blending to decoding). Station
      3: picture-sort (kids sort CVC pictures by first-or-
      final phoneme matching — reinforces phoneme awareness
      that supports blending). Station 4: word-scramble (kids
      unscramble CVC words; the scrambling-then-reassembly
      pedagogy parallels blending — putting parts back into
      a whole).
  closure:
    durationMinutes: 5
    body: |
      Whole-class blending quick-recall + cluster-status report.
      Teacher gives 3 separated phonemes; class shouts the
      blended word. "/s/.../u/.../n/" → SUN! "/p/.../i/.../g/"
      → PIG! "/b/.../a/.../t/" → BAT! "/h/.../e/.../n/" → HEN!
      Teacher then reports phono-awareness progress: "We've
      learned to ISOLATE sounds at the first, middle, AND
      last positions of a word. We've learned to BLEND sounds
      together to make a word. That's 4 of the 5 main
      phonological-awareness skills — rhyming was 1st (Arc 10),
      syllable-counting was 2nd, phoneme-isolation was 3rd
      (Slots 3+2+3 of Phase 1.1/1.2), blending is the 4th.
      Next we'll learn the 5th: SEGMENTATION — pulling words
      apart into separate sounds. Blending puts together;
      segmenting pulls apart. Same skill, opposite direction.
      We're almost done with phonological awareness!"

