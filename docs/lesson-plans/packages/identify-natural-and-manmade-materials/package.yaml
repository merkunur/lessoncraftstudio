assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Classify 12 of 16 objects as natural or manmade correctly.
      - Use vocabulary NATURAL / MANMADE accurately in 7 of 10
        trials.
      - Explain source-thinking ("where did this come from?") for
        5 of 10 objects.

    Differentiation:
    - Pre-K: 2-object pairs with very obvious classification
      (leaf vs plastic toy); receptive-only vocabulary.
    - K: 8-object classification with moderate-difficulty cases.
    - Grade 1+: extend to material-properties (hard/soft + smooth/
      rough + transparent/opaque) + bridge to material-uses work
      (matter-properties strand) + chemistry-foundation concepts.

