# Teaching package — identify and continue ABC patterns
# Arc 7 Phase 2 (Option A continuation; cognitive-and-executive-function /
# pattern-recognition strand). 3-element repeating pattern with three
# DIFFERENT items (vs AAB/ABB which have a doubled element). Class B
# FLEXIBLE; vocab-anchored.

targetSlug: identify-ABC-pattern
language: en
title:
  en: "ABC Patterns — three-element patterns with three distinct items"
description:
  en: "Kindergarten-Grade 1 cognitive-and-executive-function package teaching ABC pattern recognition. Builds on identify-AB-pattern + identify-AAB-ABB-patterns (Arc 7 Phase 1 prereqs). 3-element patterns with 3 DIFFERENT items: cat-dog-bird-cat-dog-bird-cat-dog-? Higher cognitive load than 2-element AB or 3-element AAB/ABB (no doubling shortcut). Vocab-anchored. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher reviews AB and AAB patterns
      from Phase 1. Then introduces ABC: "Now watch — THREE different
      items: cat, dog, bird, cat, dog, bird, cat, dog, ?" Class predicts
      "bird." Repeat with different object trios (red-blue-yellow;
      apple-banana-orange). Reinforces the ABC-pattern concept; vocabulary
      reinforced (kids name 3 different items per pattern). Pin to
      "Patterns" word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine. Teacher displays ABC patterns; class
      collaboratively continues each. Pair work: kid A creates an ABC
      pattern with 3 distinct paper-cut objects; kid B continues. Recast
      errors with explanation ("the pattern goes cat, dog, bird — so
      the next one must be... cat!"). Optional extension: kids translate
      body-action ABC patterns (clap, stomp, jump, clap, stomp, jump,
      clap, stomp, ?) — embodied 3-different-action pattern.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet ABC mode (kids
      complete ABC patterns). Station 2: pattern-worksheet mixed (kids
      identify and complete mixed AB / AAB / ABB / ABC patterns;
      cognitive load of switching between types). Station 3: matching
      worksheet (image-name vocabulary reinforcement). Station 4:
      manipulative cut-outs hands-on ABC construction.
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays mixed pattern types;
      class identifies type + completes each. Forward-pointer: "Today
      we learned ABC patterns. When we come back to patterns next, we'll
      learn AABB patterns — pairs of doubled items in repeating
      sequence."

