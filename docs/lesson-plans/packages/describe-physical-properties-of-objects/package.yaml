assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Describe 2-3 properties of 6 of 8 objects accurately in 7
        of 10 trials.
      - Sort objects into binary property categories (HARD/SOFT,
        SMOOTH/ROUGH) correctly in 8 of 10 trials.
      - Use property vocabulary (10 terms) accurately in 7 of 10
        trials.

    Differentiation:
    - Pre-K: 4-property scope (hard/soft + big/small); 1 property
      per object only.
    - K: 6-property scope (add smooth/rough, heavy/light); 2-3
      properties per object.
    - Grade 1+: full 10-property scope; 3+ properties per object;
      extend to matter-states (solid/liquid/gas).

