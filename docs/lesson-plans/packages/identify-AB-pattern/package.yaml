compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / pattern-recognition.
    Secondary strand: vocabulary acquisition (vocab-anchored — naming
    objects in the pattern reinforces vocabulary acquired across Arc 1-6).
    Tertiary strand: prediction + working-memory (kids hold the pattern
    rule in mind while predicting the next item).

    Architectural significance: this is the FIRST pattern-recognition
    strand package in the catalog. Validates pattern-train app integration
    + opens pattern-depth across Phase 1+2 (companion AAB/ABB/ABC/AABB
    pattern packages ship across Arc 7 phases). Cognitive-and-executive-
    function domain receives pattern-recognition as second strand
    coverage (after sorting-and-classification + logical-reasoning +
    memory-and-attention from Arc 5+6).

    Vocab-anchor framing continues from Arc 6 Phase 2: cognitive task
    (pattern recognition) is the architectural shape; vocabulary-anchor
    is the pedagogical thread. Pattern recognition naturally exercises
    vocabulary because kids name the alternating objects.

    Distinctive composition: 3 pattern-train exercises (positions 1, 3,
    5) across 3 theme contexts (animals, fruits, vehicles) — same AB
    mechanic; different vocabulary contexts. Validates pattern-train
    architecture generalizes across theme axes. matching at position 2
    + pattern-worksheet at position 4 break up the pattern-train rhythm
    with related cognitive surfaces.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    AB patterns work with ANY 2 distinct objects; substrate-readiness is
    universal across themes.

    K-3 multilingual classroom relevance: pattern-recognition is
    language-portable (rule applies regardless of locale); vocabulary-
    anchor makes the package contribute to language acquisition
    simultaneously. High-leverage K-3 multilingual classroom time use.

