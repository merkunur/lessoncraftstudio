compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / logical-reasoning.
    Secondary strand: working-memory + sustained attention (6×6 sudoku
    requires holding 6 picture-types in mind + the partial grid state
    + the rule).

    Pairing pattern with prereq package: solve-4x4-picture-sudoku (Arc 5
    Phase 3) provides the foundational sudoku architecture; this 6×6
    package is the cognitive-load step-up. Sequential prereq-chain:
    kids must complete 4×4 before attempting 6×6. The package's
    differentiation reflects this — 4×4 is K-territory; 6×6 is Grade 1+
    territory.

    Distinctive composition vs 4x4 sudoku (Arc 5 Phase 3): 4 sudoku
    exercises (positions 1, 3, 4, 5) + 1 matching at position 2.
    Difficulty progression: easy → medium → medium → hard. Reflects
    cognitive-load step-up appropriate for Grade 1+ kids attempting
    6×6 for the first time.

    Class B FLEXIBLE substrate: composes against any 6-key picture set;
    Phase 2's identify-and-name-vegetables (10 keys) + Arc 4's
    identify-and-name-foods (10 keys) + many other CLEAN clusters all
    work as picture substrate for the 6 sudoku picture-types per puzzle.
    Substrate-readiness measured by theme-coverage diversity, not
    specific keys.

    Cross-package architectural validation: 4×4 + 6×6 sudoku packages
    together validate that sudoku architecture generalizes across grid
    sizes (sudoku app supports 4 / 6 / 9 grid sizes; 9×9 reserved for
    Grade 2+ in future arcs).

    K-3 multilingual classroom relevance: same as 4×4 sudoku — language-
    agnostic at the puzzle level; vocabulary-anchored when kids name
    the pictures during placement. Cognitive-task + vocab-acquisition
    integration.

