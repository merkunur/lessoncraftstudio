<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Buchstabensalat - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(170deg, #FFF8E1 0%, #FCE4EC 45%, #F1F8E9 100%); overflow: hidden;">

        <!-- Subtle diagonal stripe texture -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image: repeating-linear-gradient(45deg, #C2185B 0px, #C2185B 1px, transparent 1px, transparent 20px);"></div>

        <!-- Small decorative letter tiles in corners at low opacity -->
        <!-- W tile top-left area -->
        <div style="position: absolute; top: 95px; left: 45px; width: 44px; height: 44px; background: linear-gradient(145deg, #C2185B, #AD1457); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(194,24,91,0.2); opacity: 0.35; transform: rotate(-6deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">W</span>
        </div>
        <!-- O tile top-right -->
        <div style="position: absolute; top: 120px; right: 50px; width: 40px; height: 40px; background: linear-gradient(145deg, #7CB342, #689F38); border-radius: 7px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(124,179,66,0.2); opacity: 0.3; transform: rotate(8deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">O</span>
        </div>
        <!-- R tile bottom-left -->
        <div style="position: absolute; bottom: 120px; left: 35px; width: 38px; height: 38px; background: linear-gradient(145deg, #FFB300, #FFA000); border-radius: 7px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(255,179,0,0.2); opacity: 0.3; transform: rotate(-10deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 21px; color: white;">R</span>
        </div>
        <!-- T tile bottom-right -->
        <div style="position: absolute; bottom: 145px; right: 40px; width: 42px; height: 42px; background: linear-gradient(145deg, #C2185B, #AD1457); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(194,24,91,0.2); opacity: 0.3; transform: rotate(5deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 23px; color: white;">T</span>
        </div>

        <!-- GRATIS hanging tab from top -->
        <div style="position: absolute; top: 0; left: 44px; z-index: 100;">
            <div style="background: linear-gradient(180deg, #C2185B, #AD1457); padding: 14px 24px 16px 24px; border-radius: 0 0 14px 14px; box-shadow: 0 6px 20px rgba(194,24,91,0.35);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.15);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 30px; right: 40px; z-index: 100; background: #7CB342; padding: 11px 24px; border-radius: 28px; box-shadow: 0 4px 16px rgba(124,179,66,0.35);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: white; letter-spacing: 1.5px;">VORSCHULE &ndash; KLASSE 2</span>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 65px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 66px; color: #37474F; margin: 0; line-height: 1.1;">Was steckt drin?</h1>
            <!-- Amber underline accent -->
            <div style="width: 180px; height: 5px; background: linear-gradient(90deg, #FFB300, #FFA000); border-radius: 3px; margin: 10px auto 0;"></div>
        </div>

        <!-- 5 Feature circles in arc -->
        <div style="position: absolute; top: 190px; left: 50%; transform: translateX(-50%); width: 880px; height: 240px; z-index: 30;">

            <!-- Circle 1: Buchstabenfelder (lime) -->
            <div style="position: absolute; left: 30px; top: 30px; text-align: center; width: 140px;">
                <div style="width: 110px; height: 110px; background: linear-gradient(145deg, #7CB342, #689F38); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 8px 28px rgba(124,179,66,0.35), 0 0 0 5px rgba(124,179,66,0.15);">
                    <span style="font-size: 44px;">&#x1F524;</span>
                </div>
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; color: #37474F; margin: 12px 0 0 0; line-height: 1.2;">Buchstaben-<br>felder</p>
            </div>

            <!-- Circle 2: Bildhinweise (berry) -->
            <div style="position: absolute; left: 190px; top: 5px; text-align: center; width: 140px;">
                <div style="width: 115px; height: 115px; background: linear-gradient(145deg, #C2185B, #AD1457); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 8px 28px rgba(194,24,91,0.3), 0 0 0 5px rgba(194,24,91,0.12);">
                    <span style="font-size: 46px;">&#x1F5BC;</span>
                </div>
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; color: #37474F; margin: 12px 0 0 0; line-height: 1.2;">Bild-<br>hinweise</p>
            </div>

            <!-- Circle 3: L&ouml;sungsbl&auml;tter (amber, center, largest) -->
            <div style="position: absolute; left: 50%; transform: translateX(-50%); top: -10px; text-align: center; width: 160px;">
                <div style="width: 135px; height: 135px; background: linear-gradient(145deg, #FFB300, #FFA000); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 10px 35px rgba(255,179,0,0.4), 0 0 0 6px rgba(255,179,0,0.15);">
                    <span style="font-size: 54px;">&#x1F511;</span>
                </div>
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: #37474F; margin: 12px 0 0 0; line-height: 1.2;">L&ouml;sungs-<br>bl&auml;tter</p>
            </div>

            <!-- Circle 4: Schwierigkeitsstufen (green) -->
            <div style="position: absolute; right: 190px; top: 5px; text-align: center; width: 140px;">
                <div style="width: 115px; height: 115px; background: linear-gradient(145deg, #43A047, #388E3C); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 8px 28px rgba(67,160,71,0.3), 0 0 0 5px rgba(67,160,71,0.12);">
                    <span style="font-size: 46px;">&#x1F4CA;</span>
                </div>
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; color: #37474F; margin: 12px 0 0 0; line-height: 1.2;">Schwierig-<br>keitsstufen</p>
            </div>

            <!-- Circle 5: Farbcodierung (pink) -->
            <div style="position: absolute; right: 30px; top: 30px; text-align: center; width: 140px;">
                <div style="width: 110px; height: 110px; background: linear-gradient(145deg, #E91E63, #D81B60); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 8px 28px rgba(233,30,99,0.3), 0 0 0 5px rgba(233,30,99,0.12);">
                    <span style="font-size: 44px;">&#x1F3A8;</span>
                </div>
                <p style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; color: #37474F; margin: 12px 0 0 0; line-height: 1.2;">Farb-<br>codierung</p>
            </div>
        </div>

        <!-- Worksheet + Answer Key side by side -->
        <div style="position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); display: flex; gap: 50px; align-items: flex-end; z-index: 20;">

            <!-- Worksheet -->
            <div style="text-align: center;">
                <div style="width: 260px; height: 337px; background: white; border-radius: 10px; box-shadow: 0 10px 35px rgba(0,0,0,0.15), 0 0 0 3px rgba(124,179,66,0.3); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/word%20scramble/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Buchstabensalat Arbeitsblatt">
                </div>
                <div style="margin-top: 12px; background: #7CB342; padding: 8px 28px; border-radius: 20px; display: inline-block; box-shadow: 0 3px 10px rgba(124,179,66,0.3);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: white;">ARBEITSBLATT</span>
                </div>
            </div>

            <!-- Answer Key -->
            <div style="text-align: center;">
                <div style="width: 260px; height: 337px; background: white; border-radius: 10px; box-shadow: 0 10px 35px rgba(0,0,0,0.15), 0 0 0 3px rgba(194,24,91,0.3); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/word%20scramble/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Buchstabensalat L&ouml;sungsblatt">
                </div>
                <div style="margin-top: 12px; background: #C2185B; padding: 8px 28px; border-radius: 20px; display: inline-block; box-shadow: 0 3px 10px rgba(194,24,91,0.3);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: white;">L&Ouml;SUNGSBLATT</span>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
