# Teaching package — identify and name action verbs
# Arc 12 Phase 1 Path A (substrate-unblocked at Stream A Phase 1 ship; early-
# literacy / vocabulary-acquisition strand 22/24 → 23/24). FAMILY-MEMBERS
# DEFERRAL CHAIN COUNTERPART. Action-verbs = 10 high-frequency K-3 verbs
# enabling productive-action description.

targetSlug: identify-and-name-action-verbs
language: en
title:
  en: "Action Words — name what people are doing"
description:
  en: "Preschool / Kindergarten early-literacy package teaching action-verb vocabulary. **Substrate-unblocked at Stream A Phase 1 ship (Arc 12 commencement).** Kids identify and name 10 high-frequency K-3 action verbs: run, jump, walk, sit, stand, sleep, eat, drink, play, read. Foundational productive-language vocabulary — verbs are the engine of sentence-construction. Bridges from receptive language ('point to the kid who is jumping') to productive language ('I can jump too!'). Vocab-anchored throughout. Composes against matching + sentence-strips for action-as-grammar work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action-and-name routine. Teacher demonstrates an
      action: "Watch me — I'm WALKING. Now you walk!" Class walks
      around the carpet. "What did we just do?" Class: "Walk." Repeat
      with 5-6 actions: jump, sit, stand, clap (extension), eat
      (pretend), drink (pretend), sleep (pretend), play, read
      (pretend reading). Reinforces verb-as-action embodied
      kinesthetically before symbolic vocabulary work.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + action-charades routine. Each pair receives 10
      action-verb picture cards. Pair takes turns: kid A picks a card
      + acts out the verb (without saying the word); kid B guesses
      the verb. Recast errors with explanation ("you said walk —
      let's look again. The kid is going FAST + on tiptoes — that's
      RUNNING, not walking"). Optional extension: kids combine 2
      verbs in mini-sequences ("first I run, then I sit") +
      partners follow.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (action-verb
      image to verb-name pair). Station 2: matching worksheet (action-
      verb to "I can ___" sentence frame). Station 3: manipulative
      cut-outs hands-on action-construction (kids assemble paper
      figures performing different actions; partner names each
      action). Station 4: word-guess (kids fill in action-verb
      letters from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class action-share. Each kid demonstrates an action they
      can do + names it ("I can jump!" "I can read!"). Forward-
      pointer: "Today we learned action words — verbs that name what
      people do. When we come back to action vocabulary next, we'll
      learn to combine action words into SHORT SENTENCES like 'The
      cat is sleeping' or 'I am eating an apple' — adding subjects
      + actions together."

