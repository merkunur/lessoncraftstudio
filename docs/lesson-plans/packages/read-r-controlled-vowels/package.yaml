compositionalRationale:
  en: |
    Primary strand: early-literacy / phonics-decoding (r-controlled
    vowel word reading; canonical strand-advancement 4 → 5). Secondary
    strand: phonological awareness (kids distinguish the bossy-R
    sound from regular vowel sounds). Tertiary strand: vocabulary
    acquisition (r-controlled anchor words drawn from familiar K-3
    vocabulary).

    Architectural significance: phonics-decoding strand-advancement
    (4 → 5 base canonical authored). Pair-coherent with read-vowel-
    teams (Arc 19 Phase 1.4 pair; both extend long-vowel work
    introduced at read-cvce-words in Arc 13). The vowel-team + r-
    controlled pair completes the canonical English-CVC-pattern long-
    vowel extension; together they cover the high-frequency Grade-1
    reading patterns (>50% of Grade-1 phonics target vocabulary).

    Distinctive composition: 2 matching + 2 word-guess + 1 word-
    scramble. Same composition shape as read-vowel-teams (pair-
    coherence in materials structure too). Manipulative-cut-outs
    variety mode supplies the 3 canonical r-controlled patterns
    (ar / or / merged-er-ir-ur) as letter-tile prompt set.

    Class B FLEXIBLE substrate: composes against animals + foods
    image-library themes (r-controlled-rich vocabulary: car, bird,
    horse, turtle, shark, corn, farm, fork). Animals theme
    particularly rich (bird, turtle, shark, horse, hornet, otter).

    K-3 multilingual classroom relevance: r-controlled vowels are
    English-CVC-pattern-specific. R-coloring of vowels is a
    distinctive feature of English (American English) + a few other
    languages. Other locales handle R-positioning differently —
    Spanish has tap-R vs trill-RR distinction (caro vs carro);
    Portuguese has flap-R vs strong-R distinction with regional
    realization (paulista vs carioca R-final); Italian has flap-R
    that doesn't color preceding vowels; German has uvular R that
    behaves like a vowel after vowel (Bahnhof — the R after A
    softens to schwa). Locale-variant sparse-overrides per Phase 3
    reframe R-work against locale-canonical R-positioning rather
    than transpose English r-controlled vowels.

