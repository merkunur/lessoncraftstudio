<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Draw Bag — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell, then this tool. Absolute /mini-tools/ paths so embeds and
       cross-context loads resolve identically. No core import.
       This tool DOES load one data file — /mini-tools/draw-bag-bags.json,
       which carries the bag book AND the picture skins — so the deploy cp
       MUST include *.json or the book 404s and the tool falls back to its
       free inline bags with the shapes skin only.
       The picture skins load from /image-library-webp/themes/; a 404 there
       shows an empty piece box and never changes what was drawn, because
       the skin is a rendering of the kind and never its identity.
       NO AUDIO: nothing here can 404 into silence. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/draw-bag.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    LCS.mount(DrawBag, { mount: '#lcs-root' });
  </script>
</body>
</html>
