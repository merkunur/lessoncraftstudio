compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition. Secondary strand: phonics. Tertiary
    strand: spatial / categorization (house-mapping at scaffold station 2 +
    location-talk in pair work — "the lamp is in the bedroom"). The category
    boundary is intentionally mixed (rooms + furniture + house parts) per
    learning-targets.json target definition; this gives broader applicability
    in actual K-3 classroom contexts where talk-about-home naturally crosses
    these subcategories.

curriculumStandards:
  - EYFS.ELG.UW
  - IB-PYP.WhereWeAre

assessmentCriteria:
  en: |
    Receptive 10/10; productive 8/10; frame use 6/10.

    Differentiation:
    - Pre-K: receptive only.
    - K / Grade 1: full productive + sentence-frame use.
    - Grade 2+: extend to location-prepositions ("the lamp is on the table") +
      house-tour narratives ("I open the door. I see the kitchen. I sit on the
      sofa.").

