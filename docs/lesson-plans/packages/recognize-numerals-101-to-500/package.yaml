assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Recognize 101-500 numerals by name in 7 of 10 trials.
      - Identify hundreds/tens/ones digits in three-digit numeral
        in 8 of 10 trials.
      - Compare two three-digit numerals correctly in 7 of 10
        trials.

    Differentiation:
    - Pre-K: skip three-digit; review recognize-numerals-1-to-20.
    - K: numerals 101-200 only.
    - Grade 1: 101-500 full coverage.
    - Grade 2+: extend to 501-999 + bridge to writing-three-digit-
      numerals + thousands-place introduction.

