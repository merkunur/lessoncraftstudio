assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the material of 6 common everyday objects
        from the canonical 6-vocabulary set (wood,
        plastic, metal, paper, fabric, glass) in 7 of 10
        trials.
      - Sort 12 mixed-material object cards into the 6
        material categories correctly in 6 of 10
        attempts.
      - Distinguish visually-similar materials (paper vs
        fabric thin; metal vs plastic shiny) correctly
        in 5 of 10 trials.
      - Use vocabulary 'made of' / 'material' / 'wood' /
        'plastic' / 'metal' / 'paper' / 'fabric' /
        'glass' correctly in 5 of 10 productive-language
        trials.
      - Find one classroom object made of each material
        (scavenger-hunt completion) in 5 of 6 material
        categories.

    Differentiation:
    - Pre-K: skip material identification; use identify-
      living-vs-nonliving (Arc 11) for broader
      classification first.
    - K: full 6-material identification with concrete
      object examples; classroom scavenger-hunt
      reinforces hands-on recognition.
    - Grade 1: extend to 8-material set (add rubber +
      ceramic); introduce material-PROPERTY vocabulary
      (hard/soft/smooth/rough); bridge to pair partner
      describe-material-properties (Phase 1.4+
      candidate; the property work depends on material-
      identification foundation).
    - Grade 2+: full NGSS 2-PS1-1 material-property
      investigation work (design experiments to test
      material properties: float-vs-sink, magnetic-
      vs-not, transparent-vs-opaque); bridge to
      materials-and-engineering (which materials to
      use for which jobs; the canonical Grade 3+
      engineering-design strand).

