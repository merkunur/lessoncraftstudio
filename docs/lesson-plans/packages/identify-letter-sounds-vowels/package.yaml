compositionalRationale:
  en: |
    Primary strand: early-literacy / letter-recognition (vowel letter-
    sound association — saturates strand 6/6). Secondary strand:
    phonics-decoding (vowel sounds + consonant sounds = CVC reading
    foundation). Tertiary strand: vocabulary acquisition (vowel-anchor
    words per sound).

    Architectural significance: SATURATES letter-recognition strand at
    6/6 — first letter-recognition strand-saturation post-Arc-12-
    substrate-completion + Arc-13 consonant-sounds. Resolves Arc 13
    forward-pointer. Letter-sound saturation is the canonical
    completion of the letter-recognition strand: kids now know
    letter-shapes (Arc 7-9) + uppercase/lowercase mappings (Arc 10-12)
    + consonant-sounds (Arc 13) + vowel-sounds (Arc 14 — this package).

    Distinctive composition: vowel-letter scope (5 letters: A, E, I,
    O, U) ALL with dual sounds (short + long) — 10 letter-sound
    associations vs Arc 13's 21 consonant-letter mappings (1 sound
    each). Tighter scope; deeper per-letter work.

    Class B FLEXIBLE substrate: composes against image-library breadth.

    K-3 multilingual classroom relevance: vowel-sound systems vary
    significantly across 11 platform locales — en has long-short
    distinction; es has 5 pure vowels (no long-short); fi has front-
    back vowel harmony; etc. Locale-variant sparse-overrides
    (clause b at Phase 3) will need substantial pedagogical
    adaptation per locale's vowel-sound inventory.

