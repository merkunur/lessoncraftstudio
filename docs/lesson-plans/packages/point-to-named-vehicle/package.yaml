assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Point to the correct vehicle picture-card when teacher names it
        in target language in 9 of 10 trials.
      - Point to the correct vehicle in a transportation-scene context
        (mixed vehicles visible; child finds the named one) in 8 of 10
        trials.
      - Match vehicle pictures to vehicle words in 8 of 10 trials.

    Differentiation:
    - Pre-K: 6-key receptive set (subset of the 10); flashcard recognition
      only.
    - K: 10-key receptive set; flashcard + transportation-scene context.
    - Grade 1+: bridge to productive identify-and-name-vehicles (Arc 2)
      + identify-transportation-types (Arc 5) — kids transition from
      pointing to naming + classification.

