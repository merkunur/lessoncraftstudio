<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Mehr Weniger - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(155deg, #E0F2F1 0%, #FFFDE7 45%, #E0F2F1 100%); overflow: hidden;">

        <!-- Subtle pattern overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.035; background-image: repeating-linear-gradient(60deg, #009688 0px, #009688 1px, transparent 1px, transparent 20px), repeating-linear-gradient(-60deg, #009688 0px, #009688 1px, transparent 1px, transparent 20px);"></div>

        <!-- Soft radial glow behind worksheets -->
        <div style="position: absolute; top: 55%; left: 50%; width: 800px; height: 700px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(0,150,136,0.07) 0%, rgba(255,179,0,0.05) 40%, transparent 70%); border-radius: 50%;"></div>

        <!-- Floating comparison symbols -->
        <div style="position: absolute; top: 180px; left: 55px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 48px; color: rgba(30,136,229,0.12); transform: rotate(-15deg);">&gt;</div>
        <div style="position: absolute; top: 320px; left: 30px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; color: rgba(255,107,107,0.12); transform: rotate(10deg);">&lt;</div>
        <div style="position: absolute; top: 420px; right: 35px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 42px; color: rgba(76,175,80,0.12); transform: rotate(-8deg);">=</div>
        <div style="position: absolute; top: 260px; right: 55px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 38px; color: rgba(30,136,229,0.10); transform: rotate(20deg);">&gt;</div>
        <div style="position: absolute; bottom: 310px; left: 80px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; color: rgba(255,179,0,0.12); transform: rotate(-5deg);">=</div>
        <div style="position: absolute; bottom: 260px; right: 70px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 40px; color: rgba(255,107,107,0.10); transform: rotate(12deg);">&lt;</div>

        <!-- Sparkle dots -->
        <div style="position: absolute; top: 210px; left: 120px; width: 7px; height: 7px; background: #FFD54F; border-radius: 50%; box-shadow: 0 0 14px 5px rgba(255,213,79,0.5);"></div>
        <div style="position: absolute; top: 380px; right: 100px; width: 6px; height: 6px; background: #26A69A; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(38,166,154,0.4);"></div>
        <div style="position: absolute; top: 290px; left: 200px; width: 5px; height: 5px; background: #FF6B6B; border-radius: 50%; box-shadow: 0 0 10px 4px rgba(255,107,107,0.35);"></div>
        <div style="position: absolute; bottom: 350px; right: 180px; width: 6px; height: 6px; background: #FFD54F; border-radius: 50%; box-shadow: 0 0 12px 5px rgba(255,213,79,0.4);"></div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 25px; left: 28px; z-index: 100;">
            <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #FDD835 0%, #F9A825 100%); border-radius: 50%; box-shadow: 0 8px 28px rgba(249,168,37,0.5), inset 0 -4px 10px rgba(0,0,0,0.12), inset 0 4px 8px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #3E2723; text-shadow: 0 1px 2px rgba(255,255,255,0.4);">GRATIS</span>
            </div>
        </div>

        <!-- VORSCHULE Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: rgba(255,255,255,0.95); padding: 11px 22px; border-radius: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #009688;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #009688; letter-spacing: 1px;">VORSCHULE</span>
        </div>

        <!-- Main Title - Size-varying typography -->
        <div style="position: absolute; top: 100px; left: 0; right: 0; text-align: center; z-index: 40;">
            <div style="display: inline-flex; align-items: baseline; gap: 14px;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 82px; color: #00796B; text-shadow: 3px 3px 0 rgba(0,121,107,0.1);">MEHR</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 72px; color: #1E88E5; text-shadow: 2px 2px 0 rgba(30,136,229,0.15);">&gt;</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #FF6B6B; text-shadow: 2px 2px 0 rgba(255,107,107,0.12);">WENIGER</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 48px; color: #FFB300;">?</span>
            </div>
            <div style="margin-top: 4px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 24px; color: #26A69A; letter-spacing: 3px;">Vergleichs-Arbeitsbl&auml;tter</span>
            </div>
        </div>

        <!-- Worksheet Display Area -->
        <div style="position: absolute; top: 265px; left: 50%; transform: translateX(-50%); width: 860px; height: 470px;">

            <!-- Main hero worksheet (center, large) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-55%); z-index: 20;">
                <div style="position: relative;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/more%20less/sample-1.jpeg" style="width: 260px; height: 337px; object-fit: cover; border-radius: 12px; border: 6px solid white; box-shadow: 0 18px 50px rgba(0,0,0,0.25), 0 0 25px rgba(0,150,136,0.1);">
                    <div style="position: absolute; inset: -20px; background: radial-gradient(ellipse, rgba(0,150,136,0.06) 0%, transparent 65%); z-index: -1; border-radius: 30px;"></div>
                </div>
            </div>

            <!-- Right side stacked worksheets (showing variety) -->
            <div style="position: absolute; right: 65px; top: 20px; z-index: 10;">
                <div style="width: 200px; height: 259px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #FFB74D; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/more%20less/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Vergleichsarbeitsblatt">
                </div>
            </div>
            <div style="position: absolute; right: 100px; top: 175px; z-index: 5;">
                <div style="width: 175px; height: 227px; background: white; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.15), 0 0 0 3px #26A69A; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/more%20less/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bild-Zahl-Vergleich">
                </div>
            </div>

            <!-- Comparison symbol circles between worksheets -->
            <div style="position: absolute; left: 365px; top: 140px; z-index: 30; width: 48px; height: 48px; background: linear-gradient(145deg, #1E88E5, #1565C0); border-radius: 50%; box-shadow: 0 4px 14px rgba(30,136,229,0.45); display: flex; align-items: center; justify-content: center; border: 3px solid white;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white;">&gt;</span>
            </div>
            <div style="position: absolute; left: 490px; top: 260px; z-index: 30; width: 42px; height: 42px; background: linear-gradient(145deg, #FF6B6B, #EF5350); border-radius: 50%; box-shadow: 0 4px 12px rgba(255,107,107,0.45); display: flex; align-items: center; justify-content: center; border: 3px solid white;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">&lt;</span>
            </div>
            <div style="position: absolute; left: 200px; top: 200px; z-index: 30; width: 42px; height: 42px; background: linear-gradient(145deg, #4CAF50, #388E3C); border-radius: 50%; box-shadow: 0 4px 12px rgba(76,175,80,0.45); display: flex; align-items: center; justify-content: center; border: 3px solid white;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">=</span>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 110px; left: 0; right: 0; background: linear-gradient(90deg, rgba(0,121,107,0.95) 0%, rgba(0,105,92,0.95) 100%); padding: 14px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.1), 0 4px 20px rgba(0,0,0,0.1);">
            <div style="text-align: center; display: flex; align-items: center; justify-content: center; gap: 12px;">
                <!-- Download icon -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="flex-shrink: 0;">
                    <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); letter-spacing: 1px;">Sofort herunterladen!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;">
            <div style="background: white; padding: 11px 18px; border-radius: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #009688;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #009688;">L&ouml;sungsschl&uuml;ssel</span>
            </div>
            <div style="background: white; padding: 11px 18px; border-radius: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #FFB300;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #F57F17;">Sofort druckbar</span>
            </div>
            <div style="background: white; padding: 11px 18px; border-radius: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #1E88E5;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #1565C0;">Gr&ouml;&szlig;er &bull; Kleiner &bull; Gleich</span>
            </div>
        </div>

    </div>
</body>
</html>
