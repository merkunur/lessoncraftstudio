<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Prepositions Worksheets - Features Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(160deg, #FFFFFF 0%, #F5F3FF 50%, #EDE9FE 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Faint floating preposition words in background -->
        <div style="position: absolute; top: 180px; left: 30px; font-family: 'Fredoka', sans-serif; font-size: 48px; color: rgba(109,40,217,0.04); font-weight: 700; transform: rotate(-15deg);">above</div>
        <div style="position: absolute; top: 400px; right: 20px; font-family: 'Fredoka', sans-serif; font-size: 42px; color: rgba(109,40,217,0.04); font-weight: 700; transform: rotate(10deg);">below</div>
        <div style="position: absolute; bottom: 300px; left: 40px; font-family: 'Fredoka', sans-serif; font-size: 38px; color: rgba(249,112,102,0.05); font-weight: 700; transform: rotate(-8deg);">between</div>
        <div style="position: absolute; top: 600px; right: 60px; font-family: 'Fredoka', sans-serif; font-size: 44px; color: rgba(251,191,36,0.05); font-weight: 700; transform: rotate(12deg);">behind</div>

        <!-- FREE Badge - Tab from top -->
        <div style="
            position: absolute;
            top: 0;
            left: 60px;
            z-index: 20;
        ">
            <div style="
                background: linear-gradient(180deg, #F97066 0%, #EF4444 100%);
                color: white;
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 26px;
                padding: 16px 24px 12px 24px;
                border-radius: 0 0 14px 14px;
                box-shadow: 0 6px 20px rgba(249, 112, 102, 0.4);
                letter-spacing: 1px;
            ">FREE</div>
        </div>

        <!-- Grade Badge - Top Right -->
        <div style="
            position: absolute;
            top: 45px;
            right: 40px;
            background: linear-gradient(135deg, #6D28D9 0%, #7C3AED 100%);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 20px;
            padding: 10px 22px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.35);
            z-index: 20;
        ">GRADES PreK-2</div>

        <!-- Title -->
        <div style="
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 68px;
                color: #6D28D9;
                margin: 0;
                text-shadow: 0 2px 8px rgba(109, 40, 217, 0.1);
            ">What's Inside?</h1>
        </div>

        <!-- 5 Feature circles in arc -->
        <div style="
            position: absolute;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 240px;
            z-index: 15;
        ">
            <!-- Feature 1: Themed Worksheets -->
            <div style="
                position: absolute;
                left: 30px;
                top: 50px;
                text-align: center;
                width: 130px;
            ">
                <div style="
                    width: 100px;
                    height: 100px;
                    background: linear-gradient(135deg, #6D28D9 0%, #8B5CF6 100%);
                    border-radius: 50%;
                    margin: 0 auto 10px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 6px 20px rgba(109, 40, 217, 0.35);
                ">
                    <svg width="48" height="48" viewBox="0 0 100 100">
                        <circle cx="50" cy="40" r="25" fill="none" stroke="white" stroke-width="5"/>
                        <line x1="50" y1="15" x2="50" y2="5" stroke="white" stroke-width="4" stroke-linecap="round"/>
                        <line x1="30" y1="22" x2="24" y2="14" stroke="white" stroke-width="4" stroke-linecap="round"/>
                        <line x1="70" y1="22" x2="76" y2="14" stroke="white" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 25 65 Q 50 85 75 65" stroke="white" stroke-width="5" fill="none"/>
                        <line x1="25" y1="65" x2="25" y2="50" stroke="white" stroke-width="4"/>
                        <line x1="75" y1="65" x2="75" y2="50" stroke="white" stroke-width="4"/>
                    </svg>
                </div>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 16px;
                    color: #6D28D9;
                    line-height: 1.2;
                ">Themed<br/>Worksheets</span>
            </div>

            <!-- Feature 2: Answer Keys -->
            <div style="
                position: absolute;
                left: 195px;
                top: 15px;
                text-align: center;
                width: 130px;
            ">
                <div style="
                    width: 100px;
                    height: 100px;
                    background: linear-gradient(135deg, #06B6D4 0%, #0891B2 100%);
                    border-radius: 50%;
                    margin: 0 auto 10px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 6px 20px rgba(6, 182, 212, 0.35);
                ">
                    <svg width="48" height="48" viewBox="0 0 100 100">
                        <circle cx="35" cy="35" r="20" fill="none" stroke="white" stroke-width="6"/>
                        <circle cx="35" cy="35" r="8" fill="white"/>
                        <line x1="50" y1="50" x2="85" y2="85" stroke="white" stroke-width="6" stroke-linecap="round"/>
                        <line x1="85" y1="85" x2="85" y2="70" stroke="white" stroke-width="5" stroke-linecap="round"/>
                        <line x1="70" y1="70" x2="70" y2="58" stroke="white" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </div>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 16px;
                    color: #0891B2;
                    line-height: 1.2;
                ">Answer<br/>Keys</span>
            </div>

            <!-- Feature 3: Cut & Paste (center, highest) -->
            <div style="
                position: absolute;
                left: 385px;
                top: 0;
                text-align: center;
                width: 130px;
            ">
                <div style="
                    width: 110px;
                    height: 110px;
                    background: linear-gradient(135deg, #F97066 0%, #EF4444 100%);
                    border-radius: 50%;
                    margin: 0 auto 10px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 6px 20px rgba(249, 112, 102, 0.4);
                ">
                    <svg width="52" height="52" viewBox="0 0 100 100">
                        <circle cx="35" cy="75" r="14" fill="none" stroke="white" stroke-width="5"/>
                        <circle cx="65" cy="75" r="14" fill="none" stroke="white" stroke-width="5"/>
                        <path d="M 43 65 L 55 25" stroke="white" stroke-width="5" stroke-linecap="round"/>
                        <path d="M 57 65 L 45 25" stroke="white" stroke-width="5" stroke-linecap="round"/>
                    </svg>
                </div>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 16px;
                    color: #EF4444;
                    line-height: 1.2;
                ">Cut &amp;<br/>Paste</span>
            </div>

            <!-- Feature 4: Multiple Themes -->
            <div style="
                position: absolute;
                left: 570px;
                top: 15px;
                text-align: center;
                width: 130px;
            ">
                <div style="
                    width: 100px;
                    height: 100px;
                    background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
                    border-radius: 50%;
                    margin: 0 auto 10px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
                ">
                    <svg width="48" height="48" viewBox="0 0 100 100">
                        <circle cx="50" cy="30" r="12" fill="white"/>
                        <circle cx="30" cy="55" r="12" fill="white"/>
                        <circle cx="70" cy="55" r="12" fill="white"/>
                        <circle cx="50" cy="75" r="12" fill="white"/>
                        <circle cx="50" cy="52" r="8" fill="white" opacity="0.6"/>
                    </svg>
                </div>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 16px;
                    color: #D97706;
                    line-height: 1.2;
                ">Multiple<br/>Themes</span>
            </div>

            <!-- Feature 5: Print Ready -->
            <div style="
                position: absolute;
                left: 740px;
                top: 50px;
                text-align: center;
                width: 130px;
            ">
                <div style="
                    width: 100px;
                    height: 100px;
                    background: linear-gradient(135deg, #1E1B4B 0%, #312E81 100%);
                    border-radius: 50%;
                    margin: 0 auto 10px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 6px 20px rgba(30, 27, 75, 0.35);
                ">
                    <svg width="48" height="48" viewBox="0 0 100 100">
                        <rect x="25" y="15" width="50" height="18" rx="3" fill="white"/>
                        <rect x="18" y="33" width="64" height="35" rx="5" fill="white"/>
                        <rect x="28" y="55" width="44" height="28" fill="white"/>
                        <rect x="34" y="62" width="32" height="3" fill="#312E81"/>
                        <rect x="34" y="69" width="24" height="3" fill="#312E81"/>
                    </svg>
                </div>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 16px;
                    color: #1E1B4B;
                    line-height: 1.2;
                ">Print<br/>Ready</span>
            </div>
        </div>

        <!-- Worksheet + Answer Key side by side -->
        <div style="
            position: absolute;
            top: 430px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 60px;
            z-index: 15;
        ">
            <!-- Worksheet -->
            <div style="text-align: center;">
                <div style="
                    background: white;
                    padding: 10px;
                    border-radius: 10px;
                    box-shadow: 0 12px 35px rgba(109, 40, 217, 0.2);
                    border: 2px solid #EDE9FE;
                ">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-2.jpeg"
                        alt="Prepositions Worksheet"
                        style="
                            width: 240px;
                            height: 311px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 5px;
                            display: block;
                        "
                    />
                </div>
                <div style="
                    margin-top: 12px;
                    background: linear-gradient(135deg, #6D28D9 0%, #8B5CF6 100%);
                    padding: 6px 20px;
                    border-radius: 15px;
                    display: inline-block;
                ">
                    <span style="
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 600;
                        font-size: 18px;
                        color: white;
                    ">Worksheet</span>
                </div>
            </div>

            <!-- Answer Key -->
            <div style="text-align: center;">
                <div style="
                    background: white;
                    padding: 10px;
                    border-radius: 10px;
                    box-shadow: 0 12px 35px rgba(109, 40, 217, 0.2);
                    border: 2px solid #EDE9FE;
                ">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-2-answer.jpeg"
                        alt="Answer Key"
                        style="
                            width: 240px;
                            height: 311px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 5px;
                            display: block;
                        "
                    />
                </div>
                <div style="
                    margin-top: 12px;
                    background: linear-gradient(135deg, #06B6D4 0%, #0891B2 100%);
                    padding: 6px 20px;
                    border-radius: 15px;
                    display: inline-block;
                ">
                    <span style="
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 600;
                        font-size: 18px;
                        color: white;
                    ">Answer Key</span>
                </div>
            </div>
        </div>

        <!-- Decorative dots -->
        <div style="position: absolute; top: 120px; left: 50px; width: 14px; height: 14px; background: #FBBF24; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; top: 390px; right: 50px; width: 12px; height: 12px; background: #F97066; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; bottom: 80px; left: 70px; width: 10px; height: 10px; background: #06B6D4; border-radius: 50%; opacity: 0.5;"></div>
    </div>
</body>
</html>
