assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 6 of 8 community places (school + library + supermarket
        + hospital + fire station + park + bakery + post office)
        from picture prompts in 8 of 10 trials.
      - Match place → primary function in 6 of 8 trials using
        4-choice options.
      - Distinguish community-places from not-community-places
        (places-out-in-the-community vs places-inside-our-home)
        in 8 of 10 picture-sort trials.
      - Describe a community-place using the sentence frame \"We
        go to the ___ to ___\" in 4 of 6 productive trials.

    Differentiation:
    - Pre-K: 4 most-familiar places (school + park + supermarket
      + library); receptive matching only; no sentence-frame
      requirement.
    - K: full 8-place set; matching + categorical sorting +
      sentence-frame introduction.
    - Grade 1+: extend to community-as-system thinking (how do
      community places + helpers + routines connect?) + civic-
      engagement extensions (who else uses this place? when is
      it open? what rules apply?) at Arc 18+ if filed; bridge
      to social-studies geographic-community work.

