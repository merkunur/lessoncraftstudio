assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the relation in a 2-image pair from 4 named-relation
        options (young-grown, animal-home, animal-food, tool-action)
        in 8 of 10 trials.
      - Complete a 4-card analogy (A↔B as C↔?) from 3-choice options
        in 7 of 10 trials.
      - Produce a verbal analogy completion using the sentence frame
        \"___ is to ___ as ___ is to ___\" in 5 of 8 productive
        trials.
      - Generate one original analogy pair given a starting pair
        (open-ended; teacher accepts any relation kid can articulate)
        in 4 of 6 trials.

    Differentiation:
    - Pre-K: 2-relation set (young-grown + animal-food); receptive
      matching only; no verbal frame requirement.
    - K: 4-relation set; matching + 3-choice completion; verbal
      frame introduced.
    - Grade 1+: 6-relation set; productive verbal frames + original-
      analogy generation; bridge to abstract analogy (e.g.,
      part-whole, function-purpose) at Arc 18+ if filed.

