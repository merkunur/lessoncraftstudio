description:
  en: "Comprehensive K-3 bundle centered on beach + seaside vocabulary spanning equipment + activities + sensory experience + cognitive sorting. 4 packages span vocabulary-acquisition (identify-and-name-clothing — beach-specific clothing: swimsuit, sun hat, flip-flops; identify-and-name-action-verbs — beach actions: swim, dig, build sandcastle, splash) + cognitive sorting (sort-by-color — beach colors: blue water, yellow sand, multi-color seashells; identify-and-name-foods — beach picnic foods: ice cream, sandwiches, watermelon, juice). Cross-strand seasonal/outdoor bundle pairing with summer-bundle (Pillar 2 Arc 4 Phase 1) — beach activities are canonical summer-context experience. Suitable for a 4-week classroom unit on summer + ocean awareness + family-beach-day activities."

