<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Suites Logiques — Miniature Héros</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #F3E5F5 0%, #E1BEE7 40%, #CE93D8 100%); overflow: hidden;">

        <!-- Decorative circles -->
        <div style="position: absolute; top: -60px; left: -60px; width: 220px; height: 220px; background: #9C27B0; border-radius: 50%; opacity: 0.15;"></div>
        <div style="position: absolute; bottom: -40px; right: -40px; width: 180px; height: 180px; background: #6A1B9A; border-radius: 50%; opacity: 0.12;"></div>
        <div style="position: absolute; top: 400px; left: -30px; width: 80px; height: 80px; background: #4CAF50; border-radius: 50%; opacity: 0.1;"></div>

        <!-- Sparkle dots -->
        <div style="position: absolute; top: 180px; left: 80px; width: 10px; height: 10px; background: #4CAF50; border-radius: 50%; opacity: 0.4;"></div>
        <div style="position: absolute; top: 320px; right: 90px; width: 8px; height: 8px; background: #9C27B0; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; bottom: 250px; left: 150px; width: 6px; height: 6px; background: #AB47BC; border-radius: 50%; opacity: 0.35;"></div>
        <div style="position: absolute; top: 450px; right: 60px; width: 12px; height: 12px; background: #CE93D8; border-radius: 50%; opacity: 0.5;"></div>

        <!-- Pattern symbol decorations -->
        <div style="position: absolute; top: 200px; left: 50px; font-size: 36px; color: #9C27B0; opacity: 0.2; font-weight: 700;">◆</div>
        <div style="position: absolute; top: 380px; right: 45px; font-size: 28px; color: #4CAF50; opacity: 0.2; font-weight: 700;">●</div>
        <div style="position: absolute; bottom: 300px; left: 30px; font-size: 32px; color: #AB47BC; opacity: 0.15; font-weight: 700;">▲</div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 20px; left: 22px; z-index: 100;">
            <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #F44336 0%, #D32F2F 100%); clip-path: polygon(50% 0%, 61% 15%, 80% 10%, 75% 28%, 95% 40%, 82% 52%, 90% 72%, 73% 68%, 62% 88%, 50% 76%, 38% 88%, 27% 68%, 10% 72%, 18% 52%, 5% 40%, 25% 28%, 20% 10%, 39% 15%); display: flex; align-items: center; justify-content: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">GRATUIT</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 30px; right: 30px; background: #6A1B9A; padding: 10px 22px; border-radius: 24px; box-shadow: 0 4px 12px rgba(106,27,154,0.35);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: white; letter-spacing: 1px;">MS GS CP CE1</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 90px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 72px; color: #4A148C; margin: 0; text-shadow: 2px 2px 0 rgba(74,20,140,0.1);">Suites Logiques</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 38px; color: #9C27B0; margin: 4px 0 0 0;">Lot complet</h2>
        </div>

        <!-- 4-Worksheet Fan Display -->
        <div style="position: absolute; top: 230px; left: 50%; transform: translateX(-50%); width: 820px; height: 460px;">
            <!-- Worksheet 4 (back left) -->
            <div style="position: absolute; left: 60px; top: 40px; z-index: 5; transform: rotate(-6deg);">
                <div style="width: 200px; height: 270px; background: white; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); border: 4px solid #AB47BC; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/french/pattern%20worksheet/Puzzles%20de%20Motifs%204.webp" style="width: 100%; height: 100%; object-fit: cover;" alt="Fiche suites logiques 4">
                </div>
            </div>

            <!-- Worksheet 3 -->
            <div style="position: absolute; left: 175px; top: 20px; z-index: 10; transform: rotate(-2deg);">
                <div style="width: 210px; height: 280px; background: white; border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,0.18); border: 4px solid #AB47BC; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/french/pattern%20worksheet/Puzzles%20de%20Motifs%202.webp" style="width: 100%; height: 100%; object-fit: cover;" alt="Fiche suites logiques 2">
                </div>
            </div>

            <!-- Worksheet 1 (center, largest) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 20;">
                <div style="width: 240px; height: 320px; background: white; border-radius: 12px; box-shadow: 0 16px 44px rgba(0,0,0,0.25); border: 5px solid #AB47BC; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/french/pattern%20worksheet/Puzzles%20de%20Motifs%201.webp" style="width: 100%; height: 100%; object-fit: cover;" alt="Fiche suites logiques 1">
                </div>
            </div>

            <!-- Worksheet 3 (right) -->
            <div style="position: absolute; right: 160px; top: 20px; z-index: 10; transform: rotate(2deg);">
                <div style="width: 210px; height: 280px; background: white; border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,0.18); border: 4px solid #AB47BC; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/french/pattern%20worksheet/Puzzles%20de%20Motifs%203.webp" style="width: 100%; height: 100%; object-fit: cover;" alt="Fiche suites logiques 3">
                </div>
            </div>

            <!-- Worksheet 4 (back right) -->
            <div style="position: absolute; right: 60px; top: 40px; z-index: 5; transform: rotate(6deg);">
                <div style="width: 200px; height: 270px; background: white; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); border: 4px solid #AB47BC; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/french/pattern%20worksheet/pattern_worksheet.webp" style="width: 100%; height: 100%; object-fit: cover;" alt="Fiche suites logiques">
                </div>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); background: #6A1B9A; padding: 14px 50px; border-radius: 30px; box-shadow: 0 6px 20px rgba(106,27,154,0.4);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white;">Lot Logique</span>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 28px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 18px;">✓</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #555;">Corrigés</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 18px;">🖨️</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #555;">Prêt à imprimer</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 18px;">📋</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #555;">Sans préparation</span>
            </div>
        </div>

    </div>
</body>
</html>
