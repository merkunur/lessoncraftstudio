# Teaching package — label a picture with 1 word
# Arc 13 Phase 2 (Option G CONTINUATION; writing-composition 1/8 → 2/8).
# Deepens Arc 12 write-own-name. Reciprocity-pair with predict-from-picture-cue.

targetSlug: label-a-picture-with-1-word
language: en
title:
  en: "Label It — write one word for the picture"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching kids to label a picture with a single word. Builds on Arc 12 write-own-name (motor + ownership foundation) + Arc 9-12 letter-recognition + Arc 12 spell-cvc-words + Arc 13 Phase 2 spell-high-frequency-sight-words. Kids look at a picture (cat / dog / sun / hat) + write the word that names it on a labeled-line below. Bridge from name-writing-only to writing-for-meaning. Reciprocal partner to predict-from-picture-cue (comprehend-from-image / produce-from-image). 5 exercises + 7 materials over 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class label-and-write routine. Teacher displays a picture
      of a cat + a labeled blank line beneath it: "What word names
      this? Cat. Watch me write it: c-a-t. Now you write it." Class
      writes c-a-t on personal whiteboards. Repeat with 4-5 short
      familiar words (sun, dog, hat, bat). Reinforces picture-to-
      word + write-the-word-you-see framing.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + label-and-check routine. Each pair receives 6
      picture-with-blank-line cards. Pair takes turns: kid A writes
      the labeling word; kid B verifies spelling against an answer
      strip. Recast errors with explanation ('you wrote "kat" — let's
      sound it out: /k/ /a/ /t/. K-A-T spells "kat" but the word for
      this animal is spelled C-A-T. Both letters make the /k/ sound;
      this word uses C'). Optional extension: kids label drawings
      they create of familiar animals or objects.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: vocabulary-tracing-strips (kids
      trace target words). Station 2: matching worksheet (image-name
      pairs). Station 3: word-guess (kids fill word letters with
      picture cues). Station 4: manipulative cut-outs hands-on label-
      construction (kids assemble labels from letter tiles).
  closure:
    durationMinutes: 5
    body: |
      Whole-class label-display. Each kid shares a labeled drawing.
      Forward-pointer: 'Today we wrote ONE word to label a picture.
      When we come back to writing next, we will label with TWO or
      THREE words — short noun phrases like "a big dog" or "the red
      hat" — adding meaning beyond a single word.'

