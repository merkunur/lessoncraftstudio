assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify whether 2 spoken words rhyme in 8 of 10 trials.
      - Generate 1-2 rhyming words for a given starter word in 7 of 10
        trials.
      - Match pictures whose names rhyme in 8 of 10 matching tasks.

    Differentiation:
    - Pre-K: 3-4 strong rhyme pairs with picture support (cat-hat, dog-
      log, sun-fun, bee-tree); receptive identification only.
    - K: 6-8 rhyme pairs across multiple pattern families; productive
      generation.
    - Grade 1+: extend to count-syllables (Arc 11+ candidate) + blend-
      onset-rime + isolate-initial-phoneme; bridge to formal phonics
      decoding (read-cvc-words).

