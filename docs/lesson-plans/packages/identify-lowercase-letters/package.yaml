# Teaching package — identify lowercase letters of the alphabet
# Arc 11 Phase 1 (Path B; early-literacy / letter-recognition strand
# deepening 2/6 → 3/6). RESOLVES Arc 10 identify-uppercase-letters
# forward-pointer.

targetSlug: identify-lowercase-letters
language: en
title:
  en: "Lowercase Letters — recognize all 26 small letters"
description:
  en: "Kindergarten early-literacy package teaching lowercase letter recognition. Builds on Arc 10 identify-uppercase-letters — kids now systematically recognize all 26 lowercase letters, paired with familiar vocabulary anchors. RESOLVES Arc 10 forward-pointer ('come back to LOWERCASE letters next'). Most reading uses lowercase letters; uppercase is for sentence starts + proper nouns. Vocab-anchored throughout. Composes against alphabet-train + matching apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class lowercase-display routine. Teacher displays a large
      alphabet poster with lowercase letters a-z alongside uppercase
      A-Z. Class chants the alphabet song while pointing at each
      lowercase letter. "Most words you read are made of LOWERCASE
      letters — the small letters. The big UPPERCASE letters are
      special — they start sentences and people's names." Reinforces
      lowercase-as-the-default + uppercase-as-special.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + lowercase-name routine. Each pair receives a deck of
      26 lowercase letter cards + 26 picture cards (one per letter's
      vocab anchor: a-apple, b-ball, c-cat, etc.). Pair takes turns:
      kid A draws a letter card + names the letter; kid B finds the
      matching picture card. Recast errors with explanation ("you
      said this is letter b but it's d — look at the shape: 'b' has
      its bump on the RIGHT; 'd' has its bump on the LEFT. They're
      mirror images"). Optional extension: kids match uppercase to
      lowercase letter pairs (Aa, Bb, Cc...).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: alphabet-train worksheet (kids
      identify lowercase letters in train-themed visual). Station 2:
      matching worksheet (lowercase letter to picture vocab anchor).
      Station 3: vocabulary-tracing-strips with lowercase letters.
      Station 4: word-guess (kids fill in lowercase letters from
      picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class letter-quiz routine. Teacher displays 5-6 lowercase
      letters in random order; class collectively names each.
      Forward-pointer: "Today we recognized lowercase letters. When
      we come back to letters next, we'll learn to MATCH uppercase
      with lowercase letters — recognizing that A and a are the same
      letter, just different sizes."

