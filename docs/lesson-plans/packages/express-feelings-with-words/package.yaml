compositionalRationale:
  en: |
    Primary strand: science / personal-social-emotional-development
    (feelings-expression — founds strand at 1/6). Secondary
    strand: vocabulary-acquisition (feelings vocabulary: happy,
    sad, angry, scared, excited, frustrated, surprised, calm).
    Tertiary strand: communication (verbal expression of internal
    states).

    Architectural significance: founds personal-social-emotional-
    development strand at 1/6 — third strand foundation
    established at Arc 15 (numeral-recognition + place-value at
    Phase 1; materials-and-properties + personal-social-emotional-
    development at Phase 2). Builds on Arc 8-12 emotions
    foundation (identify-and-name-emotions + identify-own-emotions-
    in-context + identify-emotions-of-others-from-faces); extends
    recognition-only work to verbal-expression work. Critical
    bridge from emotional-recognition (passive identification)
    to emotional-expression (active communication).

    Distinctive composition: 3 matching + 1 prepositions
    (sentence-frame) + 1 picture-sort. Vocabulary-anchored
    throughout; prepositions package provides sentence-frame
    structure ("I feel ___ when ___") foundational to feelings-
    expression.

    Class B FLEXIBLE substrate: composes against emotions image-
    library theme (canonical for feeling-face imagery).

    K-3 multilingual classroom relevance: feelings vocabulary
    varied across 11 platform locales — basic emotions (happy,
    sad, angry, scared) moderate-cognate Romance + Germanic;
    nuanced emotions (frustrated, lonely, proud, calm) more
    locale-specific. Sentence-frame structure ("I feel ___")
    syntactically varies (en post-verbal complement; some
    Romance languages use different copula). Particularly
    valuable for multilingual classrooms where feelings-
    expression in home-language may precede school-language
    expression.

