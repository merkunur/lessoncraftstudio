compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (addition within
    100 — deepens strand 3/14 → 4/14). Secondary strand: math /
    place-value (two-digit addition foregrounds tens-ones structure;
    regrouping concept introduced). Tertiary strand: numeracy
    (strategy-based addition: regrouping, decomposition, count-on,
    use-known-facts).

    Architectural significance: extends Arc 12 add-within-20
    foundation into two-digit range. Leverages Arc 15 Phase 1+4
    tens-and-ones place-value work (1-20 + 21-50 + 51-100 =
    full two-digit place-value range covered) as conceptual
    substrate. First package to require REGROUPING (carrying)
    as canonical addition strategy. Bridges single-digit
    addition fluency to two-digit place-value-aware addition.

    Distinctive composition: 1 addition (vertical format) + 2
    math-worksheet (vertical addition within 100) + 1 math-puzzle
    (missing-addend) + 1 more-less (compare addition results).
    Vertical format emphasized — column alignment + carry-mark
    practice critical for regrouping fluency.

    Class B FLEXIBLE substrate: composes against animals theme
    (countable for addition work; cross-arc with Arc 12-15
    addition themes for consistency).

    K-3 multilingual classroom relevance: addition within 100
    universal K-3 content. Number-word naming for 21-99 varies
    significantly across locales: en regular "twenty-one through
    ninety-nine"; de reverse-decade "einundzwanzig" (one-and-
    twenty); es "veintiuno...noventa-y-nueve" with elision; fr
    "soixante-dix...quatre-vingt-dix-neuf" (sixty-ten through
    four-twenty-ten-nine) — French presents most striking
    irregularity; fi agglutinative compounds. Cross-locale
    regrouping vocabulary varies: en "carry/regroup"; de
    "umgruppieren/Übertrag"; es "agrupar/llevar"; pt
    "reagrupar/transportar". Locale-variant work at Phase 3+
    adapts to each locale's number-word + regrouping-vocabulary
    register.

