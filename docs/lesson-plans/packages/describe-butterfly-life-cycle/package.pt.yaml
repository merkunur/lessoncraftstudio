# Teaching package — ciclo de vida da borboleta (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 14 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# pt sparse-override for science / living-things strand. 10th consecutive
# pt arc per locked sequence. Conteúdo biológico universal — tradução direta
# sem reestruturação pedagógica. BR-MEC educação infantil register per
# CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Ciclo de Vida da Borboleta — do ovo à borboleta"
description:
  pt: "Pacote de ciência para a educação infantil / 1º ano que ensina o ciclo de vida da borboleta (metamorfose). Constrói sobre o padrão describe-plant-life-cycle dos Arcos 9-12; estende o entendimento de ciclo-de-vida da biologia vegetal para a biologia animal com uma sequência particularmente vívida de 4 estágios (ovo → lagarta → crisálida → borboleta). Pacote saturador do fio de ciência / seres-vivos em 6/6 — primeira saturação completa de subtópico de ciclo-de-vida animal. Constrói sobre Arc 12 identify-living-vs-nonliving + describe-plant-life-cycle como base de seres-vivos. Ponte crítica da observação-de-seres-vivos para o entendimento de transformação biológica. 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Iniciador + introdução de sequência visual com toda a turma.
      A professora ou o professor exibe 4 imagens grandes: ovo /
      lagarta / crisálida / borboleta. "Estes são 4 estágios da
      vida de uma borboleta. Elas começam como ovos MINÚSCULOS em
      uma folha. O ovo eclode e nasce uma lagarta. A lagarta come
      e come, depois forma uma crisálida. Dentro da crisálida,
      acontecem coisas INCRÍVEIS — e uma borboleta sai!" A turma
      repete a sequência em coro: "ovo, lagarta, crisálida,
      borboleta". A âncora visual + verbal estabelece o vocabulário
      dos 4 estágios. Especificidade pt-BR: o termo "crisálida" é
      mais comum em pt-BR do que "casulo" (que se usa também para
      bichos-da-seda + alguns insetos); ambos termos são aceitos +
      regionalmente variáveis.
  contentActivity:
    body: |
      Trabalho em duplas + rotina de sequenciamento. Cada dupla
      recebe 4 cartas de imagem (ovo / lagarta / crisálida /
      borboleta) embaralhadas. A dupla arruma as cartas na ordem
      correta do ciclo de vida. A professora ou o professor
      circula pela sala; pergunta "Que estágio vem depois da
      lagarta? O que a lagarta faz antes de se tornar borboleta?"
      As duplas explicam a sequência + transformação. Refraseie
      os erros com reordenamento + referência visual às imagens-
      âncora. Modelagem positiva: "Você ordenou ovo-crisálida-
      lagarta-borboleta. Vamos ver de novo — depois do ovo, o
      que sai? Uma lagarta. Depois a lagarta forma a crisálida.
      Vamos reorganizar."
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios pattern-
      train sequenciando 4 estágios. Estação 2: folha de exercícios
      de emparelhamento (nome do estágio para imagem). Estação 3:
      folha de exercícios missing-pieces (ciclo de 4 estágios com
      um estágio faltando — a criança identifica qual estágio
      falta). Estação 4: vocabulary-tracing-strips para nomes dos
      estágios + vocabulário de borboleta. Especificidade pt-BR:
      use as palavras pt-BR canônicas — ovo (não "óvulo"), lagarta
      (não "larva" para K-3), crisálida (não "casulo" no contexto
      borboleta), borboleta (universal).
  closure:
    body: |
      Revisão com toda a turma. A professora ou o professor pede
      a cada criança que nomeie um dos 4 estágios + descreva o
      que acontece naquele estágio. "Um ovo eclode." "Uma lagarta
      come folhas para crescer." "Uma crisálida é uma casca dura
      onde a lagarta se transforma." "Uma borboleta voa + encontra
      néctar." Indicador adiante: "Hoje aprendemos o ciclo de vida
      da borboleta. Quando voltarmos na próxima vez, podemos
      explorar um ciclo diferente que acontece todos os dias — o
      ciclo dia-noite, OU o ciclo da água que faz nosso clima
      funcionar."

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Nomear todos os 4 estágios do ciclo de vida da borboleta
        em sequência correta em 7 de 10 tentativas.
      - Colocar 4 imagens-estágio em ordem correta em 8 de 10
        tentativas.
      - Descrever o que acontece em cada estágio em 1-2 frases em
        6 de 10 tentativas.

    Diferenciação:
      - Pré-K (3-5 anos): simplificação para 3 estágios (ovo →
        lagarta → borboleta; omitir crisálida por dificuldade
        conceitual).
      - Educação infantil (5-7 anos): ciclo completo de 4 estágios.
      - 1º ano em diante: estender para outros ciclos de vida
        animal (sapo: ovo → girino → sapo; galinha: ovo → pintinho
        → galinha) + trabalho de comparação cross-cycle. Trabalho
        de campo com observação de borboletas em jardins escolares
        (BR contexto tropical favorável durante todo o ano em
        muitas regiões).

compositionalRationale:
  pt: |
    Fio principal: ciência / seres-vivos (ciclo de vida animal —
    satura o fio em 6/6). Fio secundário: aquisição-de-vocabulário
    (4 nomes de estágios: ovo, lagarta, crisálida, borboleta). Fio
    terciário: função-cognitiva-e-executiva / sequenciamento.

    Significância arquitetural: SATURA o fio de seres-vivos em
    6/6. Primeira saturação completa de subtópico de ciclo-de-vida
    animal. Constrói sobre Arc 12 identify-living-vs-nonliving +
    describe-plant-life-cycle como base; estende o framework de
    ciclo-de-vida da biologia vegetal (que Arcs 9-12 cobriram)
    para a biologia animal com uma transformação de 4 estágios
    particularmente vívida.

    Especificidade pt-BR: ciclo de vida da borboleta é universal
    + traduzível 1:1 do en. Não há adaptação fonológica ou
    sintática necessária. O vocabulário pt-BR para os 4 estágios
    é simples + acessível para K-3:
    - **ovo** — termo pt-BR comum; mesmo termo usado para ovos
      de galinha + cobra + pássaros + insetos.
    - **lagarta** — termo pt-BR específico para o estágio larval
      da borboleta. NÃO confundir com "larva" (que é termo
      científico amplo); para K-3 use "lagarta".
    - **crisálida** — termo pt-BR canônico para o estágio pupal
      da borboleta. "Casulo" também é aceito mas mais associado
      a bicho-da-seda em pt-BR; "crisálida" é tecnicamente
      preciso para borboletas.
    - **borboleta** — termo universal + amplamente cognato em
      pt-BR. Som onomatopeico do voo silencioso da borboleta.

    Currículo BNCC EI03ET01 + EI03ET02 + 1º ano EF01CI04:
    observação de animais + identificação de ciclos de vida +
    reconhecimento de transformações na natureza.

    Substrato Class B FLEXIBLE: composta contra a amplitude da
    biblioteca de imagens insects-and-bugs (onde a iconografia
    de borboleta é o centro) + animals como fallback para
    lagarta + outros invertebrados.

    Relevância pt-BR específica: contexto tropical brasileiro
    favorece observação de borboletas durante grande parte do
    ano em muitas regiões. Trabalho de campo + observação em
    jardins escolares + parques naturais é extensão pedagógica
    natural para este pacote no contexto pt-BR.
