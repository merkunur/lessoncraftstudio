description:
  en: "Comprehensive K-3 bundle centered on weather + seasons vocabulary. 3 packages span vocabulary-acquisition (identify-and-name-weather-words from Arc 8) + world-knowledge environment-and-weather (identify-weather-types from Arc 11; identify-four-seasons from Arc 10). Cross-arc bundle integrating weather work across Arc 8/10/11. Suitable for a 3-week classroom unit on weather + seasons; supports daily-weather-chart morning-circle routines + seasonal awareness work."

