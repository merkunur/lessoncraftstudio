assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compose a target composite shape from a given set of
        primitive pieces in 7 of 10 trials.
      - Decompose a composite shape into named primitive
        parts in 6 of 10 trials.
      - Identify the missing primitive in a partial composite
        shape in 7 of 10 trials.
      - Articulate the composition aloud ('a house is a
        square plus a triangle on top') in 5 of 10
        productive-language trials.
      - Recognize that most composite shapes have multiple
        valid decompositions (e.g., a rectangle = two squares
        OR four smaller rectangles OR two triangles cut
        diagonally) in 4 of 6 trials.

    Differentiation:
    - Pre-K: build primitive shape recognition first; the
      composition work can be introduced informally via free
      play with shape pieces (no naming requirement).
    - K: introduce composition with only two-piece composites
      (two triangles into a square; two squares into a
      rectangle); larger composites (six-triangle hexagon,
      multi-piece rocket) deferred.
    - Grade 1: full composition fluency across the primitive
      set; multiple valid decompositions recognized; both
      compose and decompose directions practiced.
    - Grade 2+: extend to 3D shape composition (cubes from
      smaller cubes; rectangular prisms from cubes); bridge
      to area calculation (compose-then-count grid squares)
      + fraction-of-shape work (partition-shape-halves-
      quarters is the next geometry package).

