assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Construct an original 6-item AB pattern from chosen objects in 8
        of 10 attempts.
      - Construct AAB or ABB patterns from chosen objects in 6 of 10
        attempts.
      - Articulate the chosen rule when asked ("My rule is AB / AAB /
        ABB") in 7 of 10 trials.

    Differentiation:
    - Pre-K: AB only; 4-item patterns; manipulative-supported with
      teacher prompts ("what comes after cat?").
    - K: AB + AAB + ABB; 6-item patterns; independent construction.
    - Grade 1+: extend to ABC + AABB + original 4-element rules; bridge
      to skip-counting patterns (count-by-2s-to-20 sibling Phase 1
      package) where pattern construction extends into numerical
      sequences.

