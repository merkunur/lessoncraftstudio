compositionalRationale:
  es: |
    Hilo principal: adquisición de vocabulario (objetivo
    identify-and-name-10-farm-animals).
    Hilo secundario: fonética / reconocimiento de letras (matching modo letra en
    la posición 2).
    Hilo terciario: contar + categorización (find-and-count posición 3,
    odd-one-out posición 4, picture-sort posición 5; recortes manipulables;
    tira de oraciones de la semana 2 con la estructura there-are-count-plural).

    La integración entre hilos es intencional. El trabajo de vocabulario K-Primer
    grado se beneficia de la revisión en espiral a través de contextos de
    fonética + contar + categorización; aislar a un solo hilo desaprovecharía
    el catálogo de materiales. Los paquetes futuros en hilos no de vocabulario
    deberían diseñar su propia forma de integración; no copien esta extensión
    de 3 hilos a ciegas.

curriculumStandards:
