assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Sort 12 objects into 2-3 categories AND count each category in
        7 of 10 attempts.
      - Build a tally-mark chart from sorted-and-counted data in 6 of
        10 attempts.
      - Compare data using more/less vocabulary ('there are more X than
        Y') in 7 of 10 trials.

    Differentiation:
    - Pre-K: sort + count only (skip chart-construction); 2 categories
      with strong contrast; small-data (8 objects total).
    - K: sort + count + tally-chart construction; 2-3 categories;
      medium-data (12 objects).
    - Grade 1+: extend to bar-graph construction (column heights match
      counts); bridge to data-question-answering (Arc 10+ candidate).

