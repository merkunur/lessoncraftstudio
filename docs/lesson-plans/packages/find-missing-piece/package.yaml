# Teaching package — find the correct missing piece for a picture
# Arc 6 Phase 2 (Option A vocab-depth) — fine-motor-and-visual-spatial /
# visual-discrimination strand. Companion to match-image-to-shadow + match-
# image-piece-to-whole. Vocab-anchored. Class B FLEXIBLE; substrate-ready
# via missing-pieces app + image-library breadth.

targetSlug: find-missing-piece
language: en
title:
  en: "Find the Missing Piece — completing partial pictures"
description:
  en: "Pre-K to Kindergarten visual-discrimination package teaching kids to find the correct missing piece that completes a partial picture. Foundational visual-spatial reasoning: kids hold the whole-picture's shape + content in mind while evaluating candidate pieces. Vocab-anchored — naming the whole picture reinforces vocabulary. Composes against missing-pieces app + image-library breadth. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher displays a complete picture (e.g.,
      a cat). Then displays the same picture with a circular hole cut
      out of the middle. "Something is missing! What's missing?" Class
      describes the missing portion. Then teacher offers 3 candidate
      pieces; class picks the one that fits. Repeat 2-3 times. Reinforces
      the missing-piece reasoning pattern. Pin to "Visual Skills"
      word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine: teacher shows a picture-with-missing-piece;
      class names what the picture is + describes what's missing.
      Multiple-choice setup: teacher offers 3 candidate pieces; class
      picks the right one. Pair work: kid A presents a missing-piece
      puzzle; kid B picks from candidate pieces. Recast errors with
      explanation ("the missing piece needs to be ROUND because the
      hole is round" — bridges shape recognition + spatial reasoning).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: missing-pieces worksheet (kids draw
      lines connecting pictures-with-holes to correct piece-options).
      Station 2: matching worksheet (image-name reinforces image
      vocabulary). Station 3: manipulative cut-outs missing-piece
      construction (kids cut a shape out of a printed picture, mix
      with distractor shapes, give to partner who reassembles —
      kinesthetic puzzle-solving practice).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays a complex missing-piece
      puzzle; class collectively finds the right piece. Forward-pointer:
      "Today we found missing pieces. When we come back to puzzles
      next, we'll do bigger jigsaw puzzles where MULTIPLE pieces are
      missing."

