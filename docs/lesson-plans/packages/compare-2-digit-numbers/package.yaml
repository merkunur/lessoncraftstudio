compositionalRationale:
  en: |
    Primary strand: math / place-value (compare two-digit
    numbers — closes place-value canonical sub-track at
    3/3 SAT; 22nd saturated strand at canonical sub-track
    level on the platform). Secondary strand: numeracy
    (number-magnitude comparison; foundational ordering
    skill). Tertiary strand: working-memory + sequential-
    reasoning (the 'tens-first then ones-if-equal'
    decision tree is a 2-step procedure kids hold in mind).

    Architectural significance: closes the math/place-value
    canonical sub-track at 3/3 SAT. The Phase 1.3 sibling
    cluster (decompose-tens-and-ones-within-19 + identify-
    tens-and-ones-2-digit) established the place-value
    decomposition insight; this package USES that
    decomposition operationally — comparison is the first
    place-value-applied skill kids meet. After this package
    the K-3 place-value canonical work is structurally
    complete (operational extensions like compare-by-tens-
    and-ones explicitly and 3-digit place-value belong to
    Grade 2+ extension territory; the Arc 15 Phase 4
    identify-place-value-hundreds package is the existing
    3-digit work).

    Cross-reference to Phase 1.3 sibling cluster:
    decompose-tens-and-ones-within-19 (the K foundation;
    teen numbers as 10+n) + identify-tens-and-ones-2-digit
    (the Grade 1 extension; 2-digit numbers as N tens + M
    ones) + this package (the Grade 1 application;
    comparison using place-value) form the complete K →
    Grade 1 place-value introduction sequence. The three
    packages share theme (animals), share materials
    infrastructure, and cross-reference each other in
    compositionalRationale.

    Distinctive composition: 2 more-less (intro +
    assessment, bookending the comparison work — more-less
    is the canonical comparison-mechanic app) + 1 matching
    + 1 math-puzzle + 1 math-worksheet. The more-less app
    is load-bearing: it produces 2-number-comparison
    problems where the kid picks which is bigger/smaller,
    which is exactly the comparison mechanic this package
    teaches. The matching activity surfaces the comparison
    notation (47<53 paired with the number pair).

    Materials note: place-value-mat (the canonical place-
    value enactment surface) is deferred to Pillar 5 per
    Arc 17 Phase 0 §8 (C); see Phase 1.3 sibling cluster
    rationale for the substitution pattern. Matching-mat
    occupies position 3 with pedagogicalRole 'place-value-
    comparison-game' (the matching surface pairs 2-digit
    number pairs with their comparison statements).
    Manipulative-cut-outs in base-ten-blocks mode (position
    5, itemCount 100 for full 2-digit range) provides the
    concrete ten-sticks + ones for tens-first comparison
    enactment.

    Class B FLEXIBLE substrate: composes against animals
    theme (pair-coherent with Phase 1.3 sibling cluster +
    Arc 16 + Phase 1.2 addition-subtraction cluster).

    K-3 multilingual classroom relevance: place-value
    comparison is universal K-3 numeracy content. The
    tens-first algorithm is locale-portable — the place-
    value structure is the same in every locale, only the
    spoken number-word forms vary (and for comparison
    work, the structural insight that 'left digit = tens'
    means kids can compare visually without needing to say
    the numbers aloud). Cross-locale comparison
    vocabulary: en 'greater than / less than / equal to';
    de 'größer als / kleiner als / gleich'; es 'mayor que
    / menor que / igual a'; pt 'maior que / menor que /
    igual a'; fr 'plus grand que / plus petit que / égal
    à'; fi 'suurempi kuin / pienempi kuin / yhtä suuri
    kuin'. Mathematical symbols (>, <, =) are
    international and locale-portable. Locale-variant work
    at Phase 3+ adapts comparison-vocabulary to each
    locale's register.

