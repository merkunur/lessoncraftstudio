<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Pair Gate — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- TOOL #53 - THE PAIR GATE (rebuilt 2026-08-11). The class CHOOSES
       a parade from a numeral strip, COMMITS a numeral - how many will
       be left standing - and only then does the boom lift. Ranks march
       through a real archway in a real wall; when fewer than N remain
       the archway refuses for ever, and what is drawn is THE EMPTY
       SEAT beside whoever is left standing, never a mark on them. Then
       a second parade is CHOSEN - any number, evens included, so the
       theorem can honestly fizzle - and both leftovers step onto the
       sill, a plate exactly as wide as the archway. A full plate is a
       rank, and a rank goes through: odd + odd = even, watched as a
       mechanism, tested rather than staged. It loads NO ART and NO
       AUDIO beyond the shell's own pop. -->

  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/pair-gate.js?v=2"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    LCS.mount(PairGate, { mount: '#lcs-root' });
  </script>
</body>
</html>
