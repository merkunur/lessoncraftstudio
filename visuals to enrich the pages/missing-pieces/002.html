<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Missing Pieces Worksheets - Fun Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(150deg, #FF1493 0%, #FF6B9D 30%, #FFB6C1 60%, #FFF0F5 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Confetti SVG overlay -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 1000 1000">
            <!-- Confetti pieces -->
            <rect x="80" y="150" width="12" height="20" fill="#FFD700" transform="rotate(25, 80, 150)"/>
            <rect x="180" y="100" width="10" height="16" fill="#00CED1" transform="rotate(-15, 180, 100)"/>
            <rect x="320" y="180" width="14" height="22" fill="#FF6B35" transform="rotate(40, 320, 180)"/>
            <rect x="750" y="120" width="12" height="18" fill="#FFD700" transform="rotate(-30, 750, 120)"/>
            <rect x="880" y="200" width="10" height="16" fill="#00CED1" transform="rotate(20, 880, 200)"/>
            <rect x="920" y="350" width="14" height="20" fill="#FF1493" transform="rotate(-25, 920, 350)"/>
            <rect x="60" y="400" width="12" height="18" fill="#FF6B35" transform="rotate(35, 60, 400)"/>
            <rect x="40" y="650" width="10" height="16" fill="#FFD700" transform="rotate(-20, 40, 650)"/>
            <rect x="950" y="550" width="12" height="20" fill="#00CED1" transform="rotate(30, 950, 550)"/>
            <rect x="900" y="750" width="14" height="18" fill="#FF1493" transform="rotate(-40, 900, 750)"/>
            <rect x="100" y="850" width="10" height="16" fill="#FF6B35" transform="rotate(15, 100, 850)"/>
            <!-- Circles -->
            <circle cx="250" cy="80" r="8" fill="#00CED1"/>
            <circle cx="600" cy="150" r="6" fill="#FFD700"/>
            <circle cx="850" cy="450" r="7" fill="#FF6B35"/>
            <circle cx="150" cy="550" r="6" fill="#FFD700"/>
            <circle cx="50" cy="300" r="5" fill="#00CED1"/>
            <!-- Stars -->
            <polygon points="700,80 703,90 714,90 706,97 709,108 700,102 691,108 694,97 686,90 697,90" fill="#FFD700"/>
            <polygon points="920,650 923,660 934,660 926,667 929,678 920,672 911,678 914,667 906,660 917,660" fill="#FFD700"/>
            <polygon points="50,750 53,760 64,760 56,767 59,778 50,772 41,778 44,767 36,760 47,760" fill="#FFD700"/>
        </svg>

        <!-- FREE Badge - Top Left -->
        <div style="
            position: absolute;
            top: 35px;
            left: 35px;
            transform: rotate(-12deg);
            z-index: 25;
        ">
            <div style="
                background: linear-gradient(135deg, #FFD700 0%, #FFC107 100%);
                color: #5D4037;
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 30px;
                padding: 14px 28px;
                border-radius: 12px;
                box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5), inset 0 2px 0 rgba(255,255,255,0.4);
                letter-spacing: 2px;
            ">FREE</div>
        </div>

        <!-- Grade Badge - Top Right -->
        <div style="
            position: absolute;
            top: 45px;
            right: 40px;
            background: linear-gradient(135deg, #00CED1 0%, #00B5AD 100%);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 22px;
            padding: 10px 22px;
            border-radius: 25px;
            box-shadow: 0 4px 12px rgba(0, 206, 209, 0.4);
            z-index: 20;
        ">PreK-K</div>

        <!-- Main Title - Arc Text Effect -->
        <div style="
            position: absolute;
            top: 100px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 82px;
                color: white;
                margin: 0;
                text-shadow:
                    0 0 30px rgba(255,255,255,0.8),
                    0 0 60px rgba(255,107,155,0.6),
                    4px 4px 0 #FF1493,
                    0 6px 20px rgba(0,0,0,0.2);
                letter-spacing: 2px;
            ">PUZZLE</h1>
            <h2 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 82px;
                color: #FFD700;
                margin: -15px 0 0 0;
                text-shadow:
                    0 0 30px rgba(255,215,0,0.8),
                    4px 4px 0 #FF6B35,
                    0 6px 20px rgba(0,0,0,0.2);
                letter-spacing: 2px;
            ">PARTY!</h2>
        </div>

        <!-- Speech Bubble -->
        <div style="
            position: absolute;
            top: 290px;
            left: 80px;
            z-index: 20;
        ">
            <div style="
                background: white;
                padding: 12px 22px;
                border-radius: 20px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.15);
                position: relative;
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 22px;
                    color: #FF1493;
                ">I Found It!</span>
                <!-- Speech bubble tail -->
                <div style="
                    position: absolute;
                    bottom: -12px;
                    left: 30px;
                    width: 0;
                    height: 0;
                    border-left: 12px solid transparent;
                    border-right: 12px solid transparent;
                    border-top: 15px solid white;
                "></div>
            </div>
        </div>

        <!-- Main Worksheet in "Magic TV" Arcade Frame -->
        <div style="
            position: absolute;
            top: 340px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        ">
            <!-- Glowing border effect -->
            <div style="
                background: linear-gradient(135deg, #00CED1 0%, #FF1493 50%, #FFD700 100%);
                padding: 8px;
                border-radius: 20px;
                box-shadow:
                    0 0 30px rgba(0,206,209,0.5),
                    0 0 60px rgba(255,20,147,0.3),
                    0 15px 40px rgba(0,0,0,0.2);
            ">
                <div style="
                    background: white;
                    padding: 10px;
                    border-radius: 14px;
                ">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/missing%20pieces/sample-7.jpeg"
                        alt="Missing Pieces Worksheet"
                        style="
                            width: 240px;
                            height: 311px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 8px;
                            display: block;
                        "
                    />
                </div>
            </div>
        </div>

        <!-- Flying Puzzle Piece 1 (with motion trail) -->
        <div style="
            position: absolute;
            top: 380px;
            right: 100px;
            z-index: 25;
        ">
            <!-- Motion trail -->
            <div style="
                position: absolute;
                top: 15px;
                right: -60px;
                width: 80px;
                height: 30px;
                background: linear-gradient(to left, rgba(255,215,0,0), rgba(255,215,0,0.6));
                border-radius: 15px;
                filter: blur(8px);
            "></div>
            <svg width="65" height="65" viewBox="0 0 100 100" style="filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));">
                <path d="M10,30 h25 v8 c0,10 15,10 15,0 v-8 h25 v25 h-8 c-10,0 -10,15 0,15 h8 v25 h-25 v-8 c0,-10 -15,-10 -15,0 v8 h-25 v-25 h8 c10,0 10,-15 0,-15 h-8 z" fill="#FFD700"/>
            </svg>
            <!-- Sparkle -->
            <div style="
                position: absolute;
                top: -5px;
                right: -5px;
                font-size: 18px;
            ">✨</div>
        </div>

        <!-- Flying Puzzle Piece 2 -->
        <div style="
            position: absolute;
            top: 520px;
            left: 90px;
            transform: rotate(-25deg);
            z-index: 25;
        ">
            <!-- Motion trail -->
            <div style="
                position: absolute;
                top: 10px;
                left: -50px;
                width: 60px;
                height: 25px;
                background: linear-gradient(to right, rgba(0,206,209,0), rgba(0,206,209,0.6));
                border-radius: 12px;
                filter: blur(6px);
            "></div>
            <svg width="55" height="55" viewBox="0 0 100 100" style="filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));">
                <path d="M10,30 h25 v8 c0,10 15,10 15,0 v-8 h25 v25 h-8 c-10,0 -10,15 0,15 h8 v25 h-25 v-8 c0,-10 -15,-10 -15,0 v8 h-25 v-25 h8 c10,0 10,-15 0,-15 h-8 z" fill="#00CED1"/>
            </svg>
        </div>

        <!-- Flying Puzzle Piece 3 -->
        <div style="
            position: absolute;
            bottom: 200px;
            right: 80px;
            transform: rotate(15deg);
            z-index: 20;
        ">
            <svg width="50" height="50" viewBox="0 0 100 100" style="filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));">
                <path d="M10,30 h25 v8 c0,10 15,10 15,0 v-8 h25 v25 h-8 c-10,0 -10,15 0,15 h8 v25 h-25 v-8 c0,-10 -15,-10 -15,0 v8 h-25 v-25 h8 c10,0 10,-15 0,-15 h-8 z" fill="#FF6B35"/>
            </svg>
        </div>

        <!-- Pointing Hand -->
        <div style="
            position: absolute;
            bottom: 280px;
            left: 200px;
            font-size: 50px;
            transform: rotate(45deg);
            z-index: 20;
        ">👆</div>

        <!-- Bottom Banner -->
        <div style="
            position: absolute;
            bottom: 45px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <div style="
                display: inline-block;
                background: white;
                padding: 14px 40px;
                border-radius: 40px;
                box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 26px;
                    background: linear-gradient(90deg, #FF1493 0%, #FF6B35 50%, #FFD700 100%);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                    background-clip: text;
                ">Learning Feels Like PLAY!</span>
            </div>
        </div>

        <!-- Extra sparkle stars -->
        <div style="position: absolute; top: 350px; left: 300px; font-size: 24px;">⭐</div>
        <div style="position: absolute; top: 450px; right: 250px; font-size: 20px;">✨</div>
        <div style="position: absolute; bottom: 150px; left: 350px; font-size: 18px;">⭐</div>
    </div>
</body>
</html>
