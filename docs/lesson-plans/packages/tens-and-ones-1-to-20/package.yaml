assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Decompose 6 of 8 numbers (10-20) into correct tens-and-ones
        representation.
      - Use vocabulary TENS / ONES / PLACE / DIGIT accurately in 7
        of 10 trials.
      - Build a given number with base-ten manipulatives in 7 of 10
        trials.
      - Identify tens-place vs ones-place digit in a written number
        in 8 of 10 trials.

    Differentiation:
    - Pre-K: skip tens-and-ones; review count-objects-1-to-10 only.
    - K: tens-and-ones for 10-15 only; concrete manipulatives
      required.
    - Grade 1: tens-and-ones for 10-20 full coverage.
    - Grade 2+: extend to tens-and-ones for 21-99 + introduce
      hundreds + thousands place-value + bridge to addition-with-
      regrouping work.

