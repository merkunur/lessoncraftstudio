<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Muster-Arbeitsbl&auml;tter - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(165deg, #FFF8E1 0%, #FFE0B2 40%, #FFCC80 100%); overflow: hidden;">

        <!-- Soft peach overlay -->
        <div style="position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 20%, rgba(255,138,101,0.08) 0%, transparent 60%);"></div>

        <!-- Subtle diagonal line pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image: repeating-linear-gradient(135deg, #BF360C 0px, #BF360C 1px, transparent 1px, transparent 30px);"></div>

        <!-- GRATIS Badge (top-left) - green circle -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #66BB6A 0%, #43A047 100%); border-radius: 50%; box-shadow: 0 8px 28px rgba(67,160,71,0.45), inset 0 -3px 8px rgba(0,0,0,0.12), inset 0 3px 6px rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center; border: 3px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.25);">GRATIS</span>
            </div>
        </div>

        <!-- Title Block (top center) -->
        <div style="position: absolute; top: 24px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 56px; color: #E65100; margin: 0; text-shadow: 3px 3px 0 rgba(230,81,0,0.1);">Schritt f&uuml;r Schritt</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 44px; color: #BF360C; margin: -2px 0 0 0; text-shadow: 2px 2px 0 rgba(191,54,12,0.08);">zum Muster-Profi!</h2>
        </div>

        <!-- SVG curved arrow path connecting steps -->
        <svg style="position: absolute; inset: 0; z-index: 8; pointer-events: none;" viewBox="0 0 1000 1000">
            <path d="M 180 780 Q 240 700 320 650 Q 400 600 450 540 Q 500 480 570 430 Q 640 380 720 330" fill="none" stroke="white" stroke-width="4" stroke-dasharray="12,10" opacity="0.5" stroke-linecap="round"/>
            <!-- Arrow head -->
            <polygon points="720,325 735,340 710,340" fill="white" opacity="0.5"/>
        </svg>

        <!-- White clouds (decorative) -->
        <div style="position: absolute; top: 140px; right: 50px; z-index: 2;">
            <div style="width: 100px; height: 40px; background: rgba(255,255,255,0.5); border-radius: 40px; position: relative;">
                <div style="position: absolute; top: -18px; left: 20px; width: 50px; height: 35px; background: rgba(255,255,255,0.5); border-radius: 50%;"></div>
                <div style="position: absolute; top: -12px; left: 50px; width: 35px; height: 28px; background: rgba(255,255,255,0.5); border-radius: 50%;"></div>
            </div>
        </div>
        <div style="position: absolute; top: 200px; left: 40px; z-index: 2;">
            <div style="width: 80px; height: 32px; background: rgba(255,255,255,0.4); border-radius: 32px; position: relative;">
                <div style="position: absolute; top: -14px; left: 15px; width: 40px; height: 28px; background: rgba(255,255,255,0.4); border-radius: 50%;"></div>
                <div style="position: absolute; top: -8px; left: 40px; width: 28px; height: 22px; background: rgba(255,255,255,0.4); border-radius: 50%;"></div>
            </div>
        </div>

        <!-- STEP 1 (bottom-left) - Green - AB - Anf&auml;nger -->
        <div style="position: absolute; bottom: 180px; left: 55px; z-index: 15;">
            <!-- Platform -->
            <div style="width: 200px; height: 55px; background: linear-gradient(180deg, #66BB6A 0%, #43A047 100%); border-radius: 12px; box-shadow: 0 6px 20px rgba(67,160,71,0.35); position: relative;">
                <!-- Step number -->
                <div style="position: absolute; bottom: 100%; left: 10px; margin-bottom: 8px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: #2E7D32;">Anf&auml;nger</span>
                </div>
            </div>
            <!-- Worksheet on platform -->
            <div style="position: absolute; bottom: 50px; left: 50px; z-index: 16;">
                <img src="https://www.lessoncraftstudio.com/samples/german/pattern%20worksheet/sample-2.jpeg" style="width: 100px; height: 130px; object-fit: cover; border-radius: 8px; border: 3px solid white; box-shadow: 0 8px 25px rgba(0,0,0,0.25);" alt="AB Muster-Arbeitsblatt">
            </div>
            <!-- Label pill -->
            <div style="position: absolute; bottom: 185px; left: 55px; background: #66BB6A; padding: 5px 18px; border-radius: 16px; box-shadow: 0 3px 10px rgba(67,160,71,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white;">AB</span>
            </div>
            <!-- Star -->
            <div style="position: absolute; bottom: 218px; left: 110px; font-size: 24px; filter: drop-shadow(0 2px 6px rgba(255,179,0,0.5));">&#11088;</div>
        </div>

        <!-- STEP 2 (center-left) - Yellow - ABC - Fortgeschritten -->
        <div style="position: absolute; bottom: 350px; left: 240px; z-index: 15;">
            <!-- Platform -->
            <div style="width: 220px; height: 55px; background: linear-gradient(180deg, #FDD835 0%, #F9A825 100%); border-radius: 12px; box-shadow: 0 6px 20px rgba(253,216,53,0.35); position: relative;">
                <div style="position: absolute; bottom: 100%; left: 10px; margin-bottom: 8px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: #F57F17;">Fortgeschritten</span>
                </div>
            </div>
            <!-- Worksheet -->
            <div style="position: absolute; bottom: 50px; left: 52px; z-index: 16;">
                <img src="https://www.lessoncraftstudio.com/samples/german/pattern%20worksheet/sample-3.jpeg" style="width: 115px; height: 149px; object-fit: cover; border-radius: 8px; border: 3px solid white; box-shadow: 0 8px 25px rgba(0,0,0,0.25);" alt="ABC Muster-Arbeitsblatt">
            </div>
            <!-- Label pill -->
            <div style="position: absolute; bottom: 205px; left: 55px; background: #FDD835; padding: 5px 18px; border-radius: 16px; box-shadow: 0 3px 10px rgba(253,216,53,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: #795548;">ABC</span>
            </div>
            <!-- Stars -->
            <div style="position: absolute; bottom: 238px; left: 108px; font-size: 22px; filter: drop-shadow(0 2px 6px rgba(255,179,0,0.5));">&#11088;&#11088;</div>
        </div>

        <!-- Little character climbing (on step 2 area) -->
        <div style="position: absolute; bottom: 408px; left: 225px; z-index: 18;">
            <!-- Body -->
            <div style="width: 22px; height: 28px; background: #42A5F5; border-radius: 8px 8px 4px 4px; position: relative;">
                <!-- Head -->
                <div style="position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 18px; height: 18px; background: #FFCC80; border-radius: 50%;"></div>
                <!-- Eyes -->
                <div style="position: absolute; top: -14px; left: 3px; width: 4px; height: 4px; background: #333; border-radius: 50%;"></div>
                <div style="position: absolute; top: -14px; right: 3px; width: 4px; height: 4px; background: #333; border-radius: 50%;"></div>
                <!-- Backpack -->
                <div style="position: absolute; top: 2px; right: -8px; width: 10px; height: 16px; background: #EF5350; border-radius: 3px;"></div>
                <!-- Left leg (stepping up) -->
                <div style="position: absolute; bottom: -12px; left: 1px; width: 8px; height: 14px; background: #1565C0; border-radius: 3px; transform: rotate(-15deg);"></div>
                <!-- Right leg -->
                <div style="position: absolute; bottom: -10px; right: 1px; width: 8px; height: 12px; background: #1565C0; border-radius: 3px;"></div>
            </div>
        </div>

        <!-- STEP 3 (center-right) - Orange - AABB - Herausfordernd -->
        <div style="position: absolute; bottom: 500px; left: 450px; z-index: 15;">
            <!-- Platform -->
            <div style="width: 240px; height: 55px; background: linear-gradient(180deg, #FF9800 0%, #EF6C00 100%); border-radius: 12px; box-shadow: 0 6px 20px rgba(255,152,0,0.35); position: relative;">
                <div style="position: absolute; bottom: 100%; left: 10px; margin-bottom: 8px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: #E65100;">Herausfordernd</span>
                </div>
            </div>
            <!-- Worksheet -->
            <div style="position: absolute; bottom: 50px; left: 55px; z-index: 16;">
                <img src="https://www.lessoncraftstudio.com/samples/german/pattern%20worksheet/sample-4.jpeg" style="width: 130px; height: 168px; object-fit: cover; border-radius: 8px; border: 3px solid white; box-shadow: 0 8px 25px rgba(0,0,0,0.25);" alt="AABB Muster-Arbeitsblatt">
            </div>
            <!-- Label pill -->
            <div style="position: absolute; bottom: 224px; left: 58px; background: #FF9800; padding: 5px 18px; border-radius: 16px; box-shadow: 0 3px 10px rgba(255,152,0,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white;">AABB</span>
            </div>
            <!-- Stars -->
            <div style="position: absolute; bottom: 258px; left: 108px; font-size: 20px; filter: drop-shadow(0 2px 6px rgba(255,179,0,0.5));">&#11088;&#11088;&#11088;</div>
        </div>

        <!-- STEP 4 (right-top) - Red - ABCD - Muster-Profi! -->
        <div style="position: absolute; bottom: 640px; left: 680px; z-index: 15;">
            <!-- Platform -->
            <div style="width: 260px; height: 55px; background: linear-gradient(180deg, #EF5350 0%, #D32F2F 100%); border-radius: 12px; box-shadow: 0 6px 20px rgba(239,83,80,0.35); position: relative;">
                <div style="position: absolute; bottom: 100%; left: 10px; margin-bottom: 8px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #C62828;">Muster-Profi!</span>
                </div>
            </div>
            <!-- Worksheet (largest) -->
            <div style="position: absolute; bottom: 50px; left: 55px; z-index: 16;">
                <img src="https://www.lessoncraftstudio.com/samples/german/pattern%20worksheet/sample-1.jpeg" style="width: 150px; height: 194px; object-fit: cover; border-radius: 10px; border: 4px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.3);" alt="ABCD Muster-Arbeitsblatt">
            </div>
            <!-- Label pill -->
            <div style="position: absolute; bottom: 250px; left: 60px; background: #EF5350; padding: 5px 18px; border-radius: 16px; box-shadow: 0 3px 10px rgba(239,83,80,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white;">ABCD</span>
            </div>
            <!-- Stars + Crown -->
            <div style="position: absolute; bottom: 284px; left: 55px; font-size: 20px; filter: drop-shadow(0 2px 6px rgba(255,179,0,0.5));">&#128081; &#11088;&#11088;&#11088;&#11088;</div>
        </div>

        <!-- Rainbow accent arcs (subtle) -->
        <svg style="position: absolute; top: 130px; right: 180px; z-index: 3; pointer-events: none;" width="120" height="60" viewBox="0 0 120 60">
            <path d="M 10 60 Q 60 -10 110 60" fill="none" stroke="#EF5350" stroke-width="4" opacity="0.2"/>
            <path d="M 15 60 Q 60 0 105 60" fill="none" stroke="#FF9800" stroke-width="4" opacity="0.2"/>
            <path d="M 20 60 Q 60 10 100 60" fill="none" stroke="#FDD835" stroke-width="4" opacity="0.2"/>
            <path d="M 25 60 Q 60 20 95 60" fill="none" stroke="#66BB6A" stroke-width="4" opacity="0.2"/>
        </svg>

        <!-- Feature Pills (bottom) -->
        <div style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; z-index: 60;">
            <div style="background: white; padding: 12px 18px; border-radius: 26px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #66BB6A;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #2E7D32;">Alle Schwierigkeitsstufen</span>
            </div>
            <div style="background: white; padding: 12px 18px; border-radius: 26px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #FDD835;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #F57F17;">Selbstgesteuertes Lernen</span>
            </div>
            <div style="background: white; padding: 12px 18px; border-radius: 26px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #FF9800;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #E65100;">Vorschule &ndash; 3. Kl.</span>
            </div>
        </div>

        <!-- Bottom accent bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 10px; background: linear-gradient(90deg, #66BB6A, #FDD835, #FF9800, #EF5350); z-index: 60;"></div>

    </div>
</body>
</html>
