<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Bilddiagramm Arbeitsbl&auml;tter - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #E3F2FD 0%, #E8EAF6 50%, #EDE7F6 100%); overflow: hidden;">

        <!-- Playful background bubbles -->
        <div style="position: absolute; top: -30px; right: -20px; width: 200px; height: 200px; background: rgba(76,175,80,0.08); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 200px; left: -40px; width: 160px; height: 160px; background: rgba(149,117,205,0.08); border-radius: 50%;"></div>
        <div style="position: absolute; top: 300px; right: -30px; width: 120px; height: 120px; background: rgba(255,112,67,0.06); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: -20px; right: 200px; width: 140px; height: 140px; background: rgba(253,216,53,0.1); border-radius: 50%;"></div>

        <!-- Rainbow title bar -->
        <div style="position: absolute; top: 28px; left: 50%; transform: translateX(-50%); z-index: 50; text-align: center;">
            <div style="display: inline-flex; align-items: baseline; gap: 0;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #EF5350;">Z</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #FF7043;">&Auml;</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #FDD835;">H</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #66BB6A;">L</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #42A5F5;">E</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #AB47BC;">N</span>
            </div>
            <div style="margin-top: -6px;">
                <div style="display: inline-block; background: linear-gradient(90deg, #FF7043, #EF5350); padding: 6px 30px; border-radius: 25px; box-shadow: 0 4px 15px rgba(255,112,67,0.35);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; color: white; letter-spacing: 2px;">&amp; ENTDECKEN!</span>
                </div>
            </div>
        </div>

        <!-- Clipboard frame with worksheet -->
        <div style="position: absolute; top: 185px; left: 80px; z-index: 30;">
            <!-- Clipboard top clip -->
            <div style="position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 100px; height: 28px; background: linear-gradient(180deg, #8D6E63, #6D4C41); border-radius: 6px 6px 0 0; z-index: 35;">
                <div style="position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 60px; height: 12px; background: #5D4037; border-radius: 4px;"></div>
            </div>
            <!-- Clipboard body -->
            <div style="width: 370px; background: #EFEBE9; border-radius: 12px; box-shadow: 0 15px 50px rgba(0,0,0,0.2); padding: 16px; border: 3px solid #8D6E63;">
                <div style="width: 100%; height: 262px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                    <img src="https://www.lessoncraftstudio.com/samples/german/chart%20count/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilddiagramm Emojis">
                </div>
            </div>
        </div>

        <!-- Answer key with speech bubble -->
        <div style="position: absolute; top: 260px; right: 65px; z-index: 30;">
            <div style="width: 260px; height: 201px; background: white; border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,0.15); overflow: hidden; border: 3px solid #66BB6A;">
                <img src="https://www.lessoncraftstudio.com/samples/german/chart%20count/sample-3-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="L&ouml;sungsblatt">
            </div>
            <!-- Speech bubble: Richtig gelöst! -->
            <div style="position: absolute; top: -48px; right: 10px; z-index: 40;">
                <div style="background: #66BB6A; padding: 8px 18px; border-radius: 18px; box-shadow: 0 4px 15px rgba(102,187,106,0.4); position: relative;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; color: white;">Richtig gel&ouml;st! &#11088;</span>
                    <div style="position: absolute; bottom: -8px; left: 30px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid #66BB6A;"></div>
                </div>
            </div>
        </div>

        <!-- Speech bubble: Ich habe 5 gezählt! (left side) -->
        <div style="position: absolute; top: 195px; left: 50px; z-index: 45;">
            <div style="background: #42A5F5; padding: 8px 16px; border-radius: 18px; box-shadow: 0 4px 15px rgba(66,165,245,0.4); position: relative;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; color: white;">Ich habe 5 gez&auml;hlt!</span>
                <div style="position: absolute; bottom: -7px; right: 20px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 8px solid #42A5F5;"></div>
            </div>
        </div>

        <!-- Decorative crayons -->
        <div style="position: absolute; bottom: 200px; left: 30px; z-index: 20;">
            <!-- Red crayon -->
            <div style="width: 14px; height: 90px; background: linear-gradient(180deg, #EF5350, #E53935); border-radius: 3px 3px 7px 7px; transform: rotate(15deg); box-shadow: 2px 3px 8px rgba(0,0,0,0.15);">
                <div style="width: 14px; height: 18px; background: linear-gradient(180deg, #FFCDD2, #EF5350); border-radius: 3px 3px 0 0;"></div>
            </div>
        </div>
        <div style="position: absolute; bottom: 220px; left: 55px; z-index: 20;">
            <!-- Green crayon -->
            <div style="width: 14px; height: 80px; background: linear-gradient(180deg, #66BB6A, #43A047); border-radius: 3px 3px 7px 7px; transform: rotate(-8deg); box-shadow: 2px 3px 8px rgba(0,0,0,0.15);">
                <div style="width: 14px; height: 18px; background: linear-gradient(180deg, #C8E6C9, #66BB6A); border-radius: 3px 3px 0 0;"></div>
            </div>
        </div>
        <div style="position: absolute; bottom: 210px; left: 78px; z-index: 20;">
            <!-- Yellow crayon -->
            <div style="width: 14px; height: 85px; background: linear-gradient(180deg, #FDD835, #F9A825); border-radius: 3px 3px 7px 7px; transform: rotate(5deg); box-shadow: 2px 3px 8px rgba(0,0,0,0.15);">
                <div style="width: 14px; height: 18px; background: linear-gradient(180deg, #FFF9C4, #FDD835); border-radius: 3px 3px 0 0;"></div>
            </div>
        </div>

        <!-- Decorative stars -->
        <div style="position: absolute; top: 160px; right: 40px; z-index: 20;">
            <div style="font-size: 28px; transform: rotate(15deg); filter: drop-shadow(0 2px 6px rgba(253,216,53,0.5));">&#11088;</div>
        </div>
        <div style="position: absolute; top: 130px; right: 100px; z-index: 20;">
            <div style="font-size: 20px; transform: rotate(-10deg); filter: drop-shadow(0 2px 6px rgba(253,216,53,0.4));">&#11088;</div>
        </div>
        <div style="position: absolute; bottom: 250px; right: 55px; z-index: 20;">
            <div style="font-size: 22px; transform: rotate(20deg); filter: drop-shadow(0 2px 6px rgba(253,216,53,0.4));">&#11088;</div>
        </div>

        <!-- Bottom banner -->
        <div style="position: absolute; bottom: 105px; left: 0; right: 0; background: linear-gradient(90deg, rgba(149,117,205,0.92) 0%, rgba(126,87,194,0.92) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.12), 0 4px 20px rgba(0,0,0,0.12);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); letter-spacing: 2px;">Spielerisch Daten verstehen!</span>
            </div>
        </div>

        <!-- Feature pills -->
        <div style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #42A5F5;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #1976D2;">Z&auml;hlen &uuml;ben</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #FF7043;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #E64A19;">Ausmalen</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #66BB6A;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #2E7D32;">L&ouml;sungsblatt</span>
            </div>
        </div>

        <!-- GRATIS badge -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="width: 90px; height: 90px; background: linear-gradient(145deg, #FDD835 0%, #F9A825 100%); border-radius: 50%; box-shadow: 0 6px 25px rgba(249,168,37,0.5), inset 0 -3px 8px rgba(0,0,0,0.1), inset 0 3px 6px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 21px; color: #3E2723; text-shadow: 0 1px 2px rgba(255,255,255,0.4);">GRATIS</span>
            </div>
        </div>

        <!-- Grade badge -->
        <div style="position: absolute; top: 30px; right: 30px; background: rgba(255,255,255,0.95); padding: 10px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #9575CD;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: #7E57C2; letter-spacing: 1px;">KLASSE K-2</span>
        </div>

    </div>
</body>
</html>
