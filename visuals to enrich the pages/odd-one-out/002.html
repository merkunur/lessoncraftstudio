<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Find the Odd One Out - Picture Detective Fun Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(135deg, #E91E63 0%, #FF6B9D 50%, #FFAB91 100%); overflow: hidden;">

        <!-- Confetti/sparkle background elements -->
        <div style="position: absolute; top: 80px; left: 100px; width: 20px; height: 20px; background: #FACC15; border-radius: 50%; box-shadow: 0 0 15px rgba(250,204,21,0.6);"></div>
        <div style="position: absolute; top: 150px; left: 60px; width: 14px; height: 14px; background: #00BFA5; border-radius: 50%; box-shadow: 0 0 12px rgba(0,191,165,0.5);"></div>
        <div style="position: absolute; top: 200px; left: 130px; width: 12px; height: 12px; background: white; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; top: 120px; right: 120px; width: 18px; height: 18px; background: #FACC15; border-radius: 50%; box-shadow: 0 0 15px rgba(250,204,21,0.6);"></div>
        <div style="position: absolute; top: 180px; right: 70px; width: 15px; height: 15px; background: #00BFA5; border-radius: 50%; box-shadow: 0 0 12px rgba(0,191,165,0.5);"></div>
        <div style="position: absolute; top: 250px; right: 140px; width: 10px; height: 10px; background: white; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 300px; left: 80px; width: 16px; height: 16px; background: #FACC15; border-radius: 50%; box-shadow: 0 0 12px rgba(250,204,21,0.5);"></div>
        <div style="position: absolute; bottom: 280px; right: 90px; width: 14px; height: 14px; background: #00BFA5; border-radius: 50%;"></div>

        <!-- Star sparkles -->
        <svg style="position: absolute; top: 160px; left: 200px; opacity: 0.8;" width="30" height="30" viewBox="0 0 100 100">
            <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FACC15"/>
        </svg>
        <svg style="position: absolute; top: 220px; right: 180px; opacity: 0.7;" width="25" height="25" viewBox="0 0 100 100">
            <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="white"/>
        </svg>
        <svg style="position: absolute; bottom: 350px; left: 150px; opacity: 0.6;" width="22" height="22" viewBox="0 0 100 100">
            <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#00BFA5"/>
        </svg>
        <svg style="position: absolute; bottom: 320px; right: 160px; opacity: 0.7;" width="28" height="28" viewBox="0 0 100 100">
            <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FACC15"/>
        </svg>

        <!-- FREE Badge - gold with rotation -->
        <div style="position: absolute; top: 25px; left: 30px; z-index: 100;">
            <div style="width: 105px; height: 105px; border-radius: 50%; background: linear-gradient(145deg, #FACC15 0%, #F59E0B 50%, #D97706 100%); box-shadow: 0 8px 30px rgba(250,204,21,0.5), inset 0 -4px 12px rgba(0,0,0,0.15), inset 0 4px 8px rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; transform: rotate(-12deg);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.25);">FREE</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: linear-gradient(135deg, #4ECDC4 0%, #3DBDB5 100%); padding: 12px 24px; border-radius: 30px; box-shadow: 0 5px 20px rgba(78,205,196,0.45);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.15);">Pre-K to Grade 2</span>
        </div>

        <!-- Main Title - Game Show Style -->
        <div style="position: absolute; top: 120px; left: 0; right: 0; text-align: center; z-index: 20;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 90px; color: #FACC15; margin: 0; text-shadow: 5px 5px 0 #E91E63, -2px -2px 0 white, 2px -2px 0 white, -2px 2px 0 white; letter-spacing: -3px;">PICTURE</h1>
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 80px; color: white; margin: -15px 0 0 0; text-shadow: 4px 4px 0 #E91E63; letter-spacing: -2px;">DETECTIVE!</h1>
        </div>

        <!-- Speech Bubble -->
        <div style="position: absolute; top: 290px; left: 150px; z-index: 25;">
            <div style="background: white; padding: 14px 24px; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.2); position: relative;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #E91E63;">FOUND THE IMPOSTER!</span>
                <!-- Speech bubble tail -->
                <div style="position: absolute; bottom: -12px; left: 30px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 15px solid white;"></div>
            </div>
        </div>

        <!-- Main Worksheet -->
        <div style="position: absolute; top: 350px; left: 50%; transform: translateX(-50%); z-index: 15;">
            <div style="background: white; padding: 14px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 0 6px #FACC15;">
                <img src="https://www.lessoncraftstudio.com/samples/english/odd%20one%20out/sample-2.jpeg"
                     style="width: 300px; height: auto; border-radius: 10px; display: block;"
                     alt="Odd One Out Worksheet">
            </div>
        </div>

        <!-- Magnifying Glass Emoji - Left -->
        <div style="position: absolute; top: 400px; left: 100px; font-size: 80px; transform: rotate(-20deg); z-index: 20;">
            🔍
        </div>

        <!-- Peeking Eyes - Right -->
        <div style="position: absolute; top: 420px; right: 80px; z-index: 20;">
            <div style="display: flex; gap: 15px;">
                <div style="width: 55px; height: 70px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                    <div style="width: 28px; height: 35px; background: #333; border-radius: 50%; position: relative;">
                        <div style="position: absolute; top: 8px; left: 6px; width: 10px; height: 10px; background: white; border-radius: 50%;"></div>
                    </div>
                </div>
                <div style="width: 55px; height: 70px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                    <div style="width: 28px; height: 35px; background: #333; border-radius: 50%; position: relative;">
                        <div style="position: absolute; top: 8px; left: 6px; width: 10px; height: 10px; background: white; border-radius: 50%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Feature Pills Row -->
        <div style="position: absolute; bottom: 95px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 20;">
            <div style="background: white; padding: 14px 22px; border-radius: 30px; box-shadow: 0 5px 18px rgba(0,0,0,0.2);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: #E91E63;">Brain Workout!</span>
            </div>
            <div style="background: #FACC15; padding: 14px 22px; border-radius: 30px; box-shadow: 0 5px 18px rgba(250,204,21,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.15);">Spot It Challenge!</span>
            </div>
            <div style="background: #00BFA5; padding: 14px 22px; border-radius: 30px; box-shadow: 0 5px 18px rgba(0,191,165,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.15);">So Much FUN!</span>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 65px; background: linear-gradient(90deg, #FACC15 0%, #F59E0B 50%, #FACC15 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 -5px 25px rgba(250,204,21,0.4);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); letter-spacing: 2px;">WHICH ONE DOESN'T BELONG?</span>
        </div>

    </div>
</body>
</html>
