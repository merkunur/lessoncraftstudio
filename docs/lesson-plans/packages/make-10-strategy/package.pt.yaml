# Teaching package — estratégia fazer-dez (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT per Arc 7 Phase 3 + Arc 3 Phase 1 sparse-override pattern.
# Arc 17 Phase 1.2 pt-cadence continuation (15th consecutive arc).
# pt sparse-override for math / addition-subtraction strand. Conteúdo matemático
# universal — tradução direta sem reestruturação pedagógica. BR-MEC ensino
# fundamental anos iniciais register per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Estratégia Fazer-Dez — decomponha para chegar a dez, depois some o resto"

description:
  pt: "Pacote de matemática para 1º ano que ensina a estratégia mental fazer-dez como habilidade discreta. Quem resolve decompõe um adendo para que o outro possa ser completado até 10, depois soma o resto. Exemplo: 8 + 5 = 8 + 2 + 3 = 10 + 3 = 13. Companheiro de Arc 12 add-within-20 (onde fazer-dez é a lição central de fluência embutida em uma unidade ampla de somar-até-20); este pacote isola a mecânica de decomposição para que crianças que precisam de prática extra de fluência de estratégia recebam uma unidade focada, e a operação fazer-dez se torne uma estratégia nomeada e memorável em vez de algo que acontece incidentalmente dentro de trabalho de adição maior. Prática de pares-de-dez + apoio visual com painel-de-dez + jogos 'encontre o par fazer-dez' tornam a rotina de decomposição concreta antes que as crianças a carreguem mentalmente. Âncora CCSS.1.OA.C.6; cruzamento CCSS.K.OA.A.4 ('encontre o número que faz 10 quando somado'). 5 exercícios + 6 materiais imprimíveis em uma unidade de 1 semana. Companheiro emparelhado de âncora-de-fio: find-missing-addend-within-10 (precursor de pensamento algébrico no mesmo fio de fluência em adição)."

structure:
  warmup:
    body: |
      Iniciador com toda a turma + introdução de par-fazer-dez.
      A professora ou o professor usa um painel-de-dez no
      quadro (2 fileiras de 5 quadrados). "Aqui estão 8 pontos."
      (Preenche 8 quadrados.) "Quantos quadrados VAZIOS?"
      Crianças respondem 2. "Então 8 e 2 são PARES fazer-dez.
      E 6 e 4? 7 e 3? 9 e 1?" Nomeação rápida de pares pela
      sala. Depois a operação da estratégia: "Quando somamos
      8 + 5, não precisamos contar do 8 todo o caminho até 13.
      Podemos usar o par fazer-dez. 8 precisa de 2 para fazer
      10. Então QUEBRAMOS 5 em 2 e 3. 8 + 2 = 10. 10 + 3 =
      13. Pronto." A professora ou o professor passa por 9 +
      4 (o par de 9 é 1; quebra 4 em 1 e 3; 10 + 3 = 13) e
      7 + 6 (o par de 7 é 3; quebra 6 em 3 e 3; 10 + 3 = 13).
      Ênfase do padrão: "Olhe para o PRIMEIRO número. Encontre
      seu par fazer-dez. QUEBRE o segundo número. SOME o que
      sobrou."
  contentActivity:
    body: |
      Trabalho em duplas com manipulativos painel-de-dez. Cada
      dupla recebe um painel-de-dez + contadores de duas cores
      (e.g., recortes com tema café-da-manhã: torradas amarelas
      + ovos marrons). Dupla joga rodada de par-fazer-dez:
      criança A coloca N contadores da primeira cor (N ≤ 9).
      Criança B conta os quadrados vazios (este é o par
      fazer-dez de N). Ambas dizem em voz alta: "8 torradas.
      8 mais 2 faz 10." Depois a rodada da estratégia: criança
      A escreve uma soma como 8 + 5 numa tira. Criança B
      coloca 8 torradas, pensa "8 precisa de 2", tira 2 ovos
      dos 5 para preencher o painel, depois nomeia os 3 ovos
      que sobraram: "10 mais 3 é 13." Dupla troca de papéis.
      Refraseie erros com pista-de-par ("você tem 7 no painel
      — qual é o par fazer-dez de 7?"). O tema café-da-manhã
      dos contadores é incidental — fazer-dez é a estrutura
      load-bearing; o tema fornece objetos contáveis
      reconhecíveis para que as crianças fiquem ancoradas em
      coisas reais em vez de pontos abstratos.
  scaffold:
    body: |
      Rotação de estações. Estação 1: math-puzzle modo adição
      (somas até 20 — quem ensina seleciona os problemas que
      se encaixam perfeitamente na estratégia fazer-dez: 8+5,
      9+4, 7+6, 8+6, 9+3, 7+5). Estação 2: math-worksheet
      somas-até-20; quem ensina circula e provoca o pensamento
      fazer-dez nos problemas elegíveis. Estação 3: addition
      app modo find-addend com operandos de um dígito; as
      crianças praticam a operação de recuperação de adendo-
      faltante que se sobrepõe ao trabalho de par fazer-dez
      (quando a soma exibida cai em 10, esse problema É uma
      pergunta de par fazer-dez). Estação 4: atividade
      matching — combine cada soma (8+5, 9+4, 7+6) ao seu
      caminho de decomposição fazer-dez (8+2+3, 9+1+3,
      7+3+3). A curadoria pela professora ou pelo professor
      entre estações é load-bearing — os apps produzem uma
      faixa de somas, e o trabalho da estratégia fazer-dez
      vive em como quem ensina enquadra cada problema. Vocabulário pt-BR canônico para estratégia-
      fazer-dez: fazer dez / fazer 10 / completar até dez;
      par fazer-dez / par-de-dez; decompor / quebrar;
      painel-de-dez. Use "fazer dez" + "par fazer-dez" como
      formas K-3 mais naturais; "decompor" técnico formal;
      "quebrar" K-3 conversacional para a operação de
      decomposição.
  closure:
    body: |
      Recuperação rápida fazer-dez com toda a turma. A
      professora ou o professor nomeia somas; crianças
      articulam coletivamente o caminho fazer-dez. "8 + 5? —
      8 mais 2 faz 10, mais 3 que sobra, é 13." "9 + 6? —
      9 mais 1 faz 10, mais 5 que sobra, é 15." "7 + 8? —
      7 mais 3 faz 10, mais 5 que sobra, é 15." Indicador
      adiante: "Hoje fizemos da estratégia fazer-dez sua
      própria lição. A mesma operação ajuda com ENCONTRAR
      O ADENDO FALTANTE — se eu sei 3 + ? = 10, estou usando
      um par fazer-dez. E à medida que crescemos para
      números maiores, a ideia fazer-dez se estende — quando
      conhecermos SOMAR ATÉ 100, faremos dez novamente para
      gerenciar a operação de reagrupamento."

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Identificar o par fazer-dez para qualquer número 1–9
        em 8 de 10 tentativas.
      - Aplicar a estratégia fazer-dez para resolver somas-
        até-20 onde se encaixa perfeitamente (e.g., 8+5, 9+4,
        7+6) em 6 de 10 tentativas.
      - Articular o caminho fazer-dez em voz alta ('oito mais
        dois faz dez, mais três é treze') em 5 de 10
        tentativas de linguagem produtiva.
      - Decompor corretamente o segundo adendo quando
        solicitado em 6 de 10 tentativas.

    Diferenciação:
      - Pré-K (3-5 anos): construir recuperação de par fazer-
        dez em um painel-de-dez com contadores; pular o
        passo de aplicação da estratégia.
      - Educação infantil (5-7 anos): fluência completa de
        recuperação-do-par + introdução à operação de
        decomposição usando manipulativos painel-de-dez;
        somas-até-15 enfatizadas.
      - 1º ano: fluência completa da estratégia —
        recuperação do par + decomposição + somas mentais
        até 20 usando a estratégia.
      - 2º ano em diante: estender a ideia fazer-dez para
        fazer-cem (e.g., 78 + 5 = 78 + 2 + 3 = 80 + 3); a
        mesma operação mental generaliza para adição com
        consciência-de-valor-posicional (Arc 16 add-within-
        100).

compositionalRationale:
  pt: |
    Fio principal: matemática / adição-subtração (estratégia
    fazer-dez — aprofunda fio 11/14 → 12/14). Fio secundário:
    matemática / decomposição-de-números (a operação mental
    load-bearing é decompor um adendo para preencher o outro
    até 10; esta é a mesma habilidade de decomposição que
    fundamenta trabalho posterior de valor-posicional). Fio
    terciário: memória-de-trabalho + seleção-de-estratégia
    (criança mantém o par em mente enquanto quebra o segundo
    adendo; fluência de estratégia-nomeada é pré-condição
    para aritmética mental flexível).

    Significância arquitetural: companheiro de isolamento-de-
    estratégia de Arc 12 add-within-20. Em add-within-20,
    fazer-dez é a lição central de fluência embutida em uma
    unidade ampla de somas-até-20; este pacote isola a
    mecânica fazer-dez como habilidade nomeada e focada.
    Crianças que precisam de prática extra de fluência de
    estratégia recebem uma unidade dedicada; a operação
    fazer-dez se torna uma estratégia nomeada e memorável
    em vez de algo que acontece incidentalmente. O pacote
    within-20 e este pacote de isolamento-de-estratégia se
    compõem naturalmente — quem ensina pode ensinar within-
    20 primeiro e depois usar este pacote de isolamento-de-
    estratégia para uma segunda passagem direcionada, OU
    ensinar este pacote primeiro como preparação para
    within-20.

    Companheiro emparelhado de âncora-de-fio: find-missing-
    addend-within-10 (mesma fase do arco) — o trabalho de
    par fazer-dez se sobrepõe diretamente com a recuperação
    de adendo-faltante (saber 7 + ? = 10 É encontrar um
    adendo faltante dentro de 10). Os dois pacotes
    compartilham DNA do fio de fluência em adição sem serem
    parceiros inversos (diferentemente do par 2-digit-
    without-regrouping); seu emparelhamento é temático em
    vez de operacionalmente inverso.

    Especificidade pt-BR: estratégia-fazer-dez é conceito
    universal + traduzível 1:1 do en. Vocabulário pt-BR
    canônico:
    - **"fazer dez"** / **"fazer 10"** — formas K-3 mais
      naturais; "fazer dez" é a expressão coloquial mais
      comum em sala de aula brasileira.
    - **"completar até dez"** — variante mais escolar formal;
      pode aparecer em material didático.
    - **"par fazer-dez"** / **"par-de-dez"** — termos K-3
      para o conceito de número-complementar; "par-de-dez"
      é a forma mais concisa.
    - **"decompor"** (técnico formal) / **"quebrar"**
      (informal K-3) — K-3 contexto natural usa "quebrar";
      "decompor" é escolar formal.
    - **"painel-de-dez"** — recorte estruturado em 2 fileiras
      de 5 quadrados para apoio visual da estratégia.

    Sistema de palavras-número pt-BR para números 11-20:
    regular comparado a en (en 'eleven, twelve' irregulares
    vs pt 'onze, doze, treze, catorze, quinze, dezesseis,
    dezessete, dezoito, dezenove, vinte'). Os números 16-19
    em pt-BR mostram a estrutura "dez+resto" explicitamente
    ('dezesseis' = 'dez-e-seis') — o que torna a estratégia
    fazer-dez especialmente legível em pt-BR. Crianças
    brasileiras já ouvem o "dez" embutido nos números teen;
    a estratégia fazer-dez torna essa estrutura
    operacionalmente visível.

    Currículo BNCC EF01MA06 (1º ano) + EF01MA08 (1º ano):
    construção de fatos básicos da adição; estratégias
    pessoais; composição/decomposição.

    Substrato Class B FLEXIBLE: composta contra tema
    breakfast (alimentos com itens discretos e contáveis —
    torradas, ovos, panquecas — que apoiam visualmente a
    história de decomposição; diversificação inter-fios
    afastando-se de pacotes de adição dominados por animais
    per princípio §1 acquisition-flywheel reuse-density).
