assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify each of the 6 new shapes (oval, diamond, star, heart,
        pentagon, hexagon) by name in 5 of 6 trials.
      - Name all 10 shapes (basic 4 + extended 6) when shown the shape in
        7 of 10 trials.
      - Sort mixed shapes onto correct category mats with 10-shape full
        set in 7 of 10 trials.

    Differentiation:
    - Pre-K: 6-shape extended set only (basic 4 already covered).
    - K: full 10-shape productive fluency.
    - Grade 1+: extend to describe-shape-attributes (sides, corners,
      vertices count) + identify-symmetry-line + compose-shapes-from-parts.

    Prerequisite check: kids who haven't completed identify-2d-shapes-basic
    benefit from a brief 4-basic-shape refresher at warmup; the package
    structure assumes the basic 4 are already in place.

