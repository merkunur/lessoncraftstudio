# Teaching package — answer who, what, where questions about a scene (pt sparse-override)
# Arc 18 Phase 1.3 (21st-consecutive pt cadence per Arc 7+ convention). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF01LP19 (recuperar informações em textos; quem fez o quê, onde, quando, como).

targetSlug: answer-who-what-where-questions
language: pt

title:
  pt: "Responder quem, o que, onde — encontrar as respostas na imagem"

description:
  pt: "Pacote de compreensão leitora para a educação infantil, ensinando crianças a identificar e responder as três palavras-pergunta fundamentais sobre uma cena: QUEM está na imagem? O QUÊ estão fazendo? ONDE eles estão? Apoia-se no Arc 12 Fase 2 match-sentence-to-picture (a fundação 0/10 → 1/10 do strand; crianças que sabem combinar uma frase a uma imagem agora extraem elementos específicos dessa imagem). O strand reading-comprehension avança 5/10 → 6/10. Pacote-parceiro de infer-character-feeling-from-picture-cue (Slot 2 da Fase 1.3) E pacote-parceiro de Arc 17 P1.5 identify-main-character (o precedente de identificação de QUEM) + Arc 18 P1.2 identify-setting (o precedente de identificação de ONDE) — juntos esses quatro pacotes formam o cluster de conhecimento-de-personagem K → 1.º ano. Por §A.13.30 enquadramento informal K-1: o trabalho K é responder perguntas em LEITURA EM VOZ ALTA PELO PROFESSOR ou texto APOIADO POR ILUSTRAÇÃO, NÃO decodificação independente. As crianças olham para uma imagem + escutam uma pergunta; apontam para ou nomeiam a resposta QUEM, O QUÊ ou ONDE. As palavras-pergunta 'quem' (pergunta sobre uma pessoa/personagem), 'o quê' (pergunta sobre uma ação ou objeto), e 'onde' (pergunta sobre um lugar) formam a tríade fundamental da compreensão receptiva. Alinhamento BNCC: EF01LP19 (recuperar informações em textos). 5 exercícios + 8 materiais imprimíveis ao longo de 1 semana."

structure:
  warmup:
    body: |
      Introdução das palavras-pergunta com toda a turma e
      uma imagem de cena. Você mostra uma única imagem
      de cena com 1 personagem fazendo 1 ação em 1 lugar
      (ex.: uma menina brincando com uma bola no parque;
      um menino comendo uma maçã na mesa; um cachorro
      correndo na floresta). Após a turma observar:
      "Vou fazer três perguntas sobre esta imagem. QUEM
      está na imagem?" A turma nomeia o personagem (a
      menina). "O QUE ela está fazendo?" A turma nomeia
      a ação (brincando com uma bola; OU brincando).
      "ONDE ela está?" A turma nomeia o lugar (o
      parque). Você enfatiza: "Três palavras-pergunta
      nos contam quase toda uma história — QUEM, O QUÊ,
      ONDE. QUEM pergunta sobre pessoas, personagens ou
      animais. O QUÊ pergunta sobre o que estão fazendo
      ou o que está ali. ONDE pergunta sobre o LUGAR."
      Você repete com uma segunda cena (personagem,
      ação e lugar diferentes). A turma repete em coro o
      padrão: "QUEM está na imagem? O QUE estão fazendo?
      ONDE estão?" Ênfase do padrão: "Quando vocês
      olham para uma imagem, FAÇAM essas três perguntas.
      As respostas nos contam o que está acontecendo."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de cena-e-pergunta.
      Cada dupla recebe 6 cartões de cena (cada cartão
      mostra um único personagem fazendo uma única ação
      em um único lugar — apoiada por ilustração com
      legenda de 1 frase) + 18 cartões de resposta (6
      cartões QUEM + 6 cartões O QUÊ + 6 cartões ONDE).
      A dupla se reveza: a criança A pega um cartão de
      cena; a criança B responde as três perguntas em
      voz alta ("Quem está na imagem? O menino. O que
      ele está fazendo? Comendo uma maçã. Onde ele
      está? Na mesa da cozinha.") e encontra os cartões
      de resposta QUEM + O QUÊ + ONDE correspondentes.
      Ambas as crianças verificam colocando os 3 cartões
      ao lado da cena. Depois trocam. Recapture erros
      com dicas de palavra-pergunta ("você respondeu
      'uma bola' para QUEM — mas 'bola' é uma COISA,
      não uma PESSOA. QUEM pergunta sobre uma pessoa ou
      animal. Olhe novamente: quem está na imagem?").
      Nota para o professor: crianças K às vezes
      confundem O QUÊ e ONDE (uma criança brincando NO
      PARQUE: 'o que a criança está fazendo? no parque'
      — essa é uma resposta ONDE para uma pergunta O
      QUÊ). Recapture com a dica de ação ("O QUÊ pergunta
      sobre uma palavra de AÇÃO — um verbo. A menina
      está BRINCANDO. Brincando é o O QUÊ. O PARQUE é
      o ONDE.").
  scaffold:
    body: |
      Rotação por estações. Estação 1: atividade de
      correspondência (as crianças combinam cada imagem
      de cena ao seu cartão de resposta QUEM; o
      exercício fundamental de identificação de quem).
      Estação 2: atividade picture-sort (as crianças
      separam cartões de resposta em 3 pilhas: respostas
      QUEM vs respostas O QUÊ vs respostas ONDE — revela
      a distinção categórica entre os três tipos de
      palavra-pergunta). Estação 3: missing-pieces
      (completar uma cena parcial selecionando o elemento
      ausente — um personagem ausente torna a resposta
      QUEM determinante; um objeto ausente torna O QUÊ;
      um fundo ausente torna ONDE). Estação 4: atividade
      de correspondência na consolidação (cena com cartão
      de resposta O QUÊ; reforça extração de ação).
  closure:
    body: |
      Recapitulação rápida das palavras-pergunta com toda
      a turma. Você mostra 3 cenas; a turma responde em
      coro as três perguntas para cada uma. "Cena 1:
      quem está na imagem? A MENINA! O que ela está
      fazendo? LENDO! Onde ela está? NA BIBLIOTECA!"
      "Cena 2: quem? O BEBÊ! O quê? CHORANDO! Onde? NO
      BERÇO!" "Cena 3: quem? O GATO! O quê? DORMINDO!
      Onde? NO TRAVESSEIRO!" Você faz a pergunta
      diagnóstica: "Se eu pergunto QUEM, que tipo de
      resposta vocês dão?" (Turma: UMA PESSOA ou
      ANIMAL!) "Se eu pergunto O QUÊ?" (Turma: UMA AÇÃO
      ou COISA!) "Se eu pergunto ONDE?" (Turma: UM
      LUGAR!) Aponte adiante: "Hoje aprendemos três
      palavras-pergunta que nos ajudam a entender
      imagens + histórias. QUEM, O QUÊ, ONDE. Amanhã
      adicionamos uma quarta pergunta — como o
      personagem SE SENTE? Quando soubermos QUEM está na
      história + ONDE estão + O QUE estão fazendo +
      COMO se sentem, vamos saber quase tudo sobre o que
      está acontecendo. Ler é fazer perguntas + encontrar
      as respostas nas palavras + ilustrações."

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Responder perguntas QUEM sobre uma imagem de
        cena corretamente em 8 de 10 tentativas.
      - Responder perguntas O QUÊ sobre uma imagem de
        cena corretamente em 7 de 10 tentativas.
      - Responder perguntas ONDE sobre uma imagem de
        cena corretamente em 7 de 10 tentativas.
      - Distinguir os três tipos de palavra-pergunta ao
        separar cartões de resposta (um cartão 'parque' é
        uma resposta ONDE, não uma resposta QUEM) em 7
        de 10 tentativas.
      - Articular respostas em frase completa usando o
        framework das sentence-strips ('A menina está
        lendo. Ela está na biblioteca.') em 5 de 10
        tentativas de produção verbal.
      - Usar o vocabulário 'quem' / 'o quê' / 'onde' /
        'pergunta' / 'resposta' corretamente em 6 de 10
        tentativas de produção verbal.

    Diferenciação:
    - Pré-escola: leitura em voz alta + identificação por
      pista visual de elementos (sem distinção formal de
      palavra-pergunta); crianças simplesmente nomeiam
      'quem está na imagem' sem categorizar tipos de
      pergunta.
    - Educação infantil (5-7 anos): resposta completa
      QUEM/O QUÊ/ONDE com cenas familiares + cenas novas
      simples; leitura em voz alta pelo professor muito
      apoiada.
    - 1.º ano: resposta independente em cenas novas
      simples; ponte para perguntas QUANDO + PORQUE
      (candidatos 1.º+); introduzir o framework 5-W
      (QUEM + O QUÊ + ONDE + QUANDO + PORQUE).
    - 2.º ano em diante: framework 5-W com COMO (o
      framework de 6-perguntas jornalístico); trabalho
      de formação de pergunta (crianças fazem suas
      próprias perguntas sobre uma cena); ponte para
      identify-problem-and-solution (candidato Fase 1.4;
      o trabalho de problema-solução depende da
      extração QUEM+ONDE+O QUÊ).

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en).
    Os campos materials, composedExercises,
    curriculumStandards e learningObjectives são herdados
    do package.yaml via merge sparse-override e não são
    repetidos aqui per a convenção Arc 7+.

    Vocabulário pt-BR canônico para palavras-pergunta:
    - 'quem' (canônico para who; pergunta sobre pessoa /
      animal / personagem)
    - 'o quê' (canônico para what; pergunta sobre ação /
      objeto / coisa); alternativa 'o que' em registro
      mais informal
    - 'onde' (canônico para where; pergunta sobre lugar /
      localização)
    - 'quando' (when; introduzido em pacotes 1.º ano+)
    - 'por que' / 'porque' (why; introduzido em pacotes
      1.º ano+; nota: 'por que' interrogativa separada,
      'porque' conjunção causal — distinção ortográfica
      pt-BR canônica)
    - 'como' (how; introduzido em pacotes 1.º + 2.º ano)
    - 'pergunta' (question); 'resposta' (answer)
    - 'palavra-pergunta' (question-word)
    - vocabulário de elementos: 'personagem' (character),
      'lugar' (place), 'ação' (action), 'cena' (scene)

    Convenção pt-BR vs pt-PT: ambas as variantes usam a
    tríade quem/o quê/onde identicamente; a divergência
    principal é fonológica. Para o público K da Fase
    1.3, 'o quê' é o canônico pt-BR (com til e
    interrogação completa); pt-PT pode usar 'o que' sem
    til em registro mais formal.

    Particularidade pt-BR para o framework de palavras-
    pergunta:
    - Pt-BR usa as palavras-pergunta cedo (já no 1.º
      ano EF); a tríade quem/o quê/onde é parte do
      vocabulário receptivo K
    - Estrutura sintática: pt-BR coloca a palavra-
      pergunta no INÍCIO da frase ("Quem está aqui?"),
      mesma estrutura do en. Cross-locale-portable.
    - Diferença estrutural com inglês: pt usa
      preposições para introduzir o lugar (NA mesa, NO
      parque), enquanto en usa preposições diferentes
      (ON the table, AT the park). Trabalho de
      preposições é separado (já coberto em prepositions
      package).

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF01LP19 ('Recuperar em textos lidos pelo professor
    ou pelas crianças informações explícitas, como
    personagens, suas características, tempo e espaço
    onde se desenrola a ação') cobre exatamente a
    pedagogia deste pacote. EF02LP26 ('Identificar
    elementos que compõem uma narrativa: personagens,
    cenário, tempo, conflito e desfecho') é a extensão
    BNCC do 2.º ano que integra a extração QUEM/O QUÊ/
    ONDE com outros elementos narrativos. A pedagogia
    BNCC do 1.º + 2.º ano coloca a extração de
    elementos narrativos como base para a compreensão
    leitora autônoma — exatamente o trabalho do quarteto
    de pacotes identify-main-character + identify-
    setting + answer-who-what-where-questions + infer-
    character-feeling-from-picture-cue.

    Leitura em voz alta como modo pedagógico canônico no
    K-1 brasileiro: a alfabetização brasileira K-1
    valoriza o trabalho de leitura compartilhada
    (professor lê em voz alta; crianças acompanham com
    ilustrações). Este pacote alinha-se com esse modo
    pedagógico — as crianças NÃO precisam ler de forma
    independente para responder perguntas QUEM/O QUÊ/
    ONDE; basta acompanhar a leitura do professor +
    interpretar pistas visuais.

    Pacote-parceiro do Arc 17 P1.5 identify-main-
    character + Arc 18 P1.2 identify-setting + Slot 2
    Phase 1.3 infer-character-feeling-from-picture-cue:
    juntos formam o cluster K → 1.º ano de extração de
    elementos narrativos. A simetria estrutural dos
    quatro pacotes (mesma composição base de 5
    exercícios; Literacy 8 materiais; sentence-strips
    framePreset 'this-is-a') torna o trabalho de ensino
    coerente entre as semanas. Professores podem
    ensinar a sequência:
    - Semana 1: identify-main-character (QUEM)
    - Semana 2: identify-setting (ONDE)
    - Semana 3: answer-who-what-where-questions
      (QUEM + O QUÊ + ONDE generalizado)
    - Semana 4: infer-character-feeling-from-picture-cue
      (QUEM + sentimento; 1.º ano)
    Após esta sequência de 4 semanas, as crianças
    brasileiras K-1.º ano têm a base completa de
    extração de elementos narrativos para a leitura
    compartilhada apoiada por ilustração.

    Por §A.13.30 enquadramento informal K-1: este
    pacote NÃO ensina análise literária formal nem
    framework 5-W completo (QUEM + O QUÊ + ONDE +
    QUANDO + PORQUE) — apenas a tríade fundamental
    QUEM/O QUÊ/ONDE. Famílias brasileiras às vezes
    perguntam por análise mais sofisticada; o parent-
    take-home-letter explicita que o objetivo K é a
    tríade fundamental, com 5-W + 6-W emergindo no 2.º
    + 3.º ano EF.
