  en: "K-3 bundle centered on supermarket-shopping as daily-life anchor for cross-strand work. 5 packages span vocabulary-acquisition (identify-and-name-foods + identify-and-name-fruits + identify-and-name-vegetables — supermarket aisle vocabulary) + numeracy (count-objects-1-to-10 — counting items in a basket: 3 apples, 5 oranges, 2 loaves of bread) + comparison (compare-quantities-more-fewer — more strawberries than blueberries in the basket?) + cognitive-sorting (sort-by-category — produce aisle vs dairy aisle vs bakery aisle) + community-roles (identify-community-helpers — cashier, baker, butcher, produce-stocker as supermarket workers). Cross-strand daily-life bundle with strong real-world classroom-trip + family-shopping-routine extensions. Suitable for a 4-5 week classroom unit; supports K-3 multilingual classrooms with field-trip + math-application + economic-awareness extensions."

