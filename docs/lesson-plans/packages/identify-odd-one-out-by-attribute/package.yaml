compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / logical-reasoning.
    Secondary strand: vocabulary acquisition (vocab-anchored — color +
    shape + size words reinforced through attribute reasoning). Tertiary
    strand: attribute-discrimination + verbalization (kids must articulate
    WHICH attribute makes the odd one odd — color? shape? size? — develops
    meta-cognitive vocabulary about visual properties).

    Sibling pair with identify-odd-one-out-by-category (Arc 7 Phase 2):
    same exclusion-reasoning architecture applied to ATTRIBUTE rather
    than CATEGORY. Together the pair completes the odd-one-out cognitive
    axis: by-category (semantic exclusion) + by-attribute (visual
    exclusion). Resolves Arc 7's explicit forward-pointer "by ATTRIBUTE
    — not by what it IS, but by what color or shape or size makes it
    different."

    Architectural significance: completes the Arc 7 → Arc 8 odd-one-out
    progression. The 2-package set (by-category + by-attribute) covers
    the fundamental odd-one-out reasoning surface kids will encounter
    in standardized cognitive assessments + structured-reasoning
    contexts throughout K-3.

    Distinctive composition: 4 odd-one-out exercises spanning 4 attribute
    contexts (colors, shapes, animals visually contrasted, fruits visually
    contrasted) + 1 matching at position 2. Mirrors the by-category
    package's pattern. The same odd-one-out app works for both reasoning
    types — operator-strategic theme selection at composition time
    determines whether the exclusion is by category or by attribute.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Color + shape vocab themes; same-category-different-attribute sets
    constructable from any theme.

    K-3 multilingual classroom relevance: attribute vocabulary (color,
    shape, size words) is high-frequency early-language target;
    embedding attribute reasoning into a logical-reasoning surface
    doubles the language-acquisition opportunity. Verbalization of
    attribute-difference reasoning ("the others are RED; this one is
    GREEN") is exactly the kind of full-sentence grammatical practice
    K-3 multilingual classrooms need.

