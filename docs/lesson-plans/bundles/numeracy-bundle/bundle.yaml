thematicCoherence:
  en: |
    All ~25 packages cohere around the numeracy strand cluster:
    addition-subtraction operations + place-value foundations + supporting
    counting-on / decomposition / comparison work. The cluster captures
    the §A.13.25 cluster-taxonomy emergence at scale (largest single-
    strand bundle in the Pillar 2 ecosystem at Arc 19 P2 close).

    **Pedagogical sequencing (4-phase K-2 math arc):**

    **Phase 1: Foundations (Pre-K → K)**
    1. count-on-from-given-number — Counting strategy foundation
    2. decompose-numbers-to-10 — Number-sense decomposition
    3. compare-quantities-more-fewer-up-to-20 — Comparison vocabulary

    **Phase 2: Addition + Subtraction within small ranges (K)**
    4. add-within-5 → add-within-10 → add-within-20 — Progressive
       addition scope
    5. subtract-within-5 → subtract-within-10 → subtract-within-20 —
       Parallel subtraction
    6. find-missing-addend-within-10 — Inverse-operation thinking
    7. make-10-strategy — Strategy-based computation
    8. fact-families-within-10 — Addition-subtraction relationship
    9. add-3-numbers-within-20 — Multi-addend extension

    **Phase 3: Place value (Grade 1)**
    10. identify-tens-and-ones-2-digit — Place-value foundation
    11. tens-and-ones-1-to-20 → 21-to-50 → 51-to-100 — Progressive
        place-value scope
    12. decompose-tens-and-ones-within-19 — Place-value decomposition
    13. identify-place-value-hundreds — Extension to hundreds

    **Phase 4: 2-digit operations (Grade 1-2)**
    14. add-within-100 + add-2-digit-without-regrouping + add-2-digit-
        numbers — Progressive 2-digit addition
    15. subtract-within-100 + subtract-2-digit-without-regrouping +
        subtract-2-digit-numbers — Parallel 2-digit subtraction

    **Strand spread:** ~20 addition-subtraction-strand packages + ~5
    place-value-strand + supporting counting-cardinality work. Includes
    Arc 18's 19th + 21st parent-class strand SAT closures.

    **Suggested unit duration:** full school year math curriculum.
    Bundle is designed as comprehensive anchor; teachers select 8-12
    packages per term per grade level (K = Phase 1+2; Grade 1 = Phase
    2-completion + Phase 3; Grade 2 = Phase 3+4).

    **Multilingual classroom relevance:** mathematical concepts are
    universal across all 11 platform locales; counting + operation
    vocabulary varies. Bundle delivery requires locale-canonical
    counting vocabulary substitution (pt-BR: contar / somar / subtrair;
    de: zählen / addieren / subtrahieren; etc.) but pedagogy is
    structurally identical. Locale-natural mathematical examples
    available across all locales.

    **Architectural significance:** strand-anchored cluster bundle
    largest in Pillar 2 ecosystem at Arc 19 P2 close. Establishes the
    §A.13.25 cluster-taxonomy emergence sub-pattern: ~25-package strand
    clusters require sub-pattern recognition (Phase 1-2-3-4 sub-axes
    above) for pedagogical coherence at scale. Future strand-anchored
    bundle commissions follow this 4-phase decomposition where strand
    naturally splits into developmental sub-bands.
