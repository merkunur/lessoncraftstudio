thematicCoherence:
  en: |
    All 4 packages cohere around fruits theme + form a cross-strand
    bundle demonstrating that single-theme bundles can span diverse
    strands meaningfully.

    **Pedagogical sequencing:**
    1. **identify-and-name-fruits** — Foundational fruits vocabulary
       (apple, banana, orange, etc.).
    2. **count-objects-1-to-10** — Counting practice using fruits as
       canonical countable objects (count 5 apples; 8 bananas).
    3. **describe-plant-life-cycle** — Science: fruits are the produce
       stage of plant life-cycle. Connects vocabulary + counting to
       biological understanding.
    4. **sort-by-color** — Cognitive sorting using fruits' color-
       diversity (red apples vs yellow bananas vs purple grapes);
       fruits theme rich in color variety.

    **Strand spread:** 1 vocabulary-acquisition + 1 numeracy + 1 world-
    knowledge living-things + 1 cognitive sorting. **4 distinct
    strands in single bundle.** Demonstrates cross-strand bundle
    composition feasibility.

    **Suggested unit duration:** 4 weeks (1 package per week).

    **Multilingual classroom relevance:** fruit vocabulary high-
    frequency K-3 target across all 11 platform locales; cognate-rich
    Romance + many Germanic (banana / banana / banana / Banane —
    universal cognate; apple / manzana / mela / Apfel — varied).
    Bundle supports diverse multilingual classroom needs.

    **Pillar 2 architectural pattern:** fruits-bundle composition
    illustrates that theme-anchored bundles can deliberately span
    multiple strands when the theme provides natural cross-strand
    bridges (fruits = countable + categorizable + biological + color-
    diverse). Theme-anchored DOES NOT mean strand-narrow; thoughtful
    composition produces multi-strand depth within theme.
