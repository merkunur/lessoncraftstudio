# Teaching package — isolate initial phoneme
# Arc 19 Phase 1.1 Slot 3 (early-literacy / phonological-awareness strand 2/9 → 3/9). Pair-coherent with Phase 1.1 Slot 4 produce-rhyming-words. Foundational pre-reading skill: kids identify the FIRST SOUND in spoken CVC words (cat → /k/; dog → /d/; mom → /m/).

targetSlug: isolate-initial-phoneme
language: en
title:
  en: "First Sounds — what sound does the word START with?"
description:
  en: "Kindergarten early-literacy package teaching kids to isolate the INITIAL PHONEME (first sound) in spoken CVC words. Foundational phonological-awareness skill: kids hear 'cat' and identify the first sound as /k/, hear 'dog' and identify /d/, hear 'mom' and identify /m/. Phonological-awareness strand advances 2/9 → 3/9. Per learning-targets.json prerequisites: [] (foundational). Critical bridge between rhyme-awareness (Arc 10 identify-rhyming-pairs) + phoneme-level decoding (later Grade K-1 work): kids who can isolate initial phonemes acquire systematic phonics decoding more easily. Per §A.13.30 K-1 informal framing: K phoneme-isolation work is CONCRETE SOUND-RECOGNITION — kids hear a word, name the first sound, match it to a beginning-sound picture. NOT formal phonetics-theory pedagogy (terms like 'voiceless plosive' / 'phonetic transcription' are not K-level work); the K pedagogy uses everyday language ('first sound' / 'beginning sound' / 'starting sound') to surface the phoneme pattern. CCSS.RF.K.2d primary anchor ('Isolate and pronounce the initial, medial vowel, and final sounds (phonemes) in three-phoneme (consonant-vowel-consonant, or CVC) words'). 5 worksheet exercises + 8 printable materials over a 1-week unit. **Phonological-awareness pedagogy is locale-specific because phoneme inventories differ per language.** This en package uses the English phoneme set; pt variant uses the Brazilian Portuguese phoneme set per BR-MEC framework. Materials list mirrors identify-rhyming-pairs Literacy class shape with phoneme-level adaptations."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class first-sound hook. Teacher says a word slowly:
      "C-a-t. What sound does CAT start with?" Class: /k/!
      Teacher writes the letter K + a cat picture on the board.
      "Yes — CAT starts with the /k/ sound." Repeats with: "D-
      o-g. First sound?" Class: /d/! "M-o-m. First sound?" /m/!
      "S-u-n. First sound?" /s/! Pattern emphasis: "Every word
      starts with a SOUND. The first sound is the BEGINNING SOUND
      of the word. We can hear it if we say the word slowly. We
      can match it to a letter that makes that sound."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + first-sound recognition routine. Each pair
      receives 8 picture cards + 4 letter cards. Pair takes
      turns: kid A names a picture (cat); kid B identifies the
      first sound (/k/) + places the picture under the matching
      letter card (K). Repeats with mat, hat, bat all going
      under M, H, B respectively. Critical pedagogical note: K
      kids may confuse sound names with letter names — /k/ is
      the SOUND; "kay" is the LETTER NAME. Be explicit: "We're
      listening for the SOUND the word starts with, not the
      letter name." Recast errors with slow-pronunciation ("you
      said BIRD starts with /d/ — let's say it slowly: B-i-r-d.
      What's the FIRST sound? /b/, not /d/. The /d/ is at the
      END of BIRD."). Some kids may also benefit from segmenting
      the word with finger-taps (one tap per sound) before
      identifying the first phoneme. Build phoneme-isolation
      fluency first with single-consonant initial sounds; defer
      consonant-blend onsets (/bl/, /str/, /sn/) to later
      phonological-awareness work.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (picture
      → initial letter; kids match pictures to the letter
      representing their first sound). Station 2: word-guess
      (kids fill in the missing initial letter of a picture's
      name). Station 3: picture-sort (kids sort pictures into
      groups by first sound). Station 4: word-scramble (kids
      unscramble simple CVC words; reinforces sound-letter
      mapping at word level).
  closure:
    durationMinutes: 5
    body: |
      Whole-class first-sound quick-recall. Teacher names a word;
      class shouts the first sound. "Sun!" /s/! "Tree!" /t/!
      "Apple!" /a/! "Fox!" /f/! Teacher closes: "Every word
      starts with a sound. Hearing the first sound is the
      FIRST step in reading. Next we'll learn to PRODUCE
      RHYMING words — coming up with words that sound the same
      at the END. That's the matching skill at the OTHER end
      of the word."

