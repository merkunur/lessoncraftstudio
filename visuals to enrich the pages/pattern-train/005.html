<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Pattern Train - Professional Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #1A237E 0%, #283593 50%, #303F9F 100%); overflow: hidden;">

        <!-- Subtle diagonal pattern overlay -->
        <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 20px); opacity: 0.5;"></div>

        <!-- Gold header bar -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #B8860B 0%, #FFD700 50%, #B8860B 100%);"></div>

        <!-- PROFESSIONAL QUALITY text -->
        <div style="position: absolute; top: 30px; left: 0; right: 0; text-align: center;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 20px; color: #FFD700; letter-spacing: 8px; text-transform: uppercase;">PROFESSIONAL QUALITY</span>
        </div>

        <!-- FREE badge (gold style) -->
        <div style="position: absolute; top: 70px; left: 40px; background: linear-gradient(135deg, #FFD700 0%, #FFA000 100%); padding: 12px 28px; border-radius: 8px; box-shadow: 0 4px 20px rgba(255,215,0,0.4); transform: rotate(-3deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: #1A237E; text-shadow: 1px 1px 0 rgba(255,255,255,0.3);">FREE</span>
        </div>

        <!-- Pattern Train logo badge (white outline style) -->
        <div style="position: absolute; top: 70px; right: 40px; border: 3px solid rgba(255,255,255,0.8); padding: 12px 25px; border-radius: 8px;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">Pattern Train</span>
        </div>

        <!-- Center quality seal with trophy -->
        <div style="position: absolute; top: 130px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <div style="width: 180px; height: 180px; background: linear-gradient(135deg, #FFD700 0%, #FFA000 50%, #FFD700 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 40px rgba(255,215,0,0.4), inset 0 -5px 20px rgba(0,0,0,0.2);">
                <!-- Inner circle -->
                <div style="width: 150px; height: 150px; background: linear-gradient(180deg, #1A237E 0%, #283593 100%); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px solid #FFD700;">
                    <span style="font-size: 55px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));">🏆</span>
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: #FFD700; margin-top: 5px;">Teacher Tested</span>
                </div>
            </div>
            <!-- Ribbon tails -->
            <div style="position: absolute; bottom: -20px; left: 30px; width: 50px; height: 60px; background: linear-gradient(180deg, #FFD700 0%, #FFA000 100%); clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%); transform: rotate(-15deg);"></div>
            <div style="position: absolute; bottom: -20px; right: 30px; width: 50px; height: 60px; background: linear-gradient(180deg, #FFD700 0%, #FFA000 100%); clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%); transform: rotate(15deg);"></div>
        </div>

        <!-- Answer key worksheet prominently displayed -->
        <div style="position: absolute; top: 340px; left: 50%; transform: translateX(-50%); z-index: 40;">
            <div style="background: white; padding: 12px; border-radius: 12px; box-shadow: 0 15px 50px rgba(0,0,0,0.4);">
                <img src="https://www.lessoncraftstudio.com/samples/english/pattern%20train/sample-1-answer.jpeg" style="width: 320px; height: auto; border-radius: 8px;">
            </div>
            <!-- Answer key label -->
            <div style="position: absolute; top: -15px; left: 50%; transform: translateX(-50%); background: #4CAF50; padding: 8px 20px; border-radius: 20px; box-shadow: 0 3px 10px rgba(76,175,80,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: white;">ANSWER KEY INCLUDED</span>
            </div>
        </div>

        <!-- Quality indicators row -->
        <div style="position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); display: flex; gap: 25px;">
            <!-- 300 DPI Gauge -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <div style="width: 90px; height: 90px; background: linear-gradient(135deg, #37474F 0%, #263238 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #FFD700; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                    <div style="text-align: center;">
                        <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #FFD700;">300</div>
                        <div style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 12px; color: white;">DPI</div>
                    </div>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: rgba(255,255,255,0.8);">High Resolution</span>
            </div>

            <!-- Print Ready Signal -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <div style="width: 90px; height: 90px; background: linear-gradient(135deg, #37474F 0%, #263238 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #4CAF50; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                    <div style="width: 45px; height: 45px; background: #4CAF50; border-radius: 50%; box-shadow: 0 0 20px rgba(76,175,80,0.6);"></div>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: rgba(255,255,255,0.8);">Print Ready</span>
            </div>

            <!-- Answer Keys Badge -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <div style="width: 90px; height: 90px; background: linear-gradient(135deg, #37474F 0%, #263238 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #26A69A; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                    <span style="font-size: 40px;">✓</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: rgba(255,255,255,0.8);">Answer Keys</span>
            </div>

            <!-- Zero Prep Clock -->
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                <div style="width: 90px; height: 90px; background: linear-gradient(135deg, #37474F 0%, #263238 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 4px solid #FF9800; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                    <span style="font-size: 40px;">⏱️</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: rgba(255,255,255,0.8);">Zero Prep</span>
            </div>
        </div>

        <!-- Footer tagline -->
        <div style="position: absolute; bottom: 45px; left: 0; right: 0; text-align: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; color: rgba(255,255,255,0.9);">Created by Educators, for Educators</span>
        </div>

        <!-- Corner icons -->
        <div style="position: absolute; bottom: 40px; left: 40px; display: flex; align-items: center; gap: 10px;">
            <div style="width: 45px; height: 45px; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                <span style="font-size: 26px;">📄</span>
            </div>
            <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: rgba(255,255,255,0.7);">PDF</span>
        </div>

        <div style="position: absolute; bottom: 40px; right: 40px; display: flex; align-items: center; gap: 10px;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: rgba(255,255,255,0.7);">Print</span>
            <div style="width: 45px; height: 45px; background: rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                <span style="font-size: 26px;">🖨️</span>
            </div>
        </div>

        <!-- Gold bottom bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #B8860B 0%, #FFD700 50%, #B8860B 100%);"></div>

    </div>
</body>
</html>
