  - IB-PYP.HowWeOrganizeOurselves

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify MOST/LEAST category in a bar graph in 8 of 10 trials.
      - Answer 'how many more X than Y' comparison in 6 of 10 trials.
      - Read bar height as numerical count in 8 of 10 trials.

    Differentiation:
    - Grade K (advanced): 2-3 categories; identify MOST/LEAST only.
    - Grade 1: 3-4 categories; comparison questions.
    - Grade 2+: 4-5 categories; multi-step questions ('how many MORE
      X than Y AND Z combined').

