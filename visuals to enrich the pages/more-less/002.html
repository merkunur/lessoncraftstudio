<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>More or Less - Variety Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(160deg, #E1F5FE 0%, #FFF8E1 60%, #FFECB3 100%); font-family: 'Fredoka', sans-serif;">

        <!-- Decorative clouds/shapes -->
        <div style="position: absolute; top: 50px; left: 60px; width: 100px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50px; filter: blur(2px);"></div>
        <div style="position: absolute; top: 80px; right: 100px; width: 80px; height: 40px; background: rgba(255,255,255,0.6); border-radius: 40px; filter: blur(2px);"></div>
        <div style="position: absolute; bottom: 200px; left: 40px; width: 60px; height: 30px; background: rgba(255,255,255,0.5); border-radius: 30px; filter: blur(2px);"></div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #FF6B6B 0%, #FF5252 100%); color: white; padding: 12px 28px; font-size: 24px; font-weight: 700; border-radius: 28px; box-shadow: 0 5px 18px rgba(255,107,107,0.4); letter-spacing: 2px;">FREE</div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 28px; right: 25px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #26A69A 0%, #00897B 100%); color: white; padding: 10px 22px; font-size: 17px; font-weight: 600; border-radius: 22px; box-shadow: 0 4px 14px rgba(38,166,154,0.4); font-family: 'Nunito', sans-serif;">PreK-K</div>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 90px; left: 0; right: 0; text-align: center;">
            <div style="font-size: 60px; font-weight: 700; color: #26A69A; text-shadow: 3px 3px 0 rgba(38,166,154,0.15);">Themed Variety Pack!</div>
            <div style="font-size: 24px; color: #5D7A77; font-family: 'Nunito', sans-serif; font-weight: 600; margin-top: 8px;">Fun Pictures Kids Love to Compare</div>
        </div>

        <!-- Winding Path with Worksheets -->
        <div style="position: absolute; top: 200px; left: 0; right: 0; bottom: 120px;">

            <!-- Dotted path (SVG) -->
            <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;" viewBox="0 0 1000 580">
                <path d="M 100,100 Q 250,50 350,150 Q 450,250 550,200 Q 700,130 850,200 Q 950,270 900,380 Q 800,500 600,450 Q 400,400 300,480"
                      stroke="#FFB300" stroke-width="8" fill="none" stroke-dasharray="20,15" stroke-linecap="round" opacity="0.6"/>
            </svg>

            <!-- Worksheet 1 - Nature/Trees (top left) -->
            <div style="position: absolute; top: 30px; left: 70px; z-index: 10;">
                <img src="https://www.lessoncraftstudio.com/samples/english/more%20less/sample-1.jpeg" style="width: 260px; height: auto; border-radius: 14px; box-shadow: 0 15px 40px rgba(0,0,0,0.18); border: 4px solid white;">
                <!-- Theme badge -->
                <div style="position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%); color: white; padding: 8px 18px; border-radius: 20px; font-size: 16px; font-weight: 700; box-shadow: 0 4px 12px rgba(76,175,80,0.4); white-space: nowrap;">
                    🌳 Nature
                </div>
            </div>

            <!-- Worksheet 2 - Birds (middle right) -->
            <div style="position: absolute; top: 120px; right: 80px; z-index: 10;">
                <img src="https://www.lessoncraftstudio.com/samples/english/more%20less/sample-3.jpeg" style="width: 240px; height: auto; border-radius: 14px; box-shadow: 0 15px 40px rgba(0,0,0,0.18); border: 4px solid white;">
                <!-- Theme badge -->
                <div style="position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); color: white; padding: 8px 18px; border-radius: 20px; font-size: 16px; font-weight: 700; box-shadow: 0 4px 12px rgba(33,150,243,0.4); white-space: nowrap;">
                    🐦 Birds
                </div>
            </div>

            <!-- Worksheet 3 - Christmas/Holiday (bottom center) -->
            <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;">
                <img src="https://www.lessoncraftstudio.com/samples/english/more%20less/sample-10.jpeg" style="width: 280px; height: auto; border-radius: 14px; box-shadow: 0 15px 40px rgba(0,0,0,0.18); border: 4px solid white;">
                <!-- Theme badge -->
                <div style="position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #F44336 0%, #D32F2F 100%); color: white; padding: 8px 18px; border-radius: 20px; font-size: 16px; font-weight: 700; box-shadow: 0 4px 12px rgba(244,67,54,0.4); white-space: nowrap;">
                    🎄 Christmas
                </div>
            </div>

            <!-- Floating theme icons -->
            <div style="position: absolute; top: 180px; left: 360px; font-size: 35px; transform: rotate(-10deg); opacity: 0.7;">🦜</div>
            <div style="position: absolute; top: 80px; right: 350px; font-size: 30px; transform: rotate(15deg); opacity: 0.6;">🎅</div>
            <div style="position: absolute; bottom: 180px; left: 280px; font-size: 32px; transform: rotate(-5deg); opacity: 0.7;">🍭</div>
            <div style="position: absolute; bottom: 100px; right: 200px; font-size: 28px; transform: rotate(10deg); opacity: 0.6;">🐧</div>
            <div style="position: absolute; top: 250px; left: 180px; font-size: 26px; transform: rotate(-15deg); opacity: 0.5;">🌲</div>
            <div style="position: absolute; top: 320px; right: 120px; font-size: 24px; transform: rotate(8deg); opacity: 0.5;">🦃</div>

            <!-- Sparkles -->
            <div style="position: absolute; top: 60px; left: 350px; font-size: 22px; transform: rotate(-5deg);">✨</div>
            <div style="position: absolute; top: 200px; right: 60px; font-size: 20px; transform: rotate(10deg);">⭐</div>
            <div style="position: absolute; bottom: 150px; left: 120px; font-size: 24px; transform: rotate(-10deg);">🌟</div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.95) 40%, white 100%);">
            <div style="position: absolute; bottom: 25px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 20px;">

                <!-- Year-Round badge -->
                <div style="background: linear-gradient(135deg, #FFB300 0%, #FF8F00 100%); color: white; padding: 16px 32px; border-radius: 35px; font-size: 26px; font-weight: 700; box-shadow: 0 6px 22px rgba(255,179,0,0.4); display: flex; align-items: center; gap: 10px;">
                    📅 Use Year-Round!
                </div>

                <!-- Print & Go badge -->
                <div style="background: linear-gradient(135deg, #26A69A 0%, #00897B 100%); color: white; padding: 14px 26px; border-radius: 30px; font-size: 20px; font-weight: 700; box-shadow: 0 5px 18px rgba(38,166,154,0.35);">
                    🖨️ Instant Download
                </div>
            </div>
        </div>

    </div>
</body>
</html>
