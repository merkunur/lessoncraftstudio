<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Draw and Color - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #00695C 0%, #004D40 60%, #00352C 100%); overflow: hidden;">

        <!-- Subtle studio atmosphere - light rays -->
        <div style="position: absolute; top: -100px; left: 30%; width: 300px; height: 600px; background: linear-gradient(180deg, rgba(255,248,225,0.08) 0%, transparent 100%); transform: rotate(-15deg); pointer-events: none;"></div>
        <div style="position: absolute; top: -50px; right: 25%; width: 250px; height: 500px; background: linear-gradient(180deg, rgba(255,248,225,0.06) 0%, transparent 100%); transform: rotate(10deg); pointer-events: none;"></div>

        <!-- Floating paint splatters for artist atmosphere -->
        <div style="position: absolute; top: 120px; left: 60px; width: 40px; height: 40px; background: radial-gradient(ellipse at 40% 40%, #FF6B6B 0%, #FF6B6B 50%, transparent 70%); opacity: 0.4; transform: rotate(-20deg);"></div>
        <div style="position: absolute; top: 200px; right: 80px; width: 35px; height: 30px; background: radial-gradient(ellipse at 50% 50%, #8BC34A 0%, #8BC34A 50%, transparent 70%); opacity: 0.35;"></div>
        <div style="position: absolute; bottom: 300px; left: 40px; width: 30px; height: 35px; background: radial-gradient(ellipse at 50% 50%, #6C4AB6 0%, #6C4AB6 50%, transparent 70%); opacity: 0.3;"></div>
        <div style="position: absolute; bottom: 350px; right: 50px; width: 28px; height: 28px; background: radial-gradient(ellipse at 50% 50%, #FFD54F 0%, #FFD54F 50%, transparent 70%); opacity: 0.4;"></div>

        <!-- FREE Badge - Coral Starburst Style -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="width: 100px; height: 100px; position: relative;">
                <!-- Starburst rays -->
                <div style="position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; transform: translate(-50%, -50%) rotate(22deg); background: linear-gradient(145deg, #FF6B6B 0%, #E53935 100%); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);"></div>
                <div style="position: absolute; top: 50%; left: 50%; width: 75px; height: 75px; transform: translate(-50%, -50%); border-radius: 50%; background: linear-gradient(145deg, #FF6B6B 0%, #E53935 100%); box-shadow: 0 4px 20px rgba(229,57,53,0.5); display: flex; align-items: center; justify-content: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">FREE</span>
                </div>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: linear-gradient(145deg, #8BC34A 0%, #7CB342 100%); padding: 14px 26px; border-radius: 30px; box-shadow: 0 4px 18px rgba(139,195,74,0.5);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">GRADES PreK-2</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 130px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 72px; color: #FFF8E1; margin: 0; text-shadow: 4px 4px 0 rgba(108,74,182,0.6), 0 0 40px rgba(255,248,225,0.3);">LEARN to DRAW!</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 36px; color: #8BC34A; margin: 8px 0 0 0; text-shadow: 2px 2px 0 rgba(0,0,0,0.2);">Grid Drawing Worksheets</h2>
        </div>

        <!-- Easel with Worksheets Display -->
        <div style="position: absolute; top: 280px; left: 50%; transform: translateX(-50%); width: 700px; height: 500px;">

            <!-- Back Left Worksheet - Fanned -->
            <div style="position: absolute; left: 80px; top: 60px; transform: rotate(-15deg); z-index: 5;">
                <div style="box-shadow: 0 10px 35px rgba(0,0,0,0.35); border-radius: 8px; overflow: hidden; border: 6px solid white;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/draw%20and%20color/sample-2.jpeg" style="width: 160px; height: auto; display: block;">
                </div>
            </div>

            <!-- Back Right Worksheet - Fanned -->
            <div style="position: absolute; right: 80px; top: 60px; transform: rotate(15deg); z-index: 5;">
                <div style="box-shadow: 0 10px 35px rgba(0,0,0,0.35); border-radius: 8px; overflow: hidden; border: 6px solid white;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/draw%20and%20color/sample-3.jpeg" style="width: 160px; height: auto; display: block;">
                </div>
            </div>

            <!-- Wooden Easel -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 10;">
                <!-- Easel back legs -->
                <div style="position: absolute; top: 80px; left: -100px; width: 20px; height: 380px; background: linear-gradient(90deg, #8B6914 0%, #D4A439 50%, #8B6914 100%); transform: rotate(-12deg); border-radius: 5px; box-shadow: -3px 0 10px rgba(0,0,0,0.3);"></div>
                <div style="position: absolute; top: 80px; right: -100px; width: 20px; height: 380px; background: linear-gradient(90deg, #8B6914 0%, #D4A439 50%, #8B6914 100%); transform: rotate(12deg); border-radius: 5px; box-shadow: 3px 0 10px rgba(0,0,0,0.3);"></div>

                <!-- Easel front leg (center back) -->
                <div style="position: absolute; top: 150px; left: 50%; transform: translateX(-50%); width: 16px; height: 320px; background: linear-gradient(90deg, #6B5210 0%, #A07B1A 50%, #6B5210 100%); border-radius: 4px; z-index: -1;"></div>

                <!-- Easel shelf/ledge -->
                <div style="position: absolute; top: 320px; left: 50%; transform: translateX(-50%); width: 280px; height: 25px; background: linear-gradient(180deg, #D4A439 0%, #A07B1A 50%, #8B6914 100%); border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 25;"></div>

                <!-- Main Canvas/Worksheet on Easel -->
                <div style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20;">
                    <div style="background: #FFF8E1; padding: 12px; border-radius: 8px; box-shadow: 0 15px 50px rgba(0,0,0,0.4), inset 0 0 30px rgba(212,164,57,0.2);">
                        <div style="box-shadow: 0 5px 20px rgba(0,0,0,0.15); border-radius: 6px; overflow: hidden; border: 4px solid white;">
                            <img src="https://www.lessoncraftstudio.com/samples/english/draw%20and%20color/sample-1.jpeg" style="width: 240px; height: auto; display: block;">
                        </div>
                    </div>
                </div>

                <!-- Easel top crossbar -->
                <div style="position: absolute; top: 5px; left: 50%; transform: translateX(-50%); width: 200px; height: 18px; background: linear-gradient(180deg, #D4A439 0%, #A07B1A 100%); border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,0.3); z-index: 30;"></div>
            </div>
        </div>

        <!-- Paint Palette - Bottom Left -->
        <div style="position: absolute; bottom: 110px; left: 50px; z-index: 30;">
            <!-- Palette base -->
            <div style="width: 120px; height: 90px; background: linear-gradient(145deg, #D4A439 0%, #A07B1A 100%); border-radius: 50% 50% 45% 45%; box-shadow: 0 8px 25px rgba(0,0,0,0.3); position: relative; transform: rotate(-15deg);">
                <!-- Thumb hole -->
                <div style="position: absolute; top: 55px; left: 15px; width: 25px; height: 20px; background: #00695C; border-radius: 50%; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);"></div>
                <!-- Paint blobs -->
                <div style="position: absolute; top: 12px; left: 25px; width: 20px; height: 18px; background: radial-gradient(ellipse, #FF6B6B 60%, #E53935 100%); border-radius: 50%;"></div>
                <div style="position: absolute; top: 8px; left: 55px; width: 18px; height: 16px; background: radial-gradient(ellipse, #42A5F5 60%, #1E88E5 100%); border-radius: 50%;"></div>
                <div style="position: absolute; top: 15px; left: 85px; width: 17px; height: 15px; background: radial-gradient(ellipse, #FFEB3B 60%, #FDD835 100%); border-radius: 50%;"></div>
                <div style="position: absolute; top: 35px; left: 70px; width: 19px; height: 17px; background: radial-gradient(ellipse, #8BC34A 60%, #7CB342 100%); border-radius: 50%;"></div>
                <div style="position: absolute; top: 40px; left: 40px; width: 16px; height: 14px; background: radial-gradient(ellipse, #9C27B0 60%, #7B1FA2 100%); border-radius: 50%;"></div>
            </div>
        </div>

        <!-- Paintbrushes - Bottom Right -->
        <div style="position: absolute; bottom: 100px; right: 60px; z-index: 30;">
            <!-- Brush 1 -->
            <div style="position: absolute; bottom: 0; right: 0; transform: rotate(25deg);">
                <div style="width: 12px; height: 90px; background: linear-gradient(90deg, #8B6914 0%, #D4A439 50%, #8B6914 100%); border-radius: 3px;"></div>
                <div style="position: absolute; top: -25px; left: -2px; width: 16px; height: 30px; background: linear-gradient(180deg, #E53935 0%, #C62828 100%); border-radius: 3px 3px 6px 6px;"></div>
                <div style="position: absolute; top: -5px; left: -1px; width: 14px; height: 12px; background: #9E9E9E; border-radius: 2px;"></div>
            </div>
            <!-- Brush 2 -->
            <div style="position: absolute; bottom: 10px; right: 30px; transform: rotate(15deg);">
                <div style="width: 10px; height: 80px; background: linear-gradient(90deg, #6B5210 0%, #A07B1A 50%, #6B5210 100%); border-radius: 3px;"></div>
                <div style="position: absolute; top: -22px; left: -2px; width: 14px; height: 26px; background: linear-gradient(180deg, #42A5F5 0%, #1976D2 100%); border-radius: 3px 3px 5px 5px;"></div>
                <div style="position: absolute; top: -4px; left: -1px; width: 12px; height: 10px; background: #757575; border-radius: 2px;"></div>
            </div>
            <!-- Brush 3 -->
            <div style="position: absolute; bottom: 5px; right: 55px; transform: rotate(35deg);">
                <div style="width: 11px; height: 85px; background: linear-gradient(90deg, #8B6914 0%, #D4A439 50%, #8B6914 100%); border-radius: 3px;"></div>
                <div style="position: absolute; top: -24px; left: -2px; width: 15px; height: 28px; background: linear-gradient(180deg, #8BC34A 0%, #689F38 100%); border-radius: 3px 3px 6px 6px;"></div>
                <div style="position: absolute; top: -4px; left: -1px; width: 13px; height: 11px; background: #9E9E9E; border-radius: 2px;"></div>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; z-index: 50;">
            <div style="background: #FFF8E1; padding: 12px 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 3px solid #8BC34A;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #558B2F;">No Prep</span>
            </div>
            <div style="background: #FFF8E1; padding: 12px 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 3px solid #6C4AB6;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #6C4AB6;">Print & Go</span>
            </div>
            <div style="background: #FFF8E1; padding: 12px 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 3px solid #FF6B6B;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #E53935;">Cute Animals</span>
            </div>
            <div style="background: #FFF8E1; padding: 12px 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 3px solid #D4A439;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #A07B1A;">Grid Method</span>
            </div>
        </div>

    </div>
</body>
</html>
