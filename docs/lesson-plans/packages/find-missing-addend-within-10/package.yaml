compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (find missing
    addend within 10 — deepens strand 12/14 → 13/14). Secondary
    strand: algebraic-thinking precursor (the unknown-in-a-
    blank question form is the K-3 precursor to equation-
    solving; the same blank that holds '5' here becomes 'x'
    in middle-elementary algebra). Tertiary strand: numeracy
    (count-up + addition-fact-recall + use-known-facts
    strategy fluency).

    Architectural significance: RESOLVES Arc 4 add-within-5
    forward-pointer ('find-missing-addend-within-10 —
    adjacent inverse-thinking target'). First algebraic-
    thinking package in the catalog. The missing-addend
    question reuses addition facts kids already have from
    add-within-5 + add-within-10 fluency, but flips the
    question — instead of computing a sum from known
    addends, kid finds an unknown addend given sum and one
    addend. This question-form flip is the cognitive move
    that grounds later equation-solving; surfacing it as a
    discrete K-3 skill makes the algebraic move legible
    long before letters enter the math vocabulary.

    Paired strand-anchor companion: make-10-strategy (same
    arc phase) — the make-10 partner work overlaps directly
    with missing-addend recall when the sum is 10 (knowing
    7 + ? = 10 IS using a make-10 partner). The two
    packages share addition-fluency strand DNA; the make-
    10 package builds partner-recall, this package extends
    it to any sum-within-10.

    Distinctive composition: 2 addition find-addend (intro
    + assessment slots — the load-bearing missing-addend
    exercise mode bookending the unit) + 1 math-puzzle
    missing-addend + 1 math-worksheet + 1 matching. Heavy
    weighting on addition find-addend mode because that's
    the app/mode that produces the canonical missing-addend
    exercise shape; add-within-5 already used find-addend
    at its position 4 (consolidation), and this package
    extends that work to a full missing-addend unit. The
    matching activity at position 4 surfaces the answer-
    recall path: kids match each problem (3+?=8) to its
    answer (5) directly, which reinforces the addition-
    fact-recall strategy beyond counting-up.

    Class B FLEXIBLE substrate: composes against fruits
    theme (cross-strand diversification away from animals;
    light continuity with add-within-5's mixed-exercise
    fruits theme at position 5 — kids who did add-within-5
    will recognize the fruit context when the missing-
    addend question form arrives).

    K-3 multilingual classroom relevance: missing-addend
    question form is universal K-3 numeracy + algebraic-
    thinking content. The verbal form varies across locales:
    en 'what number fills the blank?' / 'three plus what is
    eight?'; de 'welche Zahl fehlt?' / 'drei plus wie viel
    ergibt acht?'; es 'qué número falta?' / 'tres más cuánto
    es ocho?'; pt 'que número falta?' / 'três mais quanto
    é oito?'; fr 'quel nombre manque?' / 'trois plus combien
    fait huit?'; fi 'mikä luku puuttuu?'. The make-10-partner
    overlap is locale-portable — every locale's number-word
    system has a 'make-ten partner' relationship even if the
    teen-number words themselves are irregular. Locale-
    variant work at Phase 3+ adapts question-form phrasing
    + strategy-naming convention to each locale's register.

