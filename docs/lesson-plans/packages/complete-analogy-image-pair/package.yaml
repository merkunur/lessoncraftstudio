# Teaching package — complete analogies from image pairs
# Arc 17 Phase 1.1 (cognitive-and-executive-function / logical-reasoning strand
# SAT close: 4/5 → 5/5). Final canonical fill for the logic strand. Vocab-anchored
# relational-reasoning work: kids identify how a pair of images relate, then
# apply the same relation to complete a parallel pair.

targetSlug: complete-analogy-image-pair
language: en
title:
  en: "Complete the Analogy — image-pair relational reasoning"

description:
  en: "Kindergarten / Grade 1 logical-reasoning package teaching analogy completion via image pairs. Kids see a pair that share a relation (puppy↔dog as the young-and-grown pair; foot↔shoe as the body-part-and-its-cover pair) and complete a second pair using the same relation. Foundational relational-reasoning skill: the rule is the RELATION between the two items, not the items themselves. Builds on existing logical-reasoning packages (cause-and-effect + AB/AAB/ABB pattern work from Arc 7 + 8) by introducing analogy as a parallel-relation operation. SAT-CLOSING package: completes logical-reasoning strand at 5/5 canonical targets. Vocab-anchored — naming the relation (\"the puppy GROWS UP to be a dog\") reinforces vocabulary while exercising relational cognition. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class concrete-analogy hook. Teacher holds up a puppy
      picture and a dog picture. "These two are a pair — they go
      together. How are they related? The puppy GROWS UP to be the
      dog. Same animal, different age." Teacher then holds up a
      kitten picture. "Kitten goes with ... ?" Class predicts: cat.
      "Yes! Kitten grows up to be a cat — same relation as puppy and
      dog." Teacher introduces the analogy frame: "puppy is to dog
      AS kitten is to cat." Repeat with 2 more relation types:
      mother-baby (cow↔calf as sheep↔lamb), tool-action (broom↔sweep
      as fork↔eat). Pattern emphasis: "Find the RELATION in the
      first pair, then use the SAME RELATION for the second pair."

  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + analogy-card routine. Each pair receives 12
      analogy-card sets (4 cards per analogy: image A + image B
      that share a relation, plus image C + a choice of 3 image
      candidates for image D). Kid A reads the first pair aloud
      ("dog and bone"), then names the relation ("the dog eats the
      bone — animal and its food"). Kid B applies the same relation
      to the second pair ("cat and ... fish? milk? a ball?"). Class
      recasts errors with relation-explanation ("dog goes with bone
      because dogs eat bones; cat goes with FISH because cats eat
      fish — not with a ball. The relation is animal-and-its-food").
      Relations included: young-grown (puppy↔dog as kitten↔cat),
      animal-home (bird↔nest as bee↔hive), animal-baby (cow↔calf as
      sheep↔lamb), animal-food (dog↔bone as cat↔fish), tool-action
      (broom↔sweep as fork↔eat), object-cover (foot↔shoe as
      head↔hat).

  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (image-pair to
      relation-name matching: pair of images → relation card).
      Station 2: pattern-worksheet (complete the analogy from
      3 choice options; the puzzle frame is the parallel-relation
      task). Station 3: matching worksheet (relation variant — same
      mechanic, different relation types across the worksheet).
      Station 4: word-guess (kids guess the missing partner in a
      written analogy frame "puppy is to dog as kitten is to _ _ _").

  closure:
    durationMinutes: 5
    body: |
      Whole-class analogy circle. Teacher presents 5 incomplete
      analogies; class collectively completes each by naming the
      relation first. "Bird is to nest as bee is to ... ?" (HIVE,
      because that's where bees live, just like nests are where
      birds live). "Hand is to glove as foot is to ... ?" (SHOE,
      because gloves cover hands and shoes cover feet). Forward-
      pointer: "Today we completed analogies — we found the
      relation in one pair and used the same relation for another
      pair. When we come back to logic next, we'll work with
      cause-and-effect chains — what happens when one thing leads
      to another thing leads to another."

