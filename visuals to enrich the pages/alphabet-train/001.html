<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Alphabet Train - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #FFF8E1 0%, #FFE0B2 50%, #FFCC80 100%); overflow: hidden;">

        <!-- Railroad track pattern at bottom -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: #8D6E63;">
            <div style="position: absolute; top: 20px; left: 0; right: 0; height: 12px; background: repeating-linear-gradient(90deg, #5D4037 0px, #5D4037 60px, #8D6E63 60px, #8D6E63 80px);"></div>
            <div style="position: absolute; top: 50px; left: 0; right: 0; height: 8px; background: #4E342E;"></div>
            <div style="position: absolute; top: 70px; left: 0; right: 0; height: 8px; background: #4E342E;"></div>
            <!-- Railroad ties -->
            <div style="position: absolute; top: 40px; left: 0; right: 0; height: 50px; background: repeating-linear-gradient(90deg, #3E2723 0px, #3E2723 20px, transparent 20px, transparent 50px);"></div>
        </div>

        <!-- Decorative steam puffs -->
        <div style="position: absolute; top: 60px; left: 80px; width: 80px; height: 80px; background: rgba(255,255,255,0.7); border-radius: 50%; filter: blur(8px);"></div>
        <div style="position: absolute; top: 40px; left: 140px; width: 60px; height: 60px; background: rgba(255,255,255,0.6); border-radius: 50%; filter: blur(6px);"></div>
        <div style="position: absolute; top: 80px; left: 200px; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; filter: blur(5px);"></div>

        <!-- Decorative geometric shapes -->
        <div style="position: absolute; top: 150px; right: 60px; width: 40px; height: 40px; background: #26A69A; border-radius: 50%; opacity: 0.3;"></div>
        <div style="position: absolute; top: 200px; right: 120px; width: 25px; height: 25px; background: #FF9800; transform: rotate(45deg); opacity: 0.4;"></div>
        <div style="position: absolute; top: 700px; left: 50px; width: 30px; height: 30px; background: #E53935; border-radius: 50%; opacity: 0.3;"></div>

        <!-- FREE Badge - Train Ticket Style -->
        <div style="position: absolute; top: 30px; left: 30px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%); padding: 12px 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(255,152,0,0.4); transform: rotate(-5deg); position: relative;">
                <!-- Ticket punch holes -->
                <div style="position: absolute; left: -8px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; background: #FFF8E1; border-radius: 50%;"></div>
                <div style="position: absolute; right: -8px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; background: #FFF8E1; border-radius: 50%;"></div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); letter-spacing: 2px;">FREE</div>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 40px; right: 40px; background: #26A69A; padding: 10px 20px; border-radius: 25px; box-shadow: 0 3px 10px rgba(38,166,154,0.3);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 18px; color: white;">GRADES PreK-K</span>
        </div>

        <!-- Main Title Area -->
        <div style="position: absolute; top: 120px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #1A237E; margin: 0; text-shadow: 3px 3px 0 rgba(255,255,255,0.8); letter-spacing: -1px;">Alphabet Train</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 36px; color: #FF9800; margin: 5px 0 0 0; text-shadow: 2px 2px 0 rgba(255,255,255,0.8);">Worksheets</h2>
        </div>

        <!-- Worksheet Fan Display -->
        <div style="position: absolute; top: 260px; left: 50%; transform: translateX(-50%); width: 800px; height: 480px;">
            <!-- Back worksheets (landscape) -->
            <div style="position: absolute; left: 30px; top: 60px; transform: rotate(-12deg); box-shadow: 0 8px 30px rgba(0,0,0,0.2);">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/alphabet%20train/alphabet%20train%20landscape.jpeg" style="width: 280px; height: auto; border-radius: 8px; border: 4px solid white;">
            </div>

            <div style="position: absolute; right: 30px; top: 60px; transform: rotate(12deg); box-shadow: 0 8px 30px rgba(0,0,0,0.2);">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/alphabet%20train/Alphabet%20Train%2010.jpeg" style="width: 240px; height: auto; border-radius: 8px; border: 4px solid white;">
            </div>

            <!-- Front worksheets (portrait, larger) -->
            <div style="position: absolute; left: 140px; top: 20px; transform: rotate(-6deg); box-shadow: 0 10px 40px rgba(0,0,0,0.25); z-index: 10;">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/alphabet%20train/Alphabet%20Train%201.jpeg" style="width: 260px; height: auto; border-radius: 8px; border: 5px solid white;">
            </div>

            <div style="position: absolute; right: 140px; top: 20px; transform: rotate(6deg); box-shadow: 0 10px 40px rgba(0,0,0,0.25); z-index: 10;">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/alphabet%20train/Alphabet%20Train%205.jpeg" style="width: 260px; height: auto; border-radius: 8px; border: 5px solid white;">
            </div>
        </div>

        <!-- Orange Banner -->
        <div style="position: absolute; bottom: 140px; left: 0; right: 0; background: linear-gradient(90deg, #E65100 0%, #FF9800 50%, #E65100 100%); padding: 18px 0; box-shadow: 0 4px 20px rgba(230,81,0,0.4);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 34px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); letter-spacing: 3px;">🚂 ABC LEARNING EXPRESS 🚂</span>
            </div>
        </div>

        <!-- Feature Badges -->
        <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px;">
            <div style="background: white; padding: 12px 22px; border-radius: 25px; box-shadow: 0 3px 15px rgba(0,0,0,0.15); border: 3px solid #26A69A;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #26A69A;">✓ Answer Keys</span>
            </div>
            <div style="background: white; padding: 12px 22px; border-radius: 25px; box-shadow: 0 3px 15px rgba(0,0,0,0.15); border: 3px solid #FF9800;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #FF9800;">✂ Cut & Paste</span>
            </div>
            <div style="background: white; padding: 12px 22px; border-radius: 25px; box-shadow: 0 3px 15px rgba(0,0,0,0.15); border: 3px solid #E53935;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #E53935;">📄 Print Ready</span>
            </div>
        </div>

    </div>
</body>
</html>
