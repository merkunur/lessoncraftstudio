<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Word Search - Professional Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(145deg, #0C0A09 0%, #1C1917 50%, #0C0A09 100%);">

        <!-- Subtle grid pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image:
            linear-gradient(to right, #A855F7 1px, transparent 1px),
            linear-gradient(to bottom, #A855F7 1px, transparent 1px);
            background-size: 50px 50px;"></div>

        <!-- Purple corner brackets - top left -->
        <div style="position: absolute; top: 20px; left: 20px; width: 80px; height: 80px; border-left: 4px solid #A855F7; border-top: 4px solid #A855F7;"></div>
        <!-- Purple corner brackets - top right -->
        <div style="position: absolute; top: 20px; right: 20px; width: 80px; height: 80px; border-right: 4px solid #A855F7; border-top: 4px solid #A855F7;"></div>
        <!-- Purple corner brackets - bottom left -->
        <div style="position: absolute; bottom: 20px; left: 20px; width: 80px; height: 80px; border-left: 4px solid #A855F7; border-bottom: 4px solid #A855F7;"></div>
        <!-- Purple corner brackets - bottom right -->
        <div style="position: absolute; bottom: 20px; right: 20px; width: 80px; height: 80px; border-right: 4px solid #A855F7; border-bottom: 4px solid #A855F7;"></div>

        <!-- Premium Quality Seal - top center -->
        <div style="position: absolute; top: 28px; left: 50%; transform: translateX(-50%);">
            <div style="width: 125px; height: 125px; background: linear-gradient(145deg, #A855F7 0%, #7C3AED 50%, #A855F7 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(168,85,247,0.4), inset 0 2px 4px rgba(255,255,255,0.2); border: 4px solid #0C0A09;">
                <div style="width: 100px; height: 100px; background: #0C0A09; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #A855F7;">
                    <span style="font-size: 26px;">🏆</span>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 800; color: #A855F7; text-align: center; line-height: 1.1; letter-spacing: 1px;">PREMIUM<br>QUALITY</span>
                </div>
            </div>
        </div>

        <!-- FREE Badge - top left -->
        <div style="position: absolute; top: 38px; left: 50px; z-index: 20;">
            <div style="background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); padding: 10px 22px; border-radius: 25px; box-shadow: 0 4px 15px rgba(249,115,22,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: white;">FREE</span>
            </div>
        </div>

        <!-- Grade Badge - top right -->
        <div style="position: absolute; top: 43px; right: 50px; z-index: 20;">
            <div style="background: rgba(168,85,247,0.2); padding: 10px 20px; border-radius: 20px; border: 2px solid #A855F7;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; color: #A855F7; letter-spacing: 1px;">GRADES K-1</span>
            </div>
        </div>

        <!-- Product Title -->
        <div style="position: absolute; top: 165px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 15;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 50px; font-weight: 700; color: #FAFAF9; letter-spacing: 2px;">Word Search Generator</h1>
            <p style="margin: 6px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 20px; font-weight: 600; color: #A855F7; letter-spacing: 4px;">PICTURE PUZZLE WORKSHEETS</p>
        </div>

        <!-- Purple ambient glow behind center worksheet -->
        <div style="position: absolute; top: 340px; left: 50%; transform: translateX(-50%); width: 400px; height: 500px; background: radial-gradient(ellipse, rgba(168,85,247,0.25) 0%, transparent 70%); pointer-events: none;"></div>

        <!-- Decorative accent lines -->
        <div style="position: absolute; top: 240px; left: 50px; width: 60px; height: 2px; background: linear-gradient(90deg, transparent, #A855F7);"></div>
        <div style="position: absolute; top: 240px; right: 50px; width: 60px; height: 2px; background: linear-gradient(90deg, #A855F7, transparent);"></div>

        <!-- Center worksheet display (main focus) -->
        <div style="position: absolute; top: 270px; left: 50%; transform: translateX(-50%); z-index: 10;">
            <div style="width: 270px; height: 350px; background: white; border-radius: 10px; box-shadow: 0 15px 50px rgba(0,0,0,0.5), 0 0 60px rgba(168,85,247,0.3); overflow: hidden; border: 4px solid #A855F7;">
                <img src="https://www.lessoncraftstudio.com/samples/english/wordsearch/sample-8.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Professional Worksheet">
            </div>
        </div>

        <!-- Side preview - Answer Key (left) -->
        <div style="position: absolute; top: 320px; left: 75px; z-index: 5;">
            <div style="width: 185px; height: 240px; background: white; border-radius: 8px; box-shadow: 0 10px 35px rgba(0,0,0,0.4); overflow: hidden; border: 3px solid #57534E;">
                <img src="https://www.lessoncraftstudio.com/samples/english/wordsearch/sample-8-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Answer Key">
            </div>
            <div style="position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); background: #0D9488; padding: 5px 15px; border-radius: 12px;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; color: white;">ANSWER KEY</span>
            </div>
        </div>

        <!-- Side preview - Different theme (right) -->
        <div style="position: absolute; top: 320px; right: 75px; z-index: 5;">
            <div style="width: 185px; height: 240px; background: white; border-radius: 8px; box-shadow: 0 10px 35px rgba(0,0,0,0.4); overflow: hidden; border: 3px solid #57534E;">
                <img src="https://www.lessoncraftstudio.com/samples/english/wordsearch/sample-12.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Theme Variation">
            </div>
            <div style="position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); background: #7C3AED; padding: 5px 15px; border-radius: 12px;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; color: white;">WORKSHEET</span>
            </div>
        </div>

        <!-- Feature cards - frosted glass -->
        <div style="position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <!-- Card 1 - Print Ready -->
            <div style="background: rgba(255,255,255,0.07); backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(168,85,247,0.3); text-align: center; min-width: 145px;">
                <span style="font-size: 24px;">🖨️</span>
                <p style="margin: 6px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #FAFAF9; line-height: 1.2;">Print Ready<br><span style="color: #A855F7; font-size: 11px;">300 DPI</span></p>
            </div>
            <!-- Card 2 - Answer Keys -->
            <div style="background: rgba(255,255,255,0.07); backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(168,85,247,0.3); text-align: center; min-width: 145px;">
                <span style="font-size: 24px;">🔑</span>
                <p style="margin: 6px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #FAFAF9; line-height: 1.2;">Answer Keys<br><span style="color: #A855F7; font-size: 11px;">Included</span></p>
            </div>
            <!-- Card 3 - Grid Sizes -->
            <div style="background: rgba(255,255,255,0.07); backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(168,85,247,0.3); text-align: center; min-width: 145px;">
                <span style="font-size: 24px;">📐</span>
                <p style="margin: 6px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #FAFAF9; line-height: 1.2;">Grid Sizes<br><span style="color: #A855F7; font-size: 11px;">6x6 to 30x30</span></p>
            </div>
            <!-- Card 4 - Image Clues -->
            <div style="background: rgba(255,255,255,0.07); backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(168,85,247,0.3); text-align: center; min-width: 145px;">
                <span style="font-size: 24px;">🖼️</span>
                <p style="margin: 6px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #FAFAF9; line-height: 1.2;">Image Clues<br><span style="color: #A855F7; font-size: 11px;">Picture Based</span></p>
            </div>
        </div>

        <!-- Bottom purple gradient strip -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 55px; background: linear-gradient(90deg, #0C0A09 0%, #7C3AED 20%, #A855F7 50%, #7C3AED 80%, #0C0A09 100%); display: flex; align-items: center; justify-content: center;">
            <span style="font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 800; color: #0C0A09; letter-spacing: 5px;">TEACHER-READY QUALITY</span>
        </div>

    </div>
</body>
</html>
