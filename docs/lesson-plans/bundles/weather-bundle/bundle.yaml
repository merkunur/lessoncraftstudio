thematicCoherence:
  en: |
    All 3 packages cohere around weather + environment-and-weather
    strand. Pedagogical progression: foundational weather vocabulary
    (identify-and-name-weather-words: sun, cloud, rain, snow) →
    extended weather-type precision (identify-weather-types: light-
    rain vs storm; foggy vs misty) → seasonal classification (identify-
    four-seasons: which weather belongs to which season).

    **Strand spread:** 1 early-literacy/vocabulary-acquisition + 2
    world-knowledge/environment-and-weather. Strand-deep bundle with
    cross-strand bridge (vocabulary feeds environment-and-weather
    classification).

    **Suggested unit duration:** 3 weeks (1 package per week).
    Compact strand-focused bundle.

    **Daily-routine integration distinctive:** weather is uniquely
    suited to morning-circle routine because kids observe today's
    weather every day. Bundle supports daily-weather-chart practice
    across 3 packages — vocabulary + precision + seasonal context all
    activate in real classroom routine.

    **Multilingual classroom relevance:** weather vocabulary high-
    frequency K-3 target across all 11 platform locales. Pt-BR
    sparse-overrides (per Arc 10 Phase 3) handle regional climate
    variation (Sul: 4 distinct seasons; Norte/Nordeste: 2 functional
    seasons).
