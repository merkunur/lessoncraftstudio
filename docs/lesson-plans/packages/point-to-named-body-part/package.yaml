compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (RECEPTIVE — pointing to named
    body part, not naming the body part). Secondary strand: kinesthetic-
    learning (Total Physical Response: kids touch the body part as they
    hear the word, anchoring word-meaning in physical action).

    Architectural significance: this is the FIRST receptive variant in
    the catalog. Validates the productive↔receptive pairing pattern that
    will scale across the vocabulary-acquisition strand. Per §17.5.1
    receptive-vs-productive distinction: K-3 multilingual classroom kids
    understand vocabulary months before they can produce it; receptive
    targets pair with productive targets so package authors can choose
    the appropriate level.

    Distinctive composition vs productive identify-and-name-body-parts:
    no sentence-strips materials (sentence frames require productive
    language; receptive packages use picture-cards + matching activities).
    Two matching exercises (positions 1 + 3) emphasize image-to-word
    mapping (the receptive surface) rather than word-to-image production.
    The shadow-match at position 2 is a pure visual-discrimination layer
    that doesn't require any language production. find-and-count at
    position 4 reinforces vocabulary in count-context.

    Vocabulary-tracing-strips at material 5: included as a pre-writing-
    readiness layer. Receptive packages can include tracing as a hands-on
    pre-writing activity that reinforces vocabulary visually + motorically
    without demanding production. 6-key tracing-strips (subset of the 10
    body parts; smaller short-vowel/CVC pattern words selected for K-3
    handwriting).

    Cultural-variation acknowledgment: body-part vocabulary is universal
    across cultures; the 10-key set is age-appropriate (no anatomical
    nuance like "pelvis" or "torso"). Operator-side teachers can layer
    in body-care vocabulary (brush teeth, wash hands) as Grade-1+
    extension topics.

curriculumStandards:
