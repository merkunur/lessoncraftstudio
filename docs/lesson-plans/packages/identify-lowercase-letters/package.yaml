compositionalRationale:
  en: |
    Primary strand: early-literacy / letter-recognition (lowercase
    letter naming). Secondary strand: vocabulary acquisition (vocab-
    anchored). Tertiary strand: visual discrimination (lowercase b/d/p/q
    contrast — common K-3 confusion).

    Architectural significance: deepens letter-recognition strand from
    2/6 → 3/6 packages. RESOLVES Arc 10 identify-uppercase-letters
    forward-pointer. Lowercase letters are the primary reading-script
    in en + most platform locales; mastering lowercase recognition is
    the operational threshold for kid-readable text.

    Distinctive composition: lowercase-emphasis throughout —
    `letterCase: lowercase` set on flashcards + matching-mat +
    vocabulary-tracing-strips + word-guess. Mirrors Arc 10 identify-
    uppercase-letters structure but inverted case parameter throughout.
    matching at position 5 uses letter mode for assessment.

    Cross-strand integration: lowercase-recognition + vocabulary
    (vocab-anchored) + visual-discrimination (b/d mirror-image
    handling). Arc 9+10 letter-recognition foundation extends.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Universal substrate-readiness across vocab-rich themes.

    K-3 multilingual classroom relevance: lowercase letter recognition
    is target-language-specific. Locale-variant sparse-overrides handle
    locale-specific letter inventories (pt-BR ç, ã, é, õ; de ä, ö, ü,
    ß; etc.) per Phase 3 protocol.

curriculumStandards:
  - CCSS.K.RF.1.D
  - EYFS.ELG.LIT
  - IB-PYP.HowWeExpressOurselves

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 22 of 26 lowercase letters in random order in 8 of 10
        trials.
      - Distinguish b/d, p/q, m/n in 7 of 10 trials.
      - Match a vocabulary picture to its initial lowercase letter in
        8 of 10 trials.

    Differentiation:
    - Pre-K: 13 most-frequent lowercase letters (vowels + frequent
      consonants).
    - K: all 26 lowercase letters; b/d/p/q discrimination work.
    - Grade 1+: bridge to match-uppercase-lowercase (Arc 12+
      candidate); uppercase-lowercase pair recognition.

