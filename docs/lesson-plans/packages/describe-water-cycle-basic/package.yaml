# Teaching package — describe water cycle (basic)
# Arc 14 Phase 1 (science / environment-and-weather 3/4 → 4/4 SATURATE).
# Builds on Arc 12 describe-day-night-cycle pattern + identify-weather-types.

targetSlug: describe-water-cycle-basic
language: en
title:
  en: "Water Cycle — evaporation, clouds, rain, rivers"
description:
  en: "Kindergarten / Grade 1 science package teaching the basic water cycle (evaporation → condensation → precipitation → collection). Builds on Arc 12 describe-day-night-cycle pattern + identify-weather-types + identify-and-name-weather-words foundation. Saturating package for science / environment-and-weather strand at 4/4 — completes the environment-and-weather strand established earlier. Water cycle is the canonical K-3 weather-driver concept connecting daily weather observations to a continuous natural process. Kids learn the 4 stages with concrete anchors: evaporation (puddles disappear in sun) / condensation (clouds form) / precipitation (rain or snow falls) / collection (rivers, lakes, oceans). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + visual sequence introduction. Teacher displays
      4 large pictures arranged in a circle: sun-on-puddle (evaporation)
      / cloud-with-water-drops (condensation) / rain-falling
      (precipitation) / river-flowing-to-ocean (collection). "Water
      goes on a journey every day! Water rises up from puddles + rivers
      (evaporation). It forms clouds (condensation). It falls as rain
      (precipitation). It collects in rivers + oceans (collection).
      Then the cycle starts AGAIN!" Class chants the 4 stages. Visual
      circle reinforces cyclical nature.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sequencing routine. Each pair receives 4 picture
      cards (evaporation / condensation / precipitation / collection)
      shuffled. Pair arranges cards in correct cycle order in a
      circle. Teacher circulates; asks "What happens to the water in
      a puddle on a sunny day? What happens to water vapor when it
      gets cold high up in the sky? What falls when clouds get too
      heavy?" Pairs explain transitions with cause-effect language.
      Recast errors with re-ordering + visual reference to anchor
      pictures.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet sequencing
      4 stages. Station 2: matching worksheet (stage-name to picture).
      Station 3: missing-pieces worksheet (4-stage cycle with one
      stage missing — kid identifies which stage). Station 4:
      vocabulary-tracing-strips for stage names + weather vocabulary.
  closure:
    durationMinutes: 5
    body: |
      Whole-class water-cycle review. Teacher asks each student to
      describe one stage in 1-2 sentences. "Evaporation is when
      water goes UP." "Condensation is when water vapor makes
      clouds." "Precipitation is when rain falls down." "Collection
      is when water gathers in rivers." Forward-pointer: "Today we
      learned the water cycle. When we come back next, we can
      explore other natural cycles — the seasons cycle (spring,
      summer, fall, winter), the day-night cycle, OR even how
      plants and animals fit into all this water + weather!"

