<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Pr&auml;positionen - Versteckspiel Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(150deg, #7C4DFF 0%, #E040FB 50%, #FF4081 100%); overflow: hidden;">

        <!-- Radial burst from center -->
        <div style="position: absolute; top: 45%; left: 50%; width: 1100px; height: 1100px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.05) 30%, transparent 55%); border-radius: 50%;"></div>

        <!-- Sunburst rays -->
        <div style="position: absolute; top: 45%; left: 50%; width: 1200px; height: 1200px; transform: translate(-50%, -50%); opacity: 0.06;">
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(0deg); border-radius: 0 14px 14px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(30deg); border-radius: 0 14px 14px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(60deg); border-radius: 0 14px 14px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(90deg); border-radius: 0 14px 14px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(120deg); border-radius: 0 14px 14px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(150deg); border-radius: 0 14px 14px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(180deg); border-radius: 0 14px 14px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(210deg); border-radius: 0 14px 14px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(240deg); border-radius: 0 14px 14px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(270deg); border-radius: 0 14px 14px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(300deg); border-radius: 0 14px 14px 0;"></div>
            <div style="position: absolute; top: 50%; left: 50%; width: 600px; height: 28px; background: white; transform-origin: left center; transform: rotate(330deg); border-radius: 0 14px 14px 0;"></div>
        </div>

        <!-- Confetti - circles -->
        <div style="position: absolute; top: 50px; left: 170px; width: 16px; height: 16px; background: #FFD54F; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; top: 130px; left: 60px; width: 12px; height: 12px; background: #4DD0E1; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; top: 210px; right: 85px; width: 14px; height: 14px; background: #FFD54F; border-radius: 50%; opacity: 0.75;"></div>
        <div style="position: absolute; top: 85px; right: 190px; width: 10px; height: 10px; background: #69F0AE; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 210px; left: 95px; width: 13px; height: 13px; background: #FF8A80; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 270px; right: 75px; width: 11px; height: 11px; background: #B388FF; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; top: 340px; left: 40px; width: 9px; height: 9px; background: #FFFF8D; border-radius: 50%; opacity: 0.65;"></div>
        <div style="position: absolute; top: 490px; right: 50px; width: 15px; height: 15px; background: #84FFFF; border-radius: 50%; opacity: 0.6;"></div>
        <div style="position: absolute; top: 600px; left: 30px; width: 11px; height: 11px; background: #69F0AE; border-radius: 50%; opacity: 0.55;"></div>
        <div style="position: absolute; top: 160px; left: 800px; width: 10px; height: 10px; background: #FF80AB; border-radius: 50%; opacity: 0.6;"></div>
        <div style="position: absolute; bottom: 150px; left: 200px; width: 14px; height: 14px; background: #FFFF8D; border-radius: 50%; opacity: 0.5;"></div>

        <!-- Confetti - rectangles -->
        <div style="position: absolute; top: 170px; left: 130px; width: 18px; height: 8px; background: #69F0AE; border-radius: 3px; transform: rotate(35deg); opacity: 0.75;"></div>
        <div style="position: absolute; top: 95px; right: 115px; width: 16px; height: 7px; background: #FFD54F; border-radius: 3px; transform: rotate(-20deg); opacity: 0.7;"></div>
        <div style="position: absolute; top: 270px; left: 55px; width: 14px; height: 6px; background: #FF8A80; border-radius: 3px; transform: rotate(55deg); opacity: 0.65;"></div>
        <div style="position: absolute; top: 390px; right: 40px; width: 16px; height: 7px; background: #B388FF; border-radius: 3px; transform: rotate(-40deg); opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 240px; left: 50px; width: 15px; height: 6px; background: #84FFFF; border-radius: 3px; transform: rotate(25deg); opacity: 0.6;"></div>
        <div style="position: absolute; bottom: 190px; right: 95px; width: 17px; height: 7px; background: #FFFF8D; border-radius: 3px; transform: rotate(-30deg); opacity: 0.65;"></div>

        <!-- Sparkle stars -->
        <div style="position: absolute; top: 200px; left: 160px; font-size: 20px; color: white; opacity: 0.5;">&#10022;</div>
        <div style="position: absolute; top: 320px; right: 120px; font-size: 16px; color: #FFD54F; opacity: 0.6;">&#10022;</div>
        <div style="position: absolute; bottom: 300px; left: 140px; font-size: 14px; color: white; opacity: 0.4;">&#10022;</div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 22px; left: 26px; z-index: 100; transform: rotate(-5deg);">
            <div style="background: linear-gradient(145deg, #00E5FF, #00B8D4); padding: 10px 22px; border-radius: 26px; box-shadow: 0 6px 22px rgba(0,229,255,0.4); border: 3px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 1px;">GRATIS</span>
            </div>
        </div>

        <!-- Kinder lieben es! Badge -->
        <div style="position: absolute; top: 22px; right: 26px; z-index: 100; transform: rotate(5deg);">
            <div style="background: linear-gradient(145deg, #FF4081, #F50057); padding: 10px 18px; border-radius: 26px; box-shadow: 0 6px 22px rgba(245,0,87,0.4); border: 3px solid rgba(255,255,255,0.7); display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 18px;">&#10084;</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: white; letter-spacing: 0.5px;">Kinder lieben es!</span>
            </div>
        </div>

        <!-- Title - Comic burst -->
        <div style="position: absolute; top: 65px; left: 50%; transform: translateX(-50%); z-index: 40;">
            <div style="background: white; border-radius: 50% 50% 50% 50% / 42% 42% 58% 58%; padding: 18px 55px 24px 55px; box-shadow: 0 8px 35px rgba(0,0,0,0.15); border: 5px solid #FFD54F; text-align: center;">
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; color: #7C4DFF; margin-bottom: 0; letter-spacing: 2px;">WO IST</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 68px; line-height: 1; letter-spacing: 2px;">
                    <span style="color: #E040FB;">D</span><span style="color: #FF4081;">I</span><span style="color: #FFB300;">E</span>
                    <span style="color: #7C4DFF;">K</span><span style="color: #00E5FF;">A</span><span style="color: #FF4081;">T</span><span style="color: #69F0AE;">Z</span><span style="color: #FFB300;">E</span><span style="color: #E040FB;">?!</span>
                </div>
            </div>
        </div>

        <!-- Floating preposition pills -->
        <!-- AUF - cyan, above worksheet -->
        <div style="position: absolute; top: 290px; left: 50%; transform: translateX(-50%) translateX(-160px); z-index: 55;">
            <div style="background: linear-gradient(145deg, #00E5FF, #00B8D4); padding: 10px 24px; border-radius: 24px; box-shadow: 0 5px 18px rgba(0,229,255,0.4); border: 3px solid rgba(255,255,255,0.6);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; letter-spacing: 1px;">AUF</span>
            </div>
        </div>

        <!-- UNTER - pink, below worksheet -->
        <div style="position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%) translateX(140px); z-index: 55;">
            <div style="background: linear-gradient(145deg, #FF4081, #F50057); padding: 10px 24px; border-radius: 24px; box-shadow: 0 5px 18px rgba(245,0,87,0.4); border: 3px solid rgba(255,255,255,0.6);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; letter-spacing: 1px;">UNTER</span>
            </div>
        </div>

        <!-- IN - yellow, left side -->
        <div style="position: absolute; top: 460px; left: 55px; z-index: 55;">
            <div style="background: linear-gradient(145deg, #FDD835, #F9A825); padding: 10px 28px; border-radius: 24px; box-shadow: 0 5px 18px rgba(249,168,37,0.4); border: 3px solid rgba(255,255,255,0.6);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #3E2723; letter-spacing: 1px;">IN</span>
            </div>
        </div>

        <!-- VOR - mint, right side -->
        <div style="position: absolute; top: 420px; right: 55px; z-index: 55;">
            <div style="background: linear-gradient(145deg, #69F0AE, #00C853); padding: 10px 24px; border-radius: 24px; box-shadow: 0 5px 18px rgba(105,240,174,0.4); border: 3px solid rgba(255,255,255,0.6);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #1B5E20; letter-spacing: 1px;">VOR</span>
            </div>
        </div>

        <!-- Main worksheet (big, center) -->
        <div style="position: absolute; top: 320px; left: 50%; transform: translateX(-50%); z-index: 30;">
            <img src="https://www.lessoncraftstudio.com/samples/german/prepositions/sample-1.jpeg" style="width: 280px; height: 363px; object-fit: cover; border-radius: 14px; border: 7px solid white; box-shadow: 0 20px 55px rgba(0,0,0,0.35), 0 0 40px rgba(124,77,255,0.15);">
        </div>

        <!-- Speech bubble - left -->
        <div style="position: absolute; top: 370px; left: 50px; z-index: 35;">
            <div style="background: white; border-radius: 20px; padding: 12px 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #7C4DFF; position: relative; max-width: 165px;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; color: #7C4DFF;">Ich bin <strong>AUF</strong> dem Tisch!</span>
                <!-- Speech tail -->
                <div style="position: absolute; bottom: -12px; right: 20px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 14px solid white;"></div>
                <div style="position: absolute; bottom: -16px; right: 19px; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 15px solid #7C4DFF; z-index: -1;"></div>
            </div>
        </div>

        <!-- Speech bubble - right -->
        <div style="position: absolute; top: 530px; right: 50px; z-index: 35;">
            <div style="background: white; border-radius: 20px; padding: 12px 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #FF4081; position: relative; max-width: 175px;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; color: #FF4081;">Ich sitze <strong>UNTER</strong> dem Stuhl!</span>
                <!-- Speech tail -->
                <div style="position: absolute; bottom: -12px; left: 20px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 14px solid white;"></div>
                <div style="position: absolute; bottom: -16px; left: 19px; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 15px solid #FF4081; z-index: -1;"></div>
            </div>
        </div>

        <!-- WO? burst badge (bottom-right) -->
        <div style="position: absolute; bottom: 155px; right: 60px; z-index: 50; transform: rotate(8deg);">
            <div style="width: 80px; height: 80px; background: linear-gradient(145deg, #FDD835, #FFB300); border-radius: 50%; box-shadow: 0 6px 22px rgba(255,179,0,0.5), 0 0 0 4px rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: #3E2723; text-shadow: 0 1px 2px rgba(255,255,255,0.3);">WO?</span>
            </div>
        </div>

        <!-- Bottom fade to white + pills -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.95) 50%); z-index: 40;">
            <div style="position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px;">
                <div style="background: linear-gradient(145deg, #7C4DFF, #651FFF); padding: 12px 24px; border-radius: 28px; box-shadow: 0 5px 18px rgba(124,77,255,0.4); border: 3px solid rgba(255,255,255,0.5);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: white;">Pr&auml;positionen spielend lernen!</span>
                </div>
                <div style="background: linear-gradient(145deg, #FF4081, #F50057); padding: 12px 24px; border-radius: 28px; box-shadow: 0 5px 18px rgba(245,0,87,0.35); border: 3px solid rgba(255,255,255,0.5);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: white;">Vorschule &amp; Klasse 1-2</span>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
