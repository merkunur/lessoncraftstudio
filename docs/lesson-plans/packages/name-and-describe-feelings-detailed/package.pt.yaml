# Teaching package — nomear e descrever sentimentos complexos com vocabulário detalhado (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 16 Phase 1.2; 13th consecutive arc continuation).
# pt sparse-override for science / personal-social-emotional-development strand.
# Conteúdo socioemocional culturalmente sensível — adaptação cuidadosa, não
# tradução-direta-literal. BR-MEC educação infantil + ensino fundamental anos
# iniciais register per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Nomeando Sentimentos Complexos — frustrado, ansioso, orgulhoso, envergonhado, com ciúmes"

description:
  pt: "Pacote socioemocional para educação infantil / 1º ano que estende o trabalho de vocabulário-de-emoções para emoções COMPLEXAS além das 4 básicas (feliz/triste/com-raiva/com-medo). EXPLICITAMENTE DISTINTO do express-feelings-with-words existente (Arc 8-12) que ensina RECONHECER + NOMEAR + EXPRESSAR para emoções básicas: este pacote ensina crianças a NOMEAR + DESCREVER emoções COMPLEXAS — frustrado (quando algo não funciona apesar de tentar), ansioso (preocupado com o futuro), orgulhoso (sentir-se grande após realização), envergonhado (quando outros notaram um erro), com ciúmes (desejando o que outros têm), surpreso (evento inesperado), curioso (querendo saber mais), decepcionado (quando expectativa não se cumpre), entediado (esperando muito tempo sem nada para fazer), animado (esperando algo bom). Passo desenvolvimental crítico do reconhecimento BÁSICO de emoções (feliz/triste/com-raiva/com-medo) para vocabulário-NUANCEADO-de-emoções que capacita crianças a articularem estados internos complexos. Base para trabalho de autorregulação + empatia + resolução-de-conflito (candidatos para Arc 17+). Fio PSED: 3/6 → 4/6 no fechamento desta Fase 1.2. 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Iniciador com toda a turma + introdução de emoções
      complexas. A professora ou o professor revisa as 4 emoções
      básicas: "Sabemos FELIZ, TRISTE, COM RAIVA, COM MEDO. Hoje
      aprendemos MAIS palavras-sentimento." A professora
      introduz FRUSTRADO via cenário concreto: "Imagine que você
      tenta amarrar os sapatos, e os cadarços não ficam amarrados
      por mais que você tente. Aquele sentimento pegajoso +
      irritante quando algo não funciona embora você tenha
      tentado — esse sentimento é FRUSTRADO. É um tipo de COM
      RAIVA misturado com CANSADO." A turma repete a palavra; a
      professora exibe uma imagem de um rosto frustrado. A
      professora introduz mais 3 emoções similarmente: ANSIOSO
      (cenário: preocupado com uma prova amanhã), ORGULHOSO
      (cenário: completou um quebra-cabeça difícil), e
      ENVERGONHADO (cenário: tropeçou na frente de amigos).
      Ênfase do padrão: "Cada sentimento complexo tem uma
      HISTÓRIA — uma situação onde você o sentiria. Histórias
      ajudam a lembrar das palavras."
  contentActivity:
    body: |
      Trabalho em duplas + rotina com cartões de vocabulário-
      de-emoção. Cada dupla recebe 12 cartões de vocabulário-
      de-emoção (rostos + rótulos-palavra para: frustrado,
      ansioso, orgulhoso, envergonhado, com-ciúmes, surpreso,
      curioso, decepcionado, entediado, animado, mais 2 cartões
      de revisão de emoção-básica feliz + com-raiva). Dupla
      alterna: criança A lê um cartão-cenário (10 cenários
      fornecidos: "Você trabalhou em uma torre de blocos por
      muito tempo + ela ficou caindo" / "Você esperou muito
      tempo para sua vez no balanço" / "Você aprendeu algo novo
      sobre dinossauros" / "Seu amigo ganhou um brinquedo que
      você queria muito" / etc.). Juntas escolhem o cartão de
      vocabulário-de-emoção que combina. Refraseie erros com
      demonstração-de-âncora-narrativa ("esperar muito tempo
      sem nada divertido para fazer — isso é ENTEDIADO.
      Entediado é quando você gostaria que algo interessante
      acontecesse."). NENHUMA PRESSÃO para usar rótulos
      complexos específicos — crianças que dizem "cansado" em
      vez de "frustrado" são ouvidas + gentilmente introduzidas
      à palavra-mais-precisa.
  scaffold:
    body: |
      Rotação de estações. Estação 1: picture-sort (rostos-de-
      emoção agrupados por categoria-de-emoção: rosto "família-
      feliz" vs rosto "família-ansiosa" vs rosto "família-
      orgulhosa"). Estação 2: folha de exercícios matching
      (pares cenário-para-emoção). Estação 3: math-worksheet
      (exercício de contar-frequência: quantos sentimentos
      diferentes você teve hoje? Marca-de-contagem). Estação
      4: atividade com manipulativo cortável (use ícones-de-
      emoção cortados para construir um rastreador "dia-de-
      sentimentos" — mostre o que você sentiu esta manhã + no
      almoço + durante o recreio). Vocabulário pt-BR canônico
      para emoções complexas: frustrado / ansioso / orgulhoso /
      envergonhado / com-ciúmes / surpreso / curioso / decepcionado
      / entediado / animado. Sensibilidade cultural pt-BR: no
      contexto brasileiro, "orgulhoso" pode carregar conotação
      negativa de arrogância em certos registros — uso K-3
      enfatiza orgulho-de-realização-pessoal, distinto de orgulho-
      arrogante.
  closure:
    body: |
      Fechamento de vocabulário-de-emoção com toda a turma. A
      professora ou o professor nomeia cenários; turma
      coletivamente escolhe a emoção: "Você aprendeu um jogo
      novo + mal pode esperar para jogar de novo!" (turma:
      ANIMADO!) "Sua vez no escorregador continuou sendo
      tirada por crianças maiores!" (FRUSTRADO!) "Você terminou
      de ler um livro com capítulos sozinho!" (ORGULHOSO!)
      Indicador adiante: "Hoje aprendemos palavras-sentimento
      grandes. Quando voltarmos na próxima vez, aprenderemos o
      que FAZER com esses sentimentos — estratégias para se
      sentir mais calmo quando frustrado ou ansioso, e formas
      de compartilhar sentimentos orgulhosos + animados com
      outros (fio REGULAR EMOÇÕES)."

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Combinar 8 de 10 emoções complexas com prompts-de-cenário
        apropriados.
      - Usar pelo menos 3 palavras-emoção complexas produtivamente
        (dizendo "Eu sinto ___") em 5 de 10 tentativas de conversa.
      - Distinguir emoções complexas das 4 básicas (e.g., "isso é
        FRUSTRADO, não apenas COM RAIVA — frustrado tem a parte
        de tentar-e-falhar") em 4 de 6 tentativas.
      - Identificar agrupamentos-família-de-emoção (cluster-feliz
        vs cluster-triste vs cluster-com-raiva vs cluster-com-
        medo) com precisão em 5 de 8 tentativas de picture-sort.

    Diferenciação:
      - Pré-K (3-5 anos): foco nas 4 emoções básicas; introduzir
        apenas 2-3 emoções complexas (orgulhoso + animado +
        frustrado como mais-acessíveis).
      - Educação infantil (5-7 anos): vocabulário completo de
        10 emoções; âncora-de-cenário enfatizada; pressão de
        linguagem-produtiva baixa (reconhecimento primeiro,
        expressão conforme emerge).
      - 1º ano: vocabulário completo + meta de linguagem-
        produtiva; agrupamentos-família-de-emoção introduzidos.
      - 2º ano em diante: estender para 15-20 palavras-emoção;
        introduzir emoções-mistas ("Eu sinto orgulhoso E
        envergonhado ao mesmo tempo") + trabalho de contexto-
        emocional-dos-outros (fio empatia).

compositionalRationale:
  pt: |
    Fio principal: ciências / desenvolvimento-pessoal-social-
    emocional (expansão de vocabulário-de-emoção-complexa;
    aprofunda fio PSED 3/6 → 4/6). Fio secundário: alfabetização
    inicial / aquisição-de-vocabulário (10 novas palavras-de-
    emoção-vocabulário adicionadas por pacote). Fio terciário:
    cognição-e-função-executiva / autoconsciência (combinação
    cenário-emoção constrói consciência-metacognitiva de estados
    internos).

    Significância arquitetural: estende Arc 8-12 express-feelings-
    with-words (4 emoções básicas: feliz/triste/com-raiva/com-
    medo) para território de EMOÇÃO-COMPLEXA (10 novas palavras-
    vocabulário cobrindo frustrado/ansioso/orgulhoso/envergonhado/
    com-ciúmes/surpreso/curioso/decepcionado/entediado/animado).
    EXPLICITAMENTE DISTINTO de express-feelings-with-words —
    aquele pacote ensina BÁSICO reconhecer + nomear + expressar-
    verbalmente; este pacote ensina VOCABULÁRIO NUANCEADO para
    emoções complexas que crianças sentem diariamente mas
    frequentemente não conseguem articular. Base para regulate-
    emotions-with-strategies (Arc 15; já enviado) + show-empathy-
    toward-others (Arc 15; já enviado) — crianças com vocabulário-
    de-emoção mais rico regulam + empatizam melhor. Avanço de
    fio PSED: 3/6 → 4/6 no fechamento desta Fase 1.2.

    Especificidade pt-BR: vocabulário-de-emoção-complexa varia
    significativamente através de locales + culturas — alguns
    locales têm palavras-cognato direto ("frustrado" → de
    "frustriert" / en "frustrated"); outros têm conceitos-de-
    emoção culturalmente-específicos. Particular pt-BR:
    - **"saudade"** — emoção pt-BR-canônica sem cognato direto
      em inglês; combinação de nostalgia + desejo + amor-pela-
      ausência. Pode ser introduzida em extensões pt-BR-locais
      para 2º ano + (esta versão Phase 1.2 foca nas 10 emoções
      mais-universalmente-aplicáveis primeiro).
    - **"orgulhoso"** — conotação dupla: orgulho-saudável-de-
      realização (uso K-3-canônico) vs orgulho-arrogante (uso
      adulto). Pacote enfatiza orgulho-de-realização.
    - **"com ciúmes"** vs **"com inveja"** — pt-BR distingue
      ciúme (sentimento sobre possessão de uma pessoa querida)
      vs inveja (sentimento sobre coisas que outros têm); pacote
      usa "com ciúmes" no sentido inveja-K-3 (desejando o que
      outros têm) per registro mais-natural-em-sala-de-aula.
    - **"animado"** — pt-BR-canônico para excited; mais frequente
      em registro K-3 que "empolgado" (mais adulto).

    Sensibilidade cultural pt-BR preservada: NENHUM julgamento
    sobre sentimentos "certos" ou "errados"; todos os sentimentos
    são normais + podem ser nomeados. Registro brasileiro
    enfatiza valorização-de-expressão-emocional + acolhimento
    afetivo (em contraste com registros culturalmente-mais-
    reservados de algumas tradições europeias).

    Currículo BNCC EF02ER01 + EF02ER02 (ensino religioso opcional)
    + BNCC competências socioemocionais transversais (autoconhecimento
    + autorregulação): vocabulário-de-emoções como base para
    autorregulação + empatia. BNCC integra socioemocional ao
    currículo via competências gerais.

    Substrato Class B FLEXIBLE: composta contra tema emotions
    (tema canônico para trabalho SEL; biblioteca-de-imagens-de-
    rosto cobre as 14+ expressões-de-emoção surfadas neste
    pacote).
