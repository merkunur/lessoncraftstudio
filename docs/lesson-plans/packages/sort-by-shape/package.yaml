assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Sort 8-10 mixed objects by their dominant 2D shape into 4 shape
        categories with 75%+ accuracy.
      - Identify the dominant 2D shape of an object when shown the object
        in 7 of 10 trials.
      - Use shape-vocabulary (circle / square / triangle / rectangle)
        spontaneously when sorting.

    Differentiation:
    - Pre-K: 2-shape sorting only (circle vs square; triangle vs rectangle).
    - K: 4-basic-shape sorting; mixed-object substrate.
    - Grade 1+: extend to 8-shape sorting (with extended shapes from
      identify-2d-shapes-extended Phase 3) + sort-by-multiple-attributes
      (sort by shape AND color simultaneously).

