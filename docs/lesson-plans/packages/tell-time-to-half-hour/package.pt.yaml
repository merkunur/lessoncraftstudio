# Teaching package — dizer as horas e meia (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT per Arc 7 Phase 3 + Arc 3 Phase 1 sparse-override pattern.
# Arc 17 Phase 1.4 pt-cadence continuation (17th consecutive arc).
# pt sparse-override for math / measurement strand. Conteúdo matemático
# universal — adaptação locale-específica para expressão idiomática de tempo em pt-BR.
# BR-MEC ensino fundamental anos iniciais register per CLAUDE.md §6 + formal "você"
# address per §17.9.

title:
  pt: "Dizer as Horas e Meia — quando o ponteiro dos minutos aponta para baixo"

description:
  pt: "Pacote de matemática/medida para 1º ano estendendo tell-time-to-the-hour (Slot 1 da Phase 1.4) para leitura de meia-hora em relógios analógicos. Na meia-hora, o ponteiro dos minutos aponta direto para BAIXO no 6 (em vez de direto para cima no 12 na hora). O ponteiro das horas fica ENTRE a hora anterior e a próxima hora — 3:30 tem o ponteiro das horas a meio caminho entre 3 e 4. Faz ponte de leitura de hora-em-ponto para leitura de tempo totalmente quantitativa. Âncora CCSS.1.MD.B.3 (o mesmo padrão cobre leitura de hora + meia-hora; per learning-targets.json `tell-time-to-half-hour` é um alvo canônico distinto). Paralelo a Arc 15 Phase 1 read-time-on-analog-clock pela mesma distinção de enquadramento fio-de-medida vs fio-de-time-and-routine documentada em tell-time-to-the-hour (Slot 1). Junto com tell-time-to-the-hour, este pacote completa o par canônico de fio-de-medida tell-time (2 de 3 alvos canônicos tell-time enviados; tell-time-to-quarter-hour diferido para Phase 1.5+). 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Iniciador com toda a turma + introdução da posição de
      meia-hora. A professora ou o professor exibe um
      relógio analógico grande + revisa o trabalho de hora-
      em-ponto de ontem: "Lembrem quando o ponteiro dos
      minutos aponta direto PARA CIMA no 12, o tempo é
      exatamente a hora — três horas, cinco horas." Depois
      o conteúdo novo: "Hoje aprendemos o que acontece
      quando 30 MINUTOS passaram desde a hora. Estamos NO
      MEIO da hora. O ponteiro dos minutos se moveu do 12
      até ali, apontando direto PARA BAIXO no 6. Chamamos
      isso de E MEIA." Demonstra 3:30 (ponteiro das horas
      entre 3 e 4; ponteiro dos minutos apontando direto
      para baixo no 6); 7:30 (ponteiro das horas entre 7 e
      8; ponteiro dos minutos no 6); 11:30 (ponteiro das
      horas entre 11 e 12; ponteiro dos minutos no 6).
      Ênfase do padrão: "Na hora E MEIA, o ponteiro LONGO
      aponta DIRETO PARA BAIXO no 6. O ponteiro CURTO fica
      ENTRE dois números de hora — entre 3 e 4 significa
      três e meia. O ponteiro das horas já PASSOU do 3 mas
      ainda não chegou no 4, porque ainda estamos no tempo
      de três-e-alguma-coisa." Escreve formas digitais:
      3:30, 7:30, 11:30.
  contentActivity:
    body: |
      Trabalho em duplas + rotina de leitura-de-relógio de
      meia-hora com relógios de papel de ponteiros móveis.
      Cada dupla recebe o mesmo material clock-mat de
      ponteiros móveis do Slot 1 + um conjunto de 8 cartas
      de meia-hora (2:30, 5:30, 8:30, 11:30, 1:30, 4:30,
      7:30, 10:30). Dupla alterna: criança A puxa uma
      carta de meia-hora (e.g., 5:30); criança B coloca o
      relógio de papel — ponteiro dos minutos direto para
      baixo no 6, ponteiro das horas ENTRE 5 e 6. Criança
      A verifica a colocação, especialmente checando a
      posição-entre do ponteiro das horas. Depois trocam.
      Refraseie erros com pista entre-os-ponteiros ("5:30:
      o ponteiro das horas não está NO 5, não está NO 6 —
      está ENTRE 5 e 6. O ponteiro dos minutos se moveu a
      meio caminho ao redor, então o ponteiro das horas
      também se moveu a meio caminho entre as horas."). A
      posição entre-as-horas do ponteiro das horas é a
      percepção visual load-bearing que distingue leitura
      de meia-hora de leitura de hora — crianças que pensam
      que o ponteiro das horas fica exatamente no número
      nomeado vão errar a leitura de meia-hora. Vocabulário
      pt-BR canônico: e meia / meia-hora; trinta minutos;
      entre as horas; metade da hora; halfway-through.
      "Cinco e meia" e "5:30" são as duas formas pt-BR K-3
      canônicas; "meia-hora" é o termo para a quantidade
      de tempo (não a hora-do-dia).
  scaffold:
    body: |
      Rotação de estações. Estação 1: atividade matching —
      combine cada face de relógio analógico (desenhada em
      posições de meia-hora) à sua hora digital (1:30,
      2:30, ... 12:30). Estação 2: atividade chart-count
      — conte através de posições de hora E meia-hora em
      sequência (1:00, 1:30, 2:00, 2:30, 3:00, 3:30...).
      Estação 3: math-puzzle (coloque o relógio em uma
      hora de meia-hora dada: prompt de elemento-faltante).
      Estação 4: matching misto hora-e-meia-hora (as
      crianças devem distinguir entre hora-em-ponto e
      hora-e-meia com base na posição do ponteiro dos
      minutos).
  closure:
    body: |
      Recuperação rápida de meia-hora com toda a turma. A
      professora ou o professor exibe 6 faces de relógio
      (mistura de hora-em-ponto + e-meia); a turma lê
      cada uma coletivamente. "Três horas! Quatro e meia!
      Oito horas! Onze e meia! Uma e meia! Doze horas!"
      Indicador adiante: "Hoje lemos horas de meia-hora —
      quando o ponteiro dos minutos aponta direto PARA
      BAIXO no 6. Junto com a leitura de hora de ontem,
      agora lemos tanto horas EXATAS quanto horas E MEIA.
      A seguir conheceremos leitura de QUARTO-DE-HORA —
      quando o ponteiro dos minutos aponta para 3 ou 9
      (15 minutos passados ou quinze-para-a-próxima-hora)
      — e eventualmente leremos A-CADA-5-MINUTOS, AM vs
      PM, e TEMPO-DECORRIDO (quantas horas entre dois
      tempos). A medição de tempo fica cada vez mais
      precisa."

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Ler 8 faces de relógio analógico mostrando horas
        de meia-hora corretamente em 7 de 10 tentativas.
      - Distinguir hora-em-ponto de hora-e-meia com base
        na posição do ponteiro dos minutos (12 vs 6) em
        8 de 10 tentativas.
      - Identificar a posição ENTRE-AS-HORAS do ponteiro
        das horas em horas e meia (e.g., às 5:30 o ponteiro
        das horas fica entre 5 e 6, não em nenhum dos dois)
        em 6 de 10 tentativas.
      - Colocar o relógio de papel de ponteiros móveis em
        uma hora de meia-hora dada em 6 de 10 tentativas.
      - Usar vocabulário 'e meia' / 'metade da hora' /
        'trinta' corretamente em 6 de 10 tentativas de
        linguagem produtiva.

    Diferenciação:
      - Pré-K (3-5 anos): pular leitura de meia-hora
        inteiramente; revisar dias-da-semana + meses-do-ano
        + leitura de hora-em-ponto (via Slot 1) primeiro.
      - Educação infantil (5-7 anos): leitura de hora-em-
        ponto (Slot 1) é suficiente para a educação
        infantil; diferir e-meia para o 1º ano.
      - 1º ano: leitura completa de meia-hora; trabalho
        com ponteiros móveis fortemente apoiado; a posição
        do ponteiro-das-horas-entre-as-horas recebe
        atenção explícita.
      - 2º ano em diante: estender para tell-time-to-
        quarter-hour (candidato Phase 1.5+) + dizer-tempo-
        a-cinco-minutos + distinção AM/PM + formato de
        relógio digital + problemas de tempo-decorrido.

compositionalRationale:
  pt: |
    Fio principal: matemática / medida (dizer as horas e
    meia em um relógio analógico — completa par canônico
    tell-time dentro do fio de medida). Fio secundário:
    matemática / time-and-routine (enquadramento paralelo
    — ver referência cruzada abaixo). Fio terciário:
    aquisição-de-vocabulário (e meia, no meio, entre).

    Significância arquitetural: completa o par canônico
    tell-time de fio-de-medida aberto por tell-time-to-
    the-hour (Slot 1). Per learning-targets.json `tell-
    time-to-half-hour` é um alvo canônico distinto com
    `tell-time-to-the-hour` como pré-requisito. Os dois
    pacotes juntos cobrem 2 de 3 alvos canônicos tell-time
    (tell-time-to-quarter-hour, CCSS.2.MD.C.7, é o 3º;
    diferido para Phase 1.5+).

    Referência cruzada a read-time-on-analog-clock (Arc 15
    Phase 1) e a tell-time-to-the-hour (Slot 1): mesmo
    enquadramento do Slot 1 — o pacote existente read-
    time-on-analog-clock satura o fio cognitive-and-
    executive-function / time-and-routine E cobre hora +
    meia-hora pedagogicamente; o par tell-time da Phase
    1.4 coexiste como enquadramento paralelo de fio-de-
    medida. Ver compositionalRationale do Slot 1 para a
    documentação completa da distinção-de-enquadramento;
    este pacote herda aquela distinção.

    Par-parceiro: tell-time-to-the-hour (Slot 1 da Phase
    1.4). Compartilha infraestrutura de material (clock-
    mat, modo clock-pieces, labelDisplay time-format),
    compartilha forma de composição, difere apenas no
    conteúdo-de-tempo (horas de meia-hora em vez de
    horas-em-ponto-apenas). A estrutura pair-coherent
    espelha o par Phase 1.2 add-2-digit + subtract-2-
    digit e o par-irmão Phase 1.3 decompose-tens-and-ones
    + identify-tens-and-ones — o trabalho de fio-de-
    medida segue o mesmo padrão de envio pair-coherent.

    Especificidade pt-BR: e meia é conceito universal +
    traduzível 1:1 do en em termos pedagógicos, mas o
    IDIOMA verbal varia entre locales. Vocabulário pt-BR
    canônico:
    - **"e meia"** — forma K-3 canônica para o conceito
      en 'half-past'; "três e meia" = "half-past three" =
      3:30; "cinco e meia" = 5:30. Em pt-BR usamos a
      hora-anterior (igual a en, espanhol, francês);
      diferente de de/fi que usam a hora-próxima.
    - **"meia-hora"** — termo para a quantidade de tempo
      (não a hora-do-dia); "uma meia-hora" = "30 minutes
      / a half hour".
    - **"trinta minutos"** — forma exata; "três horas e
      trinta minutos" é a forma estendida; "três e meia"
      é a forma coloquial K-3 padrão.
    - **"ponteiro dos minutos para baixo"** — descrição
      visual K-3 da posição do ponteiro longo em meia-
      hora.

    Em pt-BR como em en/es/fr, e-meia usa a HORA-ANTERIOR
    como referência: "três e meia" = 3:30. Esta convenção
    coincide com a maioria dos locales latinos +
    germânicos do oeste — apenas alemão e finlandês usam
    a hora-PRÓXIMA ("halb vier" em alemão = 3:30, não
    4:30; "puoli neljä" em finlandês = 3:30). Esta
    diferença torna o trabalho cross-locale uma adaptação
    notável no Phase 3+ para de + fi.

    Currículo BNCC EF02MA18 (2º ano) + EF02MA19 (2º ano):
    indicar o instante de início e de término de uma
    atividade; medir e comparar duração de eventos
    utilizando unidade convencional (hora, minuto, segundo);
    reconhecer hora e meia hora.

    Substrato Class B FLEXIBLE: composta contra tema
    miscellaneous (pair-coherent com Slot 1).
