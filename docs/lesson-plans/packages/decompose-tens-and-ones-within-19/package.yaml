compositionalRationale:
  en: |
    Primary strand: math / place-value (decompose teen numbers
    as 10 + n — first canonical fill in the place-value strand;
    0/3 → 1/3 canonical). Secondary strand: counting-and-
    cardinality (teen-number recognition + counting-with-
    bundling). Tertiary strand: number-word vocabulary
    (English teen-number names partially hide the place-value
    structure that other locales expose more clearly; this
    package surfaces the structure regardless of locale).

    Architectural significance: opens the math/place-value
    canonical strand. K-foundational place-value insight that
    grounds all later multi-digit work. Specifically named as
    a prerequisite for Phase 1.2 add-2-digit-without-regrouping
    + subtract-2-digit-without-regrouping in learning-targets.json
    (the column-addition + column-subtraction routines assume
    kids know what tens-and-ones means; this package builds
    that foundational understanding at the K range first).
    Sibling pair with identify-tens-and-ones-2-digit (same
    arc phase) — that package extends the same decomposition
    idea from teen-number scope (10-19) to full 2-digit scope
    (20-99); together they form the K → Grade 1 place-value
    introduction sequence.

    Distinctive composition: 2 matching (intro + assessment,
    bookending the teen-numeral-to-decomposition pairing work)
    + 1 chart-count (10-frame visual reinforcement) + 1 math-
    puzzle decomposition + 1 pattern-train (teen sequence
    showing the incremental ones structure). The matching
    work is load-bearing — pairing each teen numeral with
    its 10+n decomposition is the core conceptual move kids
    practice. The pattern-train at consolidation surfaces
    the within-teens sequence (10, 11, 12... 19) showing
    that the ten stays constant while the ones increment by
    one each step — the dynamic version of the static
    decomposition.

    Materials note: place-value-mat is the canonical place-
    value enactment surface (it appears at position 3 in
    Arc 15 tens-and-ones-1-to-20 + Arc 16 add-within-100 /
    subtract-within-100). Per Arc 17 Phase 0 §8 (C) DEFER,
    the place-value-mat generator authoring is queued to
    Pillar 5. In this package matching-mat occupies position
    3 with pedagogicalRole 'place-value-decomposition-game'
    (the matching surface pairs teen numerals to their
    decomposition cards). Manipulative-cut-outs in base-ten-
    blocks mode (position 5) provides the concrete ten-stick
    + ones manipulatives that the place-value-mat would
    structure in space; in this package the bundling work
    happens with the cut-outs directly on the table rather
    than on the mat. Once the place-value-mat generator
    ships, this package's material set can extend or
    substitute at materials mass-run time.

    Class B FLEXIBLE substrate: composes against animals
    theme (numeracy strand precedent per Arc 16 +
    addition-subtraction strand consistency; pair-coherent
    with sibling identify-tens-and-ones-2-digit which also
    uses animals).

    K-3 multilingual classroom relevance: teen-number
    decomposition is universal K-3 numeracy + place-value
    content. The English teen-number words 'eleven' and
    'twelve' uniquely HIDE the structure (other locales
    expose it more clearly: de 'elf' + 'zwölf' also hide;
    es 'once' + 'doce' also hide; fr 'onze' + 'douze' also
    hide — but es 'trece...diecinueve' and fr 'treize...dix-
    neuf' show 'ten-plus-N' structure from 13 onward; de
    'dreizehn...neunzehn' similarly; it 'tredici...
    diciannove' similarly). Finnish + Swedish + Danish +
    Norwegian + Dutch + Portuguese also expose the structure
    from 13-19 with locale-specific irregularities at 11-12.
    Across all 11 platform locales, the decomposition concept
    is locale-portable; the variation is which teen-number
    words expose vs hide the structure. Locale-variant work
    at Phase 3+ adapts to each locale's teen-number register.

