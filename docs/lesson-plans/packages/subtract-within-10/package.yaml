# Teaching package — subtract within 10
# Arc 14 Phase 4 (math / addition-subtraction +1; extends subtract-within-5 sibling).

targetSlug: subtract-within-10
language: en
title:
  en: "Subtract Within 10 — taking away bigger numbers"
description:
  en: "Kindergarten / Grade 1 math package teaching kids to subtract numbers within 10 (10-3=7, 8-5=3, 9-4=5, etc.). Builds on Arc 14 Phase 4 sibling subtract-within-5 + Arc 12 add-within-10 foundation. Extends subtraction work from within-5 range to within-10 range. Critical bridge from finger-counting subtraction (within 5) to mental subtraction (within 10); enables subtraction strategies beyond 1-to-1 finger correspondence. Pairs with subtract-within-5 (this Phase 4 sibling); both packages extend addition-subtraction strand to full subtraction coverage. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + within-10 subtraction introduction.
      Teacher displays 10 cubes. "Today we subtract BIGGER numbers
      — within 10. Let's start with 10-3. Watch: I have 10 cubes
      (counts). I TAKE AWAY 3 cubes (removes). How many left?
      (counts) 7. So 10-3=7." Repeat with several within-10
      problems (8-5, 9-4, 7-3, 10-6, 9-7). Teacher introduces
      strategy: "When numbers get bigger, we can count BACK from
      the first number — '10... 9, 8, 7' — 3 counts back means
      10-3=7." Mental-math strategy preview.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + subtraction routine. Each pair receives a
      worksheet with 6 subtraction problems (10-3, 9-4, 8-5, 7-2,
      10-6, 9-7) plus countable manipulatives (small cubes or
      counters). Pair takes turns: kid A reads problem; kid B
      uses count-back strategy OR concrete manipulatives.
      Recast errors with re-count + count-back demo ("9-4 — start
      at 9. Count back 4: 8, 7, 6, 5. So 9-4=5."). Differentiate
      by tools — finger-counters for kids needing it; mental math
      for kids ready.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: subtraction worksheet (cross-out
      method within 10 — connects to subtract-within-5 method).
      Station 2: math-worksheet (vertical subtraction within 10
      format). Station 3: matching worksheet (subtraction problem
      to numerical answer). Station 4: math-puzzle (find missing
      subtrahend or minuend in subtraction equations).
  closure:
    durationMinutes: 5
    body: |
      Whole-class within-10 subtraction quiz. Teacher presents 5
      fast subtraction problems; class collectively answers using
      mental math or count-back. "10-2? 9-5? 8-3? 10-7? 7-4?"
      Forward-pointer: "Today we subtracted within 10. When we
      come back next, we can subtract within 20 + start learning
      DOUBLE-DIGIT subtraction with bigger numbers!"

