assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 4 waiting-strategies (hands in lap /
        count to 10 / deep breath / look at a
        friend) in 7 of 10 trials.
      - Match a waiting-scenario to an appropriate
        strategy in 6 of 8 attempts.
      - Demonstrate at least one waiting-strategy
        in 4 of 6 observed classroom-routine
        waiting moments during the week (teacher
        rubric: line-waiting, raise-hand-wait,
        snack-wait, help-wait).
      - Self-advocate "I'm waiting" or "my turn
        next" without conflict in 3 of 5 free-play
        observations (script-application metric).
      - Use vocabulary 'wait' / 'patient' /
        'impatient' / 'turn' / 'strategy' correctly
        in 5 of 10 productive-language trials.

    Differentiation:
    - Pre-K: 2-strategy starter set (hands in lap +
      deep breath); receptive-modeling first (kids
      respond to teacher-prompted strategies);
      productive-language emerges as it does
      without pressure.
    - K: full 4-strategy set; productive use of
      strategies during pair activities + classroom
      routines; teacher rubric on free-play +
      routine observations across the week.
    - Grade 1+: extend to STRATEGY-CO-CREATION
      (kids propose new waiting-strategies; class
      collectively decides which to add to the
      classroom's waiting-toolkit); bridge to
      conflict-de-escalation work (Arc 18+
      candidates: what to do when waiting feels
      impossible, how to ask-adult-for-help when
      waiting becomes overwhelming); bridge to
      regulate-emotions-with-strategies (PSED
      strand-advancement candidate; the broader
      emotion-regulation work that uses waiting-
      strategies as one tool among many).
    - Grade 2+: full executive-function vocabulary
      (self-regulation / inhibitory control /
      delayed gratification); bridge to peer-led
      classroom-meeting work where kids practice
      waiting-respectfully during group discussion;
      Grade 3+ extends to formal mindfulness
      practices + body-awareness work as waiting-
      tools.

