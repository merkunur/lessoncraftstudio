# Teaching package — add within 100
# Arc 16 Phase 1.1 (math / addition-subtraction 3/14 → 4/14). Extends Arc 12 add-within-20 + Arc 15 Phase 4 tens-and-ones-51-to-100 foundations.

targetSlug: add-within-100
language: en
title:
  en: "Adding Within 100 — two-digit sums with place-value bridging"

description:
  en: "Grade 2 math package teaching addition within 100 (sums like 27+38=65, 45+19=64, 56+44=100). Builds on Arc 12 add-within-20 + Arc 15 Phase 4 tens-and-ones-51-to-100 place-value foundation. Critical bridge from single-digit make-10 strategy to two-digit addition where the make-10 idea extends into place-value reasoning (add tens to tens, ones to ones, regroup ones when they sum to 10+). Introduces regrouping (carrying) as the canonical two-digit strategy. Some kids will lean on count-on (45+19: 45...50, 60, 64); others on decomposition (45+19 = 45+20-1 = 65-1 = 64); others on standard-algorithm column addition with carrying. Strategy diversity emphasized; place-value structure made explicit. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + place-value-aware addition introduction.
      Teacher displays 27+38 written vertically with tens-and-ones
      columns clearly marked. "Today we add BIGGER numbers — up
      to 100. Let's add 27 + 38. First, let's add the ONES: 7+8
      = 15. That's MORE than 10, so we REGROUP — the 1 ten goes
      to the tens column. Now the tens: 2+3+1 (carried) = 6 tens
      = 60. Plus 5 ones = 65." Teacher repeats with 45+19 (no
      regroup; ones sum to 14 — wait, regroup!) and 56+44 (ones
      sum to 10 = regroup; result 100). Pattern emphasis: "When
      ones sum to 10 or more, REGROUP. When less than 10, just
      add normally."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + base-ten manipulative routine. Each pair receives
      base-ten kits (ten-sticks + single-counters) + a worksheet
      with 6 problems within 100 (27+38, 45+19, 56+44, 64+25,
      33+18, 71+29). Pair takes turns: kid A builds first number
      with manipulatives; kid B builds second number; together
      they combine, regroup 10-ones-into-1-ten where needed, write
      the answer. Recast errors with regroup-demo ("you have 12
      ones in the ones column — that's 1 ten and 2 ones. Slide
      the ten-stick to the tens column."). Strategy choices: kids
      may use manipulatives, vertical column-add with carrying,
      decomposition, OR count-on; teacher accepts any strategy
      that produces correct answer + can be explained.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: addition worksheet (vertical
      format within 100 — practice with regrouping). Station 2:
      math-puzzle (missing-addend: 27+?=65; ?+38=65). Station 3:
      manipulative-cut-outs base-ten-block hands-on addition.
      Station 4: more-less (compare two addition results: which
      sum is greater, 45+19 or 38+26?).
  closure:
    durationMinutes: 5
    body: |
      Whole-class within-100 addition quiz. Teacher presents 5
      fast problems; class collectively answers with preferred
      strategy + identifies regrouping moments. "27+45? 56+33?
      64+29? 18+82? 39+49?" Forward-pointer: "Today we added
      within 100 + learned REGROUPING. When we come back next,
      we'll learn SUBTRACTION within 100 with BORROWING (the
      reverse of regrouping) — and three-digit place value!"

