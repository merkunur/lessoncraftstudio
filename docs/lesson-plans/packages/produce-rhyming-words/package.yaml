compositionalRationale:
  en: |
    Primary strand: early-literacy / phonological-awareness
    (produce-rhyming-words — strand 3/9 → 4/9). Pair-coherent
    with Phase 1.1 Slot 3 isolate-initial-phoneme; together
    advance the strand 2/9 → 4/9.

    Architectural significance: builds DIRECTLY on Arc 10
    identify-rhyming-pairs (prerequisite per learning-targets.
    json; already shipped). That package taught kids to
    RECOGNIZE rhyming pairs (receptive); this package teaches
    kids to GENERATE rhyming words (productive). Cognitive
    progression: receptive rhyme-recognition → productive
    rhyme-generation. Productive phonological work
    consolidates the underlying sound-pattern mental
    representation that decodes word-families.

    Per §A.13.30 K-1 informal framing: K rhyme-production
    work is CONCRETE PATTERN-COMPLETION. Kids hear a target
    word + generate words matching its ending sound + see
    that rhyming patterns form word-families (-at family,
    -all family, -un family). The pedagogy uses everyday
    language ('words that sound the same at the end' /
    'rhyming family') + accepts nonsense rhymes as valid
    PHONOLOGICAL output (the phonological skill always wins
    over spelling/meaning constraints at the K level).
    Formal poetic-form pedagogy (perfect rhyme vs slant
    rhyme; rhyme scheme; meter) is post-Grade-3 academic
    work that this K foundation supports.

    Cross-reference to identify-rhyming-pairs (Arc 10
    prerequisite): that package operationalized receptive
    rhyme-recognition. This package operationalizes
    productive rhyme-generation. Together they form the
    rhyme-cluster within phonological-awareness; both feed
    into systematic phonics decoding by establishing the
    rhyme-family mental representation.

    Materials note: 8-material Literacy class stack per
    §A.13.37 + pair-coherent with identify-rhyming-pairs
    Class B FLEXIBLE substrate (theme: animals provides
    familiar CVC vocabulary with rich rhyme-family
    coverage — cat / rat / bat / mat from -at family; dog
    / hog / fog / log from -og family; cow / how / now from
    -ow family; pig / wig / dig from -ig family). Manipulative-
    cut-outs at position 6 emits canonical-correct `mode:
    single-repeat` per §A.13.35.

    Distinctive composition: matching ×2 (positions 1+5) +
    word-guess (position 2) + word-scramble (position 3) +
    missing-pieces (position 4). Same composition shape as
    identify-rhyming-pairs precedent with word-scramble
    serving the productive-rhyme-generation work + missing-
    pieces surfacing rhyming-poem stanza completion.

    Class B FLEXIBLE substrate: composes against animals
    theme (vocab-anchored with familiar K-1 vocabulary;
    cross-arc with Arc 10 + Slot 3 phonological-awareness
    theme consistency). No substrate gaps; ships clean.

    K-3 multilingual classroom relevance: rhyme-production
    is universal K early-literacy content. Rhyme patterns
    differ per language: English uses ending-sound-rhyme;
    Spanish + Portuguese use vowel-ending rhyme + sometimes
    consonance; nordic languages use ending-sound rhyme
    similar to English. Multilingual K-3 classrooms benefit
    from explicit rhyme-pattern work in the language-of-
    instruction + cross-language rhyme-awareness work
    (bilingual kids may notice cross-language non-rhymes
    that ARE rhymes within one language).

