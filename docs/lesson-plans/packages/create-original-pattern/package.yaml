compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / pattern-recognition
    (open-ended production). Secondary strand: vocabulary acquisition
    (vocab-anchored — kids name objects as they construct). Tertiary
    strand: rule-application + working-memory (kids hold the chosen
    rule in mind while selecting + arranging objects).

    Open-ended counterpart to Arc 7's rule-following pattern packages:
    identify-AB-pattern + identify-AAB-ABB-patterns + identify-ABC-pattern
    + identify-AABB-pattern all work in the RECOGNITION direction (rule
    given by worksheet; kid identifies/continues). create-original-
    pattern works in the PRODUCTION direction (rule chosen by kid; kid
    constructs). Together the pair validates bidirectional pattern-
    cognition.

    Architectural significance: production-side cognitive complement to
    the recognition-side strand depth from Arc 7. Strong assessment
    target — kids who can RECOGNIZE patterns may not yet PRODUCE them
    (production lags recognition by 6-12 months in early-childhood
    development). Surfacing the production gap is a load-bearing
    classroom-assessment opportunity.

    Distinctive composition: 3 pattern-train exercises spanning AB +
    AAB + ABB rules (positions 1, 2, 3) + 1 pattern-worksheet at
    position 4 + 1 matching at position 5 for vocabulary reinforcement.
    Three picture-cards/flashcards materials (animals + fruits +
    vehicles) provide three theme-distinct production-prompt decks —
    kids select objects from across themes when constructing original
    patterns, reinforcing that the rule (AB/AAB/ABB) is independent
    of the object set.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Patterns work with ANY objects; substrate-readiness is universal
    across themes. The pattern-rule-as-recipe framing makes this
    package theme-agnostic at the cognitive level.

    K-3 multilingual classroom relevance: pattern construction is
    language-portable; vocabulary-anchor makes the package contribute
    to vocabulary review while exercising pattern-rule cognition. The
    show-and-tell warmup + closure surfaces give kids structured
    full-sentence speaking opportunities ("My pattern is cat, cat,
    dog, cat, cat, dog. The rule is AAB.") that K-3 multilingual
    classrooms need.

