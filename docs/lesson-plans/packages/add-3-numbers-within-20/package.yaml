assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compute 3-addend addition with sum ≤ 20
        correctly in 7 of 10 trials.
      - Identify the make-10 pair in a 3-addend
        expression when one exists in 6 of 8
        attempts (problems like 4+6+5 where
        4+6=10).
      - Apply make-10 strategy verbally during
        problem-solving in 5 of 8 trials.
      - Use at least 2 addition strategies (e.g.,
        make-10 + count-on; or make-10 + find-
        doubles) in 5 of 10 trials.
      - Solve missing-addend problems in 3-addend
        expressions (4+?+5 = 15) in 5 of 10
        trials.
      - Use vocabulary 'make-10' / 'pair' /
        'addend' / 'sum' / 'strategy' / 'three
        numbers' correctly in 5 of 10 productive-
        language trials.

    Differentiation:
    - Pre-K: skip 3-addend; review counting +
      add-within-5 first.
    - K: introduce add-within-10 first; defer
      3-addend to Grade 1+; if attempting 3-
      addend at K, restrict to sum ≤ 10 (1+2+3,
      2+3+4, etc.).
    - Grade 1: full 3-addend within-20 mastery
      with make-10 strategy emphasis; multiple
      strategies practiced; bridge to inverse-
      operation work (3-addend subtraction can
      be derived: 4+6+5=15 → 15-5-6=4; 15-4-5=6;
      etc.).
    - Grade 2+: extend to 3-addend within-100;
      bridge to multiplication concepts
      (multiplication as repeated addition: 3
      groups of 4 = 4+4+4 = 12); introduce
      formal property names (commutative /
      associative); bridge to mental-math
      fluency without manipulatives.
    - Grade 3+: extend to multi-step addition
      problems with 4+ addends + word-problem
      contexts requiring 3-addend reasoning;
      bridge to algebraic generalization (3-
      addend equations with unknowns in any
      position).

