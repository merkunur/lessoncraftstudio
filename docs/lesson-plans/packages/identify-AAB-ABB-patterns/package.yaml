compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / pattern-recognition.
    Secondary strand: vocabulary acquisition (vocab-anchored). Tertiary
    strand: working-memory (3-element pattern requires holding more
    pattern-rule complexity than 2-element AB).

    Pairing pattern with foundational package: identify-AB-pattern
    (Arc 7 Phase 1 companion) provides the 2-element AB foundation;
    this package extends to 3-element AAB + ABB patterns. Sequential
    prereq-chain: kids who learned AB are immediately ready for AAB/ABB.

    Distinctive composition: 3 pattern-train exercises across 2 different
    pattern modes (AAB at positions 1, 5; ABB at position 2) — validates
    that pattern-train architecture handles dual-mode pattern types
    cleanly. matching at position 3 + pattern-worksheet at position 4
    introduce variety in cognitive-task surface.

    Cognitive-load ladder vs AB: AAB and ABB require kids to track
    "which item is doubled" within the 3-element rule. Higher working-
    memory load than AB. Reflected in higher Pre-K differentiation
    threshold (AB works at Pre-K; AAB/ABB starts at K).

    K-3 multilingual classroom relevance: pattern-recognition continues
    to be language-portable; vocabulary-anchor preserved. Same high-
    leverage time use as AB-pattern package.

curriculumStandards:
  - CCSS.K.OA.A.4
  - EYFS.ELG.M
  - IB-PYP.HowTheWorldWorks

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify whether a pattern is AAB or ABB in 7 of 10 trials.
      - Complete AAB patterns with 2-3 missing items in 7 of 10 trials.
      - Complete ABB patterns with 2-3 missing items in 7 of 10 trials.
      - Name the doubled and single objects in 8 of 10 patterns
        (vocabulary-anchor verification).

    Differentiation:
    - Pre-K: NOT appropriate (use identify-AB-pattern instead).
    - K: AAB OR ABB only; introduce one type at a time.
    - Grade 1+: full AAB + ABB recognition + extend to identify-ABC-
      pattern (Arc 7 Phase 2 companion) + identify-AABB-pattern.

