assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Trace 6 shapes with controlled pencil grip in 8 of 10 trials.
      - Stay within ±3mm of dotted line in 7 of 10 traces.
      - Name 6 shapes when shown shape outline in 8 of 10 trials.

    Differentiation:
    - Pre-K: 3-shape scope (circle, square, triangle); thicker
      dotted lines; larger shape size.
    - K: 6-shape scope (add rectangle, oval, diamond); standard
      dotted-line thickness.
    - Grade 1+: extend to combined-shape figures (house = square +
      triangle; sun = circle with radial lines) + bridge to
      draw-2d-shapes-freehand.

