# Teaching package — count instances of a target in a grid
# Arc 6 Phase 2 (Option A vocab-depth) — cognitive-and-executive-function /
# memory-and-attention strand. Companion to find-hidden-target-in-busy-scene
# (Phase 2 sibling). Vocab-anchored: kids name the target before counting
# instances. Class B FLEXIBLE; substrate-ready via find-and-count app +
# image-library breadth.

targetSlug: count-instances-of-target-in-grid
language: en
title:
  en: "Count Instances in a Grid — count how many of one target appear"
description:
  en: "Kindergarten-Grade 1 cognitive-and-executive-function package teaching combined visual scanning + counting. Kids count how many instances of a named target appear in a mixed grid. Bridges find-hidden-target work (Phase 2 sibling) with numeracy counting (Arc 3+). Vocab-anchored — naming the target reinforces vocabulary. Composes against find-and-count app + image-library breadth. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher displays a 4×4 grid with mixed
      images (some cats, some dogs, some birds). Names a target: "Count
      how many cats." Class counts chorally as teacher points to each
      cat. Repeat with 2-3 different targets in the same grid. Reinforces
      counting + visual-scanning + the meta-skill of "tracking what I'm
      counting through a busy field." Pin to "Counting + Searching" area.
  contentActivity:
    durationMinutes: 12
    body: |
      Whole-class find-and-count routine. Teacher presents a new grid with
      multiple targets. Names the target; class collaboratively counts.
      Pair work: kid A picks a target from a grid; kid B counts instances
      with kid A verifying. Recast errors. Optional extension: kids
      construct their own grids with cut-outs and count each other's
      grids — peer-teaching reinforces the routine.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: find-and-count worksheet (kids count
      instances of named targets in 4×4 or 5×5 grids). Station 2:
      matching worksheet (image-name reinforces target vocabulary).
      Station 3: manipulative cut-outs grid construction (kids place
      cut-outs in a printed-grid template, then ask a partner to count
      a specific target — combines spatial reasoning with vocabulary +
      counting).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays a grid; kids count a
      named target collectively. Forward-pointer: "Today we counted
      hidden things in busy grids. When we come back to counting next,
      we'll count even bigger groups and use number words instead of
      tally marks."

