assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compare 2 containers by capacity in 8 of 10 trials.
      - Use vocabulary MORE / LESS / EQUAL accurately in capacity
        comparisons in 7 of 10 trials.
      - Order 3 containers from smallest to largest capacity in
        6 of 10 trials.

    Differentiation:
    - Pre-K: 2-container pairs with very large size contrast
      (tiny vs giant); receptive-only capacity comparison.
    - K: 2-3 container comparisons with moderate size contrasts.
    - Grade 1+: extend to numerical capacity (cup measurements;
      ounces; liters) + bridge to time-duration comparison
      (compare-by-time-duration).

