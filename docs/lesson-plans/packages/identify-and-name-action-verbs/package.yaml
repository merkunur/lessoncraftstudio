assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 8 of 10 action-verb vocabulary items in 8 of 10 trials.
      - Demonstrate 8 of 10 actions when given verb instruction in 9
        of 10 trials.
      - Use the "I can ___" frame productively with 6 of 10 verbs in
        productive-language attempts.

    Differentiation:
    - Pre-K: 6 most-frequent action verbs (run, jump, sit, stand, eat,
      sleep); receptive identification + kinesthetic enactment.
    - K: 10 action verbs; productive frame + spelling.
    - Grade 1+: extend to action-with-object phrasing ('eat an apple',
      'read a book'); bridge to subject-verb sentence construction.

