assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify AABB patterns vs other pattern types in 6 of 10 mixed-
        pattern trials.
      - Complete AABB patterns with 2-3 missing items in 6 of 10 trials.
      - Articulate the AABB rule ("first item appears twice, second
        item appears twice, then it repeats") when prompted.

    Differentiation:
    - Pre-K: NOT appropriate.
    - K: NOT appropriate (cognitive-load too high).
    - Grade 1+: AABB introductory.
    - Grade 2+: full AABB fluency + bridge to create-original-pattern.

