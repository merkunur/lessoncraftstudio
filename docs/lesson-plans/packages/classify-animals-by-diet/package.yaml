# Teaching package — classify animals by diet (herbivore / carnivore / omnivore)
# Arc 5 Phase 3 (world-knowledge / living-things strand). Companion to Phase 2's
# classify-animals-by-habitat. Same multi-cluster animal substrate (CLEAN against
# IMAGE_VOCABULARY); different classification dimension. Stress-tests whether
# classification architecture handles multiple classification dimensions on
# the same theme axis without duplication/conflict at material-render time.

targetSlug: classify-animals-by-diet
language: en
title:
  en: "Classify Animals by Diet — herbivore, carnivore, omnivore"
description:
  en: "Grade 1-2 world-knowledge package teaching dietary classification of common animals (herbivore = plant-eater; carnivore = meat-eater; omnivore = both). Builds on classify-animals-by-habitat (Phase 2 companion) using the same animal substrate but a different classification dimension. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher introduces the 3 diet categories
      with concrete examples. "A herbivore eats plants — like a cow eats
      grass, like a rabbit eats carrots, like a horse eats hay. A
      carnivore eats meat (other animals) — like a lion hunts other
      animals. An omnivore eats BOTH plants and meat — like a bear eats
      berries AND fish; like humans eat vegetables AND chicken." Class
      repeats the 3 category names chorally. Pin to "Animal Diets" word
      wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Whole-class sorting routine. Teacher names an animal in target
      language; class signals diet category with hand-gesture (hands
      together palms up = herbivore/plants; one hand chomp-motion =
      carnivore; both motions = omnivore). Pair work: kid A names an
      animal; kid B says diet category. Recast errors with explanation
      ("Cows are herbivores because they eat grass and plants — they
      don't eat meat"). Optional extension: kids think about themselves
      ("Are humans herbivores, carnivores, or omnivores?") — discussion
      anchor for diet diversity.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (sort animal
      cards between herbivore vs carnivore — 2-category contrast).
      Station 2: matching worksheet (animal → diet-category-word matching).
      Station 3: manipulative cut-outs 3-category sorting (kids physically
      place cut-out animals on 3 mats labeled herbivore / carnivore /
      omnivore). Discussion at station 3: "Why do you think bears are
      omnivores?" — encourages reasoning beyond memorization.
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names an animal; kids show the
      diet-gesture from contentActivity. Forward-pointer: "Today we
      sorted animals by what they eat. When we come back to animals
      next, we'll think about food chains — who eats what, and what
      happens to plants and animals in the bigger picture."

