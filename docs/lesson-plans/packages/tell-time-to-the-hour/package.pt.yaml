# Teaching package — dizer as horas em ponto (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT per Arc 7 Phase 3 + Arc 3 Phase 1 sparse-override pattern.
# Arc 17 Phase 1.4 pt-cadence continuation (17th consecutive arc).
# pt sparse-override for math / measurement strand. Conteúdo matemático
# universal — adaptação locale-específica para expressão idiomática de tempo em pt-BR.
# BR-MEC ensino fundamental anos iniciais register per CLAUDE.md §6 + formal "você"
# address per §17.9.

title:
  pt: "Dizer as Horas em Ponto — quando o ponteiro dos minutos aponta para cima"

description:
  pt: "Pacote de matemática/medida para 1º ano que ensina as crianças a ler relógios analógicos quando é hora em ponto. As crianças aprendem as características estruturais de um relógio analógico — 12 posições numeradas, um ponteiro CURTO (o ponteiro das horas) que aponta para um número de 1 a 12, e um ponteiro LONGO (o ponteiro dos minutos) que aponta direto para cima no 12 quando é exatamente a hora. 1:00 = ponteiro das horas no 1, ponteiro dos minutos no 12. Âncora CCSS.1.MD.B.3 (fill canônico do fio de medida per learning-targets.json). Paralelo a Arc 15 Phase 1 read-time-on-analog-clock (que saturou o fio cognitive-and-executive-function / time-and-routine ao enquadrar leitura-de-relógio como uma habilidade de vida cotidiana); este pacote enquadra a mesma atividade através das lentes do fio de medida — leitura-de-relógio como medição quantitativa de tempo como uma dimensão mensurável (paralela a comprimento, peso, capacidade, duração). Ambos os enquadramentos coexistem intencionalmente: o enquadramento time-and-routine enfatiza QUANDO as coisas acontecem no dia; o enquadramento de medida enfatiza tempo como uma quantidade que pode ser lida de um instrumento. Par-parceiro: tell-time-to-half-hour (Slot 4 da Phase 1.4; estende leitura de hora-em-ponto para posições de meia-hora). Juntos formam o par canônico de fio-de-medida de dizer-as-horas, abrindo o trabalho mais amplo de fio-de-medida que continua com tell-time-to-quarter-hour (Phase 1.5+), tempo-decorrido + trabalho de minutos (Arc 18+). 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Iniciador com toda a turma + introdução da estrutura do
      relógio analógico. A professora ou o professor exibe uma
      face de relógio analógico grande. "Este é um relógio —
      uma ferramenta que MEDE o tempo. Veem os 12 números ao
      redor da borda? Cada número é uma posição-de-hora. Veem
      DOIS ponteiros? O ponteiro CURTO é o PONTEIRO DAS HORAS
      — ele nos mostra a hora. O ponteiro LONGO é o PONTEIRO
      DOS MINUTOS — ele nos mostra os minutos. Quando é
      exatamente uma HORA (sem minutos extras), o ponteiro
      dos minutos aponta DIRETO PARA CIMA no 12. O ponteiro
      das horas aponta para o número da hora." Demonstra 3
      posições de hora-em-ponto: 3:00 (ponteiro das horas
      apontando para 3; ponteiro dos minutos apontando direto
      para cima no 12); 9:00 (ponteiro das horas no 9;
      ponteiro dos minutos no 12); 12:00 (ambos os ponteiros
      juntos no 12). Turma repete: "Três horas! Nove horas!
      Doze horas!" Ênfase do padrão: "Quando o ponteiro longo
      aponta direto para cima, o tempo é EXATAMENTE a hora.
      Leia o ponteiro das horas para saber qual hora."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de leitura-de-relógio com
      relógios de papel de ponteiros móveis. Cada dupla
      recebe um relógio de papel com ponteiros móveis
      (material clock-mat com ponteiros das horas + dos
      minutos móveis) + um conjunto de 8 cartas de hora-em-
      ponto (1:00, 4:00, 7:00, 10:00, 2:00, 5:00, 8:00,
      11:00). Dupla alterna: criança A puxa uma carta de
      hora; criança B coloca o relógio de papel naquela
      hora movendo os ponteiros — ponteiro dos minutos para
      o 12, ponteiro das horas para o número nomeado.
      Criança A verifica a colocação. Depois trocam.
      Refraseie erros com pista-de-ponteiro ("8 horas:
      ponteiro longo APONTA DIRETO PARA CIMA no 12; ponteiro
      curto aponta para 8"). Os ponteiros móveis permitem
      que as crianças encenem fisicamente a posição em vez
      de apenas vê-la impressa — trabalho de medida é
      hands-on. Vocabulário pt-BR canônico para leitura-de-
      relógio: relógio analógico; ponteiro das horas /
      ponteiro dos minutos; ponteiro curto / ponteiro
      longo; hora em ponto; face do relógio. "Hora em
      ponto" é a expressão pt-BR K-3 canônica para o que en
      chama "o'clock" — "três em ponto" / "três horas em
      ponto" / "são três horas" são as três formas
      coloquiais brasileiras.
  scaffold:
    body: |
      Rotação de estações. Estação 1: atividade matching —
      combine cada face de relógio analógico (desenhada em
      posições de hora-em-ponto) à sua hora digital (1:00,
      2:00, ... 12:00). Estação 2: atividade chart-count —
      conte através das posições de hora ao redor da face
      do relógio (1, 2, 3, ... 12). Estação 3: atividade
      math-puzzle (coloque o relógio em uma hora dada:
      prompt de elemento-faltante). Estação 4: variante
      matching com vocabulário (face do relógio → forma
      escrita "X horas").
  closure:
    body: |
      Recuperação rápida de leitura-de-hora com toda a
      turma. A professora ou o professor exibe 6 faces de
      relógio; a turma lê cada uma coletivamente. "Quatro
      horas! Sete horas! Onze horas! Doze horas! Duas
      horas! Nove horas!" Indicador adiante: "Hoje lemos
      horas em ponto — quando o ponteiro dos minutos
      aponta direto para cima no 12. A seguir aprenderemos
      MEIA-HORA — quando o ponteiro dos minutos aponta
      direto para baixo no 6. E depois disso, QUINZE-PARA
      + QUINZE-PASSADAS — quando o ponteiro dos minutos
      aponta para 3 ou 9. Passo a passo, estamos aprendendo
      a MEDIR o tempo no relógio."

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Ler 8 faces de relógio analógico mostrando horas-
        em-ponto corretamente em 7 de 10 tentativas.
      - Distinguir ponteiro das horas de ponteiro dos
        minutos em 9 de 10 tentativas (o ponteiro CURTO é
        de horas; o ponteiro LONGO é de minutos).
      - Colocar o relógio de papel de ponteiros móveis em
        uma hora dada (e.g., 'mostre 4 horas') em 7 de 10
        tentativas.
      - Usar vocabulário 'hora em ponto' / 'ponteiro das
        horas' / 'ponteiro dos minutos' / 'doze' (a posição
        do ponteiro dos minutos na hora) corretamente em 7
        de 10 tentativas de linguagem produtiva.

    Diferenciação:
      - Pré-K (3-5 anos): pular leitura de relógio analógico;
        revisar primeiro a sequência de dias-da-semana +
        meses-do-ano.
      - Educação infantil (5-7 anos): leitura de hora-em-
        ponto com 4-6 posições de hora (1, 3, 6, 9, 12 são
        as mais acessíveis na educação infantil — as
        posições cardinais da bússola); pular meia-hora
        completamente.
      - 1º ano: leitura completa de hora-em-ponto; trabalho
        com ponteiros móveis fortemente apoiado; ponte para
        tell-time-to-half-hour (pacote-irmão).
      - 2º ano em diante: estender para tell-time-to-
        quarter-hour (candidato Phase 1.5+) + dizer-tempo-
        a-cinco-minutos + distinção AM/PM + formato de
        relógio digital.

compositionalRationale:
  pt: |
    Fio principal: matemática / medida (dizer as horas em
    ponto em um relógio analógico — abre sub-track canônico
    do fio de medida para trabalho de dizer-as-horas). Fio
    secundário: matemática / time-and-routine (enquadramento
    paralelo — ver referência cruzada a read-time-on-analog-
    clock abaixo). Fio terciário: aquisição-de-vocabulário
    (vocabulário de leitura-de-relógio: hora, minuto, em
    ponto, ponteiro, face do relógio).

    Significância arquitetural: abre o par canônico de
    fio-de-medida de dizer-as-horas (Slot 1 + Slot 4 da
    Phase 1.4). Per learning-targets.json `tell-time-to-the-
    hour` vive no fio de medida (CCSS.1.MD.B.3); este pacote
    é seu fill canônico. Junto com tell-time-to-half-hour
    (Slot 4), cobre os primeiros 2 de 3 alvos canônicos de
    dizer-as-horas (tell-time-to-quarter-hour, CCSS.2.MD.
    C.7, é o 3º; diferido para Phase 1.5+).

    Referência cruzada a read-time-on-analog-clock (Arc 15
    Phase 1): o pacote existente read-time-on-analog-clock
    satura o fio cognitive-and-executive-function / time-
    and-routine em 4/4 e TAMBÉM cobre leitura-de-relógio de
    hora + meia-hora pedagogicamente. O par tell-time da
    Phase 1.4 coexiste com aquele trabalho como
    enquadramento paralelo de fio-de-medida. Os dois
    enquadramentos enfatizam aspectos pedagógicos diferentes
    da mesma atividade observável:
    - read-time-on-analog-clock: leitura-de-relógio como
      habilidade de vida cotidiana (QUANDO as coisas
      acontecem no dia; leitura de horário;
      consciência de tempo-e-rotina).
    - tell-time-to-the-hour (este pacote): leitura-de-
      relógio como medição quantitativa (TEMPO COMO
      DIMENSÃO MENSURÁVEL paralela a comprimento, peso,
      capacidade, duração). O relógio é um instrumento de
      medida que lê a quantidade 'hora do dia'.

    Os dois enquadramentos são valiosos; quem ensina pode
    puxar qualquer um dos enquadramentos que se encaixe em
    seu contexto curricular. Os dois pacotes compartilham
    precedentes de material (clock-mat, modo clock-pieces
    em manipulative-cut-outs, labelDisplay time-format em
    flashcards) — a infraestrutura canônica de material de
    leitura-de-relógio é compartilhada entre ambos os
    enquadramentos de fio.

    Par-parceiro (dentro da Phase 1.4): tell-time-to-half-
    hour (Slot 4) — estende leitura de hora-em-ponto para
    posições de meia-hora.

    Especificidade pt-BR: leitura-de-relógio é conceito
    universal + traduzível 1:1 do en em termos pedagógicos,
    mas o IDIOMA de expressão verbal de tempo é altamente
    específico-de-locale. Vocabulário pt-BR canônico:
    - **"hora em ponto"** — forma K-3 canônica para o
      conceito en 'o'clock'; "três em ponto" / "três
      horas em ponto" são as duas formas mais comuns.
    - **"são X horas"** — alternativa coloquial brasileira
      ("são três horas" = "it's three o'clock"); plural
      por construção gramatical do pt-BR.
    - **"ponteiro das horas"** / **"ponteiro dos minutos"**
      — termos K-3 canônicos para os dois ponteiros;
      "ponteiro curto" / "ponteiro longo" são variantes
      descritivas.
    - **"face do relógio"** — nome canônico para o disco
      numerado do relógio.

    Em pt-BR, a construção verbal de tempo usa plural por
    padrão a partir das 2 horas: "é uma hora" (singular,
    para 1:00 apenas) vs "são duas horas, são três horas..."
    (plural, todas as outras horas). Esta peculiaridade
    gramatical é dirigida pela palavra-número "uma" (que é
    feminina singular) — para todas as outras horas, o
    número é plural. Detalhe importante para autoria de
    materiais pt-BR.

    Currículo BNCC EF02MA18 (2º ano) + EF02MA19 (2º ano):
    indicar o instante de início e de término de uma
    atividade; medir e comparar duração de eventos
    utilizando unidade convencional (hora, minuto, segundo);
    reconhecer hora e meia hora.

    Substrato Class B FLEXIBLE: composta contra tema
    miscellaneous (faces de relógio não compõem
    naturalmente contra temas de animais/comida; alinha-se
    com read-time-on-analog-clock + tens-and-ones-1-to-20
    precedente de pacote abstrato-numérico).
