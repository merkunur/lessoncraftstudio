assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Trace 5 of 6 dotted curves (circles, arcs, S-curves) staying
        on the line in 7 of 10 attempts.
      - Trace 3 of 4 outline curves (lighter guidance) in 6 of 10
        attempts.
      - Draw a freehand circle approximately closed (start point near
        end point) in 5 of 10 attempts.

    Differentiation:
    - Pre-K: full circles only; thick crayon; dotted-line guidance.
    - K: circles + arcs + S-curves; pencil; dotted + outline.
    - Grade 1+: free-hand curves + bridge to trace-2d-shapes (Arc
      12+ candidate); foundation for letter formation.

