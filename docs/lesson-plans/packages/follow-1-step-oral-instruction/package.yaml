assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Execute 8 of 10 1-step oral instructions correctly.
      - Use body-part + classroom-object vocabulary actively while
        following instructions.
      - Articulate the listen-then-act principle in 6 of 10 trials.

    Differentiation:
    - Pre-K: 4 high-frequency instructions (sit, stand, clap, point);
      teacher demonstrates first.
    - K: 8-10 instructions across body parts + classroom objects.
    - Grade 1+: extend to 2-step instructions (follow-2-step-oral-
      instruction Arc 12+ candidate); bridge to comprehension of
      multi-step procedures.

