thematicCoherence:
  en: |
    All 6 packages cohere around narrative structure + reading-comprehension
    pedagogy. Together they form the K-3 progression from recognizing
    story-shape (who/where/what) through reading instruction-following work
    + fiction/nonfiction distinction.

    **Pedagogical sequencing:**
    1. **identify-main-character** (Arc 17 P1.5) — Foundational story-element
       recognition: WHO is the story about. Anchor for narrative comprehension.
    2. **identify-setting** (Arc 18 P1.2) — WHERE the story happens. Pairs
       with #1 to form the story-shape foundation.
    3. **identify-problem-and-solution** (Arc 18 P1.4) — Narrative arc
       recognition: WHAT happens + HOW it resolves. Bridges story-elements
       to plot understanding.
    4. **distinguish-fiction-from-nonfiction** (Arc 19 P1.1) — Genre-class
       recognition. Critical bridge from K-1 storybook reading to broader
       literacy.
    5. **read-and-follow-2-sentence-instruction** (Arc 19 P1.1) — Functional
       reading comprehension: multi-step reading with procedural action.
       Cross-strand bridge to writing-composition.
    6. **infer-character-feeling-from-picture-cue** (Arc 18 P1.4) — Inferential
       reading: kids draw emotional inference from picture + text cues.
       Bridges to SEL + advanced reading comprehension.

    **Strand spread:** all 6 packages anchor in reading-comprehension strand;
    #5 cross-bridges to functional reading; #6 cross-bridges to PSED. Strand-
    cluster bundle composition is the §A.13.25 sub-pattern emergence at
    Arc 19 P2 (α) NEW bundle creation lock.

    **Suggested unit duration:** 5-6 weeks. Reading-comprehension benefits
    from sustained practice + repeated exposure to narrative elements.

    **Multilingual classroom relevance:** narrative structure is K-3
    universal across cultures; story-elements (character / setting /
    problem / solution) appear across all 11 platform locales' storytelling
    traditions. Bundle delivery requires locale-adaptation for cultural-
    canonical story types (e.g., pt-BR favors cumulative-tale + animal-
    fable traditions; Nordic favors saga + folk-tale traditions; Romance
    favors fairy-tale + family-tale traditions). Teachers select locale-
    canonical sample stories to anchor the bundle's pedagogy.

    **Architectural significance:** FIRST strand-anchored bundle in the
    Pillar 2 ecosystem (47 existing bundles are theme-anchored per
    §16.5.1 image_themes 1:1 registration). Establishes the strand-cluster
    sub-pattern alongside the §A.13.25 paired-cluster sub-pattern. Future
    strand-anchored bundles can follow this precedent; future operator-
    strategic adjudication on strand-axis-key registration may extend
    topics-taxonomy.json axes per Pillar 2 re-open path.
