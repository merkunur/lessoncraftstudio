assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compute 2-digit minus 2-digit subtraction correctly
        in 7 of 10 trials.
      - Identify borrowing moments + execute borrowing
        correctly in 6 of 8 problems requiring borrow.
      - Use place-value-mat + base-ten manipulatives to
        build 2-digit numbers + perform subtraction with
        physical ten-for-ones exchange in 6 of 8 trials.
      - Use at least 2 subtraction strategies (e.g.,
        column-subtract-with-borrow + decomposition or
        count-up-from-bottom) in 5 of 10 trials.
      - Solve missing-subtrahend problems (54-?=31) in 5
        of 10 trials.
      - Use vocabulary 'tens' / 'ones' / 'place value' /
        'borrow' / 'difference' / 'minus' / 'subtract' /
        'two-digit' correctly in 5 of 10 productive-
        language trials.

    Differentiation:
    - Pre-K: skip 2-digit subtraction; review counting +
      subtract-within-10 first.
    - K: introduce 2-digit numbers + place-value (Arc 15
      tens-and-ones); defer 2-digit subtraction to
      Grade 1+.
    - Grade 1: introduce 2-digit minus 1-digit
      subtraction (45-3); save 2-digit minus 2-digit for
      Grade 2.
    - Grade 2: full 2-digit minus 2-digit subtraction
      with borrowing mastery; multiple strategies
      practiced; bridge to pair partner add-2-digit-
      numbers (already shipped Phase 1.3); strand-close
      bridge to add-3-numbers-within-20 (Phase 1.5+
      candidate; final addition-subtraction strand
      target).
    - Grade 3+: extend to 3-digit subtraction; mental
      2-digit subtraction fluency; bridge to standard-
      algorithm efficiency without manipulative
      support; extend to multi-step word problems
      involving subtraction.

