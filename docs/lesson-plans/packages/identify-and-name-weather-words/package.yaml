# Teaching package — identify and name weather vocabulary
# Arc 8 Phase 2 (Option A vocab-acquisition continuation; early-literacy /
# vocabulary-acquisition strand). Class A CLEAN — weather substrate present
# in IMAGE_VOCABULARY (sun, cloud, rain, snow, wind, storm, etc.). Vocab-
# anchored productive-language: kids identify, name, and use weather
# vocabulary in describe-the-day routines.

targetSlug: identify-and-name-weather-words
language: en
title:
  en: "Weather Words — name today's weather"
description:
  en: "Preschool / Kindergarten early-literacy package teaching weather vocabulary. Class A CLEAN — weather substrate (sun, cloud, rain, snow, wind, storm, rainbow) is present in IMAGE_VOCABULARY across all 11 platform locales. Daily-routine integration: kids learn to name today's weather as part of morning circle. Productive-language target: full-sentence descriptions ('Today is sunny' / 'Es regnet' / 'Hace sol'). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class morning-circle routine. Teacher points out the window:
      "What's the weather today?" Class names what they see (sunny,
      cloudy, rainy, snowy, etc.). Teacher pins the matching weather
      flashcard onto the daily-weather chart. Reinforces visual-cue-to-
      word mapping + builds the morning-circle ritual into vocabulary
      practice.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine. Teacher displays 6-8 weather flashcards;
      class names each. Pair work: kid A holds up a weather card; kid B
      names it AND uses the language frame ("It is ___" / "I see ___").
      Recast errors with explanation ("you said cloud — yes, but with
      our frame: It is cloudy. Notice the -y at the end — sunny, cloudy,
      rainy, snowy, windy"). Optional extension: kids draw their own
      weather scene + describe it in 2 sentences.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (image-name pairs;
      reinforces weather-word recognition). Station 2: bingo with
      weather caller chips (whole-table listening + scanning game).
      Station 3: manipulative cut-outs hands-on weather-scene
      construction (kids assemble weather scenes from cut-outs +
      describe). Station 4: word-guess worksheet (kids fill in
      weather-word letters from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class daily-weather chart update. Class names today's
      weather + adds a tally mark on the chart for that weather type.
      Forward-pointer: "Today we named the weather. When we come back
      to weather next, we'll describe weather across SEASONS — what
      kinds of weather we see in winter, spring, summer, fall."

