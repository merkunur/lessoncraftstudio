compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial / spatial-reasoning.
    Secondary strand: executive-function (path-planning + mental-
    simulation; kids think 2-3 steps ahead before committing). Tertiary
    strand: fine-motor (finger-trace transitions to pencil-trace as
    motor control develops).

    Architectural significance: FIRST maze package in the catalog.
    Bridges Arc 7's follow-directions-on-grid (open-grid traversal
    with externally-given directions) into self-directed maze
    navigation (kid plans + executes the path). The Arc 7 → Arc 8
    progression validates that grid-traversal vocabulary + spatial-
    reasoning skill from Arc 7 transfers cleanly into maze-solving
    contexts. Resolves Arc 7's follow-directions-on-grid forward-
    pointer.

    Distinctive composition: 4 picture-path classic-maze exercises
    spanning grid sizes 15 → 16 → 18 → 20 (gradual difficulty
    progression within the 1-week unit). The size progression is
    pedagogically intentional — 15 grid = preschool-friendly (~3-4
    decision points); 20 grid = K-end / Grade-1 (multiple dead-ends).
    Matching at position 3 breaks the maze rhythm + reinforces start/
    finish vocabulary.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Mazes work with ANY start/finish object vocabulary; substrate-
    readiness is universal across themes that have at least 2 distinct
    objects (one for start, one for finish).

    K-3 multilingual classroom relevance: spatial-reasoning is
    cognitively universal; verbalization of path directions
    ("First go RIGHT, then DOWN, then RIGHT again") is exactly the
    kind of sequence-narration full-sentence practice K-3 multilingual
    classrooms need. Direction vocabulary (right/left/up/down) reinforced
    from Arc 7 follow-directions-on-grid carries forward into maze work.

