assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Blend 3 separately-spoken phonemes into a CVC word in
        7 of 10 trials.
      - Blend at slow-pace (1-second separation) in 8 of 10
        trials.
      - Blend at fast-pace (no separation) in 6 of 10 trials.
      - Match a 3-phoneme cue (heard separately) to the
        correct CVC picture in 7 of 10 trials.
      - Use vocabulary 'blend' / 'put sounds together' / 'slide
        sounds together' correctly in 5 of 10 productive-
        language trials.
      - PRODUCE a CVC word from 3 separated phonemes given
        orally (not just RECOGNIZE) in 5 of 8 attempts.

    Differentiation:
    - Pre-K: focus on syllable-blending + rhyme work first;
      defer phoneme-blending to K.
    - K: 3-phoneme CVC blending with slow-to-fast progression;
      defer consonant-blend onset blending (/bl/, /str/) +
      4+ phoneme blending to Grade 1.
    - Grade 1: full CVC + consonant-blend onset blending
      (/bl-a-st/ → blast; /st-o-p/ → stop) + initial bridge to
      4-phoneme blending (CVCC + CCVC); bridge to written CVC
      decoding (read-cvc-words; Arc 6 P1).
    - Grade 2+: extend to multi-syllable blending (compound
      words; 2-syllable words via syllable-blending then
      phoneme-blending within syllables); bridge to fluent
      decoding of multi-syllable words.

