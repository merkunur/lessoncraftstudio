compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (RECEPTIVE — pointing to named
    vehicle, not naming it). Secondary strand: visual discrimination
    (vehicle silhouette recognition).

    Pairing pattern with productive package: identify-and-name-vehicles
    (Arc 2) provides the productive surface; this receptive variant
    uses the same 10-key cluster but composes against receptive-surface
    exercises (matching is image-to-word; shadow-match is image-to-
    silhouette; find-and-count + odd-one-out reinforce vocabulary in
    cognitive contexts — all surfaces require recognition, not
    production).

    Architectural validation: fourth receptive-variant package across
    Arc 5 Phase 3 + Arc 6 Phase 1 (after body-part + farm-animal +
    zoo-animal). Continues validation of the productive↔receptive pairing
    pattern. The pattern continues to hold cleanly across diverse theme
    axes; templates are stable.

    Cross-package thematic complement: point-to-named-vehicle pairs
    naturally with identify-transportation-types (Arc 5 Phase 2) — the
    receptive variant teaches the vehicle names; the classification
    package teaches what category each vehicle belongs to. Together
    they form the vehicle-vocabulary core for K-3 multilingual classrooms.

    Vocabulary-tracing-strips note: 4 keys (car, bus, train, boat) selected
    for K-3 handwriting-readiness — short words; high-frequency in K-3
    transportation-themed picture books.

    K-3 multilingual classroom relevance: vehicle vocabulary varies
    modestly across the 11 platform locales (some compound vehicle names
    in German + Finnish; analytic patterns in Romance + Nordic). The
    receptive package validates kids understand vehicle names regardless
    of locale-specific morphology before pushing productive use.

