assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify 4 plant parts (root, stem, leaf, flower) on a labeled
        plant in 8 of 10 trials.
      - Articulate one function per plant part in 6 of 10 trials.
      - Apply plant-part vocab to a NEW plant image in 7 of 10 trials.

    Differentiation:
    - Pre-K: 3 parts (root, leaf, flower); receptive only.
    - K: 4 parts + functions.
    - Grade 1+: extend to extended plant anatomy (petals, stamen,
      pistil); bridge to plant-reproduction science.

