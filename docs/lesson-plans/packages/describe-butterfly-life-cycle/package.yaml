# Teaching package — describe butterfly life cycle
# Arc 14 Phase 1 (science / living-things 5/6 → 6/6 SATURATE).
# Builds on Arc 9-12 describe-plant-life-cycle pattern; extends to animal
# life-cycle.

targetSlug: describe-butterfly-life-cycle
language: en
title:
  en: "Butterfly Life Cycle — egg to caterpillar to butterfly"
description:
  en: "Kindergarten / Grade 1 science package teaching the butterfly life cycle (metamorphosis). Builds on Arc 9-12 describe-plant-life-cycle pattern; extends life-cycle understanding from plant biology to animal biology with a particularly vivid 4-stage sequence (egg → caterpillar → chrysalis → butterfly). Saturating package for science / living-things strand at 6/6 — first complete saturation of an animal-life-cycle subtopic. Builds on Arc 12 identify-living-vs-nonliving + describe-plant-life-cycle living-things foundation. Critical bridge from observing-living-things to understanding biological transformation. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + visual sequence introduction. Teacher displays
      4 large pictures: egg / caterpillar / chrysalis / butterfly.
      "These are 4 stages of a butterfly's life. They start as TINY
      eggs on a leaf. The egg hatches into a caterpillar. The
      caterpillar eats and eats, then forms a chrysalis. Inside the
      chrysalis, AMAZING things happen — and a butterfly comes out!"
      Class chants the sequence: "egg, caterpillar, chrysalis,
      butterfly". Visual + verbal anchor establishes the 4-stage
      vocabulary.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sequencing routine. Each pair receives 4 picture
      cards (egg / caterpillar / chrysalis / butterfly) shuffled. Pair
      arranges cards in correct life-cycle order. Teacher circulates;
      asks "What stage comes after the caterpillar? What does the
      caterpillar do before it becomes a butterfly?" Pairs explain
      sequence + transformation. Recast errors with re-ordering +
      visual reference to anchor pictures.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet sequencing
      4 stages. Station 2: matching worksheet (stage-name to picture).
      Station 3: missing-pieces worksheet (4-stage cycle with one
      stage missing — kid identifies which stage). Station 4:
      vocabulary-tracing-strips for stage names.
  closure:
    durationMinutes: 5
    body: |
      Whole-class review. Teacher asks each student to name one of
      the 4 stages + describe what happens at that stage. "An egg
      hatches." "A caterpillar eats leaves to grow." "A chrysalis is
      a hard shell where the caterpillar changes." "A butterfly flies
      and finds nectar." Forward-pointer: "Today we learned the
      butterfly's life cycle. When we come back next, we'll explore
      a different cycle that happens every day — the day-and-night
      cycle, OR the water cycle that makes our weather work."

