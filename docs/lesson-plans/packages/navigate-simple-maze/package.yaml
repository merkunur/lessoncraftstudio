# Teaching package — navigate simple mazes
# Arc 8 Phase 1 (Path B; fine-motor-and-visual-spatial / spatial-reasoning
# strand). Class B FLEXIBLE; vocab-anchored. FIRST maze package. Resolves
# Arc 7's follow-directions-on-grid forward-pointer to mazes. Uses picture-
# path classic-maze mode.

targetSlug: navigate-simple-maze
language: en
title:
  en: "Maze Navigation — find the path from start to finish"
description:
  en: "Kindergarten fine-motor-and-visual-spatial package teaching simple maze navigation. FIRST maze package in the catalog. Builds on Arc 7 follow-directions-on-grid (grid-traversal precursor) — kids now navigate paths with walls + dead-ends rather than open grids. Develops spatial-reasoning + executive-function (planning ahead, mentally simulating routes) + fine-motor (drawing the path with a finger or pencil). Uses picture-path app classic-maze mode. Vocab-anchored — kids name objects at start/end + describe the path direction. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher draws a simple 5×5 grid maze
      on the board with a clearly marked Start and Finish. Class
      collectively traces the path with finger-points (kids point in
      the air toward the next cell). Teacher narrates: "From Start, we
      go right one step. Then down. Then right. Then we hit a wall —
      let's go down instead." Reinforces wall-as-obstacle framing +
      builds on Arc 7 grid-direction vocabulary (right/left/up/down).
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + finger-trace routine. Each kid receives a printed
      simple maze + uses their finger to trace the path. Partners
      verify correctness. After tracing with finger, kids draw the
      path with a pencil. Teacher circulates: recasts errors with
      explanation ("you went into a wall — pick a different direction
      from this cell"). Optional extension: kids construct their own
      simple mazes on grid paper for partners to solve. The build-and-
      solve cycle reinforces wall-and-path framing from the producer
      side too.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-path classic-maze worksheet
      (small grid; clear path). Station 2: picture-path classic-maze
      worksheet (larger grid; multiple dead-ends; harder). Station 3:
      manipulative cut-outs hands-on maze construction (kids build
      mazes with cut-out walls + path tiles; partner solves). Station
      4: matching worksheet (image-name reinforces start/finish object
      vocabulary that the maze prompts use).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays a final maze on the
      board; class collectively traces the path while narrating
      directions. Forward-pointer: "Today we navigated simple mazes.
      When we come back to mazes next, we'll explore mazes with
      MULTIPLE PATHS — kids choose between paths, picking the
      shortest or the one that collects the most treasures."

