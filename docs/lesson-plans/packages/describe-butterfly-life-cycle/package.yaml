compositionalRationale:
  en: |
    Primary strand: science / living-things (animal life-cycle —
    saturates strand 6/6). Secondary strand: vocabulary-acquisition
    (4 stage names: egg, caterpillar, chrysalis, butterfly).
    Tertiary strand: cognitive-and-executive-function / sequencing.

    Architectural significance: SATURATES living-things strand at 6/6.
    First complete saturation of animal-life-cycle subtopic. Builds on
    Arc 12 identify-living-vs-nonliving + describe-plant-life-cycle
    foundation; extends life-cycle framework from plant biology
    (which Arc 9-12 covered) to animal biology with a particularly
    vivid 4-stage transformation. Pairs naturally with describe-
    plant-life-cycle for cross-bundle pedagogical coherence.

    Distinctive composition: 2 pattern-train (sequence learning) + 2
    matching + 1 missing-pieces (which stage is missing? — sequence-
    integrity check). Sequencing emphasis throughout — 4-stage cycle
    naturally demands sequence comprehension.

    Class B FLEXIBLE substrate: composes against insects-and-bugs
    image-library theme (where butterfly imagery anchors) plus
    animals fallback for caterpillar.

    K-3 multilingual classroom relevance: butterfly + caterpillar
    vocabulary varied across 11 platform locales — Romance cognate-
    poor (mariposa / papillon / farfalla) but conceptually accessible
    via visual sequence. Visual life-cycle stages translate
    universally; vocabulary anchor varies. Sparse-overrides at
    Phase 3 will substitute locale-natural stage-names.

curriculumStandards:
  - NGSS.K-LS1-1
  - EYFS.ELG.UW.WORLD
  - IB-PYP.HowTheWorldWorks

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name all 4 butterfly life-cycle stages in correct sequence in
        7 of 10 trials.
      - Place 4 stage-pictures in correct order in 8 of 10 trials.
      - Describe what happens at each stage in 1-2 sentences in 6 of
        10 trials.

    Differentiation:
    - Pre-K: 3-stage simplification (egg → caterpillar → butterfly;
      omit chrysalis as conceptually difficult).
    - K: full 4-stage cycle.
    - Grade 1+: extend to other animal life-cycles (frog: egg →
      tadpole → frog; chicken: egg → chick → chicken) + cross-cycle
      comparison work.

