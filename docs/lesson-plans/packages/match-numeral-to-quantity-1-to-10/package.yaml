compositionalRationale:
  en: |
    Primary strand: counting and cardinality (target match-numeral-to-quantity-1-to-10).
    Secondary strand: numeral identification (numeral-cards as the target object;
    kids learn to RECOGNIZE the written symbol). Tertiary strand: vocabulary
    acquisition (animal names instrumental).

    Distinctive material weighting: matching-mat is central (numeral ↔ quantity
    pairs). manipulative-cut-outs supports concrete enactment. This is the first
    Arc 3 numeracy package where matching-mat is core (vs Arc 2 farm-animals
    where matching-mat was deferred for the existing matching-app PDF).

curriculumStandards:
  - CCSS.K.CC.B.4
  - CCSS.K.CC.C.6
  - EYFS.ELG.M

assessmentCriteria:
  en: |
    By end of 1-2 week unit:
      - Match numeral 1-10 to corresponding quantity in 8 of 10 trials.
      - Identify the numeral when shown a quantity in 8 of 10 trials.
      - Use the matching-mat productively in pair work.

    Differentiation:
    - K: range 1-5; introduce 6-10 only after 1-5 mastery.
    - Grade 1: full range 1-10.
    - Grade 1+: extend to compare-quantities-more-fewer (adjacent target).

