<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Matching Worksheets - Hero Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(145deg, #FF9A56 0%, #FF6B6B 50%, #FF8A7A 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Decorative curved dotted lines mimicking matching activity -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 1000 1000">
            <!-- Curved connection lines -->
            <path d="M 80 200 Q 200 350 320 280" stroke="#26D0CE" stroke-width="4" fill="none" stroke-dasharray="12 8" opacity="0.7"/>
            <path d="M 100 380 Q 250 500 350 420" stroke="#FFD93D" stroke-width="4" fill="none" stroke-dasharray="12 8" opacity="0.8"/>
            <path d="M 680 200 Q 800 320 920 250" stroke="#26D0CE" stroke-width="4" fill="none" stroke-dasharray="12 8" opacity="0.7"/>
            <path d="M 700 750 Q 850 850 950 780" stroke="#FFD93D" stroke-width="4" fill="none" stroke-dasharray="12 8" opacity="0.8"/>
            <!-- Small circles at line endpoints -->
            <circle cx="80" cy="200" r="8" fill="#26D0CE" opacity="0.9"/>
            <circle cx="320" cy="280" r="8" fill="#26D0CE" opacity="0.9"/>
            <circle cx="100" cy="380" r="8" fill="#FFD93D" opacity="0.9"/>
            <circle cx="350" cy="420" r="8" fill="#FFD93D" opacity="0.9"/>
        </svg>

        <!-- FREE Badge - Top Left -->
        <div style="
            position: absolute;
            top: 40px;
            left: 40px;
            transform: rotate(-12deg);
            z-index: 20;
        ">
            <div style="
                background: linear-gradient(135deg, #FF6B35 0%, #FF8C42 100%);
                color: white;
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 32px;
                padding: 14px 28px;
                border-radius: 12px;
                box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5), inset 0 2px 0 rgba(255,255,255,0.3);
                text-transform: uppercase;
                letter-spacing: 2px;
            ">FREE</div>
        </div>

        <!-- Grade Badge - Top Right -->
        <div style="
            position: absolute;
            top: 50px;
            right: 40px;
            background: linear-gradient(135deg, #26D0CE 0%, #1CB5B5 100%);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 24px;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(38, 208, 206, 0.4);
            z-index: 20;
        ">GRADES K-2</div>

        <!-- Main Title -->
        <div style="
            position: absolute;
            top: 130px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 72px;
                color: white;
                margin: 0;
                text-shadow: 0 4px 15px rgba(0,0,0,0.2), 0 2px 0 rgba(0,0,0,0.1);
                letter-spacing: -1px;
            ">MATCHING</h1>
            <h2 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 52px;
                color: #FFD93D;
                margin: -8px 0 0 0;
                text-shadow: 0 3px 10px rgba(0,0,0,0.15);
            ">WORKSHEETS</h2>
        </div>

        <!-- Floating Animal - Left Side (Cat) -->
        <div style="
            position: absolute;
            left: 60px;
            top: 480px;
            width: 120px;
            height: 120px;
            background: #FFD93D;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            z-index: 10;
        ">
            <svg width="70" height="70" viewBox="0 0 100 100">
                <!-- Simple cat face -->
                <ellipse cx="50" cy="55" rx="35" ry="30" fill="#FF8A5C"/>
                <polygon points="25,35 15,10 35,25" fill="#FF8A5C"/>
                <polygon points="75,35 85,10 65,25" fill="#FF8A5C"/>
                <polygon points="25,35 15,10 35,25" fill="#FFB088" transform="translate(2,2) scale(0.8)"/>
                <polygon points="75,35 85,10 65,25" fill="#FFB088" transform="translate(-2,2) scale(0.8)"/>
                <ellipse cx="38" cy="50" rx="8" ry="10" fill="white"/>
                <ellipse cx="62" cy="50" rx="8" ry="10" fill="white"/>
                <circle cx="38" cy="52" r="5" fill="#2D3748"/>
                <circle cx="62" cy="52" r="5" fill="#2D3748"/>
                <ellipse cx="50" cy="65" rx="6" ry="4" fill="#FF6B6B"/>
                <path d="M 44 72 Q 50 78 56 72" stroke="#2D3748" stroke-width="2" fill="none"/>
            </svg>
        </div>

        <!-- Floating Animal - Right Side (Dog) -->
        <div style="
            position: absolute;
            right: 50px;
            top: 420px;
            width: 110px;
            height: 110px;
            background: #26D0CE;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            z-index: 10;
        ">
            <svg width="65" height="65" viewBox="0 0 100 100">
                <!-- Simple dog face -->
                <ellipse cx="50" cy="55" rx="35" ry="32" fill="#8B6914"/>
                <ellipse cx="25" cy="35" rx="15" ry="20" fill="#8B6914"/>
                <ellipse cx="75" cy="35" rx="15" ry="20" fill="#8B6914"/>
                <ellipse cx="50" cy="60" rx="20" ry="18" fill="#F5E6D3"/>
                <ellipse cx="38" cy="48" rx="7" ry="8" fill="white"/>
                <ellipse cx="62" cy="48" rx="7" ry="8" fill="white"/>
                <circle cx="38" cy="50" r="4" fill="#2D3748"/>
                <circle cx="62" cy="50" r="4" fill="#2D3748"/>
                <ellipse cx="50" cy="62" rx="8" ry="6" fill="#2D3748"/>
                <ellipse cx="50" cy="60" rx="3" ry="2" fill="#FF8A8A"/>
            </svg>
        </div>

        <!-- Floating Star - Bottom Left -->
        <div style="
            position: absolute;
            left: 120px;
            bottom: 100px;
            z-index: 10;
        ">
            <svg width="60" height="60" viewBox="0 0 100 100">
                <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FFD93D" filter="drop-shadow(0 3px 8px rgba(0,0,0,0.2))"/>
            </svg>
        </div>

        <!-- Floating Star - Top Center-Right -->
        <div style="
            position: absolute;
            right: 200px;
            top: 80px;
            z-index: 5;
        ">
            <svg width="45" height="45" viewBox="0 0 100 100">
                <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="white" opacity="0.8"/>
            </svg>
        </div>

        <!-- Main Worksheet Display - Center -->
        <div style="
            position: absolute;
            top: 300px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        ">
            <div style="
                background: white;
                padding: 12px;
                border-radius: 12px;
                box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 8px 25px rgba(0,0,0,0.2);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/matching/sample-1.jpeg"
                    alt="Matching Worksheet Sample"
                    style="
                        width: 320px;
                        height: 414px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 6px;
                        display: block;
                    "
                />
            </div>
        </div>

        <!-- Subtitle Banner - Bottom -->
        <div style="
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <div style="
                display: inline-block;
                background: rgba(255,255,255,0.95);
                padding: 16px 40px;
                border-radius: 50px;
                box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            ">
                <span style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 26px;
                    color: #FF6B6B;
                    letter-spacing: 0.5px;
                ">Draw Lines to Match!</span>
            </div>
        </div>

        <!-- Decorative circles -->
        <div style="
            position: absolute;
            top: 350px;
            left: 30px;
            width: 25px;
            height: 25px;
            background: white;
            border-radius: 50%;
            opacity: 0.4;
        "></div>
        <div style="
            position: absolute;
            bottom: 200px;
            right: 40px;
            width: 35px;
            height: 35px;
            background: #FFD93D;
            border-radius: 50%;
            opacity: 0.6;
        "></div>
    </div>
</body>
</html>
