# Teaching package — use spatial position vocabulary (extended)
# Arc 6 Phase 1 (Path B) — early-literacy / vocabulary-acquisition strand.
# Companion to use-position-vocabulary (Arc 5 Phase 2). Extended preposition
# set covering 8 spatial prepositions: in, on, under, next-to, between,
# behind, in-front-of, above. Abstract concept; image-vocabulary supports
# rendering object-in-position scenes via existing prepositions app
# integration.

targetSlug: use-spatial-position-words
language: en
title:
  en: "Spatial Position Words (Extended) — using 8 spatial prepositions"
description:
  en: "Kindergarten-Grade 1 vocabulary-acquisition package teaching the use of 8 spatial position prepositions: in, on, under, next-to, between, behind, in-front-of, above. Builds on use-position-vocabulary (Arc 5 Phase 2; 4-preposition core: in/on/under/next-to). Adds 4 more spatial prepositions for richer position-description vocabulary. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher reviews the 4 prepositions from
      use-position-vocabulary (in, on, under, next-to) using a small toy
      and a box. Then introduces 4 new prepositions: "Now I'm putting the
      ball BEHIND the book. Now BETWEEN the two books. Now ABOVE the
      book." Class repeats each new preposition + does a matching gesture
      (hand behind back for "behind"; hands palm-down between two
      objects for "between"; hand-overhead for "above"; hand-out-front
      for "in-front-of"). Pin to the spatial-position-words area of the
      math-language word wall.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("The {item} is {position}
      the {anchor}"). Class reads chorally + acts out each strip with
      their own bodies (kids stand BEHIND a partner; BETWEEN two desks;
      IN-FRONT-OF a book on the table). Pair work: kid A places objects;
      kid B describes the positions using the appropriate preposition
      from the 8-set. Recast errors. Optional extension: kid A describes
      a position; kid B has to physically arrange objects to match — pure
      receptive-to-physical-action mapping.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: prepositions worksheet (kids fill in
      or multiple-choice the correct preposition for each scene; uses
      the extended 8-preposition set). Station 2: matching worksheet
      (preposition word matched to position-scene). Station 3:
      manipulative cut-outs spatial play (kids place cut-out animals
      in/on/under/next-to/between/behind/in-front-of/above a cut-out
      house using ALL 8 prepositions to describe the resulting scene).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher shows a position-scene picture;
      kids respond chorally with the preposition. Forward-pointer: "Today
      we learned 8 position words. When we come back to spatial words
      next, we'll talk about directions — left, right, up, down — and
      use them to navigate in the classroom."

