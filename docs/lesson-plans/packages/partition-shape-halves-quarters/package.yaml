assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify a circle, square, or rectangle partitioned
        into 2 equal parts as 'halves' in 7 of 10 trials.
      - Identify a circle, square, or rectangle partitioned
        into 4 equal parts as 'quarters' or 'fourths' in 7
        of 10 trials.
      - Distinguish equal-parts partition (halves, quarters)
        from unequal-parts partition (just pieces, no name)
        in 6 of 10 trials.
      - Reconstruct a whole shape from its partitioned parts
        (e.g., two half-circles into a whole circle; four
        quarter-squares into a whole square) in 7 of 10
        trials.
      - Use vocabulary 'halves' / 'quarters' / 'fourths' /
        'equal parts' / 'whole' correctly in 6 of 10
        productive-language trials.

    Differentiation:
    - Pre-K: skip partition entirely; review whole-shape
      recognition first (per Arc 9 identify-2d-shapes-basic).
    - K: introduce halves only (skip quarters); use hands-on
      paper-folding + cut-out manipulation as primary
      mode; defer formal vocabulary recall.
    - Grade 1: full halves + quarters partition fluency;
      both visual identification + verbal naming + hand-on
      reconstruction practiced.
    - Grade 2+: extend to thirds (per pair-partner identify-
      fractions-half-third-quarter at slot 4); bridge to
      CCSS.2.G.A.3 'partition into 2, 3, or 4 equal shares'.
      Formal fraction notation (1/2 + 1/4 + 1/3) remains
      explicitly deferred to Grade 3+ per CCSS.3.NF.A.

