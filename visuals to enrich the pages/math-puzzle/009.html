<!DOCTYPE html>

                    <img src="https://www.lessoncraftstudio.com/samples/german/math%20puzzle/sample-1.jpeg" style="width: 240px; height: 310px; object-fit: cover; display: block;" alt="Mathe-R&auml;tsel Hauptblatt">
                </div>

                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #C9A96E; letter-spacing: 1px;">Druckfertig</span>

                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #B76E79; letter-spacing: 1px;">Keine Vorbereitung</span>
