assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 22 of 26 uppercase letters in random order in 8 of 10
        trials.
      - Match a vocabulary picture to its initial uppercase letter on
        an alphabet strip in 8 of 10 trials.
      - Recognize uppercase letters within familiar words (e.g., own
        name) in 7 of 10 trials.

    Differentiation:
    - Pre-K: 13 most-frequent letters (vowels + frequent consonants:
      A, E, I, O, U, B, C, D, M, N, S, T, R).
    - K: all 26 uppercase letters.
    - Grade 1+: bridge to lowercase recognition (Arc 11+ candidate);
      uppercase + lowercase pairing.

