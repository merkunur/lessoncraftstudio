description:
  en: "Comprehensive K-3 bundle centered on insect vocabulary + life-cycle science + counting practice. 4 packages span world-knowledge living-things (describe-butterfly-life-cycle — Arc 14 Phase 1 anchor; insects as canonical metamorphosis subjects) + numeracy (count-objects-1-to-10 — insects as countable observable subjects) + biological reasoning (identify-living-vs-nonliving — insects as living things) + visual-discrimination (find-hidden-target-in-busy-scene — insects often blend into natural backgrounds; find-the-bug game). Cross-strand bundle leveraging the freshly-shipped describe-butterfly-life-cycle package. Suitable for a 4-week classroom unit on insects + spring-context biology; supports K-3 multilingual classrooms with outdoor-observation extension activities."

