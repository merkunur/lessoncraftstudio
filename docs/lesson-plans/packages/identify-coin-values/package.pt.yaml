assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Identificar todas as 5 moedas brasileiras (5
        centavos, 10 centavos, 25 centavos, 50 centavos,
        1 real) pelo nome ao ver a imagem da moeda em 8
        de 10 tentativas.
      - Dizer o valor de cada moeda (R$0,05 / R$0,10 /
        R$0,25 / R$0,50 / R$1,00) ao ver a imagem da
        moeda em 7 de 10 tentativas.
      - Distinguir o paradoxo aparência-vs-tamanho
        (reconhecer que o tamanho não corresponde
        diretamente ao valor) em 6 de 10 tentativas.
      - Contar por valor de moeda (contar de 5 em 5 com 5
        moedas de 5 centavos; contar de 10 em 10 com 5
        moedas de 10 centavos; contar de 25 em 25 com 4
        moedas de 25 centavos; contar de 50 em 50 com 2
        moedas de 50 centavos) em 5 de 10 tentativas.
      - Usar o vocabulário 'moeda' / 'centavo' / 'real' /
        'valor' / 'vale' corretamente em 5 de 10
        tentativas de produção verbal.

    Diferenciação:
    - Pré-escola: pular a identificação de valores de
      moeda inteiramente; revisar o reconhecimento de
      valor numérico primeiro (per Arc 12 count-objects-
      1-to-20).
    - Educação infantil (5-7 anos): introduzir apenas
      moedas de 5 + 10 centavos (pular 25 / 50 / 1 real);
      focar nos valores que se alinham com o trabalho de
      contagem por 5 e 10 do K.
    - 1.º ano: identificação completa das 5 moedas mas
      fluência limitada de contagem (contar de 5 em 5
      com moedas de 5 centavos é OK; contar de 25 em 25
      é difícil no 1.º ano).
    - 2.º ano: identificação completa das 5 moedas +
      contagem por valor de moeda + ponte para o
      parceiro-do-par recognize-money-amounts-up-to-1-
      unit para trabalho de problemas com texto.
    - 3.º ano em diante: estender às combinações de
      moedas + dar troco + comparar preços + introduzir
      cédulas R$2 / R$5 / R$10 / R$20 / R$50 / R$100
      (além do escopo K-3 deste pacote).

compositionalRationale:
  pt: |
    Adaptação locale-AUTÊNTICA do pacote canônico per
    operator-locked Path A no Arc 18 Phase 0 §A.13.6
    firings batch. ESTE ARQUIVO INCLUI MATERIALS LIST
    OVERRIDE — convenção Arc 7+ sparse-override
    INTENCIONALMENTE DEPARTIDA para esta commission
    específica (slots 2+3 da Fase 1.2). Outras commissions
    pt continuam a usar sparse-override sem alteração.

    Vocabulário pt-BR canônico para reconhecimento de
    moedas:
    - 'moeda' (canônico para coin); 'moedas' (plural)
    - 'centavo' / 'centavos' (cent / cents — a sub-
      unidade do real)
    - 'real' / 'reais' (real / reais — a unidade do
      sistema monetário brasileiro; R$1 = um real)
    - 'cédula' (banknote — distingue-se de moeda
      metálica; usado para R$2, R$5, R$10, R$20, R$50,
      R$100, mas R$1 existe tanto como moeda QUANTO
      como cédula no sistema atual)
    - 'valor' / 'vale' (value / is worth)
    - 'R$' símbolo monetário canônico brasileiro
    - notação canônica brasileira para valores: R$0,05 /
      R$0,10 / R$0,25 / R$0,50 / R$1,00 (vírgula
      decimal; espaço opcional entre R$ e número)

    Sistema monetário brasileiro K-3 + diferenças do USD:
    O sistema monetário brasileiro tem características
    estruturais distintas do USD que afetam a pedagogia
    K-3:
    1. **Moedas + cédulas como categorias separadas**:
       O Brasil tem moedas para 5, 10, 25, 50 centavos +
       R$1; CÉDULAS para R$2, R$5, R$10, R$20, R$50,
       R$100. (USD tem moedas até $1 mas também tem
       cédula de $1; o Brasil teve cédula de R$1
       descontinuada — atualmente R$1 é predominantemente
       moeda.) Este pacote K-3 foca apenas em MOEDAS
       (sub-unidade até R$1) — cédulas são conteúdo do
       3.º + 4.º ano.
    2. **Estrutura decimal limpa**: O sistema BRL tem
       MOEDAS decimais (5, 10, 25, 50 centavos + 1 real
       = 100 centavos), facilitando o trabalho de
       contagem decimal. O sistema USD inclui 25 cents
       como a maior moeda fracionária, que NÃO tem
       paralelo BRL direto (R$0,25 é decimal-friendly;
       quarter USD é semi-decimal — divisão por 4 do
       dollar).
    3. **Ausência da moeda de 1 centavo**: O Brasil
       descontinuou a moeda de 1 centavo em 2018 (a
       moeda ainda circula mas é cada vez mais rara).
       Este pacote NÃO ensina a moeda de 1 centavo —
       começa em 5 centavos. (USD ensina a penny como
       valor fundamental.)
    4. **Símbolo R$ vs $/¢**: O Brasil usa R$ unificado
       para reais E centavos (R$0,05 = 5 centavos); o
       USD separa $ (dólares) de ¢ (cents). Este pacote
       usa R$ exclusivamente per convenção brasileira.

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF02MA20 ('Resolver e elaborar problemas com números
    até três ordens, com os significados de juntar,
    acrescentar, separar, retirar, utilizando estratégias
    pessoais') é o anchor BNCC do 2.º ano; o
    reconhecimento de cédulas + moedas é conteúdo
    embutido nesse objetivo. EF03MA24 ('Resolver e
    elaborar problemas que envolvam a comparação e a
    equivalência de valores monetários do sistema
    brasileiro em situações de compra, venda e troca')
    é a extensão do 3.º ano que adiciona equivalência +
    troca. Este pacote (junto com o parceiro-do-par
    recognize-money-amounts) cobre o EF02MA20 anchor.

    Material concreto: o manipulative-cut-outs com
    vocabKeys enumerando 5 tipos de moedas brasileiras
    (centavo-5, centavo-10, centavo-25, centavo-50,
    real-1) com `mode: variety` é o material determinante
    para o trabalho de reconhecimento. As crianças pegam
    fisicamente cada tipo de moeda, contam quantas
    formam 1 real, e nomeiam o valor.

    **CARRY-FORWARD DE SUBSTRATO P2:** O substrato de
    imagem das vocabKeys de moedas brasileiras (centavo-5,
    centavo-10, centavo-25, centavo-50, real-1 imagens na
    image library + entradas em image-vocabulary.js) NÃO
    existe ainda no Phase 1.2 ship; a criação do
    substrato é adiada para o ciclo de fechamento P2 do
    Pillar 5 per §A.13.38 decoupled-ship discipline. O
    substrate-gap também afeta o pacote irmão en (que
    requer substrato USD); ambos os substratos (USD +
    BRL) são gerados em paralelo no P2 close-out.

    Por §A.13.30 enquadramento informal K-3: este pacote
    NÃO ensina aritmética monetária formal — apenas
    reconhecimento de moedas + valores. Famílias
    brasileiras às vezes perguntam por trabalho mais
    avançado (calcular troco; comparar preços); o
    parent-take-home-letter explicita que o objetivo do
    2.º ano EF é o reconhecimento fundamental, com
    aritmética monetária formal emergindo no 3.º + 4.º
    ano EF.

    Pacote-parceiro recognize-money-amounts-up-to-1-unit:
    juntos formam o módulo de dinheiro K-3 brasileiro.
    Professor pode ensinar identify-coin-values primeiro
    (semana 1), depois recognize-money-amounts (semana
    2) — a sequência canônica de duas semanas para
    cobrir o sistema monetário brasileiro no 2.º ano EF.
