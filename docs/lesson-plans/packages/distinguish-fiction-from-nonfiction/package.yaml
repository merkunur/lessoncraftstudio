assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify a story as fiction or nonfiction from a picture
        + brief text in 7 of 10 trials.
      - Name a specific CUE that signals fiction or nonfiction in
        5 of 8 trials (e.g., "talking animals = fiction";
        "photograph = nonfiction").
      - Sort 12 mixed story-cards into fiction vs nonfiction
        correctly in 6 of 10 attempts.
      - Use vocabulary 'fiction' / 'nonfiction' / 'real' / 'make-
        believe' correctly in 5 of 10 productive-language trials.

    Differentiation:
    - Pre-K: focus on real vs make-believe at the picture-cue
      level only; skip formal genre vocabulary.
    - K: full fiction-vs-nonfiction recognition with everyday
      vocabulary; introduce genre-cue-naming.
    - Grade 1: extend to multi-cue identification (multiple
      reasons a story is fiction or nonfiction); introduce
      sub-genre vocabulary (fairy tale, informational book).
    - Grade 2+: formal genre-theory introduction (realism vs
      fantasy; informational vs narrative nonfiction); bridge
      to text-feature recognition.

