<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Bilder-Kreuzwortr&auml;tsel - Baukasten Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #F0F4F8 0%, #E8ECF0 40%, #E2E8F0 100%); overflow: hidden;">

        <!-- Dot-grid pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.12; background-image: radial-gradient(circle, #90A4AE 1.2px, transparent 1.2px); background-size: 30px 30px;"></div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 28px; left: 30px; z-index: 100;">
            <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #FF8F00 0%, #FF6F00 100%); border-radius: 50%; box-shadow: 0 8px 24px rgba(255,111,0,0.4), inset 0 -3px 8px rgba(0,0,0,0.15), inset 0 3px 6px rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.6);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 23px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 38px; right: 38px; z-index: 100; background: #1A237E; padding: 11px 24px; border-radius: 28px; box-shadow: 0 4px 16px rgba(26,35,126,0.3);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: white; letter-spacing: 1.5px;">KLASSE K-3</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 90px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="margin: 0; line-height: 1.05;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 60px; color: #1A237E;">BILDER-</span>
            </h1>
            <h1 style="margin: 2px 0 0 0; line-height: 1.05;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 50px; color: #E53935;">KREUZWORTR&Auml;TSEL</span>
            </h1>
            <p style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; color: #43A047; margin: 8px 0 0 0;">Wort f&uuml;r Wort zum Ziel!</p>
        </div>

        <!-- 3 Column Progression Display -->
        <div style="position: absolute; top: 270px; left: 50%; transform: translateX(-50%); width: 850px; height: 440px; z-index: 20;">

            <!-- Connecting arrow: left to center -->
            <div style="position: absolute; top: 260px; left: 220px; z-index: 5;">
                <div style="width: 60px; height: 4px; background: linear-gradient(90deg, #E53935, #1A237E); border-radius: 2px;"></div>
                <div style="position: absolute; right: -8px; top: -5px; width: 0; height: 0; border-left: 12px solid #1A237E; border-top: 7px solid transparent; border-bottom: 7px solid transparent;"></div>
            </div>

            <!-- Connecting arrow: center to right -->
            <div style="position: absolute; top: 230px; right: 215px; z-index: 5;">
                <div style="width: 60px; height: 4px; background: linear-gradient(90deg, #1A237E, #43A047); border-radius: 2px;"></div>
                <div style="position: absolute; right: -8px; top: -5px; width: 0; height: 0; border-left: 12px solid #43A047; border-top: 7px solid transparent; border-bottom: 7px solid transparent;"></div>
            </div>

            <!-- Left column: Einsteiger (smallest, lowest) -->
            <div style="position: absolute; left: 30px; bottom: 0; text-align: center; width: 210px;">
                <!-- Level label -->
                <div style="background: #E53935; padding: 6px 18px; border-radius: 16px; display: inline-block; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(229,57,53,0.3);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: white; letter-spacing: 1px;">EINSTEIGER</span>
                </div>
                <!-- Worksheet -->
                <div style="width: 185px; height: 239px; background: white; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.15), 0 0 0 4px #E53935; overflow: hidden; margin: 0 auto;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/crossword/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Einsteiger Kreuzwortr&auml;tsel">
                </div>
            </div>

            <!-- Center column: Fortgeschritten (medium) -->
            <div style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; text-align: center; width: 230px;">
                <!-- Level label -->
                <div style="background: #1A237E; padding: 6px 18px; border-radius: 16px; display: inline-block; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(26,35,126,0.3);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: white; letter-spacing: 1px;">FORTGESCHRITTEN</span>
                </div>
                <!-- Worksheet -->
                <div style="width: 205px; height: 265px; background: white; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #1A237E; overflow: hidden; margin: 0 auto;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/crossword/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Fortgeschritten Kreuzwortr&auml;tsel">
                </div>
            </div>

            <!-- Right column: Profi (tallest) -->
            <div style="position: absolute; right: 30px; bottom: 0; text-align: center; width: 230px;">
                <!-- Level label -->
                <div style="background: #43A047; padding: 6px 18px; border-radius: 16px; display: inline-block; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(67,160,71,0.3);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: white; letter-spacing: 1px;">PROFI</span>
                </div>
                <!-- Worksheet -->
                <div style="width: 220px; height: 285px; background: white; border-radius: 10px; box-shadow: 0 12px 35px rgba(0,0,0,0.2), 0 0 0 4px #43A047; overflow: hidden; margin: 0 auto;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/crossword/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Profi Kreuzwortr&auml;tsel">
                </div>
            </div>
        </div>

        <!-- 3D building block motifs -->
        <div style="position: absolute; top: 185px; left: 55px; width: 35px; height: 35px; background: linear-gradient(135deg, #E53935, #C62828); border-radius: 6px; opacity: 0.5; box-shadow: 3px 3px 0 rgba(0,0,0,0.15);"></div>
        <div style="position: absolute; top: 210px; left: 70px; width: 25px; height: 25px; background: linear-gradient(135deg, #42A5F5, #1565C0); border-radius: 5px; opacity: 0.4; box-shadow: 2px 2px 0 rgba(0,0,0,0.12);"></div>
        <div style="position: absolute; top: 200px; right: 70px; width: 30px; height: 30px; background: linear-gradient(135deg, #66BB6A, #2E7D32); border-radius: 6px; opacity: 0.45; box-shadow: 3px 3px 0 rgba(0,0,0,0.15);"></div>
        <div style="position: absolute; top: 240px; right: 55px; width: 20px; height: 20px; background: linear-gradient(135deg, #FFA726, #E65100); border-radius: 4px; opacity: 0.4; box-shadow: 2px 2px 0 rgba(0,0,0,0.1);"></div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 100px; left: 0; right: 0; background: linear-gradient(90deg, rgba(26,35,126,0.92) 0%, rgba(40,53,147,0.92) 100%); padding: 14px 0; box-shadow: 0 -3px 15px rgba(0,0,0,0.08), 0 3px 15px rgba(0,0,0,0.08); z-index: 50;">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 25px; color: white; letter-spacing: 1.5px;">Schritt f&uuml;r Schritt zum Wortprofi!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 50;">
            <div style="background: white; padding: 10px 16px; border-radius: 24px; box-shadow: 0 3px 12px rgba(0,0,0,0.12); border: 3px solid #E53935;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #E53935;">Bilderhinweise</span>
            </div>
            <div style="background: white; padding: 10px 16px; border-radius: 24px; box-shadow: 0 3px 12px rgba(0,0,0,0.12); border: 3px solid #1A237E;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #1A237E;">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: white; padding: 10px 16px; border-radius: 24px; box-shadow: 0 3px 12px rgba(0,0,0,0.12); border: 3px solid #43A047;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #43A047;">3 Rastergr&ouml;&szlig;en</span>
            </div>
            <div style="background: white; padding: 10px 16px; border-radius: 24px; box-shadow: 0 3px 12px rgba(0,0,0,0.12); border: 3px solid #FF6F00;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #FF6F00;">Druckfertig</span>
            </div>
        </div>

    </div>
</body>
</html>
