# Teaching package — identify community places (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT per Arc 7 Phase 3 + Arc 3 Phase 1 sparse-override pattern.
# Arc 17 Phase 1.1 pt-cadence continuation (15th consecutive arc).
# SAT-CLOSING for community-and-roles canonical strand. Pairs to Arc 11
# identify-community-helpers pt variant (substrate-strand-pair). BR Portuguese
# register per CLAUDE.md §6 (pt = BR canonical); formal "você" address per §17.9.

title:
  pt: "Lugares da Comunidade — onde vamos no nosso bairro"

description:
  pt: "Pacote de conhecimento de mundo para Jardim de Infância / 1º ano do ensino fundamental ensinando vocabulário de lugares da comunidade. Constrói sobre o pacote Arco 11 identify-community-helpers (QUEM ajuda) introduzindo ONDE esses ajudantes trabalham + O QUE acontece em cada lugar. As crianças identificam lugares familiares da comunidade (escola, biblioteca, supermercado, hospital, posto de bombeiros, parque, padaria, agência dos correios) + nomeiam para que serve o lugar + relacionam lugares aos ajudantes da comunidade que trabalham lá. Pacote de FECHAMENTO da saturação: completa o fio canônico de community-and-roles em 3/3. Vocabulário fundamental de estudos sociais conectando crianças à consciência cívica + espacial-comunitária. Ancorado em vocabulário — nomes de lugares + vocabulário de função (\"vamos à biblioteca para ler livros\"; \"vamos ao posto de bombeiros quando há um incêndio\")."

structure:
  warmup:
    body: |
      Introdução ao mapa da comunidade para toda a turma. O
      professor ou a professora mostra imagens de 6-8 lugares da
      comunidade (escola, biblioteca, supermercado, hospital,
      posto de bombeiros, parque, padaria, agência dos correios).
      \"Estes são LUGARES na nossa comunidade — lugares onde vamos
      para fazer coisas diferentes. Quem esteve em um destes
      lugares esta semana?\" A turma compartilha (por exemplo,
      \"Fui ao supermercado com a minha mãe\"; \"Meu pai me leva
      ao parque depois da escola\"). A professora escreve os
      nomes dos lugares + pergunta: \"O que FAZEMOS em cada
      lugar?\" A turma descreve brevemente (\"aprendemos na
      escola\"; \"lemos livros na biblioteca\"; \"compramos comida
      no supermercado\"). Ênfase do padrão: \"Cada lugar tem uma
      FUNÇÃO — é a razão pela qual vamos lá.\" Conexão opcional
      com Arco 11 community-helpers: \"E quem ENCONTRAMOS em cada
      lugar? A professora na escola; a bibliotecária na
      biblioteca; o bombeiro no posto de bombeiros.\"

  contentActivity:
    body: |
      Trabalho em duplas + rotina de emparelhamento lugar-função.
      Cada dupla recebe 8 cartões com imagens de lugares da
      comunidade + 8 cartões de função/propósito. A dupla
      relaciona cada lugar à sua função primária (escola →
      \"aprendemos\"; biblioteca → \"lemos + emprestamos livros\";
      supermercado → \"compramos comida\"; hospital → \"vamos
      quando estamos doentes + consultamos médicos\"; posto de
      bombeiros → \"vamos quando há um incêndio\"; parque →
      \"brincamos + corremos + vemos árvores\"; padaria →
      \"compramos pão + bolos\"; agência dos correios → \"enviamos
      cartas + encomendas\"). Refraseie os erros com explicação
      (\"você relacionou a padaria com 'aprendemos' — vamos
      pensar: o que tem na padaria? Pão, bolos, biscoitos. O que
      FAZEMOS na padaria? COMPRAMOS pão e bolos. Relacione a
      padaria com 'compramos pão + bolos'\"). Extensão opcional:
      as crianças dramatizam visitar um lugar da comunidade (uma
      criança faz o papel de trabalhador-do-lugar; outra criança
      faz o papel de visitante; a turma adivinha o lugar a partir
      do diálogo). Cross-referência ao Arco 11: \"Quem trabalha
      neste lugar?\" — pontes lugares + ajudantes coerência do
      par de fios.

  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios de
      emparelhamento (imagem do lugar com par de nome do lugar).
      Estação 2: folha de exercícios picture-sort (lugar-da-
      comunidade vs não-lugar-da-comunidade: escola VAI EM
      lugares-da-comunidade; quarto-de-dormir VAI EM
      não-lugares-da-comunidade — lugares-dentro-de-nossa-casa
      vs lugares-fora-na-comunidade). Estação 3: folha de
      exercícios de emparelhamento (lugar → função primária).
      Estação 4: math-worksheet (contexto de contagem — quantos
      lugares da comunidade visitamos este mês; quantas pessoas
      veríamos no supermercado vs no parque; contagem como
      reflexão de engajamento comunitário).

  closure:
    body: |
      Compartilhamento de lugares-da-comunidade para toda a turma.
      A professora nomeia um lugar da comunidade; a turma nomeia a
      função primária + um ajudante-da-comunidade que trabalha lá.
      \"Biblioteca?\" — \"Lemos livros + a bibliotecária trabalha
      lá!\" \"Posto de bombeiros?\" — \"Vamos quando há um
      incêndio + os bombeiros trabalham lá!\" Indicador adiante:
      \"Hoje aprendemos sobre LUGARES da comunidade — onde vamos
      para fazer coisas diferentes. Agora aprendemos AJUDANTES da
      comunidade (as pessoas que nos ajudam) + LUGARES da
      comunidade (onde esses ajudantes trabalham). Quando
      voltarmos ao trabalho com a comunidade, pensaremos em COMO
      a nossa comunidade funciona como um todo — como todos os
      lugares + pessoas se conectam para fazer nosso bairro
      funcionar bem (candidato do Arco 18+).\"

compositionalRationale:
  pt: |
    Fio principal: conhecimento de mundo / community-and-roles
    (FECHAMENTO da saturação canônica em 2/3 → 3/3). Fio
    secundário: alfabetização inicial / aquisição de vocabulário
    (nomes de lugares + vocabulário de função). Fio terciário:
    conhecimento de mundo / time-and-routine (sequenciamento de
    quando-vamos-a-X da vida diária: rotinas de dia-de-semana
    visitam certos lugares; rotinas de fim-de-semana visitam
    outros).

    Significância arquitetural: este pacote FECHA o fio canônico
    community-and-roles em 3/3 — alvo canônico final para o fio.
    Pareia com Arco 11 identify-community-helpers: helpers
    identifica QUEM trabalha na comunidade; places identifica
    ONDE esses ajudantes trabalham + O QUE acontece em cada
    lugar. Juntos, o par constrói um substrato completo de
    vocabulário-comunitário: as crianças K-3 podem agora nomear
    as pessoas + os lugares + as funções do seu contexto cívico.
    Fio community-and-roles agora totalmente saturado; cobertura
    do domínio world-knowledge avança: 6 de 6 fios saturados
    pós-Arco 17 P1.1 (juntamente com share-and-take-turns PSED
    fechamento na mesma fase).

    Relevância cultural pt-BR específica: o vocabulário de
    lugares-da-comunidade é ALTAMENTE específico culturalmente —
    nomes de lugares + tipos de lugares variam entre locais
    pt-BR brasileiros. O contexto brasileiro inclui lugares de
    comunidade canônicos com forte presença regional: \"padaria\"
    como lugar cotidiano de café-da-manhã + pão-fresco (alta
    importância cultural pt-BR), \"feira\" (mercado de rua
    semanal) como lugar tradicional brasileiro distinto do
    supermercado, \"farmácia\" como local cívico com forte
    presença em bairros brasileiros, \"posto de saúde\" (UBS)
    como instituição cívica K-3-relevante específica do contexto
    pt-BR do SUS. Variantes regionais brasileiras podem incluir
    \"quitanda\" ou \"empório\" em regiões específicas. A
    professora pode adaptar o substrato para refletir o ambiente-
    comunitário local-brasileiro.

    Composição da classe world-knowledge: 7 materiais per
    disposição condicional de classe fan-out world-knowledge.
    REMOVE vocabulary-tracing-strips per convenção de classe
    world-knowledge — o rastreamento de nomes-de-lugares surge
    em interseções de fios letter-recognition + handwriting, não
    na contribuição primária world-knowledge onde o trabalho
    central é emparelhamento conceitual lugar-função em vez de
    prática de forma-de-letra.

    Nota de substrato: a biblioteca de imagens NÃO contém um tema
    dedicado community-places. O proxy de substrato usa o tema
    school-objects (que contém algumas imagens place-relevantes
    — livros + lousas para escola; pão + utensílios para
    contextos de padaria/cozinha; ferramentas para vários
    contextos de lugar-cívico). Esta é uma LIMITAÇÃO DE SUBSTRATO
    CONHECIDA per precedente identify-community-helpers (Arco 11)
    — extensão da biblioteca de imagens para imagens dedicadas
    community-places expandiria o substrato deste pacote; até
    então, as crianças trabalham com imagens place-adjacent
    disponíveis + a professora complementa com fotografias de
    lugares locais da comunidade quando possível.

    Substrato Class B FLEXIBLE: compõe-se contra o tema
    school-objects. Limitação de substrato reconhecida +
    REMOVE condicional de classe se aplica per classe
    world-knowledge.

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Nomear 6 de 8 lugares da comunidade (escola + biblioteca
        + supermercado + hospital + posto de bombeiros + parque
        + padaria + agência dos correios) a partir de prompts de
        imagem em 8 de 10 tentativas.
      - Relacionar lugar → função primária em 6 de 8 tentativas
        usando opções de 4 escolhas.
      - Distinguir lugares-da-comunidade de não-lugares-da-
        comunidade (lugares-fora-na-comunidade vs lugares-dentro-
        de-nossa-casa) em 8 de 10 tentativas de picture-sort.
      - Descrever um lugar-da-comunidade usando o quadro de frase
        \"Vamos ao(à) ___ para ___\" em 4 de 6 tentativas
        produtivas.

    Diferenciação:
      - Pré-K: 4 lugares mais familiares (escola + parque +
        supermercado + padaria); apenas emparelhamento receptivo;
        sem requisito de quadro de frase.
      - Jardim de Infância: conjunto completo de 8 lugares;
        emparelhamento + classificação categórica + introdução
        de quadro de frase.
      - 1º ano em diante: expansão para pensamento de comunidade-
        como-sistema (como os lugares-da-comunidade + ajudantes +
        rotinas se conectam?) + extensões de engajamento cívico
        (quem mais usa este lugar? quando está aberto? que regras
        se aplicam?) no Arco 18+ se arquivado; ponte para trabalho
        de comunidade-geográfica em estudos sociais.
