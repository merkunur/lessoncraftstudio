# Teaching package — identify the odd one out in a category set
# Arc 7 Phase 2 (Option A continuation; cognitive-and-executive-function /
# logical-reasoning strand). Class B FLEXIBLE; vocab-anchored. Companion
# concept to sort-by-category (Phase 2 sibling) — instead of grouping by
# category, kids identify the ONE item that doesn't belong to the dominant
# category.

targetSlug: identify-odd-one-out-by-category
language: en
title:
  en: "Odd One Out (by category) — find the item that doesn't belong"
description:
  en: "Kindergarten cognitive-and-executive-function package teaching odd-one-out reasoning by semantic category. Kids identify which of 4-5 items doesn't belong to the dominant category (e.g., 4 animals + 1 vehicle → vehicle is odd). Companion concept to sort-by-category (Phase 2 sibling) — same semantic-category awareness applied to exclusion-reasoning. Vocab-anchored. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher places 4 paper-cuts on the carpet
      (3 animals + 1 vehicle). "Look at these. Which one is different
      from the others?" Class identifies the vehicle. "Why?" Discussion:
      kids articulate the reasoning ("the others are animals; the car
      is a vehicle"). Repeat with 2-3 different sets. Reinforces
      odd-one-out reasoning + semantic-category awareness from sort-by-
      category (Phase 2 sibling).
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine. Teacher displays 4-5 item sets; class
      identifies the odd one out + explains why. Pair work: kid A picks
      a set with 3-4 items from one category + 1 from another; kid B
      identifies the odd. Recast errors with explanation. Optional
      extension: kids construct their own odd-one-out sets using
      cut-outs; partners solve each other's puzzles.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: odd-one-out worksheet (kids identify
      the odd item + circle it). Station 2: matching worksheet (image-
      name reinforces vocabulary). Station 3: manipulative cut-outs
      hands-on odd-one-out construction (kids build odd-one-out sets;
      partner solves; reinforces both production and recognition of
      the puzzle structure).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays a final set; class
      collectively identifies the odd one + articulates the reason.
      Forward-pointer: "Today we found the one that doesn't belong by
      category. When we come back to puzzles next, we'll find the odd
      one by ATTRIBUTE — not by what it IS, but by what color or shape
      or size makes it different."

