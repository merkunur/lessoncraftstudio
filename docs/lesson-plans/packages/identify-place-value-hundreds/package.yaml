compositionalRationale:
  en: |
    Primary strand: math / place-value (three-digit place-value
    for 100-999; deepens strand 3/8 → 4/8). Secondary strand:
    numeracy (counting + number-recognition extending into
    three-digit range). Tertiary strand: cognitive-and-executive-
    function / pattern-recognition (extending two-digit place-
    value pattern into three-digit; same rule, additional column).

    Architectural significance: extends Arc 15 Phase 4 tens-and-
    ones-51-to-100 from two-digit into three-digit range.
    Establishes the place-value pattern that scales (hundreds-
    tens-ones extends to thousands-hundreds-tens-ones for four-
    digit work in future arcs). Foundation for three-digit
    addition + subtraction with regrouping (Arc 17+ candidate
    — would build directly on this package's place-value
    fluency). Zero-as-placeholder edge cases emphasized — common
    misconception is to read 805 as 85 (skipping zero) or as
    850 (placing zero at end).

    Distinctive composition: 1 matching + 2 math-puzzle
    (decomposition) + 1 pattern-train + 1 more-less. Place-value
    decomposition emphasized; comparison work reinforces hundreds-
    first / tens-tiebreak / ones-tiebreak hierarchical comparison
    structure.

    Class B FLEXIBLE substrate: composes against miscellaneous
    theme (place-value work uses abstract numerical representation;
    no theme-specific imagery needed beyond cards).

    K-3 multilingual classroom relevance: place-value concept
    universal across 11 platform locales. Number-word patterns
    for 100-999 vary significantly: en regular "one hundred
    forty-seven" / "eight hundred five" (the word "and" is
    optional + AmE/BrE varies); de "einhundert-siebenundvierzig"
    (compound with reverse-decade); es "ciento-cuarenta-y-siete";
    fr "cent-quarante-sept" / "huit-cent-cinq"; pt "cento-e-
    quarenta-e-sete"; fi agglutinative compounds. Cross-locale
    place-value vocabulary: en "hundreds/tens/ones"; de
    "Hunderter/Zehner/Einer"; es "centenas/decenas/unidades";
    pt "centenas/dezenas/unidades"; fr "centaines/dizaines/unités".
    Locale-variant work at Phase 3+ adapts to each locale's
    number-word + place-value-vocabulary register.

