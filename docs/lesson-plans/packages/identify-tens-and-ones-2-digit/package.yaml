assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the tens digit and ones digit in a 2-digit
        numeral in 8 of 10 trials.
      - Decompose a 2-digit number into 'N tens and M ones'
        representation in 7 of 10 trials across the full 20-
        99 range.
      - Build a 2-digit number with base-ten manipulatives
        (N ten-sticks + M single-counters) in 7 of 10 trials.
      - Translate between decomposition and numeral (given '5
        tens and 3 ones', write 53; given 47, say 'four tens
        and seven ones') in 6 of 10 trials.
      - Handle the special case of numbers ending in 0 (60 =
        6 tens + 0 ones, not 6 tens + 10 ones) in 4 of 5
        trials.

    Differentiation:
    - Pre-K: skip 2-digit work entirely; build teen-number
      familiarity first via the sibling decompose-tens-and-
      ones-within-19 package.
    - K: introduce 2-digit decomposition for 20-50 range only;
      manipulative support heavily scaffolded; the tens-digit
      naming (twenty, thirty, forty, fifty) gets explicit
      vocabulary work.
    - Grade 1: full 20-99 decomposition fluency; both
      directions practiced (numeral → decomposition AND
      decomposition → numeral).
    - Grade 2+: extend to 3-digit place-value (hundreds +
      tens + ones) per the Arc 15 Phase 4 identify-place-
      value-hundreds package; bridge to expanded form (47 =
      40 + 7 as a written equation, not just a verbal
      decomposition).

