assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Trace 20 of 26 lowercase letters recognizably on
        the dotted-line template in 8 of 10 trials.
      - Independently form 15 of 26 lowercase letters
        recognizably (not perfectly — recognizably) in 7
        of 10 trials.
      - Distinguish visually-similar lowercase pairs
        (b/d, p/q, n/u, m/w) correctly in formation in 5
        of 8 trials.
      - Place ascender letters (b, d, f, h, k, l, t)
        with the tall part in the ascender zone (above
        x-height) in 6 of 10 trials.
      - Place descender letters (g, j, p, q, y) with the
        tail in the descender zone (below baseline) in 6
        of 10 trials.
      - Use vocabulary 'lowercase' / 'small letter' /
        'tall part' / 'tail' correctly in 5 of 10
        productive-language trials.

    Differentiation:
    - Pre-K: skip independent formation; tracing-only
      work on 8-10 most-frequent lowercase letters
      (vowels a/e/i/o/u + common consonants b/c/d/m/n/s/t).
      Pencil-grip development remains the primary motor
      goal at this age.
    - K: full 26-letter lowercase tracing fluency;
      independent formation on the most-frequent 13
      lowercase letters (a/e/i/o/u/b/c/d/m/n/s/t/r — the
      most commonly-used lowercase in K texts).
    - Grade 1: full 26-letter lowercase independent
      formation fluency; recognizability the load-bearing
      goal (not calligraphic perfection); visually-
      similar pair disambiguation explicitly assessed.
    - Grade 2+: brief reinforcement + bridge to form-
      numerals-0-to-10 (Arc 18 P1.2 candidate) +
      cursive-introduction work. By Grade 2 most kids
      transition to print-write fluency in both case
      forms; the dotted-template scaffolding falls away.

