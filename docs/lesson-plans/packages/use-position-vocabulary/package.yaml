compositionalRationale:
  en: |
    Primary strand: spatial-reasoning / fine-motor-and-visual-spatial.
    Secondary strand: vocabulary acquisition (preposition vocabulary as a
    closed-class function-word lexicon). Tertiary strand: language-frame
    production (sentence frames using prepositions).

    Architectural significance: this is the FIRST fine-motor-and-visual-
    spatial domain package in the catalog. Validates the spatial-reasoning
    architecture against existing prepositions app integration (the canonical
    app for this target). Per §A.14 scaling-checkpoint discipline.

    App-package layer relationship: the prepositions app (catalog deck-
    producer) generates worksheet decks for individual spatial-position
    exercises; this teaching package COMPOSES the app's exercises across
    multiple modes (fillin + multiplechoice) plus complementary matching
    work + sentence-strip materials + concrete manipulative play to deliver
    a complete pedagogical sequence. Different layers, complementary not
    redundant.

    Distinctive composition vs vocabulary packages: 3 of 5 composedExercises
    use the prepositions app (not 1) because the app's mechanical action
    IS the target — kids practice using prepositions IS the productive
    surface. Matching at position 3 reinforces preposition-to-visual-
    representation mapping. Two prepositions exercises in different modes
    (multiplechoice for introduction; fillin for production) reflect the
    receptive-then-productive teaching arc.

    Materials note: flashcards has empty vocabKeys (no IMAGE_VOCABULARY
    keys for prepositions themselves — they're abstract function words).
    The flashcards material is preserved at material-count 7 for
    consistency with the geometry-strand packages; in production the
    flashcards layer can render preposition-word cards (text-only) as a
    no-image variant. picture-cards + sentence-strips + manipulative-cut-
    outs use the animals theme for their image content (kids see animals
    in different positions; the position-words are the language target).

    Cross-strand integration: use-position-vocabulary feeds
    use-spatial-position-words (extension/companion package; same author-
    target with broader preposition set including "between," "behind," "in-
    front-of," "above"). The two together form the spatial-language
    foundation for fine-motor-and-visual-spatial domain.

    K-3 multilingual classroom relevance: prepositions are language-
    specific in their syntax (Spanish "encima de" vs English "on" vs
    German "auf" — different morphological patterns). The package uses
    the existing prepositions app which already handles 11-locale rendering;
    operator-side instruction language sets the rendered output. Per
    CLAUDE.md §17.5 NSR-flag posture, locale-specific preposition
    register may need native-speaker review at launch.

