# Teaching package — identify coin values (BRL canonical; FULL OVERRIDE per Path A)
# Arc 18 Phase 1.2 (20th-consecutive pt cadence; CONVENTION DEPARTURE per operator-locked Path A locale-money-system divergence). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF02MA20 (resolução de problemas envolvendo sistema monetário brasileiro: reconhecer cédulas e moedas).
#
# **CONVENTION DEPARTURE NOTICE per §A.13.34 + §A.13.6:**
# This file FULL-OVERRIDES the materials list (NOT inherited from package.yaml via Arc 7+ sparse-override merge). vocabKeys differ between locales because USD coins (penny/nickel/dime/quarter/dollar-bill) are NOT pedagogically valid for pt-BR locale — Brazilian K-3 kids do not encounter USD coins in daily life. Per operator-locked Path A at Arc 18 Phase 0 §A.13.6 firings batch: pt sibling authors BRL canonical content (5/10/25/50 centavos + R$1 real) with distinct vocabKey enumeration.
# This convention departure applies to THIS COMMISSION SPECIFICALLY (slots 2+3 of Phase 1.2). Other pt sparse-override packages (Arc 18 P1.1 4-package set; Phase 1.2 slots 1+4) continue the Arc 7+ sparse-override convention unchanged.

targetSlug: identify-coin-values
language: pt

title:
  pt: "Identificar os valores das moedas — quanto vale cada moeda?"

description:
  pt: "Pacote de matemática + grandezas e medidas para o 2.º ano do ensino fundamental, ABRINDO o sub-track de dinheiro no strand de medidas. Ensina crianças a identificar moedas brasileiras pelo seu valor: a MOEDA DE 5 CENTAVOS (vale 5 centavos), a MOEDA DE 10 CENTAVOS (vale 10 centavos), a MOEDA DE 25 CENTAVOS (vale 25 centavos), a MOEDA DE 50 CENTAVOS (vale 50 centavos), e a MOEDA DE 1 REAL (vale R$1 / cem centavos). Cada moeda é uma quantia DIFERENTE — as crianças têm de reconhecer cada moeda pela aparência + saber quanto cada uma vale. Pacote-parceiro de recognize-money-amounts-up-to-1-unit (slot 3 da Fase 1.2). Juntos o par fecha o sub-track de dinheiro 0/2 → 2/2 SAT. Alinhamento BNCC: EF02MA20 ('Resolver e elaborar problemas com números até três ordens, com os significados de juntar, acrescentar, separar, retirar, utilizando estratégias pessoais') + reconhecimento do sistema monetário brasileiro (cédulas + moedas). Por §A.13.30 enquadramento informal K-3: pedagogia de reconhecimento de moedas no 2.º ano é IDENTIFICAÇÃO DE VALOR-DE-MOEDA (reconhecer moeda → saber valor) + contagem-por-valor-de-moeda; NÃO aritmética monetária formal (que é conteúdo do 4.º + 5.º ano). 5 exercícios + 7 materiais imprimíveis ao longo de 1 semana. **NOTA DE DIVERGÊNCIA LOCALE-MONEY-SYSTEM per Path A do operador no Arc 18 Phase 0 §A.13.6 firings batch:** este pacote em pt autora conteúdo canonicamente brasileiro (BRL: 5/10/25/50 centavos + R$1 real); o irmão en em `package.yaml` autora conteúdo canonicamente americano (USD: penny / nickel / dime / quarter / dollar bill). A lista de materiais é FULL-OVERRIDE neste arquivo pt (NÃO herdada do package.yaml via merge sparse-override) porque os conjuntos de moedas diferem categoricamente. A convenção Arc 7+ sparse-override foi INTENCIONALMENTE DEPARTIDA para este commission para superficializar pedagogia monetária authentic-por-locale."

durationMinutes: 30

structure:
  warmup:
    body: |
      Introdução aos valores das moedas com toda a turma.
      Você mostra uma moeda real ou uma impressão grande
      de uma MOEDA DE 5 CENTAVOS: "Esta é a moeda de cinco
      centavos. Vale 5 centavos. Escrevemos como R$0,05."
      Depois uma MOEDA DE 10 CENTAVOS: "Esta é a moeda de
      dez centavos. É MAIOR do que a de cinco. Vale 10
      centavos. Escrevemos como R$0,10." Depois uma MOEDA
      DE 25 CENTAVOS: "Esta é a moeda de vinte e cinco
      centavos. Vale 25 centavos. Escrevemos como
      R$0,25." Depois uma MOEDA DE 50 CENTAVOS: "Esta é a
      moeda de cinquenta centavos. Vale 50 centavos.
      Escrevemos como R$0,50. É METADE DE UM REAL." Por
      fim a MOEDA DE 1 REAL: "Esta é a moeda de um real.
      Vale R$1 — ou, dizemos, UM REAL. UM REAL é o mesmo
      que CEM CENTAVOS. Escrevemos como R$1,00. O real é
      a unidade do nosso dinheiro." Ênfase do padrão: "As
      moedas têm TAMANHOS DIFERENTES mas o TAMANHO não te
      diz o valor — VOCÊ tem de APRENDER quanto vale cada
      moeda RECONHECENDO-A: pelo material, pela cor, pelo
      número escrito nela. As moedas brasileiras têm o
      VALOR ESCRITO no anverso — olhe + leia o número."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de correspondência
      moeda-valor. Cada dupla recebe um conjunto de
      recortes de moedas em papelão ou plastificadas
      (várias de cada: 5 centavos, 10 centavos, 25
      centavos, 50 centavos; mais 1-2 recortes de R$1) +
      cartões de valor (R$0,05; R$0,10; R$0,25; R$0,50;
      R$1,00). A dupla se reveza: a criança A pega uma
      moeda da pilha; a criança B identifica a moeda +
      encontra o cartão de valor correspondente. Ambas as
      crianças dizem em voz alta: "Esta é a moeda de
      [valor]. Vale [valor]." Recapture erros com pistas
      de aparência ("você disse que esta é a moeda de 25
      centavos, mas olhe — é a moeda de 50 CENTAVOS. As
      duas são douradas e redondas, mas a de 50 é MAIOR.
      Deixe-me mostrar lado a lado."). Extensão opcional:
      as crianças separam toda a pilha em 5 montinhos (5
      centavos, 10, 25, 50, 1 real) + contam quantas há
      de cada. O reconhecimento das moedas é determinante
      — crianças que não distinguem uma moeda de outra
      vão falhar no trabalho do slot 3 (contar quantias).
  scaffold:
    body: |
      Rotação por estações. Estação 1: atividade de
      correspondência — combinar cada imagem de moeda ao
      seu valor (5 centavos → R$0,05; 10 centavos →
      R$0,10; 25 centavos → R$0,25; 50 centavos →
      R$0,50; 1 real → R$1,00). Estação 2: atividade
      chart-count — contar por valores de moeda (contar
      de 5 em 5 com moedas de 5 centavos; contar de 10
      em 10 com moedas de 10 centavos; contar de 25 em
      25 com moedas de 25 centavos). Estação 3: atividade
      picture-sort — separar moedas por valor em caixas
      rotuladas com o valor da moeda. Estação 4:
      atividade math-worksheet — dada uma imagem de
      moeda, escrever o valor (R$0,05 / R$0,10 / R$0,25
      / R$0,50 / R$1,00).
  closure:
    body: |
      Recapitulação rápida com toda a turma. Você mostra
      uma moeda; a turma a nomeia + diz o valor em coro.
      "Cinco centavos!" "Cinquenta centavos!" "Vinte e
      cinco centavos!" "Dez centavos!" "Um real! Cem
      centavos!" Você faz a comparação diagnóstica: "Qual
      vale MAIS — cinco centavos ou cinquenta?" (Turma:
      CINQUENTA!) "Qual é MAIOR — cinco centavos ou dez?"
      (Turma: depende — pode variar! Mas a moeda de cinco
      é geralmente maior do que a de dez na medida
      atual.) "O TAMANHO da moeda não te diz o VALOR — é
      preciso aprender cada moeda!" Aponte adiante: "Hoje
      identificamos cinco valores de moeda brasileiros.
      Amanhã usamos esses valores para CONTAR QUANTIAS —
      quanto é 3 moedas de 10 centavos + 2 moedas de 25
      centavos + 1 moeda de 5 centavos? Quando vocês
      souberem CONTAR quantias até UM REAL, terão domínio
      da matemática monetária do 2.º ano."

