# Teaching package — classify animals by habitat
# Arc 5 Phase 2 (world-knowledge / living-things strand). First world-
# knowledge domain validation per §A.14 scaling-checkpoint discipline.
# Multi-cluster animal substrate (farm-animals + zoo-animals + pet-animals
# + sea-life clusters) — all CLEAN against IMAGE_VOCABULARY. Prerequisite:
# identify-and-name-10-farm-animals (Arc 1) — kids must know animal names
# before classifying them.

targetSlug: classify-animals-by-habitat
language: en
title:
  en: "Classify Animals by Habitat — farm, zoo, ocean, pets at home"
description:
  en: "Kindergarten-Grade 1 world-knowledge package teaching habitat classification of common animals. Bridges from animal-naming (Arc 1+4 vocabulary work) to scientific-classification thinking. Composed from existing farm-animals + zoo-animals + pet-animals + ocean-life IMAGE_VOCABULARY clusters. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher places 4 large mats on the carpet
      labeled "Farm," "Zoo," "Ocean," "Home (Pet)." Holds up an animal
      flashcard (cow); asks the class "where does the cow live?" Class
      answers chorally; teacher places the card on the Farm mat. Repeat
      with 4-5 mixed-habitat animals (lion → Zoo; fish → Ocean; cat → Home).
      Establishes the 4-habitat schema visually before the contentActivity.
  contentActivity:
    durationMinutes: 12
    body: |
      Whole-class sorting routine. Teacher names an animal in the target
      language; class points to the matching habitat-mat. Pair work: kid A
      names an animal; kid B says the habitat. Recast errors. Optional
      extension: kids share an animal they have at home (or seen at the
      zoo, or seen at a farm) to anchor classification in personal
      experience. Discussion question: "What does a habitat give an animal?"
      (food, shelter, water, safety) — bridges to deeper world-knowledge
      thinking without requiring formal vocabulary.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (sort animal cards
      between two contrasting habitats — farm vs zoo, or ocean vs land).
      Station 2: matching worksheet (image-name matching to reinforce animal-
      name vocabulary across the multi-cluster substrate). Station 3:
      manipulative cut-outs habitat sorting (kids physically place cut-out
      animals on the 4 habitat mats from warmup).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names an animal; kids show with
      hand-signal which habitat (point up = zoo; point down = ocean; point
      around = farm; point to themselves = home/pet). Forward-pointer:
      "Today we sorted animals by where they live. When we come back to
      animals next, we'll think about what animals eat — animals that eat
      plants, animals that eat other animals, animals that eat both."

