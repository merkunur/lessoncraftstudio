compositionalRationale:
  en: |
    Primary strand: math / numeral-recognition (recognize numerals
    1-20 — first numeral-recognition strand package). Secondary
    strand: numeracy (numeral-quantity correspondence). Tertiary
    strand: vocabulary-acquisition (number words for 1-20).

    Architectural significance: founds the numeral-recognition
    strand (currently 0/4; this package brings to 1/4). Builds
    on Arc 9-12 count-objects + match-numeral-to-quantity-1-to-10
    numeracy foundation. Critical bridge from counting-by-saying
    (oral) to reading-written-numerals (visual). Foundation for
    later place-value work + arithmetic involving written
    notation.

    Distinctive composition: 2 matching + 2 pattern-train + 1
    missing-pieces. Numeral-recognition emphasized throughout;
    pattern-train work for numeral-sequencing (1, 2, 3, ...);
    missing-pieces for sequence-gap-detection.

    Class B FLEXIBLE substrate: composes against miscellaneous
    image-library theme; numeral-recognition work uses abstract
    numerical representation (no specific theme content needed).
    Numeral-cards material is the canonical recognition-practice
    substrate.

    K-3 multilingual classroom relevance: numeral SYMBOLS are
    universal across 11 platform locales (1-20 written-numerals
    use Hindu-Arabic numerals universally). Number WORDS vary
    significantly across locales: en (one-twenty with irregular
    teens), es (uno-veinte with regular teens), de (eins-zwanzig
    with reverse-decade teens like 'einundzwanzig'), fi (yksi-
    kaksikymmentä with agglutinative structure). Locale-variant
    work at Phase 3+ adapts to each locale's number-word system
    + teens-irregularity per locale.

