# Teaching package — identify and name 10 fruits
# Arc 2 Phase 3b. Vocab keys verified: apple, banana, orange, pear, lemon,
# watermelon, cherry, peach, strawberry, grapes (10/10 with full 11-locale
# IMAGE_VOCABULARY entries).

targetSlug: identify-and-name-fruits
language: en

title:
  en: "Fruits — identify and name 10"
description:
  en: "K-Grade 1 vocabulary-acquisition package for 10 common fruits: apple, banana, orange, pear, lemon, watermelon, cherry, peach, strawberry, grapes. 5 worksheet exercises + 8 printable materials. Theme-agnostic; operator selects target instruction language at material-render time."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up flashcards, names each fruit in
      target language, class repeats chorally. Optional: bring real fruit (or
      plastic models) for sensory engagement — kids touch, smell, identify.
      Pin cards to "Fruits" word wall cluster.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("I see a {item}"). Choral reading
      first, then individual reads. Pair work: kids hold a picture-card, partner
      names the fruit. Recast errors in the target frame.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: image-letter matching (matching app, letter
      mode). Station 2: picture-card sorting on the carpet (red fruits vs yellow
      vs green vs other — color-attribute sorting). Station 3: manipulative
      cut-outs counting ("count out 5 apples").
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Final challenge: teacher names a fruit, kids point
      to flashcard. Forward-pointer: "Today we learned 10 fruit words. When we
      come back to fruits next, this same set will be here for us."

