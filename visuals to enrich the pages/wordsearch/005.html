<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>W&ouml;rtersuche - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(170deg, #FFF7ED 0%, #FFEDD5 45%, #E0F2FE 100%);">

        <!-- Diagonal stripe overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image: repeating-linear-gradient(135deg, #94A3B8 0px, #94A3B8 1px, transparent 1px, transparent 30px); pointer-events: none;"></div>

        <!-- GRATIS tab hanging from top -->
        <div style="position: absolute; top: 0; left: 40px; z-index: 20;">
            <div style="background: #0EA5E9; padding: 14px 22px 18px 22px; border-radius: 0 0 12px 12px; box-shadow: 0 6px 20px rgba(14,165,233,0.35);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: white;">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge - emerald pill -->
        <div style="position: absolute; top: 30px; right: 30px; z-index: 20;">
            <div style="background: #059669; padding: 11px 22px; border-radius: 26px; box-shadow: 0 4px 14px rgba(5,150,105,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; color: white; letter-spacing: 1.5px;">VORSCHULE &ndash; 2. KLASSE</span>
            </div>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 80px; left: 0; right: 0; text-align: center; z-index: 10;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 66px; color: #1E3A5F; margin: 0; line-height: 1.1;">Alles dabei!</h1>
            <!-- Orange gradient underline bar -->
            <div style="width: 320px; height: 6px; background: linear-gradient(90deg, #F97316, #FBBF24); border-radius: 3px; margin: 10px auto 0 auto;"></div>
            <p style="font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 700; color: #64748B; margin: 14px 0 0 0;">W&ouml;rtersuche mit Bildhinweisen</p>
        </div>

        <!-- 5 Feature circles in an arc -->
        <div style="position: absolute; top: 220px; left: 50%; transform: translateX(-50%); width: 860px; height: 160px;">
            <!-- Circle 1: Bildhinweise (sky blue) -->
            <div style="position: absolute; left: 30px; top: 20px; text-align: center;">
                <div style="width: 110px; height: 110px; background: #E0F2FE; border: 3px solid #FBBF24; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.08);">
                    <span style="font-size: 42px;">&#128444;</span>
                </div>
                <p style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: #1E3A5F; margin: 8px 0 0 0;">Bildhinweise</p>
            </div>
            <!-- Circle 2: L&ouml;sungsbl&auml;tter (teal) -->
            <div style="position: absolute; left: 200px; top: 5px; text-align: center;">
                <div style="width: 115px; height: 115px; background: #CCFBF1; border: 3px solid #FBBF24; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.08);">
                    <span style="font-size: 42px;">&#128273;</span>
                </div>
                <p style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: #1E3A5F; margin: 8px 0 0 0;">L&ouml;sungsbl&auml;tter</p>
            </div>
            <!-- Circle 3: Viele Themen (orange, largest) -->
            <div style="position: absolute; left: 50%; transform: translateX(-50%); top: 0; text-align: center;">
                <div style="width: 135px; height: 135px; background: #FFF7ED; border: 4px solid #FBBF24; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 22px rgba(251,191,36,0.25);">
                    <span style="font-size: 52px;">&#127912;</span>
                </div>
                <p style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; color: #1E3A5F; margin: 8px 0 0 0;">Viele Themen</p>
            </div>
            <!-- Circle 4: Druckfertig (emerald) -->
            <div style="position: absolute; right: 200px; top: 5px; text-align: center;">
                <div style="width: 115px; height: 115px; background: #D1FAE5; border: 3px solid #FBBF24; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.08);">
                    <span style="font-size: 42px;">&#128424;</span>
                </div>
                <p style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: #1E3A5F; margin: 8px 0 0 0;">Druckfertig</p>
            </div>
            <!-- Circle 5: Deutsche Umlaute (rose) -->
            <div style="position: absolute; right: 30px; top: 20px; text-align: center;">
                <div style="width: 110px; height: 110px; background: #FFE4E6; border: 3px solid #FBBF24; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.08);">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 32px; font-weight: 700; color: #E11D48;">&Auml;&Ouml;&Uuml;</span>
                </div>
                <p style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; color: #1E3A5F; margin: 8px 0 0 0;">Deutsche Umlaute</p>
            </div>
        </div>

        <!-- Side-by-side worksheet + answer key display -->
        <div style="position: absolute; top: 435px; left: 50%; transform: translateX(-50%); display: flex; gap: 50px; align-items: flex-start;">
            <!-- Worksheet -->
            <div style="text-align: center;">
                <div style="width: 260px; height: 337px; background: white; border-radius: 10px; box-shadow: 0 10px 35px rgba(0,0,0,0.12); overflow: hidden; border: 4px solid #0EA5E9;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/wordsearch/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="W&ouml;rtersuche Arbeitsblatt">
                </div>
                <div style="margin-top: 10px; background: #0EA5E9; display: inline-block; padding: 6px 20px; border-radius: 16px;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; color: white; letter-spacing: 1px;">ARBEITSBLATT</span>
                </div>
            </div>

            <!-- Arrow between -->
            <div style="margin-top: 150px;">
                <span style="font-size: 40px; color: #F97316;">&#10132;</span>
            </div>

            <!-- Answer key -->
            <div style="text-align: center;">
                <div style="width: 260px; height: 337px; background: white; border-radius: 10px; box-shadow: 0 10px 35px rgba(0,0,0,0.12); overflow: hidden; border: 4px solid #0D9488;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/wordsearch/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="W&ouml;rtersuche L&ouml;sungsblatt">
                </div>
                <div style="margin-top: 10px; background: #0D9488; display: inline-block; padding: 6px 20px; border-radius: 16px;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; color: white; letter-spacing: 1px;">L&Ouml;SUNGSBLATT</span>
                </div>
            </div>
        </div>

        <!-- Bottom connector text -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);">
            <div style="background: linear-gradient(90deg, #F97316, #FBBF24); padding: 12px 40px; border-radius: 30px; box-shadow: 0 4px 16px rgba(249,115,22,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: white;">Arbeitsblatt + L&ouml;sung = komplett!</span>
            </div>
        </div>

    </div>
</body>
</html>
