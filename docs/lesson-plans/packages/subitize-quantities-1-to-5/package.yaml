compositionalRationale:
  en: |
    Primary strand: subitization (foundational pre-numeracy; learning-targets.json
    places this in early-numeracy / counting-and-cardinality strand).
    Secondary strand: pattern recognition (kids notice that 5 fish and 5
    dots and 5 fingers are all the same "fiveness").
    Tertiary strand: language-frame production (there-are-count-plural
    sentence strips integrate count + plural-noun morphology).

    Distinctive material weighting: numeral-cards 1-5 only (matches subitization
    range — extending past 5 risks shifting kids back to counting). picture-cards
    + manipulative-cut-outs both used for partner-flash drills (key pedagogical
    practice for subitization is repeated short-burst exposure, not extended
    contemplation). chart-count app appears twice (positions 1 + 5) as the
    cleanest assessment surface — kid sees N objects, writes N without
    counting.

curriculumStandards:
  - CCSS.K.CC.B.4
  - CCSS.K.CC.B.5
  - EYFS.ELG.M

assessmentCriteria:
  en: |
    By end of 1-2 week unit:
      - Subitize quantities 1-3 instantly in 9 of 10 trials.
      - Subitize quantities 4-5 in 7 of 10 trials.
      - Recognize that 5 dots / 5 fish / 5 fingers represent the same quantity
        (cross-representation transfer).

    Differentiation:
    - Pre-K: subitize 1-3 only.
    - K: full range 1-5.
    - Grade 1+: extend to subitize 6-10 via doubles + plus-one patterns
      (5+1, 5+2, etc.) — bridges to add-within-10.

