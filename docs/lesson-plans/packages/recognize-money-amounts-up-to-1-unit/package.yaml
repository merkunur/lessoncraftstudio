assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Count a coin-pile of 2-3 coins (e.g., 1 quarter
        + 2 dimes) to the correct total amount in 7 of
        10 trials.
      - Count a coin-pile of 4-5 coins (e.g., 1 quarter
        + 2 dimes + 1 nickel + 2 pennies = 52¢) to the
        correct total in 5 of 10 trials.
      - Make a target amount from a coin palette (e.g.,
        "show me 40¢" → select 1 quarter + 1 dime + 1
        nickel; OR 4 dimes; OR 8 nickels) in 6 of 10
        trials.
      - Recognize that $1 can be made multiple ways (4
        quarters / 10 dimes / 20 nickels / 100 pennies +
        combinations) in 5 of 10 trials.
      - Use vocabulary 'amount' / 'total' / 'count' /
        'cents' / 'dollar' correctly in 5 of 10
        productive-language trials.

    Differentiation:
    - Pre-K: skip amount counting entirely; coin-
      recognition work (pair partner identify-coin-
      values) is the K coverage.
    - K: introduce amount counting with only same-coin
      piles (e.g., 4 dimes = 40¢; 3 nickels = 15¢);
      mixed-coin piles deferred to Grade 1+.
    - Grade 1: amount counting with 2-coin mixed piles
      (1 quarter + 1 dime, etc.); skip-count fluency
      with 5s + 10s established; 25-count deferred.
    - Grade 2: full amount-counting fluency up to $1;
      mixed-coin piles + combination-multiplicity
      practiced; bridge to make-target-amount work.
    - Grade 3+: extend to dollar bills ($5 / $10 / $20);
      making change (subtraction-based); comparing
      prices; introducing percent (which is fundamentally
      based on per-100 / cents-per-dollar).

