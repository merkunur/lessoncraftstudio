<!DOCTYPE html>

<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">

        <!-- Corner Flourishes -->
        <svg style="position: absolute; top: 45px; left: 45px;" width="80" height="80" viewBox="0 0 80 80">

                align-items: center;
                justify-content: center;

            transform: translateX(-50%);
            display: flex;
            gap: 50px;
            z-index: 15;

                    background: white;
                    padding: 10px;

                        src="https://www.lessoncraftstudio.com/samples/english/matching/sample-1-answer.jpeg"

                            width: 200px;
                            height: 259px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 4px;
                            display: block;

                    font-family: 'Nunito', sans-serif;

                    margin-top: 10px;

                <circle cx="65" cy="65" r="45" fill="#1E3A5F"/>
                <circle cx="65" cy="65" r="40" fill="#FFD700"/>
                <circle cx="65" cy="65" r="35" fill="#1E3A5F"/>

            <div style="
                position: absolute;
                top: 50%;

                transform: translate(-50%, -50%);

            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 12px;
                    color: #FFD700;
                    display: block;
                    letter-spacing: 1px;
                ">TEACHER'S</span>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 14px;
                    color: #FFD700;
                    display: block;
                ">CHOICE</span>
            </div>
        </div>

        <div style="
            position: absolute;
            top: 180px;
            left: 60px;
            transform: rotate(-8deg);
            z-index: 20;

            <div style="
                background: linear-gradient(180deg, #C41E3A 0%, #A01830 100%);
                color: white;
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 20px;
                padding: 12px 25px;
                position: relative;
                box-shadow: 0 4px 15px rgba(196, 30, 58, 0.4);
            ">
                NO PREP REQUIRED
                <!-- Ribbon tails -->
                <div style="
                    position: absolute;
                    left: -15px;
                    top: 0;
                    width: 0;
                    height: 0;
                    border-top: 22px solid transparent;
                    border-bottom: 22px solid transparent;
                    border-right: 15px solid #C41E3A;

                <div style="
                    position: absolute;
                    right: -15px;
                    top: 0;
                    width: 0;
                    height: 0;

            position: absolute;
            bottom: 145px;

                    <path d="M 28 50 L 43 65 L 72 36" stroke="#1E3A5F" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 20px;
                    color: #1E3A5F;

            bottom: 60px;
            left: 50%;

            align-items: center;
            gap: 30px;
            z-index: 15;

            <div style="
                background: linear-gradient(135deg, #C41E3A 0%, #A01830 100%);
                color: white;
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 28px;
                padding: 12px 28px;
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(196, 30, 58, 0.3);
                letter-spacing: 1px;
            ">FREE</div>

            <div style="
                background: #1E3A5F;
                color: white;
                font-family: 'Nunito', sans-serif;
                font-weight: 600;
                font-size: 22px;
                padding: 12px 25px;
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(30, 58, 95, 0.3);

        </div>

        <!-- Subtle pattern overlay -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.03; pointer-events: none;" viewBox="0 0 100 100">
            <pattern id="diagonalLines" patternUnits="userSpaceOnUse" width="10" height="10">
                <line x1="0" y1="10" x2="10" y2="0" stroke="#1E3A5F" stroke-width="0.5"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#diagonalLines)"/>
        </svg>
