# Teaching package — count syllables in words (1-3 syllables)
# Arc 11 Phase 2 (Option F single-package-strand deepening; early-literacy
# / phonological-awareness strand 1/9 → 2/9). RESOLVES Arc 10 identify-
# rhyming-pairs forward-pointer.

targetSlug: count-syllables-1-to-3
language: en
title:
  en: "Counting Syllables — beats in words"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching syllable counting. Builds on Arc 10 identify-rhyming-pairs (phonological-awareness strand). RESOLVES Arc 10 forward-pointer ('count SYLLABLES — beats in words next'). Foundational pre-reading skill: kids count syllables (BEATS) in words by clapping (cat = 1; ban-ana = 2; ba-na-na = 3). Bridges rhyme-recognition to syllable-segmentation in phonological-awareness progression. Composes against matching + word-guess apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class clap-the-syllables routine. Teacher says a word +
      claps each syllable: "Cat" = 1 clap. "Ban-ana" = clap-clap-clap
      = 3 claps. "Pen-cil" = 2 claps. Class follows along + claps the
      same syllables. Repeat with 6-8 words: dog (1), table (2),
      elephant (3), car (1), apple (2), butterfly (3). Reinforces
      syllable-as-beat through kinesthetic clapping.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + clap-and-count routine. Each pair receives 12 picture
      cards across 1-syllable, 2-syllable, and 3-syllable categories
      (cat, dog, sun, fish — 1; apple, table, monkey, banana — 2-3;
      elephant, butterfly, computer — 3). Pair takes turns: kid A
      shows a card; kid B claps the word's syllables + says the count.
      Recast errors with explanation ('you said BANANA has 2 — let's
      clap it: ba-na-na — that's 3 claps, 3 syllables'). Optional
      extension: kids sort cards into 1/2/3 syllable piles.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (image to
      syllable-count number). Station 2: picture-sort worksheet (kids
      sort pictures by syllable count: 1-syllable pile vs 2-syllable
      pile vs 3-syllable pile). Station 3: manipulative cut-outs hands-
      on syllable-clap (kids place objects + clap syllables of each
      object's name). Station 4: word-guess (kids fill in syllables
      by clapping; reinforces beat-letter mapping).
  closure:
    durationMinutes: 5
    body: |
      Whole-class syllable-quiz routine. Teacher says a word; class
      claps + counts collectively. Forward-pointer: "Today we counted
      SYLLABLES — the beats in words. When we come back to phonological
      work next, we'll work on BLENDING — taking apart and putting
      together the sounds inside a syllable: c-a-t blends to make
      'cat'."

