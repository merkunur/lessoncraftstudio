thematicCoherence:
  en: |
    All 5 packages cohere around the hospital theme + form a
    cross-strand progression with distinctive emotional-preparation
    focus through emotion-regulation strand inclusion.

    **Pedagogical sequencing:**
    1. **identify-and-name-action-verbs** — Foundational hospital-action
       vocabulary (examine, listen, bandage, heal, rest, medicine, X-ray,
       check). Same shared package with music-bundle + post-office-bundle
       + classroom-bundle (~9 bundles use this package). Hospital-context
       substantiates verb-vocabulary with concrete care-action observations.
    2. **identify-community-helpers** — Community-roles work extending
       to medical workers (doctor, nurse, paramedic, surgeon, dentist).
       Same shared package with classroom + post-office + at-the-supermarket
       bundles; hospital adds high-frequency K-3-visible medical helpers.
    3. **regulate-emotions-with-strategies** — Critical emotional-
       preparation work. Hospital context naturally elicits big feelings
       (scared, worried, sad, frustrated when sick). Calming strategies
       package teaches DEEP BREATHING + SAFE PLACE + COUNT TO TEN +
       MOVE BODY + ASK FOR HELP — all directly applicable at doctor
       visits + hospital stays + during illness. From Arc 15 Phase 4.
    4. **count-objects-1-to-10** — Counting practice using hospital
       items as countable subjects (3 bandaids; 5 pills in a bottle;
       2 thermometers; 8 hospital beds). Same shared package across
       many bundles; hospital-context authentic real-world counting.
    5. **sort-by-category** — Category-classification work distinguishing
       emergency vs routine vs preventive care OR sorting by body-system
       (heart-related vs lung-related vs bone-related medical tools).
       Connects sorting strand to anatomical-awareness work.

    **Strand spread:** 1 vocabulary-acquisition (action-verbs) + 1
    community-and-roles + 1 personal-social-emotional-development
    (emotion-regulation) + 1 numeracy + 1 cognitive-sorting.
    **5 distinct strands.** Distinguishes from other community-context
    bundles by emotion-regulation strand inclusion — hospital is the
    canonical community-context where emotional-preparation matters most.

    **Suggested unit duration:** 4-5 weeks (1 package per week).
    Natural fit before flu season (autumn) OR after a class member's
    hospitalization (with parental permission) — emotional-preparation
    timing is operator-strategic.

    **Multilingual classroom relevance:** hospital vocabulary cognate-
    rich Romance (hospital / hôpital / ospedale); Germanic distinct
    (Krankenhaus / ziekenhuis / sjukhus / sairaala). Medical-helper
    vocabulary varies (doctor / Arzt / médico / dottore / läkare / lääkäri).
    Particularly load-bearing for K-3 multilingual classrooms with
    family-medical contexts — multilingual kids often interpret for
    family members at medical appointments; classroom medical-vocabulary
    work in target language supports broader family communication.

    **Pillar 2 architectural pattern:** hospital-bundle exemplifies
    emotion-regulation-anchored community-context bundle composition.
    Theme-axis-key community-context-hospital (vs post-office-bundle
    at transactional-communication anchor; vs classroom-bundle at
    school-context). Distinctively bridges community-roles + emotion-
    regulation strands — first bundle to combine these two anchors.
    Precedent for school-counselor-bundle / therapist-bundle / dentist-
    bundle candidates in future arcs where emotional-preparation
    bridges community-roles work.
