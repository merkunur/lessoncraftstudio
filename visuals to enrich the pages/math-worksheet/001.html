<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPT Thumbnail - Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(135deg, #F3E8FF 0%, #DBEAFE 50%, #FED7AA 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Sparkle effects -->
        <div style="position: absolute; top: 80px; left: 120px; width: 12px; height: 12px; background: #FBBF24; border-radius: 50%; box-shadow: 0 0 20px #FBBF24;"></div>
        <div style="position: absolute; top: 140px; right: 180px; width: 8px; height: 8px; background: #FBBF24; border-radius: 50%; box-shadow: 0 0 15px #FBBF24;"></div>
        <div style="position: absolute; top: 200px; left: 80px; width: 6px; height: 6px; background: #FBBF24; border-radius: 50%; box-shadow: 0 0 12px #FBBF24;"></div>
        <div style="position: absolute; top: 100px; right: 100px; width: 10px; height: 10px; background: #FBBF24; border-radius: 50%; box-shadow: 0 0 18px #FBBF24;"></div>

        <!-- FREE Badge -->
        <div style="
            position: absolute;
            top: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, #F97316, #EA580C);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-8deg);
            box-shadow: 0 8px 25px rgba(249, 115, 22, 0.4);
            z-index: 10;
        ">
            <span style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 32px;
                color: white;
                text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            ">FREE</span>
        </div>

        <!-- Grades Badge -->
        <div style="
            position: absolute;
            top: 45px;
            right: 40px;
            background: linear-gradient(145deg, #7C3AED, #6D28D9);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.3);
        ">
            <span style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 22px;
                color: white;
            ">GRADES K-2</span>
        </div>

        <!-- Main Title -->
        <div style="
            position: absolute;
            top: 160px;
            left: 0;
            right: 0;
            text-align: center;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 72px;
                color: #5B21B6;
                margin: 0;
                text-shadow: 0 4px 8px rgba(91, 33, 182, 0.15);
                letter-spacing: -1px;
            ">PICTURE ALGEBRA</h1>
            <p style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 36px;
                color: #7C3AED;
                margin: 8px 0 0 0;
            ">For Little Mathematicians</p>
        </div>

        <!-- Main Worksheet Container -->
        <div style="
            position: absolute;
            top: 320px;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 480px;
            background: white;
            border-radius: 16px;
            padding: 12px;
            box-shadow:
                0 25px 50px rgba(91, 33, 182, 0.25),
                0 10px 20px rgba(91, 33, 182, 0.15),
                inset 0 0 0 3px rgba(124, 58, 237, 0.1);
        ">
            <img src="https://www.lessoncraftstudio.com/samples/english/math%20worksheet/sample-1.jpeg"
                 alt="Math Worksheet Sample"
                 style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
        </div>

        <!-- Floating Icons - Left side -->
        <div style="
            position: absolute;
            top: 400px;
            left: 80px;
            font-size: 56px;
            transform: rotate(-10deg);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        ">🐧</div>

        <div style="
            position: absolute;
            top: 580px;
            left: 60px;
            font-size: 48px;
            transform: rotate(8deg);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        ">🐰</div>

        <!-- Floating Icons - Right side -->
        <div style="
            position: absolute;
            top: 420px;
            right: 70px;
            font-size: 52px;
            transform: rotate(12deg);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        ">🦧</div>

        <div style="
            position: absolute;
            top: 600px;
            right: 90px;
            font-size: 44px;
            transform: rotate(-6deg);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        ">🍪</div>

        <!-- Orange Banner -->
        <div style="
            position: absolute;
            bottom: 130px;
            left: 0;
            right: 0;
            background: linear-gradient(90deg, #F97316, #FB923C, #F97316);
            padding: 18px 0;
            box-shadow: 0 4px 20px rgba(249, 115, 22, 0.3);
        ">
            <p style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 32px;
                color: white;
                text-align: center;
                margin: 0;
                text-shadow: 0 2px 4px rgba(0,0,0,0.15);
            ">"Where Pictures Become Numbers!"</p>
        </div>

        <!-- Feature Pills -->
        <div style="
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        ">
            <div style="
                background: white;
                border: 3px solid #7C3AED;
                border-radius: 25px;
                padding: 12px 24px;
                box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
            ">
                <span style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 18px;
                    color: #5B21B6;
                ">🧩 Puzzles</span>
            </div>
            <div style="
                background: white;
                border: 3px solid #3B82F6;
                border-radius: 25px;
                padding: 12px 24px;
                box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
            ">
                <span style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 18px;
                    color: #1D4ED8;
                ">🎨 Multiple Themes</span>
            </div>
            <div style="
                background: white;
                border: 3px solid #F97316;
                border-radius: 25px;
                padding: 12px 24px;
                box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
            ">
                <span style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 18px;
                    color: #C2410C;
                ">🔑 Answer Keys</span>
            </div>
        </div>
    </div>
</body>
</html>
