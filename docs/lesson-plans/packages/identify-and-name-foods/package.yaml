compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition. Secondary strand: phonics
    (matching letter mode). Tertiary strand: sorting + categorization
    (solids-vs-liquids attribute sort).

    Cultural-variation acknowledgment (Arc 4 Phase 1 spec discipline): meal-list
    varies substantially by culture. The 10 chosen keys prioritize universal
    recognition across the 11 platform locales — pizza/bread/apple/banana/cheese
    are near-universal in K-3 mental imagery; milk/egg/cheese/sandwich/water/juice
    are near-universal beverage + light-meal items. Operator-side teachers may
    swap region-specific items by editing the vocabKeys arrays (e.g., add
    rice for Asian contexts, tortilla for Latin-American contexts where those
    IMAGE_VOCABULARY entries exist or get added in future arcs). Sandwich is
    flagged as a Western-leaning concept — equally valid teacher-substitution
    paths exist.

    Sentence-strips frame variant for week 2: i-like-plural ("I like apples")
    integrates well with foods (kids talk about food preferences naturally —
    extends to "I like X but not Y" preference conversation in Grade 1+).

curriculumStandards:
  - EYFS.ELG.UW
  - IB-PYP.HowWeOrganize

assessmentCriteria:
  en: |
    Receptive 10/10; productive 8/10; frame use 6/10.

    Differentiation:
    - Pre-K: receptive only (point-to-named-food).
    - K / Grade 1: full productive + sentence-frame use.
    - Grade 2+: extend to preference conversation ("I like pizza. Do you like
      pizza?") + nutritional categorization (foods that grow on trees / foods
      we drink / foods we eat with our hands).

