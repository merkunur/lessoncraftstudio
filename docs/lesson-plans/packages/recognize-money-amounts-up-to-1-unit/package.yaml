compositionalRationale:
  en: |
    Primary strand: math / measurement (recognize money
    amounts up to 1 unit — CLOSES money sub-track 1/2 →
    2/2 SAT in the measurement strand). Secondary strand:
    early-numeracy / addition (the coin-counting work
    reinforces skip-counting + multi-coin addition
    strategies kids established at Arc 15 add-within-100
    prerequisite). Tertiary strand: vocabulary-acquisition
    (amount + total + value vocabulary; money-counting
    register).

    Architectural significance: CLOSES the money sub-
    track of the measurement strand opened by pair
    partner identify-coin-values (slot 2 of Phase 1.2).
    The two packages complete the canonical money sub-
    track at 2/2 SAT — the structural symmetry mirrors
    the Arc 17 P1.4 tell-time pair pattern (hour + half-
    hour) extended at Arc 18 P1.1 to a tell-time triple
    (hour + half-hour + quarter-hour). Money sub-track
    is structurally simpler (2 targets vs 3): identify-
    coin-values opens, recognize-money-amounts closes.

    Pair partner: identify-coin-values (slot 2 of Phase
    1.2). The two packages teach incremental skill
    layers:
    - identify-coin-values: coin-RECOGNITION + value-
      RECOGNITION (Grade 2 prerequisite). Pedagogy
      anchors on coin-appearance-vs-value pairing.
    - recognize-money-amounts (this package): coin-
      COMBINATION COUNTING (CCSS.2.MD.C.8 direct anchor).
      Pedagogy anchors on skip-counting routines applied
      to coin collections (25s for quarters, 10s for
      dimes, 5s for nickels, 1s for pennies).
    Together they form the K-3 currency module —
    RECOGNITION first, then COUNTING. The
    materials infrastructure (USD coin vocabKeys per Path
    A operator-locked at Phase 0) is shared between the
    two packages.

    Cross-reference to count-objects-1-to-20 (Arc 12
    prerequisite) + add-within-100 (Arc 15 prerequisite):
    the number-counting + multi-step-addition skills
    established by those K-1 + Grade 1 packages ground
    the coin-counting work this package builds. Kids who
    can skip-count + add within 100 can compute coin
    totals up to $1 (= 100¢). Combination-multiplicity
    (same total made multiple ways) is the conceptual
    extension specific to money work.

    **LOCALE-MONEY-SYSTEM DIVERGENCE PER OPERATOR-LOCKED
    PATH A**: same as pair partner identify-coin-values.
    This en package teaches USD-canonical amount-counting
    (penny / nickel / dime / quarter + amounts up to $1);
    pt sibling teaches BRL-canonical amount-counting
    (5/10/25/50 centavos + R$1 + amounts up to R$1). pt
    sibling has FULL OVERRIDE of materials list per
    operator-locked Path A. See pair partner identify-
    coin-values compositionalRationale for full
    convention-departure documentation; do NOT silently
    align pt sibling to sparse-override convention.

    Per §A.13.30 K-3 informal framing: Grade 2 money-
    amount pedagogy is COIN-COMBINATION COUNTING up to
    $1 (= 100¢). Kids use skip-counting by coin values
    + sequential addition to compute small-scale totals.
    The K-3 boundary is the $1 limit — counting amounts
    over $1 requires dollar-bill arithmetic that's Grade
    3+ scope. The combination-multiplicity skill (same
    total made multiple ways) is the conceptual extension
    appropriate at Grade 2 — kids see that $1 can be 4
    quarters OR 10 dimes OR 20 nickels OR 100 pennies OR
    many combinations. This sets up Grade 3+ work on
    equivalence + change-making.

    Distinctive composition: 1 matching (intro — coin-
    pile-image to total-amount pairing) + 1 math-
    worksheet (count amounts from coin-pile images) + 1
    math-puzzle (make-target-amount — given target, kid
    picks coins to total it) + 1 matching (letter-mode
    at consolidation) + 1 picture-sort (sort coin piles
    by amount-range, surfaces total-amount comparison
    work). Composition shape parallels pair partner
    identify-coin-values but emphasizes the COUNTING
    skill at positions 2-3 (math-worksheet + math-puzzle)
    rather than the RECOGNITION skill (which was
    pair-partner's emphasis at positions 1-2).

    Materials note: 7-material Numeracy/Measurement class
    stack per §A.13.37. Materials list IDENTICAL to pair
    partner identify-coin-values (same 5 USD coin
    vocabKeys; same `mode: variety`; same itemCount
    scale — though manipulative-cut-outs at slot 3 uses
    itemCount 10 vs slot-2's 6 because amount-counting
    needs more coin pieces than just recognition).
    **SUBSTRATE CARRY-FORWARD TO P2**: same as pair
    partner — USD coin substrate (image library +
    vocab-dictionary entries) deferred to Pillar 5 P2
    close-out per §A.13.38 decoupled-ship discipline.

    Class B FLEXIBLE substrate: composes against
    miscellaneous theme on composedExercises (same as
    pair partner + tell-time measurement-strand
    precedent). Materials use vocabKeyList directly.

    K-3 multilingual classroom relevance: amount-counting
    pedagogy is structurally locale-portable (skip-
    counting + addition routines are universal). The
    locale-specific dimensions are: the COIN SET (USD
    vs BRL vs EUR vs others — each locale has its own);
    the AMOUNT LIMIT ($1 / R$1 / €1 / etc. — each
    locale's "1 unit" is the natural ceiling); the
    SKIP-COUNT VALUES (USD 1/5/10/25/100 vs BRL
    5/10/25/50/100 — note BRL lacks the 1-cent unit per
    pair partner discussion). Per operator-locked Path A,
    this en package teaches USD up to $1; pt sibling
    teaches BRL up to R$1. Future locale-variant
    expansion (Phase 3+ for additional locales) will
    teach each locale's currency-system up to their "1
    unit" canonical ceiling.

