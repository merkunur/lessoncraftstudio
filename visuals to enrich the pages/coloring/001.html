<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Christmas Coloring Pages - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(145deg, #FF6B6B 0%, #FF8E53 50%, #FFD93D 100%); overflow: hidden;">

        <!-- Radial warm glow -->
        <div style="position: absolute; top: 40%; left: 50%; width: 1000px; height: 1000px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 50%); border-radius: 50%;"></div>

        <!-- Subtle snowflake decorations -->
        <div style="position: absolute; top: 60px; left: 80px; font-size: 28px; opacity: 0.3; color: white;">*</div>
        <div style="position: absolute; top: 150px; left: 40px; font-size: 20px; opacity: 0.25; color: white;">*</div>
        <div style="position: absolute; top: 100px; right: 70px; font-size: 24px; opacity: 0.3; color: white;">*</div>
        <div style="position: absolute; top: 200px; right: 40px; font-size: 18px; opacity: 0.25; color: white;">*</div>
        <div style="position: absolute; bottom: 350px; left: 50px; font-size: 22px; opacity: 0.25; color: white;">*</div>
        <div style="position: absolute; bottom: 400px; right: 60px; font-size: 26px; opacity: 0.3; color: white;">*</div>

        <!-- FREE Badge - Coral Starburst Style -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="width: 95px; height: 95px; position: relative;">
                <!-- Starburst rays -->
                <div style="position: absolute; top: 50%; left: 50%; width: 95px; height: 95px; transform: translate(-50%, -50%) rotate(22deg); background: linear-gradient(145deg, #FF6B6B 0%, #E53935 100%); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);"></div>
                <div style="position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; transform: translate(-50%, -50%); border-radius: 50%; background: linear-gradient(145deg, #FF6B6B 0%, #E53935 100%); box-shadow: 0 4px 15px rgba(229,57,53,0.5); display: flex; align-items: center; justify-content: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">FREE</span>
                </div>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: #6BCB77; padding: 12px 24px; border-radius: 30px; box-shadow: 0 4px 15px rgba(107,203,119,0.5);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; color: white;">GRADES PreK-3</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 130px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #6C4AB6; margin: 0; text-shadow: 3px 3px 0 rgba(255,255,255,0.8), 0 0 30px rgba(108,74,182,0.3);">Christmas</h1>
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #6C4AB6; margin: -8px 0 0 0; text-shadow: 3px 3px 0 rgba(255,255,255,0.8), 0 0 30px rgba(108,74,182,0.3);">Coloring Pages</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 36px; color: #FF6B6B; margin: 10px 0 0 0; text-shadow: 2px 2px 0 rgba(255,255,255,0.6);">Holiday Bundle</h2>
        </div>

        <!-- Fanned Coloring Pages Display -->
        <div style="position: absolute; top: 340px; left: 50%; transform: translateX(-50%); width: 900px; height: 380px;">
            <!-- Back Left Card -->
            <div style="position: absolute; left: 50px; top: 50px; transform: rotate(-18deg); box-shadow: 0 10px 35px rgba(0,0,0,0.25);">
                <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-4.jpeg" style="width: 180px; height: auto; border-radius: 10px; border: 5px solid white;">
            </div>

            <!-- Back Right Card -->
            <div style="position: absolute; right: 50px; top: 50px; transform: rotate(18deg); box-shadow: 0 10px 35px rgba(0,0,0,0.25);">
                <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-5.jpeg" style="width: 180px; height: auto; border-radius: 10px; border: 5px solid white;">
            </div>

            <!-- Mid Left Card -->
            <div style="position: absolute; left: 170px; top: 20px; transform: rotate(-10deg); box-shadow: 0 12px 40px rgba(0,0,0,0.28); z-index: 10;">
                <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-2.jpeg" style="width: 200px; height: auto; border-radius: 12px; border: 6px solid white;">
            </div>

            <!-- Mid Right Card -->
            <div style="position: absolute; right: 170px; top: 20px; transform: rotate(10deg); box-shadow: 0 12px 40px rgba(0,0,0,0.28); z-index: 10;">
                <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-3.jpeg" style="width: 200px; height: auto; border-radius: 12px; border: 6px solid white;">
            </div>

            <!-- Center Card - Main Focus (Christmas Tree) -->
            <div style="position: absolute; left: 50%; top: -10px; transform: translateX(-50%); box-shadow: 0 15px 50px rgba(0,0,0,0.3); z-index: 20;">
                <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-1.jpeg" style="width: 230px; height: auto; border-radius: 14px; border: 7px solid white;">
            </div>
        </div>

        <!-- Scattered Crayons Decoration -->
        <!-- Red Crayon -->
        <div style="position: absolute; bottom: 220px; left: 60px; transform: rotate(-25deg); z-index: 30;">
            <div style="width: 80px; height: 20px; background: linear-gradient(180deg, #FF5757 0%, #E53935 50%, #C62828 100%); border-radius: 3px 10px 10px 3px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);"></div>
            <div style="position: absolute; left: -12px; top: 3px; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 15px solid #FFB347;"></div>
        </div>

        <!-- Green Crayon -->
        <div style="position: absolute; bottom: 250px; right: 80px; transform: rotate(30deg); z-index: 30;">
            <div style="width: 75px; height: 18px; background: linear-gradient(180deg, #4CAF50 0%, #388E3C 50%, #2E7D32 100%); border-radius: 3px 9px 9px 3px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);"></div>
            <div style="position: absolute; left: -11px; top: 2px; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-right: 14px solid #FFB347;"></div>
        </div>

        <!-- Blue Crayon -->
        <div style="position: absolute; bottom: 200px; left: 150px; transform: rotate(-45deg); z-index: 25;">
            <div style="width: 70px; height: 16px; background: linear-gradient(180deg, #42A5F5 0%, #1E88E5 50%, #1565C0 100%); border-radius: 3px 8px 8px 3px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);"></div>
            <div style="position: absolute; left: -10px; top: 2px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 13px solid #FFB347;"></div>
        </div>

        <!-- Yellow Crayon -->
        <div style="position: absolute; bottom: 230px; right: 170px; transform: rotate(15deg); z-index: 25;">
            <div style="width: 72px; height: 17px; background: linear-gradient(180deg, #FFEB3B 0%, #FDD835 50%, #F9A825 100%); border-radius: 3px 8px 8px 3px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);"></div>
            <div style="position: absolute; left: -10px; top: 2px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 13px solid #FFB347;"></div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 115px; left: 0; right: 0; background: linear-gradient(90deg, #FFD93D 0%, #FFE066 50%, #FFD93D 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.15), 0 4px 20px rgba(0,0,0,0.15);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: #C84B4B; text-shadow: 2px 2px 0 rgba(255,255,255,0.5); letter-spacing: 2px;">HOLIDAY PARTY READY!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: white; padding: 12px 18px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid #6BCB77;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #6BCB77;">No Prep</span>
            </div>
            <div style="background: white; padding: 12px 18px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid #6C4AB6;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #6C4AB6;">Print & Go</span>
            </div>
            <div style="background: white; padding: 12px 18px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid #FF6B6B;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #FF6B6B;">Cozy Scenes</span>
            </div>
            <div style="background: white; padding: 12px 18px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid #FFB347;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #E67E22;">Variety Included</span>
            </div>
        </div>

    </div>
</body>
</html>
