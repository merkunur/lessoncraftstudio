compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (subtract
    two 2-digit numbers — deepens strand 12/14 → 13/14).
    Secondary strand: math / place-value (2-digit
    subtraction makes place-value column structure
    explicit + introduces ten-for-ones exchange via
    borrowing). Tertiary strand: numeracy (borrowing +
    column-subtract + multiple-strategy work).

    Architectural significance: pair-package partner of
    Arc 18 Phase 1.3 add-2-digit-numbers; together
    covers Grade 2 canonical 2-digit + 2-digit operations
    (addition + subtraction). Per learning-targets.json,
    subtract-2-digit-numbers is a distinct canonical
    target from subtract-within-100 — they share
    CCSS.2.NBT.B.5 anchor but differ in pedagogical
    emphasis:
    - subtract-within-100 (Arc 16 P1.1): BROAD
      computational fluency across single-digit + 2-
      digit cases (54-19, 67-5, 89-21, etc.) —
      emphasizes mixed-case strategy flexibility.
    - subtract-2-digit-numbers (THIS PACKAGE): NARROWED
      to 2-digit minus 2-digit cases (54-23, 62-37,
      80-45) — emphasizes structural place-value
      column work + borrowing mechanics + the inverse-
      operation parallel with add-2-digit-numbers.
    Together the two packages cover Grade 2 subtraction-
    within-100 from both strategic (mixed cases) and
    structural (canonical 2-digit pairs) angles.

    Addition-subtraction strand future: 1 unpackaged
    target remains (add-3-numbers-within-20). Phase 1.5+
    candidates would close the strand at 14/14 SAT.

    Per §A.13.30 K-3 informal framing: Grade 2 2-digit
    subtraction is PLACE-VALUE-GROUNDED computational
    fluency. Kids understand the column-subtract
    procedure as a PHYSICAL OPERATION on tens + ones
    (the place-value-mat + base-ten manipulatives
    surface this physically); the procedure FOLLOWS
    from place-value structure (tens subtract from
    tens; ones from ones; when ones can't subtract,
    we BORROW a ten which becomes 10 ones — same
    total value, different distribution). Formal
    column-subtract algorithm mastery (efficiency-
    focused; pencil-and-paper fluency without
    manipulatives) is Grade 3+ work. The Grade 2 goal
    is CONCEPTUAL understanding + procedural skill +
    multiple strategies — not algorithmic automaticity.

    Cross-reference to Arc 18 Phase 1.3 add-2-digit-
    numbers (pair package + structural mirror): that
    package established the structural-place-value
    column-add work with regrouping. **This package
    MIRRORS add-2-digit-numbers on every dimension**
    — same materials list (flashcards + picture-cards
    + place-value-mat + vocabulary-tracing-strips +
    manipulative-cut-outs + parent-take-home-letter +
    answer-key), same theme (animals), same place-
    value-mat configuration (DEFERRED generator),
    same manipulative-cut-outs configuration (mode:
    variety + base-ten vocabKeys + itemCount 10),
    same composedExercises shape (subtraction +
    math-worksheet × 2 + math-puzzle + more-less).
    The pair-coherence is INTENTIONAL — kids
    transfer their addition skills directly to
    subtraction without learning new pedagogy
    mechanics. The COGNITIVE difference is
    addition-with-regrouping (carrying) vs subtraction-
    with-borrowing (the inverse); the PEDAGOGY shape
    is identical. This is the canonical pair-package
    pattern for inverse operations.

    Cross-reference to Arc 16 P1.1 subtract-within-100
    (precedent on the broader strand target): that
    package established the broader within-100
    subtraction fluency. This package shares 5 of 7
    materials with subtract-within-100 + diverges on
    1 dimension (manipulative-cut-outs `mode:`).

    **CRITICAL DIVERGENCE RATIFICATION per §A.13.6
    spec-vs-shipped-contract validation + §A.13.34
    transparency:**

    THIS PACKAGE DIVERGES FROM ARC 16 P1.1 SUBTRACT-
    WITHIN-100 ON ONE DIMENSION. Materials position 3
    (place-value-mat) mirrors subtract-within-100
    precedent verbatim — preserves materials-list-shape
    coherence + carries forward the §A.13.32 sub-
    doctrine (d) generator-executability gap (place-
    value-mat generator DEFERRED per Pillar 5 (C)
    carry-forward; the same gap affects subtract-
    within-100 + add-within-100 + add-2-digit-numbers
    + this package identically — 4 packages share the
    place-value-mat generator gap).

    HOWEVER, materials position 5 (manipulative-cut-
    outs) DIVERGES from Arc 16 P1.1 subtract-within-100
    on the `mode:` dimension. Arc 16 P1.1 subtract-
    within-100 emits `mode: base-ten-blocks` (a non-
    canonical mode value that does NOT exist in the
    corrected CutOutMode type per `frontend/scripts/
    lib/manipulative-cut-outs-package-loader.ts:30` —
    the canonical set is `'single-repeat' | 'variety'`
    only, per the §A.13.35 self-firing correction
    shipped at commit 694f9823). The Arc 16 P1.1
    `mode: base-ten-blocks` is pre-correction data
    debt of the same class as Arc 17 P1.4 tell-time
    pair's `mode: clock-pieces` non-canonical mode +
    Arc 16 P1.1 add-within-100's identical
    `mode: base-ten-blocks` data debt.

    Per operator-locked Phase 1.3 Slot 3 add-2-digit-
    numbers precedent (which canonicalized this
    pattern): canonical-correct on mode dimension.
    This package ships `mode: variety` with vocabKey
    enumeration of base-ten vocabKeys (ten-stick +
    ones-counter) at itemCount 10 — IDENTICAL
    configuration to add-2-digit-numbers. The Arc 16
    P1.1 subtract-within-100 package stays at
    `mode: base-ten-blocks` data debt for a separate
    retro-fix arc (Pillar 5 (C) DEFER carry-forward:
    **this brings the retro-fix queue to 4 packages**
    — tell-time-to-the-hour + tell-time-to-half-hour
    + add-within-100 + subtract-within-100 — all
    requiring mode correction alongside generator
    authoring).

    The internal-shape divergence is INTENTIONAL +
    OPERATOR-LOCKED via Phase 1.3 Slot 3 precedent
    extension. Future audits resolving apparent
    inconsistency should read this compositionalRationale
    + the Arc 16 P1.1 subtract-within-100 retro-fix
    queue entry + the Arc 18 Phase 1.3 Slot 3 firings
    batch. Do NOT silently align this package to
    subtract-within-100's `mode: base-ten-blocks` —
    that would re-introduce the §A.13.35 self-firing
    defect at the catalog layer.

    Distinctive composition: 1 subtraction (vertical-
    subtraction format) + 2 math-worksheet (vertical
    2-digit subtraction practice) + 1 math-puzzle
    (missing-subtrahend) + 1 more-less (compare two
    2-digit subtraction results). Composition shape
    mirrors Arc 18 Phase 1.3 add-2-digit-numbers
    precedent EXACTLY (same 5-exercise shape with
    'subtraction' substituted for 'addition' app
    + 'missing-subtrahend' substituted for 'missing-
    addend'); content is narrowed to 2-digit minus 2-
    digit cases.

    Materials note: 7-material Numeracy class stack per
    §A.13.37. **Pair-coherent with Arc 18 Phase 1.3
    add-2-digit-numbers precedent on every materials-
    list dimension.** Place-value-mat at position 3 is
    the LOAD-BEARING material — the physical column-
    structure substrate that grounds 2-digit
    subtraction (same role as in add-2-digit-numbers).
    Vocabulary-tracing-strips at position 4 traces
    place-value vocabulary ('tens', 'ones', 'borrow',
    'difference', 'minus', 'subtract'). Manipulative-
    cut-outs at position 5 emits canonical-correct
    `mode: variety` with vocabKey enumeration of 2
    base-ten vocabKeys (ten-stick + ones-counter;
    itemCount 10 = 10 of each = enough for working
    through 2-digit subtraction problems physically,
    including borrow exchanges).

    **SUBSTRATE CARRY-FORWARD TO P2 per §A.13.32 sub-
    doctrine (d):**
    1. place-value-mat generator DEFERRED (continuing
       carry-forward from Arc 16 + earlier; affects
       subtract-within-100 + add-within-100 + add-2-
       digit-numbers + this package — 4 packages
       share the gap).
    2. base-ten vocabKey image substrate (ten-stick +
       ones-counter images in image library +
       corresponding entries in image-vocabulary.js)
       does NOT yet exist at Phase 1.4 ship.
       **This package SHARES the base-ten substrate
       gap with its pair package add-2-digit-numbers**
       (Arc 18 P1.3 carry-forward). Substrate
       authoring at P2 close-out covers BOTH packages
       in a single substrate-authoring action (same
       2 vocabKeys, same image needs).

    Class B FLEXIBLE substrate: composes against
    animals theme (countable for subtraction work;
    cross-arc with Arc 12-16 subtraction themes for
    consistency + cross-package coherence with add-2-
    digit-numbers which used animals theme). The
    animals theme is decorative for Grade 2 2-digit
    work — the COMPUTATIONAL skill is abstract
    numerical; the theme provides visual interest +
    vocabulary anchor for the flashcards + picture-
    cards.

    K-3 multilingual classroom relevance: 2-digit
    subtraction is universal Grade 2 content. The
    PROCEDURE (line up tens + ones + subtract columns
    + borrow when needed) is locale-portable; the
    SPOKEN number-word naming for 2-digit numbers
    varies significantly (same as add-2-digit-numbers:
    en regular; de reverse-decade; fr vigesimal 70+;
    fi agglutinative compounds). Cross-locale
    borrowing vocabulary varies: en
    "borrow / regroup"; de "entlehnen / Übertrag"; es
    "pedir prestado / desagrupar"; pt "emprestar /
    desagrupar"; fr "emprunt / retenue"; it
    "prestito"; nl "lenen / regrouperen"; nordic
    locales use "låne" + variants. Locale-variant
    work at Phase 3+ adapts to each locale's number-
    word + borrowing-vocabulary register.

