# Teaching package — describe the plant life cycle (seed → sprout → plant → flower)
# Arc 10 Phase 2 (Option E world-knowledge depth; world-knowledge / living-
# things strand deepening). Class B FLEXIBLE; vocab-anchored. Builds on
# existing classify-animals-by-diet + classify-animals-by-habitat (Arc 5);
# living-things strand grows 2/6 → 3/6.

targetSlug: describe-plant-life-cycle
language: en
title:
  en: "Plant Life Cycle — from seed to flower"
description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching the plant life cycle. Builds on existing classify-animals-by-diet + classify-animals-by-habitat (living-things strand from Arc 5). Kids learn the 4-stage plant cycle: seed → sprout → growing plant → flowering plant. Foundational world-knowledge: plants are alive, grow over time in stages, and produce seeds that start the cycle again. Vocab-anchored — plant-cycle vocabulary (seed, sprout, root, stem, leaf, flower, petal). Composes against picture-sort + matching apps for sequential life-cycle work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class life-cycle introduction. Teacher displays 4 picture
      cards in random order: seed, sprout (small green shoot),
      growing plant with leaves, flowering plant with bloom. "These
      are pictures of a plant's LIFE — from when it starts as a tiny
      seed all the way to when it flowers. Can you put them in
      ORDER?" Class arranges. Teacher confirms + chants the sequence:
      "Seed → sprout → plant → flower." Reinforces the sequential
      nature of life-cycle vocabulary.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + life-cycle-sequence routine. Each pair receives 4
      pictures showing the life-cycle stages + a sequence-strip
      template. Pair arranges pictures in correct order on the strip.
      Teacher narrates: "First, a SEED is planted in soil. Soon,
      the seed SPROUTS — a tiny green shoot pushes up. The plant
      GROWS bigger, growing roots and leaves. Finally, the plant
      FLOWERS — and the flower makes new SEEDS, which start the
      cycle again." Recast errors with explanation. Optional
      extension: kids draw their own plant-cycle sequence.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (life-cycle
      stage to image). Station 2: picture-sort worksheet (kids sort
      pictures into 'plant' vs 'not-plant' categories — bridge from
      Arc 5 sort-by-category). Station 3: manipulative cut-outs hands-
      on cycle-construction (kids assemble the 4-stage cycle as
      circular sequence; reinforces cyclic nature). Station 4: word-
      guess (kids fill in plant-cycle vocabulary from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class cycle-recall. Teacher displays the 4 stages out of
      order; class collectively orders them. Forward-pointer: "Today
      we learned about the plant life cycle. When we come back to
      living things next, we'll learn about ANIMAL life cycles —
      especially the BUTTERFLY, whose life cycle has even more
      stages than the plant."

