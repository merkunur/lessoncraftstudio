# Teaching package — add within 5
# Arc 4 Phase 3 numeracy package. Simplest addition target; foundational
# to add-within-10. CCSS.K.OA.A.1 alignment. Prerequisites:
# count-objects-1-to-5, match-numeral-to-quantity-1-to-10.

targetSlug: add-within-5
language: en

title:
  en: "Add Within 5 — first additions"
description:
  en: "Kindergarten numeracy package teaching addition with sums up to 5. The simplest addition target — operands 1-4, sums 2-5. Builds on subitization (1-5) + count-on; foundational to add-within-10. addition app heavy with image-image mode (kids see + count); manipulative-cut-outs for concrete combine-and-count enactment. 5 exercises + 6 materials over a 1-2 week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher places 2 manipulative cut-out fish on
      the carpet. "Two fish." Adds 1 more. "Now there are three fish. Two
      plus one is three." Repeat with 1+1, 3+1, 2+2. The pattern: see N items,
      see M more added, count the total. Reinforce the "plus" word + the
      "is/equals" word as the kids' first addition vocabulary.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("There are 2 cats. There
      are 1 cat. Together: 3 cats. Two plus one is three."). Choral reading
      of addition expressions. Pair work: kid A puts down N items (1-4),
      kid B adds M items (1-4 with N+M ≤ 5), both count the total together
      and say the addition sentence aloud.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: addition image-image worksheet (operands
      1-4, sums 2-5). Station 2: code-addition worksheet (kid solves N+M
      and matches the sum to a letter — adds phonics integration). Station 3:
      manipulative cut-outs combine-and-count game ("show me 2 cats and 3
      cats together — count them; say the addition").
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names a small addition (e.g., "two
      plus three"); kids show the sum on fingers. Forward-pointer: "Today
      we did our first additions. When we come back to numbers next, we'll
      add bigger numbers — up to 10."

