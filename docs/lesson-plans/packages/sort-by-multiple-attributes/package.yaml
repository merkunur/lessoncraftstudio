assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Sort 8 items into 4 buckets defined by 2 attributes correctly in
        7 of 10 trials.
      - Articulate the 2 attributes when asked ("the buckets are by COLOR
        and SHAPE") in 7 of 10 trials.
      - Verbalize multi-attribute item membership ("this is RED and
        ROUND so it goes in red-circle") in 6 of 10 trials.

    Differentiation:
    - Pre-K: single-attribute sort with strong contrast (deferred from
      multi-attribute; bridge from Arc 5/7 trilogy).
    - K: 2 attributes with 2 levels each (4 buckets); strong contrast
      between attributes.
    - Grade 1+: 2-3 attributes simultaneously; subtler contrasts;
      bridge to 3-attribute classification (cognitive complexity ceiling
      for K-3).

