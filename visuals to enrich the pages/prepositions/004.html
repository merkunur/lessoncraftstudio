<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Prepositions Worksheets - Fun Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(160deg, #FFFFFF 0%, #FFFBEB 40%, #FEF3C7 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Confetti/sparkle dots scattered -->
        <div style="position: absolute; top: 80px; left: 120px; width: 14px; height: 14px; background: #F97066; border-radius: 50%;"></div>
        <div style="position: absolute; top: 200px; right: 90px; width: 10px; height: 10px; background: #FBBF24; border-radius: 50%;"></div>
        <div style="position: absolute; top: 350px; left: 60px; width: 12px; height: 12px; background: #8B5CF6; border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 350px; right: 70px; width: 16px; height: 16px; background: #06B6D4; border-radius: 50%;"></div>
        <div style="position: absolute; top: 150px; left: 350px; width: 8px; height: 8px; background: #10B981; border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 400px; left: 90px; width: 10px; height: 10px; background: #F97066; border-radius: 2px; transform: rotate(45deg);"></div>
        <div style="position: absolute; top: 280px; right: 150px; width: 8px; height: 8px; background: #FBBF24; border-radius: 2px; transform: rotate(45deg);"></div>
        <div style="position: absolute; bottom: 250px; left: 200px; width: 12px; height: 12px; background: #06B6D4; border-radius: 2px; transform: rotate(45deg);"></div>
        <div style="position: absolute; top: 500px; right: 120px; width: 10px; height: 10px; background: #8B5CF6; border-radius: 2px; transform: rotate(45deg);"></div>

        <!-- Sparkle SVGs -->
        <svg style="position: absolute; top: 100px; right: 200px; opacity: 0.7;" width="35" height="35" viewBox="0 0 100 100">
            <path d="M 50 5 L 55 40 L 95 50 L 55 60 L 50 95 L 45 60 L 5 50 L 45 40 Z" fill="#FBBF24"/>
        </svg>
        <svg style="position: absolute; bottom: 300px; left: 130px; opacity: 0.5;" width="28" height="28" viewBox="0 0 100 100">
            <path d="M 50 5 L 55 40 L 95 50 L 55 60 L 50 95 L 45 60 L 5 50 L 45 40 Z" fill="#8B5CF6"/>
        </svg>
        <svg style="position: absolute; top: 400px; right: 50px; opacity: 0.6;" width="30" height="30" viewBox="0 0 100 100">
            <path d="M 50 5 L 55 40 L 95 50 L 55 60 L 50 95 L 45 60 L 5 50 L 45 40 Z" fill="#F97066"/>
        </svg>

        <!-- FREE Badge - Top Left, slightly rotated -->
        <div style="
            position: absolute;
            top: 35px;
            left: 35px;
            transform: rotate(-8deg);
            z-index: 20;
        ">
            <div style="
                width: 90px;
                height: 90px;
                background: linear-gradient(135deg, #F97066 0%, #EF4444 100%);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 6px 20px rgba(249, 112, 102, 0.5);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 28px;
                    color: white;
                    letter-spacing: 1px;
                ">FREE</span>
            </div>
        </div>

        <!-- Large playful title: WHERE? -->
        <div style="
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 130px;
                margin: 0;
                background: linear-gradient(135deg, #6D28D9 0%, #F97066 30%, #FBBF24 55%, #06B6D4 80%, #8B5CF6 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                line-height: 1;
                letter-spacing: -3px;
            ">WHERE?</h1>
            <h2 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 42px;
                color: #F97066;
                margin: -10px 0 0 0;
            ">Preposition Fun!</h2>
        </div>

        <!-- Central worksheet in bold coral frame -->
        <div style="
            position: absolute;
            top: 280px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        ">
            <div style="
                background: #F97066;
                padding: 14px;
                border-radius: 16px;
                box-shadow: 0 20px 60px rgba(249, 112, 102, 0.35), 0 8px 25px rgba(0,0,0,0.15);
            ">
                <div style="
                    background: white;
                    padding: 8px;
                    border-radius: 10px;
                ">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-1.jpeg"
                        alt="Prepositions Worksheet"
                        style="
                            width: 280px;
                            height: 362px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 6px;
                            display: block;
                        "
                    />
                </div>
            </div>
        </div>

        <!-- Spatial elements around the worksheet -->
        <!-- Cat ON TOP of worksheet frame -->
        <div style="
            position: absolute;
            top: 248px;
            left: 50%;
            transform: translateX(-50%) translateX(60px);
            z-index: 25;
            font-size: 52px;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.15));
        ">&#128049;</div>

        <!-- Star UNDER the worksheet -->
        <div style="
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%) translateX(-80px);
            z-index: 25;
            font-size: 44px;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.15));
        ">&#11088;</div>

        <!-- Arrow pointing BESIDE -->
        <div style="
            position: absolute;
            top: 450px;
            right: 145px;
            z-index: 25;
            font-size: 48px;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.15));
        ">&#10145;&#65039;</div>

        <!-- Heart IN FRONT -->
        <div style="
            position: absolute;
            top: 380px;
            left: 140px;
            z-index: 25;
            font-size: 42px;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.15));
        ">&#128151;</div>

        <!-- Speech bubble: "ON TOP!" -->
        <div style="
            position: absolute;
            top: 230px;
            right: 100px;
            background: #06B6D4;
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 22px;
            padding: 10px 18px;
            border-radius: 20px 20px 20px 5px;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.35);
            z-index: 20;
        ">ON TOP!</div>

        <!-- Speech bubble: "UNDER HERE!" -->
        <div style="
            position: absolute;
            bottom: 230px;
            left: 120px;
            background: #8B5CF6;
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 20px;
            padding: 10px 16px;
            border-radius: 20px 20px 5px 20px;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
            z-index: 20;
        ">UNDER HERE!</div>

        <!-- Circular burst badge: "SO FUN!" -->
        <div style="
            position: absolute;
            top: 340px;
            left: 80px;
            z-index: 20;
        ">
            <div style="
                width: 100px;
                height: 100px;
                background: linear-gradient(135deg, #F97066 0%, #FBBF24 100%);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 6px 18px rgba(249, 112, 102, 0.4);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 22px;
                    color: white;
                    text-align: center;
                    line-height: 1.1;
                    text-shadow: 0 1px 3px rgba(0,0,0,0.15);
                ">SO<br/>FUN!</span>
            </div>
        </div>

        <!-- Bottom pill: "Kids LOVE This!" -->
        <div style="
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        ">
            <div style="
                background: linear-gradient(135deg, #F97066 0%, #EF4444 100%);
                padding: 16px 50px;
                border-radius: 50px;
                box-shadow: 0 6px 20px rgba(249, 112, 102, 0.4);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 30px;
                    color: white;
                    letter-spacing: 1px;
                ">Kids LOVE This!</span>
            </div>
        </div>

        <!-- Grade badge - bottom right -->
        <div style="
            position: absolute;
            bottom: 35px;
            right: 40px;
            background: linear-gradient(135deg, #6D28D9 0%, #7C3AED 100%);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 18px;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.3);
            z-index: 20;
        ">GRADES PreK-2</div>
    </div>
</body>
</html>
