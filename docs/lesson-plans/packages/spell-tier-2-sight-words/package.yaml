compositionalRationale:
  en: |
    Primary strand: early-literacy / spelling (Tier 2 high-frequency
    sight-word spelling). Secondary strand: vocabulary-acquisition
    (Tier 2 sight words establish question-formation + connector
    vocabulary).

    Architectural significance: forward-pointer resolution from Arc
    13 spell-high-frequency-sight-words-tier-1 ('next we extend
    sight-word spelling to Tier 2 frequency band'). Builds on Tier
    1 foundation (13 most-frequent words); extends to next-most-
    frequent 25 words. Tier 2 contains essential interrogative +
    relative pronouns (what, when, where, why, how, who) + connectors
    (this, with, from, but, by) enabling sentence-level reading +
    writing capability.

    Distinctive composition: 2 word-scramble + 2 word-guess + 1
    crossword. Spelling-decoding emphasis throughout; crossword
    introduces sight-word use in word-puzzle context.

    Class B FLEXIBLE substrate: composes against miscellaneous
    image-library theme (Tier 2 sight words are largely abstract/
    function words without specific image anchors).

    K-3 multilingual classroom relevance: Tier 2 sight-word lists
    are language-specific. Each platform locale has its own most-
    frequent sight-word list (es: el, la, de, que, y, a, en, un;
    de: der, die, und, in, den, zu, eine, eines; etc.). Locale-
    variant sparse-overrides at Phase 3 will need substantial
    re-authoring per locale's high-frequency word list.

