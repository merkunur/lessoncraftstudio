<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Bilderpfad - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 30%, #A5D6A7 60%, #81C784 85%, #66BB6A 100%); overflow: hidden;">

        <!-- Misty mountain silhouettes (far background) -->
        <svg style="position: absolute; top: 60px; left: 0; width: 1000px; height: 350px; opacity: 0.08;" viewBox="0 0 1000 350">
            <polygon points="0,350 80,120 160,200 250,80 340,180 450,50 520,160 600,100 700,170 800,60 900,150 1000,90 1000,350" fill="#1B5E20"/>
        </svg>
        <svg style="position: absolute; top: 120px; left: 0; width: 1000px; height: 300px; opacity: 0.06;" viewBox="0 0 1000 300">
            <polygon points="0,300 100,180 200,220 300,140 400,200 500,120 600,190 700,130 800,210 900,160 1000,200 1000,300" fill="#2E7D32"/>
        </svg>

        <!-- Flying birds -->
        <svg style="position: absolute; top: 75px; left: 120px; opacity: 0.2;" width="30" height="12" viewBox="0 0 30 12">
            <path d="M0,6 Q7,0 15,6 Q23,0 30,6" fill="none" stroke="#2E7D32" stroke-width="1.8"/>
        </svg>
        <svg style="position: absolute; top: 55px; left: 200px; opacity: 0.15;" width="24" height="10" viewBox="0 0 24 10">
            <path d="M0,5 Q6,0 12,5 Q18,0 24,5" fill="none" stroke="#2E7D32" stroke-width="1.5"/>
        </svg>
        <svg style="position: absolute; top: 90px; right: 180px; opacity: 0.18;" width="28" height="11" viewBox="0 0 28 11">
            <path d="M0,5.5 Q7,0 14,5.5 Q21,0 28,5.5" fill="none" stroke="#2E7D32" stroke-width="1.6"/>
        </svg>

        <!-- Grass tufts at bottom -->
        <svg style="position: absolute; bottom: 100px; left: 0; width: 1000px; height: 50px; opacity: 0.18;" viewBox="0 0 1000 50">
            <path d="M40,50 L45,20 L50,50" fill="#2E7D32"/>
            <path d="M42,50 L38,25 L35,50" fill="#388E3C"/>
            <path d="M150,50 L155,22 L160,50" fill="#2E7D32"/>
            <path d="M152,50 L148,28 L145,50" fill="#388E3C"/>
            <path d="M600,50 L605,18 L610,50" fill="#2E7D32"/>
            <path d="M602,50 L598,24 L595,50" fill="#388E3C"/>
            <path d="M850,50 L855,20 L860,50" fill="#2E7D32"/>
            <path d="M852,50 L848,26 L845,50" fill="#388E3C"/>
        </svg>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 22px; left: 26px; z-index: 100;">
            <div style="width: 92px; height: 92px; background: linear-gradient(145deg, #FDD835 0%, #F9A825 100%); border-radius: 50%; box-shadow: 0 6px 22px rgba(249,168,37,0.5), inset 0 -3px 8px rgba(0,0,0,0.12), inset 0 3px 6px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 3px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 21px; color: #3E2723;">GRATIS</span>
            </div>
        </div>

        <!-- KLASSE K-3 Badge -->
        <div style="position: absolute; top: 30px; right: 30px; z-index: 100;">
            <div style="background: rgba(255,255,255,0.92); padding: 10px 22px; border-radius: 28px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #2E7D32;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #2E7D32; letter-spacing: 1px;">KLASSE K-3</span>
            </div>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 28px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 54px; color: #1B5E20; margin: 0; text-shadow: 2px 2px 0 rgba(255,255,255,0.5), 0 0 30px rgba(27,94,32,0.1); letter-spacing: 3px;">W&Auml;HLE DEIN LEVEL!</h1>
        </div>

        <!-- ===== SIGNPOST (SVG) ===== -->
        <svg style="position: absolute; top: 110px; left: 50%; transform: translateX(-50%); z-index: 30;" width="500" height: "600" viewBox="0 0 500 600" width="500" height="600">
            <!-- Wooden post -->
            <rect x="238" y="60" width="24" height="520" rx="4" fill="url(#woodGrain)" stroke="#5D4037" stroke-width="1.5"/>
            <!-- Wood grain pattern -->
            <defs>
                <linearGradient id="woodGrain" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#8D6E63"/>
                    <stop offset="30%" stop-color="#A1887F"/>
                    <stop offset="50%" stop-color="#795548"/>
                    <stop offset="70%" stop-color="#A1887F"/>
                    <stop offset="100%" stop-color="#8D6E63"/>
                </linearGradient>
            </defs>
            <!-- Wood grain lines on post -->
            <line x1="245" y1="70" x2="245" y2="570" stroke="#6D4C41" stroke-width="0.5" opacity="0.3"/>
            <line x1="252" y1="65" x2="252" y2="575" stroke="#6D4C41" stroke-width="0.3" opacity="0.25"/>
            <line x1="256" y1="68" x2="256" y2="572" stroke="#5D4037" stroke-width="0.4" opacity="0.2"/>

            <!-- Post cap -->
            <rect x="232" y="50" width="36" height="18" rx="4" fill="#795548" stroke="#5D4037" stroke-width="1"/>

            <!-- ===== SIGN ARM 1: LEICHT (pointing LEFT) — Green ===== -->
            <g transform="translate(250, 130)">
                <!-- Arrow-shaped sign pointing left -->
                <polygon points="-210,0 -180,-30 30,-30 30,30 -180,30" fill="#43A047" stroke="#2E7D32" stroke-width="2" rx="4"/>
                <!-- Text -->
                <text x="-80" y="5" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="white">LEICHT</text>
                <text x="-80" y="24" text-anchor="middle" font-family="Nunito" font-weight="700" font-size="15" fill="#C8E6C9">12&times;12</text>
                <!-- Nail -->
                <circle cx="20" cy="0" r="5" fill="#9E9E9E" stroke="#757575" stroke-width="1"/>
                <circle cx="20" cy="-1" r="2" fill="#BDBDBD"/>
            </g>

            <!-- ===== SIGN ARM 2: MITTEL (pointing RIGHT) — Orange ===== -->
            <g transform="translate(250, 260)">
                <!-- Arrow-shaped sign pointing right -->
                <polygon points="210,0 180,-30 -30,-30 -30,30 180,30" fill="#FB8C00" stroke="#E65100" stroke-width="2"/>
                <!-- Text -->
                <text x="80" y="5" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="white">MITTEL</text>
                <text x="80" y="24" text-anchor="middle" font-family="Nunito" font-weight="700" font-size="15" fill="#FFE0B2">13&times;13</text>
                <!-- Nail -->
                <circle cx="-20" cy="0" r="5" fill="#9E9E9E" stroke="#757575" stroke-width="1"/>
                <circle cx="-20" cy="-1" r="2" fill="#BDBDBD"/>
            </g>

            <!-- ===== SIGN ARM 3: KNIFFLIG (pointing LEFT) — Red ===== -->
            <g transform="translate(250, 390)">
                <!-- Arrow-shaped sign pointing left -->
                <polygon points="-210,0 -180,-30 30,-30 30,30 -180,30" fill="#E53935" stroke="#C62828" stroke-width="2"/>
                <!-- Text -->
                <text x="-80" y="5" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="22" fill="white">KNIFFLIG</text>
                <text x="-80" y="24" text-anchor="middle" font-family="Nunito" font-weight="700" font-size="15" fill="#FFCDD2">15&times;15</text>
                <!-- Nail -->
                <circle cx="20" cy="0" r="5" fill="#9E9E9E" stroke="#757575" stroke-width="1"/>
                <circle cx="20" cy="-1" r="2" fill="#BDBDBD"/>
            </g>
        </svg>

        <!-- ===== WORKSHEET IMAGES ===== -->

        <!-- Easy worksheet (small, left side, near green sign) -->
        <div style="position: absolute; top: 170px; left: 55px; z-index: 20;">
            <div style="background: white; padding: 5px; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.22), 0 0 0 2px #43A047;">
                <img src="https://www.lessoncraftstudio.com/samples/german/picture%20path/sample-4.jpeg" style="display: block; width: 125px; height: 162px; object-fit: cover; border-radius: 5px;" alt="Leicht Arbeitsblatt">
            </div>
            <!-- Green star marker -->
            <div style="position: absolute; top: -12px; right: -12px; width: 30px; height: 30px; background: #43A047; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; color: white;">&#9733;</span>
            </div>
        </div>

        <!-- Medium worksheet (medium, right side, near orange sign) -->
        <div style="position: absolute; top: 280px; right: 55px; z-index: 20;">
            <div style="background: white; padding: 5px; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.22), 0 0 0 2px #FB8C00;">
                <img src="https://www.lessoncraftstudio.com/samples/german/picture%20path/sample-2.jpeg" style="display: block; width: 145px; height: 187px; object-fit: cover; border-radius: 5px;" alt="Mittel Arbeitsblatt">
            </div>
            <!-- Orange star markers -->
            <div style="position: absolute; top: -12px; right: -12px; width: 30px; height: 30px; background: #FB8C00; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: white;">&#9733;&#9733;</span>
            </div>
        </div>

        <!-- Hard worksheet (large, left side, near red sign) -->
        <div style="position: absolute; top: 430px; left: 55px; z-index: 20;">
            <div style="background: white; padding: 5px; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.22), 0 0 0 2px #E53935;">
                <img src="https://www.lessoncraftstudio.com/samples/german/picture%20path/sample-1.jpeg" style="display: block; width: 165px; height: 213px; object-fit: cover; border-radius: 5px;" alt="Knifflig Arbeitsblatt">
            </div>
            <!-- Red star markers -->
            <div style="position: absolute; top: -12px; right: -12px; width: 34px; height: 34px; background: #E53935; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 11px; color: white;">&#9733;&#9733;&#9733;</span>
            </div>
        </div>

        <!-- Forking trail paths (SVG overlay) -->
        <svg style="position: absolute; bottom: 0; left: 0; width: 1000px; height: 200px; opacity: 0.15; z-index: 5;" viewBox="0 0 1000 200">
            <path d="M500,200 L500,120 Q500,80 460,60 L350,20" fill="none" stroke="#5D4037" stroke-width="6" stroke-linecap="round"/>
            <path d="M500,120 Q500,80 540,60 L650,20" fill="none" stroke="#5D4037" stroke-width="6" stroke-linecap="round"/>
            <path d="M500,140 L500,200" fill="none" stroke="#5D4037" stroke-width="6" stroke-linecap="round"/>
        </svg>

        <!-- Bottom Feature Pill -->
        <div style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <div style="background: rgba(255,255,255,0.95); padding: 16px 40px; border-radius: 35px; box-shadow: 0 6px 22px rgba(0,0,0,0.18); border: 3px solid #2E7D32;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 20px; color: #1B5E20; letter-spacing: 0.5px;">Perfekt f&uuml;r differenzierten Unterricht!</span>
            </div>
        </div>

    </div>
</body>
</html>
