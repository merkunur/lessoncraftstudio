assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Read 6 of 8 CVC words by sounding out + blending in 8 of 10
        trials.
      - Match 8 of 10 CVC words to their picture in 9 of 10 matching
        tasks.
      - Apply CVC-decoding strategy to a NEW unfamiliar CVC word in 6
        of 10 trials.

    Differentiation:
    - Pre-K: 4 strong-CVC words with picture support; teacher-led
      sounding-out.
    - K: 8-10 CVC words; independent decoding.
    - Grade 1+: extend to read-cvce-words (silent-e words: cake, bike;
      Arc 13+ candidate) + bridge to consonant-blend decoding.

