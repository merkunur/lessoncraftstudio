assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Recite the 7 days in correct sequence (Monday → Sunday) in
        8 of 10 trials.
      - Name the day BEFORE and AFTER a given day in 7 of 10 trials.
      - Identify today's day of the week + tomorrow's day in 8 of 10
        morning-circle observations.

    Differentiation:
    - Pre-K: 5 days only (Monday-Friday school days); receptive
      identification.
    - K: all 7 days; sequence recall + before/after questions.
    - Grade 1+: extend to month-of-year work (identify-months-of-year
      Arc 11+ candidate); bridge to date-reading (Tuesday, March 5th).

