assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 6 of 8 family-member vocabulary items in 8 of 10 trials.
      - Use the "This is a ___" frame to introduce family members in
        7 of 10 productive-language attempts.
      - Articulate that family structures vary ('every family is
        different') in 6 of 10 trials.

    Differentiation:
    - Pre-K: 4 most-frequent family roles (father, mother, sister,
      brother); receptive identification primarily.
    - K: 8 family-member roles + introduction frame.
    - Grade 1+: extend to family-relationship vocabulary ('my mother's
      mother is my grandmother'); bridge to extended-family vocabulary
      (uncle, aunt, cousin) in future package.

