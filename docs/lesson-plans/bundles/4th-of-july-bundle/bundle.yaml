thematicCoherence:
  en: |
    All 5 packages cohere around the 4th of July theme + inherit
    holiday-bundle template structure from easter + christmas +
    thanksgivinng (action-verbs + counting + color-sorting + cross-
    cultural-greetings + four-seasons). 4th holiday-template
    instantiation extends doctrine validated at 3-instance threshold.

    **Pedagogical sequencing:**
    1. **identify-and-name-action-verbs** — Foundational 4th-of-July
       action vocabulary (celebrate, parade, picnic, watch fireworks,
       gather, light sparklers). Same shared package across many
       bundles (~15 bundles now); 4th-of-July-context substantiates
       verb-vocabulary with concrete summer-celebration actions.
    2. **count-objects-1-to-10** — Counting practice using 4th-of-
       July items as countable subjects (5 fireworks; 3 sparklers;
       7 flags; 8 picnic items; 4 hot dogs). Same shared package
       across many bundles.
    3. **sort-by-color** — Color-cognition work using American-
       flag-palette (red stripes vs white stars vs blue field).
       Limited 3-color palette supports concentrated color-sorting
       work — vivid + culturally meaningful in US-American contexts.
    4. **compare-greeting-routines-across-cultures** — Multilingual-
       awareness work via national-independence-celebration
       traditions across cultures (US July 4 vs Mexican Sept 16 vs
       Brazilian Sept 7 vs French Bastille Day July 14 vs Indian
       Aug 15 vs Vietnamese Sept 2 vs Chilean Sept 18 vs Costa
       Rican Sept 15 vs Argentinean July 9). Particularly load-
       bearing for international school + dual-language program
       contexts — many K-3 multilingual classrooms have students
       whose families celebrate national independence on different
       dates with different traditions.
    5. **identify-four-seasons** — Seasonal-cognition work situating
       4th-of-July as summer-anchored celebration. Same shared
       package with winter + summer + spring + tree + beach + easter
       + christmas + thanksgivinng bundles. Cross-locale relevance:
       summer in Northern Hemisphere; non-summer in Southern
       Hemisphere — bundle materials acknowledge cross-hemisphere
       seasonal variation.

    **Strand spread:** 1 vocabulary-acquisition (action-verbs) + 1
    numeracy + 1 cognitive-sorting (color) + 1 multilingual-language-
    awareness + 1 environment-and-weather (four-seasons). **5
    distinct strands.** Holiday-template 4th instantiation locks
    template doctrine empirically validated across 3+ instances.

    **Suggested unit duration:** 3-4 weeks (1 package per week).
    Timed to early July (US Independence Day weekend July 4).
    Time-bounded relevance like other holiday bundles.

    **Multilingual classroom relevance:** 4th-of-July vocabulary
    primarily US-American context (Independence Day / 4th of July).
    Other locales' national-independence-celebration vocabulary
    varies extensively (Día de Independencia / Fête nationale /
    Festa nacional / Independence Day [India, English-medium]).
    Critical inclusive framing — multilingual K-3 classrooms have
    students from many national contexts; bundle materials should
    frame as "one cultural tradition among many national-independence
    celebrations worldwide" + invite students to share their
    family's national-celebration equivalents.

    **Pillar 2 architectural pattern:** 4th-of-july-bundle exemplifies
    holiday-template 4th instantiation. Theme-axis-key holiday-4th-of-
    july (vs easter at spring-anchored; vs christmas at winter-
    anchored; vs thanksgivinng at autumn-anchored). 3 of 4 seasonal-
    quartet holiday-template positions filled (spring + winter +
    autumn + summer-anchored 4th-of-July). Doctrinal pattern: holiday-
    template + seasonal-anchoring composition enables 4-seasonal-
    quartet holiday-bundle coverage. Future holiday bundles
    (halloween + valentines + diwali + hanukkah + chinese-new-year
    + ramadan + tet candidates) inherit template.
