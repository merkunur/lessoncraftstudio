  - IB-PYP.HowTheWorldWorks

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify each of the 5 3D-shapes by name in 4 of 5 trials (receptive).
      - Name each of the 5 3D-shapes when shown the shape in 3 of 5 trials (productive).
      - Match 2D-shape to its 3D-shape relative in 4 of 5 trials.

    Differentiation:
    - Pre-K: receptive only; 3D-shape exposure without expected production.
    - K: full productive; 2D↔3D mapping fluency.
    - Grade 1+: extend to describe-shape-attributes (faces, edges, vertices on
      3D shapes) + compose-shapes-from-parts.

    Prerequisite check: kids who haven't completed identify-2d-shapes-basic
    benefit from a brief 2D-shape refresher at warmup. The 2D↔3D mapping
    pedagogy assumes 2D-shape vocabulary is already in place.

