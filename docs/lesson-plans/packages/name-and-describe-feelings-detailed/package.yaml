# Teaching package — name and describe complex feelings with detailed vocabulary
# Arc 16 Phase 1.2 (science / personal-social-emotional-development 3/6 → 4/6; extends Arc 8-12 express-feelings-with-words basic-emotions work into complex-emotions vocabulary).

targetSlug: name-and-describe-feelings-detailed
language: en
title:
  en: "Naming Complex Feelings — frustrated, anxious, proud, embarrassed, jealous"

description:
  en: "Kindergarten / Grade 1 social-emotional package extending emotion-vocabulary work into COMPLEX emotions beyond the basic 4 (happy/sad/angry/scared). EXPLICITLY DISTINCT from existing express-feelings-with-words (Arc 8-12) which teaches RECOGNIZE + NAME + EXPRESS for basic emotions: this package teaches kids to NAME + DESCRIBE COMPLEX emotions — frustrated (when something doesn't work despite trying), anxious (worried about future), proud (felt big after accomplishment), embarrassed (when others noticed a mistake), jealous (wishing for what others have), surprised (unexpected event), curious (wanting to know more), disappointed (when expectation isn't met), bored (waiting too long with nothing to do), excited (looking forward to something). Critical developmental step from BASIC emotion-recognition (happy/sad/angry/scared) to NUANCED emotion-vocabulary that empowers kids to articulate complex internal states. Foundation for self-regulation + empathy + conflict-resolution work (Arc 17+ candidates). PSED strand: 3/6 → 4/6 at this Phase 1.2 close. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + complex-emotion introduction. Teacher
      reviews basic 4 emotions: "We know HAPPY, SAD, ANGRY,
      SCARED. Today we learn MORE feeling-words." Teacher
      introduces FRUSTRATED via concrete scenario: "Imagine you
      try to tie your shoes, and the laces won't stay tied no
      matter how hard you try. That sticky annoying feeling
      when something doesn't work even though you tried — that
      feeling is FRUSTRATED. It's a kind of ANGRY mixed with
      TIRED." Class repeats word; teacher displays an image of
      a frustrated face. Teacher introduces 3 more emotions
      similarly: ANXIOUS (scenario: worried about a test
      tomorrow), PROUD (scenario: completed a hard puzzle), and
      EMBARRASSED (scenario: tripped in front of friends).
      Pattern emphasis: "Each complex feeling has a STORY — a
      situation where you'd feel it. Stories help us remember
      the words."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + emotion-vocabulary card routine. Each pair
      receives 12 emotion-vocabulary cards (faces + word labels
      for: frustrated, anxious, proud, embarrassed, jealous,
      surprised, curious, disappointed, bored, excited, plus 2
      review basic-emotion cards happy + angry). Pair takes
      turns: kid A reads a scenario card (10 scenarios provided:
      "You worked on a tower of blocks for a long time + it
      kept falling down" / "You waited a long time for your
      turn on the swing" / "You learned something new about
      dinosaurs" / "Your friend got a toy you really wanted" /
      etc.). Together they pick the emotion-vocabulary card
      that matches. Recast errors with story-anchor demo
      ("waiting a long time with nothing fun to do — that's
      BORED. Bored is when you wish something interesting would
      happen."). NO PRESSURE to use specific complex labels —
      kids who say "tired" instead of "frustrated" are heard +
      gently introduced to the more-precise word.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort (emotion-faces
      grouped by emotion-category: "happy-family" face vs
      "anxious-family" face vs "proud-family" face). Station 2:
      matching worksheet (scenario-to-emotion pairs). Station 3:
      math-worksheet (count-frequency exercise: how many
      different feelings have you had today? Tally). Station 4:
      manipulative cut-out activity (use cut-out emotion-icons
      to build a "feeling-day" tracker — show what you felt this
      morning + at lunch + during recess).
  closure:
    durationMinutes: 5
    body: |
      Whole-class emotion-vocabulary closure. Teacher names
      scenarios; class collectively picks the emotion: "You
      learned a new game + can't wait to play it again!" (class:
      EXCITED!) "Your turn at the slide kept getting taken by
      bigger kids!" (FRUSTRATED!) "You finished reading a
      chapter book all by yourself!" (PROUD!) Forward-pointer:
      "Today we learned big feeling-words. When we come back
      next, we'll learn what to DO with these feelings —
      strategies to feel calmer when frustrated or anxious, and
      ways to share proud and excited feelings with others
      (REGULATE EMOTIONS strand)."

