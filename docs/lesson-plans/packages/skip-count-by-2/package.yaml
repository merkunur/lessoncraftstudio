compositionalRationale:
  en: |
    Primary strand: early-numeracy / counting-and-cardinality (skip-
    counting). Secondary strand: pattern-recognition (skip-counting is
    structurally a numerical pattern; pair with create-original-pattern
    Arc 8 Phase 1 sibling for image-side counterpart). Tertiary strand:
    vocabulary acquisition (vocab-anchored — even-number names
    reinforced through chant and matching).

    Architectural significance: FIRST skip-counting package. Bridges
    counting-by-1s (Arc 1+3 packages: count-objects-1-to-10 + count-
    objects-1-to-20 + count-on-from-given-number) into skip-counting.
    Skip-counting is the conceptual on-ramp to multiplication
    (counting-by-2s = ×2; counting-by-5s = ×5; counting-by-10s = ×10);
    K-3 numeracy depth depends on skip-counting fluency before formal
    multiplication introduction in Grade 2-3.

    Pattern-bridge: skip-counting is structurally a numerical pattern.
    The Arc 8 Phase 1 set (create-original-pattern + count-by-2s-to-20)
    pairs the image-pattern + numerical-pattern domains explicitly.
    Kids who can construct AB / AAB / ABB image patterns can construct
    "skip 1, skip 1, skip 1" numerical patterns. Same cognitive
    architecture; different content domains.

    Distinctive composition: 3 chart-count exercises (positions 1, 2,
    5) across 3 theme contexts (animals, fruits, vehicles) — same
    skip-counting-by-2s mechanic; different vocabulary contexts.
    math-worksheet at position 3 reinforces the +2 arithmetic that
    underlies skip-counting. matching at position 4 reinforces
    even-number vocabulary.

    Class B FLEXIBLE substrate: composes against image-library breadth
    + numerals theme. Counting-by-2s works with any countable object
    set; substrate-readiness is universal.

    K-3 multilingual classroom relevance: number names are early-
    language-acquisition targets across all 11 platform locales; skip-
    counting chants ("two, four, six, eight, ten...") embed number
    names in a memorable rhythmic structure. Cross-locale: every
    platform locale has its own number-name set (CLAUDE.md §6); skip-
    counting chants are reusable infrastructure across all locales.

