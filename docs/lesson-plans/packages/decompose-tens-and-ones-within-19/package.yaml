assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Decompose 8 of 10 teen numbers (10-19) into correct
        '10 + n' representation.
      - Identify the tens digit (always 1) and ones digit in
        a written teen numeral in 8 of 10 trials.
      - Build a teen number with bundled manipulatives (one
        ten + n ones) in 7 of 10 trials.
      - Articulate the decomposition aloud ('fourteen is one
        ten and four ones') in 5 of 10 productive-language
        trials.

    Differentiation:
    - Pre-K: skip the full 10-19 range; build counting fluency
      with 1-10 first; the bundle-of-ten move can be
      introduced informally with concrete manipulatives.
    - K: full 10-19 decomposition work; manipulative bundling
      heavily scaffolded; the spoken decomposition is the
      primary fluency target.
    - Grade 1: brief reinforcement; teen decomposition is
      prerequisite knowledge for the sibling identify-tens-
      and-ones-2-digit work; fluency target is mental
      recognition of teen-number structure without
      manipulatives.
    - Grade 2+: extend to numbers 20-99 via the sibling
      package + bridge to 3-digit place-value (Grade 2 target).

