assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Recognize numerals 1-20 by name in 8 of 10 trials.
      - Match numeral to quantity-representation (dots or objects)
        in 7 of 10 trials.
      - Identify missing numeral in a sequence (5, 6, ?, 8, 9) in
        6 of 10 trials.
      - Order 5 random numerals from smallest to largest in 6 of
        10 trials.

    Differentiation:
    - Pre-K: numerals 1-10 only; concrete-quantity matching
      emphasis.
    - K: numerals 1-15 (then 1-20).
    - Grade 1: numerals 1-20 fluent + extend to 1-50.
    - Grade 2+: extend to numerals 1-100 + bridge to writing-
      numerals work + place-value-aware recognition.

