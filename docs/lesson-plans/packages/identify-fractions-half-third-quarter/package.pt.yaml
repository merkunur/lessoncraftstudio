# Teaching package — identify fractions (halves, thirds, quarters) (pt sparse-override)
# Arc 18 Phase 1.1 (19th-consecutive pt cadence per Arc 7+ convention). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF02MA15 (geometria; reconhecer partes iguais) + EF02MA16 (comparar e classificar figuras planas) + ponte para EF03MA10 (compreender fração como representação da relação parte-todo).

targetSlug: identify-fractions-half-third-quarter
language: pt

title:
  pt: "Identificar frações — nomear a parte como metade, terço ou quarto"

description:
  pt: "Pacote de matemática + geometria para o 1.º e 2.º ano do ensino fundamental, ensinando crianças a IDENTIFICAR uma forma repartida pelo seu nome de parte igual — METADE (uma de 2 partes iguais), TERÇO (uma de 3 partes iguais) ou QUARTO (uma de 4 partes iguais). Onde o parceiro do par partition-shape-halves-quarters (slot 1) ensinou a AÇÃO de repartir + o vocabulário de partes iguais no contexto do corte de inteiros, este pacote ensina o RECONHECIMENTO — as crianças veem uma forma já repartida (SEM ver o corte) e nomeiam a parte igual. Estende o trabalho do slot 1 adicionando os TERÇOS (3 partes iguais) — que a CCSS.2.G.A.3 introduz no 2.º ano ao lado de metades + quartos. Insight crítico: 'uma metade' é uma de duas peças iguais; 'um terço' é uma de três peças iguais; 'um quarto' é uma de quatro peças iguais. O NÚMERO de peças iguais determina o NOME. Por §A.13.30 enquadramento informal K-1 a 2.º ano: o trabalho de nomeação de frações introduz os NOMES das partes iguais + a estrutura visual (contagem das peças iguais; identificação da parte sombreada); a notação fracionária formal (1/2 + 1/3 + 1/4 escrita simbolicamente) é conteúdo do 3.º ano em diante per CCSS.3.NF.A e está explicitamente fora deste escopo. Âncora dupla: CCSS.1.G.A.3 + CCSS.2.G.A.3. Parceiro do par: partition-shape-halves-quarters (slot 1 da Fase 1.1). O par satura o strand de geometria em 8/8 — o 23.º strand saturado no catálogo. Alinhamento BNCC: EF02MA15 + EF02MA16 (reconhecimento e classificação de figuras planas); ponte para EF03MA10 (introdução à fração como relação parte-todo). 5 exercícios + 7 materiais imprimíveis ao longo de 1 semana."

structure:
  warmup:
    body: |
      Introdução com toda a turma + revisão da nomeação das
      partes iguais. Você mostra três formas repartidas lado
      a lado: um círculo em metades (2 partes iguais); um
      círculo em terços (3 partes iguais); um círculo em
      quartos (4 partes iguais). "Ontem aprendemos a CORTAR
      formas em peças iguais. Hoje aprendemos a NOMEÁ-LAS
      quando as vemos já cortadas." Você aponta para cada
      uma: "Este círculo está cortado em 2 partes iguais.
      Cada parte é uma METADE. Este está cortado em 3 partes
      iguais. Cada parte é um TERÇO. Este está cortado em 4
      partes iguais. Cada parte é um QUARTO." A turma repete
      em coro: "Duas partes iguais — metades! Três partes
      iguais — terços! Quatro partes iguais — quartos!" Você
      sombreia uma parte de cada: "Quando vemos uma forma
      sombreada assim, dizemos 'uma metade está sombreada' ou
      'um terço está sombreado' ou 'um quarto está sombreado'.
      Também podemos dizer 'metade da forma', 'um terço da
      forma', 'um quarto da forma'." Ênfase do padrão:
      "Contem as partes iguais. 2 = metades. 3 = terços. 4 =
      quartos."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de reconhecimento de
      frações com peças de papel. Cada dupla recebe uma
      mistura de peças de formas repartidas (whole-circle,
      half-circle, third-circle, quarter-circle; whole-
      square, half-square, third-square, quarter-square;
      mistura de formas + mistura de repartições). A dupla
      joga o desafio de nomeação: a criança A escolhe
      qualquer peça da mistura; a criança B nomeia a
      repartição ('isso é uma metade', 'isso é um terço',
      'isso é um quarto'). A criança A verifica contando
      quantas das mesmas peças fazem um inteiro (2 dessas
      metades = inteiro; 3 desses terços = inteiro; 4 desses
      quartos = inteiro). Depois trocam. Recapture erros com
      a dica de contagem de peças iguais ("Quantas dessas
      peças cabem juntas para formar a forma inteira? Duas —
      então cada peça é uma METADE"). Tempo livre no fim: as
      crianças separam toda a pilha pelo nome de parte igual
      (pilha de metades, pilha de terços, pilha de quartos).
      A contagem-até-o-inteiro é a habilidade determinante —
      as crianças aprendem a identificar a repartição não
      por semelhança visual, mas CONTANDO quantas peças
      iguais formam o inteiro.
  scaffold:
    body: |
      Rotação por estações. Estação 1: atividade de
      correspondência — combinar cada imagem de forma
      repartida com seu nome (metade, terço, quarto).
      Estação 2: atividade missing-pieces — as crianças
      veem uma forma com uma parte igual sombreada +
      identificam qual repartição representa (metade /
      terço / quarto). Estação 3: atividade picture-sort —
      separar formas repartidas nas caixas 'metades',
      'terços', 'quartos'. Estação 4: atividade math-puzzle
      (dado um nome + uma forma base, as crianças
      selecionam a forma repartida correspondente). O
      picture-sort da estação 3 é o diagnóstico determinante
      — as crianças têm de contar mentalmente as peças
      iguais em cada forma + dirigi-la à caixa correta.
  closure:
    body: |
      Recapitulação rápida de reconhecimento de frações com
      toda a turma. Você mostra formas no quadro com uma
      parte igual sombreada; a turma nomeia em coro a
      repartição. "Círculo, 2 partes iguais — metade
      sombreada! Quadrado, 4 partes iguais — quarto
      sombreado! Retângulo, 3 partes iguais — terço
      sombreado! Círculo, 4 partes iguais — quarto
      sombreado!" Você faz a pergunta diagnóstica: "E se a
      forma tiver 2 peças mas elas NÃO forem iguais — uma
      peça é uma metade?" (Turma: Não! Metades têm de ser
      IGUAIS.) Depois: "E se eu cortar uma forma em 3 peças
      iguais? Como se chama cada peça?" (Turma: Terço!)
      Aponte adiante: "Hoje nomeamos formas repartidas —
      metades, terços, quartos. Peças iguais têm nomes; o
      NÚMERO de peças dá o NOME (2 = metades; 3 = terços; 4
      = quartos). Completamos nosso trabalho de GEOMETRIA do
      K-1! Todas as 8 habilidades de geometria aprendidas.
      Mais à frente na escola, você vai conhecer os NÚMEROS
      FRACIONÁRIOS — escritos como 1/2 ou 1/3 ou 1/4 — mas
      os nomes que aprendeu hoje são a base. Uma metade é
      sempre uma metade, quer você diga a palavra, quer
      escreva o número."

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Nomear uma repartição em 2 partes iguais como
        'metades' (a repartição) ou 'metade' (uma peça) em 8
        de 10 tentativas.
      - Nomear uma repartição em 3 partes iguais como
        'terços' ou 'terço' em 7 de 10 tentativas.
      - Nomear uma repartição em 4 partes iguais como
        'quartos' ou 'quarto' em 8 de 10 tentativas.
      - Distinguir a repartição em partes iguais (com nome:
        metades / terços / quartos) da repartição em partes
        desiguais (sem nome: apenas pedaços) em 7 de 10
        tentativas.
      - Contar as peças iguais numa forma repartida para
        determinar o nome da repartição (2 → metades; 3 →
        terços; 4 → quartos) em 7 de 10 tentativas.
      - Usar o vocabulário 'metade' / 'terço' / 'quarto' /
        'partes iguais' / 'sombreada' corretamente em 6 de
        10 tentativas de produção verbal.

    Diferenciação:
    - Pré-escola: pular a nomeação de frações inteiramente;
      revisar antes o reconhecimento de formas inteiras
      (per Arc 9 identify-2d-shapes-basic).
    - Educação infantil (5-7 anos): introduzir apenas as
      metades (pular terços + quartos); usar o parceiro do
      par partition-shape-halves-quarters (slot 1) como
      cobertura principal alinhada à idade.
    - 1.º ano: fluência completa em nomeação de metades +
      quartos; terços introduzidos informalmente mas não
      avaliados.
    - 2.º ano: fluência completa em nomeação de metades +
      terços + quartos per CCSS.2.G.A.3.
    - 3.º ano em diante: ponte para CCSS.3.NF.A 'compreender
      a fração 1/b como a quantidade formada por 1 parte
      quando um inteiro é repartido em b partes iguais';
      notação fracionária simbólica formal (1/2 + 1/3 + 1/4
      + 2/3 + 3/4) começa aqui.

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en).
    Os campos materials, composedExercises,
    curriculumStandards e learningObjectives são herdados
    do package.yaml via merge sparse-override e não são
    repetidos aqui per a convenção Arc 7+.

    Vocabulário pt-BR canônico para nomeação de frações:
    - 'metade' / 'metades' (substantivo; 1/2 informal)
    - 'terço' / 'terços' (substantivo; 1/3 informal); pt-BR
      K-1 prefere 'terço' singular; 'um terço' (um terço da
      forma)
    - 'quarto' / 'quartos' (substantivo; 1/4 informal);
      alternativa 'quarta parte' em registro mais formal
      mas pt-BR K-1 prefere 'quarto'
    - 'partes iguais' (frase canônica; a estrutura central
      do conceito de repartição)
    - 'sombreado' / 'sombreada' (shaded — a parte
      destacada de uma forma repartida; concordância de
      gênero com o substantivo da forma)
    - 'inteiro' (whole; alternativa 'todo' em registro mais
      formal)

    Diferença sutil pt-BR vs pt-PT: pt-PT usa 'quarto'
    e 'terço' de modo idêntico; a divergência principal é
    fonológica (entonação) + ortográfica em outros temas,
    não no vocabulário fracionário K-1. Não há divergência
    significativa para este pacote.

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF02MA15 ('Reconhecer, comparar e nomear figuras
    planas') + EF02MA16 ('Classificar figuras planas em
    relação a seus lados e vértices') cobrem o trabalho de
    geometria + reconhecimento de partes iguais.
    EF03MA10 ('Identificar partes de um inteiro em
    representações gráficas, contagens ou medidas') é a
    ponte BNCC para o conceito de fração como relação
    parte-todo — pacote subsequente no 3.º ano introduz a
    notação fracionária simbólica.

    Material concreto + manipulação manual é
    pedagogicamente determinante na cultura escolar
    brasileira K-1 + 2.º ano — a contagem física das peças
    iguais antes do reconhecimento visual é caminho
    canônico pedagogicamente. O manipulative-cut-outs com
    vocabKeys enumerando 8 tipos de peças fracionárias
    (whole-circle, half-circle, third-circle, quarter-
    circle; mesmas variantes para o quadrado) sustenta
    exatamente esse modo de ensino: as crianças pegam
    fisicamente cada peça, contam quantas formam um
    inteiro, e nomeiam a repartição.

    Por §A.13.30 enquadramento informal K-1 a 2.º ano:
    este pacote NÃO ensina notação fracionária 1/2 + 1/3 +
    1/4 — apenas o vocabulário (metade, terço, quarto,
    partes iguais) + a estrutura visual + contagem das
    partes iguais. Famílias brasileiras frequentemente
    perguntam por notação fracionária mais cedo;
    o parent-take-home-letter explicita que o
    desenvolvimento da fração simbólica tem seu momento
    canônico no 3.º + 4.º ano do EF.

    Saturação de strand: este pacote (junto com o slot 1
    partition-shape-halves-quarters) satura o strand
    geometry em 8/8 — 23.º strand saturado no catálogo.
    Marco arquitetônico do Arc 18 P1.1; sinaliza o fim do
    trabalho de geometria K-1 + 2.º ano no catálogo, com
    todos os 8 alvos cobertos por pacotes shipping-state.
