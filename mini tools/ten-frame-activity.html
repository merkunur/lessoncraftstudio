<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ten Frame — Activity — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=2">
  <!-- Prototype-only celebrate-bounce per the activity-page redesign
       commission. Scoped to this wrapper only — choice-board / cvc-builder
       / syllable-builder wrappers do not include this <style> block and
       therefore keep the shell's existing 4%-scale celebrate. Lands the
       prompt at scale(1.04) so the final resting state matches every other
       activity; the keyframe is purely additive entry motion. When the
       redesign cascades, this block lifts into lcs-shell.css. -->
  <style>
    @keyframes lcs-celebrate-bounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.08); }
      60%  { transform: scale(0.97); }
      100% { transform: scale(1.04); }
    }
    .lcs-activity-prompt.celebrate {
      animation: lcs-celebrate-bounce 360ms cubic-bezier(.2,.8,.2,1) 1;
    }
    @media (prefers-reduced-motion: reduce) {
      .lcs-activity-prompt.celebrate { animation: none; }
    }
  </style>
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then the shared ten-frame core, then this activity wrapper. -->
  <script src="/mini-tools/lcs-shell.js"></script>
  <script src="/mini-tools/ten-frame-core.js"></script>
  <script src="/mini-tools/ten-frame-activity.js"></script>
  <script>
    LCS.mount(TenFrameActivity, { mount: '#lcs-root' });
  </script>
</body>
</html>
