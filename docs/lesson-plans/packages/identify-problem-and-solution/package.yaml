# Teaching package — identify the problem and solution in a story
# Arc 18 Phase 1.4 (early-literacy / reading-comprehension strand 7/10 → 8/10). Builds on Arc 14 Phase 2 sequence-3-event-story prerequisite (kids who can sequence first/next/last events now identify CAUSAL structure within those events: what went wrong + how it was solved).

targetSlug: identify-problem-and-solution
language: en
title:
  en: "What Went Wrong? How Was It Fixed? — identify the problem and solution"
description:
  en: "Kindergarten / Grade 1 narrative-comprehension package teaching kids to identify the PROBLEM and the SOLUTION in a 3-event story. Builds DIRECTLY on Arc 14 Phase 2 sequence-3-event-story (kids who can sequence first/next/last events now identify the CAUSAL structure WITHIN those events). Critical narrative-comprehension skill: kids look at a 3-event picture story (e.g., kid spills cup of milk → kid is sad → mom helps clean up + pours new cup), identify what WENT WRONG (the spilled milk = problem) and HOW IT WAS FIXED (mom helps + pours new cup = solution). Reading-comprehension strand advances 7/10 → 8/10. Per §A.13.30 K-1 informal framing: K problem-and-solution work is CONCRETE STORY-STRUCTURE recognition (kid sees 3-event sequence → kid points to 'what went wrong' picture → kid points to 'how it was fixed' picture → kid narrates the structure aloud). NOT formal narrative-element analysis (which is Grade 3+ work introducing terms like 'conflict', 'resolution', 'rising action'); the K-1 pedagogy uses everyday language ('what went wrong' / 'how it was fixed') to surface the underlying narrative pattern. CCSS.RL.K.3 ('With prompting and support, identify characters, settings, and major events in a story') + CCSS.RL.1.3 ('Describe characters, settings, and major events in a story, using key details') primary anchors. 5 worksheet exercises + 8 printable materials over a 1-week unit (Literacy 8-material canonical per §A.13.37 + pair-coherent with identify-main-character Arc 17 P1.5 + identify-setting Arc 18 P1.2 narrative-structure precedents). Load-bearing material: sequencing-mat at position 1 (the 3-event sequence is the structural substrate; problem-solution recognition layers on top — package-specific addition beyond the identify-main-character/setting baseline, replaces sentence-strips slot because problem-solution narration is multi-clause causal structure rather than single-clause descriptive frames). Matching-mat at position 4 (problem-to-solution pairing). Manipulative-cut-outs in `mode: single-repeat` (canonical-correct per §A.13.35 + identify-main-character/setting configuration) with miscellaneous theme."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + problem-and-solution introduction.
      Teacher displays a 3-event story sequence (cards in
      order: 1. kid carrying full cup of milk; 2. kid trips +
      milk spills everywhere; 3. mom helps wipe up + pours new
      cup). "Look at these 3 pictures. We learned to put them
      in order — first, next, last — last week. Today we look
      INSIDE the story. WHAT WENT WRONG in this story?" Class
      identifies the problem: the milk spilled! "And HOW WAS
      IT FIXED? Mom helped clean up and gave a new cup. The
      problem is the spilled milk. The solution is mom's
      help." Teacher repeats with 2 more 3-event stories: kid
      can't reach toy on shelf → kid stretches but still
      can't reach → big sister gets it down (problem: can't
      reach; solution: sister helps); seed planted but
      forgotten → seed not watered + dries out → kid waters
      seed + plant grows (problem: forgot to water; solution:
      kid waters). Pattern emphasis: "Stories often have a
      PROBLEM (something goes wrong, something needs help)
      and a SOLUTION (someone helps, something fixes it).
      Spotting the problem and solution helps us understand
      WHY the story happens."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + problem-and-solution identification routine.
      Each pair receives 4 sets of 3-event story cards (e.g.,
      set A: kid loses crayon → kid is sad → friend shares
      crayons; set B: dog is hungry → dog whimpers at empty
      bowl → mom fills bowl; set C: balloon pops → kid cries
      → grandparent gives a new balloon; set D: kid is too
      cold outside → kid shivers → kid puts on jacket). Pair
      takes turns: kid A lays out a set in order (uses prior
      sequence-3-event-story skill); kid B identifies which
      picture shows the PROBLEM + which shows the SOLUTION,
      then narrates: "The problem is [X]. The solution is
      [Y]." Recast errors with structural cues ("you said
      the kid putting on the jacket is the PROBLEM — but
      remember, the problem is what WENT WRONG. The kid was
      cold — that's the problem. Putting on the jacket FIXED
      the problem — that's the solution."). Optional
      extension: pair invents a new 3-event problem-solution
      story orally (uses everyday classroom situations: lost
      pencil → sad → friend shares; couldn't open snack →
      asked teacher → teacher opened it). Note for the
      teacher: K kids sometimes confuse the SETTING (where
      the story happens) with the PROBLEM (what goes wrong),
      or confuse the EVENT-SEQUENCE (first-next-last) with
      the CAUSAL-STRUCTURE (problem-solution). Explicit
      questioning helps disambiguate: "What went WRONG?" =
      problem; "How was it FIXED?" = solution. The 3-event
      sequence is the STRUCTURAL VEHICLE; problem-and-
      solution is the CAUSAL PATTERN inside the sequence.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet
      sequencing problem-solution stories (extends sequence-
      3-event-story exercise). Station 2: matching worksheet
      (problem picture → solution picture; e.g., "spilled
      milk" matches "mom cleans up"). Station 3: missing-
      pieces worksheet (3-event problem-solution story with
      one card missing — kid identifies whether the missing
      card is the PROBLEM, the SOLUTION, or the middle event).
      Station 4: vocabulary-tracing-strips for problem +
      solution + helper + fix vocabulary (the language-frame
      substrate for narrating problem-solution structures).
  closure:
    durationMinutes: 5
    body: |
      Whole-class problem-and-solution review + reading-
      comprehension strand advancement. Teacher displays a
      new 3-event story (e.g., kid wakes up late → misses
      school bus → mom drives kid to school). Class chorally
      identifies: "PROBLEM: missed the bus! SOLUTION: mom
      drove to school!" Teacher then asks the meta-question:
      "Why is it useful to spot the PROBLEM and SOLUTION in
      a story?" (Class brainstorms: it helps us understand
      what the story is ABOUT; it tells us WHY the
      characters do what they do; it shows us how problems
      get FIXED in real life too.) Forward-pointer: "Today
      we learned to find the PROBLEM and SOLUTION in 3-
      event stories. Next we'll learn to spot when stories
      are MAKE-BELIEVE (fiction) or REAL (nonfiction) —
      distinguish-fiction-from-nonfiction is the next
      reading-comprehension target. The reading-
      comprehension strand has 8 of 10 targets DONE after
      today; 2 more to go (distinguish-fiction-from-
      nonfiction + read-and-follow-2-sentence-instruction)."

