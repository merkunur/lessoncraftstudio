thematicCoherence:
  en: |
    All 5 packages cohere around the activities theme + extend cultural-
    arts cluster to physical-recreation context. Mirrors music-bundle's
    cultural-arts composition but anchors at physical-activity rather
    than auditory-arts.

    **Pedagogical sequencing:**
    1. **identify-and-name-action-verbs** — Foundational activity-action
       vocabulary (run, jump, swim, dance, play, climb, ride, throw,
       catch, kick). Same shared package across many bundles (~16
       bundles now); activities-context substantiates verb-vocabulary
       with concrete physical-action observations + kinesthetic-learning
       opportunities (kids perform actions during pair work).
    2. **sort-by-category** — Category-classification work
       distinguishing indoor activities (chess + board games + video
       games) vs outdoor activities (soccer + bike-riding + swimming)
       OR active vs quiet (running vs reading; jumping vs puzzles) OR
       solo (drawing + reading) vs team (basketball + soccer). Same
       shared package; activities-context enables multi-axis activity
       classification.
    3. **count-objects-1-to-10** — Counting practice using activity
       items as countable subjects (5 players on a team; 3 jump-rope
       turns; 7 balls in the gym; 8 dance steps; 4 climbing-rocks).
       Same shared package across many bundles.
    4. **use-size-comparison-words** — Comparison work using activity-
       size contrasts (big ball vs small ball; tall jump vs short hop;
       long swim vs short splash; fast sprint vs slow walk). Same
       shared package; activity-size variation supports kinesthetic
       comparison work.
    5. **compare-greeting-routines-across-cultures** — Multilingual-
       awareness work via cross-cultural recreation/sport traditions
       (cricket in India/UK + baseball in US + football/soccer globally
       + martial arts in East Asia + capoeira in Brazil + yoga in
       India). Particularly load-bearing for international school +
       dual-language program contexts — kids' families have recreation
       + sport preferences varying by national/cultural background.
       Bundle materials welcome diverse cultural-recreation traditions.

    **Strand spread:** 1 vocabulary-acquisition (action-verbs) + 1
    cognitive-sorting + 1 numeracy + 1 comparison + 1 multilingual-
    language-awareness. **5 distinct strands.** Cross-strand cultural-
    arts cluster bundle pattern parallel to music-bundle but
    distinguished by physical-recreation anchor.

    **Suggested unit duration:** 4-5 weeks (1 package per week).
    Natural fit alongside physical-education weeks OR seasonal sports
    + recreation contexts. Particularly engaging for K-3 — activities
    are high-energy + high-engagement + culturally diverse.

    **Multilingual classroom relevance:** activity vocabulary cognate-
    rich Romance (actividad / activité / attività / atividade); Germanic-
    distinct (Aktivität / activiteit / aktivitet / toiminta). Specific
    sport vocabulary highly culturally specific (cricket / críquet /
    cricket / críquete; baseball / Baseball / béisbol / baseball /
    baseball / beisebol; football/soccer / Fußball / fútbol / football /
    calcio / futebol). Cross-cultural-recreation variation rich +
    pedagogically valuable for multilingual classrooms.

    **Pillar 2 architectural pattern:** activities-bundle exemplifies
    cultural-arts cluster sub-axis extension (recreation sub-axis;
    parallel to music-bundle's auditory-arts sub-axis). Theme-axis-key
    cultural-arts-activities-recreation (vs cultural-arts-music at
    auditory-arts). Cultural-arts cluster now at 2 bundles;
    pre-substantial-coverage state. Future cultural-arts cluster
    expansion (dance + arts-and-crafts + theater + visual-arts
    candidates) requires themeAxisKey registration — current Pillar 2
    Arc-cycle constrained by topics-taxonomy.json registration scope.
