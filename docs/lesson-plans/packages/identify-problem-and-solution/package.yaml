assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the problem in a 3-event story by pointing
        to the correct event-card in 7 of 10 trials.
      - Identify the solution in a 3-event story by pointing
        to the correct event-card in 7 of 10 trials.
      - Narrate problem-and-solution structure ("The problem
        is X. The solution is Y.") in 6 of 10 trials.
      - Match a problem picture to its corresponding solution
        picture in 6 of 8 attempts.
      - Use vocabulary 'problem' / 'solution' / 'fix' /
        'help' / 'wrong' correctly in 5 of 10 productive-
        language trials.

    Differentiation:
    - Pre-K: skip problem-and-solution; review sequence-3-
      event-story (Arc 14 Phase 2) for 3-event sequencing
      foundation first.
    - K: 3-event problem-solution stories with teacher-led
      pattern-naming; receptive comprehension first
      (point to picture); productive narration emerges as
      it does.
    - Grade 1: extend to 4-5-event stories (problem +
      attempt + better attempt + solution); introduce
      formal vocabulary ('what's the problem?' / 'how was
      it solved?'); bridge to character-feeling-during-
      problem work (extends infer-character-feeling-from-
      picture-cue precedent).
    - Grade 2+: full narrative-element analysis (character
      + setting + problem + solution + author's purpose);
      bridge to problem-solution writing (kids author
      their own problem-solution stories); CCSS.2.RL.3
      extension.

