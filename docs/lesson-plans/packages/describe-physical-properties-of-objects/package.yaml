compositionalRationale:
  en: |
    Primary strand: science / materials-and-properties (physical-
    property description — saturates strand 2/2). Secondary strand:
    vocabulary-acquisition (property vocabulary: hard, soft, smooth,
    rough, transparent, opaque, flexible, rigid, heavy, light).
    Tertiary strand: cognitive-and-executive-function / sorting-and-
    classification (multi-attribute sorting).

    Architectural significance: SATURATES materials-and-properties
    strand at 2/2 — 15th saturated strand on the platform. Builds
    on Arc 15 Phase 2 identify-natural-and-manmade-materials
    foundation. Critical bridge from material-SOURCE classification
    (natural/manmade) to material-PROPERTY analysis. Foundation
    for later matter-state classification + scientific-inquiry
    investigations.

    Distinctive composition: 2 picture-sort (binary property
    classification) + 2 matching + 1 odd-one-out. Property-sorting
    emphasized; same exercise pattern as identify-natural-and-
    manmade-materials provides strand-method coherence.

    Class B FLEXIBLE substrate: composes against miscellaneous +
    animals themes (animals provide rich property contrast — soft
    feathers vs hard shells; smooth fish vs rough alligator).

    K-3 multilingual classroom relevance: property vocabulary
    varied across 11 platform locales — basic properties (hard/
    soft) moderate-cognate Romance + Germanic; nuanced properties
    (flexible/rigid) more locale-specific. Visual property
    comparison universal; vocabulary anchor varies.

