description:
  en: "K-3 bundle centered on Christmas as holiday-anchor for cross-strand winter-seasonal + cultural-awareness work. 5 packages span vocabulary-acquisition (identify-and-name-action-verbs — decorate, wrap, give, sing, celebrate, share + Christmas-specific verbs) + numeracy (count-objects-1-to-10 — counting ornaments, presents, candles, snowflakes, cookies) + color-cognition (sort-by-color — red ornaments vs green ornaments vs gold ornaments vs silver ornaments) + cultural-awareness (compare-greeting-routines-across-cultures — Christmas traditions vary widely: Spanish Feliz Navidad / German Frohe Weihnachten / Italian Buon Natale / Norwegian God Jul / Filipino Maligayang Pasko) + winter-seasonal (identify-four-seasons — Christmas as winter-anchored holiday). 2nd holiday-themed bundle on the platform — extends holiday cluster opened by easter-bundle. Suitable for a 3-4 week classroom unit timed to December — high family-engagement period for K-3 multilingual classrooms with diverse cultural Christmas + non-Christmas-celebrating family contexts. Supports cross-cultural-holiday + family-tradition + winter-celebration extensions."

