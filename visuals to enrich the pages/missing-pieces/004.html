<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1000, height=1000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px;
    height: 1000px;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(155deg, #FF6B6B 0%, #EE5A9B 40%, #C850C0 100%);
    position: relative;
  }

  /* Puzzle piece shapes floating in background */
  .puzzle-piece {
    position: absolute;
    z-index: 2;
    opacity: 0.12;
  }
  .puzzle-piece::before {
    content: '';
    display: block;
    background: white;
  }
  /* Jigsaw-style pieces using clip-path */
  .jp {
    position: absolute;
    background: white;
    opacity: 0.1;
    z-index: 2;
  }
  .jp1 {
    width: 70px; height: 70px;
    top: 200px; left: 40px;
    clip-path: polygon(0% 25%, 25% 25%, 25% 0%, 50% 0%, 50% 25%, 75% 25%, 100% 25%, 100% 50%, 100% 75%, 75% 75%, 75% 100%, 50% 100%, 50% 75%, 25% 75%, 0% 75%, 0% 50%);
    transform: rotate(15deg);
  }
  .jp2 {
    width: 55px; height: 55px;
    top: 160px; right: 60px;
    clip-path: polygon(0% 25%, 25% 25%, 25% 0%, 50% 0%, 50% 25%, 75% 25%, 100% 25%, 100% 50%, 100% 75%, 75% 75%, 75% 100%, 50% 100%, 50% 75%, 25% 75%, 0% 75%, 0% 50%);
    transform: rotate(-20deg);
    opacity: 0.15;
  }
  .jp3 {
    width: 80px; height: 80px;
    top: 680px; left: 50px;
    clip-path: polygon(0% 25%, 25% 25%, 25% 0%, 50% 0%, 50% 25%, 75% 25%, 100% 25%, 100% 50%, 100% 75%, 75% 75%, 75% 100%, 50% 100%, 50% 75%, 25% 75%, 0% 75%, 0% 50%);
    transform: rotate(30deg);
    opacity: 0.08;
  }
  .jp4 {
    width: 50px; height: 50px;
    top: 750px; right: 80px;
    clip-path: polygon(0% 25%, 25% 25%, 25% 0%, 50% 0%, 50% 25%, 75% 25%, 100% 25%, 100% 50%, 100% 75%, 75% 75%, 75% 100%, 50% 100%, 50% 75%, 25% 75%, 0% 75%, 0% 50%);
    transform: rotate(-10deg);
    opacity: 0.12;
  }
  .jp5 {
    width: 60px; height: 60px;
    top: 440px; left: 30px;
    clip-path: polygon(0% 25%, 25% 25%, 25% 0%, 50% 0%, 50% 25%, 75% 25%, 100% 25%, 100% 50%, 100% 75%, 75% 75%, 75% 100%, 50% 100%, 50% 75%, 25% 75%, 0% 75%, 0% 50%);
    transform: rotate(45deg);
    opacity: 0.1;
  }
  .jp6 {
    width: 45px; height: 45px;
    top: 500px; right: 45px;
    clip-path: polygon(0% 25%, 25% 25%, 25% 0%, 50% 0%, 50% 25%, 75% 25%, 100% 25%, 100% 50%, 100% 75%, 75% 75%, 75% 100%, 50% 100%, 50% 75%, 25% 75%, 0% 75%, 0% 50%);
    transform: rotate(-35deg);
    opacity: 0.14;
  }

  /* Radial glow behind worksheet */
  .center-glow {
    position: absolute;
    top: 260px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 450px;
    background: radial-gradient(ellipse, rgba(255,217,61,0.25) 0%, rgba(255,217,61,0.05) 50%, transparent 70%);
    z-index: 3;
  }

  /* GRATIS badge */
  .gratis {
    position: absolute;
    top: 28px;
    left: 28px;
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: linear-gradient(145deg, #FFD93D 0%, #F59E0B 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 28px;
    color: #4A0E2E;
    z-index: 20;
    box-shadow: 0 6px 25px rgba(245,158,11,0.5);
    transform: rotate(-8deg);
    border: 3px solid rgba(255,255,255,0.4);
  }

  /* Grade badge */
  .grade {
    position: absolute;
    top: 38px;
    right: 30px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    padding: 12px 22px;
    border-radius: 30px;
    border: 2px solid rgba(255,255,255,0.35);
    z-index: 20;
    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
  }
  .grade span {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: white;
    letter-spacing: 0.5px;
  }

  /* Title */
  .title-area {
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }
  .title-line1 {
    font-size: 82px;
    font-weight: 700;
    color: white;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    letter-spacing: 4px;
    line-height: 1;
  }
  .title-line2 {
    font-size: 82px;
    font-weight: 700;
    color: #FFD93D;
    text-shadow: 0 4px 20px rgba(0,0,0,0.2);
    letter-spacing: 4px;
    line-height: 1;
    margin-top: -4px;
  }

  /* Main worksheet frame */
  .main-frame {
    position: absolute;
    top: 270px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }
  .frame-inner {
    width: 240px;
    height: 310px;
    background: white;
    border-radius: 10px;
    padding: 8px;
    box-shadow:
      0 8px 30px rgba(0,0,0,0.3),
      0 0 0 3px rgba(255,255,255,0.5);
  }
  .frame-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 6px;
  }

  /* Small side worksheets */
  .side-frame {
    position: absolute;
    z-index: 8;
  }
  .side-frame-left {
    top: 330px;
    left: 90px;
  }
  .side-frame-right {
    top: 330px;
    right: 90px;
  }
  .side-inner {
    width: 160px;
    height: 207px;
    background: white;
    border-radius: 8px;
    padding: 6px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    opacity: 0.7;
  }
  .side-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 5px;
  }

  /* Bottom discovery banner */
  .discovery {
    position: absolute;
    bottom: 185px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, rgba(200,80,192,0.9), rgba(180,40,120,0.95));
    padding: 12px 32px;
    border-radius: 30px;
    z-index: 15;
    box-shadow: 0 4px 18px rgba(200,80,192,0.4);
    border: 2px solid rgba(255,255,255,0.25);
  }
  .discovery span {
    font-family: 'Nunito', sans-serif;
    font-size: 19px;
    font-weight: 800;
    color: white;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }

  /* Feature pills */
  .pills {
    position: absolute;
    bottom: 108px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 15;
  }
  .pill {
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 22px;
    padding: 8px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: white;
  }

  /* Bottom tagline */
  .tagline {
    position: absolute;
    bottom: 45px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 15;
  }
  .tagline span {
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: rgba(255,255,255,0.65);
    font-style: italic;
  }

  /* Yellow accent circles */
  .accent-circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,217,61,0.12);
    z-index: 1;
  }
  .ac1 { width: 200px; height: 200px; top: -50px; right: -40px; }
  .ac2 { width: 150px; height: 150px; bottom: 250px; left: -40px; }
  .ac3 { width: 100px; height: 100px; bottom: -30px; left: 50%; }
</style>
</head>
<body>

<!-- Accent circles -->
<div class="accent-circle ac1"></div>
<div class="accent-circle ac2"></div>
<div class="accent-circle ac3"></div>

<!-- Floating puzzle pieces -->
<div class="jp jp1"></div>
<div class="jp jp2"></div>
<div class="jp jp3"></div>
<div class="jp jp4"></div>
<div class="jp jp5"></div>
<div class="jp jp6"></div>

<!-- Center glow -->
<div class="center-glow"></div>

<!-- GRATIS badge -->
<div class="gratis">GRATIS</div>

<!-- Grade badge -->
<div class="grade"><span>VORSCHULE&ndash;2. KL.</span></div>

<!-- Title -->
<div class="title-area">
  <div class="title-line1">FEHLENDE</div>
  <div class="title-line2">TEILE</div>
</div>

<!-- Side worksheet left -->
<div class="side-frame side-frame-left">
  <div class="side-inner">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-2.jpeg" alt="Giraffe Puzzlebild">
  </div>
</div>

<!-- Main worksheet (raccoon) -->
<div class="main-frame">
  <div class="frame-inner">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-1.jpeg" alt="Waschb&auml;r Puzzlebild">
  </div>
</div>

<!-- Side worksheet right -->
<div class="side-frame side-frame-right">
  <div class="side-inner">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-4.jpeg" alt="Hund Puzzlebild">
  </div>
</div>

<!-- Discovery banner -->
<div class="discovery">
  <span>Finde das fehlende Puzzleteil!</span>
</div>

<!-- Feature pills -->
<div class="pills">
  <div class="pill">Tierbilder</div>
  <div class="pill">L&ouml;sungsbl&auml;tter</div>
  <div class="pill">Druckfertig</div>
</div>

<!-- Tagline -->
<div class="tagline">
  <span>Visuelle Wahrnehmung spielerisch f&ouml;rdern</span>
</div>

</body>
</html>
