<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Doubling Mirror — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- TOOL #54 - THE DOUBLING MIRROR (rebuilt 2026-08-11). It is NOT a
       mirror, and that is the ruling: a mirror doubles an APPEARANCE,
       not a quantity, and a child who counts twelve in front of one has
       counted six objects and six reflections. So this is a hinged TRAY
       with two leaves. A SHUT TRAY IS THE UNDIVIDED WHOLE; AN OPEN TRAY
       IS TWO PARTS - so closing composes and opening decomposes, and the
       same hinge runs doubling and halving on the very same counters,
       never cleared. Counters sit on the near leaf, the class commits a
       number, and closing lays the same number of REAL counters on the
       far leaf, one at a time, so the room can count them in. Opening
       shares the whole back out. An odd total does not stall: one
       counter has no partner, and the class chooses whether it JOINS A
       LEAF (nine is four and four and one more) or FETCHES A PARTNER
       (nine was a double one short). It loads NO ART and NO AUDIO beyond
       the shell's own pop. -->

  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/doubling-mirror.js?v=3"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    LCS.mount(DoublingMirror, { mount: '#lcs-root' });
  </script>
</body>
</html>
