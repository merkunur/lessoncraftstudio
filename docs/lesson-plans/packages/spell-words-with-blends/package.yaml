assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Spell 6 of 8 dictated blend-words correctly in 8 of 10
        trials (with picture-cue support).
      - Identify and write the correct blend cluster (bl/br/cl/cr/
        dr/fl/fr/gl/gr/pl/pr/sl/sm/sn/sp/st/sw/tr) when given a
        word's medial-and-final sound pattern in 7 of 10 trials.
      - Apply the blend-spelling strategy to NEW unfamiliar blend
        words (e.g., 'sled', 'crow', 'spot') in 6 of 10 trials.

    Differentiation:
    - Pre-K: blend-recognition only (no writing); circle the
      blend-word matching picture from 2-3 options.
    - Kindergarten: 8 most-frequent blends (bl/br/cl/cr/dr/fl/fr/
      st) + independent writing.
    - Grade 1+: extend full blend set (18 blends) + bridge to
      spell-words-with-digraphs at Phase 1.5 (sh/ch/th/wh).

