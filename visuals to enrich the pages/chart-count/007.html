<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Bilddiagramm Arbeitsbl&auml;tter - Themenvielfalt Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(165deg, #FFF8E1 0%, #FFE0B2 50%, #FFCC80 100%); overflow: hidden;">

        <!-- Warm texture overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image: repeating-linear-gradient(45deg, #8D6E63 0px, transparent 1px, transparent 20px);"></div>

        <!-- Central glow -->
        <div style="position: absolute; top: 50%; left: 50%; width: 700px; height: 700px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, transparent 60%); border-radius: 50%;"></div>

        <!-- Title area -->
        <div style="position: absolute; top: 30px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; color: #4E342E; margin: 0; letter-spacing: 2px;">Themenvielfalt</h1>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 20px; color: #8D6E63; margin: 8px 0 0 0;">Entdecke verschiedene Bilddiagramme!</p>
        </div>

        <!-- 2x2 Grid of worksheet cards -->
        <div style="position: absolute; top: 145px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: 1fr 1fr; gap: 28px; width: 820px;">

            <!-- Card 1: Top-left - Animals (green) -->
            <div style="background: white; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.12); overflow: hidden; border-top: 6px solid #43A047;">
                <div style="padding: 8px 8px 0 8px;">
                    <div style="width: 100%; height: 230px; border-radius: 10px; overflow: hidden;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/chart%20count/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilddiagramm Tiere">
                    </div>
                </div>
                <div style="padding: 10px 14px 14px 14px; text-align: center;">
                    <div style="display: inline-block; background: linear-gradient(135deg, #E8F5E9, #C8E6C9); padding: 5px 18px; border-radius: 20px;">
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: #2E7D32;">&#127795; Tiere</span>
                    </div>
                </div>
            </div>

            <!-- Card 2: Top-right - Flowers (rose) -->
            <div style="background: white; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.12); overflow: hidden; border-top: 6px solid #E91E63;">
                <div style="padding: 8px 8px 0 8px;">
                    <div style="width: 100%; height: 230px; border-radius: 10px; overflow: hidden;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/chart%20count/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilddiagramm Blumen">
                    </div>
                </div>
                <div style="padding: 10px 14px 14px 14px; text-align: center;">
                    <div style="display: inline-block; background: linear-gradient(135deg, #FCE4EC, #F8BBD0); padding: 5px 18px; border-radius: 20px;">
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: #AD1457;">&#127804; Blumen</span>
                    </div>
                </div>
            </div>

            <!-- Card 3: Bottom-left - Emojis (amber) -->
            <div style="background: white; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.12); overflow: hidden; border-top: 6px solid #FF8F00;">
                <div style="padding: 8px 8px 0 8px;">
                    <div style="width: 100%; height: 230px; border-radius: 10px; overflow: hidden;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/chart%20count/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilddiagramm Emojis">
                    </div>
                </div>
                <div style="padding: 10px 14px 14px 14px; text-align: center;">
                    <div style="display: inline-block; background: linear-gradient(135deg, #FFF8E1, #FFECB3); padding: 5px 18px; border-radius: 20px;">
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: #E65100;">&#128522; Emojis</span>
                    </div>
                </div>
            </div>

            <!-- Card 4: Bottom-right - Trees (earth green) -->
            <div style="background: white; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.12); overflow: hidden; border-top: 6px solid #558B2F;">
                <div style="padding: 8px 8px 0 8px;">
                    <div style="width: 100%; height: 230px; border-radius: 10px; overflow: hidden;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/chart%20count/sample-4.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilddiagramm B&auml;ume">
                    </div>
                </div>
                <div style="padding: 10px 14px 14px 14px; text-align: center;">
                    <div style="display: inline-block; background: linear-gradient(135deg, #F1F8E9, #DCEDC8); padding: 5px 18px; border-radius: 20px;">
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: #33691E;">&#127794; B&auml;ume</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Central "+" badge -->
        <div style="position: absolute; top: 425px; left: 50%; transform: translate(-50%, -50%); z-index: 50; width: 62px; height: 62px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 6px 25px rgba(249,168,37,0.5), 0 0 0 5px white; display: flex; align-items: center; justify-content: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #3E2723;">+ Mehr!</span>
        </div>

        <!-- Bottom banner -->
        <div style="position: absolute; bottom: 52px; left: 0; right: 0; text-align: center;">
            <div style="display: inline-block; background: linear-gradient(90deg, #5D4037, #4E342E); padding: 14px 45px; border-radius: 30px; box-shadow: 0 6px 25px rgba(0,0,0,0.2);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #FFE0B2; letter-spacing: 2px;">Und viele weitere Themen!</span>
            </div>
        </div>

        <!-- GRATIS badge -->
        <div style="position: absolute; bottom: 22px; left: 28px; z-index: 100;">
            <div style="width: 80px; height: 80px; background: linear-gradient(145deg, #FDD835 0%, #F9A825 100%); border-radius: 50%; box-shadow: 0 6px 22px rgba(249,168,37,0.5), inset 0 -3px 8px rgba(0,0,0,0.1), inset 0 3px 6px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 3px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: #3E2723;">GRATIS</span>
            </div>
        </div>

        <!-- Grade badge -->
        <div style="position: absolute; bottom: 30px; right: 32px; background: rgba(255,255,255,0.95); padding: 9px 18px; border-radius: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.12); border: 3px solid #E8842A;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: #E8842A; letter-spacing: 1px;">KLASSE K-2</span>
        </div>

    </div>
</body>
</html>
