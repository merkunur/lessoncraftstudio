# Teaching package — follow 3-step oral instructions
# Arc 19 Phase 1.3 Slot 4 (early-literacy / speaking-and-listening strand 3/10 → 4/10). Direct extension of Arc 11 follow-1-step-oral-instruction + Arc 14 P4 follow-2-step-oral-instruction. Resolves Arc 14 P4 follow-2-step forward-pointer ('next we can try 3-step instructions for kids who are ready'). Locale-invariant pedagogy (no §A.13.34 sub-class firing). NOTE: follow-2-step-oral-instruction (Arc 14 P4) ships with non-canonical materials (instruction-cards material slug + manipulative-cut-outs mode: action-set) per pre-§A.13.35 era — flag as retrofit candidate for separate [FIX][LESSON-PLANS] commission; this Slot 4 uses canonical Literacy 8-material per §A.13.37 + §A.13.35 mode: single-repeat.

targetSlug: follow-3-step-oral-instruction
language: en
title:
  en: "3-Step Instructions — first do this, then that, then that"
description:
  en: "Kindergarten / Grade 1 early-literacy + executive-function package teaching kids to follow 3-step oral instructions in sequence. Direct extension of Arc 14 P4 follow-2-step-oral-instruction + Arc 11 follow-1-step-oral-instruction prerequisite chain. RESOLVES Arc 14 P4 follow-2-step forward-pointer ('When we come back next, we can try 3-step instructions — First do X, then do Y, then do Z — for kids who are ready'). Speaking-and-listening strand advances 3/10 → 4/10. Examples: 'Stand up, walk to the door, touch the doorknob' / 'Pick up the red crayon, put it in the box, sit down' / 'First clap your hands, then touch your nose, finally raise your arms'. Critical bridge from 2-step working-memory load to 3-step multi-step executive-function work. Increases working-memory demands + introduces sequence-tracking strategies (mental rehearsal; head-nod-per-step; finger-counting). NOT formal procedural-listening pedagogy (that's multi-step technical instructions; Grade 3+ work); the K-1 emphasis is multi-step receptive listening as bridge between simple oral-direction-following + complex procedural-listening. Per §A.13.30 K-1 informal framing: K-1 3-step instruction work is CONCRETE MULTI-STEP DOING — kids hear short 3-step instruction + IMMEDIATELY execute all 3 steps in order using concrete classroom routines (stand/sit/walk/touch/clap/wave). NOT formal multi-step procedural-reading (written-text equivalent at Phase 1.1 Slot 2 read-and-follow-2-sentence-instruction; this Slot 4 is oral-only). CCSS.SL.K.2 + CCSS.SL.1.2 primary anchors (ask + answer questions about key details in a text read aloud or information presented orally). 5 worksheet exercises + 8 printable materials over a 1-week unit. **Speaking-and-listening pedagogy is structurally locale-invariant** — instruction-following operates identically across languages; only the language-of-instruction differs. Materials list mirrors Phase 1.1 Slot 2 read-and-follow-2-sentence-instruction Literacy 8-material canonical (NOT Arc 14 P4 follow-2-step which used non-canonical materials shape)."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class 3-step instruction hook + modeling. Teacher
      demonstrates: "Watch me follow a 3-step instruction. The
      teacher says: 'Stand up, walk to the window, touch the
      glass.' I STAND UP (does so), I WALK TO THE WINDOW (does
      so), I TOUCH THE GLASS (does so). Three things in order.
      Now you try!" Teacher gives several 3-step instructions
      with strong sequence anchors (FIRST, THEN, FINALLY,
      LAST): "First clap your hands. Then touch your nose.
      Finally raise your arms." / "Pick up a crayon. Put it
      on your desk. Sit down." / "Stand up, then walk to the
      door, then come back to your seat." Visual + tactile
      anchor establishes the 3-step pattern + connector-word
      vocabulary. Critical pedagogical framing — sequence-
      tracking strategy introduction: "Three steps is harder
      to remember than two. Try a TRICK: count on your fingers
      while you listen. One finger for the first step. Two
      fingers for the second. Three fingers for the third.
      Then look at your three fingers + do each step in
      order."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + 3-step listening routine. Each pair receives
      a worksheet with 6 outcome pictures (kid standing up
      after sitting, kid drawing then circling, kid waving
      then bowing). Pair takes turns: kid A receives a 3-step
      instruction from teacher ("Stand up, raise your hands,
      then sit down"); kid B watches to check correct
      sequence. Reverse roles. Teacher circulates with
      instruction-cards. Critical pedagogical move: USE
      SEQUENCE-TRACKING STRATEGIES. Encourage finger-counting
      (one finger per step heard); head-nod-per-step (kids nod
      once for each step as instruction is given); mental
      rehearsal ("repeat the instruction to yourself before
      starting"). 3-step instructions exceed simple working-
      memory capacity for many K kids — the scaffolds matter.
      Recast errors with explicit step-naming: ("you stood up
      + raised your hands, but skipped the 'sit down' step.
      Let's check: step 1 was stand up, step 2 was raise
      hands, step 3 was sit down. You did 1 and 2 — let's go
      back + do step 3."). Common error patterns: (a) skipping
      middle step (very common; mental rehearsal + finger-
      counting are scaffolds); (b) reordering steps; (c)
      doing only first step + freezing on second (working-
      memory overload; reduce to 2-step + rebuild). Optional
      extension: kid generates their own 3-step instruction
      + tests it on another pair (productive-language work
      reinforces receptive-listening work).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet
      (sequence 3-step actions in order via icon-card layout).
      Station 2: matching worksheet (3-step instruction phrase
      → outcome picture sequence; kids match printed 3-step
      texts to executed-outcome illustrations). Station 3:
      missing-pieces worksheet (3-step sequence with one step
      missing — which step is missing?). Station 4: vocabulary-
      tracing-strips for connector words (first, then, finally,
      next, last, after).
  closure:
    durationMinutes: 5
    body: |
      Whole-class 3-step quick-recall + strategy review.
      Teacher gives 5 different 3-step instructions; class
      collectively follows each. "Touch your shoulder, touch
      your knee, then jump." / "First clap, then snap, finally
      tap your desk." / "Stand up, turn around, sit down."
      Teacher closes: "Today we followed 3-step instructions —
      one more step than last time! THREE-step instructions
      are harder than 2-step because we have to REMEMBER more.
      The tricks help: finger-counting, head-nodding, mental
      rehearsal. Use them when you need to remember a long
      instruction. Three steps is a great working-memory
      stretch for kindergarten / Grade 1." Forward-pointer:
      "What's the next listening skill? ASKING + ANSWERING
      QUESTIONS about what we hear. Today we EXECUTED
      instructions. Next we'll PARTICIPATE in instruction-
      giving by asking questions back to the teacher: 'Wait,
      what was the second step?' or 'Can you say it again?'.
      That's the next speaking-and-listening skill."

