assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Contar uma pilha de 2-3 moedas (ex.: 1 moeda de
        25 centavos + 2 moedas de 10) na quantia total
        correta em 7 de 10 tentativas.
      - Contar uma pilha de 4-5 moedas (ex.: 1 moeda de
        25 + 2 moedas de 10 + 1 moeda de 5 = 50
        centavos) na quantia total correta em 5 de 10
        tentativas.
      - Fazer uma quantia-alvo a partir de uma palette
        de moedas (ex.: "mostre 40 centavos" → 1 moeda
        de 25 + 1 moeda de 10 + 1 moeda de 5; OU 4
        moedas de 10; OU 8 moedas de 5) em 6 de 10
        tentativas.
      - Reconhecer que R$1 pode ser feito de várias
        maneiras (4 moedas de 25; 10 moedas de 10; 2
        moedas de 50; combinações) em 5 de 10
        tentativas.
      - Usar o vocabulário 'quantia' / 'total' / 'contar'
        / 'centavos' / 'real' corretamente em 5 de 10
        tentativas de produção verbal.

    Diferenciação:
    - Pré-escola: pular a contagem de quantias
      inteiramente; o trabalho de reconhecimento de
      moedas (parceiro-do-par identify-coin-values) é
      a cobertura apropriada.
    - Educação infantil (5-7 anos): introduzir contagem
      de quantias apenas com pilhas da mesma moeda (ex.:
      4 moedas de 10 = 40 centavos; 3 moedas de 5 = 15
      centavos); pilhas de moedas mistas adiadas para o
      1.º ano em diante.
    - 1.º ano: contagem de quantias com pilhas de 2
      moedas mistas (1 moeda de 25 + 1 moeda de 10
      etc.); fluência de contagem-por-saltos com 5 e 10
      estabelecida; contagem de 25 em 25 adiada.
    - 2.º ano: fluência completa de contagem de quantias
      até R$1; pilhas mistas + multiplicidade-de-
      combinações praticadas; ponte para o trabalho de
      fazer-quantia-alvo.
    - 3.º ano em diante: estender para cédulas (R$2 /
      R$5 / R$10 / R$20); dar troco (baseado em
      subtração); comparar preços; introduzir porcentagem
      (que é fundamentalmente baseada em por-100 /
      centavos-por-real).

compositionalRationale:
  pt: |
    Adaptação locale-AUTÊNTICA do pacote canônico per
    operator-locked Path A no Arc 18 Phase 0 §A.13.6
    firings batch. Este arquivo inclui MATERIALS LIST
    OVERRIDE (mesmo padrão do pacote-parceiro identify-
    coin-values.pt.yaml). Ver pacote-parceiro
    compositionalRationale para documentação completa da
    divergência de convenção; este pacote mirrora o
    padrão pair-coherent.

    Vocabulário pt-BR canônico para contagem de
    quantias:
    - 'quantia' (canônico para amount; alternativa
      'valor' em registro paralelo)
    - 'total' (total — o resultado final da contagem)
    - 'contar' (to count); 'contagem' (counting)
    - 'somar' (to add); 'soma' (sum)
    - 'combinar' / 'combinação' (to combine /
      combination — para múltiplas maneiras de fazer a
      mesma quantia)
    - 'centavos' (cents — a sub-unidade); 'real' /
      'reais' (real / reais — a unidade)
    - 'até' (up to — para o limite R$1 / 100 centavos)
    - 'igual a' (equal to — para mostrar equivalências:
      'duas moedas de 50 centavos são iguais a um real')

    Habilidade pedagógica determinante: contagem-por-
    saltos brasileira. As crianças brasileiras do 2.º
    ano EF aprendem contagem-por-saltos como parte do
    trabalho de adição da BNCC (EF02MA05 contar de 2 em
    2, 5 em 5, 10 em 10 a partir de qualquer número
    natural). Este pacote aplica essa habilidade de
    contagem-por-saltos a moedas: contar de 5 em 5 com
    moedas de 5 centavos; de 10 em 10 com moedas de
    10; de 25 em 25 com moedas de 25; de 50 em 50 com
    moedas de 50. A contagem-por-saltos é universal no
    currículo brasileiro K-2 + Grade 2; este pacote
    surfaceiza a aplicação monetária da habilidade.

    Estratégia de contagem: a contagem brasileira K-3
    para múltiplas moedas segue a sequência:
    1. Comece com as MAIORES moedas (50 centavos, depois
       25 centavos)
    2. Continue com as MÉDIAS (10 centavos)
    3. Termine com as MENORES (5 centavos)
    4. Some sequencialmente em voz alta
    Esta ordem facilita a contagem cognitivamente — as
    maiores moedas "ancoram" o total inicial, e as
    menores apenas ajustam o valor final. Recapture
    erros surgem mais frequentemente quando crianças
    começam contando moedas pequenas primeiro + esquecem
    de adicionar as maiores no final.

    Combinações múltiplas para fazer R$1: pedagogicamente
    importante surfaceizar várias combinações:
    - 4 × 25 centavos = R$1
    - 2 × 50 centavos = R$1
    - 1 × 50 + 2 × 25 = R$1
    - 1 × 50 + 5 × 10 = R$1
    - 10 × 10 centavos = R$1
    - 20 × 5 centavos = R$1
    - 1 × 50 + 1 × 25 + 2 × 10 + 1 × 5 = R$1
    - muitas outras combinações
    A multiplicidade-de-combinações é conceitualmente
    importante — as crianças aprendem que R$1 NÃO é uma
    única coleção de moedas; é uma QUANTIA que pode ser
    formada de muitas maneiras. Esta é a ponte para o
    trabalho do 3.º + 4.º ano EF em equivalência +
    troco.

    Alinhamento BNCC: EF02MA20 (sistema monetário
    brasileiro; reconhecer cédulas e moedas) é o anchor
    direto. EF02MA05 (contagem-por-saltos) é o pré-
    requisito habilidade. EF03MA24 ('Resolver problemas
    com a comparação e a equivalência de valores
    monetários do sistema brasileiro em situações de
    compra, venda e troca') é a extensão BNCC do 3.º
    ano. Este pacote (junto com pair partner identify-
    coin-values) cobre o anchor EF02MA20 completo do
    2.º ano EF.

    Por §A.13.30 enquadramento informal K-3: este pacote
    NÃO ensina troco (subtração monetária) ou
    comparação de preços — apenas contagem de
    combinações de moedas até R$1. Famílias brasileiras
    às vezes perguntam por trabalho mais avançado
    (cálculo de troco; comparação de preços de produtos);
    o parent-take-home-letter explicita que o objetivo
    do 2.º ano EF é a contagem fundamental, com
    operações monetárias mais avançadas emergindo no
    3.º + 4.º ano EF.

    Pacote-parceiro identify-coin-values: completou o
    reconhecimento de moedas (qual moeda + qual valor);
    este pacote estende para contagem de combinações.
    Juntos os dois pacotes formam o módulo de dinheiro
    K-3 brasileiro. A sequência canônica de duas semanas
    é: semana 1 = identify-coin-values; semana 2 =
    recognize-money-amounts. Após esta sequência, as
    crianças do 2.º ano EF têm a base completa de
    matemática monetária do sistema brasileiro.

    Saturação de sub-track: este pacote FECHA o sub-
    track money do strand measurement em 2/2 SAT. Junto
    com o sub-track tell-time canonical (SAT 3/3 no
    Arc 18 P1.1 close), e os 4 outros sub-tracks
    (length, weight, capacity, comparison-vocabulary —
    cada um com seus próprios pacotes), o strand
    measurement progride de modo coerente. O sub-track
    money é estruturalmente o mais simples (apenas 2
    targets) mas pedagogicamente um dos mais práticos
    para o dia a dia infantil brasileiro.
