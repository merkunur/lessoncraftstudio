# Teaching package — identify the odd one out by visual attribute
# Arc 8 Phase 1 (Path B; cognitive-and-executive-function / logical-reasoning
# strand). Class B FLEXIBLE; vocab-anchored. Sibling to identify-odd-one-out-
# by-category (Arc 7 Phase 2). Resolves Arc 7's forward-pointer ("by ATTRIBUTE
# — not by what it IS, but by what color or shape or size makes it different").

targetSlug: identify-odd-one-out-by-attribute
language: en
title:
  en: "Odd One Out (by attribute) — find the item that looks different"
description:
  en: "Kindergarten cognitive-and-executive-function package teaching odd-one-out reasoning by visual attribute (color, shape, size). Sibling to identify-odd-one-out-by-category (Arc 7 Phase 2): same exclusion-reasoning structure applied to ATTRIBUTE difference rather than CATEGORY membership. Kids identify which of 4-5 same-category items has a different color/shape/size than the rest. Resolves Arc 7's by-category → by-attribute forward-pointer. Vocab-anchored. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher places 4 paper-cuts on the carpet:
      3 red apples + 1 green apple. "All four are apples — which one
      looks different?" Class identifies the green one. "Why?" Discussion:
      kids articulate the attribute reasoning ("the others are red; this
      one is green"). Repeat with shape (3 circles + 1 square; all
      same color) and size (3 small + 1 large; all same color and
      shape). Reinforces attribute-awareness as the dimension of
      difference, building on identify-odd-one-out-by-category (Arc 7).
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine. Teacher displays 5-6 attribute-contrast sets
      across the three attribute dimensions (color, shape, size). Class
      identifies the odd item + names the attribute that makes it odd.
      Pair work: kid A constructs an attribute-contrast set with
      manipulative cut-outs (e.g., 3 large stars + 1 small star); kid B
      identifies the odd + names the attribute. Recast errors with
      explanation. Embedded vocabulary practice — kids reinforce color
      / shape / size words while reasoning about attribute difference.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: odd-one-out worksheet (kids identify
      the attribute-odd item + circle it). Station 2: matching worksheet
      (image-name reinforces base vocabulary that the attribute-difference
      is applied to). Station 3: manipulative cut-outs hands-on
      attribute-odd-one-out construction (kids build attribute-contrast
      sets; partner solves; verbalizes the attribute that makes the odd
      one odd). Station 4: dice-spinners attribute-game (kids spin for
      attribute, then construct an odd-one-out around that attribute).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays a final attribute-
      contrast set; class collectively identifies the odd one + names
      the attribute. Forward-pointer: "Today we found the odd one by
      attribute — color, shape, or size. When we come back to puzzles
      next, we'll find the odd one by MULTIPLE attributes — sets where
      the difference is harder to spot because two attributes change
      at once."

