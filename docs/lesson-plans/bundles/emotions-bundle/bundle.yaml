thematicCoherence:
  en: |
    All 5 packages cohere around emotional + relational vocabulary work
    + form a SEL progression from naming (vocab acquisition) through
    self-awareness (own emotions in context) to perspective-taking
    (others' emotions from faces) and cultural relational awareness
    (greeting routines across cultures).

    **Pedagogical sequencing:**
    1. **identify-and-name-emotions** — Foundational emotion vocabulary
       (happy, sad, angry, surprised, scared, proud).
    2. **identify-and-name-family-members** — Family-vocabulary; the
       relational-context for emotion work. **SUBSTRATE-UNBLOCKED at
       Stream A Phase 1 ship; first bundle inclusion.**
    3. **identify-own-emotions-in-context** — Self-awareness: kids
       recognize their own emotions in specific situations (foundational
       SEL self-awareness).
    4. **identify-emotions-of-others-from-faces** — Perspective-taking:
       kids read facial cues + identify others' emotions (foundational
       SEL social awareness).
    5. **compare-greeting-routines-across-cultures** — Cross-cultural
       relational awareness; how families + communities express greeting
       across diverse cultures.

    **Strand spread:** 2 vocabulary-acquisition + 2 personal-social-
    emotional-development + 1 multilingual-language-awareness. Multi-
    strand bundle composition reflects SEL's inherently cross-strand
    nature (emotion vocab + cognitive perspective-taking + cultural
    awareness all activate together).

    **Suggested unit duration:** 4-5 weeks. SEL units typically benefit
    from longer cycles allowing kids to practice + reflect across
    multiple weeks.

    **Multilingual classroom relevance:** HIGHEST. SEL is increasingly
    emphasized globally (CASEL framework; BNCC competências
    socioemocionais in Brazil; PSED in EYFS). Multilingual K-3 audience
    benefits from explicit cross-cultural awareness work — international/
    dual-language/bilingual classrooms ARE the contexts where greeting
    routines + emotional expression vary culturally most. Bundle
    affirms diverse family + cultural backgrounds + builds shared
    vocabulary for emotional + relational topics.

    **Cross-cultural affirmation discipline.** Family-members vocabulary
    framed as ROLES kids might have (not prescriptive nuclear-family-
    only). Greeting routines validated across cultural variants (handshake
    + bow + cheek-kiss + hug + wave). Emotion expression cultural-norm-
    aware (caloroso pt-BR vs more reserved Nordic styles). Bundle
    pedagogically anchored in research-validated cultural-affirmation
    discipline (Cummins; Garcia + Wei translanguaging).
