assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Point to the correct color-swatch when teacher names it in target
        language in 10 of 10 trials.
      - Point to objects of the named color in the classroom environment
        in 8 of 10 trials.
      - Match color-swatches to color-words in 9 of 10 trials.

    Differentiation:
    - Pre-K: 6-color receptive set (red/blue/yellow/green/orange/purple);
      flashcard recognition only.
    - K: 10-color receptive set; flashcard + classroom-object recognition.
    - Grade 1+: bridge to productive use-color-words (Arc 2) — kids
      transition from pointing to using color in object-description
      sentences ("the apple is red").

