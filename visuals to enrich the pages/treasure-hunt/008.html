<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Schatzsuche - Fun Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #1B5E20 0%, #004D40 60%, #00332E 100%); overflow: hidden;">

        <!-- White radial energy burst from center -->

        <!-- Bunting flags at top -->

            <!-- String -->
            <path d="M -20,15 Q250,55 500,20 Q750,55 1020,15" stroke="#F9A825" stroke-width="3" fill="none" opacity="0.7"/>
            <!-- Flags -->
            <polygon points="80,22 60,65 100,65" fill="#2E7D32" opacity="0.85"/>
            <polygon points="160,30 140,70 180,70" fill="#F9A825" opacity="0.85"/>
            <polygon points="240,36 220,72 260,72" fill="#FF6D00" opacity="0.85"/>
            <polygon points="320,40 300,72 340,72" fill="white" opacity="0.7"/>
            <polygon points="400,38 380,70 420,70" fill="#2E7D32" opacity="0.85"/>
            <polygon points="480,28 460,65 500,65" fill="#FFD600" opacity="0.85"/>
            <polygon points="560,22 540,62 580,62" fill="#E91E63" opacity="0.8"/>
            <polygon points="640,25 620,64 660,64" fill="white" opacity="0.7"/>
            <polygon points="720,32 700,68 740,68" fill="#FF6D00" opacity="0.85"/>
            <polygon points="800,38 780,72 820,72" fill="#2E7D32" opacity="0.85"/>
            <polygon points="880,34 860,70 900,70" fill="#F9A825" opacity="0.85"/>
            <polygon points="960,24 940,64 980,64" fill="#E91E63" opacity="0.8"/>
        </svg>

        <!-- Scattered confetti circles -->
        <div style="position: absolute; top: 95px; left: 60px; width: 16px; height: 16px; background: #FFD600; border-radius: 50%; opacity: 0.75;"></div>
        <div style="position: absolute; top: 200px; right: 50px; width: 12px; height: 12px; background: #E91E63; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; top: 380px; left: 25px; width: 14px; height: 14px; background: #FF6D00; border-radius: 50%; opacity: 0.65;"></div>
        <div style="position: absolute; bottom: 220px; right: 35px; width: 18px; height: 18px; background: #FFD600; border-radius: 50%; opacity: 0.6;"></div>
        <div style="position: absolute; bottom: 180px; left: 80px; width: 10px; height: 10px; background: #4CAF50; border-radius: 50%; opacity: 0.65;"></div>
        <div style="position: absolute; top: 520px; right: 75px; width: 11px; height: 11px; background: #E91E63; border-radius: 50%; opacity: 0.55;"></div>
        <div style="position: absolute; top: 140px; left: 320px; width: 9px; height: 9px; background: white; border-radius: 50%; opacity: 0.5;"></div>
        <!-- Confetti rectangles -->
        <div style="position: absolute; top: 110px; right: 180px; width: 18px; height: 7px; background: #FFD600; border-radius: 3px; opacity: 0.65; transform: rotate(25deg);"></div>
        <div style="position: absolute; top: 280px; left: 45px; width: 16px; height: 6px; background: #E91E63; border-radius: 3px; opacity: 0.6; transform: rotate(-18deg);"></div>
        <div style="position: absolute; bottom: 300px; right: 100px; width: 20px; height: 7px; background: #4CAF50; border-radius: 3px; opacity: 0.6; transform: rotate(40deg);"></div>
        <div style="position: absolute; top: 430px; left: 910px; width: 15px; height: 5px; background: white; border-radius: 3px; opacity: 0.45; transform: rotate(-30deg);"></div>
        <div style="position: absolute; bottom: 380px; left: 900px; width: 18px; height: 6px; background: #FF6D00; border-radius: 3px; opacity: 0.55; transform: rotate(12deg);"></div>
        <!-- Stars -->
        <div style="position: absolute; top: 50px; right: 300px; color: #FFD600; font-size: 22px; opacity: 0.7; transform: rotate(12deg);">&#9733;</div>
        <div style="position: absolute; bottom: 260px; left: 15px; color: #FF6D00; font-size: 18px; opacity: 0.55; transform: rotate(-8deg);">&#9733;</div>
        <div style="position: absolute; top: 340px; right: 18px; color: #E91E63; font-size: 16px; opacity: 0.6; transform: rotate(20deg);">&#9733;</div>
        <div style="position: absolute; bottom: 100px; right: 65px; color: #FFD600; font-size: 20px; opacity: 0.55; transform: rotate(-15deg);">&#9733;</div>

        <!-- Decorative paw print stamps -->
        <svg style="position: absolute; top: 170px; left: 40px; opacity: 0.2; pointer-events: none;" width="50" height="55" viewBox="0 0 50 55">
            <ellipse cx="25" cy="38" rx="14" ry="12" fill="#F9A825"/>
            <ellipse cx="12" cy="22" rx="6" ry="7" fill="#F9A825"/>
            <ellipse cx="25" cy="18" rx="6" ry="7" fill="#F9A825"/>
            <ellipse cx="38" cy="22" rx="6" ry="7" fill="#F9A825"/>
        </svg>
        <svg style="position: absolute; top: 500px; right: 40px; opacity: 0.18; pointer-events: none;" width="45" height="50" viewBox="0 0 50 55">
            <ellipse cx="25" cy="38" rx="14" ry="12" fill="#F9A825"/>
            <ellipse cx="12" cy="22" rx="6" ry="7" fill="#F9A825"/>
            <ellipse cx="25" cy="18" rx="6" ry="7" fill="#F9A825"/>
            <ellipse cx="38" cy="22" rx="6" ry="7" fill="#F9A825"/>
        </svg>
        <svg style="position: absolute; bottom: 200px; left: 160px; opacity: 0.15; pointer-events: none;" width="40" height="44" viewBox="0 0 50 55">
            <ellipse cx="25" cy="38" rx="14" ry="12" fill="#F9A825"/>
            <ellipse cx="12" cy="22" rx="6" ry="7" fill="#F9A825"/>
            <ellipse cx="25" cy="18" rx="6" ry="7" fill="#F9A825"/>
            <ellipse cx="38" cy="22" rx="6" ry="7" fill="#F9A825"/>
        </svg>
        <svg style="position: absolute; top: 330px; right: 150px; opacity: 0.12; pointer-events: none;" width="35" height="38" viewBox="0 0 50 55">
            <ellipse cx="25" cy="38" rx="14" ry="12" fill="#F9A825"/>
            <ellipse cx="12" cy="22" rx="6" ry="7" fill="#F9A825"/>
            <ellipse cx="25" cy="18" rx="6" ry="7" fill="#F9A825"/>
            <ellipse cx="38" cy="22" rx="6" ry="7" fill="#F9A825"/>
        </svg>

        <!-- Main Title -->
        <div style="position: absolute; top: 80px; left: 0; right: 0; text-align: center; z-index: 15;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 56px; color: white; margin: 0; text-shadow: 4px 4px 0 rgba(0,0,0,0.3), 0 0 40px rgba(255,214,0,0.2); letter-spacing: 1px;">Abenteuer im</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 56px; color: #FFD600; margin: -6px 0 0 0; text-shadow: 4px 4px 0 rgba(0,0,0,0.3), 0 0 30px rgba(255,214,0,0.15);">Klassenzimmer!</h2>
        </div>

        <!-- "SCHATZ GEFUNDEN!" burst badge - top right -->
        <div style="position: absolute; top: 85px; right: 35px; z-index: 20;">
            <div style="width: 130px; height: 130px; background: linear-gradient(135deg, #FFD600 0%, #F9A825 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 28px rgba(255,214,0,0.5), 0 0 0 4px rgba(255,255,255,0.3); transform: rotate(8deg);">
                <div style="text-align: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 15px; color: #1B5E20; display: block; line-height: 1.1;">SCHATZ</span>
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: #1B5E20; display: block; line-height: 1;">GEFUNDEN!</span>
                </div>
            </div>
        </div>

        <!-- Main large worksheet - center -->
        <div style="position: absolute; top: 230px; left: 50%; transform: translateX(-50%); z-index: 15;">
            <div style="position: relative;">
                <!-- Golden glow behind -->
                <div style="position: absolute; inset: -25px; background: radial-gradient(ellipse, rgba(255,214,0,0.2) 0%, transparent 65%); border-radius: 30px; pointer-events: none;"></div>
                <!-- White frame -->
                <div style="background: white; padding: 12px; border-radius: 14px; box-shadow: 0 22px 65px rgba(0,0,0,0.4), 0 0 0 4px rgba(255,214,0,0.4); position: relative;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/treasure%20hunt/sample-4.jpeg" alt="Schatzsuche Arbeitsblatt Dinosaurier" style="width: 340px; height: 440px; object-fit: cover; object-position: top; border-radius: 8px; display: block;">
                </div>
            </div>
        </div>

        <!-- Speech bubble: "SO SPANNEND!" -->
        <div style="position: absolute; top: 320px; left: 40px; z-index: 20;">
            <div style="background: white; border: 3px solid #FF6D00; border-radius: 20px; padding: 10px 20px; position: relative; box-shadow: 0 4px 14px rgba(0,0,0,0.2);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #E65100;">SO SPANNEND!</span>
                <div style="position: absolute; bottom: -13px; left: 35px; width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 13px solid #FF6D00;"></div>
                <div style="position: absolute; bottom: -9px; left: 37px; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 11px solid white;"></div>
            </div>
        </div>

        <!-- "Kinder lieben es!" heart badge -->
        <div style="position: absolute; bottom: 210px; left: 55px; z-index: 20;">
            <div style="background: linear-gradient(135deg, #E91E63 0%, #C2185B 100%); padding: 12px 24px; border-radius: 30px; box-shadow: 0 6px 20px rgba(233,30,99,0.45); transform: rotate(-5deg);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">&#10084; Kinder lieben es!</span>
            </div>
        </div>

        <!-- Small peek worksheet on right -->
        <div style="position: absolute; top: 350px; right: 45px; z-index: 12;">
            <div style="background: white; padding: 6px; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.3);">
                <img src="https://www.lessoncraftstudio.com/samples/german/treasure%20hunt/sample-5.jpeg" alt="Weiteres Arbeitsblatt" style="width: 120px; height: 155px; object-fit: cover; object-position: top; border-radius: 5px; display: block;">
            </div>
        </div>

        <!-- KLASSE 1-2 badge - bottom center -->
        <div style="position: absolute; bottom: 115px; left: 50%; transform: translateX(-50%); z-index: 20;">
            <div style="background: rgba(255,255,255,0.95); padding: 10px 30px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: #1B5E20;">KLASSE 1-2</span>
            </div>
        </div>

        <!-- Bottom pills -->
        <div style="position: absolute; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; gap: 18px; z-index: 20;">
            <div style="background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.35); padding: 10px 22px; border-radius: 28px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; color: white;">Spielerisch lernen</span>
            </div>
            <div style="background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.35); padding: 10px 22px; border-radius: 28px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; color: white;">Verschiedene Themen</span>
            </div>
            <div style="background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.35); padding: 10px 22px; border-radius: 28px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px; color: white;">Sofort loslegen</span>
            </div>
        </div>
    </div>
</body>
</html>
