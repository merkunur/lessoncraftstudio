# Teaching package — identify uppercase letters of the alphabet
# Arc 10 Phase 1 (Path B; early-literacy / letter-recognition strand
# deepening). Class B FLEXIBLE; vocab-anchored. Builds on Arc 9 Phase 1
# identify-letter-by-image-clue. Letter-recognition strand grows 1/6 → 2/6.

targetSlug: identify-uppercase-letters
language: en
title:
  en: "Uppercase Letters — recognize all 26 capital letters"
description:
  en: "Kindergarten early-literacy package teaching uppercase letter recognition. Builds on Arc 9 identify-letter-by-image-clue (initial-letter-by-image work) — kids now systematically recognize all 26 uppercase letters in isolation, paired with familiar vocabulary anchors. Pre-reading bridge: kids transition from image-mediated letter awareness to direct letter recognition. Vocab-anchored throughout: each letter has a familiar vocab anchor (A-Apple, B-Banana, C-Cat...). Composes against alphabet-train + matching apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class alphabet chant + display routine. Teacher displays
      a large alphabet poster with uppercase letters A-Z. Class chants
      the alphabet song while pointing at each letter. Teacher then
      asks: "Find the letter A" — kids point. "Find the letter B" —
      kids point. Repeat with several letters. Reinforces letter-
      shape recognition + sequential alphabet awareness.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + letter-name routine. Each pair receives a deck of 26
      uppercase letter cards + 26 picture cards (one per letter's
      vocab anchor). Pair takes turns: kid A draws a letter card +
      names the letter; kid B finds the matching picture card whose
      vocab starts with that letter. Recast errors with explanation
      ("you said this is letter L but it's actually I — look at the
      shape: I is a straight vertical line; L has a horizontal line
      at the bottom"). Optional extension: kids construct a personal
      alphabet book by matching letters to pictures from the deck.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: alphabet-train worksheet (kids
      identify uppercase letters in train-themed visual). Station 2:
      matching worksheet (uppercase letter to picture vocab anchor).
      Station 3: vocabulary-tracing-strips (kids trace uppercase
      letters of vocabulary words; reinforces letter-shape recognition
      via writing). Station 4: word-guess (kids fill in uppercase
      letters from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class letter-quiz routine. Teacher displays 5-6 uppercase
      letters in random order; class collectively names each in
      sequence. Forward-pointer: "Today we recognized uppercase
      letters. When we come back to letters next, we'll learn LOWERCASE
      letters — and how each uppercase letter has a lowercase partner
      that looks similar but smaller (Aa, Bb, Cc...)."

