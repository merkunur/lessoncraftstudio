assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the make-10 partner for any number 1–9 in
        8 of 10 trials.
      - Apply the make-10 strategy to solve sums-within-20
        where it fits cleanly (e.g., 8+5, 9+4, 7+6) in 6 of
        10 trials.
      - Articulate the make-10 path aloud ('eight plus two
        makes ten, plus three is thirteen') in 5 of 10
        productive-language trials.
      - Decompose the second addend correctly when prompted
        in 6 of 10 trials.

    Differentiation:
    - Pre-K: build make-10 partner recall on a 10-frame
      with counters; skip the strategy-application step.
    - K: full partner-recall fluency + introduction to the
      decomposition move using 10-frame manipulatives;
      sums-within-15 emphasized.
    - Grade 1: full strategy fluency — partner recall +
      decomposition + mental sums-within-20 using the
      strategy.
    - Grade 2+: extend the make-10 idea to make-100 (e.g.,
      78 + 5 = 78 + 2 + 3 = 80 + 3); the same mental move
      generalizes to place-value-aware addition (Arc 16
      add-within-100).

