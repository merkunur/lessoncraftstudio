assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify 5 of 7 basic emotions from face images in 8 of 10
        trials.
      - Articulate facial cue ('they look happy because they're
        smiling') in 6 of 10 trials.
      - Recognize a partner's real-time emotion from observation in
        5 of 10 trials.

    Differentiation:
    - Pre-K: 4 core emotions (happy, sad, scared, angry); receptive
      face-matching only.
    - K: 7 emotions; productive description of facial cues.
    - Grade 1+: extend to subtle emotions (worried, content,
      embarrassed) + bridge to empathic-response work (Arc 12+
      candidate).

