<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Word Search - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(180deg, #FFFBEB 0%, #FEF3C7 100%);">

        <!-- Subtle dot pattern overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image: radial-gradient(circle, #6D28D9 1px, transparent 1px); background-size: 30px 30px;"></div>

        <!-- FREE Badge - tab style -->
        <div style="position: absolute; top: 0; left: 30px; z-index: 20;">
            <div style="background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); padding: 12px 28px 16px 28px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 15px rgba(249,115,22,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">FREE!</span>
            </div>
        </div>

        <!-- Grade Badge - top right -->
        <div style="position: absolute; top: 25px; right: 30px; z-index: 20;">
            <div style="background: #6D28D9; padding: 10px 22px; border-radius: 25px; box-shadow: 0 3px 10px rgba(109,40,217,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: white; letter-spacing: 1px;">GRADES K-1</span>
            </div>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 55px; left: 50%; transform: translateX(-50%); text-align: center;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 66px; font-weight: 700; color: #4C1D95; text-shadow: 0 3px 6px rgba(0,0,0,0.08);">Everything Included</h1>
            <div style="width: 200px; height: 5px; background: linear-gradient(90deg, transparent, #FBBF24, transparent); margin: 10px auto 0;"></div>
        </div>

        <!-- Feature Circles - evenly spaced row -->
        <div style="position: absolute; top: 175px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; align-items: flex-start;">

            <!-- Circle 1 - Image Clues (purple) -->
            <div style="text-align: center; width: 145px;">
                <div style="width: 120px; height: 120px; margin: 0 auto; background: linear-gradient(145deg, #7C3AED 0%, #6D28D9 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(109,40,217,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #FBBF24;">
                    <span style="font-size: 50px;">🔍</span>
                </div>
                <p style="margin: 10px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #4C1D95;">Image<br>Clues</p>
            </div>

            <!-- Circle 2 - Answer Keys (teal) -->
            <div style="text-align: center; width: 145px;">
                <div style="width: 120px; height: 120px; margin: 0 auto; background: linear-gradient(145deg, #0D9488 0%, #0F766E 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(13,148,136,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #FBBF24;">
                    <span style="font-size: 50px;">✅</span>
                </div>
                <p style="margin: 10px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #4C1D95;">Answer<br>Keys</p>
            </div>

            <!-- Circle 3 - Multiple Themes (orange) -->
            <div style="text-align: center; width: 145px;">
                <div style="width: 120px; height: 120px; margin: 0 auto; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(249,115,22,0.5), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #FBBF24;">
                    <span style="font-size: 50px;">🎨</span>
                </div>
                <p style="margin: 10px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #4C1D95;">Multiple<br>Themes</p>
            </div>

            <!-- Circle 4 - Print Ready (pink) -->
            <div style="text-align: center; width: 145px;">
                <div style="width: 120px; height: 120px; margin: 0 auto; background: linear-gradient(145deg, #EC4899 0%, #DB2777 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(236,72,153,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #FBBF24;">
                    <span style="font-size: 50px;">🖨️</span>
                </div>
                <p style="margin: 10px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #4C1D95;">Print<br>Ready</p>
            </div>

            <!-- Circle 5 - No Prep (blue) -->
            <div style="text-align: center; width: 145px;">
                <div style="width: 120px; height: 120px; margin: 0 auto; background: linear-gradient(145deg, #3B82F6 0%, #2563EB 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(59,130,246,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #FBBF24;">
                    <span style="font-size: 50px;">📋</span>
                </div>
                <p style="margin: 10px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #4C1D95;">No<br>Prep</p>
            </div>
        </div>

        <!-- Sample Display Section - Worksheet + Answer Key pair -->
        <div style="position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); display: flex; gap: 70px; align-items: flex-end;">

            <!-- Worksheet Preview -->
            <div style="text-align: center;">
                <div style="width: 280px; height: 362px; background: white; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.18), 0 0 0 4px #6D28D9; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/wordsearch/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Worksheet">
                </div>
                <div style="margin-top: 14px; background: #6D28D9; padding: 8px 28px; border-radius: 20px; display: inline-block;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700; color: white;">WORKSHEET</span>
                </div>
            </div>

            <!-- Answer Key Preview -->
            <div style="text-align: center;">
                <div style="width: 280px; height: 362px; background: white; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.18), 0 0 0 4px #0D9488; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/wordsearch/sample-2-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Answer Key">
                </div>
                <div style="margin-top: 14px; background: #0D9488; padding: 8px 28px; border-radius: 20px; display: inline-block;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700; color: white;">ANSWER KEY</span>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
