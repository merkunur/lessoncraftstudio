thematicCoherence:
  en: |
    All 5 packages cohere around the classroom-context theme + form a
    pedagogical progression supporting school-day participation skills.

    **Pedagogical sequencing:**
    1. **identify-and-name-school-objects** — Foundational classroom
       vocabulary (pencil, eraser, book, scissors, glue). Vocabulary
       anchor for school-day participation.
    2. **follow-1-step-oral-instruction** — Classroom-routine receptive-
       language work ("get your pencil"; "open your book"). Bridges
       vocabulary to classroom-instruction comprehension.
    3. **identify-community-helpers** — Community-roles work extending
       to school-context helpers (teacher + librarian + nurse +
       custodian). Connects classroom-vocab to school-community
       awareness.
    4. **identify-days-of-week** — Time-and-routine work supporting
       weekly classroom rhythm (Monday + library day; Tuesday + gym;
       etc.). Classroom-routine integration.
    5. **notice-cognate-word-pairs** — Multilingual-language-awareness
       package using classroom-vocab cognates as cross-locale bridges.
       Supports dual-language and immersion classroom contexts where
       cognate-recognition accelerates vocabulary transfer.

    **Strand spread:** 1 vocabulary-acquisition + 1 speaking-and-
    listening + 1 community-and-roles + 1 time-and-routine + 1
    multilingual-language-awareness. **5 distinct strands.** Broadest
    cross-strand bundle in Pillar 2 Arc 2 Phase 2.

    **Suggested unit duration:** 4-5 weeks. Best timed for back-to-
    school season (early academic year).

    **Multilingual classroom relevance:** classroom vocabulary high-
    frequency K-3 target across all 11 platform locales. The notice-
    cognate-word-pairs package specifically anchors multilingual-
    awareness — kids notice "lápiz/pencil/Bleistift" or "libro/book/
    Buch" share semantic + sometimes phonetic features across their
    languages. Particularly load-bearing for international school +
    dual-language program contexts (the §1 audience).

    **Pillar 2 architectural pattern:** classroom-bundle illustrates
    broadest-cross-strand composition — 5 distinct strands anchored
    by a common context (the school day). Demonstrates that bundle
    coherence can come from shared CONTEXT (the classroom) as much as
    from shared TOPIC (e.g., colors as discrete subject-matter).
    Context-anchored bundles work alongside topic-anchored bundles
    in the Pillar 2 catalog.
