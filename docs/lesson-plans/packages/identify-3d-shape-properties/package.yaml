compositionalRationale:
  en: |
    Primary strand: math / geometry (3D shape property analysis —
    extends strand by quantitative-analysis work). Secondary strand:
    vocabulary-acquisition (3D shape + property vocabulary: face,
    edge, corner, vertex). Tertiary strand: cognitive-and-
    executive-function / counting (counting faces/edges/corners
    requires systematic counting).

    Architectural significance: extends geometry strand from shape-
    naming (Arc 9-13) + 2D-attribute work (describe-shape-attributes)
    + 2D drawing (Arc 14 Phase 2 trace-2d-shapes + draw-2d-shapes-
    freehand) to 3D-property quantitative analysis. Critical bridge
    from visual shape recognition (2D) to spatial-property reasoning
    (3D); foundation for later area, volume, surface-area work.
    Geometry strand at this Phase 1: extends 1 package.

    Distinctive composition: 2 matching + 1 pattern-train + 1
    math-puzzle (property-match) + 1 missing-pieces. Quantitative
    property analysis emphasized; math-puzzle introduces shape-
    identification-from-properties (reverse direction of property-
    counting).

    Class B FLEXIBLE substrate: composes against shapes theme; 3D
    shapes need rich visual representation. Manipulative-cut-outs
    in 3D-shape-nets mode produces foldable shape-nets for tactile
    work.

    K-3 multilingual classroom relevance: 3D shape vocabulary
    cognate-rich Romance (cubo / cube / cubo) + Germanic (Würfel
    / kubus / kub — Germanic distinct from Romance). Property
    vocabulary (face, edge, corner) more varied: "face" (cara /
    Seite / face); "edge" (arista / Kante / kant); "corner"
    (esquina/vértice / Ecke/Eckpunkt / hörn). Locale-variant work
    at Phase 3+ adapts to each locale's geometry vocabulary.

