<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Picture Bingo - Professional Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(135deg, #0D47A1 0%, #1A237E 50%, #311B92 100%); overflow: hidden;">

        <!-- Subtle geometric pattern -->
        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 20% 80%, rgba(255,214,0,0.08) 0%, transparent 40%), radial-gradient(circle at 80% 20%, rgba(255,214,0,0.06) 0%, transparent 35%);"></div>

        <!-- Gold accent lines -->
        <div style="position: absolute; top: 0; left: 60px; width: 2px; height: 200px; background: linear-gradient(180deg, rgba(255,214,0,0.6), transparent);"></div>
        <div style="position: absolute; top: 0; right: 60px; width: 2px; height: 200px; background: linear-gradient(180deg, rgba(255,214,0,0.6), transparent);"></div>
        <div style="position: absolute; bottom: 0; left: 100px; width: 2px; height: 150px; background: linear-gradient(0deg, rgba(255,214,0,0.5), transparent);"></div>
        <div style="position: absolute; bottom: 0; right: 100px; width: 2px; height: 150px; background: linear-gradient(0deg, rgba(255,214,0,0.5), transparent);"></div>

        <!-- Corner brackets -->
        <div style="position: absolute; top: 25px; left: 25px; width: 60px; height: 60px; border-left: 3px solid rgba(255,214,0,0.7); border-top: 3px solid rgba(255,214,0,0.7);"></div>
        <div style="position: absolute; top: 25px; right: 25px; width: 60px; height: 60px; border-right: 3px solid rgba(255,214,0,0.7); border-top: 3px solid rgba(255,214,0,0.7);"></div>
        <div style="position: absolute; bottom: 25px; left: 25px; width: 60px; height: 60px; border-left: 3px solid rgba(255,214,0,0.7); border-bottom: 3px solid rgba(255,214,0,0.7);"></div>
        <div style="position: absolute; bottom: 25px; right: 25px; width: 60px; height: 60px; border-right: 3px solid rgba(255,214,0,0.7); border-bottom: 3px solid rgba(255,214,0,0.7);"></div>

        <!-- Quality Seal -->
        <div style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%); z-index: 100;">
            <div style="width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(145deg, #FFD600 0%, #FF6D00 50%, #E65100 100%); box-shadow: 0 8px 30px rgba(255,214,0,0.5), inset 0 -5px 15px rgba(0,0,0,0.2), inset 0 5px 10px rgba(255,255,255,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px solid rgba(255,255,255,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">FREE</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 12px; color: rgba(255,255,255,0.9);">PREMIUM</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 50px; right: 50px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 10px 22px; border-radius: 25px; border: 2px solid rgba(255,214,0,0.5);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #FFD600;">GRADES K-3</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 170px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 54px; color: white; margin: 0; text-shadow: 0 4px 20px rgba(0,0,0,0.3);">Picture Bingo</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 32px; color: #FFD600; margin: 8px 0 0 0; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">Card Generator</h2>
        </div>

        <!-- Large pristine card display -->
        <div style="position: absolute; top: 290px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <div style="position: relative;">
                <!-- Glow effect behind card -->
                <div style="position: absolute; top: 50%; left: 50%; width: 350px; height: 450px; transform: translate(-50%, -50%); background: radial-gradient(ellipse, rgba(255,214,0,0.15) 0%, transparent 70%); border-radius: 20px;"></div>

                <!-- Main card -->
                <div style="box-shadow: 0 25px 70px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,214,0,0.2); border-radius: 18px; overflow: hidden;">
                    <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/bingo/bingo_card.jpeg" style="width: 300px; height: auto; display: block; border-radius: 16px; border: 6px solid white;">
                </div>

                <!-- Corner shine effect -->
                <div style="position: absolute; top: 10px; left: 10px; width: 80px; height: 80px; background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 50%); border-radius: 12px;"></div>
            </div>
        </div>

        <!-- Callout preview - small -->
        <div style="position: absolute; top: 340px; right: 80px; transform: rotate(8deg); z-index: 40;">
            <div style="box-shadow: 0 15px 40px rgba(0,0,0,0.35); border-radius: 12px;">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/bingo/callout.jpeg" style="width: 160px; height: auto; border-radius: 10px; border: 4px solid white;">
            </div>
            <div style="position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); background: rgba(255,214,0,0.95); padding: 5px 12px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: #311B92;">CALLOUT SHEET</span>
            </div>
        </div>

        <!-- Word card preview - small -->
        <div style="position: absolute; top: 370px; left: 80px; transform: rotate(-6deg); z-index: 40;">
            <div style="box-shadow: 0 15px 40px rgba(0,0,0,0.35); border-radius: 12px;">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/bingo/bingo_card%20word.jpeg" style="width: 150px; height: auto; border-radius: 10px; border: 4px solid white;">
            </div>
            <div style="position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); background: rgba(255,214,0,0.95); padding: 5px 12px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: #311B92;">WORD MODE</span>
            </div>
        </div>

        <!-- Feature cards - glass effect -->
        <div style="position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; z-index: 60;">

            <!-- Feature 1: Print Ready -->
            <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 18px 16px; border-radius: 16px; border: 1px solid rgba(255,214,0,0.3); width: 130px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.2);">
                <div style="font-size: 28px; margin-bottom: 8px;">🖨️</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; color: white; line-height: 1.3;">Print Ready<br><span style="color: #FFD600;">300 DPI</span></div>
            </div>

            <!-- Feature 2: Both Modes -->
            <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 18px 16px; border-radius: 16px; border: 1px solid rgba(255,214,0,0.3); width: 130px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.2);">
                <div style="font-size: 28px; margin-bottom: 8px;">🎨</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; color: white; line-height: 1.3;">Images &<br><span style="color: #FFD600;">Words</span></div>
            </div>

            <!-- Feature 3: Grid Sizes -->
            <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 18px 16px; border-radius: 16px; border: 1px solid rgba(255,214,0,0.3); width: 130px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.2);">
                <div style="font-size: 28px; margin-bottom: 8px;">📐</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; color: white; line-height: 1.3;">Grid Sizes<br><span style="color: #FFD600;">3x3 to 5x5</span></div>
            </div>

            <!-- Feature 4: Multiple Cards -->
            <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 18px 16px; border-radius: 16px; border: 1px solid rgba(255,214,0,0.3); width: 130px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.2);">
                <div style="font-size: 28px; margin-bottom: 8px;">📄</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 14px; color: white; line-height: 1.3;">Up to<br><span style="color: #FFD600;">10 Cards</span></div>
            </div>

        </div>

        <!-- Bottom tagline -->
        <div style="position: absolute; bottom: 35px; left: 0; right: 0; text-align: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: rgba(255,255,255,0.8); letter-spacing: 3px;">TEACHER-READY QUALITY</span>
        </div>

        <!-- Subtle decorative dots -->
        <div style="position: absolute; top: 280px; left: 40px; width: 8px; height: 8px; background: rgba(255,214,0,0.4); border-radius: 50%;"></div>
        <div style="position: absolute; top: 320px; left: 55px; width: 6px; height: 6px; background: rgba(255,214,0,0.3); border-radius: 50%;"></div>
        <div style="position: absolute; top: 290px; right: 45px; width: 7px; height: 7px; background: rgba(255,214,0,0.35); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 250px; right: 50px; width: 8px; height: 8px; background: rgba(255,214,0,0.4); border-radius: 50%;"></div>

    </div>
</body>
</html>
