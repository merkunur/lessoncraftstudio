compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition. Secondary strand: phonics. Tertiary
    strand: counting + classroom orientation (scavenger hunt at scaffold station 2
    integrates spatial-classroom-knowledge with vocabulary; not represented in
    farm-animals/clothing/vehicles packages because those vocab sets aren't
    physically present in the classroom). Sentence-strips week 1: i-have-a
    (possession frame matches "I have a pencil" — kid checks own backpack);
    week 2: this-is-a (pointing frame for show-and-tell context).

curriculumStandards:
  - EYFS.ELG.UW
  - IB-PYP.WhereWeAre

assessmentCriteria:
  en: |
    Receptive 10/10; productive 8/10; frame use 6/10.

    Differentiation:
    - Pre-K: receptive via "show me your ___" — kid holds up the actual classroom
      item if owned.
    - K / Grade 1: full productive + sentence-frame use.
    - Grade 2+: extend to verb-with-object compounds ("I write with a pencil. I
      cut with scissors.").

