<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1000, height=1000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px;
    height: 1000px;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(160deg, #064E3B 0%, #065F46 40%, #047857 100%);
    position: relative;
  }

  /* Thin inset border */
  .inset-border {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    bottom: 15px;
    border: 1px solid rgba(167,243,208,0.2);
    border-radius: 8px;
    z-index: 2;
    pointer-events: none;
  }

  /* Subtle sparkle dots */
  .sparkle-dot {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(167,243,208,0.3);
    z-index: 3;
  }
  .sd1 { top: 180px; left: 80px; }
  .sd2 { top: 250px; right: 120px; }
  .sd3 { top: 400px; left: 50px; }
  .sd4 { top: 550px; right: 60px; }
  .sd5 { bottom: 200px; left: 200px; }
  .sd6 { bottom: 300px; right: 200px; }
  .sd7 { top: 300px; left: 180px; width: 2px; height: 2px; }
  .sd8 { top: 680px; right: 150px; width: 2px; height: 2px; }
  .sd9 { top: 350px; right: 170px; width: 4px; height: 4px; }
  .sd10 { bottom: 350px; left: 100px; width: 4px; height: 4px; }

  /* GRATIS badge */
  .gratis {
    position: absolute;
    top: 28px;
    left: 28px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(145deg, #10B981 0%, #059669 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 27px;
    color: white;
    z-index: 20;
    box-shadow: 0 6px 25px rgba(16,185,129,0.4);
    transform: rotate(-8deg);
    border: 3px solid rgba(255,255,255,0.25);
  }

  /* Grade badge */
  .grade {
    position: absolute;
    top: 38px;
    right: 30px;
    background: rgba(167,243,208,0.1);
    backdrop-filter: blur(10px);
    padding: 12px 22px;
    border-radius: 30px;
    border: 1px solid rgba(167,243,208,0.25);
    z-index: 20;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }
  .grade span {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: #A7F3D0;
    letter-spacing: 0.5px;
  }

  /* Title */
  .title-area {
    position: absolute;
    top: 40px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }
  .title-line1 {
    font-size: 66px;
    font-weight: 700;
    background: linear-gradient(180deg, #A7F3D0, #6EE7B7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    line-height: 1;
  }
  .title-line2 {
    font-size: 66px;
    font-weight: 700;
    background: linear-gradient(180deg, #6EE7B7, #34D399);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    line-height: 1;
    margin-top: -2px;
  }
  .subtitle {
    font-family: 'Nunito', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: rgba(167,243,208,0.7);
    margin-top: 10px;
    letter-spacing: 0.5px;
  }

  /* Premium seal */
  .premium-seal {
    position: absolute;
    top: 155px;
    right: 55px;
    width: 100px;
    height: 100px;
    z-index: 15;
  }
  .seal-circle {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2px solid #FDE68A;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(253,230,138,0.08);
  }
  .seal-star {
    font-size: 20px;
    color: #FDE68A;
    line-height: 1;
  }
  .seal-text {
    font-family: 'Nunito', sans-serif;
    font-size: 10px;
    font-weight: 800;
    color: #FDE68A;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.2;
    margin-top: 2px;
  }

  /* Fanned worksheet cards */
  .fan-container {
    position: absolute;
    top: 280px;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 380px;
    z-index: 10;
  }

  .fan-card {
    position: absolute;
    background: white;
    border-radius: 10px;
    padding: 6px;
    top: 50%;
    left: 50%;
  }
  .fan-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 6px;
  }

  /* Left card - dolphin */
  .card-left {
    width: 200px;
    height: 259px;
    transform: translate(-340px, -130px);
    opacity: 0.85;
    box-shadow: 0 6px 25px rgba(0,0,0,0.3);
  }

  /* Center card - fish (featured) */
  .card-center {
    width: 240px;
    height: 310px;
    transform: translate(-120px, -155px);
    z-index: 3;
    box-shadow:
      0 8px 35px rgba(0,0,0,0.4),
      0 0 20px rgba(110,231,183,0.2);
    border: 2px solid rgba(110,231,183,0.3);
  }

  /* Right card - giraffe */
  .card-right {
    width: 200px;
    height: 259px;
    transform: translate(80px, -130px);
    opacity: 0.85;
    box-shadow: 0 6px 25px rgba(0,0,0,0.3);
  }

  /* Checkmark on center card */
  .checkmark {
    position: absolute;
    top: 265px;
    left: 50%;
    transform: translateX(22px);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10B981, #059669);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 15;
    border: 2px solid white;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  }
  .checkmark span {
    color: white;
    font-size: 20px;
    line-height: 1;
  }

  /* Quality bar with glass pills */
  .quality-bar {
    position: absolute;
    bottom: 170px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    z-index: 15;
  }
  .quality-pill {
    background: rgba(167,243,208,0.08);
    border: 1px solid rgba(167,243,208,0.2);
    border-radius: 24px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #A7F3D0;
  }
  .quality-icon {
    font-size: 16px;
    line-height: 1;
  }

  /* Gold separator line */
  .gold-line {
    position: absolute;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(253,230,138,0.3), transparent);
    z-index: 15;
  }

  /* Bottom tagline */
  .tagline {
    position: absolute;
    bottom: 50px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 15;
  }
  .tagline span {
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: rgba(167,243,208,0.5);
    font-style: italic;
  }

  /* Feature pills */
  .pills {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 15;
  }
  .pill {
    background: rgba(167,243,208,0.08);
    border: 1px solid rgba(167,243,208,0.15);
    border-radius: 22px;
    padding: 8px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: rgba(167,243,208,0.7);
  }
</style>
</head>
<body>

<!-- Inset border -->
<div class="inset-border"></div>

<!-- Sparkle dots -->
<div class="sparkle-dot sd1"></div>
<div class="sparkle-dot sd2"></div>
<div class="sparkle-dot sd3"></div>
<div class="sparkle-dot sd4"></div>
<div class="sparkle-dot sd5"></div>
<div class="sparkle-dot sd6"></div>
<div class="sparkle-dot sd7"></div>
<div class="sparkle-dot sd8"></div>
<div class="sparkle-dot sd9"></div>
<div class="sparkle-dot sd10"></div>

<!-- GRATIS badge -->
<div class="gratis">GRATIS</div>

<!-- Grade badge -->
<div class="grade"><span>VORSCHULE&ndash;2. KL.</span></div>

<!-- Title -->
<div class="title-area">
  <div class="title-line1">DURCHDACHT</div>
  <div class="title-line2">GESTALTET</div>
  <div class="subtitle">Professionelle R&auml;tselbl&auml;tter in Druckqualit&auml;t</div>
</div>

<!-- Premium seal -->
<div class="premium-seal">
  <div class="seal-circle">
    <span class="seal-star">&#x2B50;</span>
    <span class="seal-text">PREMIUM<br>QUALIT&Auml;T</span>
  </div>
</div>

<!-- Fanned worksheet cards -->
<div class="fan-container">
  <!-- Left: Dolphin -->
  <div class="fan-card card-left">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-3.jpeg" alt="Delfin Puzzlebild">
  </div>
  <!-- Center: Fish (featured) -->
  <div class="fan-card card-center">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-5.jpeg" alt="Fisch Puzzlebild">
  </div>
  <!-- Right: Giraffe -->
  <div class="fan-card card-right">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-2.jpeg" alt="Giraffe Puzzlebild">
  </div>
</div>

<!-- Checkmark on center card -->
<div class="checkmark"><span>&#x2713;</span></div>

<!-- Quality bar -->
<div class="quality-bar">
  <div class="quality-pill">
    <span class="quality-icon">&#x2713;</span>
    L&ouml;sungsbl&auml;tter inklusive
  </div>
  <div class="quality-pill">
    <span class="quality-icon">&#x1F5A8;</span>
    300 DPI Druckqualit&auml;t
  </div>
  <div class="quality-pill">
    <span class="quality-icon">&#x2B50;</span>
    P&auml;dagogisch durchdacht
  </div>
</div>

<!-- Gold separator -->
<div class="gold-line"></div>

<!-- Feature pills -->
<div class="pills">
  <div class="pill">Sofort einsetzbar</div>
  <div class="pill">Visuelles Lernen</div>
  <div class="pill">Differenziert</div>
</div>

<!-- Tagline -->
<div class="tagline">
  <span>Von Lehrkr&auml;ften gesch&auml;tzt &mdash; sofort einsetzbar im Unterricht</span>
</div>

</body>
</html>
