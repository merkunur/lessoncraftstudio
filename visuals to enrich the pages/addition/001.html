<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Addition Arbeitsbl\u00e4tter - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(150deg, #FFF3E0 0%, #FFE0B2 40%, #FFCC80 100%); overflow: hidden;">

        <!-- Cross-hatch pattern overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image: repeating-linear-gradient(45deg, #E65100 0px, #E65100 1px, transparent 1px, transparent 18px), repeating-linear-gradient(-45deg, #E65100 0px, #E65100 1px, transparent 1px, transparent 18px);"></div>

        <!-- Warm radial glow behind worksheets -->
        <div style="position: absolute; top: 58%; left: 50%; width: 750px; height: 650px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(230,81,0,0.08) 0%, rgba(255,204,128,0.06) 40%, transparent 70%); border-radius: 50%;"></div>

        <!-- Floating plus signs (CSS cross shapes) -->
        <div style="position: absolute; top: 175px; left: 50px; width: 30px; height: 30px; opacity: 0.45;">
            <div style="position: absolute; top: 10px; left: 0; width: 30px; height: 10px; background: #E65100; border-radius: 5px;"></div>
            <div style="position: absolute; top: 0; left: 10px; width: 10px; height: 30px; background: #E65100; border-radius: 5px;"></div>
        </div>
        <div style="position: absolute; top: 330px; left: 30px; width: 24px; height: 24px; opacity: 0.35; transform: rotate(15deg);">
            <div style="position: absolute; top: 8px; left: 0; width: 24px; height: 8px; background: #FF8F00; border-radius: 4px;"></div>
            <div style="position: absolute; top: 0; left: 8px; width: 8px; height: 24px; background: #FF8F00; border-radius: 4px;"></div>
        </div>
        <div style="position: absolute; top: 250px; right: 50px; width: 28px; height: 28px; opacity: 0.4; transform: rotate(-20deg);">
            <div style="position: absolute; top: 9px; left: 0; width: 28px; height: 10px; background: #3E2723; border-radius: 5px;"></div>
            <div style="position: absolute; top: 0; left: 9px; width: 10px; height: 28px; background: #3E2723; border-radius: 5px;"></div>
        </div>
        <div style="position: absolute; top: 430px; right: 40px; width: 22px; height: 22px; opacity: 0.35; transform: rotate(25deg);">
            <div style="position: absolute; top: 7px; left: 0; width: 22px; height: 8px; background: #E65100; border-radius: 4px;"></div>
            <div style="position: absolute; top: 0; left: 7px; width: 8px; height: 22px; background: #E65100; border-radius: 4px;"></div>
        </div>
        <div style="position: absolute; bottom: 320px; left: 75px; width: 26px; height: 26px; opacity: 0.4; transform: rotate(-10deg);">
            <div style="position: absolute; top: 9px; left: 0; width: 26px; height: 8px; background: #FF8F00; border-radius: 4px;"></div>
            <div style="position: absolute; top: 0; left: 9px; width: 8px; height: 26px; background: #FF8F00; border-radius: 4px;"></div>
        </div>

        <!-- Sparkle dots -->
        <div style="position: absolute; top: 200px; left: 115px; width: 8px; height: 8px; background: #FFE082; border-radius: 50%; box-shadow: 0 0 16px 5px rgba(255,224,130,0.6);"></div>
        <div style="position: absolute; top: 370px; right: 95px; width: 6px; height: 6px; background: #E65100; border-radius: 50%; box-shadow: 0 0 14px 5px rgba(230,81,0,0.3);"></div>
        <div style="position: absolute; top: 285px; left: 195px; width: 5px; height: 5px; background: #FF8F00; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(255,143,0,0.4);"></div>
        <div style="position: absolute; bottom: 340px; right: 175px; width: 7px; height: 7px; background: #FFE082; border-radius: 50%; box-shadow: 0 0 15px 5px rgba(255,224,130,0.5);"></div>

        <!-- KOSTENLOS Badge -->
        <div style="position: absolute; top: 25px; left: 28px; z-index: 100;">
            <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #FDD835 0%, #F9A825 100%); border-radius: 50%; box-shadow: 0 8px 28px rgba(249,168,37,0.5), inset 0 -4px 10px rgba(0,0,0,0.12), inset 0 4px 8px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #3E2723; text-shadow: 0 1px 2px rgba(255,255,255,0.4);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: rgba(255,255,255,0.95); padding: 11px 22px; border-radius: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #E65100;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #E65100; letter-spacing: 1px;">KLASSE K-2</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 100px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 78px; color: #3E2723; margin: 0; text-shadow: 3px 3px 0 rgba(230,81,0,0.12), 0 0 40px rgba(230,81,0,0.08);">ADDITION</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 44px; color: #E65100; margin: 6px 0 0 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.08);">Arbeitsbl&auml;tter</h2>
        </div>

        <!-- 3-Worksheet Ascending Staircase Display -->
        <div style="position: absolute; top: 260px; left: 50%; transform: translateX(-50%); width: 820px; height: 460px;">

            <!-- Left worksheet (smallest, lowest) -->
            <div style="position: absolute; left: 70px; top: 100px; z-index: 10;">
                <div style="width: 185px; height: 239px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #FFB74D; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/addition/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Additionsarbeitsblatt">
                </div>
            </div>

            <!-- Plus circle between left and center -->
            <div style="position: absolute; left: 275px; top: 220px; z-index: 30; width: 44px; height: 44px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 4px 12px rgba(249,168,37,0.5); display: flex; align-items: center; justify-content: center; border: 3px solid white;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #3E2723;">+</span>
            </div>

            <!-- Center worksheet (largest, highest - hero) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 20;">
                <div style="position: relative;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/addition/sample-1.jpeg" style="width: 240px; height: 310px; object-fit: cover; border-radius: 12px; border: 6px solid white; box-shadow: 0 18px 50px rgba(0,0,0,0.28), 0 0 30px rgba(230,81,0,0.12);">
                    <div style="position: absolute; inset: -25px; background: radial-gradient(ellipse, rgba(230,81,0,0.08) 0%, transparent 65%); z-index: -1; border-radius: 30px;"></div>
                </div>
            </div>

            <!-- Plus circle between center and right -->
            <div style="position: absolute; right: 265px; top: 180px; z-index: 30; width: 44px; height: 44px; background: linear-gradient(145deg, #FDD835, #F9A825); border-radius: 50%; box-shadow: 0 4px 12px rgba(249,168,37,0.5); display: flex; align-items: center; justify-content: center; border: 3px solid white;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #3E2723;">+</span>
            </div>

            <!-- Right worksheet (medium, middle height) -->
            <div style="position: absolute; right: 70px; top: 55px; z-index: 10;">
                <div style="width: 200px; height: 259px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #FFB74D; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/addition/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Additionsarbeitsblatt">
                </div>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 110px; left: 0; right: 0; background: linear-gradient(90deg, rgba(230,81,0,0.95) 0%, rgba(191,54,12,0.95) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.12), 0 4px 20px rgba(0,0,0,0.12);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.25); letter-spacing: 2px;">Rechnen lernen mit Bildern!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #E65100;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #E65100;">Bilder + Zahlen</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #FF8F00;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #FF8F00;">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #3E2723;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #3E2723;">Druckfertig</span>
            </div>
        </div>

    </div>
</body>
</html>
