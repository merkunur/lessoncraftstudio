# Teaching package — write own name
# Arc 12 Phase 2 (Option G; early-literacy / writing-composition STRAND-FIRST
# 0/8 → 1/8). Foundational writing-for-meaning skill — kids' OWN name is
# typically the first written-word target.

targetSlug: write-own-name
language: en
title:
  en: "Write Your Name — your first word"
description:
  en: "Preschool / Kindergarten early-literacy package teaching kids to write their own name. **FIRST writing-composition strand package in the catalog.** Foundational writing-for-meaning skill: kids' OWN name is the canonical first written-word target — meaningful, motivating, and self-anchored. Builds on Arc 11 trace-straight-lines + Arc 12 trace-curved-lines (motor-foundation) + Arc 11 identify-uppercase-letters + Arc 12 identify-lowercase-letters (letter-recognition). Each kid's name is unique; this package customizes per kid (each kid traces their own name). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class name-share routine. Teacher writes their own name
      on the board: "My name is [Teacher Name]. Watch me write it:
      [letter-by-letter]." Class watches each letter form. Teacher
      then asks: "What's your name? Can you say each letter?" Kids
      spell their names aloud. Reinforces name-as-letters framing
      + introduces the concept that writing one's name is THE
      foundational writing skill.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + name-writing routine. Each kid receives a printed
      name-trace sheet with their OWN NAME (teacher prepared in
      advance) — dotted-letter version + lined-blank version. Kid
      traces dotted name 3 times + writes own name on blank line.
      Partner verifies. Recast errors with explanation ("you wrote
      'M' but your name starts with 'N' — let's look at the
      dotted name: N-N-A-M — straight lines on both sides + a
      diagonal connecting them. M has straight lines + a 'V'
      shape inside — different"). Optional extension: kids write
      their NAMES on artwork they create as ownership label.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: vocabulary-tracing-strips with
      common short names (extending beyond own name to common-name
      tracing for additional motor practice). Station 2: alphabet-
      train worksheet (kids identify letters in their own name).
      Station 3: manipulative cut-outs hands-on name-construction
      (kids assemble their name from letter-tile cut-outs). Station
      4: matching worksheet (image-name pairs reinforce letter-name
      vocabulary).
  closure:
    durationMinutes: 5
    body: |
      Whole-class name-display. Each kid shares their name-writing
      work + says their name aloud. Teacher posts each kid's
      written-name in the classroom (name-tags on cubbies or wall
      display). Forward-pointer: "Today we wrote our OWN names —
      our first written word. When we come back to writing next,
      we'll LABEL pictures with one word — a step beyond our name
      toward writing meaning into our drawings."

