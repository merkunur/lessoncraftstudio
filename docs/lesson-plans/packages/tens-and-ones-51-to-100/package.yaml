assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Decompose 6 of 8 numbers (51-100) into correct tens-and-
        ones representation.
      - Build a given number with base-ten manipulatives in 7 of
        10 trials.
      - Compare two two-digit numbers correctly in 7 of 10 trials.
      - Identify 100 as either "10 tens" or "1 hundred" in 6 of
        10 trials.

    Differentiation:
    - Pre-K: skip 51-100; review earlier place-value packages.
    - K: 51-75 range only; concrete manipulatives.
    - Grade 1: full 51-100 coverage.
    - Grade 2+: extend to hundreds-tens-ones for three-digit
      numbers + bridge to addition-with-regrouping.

