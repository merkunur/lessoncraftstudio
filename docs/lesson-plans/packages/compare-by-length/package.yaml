# Teaching package — compare 2 objects by length
# Arc 9 Phase 1 (Path B; early-numeracy / measurement strand FIRST package).
# Class B FLEXIBLE; vocab-anchored. Foundational measurement skill: kids
# directly compare two objects by length and use comparative vocabulary
# (longer / shorter / same length).

targetSlug: compare-by-length
language: en
title:
  en: "Compare by Length — longer, shorter, or the same?"
description:
  en: "Preschool / Kindergarten early-numeracy package teaching length comparison. FIRST measurement strand package in the catalog. Foundational measurement skill: kids directly compare two objects + name the comparison ('the snake is longer than the worm'). Pre-formal-measurement work — kids develop length-comparison intuition before encountering rulers + numerical units. Vocab-anchored — comparative vocabulary (longer / shorter / same length) reinforced. Composes against big-small + matching apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class direct-comparison routine. Teacher holds up 2 objects
      (e.g., a pencil + a ruler). "Which is longer?" Class identifies.
      "Which is shorter?" Class identifies. Repeat with 4-5 pairs of
      objects of varying length difference. Reinforces the visual-
      comparison skill that underlies all measurement work.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + side-by-side comparison routine. Each pair receives
      a set of 6-8 paper-cut objects of varying length (snake, worm,
      pencil, crayon, ruler, ribbon). Pair compares each item against a
      reference object using the comparative frame: "The snake is
      longer than the worm." / "The worm is shorter than the snake."
      Recast errors with explanation ("you said 'the snake is short'
      — let's compare it to something. The snake is shorter than what?
      The snake is longer than the worm. Use 'longer' or 'shorter' WITH
      'than X' so we know what we're comparing"). Optional extension:
      kids order 3 objects shortest-to-longest using direct comparison.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: big-small worksheet (kids identify
      bigger/smaller — sibling concept that introduces comparative
      reasoning). Station 2: matching worksheet (image-name pairs;
      reinforces vocabulary that supports length descriptions).
      Station 3: manipulative cut-outs hands-on length-comparison
      (kids order objects by length using direct comparison). Station
      4: sentence-strips (kids fill in comparative sentences using
      'longer' / 'shorter' / 'same length' frames).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays 4 objects of varying
      length; class collectively orders them shortest to longest using
      direct comparison. Forward-pointer: "Today we compared 2 things by
      length. When we come back to measuring next, we'll compare WEIGHT
      — which thing is heavier and which is lighter — and CAPACITY —
      which container holds more."

