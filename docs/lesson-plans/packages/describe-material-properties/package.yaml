compositionalRationale:
  en: |
    Primary strand: world-knowledge / materials-and-
    properties (describe material properties — STRAND-
    SAT-CLOSING 1/2 → 2/2). 18TH PARENT-CLASS STRAND
    SATISFIED in the catalog. Final canonical fill in
    the materials-and-properties strand; pairs with Arc
    18 Phase 1.3 identify-common-materials (the 1st
    canonical target — material identification) which
    opened the strand.

    Secondary strand: vocabulary-acquisition (property-
    vocabulary: hard/soft, smooth/rough, flexible/rigid,
    transparent/opaque — 8 property words organized into
    4 binary pairs). Tertiary strand: scientific-
    reasoning + property-classification (kids reason
    about WHY materials are used the way they are based
    on observable properties; foundation for Grade 2+
    materials-property investigation work).

    Architectural significance: SAT-CLOSES the world-
    knowledge / materials-and-properties strand at 2/2.
    Per learning-targets.json the strand has 2 canonical
    targets; Arc 18 Phase 1.3 opened the strand to 1/2
    via identify-common-materials; this Phase 1.4
    package closes the strand at 2/2 SAT. **18th
    parent-class strand SATISFIED in the catalog**
    (advances aggregate strand-saturation 17/30 → 18/30
    = 60.0%). Closes the LAST partial-coverage strand
    in the world-knowledge domain — world-knowledge
    domain advances from 4/6 SAT to 5/6 SAT (only PSED
    remains partial in world-knowledge after Phase 1.4
    closes; PSED is Slot 4 of this same Phase 1.4
    advancing 3/8 → 4/8).

    Pair-coherent extension of identify-common-materials:
    that package taught the 6-material identification
    foundation (kids learn WOOD / PLASTIC / METAL /
    PAPER / FABRIC / GLASS as a closed canonical
    vocabulary set; identify which material an object
    is made of by SEEING + TOUCHING). This package
    EXTENDS the identification work to property
    description (kids who can identify materials now
    describe their observable properties). The cognitive
    progression: things → living-vs-non-living (Arc 11)
    → for-non-living-things-what-material (Arc 18 P1.3)
    → for-each-material-what-properties (THIS PACKAGE).
    Each step builds on the prior; this package
    completes the K-1 materials-science arc.

    Per §A.13.30 K-1-informal framing: K material-
    property work is CONCRETE OBSERVABLE-PROPERTY
    DESCRIPTION (kid touches material → kid names
    property word from 8-vocabulary set organized into
    4 binary pairs). The 8-property vocabulary
    (hard/soft, smooth/rough, flexible/rigid,
    transparent/opaque) is deliberately the K-1
    foundational set; some properties (magnetic,
    elastic, conductive, water-absorbing, malleable)
    are out-of-scope at K for vocabulary-load reasons.
    The 4 property-pair structure is pedagogically
    chosen because BINARY OPPOSITES are easier for K
    kids to grasp than continuous scales (kids can
    classify HARD-vs-SOFT before they can classify
    HARDER-OR-SOFTER). Formal materials-property
    investigation (NGSS 2-PS1-1 'Plan and conduct an
    investigation to describe and classify different
    kinds of materials by their observable properties')
    is Grade 2+ work that builds on this K-level
    property-vocabulary foundation. Grade 2 work shifts
    from VOCABULARY (this package) to INVESTIGATION
    (designing experiments to test which materials
    float, which are magnetic, which are transparent).

    Distinctive composition: 2 picture-sort exercises +
    2 matching exercises + 1 odd-one-out. **Same
    composition shape as Arc 18 P1.3 identify-common-
    materials precedent + Arc 11 identify-living-vs-
    nonliving precedent** — picture-sort + matching +
    odd-one-out triad is the canonical K-level
    classification-pedagogy app set. Pair-package
    composition coherence with identify-common-
    materials is intentional: same exercise shape lets
    kids transfer their identification skills directly
    to property-description without learning new
    exercise mechanics.

    Materials note: 7-material World-knowledge class
    stack per §A.13.37. **Pair-coherent with Arc 18
    P1.3 identify-common-materials precedent on every
    materials-list dimension** (flashcards + picture-
    cards + matching-mat + sentence-strips +
    manipulative-cut-outs + parent-take-home-letter +
    answer-key; NO vocabulary-tracing-strips per
    World-knowledge 7 vs Numeracy/Literacy 8 class
    distinction). Sentence-strips at position 4 with
    framePreset 'this-is-a' (property-anchor frames:
    "This wood is hard. This fabric is soft. This glass
    is smooth.") — same framePreset as identify-common-
    materials; the frame structure accommodates BOTH
    material-naming AND property-description work via
    the same "this is X" template. Manipulative-cut-
    outs at position 5 emits canonical-correct
    `mode: variety` with vocabKey enumeration of the
    SAME 6 material-type vocabKeys as identify-common-
    materials (wood, plastic, metal, paper, fabric,
    glass) at itemCount 4. **The vocabKey set is
    deliberately identical to the pair package** — kids
    handle the same physical cut-outs they used in
    identify-common-materials, this time describing
    properties rather than naming materials. This
    surfaces the cognitive-continuity intent: same
    materials, deeper observation. The §A.13.35 mode-
    correct shape inherits cleanly from Phase 1.3
    precedent.

    **SUBSTRATE CARRY-FORWARD TO P2 per §A.13.32 sub-
    doctrine (d) generator-executability:**
    The vocabKey image substrate (wood / plastic /
    metal / paper / fabric / glass images in image
    library + corresponding entries in image-
    vocabulary.js) does NOT yet exist at Phase 1.4
    ship. Substrate creation is deferred to Pillar 5
    P2 close-out cycle per §A.13.38 decoupled-ship
    discipline. **This package SHARES the materials
    substrate gap with its pair package identify-
    common-materials** (Arc 18 P1.3 carry-forward).
    Substrate authoring at P2 close-out covers BOTH
    packages in a single substrate-authoring action
    (same 6 vocabKeys, same image needs).

    Class B FLEXIBLE substrate: composes against
    miscellaneous theme for composedExercises (property
    descriptions span object-attribute work; no single
    semantic theme captures the breadth of property-
    bearing objects). The picture-sort exercises use
    animals + vehicles + fruits theme contrasts (a
    property-indirect proxy — kids sort by visible
    properties of theme objects: vehicles tend to be
    HARD + RIGID; fruits are SOFT or FIRM; animals
    living-not-property). Same composedExercises shape
    as identify-common-materials precedent.

    K-3 multilingual classroom relevance: property
    description is universal K-1 science content. The
    8-property vocabulary is locale-portable; every
    locale has K-1 vocabulary for these common
    observable properties. Cross-locale property
    vocabulary: en 'hard/soft, smooth/rough,
    flexible/rigid, transparent/opaque'; de 'hart/weich,
    glatt/rau, biegsam/starr, durchsichtig/
    undurchsichtig'; es 'duro/blando, liso/áspero,
    flexible/rígido, transparente/opaco'; pt
    'duro/macio, liso/áspero, flexível/rígido,
    transparente/opaco'; fr 'dur/mou, lisse/rugueux,
    flexible/rigide, transparent/opaque'; it
    'duro/morbido, liscio/ruvido, flessibile/rigido,
    trasparente/opaco'; nl 'hard/zacht, glad/ruw,
    buigzaam/stijf, doorzichtig/ondoorzichtig'; fi
    'kova/pehmeä, sileä/karkea, taipuisa/jäykkä,
    läpinäkyvä/läpinäkymätön'; sv 'hård/mjuk,
    slät/grov, böjlig/styv, genomskinlig/ogenomskinlig';
    da 'hård/blød, glat/ru, bøjelig/stiv, gennemsigtig/
    uigennemsigtig'; no 'hard/myk, glatt/ru, bøyelig/
    stiv, gjennomsiktig/ugjennomsiktig'. The 4-pair
    binary-opposite structure is universal in K-1
    materials science vocabulary across the 11 locale
    variants. Locale-variant work at Phase 3+ adapts
    to each locale's property-vocabulary register;
    some property words have register variation
    (formal vs informal forms).

