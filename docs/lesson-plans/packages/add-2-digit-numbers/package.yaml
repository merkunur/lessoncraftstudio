# Teaching package — add two 2-digit numbers
# Arc 18 Phase 1.3 (math / addition-subtraction strand 11/14 → 12/14). Extends Arc 16 P1.1 add-within-100 (broader 1-and-2-digit addition within 100) by specifically structuring 2-digit+2-digit addition with explicit place-value scaffolding. Builds on Arc 15 Phase 4 tens-and-ones-51-to-100 + Arc 15 decompose-tens-and-ones-within-19 + Arc 16 add-within-100 prerequisites.

targetSlug: add-2-digit-numbers
language: en
title:
  en: "Add Two 2-Digit Numbers — line up the tens and ones"

description:
  en: "Grade 2 math package teaching the canonical 2-digit-plus-2-digit addition skill: kids add pairs of two-digit numbers (45+23, 27+38, 56+44, 89+11) by lining up the TENS and ONES columns and adding column-by-column. Builds on Arc 16 P1.1 add-within-100 (the broader computational fluency target — any addition within 100); this package specifically narrows to 2-digit-plus-2-digit cases and emphasizes the place-value column structure that makes 2-digit addition systematic. Both with-regrouping (when ones sum is 10+ and a ten is carried to the tens column) and without-regrouping (when ones sum is under 10) cases are practiced. Addition-subtraction strand advances 11/14 → 12/14. Per §A.13.30 K-3 informal framing: Grade 2 2-digit addition is PLACE-VALUE-GROUNDED computational fluency — kids understand WHY the column-add procedure works (tens add to tens because they're the SAME PLACE VALUE; ones to ones same logic; regrouping when ones overflow because 10 ones = 1 ten by place-value structure). NOT formal column-addition algorithm mastery (which is Grade 3+ work refining for efficiency); the Grade 2 emphasis is conceptual understanding through manipulatives + multiple strategies + standard algorithm awareness. CCSS.2.NBT.B.5 primary anchor ('Fluently add and subtract within 100 using strategies based on place value, properties of operations, and/or the relationship between addition and subtraction'). 5 worksheet exercises + 7 printable materials over a 1-week unit. Load-bearing materials: place-value-mat (tens-and-ones column structure made physical; **generator DEFERRED per Pillar 5 (C) carry-forward** — see Arc 16 P1.1 add-within-100 precedent for the same gap) + manipulative-cut-outs in `mode: variety` with base-ten vocabKeys (ten-stick + ones-counter; **mode-canonical-correct shape per §A.13.35 + operator-locked Phase 1.2 Slot 2 precedent**; diverges from Arc 16 P1.1 add-within-100's non-canonical `mode: base-ten-blocks` — that package is on the retro-fix carry-forward queue alongside Arc 17 P1.4 tell-time pair)."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class 2-digit column-addition introduction.
      Teacher writes 45+23 vertically on the board with
      tens-and-ones columns clearly drawn (a vertical
      line separating tens from ones positions). "Today
      we add TWO TWO-DIGIT NUMBERS. We line up the TENS
      column and the ONES column. 45 has 4 TENS and 5
      ONES. 23 has 2 TENS and 3 ONES. We add the ONES
      first: 5+3 = 8. Eight ones, no regroup needed.
      Then the TENS: 4+2 = 6 tens, which is 60. So 45+23
      = 68." Teacher repeats with 27+38 (NEEDS regrouping
      — ones sum 15 = 1 ten + 5 ones; the 1 ten carries
      to the tens column; tens sum 2+3+1 = 6 tens = 60;
      result 65). Then 56+44 (regrouping ones to make
      exactly 100). Pattern emphasis: "When you add 2-
      digit numbers, ALWAYS line up the TENS column and
      the ONES column. Add the ONES first. If they sum
      to 10 or more, REGROUP — carry the ten over.
      Then add the TENS, including any carried ten."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + place-value-grounded 2-digit addition
      routine. Each pair receives a place-value-mat (a
      paper mat with TENS column on left + ONES column
      on right) + base-ten manipulatives (ten-sticks +
      ones-counters as cut-outs) + a worksheet with 6
      problems (45+23, 27+38, 56+44, 64+15, 33+18,
      78+22). Pair takes turns: kid A builds the first
      number on the place-value-mat (45 = 4 ten-sticks
      in TENS column + 5 ones-counters in ONES column);
      kid B builds the second number (23 = 2 ten-sticks
      + 3 ones-counters); together they combine columns
      + check for regrouping (if ones column has 10+
      counters, slide 10 ones-counters into a ten-stick
      and add it to the TENS column). Then count total
      tens + total ones; write the answer. Recast errors
      with regroup-demo ("you have 13 ones in the ones
      column — that's 1 ten and 3 ones. Slide the ten
      out + add it to your tens column."). The physical
      place-value-mat + base-ten manipulatives are load-
      bearing — kids who SEE the regrouping physically
      understand WHY the column-add algorithm works.
      Strategy diversity: kids may also use decomposition
      (45+23 = 40+20+5+3 = 60+8 = 68) or count-on
      strategies; teacher accepts any strategy that
      produces correct answer + connects to place-value
      reasoning.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity —
      match 2-digit addition expressions (e.g., 45+23)
      to their sums (68). Station 2: chart-count activity
      — count by 10s with 2-digit numbers (10, 20, 30,
      ..., 100). Station 3: math-puzzle (missing-addend:
      27+?=65; ?+38=65). Station 4: math-worksheet
      (vertical-format 2-digit addition practice with
      mix of regrouping + non-regrouping problems).
  closure:
    durationMinutes: 5
    body: |
      Whole-class 2-digit addition quick-recall. Teacher
      presents 5 fast problems; class collectively
      answers + identifies regrouping moments. "27+45?"
      (Class works it: 72; regrouping needed.) "33+24?"
      (57; no regrouping.) "48+39?" (87; regrouping
      needed.) "60+30?" (90; no regrouping.) "55+45?"
      (100; regrouping makes exactly 100.) Teacher then
      poses the place-value-reasoning question: "Why do
      we line up the tens and ones?" (Class: because we
      add the SAME PLACE VALUES together!) Forward-
      pointer: "Today we mastered 2-digit + 2-digit
      addition with regrouping. Next we'll learn the
      same skill for SUBTRACTION — subtract-2-digit-
      numbers, with BORROWING (the reverse of
      regrouping). After that, we'll add THREE numbers
      within 20 (add-3-numbers-within-20) — the LAST
      target in our addition-subtraction strand. Two
      more packages and we'll have CLOSED the addition-
      subtraction work for K-3!"

