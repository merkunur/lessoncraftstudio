assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compute subtraction within 100 correctly in 7 of 10 trials.
      - Identify borrowing moments + execute borrowing correctly
        in 6 of 8 problems requiring it.
      - Use at least 2 subtraction strategies (e.g., column-subtract-
        with-borrowing + decomposition) in 5 of 10 trials.
      - Solve missing-operand problems (73-?=45) in 5 of 10 trials.

    Differentiation:
    - Pre-K: skip within-100; review subtract-within-10 + subtract-
      within-20.
    - K: subtraction within 50; manipulative support emphasized;
      avoid borrowing-required problems initially.
    - Grade 1: subtraction within 100 with borrowing introduced;
      column-subtract format practiced.
    - Grade 2+: extend to three-digit subtraction with double-
      borrowing (Arc 16+ candidate); bridge to mental two-digit
      subtraction fluency + algorithm automaticity.

