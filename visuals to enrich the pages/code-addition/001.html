        <div style="position: absolute; top: 400px; right: 100px; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(145deg, #FFD600 0%, #FFA000 100%); box-shadow: 0 5px 18px rgba(255,214,0,0.45); display: flex; align-items: center; justify-content: center; transform: rotate(-5deg);">
