description:
  en: "Comprehensive K-3 bundle centered on ocean-creature vocabulary + habitat classification + counting + visual-discrimination work. 5 packages span world-knowledge living-things (identify-living-vs-nonliving — ocean creatures as living-things) + cognitive classification (classify-animals-by-habitat — ocean as canonical habitat category) + numeracy (count-objects-1-to-10 — counting fish + sea creatures) + cognitive-sorting (sort-by-color — ocean creatures vary richly in color: tropical fish, anemones, coral) + visual-discrimination (find-hidden-target-in-busy-scene — sea creatures camouflaged in busy reef scenes). Suitable for a 5-week classroom unit on ocean ecosystems + sea-creature exploration; supports K-3 multilingual classrooms with marine-biology + nature-documentary extensions."

