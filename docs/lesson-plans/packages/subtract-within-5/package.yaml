assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compute subtraction within 5 correctly in 8 of 10 trials.
      - Use vocabulary MINUS / TAKE AWAY / EQUALS accurately in 7
        of 10 trials.
      - Demonstrate subtraction with concrete manipulatives in 6
        of 10 trials.

    Differentiation:
    - Pre-K: subtraction within 3 only (3-1, 3-2, 2-1); concrete
      manipulatives required.
    - K: subtraction within 5; concrete + pictorial methods.
    - Grade 1+: extend to subtract-within-10 + subtract-within-20
      + bridge to two-digit subtraction work.

