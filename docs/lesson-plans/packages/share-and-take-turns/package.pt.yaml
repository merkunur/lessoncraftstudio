# Teaching package — share with peers and take turns (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT per Arc 7 Phase 3 + Arc 3 Phase 1 sparse-override pattern.
# Arc 17 Phase 1.1 pt-cadence continuation (15th consecutive arc).
# SAT-CLOSING for PSED canonical strand. Completes Arc 16 SEL triad-pair in pt.
# BR Portuguese register per CLAUDE.md §6 (pt = BR canonical); formal "você"
# address per §17.9. Cross-cultural-sensitivity discipline preserved per BR
# context (shared-from-common-dish family meal tradition recognized as fair).

title:
  pt: "Compartilhar e Esperar a Vez — habilidades pró-sociais para brincadeira cooperativa"

description:
  pt: "Pacote socioemocional para Jardim de Infância / 1º ano do ensino fundamental ensinando esperar a vez + compartilhar como comportamentos pró-sociais concretos. Habilidade fundamental: as crianças aprendem os roteiros de linguagem social (\"minha vez\" / \"sua vez\" / \"vamos compartilhar\"), as pistas situacionais que disparam o esperar-a-vez (um brinquedo + duas crianças; um balanço + uma fila; um pacote de lanche + um amigo) e o trabalho de controle de impulsos necessário para esperar enquanto outra criança usa sua vez. Pacote de FECHAMENTO da saturação: completa o fio canônico PSED em 8/8. Constrói sobre o tripé SEL do Arco 16: name-and-describe-feelings-detailed (as crianças nomeiam o que sentem quando esperar é difícil — frustradas, ciumentas, impacientes) + show-perspective-taking (as crianças imaginam como a outra criança se sente quando chega a sua vez). Esperar-a-vez é a SAÍDA COMPORTAMENTAL desses dois substratos cognitivos-emocionais. Trabalho pró-social crítico para K-3; fundamento para resolução de conflitos + colaboração + normas de comunidade de aprendizes."

structure:
  warmup:
    body: |
      Atividade de reconhecimento de cenário para toda a turma. A
      professora ou o professor mostra a imagem de duas crianças
      tentando pegar o mesmo brinquedo. \"O que está acontecendo
      aqui? Ambas as crianças querem o brinquedo. O que elas podem
      fazer?\" A turma faz uma chuva de ideias: esperar a vez,
      compartilhar, pedir com educação. A professora introduz 3
      roteiros de linguagem social: \"minha vez\" (reivindicar uma
      vez de forma justa), \"sua vez\" (oferecer uma vez a um
      colega), \"vamos compartilhar\" (usar o item em conjunto
      quando possível). A professora então mostra mais 2 cenários:
      5 crianças na fila do escorregador (esperar-a-vez por fila)
      e um pacote de lanche com 6 biscoitos compartilhado entre 3
      crianças (compartilhar por divisão). Ênfase do padrão:
      \"Esperar a vez e compartilhar usam PALAVRAS para resolver
      problemas de justiça sem que ninguém se machuque ou fique
      triste.\"

  contentActivity:
    body: |
      Trabalho em duplas + rotina de prática de esperar-a-vez. Cada
      dupla recebe 1 brinquedo ou peça de jogo compartilhada
      (restrição intencional de 1-item-para-2-crianças). A dupla
      pratica o roteiro de esperar-a-vez: a criança A diz \"minha
      vez,\" brinca por 30 segundos, diz \"sua vez,\" passa para a
      criança B; a criança B brinca por 30 segundos, diz \"sua
      vez,\" passa de volta. A professora circula + corrige erros
      modelando roteiros (\"vejo que você pegou de volta — tente
      dizer 'quero a minha vez agora, por favor' em vez disso\").
      Extensão opcional: as crianças dramatizam um cenário de
      compartilhar-sem-esperar-a-vez (por exemplo, a criança A
      desenha em uma metade do papel; a criança B desenha na outra
      metade; elas compartilham a página sem turnos sequenciais).
      Discussão: quando esperar-a-vez funciona vs quando compartilhar-
      junto funciona? (Um brinquedo = esperar a vez; um lanche com
      muitas peças = compartilhar por divisão; um papel grande para
      desenhar = compartilhar usando partes diferentes.) Nota
      cultural-pt-BR: muitas famílias brasileiras compartilham
      comida de um prato comum — esse também é compartilhar, mesmo
      sem porções individuais.

  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios picture-sort
      (as crianças classificam imagens de cenário em \"esperando a
      vez\" vs \"não esperando a vez\" — por exemplo, criança
      esperando na fila para o balanço VAI EM esperando-a-vez;
      criança tirando brinquedo da colega VAI EM não-esperando-a-vez).
      Estação 2: folha de emparelhamento (imagem de cenário →
      resposta de linguagem social apropriada: 5 crianças na fila ↔
      \"esperamos a nossa vez\"; um brinquedo 2 crianças ↔ \"vamos
      esperar a vez\"; 6 biscoitos 3 crianças ↔ \"vamos
      compartilhar\"). Estação 3: math-worksheet (contexto de
      contagem — quantas vezes cada criança ganha se 6 vezes no
      total + 3 crianças = 2 cada; quantos biscoitos cada uma se
      6 biscoitos + 3 crianças = 2 cada; contagem como raciocínio
      de justiça). Estação 4: manipulative cut-outs (as crianças
      montam um rastreador-de-vezes cardstrip: quadrado-do-nome-da-
      criança + 5 caixas-de-verificação de vezes; marcar cada vez
      conforme é tomada; rastreador visual de justiça para tempo de
      brincadeira livre).

  closure:
    body: |
      Promessa de esperar-a-vez para toda a turma. A turma nomeia
      coletivamente os 3 roteiros de linguagem social (\"minha vez\"
      / \"sua vez\" / \"vamos compartilhar\") e identifica 2
      situações na sala de aula da semana onde cada roteiro se
      aplicou. A professora encerra com: \"Esta semana aprendemos as
      PALAVRAS para esperar a vez e compartilhar de forma justa.
      Quando você se sentir impaciente, com ciúme ou triste porque
      ainda não é a sua vez — lembre-se do trabalho com sentimentos
      que fizemos com name-and-describe-feelings-detailed e do
      trabalho de perspectiva que fizemos com show-perspective-
      taking. A outra criança se sente feliz quando É a sua vez,
      assim como você se sente feliz quando é a sua.\" Indicador
      adiante: \"Quando voltarmos às habilidades sociais na próxima
      vez, aprenderemos o que fazer quando o esperar-a-vez não dá
      certo — resolução de conflito + pedir-ajuda-de-um-adulto
      (candidatos do Arco 18+).\"

compositionalRationale:
  pt: |
    Fio principal: conhecimento de mundo / desenvolvimento pessoal-
    social-emocional (PSED; FECHAMENTO da saturação canônica em 7/8
    → 8/8). Fio secundário: alfabetização inicial / fala-e-escuta
    (os 3 roteiros de linguagem social \"minha vez\" / \"sua vez\" /
    \"vamos compartilhar\" são trabalho de linguagem produtiva
    estruturado). Fio terciário: função cognitiva e executiva /
    memória-e-atenção (controle de impulsos + gratificação adiada +
    espera são operações executivas centrais que sustentam o
    esperar-a-vez).

    Significância arquitetural: este pacote FECHA o fio canônico
    PSED em 8/8 — alvo canônico final para o fio. Completa o
    tripé SEL do Arco 16: name-and-describe-feelings-detailed
    (Arco 16 Fase 1.2) + show-perspective-taking (Arco 16 Fase 1.3)
    + share-and-take-turns (Arco 17 Fase 1.1). O tripé constrói um
    arco de desenvolvimento completo: NOMEAR sentimentos complexos
    → COMPREENDER que os outros têm seus próprios sentimentos
    (tomada de perspectiva) → APLICAR comportamentalmente por meio
    de roteiros de esperar-a-vez + compartilhar. O fio PSED está
    agora totalmente saturado; a cobertura do domínio de
    conhecimento de mundo avança: 6 de 6 fios saturados
    (living-things + environment-and-weather + community-and-roles
    + time-and-routine + materials-and-properties + PSED).

    Relevância cultural pt-BR específica: as normas de esperar-a-vez
    + compartilhar variam entre culturas com divergência relevante
    para K-3 — tradições brasileiras de partilha-coletiva (refeições
    familiares de prato comum onde a comida é compartilhada de uma
    travessa comum sem porções individuais) contrastam com tradições
    de turno-individual de registros norte-europeus / norte-
    americanos. Esta variante pt-BR reconhece explicitamente
    \"algumas famílias compartilham comida de um prato grande; ambas
    as formas são justas\" — disciplina de afirmação cross-cultural
    preservada per §A.13.30 + per Arco 16 emotions-bundle pattern.
    Os roteiros pt-BR (\"minha vez\" / \"sua vez\" / \"vamos
    compartilhar\") adotam o registro pt-BR caloroso-relacional;
    professores podem adaptar para registros regionais brasileiros
    (\"a vez é minha\" / \"é a tua vez\" em algumas variantes
    regionais).

    Composição da classe SEL: 6 materiais per Arco 16 §A.13.6-firing-
    corrected disposição condicional de classe SEL. REMOVE
    matching-mat (a mecânica matching-mat é emparelhamento imagem-
    para-palavra que não se encaixa no trabalho SEL de cenário-
    resposta) + REMOVE vocabulary-tracing-strips (o trabalho
    comportamental SEL não se ancora primariamente em reforço de
    rastreamento de vocabulário; os roteiros são frases curtas de
    linguagem oral, não palavras de substrato de rastreamento).
    MANTÉM: flashcards (cartões de cenário) + picture-cards (imagens
    positivas de interação social) + sentence-strips (quadros i-feel
    + minha-vez + sua-vez de linguagem social) + manipulative-cut-
    outs (rastreador de esperar-a-vez) + parent-take-home-letter
    (ponte casa-escola SEL para o trabalho de compartilhar-e-esperar-
    a-vez que surge nas refeições familiares + brincadeiras + dinâmica
    de irmãos) + answer-key.

    Substrato Class B FLEXIBLE: compõe-se contra o tema emotions. O
    tripé do Arco 16 (name-and-describe-feelings + show-perspective-
    taking) usou o tema emotions; share-and-take-turns continua o
    tema para preservar a coerência do cluster cross-pacote.
    emotions-bundle torna-se o pacote-âncora SEL de 3 pacotes pós-
    Arco 17 Fase 1.1 (avanço da densidade de reutilização cross-
    bundle no fechamento Arco 17 P2).

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Identificar esperar-a-vez em uma imagem de cenário entre 4
        opções (esperando-a-vez / esperando-na-fila / compartilhando-
        dividido / não-esperando-a-vez) em 8 de 10 tentativas.
      - Nomear 3 frases de esperar-a-vez (\"minha vez\" / \"sua vez\"
        / \"vamos compartilhar\") produtivamente quando promovidas por
        pistas de cenário em 5 de 8 tentativas.
      - Demonstrar esperar-a-vez em 4 de 6 atividades de dupla
        observadas durante brincadeira livre (rubrica da professora
        ao longo da semana).
      - Autoadvocar \"minha vez\" sem conflito em 3 de 5 observações
        de brincadeira livre (métrica de aplicação de roteiro).

    Diferenciação:
      - Pré-K: conjunto de 2 roteiros (\"minha vez\" + \"sua vez\");
        modelagem receptiva primeiro (as crianças respondem a roteiros
        promovidos pela professora); linguagem produtiva surge como
        surge sem pressão.
      - Jardim de Infância: conjunto completo de 3 roteiros; uso
        produtivo de roteiros durante atividades em dupla; rubrica
        da professora em observações de brincadeira livre.
      - 1º ano em diante: expansão para des-escalada de conflito
        (\"podemos compartilhar?\" + \"posso ter uma vez em seguida?\"
        + \"por favor, posso?\") + pedir-ajuda-do-adulto quando o
        esperar-a-vez não dá certo (candidato do Arco 18+); ponte
        para normas de comunidade de aprendizes + trabalho de
        cultura-de-sala-de-aula.
