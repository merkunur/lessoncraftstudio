assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Use big/small correctly to describe 2-object pairs in 8 of 10
        trials.
      - Use bigger/smaller correctly in comparative context in 6 of 10
        trials.
      - Recognize size-vocabulary in target language receptively in 9 of
        10 trials.

    Differentiation:
    - Pre-K: big/small only (binary contrast); receptive comprehension
      target.
    - K: full big/small + bigger/smaller; productive use in object-
      comparison sentences.
    - Grade 1+: extend to biggest/smallest (superlative) + tall/short
      + long/short distinction (length-specific vs general size) +
      compare-by-length / compare-by-weight measurement transfers.

