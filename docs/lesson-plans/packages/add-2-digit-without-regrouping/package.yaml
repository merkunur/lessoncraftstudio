# Teaching package — add two-digit numbers without regrouping
# Arc 17 Phase 1.2 (math / addition-subtraction 9/14 → 10/14). Bridges Arc 12 add-within-20 → Arc 16 Phase 1.1 add-within-100 by isolating the no-carry case as conceptual stepping stone. Paired inverse companion: subtract-2-digit-without-regrouping (same arc phase).

targetSlug: add-2-digit-without-regrouping
language: en
title:
  en: "Adding Two-Digit Numbers Without Regrouping — column addition where ones don't carry"

description:
  en: "Grade 1 math package teaching two-digit addition where the ones digits sum to under 10 (problems like 23+45=68, 60+30=90, 14+25=39, 72+17=89). Builds on Arc 12 add-within-20 + Arc 15 tens-and-ones-1-to-20 / 21-50 / 51-100 place-value foundation. Conceptual stepping stone to Arc 16 add-within-100 (where regrouping is introduced) — this package isolates the two-digit addition mechanic in the no-carry case, so kids meet column-addition + place-value-aware addition WITHOUT also having to manage the regrouping move. Once the column-addition routine feels familiar (line up tens with tens, ones with ones, add each column), regrouping becomes an addition to a routine rather than a whole new procedure. Operand range 10–99; constraint: ones-of-A + ones-of-B < 10. Strategy diversity emphasized: column-add, decomposition (23+45 = 20+40 + 3+5 = 60+8 = 68), count-on, place-value-mat enactment. 5 worksheet exercises + 7 printable materials over a 1-week unit. Paired inverse: subtract-2-digit-without-regrouping (no-borrow companion)."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + place-value-aware addition introduction
      with no regrouping needed. Teacher displays 23+45 written
      vertically with tens-and-ones columns clearly marked.
      "Today we add BIGGER numbers — two-digit plus two-digit.
      Let's add 23 + 45. We add the ONES first: 3+5 = 8. Then
      the TENS: 2+4 = 6 tens = 60. Plus 8 ones = 68." Teacher
      repeats with 60+30 (ones: 0+0=0; tens: 6+3=9 tens = 90)
      and 14+25 (ones: 4+5=9; tens: 1+2=3 tens = 30; total 39).
      Pattern emphasis: "Line up the tens. Line up the ones. Add
      each column. The ones don't get crowded — they always fit
      under 10 today." Teacher contrasts briefly with a regrouping
      preview: "Tomorrow when we add 27 + 38, the ones will sum
      to 15 — and we'll have to REGROUP. But today, all our ones
      stay polite — under 10."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + base-ten manipulative routine. Each pair receives
      base-ten kits (ten-sticks + single-counters) + a worksheet
      with 6 no-regroup problems (23+45, 60+30, 14+25, 72+17,
      31+58, 46+22). Pair takes turns: kid A builds first number
      with manipulatives (place tens in tens column of place-
      value-mat, ones in ones column); kid B builds second number
      below; together they slide each column's pieces together,
      count tens and ones separately, write the answer. The mat's
      column structure makes the place-value invariant visible —
      tens never wander into the ones column and vice versa.
      Recast errors with column-cue ("you have 6 tens and 8 ones —
      that's sixty-eight, not six-tens-eight"). Strategy choices:
      kids may use manipulatives + place-value-mat, column-add
      written, decomposition, OR count-on; teacher accepts any
      strategy that produces correct answer + can be explained.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: addition worksheet (vertical
      format with no-regroup operands — column-add practice with
      no carry move). Station 2: math-worksheet (mixed no-regroup
      addition problems). Station 3: math-puzzle (missing-addend:
      23+?=68; ?+45=68 — kids work back from total to find missing
      addend). Station 4: more-less (compare two addition results:
      which sum is greater, 23+45 or 32+34?). Manipulative-cut-outs
      base-ten available at any station for kids who want concrete
      backup.
  closure:
    durationMinutes: 5
    body: |
      Whole-class no-regroup addition quiz. Teacher presents 5
      fast problems; class collectively answers + names the tens
      and ones results. "23+45? 60+30? 14+25? 72+17? 31+58?"
      Forward-pointer: "Today we added two-digit numbers when
      the ones stay under 10. When we come back, we'll meet
      ADD WITHIN 100 — same column-add routine, but now the
      ones sometimes sum to 10 or more and we'll learn to
      REGROUP (carry the extra ten over). And paired with
      today's work: SUBTRACT TWO-DIGIT NUMBERS WITHOUT
      BORROWING — same column structure, taking away instead
      of adding."

