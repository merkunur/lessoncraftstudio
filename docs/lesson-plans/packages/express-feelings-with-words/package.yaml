assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 6 of 8 basic feeling-words correctly when shown
        feeling-face in 7 of 10 trials.
      - Use sentence-frame "I feel ___ when ___" correctly in 6
        of 10 trials.
      - Match scenario to most-likely feeling in 7 of 10 trials.
      - Identify own current feeling using 4+ feeling-words
        accurately in self-check.

    Differentiation:
    - Pre-K: 4 basic feelings only (happy, sad, angry, scared);
      receptive vocabulary.
    - K: 6-8 feelings with sentence-frame.
    - Grade 1+: extend to nuanced feelings + emotion-regulation
      strategies + bridge to conflict-resolution + empathy work.

