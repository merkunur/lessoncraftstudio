# Teaching package — recognize numerals 1 to 20
# Arc 15 Phase 1 (math / numeral-recognition foundation; first numeral-recognition package).

targetSlug: recognize-numerals-1-to-20
language: en
title:
  en: "Numerals 1-20 — recognizing written numbers"
description:
  en: "Pre-K / Kindergarten math package teaching kids to RECOGNIZE written numerals 1-20 — match each numeral symbol to its corresponding quantity. Builds on Arc 9-12 count-objects-1-to-10 + count-objects-1-to-20 + match-numeral-to-quantity-1-to-10 numeracy foundation. Extends numeral-recognition strand by introducing the full 1-20 written-numeral set. Foundational numeral-recognition package — first in the numeral-recognition strand. Critical bridge from counting-by-saying (oral counting) to reading-written-numerals (visual recognition). Foundation for later place-value work + arithmetic involving written notation. Note: this package focuses on RECOGNITION (visual identification + quantity-match); writing-numerals is downstream work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + numeral-recognition introduction. Teacher
      displays a number line 1-20 with both numerals + dot-
      representations: "1 (1 dot), 2 (2 dots), 3 (3 dots) ...
      20 (20 dots in a grid)." Class points to each numeral as
      teacher names it. "Find the 5! Find the 12! Find the 18!"
      Kids point to corresponding numerals. Visual + tactile
      anchor for numeral-quantity matching. Teacher emphasizes
      teens-numerals (11-19) which are visually-distinct in
      en-written form (eleven through nineteen — locale-specific
      irregularities).
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + numeral-recognition routine. Each pair receives
      20 picture cards: 10 numerals (random subset from 1-20) +
      10 dot-arrangement cards (matching quantities). Pair takes
      turns: kid A flips a numeral card; kid B flips a dot card;
      check if they match in quantity. Recast errors with counting
      anchor ("you have 5 dots and the numeral 7 — those don't
      match. Let's count again — 5 dots are five, the numeral
      for 5 is 5, not 7."). Differentiate by range — Pre-K kids
      work 1-10 only; K kids work 1-20.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (numeral
      to quantity-representation: 14 ↔ 14 dots). Station 2:
      pattern-train worksheet (sequence numerals in increasing
      order: 5, 6, 7, 8 ... fill in missing). Station 3:
      missing-pieces worksheet (number sequence with one missing
      numeral — kid identifies which numeral is missing). Station
      4: vocabulary-tracing-strips for number words (one, two,
      three ... twenty) — connects spoken-name + written-numeral.
  closure:
    durationMinutes: 5
    body: |
      Whole-class numeral-quiz. Teacher displays numerals; class
      collectively reads each. "Number 6! Number 14! Number 17!"
      Forward-pointer: "Today we recognized numerals 1-20. When
      we come back next, we can recognize numerals 1-100 + start
      WRITING numerals on our own with proper formation!"

