thematicCoherence:
  en: |
    All 5 packages cohere around the bakery theme + form a cross-strand
    progression from food-vocabulary through counting + comparison +
    sorting to sensory-property exploration.

    **Pedagogical sequencing:**
    1. **identify-and-name-foods** — Foundational baked-goods vocabulary
       (bread, cake, cookies, donuts, muffins, croissants, pastries,
       pie). Same shared package with breakfast-bundle + at-the-supermarket-
       bundle. Bakery-context narrows food-vocabulary to baked subset;
       supports specialized contexts.
    2. **count-objects-1-to-10** — Counting practice using bakery items
       as countable subjects (3 cupcakes in the case; 5 cookies on a
       plate; 2 loaves of bread; 8 donuts in a dozen-box). Same shared
       package across many bundles; bakery-context authentic real-
       world transactional counting.
    3. **compare-quantities-more-fewer** — Comparison work using
       bakery contexts (more cookies than donuts?; fewer muffins than
       cupcakes?; equal croissants and bagels?). Same shared package
       with breakfast + at-the-supermarket bundles.
    4. **sort-by-category** — Category-classification work distinguishing
       sweet baked goods (cookies, cakes, donuts) vs savory baked goods
       (bread, bagels, savory scones) OR sorting by flour-type
       (wheat vs corn vs gluten-free). Connects sorting strand to
       practical real-world classification.
    5. **describe-physical-properties-of-objects** — Sensory-property
       work using bakery items (soft white bread vs crispy crust;
       sweet pastry vs savory roll; warm fresh donut vs cool day-old
       cookie). From Arc 15 Phase 4. Bakery-context particularly
       sensory-rich — perfect substrate for property-vocabulary work.

    **Strand spread:** 1 vocabulary-acquisition (foods) + 1 numeracy
    + 1 comparison + 1 cognitive-sorting + 1 materials-and-properties.
    **5 distinct strands.** Cross-strand daily-life cluster bundle
    parallel to breakfast-bundle (4-strand daily-life) but extending
    to materials-and-properties strand via sensory-rich substrate.

    **Suggested unit duration:** 4-5 weeks (1 package per week).
    Natural fit alongside family-recipe sharing; particularly load-
    bearing during holiday-baking seasons (winter holidays; Easter
    bread traditions). Field-trip extension to local bakery is
    ideal classroom-experience anchor.

    **Multilingual classroom relevance:** bakery vocabulary cognate-
    rich Romance (panadería / boulangerie / panetteria / padaria);
    Germanic distinct (Bäckerei / bakkerij / bageri / leipomo). Bread-
    type vocabulary highly culturally specific (baguette / Brötchen /
    pita / tortilla / pan-de-muerto / hot-cross-bun). Particularly
    load-bearing for international school + dual-language program
    contexts where kids' families bring diverse bread + baking
    traditions enriching classroom discussion.

    **Pillar 2 architectural pattern:** bakery-bundle exemplifies
    sensory-rich daily-life bundle composition. Theme-axis-key daily-
    life-bakery (vs breakfast-bundle at meal-context; vs at-the-supermarket-
    bundle at general-shopping context). Distinguishes from sibling
    daily-life bundles via materials-and-properties strand inclusion —
    bakery's tactile + olfactory + gustatory richness supports
    property-vocabulary work better than meal-bundle or supermarket-
    bundle anchors. Precedent for similarly sensory-rich daily-life
    bundles (cooking-bundle / restaurant-bundle / picnic-bundle candidates).
