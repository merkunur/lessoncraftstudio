# Teaching package — partition shapes into halves and quarters
# Arc 18 Phase 1.1 (geometry 7/8; paired with identify-fractions-half-third-quarter at slot 4 — together they saturate the geometry strand 8/8). Builds on Arc 17 P1.3 compose-shapes-from-parts (part-whole reasoning established) + Arc 9 identify-2d-shapes-basic (shape recognition prerequisite).

targetSlug: partition-shape-halves-quarters
language: en
title:
  en: "Partition Shapes into Halves and Quarters — cutting a shape into equal parts"

description:
  en: "Grade 1 math + geometry package teaching kids to PARTITION simple 2D shapes (circles, squares, rectangles) into 2 equal parts (HALVES) or 4 equal parts (QUARTERS/FOURTHS). Builds on Arc 17 P1.3 compose-shapes-from-parts (where kids learned that shapes have part-whole structure) by reversing the action: partition is decomposition with the CONSTRAINT OF EQUAL PARTS. Critical insight: kids learn the difference between cutting a shape into ANY pieces (composition's flexible reverse) vs cutting it into EQUAL pieces (partition's strict reverse). Equal parts give the parts a NAME — two equal parts are HALVES; four equal parts are QUARTERS or FOURTHS. Per §A.13.30 K-foundational-informal framing: K-1 partition work introduces equal-share VOCABULARY + the visual structure of partitioned shapes; formal 1/2 + 1/4 fraction notation is Grade 3+ (CCSS.3.NF.A) and explicitly out of scope. CCSS.1.G.A.3 primary anchor ('partition circles and rectangles into two and four equal shares, describe the shares using the words halves, fourths, and quarters'). Pair partner: identify-fractions-half-third-quarter (slot 4 of Phase 1.1; extends the named-equal-parts work to also include THIRDS at the Grade 2 level per CCSS.2.G.A.3). Together the pair saturates the geometry strand 8/8 — the 23rd saturated strand in the catalog. 5 worksheet exercises + 7 printable materials over a 1-week unit. Manipulative-cut-outs with vocabKey-enumerated fraction-piece shapes is the load-bearing material — kids physically arrange whole shapes alongside their partitioned forms to internalize the equal-parts visual structure."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + partition introduction with paper
      shapes. Teacher holds up a paper circle. "Watch what
      happens when I cut this circle into TWO equal pieces."
      Teacher folds the circle exactly in half + cuts along
      the fold. "Two equal pieces. Each piece is a HALF of
      the whole circle. Two halves make one whole." Teacher
      holds up the two halves + matches them back together.
      Class chants: "Two halves make a whole!" Then with a
      square: teacher folds the square once + cuts (two
      rectangles — two HALVES of the square); then folds it
      again perpendicular + cuts both halves (four small
      squares — four QUARTERS or FOURTHS of the original
      square). "Four equal pieces. Each piece is a QUARTER
      of the whole square. We can also say FOURTH — quarter
      and fourth mean the same thing. Four quarters make
      one whole." Pattern emphasis: "When we cut a shape
      into EQUAL pieces, the pieces have NAMES. Two equal
      pieces are HALVES. Four equal pieces are QUARTERS.
      Unequal pieces don't get those names — they're just
      pieces."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + partition routine with paper shape pieces.
      Each pair receives a bag of whole shapes (circles,
      squares, rectangles in 3 sizes each) + the matching
      partitioned versions (halves of each shape; quarters
      of each shape). Pair plays the matching challenge:
      teacher names a partition (e.g., "show me halves of
      a circle"); kids find the two half-circle pieces +
      arrange them back into the whole circle shape. Then
      "show me quarters of a square" + kids arrange four
      small squares into the original square shape. Recast
      errors by demonstrating: "These two pieces are
      DIFFERENT SIZES — they're not halves. Halves have to
      be EQUAL. Let me show you the equal pieces." Free
      time at end: kids match wholes with their partitioned
      forms across all shapes in the bag. The hands-on
      reassembly is load-bearing — kids see that the parts
      ARE the whole (just cut up) by physically putting them
      back together. The cut-out manipulatives with vocabKey-
      enumerated fraction-pieces (whole-circle, half-circle,
      quarter-circle, whole-square, half-square, quarter-
      square, whole-rectangle, half-rectangle, quarter-
      rectangle) are exactly the inventory kids need.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity — match
      each partitioned shape (a circle cut into two halves;
      a square cut into four quarters; etc.) to its whole
      shape counterpart. Station 2: missing-pieces activity
      — kids see a partial partition (one half-circle drawn;
      one half missing) + identify which piece completes the
      whole. Station 3: grid-match activity — kids fit
      partitioned pieces into a grid layout to reconstruct
      the whole shape. Station 4: picture-sort activity —
      sort partitioned shapes into 'cut into halves' vs
      'cut into quarters' categories. The picture-sort at
      station 4 surfaces the equal-parts-counting structure
      (halves = 2; quarters = 4).
  closure:
    durationMinutes: 5
    body: |
      Whole-class partition quick-recall. Teacher displays
      shapes on the board; class chorally names the
      partition. "Circle cut into two equal pieces — halves!
      Square cut into four equal pieces — quarters! Rectangle
      cut into two equal pieces — halves! Square cut into
      two equal pieces — halves!" Teacher asks the
      diagnostic: "What if I cut a shape into TWO pieces
      that aren't equal — are those halves?" (Class: No!
      They're just pieces. Halves have to be equal.)
      Forward-pointer: "Today we partitioned shapes into
      halves and quarters — equal pieces with names. Next,
      we'll learn what to call those equal pieces when we
      see them ALONE (without seeing the cutting happen) +
      meet a new equal-pieces name: THIRDS (three equal
      pieces). Later in school, halves and quarters and
      thirds will become FRACTIONS — written with numbers.
      For now, the names + the visual structure are what
      we're learning."

