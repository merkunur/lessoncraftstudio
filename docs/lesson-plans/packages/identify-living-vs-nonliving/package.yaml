# Teaching package — identify living things vs non-living things
# Arc 11 Phase 1 (Path B; world-knowledge / living-things strand
# deepening 3/6 → 4/6). Foundational science distinction: kids classify
# things as living (plants, animals, humans) or non-living (rocks,
# vehicles, furniture, water).

targetSlug: identify-living-vs-nonliving
language: en
title:
  en: "Living or Not? — sort things into living and non-living"
description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching the living-vs-nonliving distinction. Builds on Arc 5 classify-animals-by-diet + classify-animals-by-habitat + Arc 10 describe-plant-life-cycle. Foundational science classification: kids identify which things are LIVING (plants, animals, humans — they grow, eat/breathe, reproduce) vs NON-LIVING (rocks, vehicles, furniture, water — they don't grow, don't eat). Develops scientific-classification reasoning + biology vocabulary. Vocab-anchored — living + non-living examples. Composes against picture-sort + odd-one-out apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class living-vs-nonliving routine. Teacher displays pairs
      of objects: a tree + a chair. "Which one is LIVING?" Class
      identifies the tree. "Why?" Discussion: trees grow, drink water
      from soil, make leaves. "What about the chair?" Class: "Not
      living — it doesn't grow, doesn't drink water." Repeat with
      4-5 pairs (cat vs car; flower vs rock; person vs lamp).
      Reinforces the LIVING criteria: grow + eat/breathe + reproduce.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sort routine. Each pair receives 12-16 picture cards
      (mix of living + non-living items). Pair sorts cards into 2
      piles: LIVING + NON-LIVING. Recast errors with explanation
      ("you put the doll in living — let's check: does the doll
      grow? No. Does the doll eat? No. The doll LOOKS like a person
      but isn't living. People are living; their representations
      (dolls, statues, paintings) are not"). Optional extension: kids
      describe their LIVING category by listing 3 things all living
      things do.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (kids sort
      pictures into living vs non-living categories). Station 2:
      odd-one-out worksheet (one non-living item among 4 living, or
      vice versa). Station 3: manipulative cut-outs hands-on
      classification (kids assemble living-thing displays + non-
      living-thing displays). Station 4: matching worksheet (image-
      name pairs reinforce vocabulary).
  closure:
    durationMinutes: 5
    body: |
      Whole-class sort-recall. Teacher displays 6-8 mixed items; class
      collectively classifies each as living or non-living + names
      a reason. Forward-pointer: "Today we learned what LIVING means.
      When we come back to living things next, we'll learn the parts
      of a PLANT — root, stem, leaf, flower — and how each part helps
      the plant LIVE."

