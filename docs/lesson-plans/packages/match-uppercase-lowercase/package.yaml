assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Pair 22 of 26 uppercase letters with their lowercase pairs in
        8 of 10 trials.
      - Distinguish visually-similar case-pairs (Cc, Oo, Ss, Pp, Vv) +
        visually-distinct case-pairs (Aa, Ee, Gg, Rr) in 7 of 10
        trials.
      - Articulate the same-letter principle ('A and a are the same
        letter, just different sizes') in 6 of 10 trials.

    Differentiation:
    - Pre-K: 13 most-frequent letter-pairs; teacher demonstrates
      pairing.
    - K: all 26 case-pairs; independent matching.
    - Grade 1+: bridge to letter-sound work (identify-letter-sounds-
      consonants + identify-letter-sounds-vowels Arc 13+ candidates).

