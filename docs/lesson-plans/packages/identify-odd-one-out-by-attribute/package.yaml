assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the odd one out in 4-item attribute-contrast sets in 8
        of 10 trials.
      - Articulate the attribute reasoning ("the others are X; this one
        is Y") in 6 of 10 trials.
      - Name the attribute dimension (color/shape/size) in 7 of 10
        trials.

    Differentiation:
    - Pre-K: 3-item sets with strong single-attribute contrast (e.g., 2
      red + 1 blue; all same shape and size).
    - K: 4-item sets across the 3 attribute dimensions independently.
    - Grade 1+: 4-5-item sets with subtler attribute differences; bridge
      to sort-by-multiple-attributes (Arc 8 Phase 1 sibling) where 2
      attributes change simultaneously.

