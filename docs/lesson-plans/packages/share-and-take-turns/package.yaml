# Teaching package — share with peers and take turns
# Arc 17 Phase 1.1 (world-knowledge / personal-social-emotional-development
# strand SAT close: 7/8 → 8/8). Final canonical fill for the PSED strand.
# Completes the Arc 16 SEL triad-pair (name-and-describe-feelings-detailed
# builds emotion-vocabulary substrate; show-perspective-taking builds
# awareness-of-others; share-and-take-turns is the BEHAVIORAL APPLICATION of
# perspective-taking via concrete prosocial-skills work).

targetSlug: share-and-take-turns
language: en
title:
  en: "Share and Take Turns — prosocial skills for cooperative play"

description:
  en: "Kindergarten / Grade 1 social-emotional package teaching turn-taking + sharing as concrete prosocial behaviors. Foundation skill: kids learn the social-language scripts (\"my turn\" / \"your turn\" / \"we can share\"), the situational cues that trigger turn-taking (one toy + two kids; one swing + a line; one snack-pack + a friend), and the impulse-control work required to wait while another peer takes their turn. SAT-CLOSING package: completes PSED canonical strand at 8/8. Builds on Arc 16 SEL triad-pair: name-and-describe-feelings-detailed (kids name what they feel when waiting is hard — frustrated, jealous, impatient) + show-perspective-taking (kids imagine how the other kid feels when getting their turn). Turn-taking is the BEHAVIORAL OUTPUT of those two cognitive-emotional substrates. Critical K-3 prosocial-skills work; foundation for conflict-resolution + collaboration + community-of-learners norms. 5 worksheet exercises + 6 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class scenario-recognition hook. Teacher displays a
      picture of two kids reaching for the same toy. \"What's
      happening here? Both kids want the toy. What can they do?\"
      Class brainstorms: take turns, share, ask politely. Teacher
      introduces 3 social-language scripts: \"my turn\" (claim a
      turn fairly), \"your turn\" (offer a turn to a peer), \"we
      can share\" (use the item together when possible). Teacher
      then displays 2 more scenarios: 5 kids in line for the slide
      (turn-taking by queue) and a snack-pack with 6 crackers
      shared among 3 kids (sharing by dividing). Pattern emphasis:
      \"Turn-taking and sharing use WORDS to solve fairness problems
      without anyone getting hurt or sad.\"

  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + turn-taking practice routine. Each pair receives
      1 shared toy or game-board piece (intentional 1-item-for-2-
      kids constraint). Pair practices the turn-taking script: kid
      A says \"my turn,\" plays for 30 seconds, says \"your turn,\"
      passes to kid B; kid B plays for 30 seconds, says \"your
      turn,\" passes back. Teacher circulates + recasts errors with
      script-modeling (\"I see you grabbed it back — try saying
      'I want my turn now, please' instead\"). Optional extension:
      kids dramatize a sharing-without-taking-turns scenario (e.g.,
      kid A draws on one half of a paper; kid B draws on the other
      half; they share the page without sequential turns).
      Discussion: when does turn-taking work vs when does sharing-
      together work? (One toy = take turns; a snack with many
      pieces = share by dividing; a big drawing paper = share by
      using different parts.)

  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (kids
      sort scenario pictures into \"taking turns\" vs \"not taking
      turns\" buckets — e.g., kid waiting in line for swing GOES IN
      taking-turns; kid grabbing toy from peer GOES IN not-taking-
      turns). Station 2: matching worksheet (scenario picture →
      appropriate social-language response: 5 kids in line ↔ \"we
      wait our turn\"; one toy 2 kids ↔ \"let's take turns\";
      6 crackers 3 kids ↔ \"we can share\"). Station 3: math-
      worksheet (counting context — how many turns each kid gets
      if 6 turns total + 3 kids = 2 each; how many crackers each
      if 6 crackers + 3 kids = 2 each; counting as fairness
      reasoning). Station 4: manipulative cut-outs (kids assemble
      a turn-taking-tracker cardstrip: kid-name square + 5 turn
      checkboxes; cross off each turn as taken; visual fairness
      tracker for free-play time).

  closure:
    durationMinutes: 5
    body: |
      Whole-class turn-taking pledge. Class collectively names the
      3 social-language scripts (\"my turn\" / \"your turn\" / \"we
      can share\") and identifies 2 classroom situations from the
      week where each script applied. Teacher closes with: \"This
      week we learned the WORDS for fair turn-taking and sharing.
      When you feel impatient or jealous or upset that it's not
      your turn yet — remember the feelings work we did with
      name-and-describe-feelings-detailed and the perspective-
      taking work we did with show-perspective-taking. The other
      kid feels happy when it IS their turn, just like you feel
      happy when it's yours.\" Forward-pointer: \"When we come
      back to social skills next, we'll learn what to do when
      turn-taking breaks down — conflict resolution + asking-an-
      adult-for-help (Arc 18+ candidates).\"

