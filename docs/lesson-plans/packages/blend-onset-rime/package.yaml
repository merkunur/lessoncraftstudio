compositionalRationale:
  en: |
    Primary strand: early-literacy / phonological-awareness
    (blend-onset-rime — strand 7/9 → 8/9). Pair-coherent with
    Phase 1.3 Slot 2 segment-cvc-into-phonemes (phonological-
    awareness SAT-closing pair). Per §A.13.31 per-instance
    content-awareness: `isolate-initial-phoneme/package.yaml`
    (Phase 1.1 Slot 3) + `blend-phonemes-cvc/package.yaml`
    (Phase 1.2 Slot 4) + `identify-rhyming-pairs/package.yaml`
    (Arc 10 P1) + `count-syllables-1-to-3/package.yaml` (Arc
    10 P1) are the canonical phonological-awareness cluster
    precedents — this package mirrors their Literacy 8-material
    + composedExercises shape with onset-rime-specific
    pedagogical adaptation.

    Architectural significance: ships the MID-GRAIN phonological
    synthesis level between syllable-blending + full phoneme-
    blending. Cognitive progression: syllable-blending (Arc 10
    count-syllables-1-to-3; word-level chunking) → onset-rime
    blending (this package; intra-syllable but chunked rime) →
    full phoneme-blending (Phase 1.2 Slot 4; fully decomposed
    phonemes). Onset-rime is the canonical scaffold-step:
    kids who struggle with full phoneme-blending often
    succeed at onset-rime because the rime is chunked. This
    package + Phase 1.2 Slot 4 together complete the K
    phonological-synthesis pedagogy across all granularities.

    Per §A.13.30 K-1 informal framing: K onset-rime work is
    CONCRETE SOUND-CHUNK-BLENDING via the slot-and-chunk
    metaphor (onset slides into rime slot). The pedagogy uses
    everyday language ('onset' / 'rime' explicitly named as
    pedagogical vocabulary; 'starting sound' / 'ending chunk'
    as accessible alternatives) + body-movement scaffolding
    (one fist for onset + one for rime; clap when blending).
    NOT formal syllable-structure theory pedagogy — sonority
    hierarchy + maximal-onset principle + phonological
    feature geometry are post-Grade-3 academic work. Critical
    pedagogical move documented in contentActivity: START
    SLOW + SPEED UP progression. Audible separation between
    onset + rime initially; progressive gap reduction until
    they touch + the word emerges. Word-family generation
    surfaces rhyme-family awareness as natural cross-skill
    bridge.

    Per §A.13.29 ground-truth source-citation: composedExercises
    cite `REFERENCE APPS/word-guess.html` (clue-density mode
    for onset-letter-filling given rime cue) + `REFERENCE
    APPS/matching.html` (imgname mode for onset-letter to
    word-family rime pairing) + `REFERENCE APPS/picture-sort.html`
    (theme mode for word-family categorization by shared
    rime) + `REFERENCE APPS/word-scramble.html` (unified mode
    for sound-letter-mapping at onset+rime structural level).

    Cross-reference to count-syllables-1-to-3 (Arc 10 P1;
    prerequisite per learning-targets.json line 36): kids
    must master syllable-level chunking before sub-syllabic
    chunking (onset-rime). The skill progression is
    pedagogically natural: hear word → count syllables
    (word-level) → split syllable into onset + rime (sub-
    syllabic) → split rime into individual phonemes (Phase
    1.2 Slot 4 + Phase 1.3 Slot 2). Each grain-level finer
    than the prior.

    Cross-reference to identify-rhyming-pairs + produce-
    rhyming-words (Arc 10 P1 + Phase 1.1 Slot 4): word-family
    work (cat/hat/bat/mat share /at/ rime) surfaces rhyme
    awareness from a different angle. Rhyme-aware kids
    notice that 'cat' + 'hat' rhyme; onset-rime-aware kids
    notice that 'cat' + 'hat' share the /at/ rime + differ
    only in onset. Same observation, different pedagogical
    framing. This package operationalizes the connection
    explicitly via word-family generation activity.

    Cross-reference to blend-phonemes-cvc (Phase 1.2 Slot 4)
    + segment-cvc-into-phonemes (Phase 1.3 Slot 2 — pair-
    coherent SAT-closing): onset-rime is the mid-grain
    between full-syllable + full-phoneme work. Synthesis
    progression: blend-phonemes-cvc (/c/+/a/+/t/ → cat;
    fully decomposed) → blend-onset-rime (/c/+/at/ → cat;
    chunked rime). Both are synthesis operations; both
    operate at sub-syllabic granularity; they differ only
    in chunking-depth of the post-onset material. Pair-
    coherent ship of Slots 1+2 (this package + segment-cvc-
    into-phonemes) closes the phonological-awareness strand
    + completes the synthesis+analysis pair across all
    granularities.

    Materials note: 8-material Literacy class stack per
    §A.13.37 + Phase 1.1+1.2 phonological-awareness cluster
    canonical precedents. Materials structure mirrors
    isolate-initial-phoneme + blend-phonemes-cvc + other
    cluster siblings (theme: animals provides familiar K-1
    CVC vocabulary that decomposes cleanly into onset + rime:
    cat = /c/+/at/; dog = /d/+/og/; pig = /p/+/ig/; hen =
    /h/+/en/; bat = /b/+/at/; fox = /f/+/ox/). Manipulative-
    cut-outs at position 6 emits canonical-correct `mode:
    single-repeat` per §A.13.35.

    Distinctive composition: word-guess at position 1
    (introduction) — the missing-letter format naturally
    surfaces the onset-position work (kid sees _AT + picture
    cue, blends onset+rime to identify word). Matching ×2
    (positions 2+5) + picture-sort (position 3; word-family
    grouping by shared rime) + word-scramble (position 4).
    Word-guess at position 1 distinguishes this composition
    from the isolation-cluster siblings (which used matching
    at position 1) — onset-rime synthesis benefits from word-
    guess's incomplete-letter affordance because the missing
    onset forces kids to recognize the rime + supply the
    correct starting sound.

    Class B FLEXIBLE substrate: composes against animals
    theme (vocab-anchored with familiar K-1 CVC vocabulary;
    cross-arc theme consistency with Phase 1.1+1.2 cluster).
    No substrate gaps; ships clean.

    K-3 multilingual classroom relevance: onset-rime is
    universal K early-literacy content BUT syllable structure
    differs across languages. English allows CVC syllables
    (cat = onset /c/ + rime /at/); pt-BR favors CV open
    syllables (gato = ga+to; each syllable is onset + vowel,
    no closing consonant typically). Languages with rich
    onset clusters (English /str/, German /sp/, /st/, /sk/)
    have more complex onset-rime decomposition than
    languages with simpler onset structure. The cognitive
    operation (sub-syllabic chunking) is universal; the
    canonical chunking patterns are per-locale.

