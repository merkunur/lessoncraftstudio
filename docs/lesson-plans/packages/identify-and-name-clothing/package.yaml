compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (target identify-and-name-clothing).
    Secondary strand: phonics / letter recognition (matching letter mode).
    Tertiary strand: categorization (odd-one-out + picture-sort + carpet sorting
    by season at scaffold station 2). Mirrors Arc 1 farm-animals 3-strand integration.

curriculumStandards:
  - EYFS.ELG.UW
  - IB-PYP.WhereWeAre

assessmentCriteria:
  en: |
    Receptive 10/10 (point to named clothing on body or picture); productive 8/10
    (name from picture); frame use 6/10 ("I see a {item}").

    Differentiation:
    - Pre-K: receptive only; touch matching clothing on own body.
    - K / Grade 1: full productive + sentence-frame use.
    - Grade 2+: extend to weather-clothing pairing ("It is cold. I wear a coat.").

