thematicCoherence:
  en: |
    All 5 packages cohere around the colors theme + form a pedagogical
    progression from receptive identification through productive
    naming to multi-dimensional classification.

    **Pedagogical sequencing:**
    1. **point-to-named-color** — Receptive color vocabulary. Foundational
       starting point: kid hears "point to the red" + identifies red
       among displayed colors. Receptive-before-productive language-
       development pattern.
    2. **use-color-words** — Productive color vocabulary. Kids name
       colors they see + use color words in describing objects ("the
       RED apple"). Bridges receptive identification to productive use.
    3. **sort-by-color** — Single-attribute sorting using color as the
       discrimination axis. Cognitive classification work using
       established color vocabulary.
    4. **sort-by-multiple-attributes** — Multi-dimensional sorting where
       color is one of multiple sort axes (color + shape, color + size).
       Extends sorting work to higher cognitive complexity.
    5. **identify-odd-one-out-by-attribute** — Reasoning task using
       color (and other attributes) as the discriminating dimension.
       "Three red items + one blue item — which is the odd one out?"
       Top-of-bundle cognitive challenge.

    **Strand spread:** 2 vocabulary-acquisition + 2 cognitive-sorting
    + 1 reasoning. Tight strand-coherence within bundle.

    **Suggested unit duration:** 4-5 weeks. 1 package per week with
    flexibility for review-week.

    **Multilingual classroom relevance:** color vocabulary is cognate-
    accessible across most of the 11 platform locales (rojo / rouge /
    red / rot — Romance + Germanic share roots), making it an
    excellent early-vocabulary entry point for dual-language and
    immersion programs. Bundle supports cross-locale lesson-plan
    delivery.

    **Pillar 2 architectural pattern:** colors-bundle exemplifies
    tight-strand bundle composition — all 5 packages share strong
    pedagogical kinship through the colors theme + 2-strand
    concentration (vocabulary + cognitive-sorting). Contrasts with
    fruits-bundle's deliberate 4-strand spread; both patterns are
    valid bundle architectures.
