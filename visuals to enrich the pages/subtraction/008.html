<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Subtraktion Arbeitsbl&auml;tter - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #B2EBF2 0%, #4DD0E1 12%, #0097A7 30%, #00695C 55%, #1B5E20 75%, #0D1B2A 100%); overflow: hidden;">

        <!-- Underwater light rays -->
        <div style="position: absolute; top: -50px; left: 200px; width: 120px; height: 600px; background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 100%); transform: rotate(8deg);"></div>
        <div style="position: absolute; top: -50px; left: 450px; width: 80px; height: 500px; background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%); transform: rotate(-3deg);"></div>
        <div style="position: absolute; top: -50px; right: 250px; width: 100px; height: 550px; background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 100%); transform: rotate(5deg);"></div>

        <!-- Ocean bubble dots -->
        <div style="position: absolute; top: 100px; left: 80px; width: 10px; height: 10px; background: rgba(255,255,255,0.25); border-radius: 50%;"></div>
        <div style="position: absolute; top: 160px; left: 120px; width: 6px; height: 6px; background: rgba(255,255,255,0.2); border-radius: 50%;"></div>
        <div style="position: absolute; top: 250px; right: 100px; width: 8px; height: 8px; background: rgba(255,255,255,0.18); border-radius: 50%;"></div>
        <div style="position: absolute; top: 380px; left: 60px; width: 12px; height: 12px; background: rgba(255,255,255,0.15); border-radius: 50%;"></div>
        <div style="position: absolute; top: 500px; right: 80px; width: 7px; height: 7px; background: rgba(255,255,255,0.12); border-radius: 50%;"></div>
        <div style="position: absolute; top: 620px; left: 150px; width: 9px; height: 9px; background: rgba(255,255,255,0.1); border-radius: 50%;"></div>
        <div style="position: absolute; top: 700px; right: 130px; width: 5px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 50%;"></div>
        <div style="position: absolute; top: 450px; left: 200px; width: 6px; height: 6px; background: rgba(255,255,255,0.13); border-radius: 50%;"></div>

        <!-- Vertical depth gradient line (left side) -->
        <div style="position: absolute; top: 100px; left: 45px; width: 4px; height: 750px; background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.15) 33%, rgba(255,255,255,0.08) 66%, rgba(255,255,255,0.03) 100%); border-radius: 2px;"></div>
        <!-- Depth markers on the line -->
        <div style="position: absolute; top: 98px; left: 38px; width: 18px; height: 2px; background: rgba(255,255,255,0.3); border-radius: 1px;"></div>
        <div style="position: absolute; top: 390px; left: 38px; width: 18px; height: 2px; background: rgba(255,255,255,0.15); border-radius: 1px;"></div>
        <div style="position: absolute; top: 660px; left: 38px; width: 18px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 1px;"></div>

        <!-- Title at surface -->
        <div style="position: absolute; top: 22px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; color: #01579B; margin: 0; text-shadow: 2px 2px 0 rgba(255,255,255,0.4);">SUBTRAKTION</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; color: #006064; margin: 2px 0 0 0; text-shadow: 1px 1px 0 rgba(255,255,255,0.3);">3 Schwierigkeitsstufen</h2>
        </div>

        <!-- Floating number bubbles -->
        <div style="position: absolute; top: 145px; right: 75px; width: 48px; height: 48px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.3);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">3</span>
        </div>
        <div style="position: absolute; top: 420px; left: 85px; width: 44px; height: 44px; background: rgba(255,255,255,0.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.18);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: rgba(255,255,255,0.8);">7</span>
        </div>
        <div style="position: absolute; top: 680px; right: 65px; width: 40px; height: 40px; background: rgba(255,255,255,0.06); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.1);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: rgba(255,255,255,0.5);">15</span>
        </div>

        <!-- Level 1: EINSTEIGER (surface - top left) -->
        <div style="position: absolute; top: 115px; left: 90px; z-index: 20;">
            <div style="display: flex; align-items: center; gap: 18px;">
                <!-- Level badge -->
                <div style="text-align: center;">
                    <div style="width: 70px; height: 70px; background: linear-gradient(145deg, #2E7D32, #43A047); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(46,125,50,0.4); border: 3px solid rgba(255,255,255,0.5);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white;">1</span>
                    </div>
                    <div style="margin-top: 6px; background: #2E7D32; padding: 4px 14px; border-radius: 12px;">
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 11px; color: white; letter-spacing: 1px;">EINSTEIGER</span>
                    </div>
                </div>
                <!-- Worksheet -->
                <div style="width: 155px; height: 200px; background: white; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,0.2), 0 0 0 3px #66BB6A; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Einsteiger Arbeitsblatt">
                </div>
                <!-- Range label -->
                <div style="background: rgba(255,255,255,0.85); padding: 8px 16px; border-radius: 20px; box-shadow: 0 3px 10px rgba(0,0,0,0.1);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: #2E7D32;">1 - 5</span>
                </div>
            </div>
        </div>

        <!-- Level 2: ENTDECKER (mid-depth - center) -->
        <div style="position: absolute; top: 380px; left: 50%; transform: translateX(-50%); z-index: 20;">
            <div style="display: flex; align-items: center; gap: 18px;">
                <!-- Range label -->
                <div style="background: rgba(255,255,255,0.6); padding: 8px 16px; border-radius: 20px; box-shadow: 0 3px 10px rgba(0,0,0,0.12);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: #FF8F00;">1 - 10</span>
                </div>
                <!-- Worksheet -->
                <div style="width: 175px; height: 226px; background: white; border-radius: 10px; box-shadow: 0 10px 34px rgba(0,0,0,0.25), 0 0 0 3px #FFB74D; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Entdecker Arbeitsblatt">
                </div>
                <!-- Level badge -->
                <div style="text-align: center;">
                    <div style="width: 70px; height: 70px; background: linear-gradient(145deg, #FF8F00, #FFA000); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(255,143,0,0.4); border: 3px solid rgba(255,255,255,0.4);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white;">2</span>
                    </div>
                    <div style="margin-top: 6px; background: #FF8F00; padding: 4px 14px; border-radius: 12px;">
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 11px; color: white; letter-spacing: 1px;">ENTDECKER</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Level 3: PROFI (deep - bottom right) -->
        <div style="position: absolute; top: 640px; right: 90px; z-index: 20;">
            <div style="display: flex; align-items: center; gap: 18px;">
                <!-- Level badge -->
                <div style="text-align: center;">
                    <div style="width: 70px; height: 70px; background: linear-gradient(145deg, #C62828, #E53935); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(198,40,40,0.5); border: 3px solid rgba(255,255,255,0.3);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white;">3</span>
                    </div>
                    <div style="margin-top: 6px; background: #C62828; padding: 4px 14px; border-radius: 12px;">
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 11px; color: white; letter-spacing: 1px;">PROFI</span>
                    </div>
                </div>
                <!-- Worksheet -->
                <div style="width: 155px; height: 200px; background: white; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,0.3), 0 0 0 3px #EF5350; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-5.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Profi Arbeitsblatt">
                </div>
                <!-- Range label -->
                <div style="background: rgba(255,255,255,0.35); padding: 8px 16px; border-radius: 20px; box-shadow: 0 3px 10px rgba(0,0,0,0.15);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: #EF9A9A;">1 - 20</span>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(90deg, rgba(13,27,42,0.98), rgba(27,30,56,0.98)); padding: 18px 0; border-top: 2px solid rgba(128,222,234,0.2);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #80DEEA; text-shadow: 0 0 20px rgba(128,222,234,0.4); letter-spacing: 3px;">DIFFERENZIERTES LERNEN F&Uuml;R JEDES KIND</span>
            </div>
        </div>

    </div>
</body>
</html>
