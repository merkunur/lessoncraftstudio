thematicCoherence:
  en: |
    All 5 packages cohere around the toys theme + form a cognitive
    sorting + reasoning progression with action-verb vocabulary anchor.

    **Pedagogical sequencing:**
    1. **sort-by-color** — Single-attribute sorting using toys' rich
       color diversity (red blocks vs blue blocks vs yellow blocks).
       Foundational sorting work.
    2. **sort-by-shape** — Single-attribute sorting using toys' shape
       diversity (round balls vs square blocks vs triangular pieces).
       Second sorting dimension.
    3. **sort-by-size** — Single-attribute sorting using toys' size
       contrasts (big stuffed animal vs small stuffed animal). Third
       sorting dimension.
    4. **identify-odd-one-out-by-attribute** — Reasoning task using
       toy-set examples ("Three balls + one block — which is the odd
       one out?"). Top-of-bundle cognitive challenge integrating prior
       sorting work.
    5. **identify-and-name-action-verbs** — Vocabulary anchor: action
       verbs of play (build, throw, push, roll, stack). Connects toys
       theme to active vocabulary; reinforces toy use through verbs.

    **Strand spread:** 3 cognitive-sorting + 1 reasoning + 1 vocabulary-
    acquisition. Tight strand-coherence within bundle (3 strands; 3
    sorting packages dominate). Demonstrates that thematic anchor
    (toys) can sustain repeated single-attribute sorting work without
    feeling redundant — each sort axis reveals distinct properties of
    the same toy set.

    **Suggested unit duration:** 4-5 weeks. 3 sorting weeks (color,
    shape, size in any order) + 1 reasoning week + 1 verbs week.

    **Multilingual classroom relevance:** toy vocabulary varied
    cognate-coverage across 11 platform locales — Germanic somewhat
    cognate (Spielzeug / speelgoed / leksak) but Romance more distinct
    (juguete / jouet / giocattolo). Action-verbs package extends
    multilingual coverage through verb forms.

    **Pillar 2 architectural pattern:** toys-bundle exemplifies
    minimum-viable bundle composition pattern (per shapes-bundle
    precedent) — 3 single-attribute sort packages + 1 reasoning
    integration + 1 vocabulary anchor. Demonstrates that themed
    bundles can be sort-attribute-rich without strand-stretching;
    repetition of sorting strand across 3 attributes is feature, not
    bug. Tight-strand pattern alongside fruits-bundle's 4-strand
    spread + occupations-bundle's 5-strand spread.
