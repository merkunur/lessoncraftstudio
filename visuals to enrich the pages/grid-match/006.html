<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Raster-Puzzle - Tierwerkstatt</title>
</head>
<body style="margin:0;padding:0;width:1000px;height:1000px;overflow:hidden;font-family:'Nunito',sans-serif;">
    <div style="width:1000px;height:1000px;position:relative;background:linear-gradient(170deg,#FFF8E1 0%,#FFECB3 40%,#FFE0B2 100%);overflow:hidden;">

        <!-- Craft table wood grain texture -->
        <div style="position:absolute;inset:0;opacity:0.05;background-image:repeating-linear-gradient(90deg,#8D6E63 0px,transparent 1px,transparent 45px),repeating-linear-gradient(0deg,#8D6E63 0px,transparent 1px,transparent 90px);"></div>

        <!-- Cork-board strip at top -->
        <div style="position:absolute;top:0;left:0;right:0;height:85px;background:linear-gradient(180deg,#D7A86E 0%,#C49A6C 60%,#B8895A 100%);box-shadow:0 4px 15px rgba(0,0,0,0.15);z-index:10;">
            <!-- Cork texture dots -->
            <div style="position:absolute;inset:0;opacity:0.15;background-image:radial-gradient(circle 2px,#8D6E63 1px,transparent 1px);background-size:12px 12px;"></div>
            <!-- Push-pin dots on cork -->
            <div style="position:absolute;top:20px;left:180px;width:18px;height:18px;background:radial-gradient(circle at 40% 40%,#FF6D00,#E65100);border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,0.3);"></div>
            <div style="position:absolute;top:38px;left:420px;width:16px;height:16px;background:radial-gradient(circle at 40% 40%,#66BB6A,#388E3C);border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,0.3);"></div>
            <div style="position:absolute;top:25px;left:650px;width:17px;height:17px;background:radial-gradient(circle at 40% 40%,#42A5F5,#1565C0);border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,0.3);"></div>
            <div style="position:absolute;top:42px;left:850px;width:15px;height:15px;background:radial-gradient(circle at 40% 40%,#EF5350,#C62828);border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,0.3);"></div>
        </div>

        <!-- GRATIS badge: Orange push-pin circle -->
        <div style="position:absolute;top:22px;left:28px;z-index:100;">
            <div style="width:95px;height:95px;background:linear-gradient(145deg,#FF8C00 0%,#FF6D00 100%);border-radius:50%;box-shadow:0 8px 28px rgba(255,109,0,0.5),inset 0 -4px 10px rgba(0,0,0,0.15),inset 0 4px 8px rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);border:4px solid rgba(255,255,255,0.6);">
                <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:white;text-shadow:1px 2px 3px rgba(0,0,0,0.3);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position:absolute;top:35px;right:35px;background:rgba(255,255,255,0.95);padding:11px 22px;border-radius:28px;box-shadow:0 4px 16px rgba(0,0,0,0.12);border:3px solid #8D6E63;z-index:100;">
            <span style="font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;color:#4E342E;letter-spacing:1px;">KLASSE K-2</span>
        </div>

        <!-- Main Title -->
        <div style="position:absolute;top:105px;left:0;right:0;text-align:center;z-index:40;">
            <h1 style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:68px;color:#4E342E;margin:0;text-shadow:2px 2px 0 rgba(141,110,99,0.15);">RASTER-PUZZLE</h1>
            <div style="position:relative;display:inline-block;">
                <h2 style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:42px;color:#FF6D00;margin:6px 0 0 0;text-shadow:1px 1px 3px rgba(0,0,0,0.1);">Tierwerkstatt</h2>
                <!-- Wavy underline -->
                <svg style="position:absolute;bottom:-8px;left:-10px;width:calc(100% + 20px);height:14px;" viewBox="0 0 300 14" preserveAspectRatio="none">
                    <path d="M0,7 Q25,0 50,7 T100,7 T150,7 T200,7 T250,7 T300,7" stroke="#FF6D00" stroke-width="3" fill="none" opacity="0.5"/>
                </svg>
            </div>
        </div>

        <!-- 3 Worksheets pinned to board -->
        <div style="position:absolute;top:280px;left:50%;transform:translateX(-50%);width:850px;height:440px;">

            <!-- Left worksheet: Sample 1 (Owl, portrait) -->
            <div style="position:absolute;left:55px;top:65px;z-index:10;">
                <!-- Push-pin -->
                <div style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:22px;height:22px;background:radial-gradient(circle at 40% 35%,#EF5350,#C62828);border-radius:50%;box-shadow:0 4px 10px rgba(0,0,0,0.35);z-index:5;"></div>
                <div style="width:185px;height:240px;background:white;border-radius:6px;box-shadow:0 8px 25px rgba(0,0,0,0.18);border:5px solid white;overflow:hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/grid%20match/sample-1.jpeg" style="width:100%;height:100%;object-fit:cover;" alt="Eule Raster-Puzzle">
                </div>
            </div>

            <!-- Center worksheet (hero): Sample 5 (Pig, portrait) -->
            <div style="position:absolute;left:50%;top:0;transform:translateX(-50%);z-index:20;">
                <!-- Push-pin -->
                <div style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:24px;height:24px;background:radial-gradient(circle at 40% 35%,#66BB6A,#2E7D32);border-radius:50%;box-shadow:0 4px 10px rgba(0,0,0,0.35);z-index:5;"></div>
                <div style="position:relative;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/grid%20match/sample-5.jpeg" style="width:250px;height:325px;object-fit:cover;border-radius:8px;border:6px solid white;box-shadow:0 15px 45px rgba(0,0,0,0.25);">
                </div>
            </div>

            <!-- Right worksheet: Sample 2 (Penguin, portrait) -->
            <div style="position:absolute;right:55px;top:45px;z-index:10;">
                <!-- Push-pin -->
                <div style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:22px;height:22px;background:radial-gradient(circle at 40% 35%,#42A5F5,#1565C0);border-radius:50%;box-shadow:0 4px 10px rgba(0,0,0,0.35);z-index:5;"></div>
                <div style="width:200px;height:260px;background:white;border-radius:6px;box-shadow:0 8px 25px rgba(0,0,0,0.18);border:5px solid white;overflow:hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/grid%20match/sample-2.jpeg" style="width:100%;height:100%;object-fit:cover;" alt="Pinguin Raster-Puzzle">
                </div>
            </div>
        </div>

        <!-- Decorative craft supplies -->
        <!-- Tape strip -->
        <div style="position:absolute;top:340px;left:35px;width:55px;height:18px;background:linear-gradient(90deg,rgba(255,183,77,0.6),rgba(255,183,77,0.4));border-radius:2px;transform:rotate(-30deg);opacity:0.5;"></div>
        <!-- Pencil -->
        <div style="position:absolute;top:510px;right:25px;opacity:0.2;transform:rotate(55deg);">
            <div style="width:80px;height:10px;background:linear-gradient(90deg,#FFD600,#FFC107);border-radius:2px;position:relative;">
                <div style="position:absolute;right:-8px;top:1px;width:0;height:0;border-left:10px solid #8D6E63;border-top:4px solid transparent;border-bottom:4px solid transparent;"></div>
            </div>
        </div>
        <!-- Star sticker -->
        <div style="position:absolute;top:380px;right:45px;width:22px;height:22px;background:#FFD600;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:0.35;"></div>
        <!-- Another tape strip -->
        <div style="position:absolute;bottom:310px;right:40px;width:50px;height:16px;background:linear-gradient(90deg,rgba(129,199,132,0.5),rgba(129,199,132,0.3));border-radius:2px;transform:rotate(15deg);opacity:0.5;"></div>
        <!-- Ruler marks on left edge -->
        <div style="position:absolute;bottom:300px;left:22px;opacity:0.12;">
            <div style="width:4px;height:20px;background:#4E342E;margin-bottom:8px;"></div>
            <div style="width:4px;height:12px;background:#4E342E;margin-bottom:8px;"></div>
            <div style="width:4px;height:20px;background:#4E342E;margin-bottom:8px;"></div>
            <div style="width:4px;height:12px;background:#4E342E;margin-bottom:8px;"></div>
        </div>

        <!-- Banner -->
        <div style="position:absolute;bottom:115px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#66BB6A,#43A047);padding:14px 40px;border-radius:30px;box-shadow:0 6px 22px rgba(67,160,71,0.4);z-index:40;white-space:nowrap;">
            <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;color:white;text-shadow:1px 2px 3px rgba(0,0,0,0.2);letter-spacing:1px;">Hier wird gepuzzelt &amp; gebastelt!</span>
        </div>

        <!-- Feature Pills -->
        <div style="position:absolute;bottom:35px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:40;">
            <div style="background:white;padding:12px 20px;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,0.12);border:3px solid #FF6D00;">
                <span style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#FF6D00;">3x3 &amp; 4x4 Raster</span>
            </div>
            <div style="background:white;padding:12px 20px;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,0.12);border:3px solid #66BB6A;">
                <span style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#388E3C;">L&ouml;sungsbl&auml;tter inklusive</span>
            </div>
            <div style="background:white;padding:12px 20px;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,0.12);border:3px solid #4E342E;">
                <span style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#4E342E;">Sofort einsetzbar</span>
            </div>
        </div>

    </div>
</body>
</html>
