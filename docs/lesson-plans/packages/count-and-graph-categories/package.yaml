# Teaching package — count items + graph categories on bar chart
# Arc 10 Phase 1 (Path B; early-numeracy / data-and-graphs strand
# deepening). Class B FLEXIBLE; vocab-anchored. Builds on Arc 9 Phase 1
# sort-objects-by-attribute. Sort-then-count progression now extends to
# CHART CONSTRUCTION: kids represent counts visually as bar-graph columns.

targetSlug: count-and-graph-categories
language: en
title:
  en: "Count and Graph — turn data into bar charts"
description:
  en: "Kindergarten / Grade 1 early-numeracy package teaching data-graphing. Builds on Arc 9 Phase 1 sort-objects-by-attribute (sort-then-count framing). Kids now extend the sequence to CHART CONSTRUCTION: sort by category → count each category → build a bar chart with column heights matching counts. Visual data-representation skill foundational for later data interpretation. Vocab-anchored — graph categories drawn from familiar vocabulary themes. Composes against picture-sort + chart-count apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class data-display routine. Teacher displays a sorted set:
      4 red apples + 3 blue ones + 2 yellow ones. "Let's MAKE A
      CHART showing this." Teacher draws 3 columns on the board labeled
      'Red', 'Blue', 'Yellow'. Teacher fills each column to a height
      matching the count: 4 squares for red, 3 for blue, 2 for yellow.
      Class observes how column height represents count. "Which column
      is TALLEST? Red — because 4 is the largest number." Reinforces
      the count-as-height visual mapping.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sort-count-graph routine. Each pair receives mixed
      paper-cuts + a printed grid template. Pair sorts by chosen
      attribute, counts each category, fills in the grid by coloring
      one square per item per category. The resulting filled-grid IS a
      bar chart. Recast errors with explanation ("you said red has 5
      but you only colored 3 squares — let's count: 1, 2, 3, 4 — 4
      red items. Color 4 squares for red"). Optional extension: kids
      compare 2 pairs' charts and articulate differences ("our reds
      are taller than yours; your blues are taller than ours").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (kids sort
      objects into categories — data-collection precursor to graphing).
      Station 2: chart-count worksheet (kids count + record counts
      directly in chart-format cells). Station 3: manipulative cut-outs
      hands-on graph-building (kids sort + count + build physical
      bar charts with grid + colored squares). Station 4: matching
      worksheet (image-name pairs reinforce vocabulary used as graph
      categories).
  closure:
    durationMinutes: 5
    body: |
      Whole-class graph-interpretation. Teacher displays a final bar
      chart on the board; class collectively reads it: "Red has 4.
      Blue has 3. Yellow has 2. Red is the most. Yellow is the least."
      Forward-pointer: "Today we built bar charts showing counts. When
      we come back to data next, we'll READ charts that someone ELSE
      built — and answer questions about the data: how many MORE reds
      than blues?"

