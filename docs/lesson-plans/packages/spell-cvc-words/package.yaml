assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Spell 6 of 8 dictated CVC words correctly in 8 of 10 trials.
      - Segment phonemes in CVC words ('c-a-t') in 7 of 10 trials.
      - Apply CVC-spelling pattern to NEW unfamiliar CVC words in 5 of
        10 trials.

    Differentiation:
    - Pre-K: 4 strong-CVC words; teacher-supported letter-by-letter.
    - K: 8-10 CVC words; independent dictation.
    - Grade 1+: extend to spell-high-frequency-sight-words-tier-1 (Arc
      13+ candidate) + bridge to consonant-blend spelling.

