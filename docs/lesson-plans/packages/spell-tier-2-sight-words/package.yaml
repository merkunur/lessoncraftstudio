# Teaching package — spell tier 2 sight words
# Arc 14 Phase 2 (early-literacy / spelling +1 from Arc 13 baseline).
# Resolves Arc 13 spell-high-frequency-sight-words-tier-1 forward-pointer.

targetSlug: spell-tier-2-sight-words
language: en
title:
  en: "Tier 2 Sight Words — said, what, when, where, why, how"
description:
  en: "Grade 1 / Grade 2 early-literacy spelling package teaching kids to spell Tier 2 high-frequency sight words. Builds on Arc 13 spell-high-frequency-sight-words-tier-1 foundation (Tier 1: the, of, and, to, a, in, is, you, that, it, he, was, for). RESOLVES Arc 13 Tier 1 spelling forward-pointer ('next we extend sight-word spelling to Tier 2 frequency band'). Tier 2 includes 25 next-most-frequent words: said, what, when, where, why, how, who, this, with, his, from, they, but, by, words, can, out, were, all, your, time, has, look, more, write. Many Tier 2 words are interrogative/relative pronouns + connectors essential for sentence-level reading + writing. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + Tier 2 sight-word introduction. Teacher
      displays 6 Tier 2 words: said / what / when / where / why /
      how. "These are Tier 2 sight words. We see them ALL the time
      in books! 'What did she say?' 'Where are we going?' 'Why is
      the sky blue?' Today we'll spell them — practice writing
      each one." Class chants spellings (s-a-i-d for 'said'; w-h-a-t
      for 'what') in unison. Phonologically-irregular words (said,
      where) require memorization vs sounding-out.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + spelling routine. Each pair receives word cards
      shuffled face-down + spelling whiteboards. Pair takes turns:
      kid A flips a card + says the word; kid B writes it on the
      whiteboard from memory. Reveal card to check. Recast errors
      with letter-by-letter copy ("said is s-a-i-d. Notice 'a' +
      'i' make the /e/ sound — special spelling.").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: word-scramble worksheet
      (rearrange letters to spell Tier 2 words). Station 2:
      vocabulary-tracing-strips for each Tier 2 word. Station 3:
      crossword worksheet (Tier 2 sight-word filling). Station 4:
      word-guess (kid hears a clue + spells the corresponding Tier 2
      word).
  closure:
    durationMinutes: 5
    body: |
      Whole-class spelling-bee mini-round. Teacher reads each Tier 2
      word aloud; kids write it on individual whiteboards. Quick
      visual scan checks accuracy. Forward-pointer: "Today we
      spelled Tier 2 sight words. When we come back next, we'll
      LABEL pictures with sentence-fragments using these sight
      words — 'The dog is here. Where is the cat?'"

