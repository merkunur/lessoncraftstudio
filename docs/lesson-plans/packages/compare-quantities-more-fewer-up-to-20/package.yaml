# Teaching package — compare quantities (more / fewer / equal) up to 20
# Arc 16 Phase 1.2 (math / comparison strand-depth; extends Arc 12+ compare-quantities-more-fewer 1-10 range to 11-20 teen range).

targetSlug: compare-quantities-more-fewer-up-to-20
language: en
title:
  en: "Comparing Quantities to 20 — more / fewer / equal in the teen range"

description:
  en: "Grade 1 / Grade 2 numeracy package extending quantity comparison work into the teen range (11-20). Builds directly on Arc 12+ compare-quantities-more-fewer (which covered ranges 1-5 + 1-10). Critical extension because the teen range introduces TWO-DIGIT comparison reasoning: kids learn to compare 15 vs 12, 18 vs 19, 14 vs 14 (equal) by reasoning ABOUT the tens-and-ones structure of two-digit numbers (Arc 15 place-value foundation). Strategy emphasis: count-and-compare for early learners; place-value-aware comparison (tens-first, then ones-tiebreak) for Grade-2-ready learners. Cross-bundle reuse opportunity at food-context bundles per Pillar 2 cycle close 4-bundle precedent (food-prep + restaurant + breakfast-foods + snacks: comparing serving quantities). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + teen-range comparison introduction.
      Teacher shows two groups: 14 counters + 17 counters. "Which
      group has MORE? Which has FEWER?" Class counts each group
      aloud (1-14; 1-17) + identifies 17 > 14. Teacher introduces
      place-value-aware strategy: "Both numbers are TEENS — both
      have 1 ten. So look at the ONES: 4 ones vs 7 ones. 7 ones
      is more, so 17 is more." Teacher repeats with 12 vs 18 (1
      ten each; compare ones 2 vs 8 → 18 is more), 15 vs 11 (1
      ten each; 5 vs 1 ones → 15 is more), 14 vs 14 (1 ten each;
      4 vs 4 ones → EQUAL — same quantity). Pattern emphasis:
      "In the teen range, the TENS digit is always 1 — so the
      ONES digit decides which is more or fewer or equal."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + teen-range comparison routine. Each pair
      receives base-ten kits + 6 comparison cards (pairs of teen
      numbers: 13/16, 18/14, 15/15, 17/12, 11/19, 14/14). Pair
      takes turns: kid A builds first number with manipulatives
      (1 ten-stick + N ones); kid B builds second number; together
      they compare visually + verbally ("13 has 3 ones; 16 has 6
      ones; 16 has MORE because 6 ones is more than 3 ones").
      Recast errors with strategy-demo ("when both are teens,
      compare the ONES — same tens, different ones."). Extension
      for advanced kids: introduce 9 vs 12 (CROSS-RANGE: single-
      digit vs teen) — "9 has 0 tens + 9 ones; 12 has 1 ten + 2
      ones. Tens decide first: 1 ten > 0 tens, so 12 is more."
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: more-less worksheet (teen-
      number comparison; mode: image-vs-number). Station 2:
      matching worksheet (number cards in teen range; match
      equivalent representations like 14 + tally marks of 14).
      Station 3: math-puzzle (find equal-pair: which two cards
      show same quantity, 14 or 14 or 41?). Station 4: chart-count
      (count-bar groups to 20 + compare bar heights).
  closure:
    durationMinutes: 5
    body: |
      Whole-class teen-range comparison quiz. Teacher shows 5
      teen-number pairs (15/12, 18/19, 14/14, 11/17, 16/13);
      class collectively answers using "more", "fewer", or
      "equal" + names the strategy used. Forward-pointer: "Today
      we compared teen numbers (11-20). When we come back next,
      we'll compare numbers up to 100 + numbers up to 1000 —
      using the SAME place-value strategy: compare BIGGEST place
      first (hundreds, then tens, then ones)!"

