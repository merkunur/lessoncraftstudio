# Teaching package — read and write numerals 1 to 20
# Arc 15 Phase 4 (math / numeral-recognition 3/4 → 4/4 SATURATE).
# 16th saturated strand at Arc 15 close.

targetSlug: read-and-write-numerals-1-to-20
language: en
title:
  en: "Writing Numerals 1-20 — forming numbers with proper technique"
description:
  en: "Kindergarten / Grade 1 math + fine-motor package teaching kids to WRITE numerals 1-20 with proper formation technique (start-position + stroke-direction + closure). Builds on Arc 15 Phase 1 recognize-numerals-1-to-20 (recognition foundation) + Arc 9-12 trace-straight/curved-lines (fine-motor foundation). Saturating package for numeral-recognition strand at 4/4 — 16th saturated strand on the platform. Critical bridge from numeral RECOGNITION (visual identification) to numeral PRODUCTION (independent writing). Foundation for written math + filling-in-numerical-answers work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + numeral-writing introduction. Teacher
      demonstrates each numeral 1-9 in the air with finger,
      narrating start-position + stroke-direction: "1: start at
      the TOP + go DOWN straight. 2: start at the TOP + curve
      around + DOWN + across. 3: TWO bumps on the right + open
      to the left. 4: down + across + back up + down. 5: down +
      around + up + across. 6: curve down + around closed. 7:
      across + slanted down. 8: TWO bumps (one on top of the
      other). 9: closed circle on top + line down." Then teens
      11-19 = "1" + ONES digit; 20 = "2" + "0". Visual + tactile
      anchor for proper numeral-formation technique.
  contentActivity:
    durationMinutes: 12
    body: |
      Independent writing practice. Each kid receives a worksheet
      with dotted templates for numerals 1-20 (3 traces per
      numeral). Kids trace each numeral carefully starting at
      start-arrow + following stroke-direction. Teacher circulates;
      recasts errors with verbal cues ("start at the TOP — that's
      where the start-arrow points" / "the 6 has ONE bump at the
      bottom, not two"). Pencil-control + formation feedback
      individualized. Mirror-reversed numerals (3, 5, 7 often
      written backward in K-1) flagged explicitly.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: vocabulary-tracing-strips
      (numerals 1-20 with strong start-arrows + stroke directions).
      Station 2: matching worksheet (written-numeral to quantity-
      representation: 14 ↔ 14 dots). Station 3: missing-pieces
      worksheet (number sequence with one numeral missing — kid
      WRITES the missing numeral). Station 4: pattern-train
      worksheet (sequence + write numerals in counting-by-1
      patterns).
  closure:
    durationMinutes: 5
    body: |
      Whole-class numeral-writing review. Teacher calls out
      numerals; kids write on individual whiteboards. "Write 5!
      Write 13! Write 18! Write 7!" Quick visual check for
      reversals + formation. Forward-pointer: "Today we WROTE
      numerals 1-20. When we come back next, we can write
      numerals 21-100 using same formation techniques + start
      using them in ADDITION + SUBTRACTION problems with our
      own handwriting!"

