# Teaching package — identify 3D shape properties
# Arc 15 Phase 1 (math / geometry strand depth; extends Arc 9-14 2D + 3D shape work).

targetSlug: identify-3d-shape-properties
language: en
title:
  en: "3D Shapes — counting faces, edges, and corners"
description:
  en: "Grade 1 / Grade 2 math + geometry package teaching kids to identify properties of common 3D shapes: number of faces, edges, and corners (vertices). Examples: cube has 6 faces, 12 edges, 8 corners; cylinder has 2 flat faces + 1 curved face, 2 edges, 0 corners; sphere has 1 face, 0 edges, 0 corners. Builds on Arc 9-13 identify-3d-shapes + describe-shape-attributes foundation. Extends geometry strand from shape-naming + 2D-attribute work to 3D-property quantitative analysis. Critical bridge from visual shape recognition (2D) to spatial-property reasoning (3D); foundation for later area, volume, and surface-area work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + 3D shape property introduction. Teacher
      displays a cube + traces with finger as describing: "A
      cube has 6 FACES — flat sides we can see (touches one
      face, then another, counting to 6). It has 12 EDGES —
      where two faces meet in a LINE (traces an edge). And 8
      CORNERS — where three edges meet in a POINT (touches a
      corner)." Class chants: "Cube: 6 faces, 12 edges, 8
      corners!" Teacher repeats with sphere ("1 face, 0 edges,
      0 corners — all curved!") + cone ("1 flat face + 1 curved,
      1 edge where the curve meets the flat, 1 corner at the
      point"). Visual + tactile anchor for shape properties.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + property-counting routine. Each pair receives
      8 picture cards (cube + sphere + cone + cylinder + cuboid
      + pyramid + 2 additional simpler shapes) + a property-
      counting worksheet. Pair takes turns: kid A picks a shape
      card; kid B counts + writes faces / edges / corners. Recast
      errors with finger-tracing demo + concrete-shape reference
      (if class has 3D shape manipulatives available, use them).
      Tricky shapes — cylinder edges (2 circles count as edges
      where flat-meets-curved); cone vertex (1 point at top).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (3D shape
      to property triple: cube ↔ 6F/12E/8V). Station 2: pattern-
      train worksheet (sequence shapes by face count: 1, 1, 2,
      5, 6, 6, ...). Station 3: math-puzzle (find shape from
      properties: "I have 5 faces and 8 edges and 5 corners —
      what shape am I?" Answer: square-based pyramid). Station
      4: vocabulary-tracing-strips for 3D shape + property
      vocabulary (face, edge, corner, vertex, side, flat,
      curved).
  closure:
    durationMinutes: 5
    body: |
      Whole-class 3D properties review. Teacher displays 5 shapes;
      class collectively names properties for each. "Cube: 6
      faces, 12 edges, 8 corners! Sphere: 1 face, 0 edges, 0
      corners!" Forward-pointer: "Today we counted faces, edges,
      and corners. When we come back next, we can MEASURE
      shapes — find their area (flat space inside) and volume
      (space inside a 3D shape) using grid squares + unit cubes!"

