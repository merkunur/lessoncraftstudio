# Teaching package — identify consonant letter sounds
# Arc 13 Phase 1 (early-literacy / letter-recognition 4/6 → 5/6).
# Resolves Arc 12 match-uppercase-lowercase forward-pointer.

targetSlug: identify-letter-sounds-consonants
language: en
title:
  en: "Consonant Sounds — what sound does B make?"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching consonant letter sounds. Builds on Arc 9-12 letter-recognition + Arc 12 read-cvc-words foundation. RESOLVES Arc 12 match-uppercase-lowercase forward-pointer ('learn LETTER SOUNDS — what each letter SOUNDS like'). Kids associate each consonant letter (B, C, D, F, G, H, J, K, L, M, N, P, Q, R, S, T, V, W, X, Y, Z) with its primary phoneme (B = /b/; D = /d/; etc.). Foundational phonics skill bridging letter-recognition to phonics-decoding work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class letter-and-sound routine. Teacher displays B + says
      'B makes the /b/ sound. /b/-/b/-/b/. Bear. Ball. Book. All
      start with /b/.' Class chants. Repeat with D, F, M, S, T —
      most common consonants. Reinforces letter-sound mapping +
      provides anchor words for each letter.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sound-and-find routine. Each pair receives 8
      picture cards. Pair takes turns: kid A says a letter sound
      (/m/); kid B finds a picture starting with that sound (mouse).
      Recast errors with explanation ('you picked the cat — let's
      hear it: cat starts with /k/. Find a picture starting with
      /m/ — mouse, milk, moon').
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: alphabet-train worksheet.
      Station 2: matching worksheet (letter to picture-anchor).
      Station 3: word-guess (kids fill consonant letters from sound
      clues). Station 4: vocabulary-tracing-strips.
  closure:
    durationMinutes: 5
    body: |
      Whole-class sound-quiz. Teacher names a consonant letter; class
      makes its sound + names an anchor word. Forward-pointer:
      "Today we learned consonant sounds. When we come back next,
      we'll learn VOWEL SOUNDS — A, E, I, O, U — which work
      differently because each vowel has TWO sounds (short + long)."

