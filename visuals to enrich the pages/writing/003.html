<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Worksheets - Progression Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; background: linear-gradient(180deg, #FFFFFF 0%, #F0F5ED 100%); position: relative; overflow: hidden;">

        <!-- FREE Badge - Top Left -->
        <div style="position: absolute; top: 22px; left: 22px; z-index: 20;">
            <div style="background: linear-gradient(135deg, #FF6B6B 0%, #E53935 100%); color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; padding: 10px 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(255,107,107,0.5); transform: rotate(-5deg); border: 2px solid white;">
                FREE!
            </div>
        </div>

        <!-- Grade Badge - Top Right -->
        <div style="position: absolute; top: 25px; right: 22px; z-index: 20;">
            <div style="background: linear-gradient(135deg, #26A69A 0%, #00897B 100%); color: white; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; padding: 10px 20px; border-radius: 25px; box-shadow: 0 4px 12px rgba(38,166,154,0.4); border: 2px solid white;">
                GRADES PreK-1
            </div>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 22px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10; width: 580px;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 54px; color: #37474F; margin: 0; text-shadow: 2px 2px 0 rgba(255,255,255,0.8); line-height: 1.05;">
                From Tracing<br>to Writing!
            </h1>
        </div>

        <!-- 4-Column Progression Layout -->
        <div style="position: absolute; top: 150px; left: 25px; right: 25px; bottom: 100px; display: flex; gap: 14px; z-index: 10;">

            <!-- Column 1: FULL TRACE -->
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <!-- Header Tab -->
                <div style="background: #4FC3F7; color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; padding: 10px 8px; border-radius: 12px 12px 0 0; width: 100%; text-align: center; box-shadow: 0 2px 8px rgba(79,195,247,0.3);">
                    FULL TRACE
                </div>
                <!-- Writing lines demo -->
                <div style="width: 100%; height: 55px; background: white; border-radius: 8px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
                    <svg width="100%" height="40" viewBox="0 0 180 40" preserveAspectRatio="xMidYMid meet">
                        <line x1="5" y1="8" x2="175" y2="8" stroke="#ccc" stroke-width="1"/>
                        <line x1="5" y1="20" x2="175" y2="20" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4 3"/>
                        <line x1="5" y1="32" x2="175" y2="32" stroke="#ccc" stroke-width="1"/>
                        <!-- Dotted letter A -->
                        <text x="20" y="30" font-family="'Fredoka', sans-serif" font-size="24" fill="none" stroke="#4FC3F7" stroke-width="1.5" stroke-dasharray="3 2">A</text>
                        <text x="55" y="30" font-family="'Fredoka', sans-serif" font-size="24" fill="none" stroke="#4FC3F7" stroke-width="1.5" stroke-dasharray="3 2">B</text>
                        <text x="90" y="30" font-family="'Fredoka', sans-serif" font-size="24" fill="none" stroke="#4FC3F7" stroke-width="1.5" stroke-dasharray="3 2">C</text>
                    </svg>
                </div>
                <!-- Worksheet -->
                <div style="width: 100%; flex: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.12); border: 3px solid #4FC3F7;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/writing/sample-1.jpeg"
                         style="width: 100%; height: 100%; object-fit: cover; object-position: top;" alt="Full trace worksheet"/>
                </div>
                <!-- Stars: 1/4 difficulty -->
                <div style="display: flex; gap: 4px; align-items: center;">
                    <span style="font-size: 18px; color: #4FC3F7;">&#9733;</span>
                    <span style="font-size: 18px; color: #ddd;">&#9733;</span>
                    <span style="font-size: 18px; color: #ddd;">&#9733;</span>
                    <span style="font-size: 18px; color: #ddd;">&#9733;</span>
                </div>
            </div>

            <!-- Arrow 1→2 -->
            <div style="display: flex; align-items: center; margin-top: 100px;">
                <svg width="20" height="24" viewBox="0 0 20 24"><polygon points="0,4 16,12 0,20" fill="#546E7A"/></svg>
            </div>

            <!-- Column 2: FADING TRACE -->
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <!-- Header Tab -->
                <div style="background: #FFD54F; color: #37474F; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; padding: 10px 8px; border-radius: 12px 12px 0 0; width: 100%; text-align: center; box-shadow: 0 2px 8px rgba(255,213,79,0.3);">
                    FADING TRACE
                </div>
                <!-- Writing lines demo -->
                <div style="width: 100%; height: 55px; background: white; border-radius: 8px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
                    <svg width="100%" height="40" viewBox="0 0 180 40" preserveAspectRatio="xMidYMid meet">
                        <line x1="5" y1="8" x2="175" y2="8" stroke="#ccc" stroke-width="1"/>
                        <line x1="5" y1="20" x2="175" y2="20" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4 3"/>
                        <line x1="5" y1="32" x2="175" y2="32" stroke="#ccc" stroke-width="1"/>
                        <text x="20" y="30" font-family="'Fredoka', sans-serif" font-size="24" fill="none" stroke="#FFD54F" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8">A</text>
                        <text x="55" y="30" font-family="'Fredoka', sans-serif" font-size="24" fill="none" stroke="#FFD54F" stroke-width="1" stroke-dasharray="3 2" opacity="0.5">B</text>
                        <text x="90" y="30" font-family="'Fredoka', sans-serif" font-size="24" fill="none" stroke="#FFD54F" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.25">C</text>
                    </svg>
                </div>
                <!-- Worksheet -->
                <div style="width: 100%; flex: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.12); border: 3px solid #FFD54F;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/writing/sample-2.jpeg"
                         style="width: 100%; height: 100%; object-fit: cover; object-position: top;" alt="Fading trace worksheet"/>
                </div>
                <!-- Stars: 2/4 difficulty -->
                <div style="display: flex; gap: 4px; align-items: center;">
                    <span style="font-size: 18px; color: #FFD54F;">&#9733;</span>
                    <span style="font-size: 18px; color: #FFD54F;">&#9733;</span>
                    <span style="font-size: 18px; color: #ddd;">&#9733;</span>
                    <span style="font-size: 18px; color: #ddd;">&#9733;</span>
                </div>
            </div>

            <!-- Arrow 2→3 -->
            <div style="display: flex; align-items: center; margin-top: 100px;">
                <svg width="20" height="24" viewBox="0 0 20 24"><polygon points="0,4 16,12 0,20" fill="#546E7A"/></svg>
            </div>

            <!-- Column 3: GUIDED COPY -->
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <!-- Header Tab -->
                <div style="background: #F48FB1; color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; padding: 10px 8px; border-radius: 12px 12px 0 0; width: 100%; text-align: center; box-shadow: 0 2px 8px rgba(244,143,177,0.3);">
                    GUIDED COPY
                </div>
                <!-- Writing lines demo -->
                <div style="width: 100%; height: 55px; background: white; border-radius: 8px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
                    <svg width="100%" height="40" viewBox="0 0 180 40" preserveAspectRatio="xMidYMid meet">
                        <line x1="5" y1="8" x2="175" y2="8" stroke="#ccc" stroke-width="1"/>
                        <line x1="5" y1="20" x2="175" y2="20" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4 3"/>
                        <line x1="5" y1="32" x2="175" y2="32" stroke="#ccc" stroke-width="1"/>
                        <text x="20" y="30" font-family="'Fredoka', sans-serif" font-size="24" fill="#F48FB1" stroke="none">A</text>
                        <!-- blank lines for copy -->
                        <line x1="55" y1="32" x2="80" y2="32" stroke="#F48FB1" stroke-width="1.5"/>
                        <line x1="90" y1="32" x2="115" y2="32" stroke="#F48FB1" stroke-width="1.5"/>
                    </svg>
                </div>
                <!-- Worksheet -->
                <div style="width: 100%; flex: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.12); border: 3px solid #F48FB1;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/writing/sample-3.jpeg"
                         style="width: 100%; height: 100%; object-fit: cover; object-position: top;" alt="Guided copy worksheet"/>
                </div>
                <!-- Stars: 3/4 difficulty -->
                <div style="display: flex; gap: 4px; align-items: center;">
                    <span style="font-size: 18px; color: #F48FB1;">&#9733;</span>
                    <span style="font-size: 18px; color: #F48FB1;">&#9733;</span>
                    <span style="font-size: 18px; color: #F48FB1;">&#9733;</span>
                    <span style="font-size: 18px; color: #ddd;">&#9733;</span>
                </div>
            </div>

            <!-- Arrow 3→4 -->
            <div style="display: flex; align-items: center; margin-top: 100px;">
                <svg width="20" height="24" viewBox="0 0 20 24"><polygon points="0,4 16,12 0,20" fill="#546E7A"/></svg>
            </div>

            <!-- Column 4: INDEPENDENT -->
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px;">
                <!-- Header Tab -->
                <div style="background: #66BB6A; color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; padding: 10px 8px; border-radius: 12px 12px 0 0; width: 100%; text-align: center; box-shadow: 0 2px 8px rgba(102,187,106,0.3);">
                    INDEPENDENT
                </div>
                <!-- Writing lines demo -->
                <div style="width: 100%; height: 55px; background: white; border-radius: 8px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
                    <svg width="100%" height="40" viewBox="0 0 180 40" preserveAspectRatio="xMidYMid meet">
                        <line x1="5" y1="8" x2="175" y2="8" stroke="#66BB6A" stroke-width="1"/>
                        <line x1="5" y1="20" x2="175" y2="20" stroke="#66BB6A" stroke-width="0.8" stroke-dasharray="4 3"/>
                        <line x1="5" y1="32" x2="175" y2="32" stroke="#66BB6A" stroke-width="1"/>
                    </svg>
                </div>
                <!-- Worksheet with green success glow -->
                <div style="width: 100%; flex: 1; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px rgba(102,187,106,0.25), 0 4px 12px rgba(0,0,0,0.1); border: 3px solid #66BB6A;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/writing/sample-1.jpeg"
                         style="width: 100%; height: 100%; object-fit: cover; object-position: top;" alt="Independent writing worksheet"/>
                </div>
                <!-- Stars: 4/4 difficulty -->
                <div style="display: flex; gap: 4px; align-items: center;">
                    <span style="font-size: 18px; color: #66BB6A;">&#9733;</span>
                    <span style="font-size: 18px; color: #66BB6A;">&#9733;</span>
                    <span style="font-size: 18px; color: #66BB6A;">&#9733;</span>
                    <span style="font-size: 18px; color: #66BB6A;">&#9733;</span>
                </div>
            </div>
        </div>

        <!-- Bottom Bar - Gradient Strip -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: linear-gradient(90deg, #4FC3F7 0%, #FFD54F 33%, #F48FB1 66%, #66BB6A 100%); display: flex; align-items: center; justify-content: center; z-index: 15;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white; text-shadow: 1px 1px 4px rgba(0,0,0,0.3); letter-spacing: 1px;">
                Scaffolded Success for Every Learner
            </span>
        </div>
    </div>
</body>
</html>
