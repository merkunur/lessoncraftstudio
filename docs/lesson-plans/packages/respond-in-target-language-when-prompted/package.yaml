# Teaching package — respond in target language when prompted
# Arc 9 Phase 2 (Option D multilingual-language-awareness depth; early-
# literacy / multilingual-language-awareness strand). Class B FLEXIBLE.
# Productive-language counterpart to identify-language-of-spoken-utterance
# (Phase 2 sibling). Kids hear a prompt + respond in target language
# rather than home language. Develops code-switching awareness — kids
# learn that the LANGUAGE they respond in matters.

targetSlug: respond-in-target-language-when-prompted
language: en
title:
  en: "Answer in the Right Language — match your response to the question"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching language-appropriate response. Multilingual-language-awareness strand depth: kids hear a prompt + respond in TARGET language (not home language) when target language is the expected medium. Productive-language counterpart to identify-language-of-spoken-utterance (Phase 2 sibling) — LISTEN-and-DETECT progresses to LISTEN-and-RESPOND. Develops code-switching awareness: kids learn that conversational context (target-language teacher prompt → target-language response) matters. Composes against matching + sentence-strips for response practice. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class language-matching routine. Teacher asks a question in
      target language: "What do you eat for breakfast?" Kids respond.
      Teacher recasts kids who responded in home language: "I love that
      you can say 'desayuno' in Spanish — that's your home language.
      In our class right now, we're using English. Can you say it in
      English? 'I eat ___'." Reinforces: code-switching is normal +
      expected; we use target language in target-language context.
      Validates home language while also reinforcing target-language
      practice.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + prompt-and-response routine. Each pair receives 6-8
      prompt cards (target-language questions) + response cards
      (target-language answers). Pair takes turns: kid A reads a
      prompt; kid B selects + reads the matching response. After
      reading, both kids verify the response is appropriate. Recast
      errors with explanation ("you matched 'How are you?' with
      'I eat apple' — let's check: 'How are you?' asks about feelings.
      'I eat apple' is about food. Try again with the right matching
      response: 'I am happy' or 'I am tired'"). Optional extension:
      kids construct their own response cards for new prompts.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (target-language
      prompt-to-response pairs). Station 2: matching worksheet (image
      to target-language response). Station 3: manipulative cut-outs
      hands-on prompt-response card construction (kids assemble
      conversation-starter cards). Station 4: sentence-strips (kids
      construct full target-language responses to common prompts).
  closure:
    durationMinutes: 5
    body: |
      Whole-class prompt-and-response circle. Teacher asks 4-5 prompts;
      kids respond chorally in target language. Forward-pointer: "Today
      we practiced responding in target language. When we come back to
      conversational language next, we'll learn to ASK QUESTIONS in
      target language — the productive-language counterpart of today's
      response work."

