compositionalRationale:
  en: |
    Primary strand: math / data-and-graphs (pictograph interpretation
    — saturates strand 4/4). Secondary strand: numeracy (counting
    picture-icons per category). Tertiary strand: vocabulary-
    acquisition (graph-reading vocabulary: most, least, more, fewer).

    Architectural significance: SATURATES data-and-graphs strand at
    4/4 — completes the strand established at Arc 12 with
    interpret-simple-bar-graph + count-and-graph-categories. Bar-
    graphs and pictographs are complementary K-3 graph-reading
    entry points; both belong in a complete data-and-graphs
    foundation. Pictographs are conceptually simpler (one-picture-
    per-item) so could arguably PRECEDE bar-graphs in pedagogical
    sequencing; we order them after bar-graphs in this strand
    saturation because bar-graphs were Arc 12 and we extend the
    strand pattern in Arc 14.

    Distinctive composition: 2 chart-count + 2 more-less + 1
    matching. Chart-count anchors counting-icons-per-category;
    more-less anchors comparison vocabulary; matching anchors
    category-name vocabulary. Three apps balance counting +
    comparing + naming.

    Class B FLEXIBLE substrate: composes against multiple themes
    (animals, fruits, weather, vehicles) — pictographs work
    naturally with categorical data, theme-flexible.

    K-3 multilingual classroom relevance: graph-reading vocabulary
    (more / fewer / most / least) varies across 11 platform locales
    but visual graph reading is pre-verbal-friendly. Pictographs
    accessible to early-language-learners; counting + comparing
    can happen before category vocabulary fully established.

