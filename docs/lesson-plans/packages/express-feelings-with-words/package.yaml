# Teaching package — express feelings with words
# Arc 15 Phase 2 (science / personal-social-emotional-development 0/6 → 1/6; founds strand).

targetSlug: express-feelings-with-words
language: en
title:
  en: "Naming My Feelings — finding words for emotions"
description:
  en: "Kindergarten / Grade 1 social-emotional package teaching kids to RECOGNIZE + NAME + EXPRESS basic feelings using specific emotional vocabulary. Builds on Arc 8-12 identify-and-name-emotions + identify-own-emotions-in-context + identify-emotions-of-others-from-faces foundation; extends recognition-only work to verbal-expression work. Foundational personal-social-emotional-development strand package (0/6 → 1/6). Critical bridge from emotional-recognition (passive identification) to emotional-expression (active communication) — kids learn to say 'I FEEL frustrated' instead of acting out. Foundation for later emotion-regulation + conflict-resolution + empathy-development work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + feelings-vocabulary introduction. Teacher
      displays 8 feeling-face cards (happy, sad, angry, scared,
      excited, frustrated, surprised, calm). "Today we learn to
      SAY how we feel. When we use WORDS for our feelings, we
      help others understand us — and we help ourselves understand
      our own feelings." Class chants: "I feel happy! I feel sad!
      I feel excited! I feel calm!" Teacher demonstrates self-
      modeling: "When I feel HAPPY, I can SAY: I feel happy
      today. When I feel FRUSTRATED, I can SAY: I feel frustrated
      because..."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + feelings-expression routine. Each pair receives
      8 scenario cards (e.g., "you got a present" / "you can't
      find your favorite toy" / "your friend shared with you" /
      "someone broke your drawing"). Pair takes turns: kid A
      reads scenario; kid B says "I would feel ___ because ___".
      Recast errors with feeling-vocabulary support ("when your
      drawing breaks, you might feel SAD or FRUSTRATED. Can you
      try: I would feel SAD because my drawing got ruined?").
      Use feeling-face cards as visual prompts; kids point to
      the face that matches their feeling.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (feeling-
      word to feeling-face picture). Station 2: prepositions
      worksheet (sentence-frames like "I feel HAPPY when ___" +
      "I feel SAD when ___"). Station 3: picture-sort worksheet
      (sort scenarios into POSITIVE feelings + DIFFICULT feelings
      bins). Station 4: vocabulary-tracing-strips for feeling
      words (happy, sad, angry, scared, excited, frustrated,
      surprised, calm, proud, lonely).
  closure:
    durationMinutes: 5
    body: |
      Whole-class feelings-check-in. Each child shares a feeling
      they had THIS WEEK + describes the situation in 1 sentence.
      "I felt EXCITED when we did art class!" "I felt SAD when my
      pet was sick." Teacher validates each response with active
      listening. Forward-pointer: "Today we said our feelings.
      When we come back next, we can learn what to DO when we
      have BIG feelings — calming strategies + asking-for-help +
      problem-solving with friends!"

