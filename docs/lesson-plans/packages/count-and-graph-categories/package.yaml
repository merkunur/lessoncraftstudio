assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Sort + count + build a bar chart with 2-3 categories in 7 of
        10 attempts.
      - Identify which category in a bar chart is MOST/LEAST in 8 of
        10 trials.
      - Compare 2 categories using graph data ('there are MORE reds
        than blues') in 6 of 10 productive-language attempts.

    Differentiation:
    - Pre-K: sort + count only (skip chart construction); 2 categories
      with strong contrast.
    - K: sort + count + tally-mark or simple-grid bar chart; 2-3
      categories.
    - Grade 1+: extend to chart-reading + comparison questions ('how
      many more reds than blues?'); bridge to interpret-simple-bar-
      graph (Arc 11+ candidate).

