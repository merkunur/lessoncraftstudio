# Teaching package — write a simple sentence with picture prompt
# Arc 19 Phase 1.5 (early-literacy / writing-composition strand-advancement
# 2/8 → 3/8 canonical). Builds on Arc 12 write-own-name + Arc 13 label-a-
# picture-with-1-word + Arc 14 label-with-noun-phrase (intent-equivalent
# of canonical label-picture-with-noun-phrase) foundation. Final-arc-cycle
# slot per Arc 19 Phase 1.5 close-out responsibility.

targetSlug: write-a-simple-sentence-with-picture-prompt
language: en
title:
  en: "Writing Simple Sentences — 'I see a red apple'"
description:
  en: "Kindergarten / Grade 1 early-literacy writing-composition package teaching kids to write a simple complete sentence using a picture prompt + a sentence-frame template. Builds on Arc 12 write-own-name + Arc 13 label-a-picture-with-1-word + Arc 14 label-with-noun-phrase. Kids progress from single-word labels and noun phrases to FULL sentences with subject + verb + object — the canonical first-sentence shape. Template-frame scaffolding: 'I see a {item}.' / 'The {item} is {color}.' / 'A {item} can {action}.' Picture prompt anchors the noun + adjective + verb vocabulary; the sentence-frame teaches sentence-structure. Critical bridge from labeling work to sentence-level writing; opens the writing-composition strand toward multi-sentence work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class sentence-building routine. Teacher displays a
      picture of a red apple + writes 'I see a red apple.' on the
      board, pointing to each word as they say it: "I... see... a...
      red... apple. Five words. ONE sentence. It starts with a
      capital I + ends with a period." Class repeats. Teacher then
      shows a picture of a dog + leads: "I see a... what color is
      the dog?... brown! I see a brown dog. Let's write it." Class
      chants while teacher writes. Establishes the sentence-frame
      "I see a [adjective] [noun]." as the canonical first-sentence
      shape + the capital-letter-at-start + period-at-end
      conventions.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sentence-writing routine. Each pair receives a
      worksheet with 6 picture cards (a red apple / a brown dog /
      two blue fish / a big tree / a happy cat / a small bird).
      Pair takes turns: kid A points to a picture; kid B writes a
      complete sentence describing it using a sentence-frame ("I
      see a red apple." / "The dog is brown." / "Two fish swim.").
      Recast errors gently ("you wrote 'red apple' — that's a
      noun phrase, not a full sentence. A sentence needs a subject
      and a verb. Try: 'I see a red apple.' or 'The apple is red.'
      Both are sentences. Add a capital I at the start and a period
      at the end."). Optional extension: kids draw their own
      pictures + write a sentence describing each.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: word-scramble worksheet
      (rearrange words to form a correct sentence: see / a / I /
      apple → 'I see a apple'). Station 2: word-guess (fill missing
      sentence-word from picture clue — 'I see a __ dog' [brown]).
      Station 3: matching worksheet (sentence to picture pairing).
      Station 4: vocabulary-tracing-strips for canonical first-
      sentence frames ('I see a ___' / 'The ___ is ___' / 'A ___
      can ___').
  closure:
    durationMinutes: 5
    body: |
      Whole-class sentence-share. Each kid reads one sentence they
      wrote to the class; class listens + checks for capital-letter
      start + period-end. Teacher posts written sentences on the
      classroom wall as a sentence gallery. Forward-pointer:
      "Today we wrote one sentence with a picture. When we come
      back to writing next, we'll write TWO sentences about the
      same topic — 'I see a red apple. The apple is sweet.' —
      learning to keep our writing connected from one sentence to
      the next."

