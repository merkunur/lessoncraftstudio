# Teaching package — subtract two 2-digit numbers
# Arc 18 Phase 1.4 (math / addition-subtraction strand 12/14 → 13/14). Pair partner of Arc 18 Phase 1.3 add-2-digit-numbers (the inverse operation; subtraction with borrowing mirrors addition with regrouping). Together with add-2-digit-numbers covers Grade 2 canonical 2-digit + 2-digit operations under CCSS.2.NBT.B.5.

targetSlug: subtract-2-digit-numbers
language: en
title:
  en: "Subtract Two 2-Digit Numbers — line up the tens and ones, borrow when needed"

description:
  en: "Grade 2 math package teaching the canonical 2-digit-minus-2-digit subtraction skill: kids subtract pairs of two-digit numbers (54-23, 62-37, 80-45, 100-29) by lining up the TENS and ONES columns and subtracting column-by-column. Builds DIRECTLY on Arc 18 Phase 1.3 add-2-digit-numbers (the inverse operation; this package mirrors the add-2-digit-numbers structure exactly with subtraction substituted for addition). Builds on Arc 16 P1.1 subtract-within-100 prerequisite (broader 1-and-2-digit subtraction within 100); this package specifically narrows to 2-digit-minus-2-digit cases and emphasizes the place-value column structure plus BORROWING mechanics (the inverse of add's regrouping/carrying). Both with-borrowing (when ones digit of top number is less than ones digit of bottom number, requiring borrow from tens column) and without-borrowing (when top ones >= bottom ones) cases are practiced. Addition-subtraction strand advances 12/14 → 13/14 (one target remaining: add-3-numbers-within-20). Per §A.13.30 K-3 informal framing: Grade 2 2-digit subtraction is PLACE-VALUE-GROUNDED computational fluency — kids understand WHY the borrow procedure works (we 'borrow' a ten by physically taking it from the tens column and converting it into 10 ones in the ones column; this works because of place-value structure: 10 ones = 1 ten). NOT formal column-subtraction algorithm mastery (which is Grade 3+ work refining for efficiency); the Grade 2 emphasis is conceptual understanding through manipulatives + multiple strategies + standard algorithm awareness. CCSS.2.NBT.B.5 primary anchor ('Fluently add and subtract within 100 using strategies based on place value, properties of operations, and/or the relationship between addition and subtraction') + CCSS.2.OA.A.1 (apply addition + subtraction within 100 to solve word problems). 5 worksheet exercises + 7 printable materials over a 1-week unit. Load-bearing materials: place-value-mat (tens-and-ones column structure made physical; **generator DEFERRED per Pillar 5 (C) carry-forward** — same gap as add-2-digit-numbers + Arc 16 P1.1 add-within-100 + subtract-within-100) + manipulative-cut-outs in `mode: variety` with base-ten vocabKeys (ten-stick + ones-counter; **mode-canonical-correct shape per §A.13.35 + operator-locked Phase 1.3 Slot 3 add-2-digit-numbers precedent**; diverges from Arc 16 P1.1 subtract-within-100's non-canonical `mode: base-ten-blocks` — that package is on the retro-fix carry-forward queue alongside add-within-100 + Arc 17 P1.4 tell-time pair, NOW 4 packages on the retro-fix queue)."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class 2-digit column-subtraction introduction.
      Teacher writes 54-23 vertically on the board with
      tens-and-ones columns clearly drawn. "Today we
      SUBTRACT TWO TWO-DIGIT NUMBERS. We line up the TENS
      column and the ONES column — same as we did for ADDING
      2-digit numbers last week, just with MINUS instead of
      PLUS. 54 has 5 TENS and 4 ONES. 23 has 2 TENS and 3
      ONES. We subtract the ONES first: 4-3 = 1. One one,
      no borrow needed. Then the TENS: 5-2 = 3 tens, which
      is 30. So 54-23 = 31." Teacher repeats with 62-37
      (NEEDS borrowing — ones column 2-7 won't work because
      2 is less than 7; borrow 1 ten from tens column,
      converting it into 10 ones; ones column becomes 12-7
      = 5; tens column was 6, now 5 after borrow; 5-3 = 2
      tens; result 25). Then 80-45 (borrowing across a
      zero; ones column 0-5 won't work; borrow from tens
      column, making 7 tens + 10 ones; subtract; result 35).
      Pattern emphasis: "When you subtract 2-digit numbers,
      ALWAYS line up the TENS column and the ONES column.
      Subtract the ONES first. If the top ones is SMALLER
      than the bottom ones, BORROW — take 1 ten from the
      tens column and turn it into 10 ones. Then subtract
      the TENS, remembering you have ONE LESS ten because
      you borrowed."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + place-value-grounded 2-digit subtraction
      routine. Each pair receives a place-value-mat (a
      paper mat with TENS column on left + ONES column on
      right) + base-ten manipulatives (ten-sticks +
      ones-counters as cut-outs) + a worksheet with 6
      problems (54-23, 62-37, 80-45, 75-31, 91-58, 100-29).
      Pair takes turns: kid A builds the top number on the
      place-value-mat (54 = 5 ten-sticks in TENS column +
      4 ones-counters in ONES column); kid B physically
      REMOVES the bottom number from the mat (subtract 23 =
      remove 2 ten-sticks + remove 3 ones-counters). When
      borrowing is needed, kids physically slide a ten-stick
      out of the tens column + exchange it for 10 ones-
      counters which they add to the ones column ("we
      BORROWED a ten — now we have 10 more ones to subtract
      from"). Then count remaining tens + remaining ones;
      write the answer. Recast errors with borrow-demo
      ("you have 2 ones in the ones column but you need to
      subtract 7 — you can't take 7 from 2. Borrow a ten:
      slide a ten-stick out of the tens column + bring 10
      ones-counters into the ones column. Now you have 12
      ones — that's enough to subtract 7."). The physical
      place-value-mat + base-ten manipulatives + the
      ten-for-ten-ones EXCHANGE is the load-bearing
      pedagogy — kids who SEE the borrow physically
      understand WHY the borrow procedure works (it's not
      magic; it's the inverse of regrouping kids learned
      in add-2-digit-numbers). Strategy diversity: kids
      may also use decomposition (54-23 = 50+4-20-3 =
      30+1 = 31), count-down, or count-up-from-bottom-to-
      top strategies; teacher accepts any strategy that
      produces correct answer + connects to place-value
      reasoning.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity —
      match 2-digit subtraction expressions (e.g., 54-23)
      to their differences (31). Station 2: chart-count
      activity — count BACKWARDS by 10s with 2-digit
      numbers (100, 90, 80, ..., 10). Station 3: math-
      puzzle (missing-subtrahend: 54-?=31; ?-23=31).
      Station 4: math-worksheet (vertical-format 2-digit
      subtraction practice with mix of borrowing + non-
      borrowing problems, including borrowing-across-zero
      cases like 100-29).
  closure:
    durationMinutes: 5
    body: |
      Whole-class 2-digit subtraction quick-recall + strand
      advancement note. Teacher presents 5 fast problems;
      class collectively answers + identifies borrowing
      moments. "54-21?" (Class works it: 33; no borrow.)
      "63-28?" (35; borrow needed.) "80-37?" (43; borrow
      needed.) "99-50?" (49; no borrow.) "100-44?" (56;
      borrow across zero.) Teacher then poses the place-
      value-reasoning question: "Why do we BORROW from
      the tens column when the ones column doesn't have
      enough?" (Class: because 1 ten = 10 ones! We're
      not creating new numbers; we're EXCHANGING one ten
      for ten ones, same total value!) Forward-pointer:
      "Today we mastered 2-digit + 2-digit subtraction
      with borrowing. Now we know BOTH operations on 2-
      digit numbers — addition with regrouping (carrying)
      AND subtraction with borrowing (the inverse). We
      have ONE more target left in our addition-
      subtraction strand: add-3-numbers-within-20 (adding
      THREE small numbers like 4+5+6 = 15). After that,
      we'll have CLOSED the addition-subtraction work
      for K-3 — 14 of 14 targets DONE!"

