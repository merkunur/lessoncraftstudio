compositionalRationale:
  en: |
    Primary strand: early-literacy / reading-comprehension
    (read-and-follow-2-sentence-instruction — STRAND-SAT-CLOSING
    9/10 → 10/10 SAT). **20th parent-class strand SATISFIED in
    the catalog** (advances aggregate parent-class strand-
    saturation 19/30 → 20/30 = 66.7% per §A.13.33 parent-class
    methodology; sub-track strand count at 25/30 → 26/30 per
    Phase 0 audit alternative methodology — documented as
    detail; parent-class count is canonical-state-of-record per
    Arc 18 close commit body). Final canonical target per
    learning-targets.json reading-comprehension strand
    enumeration (10 targets total; read-and-follow-2-sentence-
    instruction at line 131 closes the strand).

    Architectural significance: SAT-CLOSES the reading-
    comprehension strand at 10/10. Pair-coherent with Phase
    1.1 Slot 1 distinguish-fiction-from-nonfiction (penultimate
    target shipping alongside this final-target package).
    Together the Phase 1.1 reading-comprehension pair completes
    the strand that began with Arc 17 P1.5 identify-main-character
    + grew through Arc 18 P1.2/1.3/1.4 narrative-comprehension
    cluster (identify-setting + answer-who-what-where-questions
    + infer-character-feeling-from-picture-cue + identify-
    problem-and-solution) + earlier Arc 14 P2 sequence-3-event-
    story.

    Per §A.13.30 K-3 informal framing: Grade 1-2 read-and-follow
    work is CONCRETE READING-AS-ACTION. Kids read a short
    instruction + IMMEDIATELY execute it in concrete classroom
    routines (color, draw, sort, find, point). NOT formal
    procedural-reading pedagogy (multi-step technical
    instructions + recipes + sequenced procedures are Grade
    3+ work); the Grade 1-2 emphasis is reading-into-doing as
    the bridge between decoding-fluency + functional-reading.
    Critical pedagogical move documented in contentActivity:
    RE-READ instead of correcting when kids miss a step —
    instruction-following errors usually mean kid didn't fully
    process sentence 2; re-reading surfaces the missed step
    pedagogically while reinforcing the read-then-do habit.

    Cross-reference to read-cvc-words (prerequisite per
    learning-targets.json): kids must be able to decode short
    CVC words before they can read instructions made of CVC
    words. This package operationalizes the decoding skill via
    instruction-following + provides the conceptual bridge from
    decoding-as-skill to reading-as-action.

    Cross-reference to Arc 17/18 narrative-comprehension cluster:
    those packages established the COMPREHENSION-WITHIN-STORY
    skills (who, what, where, when, problem-solution, setting,
    main-character). This package establishes the COMPREHENSION-
    AS-ACTION skill (read instruction → execute instruction).
    Cognitive progression: comprehension-as-knowing →
    comprehension-as-doing. The reading-comprehension strand
    is now fully saturated across both dimensions.

    Materials note: 8-material Literacy class stack per §A.13.37
    + pair-coherent with Phase 1.1 Slot 1 distinguish-fiction-
    from-nonfiction. All 8 positions mirror the SAT-closing pair
    structure. Matching-mat at position 3 surfaces instruction-
    to-outcome pairing (kids match a 2-sentence instruction text
    to a picture showing the executed outcome). Sentence-strips
    at position 4 with framePreset 'this-is-a' carries
    instructional frames. Manipulative-cut-outs at position 6
    emits canonical-correct `mode: single-repeat` per §A.13.35.

    Distinctive composition: pattern-train (position 1) +
    matching ×2 (positions 2+5) + missing-pieces (position 3) +
    word-guess (position 4). Pattern-train sequences 2-step
    instructions; matching builds instruction-to-outcome pairing;
    missing-pieces tests instruction-completeness; word-guess
    reinforces action-vocabulary (color, draw, circle, point,
    find, put, place, write).

    Class B FLEXIBLE substrate: composes against miscellaneous
    theme (instructions span all theme contexts). No substrate
    gaps; ships clean.

    K-3 multilingual classroom relevance: read-and-follow work
    is universal K-3 literacy content. Imperative-form vocabulary
    varies per locale grammar: en uses bare infinitive ("Color
    the cat."); de uses Sie-imperative for formal address +
    duzen for informal ("Male die Katze an." vs "Malen Sie die
    Katze an."); es uses tú-imperative ("Colorea el gato.") +
    usted-imperative ("Coloree el gato."); pt uses você-
    imperative ("Pinte o gato."); nordic locales use parallel
    imperatives. Multilingual K-3 classrooms benefit from
    explicit instruction-grammar awareness in the language-of-
    instruction.

