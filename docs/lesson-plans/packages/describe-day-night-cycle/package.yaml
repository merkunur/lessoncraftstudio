assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Sort 12 activities into day vs night categories in 8 of 10
        trials.
      - Articulate day-night cycle ('after night comes day') in 6 of
        10 trials.
      - Connect day-night to personal routine ('I sleep at night, go
        to school in the day') in 8 of 10 trials.

    Differentiation:
    - Pre-K: 4-6 strong-contrast activities; receptive sorting.
    - K: 12 activities + cycle articulation.
    - Grade 1+: extend to Earth-rotation explanation; bridge to
      describe-water-cycle-basic (Arc 14+ candidate).

