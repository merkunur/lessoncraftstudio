# Teaching package — identify weather types beyond basic
# Arc 11 Phase 2 (Option F single-package-strand deepening; world-knowledge
# / environment-and-weather strand 1/4 → 2/4). Builds on Arc 8 identify-
# and-name-weather-words (basic weather vocab) + Arc 10 identify-four-
# seasons (seasonal context).

targetSlug: identify-weather-types
language: en
title:
  en: "Weather Types — sunny, rainy, stormy, foggy, snowy, windy"
description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching extended weather-type vocabulary. Builds on Arc 8 identify-and-name-weather-words (basic weather vocab) + Arc 10 identify-four-seasons (seasonal context). Kids learn to distinguish weather types beyond basic: sunny vs partly-cloudy vs cloudy; light-rain vs heavy-rain vs storm; foggy; misty; windy vs gusty. More precise weather vocabulary supports detailed daily-weather-chart observation. Vocab-anchored — extended weather adjectives. Composes against matching + word-guess apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class extended-weather routine. Teacher displays 6-8
      weather-type pictures with more nuance than basic (partly-
      cloudy vs fully-cloudy; light-rain vs storm; foggy; misty).
      'These are different KINDS of weather. We already know sunny,
      rainy, snowy. Today we add more precise words.' Teacher
      introduces each type. Reinforces that weather has more
      varieties than the basic set kids know.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + extended-weather routine. Each pair receives 8-10
      weather-type cards. Pair takes turns: kid A holds up a card;
      kid B names the weather type AND uses the language frame
      ('It is partly-cloudy / It is foggy / It is windy'). Recast
      errors with explanation. Optional extension: kids describe
      their own weather observations from this week using the new
      extended vocabulary.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (extended
      weather-type to image). Station 2: bingo with weather caller
      chips (extended vocabulary). Station 3: manipulative cut-outs
      hands-on weather-scene construction (kids assemble multi-
      weather-type scenes — 'a stormy day with lightning' or 'a
      foggy morning + clearing afternoon'). Station 4: word-guess
      (kids fill in weather-type letters from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class daily-weather chart update — using extended
      vocabulary. Class names today's weather using more precise
      words ('It's partly-cloudy + windy today' rather than just
      'It's cloudy'). Forward-pointer: 'Today we learned more
      weather types. When we come back to weather work next, we'll
      explore the DAY-NIGHT cycle — what happens at night that's
      different from daytime.'

