compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / sorting-and-
    classification. Secondary strand: vocabulary acquisition (vocab-
    anchored — kids name objects + their categories). Tertiary strand:
    semantic-category formation (kids develop category labels for
    object groups: animals / vehicles / fruits / vegetables / tools /
    toys / etc.).

    Architectural significance vs basic-attribute sorting trilogy:
    sort-by-color (Arc 5 Phase 3) + sort-by-shape (Arc 5 Phase 3) +
    sort-by-size (Arc 7 Phase 1) sort by VISUAL ATTRIBUTES (perceptual
    sorting). sort-by-category sorts by SEMANTIC MEANING (conceptual
    sorting) — fundamentally different cognitive operation. The two
    sorting types together build comprehensive sorting-and-
    classification strand coverage.

    Distinctive composition: 3 picture-sort exercises across 3 different
    theme-pair contrasts (animals/vehicles + fruits/vegetables +
    shapes/vehicles) + 1 matching + 1 odd-one-out. Validates that
    picture-sort architecture handles diverse semantic-category contrasts.

    Cross-strand integration: sort-by-category bridges sorting-strand
    work (cognitive domain) with vocabulary-acquisition work (early-
    literacy domain). Kids use vocabulary they acquired across Arc 1-6
    + Arc 7 Phase 1 vocab packages to identify category membership.
    The cross-strand integration deepens both strands.

    K-3 multilingual classroom relevance: semantic categorization is
    universal across cultures + cognitively appropriate for K-3.
    Category vocabulary (e.g., "animals," "vehicles," "fruits") varies
    in morphology across the 11 platform locales but conceptually
    universal.

curriculumStandards:
  - CCSS.K.MD.B.3
  - EYFS.ELG.M
  - EYFS.ELG.UW
  - IB-PYP.HowWeOrganize

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Sort 8-10 mixed objects by semantic category into 2 categories
        with 85%+ accuracy.
      - Sort 12-15 mixed objects into 3 categories with 70%+ accuracy.
      - Name the category each object belongs to in 8 of 10 trials
        (vocabulary-anchor verification + semantic-category awareness).

    Differentiation:
    - Pre-K: 2-category sorting only (animals vs vehicles).
    - K: 2-3-category sorting; mixed-object substrate.
    - Grade 1+: extend to sort-by-multiple-attributes (combines basic-
      attribute trilogy with semantic-category) — high cognitive-load
      sorting work.

