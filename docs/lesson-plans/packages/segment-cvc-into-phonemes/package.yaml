compositionalRationale:
  en: |
    Primary strand: early-literacy / phonological-awareness
    (segment-cvc-into-phonemes — STRAND-SAT-CLOSING 8/9 → 9/9
    SAT). **22nd parent-class strand SATISFIED in the catalog**
    (advances aggregate parent-class strand-saturation 21/30 →
    22/30 = 73.3% per §A.13.33 parent-class methodology).
    Final canonical target per learning-targets.json
    phonological-awareness strand enumeration (9 targets total;
    segment-cvc-into-phonemes at line 41 closes the strand).
    **3-consecutive-SAT-closure momentum** across Arc 19:
    Phase 1.1 reading-comprehension (20th) + Phase 1.2
    measurement (21st) + Phase 1.3 phonological-awareness
    (22nd) = 3 SAT closures across 3 consecutive phases. Per
    §A.13.31 per-instance content-awareness: `blend-phonemes-
    cvc/package.yaml` (Phase 1.2 Slot 4) is the canonical
    reverse-operation precedent — this package mirrors its
    Literacy 8-material + composedExercises shape with
    analysis-pedagogy adaptation.

    Architectural significance: SAT-CLOSES the phonological-
    awareness strand at 9/9 + completes the full phonological-
    awareness pedagogical cluster across all 5 canonical
    skills (rhyme + syllable + phoneme-isolation + phoneme-
    blending + phoneme-segmentation). Cognitive progression:
    rhyme-recognition (Arc 10 P1 + Phase 1.1 Slot 4) →
    syllable-counting (Arc 10 P1) → phoneme-isolation (Phase
    1.1 Slot 3 + Phase 1.2 Slots 2+3) → phoneme-blending
    synthesis (Phase 1.2 Slot 4) + onset-rime blending
    synthesis (Phase 1.3 Slot 1) → phoneme-segmentation
    analysis (this package). Closing the strand here completes
    the K phonological-awareness foundation that underlies
    systematic phonics-decoding pedagogy + emergent reading
    fluency.

    **Phonological-awareness cluster significance:** Phase
    1.1 Slots 3+4 + Phase 1.2 Slots 2+3+4 + Phase 1.3 Slots
    1+2 = **7-package phonological-awareness cluster** + 2
    pre-existing (identify-rhyming-pairs + count-syllables-1-
    to-3 from Arc 10 P1) = full 9/9 strand cluster. This is
    a CANDIDATE FOR Arc 19 P2 close-out NEW phonological-
    awareness-bundle creation per §A.13.38 — alongside
    character-knowledge-bundle + numeracy-bundle Arc 18 P2
    docs residuals. The bundle would package the complete
    K phonological-awareness pedagogical sequence for
    teachers who want the full cluster as a unit.

    Per §A.13.30 K-1 informal framing: K segmentation work
    is CONCRETE SOUND-DECOMPOSITION via Elkonin-box
    methodology. Kid sees 3 empty boxes drawn on paper +
    taps each box while pronouncing each phoneme slowly.
    The pedagogy uses everyday language ('segment' / 'pull
    apart' / 'separate sounds') + kinesthetic anchoring
    (box-tapping; one tap per sound). NOT formal phonological-
    decomposition theory pedagogy — phonemic-feature analysis
    + autosegmental phonology + metrical phonology are post-
    Grade-3 academic work. Critical pedagogical move
    documented in contentActivity: SLOW-STRETCHED
    PRONUNCIATION + box-tapping kinesthetic anchor. Common
    error patterns addressed via re-segmentation:
    treating consonant blend as one sound, treating long-
    vowel words as 4 sounds, miscounting due to letter-name
    confusion. All three patterns are developmentally
    typical for K + addressed in differentiation.

    Per §A.13.29 ground-truth source-citation: composedExercises
    cite `REFERENCE APPS/word-guess.html` (clue-density mode
    for missing-letter-position work that segmentation
    supports) + `REFERENCE APPS/matching.html` (imgname mode
    for picture-to-Elkonin-box pairing) + `REFERENCE APPS/
    picture-sort.html` (theme mode for phoneme-count
    categorization) + `REFERENCE APPS/word-scramble.html`
    (unified mode for letter-position-to-sound reinforcement).

    Cross-reference to blend-phonemes-cvc (Phase 1.2 Slot 4;
    pair-coherent reverse-operation): segmentation is the
    cognitive INVERSE of blending. Same 3 phonemes; opposite
    direction. Blending puts /c/+/a/+/t/ together into 'cat';
    segmentation pulls 'cat' apart into /c/+/a/+/t/. Kids who
    master both operations have full bidirectional phonemic
    awareness — the canonical foundation for reading + early
    spelling. The two packages form the structural pair that
    completes the synthesis+analysis dimension of
    phonological-awareness work.

    Cross-reference to read-cvc-words (Arc 6 P1; phonics-
    decoding strand-start): segmentation is the cognitive
    operation underlying CVC decoding from the kid's side.
    When a kid sees printed CAT + sounds out each letter +
    blends to read 'cat', the implicit prerequisite is that
    the kid can SEGMENT spoken 'cat' into 3 sounds (so the
    written 3 letters → 3 sounds mapping makes sense).
    Phonological-awareness segmentation (this package; oral-
    only) + read-cvc-words (phonics decoding; written CVC →
    sounded-out → read) form the foundational reading-skill
    pair from oral + written sides. **The §A.13.34 parallel-
    strand-framing applies here too:** segmentation in
    phonological-awareness vs phonics-decoding work operates
    at different strand boundaries per the symbol-dimension
    (oral-only vs symbol-integrated). See Phase 1.2 Slot 4
    blend-phonemes-cvc compositionalRationale for the
    canonical §A.13.34 strand-boundary discipline.

    Materials note: 8-material Literacy class stack per
    §A.13.37 + Phase 1.1+1.2 phonological-awareness cluster
    canonical precedents. Materials structure mirrors
    isolate-initial/final/medial-phoneme + blend-phonemes-
    cvc + blend-onset-rime verbatim (theme: animals provides
    familiar K-1 CVC vocabulary for segmentation work — cat
    /c-a-t/ + dog /d-o-g/ + pig /p-i-g/ + hen /h-e-n/ + bat
    /b-a-t/ + bus /b-u-s/ all decompose cleanly into 3
    phonemes). Manipulative-cut-outs at position 6 emits
    canonical-correct `mode: single-repeat` per §A.13.35.

    Distinctive composition: word-guess at position 1
    (introduction) — the missing-letter format naturally
    surfaces segmentation work (kid sees C_T + picture cue,
    segments the heard word to identify the missing-position
    phoneme). Matching ×2 (positions 2+5) + picture-sort
    (position 3; phoneme-count categorization) + word-
    scramble (position 4). Same composition shape as Phase
    1.2 Slot 4 blend-phonemes-cvc — analysis + synthesis
    operations both benefit from word-guess's incomplete-
    letter affordance because the missing letter forces the
    kid to segment the heard word + identify the position-
    specific phoneme.

    Class B FLEXIBLE substrate: composes against animals
    theme (vocab-anchored with familiar K-1 CVC vocabulary;
    cross-arc theme consistency with Phase 1.1+1.2 cluster).
    No substrate gaps; ships clean.

    K-3 multilingual classroom relevance: segmentation is
    universal K early-literacy content BUT segmentation
    pedagogy differs per locale's phonological structure.
    English (consonant-cluster permissive; CVC-dominant)
    teaches phonemic segmentation via Elkonin-boxes as the
    canonical methodology. pt-BR (CV-syllable-dominant) +
    Italian + Spanish typically introduce syllabic-
    segmentation first + phonemic-segmentation later per
    BR-MEC / Italian / Spanish ministerial frameworks.
    Multilingual K-3 classrooms benefit from explicit
    segmentation work in the language-of-instruction strategy
    + awareness that home-language segmentation strategies
    may differ structurally.

