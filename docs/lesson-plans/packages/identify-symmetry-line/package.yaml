compositionalRationale:
  en: |
    Primary strand: math / geometry (notice lines of
    symmetry in simple shapes — extends strand 5/8 → 6/8
    after Phase 1.3 compose-shapes-from-parts; brings the
    strand to 6/8 → 7/8). Secondary strand: spatial-
    reasoning (kids mentally + physically reason about
    whether halves match under a fold). Tertiary strand:
    visual discrimination (noticing exact-match vs near-
    match between two halves).

    Architectural significance: extends geometry strand
    from shape-recognition + composition work into spatial-
    relation noticing. Per §A.13.30 audience-perspective
    discipline + commission spec: K-3 framing is NOTICING /
    SPOTTING symmetry, NOT formal axis-of-symmetry
    identification. The formal Grade 4 standard CCSS.4.G.A.3
    (recognize a line of symmetry as a line across the
    figure such that the figure can be folded along the
    line into matching parts; identify line-symmetric
    figures and draw lines of symmetry) lives outside K-3
    scope; this package teaches the K-3-appropriate
    informal noticing skill via folding + matching
    activities. EYFS.ELG.UW partial fit at K-2 level (the
    EYFS Understanding the World ELG includes spatial
    awareness + observation of features).

    K-3 noticing vs Grade-4 formal identification:
    - K-3 (this package): physical folding of paper shapes
      to see whether halves match; spot fold-lines
      informally; count fold-lines for familiar simple
      shapes (heart, square, rectangle); recognize
      'symmetry vs no symmetry' as a binary distinction.
    - Grade 4 (CCSS.4.G.A.3, outside K-3 scope):
      identify lines of symmetry on more complex figures;
      distinguish reflective from rotational symmetry;
      draw exact symmetry lines using rulers + protractors.

    Pair-coherent context: Phase 1.3 compose-shapes-from-
    parts opened spatial-composition work; this package
    opens spatial-relation noticing — together they build
    the K-3 spatial-reasoning foundation that grounds
    later partition + fraction-of-shape work (partition-
    shape-halves-quarters is the 8th geometry canonical;
    deferred to Phase 1.5+).

    Distinctive composition: 3 matching (intro +
    consolidation + assessment — multiple matching slots
    because the matching mechanic is canonical for shape-
    property pairing work) + 1 picture-sort (sort shapes
    with-symmetry vs without-symmetry; the binary noticing
    skill) + 1 missing-pieces (complete the symmetric
    half — the reasoning task that tests whether kids
    really internalized the symmetry concept). The
    matching variety at positions 1, 4, 5 surfaces
    different aspects of the same symmetry-noticing skill:
    shape-to-line-count (position 1); shape-to-mirror-
    partner (position 4); shape-to-property-statement
    (position 5).

    Class B FLEXIBLE substrate: composes against shapes
    theme (geometry strand canonical theme per Phase 1.3
    compose-shapes-from-parts + Arc 9 identify-2d-shapes-
    basic + Arc 14 describe-shape-attributes precedents).

    K-3 multilingual classroom relevance: symmetry-noticing
    is universal K-3 spatial-reasoning content. The
    folding-and-matching activity is locale-portable —
    the visual judgment is the same in every locale.
    Cross-locale symmetry vocabulary: en 'line of
    symmetry' / 'symmetry' / 'mirror image'; de
    'Symmetrieachse' / 'Spiegelbild' (mirror-image); es
    'eje de simetría' / 'simetría' / 'reflexión'; pt
    'eixo de simetria' / 'simetria'; fr 'axe de symétrie'
    / 'symétrie'; fi 'symmetria-akseli'. The mathematical
    word 'symmetry' is cognate-rich Romance + Germanic
    (cognate with Greek 'symmetria'); pedagogical work is
    locale-portable. Locale-variant work at Phase 3+
    adapts symmetry-vocabulary register.

curriculumStandards:
  - EYFS.ELG.UW
  - CCSS.4.G.A.3 (formal Grade 4 standard; outside K-3 scope but anchors the conceptual target)
  - EYFS.ELG.M
  - IB-PYP.HowTheWorldWorks

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Notice whether a given shape has symmetry (binary
        yes/no judgment) in 8 of 10 trials.
      - Identify the count of symmetry lines for the most
        familiar simple shapes — heart (1), square (4),
        rectangle (2), equilateral triangle (3), circle
        ('many' or 'lots') — in 6 of 10 trials.
      - Physically fold paper shapes to discover symmetry
        lines in 7 of 10 trials.
      - Complete the symmetric half of a shape (given the
        left half, sketch the right half so the halves
        match) in 5 of 10 trials.

    Differentiation:
    - Pre-K: skip the symmetry-count quantification; just
      explore folding paper shapes informally — the
      noticing skill is enough at Pre-K.
    - K: introduce symmetry vs no-symmetry binary
      distinction; full count quantification deferred to
      Grade 1.
    - Grade 1: count quantification for familiar simple
      shapes (heart, square, rectangle, equilateral
      triangle, letter A); bridge to noticing in real-
      world images (butterflies, flowers, faces).
    - Grade 2+: extend to more complex shapes
      (pentagons, hexagons); introduce 'reflective
      symmetry' as a name for what kids have been doing;
      bridge to formal Grade 4 axis-of-symmetry work.

