compositionalRationale:
  en: |
    Primary strand: math / geometry (partition shapes into
    equal parts — extends strand 7/8 alongside slot-4 pair
    partner identify-fractions-half-third-quarter; together
    the pair saturates the strand 8/8). Secondary strand:
    spatial-reasoning (the visual-structural work of seeing
    a whole as equal parts + equal parts as a whole).
    Tertiary strand: vocabulary-acquisition (partition
    vocabulary: equal, equal parts, partition, halves,
    fourths, quarters, whole, share).

    Architectural significance: extends geometry strand
    from spatial-composition reasoning (Arc 17 P1.3
    compose-shapes-from-parts) into EQUAL-PARTS partition
    reasoning. Where compose-shapes-from-parts taught that
    shapes have part-whole structure with ANY decomposition
    (a house = square + triangle on top; equally a rocket
    = rectangle + triangle + small rectangles), this
    package adds the EQUAL-PARTS CONSTRAINT — two equal
    pieces are halves; four equal pieces are quarters.
    Unequal pieces don't get those names. This is the K-3
    anchor for later fraction work: a fraction names an
    equal-part share of a whole. Pair partner identify-
    fractions-half-third-quarter (slot 4) extends the
    named-equal-parts vocabulary work to ALSO cover thirds
    (which CCSS.2.G.A.3 introduces at Grade 2) — together
    the pair saturates the geometry strand 8/8 (23rd
    saturated strand in the catalog).

    Per §A.13.30 K-foundational-informal framing: K-1
    partition work introduces the equal-share VOCABULARY
    (halves, quarters, fourths) + the VISUAL STRUCTURE of
    partitioned shapes. Formal fraction notation (1/2 + 1/4
    + 1/3 written symbolically) is Grade 3+ work per
    CCSS.3.NF.A and explicitly out of scope here. Kids
    leave this unit able to identify partitioned shapes by
    name + reconstruct wholes from parts; they do NOT need
    to write fractions in numeric form. The visual + verbal
    vocabulary is the load-bearing K-1 fluency target.

    Distinctive composition: 2 matching (intro + assessment,
    bookending the partition-recognition work) + 1 missing-
    pieces (canonical app for partition gap-completion —
    given a partial partitioned shape, kids identify the
    missing equal-part piece) + 1 grid-match (spatial-fit
    work; kids fit equal-part pieces into a grid to
    reconstruct the whole) + 1 picture-sort (sorting
    partitioned shapes into halves vs quarters categories;
    surfaces the equal-parts-counting structure 2 vs 4).
    Composition shape mirrors Arc 17 P1.3 compose-shapes-
    from-parts exactly (2 matching + 1 missing-pieces + 1
    grid-match + 1 picture-sort) — partition is composition's
    reverse with equal-parts constraint, so the same
    pedagogical app shape applies.

    Materials note: 7-material Geometry-as-Numeracy-subclass
    class stack per §A.13.37. Manipulative-cut-outs at
    position 5 emits canonical-correct `mode: variety` with
    vocabKey enumeration of fraction-piece shapes (whole-
    circle, half-circle, quarter-circle, whole-square, half-
    square, quarter-square, whole-rectangle, half-rectangle,
    quarter-rectangle) at itemCount 3. This is the canonical
    §A.13.35 mode-correct shape — diverges from the Arc 17
    P1.3 compose-shapes-from-parts precedent's `mode: single-
    repeat itemCount: 60 themeName: shapes` (which carried
    pre-correction mode semantics); Phase 1.1 ships canonical-
    correct on the mode dimension per operator adjudication
    at Arc 18 Phase 0 §A.13.6 firings batch. The vocabKey-
    enumerated approach makes the partition pedagogy explicit:
    each fraction-piece shape is a discrete vocab item, and
    kids physically sort + match them.

    Class B FLEXIBLE substrate: composes against shapes
    theme (geometry strand canonical theme — cross-arc
    consistency with identify-2d-shapes-basic + identify-
    3d-shapes + describe-shape-attributes + compose-shapes-
    from-parts).

    K-3 multilingual classroom relevance: partition pedagogy
    is universal K-3 geometry content. The equal-parts
    structure is locale-portable — two equal pieces are
    halves in every language; four equal pieces are
    quarters in every language. The VOCABULARY varies
    notably across locales: en 'halves' + 'quarters' /
    'fourths' (note the en doublet — quarter and fourth are
    interchangeable); de 'Hälften' + 'Viertel'; es 'mitades' +
    'cuartos'; pt 'metades' + 'quartos'; fr 'moitiés' +
    'quarts'; it 'metà' + 'quarti'; nl 'helften' + 'kwarten'
    / 'vierden'; fi 'puoliskot' + 'neljannekset'. The hands-
    on cut-out work bypasses much of the vocabulary load —
    kids do the partition manipulation regardless of which
    vocabulary they're learning. Locale-variant work at
    Phase 3+ adapts to each locale's partition register
    (some locales like en + nl have doublets; others like
    de + es + pt use a single canonical term per partition).

