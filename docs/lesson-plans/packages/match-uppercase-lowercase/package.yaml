# Teaching package — match uppercase + lowercase letters
# Arc 12 Phase 1 (early-literacy / letter-recognition 3/6 → 4/6).
# RESOLVES Arc 11 identify-lowercase-letters forward-pointer.

targetSlug: match-uppercase-lowercase
language: en
title:
  en: "Uppercase + Lowercase Pairs — match A to a, B to b, C to c"
description:
  en: "Kindergarten early-literacy package teaching uppercase-to-lowercase letter pairing. Builds on Arc 10 identify-uppercase-letters + Arc 11 identify-lowercase-letters. RESOLVES Arc 11 forward-pointer ('match uppercase with lowercase letters — recognizing A and a are the same letter, just different sizes'). Foundational alphabet-knowledge milestone: kids recognize that uppercase + lowercase letter forms are the SAME letter. Vocab-anchored. Composes against alphabet-train + matching apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class case-pairing routine. Teacher displays uppercase A
      next to lowercase a; uppercase B next to lowercase b; uppercase
      C next to lowercase c. "These pairs are the SAME letter — just
      different sizes. A and a are both the letter A. B and b are
      both the letter B." Class chants letter pairs. Repeat with all
      26 letter-pairs. Reinforces same-letter-different-shape framing.
      Highlight visually-similar pairs (Cc, Oo, Ss, Pp, Vv, Ww, Xx,
      Zz) vs visually-distinct pairs (Aa, Ee, Gg, Rr).
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + case-pair-match routine. Each pair receives 26
      uppercase cards + 26 lowercase cards (52 total). Pair takes
      turns: kid A draws an uppercase letter; kid B finds the
      matching lowercase. Recast errors with explanation ("you
      paired G with q — let's compare: G has a curve like a half-
      circle; q has a tail going down. Look more carefully — G goes
      with g, which has a curve like its uppercase but smaller").
      Optional extension: kids sort all 52 cards into 26 case-pairs
      independently.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: alphabet-train worksheet (kids
      identify case-pairs in train-themed visual). Station 2: matching
      worksheet (uppercase to lowercase pairs). Station 3: manipulative
      cut-outs hands-on case-pair-construction (kids assemble 26 case-
      pair displays). Station 4: vocabulary-tracing-strips with mixed
      uppercase + lowercase letters in target-language vocabulary
      words.
  closure:
    durationMinutes: 5
    body: |
      Whole-class pair-quiz routine. Teacher shows uppercase letters;
      class names the lowercase pair. Reverse: teacher shows lowercase;
      class names the uppercase pair. Forward-pointer: "Today we
      matched uppercase + lowercase pairs. When we come back to
      letters next, we'll learn LETTER SOUNDS — what each letter
      SOUNDS like: A makes the 'aaa' sound; B makes 'buh'; C makes
      'kuh' or 'sss' — connecting letter shapes to letter sounds for
      reading."

