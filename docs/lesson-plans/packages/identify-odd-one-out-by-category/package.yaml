compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / logical-reasoning.
    Secondary strand: vocabulary acquisition (vocab-anchored). Tertiary
    strand: exclusion-reasoning + verbalization (kids must articulate
    WHY the odd one is odd — develops meta-cognitive reasoning vocabulary).

    Companion to sort-by-category (Phase 2 sibling): both packages
    work with semantic-category awareness, but inverse cognitive
    operations — sort-by-category groups by category-membership;
    odd-one-out-by-category identifies the non-member. The two
    together build comprehensive semantic-category reasoning.

    Distinctive composition: 4 odd-one-out exercises across 4 theme
    contexts (animals, vehicles, fruits, shapes) + 1 matching at
    position 2. Higher app-density reflects the target — kids practice
    odd-one-out reasoning across diverse vocabulary contexts to
    generalize the exclusion-reasoning skill.

    Cross-strand integration: odd-one-out is a recurring exercise
    across many Arc 1-7 packages (used as consolidation surface in
    most packages). This is the FIRST package where odd-one-out IS
    the target rather than a supporting exercise — validates that
    exclusion-reasoning warrants strand-coverage.

    K-3 multilingual classroom relevance: exclusion-reasoning is
    cognitively universal; verbalization-of-reasoning ("WHY is it
    odd?") is the language-bound layer. Kids in target-language-
    immersion contexts may identify the odd one quickly but struggle
    to articulate WHY in target language — the package's discussion
    surfaces are the key language-development opportunity.

curriculumStandards:
  - EYFS.ELG.M
  - EYFS.ELG.UW
  - IB-PYP.HowTheWorldWorks

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the odd one out in 4-item sets in 8 of 10 trials.
      - Articulate the reasoning ("the others are X; this one is Y") in
        6 of 10 trials.
      - Name all items in the set in 8 of 10 trials (vocabulary-anchor
        verification).

    Differentiation:
    - Pre-K: 3-item sets (2 same + 1 odd); strong category contrast.
    - K: 4-item sets; clearer category contrast.
    - Grade 1+: 4-5-item sets with subtler distinctions; bridge to
      identify-odd-one-out-by-attribute (future-arc cognitive-strand
      depth) where odd-one-out is by visual attribute rather than
      semantic category.

