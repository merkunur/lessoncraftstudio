assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Use 6 of 8 extended prepositions correctly in oral position-
        description in 6 of 8 trials.
      - Match preposition word to position-scene picture in 7 of 8 trials
        (receptive).
      - Use prepositions in spontaneous classroom speech (e.g., "my
        backpack is BETWEEN the two desks") within the 1-week unit
        window.

    Differentiation:
    - Pre-K: 4-preposition core only (in, on, under, next-to) — same
      as use-position-vocabulary. This package not appropriate for Pre-K.
    - K: 8-preposition extended set; receptive surface stronger than
      productive.
    - Grade 1+: full 8-preposition productive use + extension to use-
      direction-vocabulary (left / right / up / down) + cardinal/
      ordinal direction work.

