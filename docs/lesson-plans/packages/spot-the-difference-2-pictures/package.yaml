# Teaching package — spot the differences between 2 similar pictures
# Arc 7 Phase 2 (Option A continuation; fine-motor-and-visual-spatial /
# visual-discrimination strand). Class B FLEXIBLE; vocab-anchored. Builds
# on Arc 6 Phase 2 visual-discrimination trio (match-image-to-shadow +
# match-image-piece-to-whole + find-missing-piece).

targetSlug: spot-the-difference-2-pictures
language: en
title:
  en: "Spot the Difference — find what changed between two pictures"
description:
  en: "Kindergarten-Grade 1 fine-motor-and-visual-spatial package teaching detail-attention through spot-the-difference puzzles. Kids compare two similar pictures and identify 3-5 small differences. Builds on Arc 6 Phase 2 visual-discrimination trio. Vocab-anchored — kids name the differences they find. Composes against find-objects app + image-library breadth. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher displays 2 pictures of the same
      scene with 3-5 subtle differences (color change; missing item;
      different pose). "Look carefully — what's different?" Class
      collaboratively spots differences chorally. Reinforces detail-
      attention skill + vocabulary (kids name the differing items).
      Pin to "Visual Skills" word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine. Teacher displays new picture-pair sets;
      class identifies all differences. Pair work: kid A holds one
      picture; kid B holds a similar but different picture; together
      they describe what's different in each ("In MY picture there's
      a red ball; in YOUR picture the ball is blue"). Develops
      productive vocabulary while training visual-discrimination
      attention.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: spot-the-difference worksheet (kids
      circle differences between picture-pairs). Station 2: matching
      worksheet (image-name reinforces vocabulary used in pictures).
      Station 3: manipulative cut-outs same/different sorting (kids
      sort objects as "exactly the same" vs "different in some way" —
      reinforces visual-discrimination at the macro level).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays a final picture-pair;
      class collectively spots all differences. Forward-pointer:
      "Today we trained our eyes to spot small differences. When we
      come back to visual puzzles next, we'll do MORE detail-attention
      puzzles — finding hidden objects in busy scenes."

