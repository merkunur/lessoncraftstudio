<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Grid Match - Professional Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #2D2D2D 0%, #1a1a1a 100%); overflow: hidden;">

        <!-- Subtle texture overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image: url('data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"4\" height=\"4\"><rect fill=\"%23fff\" x=\"0\" y=\"0\" width=\"1\" height=\"1\"/></svg>'); background-size: 4px 4px;"></div>

        <!-- Spotlight beams -->
        <div style="position: absolute; top: -50px; left: 200px; width: 180px; height: 600px; background: linear-gradient(180deg, rgba(255,215,0,0.15) 0%, transparent 100%); transform: rotate(-5deg); filter: blur(20px);"></div>
        <div style="position: absolute; top: -50px; left: 50%; transform: translateX(-50%); width: 200px; height: 650px; background: linear-gradient(180deg, rgba(255,215,0,0.2) 0%, transparent 100%); filter: blur(25px);"></div>
        <div style="position: absolute; top: -50px; right: 200px; width: 180px; height: 600px; background: linear-gradient(180deg, rgba(255,215,0,0.15) 0%, transparent 100%); transform: rotate(5deg); filter: blur(20px);"></div>

        <!-- FREE Badge - Museum Ticket Style -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="background: linear-gradient(145deg, #D4AF37 0%, #B8860B 100%); padding: 0; border-radius: 6px; box-shadow: 0 6px 25px rgba(212,175,55,0.4); position: relative; overflow: hidden;">
                <!-- Perforated edge effect -->
                <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 20px; background: repeating-linear-gradient(0deg, transparent, transparent 8px, #2D2D2D 8px, #2D2D2D 10px);"></div>
                <div style="padding: 15px 35px 15px 20px;">
                    <div style="font-family: 'Playfair Display', serif; font-size: 12px; color: rgba(0,0,0,0.6); letter-spacing: 2px; margin-bottom: 2px;">ADMIT ONE</div>
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: #1a1a1a;">FREE</span>
                </div>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: rgba(212,175,55,0.15); border: 2px solid #D4AF37; padding: 10px 22px; border-radius: 4px;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: #D4AF37; letter-spacing: 2px;">GRADES PreK-2</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 90px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Playfair Display', serif; font-weight: 600; font-size: 68px; color: #F5F5DC; margin: 0; letter-spacing: 4px;">GRID MATCH</h1>
            <h2 style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 28px; color: #D4AF37; margin: 8px 0 0 0; letter-spacing: 6px;">WORKSHEETS BUNDLE</h2>
            <div style="width: 300px; height: 2px; background: linear-gradient(90deg, transparent, #D4AF37, transparent); margin: 15px auto 0;"></div>
            <p style="font-family: 'Nunito', sans-serif; font-size: 14px; color: rgba(245,245,220,0.5); margin: 12px 0 0 0; letter-spacing: 4px;">TEACHER-READY QUALITY</p>
        </div>

        <!-- Gallery Wall with Framed Worksheets -->
        <div style="position: absolute; top: 260px; left: 50%; transform: translateX(-50%); width: 900px; height: 420px;">

            <!-- Left Frame (smaller) -->
            <div style="position: absolute; left: 50px; top: 40px;">
                <!-- Ornate frame -->
                <div style="background: linear-gradient(145deg, #D4AF37 0%, #8B7355 100%); padding: 12px; border-radius: 4px; box-shadow: 0 15px 40px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);">
                    <!-- Inner matte (teal) -->
                    <div style="background: #004D40; padding: 10px;">
                        <img src="https://www.lessoncraftstudio.com/samples/english/grid%20match/sample-5.jpeg" style="width: 180px; height: 232px; object-fit: cover; display: block;">
                    </div>
                </div>
            </div>

            <!-- Center Frame (largest - main focus) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%);">
                <!-- Ornate gold frame -->
                <div style="background: linear-gradient(145deg, #D4AF37 0%, #8B7355 50%, #D4AF37 100%); padding: 16px; border-radius: 4px; box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.3), 0 0 100px rgba(212,175,55,0.2);">
                    <!-- Inner carved detail -->
                    <div style="background: linear-gradient(145deg, #B8860B 0%, #8B7355 100%); padding: 4px;">
                        <!-- Burgundy matte -->
                        <div style="background: #4A1C2C; padding: 14px;">
                            <img src="https://www.lessoncraftstudio.com/samples/english/grid%20match/sample-6.jpeg" style="width: 220px; height: 284px; object-fit: cover; display: block;">
                        </div>
                    </div>
                </div>
                <!-- Small plaque under center frame -->
                <div style="position: absolute; bottom: -35px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #D4AF37 0%, #B8860B 100%); padding: 6px 20px; border-radius: 3px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                    <span style="font-family: 'Playfair Display', serif; font-size: 11px; color: #1a1a1a; font-style: italic;">The Art of Puzzle Learning</span>
                </div>
            </div>

            <!-- Right Frame (smaller) -->
            <div style="position: absolute; right: 50px; top: 40px;">
                <div style="background: linear-gradient(145deg, #D4AF37 0%, #8B7355 100%); padding: 12px; border-radius: 4px; box-shadow: 0 15px 40px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);">
                    <!-- Inner matte (teal) -->
                    <div style="background: #004D40; padding: 10px;">
                        <img src="https://www.lessoncraftstudio.com/samples/english/grid%20match/sample-5-answer.jpeg" style="width: 180px; height: 232px; object-fit: cover; display: block;">
                    </div>
                </div>
            </div>
        </div>

        <!-- Glass-morphism Feature Cards -->
        <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px;">
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(212,175,55,0.3); padding: 14px 22px; border-radius: 8px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #F5F5DC;">Print Ready</span>
            </div>
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(212,175,55,0.3); padding: 14px 22px; border-radius: 8px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #F5F5DC;">No Prep Needed</span>
            </div>
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(212,175,55,0.3); padding: 14px 22px; border-radius: 8px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #F5F5DC;">Answer Keys</span>
            </div>
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(212,175,55,0.3); padding: 14px 22px; border-radius: 8px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #F5F5DC;">Self-Checking</span>
            </div>
        </div>

        <!-- Gold accent line at bottom -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, transparent 10%, #D4AF37 30%, #D4AF37 70%, transparent 90%);"></div>

        <!-- Corner accents -->
        <div style="position: absolute; top: 15px; left: 15px; width: 40px; height: 40px; border-top: 2px solid rgba(212,175,55,0.4); border-left: 2px solid rgba(212,175,55,0.4);"></div>
        <div style="position: absolute; top: 15px; right: 15px; width: 40px; height: 40px; border-top: 2px solid rgba(212,175,55,0.4); border-right: 2px solid rgba(212,175,55,0.4);"></div>
        <div style="position: absolute; bottom: 15px; left: 15px; width: 40px; height: 40px; border-bottom: 2px solid rgba(212,175,55,0.4); border-left: 2px solid rgba(212,175,55,0.4);"></div>
        <div style="position: absolute; bottom: 15px; right: 15px; width: 40px; height: 40px; border-bottom: 2px solid rgba(212,175,55,0.4); border-right: 2px solid rgba(212,175,55,0.4);"></div>

    </div>
</body>
</html>
