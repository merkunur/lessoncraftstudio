compositionalRationale:
  en: |
    Primary strand: geometry / spatial-reasoning. Secondary strand: vocabulary
    acquisition (shape names as a lexical set). Tertiary strand: visual
    discrimination (shape vs shadow, shape vs background, shape vs odd-one-out).

    Distinctive material weighting: 7 materials (smaller than vocab packages'
    8) because flashcards + picture-cards collapse to a single layout variant
    given the 4-key cluster size (no need for two card-layout variants). The
    matching-mat is added as a vocabulary-game surface where kids physically
    pair the 4 shapes with their 4 names.

    Cross-strand integration: identify-2d-shapes-basic is foundational to
    identify-2d-shapes-extended (Phase 3) which adds 6 more shapes (oval,
    diamond, star, heart, pentagon, hexagon) and to identify-3d-shapes
    (Phase 2 companion). The shape vocabulary established here threads
    through pattern-recognition, sorting-by-shape, and geometric-attribute
    targets across Arc 5+ authoring.

    K-3 multilingual classroom relevance: shape names are early-acquired
    vocabulary in every locale; shape-recognition is universal across cultural
    contexts; the 4-shape set is age-appropriate for Pre-K and K. Grade 1+
    extends to identify-2d-shapes-extended without re-teaching the basic 4.

curriculumStandards:
  - CCSS.K.G.A.2
  - CCSS.K.G.A.3
  - EYFS.ELG.M
  - IB-PYP.HowTheWorldWorks

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify each of the 4 shapes by name in 4 of 4 trials (receptive).
      - Name each of the 4 shapes when shown the shape in 3 of 4 trials (productive).
      - Sort mixed shapes onto correct category mats in 8 of 10 trials.

    Differentiation:
    - Pre-K: receptive only (point-to-named-shape).
    - K: full productive + classroom shape-hunt fluency.
    - Grade 1+: extend to identify-2d-shapes-extended (10-shape set) +
      describe-shape-attributes (sides, corners, vertices count).

