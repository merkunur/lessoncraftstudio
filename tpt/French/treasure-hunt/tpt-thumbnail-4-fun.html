<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Chasse au Trésor — Miniature Amusant</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #FFF8E1 0%, #FFECB3 40%, #FFD54F 100%); overflow: hidden;">

        <!-- Decorative shapes -->
        <div style="position: absolute; top: -30px; right: -30px; width: 180px; height: 180px; background: #F57F17; border-radius: 50%; opacity: 0.15;"></div>
        <div style="position: absolute; bottom: -20px; left: -20px; width: 160px; height: 160px; background: #F57F17; border-radius: 50%; opacity: 0.1;"></div>

        <!-- Star decoration -->
        <div style="position: absolute; top: 80px; right: 80px; font-size: 26px; opacity: 0.5;">⭐</div>
        <div style="position: absolute; bottom: 160px; right: 130px; font-size: 20px; opacity: 0.4;">⭐</div>

        <!-- FREE badge -->
        <div style="position: absolute; top: 20px; left: 22px; z-index: 100;">
            <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #F44336 0%, #D32F2F 100%); clip-path: polygon(50% 0%, 61% 15%, 80% 10%, 75% 28%, 95% 40%, 82% 52%, 90% 72%, 73% 68%, 62% 88%, 50% 76%, 38% 88%, 27% 68%, 10% 72%, 18% 52%, 5% 40%, 25% 28%, 20% 10%, 39% 15%); display: flex; align-items: center; justify-content: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">GRATUIT</span>
            </div>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 25px; left: 0; right: 0; text-align: center; z-index: 10;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #D32F2F; margin: 0; text-shadow: 2px 3px 0 rgba(211,47,47,0.12);">Chasse au Trésor</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 32px; color: #F57F17; margin: 4px 0 0 0;">+ Corrigés inclus !</h2>
        </div>

        <!-- Two side-by-side worksheets -->
        <div style="position: absolute; top: 160px; left: 50%; transform: translateX(-50%); width: 800px; height: 520px; display: flex; gap: 40px; justify-content: center;">

            <!-- Worksheet (left) -->
            <div style="position: relative;">
                <div style="width: 340px; height: 440px; background: white; border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,0.18); border: 5px solid #FFC107; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/french/treasure%20hunt/Chasse%20au%20Tr%C3%A9sor%201.webp" style="width: 100%; height: 100%; object-fit: cover;" alt="Fiche chasse au trésor">
                </div>
                <div style="position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); background: #F57F17; padding: 8px 24px; border-radius: 20px; box-shadow: 0 4px 12px rgba(245,127,23,0.4);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; color: white;">Fiche</span>
                </div>
            </div>

            <!-- Plus sign between -->
            <div style="display: flex; align-items: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 60px; color: #F57F17;">+</span>
            </div>

            <!-- Answer key (right) -->
            <div style="position: relative;">
                <div style="width: 340px; height: 440px; background: white; border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,0.18); border: 5px solid #FFC107; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/french/treasure%20hunt/answer_key.webp" style="width: 100%; height: 100%; object-fit: cover;" alt="Corrigé chasse au trésor">
                </div>
                <!-- Check badge -->
                <div style="position: absolute; top: -14px; right: -14px; width: 50px; height: 50px; background: #F57F17; border-radius: 50%; box-shadow: 0 4px 12px rgba(245,127,23,0.4); display: flex; align-items: center; justify-content: center; z-index: 10;">
                    <span style="color: white; font-size: 28px;">✓</span>
                </div>
                <div style="position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); background: #FFB300; padding: 8px 24px; border-radius: 20px; box-shadow: 0 4px 12px rgba(255,179,0,0.4);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; color: white;">Corrigé</span>
                </div>
            </div>
        </div>

        <!-- Feature pills row -->
        <div style="position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px;">
            <div style="background: white; padding: 12px 20px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px;">
                <div style="width: 32px; height: 32px; background: #E91E63; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><span style="font-size: 16px;">🎨</span></div>
                <div>
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #333;">Images</span><br>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 11px; color: #888;">mignonnes</span>
                </div>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px;">
                <div style="width: 32px; height: 32px; background: #F57F17; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><span style="font-size: 16px;">🎓</span></div>
                <div>
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #333;">Niveaux</span><br>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 11px; color: #888;">GS–CE1</span>
                </div>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px;">
                <div style="width: 32px; height: 32px; background: #FFB300; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><span style="font-size: 16px;">📋</span></div>
                <div>
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #333;">Sans</span><br>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 11px; color: #888;">préparation</span>
                </div>
            </div>
        </div>

        <!-- Bottom bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(90deg, #E65100, #F57F17); display: flex; align-items: center; justify-content: center; gap: 60px;">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white;">100%</span><br>
                <span style="font-family: 'Nunito', sans-serif; font-size: 12px; color: rgba(255,255,255,0.8);">Complet</span>
            </div>
            <div style="width: 1px; height: 40px; background: rgba(255,255,255,0.3);"></div>
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white;">✓</span><br>
                <span style="font-family: 'Nunito', sans-serif; font-size: 12px; color: rgba(255,255,255,0.8);">Tous les corrigés</span>
            </div>
            <div style="width: 1px; height: 40px; background: rgba(255,255,255,0.3);"></div>
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white;">🖨️</span><br>
                <span style="font-family: 'Nunito', sans-serif; font-size: 12px; color: rgba(255,255,255,0.8);">Imprimer et c'est parti</span>
            </div>
            <div style="width: 1px; height: 40px; background: rgba(255,255,255,0.3);"></div>
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white;">GRATUIT</span><br>
                <span style="font-family: 'Nunito', sans-serif; font-size: 12px; color: rgba(255,255,255,0.8);">Télécharger maintenant</span>
            </div>
        </div>

    </div>
</body>
</html>
