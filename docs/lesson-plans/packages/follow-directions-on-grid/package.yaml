# Teaching package — follow simple directions on a grid
# Arc 7 Phase 2 (Option A continuation; fine-motor-and-visual-spatial /
# spatial-reasoning strand). Class B FLEXIBLE; vocab-anchored. Uses
# direction vocabulary (left / right / up / down) + spatial reasoning
# on a grid surface. Bridges from use-position-vocabulary (Arc 5 Phase 2)
# + use-spatial-position-words (Arc 6 Phase 1) into directional movement.

targetSlug: follow-directions-on-grid
language: en
title:
  en: "Follow Grid Directions — left, right, up, down navigation"
description:
  en: "Kindergarten fine-motor-and-visual-spatial package teaching grid-direction following. Kids hear simple directions ('go left, go up, go right') and execute them on a grid to reach a target. Bridges from spatial-position vocabulary (use-position-vocabulary + use-spatial-position-words) into directional-movement spatial reasoning. Vocab-anchored. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher places masking-tape grid on
      classroom floor (3×3 or 4×4 grid). Kids stand on grid cells.
      Teacher gives directions: "Take 1 step LEFT. Now take 1 step UP.
      Now take 1 step RIGHT." Kids follow physically. Reinforces
      direction vocabulary (left / right / up / down) + the embodied
      spatial-reasoning skill of relative-position navigation. Repeat
      with different starting cells.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine. Teacher displays a grid drawing with start
      cell marked. Gives sequential directions ("go right, go right,
      go up"); class collectively marks the path on the grid + identifies
      the end cell. Pair work: kid A gives directions; kid B traces the
      path on a paper grid. Recast errors. Optional extension: kids
      describe paths to each other in target language ("From here, go
      down 2, then right 3") — develops directional vocabulary
      production.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: grid-direction worksheet (kids draw
      lines on grids following written-or-spoken direction sequences).
      Station 2: matching worksheet (direction-words to direction-arrows
      — vocabulary reinforcement). Station 3: manipulative cut-outs
      grid navigation (kids place a small cut-out figure on a printed
      grid; partner gives directions; kid moves figure cell-by-cell;
      verifies end position).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher gives a short direction sequence;
      class collectively traces it on a projected grid. Forward-pointer:
      "Today we navigated grids with directions. When we come back to
      spatial puzzles next, we'll do MAZES — paths through walls and
      obstacles."

