assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Isolate the final phoneme of a spoken CVC word in 7 of
        10 trials.
      - Match a pictured CVC word to its final-sound letter in
        7 of 10 trials.
      - Sort 12 pictures into ending-sound groups (3-4 groups)
        correctly in 6 of 10 attempts.
      - Use vocabulary 'last sound' / 'ending sound' / 'final
        sound' correctly in 5 of 10 productive-language trials.
      - Identify both initial AND final phonemes of a CVC word
        (bracket-the-word task) in 5 of 8 attempts.

    Differentiation:
    - Pre-K: focus on rhyme + syllable work + initial-phoneme
      first; defer final-phoneme isolation to K.
    - K: single-consonant final-phoneme isolation + picture-
      to-letter matching; consonant-blend codas deferred.
    - Grade 1: extend to consonant-blend codas (/st/, /nd/,
      /mp/) + medial-vowel isolation; bridge to full CVC
      phoneme-segmentation + word-family decoding (-at, -an,
      -in, -ot, -un).
    - Grade 2+: formal phonemic-awareness assessments + bridge
      to systematic phonics decoding (phoneme-grapheme
      correspondence + decoding fluency across digraphs +
      blends + vowel teams).

