# Teaching package — find a hidden target in a busy scene
# Arc 6 Phase 2 (Option A vocab-depth) — cognitive-and-executive-function /
# memory-and-attention strand. Vocab-anchored: kids name the target image
# while finding it in a complex scene. Class B FLEXIBLE; substrate-ready
# against any existing image-library scene content via find-objects app.

targetSlug: find-hidden-target-in-busy-scene
language: en
title:
  en: "Find Hidden Targets in Busy Scenes — visual scanning + vocabulary"
description:
  en: "Kindergarten-Grade 1 cognitive-and-executive-function package teaching visual scanning and sustained attention. Kids find named target images hidden among distractor images in busy scenes. Vocab-anchored — naming the target reinforces vocabulary acquired across Arc 1-6 packages. Composes against find-objects app + image-library breadth. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher projects a busy scene (e.g., a
      forest with many animals; a classroom with many objects). Names a
      target: "Find the cat." Kids point to the cat in the scene chorally.
      Repeat 3-4 times with different targets. Reinforces vocabulary
      (kids hear and recognize the target name) + visual scanning skill
      (kids learn to systematically search a scene). Pin to "Visual
      Scanning" area.
  contentActivity:
    durationMinutes: 12
    body: |
      Whole-class I-Spy routine. Teacher describes a target ("I spy with
      my little eye, something that says 'meow'..." → cat). Kids guess
      and point. Pair work: kid A picks a target from a busy scene; kid B
      tries to find it with kid A giving hints. Optional extension: kids
      describe a target's category or attributes ("I spy something orange
      and round" → orange or pumpkin) — bridges visual-scanning with
      attribute-vocabulary from sort-by-color (Arc 5).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: find-objects worksheet I-Spy mode (kids
      find named hidden targets in busy scenes). Station 2: matching
      worksheet (image-name reinforces target vocabulary). Station 3:
      manipulative cut-outs hide-and-seek game (kids hide cut-outs around
      the classroom; partner finds them, names each as found — combines
      kinesthetic search with vocabulary practice).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher projects a final busy scene; kids
      collectively find 3-5 named targets. Forward-pointer: "Today we
      practiced finding hidden things in busy pictures. When we come back
      to visual puzzles next, we'll do MORE complex puzzles where you
      have to find LOTS of things at once."

