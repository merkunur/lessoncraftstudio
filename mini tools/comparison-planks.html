<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Planks — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell, then this tool. Absolute /mini-tools/ paths so embeds and
       cross-context loads resolve identically. No core import.
       This tool loads ONE data file — /mini-tools/comparison-planks-pairs.json,
       the pair book — so the deploy cp MUST include *.json or the book
       404s and the tool falls back to its five free pairs (never to
       nothing). It loads NO ART and NO AUDIO: two planks and two
       numerals are the whole stage, so nothing here can 404 into
       silence or into a blank frame. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/comparison-planks.js?v=2"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    LCS.mount(ComparisonPlanks, { mount: '#lcs-root' });
  </script>
</body>
</html>
