compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (fact families
    within 10 — closes strand 13/14 → 14/14 SAT; 21st
    saturated strand in the catalog). Secondary strand:
    algebraic-thinking precursor (the inverse-operation
    relationship between addition and subtraction is the
    structural insight that grounds later equation manipulation;
    fact-families make the relationship discrete + memorizable).
    Tertiary strand: working-memory + recall (kids hold three
    numbers in mind and produce four equations from them; this
    fluency move is the K-1 anchor for mental arithmetic).

    Architectural significance: closes math/addition-subtraction
    at canonical 14/14 SAT — the 21st saturated strand in the
    catalog. This is the SAT-closing package for the strand
    that has anchored most numeracy work since Arc 1 (add-
    within-5). Pair-coherent with Phase 1.2 make-10-strategy
    + find-missing-addend-within-10: those three packages
    together form the addition-fluency strand-anchor cluster
    — make-10 builds partner recall, find-missing-addend
    extends it to any single-digit unknown, fact-families
    integrate both moves into the full inverse-operation
    relationship. After this package, the addition-
    subtraction strand has no remaining canonical gaps
    within K-3 scope (regrouping/borrowing variants live in
    Arc 16 add-within-100 / subtract-within-100 + Phase 1.2
    add-2-digit-without-regrouping + subtract-2-digit-without-
    regrouping; mixed-operation work in Arc 15 Phase 2 add-
    and-subtract-mixed-within-20).

    Distinctive composition: 1 addition find-addend
    (introduction — surfaces the missing-addend reading of
    fact families) + 1 math-puzzle missing-addend + 2 math-
    worksheet easy with addsubtract operation mix (the
    addition + subtraction mix at the same difficulty level
    surfaces the four-fact-from-three-numbers relationship in
    the exercise sequence itself) + 1 matching (consolidation).
    The math-worksheet operation parameter is set to
    'addsubtract' rather than addition-only or subtraction-
    only — this is the load-bearing exercise choice for
    fact-families work, because the kid encounters addition
    and subtraction problems drawn from the same three-number
    families and notices the structural relationship.

    Class B FLEXIBLE substrate: composes against animals
    theme (Arc 4-16 addition-subtraction strand precedent;
    countable for the four-fact work; cross-arc consistency
    with the cluster).

    K-3 multilingual classroom relevance: fact-family concept
    is universal K-3 numeracy + algebraic-precursor content.
    The fact-family-triangle visualization is locale-portable.
    Cross-locale vocabulary: en "fact family"; de
    "Zahlentripel" / "Umkehraufgabe" (inverse-task); es
    "familia de números" / "operaciones inversas"; pt
    "família de fatos" / "operações inversas"; fr "famille
    de nombres" / "opérations inverses"; fi
    "lukukolmikko". The 'family' metaphor (numbers that
    belong together) is cross-locale intuitive. The triangle
    visualization works in every script direction (left-to-
    right + right-to-left). Locale-variant work at Phase 3+
    adapts the family-metaphor naming convention without
    changing the pedagogy.

