<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1000, height=1000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px;
    height: 1000px;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(155deg, #1E3A8A 0%, #2563EB 35%, #3B82F6 65%, #60A5FA 100%);
    position: relative;
  }

  /* Subtle grid pattern overlay */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 1;
  }

  /* Radial glow behind magnifying glass */
  .center-glow {
    position: absolute;
    top: 280px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(245,158,11,0.2) 0%, rgba(245,158,11,0.05) 40%, transparent 70%);
    z-index: 2;
  }

  /* GRATIS badge */
  .gratis {
    position: absolute;
    top: 28px;
    left: 28px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(145deg, #F43F5E 0%, #E11D48 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 28px;
    color: white;
    z-index: 20;
    box-shadow: 0 6px 25px rgba(244,63,94,0.5);
    transform: rotate(-8deg);
    border: 3px solid rgba(255,255,255,0.3);
  }

  /* Grade badge */
  .grade {
    position: absolute;
    top: 38px;
    right: 30px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    padding: 12px 24px;
    border-radius: 30px;
    border: 2px solid rgba(255,255,255,0.3);
    z-index: 20;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
  }
  .grade span {
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 800;
    color: white;
    letter-spacing: 0.5px;
  }

  /* Title */
  .title-area {
    position: absolute;
    top: 45px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }
  .title-line1 {
    font-size: 80px;
    font-weight: 700;
    color: white;
    text-shadow: 0 4px 20px rgba(0,0,0,0.35);
    letter-spacing: 3px;
    line-height: 1;
  }
  .title-line2 {
    font-size: 80px;
    font-weight: 700;
    color: #FBBF24;
    text-shadow: 0 4px 20px rgba(0,0,0,0.25);
    letter-spacing: 3px;
    line-height: 1;
    margin-top: -2px;
  }
  .subtitle {
    font-family: 'Nunito', sans-serif;
    font-size: 25px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    margin-top: 10px;
    letter-spacing: 1px;
  }

  /* Background worksheet (blurred / darkened) */
  .bg-worksheet {
    position: absolute;
    top: 270px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 414px;
    border-radius: 10px;
    overflow: hidden;
    z-index: 3;
    opacity: 0.25;
    filter: blur(2px);
  }
  .bg-worksheet img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Magnifying glass */
  .magnifier {
    position: absolute;
    top: 300px;
    left: 50%;
    transform: translateX(-30px);
    z-index: 10;
  }
  .lens {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border: 12px solid #334155;
    background: white;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 4px rgba(245,158,11,0.4),
      0 12px 40px rgba(0,0,0,0.4),
      inset 0 0 30px rgba(0,0,0,0.05);
  }
  .lens img {
    width: 340px;
    height: 440px;
    object-fit: cover;
    object-position: center 20%;
    margin-left: -20px;
    margin-top: -30px;
  }
  /* Lens flare */
  .lens-flare {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 35% 30%, rgba(255,255,255,0.35) 0%, transparent 50%);
    pointer-events: none;
    z-index: 2;
  }
  /* Handle */
  .handle {
    position: absolute;
    bottom: -55px;
    right: -45px;
    width: 22px;
    height: 90px;
    background: linear-gradient(180deg, #475569 0%, #334155 40%, #1E293B 100%);
    border-radius: 0 0 10px 10px;
    transform: rotate(45deg);
    transform-origin: top center;
    box-shadow: 4px 4px 12px rgba(0,0,0,0.3);
  }
  .handle::after {
    content: '';
    position: absolute;
    top: 0;
    left: 2px;
    width: 6px;
    height: 100%;
    background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent);
    border-radius: 3px;
  }

  /* Floating question marks */
  .float-icon {
    position: absolute;
    font-size: 32px;
    z-index: 4;
    opacity: 0.5;
  }
  .fi1 { top: 280px; left: 80px; font-size: 38px; transform: rotate(-15deg); }
  .fi2 { top: 380px; right: 70px; font-size: 30px; transform: rotate(10deg); }
  .fi3 { top: 520px; left: 60px; font-size: 26px; transform: rotate(-8deg); }
  .fi4 { top: 600px; right: 90px; font-size: 34px; transform: rotate(12deg); }
  .fi5 { top: 450px; left: 170px; font-size: 22px; transform: rotate(-20deg); }

  /* Sparkles */
  .sparkle {
    position: absolute;
    z-index: 12;
  }
  .sp1 { top: 310px; left: 280px; font-size: 24px; }
  .sp2 { top: 350px; right: 250px; font-size: 20px; }
  .sp3 { top: 560px; left: 260px; font-size: 22px; }
  .sp4 { top: 530px; right: 280px; font-size: 18px; }
  .sp5 { top: 680px; left: 400px; font-size: 26px; }

  /* Discovery caption */
  .discovery {
    position: absolute;
    bottom: 178px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #F59E0B, #D97706);
    padding: 10px 30px;
    border-radius: 30px;
    z-index: 15;
    box-shadow: 0 4px 16px rgba(245,158,11,0.4);
  }
  .discovery span {
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: white;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }

  /* Feature pills */
  .pills {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 15;
  }
  .pill {
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 22px;
    padding: 8px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: white;
  }

  /* Bottom tagline */
  .tagline {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 15;
  }
  .tagline span {
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: rgba(255,255,255,0.65);
    font-style: italic;
  }
</style>
</head>
<body>

<!-- Grid overlay -->
<div class="grid-overlay"></div>

<!-- Center glow -->
<div class="center-glow"></div>

<!-- GRATIS badge -->
<div class="gratis">GRATIS</div>

<!-- Grade badge -->
<div class="grade"><span>Vorschule bis 2. Klasse</span></div>

<!-- Title -->
<div class="title-area">
  <div class="title-line1">SCHARFER</div>
  <div class="title-line2">BLICK</div>
  <div class="subtitle">Versteckte Bilder entdecken!</div>
</div>

<!-- Background worksheet (darker, blurred) -->
<div class="bg-worksheet">
  <img src="https://www.lessoncraftstudio.com/samples/german/find%20objects/sample-5.jpeg" alt="Suchbild Hintergrund">
</div>

<!-- Magnifying glass -->
<div class="magnifier">
  <div class="lens">
    <img src="https://www.lessoncraftstudio.com/samples/german/find%20objects/sample-1.jpeg" alt="Suchbild Arbeitsblatt">
    <div class="lens-flare"></div>
  </div>
  <div class="handle"></div>
</div>

<!-- Floating question marks -->
<div class="float-icon fi1">&#x2753;</div>
<div class="float-icon fi2">&#x2753;</div>
<div class="float-icon fi3">&#x2753;</div>
<div class="float-icon fi4">&#x2753;</div>
<div class="float-icon fi5">&#x2753;</div>

<!-- Sparkles -->
<div class="sparkle sp1">&#x2728;</div>
<div class="sparkle sp2">&#x2728;</div>
<div class="sparkle sp3">&#x2728;</div>
<div class="sparkle sp4">&#x2728;</div>
<div class="sparkle sp5">&#x2728;</div>

<!-- Discovery banner -->
<div class="discovery">
  <span>Schau genau hin &mdash; findest du alle Bilder?</span>
</div>

<!-- Feature pills -->
<div class="pills">
  <div class="pill">Visuelle Wahrnehmung</div>
  <div class="pill">L&ouml;sungsbl&auml;tter</div>
  <div class="pill">Sofort drucken</div>
</div>

<!-- Tagline -->
<div class="tagline">
  <span>Konzentration f&ouml;rdern &mdash; spielerisch und effektiv</span>
</div>

</body>
</html>
