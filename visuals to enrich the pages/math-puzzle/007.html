<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Mathe-R&auml;tsel - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: #FDF6EC; overflow: hidden;">

        <!-- Subtle sage diagonal hatching -->
        <div style="position: absolute; inset: 0; opacity: 0.05; background-image: repeating-linear-gradient(45deg, #4A7C59 0px, #4A7C59 1px, transparent 1px, transparent 20px), repeating-linear-gradient(-45deg, #4A7C59 0px, #4A7C59 1px, transparent 1px, transparent 20px);"></div>

        <!-- Warm radial glow -->
        <div style="position: absolute; top: 55%; left: 50%; width: 700px; height: 600px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(74,124,89,0.06) 0%, transparent 65%); border-radius: 50%;"></div>

        <!-- Top accent gradient strip -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #4A7C59 0%, #C75B39 30%, #D4A849 60%, #4A7C59 100%);"></div>

        <!-- Main Title -->
        <div style="position: absolute; top: 28px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #4A7C59; margin: 0; text-shadow: 2px 2px 0 rgba(74,124,89,0.08);">ALLES DABEI!</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 26px; color: #C75B39; margin: 6px 0 0 0;">Mathe-R&auml;tsel Komplett-Paket</h2>
        </div>

        <!-- Feature Arc - 5 circles -->
        <div style="position: absolute; top: 145px; left: 50%; transform: translateX(-50%); width: 860px; height: 145px;">

            <!-- Circle 1 - Selbstkontrolle -->
            <div style="position: absolute; left: 30px; top: 30px;">
                <div style="width: 110px; height: 110px; background: linear-gradient(145deg, #F5E6D3, #EDD5BC); border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,0.10), inset 0 -3px 8px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; border: 3px solid #4A7C59;">
                    <div style="text-align: center; padding: 8px;">
                        <div style="font-size: 26px; margin-bottom: 2px;">&#10004;</div>
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: #4A7C59; line-height: 1.1; display: block;">Selbst-<br>kontrolle</span>
                    </div>
                </div>
            </div>

            <!-- Circle 2 - L&ouml;sungsbl&auml;tter -->
            <div style="position: absolute; left: 185px; top: 10px;">
                <div style="width: 118px; height: 118px; background: linear-gradient(145deg, #F5E6D3, #EDD5BC); border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,0.10), inset 0 -3px 8px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; border: 3px solid #C75B39;">
                    <div style="text-align: center; padding: 8px;">
                        <div style="font-size: 26px; margin-bottom: 2px;">&#128221;</div>
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: #C75B39; line-height: 1.1; display: block;">L&ouml;sungs-<br>bl&auml;tter</span>
                    </div>
                </div>
            </div>

            <!-- Circle 3 - Bilderr&auml;tsel (center, largest) -->
            <div style="position: absolute; left: 50%; transform: translateX(-50%); top: 0;">
                <div style="width: 140px; height: 140px; background: linear-gradient(145deg, #4A7C59, #3A6B49); border-radius: 50%; box-shadow: 0 8px 28px rgba(74,124,89,0.35), inset 0 -4px 10px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; border: 4px solid #D4A849;">
                    <div style="text-align: center; padding: 10px;">
                        <div style="font-size: 32px; margin-bottom: 2px;">&#129513;</div>
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: white; line-height: 1.1; display: block;">Bilder-<br>r&auml;tsel</span>
                    </div>
                </div>
            </div>

            <!-- Circle 4 - Druckfertig -->
            <div style="position: absolute; right: 185px; top: 10px;">
                <div style="width: 118px; height: 118px; background: linear-gradient(145deg, #F5E6D3, #EDD5BC); border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,0.10), inset 0 -3px 8px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; border: 3px solid #D4A849;">
                    <div style="text-align: center; padding: 8px;">
                        <div style="font-size: 26px; margin-bottom: 2px;">&#128424;</div>
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: #D4A849; line-height: 1.1; display: block;">Druck-<br>fertig</span>
                    </div>
                </div>
            </div>

            <!-- Circle 5 - Denken f&ouml;rdern -->
            <div style="position: absolute; right: 30px; top: 30px;">
                <div style="width: 110px; height: 110px; background: linear-gradient(145deg, #F5E6D3, #EDD5BC); border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,0.10), inset 0 -3px 8px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; border: 3px solid #4A7C59;">
                    <div style="text-align: center; padding: 8px;">
                        <div style="font-size: 26px; margin-bottom: 2px;">&#129504;</div>
                        <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: #4A7C59; line-height: 1.1; display: block;">Denken<br>f&ouml;rdern</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Worksheet Pair: AUFGABE + L&Ouml;SUNG side by side -->
        <div style="position: absolute; top: 318px; left: 50%; transform: translateX(-50%); width: 780px; height: 440px;">

            <!-- AUFGABE (worksheet) - sage frame -->
            <div style="position: absolute; left: 60px; top: 0; z-index: 10;">
                <div style="background: #4A7C59; padding: 8px; border-radius: 16px; box-shadow: 0 14px 45px rgba(0,0,0,0.20);">
                    <div style="background: #4A7C59; padding: 6px 30px 4px 30px; border-radius: 10px 10px 0 0; text-align: center; margin: 0 0 4px 0;">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 3px;">AUFGABE</span>
                    </div>
                    <img src="https://www.lessoncraftstudio.com/samples/german/math%20puzzle/sample-2.jpeg" style="width: 260px; height: 337px; object-fit: cover; border-radius: 10px; display: block;" alt="Mathe-R&auml;tsel Aufgabe">
                </div>
            </div>

            <!-- Arrow between -->
            <div style="position: absolute; left: 50%; top: 180px; transform: translateX(-50%); z-index: 30; width: 60px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <div style="width: 50px; height: 36px; background: linear-gradient(145deg, #D4A849, #C49A3D); border-radius: 20px; box-shadow: 0 4px 15px rgba(212,168,73,0.4); display: flex; align-items: center; justify-content: center; border: 2px solid white;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">&#10132;</span>
                </div>
            </div>

            <!-- L&Ouml;SUNG (answer key) - terracotta frame -->
            <div style="position: absolute; right: 60px; top: 0; z-index: 10;">
                <div style="background: #C75B39; padding: 8px; border-radius: 16px; box-shadow: 0 14px 45px rgba(0,0,0,0.20);">
                    <div style="background: #C75B39; padding: 6px 30px 4px 30px; border-radius: 10px 10px 0 0; text-align: center; margin: 0 0 4px 0;">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white; letter-spacing: 3px;">L&Ouml;SUNG</span>
                    </div>
                    <img src="https://www.lessoncraftstudio.com/samples/german/math%20puzzle/sample-2-answer.jpeg" style="width: 260px; height: 337px; object-fit: cover; border-radius: 10px; display: block;" alt="Mathe-R&auml;tsel L&ouml;sung">
                </div>
            </div>
        </div>

        <!-- Bottom pill -->
        <div style="position: absolute; bottom: 108px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #4A7C59, #3A6B49); padding: 14px 40px; border-radius: 30px; box-shadow: 0 6px 22px rgba(74,124,89,0.35);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; letter-spacing: 1px;">Komplett mit L&ouml;sungen!</span>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #4A7C59;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #4A7C59;">Addition &amp; Subtraktion</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #C75B39;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #C75B39;">Zahlenraum 1-20</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.12); border: 3px solid #D4A849;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #D4A849;">2x2 bis 4x4 Raster</span>
            </div>
        </div>

    </div>
</body>
</html>
