# Teaching package — recognize numerals 21 to 100
# Arc 15 Phase 2 (math / numeral-recognition 1/4 → 2/4; deepens Arc 15 Phase 1 foundation).

targetSlug: recognize-numerals-21-to-100
language: en
title:
  en: "Numerals 21-100 — recognizing bigger written numbers"
description:
  en: "Grade 1 / Grade 2 math package extending numeral-recognition from 1-20 (Arc 15 Phase 1 recognize-numerals-1-to-20) to 21-100. Builds directly on Phase 1 foundation. Critical scaling work — kids extend numeral-recognition from one-and-two-digit range to full two-digit range. Foundation for hundred-chart navigation + extended-counting work + place-value-aware number-reading. Numeral-recognition strand: 1/4 → 2/4 at Phase 2 close. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + extended-range introduction. Teacher
      displays a hundreds-chart (10x10 grid of numbers 1-100).
      "We already know numerals 1-20. Now let's see numerals 21
      all the way to 100! See the pattern? Each row goes UP by
      1, each column going DOWN goes UP by 10." Teacher points
      to numerals: "Find the 25! Find the 47! Find the 100!"
      Kids point to corresponding numerals. Pattern emphasis:
      "Once you know the TEN (the first digit), you can find any
      number by counting the ONE (second digit)."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + numeral-recognition routine. Each pair receives
      20 numeral cards (random subset from 21-100) + a hundreds-
      chart. Pair takes turns: kid A picks a numeral card; kid B
      finds the numeral on the hundreds-chart. Recast errors with
      pattern reminder ("you're looking for 47. The tens digit is
      4, so find the row that starts with 41. Then count over —
      47 is the 7th number in that row."). Differentiate by range
      — Pre-K kids work 21-50; K kids work 21-100.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (numeral
      to quantity-representation: 45 ↔ specific quantity arrangement).
      Station 2: pattern-train worksheet (sequence numerals in
      counting-by-1, counting-by-5, or counting-by-10 patterns).
      Station 3: missing-pieces worksheet (number sequence with
      one numeral missing — kid identifies which numeral is
      missing). Station 4: more-less worksheet (compare two-digit
      numbers using ranking).
  closure:
    durationMinutes: 5
    body: |
      Whole-class numeral-quiz. Teacher displays random numerals
      21-100; class collectively reads each. "Number 45! Number
      67! Number 89! Number 100!" Forward-pointer: "Today we
      recognized numerals 21-100. When we come back next, we can
      recognize THREE-DIGIT numerals (100-999) + start WRITING
      these numerals on our own + read them in different
      contexts!"

