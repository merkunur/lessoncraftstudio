description:
  en: "Comprehensive K-3 bundle centered on camping + outdoor-activity vocabulary spanning equipment + nature + spatial reasoning + survival concepts. 4 packages span vocabulary-acquisition (identify-and-name-foods — campfire/trail-mix foods; identify-and-name-action-verbs — camping actions: pitch tent, hike, fish, build-fire) + spatial vocabulary (use-spatial-position-words — where camping items go: tent BEHIND tree; sleeping bag INSIDE tent) + cognitive sorting (sort-by-category — camping essentials vs household items). Cross-strand outdoor-activity bundle. Suitable for a 4-week classroom unit on outdoor exploration + nature + summer-prep activities; supports K-3 multilingual classrooms with outdoor-extension activities + family-camping conversation prompts."

