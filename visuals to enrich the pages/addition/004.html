<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Addition Arbeitsbl&auml;tter - Professional Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: #F5F0E8; overflow: hidden;">

        <!-- Subtle grid pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.06; background-image: linear-gradient(rgba(93,64,55,0.4) 1px, transparent 1px), linear-gradient(90deg, rgba(93,64,55,0.4) 1px, transparent 1px); background-size: 50px 50px;"></div>

        <!-- Corner accents - copper L-shapes -->
        <!-- Top-left -->
        <div style="position: absolute; top: 20px; left: 20px;">
            <div style="width: 60px; height: 5px; background: linear-gradient(90deg, #B87333, #CD853F); border-radius: 2px;"></div>
            <div style="width: 5px; height: 60px; background: linear-gradient(180deg, #B87333, #CD853F); border-radius: 2px;"></div>
        </div>
        <!-- Top-right -->
        <div style="position: absolute; top: 20px; right: 20px;">
            <div style="width: 60px; height: 5px; background: linear-gradient(270deg, #B87333, #CD853F); border-radius: 2px; margin-left: auto;"></div>
            <div style="width: 5px; height: 60px; background: linear-gradient(180deg, #B87333, #CD853F); border-radius: 2px; margin-left: auto;"></div>
        </div>
        <!-- Bottom-left -->
        <div style="position: absolute; bottom: 20px; left: 20px;">
            <div style="width: 5px; height: 60px; background: linear-gradient(0deg, #B87333, #CD853F); border-radius: 2px;"></div>
            <div style="width: 60px; height: 5px; background: linear-gradient(90deg, #B87333, #CD853F); border-radius: 2px;"></div>
        </div>
        <!-- Bottom-right -->
        <div style="position: absolute; bottom: 20px; right: 20px;">
            <div style="width: 5px; height: 60px; background: linear-gradient(0deg, #B87333, #CD853F); border-radius: 2px; margin-left: auto;"></div>
            <div style="width: 60px; height: 5px; background: linear-gradient(270deg, #B87333, #CD853F); border-radius: 2px; margin-left: auto;"></div>
        </div>

        <!-- Title Section -->
        <div style="position: absolute; top: 55px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 62px; color: #5D4037; margin: 0; letter-spacing: 4px;">ADDITION</h1>
            <div style="margin-top: 8px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #B87333; letter-spacing: 5px; text-transform: uppercase;">Professionelle Arbeitsbl&auml;tter</span>
            </div>
            <!-- Copper divider line -->
            <div style="width: 200px; height: 2px; background: linear-gradient(90deg, transparent, #B87333, #CD853F, #B87333, transparent); margin: 16px auto 0 auto;"></div>
        </div>

        <!-- 3 Museum-style frames -->
        <div style="position: absolute; top: 210px; left: 50%; transform: translateX(-50%); width: 880px; height: 460px; display: flex; align-items: flex-end; justify-content: center; gap: 35px;">

            <!-- Left frame - worksheet -->
            <div style="text-align: center;">
                <div style="width: 210px; height: 272px; padding: 8px; background: linear-gradient(145deg, #B87333, #CD853F, #B87333); border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3);">
                    <div style="width: 100%; height: 100%; background: white; border-radius: 3px; overflow: hidden;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/addition/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Aufgabenblatt">
                    </div>
                </div>
                <!-- Label plaque -->
                <div style="margin-top: 12px; background: linear-gradient(145deg, #B87333, #CD853F); padding: 6px 18px; border-radius: 4px; display: inline-block; box-shadow: 0 2px 8px rgba(184,115,51,0.3);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: white; letter-spacing: 2px; text-transform: uppercase;">Aufgabenblatt</span>
                </div>
            </div>

            <!-- Center frame - larger, hero worksheet -->
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="width: 250px; height: 323px; padding: 10px; background: linear-gradient(145deg, #B87333, #CD853F, #D4A574, #CD853F, #B87333); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);">
                    <div style="width: 100%; height: 100%; background: white; border-radius: 4px; overflow: hidden;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/addition/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Arbeitsblatt">
                    </div>
                </div>
                <!-- Label plaque -->
                <div style="margin-top: 12px; background: linear-gradient(145deg, #B87333, #CD853F); padding: 6px 18px; border-radius: 4px; display: inline-block; box-shadow: 0 2px 8px rgba(184,115,51,0.3);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: white; letter-spacing: 2px; text-transform: uppercase;">Arbeitsblatt</span>
                </div>
            </div>

            <!-- Right frame - answer key -->
            <div style="text-align: center;">
                <div style="width: 210px; height: 272px; padding: 8px; background: linear-gradient(145deg, #B87333, #CD853F, #B87333); border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3);">
                    <div style="width: 100%; height: 100%; background: white; border-radius: 3px; overflow: hidden;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/addition/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="L&ouml;sungsschl&uuml;ssel">
                    </div>
                </div>
                <!-- Label plaque -->
                <div style="margin-top: 12px; background: linear-gradient(145deg, #B87333, #CD853F); padding: 6px 18px; border-radius: 4px; display: inline-block; box-shadow: 0 2px 8px rgba(184,115,51,0.3);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: white; letter-spacing: 2px; text-transform: uppercase;">L&ouml;sungsschl&uuml;ssel</span>
                </div>
            </div>
        </div>

        <!-- Museum plaque -->
        <div style="position: absolute; bottom: 115px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #B87333, #CD853F, #D4A574, #CD853F, #B87333); padding: 14px 48px; border-radius: 6px; box-shadow: 0 6px 20px rgba(184,115,51,0.35), inset 0 1px 0 rgba(255,255,255,0.3);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: white; letter-spacing: 2px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">Die Kunst des Rechnens</span>
        </div>

        <!-- Feature Pills - frosted glass with copper borders -->
        <div style="position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px;">
            <div style="background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); padding: 10px 16px; border-radius: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); border: 2px solid #B87333;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #5D4037;">Druckfertig</span>
            </div>
            <div style="background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); padding: 10px 16px; border-radius: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); border: 2px solid #B87333;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #5D4037;">Keine Vorbereitung</span>
            </div>
            <div style="background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); padding: 10px 16px; border-radius: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); border: 2px solid #B87333;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #5D4037;">L&ouml;sungen inklusive</span>
            </div>
            <div style="background: rgba(255,255,255,0.8); backdrop-filter: blur(4px); padding: 10px 16px; border-radius: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); border: 2px solid #B87333;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #5D4037;">Differenziert</span>
            </div>
        </div>

    </div>
</body>
</html>
