compositionalRationale:
  en: |
    Primary strand: early-literacy / phonological-awareness
    (isolate-initial-phoneme — strand 2/9 → 3/9). Pair-coherent
    with Phase 1.1 Slot 4 produce-rhyming-words; together they
    advance phonological-awareness strand 2/9 → 4/9.

    Architectural significance: continues phonological-awareness
    strand from Arc 10 identify-rhyming-pairs (FIRST package in
    the strand) + earlier count-syllables-1-to-3 + adds the
    PHONEME-LEVEL recognition skill. Cognitive progression:
    rhyme-recognition (word-ending sounds) → syllable-counting
    (word-beat segments) → phoneme-isolation (individual sound
    units). Phoneme-level awareness is the most granular
    phonological skill + the most direct bridge to systematic
    phonics decoding.

    Per §A.13.30 K-1 informal framing: K phoneme-isolation work
    is CONCRETE SOUND-RECOGNITION. Kids hear a word + name
    the first sound + match it to a beginning-sound picture or
    letter. The pedagogy uses everyday language ('first sound'
    / 'beginning sound' / 'starting sound') + introduces the
    /sound/ notation only as the SOUND-vs-LETTER distinction
    becomes load-bearing. Formal phonetics-theory pedagogy
    (place + manner + voicing classification; phonetic
    transcription with IPA) is post-Grade-3 academic work; this
    package establishes the foundation /sound/-recognition
    pattern that systematic phonics work depends on.

    **Phonological-awareness pedagogy is LOCALE-SPECIFIC.**
    Phoneme inventories differ per language: English /b/ /d/
    /f/ /g/ /h/ /j/ /k/ /l/ /m/ /n/ /p/ /r/ /s/ /t/ /v/ /w/
    /y/ /z/ phonemes have direct letter-sound mapping mostly,
    plus vowel phonemes that differ from letter names. Other
    languages have different inventories. This en package
    uses the English phoneme set; pt variant uses pt-BR
    phoneme set per BR-MEC framework — NOT a translation
    but a per-locale pedagogical adaptation.

    Materials note: 8-material Literacy class stack per §A.13.37
    + pair-coherent with identify-rhyming-pairs (Arc 10 P1
    phonological-awareness precedent). Materials structure
    mirrors identify-rhyming-pairs vocab-anchored Class B
    FLEXIBLE substrate (theme: animals provides familiar
    CVC vocabulary for phoneme-isolation work — cat / dog /
    cow / pig / rat / bat / hen / fox give clean initial-
    phoneme variety across common K-1 phonemes /k/ /d/ /k/
    /p/ /r/ /b/ /h/ /f/). Manipulative-cut-outs at position 6
    emits canonical-correct `mode: single-repeat` per §A.13.35.

    Distinctive composition: matching ×2 (positions 1+5) +
    word-guess (position 2) + picture-sort (position 3) +
    word-scramble (position 4). Matching surfaces picture-to-
    letter pairing at initial-sound work; word-guess builds
    initial-letter-filling-in skill; picture-sort sorts
    pictures into beginning-sound groups; word-scramble
    reinforces sound-letter mapping at full-word level.
    Composition shape mirrors identify-rhyming-pairs (Arc 10
    P1) phonological-awareness precedent.

    Class B FLEXIBLE substrate: composes against animals
    theme (vocab-anchored with familiar K-1 vocabulary;
    cross-arc with Arc 10+ phonological-awareness theme
    consistency). No substrate gaps; ships clean.

    K-3 multilingual classroom relevance: phoneme-isolation
    is universal K early-literacy content BUT phoneme
    inventories differ per language. Multilingual K-3
    classrooms benefit from explicit phoneme-isolation work
    in the language-of-instruction + awareness that home-
    language phonemes may differ. Cross-locale phoneme-
    awareness vocabulary varies but the cognitive operation
    is the same: hear word → name first sound → match to
    representation.

