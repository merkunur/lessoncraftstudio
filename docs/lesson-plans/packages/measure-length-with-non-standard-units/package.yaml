assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Measure 5 objects using paperclips with tight unit-
        iteration in 7 of 10 trials.
      - Record measurements correctly ("This pencil is 6
        paperclips long") in 7 of 10 trials.
      - Compare two measured objects + identify longer in 8 of 10
        trials.
      - Order 4 objects from shortest to longest using
        measurements in 6 of 10 trials.

    Differentiation:
    - Pre-K: comparison-only (no unit-counting); 2-object
      length comparison.
    - K: 3-object measurement with paperclips; small range.
    - Grade 1: full coverage + bridge to standard-unit
      introduction (rulers + inches).
    - Grade 2+: extend to centimeters + meters + bridge to
      measure-perimeter + area work.

