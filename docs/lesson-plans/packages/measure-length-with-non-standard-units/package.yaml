compositionalRationale:
  en: |
    Primary strand: math / measurement (non-standard-unit length
    measurement — extends Arc 11/14 comparison work). Secondary
    strand: numeracy (counting units; recording measurements).
    Tertiary strand: cognitive-and-executive-function (technique
    discipline: tight unit-iteration without gaps).

    Architectural significance: extends measurement strand from
    qualitative comparison (compare-by-length + compare-by-weight
    + compare-by-capacity + compare-by-time-duration) to
    quantitative measurement (count of units). Critical bridge to
    standard-unit measurement (inches/feet/centimeters/meters);
    kids develop technique-discipline (tight unit-iteration;
    no gaps; accurate count) BEFORE introducing standard units.

    Distinctive composition: 2 chart-count (counting units) + 1
    matching + 1 more-less + 1 pattern-train. Counting-units
    emphasis throughout; chart-count canonical exercise for
    counting items-in-line.

    Class B FLEXIBLE substrate: composes against miscellaneous +
    classroom themes (everyday objects to measure: pencil, book,
    eraser, desk, chair).

    K-3 multilingual classroom relevance: measurement vocabulary
    varied across 11 platform locales — measure / medir / mesurer
    / messen / mäta cognate-Germanic + Romance. Specific units
    (paperclip / clip / agrafe / Büroklammer) more variable.
    Universal mathematical concept (unit iteration); vocabulary
    anchor varies. Locale-variant work at Phase 3+ adapts to each
    locale's measurement-vocabulary register.

