assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Read 6 of 8 CVCe words by applying silent-e rule in 8 of 10
        trials.
      - Distinguish CVC vs CVCe pairs (cap vs cape) in 7 of 10 trials.
      - Apply silent-e rule to NEW unfamiliar CVCe word in 5 of 10
        trials.

    Differentiation:
    - Grade K (advanced): CVC review + 4 CVCe words.
    - Grade 1: 8 CVCe words; independent decoding.
    - Grade 2+: bridge to consonant-blend decoding.

