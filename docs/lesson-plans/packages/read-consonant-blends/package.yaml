# Teaching package — read words with consonant blends
# Arc 19 Phase 1.3 Slot 3 (early-literacy / phonics-decoding strand 2/11 → 3/11). Pair-coherent prerequisite-chain extension from read-cvc-words (Arc 6 P1) + read-cvce-words. Phonics-decoding strand PARTIAL advancement — NOT a strand-start (strand has 2 prior SAT). Prerequisites per learning-targets.json line 64: read-cvc-words (Arc 6 P1; ✓ SHIPPED). §A.13.34 parallel-strand-framing REQUIRED at authoring time per Phase 1.2 Slot 4 Round 2 fix precedent — read-consonant-blends crosses the phonological-awareness/phonics-decoding strand-boundary at the consonant-cluster work; the symbol-dimension differentiates the strands.

targetSlug: read-consonant-blends
language: en
title:
  en: "Read Words with Blends — sounding out tricky consonant clusters"
description:
  en: "Grade 1 early-literacy package teaching kids to READ printed words containing consonant blends (BLAST, STOP, FRESH, JUMP) by sounding out each letter individually + smoothly blending the consonant cluster. Phonics-decoding strand advances 2/11 → 3/11. Per learning-targets.json line 64 prerequisite: read-cvc-words (Arc 6 P1 ✓ SHIPPED). Pair-coherent prerequisite-chain extension from read-cvc-words → read-cvce-words → read-consonant-blends. CVC → CVCe → consonant-blend progression is canonical English phonics scope-and-sequence. Initial-position blends (bl-, br-, cl-, cr-, dr-, fl-, fr-, gl-, gr-, pl-, pr-, sl-, sn-, sp-, st-, sw-, tr-) AND final-position blends (-st, -nd, -mp, -nk, -lt, -ft) both canonical at this skill level. Per §A.13.30 K-1 informal framing: Grade 1 consonant-blend reading is CONCRETE WRITTEN-WORD DECODING — kid sees printed BLAST, sounds out each letter /b/-/l/-/a/-/s/-/t/, smoothly blends to read 'blast'. NOT formal phonotactics theory pedagogy (sonority hierarchy + consonant cluster constraints are post-Grade-3 academic work). CCSS.RF.1.3a primary anchor ('Know the spelling-sound correspondences for common consonant digraphs'; consonant-blend extension implicit). 5 worksheet exercises + 8 printable materials over a 1-week unit. **§A.13.34 parallel-strand-framing applies — see compositionalRationale for full strand-boundary discipline.** Materials list mirrors Literacy 8-material canonical."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class consonant-blend hook + sound-it-out modeling.
      Teacher writes BLAST on the board. "This word has 5
      letters: B-L-A-S-T. Listen as I sound it out letter by
      letter: /b/-/l/-/a/-/s/-/t/. The /b/ and /l/ go together
      at the start — that's a BLEND. The /s/ and /t/ go
      together at the end — also a BLEND. Watch how the blends
      sound together: /bl-a-st/. Now smooth: BLAST!" Teacher
      repeats with STOP /st-o-p/, FROG /fr-o-g/, JUMP /j-u-mp/.
      Pattern emphasis: "A BLEND is 2 (or 3) consonants that
      come together in a word. Each consonant keeps its own
      sound — that's different from digraphs where 2 letters
      make 1 new sound. In blends, we hear EVERY sound, but
      they slide together. Sound out each letter, then slide
      them smooth." Critical pedagogical framing: "Consonant
      blends look hard but they're just 2 sounds glued
      together. If you can read CAT, you can read FLAT. Just
      add the /f/ at the start. CAT → FLAT. Adding a letter,
      adding a sound."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sound-blending decoding routine. Each pair
      receives 8 picture cards with consonant-blend words
      (blast, stop, frog, jump, snake, plant, drum, swim) +
      letter tiles. Pair takes turns: kid A reads a word card
      aloud by sounding-out each letter + blending; kid B
      checks against the picture. Critical pedagogical
      technique: SOUND-OUT-THEN-SLIDE. First, kid sounds out
      each letter individually with brief pause (/b/-/l/-/a/-
      /s/-/t/). Then, kid says it smooth (/bl-a-st/). Then,
      the word emerges (BLAST). Three-step decoding: isolate
      → blend → read. Recast errors with re-modeling: ("you
      read STOP as /so-p/ — let's slow down. /s/-/t/-/o/-/p/.
      That's FOUR sounds, not three. The /s/ and /t/ are a
      BLEND at the start. /st-o-p/. STOP!"). Common error
      patterns: (a) dropping a blend consonant (FROG read as
      /fog/ — kid skipped the /r/; recast with letter-pointing);
      (b) inserting a vowel between blend consonants (BLAST
      read as /belast/ — kid added a vowel; recast with rapid-
      blend modeling); (c) misidentifying digraph as blend
      (SHIP /sh-i-p/ is digraph + vowel + consonant — /sh/ is
      ONE sound, not 2; this package focuses on blends, defers
      digraphs to read-consonant-digraphs Phase 1.4 candidate).
      Optional extension: word-family work with same rime +
      varying initial-blend onset (LAST → BLAST → FAST → MAST
      — family -AST). Kids who mastered Phase 1.3 Slot 1
      blend-onset-rime (oral) transfer the skill to WRITTEN
      onset-rime decoding here.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: word-guess worksheet (kids
      fill in missing-letter positions of consonant-blend
      words given a picture). Station 2: matching worksheet
      (blend word → picture; kids match printed blend words
      to their illustrated meanings). Station 3: picture-sort
      (kids sort consonant-blend words by initial-blend
      category — bl-/cl-/fl- in one group; st-/sn-/sw- in
      another). Station 4: word-scramble (kids unscramble
      consonant-blend words; surface the letter-position
      structure including blend positions).
  closure:
    durationMinutes: 5
    body: |
      Whole-class blend-decoding quick-recall. Teacher writes
      consonant-blend words on the board; class reads each
      aloud after sounding-out. CLAP, STOP, FROG, SNAKE,
      PLANT, BRUSH, SWIM, DRUM. Teacher closes: "Today we
      read words with BLENDS. Blends look harder than CVC
      words because they have MORE LETTERS — but each letter
      still keeps its own sound. Sound out each letter, then
      slide them smooth. That's the SAME skill as reading
      CVC words; we just have more sounds to slide together."
      Forward-pointer: "Next we'll learn about DIGRAPHS —
      letter pairs that make ONE new sound, not two. SH-, CH-,
      TH-, WH-, PH-. Different from blends where each letter
      keeps its sound. Both are common in English, both
      important for reading."

