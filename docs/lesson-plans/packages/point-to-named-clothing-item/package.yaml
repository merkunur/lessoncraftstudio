# Teaching package — point to named clothing item
# Arc 13 Phase 1 (vocabulary-acquisition SATURATION close 23/24 → 24/24).
# Resolves Arc 8 Phase 2 deferred selection.

targetSlug: point-to-named-clothing-item
language: en
title:
  en: "Clothing Words — point to the shirt, pants, hat"
description:
  en: "Preschool / Kindergarten early-literacy package teaching receptive clothing vocabulary. **SATURATES vocabulary-acquisition strand at 24/24.** Resolves Arc 8 Phase 2 deferral. Receptive-language counterpart to existing identify-and-name-clothing (productive). Kids respond to teacher prompts ('point to the shirt') by identifying the named clothing item among displayed pictures. Foundational receptive vocabulary work — receptive comprehension precedes productive naming in language acquisition. Vocab-anchored. Composes against matching + flashcards. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class point-and-name routine. Teacher displays large
      pictures of 8-10 clothing items (shirt, pants, dress, jacket,
      hat, socks, shoes, gloves, scarf, sweater). Teacher names one:
      "Point to the shirt." Class points at the shirt picture.
      Repeat with each item. Reinforces receptive-vocabulary mapping
      (heard word → identified item).
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + listen-and-identify routine. Each pair receives 8
      clothing picture cards spread out. Teacher (or kid A) names a
      clothing item; kid B touches the matching picture. Recast
      errors with explanation ("you touched the hat — let's listen
      again: 'jacket' starts with /j/ sound; the hat starts with
      /h/. Let's find the jacket"). Optional extension: kids name
      clothing items they're wearing today.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (clothing image
      to clothing-name pair). Station 2: matching worksheet (clothing-
      to-body-part — shirt/torso; pants/legs; hat/head). Station 3:
      manipulative cut-outs hands-on dress-the-figure (kids place
      cut-out clothing on paper-figure templates; reinforces clothing-
      vocabulary in body-context). Station 4: word-guess (kids fill
      in clothing-name letters from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class point-and-quiz. Teacher names 5-6 clothing items;
      class collectively points to each picture. Forward-pointer:
      "Today we LEARNED clothing words by pointing. When we come
      back to clothing next, we'll talk about WHEN to wear what —
      sweaters in winter, shorts in summer — connecting clothing to
      WEATHER + SEASONS we already know."

