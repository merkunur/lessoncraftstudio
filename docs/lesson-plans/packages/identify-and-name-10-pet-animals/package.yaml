# Teaching package — identify and name 10 pet animals
# Arc 4 Phase 1. Vocab keys verified: cat, dog, rabbit, hamster, guinea-pig,
# fish, turtle, parrot, canary, gerbil (10/10 with full 11-locale
# IMAGE_VOCABULARY entries). Common Western pets across the 11 platform
# locales; spans mammals + birds + cold-blooded for breadth.

targetSlug: identify-and-name-10-pet-animals
language: en

title:
  en: "Pet animals — identify and name 10 common pets"
description:
  en: "K-Grade 1 vocabulary-acquisition package for 10 common household pets: cat, dog, rabbit, hamster, guinea-pig, fish, turtle, parrot, canary, gerbil. 5 worksheet exercises + 8 printable materials. Theme-agnostic; operator selects target instruction language at material-render time."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up flashcards, names each pet
      in target language, class repeats chorally. Optional: kids share
      personal pet experience ("I have a {item} / My friend has a {item}")
      — connects vocabulary to lived experience. Pin cards to "Pets" word
      wall cluster.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("I see a {item}"). Choral
      reading first, then individual reads. Pair work: kids hold a picture-card,
      partner names the pet. Recast errors in the target frame. Optional
      extension: "where does this pet live?" prompt connecting to home-objects
      (cage, fish tank, basket, garden).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: image-letter matching (matching app, letter
      mode). Station 2: picture-card sorting on the carpet (mammals vs birds
      vs cold-blooded — biological-class attribute sort; or cage-pets vs
      free-roaming pets). Station 3: manipulative cut-outs counting ("count
      out 3 fish").
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Final challenge: teacher names a pet, kids point
      to flashcard. Forward-pointer: "Today we learned 10 pet-animal words.
      When we come back to pets next, this same set will be here for us."

