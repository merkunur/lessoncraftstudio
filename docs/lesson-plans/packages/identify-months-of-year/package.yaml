assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Recite the 12 months in correct sequence in 7 of 10 trials.
      - Name month BEFORE and AFTER a given month in 7 of 10 trials.
      - Identify own birthday-month + name season it falls in in 8 of
        10 trials.

    Differentiation:
    - Pre-K: birthday-month identification only; teacher reads
      sequence aloud.
    - K: all 12 months; sequence + before/after questions.
    - Grade 1+: extend to month-to-season mapping + bridge to date-
      reading work (Arc 13+ candidate).

