compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial / spatial-reasoning
    (multi-route maze navigation). Secondary strand: executive-function
    (path-comparison + decision-making + planning-ahead-multiple-steps).
    Tertiary strand: comparison vocabulary (shorter, longer, more,
    less applied to path lengths).

    Architectural significance: deepens spatial-reasoning strand from
    4/5 → 5/5 — strand approaching saturation (only navigate-complex-
    maze and use-direction-vocabulary unauthored at Arc 9 close;
    Arc 9 Phase 2 use-direction-vocabulary; this Arc 10 Phase 1 closes
    spatial-reasoning strand to saturation). RESOLVES Arc 8 navigate-
    simple-maze forward-pointer to multi-path work.

    Spatial-reasoning strand cohort: use-spatial-position-words (Arc 5)
    + follow-directions-on-grid (Arc 7 Phase 2) + navigate-simple-maze
    (Arc 8 Phase 1) + use-direction-vocabulary (Arc 8 Phase 2) +
    navigate-complex-maze (this package). 5-package cohort spans
    receptive (follow-directions) + productive (use-direction-vocab)
    + receptive-spatial-execution (navigate mazes simple + complex)
    + foundational-vocabulary (position-words). Strand reaches full
    depth at Arc 10 Phase 1.

    Distinctive composition: 3 picture-path exercises spanning all 3
    of picture-path's modes (choose-path × 2 + classic-maze + pathway)
    — FIRST package to use ALL THREE picture-path modes. matching at
    position 3 reinforces vocab base. The mode-spectrum demonstrates
    picture-path's full architectural range.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Multi-route mazes work with ANY start/finish vocabulary;
    substrate-readiness universal.

    K-3 multilingual classroom relevance: spatial-decision-making is
    cognitively universal; verbalization of path-choice reasoning
    ('Path A is shorter, so I pick A') is exactly the kind of
    explanation-providing full-sentence practice K-3 multilingual
    classrooms need. Comparative grammar ('shorter than', 'more
    treasures than') reinforced from compare-by-length (Arc 9 Phase 1).

