# Teaching package — read time on analog clock
# Arc 15 Phase 1 (cognitive-and-executive-function / time-and-routine 3/4 → 4/4 SATURATE).
# 14th saturated strand at this Phase 1.

targetSlug: read-time-on-analog-clock
language: en
title:
  en: "Telling Time — reading hours and half-hours on an analog clock"
description:
  en: "Grade 1 / Grade 2 cognitive + time-and-routine package teaching kids to read time on an analog clock (hour and half-hour positions). Builds on Arc 14 Phase 4 compare-by-time-duration + earlier identify-days-of-week + identify-months-of-year foundation. Saturating package for time-and-routine strand at 4/4 — 14th saturated strand on the platform. Kids learn the 12-position clock face, identify hour hand vs minute hand, read 'o'clock' (12:00, 1:00, 2:00, ... 11:00) + 'half-past' (1:30, 2:30, ... 12:30) positions. Critical bridge from time-duration comparison (Arc 14) to formal time-reading (clock-based). Foundation for elapsed-time + schedule-reading + daily-routine sequencing. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + analog-clock introduction. Teacher displays
      a large analog clock face + points to features: "This is a
      clock — it tells us TIME. See the 12 numbers around the
      edge? See TWO hands? The SHORT hand is the HOUR hand. The
      LONG hand is the MINUTE hand. When the long hand points to
      12, we say it's o'clock. When the long hand points to 6,
      we say half-past." Teacher demonstrates 3 positions: 3:00
      (hour hand on 3, minute on 12) / 6:30 (hour hand between
      6 and 7, minute on 6) / 9:00 (hour on 9, minute on 12).
      Class chants: "3 o'clock! Half past 6! 9 o'clock!" Visual
      anchor for hour + half-hour positions.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + clock-reading routine. Each pair receives 8
      printed analog clock faces showing different times (mix of
      o'clock + half-past: 2:00, 5:30, 8:00, 11:30, 3:30, 7:00,
      10:30, 12:00). Pair takes turns: kid A reads the time
      aloud; kid B writes it in digital format ("2 o'clock" or
      "5:30"). Reverse roles. Teacher circulates; recasts errors
      with hand-tracking ("which hand is the SHORT one? That's
      the HOUR. Where is it pointing? Between 5 and 6. The LONG
      hand is on 6 — half past. So this is half-past 5, or 5:30.").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (analog
      clock face to digital time format). Station 2: missing-
      pieces worksheet (clock face with one hand missing — kid
      identifies what time it should show). Station 3: pattern-
      train worksheet (sequence 4 clock faces showing morning →
      noon → afternoon → evening progression). Station 4:
      vocabulary-tracing-strips for time-reading vocabulary
      (hour, minute, o'clock, half-past, am, pm, morning, noon,
      afternoon, evening).
  closure:
    durationMinutes: 5
    body: |
      Whole-class time-reading review. Teacher displays 6
      different clock faces; class collectively reads each
      time. "4 o'clock! Half past 10! 1 o'clock! Half past 7!"
      Forward-pointer: "Today we read hours and half-hours.
      When we come back next, we can read quarter-hours (15
      and 45 minutes past) + read every-5-minutes time + learn
      AM vs PM!"

