description:
  en: "Comprehensive K-3 bundle centered on bird vocabulary + classification + biological reasoning + visual-discrimination. 4 packages span vocabulary-acquisition (identify-and-name-action-verbs — bird actions: fly, sing, hop, perch) + cognitive classification (classify-animals-by-habitat — birds across diverse habitats: trees + ponds + tundra; identify-living-vs-nonliving — birds as canonical living-things) + visual-discrimination (find-hidden-target-in-busy-scene — birds in busy tree/sky scenes; bird-watching observational skill). Sub-theme bundle (animals → birds) parallel to farm-animals + pets + ocean-life precedents. Suitable for a 4-week classroom unit on birds + bird-watching + ornithology basics; supports K-3 multilingual classrooms with outdoor-observation extensions."

