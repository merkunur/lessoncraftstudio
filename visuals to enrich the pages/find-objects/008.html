<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1000, height=1000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px;
    height: 1000px;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(160deg, #EA580C 0%, #DC2626 60%, #B91C1C 100%);
    position: relative;
  }

  /* Halftone dot pattern overlay */
  .halftone {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(0,0,0,0.08) 1px, transparent 1px);
    background-size: 8px 8px;
    z-index: 1;
  }

  /* Action lines radiating from center */
  .action-lines {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1200px;
    height: 1200px;
    z-index: 2;
    background: conic-gradient(
      from 0deg,
      transparent 0deg, rgba(255,255,255,0.04) 3deg, transparent 6deg,
      transparent 15deg, rgba(255,255,255,0.04) 18deg, transparent 21deg,
      transparent 30deg, rgba(255,255,255,0.04) 33deg, transparent 36deg,
      transparent 45deg, rgba(255,255,255,0.04) 48deg, transparent 51deg,
      transparent 60deg, rgba(255,255,255,0.04) 63deg, transparent 66deg,
      transparent 75deg, rgba(255,255,255,0.04) 78deg, transparent 81deg,
      transparent 90deg, rgba(255,255,255,0.04) 93deg, transparent 96deg,
      transparent 105deg, rgba(255,255,255,0.04) 108deg, transparent 111deg,
      transparent 120deg, rgba(255,255,255,0.04) 123deg, transparent 126deg,
      transparent 135deg, rgba(255,255,255,0.04) 138deg, transparent 141deg,
      transparent 150deg, rgba(255,255,255,0.04) 153deg, transparent 156deg,
      transparent 165deg, rgba(255,255,255,0.04) 168deg, transparent 171deg,
      transparent 180deg, rgba(255,255,255,0.04) 183deg, transparent 186deg,
      transparent 195deg, rgba(255,255,255,0.04) 198deg, transparent 201deg,
      transparent 210deg, rgba(255,255,255,0.04) 213deg, transparent 216deg,
      transparent 225deg, rgba(255,255,255,0.04) 228deg, transparent 231deg,
      transparent 240deg, rgba(255,255,255,0.04) 243deg, transparent 246deg,
      transparent 255deg, rgba(255,255,255,0.04) 258deg, transparent 261deg,
      transparent 270deg, rgba(255,255,255,0.04) 273deg, transparent 276deg,
      transparent 285deg, rgba(255,255,255,0.04) 288deg, transparent 291deg,
      transparent 300deg, rgba(255,255,255,0.04) 303deg, transparent 306deg,
      transparent 315deg, rgba(255,255,255,0.04) 318deg, transparent 321deg,
      transparent 330deg, rgba(255,255,255,0.04) 333deg, transparent 336deg,
      transparent 345deg, rgba(255,255,255,0.04) 348deg, transparent 351deg,
      transparent 360deg
    );
  }

  /* GRATIS badge - comic style */
  .gratis {
    position: absolute;
    top: 25px;
    left: 25px;
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: linear-gradient(145deg, #FACC15 0%, #EAB308 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 28px;
    color: #7C2D12;
    z-index: 20;
    box-shadow: 0 6px 20px rgba(234,179,8,0.5);
    transform: rotate(-8deg);
    border: 4px solid #1C1917;
  }

  /* Grade badge */
  .grade {
    position: absolute;
    top: 35px;
    right: 30px;
    background: #FACC15;
    padding: 10px 22px;
    border-radius: 6px;
    border: 3px solid #1C1917;
    z-index: 20;
    box-shadow: 4px 4px 0px #1C1917;
  }
  .grade span {
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: #1C1917;
    letter-spacing: 0.3px;
  }

  /* Title area */
  .title-area {
    position: absolute;
    top: 35px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }
  .title-line1 {
    font-size: 62px;
    font-weight: 700;
    color: white;
    text-shadow: 4px 4px 0px rgba(0,0,0,0.3), -2px -2px 0px rgba(0,0,0,0.15);
    letter-spacing: 3px;
    line-height: 1;
  }
  .title-line2 {
    font-size: 82px;
    font-weight: 700;
    color: #FACC15;
    text-shadow: 4px 4px 0px rgba(0,0,0,0.3), -2px -2px 0px rgba(0,0,0,0.15);
    letter-spacing: 2px;
    line-height: 1;
    margin-top: -2px;
  }

  /* Comic starburst behind worksheet */
  .starburst {
    position: absolute;
    top: 280px;
    left: 50%;
    transform: translateX(-50%);
    width: 520px;
    height: 520px;
    background: #FACC15;
    clip-path: polygon(
      50% 0%, 58% 18%, 73% 3%, 72% 22%, 90% 15%, 82% 32%,
      100% 35%, 88% 45%, 100% 55%, 88% 58%, 97% 73%, 80% 68%,
      85% 85%, 72% 75%, 65% 92%, 57% 78%, 50% 95%, 43% 78%,
      35% 92%, 28% 75%, 15% 85%, 20% 68%, 3% 73%, 12% 58%,
      0% 55%, 12% 45%, 0% 35%, 18% 32%, 10% 15%, 28% 22%,
      27% 3%, 42% 18%
    );
    z-index: 5;
    box-shadow: 0 0 40px rgba(250,204,21,0.3);
  }

  /* Worksheet in center */
  .worksheet-frame {
    position: absolute;
    top: 310px;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 337px;
    background: white;
    border-radius: 6px;
    overflow: hidden;
    z-index: 8;
    border: 5px solid #1C1917;
    box-shadow: 8px 8px 0px rgba(0,0,0,0.25);
  }
  .worksheet-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Speech bubbles */
  .speech {
    position: absolute;
    padding: 12px 22px;
    border-radius: 20px;
    border: 3px solid #1C1917;
    font-weight: 700;
    font-size: 26px;
    z-index: 12;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
    letter-spacing: 1px;
  }
  .speech::after {
    content: '';
    position: absolute;
    width: 0;
    height: 0;
    border-style: solid;
  }

  /* GEFUNDEN! - green bubble top-right */
  .speech-found {
    top: 310px;
    right: 85px;
    background: #84CC16;
    color: #1C1917;
    transform: rotate(6deg);
  }
  .speech-found::after {
    bottom: -16px;
    left: 30px;
    border-width: 16px 12px 0 12px;
    border-color: #84CC16 transparent transparent transparent;
  }

  /* WOW! - cyan bubble left */
  .speech-wow {
    top: 460px;
    left: 60px;
    background: #06B6D4;
    color: white;
    transform: rotate(-8deg);
  }
  .speech-wow::after {
    bottom: -14px;
    right: 25px;
    border-width: 14px 10px 0 10px;
    border-color: #06B6D4 transparent transparent transparent;
  }

  /* SUPER! - yellow bubble bottom-right */
  .speech-super {
    top: 590px;
    right: 70px;
    background: #FACC15;
    color: #1C1917;
    transform: rotate(5deg);
  }
  .speech-super::after {
    bottom: -14px;
    left: 20px;
    border-width: 14px 10px 0 10px;
    border-color: #FACC15 transparent transparent transparent;
  }

  /* Comic stars */
  .star {
    position: absolute;
    z-index: 4;
    color: rgba(250,204,21,0.5);
  }
  .st1 { top: 250px; left: 100px; font-size: 30px; }
  .st2 { top: 280px; right: 120px; font-size: 24px; }
  .st3 { bottom: 220px; left: 80px; font-size: 22px; }
  .st4 { bottom: 250px; right: 100px; font-size: 28px; }
  .st5 { top: 380px; left: 140px; font-size: 18px; }
  .st6 { bottom: 300px; right: 140px; font-size: 20px; }

  /* Feature pills */
  .pills {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 15;
  }
  .pill {
    background: rgba(0,0,0,0.25);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    padding: 8px 16px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: white;
    box-shadow: 3px 3px 0px rgba(0,0,0,0.15);
  }

  /* Tagline */
  .tagline {
    position: absolute;
    bottom: 35px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 15;
  }
  .tagline span {
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<!-- Halftone overlay -->
<div class="halftone"></div>

<!-- Action lines -->
<div class="action-lines"></div>

<!-- GRATIS badge -->
<div class="gratis">GRATIS</div>

<!-- Grade badge -->
<div class="grade"><span>Vorschule bis 2. Klasse</span></div>

<!-- Title -->
<div class="title-area">
  <div class="title-line1">ENTDECKER-</div>
  <div class="title-line2">FIEBER!</div>
</div>

<!-- Comic starburst -->
<div class="starburst"></div>

<!-- Worksheet -->
<div class="worksheet-frame">
  <img src="https://www.lessoncraftstudio.com/samples/german/find%20objects/sample-4.jpeg" alt="Suchbild Arbeitsblatt">
</div>

<!-- Speech bubbles -->
<div class="speech speech-found">GEFUNDEN!</div>
<div class="speech speech-wow">WOW!</div>
<div class="speech speech-super">SUPER!</div>

<!-- Comic stars -->
<div class="star st1">&#x2605;</div>
<div class="star st2">&#x2605;</div>
<div class="star st3">&#x2605;</div>
<div class="star st4">&#x2605;</div>
<div class="star st5">&#x2605;</div>
<div class="star st6">&#x2605;</div>

<!-- Feature pills -->
<div class="pills">
  <div class="pill">Lernspiel-Charakter</div>
  <div class="pill">F&uuml;r Lernstationen</div>
  <div class="pill">Fr&uuml;haufsteher-Aufgabe</div>
</div>

<!-- Tagline -->
<div class="tagline">
  <span>Lernen mit Spa&szlig; &mdash; wie ein echtes Abenteuer!</span>
</div>

</body>
</html>
