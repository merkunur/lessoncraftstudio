# Teaching package — read vowel-team words (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 19 Phase 1.4 per Arc 13 Phase 3 sparse-override pattern).
# pt sparse-override for early-literacy / phonics-decoding strand.
# Vowel-team patterns differ structurally from en-vowel-teams:
# pt-BR marks vowel quality via accents (não, café, irmã) and
# nasal-vowel digraphs (ão, ãe, õe) rather than vowel-pair-teams.
# §A.13.34 locale-canonical-curriculum-divergence — pt content
# reframes the package as nasal-and-accented-vowel reading work,
# which is the canonical pt-BR analog at the same skill layer.
# BR-MEC educação infantil register per CLAUDE.md §6 + formal
# "você" address per §17.9. BNCC EF01LP07 + EF02LP04 crosswalk.

title:
  pt: "Vogais Especiais — leia mão, pão, café, bebê, avó"
description:
  pt: "Pacote de letramento inicial para a educação infantil / 1º-2º ano que ensina leitura de palavras com vogais especiais pt-BR — vogais nasais (ão, ãe, õe), vogais acentuadas (á, é, í, ó, ú, ê, ô, ã) + dígrafos vocálicos pt-BR. Constrói sobre o trabalho de letras-sons das vogais do Arco 14. Especificidade pt-BR: pt-BR NÃO usa vowel-teams en-estilo (ai/ee/oa). Em vez disso, o pt-BR marca qualidade vocálica via acentos gráficos (café tem 'é' com acento agudo, sinalizando vogal-aberta; bebê tem 'ê' com circunflexo, sinalizando vogal-fechada) + dígrafos nasais (ão, ãe, õe) que representam vogais-nasais (mão, pão, mãe, irmãs, põe, anões). As crianças aprendem que o acento + o til mudam o som da vogal — não só a aparência. 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Rotina de vogais-especiais com toda a turma. A professora ou o
      professor escreve 'mão' no quadro + diz: 'Esta palavra tem um
      sinal especial — o til ~ — em cima do A. Esse til faz a vogal
      NASAL — sai pelo nariz. Diz: mão. Sente o ar no nariz.' A turma
      repete. Repita com: 'pão' (mesma vogal nasal); 'café' (acento
      agudo no E — vogal aberta /ɛ/); 'bebê' (circunflexo no Ê —
      vogal fechada /e/); 'avó' (acento agudo no O — vogal aberta /ɔ/).
      Estabeleça as 3 marcas: ~ (til = nasal); ´ (agudo = vogal aberta);
      ^ (circunflexo = vogal fechada). Especificidade pt-BR: estas
      marcas são fundamentais à ortografia pt-BR + ausentes em en
      (en marca vogais por POSIÇÃO — silent-e, vowel-teams; pt marca
      por SINAL).
  contentActivity:
    body: |
      Trabalho em duplas + rotina de leia-com-sinal. Cada dupla recebe
      8 cartas com palavras pt-BR de vogais-especiais (mão, pão, mãe,
      café, bebê, avó, irmã, anões). A criança A aponta para uma carta;
      a criança B lê a palavra prestando atenção ao sinal. Refraseie
      os erros com som-esticado ('você leu 'mao' — olhe o til: mão.
      Sai pelo nariz: mãããão. Tente de novo'). Especificidade pt-BR:
      enfatize que palavras-irmãs sem acento mudam de significado —
      'avo' (av-o, sem acento, é vogal-átona) vs 'avó' (vovó); 'pode'
      (verbo) vs 'pôde' (pretérito, com circunflexo). O acento NÃO é
      decoração — muda significado.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios de
      emparelhamento (palavra-com-acento para imagem). Estação 2:
      word-guess (as crianças preenchem letras de vogais-especiais
      a partir de pistas-de-imagem — m_o = mão; b_b_ = bebê). Estação
      3: word-scramble com palavras pt-BR de vogais nasais.
      Estação 4: vocabulary-tracing-strips com palavras de vogais
      acentuadas (café, bebê, avó, avô, ônibus, ônix). As crianças
      praticam traçar o acento JUNTO com a vogal — o sinal é parte
      da letra, não um acréscimo.
  closure:
    body: |
      Quiz-de-acentos com toda a turma. A professora ou o professor
      exibe 5 palavras (algumas com acento, algumas sem); a turma
      identifica + lê cada uma corretamente. Indicador adiante:
      "Hoje aprendemos vogais especiais com acento + til. Quando
      voltarmos à leitura na próxima vez, aprenderemos sobre o som
      do R em pt-BR — R-inicial (rato — som forte) vs R-do-meio
      (caro — som leve) vs RR (carro — som forte). O R muda de
      som dependendo da posição na palavra."

assessmentCriteria:
  pt: |
    Ler 8 de 10 palavras pt-BR com vogais nasais (ão, ãe, õe)
    corretamente em 7 de 10 tentativas. Distinguir vogal-aberta (com
    acento agudo) vs vogal-fechada (com circunflexo) em palavras-
    pares como avó/avô + bebê/café em 7 de 10 tentativas. Ler 6
    palavras novas com acento em 6 de 10 tentativas.

    Diferenciação:
      - Pré-K (3-5 anos): apenas reconhecimento receptivo de palavras
        com til; pareamento palavra-com-imagem.
      - Educação infantil (5-7 anos): leitura independente de palavras
        com til (ão, ãe) + acento agudo (á, é, ó); reconhecimento de
        circunflexo (ê, ô).
      - 1º-2º ano em diante: leitura completa de palavras com todos
        os sinais (~ ´ ^); ponte para regras-de-acentuação pt-BR
        (oxítonas, paroxítonas, proparoxítonas).

compositionalRationale:
  pt: |
    Fio principal: letramento inicial / phonics-decoding (leitura de
    palavras com vogais especiais pt-BR — strand-advancement). Fio
    secundário: phonological awareness (as crianças ouvem as
    diferenças entre vogal-oral + vogal-nasal + vogal-aberta + vogal-
    fechada). Fio terciário: aquisição de vocabulário (palavras pt-BR
    canônicas com sinais gráficos).

    Significância arquitetural: aprofunda o fio phonics-decoding pt-BR
    com o trabalho equivalente ao vowel-team em pt-BR — vogais
    especiais (nasais + acentuadas). §A.13.34 locale-canonical-
    curriculum-divergence: o conceito en de 'vowel-team' (dois sinais
    vocálicos lado a lado = um som-longo) NÃO TEM análogo direto em
    pt-BR. O pt-BR marca qualidade vocálica via:

    - **Til (~)**: ã, õ → vogal nasal. Exemplos: mão, pão, irmã,
      irmãs, põe, mãe.
    - **Acento agudo (´)**: á, é, í, ó, ú → vogal tônica (geralmente
      aberta para e/o). Exemplos: café, vovó, vovô, lápis.
    - **Acento circunflexo (^)**: â, ê, ô → vogal tônica fechada.
      Exemplos: bebê, pôde, ônibus, câmara.
    - **Crase (`)**: à → contração de preposição + artigo. Exemplos:
      à mesa, às vezes.
    - **Dígrafos nasais (ão, ãe, õe)**: representam ditongos nasais
      ou vogais-nasais-finais. Exemplos: cidadão / mãe / lições.

    Reciprocidade pedagógica com phonological awareness pt-BR: as
    crianças brasileiras aprendem essas vogais NA FALA antes do
    letramento; a tarefa do letramento é mapear o som-conhecido
    ao sinal-gráfico correto. Diferente do en, onde silent-e e
    vowel-teams são CONVENÇÕES ortográficas que não correspondem
    a marcadores fonéticos óbvios.

    Crianças brasileiras em contextos de imersão pt-BR (escolas
    bilíngues, programas de imersão linguística, escolas
    internacionais com pt-BR como L2) precisam aprender este sistema
    de sinais explicitamente — frequentemente é o ponto de maior
    dificuldade ortográfica para falantes de en aprendendo pt.

    Currículo BNCC EF01LP07 (identificar acentos + til): EF02LP04
    (ler palavras com diferentes estruturas vocálicas + acentuação).

    Substrato Class B FLEXIBLE: composta contra a amplitude da
    biblioteca de imagens. Vocabulário pt-BR rico em vogais especiais:
    família (mãe, pai, vovó, vovô, irmã, irmão); animais (cão,
    leão, falcão); comida (pão, maçã, melão); ambiente (jardim,
    sertão, manhã, montanha).
