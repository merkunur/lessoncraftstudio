# Teaching package — recognize money amounts up to 1 unit (BRL canonical; FULL OVERRIDE per Path A)
# Arc 18 Phase 1.2 (20th-consecutive pt cadence; CONVENTION DEPARTURE per operator-locked Path A locale-money-system divergence). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF02MA20 (resolução de problemas; sistema monetário brasileiro).
#
# **CONVENTION DEPARTURE NOTICE per §A.13.34 + §A.13.6:**
# This file FULL-OVERRIDES the materials list (NOT inherited from package.yaml via Arc 7+ sparse-override merge). Pair partner identify-coin-values pt.yaml carries the full convention-departure documentation; this package mirrors that convention departure for symmetric pair-coherent ship. Path A operator-locked at Arc 18 Phase 0 §A.13.6 firings batch; departure applies to THIS COMMISSION SPECIFICALLY (slots 2+3 of Phase 1.2).

targetSlug: recognize-money-amounts-up-to-1-unit
language: pt

title:
  pt: "Reconhecer quantias de dinheiro até 1 real — contar moedas para fazer quantias"

description:
  pt: "Pacote de matemática + grandezas e medidas para o 2.º ano do ensino fundamental, FECHANDO o sub-track de dinheiro no strand de medidas em 2/2 SAT. Ensina crianças a CONTAR coleções de moedas para reconhecer quantias até R$1 (= 100 centavos). Apoia-se no pacote-parceiro identify-coin-values (slot 2 da Fase 1.2) onde as crianças aprenderam o valor de cada moeda; este pacote estende esse reconhecimento à CONTAGEM de combinações. Habilidades-exemplo: contar 3 moedas de 10 centavos + 2 moedas de 5 centavos = 40 centavos; contar 1 moeda de 25 centavos + 2 moedas de 10 centavos + 3 moedas de 5 centavos = 60 centavos; contar 4 moedas de 25 centavos = R$1 (= 100 centavos); contar 2 moedas de 50 centavos = R$1. Por §A.13.30 enquadramento informal K-3: a pedagogia de quantia monetária do 2.º ano é CONTAGEM DE COMBINAÇÕES DE MOEDAS até R$1 — as crianças usam contagem-por-saltos (de 25 em 25 para moedas de 25 centavos, de 10 em 10 para moedas de 10, de 5 em 5 para moedas de 5) para computar totais de pequena escala. NÃO aritmética monetária formal com troco ou comparação de preços (conteúdo do 3.º + 4.º ano). 5 exercícios + 7 materiais imprimíveis ao longo de 1 semana. **DIVERGÊNCIA LOCALE-MONEY-SYSTEM per Path A do operador:** este pacote em pt autora conteúdo canonicamente brasileiro (contagem até R$1 com moedas BRL); o irmão en em `package.yaml` autora conteúdo canonicamente americano (contagem até $1 com moedas USD). A lista de materiais é FULL-OVERRIDE per Path A. Ver pacote-parceiro identify-coin-values.pt.yaml para documentação completa da divergência de convenção."

durationMinutes: 30

structure:
  warmup:
    body: |
      Introdução à contagem de dinheiro com toda a turma.
      Você mostra 4 moedas de 25 centavos no quadro.
      "Quanto dinheiro é isso?" A maioria das crianças
      vai saber que cada moeda de 25 centavos vale 25
      centavos do trabalho do dia anterior em identify-
      coin-values. "Vamos contar de 25 em 25: vinte e
      cinco, cinquenta, setenta e cinco, CEM. Quatro
      moedas de 25 centavos fazem 100 centavos — que é
      UM REAL. Então 4 moedas de 25 centavos = R$1."
      Você escreve no quadro: 4 × 25¢ = 25¢ + 25¢ + 25¢
      + 25¢ = 100¢ = R$1. Depois 5 moedas de 10 centavos:
      "Quanto é 5 moedas de 10 centavos? Contem de 10
      em 10: dez, vinte, trinta, quarenta, CINQUENTA.
      5 × 10¢ = 50 centavos = R$0,50 = METADE DE UM
      REAL." Depois uma coleção mista: "E 1 moeda de 25
      centavos + 2 moedas de 10 centavos? Vinte e cinco
      — trinta e cinco — QUARENTA E CINCO. 1 × 25¢ +
      2 × 10¢ = 45 centavos." Faça com a turma: "2
      moedas de 25 centavos + 3 moedas de 5 centavos?"
      A turma conta junto: "Vinte e cinco, CINQUENTA,
      cinquenta e cinco, sessenta, SESSENTA E CINCO. 2
      × 25¢ + 3 × 5¢ = 65 centavos." Ênfase do padrão:
      "Contem as MAIORES moedas primeiro (50 centavos
      e 25 centavos), depois 10 em 10, depois 5 em 5.
      Some à medida que conta. (Note: no Brasil não
      ensinamos moedas de 1 centavo neste pacote — o
      Brasil descontinuou essa moeda em 2018; a menor
      moeda em uso comum é a de 5 centavos.)"
  contentActivity:
    body: |
      Trabalho em duplas + rotina de contagem de moedas.
      Cada dupla recebe cartões de pilha-de-moedas (8
      cartões, cada um mostrando 2-4 moedas em uma
      pequena coleção) + cartões de valor (a quantia que
      cada coleção soma: 15 centavos, 30 centavos, 50
      centavos, 75 centavos, R$1, etc.). A dupla se
      reveza: a criança A pega um cartão de pilha-de-
      moedas + conta o total em voz alta ("uma moeda de
      25 centavos e uma moeda de 10 — vinte e cinco,
      trinta e cinco — 35 centavos!"); a criança B
      encontra o cartão de valor correspondente. Ambas
      verificam a contagem. Depois trocam. Recapture
      erros com pistas de passo de contagem ("você disse
      35 centavos, mas contou a moeda de 10 como 5 — uma
      moeda de 10 vale 10 centavos. Vamos contar de novo:
      25, depois 35. Então sim, 35 centavos — mas
      lembre-se de pular de 10 em 10 para moedas de
      10."). Extensão opcional: as crianças COMPÕEM suas
      próprias coleções para fazer uma quantia-alvo
      (você: 'mostrem-me 30 centavos'; as crianças
      combinam moedas da pilha para totalizar 30
      centavos). Tempo livre no fim: as crianças fazem
      tantas combinações diferentes de R$1 quanto
      possível (4 moedas de 25; 10 moedas de 10; 2
      moedas de 50; 1 moeda de 50 + 2 moedas de 25; 1
      moeda de 50 + 5 moedas de 10; muitas combinações).
      A multiplicidade-de-combinações é conceitualmente
      importante — as crianças aprendem que a MESMA
      quantia pode ser feita de várias maneiras.
  scaffold:
    body: |
      Rotação por estações. Estação 1: atividade de
      correspondência — combinar cada imagem de pilha-de-
      moedas à sua quantia total. Estação 2: math-
      worksheet — dada uma imagem de pilha-de-moedas,
      escrever a quantia total (ex.: 3 × 10¢ + 1 × 5¢
      = 35 centavos). Estação 3: math-puzzle (faça-uma-
      quantia-alvo — dada uma quantia-alvo, a criança
      seleciona moedas de um palette para fazê-la: alvo
      65 centavos; a criança escolhe 2 moedas de 25 + 1
      moeda de 10 + 1 moeda de 5). Estação 4: picture-
      sort — separar imagens de pilha-de-moedas por
      faixa de quantia: 'pequenas quantias' (até 25
      centavos) vs 'quantias médias' (25-75 centavos)
      vs 'grandes quantias' (75 centavos a R$1).
  closure:
    body: |
      Recapitulação rápida de quantia monetária com toda
      a turma. Você mostra 3 pilhas de moedas; a turma
      conta cada uma em coro. "Duas moedas de 25 + uma
      moeda de 10 — vinte e cinco, CINQUENTA, SESSENTA!
      60 centavos!" "Três moedas de 5 + quatro moedas de
      10 — cinco, dez, QUINZE — vinte e cinco, trinta
      e cinco, quarenta e cinco, CINQUENTA E CINCO! 55
      centavos!" "Quatro moedas de 25 — UM REAL! R$1!"
      Você faz o resumo do sub-track de dinheiro:
      "Completamos agora o sub-track de dinheiro das
      medidas — IDENTIFICAR VALORES DE MOEDAS (qual
      moeda é qual, quanto vale) + RECONHECER QUANTIAS
      MONETÁRIAS (contar moedas para encontrar um total).
      Juntas, essas duas habilidades permitem vocês
      lidarem com a maior parte da matemática monetária
      do 2.º ano — comprar algo com moedas, contar seu
      cofrinho, entender preços abaixo de R$1." Aponte
      adiante: "A seguir vamos conhecer dinheiro maior:
      CÉDULAS de diferentes valores (R$2, R$5, R$10,
      R$20), QUANTIAS ACIMA DE R$1, DAR TROCO, COMPARAR
      PREÇOS. A habilidade de contagem que vocês
      aprenderam aqui se escala — vocês vão usar as
      mesmas rotinas de contagem-por-saltos com cédulas
      maiores."

