# Teaching package — match a fragmented image piece to the whole image
# Arc 6 Phase 2 (Option A vocab-depth) — fine-motor-and-visual-spatial /
# visual-discrimination strand. Companion to match-image-to-shadow + find-
# missing-piece. Vocab-anchored. Class B FLEXIBLE; substrate-ready via
# shadow-match app's makeItWhole mode + image-library breadth.

targetSlug: match-image-piece-to-whole
language: en
title:
  en: "Match Piece to Whole — visual-discrimination through fragmentation"
description:
  en: "Pre-K to Kindergarten visual-discrimination package teaching kids to match a fragmented image piece (cut-out portion) back to its complete original image. Foundational visual-spatial skill: kids learn to mentally complete a partial visual into its whole. Vocab-anchored — naming the whole image reinforces vocabulary. Composes against shadow-match app's makeItWhole mode + image-library breadth. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher tears or cuts a paper image into
      2-3 pieces in front of the class. "What was this picture? Can we
      put it back together?" Class collaborates to reassemble. Reinforces
      the conceptual link: piece → whole → identification. Build
      vocabulary: "piece," "part," "whole," "puzzle." Pin to "Visual
      Skills" word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine: teacher shows a picture-card; class names it.
      Then teacher shows a fragmentary piece of the same picture (a
      portion); class identifies which whole image the piece belongs to.
      Pair work: kid A holds a piece; kid B finds the whole image among
      4-5 candidates. Recast errors. Optional extension: kids tear their
      own pictures (with teacher supervision) into 2-3 pieces, swap with
      partner, reassemble — kinesthetic puzzle-solving practice.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: shadow-match worksheet in makeItWhole
      mode (kids draw lines connecting fragmented pieces to whole
      images). Station 2: matching worksheet (whole image-name reinforces
      image vocabulary). Station 3: manipulative cut-outs jigsaw play
      (kids physically cut large picture-cards into 2-3 pieces, mix them
      up, reassemble — concrete visual-spatial reasoning practice).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays 4 fragmented pieces +
      4 whole images; class collectively matches them. Forward-pointer:
      "Today we put pieces back together to form whole pictures. When
      we come back to visual puzzles next, we'll do MORE pieces — like
      jigsaw puzzles — and find missing pieces in pictures."

