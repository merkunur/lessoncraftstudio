# Teaching package — interpret simple pictograph
# Arc 14 Phase 1 (math / data-and-graphs 3/4 → 4/4 SATURATE).
# Builds on Arc 12 interpret-simple-bar-graph + count-and-graph-categories.

targetSlug: interpret-simple-pictograph
language: en
title:
  en: "Pictographs — counting with pictures"
description:
  en: "Kindergarten / Grade 1 math package teaching pictograph interpretation (one picture = one item). Builds on Arc 12 interpret-simple-bar-graph + count-and-graph-categories foundation. Saturating package for math / data-and-graphs strand at 4/4 — completes the data-and-graphs strand established at Arc 12. Pictographs are the K-3 entry point to graph-reading, simpler than bar-graphs because each picture represents exactly one item (no axis interpretation required). Kids count picture-icons within a category, then compare categories ('More dogs than cats — 4 dogs vs 3 cats'). Bridges counting work (Arc 7-12) to data interpretation. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook: real classroom pictograph. Teacher displays
      4-row pictograph (favorite-animals): cats / dogs / fish /
      birds. Each animal in a row represents one student vote. Class
      counts pictures-per-row aloud. Teacher asks: "How many kids
      voted for cats? How many voted for dogs? Which animal got the
      MOST votes?" Visual + verbal anchor establishes the one-picture-
      per-item convention. "Pictographs help us count and compare!"
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + interpretation routine. Each pair receives a
      printed pictograph showing 4 fruit categories (apples,
      bananas, oranges, grapes) with picture-icons per category.
      Pair takes turns: kid A reads off one category's count
      ("4 apples"); kid B answers a comparison question ("Which
      has the MOST? Which has the LEAST? How many MORE bananas
      than oranges?"). Recast errors with visual count-along.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: chart-count worksheet (count
      picture-icons per row). Station 2: matching worksheet (match
      category-name to count). Station 3: more-less worksheet
      (compare two categories' counts). Station 4: vocabulary-
      tracing-strips for graph-reading vocabulary (most, least,
      more, fewer).
  closure:
    durationMinutes: 5
    body: |
      Whole-class pictograph review. Teacher displays new pictograph
      (4 weather-types over a week: sunny / cloudy / rainy /
      snowy). Students count each row + answer 2-3 comparison
      questions. Forward-pointer: "Today we read pictographs where
      one picture = one item. When we come back next, we can
      explore tally-charts where MARKS represent counts, OR move
      to bar-graphs where heights represent counts!"

