compositionalRationale:
  en: |
    Primary strand: world-knowledge / community-and-roles (community
    helper recognition). Secondary strand: vocabulary acquisition
    (vocab-anchored — job titles + tools). Tertiary strand: speaking-
    and-listening (productive description of helper-roles).

    Architectural significance: deepens community-and-roles strand
    from 1/3 → 2/3 packages. Opens 2nd-package depth in this strand.
    Community-helper vocabulary is K-3 social-studies foundational —
    kids encounter community helpers in their daily lives + need
    vocabulary to talk about them.

    Distinctive composition: 3 matching exercises + 1 word-guess +
    1 odd-one-out. School-objects theme used as best-available proxy
    for community-helper imagery (no dedicated community-helpers
    theme in image library; school-objects contains some helper-
    relevant items like books, chalkboards, pencils).

    Class B FLEXIBLE substrate: composes against school-objects theme.
    Substrate has limitation — image library doesn't contain dedicated
    community-helper imagery. Future image-library extension would
    expand this package's substrate; until then, kids work with
    available helper-adjacent vocabulary (school-objects primarily).

    K-3 multilingual classroom relevance: community-helper roles vary
    culturally across platform locales (e.g., police uniforms differ;
    healthcare-system structures vary; community-helper inventories
    differ in different cultures). Locale-variant sparse-overrides can
    adapt for cultural specificity. Universal: every K-3 classroom
    teaches community-helper vocabulary regardless of locale.

curriculumStandards:
  - EYFS.ELG.UW
