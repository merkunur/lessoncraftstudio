assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Sequence 3-event story correctly in 8 of 10 trials.
      - Use first/next/last vocabulary correctly in narration in
        7 of 10 trials.
      - Identify missing event in 3-event story in 6 of 10 trials.

    Differentiation:
    - Pre-K: 2-event sequences (before/after) only.
    - K: 3-event sequences with first/next/last.
    - Grade 1+: extend to 4-5-event sequences (beginning / middle /
      end with multi-event middle) + narrative-comprehension
      questioning ("Why did the character do X next?").

