# Teaching package — identify community helpers
# Arc 11 Phase 1 (Path B; world-knowledge / community-and-roles strand
# deepening 1/3 → 2/3). Foundational social-studies vocabulary: kids
# identify community helpers (firefighter, police officer, doctor,
# teacher, mail carrier) + name what each one does.

targetSlug: identify-community-helpers
language: en
title:
  en: "Community Helpers — people who help us in our community"
description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching community helper vocabulary. Builds on existing community-and-roles strand (1 prior package). Kids identify familiar community helpers (firefighter, police officer, doctor, nurse, teacher, mail carrier, librarian, dentist) + name what each helper does. Foundational social-studies vocabulary connecting children to civic + service-occupation awareness. Vocab-anchored — community-helper job titles + their tools/uniforms. Composes against matching + word-guess apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class community-helper introduction. Teacher displays
      pictures of 6-8 community helpers (firefighter, police officer,
      doctor, teacher, mail carrier, librarian, dentist, nurse).
      "These are people in our community who HELP us. Who do you
      know in real life?" Class shares (e.g., "My doctor is Dr.
      Smith"). Teacher writes job titles + asks: "What does each
      person DO?" Class describes briefly ("doctors help sick people";
      "firefighters put out fires"). Reinforces job-as-service-role
      framing.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + helper-tool match. Each pair receives 8 community-
      helper picture cards + 8 tool/uniform cards. Pair matches each
      helper to their tool (firefighter → fire hose; doctor →
      stethoscope; mail carrier → mailbag; teacher → book + chalkboard;
      police officer → badge; nurse → bandage). Recast errors with
      explanation ("you matched the doctor with a fire hose — let's
      think: doctors help sick people; what tools do they use?
      Stethoscopes for listening, thermometers for temperature.
      Try matching the doctor with the stethoscope"). Optional
      extension: kids dramatize a community helper at work + class
      guesses the job.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (helper image
      to job-title pair). Station 2: matching worksheet (helper to
      tool/uniform pair). Station 3: manipulative cut-outs hands-on
      community-helper construction (kids assemble helper-with-tool
      cards). Station 4: word-guess (kids fill in helper-job-title
      letters from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class community-helper-share. Teacher names a community
      helper; class names what the helper does + a tool the helper
      uses. Forward-pointer: "Today we learned about community helpers
      who work in our neighborhood. When we come back to community
      next, we'll learn about COMMUNITY PLACES — where these helpers
      work (the fire station, the hospital, the post office, the
      school)."

