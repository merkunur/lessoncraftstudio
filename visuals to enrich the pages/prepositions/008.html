<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Pr&auml;positionen - Lehrermappe Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #1B2631 0%, #2C3E50 100%); overflow: hidden;">

        <!-- Subtle geometric grid -->
        <div style="position: absolute; inset: 0; opacity: 0.035; background-image: repeating-linear-gradient(0deg, #E8A87C 0px, #E8A87C 1px, transparent 1px, transparent 60px), repeating-linear-gradient(90deg, #E8A87C 0px, #E8A87C 1px, transparent 1px, transparent 60px);"></div>

        <!-- Copper L-shaped corner brackets: top-left -->
        <div style="position: absolute; top: 18px; left: 18px; z-index: 5;">
            <div style="width: 55px; height: 3px; background: linear-gradient(90deg, #E8A87C, transparent); border-radius: 2px;"></div>
            <div style="width: 3px; height: 55px; background: linear-gradient(180deg, #E8A87C, transparent); border-radius: 2px;"></div>
        </div>
        <!-- Copper corner brackets: top-right -->
        <div style="position: absolute; top: 18px; right: 18px; z-index: 5;">
            <div style="width: 55px; height: 3px; background: linear-gradient(270deg, #E8A87C, transparent); border-radius: 2px; margin-left: auto;"></div>
            <div style="width: 3px; height: 55px; background: linear-gradient(180deg, #E8A87C, transparent); border-radius: 2px; margin-left: auto;"></div>
        </div>
        <!-- Copper corner brackets: bottom-left -->
        <div style="position: absolute; bottom: 18px; left: 18px; z-index: 5;">
            <div style="width: 3px; height: 55px; background: linear-gradient(0deg, #E8A87C, transparent); border-radius: 2px;"></div>
            <div style="width: 55px; height: 3px; background: linear-gradient(90deg, #E8A87C, transparent); border-radius: 2px;"></div>
        </div>
        <!-- Copper corner brackets: bottom-right -->
        <div style="position: absolute; bottom: 18px; right: 18px; z-index: 5;">
            <div style="width: 3px; height: 55px; background: linear-gradient(0deg, #E8A87C, transparent); border-radius: 2px; margin-left: auto;"></div>
            <div style="width: 55px; height: 3px; background: linear-gradient(270deg, #E8A87C, transparent); border-radius: 2px; margin-left: auto;"></div>
        </div>

        <!-- GRATIS Badge (copper gradient pill) -->
        <div style="position: absolute; top: 32px; left: 38px; z-index: 100;">
            <div style="background: linear-gradient(145deg, #E8A87C, #D4956B); padding: 12px 26px; border-radius: 28px; box-shadow: 0 6px 20px rgba(232,168,124,0.35);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">GRATIS</span>
            </div>
        </div>

        <!-- KLASSE Badge (copper bordered) -->
        <div style="position: absolute; top: 38px; right: 42px; z-index: 100; padding: 11px 22px; border-radius: 28px; border: 2px solid #E8A87C; background: rgba(232,168,124,0.08);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #E8A87C; letter-spacing: 1.5px;">KLASSE 1-2</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 98px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 56px; color: #ECEFF1; margin: 0; text-shadow: 0 2px 15px rgba(232,168,124,0.12); letter-spacing: 1px;">Pr&auml;positionen</h1>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 22px; color: #E8A87C; margin: 10px 0 0 0; letter-spacing: 3px; text-transform: uppercase;">Arbeitsbl&auml;tter-Generator</p>
        </div>

        <!-- Quality Seal -->
        <div style="position: absolute; top: 110px; right: 62px; z-index: 50;">
            <div style="width: 82px; height: 82px; border: 3px solid #E8A87C; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative;">
                <div style="width: 62px; height: 62px; background: linear-gradient(145deg, #E8A87C, #D4956B); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(232,168,124,0.3);">
                    <span style="font-size: 20px; line-height: 1; color: white;">&#10003;</span>
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 8px; color: white; letter-spacing: 1px; margin-top: 2px;">QUALIT&Auml;T</span>
                </div>
            </div>
        </div>

        <!-- Ambient copper glow behind worksheets -->
        <div style="position: absolute; top: 52%; left: 50%; width: 650px; height: 450px; transform: translate(-50%, -50%); background: radial-gradient(ellipse, rgba(232,168,124,0.07) 0%, transparent 65%); border-radius: 50%;"></div>

        <!-- 3 Worksheets with hero center -->
        <div style="position: absolute; top: 280px; left: 50%; transform: translateX(-50%); width: 820px; height: 390px; z-index: 20;">

            <!-- Left worksheet -->
            <div style="position: absolute; left: 50px; top: 35px; z-index: 10;">
                <div style="width: 200px; height: 259px; background: white; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.35), 0 0 0 2px rgba(232,168,124,0.3); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/prepositions/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Pr&auml;positionen Arbeitsblatt">
                </div>
            </div>

            <!-- Center worksheet (hero, largest, copper frame + glow) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 20;">
                <div style="position: relative;">
                    <div style="width: 245px; height: 317px; background: white; border-radius: 10px; box-shadow: 0 16px 45px rgba(0,0,0,0.4), 0 0 0 4px #E8A87C, 0 0 35px rgba(232,168,124,0.15); overflow: hidden;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/prepositions/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Pr&auml;positionen Arbeitsblatt">
                    </div>
                </div>
            </div>

            <!-- Right worksheet (answer key) -->
            <div style="position: absolute; right: 50px; top: 35px; z-index: 10;">
                <div style="width: 200px; height: 259px; background: white; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.35), 0 0 0 2px rgba(232,168,124,0.3); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/prepositions/sample-2-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="L&ouml;sungsblatt">
                </div>
                <!-- Answer key label -->
                <div style="position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); background: rgba(232,168,124,0.9); padding: 4px 14px; border-radius: 10px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: white; letter-spacing: 0.5px;">L&ouml;sungsblatt</span>
                </div>
            </div>
        </div>

        <!-- Frosted-glass feature cards with copper borders -->
        <div style="position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; z-index: 50;">
            <div style="background: rgba(255,255,255,0.06); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(232,168,124,0.25); text-align: center; min-width: 95px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #ECEFF1; display: block;">L&uuml;cken-</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #E8A87C; display: block;">text</span>
            </div>
            <div style="background: rgba(255,255,255,0.06); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(232,168,124,0.25); text-align: center; min-width: 95px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #ECEFF1; display: block;">Multiple-</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #E8A87C; display: block;">Choice</span>
            </div>
            <div style="background: rgba(255,255,255,0.06); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(232,168,124,0.25); text-align: center; min-width: 95px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #ECEFF1; display: block;">L&ouml;sungs-</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #E8A87C; display: block;">bl&auml;tter</span>
            </div>
            <div style="background: rgba(255,255,255,0.06); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(232,168,124,0.25); text-align: center; min-width: 95px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #ECEFF1; display: block;">Druck-</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #E8A87C; display: block;">fertig</span>
            </div>
        </div>

        <!-- Bottom copper bar -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: linear-gradient(90deg, rgba(232,168,124,0.9) 0%, rgba(212,149,107,0.9) 100%); padding: 12px 40px; border-radius: 8px; box-shadow: 0 4px 18px rgba(232,168,124,0.25); z-index: 50;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: white; letter-spacing: 3px;">PROFESSIONELL GESTALTET &mdash; SOFORT EINSETZBAR</span>
        </div>

    </div>
</body>
</html>
