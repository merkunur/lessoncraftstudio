<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Choral Counting — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=18">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. -->
  <script src="/mini-tools/lcs-shell.js?v=4"></script>
  <script src="/mini-tools/choral-counting.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=sv  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1 / ?embed=compact
    // Tool-specific deep links: ?start=&skip=&cols=&down=1&colwise=1
    // (Free resolves ONLY free-legal configs — a premium deep link waits
    //  for entitlement; premium DOM never leaks.)
    LCS.mount(ChoralCounting, { mount: '#lcs-root' });
  </script>
</body>
</html>
