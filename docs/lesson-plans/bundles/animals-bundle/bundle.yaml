thematicCoherence:
  en: |
    All 6 packages cohere around the animal theme + form a pedagogical
    progression from naming (vocabulary-acquisition) through classification
    (cognitive sorting by attribute) to biological reasoning (living-vs-
    nonliving distinction).

    **Pedagogical sequencing:**
    1. **identify-and-name-10-farm-animals** — Most-familiar animal context
       (kids encounter farm animals in storybooks + early-childhood media).
       Vocabulary anchor for the bundle.
    2. **identify-and-name-10-pet-animals** — Familiar to kids in homes-with-
       pets contexts; bridges to broader animal categories.
    3. **identify-and-name-10-zoo-animals** — Less-familiar exotic animals;
       broadens vocabulary breadth.
    4. **classify-animals-by-habitat** — Cognitive classification using vocab
       from packages 1-3 (farm vs pet vs zoo by habitat).
    5. **classify-animals-by-diet** — Second classification dimension
       (carnivore/herbivore/omnivore); cross-strand cognitive work.
    6. **identify-living-vs-nonliving** — Generalizes from animals-as-living-
       things to broader living-things classification (introduces plants
       + non-living items as contrast).

    **Strand spread:** 3 vocabulary-acquisition + 2 cognitive-sorting +
    1 world-knowledge living-things. Multi-strand bundle composition
    supports diverse K-3 multilingual-classroom needs.

    **Suggested unit duration:** 4-6 weeks. 1 package per week with
    flexibility for review-week + extension-week.

    **Multilingual classroom relevance:** animal vocabulary is high-
    frequency K-3 target across all 11 platform locales with strong
    cognate-rich coverage (cat / chat / gato / Katze / kissa). Bundle
    supports cross-locale lesson-plan delivery.
