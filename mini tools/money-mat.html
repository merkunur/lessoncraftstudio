<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Money Mat — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=18">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. -->
  <script src="/mini-tools/lcs-shell.js?v=3"></script>
  <script src="/mini-tools/money-mat.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=sv  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1 / ?embed=compact
    // Tool-specific deep links: ?band=1|2|3
    // (Free resolves ONLY band 1 — a premium ?band= deep link falls back
    //  to band 1 until entitlement resolves; premium DOM never leaks.)
    LCS.mount(MoneyMat, { mount: '#lcs-root' });
  </script>
</body>
</html>
