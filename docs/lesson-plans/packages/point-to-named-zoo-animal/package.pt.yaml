# Teaching package — point to a named zoo animal (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 6 Phase 3 per Arc 3 Phase 1 sparse-override
# pattern). Validator deep-merges with package.yaml canonical at validation
# time.
#
# Brazilian Portuguese register per CLAUDE.md §6 (pt = BR canonical).
# Formal "você" address per §17.9 cross-locale teacher-address-register lock.

title:
  pt: "Animais de zoológico (Receptivo) — aponta para o animal nomeado"
description:
  pt: "Pacote de aquisição de vocabulário para Pré-K e K sobre o reconhecimento receptivo de 10 animais icônicos de zoológico: leão, tigre, elefante, girafa, zebra, macaco, panda, canguru, pinguim, coala. Variante receptiva do pacote produtivo identify-and-name-10-zoo-animals (Arc 4). A compreensão receptiva precede o uso produtivo nas salas de aula multilíngues K-3."

structure:
  warmup:
    body: |
      Rotina de ação para toda a turma. A professora ou o professor coloca
      10 cartões grandes de imagens de animais de zoológico no tapete ou
      no quadro. Nomeia cada animal em português; a turma aponta para o
      cartão correspondente em coro. Opcional: jogo de sons de animais
      (o animal que ruge é o {leão}; o animal com pescoço comprido é a
      {girafa}) — conecta o reconhecimento receptivo a âncoras sensoriais
      e visuais. Fixe os cartões no mural de palavras "Animais de zoológico".
  contentActivity:
    body: |
      Rotina de mural de bolso com cartões de imagem. A professora ou o
      professor nomeia um animal de zoológico em português; a turma aponta
      para o cartão correspondente. Trabalho em duplas: a criança A nomeia
      um animal de zoológico; a criança B aponta para ele em um pôster
      de cena de zoológico (ou conjunto de cartões de imagem). Refraseie
      os erros gentilmente — pacotes receptivos enfatizam compreensão
      correta sobre produção correta. Extensão opcional: as crianças
      compartilham se viram cada animal em um zoológico, em um livro ou
      na televisão — ancora o reconhecimento na experiência vivida.
  scaffold:
    body: |
      Rotação de estações. Estação 1: emparelhamento (aplicativo matching,
      modo imagem-nome). Estação 2: emparelhamento de sombras (silhueta de
      animal para o animal — reconhecimento visual puro + vocabulário
      receptivo). Estação 3: contagem com recortes manipulativos ("mostra-me
      3 leões; mostra-me 2 macacos"). Superfície receptiva; nenhuma
      produção exigida.
  closure:
    body: |
      Recordação rápida com toda a turma. A professora ou o professor
      nomeia animais de zoológico rapidamente; as crianças apontam para
      o cartão correspondente no tapete. Indicador adiante: "Hoje
      praticamos a compreensão de palavras de animais de zoológico.
      Quando voltarmos aos animais de zoológico próxima vez, começaremos
      a dizer as palavras nós mesmos — passando de 'apontar' para 'nomear'."

assessmentCriteria:
  pt: |
    Receptivo 10/10; transferência ao contexto de cena 8/10; emparelhamento
    palavra-imagem 8/10.

    Diferenciação:
      - Pré-K: 6 animais receptivamente; reconhecimento de cartões apenas.
      - K: 10 animais receptivamente; cartões + cena de zoológico.
      - Primeiro ano em diante: ponte para o pacote produtivo
        identify-and-name-10-zoo-animals (Arc 4) — as crianças passam
        de apontar para nomear.

compositionalRationale:
  pt: |
    Fio principal: aquisição de vocabulário (RECEPTIVO — apontar para o
    animal de zoológico nomeado, não nomeá-lo). Fio secundário:
    discriminação visual (reconhecimento de silhueta de animais de
    zoológico; discriminação de espécies icônicas via padrões de
    marcação — listras/manchas/cor sólida).

    Padrão de pareamento com pacote produtivo: identify-and-name-10-zoo-
    animals (Arc 4) fornece a superfície produtiva; esta variante
    receptiva usa o mesmo cluster de 10 chaves mas compõe-se contra
    exercícios de superfície receptiva.

    Reconhecimento da variação cultural (continuidade da disciplina dos
    Arcos 4-5): a instituição "zoológico" é uma convenção ocidental.
    Algumas culturas podem não ter zoológicos físicos, ou podem ter
    instituições de vida selvagem organizadas de forma diferente. O
    pacote foca no reconhecimento visual de espécies icônicas que as
    crianças encontram em livros, filmes e mídia online,
    independentemente da disponibilidade de zoológico. As 10 espécies
    escolhidas abrangem continentes principais (África, Ásia, Austrália,
    Antártica) — dá às crianças um mapa-mundi implícito através do
    conjunto.

    Variantes receptivas em Pacote 1 + 2 do Arco 6 (point-to-named-color,
    point-to-named-vehicle, point-to-named-zoo-animal): juntas com as
    receptivas do Arco 5 Fase 3 (point-to-named-body-part + point-to-
    named-farm-animal), formam o conjunto fundacional de pacotes
    receptivos para K-3 multilíngue. O padrão receptivo↔produtivo está
    arquiteturalmente validado.
