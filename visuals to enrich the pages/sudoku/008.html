<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Bilder-Sudoku - Unterrichtsqualit&auml;t Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(160deg, #1A2744 0%, #152238 40%, #0D2B26 100%);">

        <!-- Fine grid texture overlay -->
        <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 50px 50px;"></div>

        <!-- Subtle warm glow -->
        <div style="position: absolute; top: 50%; left: 50%; width: 700px; height: 600px; transform: translate(-50%, -50%); background: radial-gradient(ellipse, rgba(212,175,55,0.08) 0%, transparent 60%); border-radius: 50%;"></div>

        <!-- Gold Corner Brackets -->
        <!-- Top-left -->
        <div style="position: absolute; top: 18px; left: 18px; width: 50px; height: 50px; border-top: 3px solid #D4AF37; border-left: 3px solid #D4AF37;"></div>
        <!-- Top-right -->
        <div style="position: absolute; top: 18px; right: 18px; width: 50px; height: 50px; border-top: 3px solid #D4AF37; border-right: 3px solid #D4AF37;"></div>
        <!-- Bottom-left -->
        <div style="position: absolute; bottom: 18px; left: 18px; width: 50px; height: 50px; border-bottom: 3px solid #D4AF37; border-left: 3px solid #D4AF37;"></div>
        <!-- Bottom-right -->
        <div style="position: absolute; bottom: 18px; right: 18px; width: 50px; height: 50px; border-bottom: 3px solid #D4AF37; border-right: 3px solid #D4AF37;"></div>

        <!-- GRATIS Badge - top left -->
        <div style="position: absolute; top: 35px; left: 35px; z-index: 100;">
            <div style="width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(145deg, #D4AF37 0%, #B8860B 100%); box-shadow: 0 6px 25px rgba(212,175,55,0.4), inset 0 -3px 10px rgba(0,0,0,0.2), inset 0 3px 6px rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 25px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.4);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge - top right with gold border -->
        <div style="position: absolute; top: 42px; right: 40px; background: transparent; padding: 10px 22px; border-radius: 25px; border: 2px solid #D4AF37; z-index: 100;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #D4AF37; letter-spacing: 0.5px;">VORSCHULE&ndash;2. KLASSE</span>
        </div>

        <!-- Premium Qualit&auml;t Seal -->
        <div style="position: absolute; top: 110px; left: 50%; transform: translateX(-50%); z-index: 20;">
            <div style="width: 120px; height: 120px; border-radius: 50%; border: 3px solid #D4AF37; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(212,175,55,0.2);">
                <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(145deg, #1A2744, #0D2B26); display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px; color: #D4AF37; letter-spacing: 2px;">PREMIUM</span>
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: #D4AF37; letter-spacing: 1px;">Qualit&auml;t</span>
                </div>
            </div>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 245px; left: 0; right: 0; text-align: center; z-index: 10;">
            <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; color: #E0F2F1; text-shadow: 0 2px 10px rgba(0,0,0,0.3); line-height: 1;">Bilder-Sudoku</div>
            <div style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 24px; color: #80CBC4; letter-spacing: 3px; margin-top: 6px;">f&uuml;r Kinder</div>
        </div>

        <!-- 3-Worksheet Display -->
        <div style="position: absolute; top: 355px; left: 50%; transform: translateX(-50%); width: 820px; height: 370px; z-index: 5;">

            <!-- Left worksheet (sample-4 flowers) with label -->
            <div style="position: absolute; left: 30px; top: 20px; z-index: 6;">
                <div style="background: rgba(26,39,68,0.8); border: 2px solid rgba(212,175,55,0.3); border-radius: 10px; padding: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.3);">
                    <img src="https://www.lessoncraftstudio.com/samples/german/sudoku/sample-4.jpeg" style="width: 195px; height: 253px; object-fit: cover; border-radius: 6px; display: block;" alt="Bilder-Sudoku Blumen">
                </div>
                <div style="text-align: center; margin-top: 8px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #80CBC4; letter-spacing: 1px;">Arbeitsblatt</span>
                </div>
            </div>

            <!-- Center worksheet (sample-1 animals) - gold glow hero -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 10;">
                <div style="background: rgba(26,39,68,0.8); border: 2px solid #D4AF37; border-radius: 12px; padding: 8px; box-shadow: 0 0 40px rgba(212,175,55,0.25), 0 12px 40px rgba(0,0,0,0.4);">
                    <img src="https://www.lessoncraftstudio.com/samples/german/sudoku/sample-1.jpeg" style="width: 215px; height: 279px; object-fit: cover; border-radius: 8px; display: block;" alt="Bilder-Sudoku Tiere">
                </div>
                <div style="text-align: center; margin-top: 8px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #D4AF37; letter-spacing: 1px;">Hauptblatt</span>
                </div>
            </div>

            <!-- Right worksheet (answer key sample-1) with label -->
            <div style="position: absolute; right: 30px; top: 20px; z-index: 6;">
                <div style="background: rgba(26,39,68,0.8); border: 2px solid rgba(212,175,55,0.3); border-radius: 10px; padding: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.3);">
                    <img src="https://www.lessoncraftstudio.com/samples/german/sudoku/sample-1-answer.jpeg" style="width: 195px; height: 253px; object-fit: cover; border-radius: 6px; display: block;" alt="Bilder-Sudoku L&ouml;sung">
                </div>
                <div style="text-align: center; margin-top: 8px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #80CBC4; letter-spacing: 1px;">L&ouml;sungsblatt</span>
                </div>
            </div>
        </div>

        <!-- Frosted Glass Feature Cards -->
        <div style="position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 20;">
            <!-- Card 1: Druckfertig -->
            <div style="background: rgba(255,255,255,0.07); backdrop-filter: blur(8px); border: 1px solid rgba(212,175,55,0.2); border-radius: 14px; padding: 14px 18px; text-align: center; width: 155px;">
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; color: #E0F2F1;">Druckfertig</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 13px; color: #80CBC4; margin-top: 3px;">300 DPI</div>
            </div>
            <!-- Card 2: Schwierigkeitsstufen -->
            <div style="background: rgba(255,255,255,0.07); backdrop-filter: blur(8px); border: 1px solid rgba(212,175,55,0.2); border-radius: 14px; padding: 14px 14px; text-align: center; width: 165px;">
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; color: #E0F2F1;">Schwierigkeitsstufen</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 13px; color: #80CBC4; margin-top: 3px;">Differenziert</div>
            </div>
            <!-- Card 3: L&ouml;sungsbl&auml;tter -->
            <div style="background: rgba(255,255,255,0.07); backdrop-filter: blur(8px); border: 1px solid rgba(212,175,55,0.2); border-radius: 14px; padding: 14px 18px; text-align: center; width: 155px;">
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; color: #E0F2F1;">L&ouml;sungsbl&auml;tter</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 13px; color: #80CBC4; margin-top: 3px;">Inklusive</div>
            </div>
            <!-- Card 4: Themenvielfalt -->
            <div style="background: rgba(255,255,255,0.07); backdrop-filter: blur(8px); border: 1px solid rgba(212,175,55,0.2); border-radius: 14px; padding: 14px 18px; text-align: center; width: 155px;">
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; color: #E0F2F1;">Themenvielfalt</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 13px; color: #80CBC4; margin-top: 3px;">Abwechslungsreich</div>
            </div>
        </div>

        <!-- Bottom Gold Strip -->
        <div style="position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); z-index: 20;">
            <div style="background: linear-gradient(90deg, transparent 0%, rgba(212,175,55,0.15) 20%, rgba(212,175,55,0.25) 50%, rgba(212,175,55,0.15) 80%, transparent 100%); padding: 12px 50px; border-radius: 25px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 19px; color: #D4AF37; letter-spacing: 1.5px;">Sofort einsetzbar im Unterricht</span>
            </div>
        </div>

    </div>
</body>
</html>
