# Teaching package — identify school staff roles
# Arc 15 Phase 1 (science / community-and-roles 1/2 → 2/2 SATURATE).
# 13th saturated strand at this Phase 1.

targetSlug: identify-school-staff-roles
language: en
title:
  en: "School Staff — who works at our school?"
description:
  en: "Pre-K / Kindergarten community-and-roles package teaching kids to identify school staff roles. Builds on Arc 11 identify-community-helpers foundation; extends community-roles understanding from broad community (firefighter, doctor, police officer) to school-specific staff roles (teacher, principal, librarian, school nurse, cafeteria worker, janitor, bus driver, school counselor). Saturating package for community-and-roles strand at 2/2 — 13th saturated strand on the platform. Critical bridge from broad community-roles vocabulary to immediate-classroom-context relevance for K-3 students. Pairs naturally with classroom-bundle (Pillar 2 Arc 2 Phase 2 precedent). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + school-staff introduction. Teacher
      displays photos of school staff (the teacher themselves +
      principal + librarian + nurse + cafeteria worker + janitor
      + bus driver). "Look! These are people who work at OUR
      school. They help us every day. Let's learn their names +
      what they do." Teacher introduces each role with what-they-
      do anchor: "The teacher teaches us. The principal LEADS
      the school. The librarian helps with BOOKS. The nurse
      helps when someone is sick. The cafeteria worker cooks
      our lunch." Visual + verbal anchor establishes school-
      staff role-vocabulary.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + identification routine. Each pair receives
      8 picture cards (school-staff role pictures) + 8 task
      cards ("makes our lunch" / "drives the bus" / "checks if
      we're sick" / "leads the school" / "helps with books" /
      "cleans the school" / "teaches us" / "helps with feelings").
      Pair matches role-picture to task-description. Teacher
      circulates; recasts errors ("the nurse drives the bus? Let's
      think — the nurse helps when we're sick. Who drives the
      bus? The BUS DRIVER!").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (role-name
      to picture). Station 2: vocabulary-tracing-strips for
      school-staff role names. Station 3: missing-pieces
      worksheet (school scene with one staff member missing —
      kid identifies which role is missing). Station 4: pattern-
      train worksheet (sequence school staff in order of typical
      school-day encounters: bus driver → teacher → cafeteria
      worker → nurse).
  closure:
    durationMinutes: 5
    body: |
      Whole-class review. Teacher asks each student to name one
      school-staff role + describe what they do in 1 sentence.
      "Mrs. Smith is our TEACHER. She teaches us reading + math."
      Forward-pointer: "Today we learned about school staff. When
      we come back next, we can think about people in our
      NEIGHBORHOOD — who helps us in places OUTSIDE school?
      Mail-carriers, doctors, firefighters, librarians at the
      public library!"

