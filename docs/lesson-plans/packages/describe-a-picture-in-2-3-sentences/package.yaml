assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Describe a picture in 2 connected sentences in 7 of 10 attempts.
      - Use position vocabulary (on, under, next to) to describe object
        locations within a picture in 6 of 10 attempts.
      - Listen to a partner's description + repeat 1-2 details back in
        7 of 10 trials.

    Differentiation:
    - Pre-K: 1 sentence per picture; teacher-supported with sentence
      frame; physical pointing supplements speaking.
    - K: 2 sentences per picture using "I see ___" + descriptive
      sentence frame.
    - Grade 1+: 3+ sentences with connected discourse markers ("First...
      Then... Also..."); bridge to narrative-storytelling (Arc 9+
      candidate).

