compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / memory-and-attention.
    Secondary strand: vocabulary acquisition (vocab-anchored — every
    target naming reinforces vocabulary the kid has acquired across
    Arc 1-6 packages). Tertiary strand: visual discrimination (target
    vs distractor recognition).

    Vocab-anchor framing: this Phase 2 package validates Phase 2's "Option
    A vocab-acquisition strand-depth via vocab-adjacent strand expansion"
    interpretation. The cognitive-domain target (memory-and-attention)
    is the architectural shape; the vocabulary-anchor is the pedagogical
    thread. Kids practice find-and-name simultaneously — the cognitive
    task IS the vocabulary surface.

    Distinctive composition: 3 find-objects exercises (positions 1, 3, 5)
    across 3 theme contexts (animals, vehicles, fruits) — same I-Spy
    mechanic; different vocabulary contexts. Validates that find-objects
    architecture generalizes across theme axes. matching at position 2 +
    find-and-count at position 4 break up the find-objects rhythm with
    related-but-distinct vocabulary surfaces.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Substrate-readiness measured by theme-coverage diversity across the
    3 chosen themes (animals + vehicles + fruits all CLEAN per Arc 1-5
    work).

    K-3 multilingual classroom relevance: visual-scanning + naming
    integrates well with target-language acquisition — kids see an
    image, search for it, name it as they find it. The repeated find-
    and-name cycle reinforces vocabulary in cognitive context. Per
    CLAUDE.md §1 multilingual-K-3 framing: vocabulary-anchored cognitive
    work is the platform's pedagogical sweet spot.

curriculumStandards:
  - EYFS.ELG.M
  - EYFS.ELG.UW
  - IB-PYP.HowWeOrganize

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Find named target in a busy scene with 4-6 distractors in 8 of 10
        attempts.
      - Sustain visual attention for 8+ minutes during I-Spy work.
      - Name the target image when found in 8 of 10 trials (vocabulary-
        anchor verification).

    Differentiation:
    - Pre-K: simpler scenes (2-3 distractors) + adult-supported scanning.
    - K: 4-6 distractors per scene; independent scanning.
    - Grade 1+: extend to count-instances-of-target-in-grid (Phase 2
      companion) + complex scenes with 8+ distractors.

