thematicCoherence:
  en: |
    All ~17 packages cohere around the cross-strand K-1 literacy
    foundation. The bundle captures the §A.13.25 cluster-taxonomy
    emergence at the broadest scale in the Pillar 2 ecosystem — a
    cross-strand cluster spanning 4 canonical early-literacy strands
    + supporting work. Anchors the K-1 multilingual classroom
    literacy curriculum.

    **Pedagogical sequencing (4-strand parallel arc; K-1 progression):**

    **Phase A: Phonics-decoding (reading) — 5 packages**
    1. **read-cvc-words** — CVC pattern foundation (cat/dog/sun)
    2. **read-cvce-words** — Silent-e long-vowel pattern (cake/bike)
    3. **read-consonant-blends** — Initial-cluster blending (blue/star)
    4. **read-vowel-teams** — Vowel-team long-vowel patterns (rain/see/boat)
    5. **read-r-controlled-vowels** — Bossy-R patterns (car/her/horn)

    **Phase B: Spelling-and-encoding (writing) — 4 packages**
    6. **spell-cvc-words** — CVC encoding (decoding-encoding reciprocity)
    7. **spell-high-frequency-sight-words-tier-1** — Tier-1 sight words
    8. **spell-words-with-blends** — Blend encoding (Arc 19 P1.4)
    9. **spell-words-with-digraphs** — Digraph encoding (Arc 19 P1.5;
       spelling SAT closure trajectory)

    **Phase C: Speaking-and-listening (oral language) — 5 packages**
    10. **follow-1-step-oral-instruction** — Receptive K foundation
    11. **follow-2-step-oral-instruction** — Sequencing receptive (Arc 14)
    12. **follow-3-step-oral-instruction** — Multi-step receptive
    13. **respond-to-greeting-in-target-language** — Productive greeting
        (Arc 19 P1.4; K-3 multilingual foundational)
    14. **describe-a-picture-in-2-3-sentences** — Productive description

    **Phase D: Writing-composition (productive writing) — 3 packages**
    15. **write-own-name** — Identity-anchored first writing
    16. **label-a-picture-with-1-word** — Single-word labeling
    17. **write-a-simple-sentence-with-picture-prompt** — Full sentence
        (Arc 19 P1.5; sentence-frame foundation)

    **Strand spread:** 5 phonics-decoding + 4 spelling-and-encoding + 5
    speaking-and-listening + 3 writing-composition. Cross-strand bundle
    composition reflects the inherent integration of K-1 literacy
    foundation: reading + writing + speaking + listening develop in
    parallel + reinforce each other through decoding-encoding reciprocity
    + oral-language-as-prerequisite-to-print discipline.

    **Suggested unit duration:** full school year curriculum anchor.
    Bundle is designed as comprehensive K-1 literacy substrate;
    teachers select 4-6 packages per term per strand. Typical K-1
    classroom delivers 60-90 minutes daily literacy instruction
    across the 4 strands; bundle structure supports parallel-strand
    daily delivery (e.g., Monday: phonics-decoding + writing-composition;
    Tuesday: spelling + speaking-and-listening).

    **Multilingual classroom relevance:** HIGHEST. The bundle is
    EXPLICITLY shaped for the §1 audience — international schools,
    dual-language programs, bilingual European schools, immersion
    contexts. Locale-variant sparse-overrides per Phase 3 reframe
    per locale's canonical phonological + orthographic system:

    - **Phase A (phonics-decoding)** adapts per locale's phonology:
      - es/it/pt: syllabic decoding (not CVC); read-spanish-cv-syllable-
        words sub-substitution per learning-targets.json locale-specific
        targets
      - fi: 1:1 grapheme-phoneme + vowel-length; read-finnish-words-
        with-vowel-length sub-substitution
      - de: compound-word boundary recognition; read-german-compound-
        word-boundaries sub-substitution
      - fr: silent-final-consonant + liaison; read-french-silent-final-
        consonant-pattern sub-substitution

    - **Phase B (spelling-and-encoding)** adapts per locale's orthography:
      - pt: LH/NH/RR/SS/CH/Ç digraphs (spell-words-with-digraphs pt
        sparse-override REFRAMED per Arc 19 P1.5)
      - de: SCH digraph + compound-word spelling
      - es: gendered article agreement at sight-word level

    - **Phase C (speaking-and-listening)** adapts per locale's
      pragmatic register:
      - pt-BR: oi/tchau informal + olá/bom-dia/boa-tarde/boa-noite
        formal (respond-to-greeting pt sparse-override per Arc 19 P1.4)
      - de: Sie/du formal-vs-informal distinction
      - Romance: usted/tu / vous/tu / Lei/tu formality distinctions

    - **Phase D (writing-composition)** adapts per locale's syntax:
      - Romance: SVO + pro-drop + adjective-post-noun + gender agreement
      - de/nl: V2 word-order
      - Nordic: relatively close to en SVO
      - pt-BR: ser/estar distinction at sentence-construction level
        (write-a-simple-sentence pt sparse-override per Arc 19 P1.5)

    **Architectural significance:** LARGEST cross-strand bundle in the
    Pillar 2 ecosystem at Arc 19 P2 close. Captures the K-1 multilingual
    classroom literacy curriculum at the broadest scope. Pattern for
    future cross-strand bundles: when multiple canonical strands form
    a coherent curricular cluster, a cross-strand bundle anchors the
    integrated delivery. literacy-foundation-bundle is the first such
    bundle; numeracy-bundle (single-strand cluster) and character-
    knowledge-bundle (single-strand cluster) are narrower in scope.
    Future cross-strand candidates: STEM-foundation (math + science +
    spatial-reasoning); social-studies-foundation (community + history
    + PSED).
