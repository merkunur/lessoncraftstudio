compositionalRationale:
  en: |
    Primary strand: math / measurement (capacity comparison —
    extends measurement strand). Secondary strand: vocabulary-
    acquisition (capacity vocabulary: more, less, equal, empty,
    full, half). Tertiary strand: cognitive-and-executive-function
    / sorting-and-classification.

    Architectural significance: forward-pointer resolution from
    Arc 11 compare-by-weight ('next we extend comparison work to
    capacity'). Builds on Arc 11 compare-by-length + compare-by-
    weight measurement foundation; extends measurement strand to
    volumetric dimension. Critical bridge from spatial measurement
    (length/weight) to volumetric measurement.

    Distinctive composition: 2 more-less (comparison) + 2 matching
    + 1 pattern-train (ordering). Same comparison-focused exercise
    pattern as compare-by-length + compare-by-weight; consistent
    strand-method coherence.

    Class B FLEXIBLE substrate: composes against kitchen_tools
    theme primarily (containers, cups, bottles — capacity-relevant
    items); miscellaneous fallback for other containers.

    K-3 multilingual classroom relevance: capacity vocabulary
    moderate-cognate across 11 platform locales — more/less varies
    significantly (mehr/weniger / más/menos / mais/menos cognate-
    Romance; suomi paljon/vähän distinct). Visual capacity
    comparison universal; vocabulary anchor varies. Locale-variant
    work at Phase 3+ adapts to each locale's measurement
    vocabulary register.

