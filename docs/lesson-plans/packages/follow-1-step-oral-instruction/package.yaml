# Teaching package — follow 1-step oral instructions
# Arc 11 Phase 2 (Option F single-package-strand deepening; early-literacy
# / speaking-and-listening strand 1/10 → 2/10). Foundational receptive-
# language skill.

targetSlug: follow-1-step-oral-instruction
language: en
title:
  en: "Follow Directions — listen and do (1 step at a time)"
description:
  en: "Preschool / Kindergarten early-literacy package teaching 1-step oral instruction following. Builds on existing speaking-and-listening strand (1 prior package). Foundational receptive-language skill: kids hear a 1-step instruction in target language ('touch your nose', 'pick up the red crayon', 'put the book on the shelf') + execute the action. Develops listening comprehension + working memory + classroom-routine readiness. Vocab-anchored — body parts, classroom objects, action verbs all activated. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class Simon-Says-style routine. Teacher gives 1-step
      instructions; class executes ('touch your nose', 'clap your
      hands', 'sit down', 'stand up', 'point to the door'). Repeat
      with 8-10 instructions. Reinforces listen-then-act pattern +
      builds receptive vocabulary across body parts + actions +
      classroom objects.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + give-and-follow routine. Each pair receives 6-8
      instruction cards (with simple action drawings). Pair takes
      turns: kid A reads instruction; kid B executes the action.
      Recast errors with explanation ('you said clap but the card
      says wave — let's look at the picture: the hand is moving
      side-to-side, not making a clapping motion'). Optional
      extension: kids invent their own 1-step instructions for
      partners.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (action verb to
      action picture). Station 2: matching worksheet (image-name
      pairs of body parts + classroom objects used in instructions).
      Station 3: manipulative cut-outs hands-on instruction-execution
      (kids follow instructions to arrange cut-outs: 'put the cat on
      the box'). Station 4: word-guess (kids fill in action-verb
      letters from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class instruction-quiz routine. Teacher gives 4-5 final
      instructions; class executes. Forward-pointer: "Today we
      followed 1-step instructions. When we come back to instructions
      next, we'll follow 2-STEP instructions — 'touch your nose AND
      clap your hands' — holding two actions in mind at once."

