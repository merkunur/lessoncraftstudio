# Teaching package — infer character feeling from picture cue
# Arc 18 Phase 1.3 (language-and-communication / reading-comprehension 6/10 → 7/10). Pair-coherent ship pattern with answer-who-what-where-questions (slot 1 of Phase 1.3; the K foundation) + Arc 17 P1.5 identify-main-character (the WHO-identification precedent). Together with Arc 18 P1.2 identify-setting, forms the K → Grade 1 character-knowledge cluster. Builds on Arc 17 P1.5 identify-main-character (character-identification substrate) + identify-and-name-emotions (emotion-vocabulary substrate; Arc 4 vocabulary-acquisition strand).

targetSlug: infer-character-feeling-from-picture-cue
language: en
title:
  en: "Infer Character Feelings — what is the character feeling?"

description:
  en: "Grade 1 reading-comprehension package teaching kids to INFER a character's emotional state from picture cues (facial expression + body language + situation context). Builds on Arc 17 P1.5 identify-main-character (kids who can identify WHO the story is about can now infer how that character FEELS) + identify-and-name-emotions (Arc 4 vocabulary-acquisition; kids know the emotion-vocabulary words: happy, sad, angry, scared, excited, surprised, proud, frustrated). Reading-comprehension strand advances 6/10 → 7/10. Pair-coherent ship with answer-who-what-where-questions (Slot 1 of Phase 1.3) — together they form the K → Grade 1 character-knowledge cluster (Slot 1 K-level: WHO/WHAT/WHERE extraction; Slot 2 Grade 1: WHO + emotional-state inference). Per §A.13.30 K-1-informal framing: Grade 1 character-feeling-inference is PICTURE-CUE READING + EMOTION-VOCABULARY MATCHING, NOT formal psychological analysis. Kids see a character's face + posture in the picture, read or hear the story-context, and infer the most likely feeling from the emotion-vocabulary they already know. The inferential step is the Grade 1 cognitive demand — kids must move from explicit (WHO is named in the text) to implicit (WHAT is the character feeling, even if not directly stated). CCSS.RL.1.3 primary anchor ('Describe characters, settings, and major events in a story, using key details'); the Grade 1 'describe characters' scope explicitly includes inferred attributes like feelings. 5 worksheet exercises + 8 printable materials over a 1-week unit. Load-bearing material: sentence-strips with this-is-a framePreset (character-emotion frames: 'This character is [emotion]. The character feels [emotion] because [reason from picture].')."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class character-feeling-inference introduction.
      Teacher displays 4 character images, each showing a
      distinct facial expression: a smiling character; a
      character with tears running down their cheeks; a
      character with furrowed brows and clenched fists;
      a character with wide eyes and an open mouth (in
      surprise). "Look at these characters' faces. What
      do you think each one is feeling?" Class names each:
      "Happy! Sad! Angry! Surprised!" Teacher then adds
      story-context to each: "This character is smiling
      AT a birthday cake — happy. This character is crying
      BECAUSE they lost their toy — sad. This character is
      glaring at a broken truck — angry. This character is
      seeing a rainbow for the first time — surprised."
      Pattern emphasis: "We INFER how a character feels.
      Their FACE gives us clues. Their BODY gives us
      clues. The STORY gives us clues. We put the clues
      together + figure out the feeling. This is called
      INFERRING — going beyond what the words say to what
      they MEAN." Teacher writes 4 emotion words on
      board: happy, sad, angry, surprised. Adds 4 more:
      scared, excited, proud, frustrated. "Eight feeling
      words for our character-feeling work today."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + character-feeling routine. Each pair
      receives 8 character scene cards (each card shows a
      character in a situation with clear emotion cues:
      facial expression + body language + context object)
      + 8 emotion word cards (happy, sad, angry, scared,
      excited, surprised, proud, frustrated). Pair takes
      turns: kid A picks a scene card; kid B says aloud:
      "This character is [emotion]. The character feels
      [emotion] because [reason from picture]." Kid B
      finds the matching emotion word card + lays it next
      to the scene. Recast errors with cue-pointing
      ("you said the character is happy, but look — the
      eyebrows are pointing DOWN and the mouth is
      FROWNING. Those are SAD or ANGRY cues. The character
      is also holding broken pieces of a toy — that's
      sad. Let's say: this character is SAD because their
      toy broke."). Optional extension: kids invent their
      own feeling-story — show a scene card to their
      partner, describe what the character is feeling and
      WHY. Note for the teacher: K-1 kids often default
      to two emotions (happy/sad) when 8 emotion words
      are available. Explicitly distinguishing the more
      nuanced emotions (frustrated vs angry; surprised vs
      scared; proud vs happy) is Grade 1 cognitive work.
      Recast errors that conflate similar emotions ("you
      said the character is angry, but their eyes are
      WIDE open and their mouth is hanging open — that's
      surprised, not angry. Angry has narrowed eyes;
      surprised has wide eyes.").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity
      (kids match each character image to the emotion-
      word card; the canonical character-feeling-pairing
      exercise). Station 2: picture-sort activity (sort
      character images into emotion categories: happy
      faces vs sad faces vs angry faces vs surprised
      faces — surfaces facial-expression-cue
      discrimination). Station 3: missing-pieces
      (complete a partial character image — the missing
      piece often is the mouth or the eyebrows, which
      determines the emotion). Station 4: matching
      activity at consolidation (character image to
      emotion-word card; reinforces the canonical
      pairing).
  closure:
    durationMinutes: 5
    body: |
      Whole-class character-feeling quick-recall. Teacher
      displays 4 character images; class chorally
      identifies each feeling. "This character is HAPPY
      — smiling face, eyes crinkled, holding a present!"
      "This character is FRUSTRATED — eyes narrowed,
      hands on hips, looking at a puzzle that won't
      fit!" "This character is PROUD — chin lifted,
      shoulders back, holding a trophy!" "This character
      is SCARED — wide eyes, hands raised, backing away
      from a spider!" Teacher then poses the inference-
      reasoning question: "How do you know the character
      is scared?" (Class: WIDE EYES! HANDS UP! BACKING
      AWAY! THE SPIDER IS SCARY!) Forward-pointer: "Today
      we INFERRED character feelings from picture cues +
      story context. Reading is about understanding
      WHAT'S BEHIND the words — what characters FEEL +
      WHY they feel it. Next we'll learn IDENTIFY THE
      PROBLEM AND SOLUTION (what GOES WRONG in a story,
      and how is it FIXED?). When we know WHO is in the
      story + WHERE they are + WHAT they're doing + HOW
      they feel + WHAT the problem is + HOW it gets
      solved, we know the WHOLE story. We're building
      toward telling complete stories ourselves."

