<!DOCTYPE html>

</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">

            top: 40px;
            left: 40px;

                            height: 220px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 4px;

                <div style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 14px;

                    font-size: 14px;
                    color: #D4A439;
                    margin-top: 10px;
                    letter-spacing: 1px;

            bottom: 170px;
            left: 0;
            right: 0;

            justify-content: center;

                    width: 24px;
                    height: 24px;
                    background: #D4A439;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: white;
                    font-size: 14px;

                    font-family: 'Nunito', sans-serif;
                    font-weight: 600;
                    font-size: 16px;

                    background: #D4A439;
                    border-radius: 50%;

                    font-weight: 600;

            position: absolute;
            bottom: 70px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 25px;
            z-index: 15;

            <!-- FREE Badge -->
            <div style="
                background: linear-gradient(135deg, #8B1E3F 0%, #6B1530 100%);
                color: white;
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;

        <!-- Subtle decorative dots -->
        <div style="position: absolute; top: 260px; left: 150px; width: 8px; height: 8px; background: #D4A439; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; bottom: 250px; right: 150px; width: 8px; height: 8px; background: #1E3A5F; border-radius: 50%; opacity: 0.3;"></div>
