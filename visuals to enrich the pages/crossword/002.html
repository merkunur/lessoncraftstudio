<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Picture Crossword - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(180deg, #FDF5E6 0%, #F5ECD7 100%);">

        <!-- Subtle paper texture overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.03; background-image: url('data:image/svg+xml,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"100\" height=\"100\"><rect fill=\"%231A365D\" x=\"0\" y=\"0\" width=\"1\" height=\"1\"/></svg>'); background-size: 4px 4px;"></div>

        <!-- Crossword grid pattern subtle background -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image:
            linear-gradient(to right, #1A365D 2px, transparent 2px),
            linear-gradient(to bottom, #1A365D 2px, transparent 2px);
            background-size: 50px 50px;"></div>

        <!-- FREE Badge - newspaper EXTRA tab style -->
        <div style="position: absolute; top: 0; left: 30px;">
            <div style="background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); padding: 12px 28px 16px 28px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 15px rgba(249,115,22,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">FREE!</span>
            </div>
        </div>

        <!-- Grade Badge - top right -->
        <div style="position: absolute; top: 25px; right: 30px;">
            <div style="background: #1A365D; padding: 10px 22px; border-radius: 25px; box-shadow: 0 3px 10px rgba(0,0,0,0.15);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: #FDF5E6; letter-spacing: 1px;">GRADES K-3</span>
            </div>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 70px; left: 50%; transform: translateX(-50%); text-align: center;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 68px; font-weight: 700; color: #1A365D; text-shadow: 0 3px 6px rgba(0,0,0,0.1);">What's Inside?</h1>
            <div style="width: 200px; height: 5px; background: linear-gradient(90deg, transparent, #D4A439, transparent); margin: 10px auto 0;"></div>
        </div>

        <!-- Feature Circles - arc arrangement -->
        <div style="position: absolute; top: 180px; left: 50%; transform: translateX(-50%); width: 900px; height: 320px;">

            <!-- Circle 1 - Picture Clues (left) -->
            <div style="position: absolute; left: 30px; top: 60px; text-align: center;">
                <div style="width: 140px; height: 140px; background: linear-gradient(145deg, #1A365D 0%, #0F2744 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(26,54,93,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #D4A439;">
                    <span style="font-size: 60px;">🖼️</span>
                </div>
                <p style="margin: 15px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; color: #1A365D;">Picture<br>Clues</p>
            </div>

            <!-- Circle 2 - Answer Keys -->
            <div style="position: absolute; left: 185px; top: 10px; text-align: center;">
                <div style="width: 140px; height: 140px; background: linear-gradient(145deg, #0D9488 0%, #0F766E 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(13,148,136,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #D4A439;">
                    <span style="font-size: 60px;">🔑</span>
                </div>
                <p style="margin: 15px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; color: #1A365D;">Answer<br>Keys</p>
            </div>

            <!-- Circle 3 - Multiple Grids (center top) -->
            <div style="position: absolute; left: 380px; top: -20px; text-align: center;">
                <div style="width: 150px; height: 150px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(249,115,22,0.5), inset 0 -3px 10px rgba(0,0,0,0.2); border: 6px solid #D4A439;">
                    <span style="font-size: 65px;">📐</span>
                </div>
                <p style="margin: 18px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 600; color: #1A365D;">Multiple<br>Grids</p>
            </div>

            <!-- Circle 4 - Print Ready -->
            <div style="position: absolute; right: 185px; top: 10px; text-align: center;">
                <div style="width: 140px; height: 140px; background: linear-gradient(145deg, #D4A439 0%, #B8860B 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(212,164,57,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #1A365D;">
                    <span style="font-size: 60px;">🖨️</span>
                </div>
                <p style="margin: 15px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; color: #1A365D;">Print<br>Ready</p>
            </div>

            <!-- Circle 5 - No Prep (right) -->
            <div style="position: absolute; right: 30px; top: 60px; text-align: center;">
                <div style="width: 140px; height: 140px; background: linear-gradient(145deg, #F472B6 0%, #DB2777 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(244,114,182,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #D4A439;">
                    <span style="font-size: 60px;">✅</span>
                </div>
                <p style="margin: 15px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; color: #1A365D;">No<br>Prep</p>
            </div>
        </div>

        <!-- Sample Display Section -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 60px; align-items: flex-end;">

            <!-- Worksheet Preview -->
            <div style="text-align: center;">
                <div style="width: 280px; height: 360px; background: white; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.2), 0 0 0 4px #1A365D; overflow: hidden; transform: rotate(-3deg);">
                    <img src="https://www.lessoncraftstudio.com/samples/english/crossword/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Worksheet">
                </div>
                <div style="margin-top: 15px; background: #1A365D; padding: 8px 25px; border-radius: 20px; display: inline-block; transform: rotate(-3deg);">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700; color: #FDF5E6;">WORKSHEET</span>
                </div>
            </div>

            <!-- Answer Key Preview -->
            <div style="text-align: center;">
                <div style="width: 280px; height: 360px; background: white; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.2), 0 0 0 4px #0D9488; overflow: hidden; transform: rotate(3deg);">
                    <img src="https://www.lessoncraftstudio.com/samples/english/crossword/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Answer Key">
                </div>
                <div style="margin-top: 15px; background: #0D9488; padding: 8px 25px; border-radius: 20px; display: inline-block; transform: rotate(3deg);">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700; color: white;">ANSWER KEY</span>
                </div>
            </div>
        </div>

        <!-- Decorative letter tiles in corners -->
        <div style="position: absolute; bottom: 420px; left: 25px; width: 45px; height: 45px; background: linear-gradient(145deg, #FDF5E6 0%, #E8DCC8 100%); border-radius: 5px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.2); transform: rotate(-8deg);">
            <span style="font-size: 26px; font-weight: 700; color: #1A365D;">A</span>
        </div>
        <div style="position: absolute; bottom: 440px; right: 25px; width: 45px; height: 45px; background: linear-gradient(145deg, #FDF5E6 0%, #E8DCC8 100%); border-radius: 5px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.2); transform: rotate(10deg);">
            <span style="font-size: 26px; font-weight: 700; color: #1A365D;">Z</span>
        </div>

    </div>
</body>
</html>
