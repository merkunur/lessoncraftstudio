compositionalRationale:
  en: |
    Primary strand: early-literacy / phonics-decoding
    (read-consonant-blends — strand 2/11 → 3/11). Pair-
    coherent prerequisite-chain extension from read-cvc-words
    (Arc 6 P1; phonics-decoding strand-start) + read-cvce-
    words (post-Arc-6; phonics-decoding strand continuation).
    Per §A.13.31 per-instance content-awareness: `read-cvc-
    words/package.yaml` (Arc 6 P1) + `read-cvce-words/
    package.yaml` are the canonical phonics-decoding strand
    precedents — this package mirrors their materials +
    composedExercises shape with consonant-blend pedagogical
    extension.

    Architectural significance: extends CVC → CVCe →
    consonant-blend progression that is canonical English
    phonics scope-and-sequence. Cognitive progression: 3-
    letter CVC decoding (CAT, DOG) → 4-letter CVCe silent-e
    decoding (CAKE, BIKE) → 4-5-letter consonant-blend
    decoding (BLAST, JUMP, FROG; this package). Each step
    adds complexity to the letter-sound mapping without
    changing the fundamental decode-by-sounding-out
    operation. Closing the CVC→CVCe→blend triplet establishes
    the foundational Grade-1 phonics-decoding sequence.

    Per §A.13.30 K-1 informal framing: Grade 1 consonant-
    blend reading is CONCRETE WRITTEN-WORD DECODING. Kid
    sees printed BLAST, sounds out each letter individually
    (/b/-/l/-/a/-/s/-/t/), smoothly blends the consonant
    cluster to read 'blast'. The pedagogy uses everyday
    language ('blend' / 'slide letters together' / 'sound
    out then slide') + 3-step decoding scaffold (isolate →
    blend → read). NOT formal phonotactics theory pedagogy —
    sonority hierarchy + maximal-onset principle + consonant
    cluster constraints are post-Grade-3 academic work.
    Critical pedagogical move documented in contentActivity:
    SOUND-OUT-THEN-SLIDE 3-step decoding scaffold. Common
    error patterns addressed via re-modeling: dropping a
    blend consonant, inserting a vowel between blend
    consonants, misidentifying digraph as blend (digraphs
    deferred to read-consonant-digraphs Phase 1.4 candidate).

    **§A.13.34 parallel-strand-framing — phonics-decoding
    vs phonological-awareness:** read-consonant-blends is a
    phonics-decoding strand canonical target (WRITTEN
    grapheme-blend decoding; kid sees printed BLAST, sounds
    out /b-l-a-s-t/, reads 'blast'). It is NOT a
    phonological-awareness strand target (ORAL phoneme-blend
    synthesis would be that strand's equivalent). The strand-
    boundary is the SYMBOL DIMENSION: phonics-decoding work
    operates on WRITTEN graphemes integrated with spoken
    phonemes (kid sees printed letters, recalls the
    corresponding sounds, then blends); phonological-
    awareness work operates on SPOKEN phonemes only (no
    printed letters or letter-sound correspondences). Phase
    1.2 Slot 4 blend-phonemes-cvc (oral CVC phoneme-blending)
    + Phase 1.3 Slot 1 blend-onset-rime (oral onset-rime
    blending) are the phonological-awareness strand
    counterparts to this package's phonics-decoding work at
    the consonant-cluster level. Same observable activity
    (combining sounds in consonant-cluster contexts) routes
    through different strands per symbol dimension. Future
    phonological-awareness extension that operates on
    consonant-blend ORAL synthesis (e.g., blend-consonant-
    blend-onset, not in current canonical 9-target enumeration)
    would parallel this package on the phonological-awareness
    side. Explicit §A.13.34 parallel-strand-framing citation
    per Phase 1.2 Slot 4 Round 2 fix precedent — REQUIRED
    at authoring time, NOT as Round 2 fix.

    Per §A.13.29 ground-truth source-citation: composedExercises
    cite `REFERENCE APPS/word-guess.html` (clue-density mode
    for missing-letter-position decoding work on consonant-
    blend words) + `REFERENCE APPS/matching.html` (imgname
    mode for blend-word to picture pairing) + `REFERENCE
    APPS/picture-sort.html` (theme mode for blend-category
    sorting) + `REFERENCE APPS/word-scramble.html` (unified
    mode for letter-position structure reinforcement on
    consonant-blend words).

    Cross-reference to read-cvc-words + read-cvce-words
    (prerequisite chain per learning-targets.json line 64):
    kids must master CVC decoding + CVCe long-vowel decoding
    before consonant-blend decoding. The skill progression
    is pedagogically natural: 3-letter CVCs (CAT) → 4-letter
    CVCes (CAKE) → 4-5-letter consonant-blend words (BLAST,
    JUMP). Each step extends the basic decode-by-sounding-
    out operation to longer / more-complex letter strings.
    This package operationalizes the consonant-blend
    extension via 3-step decoding scaffold + re-modeling
    error correction.

    Cross-reference to blend-onset-rime (Phase 1.3 Slot 1;
    oral) + blend-phonemes-cvc (Phase 1.2 Slot 4; oral):
    consonant-blend reading transfers the oral consonant-
    cluster work to written contexts. Kids who can orally
    blend /b/+/l/+/a/+/s/+/t/ (Phase 1.2 Slot 4) into spoken
    BLAST have the cognitive infrastructure to do the same
    operation while LOOKING at printed B-L-A-S-T (this
    package). The phonological-awareness work is the
    cognitive substrate; phonics-decoding work integrates
    the written grapheme dimension.

    Materials note: 8-material Literacy class stack per
    §A.13.37 + read-cvc-words + read-cvce-words canonical
    precedents. Materials structure mirrors phonics-decoding
    strand siblings (theme: animals provides familiar K-1
    vocabulary with consonant-blend words — frog, snake,
    plant, drum, snail, swing; cross-arc theme consistency
    with phonological-awareness cluster). Manipulative-cut-
    outs at position 6 emits canonical-correct `mode:
    single-repeat` per §A.13.35.

    Distinctive composition: word-guess at position 1
    (introduction) — the missing-letter format naturally
    surfaces blend-position decoding work (kid sees _LAST +
    picture cue, identifies the missing /b/ blend-onset).
    Matching ×2 (positions 2+5) + picture-sort (position 3;
    blend-category sorting) + word-scramble (position 4).
    Same composition shape as Phase 1.2 Slot 4 blend-
    phonemes-cvc + Phase 1.3 Slot 1 blend-onset-rime — the
    cognitive operation (combining sounds in consonant-
    cluster contexts) routes through identical exercise
    affordances; the pedagogical surface adapts via teacher
    framing (oral vs written) + worksheet emphasis on the
    symbol dimension.

    Class B FLEXIBLE substrate: composes against animals
    theme (vocab-anchored with familiar K-1 consonant-blend
    vocabulary; cross-arc theme consistency with Phase
    1.1+1.2+1.3 cluster). No substrate gaps; ships clean.

    K-3 multilingual classroom relevance: consonant-blend
    decoding is universal for languages permitting consonant
    clusters BUT cluster permissibility varies structurally
    per language. English permits rich onset clusters (/str/,
    /spl/, /spr/) + coda clusters (/mp/, /nd/, /lt/). pt-BR
    permits some onset clusters (/pr/, /br/, /tr/, /cl/, /fl/,
    /vr/) but NO coda clusters (pt-BR is open-syllable
    dominant; words don't end in consonant clusters). German
    permits rich clusters in both positions. Multilingual
    K-3 classrooms benefit from explicit consonant-blend
    work in the language-of-instruction's permissible cluster
    inventory + awareness that home-language cluster patterns
    may differ structurally.

