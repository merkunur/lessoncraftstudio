compositionalRationale:
  en: |
    Primary strand: early-literacy / narrative-comprehension (3-event
    story sequencing). Secondary strand: vocabulary-acquisition
    (first / next / last + sequence vocabulary). Tertiary strand:
    cognitive-and-executive-function / sequencing.

    Architectural significance: forward-pointer resolution from Arc
    13 predict-from-picture-cue ('next we extend single-picture
    work to story-sequencing across multiple events'). Builds on
    Arc 12-13 picture-comprehension foundation: label-1-word →
    predict-from-picture → sequence-3-event-story (this package).
    Critical narrative-comprehension foundation; bridges single-
    image work to multi-event causal sequencing.

    Distinctive composition: 2 pattern-train (sequence-learning) +
    2 matching + 1 missing-pieces. Same sequencing-emphasis pattern
    as Arc 14 Phase 1's describe-butterfly-life-cycle + describe-
    water-cycle-basic; demonstrates that pattern-train is the
    canonical sequence-comprehension exercise across both science-
    cycle work AND narrative-sequence work.

    Class B FLEXIBLE substrate: composes against miscellaneous +
    animals + foods themes; story sequences span everyday contexts.

    K-3 multilingual classroom relevance: first/next/last vocab
    varied across 11 platform locales — Romance distinct (primero
    / d'abord / prima) + Germanic distinct (zuerst / eerst /
    först). Visual sequence comprehension translates universally;
    vocabulary anchor varies. Story-sequencing skill universally
    relevant for narrative-comprehension foundation.

