<!DOCTYPE html>

<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(145deg, #1A237E 0%, #311B92 50%, #4A148C 100%); overflow: hidden;">

        <div style="position: absolute; bottom: 0; right: 100px; width: 2px; height: 140px; background: linear-gradient(0deg, rgba(255,214,0,0.4), transparent);"></div>

        <!-- Corner brackets -->
        <div style="position: absolute; top: 25px; left: 25px; width: 55px; height: 55px; border-left: 3px solid rgba(255,214,0,0.6); border-top: 3px solid rgba(255,214,0,0.6);"></div>
        <div style="position: absolute; top: 25px; right: 25px; width: 55px; height: 55px; border-right: 3px solid rgba(255,214,0,0.6); border-top: 3px solid rgba(255,214,0,0.6);"></div>

                <!-- Main worksheet -->
                <div style="box-shadow: 0 25px 70px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,214,0,0.15); border-radius: 18px; overflow: hidden;">
                    <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/chart%20count/Picture%20Graph%201.jpeg" style="width: 300px; height: auto; display: block; border-radius: 16px; border: 6px solid white;">

                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/chart%20count/Picture%20Graph%201%20answer_key.jpeg" style="width: 150px; height: auto; border-radius: 10px; border: 4px solid white;">
            </div>
            <div style="position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); background: rgba(255,214,0,0.95); padding: 5px 12px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 10px; color: #311B92;">ANSWER KEY</span>
            </div>
        </div>

        <!-- Different theme preview - small -->
        <div style="position: absolute; top: 360px; left: 80px; transform: rotate(-6deg); z-index: 45;">
            <div style="box-shadow: 0 15px 40px rgba(0,0,0,0.35); border-radius: 12px;">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/chart%20count/Picture%20Graph%2017.jpeg" style="width: 140px; height: auto; border-radius: 10px; border: 4px solid white;">
            </div>
            <div style="position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); background: rgba(255,214,0,0.95); padding: 5px 12px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 10px; color: #311B92;">OCEAN THEME</span>
            </div>
        </div>

        <!-- Feature cards - frosted glass -->
        <div style="position: absolute; bottom: 115px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 60;">

            <!-- Feature 1: Early Data Skills -->
            <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 16px 14px; border-radius: 14px; border: 1px solid rgba(255,214,0,0.25); width: 120px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.2);">
                <div style="font-size: 26px; margin-bottom: 6px;">📊</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 13px; color: white; line-height: 1.3;">Early Data<br><span style="color: #FFD600;">Skills</span></div>
            </div>

            <!-- Feature 2: 20 Unique Themes -->
            <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 16px 14px; border-radius: 14px; border: 1px solid rgba(255,214,0,0.25); width: 120px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.2);">
                <div style="font-size: 26px; margin-bottom: 6px;">🎨</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 13px; color: white; line-height: 1.3;">Multiple<br><span style="color: #FFD600;">Themes</span></div>
            </div>

            <!-- Feature 3: Answer Keys -->
            <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 16px 14px; border-radius: 14px; border: 1px solid rgba(255,214,0,0.25); width: 120px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.2);">
                <div style="font-size: 26px; margin-bottom: 6px;">✓</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 13px; color: white; line-height: 1.3;">Answer<br><span style="color: #FFD600;">Keys</span></div>
            </div>

            <!-- Feature 4: Print Ready -->
            <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 16px 14px; border-radius: 14px; border: 1px solid rgba(255,214,0,0.25); width: 120px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.2);">
                <div style="font-size: 26px; margin-bottom: 6px;">🖨️</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 13px; color: white; line-height: 1.3;">Print Ready<br><span style="color: #FFD600;">Quality</span></div>
            </div>

        </div>

        <!-- Bottom tagline -->
        <div style="position: absolute; bottom: 35px; left: 0; right: 0; text-align: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: rgba(255,255,255,0.75); letter-spacing: 3px;">CLASSROOM READY QUALITY</span>
        </div>

        <!-- Subtle decorative dots -->
        <div style="position: absolute; top: 270px; left: 45px; width: 7px; height: 7px; background: rgba(255,214,0,0.35); border-radius: 50%;"></div>
        <div style="position: absolute; top: 310px; left: 60px; width: 5px; height: 5px; background: rgba(255,214,0,0.25); border-radius: 50%;"></div>
        <div style="position: absolute; top: 280px; right: 50px; width: 6px; height: 6px; background: rgba(255,214,0,0.3); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 240px; right: 55px; width: 7px; height: 7px; background: rgba(255,214,0,0.35); border-radius: 50%;"></div>

    </div>
