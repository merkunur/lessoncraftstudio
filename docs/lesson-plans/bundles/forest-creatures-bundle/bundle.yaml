description:
  en: "Comprehensive K-3 bundle centered on forest-creature vocabulary + habitat classification + biological reasoning + counting. 4 packages span world-knowledge living-things (identify-living-vs-nonliving — forest creatures as living-things; classify-animals-by-habitat — forest as canonical habitat) + numeracy (count-objects-1-to-10 — counting forest creatures in scenes) + cognitive-sorting (sort-by-category — forest creatures vs other-habitat animals). Sub-theme bundle (animals → forest-creatures) parallel to farm-animals + pets + birds + ocean-life precedents. Forest as habitat enables exploration of woodland fauna: deer, rabbit, fox, owl, squirrel, raccoon, bear. Suitable for a 4-week classroom unit on forest ecosystems + woodland exploration; supports K-3 multilingual classrooms in temperate-forest regions + classrooms exploring biome diversity."

