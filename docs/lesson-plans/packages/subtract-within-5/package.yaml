compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (subtraction within
    5 — extends strand by introducing inverse operation). Secondary
    strand: numeracy (counting backward / counting remainders).
    Tertiary strand: vocabulary-acquisition (subtraction vocabulary:
    minus, take away, subtract, equals, difference).

    Architectural significance: forward-pointer resolution from Arc
    12 add-within-5 ('next we extend numeracy work to subtraction
    within 5 + within 10'). Builds on Arc 12 add-within-5 + add-
    within-10 + add-within-20 addition foundation; introduces
    inverse operation. Pairs with subtract-within-10 (this Phase 4
    sibling); both packages extend addition-subtraction strand to
    full subtraction coverage.

    Distinctive composition: 2 subtraction (cross-out method) + 2
    math-worksheet (vertical format) + 1 matching. Heavy
    subtraction-method emphasis; math-worksheet introduces vertical
    subtraction format for kids ready to move beyond crossed-out
    countables.

    Class B FLEXIBLE substrate: composes against animals + foods
    themes (animals + foods countable for subtraction work).

    K-3 multilingual classroom relevance: subtraction vocabulary
    universally present across 11 platform locales — minus / menos
    / moins / minus (cognate Romance + Germanic). Subtract /
    take-away are more locale-variable. Visual subtraction with
    crossed-out items translates universally; vocabulary anchor
    varies. Locale-variant work at Phase 3+ adapts to each locale's
    K-3 subtraction vocabulary register.

