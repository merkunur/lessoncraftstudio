assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Follow 2-step instructions accurately in 8 of 10 trials.
      - Identify the connector word in a 2-step instruction
        (AND / FIRST-THEN / AFTER) in 7 of 10 trials.
      - Restate a 2-step instruction in own words in 6 of 10
        trials.

    Differentiation:
    - Pre-K: 2-step instructions with concrete physical actions
      only (no abstract sequencing).
    - K: 2-step instructions with both physical + visual actions.
    - Grade 1+: extend to 3-step instructions + bridge to
      sequence-3-event-story narrative-sequencing work.

