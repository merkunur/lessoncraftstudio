# Teaching package — create original AB / AAB / ABB patterns
# Arc 8 Phase 1 (Path B; cognitive-and-executive-function / pattern-recognition
# strand). Class B FLEXIBLE; vocab-anchored. Open-ended creation counterpart
# to Arc 7's rule-following pattern packages (identify-AB-pattern, identify-
# AAB-ABB-patterns, identify-ABC-pattern, identify-AABB-pattern). Validates
# bidirectional pattern-cognition: kids can both IDENTIFY rules AND CREATE
# new patterns following a chosen rule.

targetSlug: create-original-pattern
language: en
title:
  en: "Create Your Own Pattern — design AB, AAB, and ABB patterns"
description:
  en: "Kindergarten cognitive-and-executive-function package teaching original pattern construction. Open-ended creation counterpart to Arc 7's identify-pattern packages: kids choose 2-3 objects + a rule (AB, AAB, or ABB) + construct the pattern. Production-side cognitive flip: instead of recognizing a rule and predicting next item, kids select objects + apply rule themselves. Validates bidirectional pattern-cognition. Vocab-anchored — kids name objects as they construct. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher demonstrates open-ended pattern
      creation. "Today instead of finding the pattern, we'll BUILD one.
      Watch — I'll pick two objects: cat and dog. Now I pick a rule: AB.
      So I make: cat, dog, cat, dog, cat, dog." Class watches. "Now you
      pick. Choose two objects from the cards. Then pick a rule." Each
      kid picks a card pair from the picture-cards deck + picks AB rule.
      Whole-class chants the resulting pattern. Reinforces rule-as-recipe
      framing — the rule is reusable across any 2 objects.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + show-and-tell. Each kid picks a rule (AB or AAB or ABB)
      + picks 2-3 objects from the manipulative cut-outs + builds the
      pattern on a strip-template. Partner names the objects in the
      pattern + identifies the rule. Recast errors with explanation
      ("you said AAB but I see A-B-A — let me show you AAB: cat-cat-dog,
      cat-cat-dog"). Optional extension: kids build a pattern, take it
      apart, and rebuild with different objects but the same rule —
      shows that the rule is independent of the objects.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet AB+AAB
      (kids continue patterns; reinforces rule recognition that
      production builds on). Station 2: pattern-worksheet (mixed mode;
      kids identify and complete patterns). Station 3: manipulative
      cut-outs hands-on pattern construction (kids build their own
      patterns from chosen objects + chosen rule). Station 4:
      flashcards-deck draw + rule-pick (kid draws an object card,
      picks a rule from a written-on-board list AB/AAB/ABB/ABC,
      constructs the resulting pattern with manipulatives). The
      draw-and-pick station randomizes the construction prompt +
      reinforces that patterns work with ANY objects + rule.
  closure:
    durationMinutes: 5
    body: |
      Whole-class share. 4-5 kids show the pattern they built; class
      identifies the rule. Forward-pointer: "Today we created our own
      patterns. When we come back to patterns next, we'll explore
      patterns with NUMBERS — counting patterns where the items are
      not pictures but numbers like 2, 4, 6, 8."

