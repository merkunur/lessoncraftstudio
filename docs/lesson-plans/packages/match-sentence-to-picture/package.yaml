# Teaching package — match a written sentence to a picture
# Arc 12 Phase 2 (Option G; early-literacy / reading-comprehension STRAND-FIRST
# 0/10 → 1/10). Foundational comprehension skill.

targetSlug: match-sentence-to-picture
language: en
title:
  en: "Match Sentence to Picture — read and understand"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching sentence-comprehension via picture-matching. **FIRST reading-comprehension strand package in the catalog.** Builds on Arc 9 identify-letter-by-image-clue + Arc 11 add-within-10 + Arc 12 read-cvc-words (Phase 2 sibling). Kids read short simple sentences (3-5 words; CVC + sight-words) + match each sentence to the matching picture from a small set. Foundational comprehension bridge from word-reading to MEANING-from-text. Vocab-anchored — sentences use familiar K-3 vocabulary. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class read-and-understand routine. Teacher displays a
      picture (e.g., a dog sleeping). Below the picture, teacher
      writes 2 sentences: "The dog is sleeping." and "The cat is
      jumping." "Which sentence describes this picture?" Class
      identifies the dog-sleeping sentence. "How do you know?" Kids
      explain they read the words + matched 'dog' + 'sleeping' to
      the picture. Reinforces read-and-match-meaning framing.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sentence-and-picture routine. Each pair receives 6
      pictures + 6 sentence cards. Pair takes turns: kid A reads a
      sentence aloud; kid B finds the matching picture. Recast
      errors with explanation ("you matched 'The cat eats fish'
      with the picture of a dog — let's check: the sentence has
      'cat' but the picture is a dog. Find the cat picture"). Optional
      extension: kids write their own simple sentences about pictures
      they choose.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (image-name
      pairs reinforce vocabulary used in sentences). Station 2:
      matching worksheet (image-to-sentence; comprehension practice).
      Station 3: sentence-strips (kids fill in language-frame
      sentences using picture cues; bridges from reading-only to
      reading-and-writing). Station 4: word-guess (kids fill in
      letters from sentence-context clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class comprehension-quiz. Teacher displays a picture +
      3 sentences; class collectively picks the matching sentence
      + explains why. Forward-pointer: "Today we matched sentences
      to pictures. When we come back to comprehension next, we'll
      ANSWER QUESTIONS about a picture — 'Who is in the picture?
      What are they doing? Where are they?' — extracting MORE
      meaning from each picture+text pair."

