# Teaching package — identify and name family members
# Arc 12 Phase 1 Path A (substrate-unblocked at Stream A Phase 1 ship; early-
# literacy / vocabulary-acquisition strand 21/24 → 22/24). FAMILY-MEMBERS
# DEFERRAL CHAIN CLOSED. Full agent depth per Arc 5+6+7+8+9+10+11 carry-
# forward.

targetSlug: identify-and-name-family-members
language: en
title:
  en: "Family Members — name the people in your family"
description:
  en: "Preschool / Kindergarten early-literacy package teaching family-member vocabulary. **Substrate-unblocked at Stream A Phase 1 ship (Arc 12 commencement); 7-arc deferral chain closed.** Kids identify and name 8 family-member roles: father, mother, sister, brother, grandfather, grandmother, baby, family. Foundational K-3 vocabulary connecting children to their lived experience — every kid has SOME family configuration; the package validates diverse family structures while building shared vocabulary. Vocab-anchored throughout. Composes against matching + flashcards + sentence-strips. 5 worksheet exercises + 7 printable materials over a 1-week unit. **Cross-cultural sensitivity load-bearing:** family structures vary widely across the platform's K-3 multilingual audience; the package frames family-member vocabulary as roles-kids-might-have-in-their-family rather than prescriptive nuclear-family-only structures."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class family-share routine. Teacher holds up a picture of
      a family with 4-5 members + asks: "Who is in this family?"
      Class identifies (father, mother, sister, brother, baby).
      Teacher then opens space for each kid: "Who is in YOUR family?
      You don't have to say everyone — just one or two people you
      live with or visit often." Kids share. Teacher affirms diverse
      configurations: "Some kids live with both parents; some with
      one parent + grandparents; some with stepparents; some with
      foster parents — every family is different and every family
      is important." Reinforces that family vocabulary names ROLES
      (the role of mother; the role of brother) rather than
      mandating specific structures.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + family-vocabulary routine. Each pair receives 8
      family-member picture cards (father, mother, sister, brother,
      grandfather, grandmother, baby, family). Pair takes turns: kid
      A holds up a card; kid B names the family member AND uses the
      language frame ("This is a ___" / "I have a ___"). Recast
      errors with explanation ("you said grandma — yes, 'grandma' is
      a casual way to say 'grandmother.' Both are correct. In our
      class we'll practice 'grandmother' for our flashcards work").
      Optional extension: kids draw their own family + label each
      member with a family-vocabulary word. Affirm diverse drawings
      (single-parent families, multi-generational families, two-
      parent families of various shapes, foster/adoptive families,
      chosen-family configurations).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (family-member
      image to family-member-name pair). Station 2: matching worksheet
      with sentence-strips ("This is a ___" template using family-
      member vocabulary). Station 3: manipulative cut-outs hands-on
      family-tree construction (kids assemble simple family trees
      using cut-out family members; teacher emphasizes that family-
      tree shapes vary — some trees have many branches, some have
      few; all are valid). Station 4: word-guess (kids fill in
      family-member-word letters from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class family-share-back. Each kid names one family member
      they care about + uses target-language vocabulary ("My
      grandfather lives far away" / "My baby brother is two years
      old"). Forward-pointer: "Today we learned family-member words
      in our target language. When we come back to family work next,
      we'll learn FAMILY-RELATIONSHIP language — like 'this is my
      mother's mother, who is my GRANDMOTHER' — connecting family
      members to each other."

