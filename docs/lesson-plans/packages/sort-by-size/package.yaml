compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / sorting-and-
    classification. Secondary strand: vocabulary acquisition (size-
    comparison vocab-anchored; depends on use-size-comparison-words
    package from Arc 6 Phase 1). Tertiary strand: comparative reasoning
    (sorting-by-size requires same comparative skill as compare-by-
    length / compare-by-weight from numeracy/measurement strand).

    Architectural significance: closes the basic-attribute-sorting
    trilogy. Arc 5 Phase 3 shipped sort-by-color + sort-by-shape; this
    Arc 7 Phase 1 package adds sort-by-size. The trilogy validates
    that sorting-by-attribute architecture generalizes across the 3
    most basic visual attributes (color → shape → size).

    Distinctive composition vs sort-by-color/sort-by-shape: 2 picture-
    sort exercises (positions 1, 5) + 2 big-small exercises (positions
    2, 4) + 1 matching at position 3. The big-small app integration
    distinguishes this package — sort-by-color used picture-sort
    primarily; sort-by-size leverages the existing big-small app for
    size-specific cognitive surface. Validates that sorting packages
    can integrate domain-specific apps when relevant.

    Cross-package prereq integration: this package depends pedagogically
    on use-size-comparison-words (Arc 6 Phase 1) — kids must know
    big/small/medium vocabulary before sorting by size. Validates
    arc-to-arc prereq chain (Arc 6 vocab → Arc 7 sorting using vocab).

    K-3 multilingual classroom relevance: size-recognition is universal;
    size-vocabulary is locale-specific (suppletive forms in pt: maior/
    menor; -er suffix in en: bigger/smaller; analytic mehr/weniger in
    de). The package leverages existing big-small app's 11-locale
    rendering; operator-side instruction language sets rendered output.

