  - EYFS.ELG.M

assessmentCriteria:
  en: |
    By end of 1-2 week unit:
      - Solve N+M = ? for N+M ≤ 5 in 8 of 10 trials with concrete or pictorial
        support.
      - Solve at least 5 add-within-5 problems mentally without manipulatives.
      - Use the addition-sentence vocabulary ("plus", "is/equals") spontaneously
        in oral work.

    Differentiation:
    - Pre-K: solve only with manipulatives; receptive on the addition vocabulary.
    - K: full add-within-5 fluency including mental computation.
    - Grade 1+: extend to add-within-10 (immediate next target) + find-missing-
      addend-within-10 (adjacent inverse-thinking target).

