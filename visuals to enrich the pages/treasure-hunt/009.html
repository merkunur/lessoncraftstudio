        <div style="position: absolute; bottom: 130px; left: 0; right: 0; text-align: center; z-index: 20;">

            <div style="background: rgba(255,255,255,0.06); border: 1.5px solid rgba(212,160,23,0.4); border-radius: 25px; padding: 10px 20px;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.9);">Zwei Modi</span>

                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.9);">5x5 Raster</span>

                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.9);">Mit L&#246;sungen</span>

                <span style="font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.9);">Druckfertig</span>

        </div>

        <!-- Bottom tagline -->
        <div style="position: absolute; bottom: 35px; left: 0; right: 0; text-align: center; z-index: 20;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; color: #D4A017; letter-spacing: 4px; text-transform: uppercase;">Lehrerqualit&#228;t &#8211; Sofort einsetzbar</span>

        <!-- Subtle decorative dots -->
        <div style="position: absolute; top: 180px; right: 40px; width: 25px; height: 25px; background: rgba(2,119,189,0.12); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 210px; left: 40px; width: 18px; height: 18px; background: rgba(212,160,23,0.12); border-radius: 50%;"></div>
