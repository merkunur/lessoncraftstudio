assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Solve a 4×4 picture-sudoku with 8+ given clues (easy) in 7 of 10
        attempts.
      - Solve a 4×4 picture-sudoku with 6 given clues (medium) in 5 of 10
        attempts.
      - Articulate the rule ("each picture appears once per row, once per
        column, once per 2×2 box") when asked.

    Differentiation:
    - Pre-K: 4×4 with 12+ given clues (only 1-2 cells to fill); rule
      demonstrated by teacher; kid completes single deductions.
    - K: 4×4 easy (8-10 given clues).
    - Grade 1+: 4×4 medium → 6×6 easy (solve-6×6-picture-sudoku in
      future arc; per Arc 5 prereq-chain).

