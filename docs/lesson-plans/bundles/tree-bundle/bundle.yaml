  en: "Comprehensive K-3 bundle centered on trees as biological + seasonal anchor for cross-strand work. 5 packages span vocabulary-acquisition (identify-plant-parts — trunk, branch, leaf, root, bark, fruit, seed) + biology (describe-plant-life-cycle — seed, sprout, sapling, mature tree, fruit) + seasonal-cognition (identify-four-seasons — trees change appearance through spring/summer/autumn/winter) + numeracy (count-objects-1-to-10 — counting leaves, branches, apples, pinecones) + cognitive-sorting (sort-by-category — deciduous vs evergreen). Cross-strand biology/seasonal bundle anchored in tree context — particularly suited for outdoor-nature walks + classroom nature-corner + seasonal-change observation across the school year. Suitable for a 4-5 week classroom unit; supports K-3 multilingual classrooms with outdoor-education + environmental-awareness extensions."

