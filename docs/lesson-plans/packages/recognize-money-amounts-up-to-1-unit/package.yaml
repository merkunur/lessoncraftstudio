# Teaching package — recognize money amounts up to 1 unit (USD canonical)
# Arc 18 Phase 1.2 (math / measurement strand — CLOSES money sub-track 1/2 → 2/2 SAT). Pair partner: identify-coin-values (slot 2 of Phase 1.2; opens the sub-track). Together the pair closes the measurement-strand money sub-track. Builds on slot-2 coin-value recognition + Arc 12 count-objects-1-to-20 + add-within-100 (Arc 15) prerequisites.

targetSlug: recognize-money-amounts-up-to-1-unit
language: en
title:
  en: "Recognize Money Amounts up to 1 Dollar — count coins to make amounts"

description:
  en: "Grade 2 math/measurement package CLOSING the money sub-track in the measurement strand at 2/2 SAT. Teaches kids to COUNT collections of coins to recognize amounts up to $1 (= 100 cents). Builds on pair partner identify-coin-values (slot 2 of Phase 1.2) where kids learned each coin's value; this package extends that recognition into COUNTING combinations. Sample skills: count 3 dimes + 2 nickels = 40¢; count 1 quarter + 2 dimes + 3 pennies = 48¢; count 4 quarters = $1 (= 100¢); count 5 nickels + 5 pennies = 30¢. Per §A.13.30 K-3 informal framing: Grade 2 money-amount pedagogy is COIN-COMBINATION COUNTING up to $1 — kids use skip-counting (by 25s for quarters, 10s for dimes, 5s for nickels, 1s for pennies) to compute small-scale totals. The CCSS.2.MD.C.8 direct anchor scope. NOT formal currency arithmetic with making change or comparing prices (Grade 3+ work). 5 worksheet exercises + 7 printable materials over a 1-week unit. **LOCALE-MONEY-SYSTEM DIVERGENCE per operator-locked Path A at Arc 18 Phase 0 §A.13.6 firings batch:** this en package authors USD canonical (counting amounts up to $1 using penny / nickel / dime / quarter / dollar-bill); pt sibling at `package.pt.yaml` authors BRL canonical (counting amounts up to R$1 using 5/10/25/50 centavos + R$1 real) with FULL OVERRIDE of materials list. Arc 7+ sparse-override convention INTENTIONALLY DEPARTED for this commission (slots 2+3 of Phase 1.2). See pair partner identify-coin-values compositionalRationale for full convention-departure documentation."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class money-counting introduction. Teacher
      displays 4 quarters on the board. "How much money
      is this?" Most kids will know each quarter is 25¢
      from yesterday's identify-coin-values work. "Let's
      count by 25s: twenty-five, fifty, seventy-five, ONE
      HUNDRED. Four quarters make 100 cents — which is
      ONE DOLLAR. So 4 quarters = $1." Teacher writes
      this on board: 4 quarters = 25¢ + 25¢ + 25¢ + 25¢
      = 100¢ = $1. Then 5 dimes: "How much is 5 dimes?
      Count by 10s: ten, twenty, thirty, forty, FIFTY.
      5 dimes = 50¢." Then a mixed collection: "What
      about 1 quarter + 2 dimes? Twenty-five — thirty-
      five — FORTY-FIVE. 1 quarter + 2 dimes = 45¢. Try
      it with me: 2 quarters + 3 pennies?" Class counts
      together: "Twenty-five, FIFTY, fifty-one, fifty-
      two, FIFTY-THREE. 2 quarters + 3 pennies = 53¢."
      Pattern emphasis: "Count the BIGGEST coins first
      (quarters by 25s), then dimes by 10s, then nickels
      by 5s, then pennies by 1s. Add them as you go."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + coin-counting routine. Each pair receives
      coin-pile cards (8 cards, each showing 2-4 coins in
      a small collection) + value cards (the amount each
      collection adds to: 15¢, 30¢, 50¢, 75¢, $1, etc.).
      Pair takes turns: kid A draws a coin-pile card +
      counts the total amount aloud ("a quarter and a
      dime — twenty-five, thirty-five — 35 cents!"); kid
      B finds the matching value card. Both verify the
      count. Then swap. Recast errors with count-step
      cues ("you said 35¢ but you counted the dime as 5¢
      — a dime is 10¢. Let me recount: 25, then 35. So
      yes, 35¢ — but make sure you skip-count by 10 for
      dimes."). Optional extension: kids COMPOSE their
      own collections to make a target amount (teacher:
      'show me 30¢'; kids combine coins from the pile to
      total 30¢). Free time at end: kids make as many
      different combinations of $1 as possible (4
      quarters; 10 dimes; 20 nickels; 100 pennies; 2
      quarters + 5 dimes; etc.). The combination-
      multiplicity is conceptually important — kids learn
      that the SAME amount can be made multiple ways.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity —
      match each coin-pile image to its total amount.
      Station 2: math-worksheet — given a coin-pile image,
      write the total amount (e.g., 3 dimes + 1 nickel
      = 35¢). Station 3: math-puzzle (make-target-amount
      — given a target amount, kid selects coins from
      palette to make it: target 65¢; kid picks 2
      quarters + 1 dime + 1 nickel). Station 4: picture-
      sort — sort coin-pile images by amount-range:
      'small amounts' (under 25¢) vs 'medium amounts'
      (25¢-75¢) vs 'large amounts' (75¢-$1).
  closure:
    durationMinutes: 5
    body: |
      Whole-class money-amount quick-recall. Teacher
      displays 3 coin piles; class chorally counts each.
      "Two quarters + 1 dime — twenty-five, FIFTY, SIXTY!
      60¢!" "Three nickels + 4 pennies — five, ten,
      FIFTEEN — sixteen, seventeen, eighteen, NINETEEN!
      19¢!" "Four quarters — ONE DOLLAR! $1!" Teacher
      then poses the money-sub-track summary: "We've now
      completed the money sub-track of measurement —
      IDENTIFY-COIN-VALUES (which coin is which, what
      it's worth) + RECOGNIZE-MONEY-AMOUNTS (counting
      coins to find a total). Together these two skills
      let you handle most money math at Grade 2 — buying
      something with coins, counting your piggy bank,
      understanding prices under $1." Forward-pointer:
      "Next we'll meet bigger money: DOLLAR BILLS in
      different denominations ($5, $10, $20), AMOUNTS
      OVER $1, MAKING CHANGE, COMPARING PRICES. The
      counting skill you learned here scales up — you'll
      use the same skip-counting routines with bigger
      bills."

