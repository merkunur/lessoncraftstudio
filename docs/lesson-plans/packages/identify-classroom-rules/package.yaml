assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify 4-6 classroom rules in their own words in
        7 of 10 trials.
      - Give a short reason for each rule (connected to
        safety / fairness / learning) in 6 of 10 trials.
      - Sort scenario pictures into following-the-rule
        vs not-following-the-rule correctly in 7 of 10
        attempts.
      - Match rule-pictures to corresponding reason-text
        in 6 of 8 attempts.
      - Demonstrate rule-following in 4 of 6 observed
        classroom-routine moments during the week
        (teacher rubric).
      - Use vocabulary 'rule' / 'rules' / 'reason' /
        'safe' / 'fair' / 'agreement' correctly in 5 of
        10 productive-language trials.

    Differentiation:
    - Pre-K: 2-rule starter set (walk + kind words);
      receptive-modeling first (kids respond to
      teacher-prompted rules); productive-language
      emerges as it does without pressure.
    - K: full 4-6 rule set; productive use of rules-
      and-reasons during class discussions; teacher
      rubric on classroom-routine observations across
      the week.
    - Grade 1+: extend to RULES-CO-CREATION (kids
      propose new rules with reasons; class
      collectively votes on which rules to adopt);
      bridge to conflict-resolution work (Arc 18+
      candidates: what to do when a rule is broken,
      how to repair after rule-breaking, how to ask-
      adult-for-help when rules don't cover a
      situation); Grade 1+ also extends to
      classroom-meeting work (regular structured
      class meetings to discuss what's working +
      what could improve).
    - Grade 2+: extend to SCHOOL-WIDE RULES (rules
      that apply outside the classroom: hallway
      rules + cafeteria rules + playground rules);
      bridge to formal classroom-community work
      (kids author class constitutions + classroom
      mission statements + behavior expectations
      with peers); Grade 3+ extends to formal
      civics: rules vs laws + classroom-democracy
      + community decision-making.

