<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Pattern Train - Variety Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 100%); overflow: hidden;">

        <!-- Subtle grid pattern overlay -->
        <div style="position: absolute; inset: 0; background-image:
            linear-gradient(rgba(76,175,80,0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(76,175,80,0.05) 1px, transparent 1px);
            background-size: 50px 50px;"></div>

        <!-- FREE badge -->
        <div style="position: absolute; top: 30px; left: 30px; background: #E53935; padding: 10px 22px; border-radius: 20px; box-shadow: 0 4px 15px rgba(229,57,53,0.4); transform: rotate(-3deg); z-index: 100;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">FREE</span>
        </div>

        <!-- Header -->
        <div style="position: absolute; top: 30px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; color: #1A237E; margin: 0; text-shadow: 2px 2px 0 white;">Multiple Pattern Types</h1>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 22px; color: #4CAF50; margin: 10px 0 0 0;">Choose Your Learning Route!</p>
        </div>

        <!-- Transit Map Area -->
        <div style="position: absolute; top: 140px; left: 50px; right: 50px; bottom: 140px;">

            <!-- GREEN LINE - Easy (AB Pattern) -->
            <div style="position: absolute; top: 30px; left: 0; right: 0; height: 180px;">
                <!-- Route line -->
                <div style="position: absolute; top: 90px; left: 80px; right: 80px; height: 12px; background: linear-gradient(90deg, #4CAF50 0%, #66BB6A 50%, #4CAF50 100%); border-radius: 6px; box-shadow: 0 4px 10px rgba(76,175,80,0.3);"></div>

                <!-- Station dots -->
                <div style="position: absolute; top: 80px; left: 80px; width: 32px; height: 32px; background: white; border: 6px solid #4CAF50; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; left: 280px; width: 32px; height: 32px; background: white; border: 6px solid #4CAF50; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; left: 480px; width: 32px; height: 32px; background: white; border: 6px solid #4CAF50; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; right: 80px; width: 32px; height: 32px; background: white; border: 6px solid #4CAF50; border-radius: 50%;"></div>

                <!-- Mini train icon -->
                <div style="position: absolute; top: 70px; left: 600px; font-size: 40px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));">🚂</div>

                <!-- Label -->
                <div style="position: absolute; top: 5px; left: 50%; transform: translateX(-50%); background: #4CAF50; padding: 8px 25px; border-radius: 20px; box-shadow: 0 3px 10px rgba(76,175,80,0.3);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white;">AB Pattern</span>
                </div>

                <!-- Difficulty label -->
                <div style="position: absolute; top: 130px; left: 50%; transform: translateX(-50%); background: rgba(76,175,80,0.15); padding: 6px 18px; border-radius: 15px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #2E7D32;">EASY</span>
                </div>

                <!-- Worksheet preview -->
                <div style="position: absolute; top: 35px; right: -10px; box-shadow: 0 5px 15px rgba(0,0,0,0.15);">
                    <img src="https://www.lessoncraftstudio.com/samples/english/pattern%20train/sample-1.jpeg" style="width: 110px; height: auto; border-radius: 6px; border: 3px solid #4CAF50;">
                </div>
            </div>

            <!-- YELLOW LINE - Medium (AAB Pattern) -->
            <div style="position: absolute; top: 230px; left: 0; right: 0; height: 180px;">
                <!-- Route line -->
                <div style="position: absolute; top: 90px; left: 80px; right: 80px; height: 12px; background: linear-gradient(90deg, #FFC107 0%, #FFD54F 50%, #FFC107 100%); border-radius: 6px; box-shadow: 0 4px 10px rgba(255,193,7,0.3);"></div>

                <!-- Station dots -->
                <div style="position: absolute; top: 80px; left: 80px; width: 32px; height: 32px; background: white; border: 6px solid #FFC107; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; left: 230px; width: 32px; height: 32px; background: white; border: 6px solid #FFC107; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; left: 380px; width: 32px; height: 32px; background: white; border: 6px solid #FFC107; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; left: 530px; width: 32px; height: 32px; background: white; border: 6px solid #FFC107; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; right: 80px; width: 32px; height: 32px; background: white; border: 6px solid #FFC107; border-radius: 50%;"></div>

                <!-- Mini train icon -->
                <div style="position: absolute; top: 70px; left: 320px; font-size: 40px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));">🚃</div>

                <!-- Label -->
                <div style="position: absolute; top: 5px; left: 50%; transform: translateX(-50%); background: #FFC107; padding: 8px 25px; border-radius: 20px; box-shadow: 0 3px 10px rgba(255,193,7,0.3);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">AAB Pattern</span>
                </div>

                <!-- Difficulty label -->
                <div style="position: absolute; top: 130px; left: 50%; transform: translateX(-50%); background: rgba(255,193,7,0.2); padding: 6px 18px; border-radius: 15px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #F57F17;">MEDIUM</span>
                </div>

                <!-- Worksheet preview -->
                <div style="position: absolute; top: 35px; right: -10px; box-shadow: 0 5px 15px rgba(0,0,0,0.15);">
                    <img src="https://www.lessoncraftstudio.com/samples/english/pattern%20train/sample-5.jpeg" style="width: 110px; height: auto; border-radius: 6px; border: 3px solid #FFC107;">
                </div>
            </div>

            <!-- RED LINE - Challenge (AABB Pattern) -->
            <div style="position: absolute; top: 430px; left: 0; right: 0; height: 180px;">
                <!-- Route line -->
                <div style="position: absolute; top: 90px; left: 80px; right: 80px; height: 12px; background: linear-gradient(90deg, #E53935 0%, #EF5350 50%, #E53935 100%); border-radius: 6px; box-shadow: 0 4px 10px rgba(229,57,53,0.3);"></div>

                <!-- Station dots -->
                <div style="position: absolute; top: 80px; left: 80px; width: 32px; height: 32px; background: white; border: 6px solid #E53935; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; left: 200px; width: 32px; height: 32px; background: white; border: 6px solid #E53935; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; left: 320px; width: 32px; height: 32px; background: white; border: 6px solid #E53935; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; left: 440px; width: 32px; height: 32px; background: white; border: 6px solid #E53935; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; left: 560px; width: 32px; height: 32px; background: white; border: 6px solid #E53935; border-radius: 50%;"></div>
                <div style="position: absolute; top: 80px; right: 80px; width: 32px; height: 32px; background: white; border: 6px solid #E53935; border-radius: 50%;"></div>

                <!-- Mini train icon -->
                <div style="position: absolute; top: 70px; left: 150px; font-size: 40px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));">🚂</div>

                <!-- Label -->
                <div style="position: absolute; top: 5px; left: 50%; transform: translateX(-50%); background: #E53935; padding: 8px 25px; border-radius: 20px; box-shadow: 0 3px 10px rgba(229,57,53,0.3);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white;">AABB Pattern</span>
                </div>

                <!-- Difficulty label -->
                <div style="position: absolute; top: 130px; left: 50%; transform: translateX(-50%); background: rgba(229,57,53,0.15); padding: 6px 18px; border-radius: 15px;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #C62828;">CHALLENGE</span>
                </div>

                <!-- Worksheet preview -->
                <div style="position: absolute; top: 35px; right: -10px; box-shadow: 0 5px 15px rgba(0,0,0,0.15);">
                    <img src="https://www.lessoncraftstudio.com/samples/english/pattern%20train/sample-10.jpeg" style="width: 110px; height: auto; border-radius: 6px; border: 3px solid #E53935;">
                </div>
            </div>
        </div>

        <!-- Legend at bottom -->
        <div style="position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; background: white; padding: 15px 35px; border-radius: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.12);">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 24px; height: 24px; background: #4CAF50; border-radius: 50%;"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #333;">Easy</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 24px; height: 24px; background: #FFC107; border-radius: 50%;"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #333;">Medium</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 24px; height: 24px; background: #E53935; border-radius: 50%;"></div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #333;">Challenge</span>
            </div>
        </div>

        <!-- Footer tagline -->
        <div style="position: absolute; bottom: 100px; left: 0; right: 0; text-align: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; color: #1A237E;">Every Learner's Journey</span>
        </div>

    </div>
</body>
</html>
