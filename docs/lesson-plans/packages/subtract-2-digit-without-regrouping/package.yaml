# Teaching package — subtract two-digit numbers without borrowing
# Arc 17 Phase 1.2 (math / addition-subtraction 10/14 → 11/14). Bridges Arc 15 Phase 1 subtract-within-20 → Arc 16 Phase 1.1 subtract-within-100 by isolating the no-borrow case as conceptual stepping stone. Paired inverse companion: add-2-digit-without-regrouping (same arc phase).

targetSlug: subtract-2-digit-without-regrouping
language: en
title:
  en: "Subtracting Two-Digit Numbers Without Borrowing — column subtraction where ones don't cross"

description:
  en: "Grade 1 math package teaching two-digit subtraction where the ones digit of the minuend is at least as big as the ones digit of the subtrahend (problems like 67-23=44, 89-47=42, 78-56=22, 95-64=31). Builds on Arc 15 Phase 1 subtract-within-20 + Arc 15 tens-and-ones place-value foundation. Conceptual stepping stone to Arc 16 Phase 1.1 subtract-within-100 (where borrowing is introduced) — this package isolates the two-digit subtraction mechanic in the no-borrow case, so kids meet column-subtraction WITHOUT also having to manage the borrow move. Once the column-subtraction routine feels familiar (line up tens with tens, ones with ones, subtract each column), borrowing becomes an addition to a routine rather than a whole new procedure. Operand range 10–99; constraint: ones-of-minuend ≥ ones-of-subtrahend. Strategy diversity emphasized: column-subtract, decomposition (67-23 = 60-20 + 7-3 = 40+4 = 44), count-back, place-value-mat enactment. 5 worksheet exercises + 7 printable materials over a 1-week unit. Paired inverse companion: add-2-digit-without-regrouping (no-carry partner). Together they prepare kids for the regrouping/borrowing introduction at Arc 16's within-100 packages."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + place-value-aware subtraction introduction
      with no borrowing needed. Teacher displays 67-23 written
      vertically with tens-and-ones columns clearly marked.
      "Today we subtract BIGGER numbers — two-digit minus two-
      digit. Let's solve 67 - 23. We subtract the ONES first:
      7-3 = 4. Then the TENS: 6-2 = 4 tens = 40. Plus 4 ones =
      44." Teacher repeats with 89-47 (ones: 9-7=2; tens: 8-4=4
      tens = 40; total 42) and 95-64 (ones: 5-4=1; tens: 9-6=3
      tens = 30; total 31). Pattern emphasis: "Line up the tens.
      Line up the ones. Subtract each column. Today the top
      number's ones are always bigger than (or equal to) the
      bottom number's ones, so we never have to BORROW." Teacher
      contrasts briefly with a borrowing preview: "Tomorrow when
      we subtract 73 - 28, the top ones (3) will be SMALLER than
      the bottom ones (8) — and we'll have to BORROW from the
      tens. But today, the top ones are always big enough to
      hand over what we need."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + base-ten manipulative routine. Each pair receives
      base-ten kits (ten-sticks + single-counters) + a worksheet
      with 6 no-borrow problems (67-23, 89-47, 78-56, 95-64,
      48-25, 56-31). Pair takes turns: kid A builds the minuend
      (top number) on the place-value-mat — tens in tens column,
      ones in ones column; kid B physically removes the
      subtrahend (bottom number) — removing tens from tens
      column, ones from ones column, never crossing between
      columns. Together they count what remains in each column
      separately + write the answer. The mat's column structure
      makes the place-value invariant visible — kids see that
      tens-place subtraction and ones-place subtraction are two
      independent moves when no borrowing is needed. Recast
      errors with column-cue ("you removed 2 tens from the tens
      column — 6 tens minus 2 tens leaves 4 tens. Then the
      ones."). Strategy choices: kids may use manipulatives +
      place-value-mat, column-subtract written, decomposition,
      count-back, OR use-known-facts; teacher accepts any
      strategy that produces correct answer + can be explained.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: subtraction worksheet
      (vertical format with no-borrow operands — column-
      subtract practice with no cross-column move). Station 2:
      math-worksheet (mixed no-borrow subtraction problems).
      Station 3: math-puzzle (missing-operand: 67-?=44; ?-23=44
      — kids work back from difference to find missing operand).
      Station 4: more-less (compare two subtraction results:
      which difference is greater, 67-23 or 89-47?). Manipulative-
      cut-outs base-ten available at any station for kids who
      want concrete backup.
  closure:
    durationMinutes: 5
    body: |
      Whole-class no-borrow subtraction quiz. Teacher presents 5
      fast problems; class collectively answers + names the tens
      and ones results. "67-23? 89-47? 78-56? 95-64? 48-25?"
      Forward-pointer: "Today we subtracted two-digit numbers
      when the top ones are big enough. When we come back, we'll
      meet SUBTRACT WITHIN 100 — same column-subtract routine,
      but now the top ones are sometimes smaller than the bottom
      ones and we'll learn to BORROW (break a ten into ten ones).
      And remember today's partner work: ADDING TWO-DIGIT NUMBERS
      WITHOUT REGROUPING — same column structure, putting
      together instead of taking apart."

