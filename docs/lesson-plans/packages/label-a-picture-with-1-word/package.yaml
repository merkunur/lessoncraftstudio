assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Label 6 of 8 familiar pictures with correct single word in 7 of
        10 trials.
      - Label NEW (unfamiliar) picture using sound-it-out spelling in 5
        of 10 trials (phonetic spelling acceptable).
      - Identify own labeling errors when shown answer in 6 of 10 trials.

    Differentiation:
    - Pre-K: trace pre-printed labels under pictures.
    - K: write 3-4 letter labels independently for familiar words.
    - Grade 1+: extend to label-picture-with-noun-phrase (Arc 14+
      candidate) + bridge to write-a-simple-sentence-with-picture-prompt.

