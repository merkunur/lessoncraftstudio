<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hush Owl — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/hush-owl.js?v=2"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=sv  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1 / ?embed=compact
    // Tool-specific deep links: ?level=<silent|whisper|partner|group> |
    //   ?theme=<owl|cat|dragon> | ?embed=corner
    // (Premium level/theme deep links only take effect for subscribers.)
    // ?hshtest=1 (localhost only) shortens the owl's time constants for tests.
    // The microphone starts ONLY on the Start tap — never automatically.
    LCS.mount(HushOwl, { mount: '#lcs-root' });
  </script>
</body>
</html>
