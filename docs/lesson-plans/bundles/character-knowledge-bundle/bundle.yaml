  en: "Strand-anchored K-3 bundle on narrative-structure reading comprehension. 6 packages span reading-comprehension strand work across Arc 17/18/19. Kids learn to identify story elements (main character, setting, problem, solution) + distinguish fiction from nonfiction + follow written instructions. Foundational for grade-1/2 reading-comprehension proficiency + the structural prerequisites for chapter-book reading. Cross-locale: narrative structure is K-3 universal; bundle delivery works across all 11 platform locales with adaptation for locale-canonical storytelling traditions."

