# Teaching package — identify 3D shapes
# Arc 5 Phase 2 (early-numeracy / geometry strand). Companion to
# identify-2d-shapes-basic. 5-key cluster: cube, sphere, cylinder, cone,
# pyramid. CLEAN against IMAGE_VOCABULARY. Prerequisite:
# identify-2d-shapes-basic (kids who don't know flat shapes can't usefully
# compare to solid shapes).

targetSlug: identify-3d-shapes
language: en
title:
  en: "3D Shapes — identify cube, sphere, cylinder, cone, pyramid"
description:
  en: "Kindergarten-Grade 1 geometry package teaching identification of 5 foundational 3D shapes: cube, sphere, cylinder, cone, pyramid. Builds on identify-2d-shapes-basic (kids compare 2D-shape to 3D-shape — circle vs sphere; square vs cube). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up real 3D objects (a tennis
      ball = sphere; a tissue box = cube; a soup can = cylinder; a party
      hat = cone; a Pyramid-of-Giza picture = pyramid). Names each in target
      language; class repeats chorally. Sensory engagement: kids feel the
      objects, notice "this one rolls (sphere); this one stacks (cube);
      this one rolls one way only (cylinder)." Pin 3D-shape cards to the
      math word wall next to the 2D-shape cards (visual contrast: flat
      vs solid).
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("This is a {shape}").
      Choral reading first, then individual reads. 2D-vs-3D comparison
      activity: teacher holds up a circle; asks "what 3D shape is round
      like a circle?" — sphere. Square → cube. Triangle → pyramid (or
      cone, depending on triangle orientation). Build the 2D↔3D mapping
      explicitly. Pair work: kid A names a 2D shape; kid B names the
      related 3D shape.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (3D-shape image to
      3D-shape name). Station 2: shadow-match worksheet (3D-shape to its
      flat-projection silhouette — cube projects as square; sphere as
      circle). Station 3: manipulative cut-outs sorting (kids sort 3D-shape
      cards next to their 2D-shape relatives — bridges flat-to-solid
      reasoning).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher says a 3D-shape name; kids point
      to the matching real-world object on the carpet shape collection.
      Forward-pointer: "Today we learned 5 solid shapes. When we come back
      to shapes next, we'll think about what's the same and what's
      different about 2D and 3D shapes — sides, corners, faces."

