<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open Number Line — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=18">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell, then this tool. Absolute /mini-tools/ paths so embeds and
       cross-context loads resolve identically. There is no data file and no
       core import: the model is thirty lines of arithmetic and the number
       words are a byte-faithful copy of place-value-core's composers, kept
       honest by a drift gate rather than by a runtime dependency. -->
  <script src="/mini-tools/lcs-shell.js?v=4"></script>
  <script src="/mini-tools/open-number-line.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    // This tool takes no deep link of its own: an empty line has no state
    // worth restoring from a URL, and the child's jumps are theirs alone.
    LCS.mount(OpenNumberLine, { mount: '#lcs-root' });
  </script>
</body>
</html>
