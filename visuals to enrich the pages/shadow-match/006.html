<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Schattenbilder - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(150deg, #1A1A3E 0%, #2D1B69 50%, #1A1A3E 100%); overflow: hidden;">

        <!-- Diagonal grid pattern overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image: repeating-linear-gradient(45deg, #E8E0F0 0px, #E8E0F0 1px, transparent 1px, transparent 22px), repeating-linear-gradient(-45deg, #E8E0F0 0px, #E8E0F0 1px, transparent 1px, transparent 22px);"></div>

        <!-- Spotlight radial glow behind worksheets -->
        <div style="position: absolute; top: 52%; left: 50%; width: 700px; height: 600px; transform: translate(-50%, -50%); background: radial-gradient(ellipse, rgba(0,229,255,0.12) 0%, rgba(0,229,255,0.05) 35%, transparent 70%); border-radius: 50%;"></div>

        <!-- Floating shadow silhouette shapes -->
        <div style="position: absolute; top: 180px; left: 40px; width: 60px; height: 80px; background: rgba(0,0,0,0.15); border-radius: 50% 50% 45% 45%; filter: blur(2px);"></div>
        <div style="position: absolute; top: 350px; left: 25px; width: 45px; height: 55px; background: rgba(0,0,0,0.12); border-radius: 40%; filter: blur(3px);"></div>
        <div style="position: absolute; top: 280px; right: 35px; width: 55px; height: 70px; background: rgba(0,0,0,0.14); border-radius: 50% 50% 40% 40%; filter: blur(2px);"></div>
        <div style="position: absolute; top: 450px; right: 50px; width: 40px; height: 50px; background: rgba(0,0,0,0.1); border-radius: 45%; filter: blur(3px);"></div>
        <div style="position: absolute; bottom: 300px; left: 80px; width: 50px; height: 65px; background: rgba(0,0,0,0.12); border-radius: 50%; filter: blur(2px);"></div>

        <!-- Sparkle dots with cyan/amber glow -->
        <div style="position: absolute; top: 195px; left: 130px; width: 7px; height: 7px; background: #00E5FF; border-radius: 50%; box-shadow: 0 0 18px 6px rgba(0,229,255,0.5);"></div>
        <div style="position: absolute; top: 380px; right: 110px; width: 6px; height: 6px; background: #FFB300; border-radius: 50%; box-shadow: 0 0 16px 5px rgba(255,179,0,0.5);"></div>
        <div style="position: absolute; top: 300px; left: 200px; width: 5px; height: 5px; background: #E040FB; border-radius: 50%; box-shadow: 0 0 14px 5px rgba(224,64,251,0.4);"></div>
        <div style="position: absolute; bottom: 330px; right: 190px; width: 7px; height: 7px; background: #00E5FF; border-radius: 50%; box-shadow: 0 0 16px 5px rgba(0,229,255,0.45);"></div>
        <div style="position: absolute; top: 460px; left: 100px; width: 5px; height: 5px; background: #FFB300; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(255,179,0,0.4);"></div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 25px; left: 28px; z-index: 100;">
            <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #FFB300 0%, #FF8F00 100%); border-radius: 50%; box-shadow: 0 8px 28px rgba(255,179,0,0.45), inset 0 -4px 10px rgba(0,0,0,0.15), inset 0 4px 8px rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.6);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #1A1A2E; text-shadow: 0 1px 2px rgba(255,255,255,0.3);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: rgba(255,255,255,0.12); backdrop-filter: blur(8px); padding: 11px 22px; border-radius: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); border: 2px solid rgba(0,229,255,0.5);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: #00E5FF; letter-spacing: 1.5px;">VORSCHULE &amp; GRUNDSCHULE</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 105px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 72px; color: #FFFFFF; margin: 0; text-shadow: 0 0 40px rgba(0,229,255,0.2), 3px 3px 0 rgba(0,0,0,0.3); letter-spacing: 4px;">SCHATTENBILDER</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 42px; color: #00E5FF; margin: 8px 0 0 0; text-shadow: 0 0 20px rgba(0,229,255,0.3), 2px 2px 4px rgba(0,0,0,0.3);">Arbeitsbl&auml;tter</h2>
        </div>

        <!-- 3-Worksheet Staircase Display -->
        <div style="position: absolute; top: 270px; left: 50%; transform: translateX(-50%); width: 820px; height: 440px;">

            <!-- Left worksheet (smallest, lower) -->
            <div style="position: absolute; left: 55px; top: 85px; z-index: 10;">
                <div style="width: 220px; height: 170px; background: white; border-radius: 10px; box-shadow: 0 10px 35px rgba(0,0,0,0.4), 0 0 0 3px rgba(0,229,255,0.3), 0 0 25px rgba(0,229,255,0.1); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/shadow%20match/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Schattenbilder Arbeitsblatt">
                </div>
            </div>

            <!-- Center worksheet (largest, hero - prominent) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 20;">
                <div style="position: relative;">
                    <div style="position: absolute; inset: -20px; background: radial-gradient(ellipse, rgba(0,229,255,0.1) 0%, transparent 70%); border-radius: 20px; z-index: -1;"></div>
                    <div style="width: 280px; height: 216px; background: white; border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,0.45), 0 0 0 4px rgba(0,229,255,0.4), 0 0 35px rgba(0,229,255,0.15); overflow: hidden;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/shadow%20match/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Schattenbilder Arbeitsblatt">
                    </div>
                </div>
            </div>

            <!-- Right worksheet (medium) -->
            <div style="position: absolute; right: 55px; top: 50px; z-index: 10;">
                <div style="width: 240px; height: 185px; background: white; border-radius: 10px; box-shadow: 0 10px 35px rgba(0,0,0,0.4), 0 0 0 3px rgba(0,229,255,0.3), 0 0 25px rgba(0,229,255,0.1); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/shadow%20match/sample-5.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Schattenbilder Arbeitsblatt">
                </div>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 110px; left: 0; right: 0; background: linear-gradient(90deg, rgba(45,27,105,0.95) 0%, rgba(26,26,62,0.95) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.3); border-top: 2px solid rgba(0,229,255,0.2); border-bottom: 2px solid rgba(0,229,255,0.2);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white; text-shadow: 0 0 20px rgba(0,229,255,0.3), 2px 2px 4px rgba(0,0,0,0.4); letter-spacing: 2px;">Schatten erkennen, Formen entdecken!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(6px); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); border: 2px solid rgba(0,229,255,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #00E5FF;">Visuelle Wahrnehmung</span>
            </div>
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(6px); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); border: 2px solid rgba(255,179,0,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #FFB300;">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(6px); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); border: 2px solid rgba(224,64,251,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #E040FB;">Druckfertig</span>
            </div>
        </div>

    </div>
</body>
</html>
