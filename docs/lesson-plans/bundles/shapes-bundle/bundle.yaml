thematicCoherence:
  en: |
    All 5 packages cohere around shape vocabulary + shape-attribute
    reasoning. Form a pedagogical progression from naming (identify
    shape-types) through description (articulate attributes) to
    classification (sort by shape).

    **Pedagogical sequencing:**
    1. **identify-2d-shapes-basic** — Foundational shape vocabulary
       (circle, square, triangle, rectangle).
    2. **identify-2d-shapes-extended** — Less-common 2D shapes (oval,
       pentagon, hexagon).
    3. **identify-3d-shapes** — 3D solids (cube, sphere, cylinder, cone);
       extends from flat to solid.
    4. **describe-shape-attributes** — Cognitive depth: kids articulate
       attributes (sides, corners, curves) rather than just naming.
    5. **sort-by-shape** — Cognitive sorting using shape vocabulary;
       generalization across themes.

    **Strand spread:** 4 early-numeracy/geometry + 1 cognitive-sorting.
    Bundle composition emphasizes geometry strand depth while integrating
    cross-strand cognitive work.

    **Suggested unit duration:** 4-5 weeks. Foundational shape weeks +
    attribute-reasoning week + sorting application week.

    **Multilingual classroom relevance:** shape vocabulary is high-
    frequency K-3 target across all 11 platform locales with strong
    cognate-rich coverage (circle / círculo / cerchio / Kreis /
    cirkel; triangle / triángulo / triangolo / Dreieck / triangel).
    Cross-locale shape-naming + attribute description supports
    multilingual classroom needs.
