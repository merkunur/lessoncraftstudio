compositionalRationale:
  en: |
    Primary strand: science / personal-social-emotional-development
    (empathy + perspective-taking — deepens strand 2/6 → 3/6).
    Secondary strand: communication (responding to others'
    feelings with appropriate language). Tertiary strand:
    social-cognition (perceiving + interpreting others' emotional
    states).

    Architectural significance: deepens personal-social-emotional-
    development strand from 2/6 to 3/6. Builds on Arc 8-12
    identify-emotions-of-others-from-faces (perception foundation)
    + Arc 15 Phase 2 express-feelings-with-words (own-feeling
    vocabulary) + Phase 4 regulate-emotions-with-strategies
    (emotion-management). Extends to OUTWARD social-emotional
    work — perspective-taking + caring response. Critical bridge
    from emotion-self-management to social-emotional engagement
    with peers.

    Distinctive composition: 2 matching + 1 pattern-train (3-step
    empathy sequence) + 1 picture-sort (empathic vs unhelpful
    response classification) + 1 missing-pieces. Sequence-emphasis
    via pattern-train + missing-pieces; binary classification via
    picture-sort.

    Class B FLEXIBLE substrate: composes against emotions theme
    (canonical for facial-expression + social-interaction imagery).

    K-3 multilingual classroom relevance: empathy is universal
    pro-social skill across all cultures. Vocabulary varies:
    "empathy" cognate Romance (empatía / empatia / empathie);
    Germanic distinct (Empathie / empati / empatia). Cultural
    variations exist in EXPRESSED empathy — some cultures favor
    quiet presence; others favor verbal expression; others favor
    physical-touch comfort. Bundle's 3-step model adaptable across
    cultural conventions.

