# Teaching package — count objects 1 to 5 (Pre-K / early-K precursor)
# Arc 3 Phase 3 numeracy package. Mirrors count-objects-1-to-10 template at
# smaller-range. Uses numeral-cards material (Arc 3 Phase 1).

targetSlug: count-objects-1-to-5
language: en

title:
  en: "Count Objects 1 to 5 — Pre-K / early-K precursor"
description:
  en: "Pre-K / early Kindergarten numeracy precursor to count-objects-1-to-10. Same architecture (theme-mode visuals + math-app-heavy exercises + numeral-cards primary anchor) but capped at 1-5 for kids who haven't yet mastered the higher range. 5 exercises + 7 materials over a 1-2 week unit."

durationMinutes: 20

structure:
  warmup:
    durationMinutes: 4
    body: |
      Whole-class introduction. Teacher holds up flashcards showing groups of
      animals (1 cow, 2 cows, ... 5 cows). Count chorally with class in target
      language — touch each animal as you say the number. Limit to 1-5 throughout
      the package (no extension to 6+ — that's count-objects-1-to-10's job).
  contentActivity:
    durationMinutes: 8
    body: |
      Pocket-chart routine with sentence strips ("There are {count} {item:plural}").
      Pair work: kids hold a picture-card with N animals (N=1-5), partner counts
      and says "There are N animals." Recast errors in plural form.
  scaffold:
    durationMinutes: 5
    body: |
      Station rotation. Station 1: numeral-cards + manipulative-cut-outs matching
      ("show me the '3' card + 3 animals"). Station 2: find-and-count worksheet
      (small grid; targets 1-5 instances). Station 3: chart-count category
      counting (3 categories × max 5 items each).
  closure:
    durationMinutes: 3
    body: |
      Whole-class share-out. Teacher names a number 1-5, kids hold up that many
      fingers + that many cut-out animals. Forward-pointer: "Today we counted to
      5. When we come back to counting next, we'll count higher — to 10." Points
      to adjacent target count-objects-1-to-10.

