# Teaching package — decompose numbers 1-10 in multiple ways
# Arc 3 Phase 3 numeracy package. addition app heavy; introduces number-bonds
# work (7 = 4+3 = 5+2 = 6+1 patterns). Foundational to within-10 fact fluency.

targetSlug: decompose-numbers-to-10
language: en

title:
  en: "Decompose Numbers 1-10 — number bonds"
description:
  en: "Grade 1 numeracy package teaching number-bond decomposition (7 = 4+3 = 5+2 = 6+1, etc.). addition app heavy; integrates manipulative-cut-outs as the concrete-decomposition prop. Foundational to within-10 fact fluency. 5 exercises + 6 materials over a 1-2 week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher places 7 manipulative cut-out animals on
      the carpet. "Seven cats. Let's break seven apart." Teacher splits into
      groups: "4 cats and 3 cats. Four plus three is seven." Then re-splits:
      "5 cats and 2 cats. Five plus two is seven. Same total — seven."
      Reinforces that a number can be MADE from multiple combinations.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("There are {count} {item:plural}.
      It is N + M.") Choral reading of decomposition patterns. Pair work: kids
      use manipulative cut-outs to find NEW decompositions for a target number
      (kid A says "Show me 8"; kid B splits into 5+3 OR 4+4 OR 6+2 OR 7+1).
      Recast errors via re-counting.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: addition image-image worksheet (operands
      1-9, sums 2-10). Station 2: number-bond mat (use matching-mat material
      with rightColumnContent: word — kids match a quantity to its
      decomposition expression). Station 3: manipulative cut-outs decomposition
      ("show me 7 in 3 different ways").
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Teacher names a number 4-10, kids show one
      decomposition with their fingers (e.g., for 7: kids show 4 fingers on one
      hand + 3 on the other). Forward-pointer: "Today we broke numbers apart
      and put them together. When we come back to numbers next, we'll do this
      with bigger numbers — and it'll be addition."

