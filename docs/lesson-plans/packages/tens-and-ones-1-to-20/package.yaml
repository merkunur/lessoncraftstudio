# Teaching package — tens and ones (place value 1 to 20)
# Arc 15 Phase 1 (math / place-value strand foundation; first place-value package).

targetSlug: tens-and-ones-1-to-20
language: en
title:
  en: "Tens and Ones — understanding two-digit numbers"
description:
  en: "Grade 1 / Grade 2 math package teaching kids to understand the place-value system for numbers 1-20: each two-digit number is composed of TENS and ONES. Examples: 13 = 1 ten + 3 ones; 17 = 1 ten + 7 ones; 20 = 2 tens + 0 ones. Builds on Arc 7-12 count-objects-1-to-20 + add-within-20 numeracy foundation. Foundational place-value package — first in the place-value strand. Critical bridge from counting-by-1s (which works for 1-20 via single-numeral counting) to understanding two-digit structure (which generalizes to all multi-digit numbers). Foundation for later regrouping in addition/subtraction work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + tens-and-ones introduction. Teacher
      displays 13 single-counters + groups them as 1 BUNDLE OF
      10 + 3 LOOSE COUNTERS. "Look — when we have 13 things,
      we can group them as 1 TEN + 3 ONES. The number 13 has
      TWO PARTS: the '1' on the left means 1 ten (10 things);
      the '3' on the right means 3 ones (3 things). Together
      they make 13." Teacher repeats with 17 (1 ten + 7 ones)
      + 20 (2 tens + 0 ones) + 11 (1 ten + 1 one). Visual +
      tactile anchor for tens-and-ones place-value composition.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + place-value routine. Each pair receives 8
      base-ten manipulative kits (or printed counters in 10-stick
      + single-counter format). Pair takes turns: kid A shows
      a number with manipulatives (e.g., shows 1 ten-stick + 4
      ones = 14); kid B writes the digital number (14). Then
      kid A writes a number (e.g., 18); kid B builds it with
      manipulatives. Recast errors with re-grouping demo
      ("you built 16 with 6 ten-sticks. Let's check — 6 ten-
      sticks would be 60. You need 1 ten-stick + 6 ones to make
      16.").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (number to
      tens-and-ones representation: 14 ↔ ◼◼◼◼◼◼◼◼◼◼ + 4
      circles). Station 2: math-puzzle (decompose a number into
      tens + ones: 17 = ? tens + ? ones). Station 3: pattern-
      train (sequence numbers 10, 11, 12, 13... showing each
      adds 1 one). Station 4: vocabulary-tracing-strips for
      place-value vocabulary (ten, ones, place, digit, tens-
      place, ones-place).
  closure:
    durationMinutes: 5
    body: |
      Whole-class place-value review. Teacher shows 6 numbers
      (12, 15, 18, 11, 19, 20); class collectively names tens
      + ones for each. "12 = 1 ten + 2 ones! 15 = 1 ten + 5
      ones!" Forward-pointer: "Today we learned tens and ones
      up to 20. When we come back next, we can do TENS AND
      ONES up to 100 — bigger numbers with the same pattern
      — and then HUNDREDS + TENS + ONES for three-digit numbers!"

