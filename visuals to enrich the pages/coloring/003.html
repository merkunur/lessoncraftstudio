<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Christmas Coloring Pages - Use Cases Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(135deg, #E8E0F0 0%, #F5E8E0 50%, #FFE5D9 100%); overflow: hidden;">

        <!-- Soft radial overlays -->
        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 20% 30%, rgba(124,92,191,0.08) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(255,181,52,0.08) 0%, transparent 40%);"></div>

        <!-- FREE Badge - Violet -->
        <div style="position: absolute; top: 28px; left: 28px; z-index: 100;">
            <div style="width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(145deg, #7C5CBF 0%, #5E3A9E 100%); box-shadow: 0 6px 22px rgba(124,92,191,0.45), inset 0 -3px 10px rgba(0,0,0,0.15), inset 0 3px 6px rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; transform: rotate(-6deg);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.25);">FREE</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 38px; right: 38px; background: #98D8AA; padding: 10px 22px; border-radius: 25px; box-shadow: 0 4px 15px rgba(152,216,170,0.45);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; color: white;">GRADES PreK-3</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 40px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 50px; color: #7C5CBF; margin: 0; text-shadow: 2px 2px 0 rgba(255,255,255,0.7);">Perfect For...</h1>
        </div>

        <!-- Background Coloring Pages (subtle) -->
        <div style="position: absolute; top: 120px; left: 30px; transform: rotate(-12deg); opacity: 0.15; z-index: 1;">
            <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-2.jpeg" style="width: 300px; height: auto; border-radius: 15px;">
        </div>
        <div style="position: absolute; top: 140px; right: 20px; transform: rotate(10deg); opacity: 0.15; z-index: 1;">
            <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-4.jpeg" style="width: 280px; height: auto; border-radius: 15px;">
        </div>

        <!-- Use Case Cards Grid -->
        <div style="position: absolute; top: 130px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; z-index: 10; width: 750px;">

            <!-- Card 1: Holiday Parties -->
            <div style="background: linear-gradient(135deg, #E36387 0%, #C94A6B 100%); padding: 30px; border-radius: 25px; box-shadow: 0 12px 35px rgba(227,99,135,0.35); transform: rotate(-2deg);">
                <div style="display: flex; align-items: center; gap: 18px;">
                    <div style="width: 70px; height: 70px; background: rgba(255,255,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px;">🎉</div>
                    <div>
                        <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white;">Holiday Parties</div>
                        <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 15px; color: rgba(255,255,255,0.9); margin-top: 4px;">Fun classroom activity</div>
                    </div>
                </div>
            </div>

            <!-- Card 2: Early Finishers -->
            <div style="background: linear-gradient(135deg, #FFB534 0%, #E5A02E 100%); padding: 30px; border-radius: 25px; box-shadow: 0 12px 35px rgba(255,181,52,0.35); transform: rotate(2deg);">
                <div style="display: flex; align-items: center; gap: 18px;">
                    <div style="width: 70px; height: 70px; background: rgba(255,255,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px;">⭐</div>
                    <div>
                        <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #5D4037;">Early Finishers</div>
                        <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 15px; color: rgba(93,64,55,0.9); margin-top: 4px;">Meaningful busy work</div>
                    </div>
                </div>
            </div>

            <!-- Card 3: Calm Down Corner -->
            <div style="background: linear-gradient(135deg, #98D8AA 0%, #7BC68F 100%); padding: 30px; border-radius: 25px; box-shadow: 0 12px 35px rgba(152,216,170,0.35); transform: rotate(1deg);">
                <div style="display: flex; align-items: center; gap: 18px;">
                    <div style="width: 70px; height: 70px; background: rgba(255,255,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px;">🧘</div>
                    <div>
                        <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white;">Calm Down Corner</div>
                        <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 15px; color: rgba(255,255,255,0.9); margin-top: 4px;">Soothing & peaceful</div>
                    </div>
                </div>
            </div>

            <!-- Card 4: Morning Work -->
            <div style="background: linear-gradient(135deg, #42A5F5 0%, #1E88E5 100%); padding: 30px; border-radius: 25px; box-shadow: 0 12px 35px rgba(66,165,245,0.35); transform: rotate(-1deg);">
                <div style="display: flex; align-items: center; gap: 18px;">
                    <div style="width: 70px; height: 70px; background: rgba(255,255,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px;">☀️</div>
                    <div>
                        <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white;">Morning Work</div>
                        <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 15px; color: rgba(255,255,255,0.9); margin-top: 4px;">Quiet start to day</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Featured Coloring Page -->
        <div style="position: absolute; bottom: 170px; left: 50%; transform: translateX(-50%); box-shadow: 0 15px 45px rgba(0,0,0,0.2); border-radius: 16px; z-index: 20;">
            <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-1.jpeg" style="width: 280px; height: auto; border-radius: 14px; border: 6px solid white;">
        </div>

        <!-- Colored Pencil Row at Bottom -->
        <div style="position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;">
            <!-- Red pencil -->
            <div style="width: 14px; height: 80px; background: linear-gradient(180deg, #FF5757 90%, #FFB347 90%); border-radius: 2px 2px 7px 7px; transform: rotate(-5deg); box-shadow: 0 3px 8px rgba(0,0,0,0.15);"></div>
            <!-- Orange pencil -->
            <div style="width: 14px; height: 85px; background: linear-gradient(180deg, #FFB347 90%, #5D4037 90%); border-radius: 2px 2px 7px 7px; transform: rotate(-2deg); box-shadow: 0 3px 8px rgba(0,0,0,0.15);"></div>
            <!-- Yellow pencil -->
            <div style="width: 14px; height: 78px; background: linear-gradient(180deg, #FFEB3B 90%, #5D4037 90%); border-radius: 2px 2px 7px 7px; transform: rotate(1deg); box-shadow: 0 3px 8px rgba(0,0,0,0.15);"></div>
            <!-- Green pencil -->
            <div style="width: 14px; height: 82px; background: linear-gradient(180deg, #4CAF50 90%, #5D4037 90%); border-radius: 2px 2px 7px 7px; transform: rotate(3deg); box-shadow: 0 3px 8px rgba(0,0,0,0.15);"></div>
            <!-- Blue pencil -->
            <div style="width: 14px; height: 88px; background: linear-gradient(180deg, #42A5F5 90%, #5D4037 90%); border-radius: 2px 2px 7px 7px; transform: rotate(-1deg); box-shadow: 0 3px 8px rgba(0,0,0,0.15);"></div>
            <!-- Purple pencil -->
            <div style="width: 14px; height: 75px; background: linear-gradient(180deg, #9C27B0 90%, #5D4037 90%); border-radius: 2px 2px 7px 7px; transform: rotate(4deg); box-shadow: 0 3px 8px rgba(0,0,0,0.15);"></div>
            <!-- Pink pencil -->
            <div style="width: 14px; height: 83px; background: linear-gradient(180deg, #E36387 90%, #5D4037 90%); border-radius: 2px 2px 7px 7px; transform: rotate(-3deg); box-shadow: 0 3px 8px rgba(0,0,0,0.15);"></div>
            <!-- Brown pencil -->
            <div style="width: 14px; height: 79px; background: linear-gradient(180deg, #8D6E63 90%, #5D4037 90%); border-radius: 2px 2px 7px 7px; transform: rotate(2deg); box-shadow: 0 3px 8px rgba(0,0,0,0.15);"></div>
        </div>

        <!-- Bottom Tagline -->
        <div style="position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #7C5CBF; letter-spacing: 2px;">CLASSROOM TESTED</span>
            <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 18px; color: #E36387; margin-left: 15px;">Keep Them Engaged!</span>
        </div>

    </div>
</body>
</html>
