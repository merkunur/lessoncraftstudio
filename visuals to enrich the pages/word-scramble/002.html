<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Word Scramble - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(180deg, #F0FDFA 0%, #CCFBF1 50%, #99F6E4 100%);">

        <!-- Subtle dot pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image: radial-gradient(circle, #0D9488 1px, transparent 1px); background-size: 30px 30px;"></div>

        <!-- Decorative letter block W - top left corner -->
        <div style="position: absolute; top: 100px; left: 30px; width: 44px; height: 44px; background: linear-gradient(145deg, #14B8A6 0%, #0D9488 100%); border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3); transform: rotate(-15deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; color: white;">W</span>
        </div>

        <!-- Letter O - top right area -->
        <div style="position: absolute; top: 90px; right: 35px; width: 40px; height: 40px; background: linear-gradient(145deg, #F43F5E 0%, #E11D48 100%); border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3); transform: rotate(12deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; color: white;">O</span>
        </div>

        <!-- Letter R - bottom left -->
        <div style="position: absolute; bottom: 45px; left: 25px; width: 38px; height: 38px; background: linear-gradient(145deg, #FACC15 0%, #EAB308 100%); border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3); transform: rotate(10deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: white;">R</span>
        </div>

        <!-- Letter D - bottom right -->
        <div style="position: absolute; bottom: 50px; right: 30px; width: 42px; height: 42px; background: linear-gradient(145deg, #14B8A6 0%, #0D9488 100%); border-radius: 6px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3); transform: rotate(-8deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; color: white;">D</span>
        </div>

        <!-- FREE hanging tab - top left -->
        <div style="position: absolute; top: 0; left: 40px;">
            <div style="background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); padding: 14px 22px 12px 22px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 15px rgba(249,115,22,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; color: white;">FREE</span>
            </div>
        </div>

        <!-- Grade Badge - solid teal pill -->
        <div style="position: absolute; top: 30px; right: 30px;">
            <div style="background: #0D9488; padding: 10px 22px; border-radius: 25px; box-shadow: 0 3px 10px rgba(13,148,136,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: white; letter-spacing: 1px;">GRADES K-1</span>
            </div>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 40px; left: 50%; transform: translateX(-50%); text-align: center;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 68px; font-weight: 700; color: #042F2E; text-shadow: 0 3px 6px rgba(0,0,0,0.08);">What's Inside?</h1>
            <div style="width: 200px; height: 5px; background: linear-gradient(90deg, transparent, #FACC15, transparent); margin: 8px auto 0 auto; border-radius: 3px;"></div>
        </div>

        <!-- 5 Feature circles in arc arrangement -->
        <div style="position: absolute; top: 140px; left: 50%; transform: translateX(-50%); width: 900px; height: 280px;">

            <!-- Circle 1 - Letter Boxes (teal, left) -->
            <div style="position: absolute; left: 20px; top: 40px; text-align: center;">
                <div style="width: 130px; height: 130px; background: linear-gradient(145deg, #14B8A6 0%, #0D9488 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(13,148,136,0.3); border: 4px solid #FACC15;">
                    <span style="font-size: 50px;">🔤</span>
                </div>
                <p style="margin: 10px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #042F2E;">Letter Boxes</p>
            </div>

            <!-- Circle 2 - Picture Clues (coral, left-center) -->
            <div style="position: absolute; left: 180px; top: 10px; text-align: center;">
                <div style="width: 135px; height: 135px; background: linear-gradient(145deg, #F43F5E 0%, #E11D48 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(244,63,94,0.3); border: 4px solid #FACC15;">
                    <span style="font-size: 52px;">🖼️</span>
                </div>
                <p style="margin: 10px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #042F2E;">Picture Clues</p>
            </div>

            <!-- Circle 3 - Answer Keys (yellow, center, largest) -->
            <div style="position: absolute; left: 50%; transform: translateX(-50%); top: -10px; text-align: center;">
                <div style="width: 145px; height: 145px; background: linear-gradient(145deg, #FACC15 0%, #EAB308 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(250,204,21,0.4); border: 4px solid #0D9488;">
                    <span style="font-size: 58px;">🔑</span>
                </div>
                <p style="margin: 10px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 800; color: #042F2E;">Answer Keys</p>
            </div>

            <!-- Circle 4 - Difficulty Levels (green, right-center) -->
            <div style="position: absolute; right: 180px; top: 10px; text-align: center;">
                <div style="width: 135px; height: 135px; background: linear-gradient(145deg, #22C55E 0%, #16A34A 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(34,197,94,0.3); border: 4px solid #FACC15;">
                    <span style="font-size: 52px;">📊</span>
                </div>
                <p style="margin: 10px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #042F2E;">4 Levels</p>
            </div>

            <!-- Circle 5 - Custom Words (pink, right) -->
            <div style="position: absolute; right: 20px; top: 40px; text-align: center;">
                <div style="width: 130px; height: 130px; background: linear-gradient(145deg, #EC4899 0%, #DB2777 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(236,72,153,0.3); border: 4px solid #FACC15;">
                    <span style="font-size: 50px;">✏️</span>
                </div>
                <p style="margin: 10px 0 0 0; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #042F2E;">Custom Words</p>
            </div>
        </div>

        <!-- Bottom worksheet + answer key side by side -->
        <div style="position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); display: flex; gap: 50px; align-items: flex-end;">

            <!-- Worksheet -->
            <div style="text-align: center;">
                <div style="width: 280px; height: 364px; background: white; border-radius: 10px; box-shadow: 0 10px 35px rgba(0,0,0,0.2); overflow: hidden; border: 4px solid #0D9488;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/word%20scramble/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Worksheet Sample">
                </div>
                <div style="margin-top: 10px; background: #0D9488; padding: 6px 20px; border-radius: 15px; display: inline-block;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: white;">WORKSHEET</span>
                </div>
            </div>

            <!-- Answer Key -->
            <div style="text-align: center;">
                <div style="width: 280px; height: 364px; background: white; border-radius: 10px; box-shadow: 0 10px 35px rgba(0,0,0,0.2); overflow: hidden; border: 4px solid #22C55E;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/word%20scramble/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Answer Key Sample">
                </div>
                <div style="margin-top: 10px; background: #22C55E; padding: 6px 20px; border-radius: 15px; display: inline-block;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: white;">ANSWER KEY</span>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
