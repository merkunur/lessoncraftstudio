# Teaching package — identify and explain classroom rules
# Arc 18 Phase 1.4 (world-knowledge / personal-social-emotional-development strand 3/8 → 4/8). Foundational classroom-routine SEL skill: kids state the rules of their classroom + explain why each rule matters. Pedagogically independent (no prerequisites per learning-targets.json); high-leverage for K-1 multilingual classroom management + cross-cultural routine-sensitivity. SEL-class composition mirrors share-and-take-turns (Arc 17 P1.1) precedent at 6-material shape.

targetSlug: identify-classroom-rules
language: en
title:
  en: "Our Classroom Rules — what they are and why they matter"

description:
  en: "Kindergarten / Grade 1 social-emotional package teaching kids to identify the rules of their own classroom + explain why each rule matters. Foundation skill: kids learn that classrooms have RULES (a small number of agreements like 'walk, don't run' / 'use kind words' / 'raise your hand to speak' / 'put materials away') and that each rule has a REASON connected to safety, fairness, or learning. Critical K-1 prosocial-skills work: classroom rules are the shared agreements that let many kids learn together; understanding rules makes following them easier (kids who KNOW WHY a rule exists follow it more consistently than kids who only KNOW THE RULE). Per §A.13.30 K-1 informal framing: K-1 classroom-rules work is RULES-NAMING + RULES-EXPLAINING — kids state 4-6 specific classroom rules in their own words + give a short reason for each ('we walk so we don't bump into each other' / 'we use kind words because mean words hurt feelings'). NOT formal civics or legal-system pedagogy (which is Grade 3+ work introducing concepts of laws, rights, government); the K-1 pedagogy frames rules as SHARED CLASSROOM AGREEMENTS that make the classroom work — not as adult-imposed law. EYFS.ELG.PSED + IB-PYP.WhoWeAre + CASEL.SOCIAL_AWARENESS anchors. Multilingual / international-school context emphasis: rules + classroom-norms vary across school cultures globally; the package frames CO-CREATED CLASSROOM AGREEMENTS rather than absolute universal rules. PSED strand advances 3/8 → 4/8 (37.5% → 50.0%). 5 worksheet exercises + 6 printable materials (SEL-class composition per §A.13.37 + Arc 17 P1.1 share-and-take-turns precedent: REMOVES matching-mat + vocabulary-tracing-strips because rules-naming work doesn't anchor on image-to-word pairing or single-word-tracing; KEEPS flashcards + picture-cards + sentence-strips + manipulative-cut-outs + parent-take-home-letter + answer-key)."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class rules-introduction with classroom-routine
      hook. Teacher asks: "What ARE rules? Why do we have
      RULES in our classroom?" Class brainstorms: rules
      keep us safe, rules are fair, rules help us learn
      together. Teacher then introduces 4-6 specific
      classroom rules (the actual rules of THIS
      classroom; teacher should adapt to their own class
      norms — typical K-1 starter rules: 'walk, don't run'
      + 'use kind words' + 'raise your hand to speak' +
      'put materials away when done' + 'listen when
      others are speaking'). For each rule, teacher
      narrates the REASON: "We walk inside, we don't
      run. WHY? Because if we run we might bump into a
      friend or trip and get hurt. Walking keeps everyone
      SAFE." Repeats pattern for each rule: "We use kind
      words. WHY? Because mean words hurt people's
      feelings, and we want everyone to feel WELCOME in
      our classroom. Kind words help everyone feel safe
      and happy." Pattern emphasis: "Every rule has a
      REASON. The reason is usually about SAFETY (no one
      gets hurt), FAIRNESS (everyone gets a turn), or
      LEARNING (we can all hear and focus). When you
      KNOW WHY a rule exists, the rule makes sense — it's
      not just something a grown-up says, it's something
      that helps OUR CLASSROOM WORK."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + rules-and-reasons matching routine. Each
      pair receives 6 rule cards (one per classroom rule:
      WALK / KIND WORDS / RAISE HAND / PUT AWAY / LISTEN /
      ASK FOR HELP) + 6 reason cards (for each rule, a
      short reason: "so we don't bump into friends" /
      "because mean words hurt" / "so everyone has a turn
      to talk" / "so we can find materials next time" /
      "so everyone hears the speaker" / "so we don't get
      stuck or frustrated"). Pair takes turns: kid A
      reads (or names from picture) a rule card; kid B
      finds the matching reason card + says aloud "[Rule]
      because [reason]." Recast errors with rule-reason
      reasoning ("you matched 'WALK' with 'so everyone
      has a turn' — but think: what does WALKING help
      with? Bumping! Walking helps so we don't BUMP into
      friends. The 'taking turns' reason matches RAISE
      HAND, not WALK."). Optional extension: pair
      identifies 1-2 rules NOT yet on the list that they
      think their classroom needs ("we should have a
      rule about washing hands before snack" / "we
      should have a rule about cleaning up paint"); pair
      explains the REASON for each new rule. Teacher
      note: K-1 kids sometimes confuse RULES (general
      classroom agreements) with INSTRUCTIONS (specific
      one-time directions like "everyone get your math
      books"). Help kids see: rules apply ALL THE TIME
      across all activities; instructions apply for one
      activity then change. Some kids may also conflate
      RULES with PERSONAL PREFERENCES ("the rule is
      everyone has to like apple slices"). Help kids see:
      rules are FAIRNESS + SAFETY + LEARNING agreements;
      preferences are personal choices that don't bind
      others.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet
      (kids sort scenario pictures into "following the
      rule" vs "not following the rule" buckets — kid
      walking goes in following-the-rule for WALK rule;
      kid running in classroom goes in not-following-
      the-rule). Station 2: matching worksheet (rule
      picture → reason text; e.g., picture of kid with
      hand raised ↔ "so everyone has a turn to talk").
      Station 3: word-guess worksheet (rule-vocabulary
      puzzle: walk, kind, listen, share, hand, help —
      key vocabulary kids need for productive use of
      rules). Station 4: manipulative cut-outs (kids
      assemble a rules-poster cardstrip: 6 rule-cards
      with picture + word + brief reason; kids decorate
      + take home OR contribute to a classroom display).
  closure:
    durationMinutes: 5
    body: |
      Whole-class rules-pledge + classroom-community
      framing. Class collectively names the 4-6
      classroom rules + states one reason per rule.
      Teacher asks: "WHO MADE these rules?" (Class
      reflects: the teacher, the kids, the school —
      the rules are agreements WE share to make the
      classroom work for everyone.) Teacher closes
      with: "Rules are not punishments. Rules are
      AGREEMENTS — we follow them because they help
      OUR CLASSROOM be safe and fair and a good place
      to learn. Every classroom is different — some
      classrooms have rules ours doesn't have; some
      kids' classrooms back home have different rules
      because they fit different cultures or different
      ways of learning. ALL classroom rules are
      meant to help everyone feel WELCOME and SAFE
      and ABLE TO LEARN. That's the test of a good
      classroom rule." Forward-pointer: "When we come
      back to social-emotional work next, we'll learn
      WHAT TO DO WHEN A RULE BREAKS DOWN — when
      someone forgets a rule or doesn't follow one
      yet. Conflict resolution + asking-an-adult-for-
      help (Arc 18+ candidates) builds on today's
      rule-foundation."

