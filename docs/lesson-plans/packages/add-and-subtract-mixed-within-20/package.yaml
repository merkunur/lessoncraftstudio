assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Solve mixed add/subtract problems within 20 correctly in
        7 of 10 trials.
      - Identify operation from sign (+ vs -) accurately in 9 of
        10 trials.
      - Use inverse-operation relationships in 5 of 10 missing-
        operand problems.
      - Achieve fluency (correct answer within 5 seconds) in 5 of
        10 mental-math trials.

    Differentiation:
    - Pre-K: review separate add/subtract within 5 only.
    - K: mixed within 10 fluent.
    - Grade 1: mixed within 20 fluent.
    - Grade 2+: extend to mixed within 100 + multi-step word
      problems + bridge to multiplication/division operation-
      selection work.

