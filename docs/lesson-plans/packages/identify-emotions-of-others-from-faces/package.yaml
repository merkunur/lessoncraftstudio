# Teaching package — identify others' emotions from facial expressions
# Arc 11 Phase 2 (Option F single-package-strand deepening; world-knowledge
# / personal-social-emotional-development strand 1/8 → 2/8). RESOLVES Arc
# 10 identify-own-emotions-in-context forward-pointer.

targetSlug: identify-emotions-of-others-from-faces
language: en
title:
  en: "Reading Faces — what is your friend feeling?"
description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching emotion-recognition from facial expressions of others. Builds on Arc 10 identify-own-emotions-in-context. RESOLVES Arc 10 forward-pointer ('recognize OTHER PEOPLE'S emotions next — looking at faces and noticing how a friend or family member feels'). Empathic perspective-taking skill: kids learn to read facial cues + identify friend's/family member's emotions even when not their own. Foundational SEL skill — empathy + perspective-taking + relational awareness. Vocab-anchored — emotion vocab from Arc 5+10 reinforced. Composes against matching + odd-one-out apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class face-reading routine. Teacher holds up large pictures
      of faces showing different emotions (one happy, one sad, one
      angry, one surprised, one scared). 'How does this person feel?'
      Class identifies. 'How can you tell?' Discussion: kids name
      facial features (smile = happy; tears or downturned mouth =
      sad; furrowed brow + tight mouth = angry). Reinforces face-as-
      window-to-emotion framing.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + face-and-emotion routine. Each pair receives 8 face
      cards depicting various emotions. Pair takes turns: kid A shows
      a face card; kid B names the emotion + explains the facial cue
      ('they are happy because they're smiling'). Recast errors with
      explanation ('you said they look happy — let's look closer.
      What does the mouth show? Downturned. What about the eyes?
      Watery. That's a SAD face'). Optional extension: kids practice
      reading their partner's actual real-time face + naming emotions.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (face image to
      emotion-name pairs). Station 2: matching worksheet (face image
      to context — happy + party; sad + lost-toy; etc.). Station 3:
      manipulative cut-outs hands-on emotion-recognition (kids assemble
      emotion-cue charts pairing facial features with emotion labels).
      Station 4: word-guess (kids fill in emotion-name letters from
      face-image clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class face-quiz routine. Teacher shows 4-5 face pictures;
      class names each emotion + a possible cause ('they look sad —
      maybe their toy broke'). Forward-pointer: 'Today we recognized
      OTHER people's emotions from faces. When we come back to
      emotion work next, we'll learn how to RESPOND with kindness
      when we see a friend feeling sad or upset — empathy in action.'

