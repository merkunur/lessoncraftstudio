# Teaching package — identify community places
# Arc 17 Phase 1.1 (world-knowledge / community-and-roles canonical fill;
# strand SAT close: 2/3 → 3/3 SAT). Pairs to Arc 11 identify-community-helpers:
# helpers identifies WHO works in the community; places identifies WHERE those
# helpers work + WHAT happens at each place. Foundational social-studies
# vocabulary work for K-3 understanding-the-world strand.

targetSlug: identify-community-places
language: en
title:
  en: "Community Places — where we go in our neighborhood"

description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching community-place vocabulary. Builds on Arc 11 identify-community-helpers (WHO helps) by introducing WHERE those helpers work + WHAT happens at each place. Kids identify familiar community places (school, library, supermarket, hospital, fire station, park, bakery, post office) + name what the place is for + match places to community helpers who work there. SAT-CLOSING package: completes community-and-roles canonical strand at 3/3. Foundational social-studies vocabulary connecting children to civic + spatial-community awareness. Vocab-anchored — place names + function vocabulary (\"we go to the library to read books\"; \"we go to the fire station when there's a fire\"). Composes against matching + picture-sort + odd-one-out apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class community-map introduction. Teacher displays
      pictures of 6-8 community places (school, library,
      supermarket, hospital, fire station, park, bakery, post
      office). \"These are PLACES in our community — places we
      go to do different things. Who has been to one of these
      places this week?\" Class shares (e.g., \"I went to the
      supermarket with my mom\"; \"My dad takes me to the park
      after school\"). Teacher writes place names + asks: \"What
      do we DO at each place?\" Class describes briefly (\"we
      learn at school\"; \"we read books at the library\";
      \"we buy food at the supermarket\"). Pattern emphasis:
      \"Each place has a PURPOSE — it's the reason we go
      there.\" Optional connection to Arc 11 community-helpers:
      \"And who do we MEET at each place? The teacher at school;
      the librarian at the library; the firefighter at the fire
      station.\"

  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + place-function matching routine. Each pair
      receives 8 community-place picture cards + 8 function/
      purpose cards. Pair matches each place to its primary
      function (school → \"we learn\"; library → \"we read +
      borrow books\"; supermarket → \"we buy food\"; hospital →
      \"we go when sick + see doctors\"; fire station → \"we
      go when there's a fire\"; park → \"we play + run + see
      trees\"; bakery → \"we buy bread + cakes\"; post office
      → \"we send letters + packages\"). Recast errors with
      explanation (\"you matched the bakery with 'we learn' —
      let's think: what's at a bakery? Bread, cakes, cookies.
      What do we DO at a bakery? We BUY bread and cakes. Match
      bakery with 'we buy bread + cakes'\"). Optional extension:
      kids dramatize visiting a community place (one kid plays
      the place-worker; another kid plays the visitor; class
      guesses the place from the dialogue). Cross-reference
      Arc 11: \"Who works at this place?\" — bridges places +
      helpers strand-pair coherence.

  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (place
      image to place-name pair). Station 2: picture-sort
      worksheet (community-place vs not-community-place: school
      GOES IN community-places; bedroom GOES IN not-community-
      places — places-inside-our-home vs places-out-in-the-
      community). Station 3: matching worksheet (place → primary
      function pair). Station 4: math-worksheet (counting
      context — how many community places have we visited this
      month; how many people we'd see at the supermarket vs at
      the park; counting as community-engagement reflection).

  closure:
    durationMinutes: 5
    body: |
      Whole-class community-place-share. Teacher names a community
      place; class names the primary function + a community-
      helper who works there. \"Library?\" — \"We read books +
      the librarian works there!\" \"Fire station?\" — \"We go
      when there's a fire + firefighters work there!\" Forward-
      pointer: \"Today we learned about community PLACES — where
      we go to do different things. We've now learned community
      HELPERS (the people who help us) + community PLACES (where
      those helpers work). When we come back to community work,
      we'll think about HOW our community works as a whole — how
      all the places + people connect to make our neighborhood
      function well (Arc 18+ candidate).\"

