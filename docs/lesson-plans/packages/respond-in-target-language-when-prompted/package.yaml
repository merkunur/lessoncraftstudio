assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Respond in target language to 4 of 5 target-language prompts in
        8 of 10 trials.
      - Match prompt to appropriate response in 7 of 10 prompt-response
        card-matching tasks.
      - Articulate code-switching principle ("when teacher speaks in
        target language, I respond in target language") in 6 of 10
        trials.

    Differentiation:
    - Pre-K: 3 high-frequency prompts ("How are you?" / "What's your
      name?" / "What's your favorite color?"); single-word responses.
    - K: 5-6 prompts; full-sentence responses using language frames.
    - Grade 1+: extend to PROMPT-INITIATED conversation (kid asks a
      question in target language); bridge to multi-turn conversation
      (Arc 10+ candidate).

