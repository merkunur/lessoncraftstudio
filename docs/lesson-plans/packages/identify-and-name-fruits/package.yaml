compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition. Secondary strand: phonics. Tertiary
    strand: counting + color-categorization (color-sort station + i-like-plural
    sentence frame integrates preference-talk register + plural morphology).
    Mirrors Arc 1 3-strand integration. Sentence-strips frame variant for week 2:
    i-like-plural ("I like apples") integrates better with fruits than with
    farm-animals (kids talk about food preferences naturally).

curriculumStandards:
  - EYFS.ELG.UW
  - IB-PYP.HowWeOrganize

assessmentCriteria:
  en: |
    Receptive 10/10; productive 8/10; frame use 6/10.

    Differentiation:
    - Pre-K: receptive only.
    - K / Grade 1: full productive + sentence-frame use.
    - Grade 2+: extend to color descriptions ("the apple is red") + preference
      conversation ("I like apples. Do you like apples?").

