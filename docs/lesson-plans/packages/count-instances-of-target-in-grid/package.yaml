assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Count instances of a single target in a 4×4 grid with 80%+
        accuracy.
      - Count instances of a single target in a 5×5 grid with 70%+
        accuracy.
      - Name the target before counting in 8 of 10 trials (vocabulary-
        anchor verification).

    Differentiation:
    - Pre-K: 3×3 grids; tally with manipulatives; adult-supported counting.
    - K: 4×4 grids; independent counting up to 6.
    - Grade 1+: 5×5 grids; counting up to 12; extend to multi-target
      counting (count instances of 2 different targets simultaneously
      — increases working-memory load).

