# Teaching package — decompose tens and ones within 19
# Arc 17 Phase 1.3 (math / place-value canonical 0/3 → 1/3). K-foundational place-value insight: teen numbers (10-19) decompose as 'one ten and some ones'. Pair-coherent sibling: identify-tens-and-ones-2-digit (Grade 1 extension to 20-99 range, same arc phase).

targetSlug: decompose-tens-and-ones-within-19
language: en
title:
  en: "Decompose Teen Numbers — 14 is one ten and four ones"

description:
  en: "Kindergarten math package teaching kids that the teen numbers 10-19 each decompose as 'one ten and some ones'. 14 = 10 + 4; 17 = 10 + 7; 10 = 10 + 0; 19 = 10 + 9. K-foundational place-value insight — teen numbers visually + structurally are 'ten and some more', and this decomposition is the conceptual scaffold for all later multi-digit place-value work. Builds on Arc 7-12 count-objects-1-to-20 numeracy foundation; specifically named as a prerequisite for the Grade 1 add-2-digit-without-regrouping work shipped at Phase 1.2 (the column-addition routine assumes kids know what tens-and-ones means). Critical insight: in English the teen-number words 'eleven' and 'twelve' hide the structure (we say 'eleven' but write '11' = one ten + one one); 'thirteen' through 'nineteen' partially expose the structure ('-teen' = 'ten'). Foundation for the sibling package identify-tens-and-ones-2-digit, which extends the same decomposition idea to the 20-99 range. CCSS.K.NBT.A.1 primary anchor ('compose and decompose numbers from 11 to 19 into ten ones and some further ones'). 5 worksheet exercises + 7 printable materials over a 1-week unit. Place-value-mat material (the canonical place-value enactment surface) is deferred to Pillar 5 per Arc 17 Phase 0 §8 (C); matching-mat + manipulative-cut-outs in base-ten-blocks mode carry the place-value enactment role in this package."

durationMinutes: 25

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + teen-number decomposition introduction.
      Teacher places 14 single counters on the carpet. "Fourteen
      counters. Watch what happens when we GROUP them into a
      bundle of TEN." Teacher slides 10 counters together and
      wraps a rubber band around them. "Now we have one BUNDLE
      of ten — that's our ten — and four LOOSE counters
      sitting separately. Fourteen is ONE TEN and FOUR ONES."
      Teacher writes: 14 = 10 + 4. "Look at the number 14 — see
      the 1 on the left? That's our ten. See the 4 on the right?
      That's our four ones. The number tells you the
      decomposition." Teacher repeats with 17 (one ten + seven
      ones), 19 (one ten + nine ones), 10 (one ten + zero ones),
      11 (one ten + one one — 'eleven' hides the structure, but
      the digits show it). Pattern emphasis: "Every teen number
      is ONE TEN plus some ones. The first digit of a teen
      number is always 1 — that's the ten. The second digit
      tells you how many ones."
  contentActivity:
    durationMinutes: 10
    body: |
      Pair work + decomposition routine with animal-themed
      manipulative cut-outs. Each pair receives a stack of
      animal cut-outs + rubber bands or paper clips for bundling.
      Pair plays the bundle-of-ten game: teacher names a teen
      number (e.g., 13); kid A counts out 13 animals; kid B
      bundles 10 of them together and points to the 3 loose
      animals — "Thirteen is one ten and three ones." Pair
      writes the decomposition: 13 = 10 + 3. Pair swaps + repeats
      with 16, 11, 18, 10, 15. Recast errors with bundle-cue
      ("you bundled 11 animals into your ten — count again,
      we only put TEN in a bundle"). The animal cut-outs
      provide the concrete countability; the bundling action
      enacts the place-value decomposition physically.
  scaffold:
    durationMinutes: 7
    body: |
      Station rotation. Station 1: matching activity — match
      each teen numeral (10, 11, 12, ..., 19) to its
      decomposition card (10+0, 10+1, 10+2, ..., 10+9).
      Station 2: chart-count activity reinforcing the 10-frame
      structure (kids count animals in a layout that visually
      shows ten in one row + remainder in a second row).
      Station 3: math-puzzle decomposition mode (kids fill in
      the missing piece: 14 = 10 + ?; 18 = 10 + ?; 11 = ? + 1).
      Station 4: pattern-train sequence (10, 11, 12, 13...
      showing each step adds one one to the same ten — train
      cars visually carry the increment).
  closure:
    durationMinutes: 3
    body: |
      Whole-class teen-decomposition quick-recall. Teacher
      shows numerals; class chorally articulates the
      decomposition. "12? — One ten and two ones." "16? —
      One ten and six ones." "19? — One ten and nine ones."
      "10? — One ten and zero ones." Forward-pointer: "Today
      we learned that teen numbers are ONE TEN plus some
      ones. When we come back, we'll meet TWO-DIGIT NUMBERS
      that have TWO or more tens — twenty-five is TWO tens
      and five ones; forty-seven is FOUR tens and seven ones.
      Same idea, more tens. And this decomposition idea is
      the foundation for the column-addition we already
      learned in ADD TWO-DIGIT WITHOUT REGROUPING — we put
      the tens with the tens and the ones with the ones."

