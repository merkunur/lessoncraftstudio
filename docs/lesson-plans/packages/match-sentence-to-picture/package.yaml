assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Match 8 of 10 simple sentences to correct picture in 8 of 10
        trials.
      - Articulate matching reasoning ('the sentence says CAT and this
        picture is a cat') in 6 of 10 trials.
      - Read a NEW unfamiliar simple sentence + correctly match in 5 of
        10 trials.

    Differentiation:
    - Pre-K: picture-only matching (sentences read aloud by teacher);
      receptive comprehension only.
    - K: independent sentence-reading + matching for simple 3-word
      sentences.
    - Grade 1+: extend to longer sentences (4-6 words) + bridge to
      answer-who-what-where-questions (Arc 13+ candidate).

