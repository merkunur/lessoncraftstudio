<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Code-Knacker Addition - Progression Thumbnail</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #0D2137 0%, #1A3A5C 40%, #2E5077 100%); overflow: hidden;">

        <!-- Star dots scattered -->
        <div style="position: absolute; top: 45px; left: 120px; width: 3px; height: 3px; background: white; border-radius: 50%; opacity: 0.6; box-shadow: 0 0 6px 2px rgba(255,255,255,0.4);"></div>
        <div style="position: absolute; top: 80px; right: 200px; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0.5; box-shadow: 0 0 5px 2px rgba(255,255,255,0.3);"></div>
        <div style="position: absolute; top: 130px; left: 350px; width: 3px; height: 3px; background: #FFD600; border-radius: 50%; opacity: 0.7; box-shadow: 0 0 8px 3px rgba(255,214,0,0.5);"></div>
        <div style="position: absolute; top: 200px; right: 100px; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0.4;"></div>
        <div style="position: absolute; top: 60px; left: 600px; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; top: 310px; left: 60px; width: 3px; height: 3px; background: #AEEA00; border-radius: 50%; opacity: 0.5; box-shadow: 0 0 6px 2px rgba(174,234,0,0.4);"></div>
        <div style="position: absolute; top: 450px; right: 55px; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0.45;"></div>
        <div style="position: absolute; top: 180px; left: 800px; width: 3px; height: 3px; background: #FFD600; border-radius: 50%; opacity: 0.6; box-shadow: 0 0 6px 2px rgba(255,214,0,0.4);"></div>
        <div style="position: absolute; top: 520px; left: 150px; width: 2px; height: 2px; background: white; border-radius: 50%; opacity: 0.35;"></div>

        <!-- Title -->
        <div style="position: absolute; top: 22px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; color: #FFD600; margin: 0; text-shadow: 0 0 20px rgba(255,214,0,0.3), 2px 2px 0 rgba(0,0,0,0.4); letter-spacing: 3px;">CODE-KNACKER</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 36px; color: #FAFAFA; margin: 2px 0 0 0; text-shadow: 1px 1px 4px rgba(0,0,0,0.4); letter-spacing: 5px;">ADDITION</h2>
        </div>

        <!-- Dashed ascending path (SVG-style with CSS) -->
        <!-- Path segment 1: bottom-left to center -->
        <div style="position: absolute; top: 700px; left: 200px; width: 280px; height: 2px; border-top: 3px dashed rgba(255,214,0,0.4); transform: rotate(-35deg); transform-origin: left center;"></div>
        <!-- Path segment 2: center to top-right -->
        <div style="position: absolute; top: 460px; left: 470px; width: 280px; height: 2px; border-top: 3px dashed rgba(255,214,0,0.4); transform: rotate(-35deg); transform-origin: left center;"></div>

        <!-- LEVEL 1: ANFÄNGER (bottom-left) -->
        <div style="position: absolute; bottom: 180px; left: 55px; z-index: 10;">
            <!-- Green badge -->
            <div style="display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(145deg, #43A047, #2E7D32); padding: 8px 18px; border-radius: 20px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(67,160,71,0.4);">
                <span style="font-size: 16px;">&#11088;</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; color: white; letter-spacing: 1px;">ANF&Auml;NGER</span>
            </div>
            <div style="display: block;">
                <img src="https://www.lessoncraftstudio.com/samples/german/code%20addition/sample-1.jpeg" style="width: 180px; height: 233px; object-fit: cover; border-radius: 8px; border: 4px solid rgba(67,160,71,0.8); box-shadow: 0 10px 30px rgba(0,0,0,0.35);" alt="Anfänger Arbeitsblatt">
            </div>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: rgba(250,250,250,0.8); margin: 8px 0 0 0; text-align: center;">Einfache Summen</p>
        </div>

        <!-- LEVEL 2: DETEKTIV (center) -->
        <div style="position: absolute; top: 290px; left: 50%; transform: translateX(-50%); z-index: 10;">
            <!-- Teal badge -->
            <div style="display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(145deg, #00ACC1, #00838F); padding: 8px 18px; border-radius: 20px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(0,172,193,0.4);">
                <span style="font-size: 16px;">&#11088;&#11088;</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; color: white; letter-spacing: 1px;">DETEKTIV</span>
            </div>
            <div style="display: block;">
                <img src="https://www.lessoncraftstudio.com/samples/german/code%20addition/sample-3.jpeg" style="width: 200px; height: 259px; object-fit: cover; border-radius: 8px; border: 4px solid rgba(0,172,193,0.8); box-shadow: 0 10px 30px rgba(0,0,0,0.35);" alt="Detektiv Arbeitsblatt">
            </div>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: rgba(250,250,250,0.8); margin: 8px 0 0 0; text-align: center;">Mittlere Aufgaben</p>
        </div>

        <!-- LEVEL 3: MEISTERAGENT (top-right) -->
        <div style="position: absolute; top: 120px; right: 55px; z-index: 10;">
            <!-- Gold badge -->
            <div style="display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(145deg, #FFD600, #F9A825); padding: 8px 18px; border-radius: 20px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(255,214,0,0.4);">
                <span style="font-size: 16px;">&#11088;&#11088;&#11088;</span>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; color: #3E2723; letter-spacing: 1px;">MEISTERAGENT</span>
            </div>
            <div style="display: block; position: relative;">
                <img src="https://www.lessoncraftstudio.com/samples/german/code%20addition/sample-5.jpeg" style="width: 210px; height: 272px; object-fit: cover; border-radius: 8px; border: 4px solid rgba(255,214,0,0.8); box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 30px rgba(255,214,0,0.1);" alt="Meisteragent Arbeitsblatt">
                <!-- Crown above -->
                <div style="position: absolute; top: -28px; left: 50%; transform: translateX(-50%); font-size: 30px;">&#128081;</div>
            </div>
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: rgba(250,250,250,0.8); margin: 8px 0 0 0; text-align: center;">Profi-Level</p>
        </div>

        <!-- Arrow indicators between levels -->
        <div style="position: absolute; bottom: 275px; left: 265px; z-index: 5; font-size: 28px; color: rgba(255,214,0,0.5); transform: rotate(-30deg);">&#10148;</div>
        <div style="position: absolute; top: 420px; right: 290px; z-index: 5; font-size: 28px; color: rgba(255,214,0,0.5); transform: rotate(-30deg);">&#10148;</div>

        <!-- Bottom tagline -->
        <div style="position: absolute; bottom: 25px; left: 0; right: 0; text-align: center;">
            <div style="display: inline-block; background: rgba(13,33,55,0.8); padding: 12px 35px; border-radius: 30px; border: 2px solid rgba(255,214,0,0.3); box-shadow: 0 4px 16px rgba(0,0,0,0.3);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #FAFAFA; letter-spacing: 2px;">F&uuml;r jedes Lernniveau!</span>
            </div>
        </div>

    </div>
</body>
</html>
