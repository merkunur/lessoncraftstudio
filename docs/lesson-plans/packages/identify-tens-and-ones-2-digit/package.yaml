# Teaching package — identify tens and ones in 2-digit numbers
# Arc 17 Phase 1.3 (math / place-value canonical 1/3 → 2/3). Grade 1 extension of the teen-decomposition K work to the full 2-digit range 20-99. Sibling pair: decompose-tens-and-ones-within-19 (same arc phase).

targetSlug: identify-tens-and-ones-2-digit
language: en
title:
  en: "Tens and Ones in Two-Digit Numbers — 47 is four tens and seven ones"

description:
  en: "Grade 1 math package teaching kids that any two-digit number 20-99 structures as 'N tens and M ones'. 47 = 4 tens + 7 ones; 60 = 6 tens + 0 ones; 92 = 9 tens + 2 ones; 35 = 3 tens + 5 ones. Sibling extension of the K-foundational decompose-tens-and-ones-within-19 work (which covered the special 10-19 range where the tens digit is always 1); this package extends the same decomposition idea to all two-digit numbers, where the tens digit varies from 2 to 9. Builds on Arc 15 Phase 1 tens-and-ones-1-to-20 + Phase 4 tens-and-ones-51-to-100 + the Phase 1.3 sibling package decompose-tens-and-ones-within-19. Critical insight: the two digits of a two-digit numeral are not just two separate digits — the LEFT digit names tens (4 in 47 means '4 tens' = 40) and the RIGHT digit names ones. This is the load-bearing place-value insight for all Grade 1+ multi-digit arithmetic; the Phase 1.2 add-2-digit-without-regrouping + subtract-2-digit-without-regrouping packages assume kids can read this structure. CCSS.1.NBT.B.2 primary anchor ('understand that the two digits of a two-digit number represent amounts of tens and ones'). 5 worksheet exercises + 7 printable materials over a 1-week unit. Place-value-mat material deferred to Pillar 5 per Arc 17 Phase 0 §8 (C); matching-mat + manipulative-cut-outs in base-ten-blocks mode carry the place-value enactment role."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + 2-digit place-value introduction.
      Teacher writes 47 on the board. "What does this number
      tell us? It's a TWO-DIGIT number. The number has TWO
      parts: 4 on the LEFT and 7 on the RIGHT. The 4 on the
      left tells us TENS — four tens, which is forty. The 7
      on the right tells us ONES — seven ones. So 47 is FOUR
      TENS and SEVEN ONES. Forty plus seven equals forty-
      seven." Teacher draws 4 ten-sticks + 7 single-counters
      to show the structure visually. Teacher repeats with 35
      (three tens + five ones), 60 (six tens + ZERO ones —
      the right digit is zero, so no ones), 92 (nine tens +
      two ones), 21 (two tens + one one). Pattern emphasis:
      "The LEFT digit names tens. The RIGHT digit names ones.
      You always read them as a pair." Teacher also contrasts
      with teen numbers from yesterday: "Remember 14 was one
      ten and four ones? Today's numbers have MORE tens —
      not just one ten, but two or three or even nine tens.
      Same pattern, more tens."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + place-value identification routine. Each
      pair receives a set of 2-digit numeral cards (24, 53,
      87, 60, 32, 99, 41) + animal-themed base-ten manipulative
      cut-outs (ten-sticks + single-counters). Pair takes
      turns: kid A draws a numeral card (e.g., 53); kid B
      reads aloud "five tens and three ones" + builds 53
      with 5 ten-sticks + 3 single counters. Kid A checks
      by counting kid B's manipulatives — five tens is fifty,
      plus three ones is fifty-three. Then they swap. Recast
      errors with digit-cue ("you used six ten-sticks for
      53 — count the LEFT digit, it's 5, so we use FIVE ten-
      sticks"). Tricky cases get extra attention: numbers
      ending in 0 (60 has zero ones — kids might want to put
      one or two ones); numbers with the same two digits (33,
      55 — kids need to remember the LEFT 3 is tens and the
      RIGHT 3 is ones, not 'three threes').
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity — match
      each 2-digit numeral to its 'N tens and M ones'
      decomposition card. Station 2: chart-count activity
      where kids count base-ten visuals organized in rows of
      ten (a chart-count grid showing 4 full rows + 7 extras
      = 47). Station 3: math-puzzle decomposition mode
      (kids fill in N + M: 47 = ? tens + ? ones; 60 = ? tens
      + ? ones). Station 4: math-worksheet with mixed 2-digit
      number recognition tasks — given a numeral, write the
      decomposition; given a decomposition, write the
      numeral.
  closure:
    durationMinutes: 5
    body: |
      Whole-class 2-digit place-value quick-recall. Teacher
      shows numerals; class chorally articulates the
      decomposition. "47? — Four tens and seven ones." "60? —
      Six tens and zero ones." "92? — Nine tens and two
      ones." "33? — Three tens and three ones." Forward-
      pointer: "Today we learned that two-digit numbers are
      N TENS and M ONES — the LEFT digit names tens, the
      RIGHT digit names ones. This is the SAME pattern as
      yesterday's teen numbers, with bigger tens digits.
      And this is how the ADD TWO-DIGIT and SUBTRACT TWO-
      DIGIT work we learned earlier actually WORKS — when
      we line up the tens column and the ones column for
      column-addition, we're using exactly this 'left digit
      = tens, right digit = ones' insight. Next time we'll
      learn to COMPARE two-digit numbers using place-value
      (which is bigger: 47 or 53? Compare the tens first)."

