assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name all 4 water-cycle stages in correct sequence in 7 of 10
        trials.
      - Place 4 stage-pictures in correct circular order in 8 of 10
        trials.
      - Describe what happens at each stage in 1-2 sentences in 6 of
        10 trials.
      - Identify which stage is happening in a real-world example
        ("Puddle disappearing on sunny day = evaporation") in 6 of
        10 trials.

    Differentiation:
    - Pre-K: 3-stage simplification (water rises → clouds form →
      rain falls; omit collection or simplify to "water in rivers").
    - K: full 4-stage cycle.
    - Grade 1+: extend to seasonal water-cycle variation (snow vs
      rain precipitation; freezing/melting transitions) + bridge to
      ecosystem + biome work.

