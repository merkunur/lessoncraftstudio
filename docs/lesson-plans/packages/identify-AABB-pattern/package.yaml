compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / pattern-recognition.
    Secondary strand: vocabulary acquisition (vocab-anchored). Tertiary
    strand: meta-cognitive pattern-classification (kids articulate which
    pattern type a given sequence is — AB vs AAB/ABB vs ABC vs AABB).

    Architectural significance: closes the pattern-train mode set. The
    pattern-train app supports 5 modes (AB / AAB / ABB / ABC / AABB);
    Arc 7 Phase 1+2 ships packages for ALL 5 modes (AB at #1; AAB +
    ABB at #2; ABC at #3 here-equivalent; AABB at #4 = this package).
    Pattern-recognition strand is fully covered architecturally at
    Arc 7 close.

    Distinctive composition: 3 pattern-train AABB exercises across
    animals/fruits/vehicles + 1 matching + 1 pattern-worksheet mixed.
    The pattern-worksheet mixed at position 3 is the cognitive-
    flexibility checkpoint — kids work with all 5 pattern types
    simultaneously.

    Cognitive-load progression: AABB is the cognitively-heaviest pattern
    type. 4-element rule with doubled pairs requires holding more
    pattern-state in working memory than 2-element AB or 3-element
    AAB/ABB/ABC. Reflected in differentiation thresholds (NOT
    appropriate for Pre-K or K; introductory at Grade 1+; Grade 2+
    full fluency).

    Cross-strand integration: pattern-recognition strand-completion at
    Arc 7 Phase 2 unblocks future packages that depend on pattern-
    recognition skill (e.g., create-original-pattern in cognitive-
    domain or extend-the-pattern variants).

    K-3 multilingual classroom relevance: pattern-recognition continues
    to be language-portable. Vocab-anchor preserved.

