<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Zeichnen und Ausmalen - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: radial-gradient(circle at 50% 50%, #FFD600 0%, #FFC107 40%, #F8BBD9 100%); overflow: hidden;">

        <!-- Paint Splash - Top Left (Electric Purple) -->
        <div style="position: absolute; top: -60px; left: -60px; width: 380px; height: 380px;">
            <div style="width: 100%; height: 100%; background: radial-gradient(ellipse at 30% 30%, #7C3AED 0%, #7C3AED 35%, transparent 60%); transform: rotate(-10deg);"></div>
            <div style="position: absolute; top: 180px; left: 220px; width: 70px; height: 35px; background: #7C3AED; border-radius: 50%; transform: rotate(30deg);"></div>
        </div>

        <!-- Paint Splash - Top Right (Coral Pop) -->
        <div style="position: absolute; top: -40px; right: -50px; width: 350px; height: 350px;">
            <div style="width: 100%; height: 100%; background: radial-gradient(ellipse at 70% 30%, #FF6B6B 0%, #FF6B6B 30%, transparent 55%); transform: rotate(15deg);"></div>
            <div style="position: absolute; top: 200px; left: 30px; width: 55px; height: 28px; background: #FF6B6B; border-radius: 50%; transform: rotate(-25deg);"></div>
        </div>

        <!-- Paint Splash - Bottom Left (Lime Green) -->
        <div style="position: absolute; bottom: -70px; left: -50px; width: 400px; height: 400px;">
            <div style="width: 100%; height: 100%; background: radial-gradient(ellipse at 30% 70%, #8BC34A 0%, #8BC34A 32%, transparent 58%); transform: rotate(5deg);"></div>
            <div style="position: absolute; top: 80px; right: 120px; width: 60px; height: 30px; background: #8BC34A; border-radius: 50%; transform: rotate(35deg);"></div>
        </div>

        <!-- Paint Splash - Bottom Right (Electric Purple) -->
        <div style="position: absolute; bottom: -50px; right: -60px; width: 360px; height: 360px;">
            <div style="width: 100%; height: 100%; background: radial-gradient(ellipse at 70% 70%, #7C3AED 0%, #7C3AED 28%, transparent 52%); transform: rotate(-20deg);"></div>
        </div>

        <!-- Paint Splash - Left Middle (Coral) -->
        <div style="position: absolute; top: 380px; left: -90px; width: 280px; height: 220px;">
            <div style="width: 100%; height: 100%; background: radial-gradient(ellipse at 20% 50%, #FF6B6B 0%, #FF6B6B 40%, transparent 65%);"></div>
        </div>

        <!-- Paint Splash - Right Middle (Lime) -->
        <div style="position: absolute; top: 420px; right: -70px; width: 250px; height: 200px;">
            <div style="width: 100%; height: 100%; background: radial-gradient(ellipse at 80% 50%, #8BC34A 0%, #8BC34A 45%, transparent 70%);"></div>
        </div>

        <!-- Confetti Dots Explosion -->
        <div style="position: absolute; top: 90px; left: 220px; width: 18px; height: 18px; background: #FF6B6B; border-radius: 50%;"></div>
        <div style="position: absolute; top: 140px; right: 200px; width: 15px; height: 15px; background: #8BC34A; border-radius: 50%;"></div>
        <div style="position: absolute; top: 200px; left: 100px; width: 12px; height: 12px; background: #7C3AED; border-radius: 50%;"></div>
        <div style="position: absolute; top: 280px; right: 120px; width: 16px; height: 16px; background: #FF6B6B; border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 340px; left: 170px; width: 14px; height: 14px; background: #7C3AED; border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 360px; right: 190px; width: 17px; height: 17px; background: #8BC34A; border-radius: 50%;"></div>
        <div style="position: absolute; top: 350px; left: 60px; width: 11px; height: 11px; background: #FFD600; border-radius: 50%;"></div>
        <div style="position: absolute; top: 380px; right: 80px; width: 13px; height: 13px; background: #FFD600; border-radius: 50%;"></div>

        <!-- Sparkle Bursts -->
        <div style="position: absolute; top: 160px; left: 350px; font-size: 28px; transform: rotate(20deg);">&#10024;</div>
        <div style="position: absolute; top: 130px; right: 320px; font-size: 24px; transform: rotate(-15deg);">&#10024;</div>
        <div style="position: absolute; bottom: 320px; left: 300px; font-size: 26px; transform: rotate(10deg);">&#10024;</div>
        <div style="position: absolute; bottom: 350px; right: 280px; font-size: 22px; transform: rotate(-25deg);">&#10024;</div>
        <div style="position: absolute; top: 250px; left: 50px; font-size: 20px; transform: rotate(30deg);">&#11088;</div>
        <div style="position: absolute; top: 230px; right: 60px; font-size: 18px; transform: rotate(-20deg);">&#11088;</div>

        <!-- GRATIS Badge - Bouncing/Tilted Pink Burst -->
        <div style="position: absolute; top: 20px; left: 20px; z-index: 100; transform: rotate(-12deg);">
            <div style="width: 110px; height: 110px; position: relative;">
                <!-- Starburst -->
                <div style="position: absolute; top: 50%; left: 50%; width: 110px; height: 110px; transform: translate(-50%, -50%) rotate(22deg); background: #FF6B6B; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);"></div>
                <div style="position: absolute; top: 50%; left: 50%; width: 80px; height: 80px; transform: translate(-50%, -50%); border-radius: 50%; background: linear-gradient(145deg, #FF6B6B 0%, #E84A5F 100%); box-shadow: 0 6px 25px rgba(255,107,107,0.6); display: flex; align-items: center; justify-content: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">GRATIS</span>
                </div>
            </div>
        </div>

        <!-- Giant Rainbow "MALEN!" Headline -->
        <div style="position: absolute; top: 80px; left: 0; right: 0; text-align: center; z-index: 50;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 150px; margin: 0; background: linear-gradient(90deg, #FF6B6B 0%, #FF9800 20%, #FFD600 40%, #8BC34A 60%, #42A5F5 80%, #7C3AED 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(5px 5px 0 rgba(0,0,0,0.15));">MALEN!</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 42px; color: #7C3AED; margin: -15px 0 0 0; text-shadow: 3px 3px 0 rgba(255,255,255,0.9);">S&uuml;&szlig;e Tiere warten!</h2>
        </div>

        <!-- Main Worksheet - Center Hero -->
        <div style="position: absolute; top: 330px; left: 50%; transform: translateX(-50%); z-index: 60;">
            <div style="box-shadow: 0 25px 70px rgba(0,0,0,0.3), 0 0 0 10px white; border-radius: 20px; overflow: hidden; position: relative;">
                <img src="https://www.lessoncraftstudio.com/samples/german/draw%20and%20color/sample-1.jpeg" style="width: 240px; height: 310px; object-fit: cover; display: block;">
                <!-- Sparkle on corner -->
                <div style="position: absolute; top: -15px; right: -15px; font-size: 32px;">&#10024;</div>
            </div>
        </div>

        <!-- Side Worksheets -->
        <!-- Left -->
        <div style="position: absolute; top: 400px; left: 55px; z-index: 55;">
            <div style="box-shadow: 0 15px 45px rgba(0,0,0,0.25), 0 0 0 6px white; border-radius: 14px; overflow: hidden;">
                <img src="https://www.lessoncraftstudio.com/samples/german/draw%20and%20color/sample-4.jpeg" style="width: 180px; height: 139px; object-fit: cover; display: block;">
            </div>
        </div>

        <!-- Right -->
        <div style="position: absolute; top: 400px; right: 55px; z-index: 55;">
            <div style="box-shadow: 0 15px 45px rgba(0,0,0,0.25), 0 0 0 6px white; border-radius: 14px; overflow: hidden;">
                <img src="https://www.lessoncraftstudio.com/samples/german/draw%20and%20color/sample-6.jpeg" style="width: 180px; height: 139px; object-fit: cover; display: block;">
            </div>
        </div>

        <!-- Dancing Pencils -->
        <!-- Red Pencil - Left -->
        <div style="position: absolute; top: 380px; left: 130px; transform: rotate(40deg); z-index: 70;">
            <div style="width: 130px; height: 30px; background: linear-gradient(180deg, #FF5757 0%, #E53935 50%, #C62828 100%); border-radius: 4px 15px 15px 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.25);"></div>
            <div style="position: absolute; left: -20px; top: 5px; width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 24px solid #FFB74D;"></div>
            <div style="position: absolute; top: 4px; left: 10px; width: 105px; height: 6px; background: rgba(255,255,255,0.25); border-radius: 3px;"></div>
        </div>

        <!-- Blue Pencil - Right -->
        <div style="position: absolute; top: 420px; right: 120px; transform: rotate(-45deg); z-index: 70;">
            <div style="width: 120px; height: 28px; background: linear-gradient(180deg, #42A5F5 0%, #1E88E5 50%, #1565C0 100%); border-radius: 4px 14px 14px 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.25);"></div>
            <div style="position: absolute; left: -18px; top: 4px; width: 0; height: 0; border-top: 10px solid transparent; border-bottom: 10px solid transparent; border-right: 22px solid #FFB74D;"></div>
            <div style="position: absolute; top: 4px; left: 10px; width: 95px; height: 5px; background: rgba(255,255,255,0.25); border-radius: 3px;"></div>
        </div>

        <!-- Color Swatches -->
        <div style="position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 75;">
            <div style="width: 35px; height: 35px; background: #FF6B6B; border-radius: 50%; box-shadow: 0 4px 12px rgba(255,107,107,0.5), 0 0 0 4px white;"></div>
            <div style="width: 35px; height: 35px; background: #FF9800; border-radius: 50%; box-shadow: 0 4px 12px rgba(255,152,0,0.5), 0 0 0 4px white;"></div>
            <div style="width: 35px; height: 35px; background: #FFD600; border-radius: 50%; box-shadow: 0 4px 12px rgba(255,214,0,0.5), 0 0 0 4px white;"></div>
            <div style="width: 35px; height: 35px; background: #8BC34A; border-radius: 50%; box-shadow: 0 4px 12px rgba(139,195,74,0.5), 0 0 0 4px white;"></div>
            <div style="width: 35px; height: 35px; background: #42A5F5; border-radius: 50%; box-shadow: 0 4px 12px rgba(66,165,245,0.5), 0 0 0 4px white;"></div>
            <div style="width: 35px; height: 35px; background: #7C3AED; border-radius: 50%; box-shadow: 0 4px 12px rgba(124,58,237,0.5), 0 0 0 4px white;"></div>
        </div>

        <!-- "Kinder lieben es!" Pill -->
        <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 80;">
            <div style="background: linear-gradient(90deg, #FF6B6B 0%, #FF8FAB 50%, #FF6B6B 100%); padding: 18px 50px; border-radius: 50px; box-shadow: 0 10px 35px rgba(255,107,107,0.5);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.25);">Kinder lieben es! &#9829;</span>
            </div>
        </div>

        <!-- Small decorative hearts -->
        <div style="position: absolute; bottom: 95px; left: 220px; font-size: 24px; color: #FF6B6B; transform: rotate(-15deg);">&#9829;</div>
        <div style="position: absolute; bottom: 100px; right: 240px; font-size: 20px; color: #FF6B6B; transform: rotate(20deg);">&#9829;</div>

    </div>
</body>
</html>
