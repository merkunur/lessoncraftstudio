compositionalRationale:
  en: |
    Primary strand: math / place-value (identify tens and ones
    in 2-digit numbers — second canonical fill in the place-
    value strand; 1/3 → 2/3 canonical). Secondary strand:
    counting-and-cardinality (2-digit number recognition +
    counting-by-tens). Tertiary strand: numeracy precursor
    (the place-value decomposition insight grounds all later
    multi-digit arithmetic — column-addition, regrouping,
    borrowing all assume this insight).

    Architectural significance: sibling extension of decompose-
    tens-and-ones-within-19 (same arc phase) — the teen-
    decomposition K work surfaces the place-value pattern
    with the tens digit fixed at 1; this package extends the
    pattern to the full 2-digit range 20-99 where the tens
    digit varies from 2 to 9. Together they form the K →
    Grade 1 place-value introduction sequence. The package
    is specifically named as a prerequisite for Phase 1.2
    add-2-digit-without-regrouping + subtract-2-digit-
    without-regrouping in learning-targets.json (the column-
    operation routines assume this insight). After this
    package, the place-value canonical strand has one
    remaining target: compare-2-digit-numbers (which uses
    the N tens + M ones decomposition to compare magnitudes
    by examining tens first).

    Distinctive composition: 2 matching (intro + assessment,
    bookending the 2-digit-numeral-to-decomposition pairing
    work) + 1 chart-count (visual ten-row structure
    reinforcement) + 1 math-puzzle decomposition + 1 math-
    worksheet (mixed 2-digit decomposition tasks). The
    matching work is load-bearing — pairing each 2-digit
    numeral with its 'N tens + M ones' decomposition is the
    core conceptual move. The math-worksheet at consolidation
    surfaces both directions: numeral → decomposition AND
    decomposition → numeral, so kids practice the place-
    value insight bidirectionally.

    Materials note: place-value-mat is the canonical place-
    value enactment surface (deferred to Pillar 5 per Arc 17
    Phase 0 §8 (C); see decompose-tens-and-ones-within-19
    rationale for the substitution pattern). Matching-mat
    occupies position 3 (pedagogicalRole 'place-value-
    decomposition-game'); manipulative-cut-outs in base-ten-
    blocks mode (position 5, itemCount 100 to support full
    2-digit range) provides the concrete ten-stick + ones
    manipulatives. Sibling pair coherence: decompose-tens-
    and-ones-within-19 uses the same material substitution
    pattern with itemCount 40 (sufficient for teen range);
    this package uses itemCount 100 (sufficient for full
    2-digit range).

    Class B FLEXIBLE substrate: composes against animals
    theme (pair-coherent with sibling decompose-tens-and-
    ones-within-19 + Arc 16 + Phase 1.2 addition-subtraction
    cluster).

    K-3 multilingual classroom relevance: 2-digit place-
    value is universal K-3 numeracy content. Two-digit
    number-word naming carries the cross-locale
    irregularities described in Phase 1.2 add-2-digit-
    without-regrouping rationale: en regular ('forty-seven');
    de reverse-decade ('siebenundvierzig' — seven-and-forty,
    which audibly hides the place-value structure that pt
    'quarenta e sete' exposes); es 'cuarenta y siete'
    regular; fr 'quarante-sept' regular at 40s but 'soixante-
    dix-sept' for 77 (sixty-ten-seven, multiple-step
    decomposition); fi 'neljäkymmentäseitsemän' (literally
    'four-tens-seven') agglutinative + transparent. The
    cross-locale work surfaces the gap between spoken number-
    word forms (which sometimes hide structure) and written
    place-value structure (always 'left digit = tens, right
    digit = ones'). Locale-variant work at Phase 3+ adapts
    to each locale's two-digit number-word + place-value-
    vocabulary register.

