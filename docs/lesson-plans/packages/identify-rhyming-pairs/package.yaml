compositionalRationale:
  en: |
    Primary strand: early-literacy / phonological-awareness (rhyme
    recognition). Secondary strand: vocabulary acquisition (vocab-
    anchored — rhyme work uses familiar vocab as input). Tertiary
    strand: auditory discrimination (kids distinguish ending sounds
    by ear).

    Architectural significance: FIRST phonological-awareness strand
    package in the catalog. Phonological awareness is the canonical
    pre-reading bridge — research-validated as the strongest predictor
    of early reading success (Cunningham + Stanovich; National Reading
    Panel). Establishing rhyme-recognition substrate opens the strand
    for additional packages: count-syllables-1-to-3, blend-onset-
    rime, isolate-initial-phoneme (8 more unauthored targets in
    learning-targets.json).

    Distinctive composition: 2 matching exercises across 2 vocabulary
    contexts (animals, foods) + 1 word-scramble (rhyme spelling) + 1
    word-guess (rhyme completion) + 1 odd-one-out (rhyme exclusion).
    Each exercise targets a different cognitive operation on rhyme
    pattern: identify, spell, complete, exclude.

    Cross-strand integration: phonological-awareness + vocabulary
    acquisition (vocab-anchored) + spelling (rhyme spelling reinforces
    pattern). The package is foundational for future early-literacy
    work — phonics-decoding + spelling-and-encoding strands all build
    on phonological-awareness.

    Class B FLEXIBLE substrate: composes against vocabulary-rich
    image-library themes. Rhyme work needs vocabulary breadth (multiple
    -at words, multiple -all words, etc.); substrate-readiness universal
    across themes that have meaningful word-set diversity.

    K-3 multilingual classroom relevance: rhyme is language-specific
    (en rhyming patterns differ from es/it/fr/de patterns). Locale-
    variant sparse-overrides per Phase 3 handle locale-specific rhyme
    inventories. Pt-BR rhyme work would surface different pattern
    families (-ão words: leão, balão, coração; -inho words: passarinho,
    bonequinho).

