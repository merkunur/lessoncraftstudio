compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial / drawing-and-tracing
    (curved-line tracing). Secondary strand: visual-motor coordination
    (smooth-flow hand-eye). Tertiary strand: pre-handwriting (curves
    are foundational for letter formation).

    Architectural significance: deepens drawing-and-tracing strand from
    1/4 → 2/4 packages. Builds on Arc 10 trace-straight-lines.
    Curves + straight lines together are the complete set of letter-
    formation primitives. RESOLVES Arc 10 forward-pointer.

    Distinctive composition: 2 vocabulary-tracing-strips materials at
    different traceStyle parameters (dotted + outline) — gradual
    fading guidance. Same scaffolding pattern as Arc 10 trace-straight-
    lines (sibling structural template).

    Cross-strand integration: drawing-and-tracing + letter-recognition
    (Arc 9+10+11) + vocabulary acquisition. Future arcs build on
    this foundation: trace-2d-shapes (forward-pointer; Arc 12+
    candidate) + draw-2d-shapes-freehand.

    Class B FLEXIBLE substrate: composes against vocabulary-tracing-
    strips material capability. Universal substrate-readiness.

    K-3 multilingual classroom relevance: tracing is language-portable.
    Curves universal across all 11 platform locales.

