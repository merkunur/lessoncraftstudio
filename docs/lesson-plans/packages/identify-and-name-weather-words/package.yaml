assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 6 of 8 weather-word vocabulary items in 8 of 10 trials.
      - Use the "It is ___" frame to describe today's weather in 7 of
        10 morning-circle observations.
      - Match weather words to weather scenes in 8 of 10 trials.

    Differentiation:
    - Pre-K: 4 core weather words (sun, cloud, rain, snow); receptive-
      language only ("point to ___").
    - K: 6-8 weather words; productive-language frame ("It is ___").
    - Grade 1+: extend to seasonal weather + descriptive intensifiers
      ("very rainy," "a little cloudy") + bridge to weather-related
      science (water cycle; describe-day-night-cycle Arc 9+ candidate).

