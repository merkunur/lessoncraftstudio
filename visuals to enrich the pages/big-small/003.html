<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Big or Small - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(135deg, #64B5F6 0%, #81D4FA 30%, #FFF59D 70%, #FFCC80 100%); font-family: 'Fredoka', sans-serif;">

        <!-- Radial burst from center -->
        <div style="position: absolute; top: 50%; left: 50%; width: 800px; height: 800px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 60%); border-radius: 50%;"></div>

        <!-- Confetti elements -->
        <div style="position: absolute; top: 50px; left: 80px; width: 20px; height: 20px; background: #FF8A80; border-radius: 50%; opacity: 0.8;"></div>
        <div style="position: absolute; top: 120px; left: 200px; width: 15px; height: 15px; background: #26A69A; transform: rotate(45deg); opacity: 0.7;"></div>
        <div style="position: absolute; top: 80px; right: 150px; width: 18px; height: 18px; background: #FFD54F; border-radius: 50%; opacity: 0.9;"></div>
        <div style="position: absolute; top: 200px; right: 80px; width: 12px; height: 12px; background: #E91E63; transform: rotate(30deg); opacity: 0.6;"></div>
        <div style="position: absolute; top: 300px; left: 50px; width: 16px; height: 16px; background: #9C27B0; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 250px; left: 100px; width: 14px; height: 14px; background: #4CAF50; transform: rotate(60deg); opacity: 0.8;"></div>
        <div style="position: absolute; bottom: 200px; right: 120px; width: 18px; height: 18px; background: #FF5722; border-radius: 50%; opacity: 0.7;"></div>
        <div style="position: absolute; top: 400px; right: 40px; width: 12px; height: 12px; background: #00BCD4; transform: rotate(15deg); opacity: 0.9;"></div>
        <div style="position: absolute; bottom: 350px; left: 40px; width: 20px; height: 20px; background: #FFC107; border-radius: 50%; opacity: 0.8;"></div>

        <!-- Sparkle stars -->
        <div style="position: absolute; top: 160px; left: 120px; font-size: 32px; transform: rotate(-15deg);">✨</div>
        <div style="position: absolute; top: 100px; right: 100px; font-size: 28px; transform: rotate(20deg);">⭐</div>
        <div style="position: absolute; bottom: 280px; right: 60px; font-size: 24px; transform: rotate(-10deg);">✨</div>
        <div style="position: absolute; bottom: 200px; left: 60px; font-size: 30px; transform: rotate(10deg);">🌟</div>
        <div style="position: absolute; top: 350px; left: 25px; font-size: 22px; transform: rotate(5deg);">⭐</div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 20px; left: 20px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #FF8A80 0%, #FF6B6B 100%); color: white; padding: 12px 28px; font-size: 26px; font-weight: 700; border-radius: 30px; box-shadow: 0 6px 20px rgba(255,138,128,0.5), inset 0 2px 0 rgba(255,255,255,0.3); letter-spacing: 2px; transform: rotate(-5deg);">FREE</div>
        </div>

        <!-- Main Title - Huge playful text -->
        <div style="position: absolute; top: 60px; left: 0; right: 0; text-align: center; z-index: 50;">
            <!-- Comic burst background -->
            <div style="position: absolute; top: 50%; left: 50%; width: 650px; height: 200px; background: white; transform: translate(-50%, -50%); border-radius: 50%; box-shadow: 0 0 0 8px #FFD54F, 0 10px 40px rgba(0,0,0,0.15);"></div>

            <div style="position: relative; z-index: 10;">
                <div style="font-size: 80px; font-weight: 700; letter-spacing: -2px;">
                    <span style="color: #26A69A; font-size: 95px; display: inline-block; transform: rotate(-8deg) translateY(-5px); text-shadow: 4px 4px 0 rgba(38,166,154,0.2);">W</span><span style="color: #FF8A80; font-size: 85px;">h</span><span style="color: #26A69A; font-size: 90px;">i</span><span style="color: #FFD54F; font-size: 82px;">c</span><span style="color: #FF8A80; font-size: 88px;">h</span>
                    <span style="color: #666; font-size: 60px; margin: 0 5px;">is</span>
                </div>
                <div style="font-size: 100px; font-weight: 700; margin-top: -20px;">
                    <span style="color: #26A69A; font-size: 130px; text-shadow: 5px 5px 0 rgba(38,166,154,0.2);">BIG</span><span style="color: #FF8A80; font-size: 90px; text-shadow: 3px 3px 0 rgba(255,138,128,0.2);">GER</span><span style="color: #FFD54F; font-size: 100px;">?!</span>
                </div>
            </div>
        </div>

        <!-- Worksheet samples floating/exploding from center -->
        <div style="position: absolute; top: 280px; left: 50%; transform: translateX(-50%); width: 800px; height: 450px;">

            <!-- Large central worksheet - tilted -->
            <div style="position: absolute; top: 50px; left: 50%; transform: translateX(-50%) rotate(-3deg); z-index: 30;">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/big%20small/big-small-worksheet_worksheet%20(1).jpeg" style="width: 340px; height: auto; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.25), 0 0 0 5px white; border: none;">
            </div>

            <!-- Speech bubble "I'm BIG!" - attached to large worksheet -->
            <div style="position: absolute; top: 40px; right: 120px; z-index: 40;">
                <div style="background: white; padding: 14px 22px; border-radius: 25px; font-size: 26px; font-weight: 700; color: #26A69A; box-shadow: 0 6px 20px rgba(0,0,0,0.15); position: relative; border: 4px solid #26A69A;">
                    I'm BIG!
                    <div style="position: absolute; bottom: -15px; left: 30px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 20px solid #26A69A;"></div>
                    <div style="position: absolute; bottom: -8px; left: 33px; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 15px solid white;"></div>
                </div>
            </div>

            <!-- Smaller worksheet - left side, floating -->
            <div style="position: absolute; top: 150px; left: 30px; transform: rotate(8deg); z-index: 20;">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/big%20small/big-small%20identical%20images.jpeg" style="width: 180px; height: auto; border-radius: 12px; box-shadow: 0 12px 35px rgba(0,0,0,0.2), 0 0 0 4px white;">
            </div>

            <!-- Speech bubble "I'm small!" -->
            <div style="position: absolute; top: 120px; left: 10px; z-index: 25;">
                <div style="background: white; padding: 10px 16px; border-radius: 20px; font-size: 18px; font-weight: 700; color: #FF8A80; box-shadow: 0 4px 15px rgba(0,0,0,0.15); position: relative; border: 3px solid #FF8A80;">
                    I'm small!
                    <div style="position: absolute; bottom: -12px; right: 25px; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 15px solid #FF8A80;"></div>
                    <div style="position: absolute; bottom: -6px; right: 27px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 12px solid white;"></div>
                </div>
            </div>

            <!-- Another small worksheet - right side -->
            <div style="position: absolute; top: 180px; right: 50px; transform: rotate(-6deg); z-index: 20;">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/big%20small/big-small%20number%201-2-3.jpeg" style="width: 160px; height: auto; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2), 0 0 0 3px white;">
            </div>

            <!-- Tiny worksheet peeking from bottom -->
            <div style="position: absolute; bottom: 0; left: 180px; transform: rotate(12deg); z-index: 15;">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/big%20small/big-small-different%20images.jpeg" style="width: 130px; height: auto; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.2), 0 0 0 3px white;">
            </div>
        </div>

        <!-- "Kids LOVE This!" heart badge -->
        <div style="position: absolute; top: 25px; right: 25px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #E91E63 0%, #C2185B 100%); color: white; padding: 12px 22px; border-radius: 25px; font-size: 20px; font-weight: 700; box-shadow: 0 5px 20px rgba(233,30,99,0.4); display: flex; align-items: center; gap: 8px; transform: rotate(5deg);">
                <span style="font-size: 22px;">❤️</span> Kids LOVE This!
            </div>
        </div>

        <!-- Comic burst "SO MUCH FUN!" -->
        <div style="position: absolute; bottom: 180px; right: 40px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #FFD54F 0%, #FFC107 100%); padding: 18px 25px; border-radius: 50%; font-size: 18px; font-weight: 700; color: #E65100; box-shadow: 0 6px 20px rgba(255,193,7,0.5); transform: rotate(8deg); text-align: center; line-height: 1.2;">
                SO MUCH<br>FUN!
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.9) 30%, white 100%);">
            <div style="position: absolute; bottom: 20px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 20px;">
                <div style="background: linear-gradient(135deg, #26A69A 0%, #00897B 100%); color: white; padding: 14px 30px; border-radius: 30px; font-size: 26px; font-weight: 700; box-shadow: 0 6px 25px rgba(38,166,154,0.4);">🐾 Adorable Animals!</div>
                <div style="background: linear-gradient(135deg, #FF8A80 0%, #FF6B6B 100%); color: white; padding: 14px 25px; border-radius: 30px; font-size: 20px; font-weight: 700; box-shadow: 0 5px 20px rgba(255,138,128,0.4);">PreK-K</div>
            </div>
        </div>

        <!-- Additional floating confetti/shapes at the very top layer -->
        <div style="position: absolute; top: 450px; left: 15px; width: 25px; height: 8px; background: #E91E63; border-radius: 4px; transform: rotate(-20deg); opacity: 0.7;"></div>
        <div style="position: absolute; top: 500px; right: 25px; width: 20px; height: 8px; background: #26A69A; border-radius: 4px; transform: rotate(25deg); opacity: 0.8;"></div>
        <div style="position: absolute; bottom: 150px; left: 200px; width: 22px; height: 8px; background: #9C27B0; border-radius: 4px; transform: rotate(40deg); opacity: 0.6;"></div>

    </div>
</body>
</html>
