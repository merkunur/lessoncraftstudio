assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Read 8 analog clock faces showing half-hour times
        correctly in 7 of 10 trials.
      - Distinguish o'clock from half-past based on
        minute-hand position (12 vs 6) in 8 of 10 trials.
      - Identify the hour-hand BETWEEN-position at half-
        past times (e.g., at 5:30 the hour hand sits
        between 5 and 6, not on either) in 6 of 10 trials.
      - Set the movable-hand paper clock to a given
        half-hour time in 6 of 10 trials.
      - Use vocabulary 'half-past' / 'halfway' / 'thirty'
        correctly in 6 of 10 productive-language trials.

    Differentiation:
    - Pre-K: skip half-hour reading entirely; review
      days-of-week + months-of-year + hour-only reading
      (via Slot 1) first.
    - K: hour-only reading (Slot 1) is sufficient for
      K; defer half-past to Grade 1.
    - Grade 1: full half-past reading; movable-hand work
      heavily scaffolded; the hour-hand-between-position
      gets explicit attention.
    - Grade 2+: extend to tell-time-to-quarter-hour
      (Phase 1.5+ candidate) + tell-time-to-five-minutes
      + AM/PM distinction + digital clock format +
      elapsed-time problems.

