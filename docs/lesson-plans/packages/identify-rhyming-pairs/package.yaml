# Teaching package — identify rhyming word pairs
# Arc 10 Phase 1 (Path B; early-literacy / phonological-awareness strand
# FIRST package). Class B FLEXIBLE; vocab-anchored. Foundational pre-
# reading skill: kids hear/see word pairs and identify which pairs RHYME
# (cat-hat, ball-fall) vs DON'T (cat-dog, ball-tree).

targetSlug: identify-rhyming-pairs
language: en
title:
  en: "Rhyming Pairs — words that sound the same at the end"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching rhyme recognition. FIRST phonological-awareness strand package in the catalog. Foundational pre-reading skill: kids identify which word pairs rhyme (cat-hat, ball-fall, sun-fun) vs don't rhyme (cat-dog, ball-tree). Phonological awareness is the critical bridge between oral language + reading: kids who can hear rhyming patterns acquire reading more easily. Vocab-anchored — kids use familiar vocabulary as input for rhyme work. Composes against matching + word-scramble apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class rhyme-listening routine. Teacher reads pairs of words
      aloud: "Cat... Hat. Do those sound the same at the end?" Class
      identifies: "Yes — they rhyme!" Repeat with: "Ball... Tree.
      Same sound at the end?" Class: "No." Reinforces rhyme-noticing
      by ear. Teacher introduces: "When two words have the same sound
      at the end, we say they RHYME." Repeat with 4-5 pairs.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + rhyme-and-match routine. Each pair receives 8-10
      picture cards + a chart with a sample word. Pair finds pictures
      whose names rhyme with the sample (cat → hat, bat, mat). Recast
      errors with explanation ("you said BIRD rhymes with CAT — let's
      say them slowly: 'cat' ends in -at; 'bird' ends in -ird. Different
      ending sounds — they don't rhyme. Now find a picture ending in
      -at: hat? mat? rat?"). Optional extension: kids generate their
      own rhyming pairs from their vocab knowledge.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (rhyming pairs;
      kids match pictures whose names rhyme). Station 2: word-scramble
      (kids unscramble rhyming words; reinforces spelling of rhyme
      patterns). Station 3: manipulative cut-outs hands-on rhyme-
      construction (kids sort pictures into rhyming groups by ending
      sound). Station 4: word-guess (kids fill in rhyming words from
      picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class rhyme-share. Teacher gives a starter word; class
      generates as many rhyming words as they can chorally. Forward-
      pointer: "Today we noticed words that RHYME at the end. When we
      come back to sound-and-letter work next, we'll learn about
      SYLLABLES — the BEATS in words — counting how many beats are
      in cat (1), water (2), banana (3)."

