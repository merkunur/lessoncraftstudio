compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial /
    handwriting (form lowercase letters — advances strand
    1/3 → 2/3; form-numerals-0-to-10 remains for Arc 18
    P1.2 candidate to bring strand to 3/3 SAT). Secondary
    strand: early-literacy / letter-recognition (the
    formation work reinforces lowercase letter-shape
    recognition kids established at identify-lowercase-
    letters prerequisite). Tertiary strand: fine-motor-
    control (the actual pencil-grip + stroke-control work
    + zone-awareness work that lowercase handwriting
    requires).

    Architectural significance: extends the handwriting
    strand opened by Arc 17 P1.5 form-uppercase-letters.
    Where form-uppercase-letters established the motor-
    routine fluency for uppercase formation (26 letter
    shapes, all sitting on the baseline, no ascenders or
    descenders to track), this package adds the more
    motor-demanding lowercase set: most lowercase letters
    have THREE-ZONE structure (descender below baseline +
    x-height-middle + ascender above x-height), and
    several lowercase pairs are visually similar (b/d,
    p/q, n/u, m/w) requiring explicit orientation
    attention. The lowercase work is the natural successor
    to uppercase + identify-lowercase-letters (the
    recognition-before-formation chain canonical for
    lowercase as well as uppercase).

    Cross-reference to Arc 17 P1.5 form-uppercase-letters
    (the motor-routine fluency prerequisite): that package
    established the dotted-trace + independent-line
    pedagogy + the basic 26-letter motor inventory; this
    package applies the SAME pedagogy to a more demanding
    lowercase letter set. The dotted-trace + independent-
    line is reusable; the zone-awareness + visually-
    similar-pair-disambiguation is lowercase-specific
    added pedagogy.

    Cross-reference to identify-lowercase-letters (the
    letter-shape recognition prerequisite): kids must
    recognize the lowercase letter forms before they can
    reliably form them. The recognition-before-formation
    sequence is canonical early-literacy pedagogy at the
    lowercase level same as at uppercase. If
    identify-lowercase-letters has not been taught yet,
    this package should defer; pre-K and early-K students
    can do uppercase formation work without lowercase
    recognition prerequisite, but the lowercase formation
    work specifically depends on lowercase recognition.

    Per §A.13.30 K-foundational-informal framing: K-1
    lowercase handwriting is RECOGNIZABLE LOWERCASE LETTER
    FORMATION, not formal stroke-order memorization or
    precise calligraphy. The vocabulary-tracing-strips
    material's dotted-line templates guide kids through
    canonical lowercase letter forms; the independent-
    writing line lets kids attempt formation without
    scaffolding. Zone-awareness (ascender/descender/
    x-height) is introduced informally via the dotted-
    line templates that show the zones visually — kids
    don't need to memorize zone vocabulary, but their
    formation work IS guided by the zone-structure
    embedded in the template. Both teacher and parent can
    use whichever stroke-order pedagogy their curriculum
    prefers — this package teaches the OUTCOME
    (recognizable lowercase letter shapes) without
    prescribing one PROCESS. K-1 kids physically struggle
    with precise calligraphy; the goal at this age is the
    motor-routine fluency.

    Distinctive composition: 1 matching (intro — lowercase
    letter-recognition anchor) + 1 chart-count (lowercase
    alphabet sequence work) + 1 math-puzzle (lowercase
    letter-form fill-in) + 1 matching (letter-mode at
    consolidation) + 1 missing-pieces (assessment —
    complete the partial lowercase letter form). Same
    composition shape as Arc 17 P1.5 form-uppercase-
    letters; content adjusted for lowercase scope (all
    customizationParameters use lowercase labelCase
    throughout; matching + math-puzzle + missing-pieces
    work surfaces lowercase letter-form completion at
    positions 3 + 5).

    Materials note: 8-material Literacy class stack per
    §A.13.37 (Literacy 8 vs Numeracy 7). Adds sentence-
    strips (position 4; framePreset 'i-see-a' for letter-
    in-context anchoring — kids see 'I see a [letter-
    word]' sentences that contextualize the lowercase
    letter formation work) on top of the canonical 7-
    material literacy-tracing stack. Mirrors form-
    uppercase-letters precedent on materials-list shape
    exactly; differs in labelCase parameter (lowercase
    throughout instead of UPPERCASE). Vocabulary-tracing-
    strips at position 5 with pedagogicalRole 'handwriting-
    formation' is the load-bearing material — the dotted-
    template + independent-line shape is the literal
    handwriting-pedagogy substrate, now in lowercase form.
    Manipulative-cut-outs at position 6 emits
    `mode: single-repeat` with itemCount 26 — mirrors
    form-uppercase-letters precedent shape verbatim (26
    letter-shape cut-outs for kinesthetic letter-
    formation support, now in lowercase form).

    Class B FLEXIBLE substrate: composes against animals
    theme (literacy-class precedent per identify-
    uppercase-letters + identify-letter-sounds-vowels +
    form-uppercase-letters; vocab-anchored animal-names
    per letter — a-antelope, b-bear, c-cat, d-dog, ...
    z-zebra — provide the familiar vocabulary anchor in
    lowercase form for this package).

    K-3 multilingual classroom relevance: lowercase letter
    formation is target-language-specific same as
    uppercase. en lowercase alphabet has 26 letters;
    cross-locale lowercase inventories vary: de has 30
    (adds äöüß); es has 27 (adds ñ); fr/it/pt have 26
    (with diacritical marks on some letters); fi has 29
    (adds åäö); sv has 29 (adds åäö); da/no have 29 (adds
    æøå); nl has 26 (with ij as digraph). The motor-
    routine for lowercase letter formation is locale-
    portable; the LETTER INVENTORY varies — and several
    locale-specific lowercase letters have additional
    motor demands (German ß requires a unique stroke;
    Nordic æøå include compound + accented forms; Spanish
    ñ requires tilde-over-n work). The zone-structure
    (ascender / x-height / descender) is locale-portable;
    most Latin-alphabet languages share the canonical
    zone-positions per letter. Locale-variant work at
    Phase 3+ adapts to each locale's extended lowercase
    letter set + diacritical-mark handling. For the first
    locale-variant pass per Arc 18 P1.1 cadence, pt uses
    the standard 26-letter inventory (Brazilian
    Portuguese does not include accent-bearing letters as
    separate alphabet entries; accents are applied to
    vowels at spelling-not-formation time per established
    Arc 17 P1.5 form-uppercase-letters convention).

