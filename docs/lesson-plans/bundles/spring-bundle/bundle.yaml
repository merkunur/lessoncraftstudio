thematicCoherence:
  en: |
    All 5 packages cohere around the spring season theme + form a
    cross-strand bundle following the seasonal-bundle template
    established at winter-bundle (Pillar 2 Arc 3 Phase 2) +
    extended at summer-bundle (Pillar 2 Arc 4 Phase 1). Spring-
    bundle completes the trilogy with same 5-package composition.

    **Pedagogical sequencing:**
    1. **identify-four-seasons** — Seasonal classification anchor.
       Spring as one of 4 seasons; visual-vocabulary establishment
       (flowers, new leaves, light clothing). Same shared package
       across clothing + weather + winter + summer + spring bundles.
    2. **identify-and-name-weather-words** — Weather vocabulary
       (rain, sun, breezy, mild, warming). Connects season to
       observable weather. Spring particularly variable-weather.
       Same shared package across weather + winter + summer +
       spring bundles.
    3. **identify-weather-types** — Weather classification
       extending vocabulary to broader weather-type recognition
       (sunny / cloudy / rainy / breezy). Spring offers all 4
       types in single week. Same shared package across weather
       + winter + summer + spring.
    4. **identify-and-name-clothing** — Spring clothing vocabulary
       (light jacket, sneakers, sun hat, umbrella). Transition
       wardrobe between winter + summer. Same shared package
       across clothing + winter + summer + spring.
    5. **describe-day-night-cycle** — Cycle science: spring brings
       increasing daylight + decreasing night. Transition from
       winter's short days toward summer's long days. Same shared
       package across winter + summer + spring.

    **Strand spread:** 2 vocabulary-acquisition (clothing + weather)
    + 2 cognitive-sorting (seasons + weather-types) + 1 world-
    knowledge living-things (day-night cycle). **5 distinct strands
    in single bundle** — broadest cross-strand pattern per
    seasonal-template doctrine.

    **Suggested unit duration:** 5 weeks during spring-context
    classroom unit. Northern-hemisphere: March-May. Southern-
    hemisphere: September-November. Natural alignment with
    describe-plant-life-cycle + describe-butterfly-life-cycle work
    (spring is canonical life-cycle observation season).

    **Multilingual classroom relevance:** spring vocabulary
    varied across 11 platform locales — Romance distinct
    (primavera / printemps / primavera) + Germanic cognate
    (Frühling / lente / vår). Spring climate context varies by
    region; some 11-platform-locale audiences experience
    seasonless tropics (need adapted approach) vs mild-spring
    (Mediterranean) vs pronounced-spring (continental + Nordic).

    **Pillar 2 architectural pattern:** spring-bundle COMPLETES
    the seasonal-bundle trilogy (winter + summer + spring) at
    Pillar 2 Arc 4 Phase 2. Same 5-package fixed composition
    template parameterized by seasonal-anchor + theme-axis-key
    context. Demonstrates the seasonal-bundle template doctrine
    works robustly across multiple instantiations. Future autumn-
    bundle would complete the full 4-seasons set; CC pre-thinking
    suggests autumn-bundle is natural Pillar 2 Arc 5 Phase 1
    inclusion to complete the seasonal-template family.
