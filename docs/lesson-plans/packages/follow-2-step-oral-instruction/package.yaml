# Teaching package — follow a 2-step oral instruction
# Arc 14 Phase 4 (early-literacy / instruction-following +1 from Arc 11 baseline).
# Resolves Arc 11 follow-1-step-oral-instruction forward-pointer.

targetSlug: follow-2-step-oral-instruction
language: en
title:
  en: "2-Step Instructions — first do this, then do that"
description:
  en: "Kindergarten / Grade 1 early-literacy + executive-function package teaching kids to follow 2-step oral instructions in sequence. Builds directly on Arc 11 follow-1-step-oral-instruction foundation. RESOLVES Arc 11 follow-1-step-oral-instruction forward-pointer ('next we extend single-step instructions to 2-step + multi-step instructions'). Examples: 'Pick up the red crayon AND put it in the box' / 'First touch your nose, THEN clap your hands' / 'Draw a circle AFTER you draw a square'. Critical bridge from single-step receptive listening to multi-step executive-function work. Connects to Arc 14 Phase 2's sequence-3-event-story (narrative sequencing) — both packages exercise sequential thinking in different modalities. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + multi-step instruction modeling. Teacher
      demonstrates: "Watch me follow a 2-step instruction. The
      teacher says: 'Stand up AND raise your hands.' I STAND UP
      (does so), THEN I RAISE MY HANDS (does so). Two things in
      order. Now you try!" Teacher gives several 2-step instructions
      with strong vocabulary anchors (AND, FIRST, THEN, AFTER):
      "Touch your head AND clap your hands." "First sit down, then
      cross your arms." "Stand up after you wave hello." Visual +
      tactile anchor establishes the 2-step + connector-word pattern.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + listening routine. Each pair receives a worksheet
      with 6 picture prompts (kid drawing a square, kid coloring,
      kid putting blocks away, etc.). Pair takes turns: kid A
      receives a 2-step instruction from teacher ("Color the apple
      red AND draw a smiley face above it"); kid B watches to
      check correct sequence. Reverse roles. Teacher circulates
      with instruction-cards; recasts errors with re-narration
      ("you colored the apple but skipped the smiley face — let's
      remember: red apple FIRST, smiley face SECOND").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet
      sequencing 2-step actions in icons. Station 2: matching
      worksheet (2-step instruction phrase to picture sequence).
      Station 3: missing-pieces worksheet (2-step sequence with
      step 2 missing — which step is next?). Station 4: vocabulary-
      tracing-strips for connector words (and, first, then, after,
      before).
  closure:
    durationMinutes: 5
    body: |
      Whole-class 2-step quiz. Teacher gives 5 different 2-step
      instructions; class collectively follows each. "Touch your
      shoulder AND your knee." "First nod yes, then nod no."
      "Put a finger on your lip AFTER you smile." Forward-pointer:
      "Today we followed 2-step instructions. When we come back
      next, we can try 3-step instructions — 'First do X, then
      do Y, then do Z' — for kids who are ready!"

