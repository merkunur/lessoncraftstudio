assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 8 of 10 extended weather types in 8 of 10 trials.
      - Use weather-type frame ('It is partly-cloudy / windy / foggy')
        in 7 of 10 productive-language attempts.
      - Distinguish similar weather types (light-rain vs storm; foggy
        vs misty) in 6 of 10 trials.

    Differentiation:
    - Pre-K: basic 4 weather types only (sunny, rainy, cloudy, snowy);
      receptive identification.
    - K: 8 weather types including extended; productive frame.
    - Grade 1+: extend to multi-attribute weather descriptions
      ('partly-cloudy AND windy'); bridge to weather-cycle work
      (describe-water-cycle-basic Arc 12+ candidate).

