  <!-- TOOL #58 - THE QUEUE (Counting & Cardinality). A line of countable
       friends; a coral hand sweeps from a CHOSEN end and each friend it
       passes wears its running-count numeral (1,2,3,4). The last number is
       HOW MANY. Count the same line from the OTHER end: each friend wears a
       different number, but the total is identical - cardinality is
       invariant, position is not (CCSS K.CC.B.4b, order-of-count). The odd
       middle wears the same number both ways. NO WORDS on the apparatus,
       only numerals; there is NO default end, and that absence is the
       thesis. Rebuilt 2026-08-16. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/the-queue.js?v=2"></script>
  <script>
    LCS.mount(TheQueue, { mount: '#lcs-root' });
  </script>
