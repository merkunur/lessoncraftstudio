# Teaching package — identify the four seasons (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 10 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# pt sparse-override for world-knowledge / environment-and-weather strand
# (FIRST environment-and-weather pt sparse-override). Pt-BR tropical
# climate context — adapted for Brazilian regional climate variation
# rather than universal-4-seasons framing. BR Portuguese register per
# CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "As Quatro Estações — primavera, verão, outono, inverno"
description:
  pt: "Pacote de conhecimento de mundo para o jardim de infância / 1º ano que ensina as quatro estações. PRIMEIRO sparse-override pt do fio de meio-ambiente-e-tempo. As crianças identificam cada estação + nomeiam características distintivas. Especificidade pt-BR: o Brasil tem 4 estações oficialmente, mas a experiência regional varia significativamente — Sul tem estações distintas (verão quente, inverno frio com geada/neve em algumas serras); Sudeste tem estações moderadas; Norte/Nordeste/Centro-Oeste têm tipicamente apenas duas estações funcionais (estação chuvosa + estação seca). O pacote em pt-BR adapta para enquadramento regional brasileiro além do enquadramento universal-4-estações."

structure:
  warmup:
    body: |
      Rotina de introdução de estação com toda a turma. A professora
      ou o professor exibe 4 imagens grandes mostrando cenas
      características de estação adaptadas para o contexto regional
      brasileiro (primavera com flores brotando — comum no Sul;
      verão tropical com sol forte + praia ou cachoeira; outono com
      folhas caindo — visível no Sul; inverno com casaco + cobertor
      — visível no Sul-Sudeste). "O que você vê em cada imagem? Que
      estação é cada uma?" A turma identifica. A professora ou o
      professor escreve nomes das estações abaixo de cada imagem.
      Reforça o mapeamento pista-visual-para-estação.

      **Adaptação regional:** se a turma é de uma região onde o
      enquadramento de 4 estações distintas não corresponde à
      experiência das crianças (por exemplo, Norte/Nordeste), a
      professora ou o professor pode reenquadrar como "Estação
      chuvosa vs estação seca + variação no Sul do Brasil onde
      experimentamos 4 estações distintas."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de classificação por estação. Cada
      dupla recebe 12-16 cartões de imagem mostrando itens sazonais
      adaptados para o Brasil (guarda-chuva para estação chuvosa,
      sorvete + biquíni para verão, casaco + cobertor para inverno
      sulista, frutas de estação como manga + abacaxi para verão,
      pêssego + uva para outono no Sul). A dupla classifica cartões
      em 4 pilhas de estação + nomeia cada pilha. Refraseie os erros
      com explicação ("você colocou o guarda-chuva no verão — vamos
      pensar: guarda-chuvas nos protegem da chuva. Qual estação tem
      mais chuva no Brasil? Em algumas regiões é a primavera + verão;
      em outras é a estação chuvosa! Adapte conforme sua região").
      Extensão opcional: as crianças descrevem sua estação favorita
      + 2-3 razões pelas quais.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios de
      emparelhamento (nomes de estações para pares de imagem
      característica). Estação 2: folha de exercícios picture-sort
      (as crianças classificam itens sazonais em 2 estações por vez,
      por exemplo, verão vs inverno). Estação 3: construção prática
      de cena de estação com recortes manipulativos (as crianças
      montam cenas sazonais a partir de recortes). Estação 4: word-
      guess (as crianças preenchem vocabulário relacionado a estação
      a partir de pistas com imagens).
  closure:
    body: |
      Compartilhamento de estação com toda a turma. Cada criança nomeia
      sua estação favorita + uma razão. A professora ou o professor
      cria um gráfico de favoritos da turma. Indicador adiante: "Hoje
      aprendemos sobre as quatro estações. Quando voltarmos ao
      trabalho de meio-ambiente na próxima vez, exploraremos o ciclo
      DIA-NOITE — o que acontece durante o dia e a noite, e por que
      temos os dois."

assessmentCriteria:
  pt: |
    Nomear todas as 4 estações na ordem cíclica correta (primavera →
    verão → outono → inverno → primavera) em 8 de 10 tentativas.
    Classificar 12 itens sazonais em 4 pilhas de estação corretamente
    em 7 de 10 tentativas. Articular uma característica de cada
    estação ('o verão é quente'; 'no inverno usamos casaco') em 7
    de 10 tentativas.

    Diferenciação:
      - Pré-K: 2 estações contrastantes (verão vs inverno); apenas
        identificação receptiva.
      - K: todas as 4 estações; classificar + nomear com apoio de
        imagem.
      - Primeiro ano em diante: estender para mapeamento mês-para-
        estação (março-maio = outono no Brasil, etc.) + ponte para
        trabalho de ciclo do tempo (describe-water-cycle-basic
        candidato Arco 11+).

    **Diferenciação regional brasileira:** crianças em regiões com 2
    estações funcionais (Norte/Nordeste/Centro-Oeste) podem aprender
    o enquadramento universal de 4 estações como conhecimento
    geográfico mais amplo, mesmo sem experimentar todas as 4
    diretamente. Crianças em regiões com 4 estações distintas
    (Sul/Sudeste em altitude) aprendem com experiência direta.

compositionalRationale:
  pt: |
    Fio principal: conhecimento de mundo / meio-ambiente-e-tempo
    (reconhecimento das quatro estações). Fio secundário: aquisição
    de vocabulário (ancorado em vocabulário — nomes de estações +
    vocabulário de característica de estação). Fio terciário:
    classificação + classificação (as crianças classificam itens
    sazonais por estação — fio cognitivo de classificação dos Arcos
    5+7+8 aplicado ao contexto sazonal).

    Significância arquitetural: PRIMEIRO sparse-override pt do fio
    de meio-ambiente-e-tempo. Abre o fio para pacotes adicionais:
    identify-weather-types, describe-day-night-cycle, describe-water-
    cycle-basic.

    Especificidade cultural pt-BR: experiência sazonal brasileira
    varia significativamente por região. O pacote em pt-BR adapta
    para esta variação:
    - **Sul (RS/SC/PR):** 4 estações distintas com inverno frio,
      neve em algumas serras (SC), folhas de outono coloridas;
      experiência mais próxima do enquadramento de 4 estações
      universais.
    - **Sudeste (SP/RJ/MG/ES):** 4 estações moderadas; inverno
      ameno, sem neve ao nível do mar; pode ter geada em altitude
      (Serra da Mantiqueira).
    - **Norte/Nordeste/Centro-Oeste:** 2 estações funcionais
      (chuvosa + seca); 4 estações são conceito acadêmico mais que
      experiencial.

    O pacote pt-BR pode adaptar exemplos para o contexto regional
    da turma — crianças no Sul aprendem sobre as 4 estações com
    experiência direta; crianças no Nordeste aprendem sobre as 4
    estações como conhecimento geográfico (ainda relevante para
    educação de mundo + para conexão com locales onde 4 estações
    são experimentadas).

    Vocabulário pt-BR canônico de estação: primavera (com flores
    novas + ipê florido — ipê amarelo é icônico brasileiro);
    verão (com chuva forte + carnaval); outono (folhas + colheita
    de café no Sul); inverno (com cobertor + chocolate quente; no
    Sul: casaco grosso). Vocabulário cognato-rico com pt-PT, mas
    contexto cultural pt-BR-específico.

    Substrato Class B FLEXIBLE: composta contra a amplitude da
    biblioteca de imagens. Substrato-prontidão universal através
    de temas com itens sazonais característicos.
