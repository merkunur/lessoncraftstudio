# Teaching package — predict from picture cue
# Arc 13 Phase 2 (Option G CONTINUATION; reading-comprehension 1/10 → 2/10).
# Builds on Arc 12 match-sentence-to-picture.

targetSlug: predict-from-picture-cue
language: en
title:
  en: "Predict the Story — what will happen next?"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching prediction from picture cues. Builds on Arc 12 match-sentence-to-picture. Kids look at picture sequences (or single ambiguous pictures) + predict what happens next using context clues. Foundational comprehension strategy: prediction activates inference + builds engagement with text. Vocab-anchored — kids name what they see + what they predict. 5 exercises + 7 materials over 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class predict-the-next routine. Teacher displays a 3-
      picture sequence: kid holding ice cream / kid tripping / [?].
      'What happens next?' Class predicts (ice cream falls). 'How
      do you know?' Discussion: kids reason from picture cues. Repeat
      with 4-5 prediction sequences. Reinforces inference-from-cues
      framing.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + predict-and-explain routine. Each pair receives 6
      picture-prediction prompts. Pair takes turns: kid A shows a
      prompt; kid B predicts what happens + explains reasoning. Recast
      errors with explanation ('you predicted the dog will fly — let's
      look: dogs don't fly. What CAN the dog do that makes sense?').
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (cause-effect
      picture pairs). Station 2: matching worksheet (image-name).
      Station 3: manipulative cut-outs hands-on prediction-construction.
      Station 4: word-guess + sentence-strips.
  closure:
    durationMinutes: 5
    body: |
      Whole-class predict-aloud. Teacher displays a final picture; class
      collectively predicts + explains. Forward-pointer: 'Today we
      predicted from pictures. When we come back to comprehension next,
      we will SEQUENCE 3-event stories — putting beginning + middle +
      end in order.'

