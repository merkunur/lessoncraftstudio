compositionalRationale:
  en: |
    Primary strand: early-numeracy / measurement (length comparison).
    Secondary strand: vocabulary acquisition (vocab-anchored —
    comparative vocabulary longer / shorter / same length is a high-
    frequency K-3 target). Tertiary strand: visual-discrimination +
    spatial-reasoning (kids visually compare object lengths — same
    cognitive substrate as big-small / size-comparison work).

    Architectural significance: FIRST measurement strand package in
    the catalog. Pre-formal-measurement work establishes the
    comparison-reasoning foundation that formal measurement (rulers +
    numerical units) builds on. Length-comparison is the canonical
    K-3 starting point — kids master length comparison before weight
    and capacity (which require less-direct comparison strategies).

    Distinctive composition: 2 big-small exercises (positions 1 + 3) +
    2 matching exercises (positions 2 + 4) + 1 odd-one-out at position
    5. big-small app is the closest existing surface for length-
    comparison work — its core mechanic (identify bigger/smaller) maps
    naturally to longer/shorter framing. Substitution from "size" to
    "length" is operator-strategic at composition time — same app
    surface, different vocabulary frame.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Length comparisons work with ANY 2 objects of distinct length;
    substrate-readiness universal across themes that have meaningful
    length-variation (animals: snake vs worm; vehicles: bus vs car;
    fruits: banana vs grape).

    K-3 multilingual classroom relevance: comparative grammar
    structures ('longer than' / 'shorter than' / 'as long as') are
    mid-frequency K-3 grammatical targets across all 11 platform
    locales. Kids in target-language-immersion contexts often acquire
    base vocabulary before comparative grammar; this package surfaces
    comparative grammar as an explicit pedagogical target. Productive-
    language frames ("the X is longer than the Y") give structured
    grammatical practice.

