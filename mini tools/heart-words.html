<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Heart Words — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=18">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. Absolute /mini-tools/ paths so embeds +
       cross-context loads resolve identically. The tool fetches its word
       bank from /mini-tools/heart-words-<lang>.json at runtime.
       Heart Words ships in TEN locales — there is no Finnish bank. -->
  <script src="/mini-tools/lcs-shell.js?v=3"></script>
  <script src="/mini-tools/heart-words.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=sv  ?lang=de  (any of: en de fr it es pt nl sv da no)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    // Tool-specific deep links: ?shelf=<shelfId>&word=<wordId>&ring=1
    //   A deep link to a PREMIUM shelf is HELD until entitlement resolves
    //   and then discarded for free visitors — premium words never reach
    //   the DOM, so no premium content can leak through a shared URL.
    LCS.mount(HeartWords, { mount: '#lcs-root' });
  </script>
</body>
</html>
