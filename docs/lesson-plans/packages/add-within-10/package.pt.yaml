# Teaching package — add within 10 (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 11 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# pt sparse-override for early-numeracy / addition-subtraction strand
# (FIRST addition-subtraction pt sparse-override). BR Portuguese register
# per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Somando até 10 — somas até 10"
description:
  pt: "Pacote de matemática inicial para o jardim de infância / 1º ano que ensina adição com somas até 10. PRIMEIRO sparse-override pt do fio de adição-subtração. As crianças estendem estratégias de adição para uma faixa mais ampla de somas. Habilidade aritmética fundamental que conecta contagem (Arcos 1+3+8+9) à adição formal. As crianças aprendem a estratégia 'contar a partir de' (começar com o número maior, contar para cima pelo menor) + uso de dedos + modelos parte-todo. Ancorado em vocabulário — vocabulário pt-BR de adição (mais, somar, igual, total)."

structure:
  warmup:
    body: |
      Rotina de fato-de-adição com toda a turma. A professora ou o
      professor diz: "Eu tenho 3 maçãs e mais 2 maçãs. Quantas no
      total?" A turma conta: 1, 2, 3 + 1, 2 = 5. Repita com somas
      até 10: "4 e 3," "5 e 5," "6 e 2." Reforça a estratégia
      CONTAR-A-PARTIR-DE — as crianças começam com o grupo maior +
      contam para cima pelo menor. A professora ou o professor
      escreve sentenças de adição (3 + 2 = 5) no quadro para conectar
      contagem concreta à notação simbólica.
  contentActivity:
    body: |
      Trabalho em duplas + rotina de adição com manipulativos. Cada
      dupla recebe objetos recortados + um modelo de quadro-de-10.
      A dupla joga jogos de adição: a criança A coloca 4 objetos
      no quadro; a criança B adiciona mais 3; juntas contam para
      encontrar a soma (7). Refraseie os erros com explicação ("você
      disse que 4 + 3 = 6 — vamos contar: 1, 2, 3, 4 + 1, 2, 3 —
      isso é 7, não 6. Use a estratégia CONTAR-A-PARTIR-DE: comece
      em 4, conte 3 PARA CIMA — 5, 6, 7"). Extensão opcional: as
      crianças constroem suas próprias histórias de números de adição
      usando seus objetos recortados.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios math-
      worksheet (as crianças resolvem problemas com somas até 10).
      Estação 2: math-puzzle (peças de quebra-cabeça com somas até
      10). Estação 3: adição prática com recortes manipulativos (as
      crianças combinam 2 grupos + contam totais; reforça a base
      concreta). Estação 4: folha de exercícios de emparelhamento
      (emparelhamento de número para quantidade).
  closure:
    body: |
      Rotina de quiz-de-adição com toda a turma. A professora ou o
      professor exibe problemas de adição com somas até 10; a turma
      responde em coro. Indicador adiante: "Hoje somamos até 10.
      Quando voltarmos a adição na próxima vez, somaremos até 20 —
      somas maiores usando a mesma estratégia de contar-a-partir-de."

assessmentCriteria:
  pt: |
    Resolver problemas de adição com somas até 10 em 8 de 10
    tentativas. Usar a estratégia contar-a-partir-de (começar com o
    maior; contar para cima pelo menor) em 7 de 10 tentativas.
    Articular sentenças de adição ('3 mais 2 igual a 5') em 7 de 10
    tentativas de linguagem produtiva.

    Diferenciação:
      - Pré-K: somas até 5 apenas (pré-requisito Arco 1 add-within-5);
        manipulativos concretos requeridos.
      - K: somas até 10; manipulativo + notação simbólica.
      - Primeiro ano em diante: estender para add-within-20 (candidato
        Arco 12+); ponte para matemática mental de adição.

compositionalRationale:
  pt: |
    Fio principal: matemática inicial / adição-subtração (somas até
    10). Fio secundário: contagem-e-cardinalidade (a estratégia
    contar-a-partir-de constrói sobre fluência em contagem). Fio
    terciário: senso-numérico (raciocínio parte-todo).

    Significância arquitetural: aprofunda o fio de adição-subtração
    de 1/14 → 2/14 pacotes. PRIMEIRO sparse-override pt do fio.
    Constrói sobre Arco 1 add-within-5. Conecta contagem (Arcos 1+3+
    8+9) à adição formal com notação simbólica (3 + 2 = 5).

    Especificidade pt-BR: vocabulário de adição pt-BR canônico —
    'mais' (plus), 'somar' (add), 'igual a' (equals), 'total' (total),
    'juntos' (together). Cognato-rico com es: somar = sumar; total =
    total. Cross-locale Romance: gramática + número similar; números
    pt-BR (um, dois, três... dez) cognato-rico com es e it.

    A estratégia 'contar-a-partir-de' é universal cognitivamente; a
    verbalização varia por locale ('começar em 4, contar para cima:
    5, 6, 7' em pt-BR vs 'start at 4, count up: 5, 6, 7' em en).

    Substrato Class B FLEXIBLE: composta contra a amplitude da
    biblioteca de imagens + numerais 1-10. Substrato-prontidão
    universal através de temas contáveis.
