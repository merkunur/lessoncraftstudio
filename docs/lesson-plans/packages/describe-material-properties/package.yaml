assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Describe 1-2 properties of 6 common materials from the
        canonical 6-vocabulary set (wood, plastic, metal, paper,
        fabric, glass) using the 8-property vocabulary correctly
        in 7 of 10 trials.
      - Identify the matching property pair (HARD-SOFT, SMOOTH-
        ROUGH, FLEXIBLE-RIGID, TRANSPARENT-OPAQUE) for a given
        property word in 6 of 10 attempts.
      - Sort 12 mixed-property object cards into 4 binary
        property-pair bins correctly in 5 of 10 attempts.
      - Reason about material-use ("Why is the window glass?
        Because glass is TRANSPARENT.") in 5 of 8 prompts.
      - Use vocabulary 'property' / 'hard' / 'soft' / 'smooth' /
        'rough' / 'flexible' / 'rigid' / 'transparent' / 'opaque'
        correctly in 5 of 10 productive-language trials.

    Differentiation:
    - Pre-K: skip property description; review identify-common-
      materials (Arc 18 Phase 1.3) for material identification
      foundation first.
    - K: 4 property pairs (hard/soft, smooth/rough, flexible/
      rigid, transparent/opaque) with 1-property-per-object
      naming; teacher-led property-comparison routines.
    - Grade 1: extend to multi-property descriptions ("The glass
      marble is HARD AND SMOOTH AND TRANSPARENT — three
      properties!"); introduce material-PROPERTY-USE reasoning
      ("Why is X used for Y?"); bridge to materials-and-
      engineering thinking.
    - Grade 2+: full NGSS 2-PS1-1 material-property
      investigation work (design experiments to test material
      properties: float-vs-sink, magnetic-vs-not, transparent-
      vs-opaque, water-absorbing-vs-water-resistant); bridge to
      materials-engineering (which materials to use for which
      jobs; the canonical Grade 3+ engineering-design strand
      that depends on this property-vocabulary foundation).

