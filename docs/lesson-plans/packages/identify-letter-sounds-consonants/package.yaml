assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Produce sounds for 18 of 21 consonant letters in 8 of 10 trials.
      - Match consonant sound to picture starting with that sound in 7
        of 10 trials.
      - Identify initial consonant sound of NEW unfamiliar word in 6 of
        10 trials.

    Differentiation:
    - Pre-K: 8 most-frequent consonants (B, D, F, M, P, S, T, K).
    - K: all 21 consonants.
    - Grade 1+: extend to identify-letter-sounds-vowels (Arc 14+
      candidate) + bridge to consonant-blend phonics work.

