compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition. Secondary strand: phonics
    (matching letter mode). Tertiary strand: sorting + categorization
    (size attribute sort + animal-pattern attribute sort).

    Cultural-variation acknowledgment (Arc 4 Phase 1 spec discipline): the
    "zoo" institution is a Western convention. Some cultures may not have
    physical zoos, or may have differently-organized wildlife institutions
    (e.g., wildlife sanctuaries, national parks). The package focuses on
    visual recognition of iconic species kids encounter in books, films, and
    online media regardless of zoo-availability. Equally valid framing as
    "wild animals you might see in a documentary" or "famous animals from
    around the world". The 10 chosen species span major continents (Africa:
    lion/tiger/elephant/giraffe/zebra/monkey; Asia: panda; Australia:
    kangaroo/koala; Antarctica: penguin) — gives kids an implicit world-map
    via the cohort.

    Sentence-strips frame variant for week 2: this-is-a ("This is a lion")
    grows naturally from i-see-a (week 1) toward declarative description.
    Both extend to color/size/feature description in Grade 1+ ("This is a
    big lion / The lion has a mane").

curriculumStandards:
  - EYFS.ELG.UW
  - IB-PYP.SharingPlanet

assessmentCriteria:
  en: |
    Receptive 10/10; productive 8/10; frame use 6/10.

    Differentiation:
    - Pre-K: receptive only (point-to-named-zoo-animal).
    - K / Grade 1: full productive + sentence-frame use.
    - Grade 2+: extend to habitat-pairing ("the lion lives in the savanna /
      the penguin lives in the cold Antarctic") + animal-feature description
      ("the giraffe has a long neck") + simple compare-contrast ("which is
      bigger, the elephant or the kangaroo?").

