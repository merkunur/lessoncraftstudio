assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Respond appropriately to 6 of 6 common spoken greetings
        (hello / hi / good morning / good afternoon / goodbye /
        see you tomorrow) in 8 of 10 trials.
      - Initiate a greeting appropriately to time of day or context
        in 7 of 10 opportunities (morning arrival; afternoon
        snack; end-of-day farewell).
      - Distinguish greeting from non-greeting utterance in target
        language in 8 of 10 trials (recognize 'hello' as a
        greeting even when surrounded by other unfamiliar
        target-language words).

    Differentiation:
    - Pre-K (ages 3-5): 3 most-frequent greetings only (hello /
      goodbye / good morning); receptive comprehension priority
      over productive response.
    - Kindergarten (ages 5-7): full 6 greetings; productive response
      independently.
    - Grade 1+: extend to varied register (formal vs informal
      greetings; appropriate greeting choice by context: a
      teacher vs a peer); bridge to ask-and-answer-yes-no-questions.

