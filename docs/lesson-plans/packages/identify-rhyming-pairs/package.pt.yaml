# Teaching package — identify rhyming word pairs (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 10 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# pt sparse-override for early-literacy / phonological-awareness strand
# (FIRST phonological-awareness pt sparse-override). Pt-BR rhyme patterns
# distinct from en — particularly -ão and -inho families. BR Portuguese
# register per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Pares que Rimam — palavras com o mesmo som no fim"
description:
  pt: "Pacote de letramento inicial para o jardim de infância / 1º ano que ensina o reconhecimento de rimas. PRIMEIRO sparse-override pt do fio de consciência fonológica. Habilidade fundamental pré-leitura: as crianças identificam quais pares de palavras rimam (gato-rato, sol-anzol, mão-coração) vs não rimam (gato-cachorro, sol-árvore). A consciência fonológica é a ponte crítica entre a linguagem oral + a leitura: as crianças que conseguem ouvir padrões de rima adquirem a leitura mais facilmente. Especificidade pt-BR: padrões de rima pt-BR usam famílias distintas — -ão (mão, coração, balão, leão), -inho (passarinho, bonequinho, ratinho), -ada (chamada, parada). Estes padrões são canonicamente brasileiros + culturalmente ricos (folclore + canções infantis brasileiras)."

structure:
  warmup:
    body: |
      Rotina de escuta-de-rima com toda a turma. A professora ou o
      professor lê pares de palavras em voz alta: "Gato... Rato. Estes
      sons são iguais no fim?" A turma identifica: "Sim — eles rimam!"
      Repita com: "Gato... Cachorro. Som igual no fim?" A turma:
      "Não." Reforça a percepção de rima pelo ouvido. A professora
      ou o professor introduz: "Quando duas palavras têm o mesmo som
      no fim, dizemos que elas RIMAM." Repita com 4-5 pares
      brasileiros: "Mão... Coração... Balão... Leão" — todos rimam
      em -ão. "Passarinho... Bonequinho... Ratinho" — todos rimam
      em -inho.
  contentActivity:
    body: |
      Trabalho em duplas + rotina de rima-e-emparelhamento. Cada dupla
      recebe 8-10 cartões de imagem + um quadro com uma palavra-
      modelo. A dupla encontra imagens cujos nomes rimam com a
      palavra-modelo. Refraseie os erros com explicação ("você disse
      que JANELA rima com GATO — vamos dizer devagar: 'gato' termina
      em -ato; 'janela' termina em -ela. Sons de fim diferentes — não
      rimam. Agora encontre uma imagem que termina em -ato: rato? pato?
      sapato?"). Use famílias pt-BR canônicas: família -ão (mão,
      coração, balão, irmão, chão, pão); família -inho (passarinho,
      bonequinho, ratinho, gatinho); família -ado (chamado, parado,
      cantado). Extensão opcional: as crianças geram seus próprios
      pares de rimas a partir do conhecimento de vocabulário pt-BR.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios de
      emparelhamento (pares que rimam; as crianças combinam imagens
      cujos nomes rimam). Estação 2: word-scramble (as crianças
      desembaralham palavras de rima; reforça ortografia de padrões
      de rima). Estação 3: construção prática de rimas com recortes
      manipulativos (as crianças classificam imagens em grupos de
      rima por som final). Estação 4: word-guess (as crianças
      preenchem palavras de rima a partir de pistas com imagens).
  closure:
    body: |
      Compartilhamento de rimas com toda a turma. A professora ou o
      professor dá uma palavra inicial; a turma gera tantas palavras
      que rimam quanto puderem em coro. Exemplo: "Mão" → "coração,
      balão, leão, irmão, chão, pão" (todos -ão). Indicador adiante:
      "Hoje notamos palavras que RIMAM no fim. Quando voltarmos ao
      trabalho de som-e-letra na próxima vez, aprenderemos sobre as
      SÍLABAS — as BATIDAS nas palavras — contando quantas batidas
      tem em gato (2: ga-to), banana (3: ba-na-na), passarinho
      (4: pa-ssa-ri-nho)."

assessmentCriteria:
  pt: |
    Identificar se 2 palavras faladas rimam em 8 de 10 tentativas.
    Gerar 1-2 palavras que rimam para uma palavra inicial dada em 7
    de 10 tentativas. Combinar imagens cujos nomes rimam em 8 de 10
    tarefas de emparelhamento.

    Diferenciação:
      - Pré-K: 3-4 pares de rima fortes com apoio de imagem (gato-rato,
        mão-irmão, passarinho-ratinho, balão-leão); apenas
        identificação receptiva.
      - K: 6-8 pares de rima através de múltiplas famílias de padrão
        (-ão, -inho, -ado, -ela); geração produtiva.
      - Primeiro ano em diante: estender para count-syllables
        (candidato Arco 11+) + blend-onset-rime + isolate-initial-
        phoneme; ponte para decodificação fonética formal (read-cvc-
        words).

compositionalRationale:
  pt: |
    Fio principal: letramento inicial / consciência fonológica
    (reconhecimento de rima). Fio secundário: aquisição de vocabulário
    (ancorado em vocabulário — trabalho de rima usa vocabulário
    familiar como entrada). Fio terciário: discriminação auditiva (as
    crianças distinguem sons de fim pelo ouvido).

    Significância arquitetural: PRIMEIRO sparse-override pt do fio de
    consciência fonológica. A consciência fonológica é a ponte
    canônica pré-leitura — pesquisa-validada como o preditor mais
    forte do sucesso precoce em leitura (Cunningham + Stanovich;
    Painel Nacional de Leitura). Estabelecer o substrato de
    reconhecimento de rima abre o fio para pacotes adicionais:
    count-syllables-1-to-3, blend-onset-rime, isolate-initial-phoneme
    (8 alvos não autorados restantes em learning-targets.json).

    Especificidade pt-BR: padrões de rima pt-BR são culturalmente
    ricos. Famílias canônicas:
    - -ão: mão, coração, balão, leão, irmão, chão, pão, avião — uma
      das famílias de rima mais produtivas em pt-BR; aparece em
      muitas canções infantis brasileiras ("Atirei o pau no gato"
      tem o final -ão em "leão" indireto)
    - -inho/-inha: passarinho, bonequinho, ratinho, gatinho, casinha,
      menininha — diminutivo é estrutura morfológica pt-BR canônica;
      crianças encontram diminutivos diariamente
    - -ado/-ada: chamado, parado, sentado, cantada, parada
    - -ela/-elo: janela, panela, modelo, anel
    - -ar (verbal -ar infinitivos): andar, falar, voar — útil para
      pacotes futuros conectando à conjugação verbal

    Folclore + canções infantis pt-BR são profundamente baseados em
    rima: "Marcha Soldado," "Atirei o Pau no Gato," "Borboletinha,"
    "Sapo Cururu" — todos têm padrões de rima previsíveis que as
    crianças brasileiras absorvem antes de irem à escola.

    Substrato Class B FLEXIBLE: composta contra a amplitude da
    biblioteca de imagens. O trabalho de rima precisa de amplitude
    de vocabulário; prontidão de substrato universal através de
    temas com diversidade significativa de conjunto-de-palavras.
