<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mochi's Counting Feast — Activity — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
  <!-- Activity-page parent forces the iframe height; make body transparent +
       cascade height:100% to #lcs-root. Engine CSS is injected by
       mochi-feast-core.js at runtime (those rules already use !important
       per §A.13.47 rule 6). -->
  <style>
    html, body { background: transparent !important; }
    html, body, #lcs-root { height: 100% !important; }
  </style>
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then the feast core, then this activity wrapper.
       NOTE: bump ?v=N on EVERY change to mochi-feast-core.js or
       mochi-feast-activity.js (§A.13.42 cache-buster discipline). -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/mochi-feast-core.js?v=4"></script>
  <script src="/mini-tools/mochi-feast-activity.js?v=10"></script>
  <script>
    LCS.mount(MochiFeastActivity, { mount: '#lcs-root' });
  </script>
</body>
</html>
