compositionalRationale:
  en: |
    Primary strand: early-literacy / phonological-awareness
    (blend-phonemes-cvc — strand 6/9 → 7/9). Opens phoneme-
    synthesis work as the reverse-operation pair of the
    isolation cluster (Phase 1.1 Slot 3 + Phase 1.2 Slots 2+3).
    Pair-coherent prerequisite for Phase 1.3 candidate
    segment-cvc-into-phonemes (analysis-side; reverse-of-
    blending). Per §A.13.31 per-instance content-awareness:
    `isolate-initial-phoneme/package.yaml` (Phase 1.1 Slot 3)
    + `isolate-final-phoneme/package.yaml` (Phase 1.2 Slot 2)
    + `isolate-medial-phoneme/package.yaml` (Phase 1.2 Slot 3)
    are the canonical Literacy 8-material phonological-awareness
    precedents — this package mirrors their materials +
    composedExercises shape with synthesis-pedagogy adaptation.

    Architectural significance: OPENS phoneme-synthesis work +
    completes the Phase 1.2 phonological-awareness triad. The
    Phase 1.2 phonological-awareness triad (Slots 2+3+4)
    advances the strand 4/9 → 7/9 (77.8%), positioning Phase
    1.3 for strand SAT-closure with remaining 2 targets
    (blend-onset-rime + segment-cvc-into-phonemes). Cognitive
    progression: 3-position isolation (Phase 1.1+1.2 Slots 2+3
    pull words apart) → synthesis (this package puts sounds
    together) → segmentation (Phase 1.3 pulls words apart in
    full 3-phoneme decomposition). Synthesis is the canonical
    bridge from phonological-awareness to systematic phonics
    decoding: kids who can blend separated phonemes into a
    word are cognitively prepared to decode by sounding out
    each letter then blending the sounds.

    Per §A.13.30 K-1 informal framing: K blending work is
    CONCRETE SOUND-COMBINING via slow-to-fast progression.
    Teacher says phonemes slowly + speeds up + the word
    emerges. The pedagogy uses everyday language ('blend' /
    'put sounds together' / 'slide sounds together') + body-
    movement scaffolding (3 fingers for 3 phonemes then a clap
    when the word emerges). NOT formal phonological-encoding
    pedagogy — phonemic-encoding theory + grapheme-phoneme
    correspondence chart is Grade 1-2+ phonics work. Critical
    pedagogical move documented in contentActivity: SLOW-TO-
    FAST progression. Phonemes separated by ~1 second pause
    initially; speed up progressively until phonemes touch +
    the word emerges. Common error patterns are addressed via
    RE-MODELING rather than correction (blending is a
    cognitive integration skill strengthened by repetition).

    **Phonological-awareness pedagogy is LOCALE-SPECIFIC —
    blending pedagogy differs per locale's syllabic structure.**
    English CVC structure (consonant-vowel-consonant) is the
    canonical K-1 blending target; the 3-phoneme decomposition
    is structural. pt-BR has CV-syllable-dominant structure
    (most pt-BR words decompose into open CV syllables: ga-to
    = /ga/+/tu/ NOT /g/+/a/+/t/+/u/). pt-BR phonics is
    traditionally taught syllabically rather than phonemically
    per BR-MEC framework. This en package teaches English
    CVC phoneme-blending; pt variant per §A.13.34 sub-class
    requires syllabic-blending adaptation (SPARSE-OVERRIDE
    locked at this commission; FULL-OVERRIDE flagged as
    future-arc candidate because syllabic-vs-phonemic blending
    is structurally distinct pedagogy).

    Per §A.13.29 ground-truth source-citation: composedExercises
    cite `REFERENCE APPS/word-guess.html` (clue-density mode
    for fill-in-CVC-given-phoneme-cues bridging blending to
    decoding) + `REFERENCE APPS/matching.html` (imgname mode
    for separated-phoneme-cue to CVC-picture pairing) +
    `REFERENCE APPS/picture-sort.html` (theme mode for
    phoneme-aware categorization) + `REFERENCE APPS/word-
    scramble.html` (unified mode where scrambling-then-
    reassembly parallels blending pedagogy).

    Cross-reference to isolate-initial/final/medial-phoneme
    (prerequisites per learning-targets.json line 40): kids
    must master phoneme isolation BEFORE blending — they need
    to be able to identify the individual sounds before they
    can combine them. The skill progression is pedagogically
    natural: hear sounds in isolation → combine sounds into a
    word. This package operationalizes the synthesis step via
    explicit slow-to-fast blending technique.

    Cross-reference to read-cvc-words (Arc 6 P1 phonics-
    decoding strand-start): blending is the cognitive
    operation underlying CVC decoding. Kids see CAT printed,
    sound out /c/.../a/.../t/, blend the sounds, read 'cat'.
    Phonological-awareness blending (this package; oral-only)
    + read-cvc-words (phonics decoding; written CVC →
    sounded-out → blended) form the foundational decoding
    skill pair. read-cvc-words is the canonical 1st-target
    of the phonics-decoding strand; blend-phonemes-cvc is
    the canonical phonological-awareness precursor.

    **§A.13.34 parallel-strand-framing — phonological-
    awareness vs phonics-decoding:** blend-phonemes-cvc is a
    phonological-awareness strand canonical target (oral
    phoneme synthesis at /c/+/a/+/t/ → cat); it is NOT a
    phonics-decoding strand target (symbol-grapheme blending
    at written C+A+T → cat). The strand-boundary is the
    SYMBOL DIMENSION: phonological-awareness work operates
    on SPOKEN phonemes only (no printed letters or letter-
    sound correspondences); phonics-decoding work integrates
    written graphemes with spoken phonemes (kids see printed
    letters, recall the corresponding sounds, then blend).
    The two strands are adjacent in pedagogical sequencing
    + structurally overlapping at the blending operation
    itself — but they're distinct canonical strands per
    learning-targets.json enumeration. Same observable
    activity (combining sounds to form a word) routes
    through different strand pedagogy per the symbol
    dimension. Explicit §A.13.34 parallel-strand-framing
    citation prevents future audit confusion + sets the
    pattern for Phase 1.3 candidate segment-cvc-into-phonemes
    (same parallel-strand framing applies: oral phoneme
    segmentation = phonological-awareness; written-word
    segmentation = phonics-decoding).

    Materials note: 8-material Literacy class stack per
    §A.13.37 + Phase 1.1 Slot 3 + Phase 1.2 Slots 2+3
    canonical precedents. Materials structure mirrors
    isolate-initial/final/medial-phoneme verbatim (theme:
    animals provides familiar CVC vocabulary for blending
    work — cat /c-a-t/ + dog /d-o-g/ + pig /p-i-g/ + hen
    /h-e-n/ + bat /b-a-t/ + bus /b-u-s/ give clean 3-
    phoneme structure across common K-1 short-vowel CVC
    words). Manipulative-cut-outs at position 6 emits
    canonical-correct `mode: single-repeat` per §A.13.35.

    Distinctive composition: word-guess at position 1
    (introduction) — the missing-letter format naturally
    surfaces the blending operation (kid sees C_T + cue,
    blends to read CAT). Matching ×2 (positions 2+5) +
    picture-sort (position 3) + word-scramble (position 4).
    Word-guess at position 1 distinguishes this composition
    from the isolation-cluster siblings (which used matching
    at position 1) — synthesis pedagogy benefits from word-
    guess's incomplete-letter affordance because the missing
    letter forces kids to BLEND the surrounding letters' sounds
    to fill the gap.

    Class B FLEXIBLE substrate: composes against animals
    theme (vocab-anchored with familiar K-1 CVC vocabulary;
    cross-arc theme consistency with isolation cluster). No
    substrate gaps; ships clean.

    K-3 multilingual classroom relevance: blending is universal
    K early-literacy content BUT syllabic-vs-phonemic blending
    strategies differ per language. English (consonant-cluster
    permissive; CVC blending) + German + Dutch use phonemic
    blending. Italian + Spanish + pt-BR use syllabic blending
    (CV-syllable units rather than C-V-C phonemes). Multilingual
    K-3 classrooms benefit from explicit blending work in the
    language-of-instruction strategy + awareness that home-
    language blending strategy may differ structurally.

