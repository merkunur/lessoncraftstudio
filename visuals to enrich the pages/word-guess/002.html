<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Word Guess Challenge - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(180deg, #FAF5FF 0%, #F5F3FF 50%, #EDE9FE 100%);">

        <!-- Subtle grid pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image:
            linear-gradient(to right, #6B21A8 1px, transparent 1px),
            linear-gradient(to bottom, #6B21A8 1px, transparent 1px);
            background-size: 45px 45px;"></div>

        <!-- FREE Badge - hanging tab -->
        <div style="position: absolute; top: 0; left: 30px;">
            <div style="background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); padding: 12px 28px 16px 28px; border-radius: 0 0 12px 12px; box-shadow: 0 4px 15px rgba(249,115,22,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 28px; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">FREE!</span>
            </div>
        </div>

        <!-- Grade Badge - top right -->
        <div style="position: absolute; top: 25px; right: 30px;">
            <div style="background: #4C1D95; padding: 10px 22px; border-radius: 25px; box-shadow: 0 3px 10px rgba(0,0,0,0.15);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: white; letter-spacing: 1px;">GRADES K-1</span>
            </div>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 65px; left: 50%; transform: translateX(-50%); text-align: center;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 68px; font-weight: 700; color: #4C1D95; text-shadow: 0 3px 6px rgba(0,0,0,0.08);">What's Inside?</h1>
            <div style="width: 200px; height: 5px; background: linear-gradient(90deg, transparent, #FBBF24, transparent); margin: 10px auto 0;"></div>
        </div>

        <!-- Feature Circles - arc arrangement -->
        <div style="position: absolute; top: 180px; left: 50%; transform: translateX(-50%); width: 900px; height: 300px;">

            <!-- Circle 1 - Letter Boxes (left) -->
            <div style="position: absolute; left: 50px; top: 50px; text-align: center;">
                <div style="width: 130px; height: 130px; background: linear-gradient(145deg, #6B21A8 0%, #4C1D95 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(107,33,168,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #FBBF24;">
                    <span style="font-size: 55px;">🔤</span>
                </div>
                <p style="margin: 12px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #4C1D95;">Letter<br>Boxes</p>
            </div>

            <!-- Circle 2 - Picture Clues -->
            <div style="position: absolute; left: 210px; top: 5px; text-align: center;">
                <div style="width: 130px; height: 130px; background: linear-gradient(145deg, #38BDF8 0%, #0EA5E9 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(56,189,248,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #FBBF24;">
                    <span style="font-size: 55px;">🖼️</span>
                </div>
                <p style="margin: 12px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #4C1D95;">Picture<br>Clues</p>
            </div>

            <!-- Circle 3 - Answer Keys (center top, largest) -->
            <div style="position: absolute; left: 375px; top: -20px; text-align: center;">
                <div style="width: 145px; height: 145px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(249,115,22,0.5), inset 0 -3px 10px rgba(0,0,0,0.2); border: 6px solid #FBBF24;">
                    <span style="font-size: 60px;">🔑</span>
                </div>
                <p style="margin: 14px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; color: #4C1D95;">Answer<br>Keys</p>
            </div>

            <!-- Circle 4 - Multiple Themes -->
            <div style="position: absolute; right: 210px; top: 5px; text-align: center;">
                <div style="width: 130px; height: 130px; background: linear-gradient(145deg, #22C55E 0%, #16A34A 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(34,197,94,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #FBBF24;">
                    <span style="font-size: 55px;">🎨</span>
                </div>
                <p style="margin: 12px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #4C1D95;">Multiple<br>Themes</p>
            </div>

            <!-- Circle 5 - Custom Words (right) -->
            <div style="position: absolute; right: 50px; top: 50px; text-align: center;">
                <div style="width: 130px; height: 130px; background: linear-gradient(145deg, #EC4899 0%, #DB2777 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(236,72,153,0.4), inset 0 -3px 10px rgba(0,0,0,0.2); border: 5px solid #FBBF24;">
                    <span style="font-size: 55px;">✏️</span>
                </div>
                <p style="margin: 12px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 600; color: #4C1D95;">Custom<br>Words</p>
            </div>
        </div>

        <!-- Sample Display Section - worksheet + answer key side by side -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 60px; align-items: flex-end;">

            <!-- Worksheet Preview -->
            <div style="text-align: center;">
                <div style="width: 260px; height: 338px; background: white; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.2), 0 0 0 4px #6B21A8; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/word%20guess/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Worksheet">
                </div>
                <div style="margin-top: 12px; background: #6B21A8; padding: 8px 25px; border-radius: 20px; display: inline-block;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700; color: white;">WORKSHEET</span>
                </div>
            </div>

            <!-- Answer Key Preview -->
            <div style="text-align: center;">
                <div style="width: 260px; height: 338px; background: white; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.2), 0 0 0 4px #22C55E; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/word%20guess/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Answer Key">
                </div>
                <div style="margin-top: 12px; background: #22C55E; padding: 8px 25px; border-radius: 20px; display: inline-block;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 18px; font-weight: 700; color: white;">ANSWER KEY</span>
                </div>
            </div>
        </div>

        <!-- Decorative letter tiles in corners -->
        <div style="position: absolute; bottom: 400px; left: 25px; width: 42px; height: 42px; background: linear-gradient(145deg, #FAF5FF 0%, #EDE9FE 100%); border-radius: 5px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.15); transform: rotate(-8deg); border: 2px solid #D8B4FE;">
            <span style="font-size: 24px; font-weight: 700; color: #6B21A8;">W</span>
        </div>
        <div style="position: absolute; bottom: 420px; right: 25px; width: 42px; height: 42px; background: linear-gradient(145deg, #FAF5FF 0%, #EDE9FE 100%); border-radius: 5px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.15); transform: rotate(10deg); border: 2px solid #D8B4FE;">
            <span style="font-size: 24px; font-weight: 700; color: #6B21A8;">O</span>
        </div>
        <div style="position: absolute; top: 170px; left: 15px; width: 38px; height: 38px; background: linear-gradient(145deg, #FAF5FF 0%, #EDE9FE 100%); border-radius: 5px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.15); transform: rotate(6deg); border: 2px solid #D8B4FE;">
            <span style="font-size: 22px; font-weight: 700; color: #6B21A8;">R</span>
        </div>
        <div style="position: absolute; top: 160px; right: 15px; width: 38px; height: 38px; background: linear-gradient(145deg, #FAF5FF 0%, #EDE9FE 100%); border-radius: 5px; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 rgba(0,0,0,0.15); transform: rotate(-5deg); border: 2px solid #D8B4FE;">
            <span style="font-size: 22px; font-weight: 700; color: #6B21A8;">D</span>
        </div>

    </div>
</body>
</html>
