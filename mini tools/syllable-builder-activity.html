<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Constructor de sílabas — Actividad — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=9">
  <!-- v7 cascade: see ten-frame-activity.html for the full rationale.
       Activity-page parent forces iframe to 66.67vh + renders sage field;
       these rules transparent-body + cascade height: 100% to .lcs-app. -->
  <style>
    html, body { background: transparent !important; }
    html, body, #lcs-root { height: 100% !important; }

    /* v7.2 mobile: same shape as cvc-builder for parallel engine.
       Constrain subject/slots/palette to card width; lift Hear button
       out of slot-row collision; tighten wb-tile min-width so 2 syllable
       tiles + gap fit cleanly in ~285px card-inner. */
    @media (max-width: 599px) {
      /* !important needed: engine injects its CSS via JS at runtime (after
         this inline <style>) — equal specificity, later cascade wins. */
      .wb-subject { max-width: min(280px, 88vw) !important; }
      .wb-subject-img { height: clamp(72px, 14vmin, 96px) !important; }
      .wb-subject-hear { bottom: 4px !important; right: 4px !important; }
      .wb-slots { max-width: 90vw !important; }
      .wb-palette { max-width: 90vw !important; }
      .wb-tile { min-width: clamp(56px, 13vmin, 80px) !important; }
      .wb-wrap { gap: clamp(12px, 2.6vmin, 16px) !important; }
    }

    /* v7.4 desktop: scale subject + slots + tiles up so engine content
       fills the bigger card proportionally. */
    @media (min-width: 768px) {
      .wb-subject-img { height: clamp(120px, 16vmin, 180px) !important; }
      .wb-slot {
        min-height: clamp(72px, 12vmin, 96px) !important;
        font-size: clamp(28px, 5vmin, 38px) !important;
      }
      .wb-tile {
        min-width: clamp(96px, 14vmin, 128px) !important;
        font-size: clamp(28px, 4.5vmin, 38px) !important;
      }
      .wb-wrap { gap: clamp(16px, 2.6vmin, 22px) !important; }
    }
  </style>
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then the shared word-builder core, then this activity wrapper.
       NOTE: Bump ?v=N on EVERY change to *-core.js or *-activity.js. Browsers
       cache by URL including the query string; without a bump, clients that
       visited any earlier version will keep serving the stale local copy and
       miss new locale strings / task params (e.g., FI fan-out title bug). -->
  <script src="/mini-tools/lcs-shell.js"></script>
  <script src="/mini-tools/word-builder-core.js?v=3"></script>
  <script src="/mini-tools/syllable-builder-activity.js?v=3"></script>
  <script>
    LCS.mount(SyllableBuilderActivity, { mount: '#lcs-root' });
  </script>
</body>
</html>
