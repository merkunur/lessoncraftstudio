compositionalRationale:
  en: |
    Primary strand: math / geometry (identify equal-part
    shares by name — saturates geometry strand 8/8 paired
    with partition-shape-halves-quarters at slot 1; 23rd
    saturated strand in the catalog). Secondary strand:
    spatial-reasoning (the visual-counting work of
    enumerating equal pieces in a partitioned shape).
    Tertiary strand: vocabulary-acquisition (fraction-
    naming vocabulary: half, third, quarter, fourth,
    equal-parts, shaded, share).

    Architectural significance: completes the geometry
    strand opened by Arc 9 identify-2d-shapes-basic +
    extended by Arc 9 identify-2d-shapes-extended + Arc 14
    describe-shape-attributes + Arc 17 P1.3 compose-shapes-
    from-parts + slot-1 pair partner partition-shape-
    halves-quarters. The strand's 8 targets cover
    progressively: shape recognition (targets 1-3),
    attribute analysis (target 4), composition (target 5),
    symmetry (target 6), partition (target 7 — slot 1
    pair), and fraction-naming (target 8 — THIS PACKAGE).
    Geometry strand SATURATED at 8/8 with this package's
    ship. The 23rd saturated strand in the catalog.

    Pair partner: partition-shape-halves-quarters (slot 1
    of Phase 1.1). The two packages teach complementary
    pedagogical aspects of the same observable activity
    (recognizing partitioned shapes):
    - partition-shape-halves-quarters: kids see the
      partition ACTION (cut a whole into equal pieces) +
      name the resulting parts. The pedagogy anchors on
      the act of partitioning.
    - identify-fractions-half-third-quarter (this
      package): kids see partitioned shapes WITHOUT seeing
      the cutting + identify the equal-part name by
      counting equal pieces. The pedagogy anchors on
      recognition + naming.
    Both packages share material infrastructure (shapes
    theme, fraction-piece vocabKeys, picture-sort + missing-
    pieces composition pattern). Slot 1 covers halves +
    quarters per CCSS.1.G.A.3; this package extends to
    ALSO cover thirds per CCSS.2.G.A.3.

    Per §A.13.30 K-foundational-informal framing: K-1-
    Grade 2 fraction-naming work introduces:
    - The equal-part NAMES (halves, thirds, quarters /
      fourths)
    - The VISUAL STRUCTURE (counting equal pieces in a
      partitioned shape; identifying which equal-part
      share is shaded)
    Formal fraction notation (1/2 + 1/3 + 1/4 written
    symbolically) is Grade 3+ work per CCSS.3.NF.A and
    explicitly out of scope here. Kids leave this unit
    able to NAME partitioned shapes by their equal-part
    designation; they do NOT need to write fractions
    numerically. The visual + verbal vocabulary is the
    load-bearing K-1-Grade 2 fluency target.

    Distinctive composition: 2 matching (intro + assessment,
    bookending the fraction-recognition work) + 1 missing-
    pieces (canonical app for partition gap-completion —
    kids see a partial shape + identify which equal-part
    completes the named-fraction representation) + 1
    picture-sort (sorting partitioned shapes into halves /
    thirds / quarters categories; surfaces the equal-parts-
    counting structure 2 vs 3 vs 4) + 1 math-puzzle (given
    a name + a base shape, kids select the matching
    partitioned form — the inverse of recognition).
    Composition shape closely parallels slot-1 partition-
    shape-halves-quarters (which uses grid-match where
    this uses math-puzzle); the variation surfaces the
    naming-vs-action complementarity at the assessment
    layer.

    Materials note: 7-material Geometry-as-Numeracy-subclass
    class stack per §A.13.37. Manipulative-cut-outs at
    position 5 emits canonical-correct `mode: variety` with
    vocabKey enumeration of 8 fraction-piece shapes (whole/
    half/third/quarter for both circle and square shapes)
    at itemCount 4. This is the canonical §A.13.35 mode-
    correct shape per operator adjudication at Arc 18
    Phase 0 §A.13.6 firings batch. Pair-coherent with
    slot-1 partition-shape-halves-quarters material shape
    on the mode dimension; differs from slot 1 only in
    vocabKey set (slot 1 omits thirds since CCSS.1.G.A.3
    covers only halves + quarters; this package adds
    thirds for CCSS.2.G.A.3 coverage) + itemCount (4 vs 3,
    reflecting the slightly larger vocab set).

    Class B FLEXIBLE substrate: composes against shapes
    theme (geometry strand canonical theme — cross-arc
    consistency with the entire geometry-strand package
    set).

    K-3 multilingual classroom relevance: fraction-naming
    is universal K-3-Grade 2 geometry content. The
    counting-to-the-whole structure is locale-portable —
    counting 2 + 3 + 4 equal pieces gives the partition
    name in every language. The VOCABULARY varies notably:
    en 'half' + 'third' + 'quarter' (note the en doublet
    quarter + fourth — interchangeable in K-1 register;
    upper grades use fourth more frequently); de 'Hälfte' +
    'Drittel' + 'Viertel'; es 'mitad' + 'tercio' + 'cuarto';
    pt 'metade' + 'terço' + 'quarto'; fr 'moitié' + 'tiers'
    + 'quart'; it 'metà' + 'terzo' + 'quarto'; nl 'helft' +
    'derde' + 'kwart'; fi 'puolikas' + 'kolmasosa' +
    'neljäsosa' (note Finnish uses compound forms with -osa
    'part'). The hands-on cut-out sorting work bypasses
    much of the vocabulary load — kids do the count-and-
    name recognition regardless of which language they're
    operating in. Locale-variant work at Phase 3+ adapts
    to each locale's fraction register + counting-name
    conventions.

