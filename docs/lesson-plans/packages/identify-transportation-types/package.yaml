compositionalRationale:
  en: |
    Primary strand: world-knowledge / community-and-roles. Secondary strand:
    vocabulary acquisition (consolidates Arc 2 vehicle vocabulary in
    classification-context).

    Architectural significance: second world-knowledge domain package in the
    catalog (paired with classify-animals-by-habitat in Phase 2). Validates
    the world-knowledge architecture across two distinct subject areas
    (animals + transportation) within the same phase — stress-tests whether
    classification packages share enough common shape to scale, or whether
    each subject's classification work has substantially distinct
    architectural needs. Per §A.14 scaling-checkpoint discipline.

    Distinctive composition vs animals-by-habitat: 3 environments instead of
    4 (transportation maps cleanly to land / sea / air; animal habitats split
    into 4 with the home/pet category). The 3-environment schema is simpler
    and more concrete (kids have intuitive mental models of "things that
    travel on water" vs "things that fly") — good first-classification
    target before moving to 4-category animal habitats in same Phase 2.

    Multi-cluster substrate: vocabKeys spans 3 transportation clusters
    (transportation-land 6 keys + transportation-sea 4 keys + transportation-
    air 4 keys) with 10 representative vehicles. Validates multi-cluster
    vocabKeyList handling parallel to classify-animals-by-habitat (12-key
    multi-cluster).

    Cultural-variation acknowledgment: vehicle-modal availability varies by
    region (rural communities may have less air-transport exposure; coastal
    communities have more boat exposure; urban centers have more train +
    bus). Operator-side teachers can emphasize locally-relevant vehicles
    in the warmup discussion.

curriculumStandards:
  - EYFS.ELG.UW
  - IB-PYP.HowWeOrganize
  - IB-PYP.WhereWeAreInPlaceAndTime

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Classify 10 mixed-environment vehicles into 3 environment categories
        with 80%+ accuracy.
      - Use environment-vocabulary ("land," "sea," "air") in oral sorting
        work.
      - Explain 1-2 reasons why a vehicle works in its environment (boats
        float, airplanes fly, cars drive on roads) when prompted.

    Differentiation:
    - Pre-K: 2-environment sorting only (land vs air OR land vs sea).
    - K / Grade 1: full 3-environment classification.
    - Grade 2+: extend to identify-community-helpers (drivers, captains,
      pilots) + map-reading (where do vehicles go from here?).

    Prerequisite check: kids who haven't completed identify-and-name-vehicles
    (Arc 2) should review vehicle names at warmup. Classification requires
    names-as-prerequisite.

