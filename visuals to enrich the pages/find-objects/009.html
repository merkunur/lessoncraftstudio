<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1000, height=1000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px;
    height: 1000px;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(160deg, #1F2937 0%, #334155 50%, #475569 100%);
    position: relative;
  }

  /* Gold border inset */
  .gold-border {
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    bottom: 15px;
    border: 2px solid rgba(212,175,55,0.3);
    border-radius: 8px;
    z-index: 1;
    pointer-events: none;
  }

  /* Subtle gold sparkle dots */
  .gold-dot {
    position: absolute;
    border-radius: 50%;
    background: rgba(245,214,128,0.2);
    z-index: 2;
  }
  .gd1 { top: 80px; left: 60px; width: 4px; height: 4px; }
  .gd2 { top: 200px; right: 80px; width: 5px; height: 5px; }
  .gd3 { top: 450px; left: 40px; width: 3px; height: 3px; }
  .gd4 { top: 550px; right: 50px; width: 4px; height: 4px; }
  .gd5 { bottom: 250px; left: 70px; width: 5px; height: 5px; }
  .gd6 { bottom: 300px; right: 65px; width: 3px; height: 3px; }
  .gd7 { top: 350px; left: 100px; width: 4px; height: 4px; }
  .gd8 { bottom: 350px; right: 90px; width: 5px; height: 5px; }
  .gd9 { top: 150px; left: 180px; width: 3px; height: 3px; }
  .gd10 { bottom: 180px; right: 150px; width: 4px; height: 4px; }

  /* GRATIS badge - gold style */
  .gratis {
    position: absolute;
    top: 32px;
    left: 32px;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: linear-gradient(145deg, #D4AF37 0%, #B8960C 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 25px;
    color: white;
    z-index: 20;
    box-shadow: 0 6px 20px rgba(212,175,55,0.4), 0 0 15px rgba(212,175,55,0.2);
    transform: rotate(-8deg);
    border: 2px solid rgba(255,255,255,0.3);
  }

  /* Grade badge */
  .grade {
    position: absolute;
    top: 40px;
    right: 35px;
    background: rgba(212,175,55,0.12);
    backdrop-filter: blur(10px);
    padding: 10px 22px;
    border-radius: 25px;
    border: 2px solid rgba(212,175,55,0.3);
    z-index: 20;
  }
  .grade span {
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: #F5D680;
    letter-spacing: 0.3px;
  }

  /* Title */
  .title-area {
    position: absolute;
    top: 40px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }
  .title-line1 {
    font-size: 66px;
    font-weight: 700;
    background: linear-gradient(135deg, #F5D680 0%, #D4AF37 50%, #F5D680 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 3px;
    line-height: 1;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
  }
  .title-line2 {
    font-size: 66px;
    font-weight: 700;
    background: linear-gradient(135deg, #F5D680 0%, #D4AF37 50%, #F5D680 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 3px;
    line-height: 1;
    margin-top: -2px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
  }
  .subtitle {
    font-family: 'Nunito', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: rgba(203,213,225,0.8);
    margin-top: 10px;
    letter-spacing: 0.5px;
  }

  /* Fanned cards area */
  .cards-area {
    position: absolute;
    top: 280px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 400px;
    z-index: 10;
  }

  /* Card */
  .card {
    position: absolute;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 10px 35px rgba(0,0,0,0.35);
  }
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Left card */
  .card-left {
    left: 80px;
    top: 20px;
    width: 200px;
    height: 260px;
    z-index: 1;
    opacity: 0.85;
  }

  /* Center card - largest, elevated */
  .card-center {
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    width: 240px;
    height: 310px;
    z-index: 3;
    box-shadow: 0 14px 45px rgba(0,0,0,0.45), 0 0 20px rgba(212,175,55,0.15);
    border: 2px solid rgba(212,175,55,0.3);
  }

  /* Right card */
  .card-right {
    right: 80px;
    top: 20px;
    width: 200px;
    height: 260px;
    z-index: 2;
    opacity: 0.85;
  }

  /* Checkmark badge on center card */
  .check-badge {
    position: absolute;
    top: 328px;
    left: 50%;
    transform: translateX(55px);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(145deg, #22C55E, #16A34A);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 15;
    box-shadow: 0 4px 12px rgba(34,197,94,0.4);
    border: 3px solid white;
  }
  .check-badge span {
    color: white;
    font-size: 22px;
    font-weight: 700;
  }

  /* Premium seal */
  .seal {
    position: absolute;
    top: 160px;
    right: 70px;
    width: 110px;
    height: 110px;
    z-index: 15;
  }
  .seal-outer {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid #D4AF37;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(212,175,55,0.08);
    position: relative;
  }
  .seal-inner {
    width: 85%;
    height: 85%;
    border-radius: 50%;
    border: 1px solid rgba(212,175,55,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .seal-star {
    font-size: 22px;
    line-height: 1;
  }
  .seal-text {
    font-family: 'Nunito', sans-serif;
    font-size: 10px;
    font-weight: 800;
    color: #F5D680;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.2;
  }

  /* Quality indicators */
  .quality-bar {
    position: absolute;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    z-index: 15;
  }
  .quality-item {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .quality-icon {
    font-size: 18px;
    flex-shrink: 0;
  }
  .quality-text {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    white-space: nowrap;
  }

  /* Bottom tagline bar */
  .tagline-bar {
    position: absolute;
    bottom: 35px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 15;
  }
  .tagline-bar span {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: rgba(245,214,128,0.6);
    font-style: italic;
    letter-spacing: 0.5px;
  }

  /* Thin gold line separator */
  .gold-line {
    position: absolute;
    bottom: 75px;
    left: 60px;
    right: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.25) 20%, rgba(212,175,55,0.25) 80%, transparent);
    z-index: 10;
  }
</style>
</head>
<body>

<!-- Gold border inset -->
<div class="gold-border"></div>

<!-- Gold sparkle dots -->
<div class="gold-dot gd1"></div>
<div class="gold-dot gd2"></div>
<div class="gold-dot gd3"></div>
<div class="gold-dot gd4"></div>
<div class="gold-dot gd5"></div>
<div class="gold-dot gd6"></div>
<div class="gold-dot gd7"></div>
<div class="gold-dot gd8"></div>
<div class="gold-dot gd9"></div>
<div class="gold-dot gd10"></div>

<!-- GRATIS badge (gold) -->
<div class="gratis">GRATIS</div>

<!-- Grade badge -->
<div class="grade"><span>Vorschule bis 2. Klasse</span></div>

<!-- Title -->
<div class="title-area">
  <div class="title-line1">PERFEKT</div>
  <div class="title-line2">VORBEREITET</div>
  <div class="subtitle">Professionelle Suchbilder in Druckqualit&auml;t</div>
</div>

<!-- Premium seal -->
<div class="seal">
  <div class="seal-outer">
    <div class="seal-inner">
      <div class="seal-star">&#x2B50;</div>
      <div class="seal-text">PREMIUM<br>QUALIT&Auml;T</div>
    </div>
  </div>
</div>

<!-- Fanned cards -->
<div class="cards-area">
  <!-- Left card -->
  <div class="card card-left">
    <img src="https://www.lessoncraftstudio.com/samples/german/find%20objects/sample-6.jpeg" alt="Suchbild Arbeitsblatt">
  </div>

  <!-- Center card -->
  <div class="card card-center">
    <img src="https://www.lessoncraftstudio.com/samples/german/find%20objects/sample-8.jpeg" alt="Suchbild Arbeitsblatt">
  </div>

  <!-- Right card -->
  <div class="card card-right">
    <img src="https://www.lessoncraftstudio.com/samples/german/find%20objects/sample-5.jpeg" alt="Suchbild Arbeitsblatt">
  </div>
</div>

<!-- Checkmark badge on center card -->
<div class="check-badge"><span>&#x2713;</span></div>

<!-- Quality indicators -->
<div class="quality-bar">
  <div class="quality-item">
    <div class="quality-icon">&#x2713;</div>
    <div class="quality-text">L&ouml;sungsbl&auml;tter inklusive</div>
  </div>
  <div class="quality-item">
    <div class="quality-icon">&#x1F5A8;</div>
    <div class="quality-text">300 DPI Druckqualit&auml;t</div>
  </div>
  <div class="quality-item">
    <div class="quality-icon">&#x2B50;</div>
    <div class="quality-text">P&auml;dagogisch wertvoll</div>
  </div>
</div>

<!-- Gold line separator -->
<div class="gold-line"></div>

<!-- Tagline -->
<div class="tagline-bar">
  <span>Von Lehrkr&auml;ften empfohlen &mdash; Profi-Qualit&auml;t zum Ausdrucken</span>
</div>

</body>
</html>
