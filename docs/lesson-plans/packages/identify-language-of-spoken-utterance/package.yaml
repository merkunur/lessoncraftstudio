# Teaching package — identify the language of a spoken utterance
# Arc 9 Phase 2 (Option D multilingual-language-awareness depth; early-
# literacy / multilingual-language-awareness strand). Class B FLEXIBLE.
# Receptive-language counterpart to respond-in-target-language-when-prompted
# (Phase 2 sibling). Kids hear a short utterance + identify the language
# (English? Spanish? French?). Develops phonological-discrimination
# foundations across languages.

targetSlug: identify-language-of-spoken-utterance
language: en
title:
  en: "Listen and Tell — which language do you hear?"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching language-discrimination by ear. Multilingual-language-awareness strand depth: kids hear short utterances + identify which language is being spoken (English vs Spanish vs French vs etc.). Develops phonological-discrimination across languages — kids notice that languages have distinct sound patterns + can be distinguished by ear before being understood. Validates listening as language-awareness skill. Composes against matching app for language-flag pairing. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class listening routine. Teacher plays (or reads) a short
      utterance in 3-4 different languages: "Hello, how are you?" /
      "Bonjour, comment ça va?" / "Hola, ¿cómo estás?" / "Olá, como
      vai?". Kids who recognize a language raise their hand. Teacher
      says: "Different languages SOUND different. Some have sounds that
      are similar (Hola and Olá), but each language has its own
      pattern." Reinforces that language discrimination by ear is a
      meaningful skill.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + listening + language-flag pairing. Each pair receives
      flashcards with country flags (US / UK / France / Spain / Italy /
      Germany / Brazil / Sweden / Japan / etc.). Teacher reads a short
      utterance in one language; pair lifts the corresponding flag.
      Recast errors with explanation ("you lifted the French flag, but
      that was Spanish — let's listen again. 'Hola' has a clear 'O'
      sound at the start; 'Bonjour' has a 'Bon' sound"). Optional
      extension: kids try to say a greeting in each language —
      productive-language counterpart.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (language-name
      to flag pairs). Station 2: matching worksheet (greeting-word in
      different languages to translation). Station 3: manipulative
      cut-outs hands-on language-flag construction (kids assemble
      multilingual greeting cards). Station 4: word-guess (kids fill
      in language-name letters from clue cards).
  closure:
    durationMinutes: 5
    body: |
      Whole-class language-listening quiz. Teacher reads short
      utterances in 4-5 languages; class collectively identifies each.
      Forward-pointer: "Today we listened for the language. When we
      come back to language-listening next, we'll learn to RESPOND in
      target language when someone greets us — receptive-to-productive
      language progression."

