compositionalRationale:
  en: |
    Primary strand: world-knowledge / personal-social-emotional-
    development (PSED; SAT-CLOSING canonical fill at 7/8 → 8/8).
    Secondary strand: early-literacy / speaking-and-listening (the
    3 social-language scripts \"my turn\" / \"your turn\" / \"we can
    share\" are scaffolded productive-language work). Tertiary
    strand: cognitive-and-executive-function / memory-and-attention
    (impulse-control + delayed-gratification + waiting are core
    executive-function operations underlying turn-taking).

    Architectural significance: this package CLOSES the PSED
    canonical strand at 8/8 — final canonical target for the strand.
    Completes the Arc 16 SEL triad-pair: name-and-describe-feelings-
    detailed (Arc 16 Phase 1.2) + show-perspective-taking (Arc 16
    Phase 1.3) + share-and-take-turns (Arc 17 Phase 1.1). The triad
    builds a complete developmental arc: NAME complex feelings →
    UNDERSTAND others have their own feelings (perspective-taking)
    → APPLY behaviorally via turn-taking + sharing scripts. PSED
    strand now fully saturated; world-knowledge domain coverage
    advances: 6 of 6 strands saturated (living-things + environment-
    and-weather + community-and-roles + time-and-routine + materials-
    and-properties + PSED).

    Distinctive composition: 5 exercises across 4 apps — picture-sort
    (position 1) surfaces appropriate-vs-inappropriate scenario
    sorting; matching (positions 2 + 5) builds scenario-to-response
    pairing; math-worksheet (position 3) introduces fairness-as-
    division counting work (a turn-taking arithmetic substrate
    distinct from numeracy work — kids learn that fairness has
    quantitative shape: 6 crackers / 3 kids = 2 each); word-guess
    (position 4) reinforces social-language vocabulary in puzzle
    form.

    SEL-class material composition: 6-material per Arc 16 §A.13.6-
    firing-corrected SEL class-conditional disposition. REMOVE
    matching-mat (the matching-mat mechanic is image-to-word pairing
    which doesn't fit SEL scenario-response work shape) + REMOVE
    vocabulary-tracing-strips (SEL behavioral skill work doesn't
    primarily anchor on vocabulary-tracing reinforcement; scripts
    are short oral-language phrases not tracing-substrate words).
    KEEP: flashcards (scenario cards) + picture-cards (positive
    social-interaction images) + sentence-strips (i-feel + my-turn
    + your-turn social-language frames; the i-feel frame preset
    accommodates emotion-vocabulary work alongside script work)
    + manipulative-cut-outs (turn-taking tracker) + parent-take-
    home-letter (home-school SEL bridge for sharing-and-turn-taking
    work that surfaces at family meals + playdates + sibling
    dynamics) + answer-key.

    Class B FLEXIBLE substrate: composes against emotions theme. The
    Arc 16 triad-pair anchor (name-and-describe-feelings + show-
    perspective-taking) used emotions theme; share-and-take-turns
    continues the theme to preserve cross-package cluster coherence.
    emotions-bundle becomes the 3-package SEL anchor bundle post-
    Arc-17 Phase 1.1 (cross-bundle reuse density advancement to
    Arc 17 P2 close).

    K-3 multilingual classroom relevance: turn-taking + sharing
    norms vary across cultures with K-3-relevant divergence —
    individual-turn-taking traditions (US/Northern European register)
    contrast with collective-sharing traditions (Latin American /
    Mediterranean / Asian family registers where food is shared from
    a common dish without individual portions); some cultures emphasize
    waiting-respectfully without using verbal scripts. Locale-variant
    sparse-overrides adapt the SCRIPT register per locale: pt-BR
    \"minha vez\" / \"sua vez\" / \"vamos compartilhar\" with
    warm-relational register; nordic locales use shorter scripts
    matching local communication style; multilingual K-3 classrooms
    benefit from explicit script-modeling because kids may have
    different home-cultural defaults colliding in classroom-shared
    contexts.

    Cross-cultural affirmation discipline: package affirms cultural
    variation in sharing practices (\"some families share food from
    one big plate; some families have their own portions; both are
    fair\") rather than prescribing one register. Particularly load-
    bearing for international school + dual-language program contexts
    where kids' home-cultural backgrounds diverge.

