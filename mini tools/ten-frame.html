<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ten Frame — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=16">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then the shared ten-frame core, then this tool's wrapper,
       then boot. Absolute /mini-tools/ paths so embeds + cross-context
       loads resolve identically. -->
  <script src="/mini-tools/lcs-shell.js?v=3"></script>
  <script src="/mini-tools/ten-frame-core.js?v=2"></script>
  <script src="/mini-tools/ten-frame.js"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=sv  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    LCS.mount(TenFrame, { mount: '#lcs-root' });
  </script>
</body>
</html>
