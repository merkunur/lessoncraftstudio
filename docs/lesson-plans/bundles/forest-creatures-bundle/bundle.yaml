thematicCoherence:
  en: |
    All 4 packages cohere around the forest-creatures theme + form
    a cross-strand bundle anchored at forest habitat ecology.

    **Pedagogical sequencing:**
    1. **classify-animals-by-habitat** — Cognitive classification
       using forest as focal habitat (forest vs ocean vs farm vs
       desert). Now in 5 bundles (animals + farm-animals + ocean-
       life + birds + forest-creatures). Habitat classification
       continues as cross-bundle anchor.
    2. **identify-living-vs-nonliving** — Biological-reasoning
       work. Forest creatures ARE living-things; forest non-living
       elements (rocks, soil, fallen leaves) provide contrast.
       Same shared package across 6 prior bundles; forest-creatures
       adds 7th. Doctrine: certain packages compose universally
       across animal-context bundles (living-vs-nonliving;
       classify-by-habitat); pattern of cross-bundle reuse-density
       observable.
    3. **count-objects-1-to-10** — Counting practice using forest
       creatures (count 5 squirrels; 3 deer; 7 birds). Now in 6
       bundles (fruits + flowers + insects + ocean-life + breakfast
       + forest-creatures + kitchen-tools = 7 actually). Counting
       continues universally-composable.
    4. **sort-by-category** — Category-classification work
       distinguishing forest creatures from other-habitat creatures
       (squirrel = forest vs whale = ocean vs cow = farm). Same
       shared package with breakfast-bundle + kitchen-tools-bundle.

    **Strand spread:** 1 world-knowledge (habitat) + 1 world-
    knowledge (living things) + 1 numeracy + 1 cognitive-sorting.
    4 distinct strands; cross-strand pattern.

    **Suggested unit duration:** 4 weeks (1 package per week).
    Nature-walk + field-trip + classroom-naturalist extensions
    natural fit.

    **Multilingual classroom relevance:** forest-creature vocabulary
    varied across 11 platform locales — common creatures (rabbit,
    fox, deer) more cognate Romance + Germanic; specialized woodland
    fauna (raccoon, opossum, badger) more locale-distinct. Visual
    forest content translates universally; vocabulary anchor varies.

    **Pillar 2 architectural pattern:** forest-creatures-bundle
    completes the 4th sub-theme bundle in the animals theme-axis-
    key cluster (animals + farm-animals + pets + birds + forest-
    creatures + ocean-life + insects = 7 animal-related bundles
    total at Pillar 2 Arc 4 Phase 1 close). Demonstrates that
    animals theme can sustain extensive sub-theme expansion — 7
    bundles drawing on shared package pool (identify-living-vs-
    nonliving in 7 bundles; classify-animals-by-habitat in 5).
    Bundle catalog growth amortizing master-package authoring
    continues compounding.
