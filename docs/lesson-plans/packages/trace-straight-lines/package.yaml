compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial / drawing-and-tracing
    (straight-line tracing). Secondary strand: visual-motor coordination
    (hand-eye line-following). Tertiary strand: pre-handwriting (straight
    lines are letter-formation precursors).

    Architectural significance: FIRST drawing-and-tracing strand package
    in the catalog. Pre-handwriting bridge: kids develop pencil control
    + line-following accuracy BEFORE encountering letter-formation
    work (handwriting strand: form-uppercase-letters, form-lowercase-
    letters, form-numerals — Arc 11+ candidates). Foundational K-3
    fine-motor scaffolding.

    Distinctive composition: 2 vocabulary-tracing-strips materials at
    different traceStyle parameters (dotted + outline) — gradual
    fading of guidance from visible-trace-line to outline-only.
    Demonstrates progression: dotted (heavy guidance) → outline
    (light guidance) → free-hand (no guidance). Pedagogically aligned
    with how K-3 fine-motor work scaffolds toward independence.

    Cross-strand integration: drawing-and-tracing + letter-recognition
    (Arc 9+10) + vocabulary acquisition. Future arcs can build on this
    foundation: trace-curved-lines (line-trace forward-pointer; Arc
    11+ candidate) + trace-2d-shapes + draw-2d-shapes-freehand.

    Class B FLEXIBLE substrate: composes against vocabulary-tracing-
    strips material capability. Tracing works with any vocabulary +
    any letter-shape; substrate-readiness universal.

    K-3 multilingual classroom relevance: tracing is language-portable
    — straight lines are straight lines regardless of locale. Across
    11 platform locales, kids develop pencil control on the same
    universal motor skills. Vocabulary anchor varies per locale per
    sparse-override pattern, but the tracing mechanics are constant.

