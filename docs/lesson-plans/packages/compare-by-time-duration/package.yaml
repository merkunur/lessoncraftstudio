# Teaching package — compare events by time duration
# Arc 14 Phase 4 (cognitive-and-executive-function / time-and-routine +1).
# Extends Arc 9-11 time-and-routine strand from 2/4 to 3/4.

targetSlug: compare-by-time-duration
language: en
title:
  en: "How Long Does It Take? — comparing time durations"
description:
  en: "Kindergarten / Grade 1 cognitive + time-and-routine package teaching kids to compare events by time duration. Builds on Arc 9-11 time-and-routine strand foundation (identify-days-of-week + identify-months-of-year). Extends time-and-routine strand from 2/4 to 3/4. Kids learn to compare which event takes LONGER vs SHORTER: 'Brushing teeth (2 minutes) vs sleeping (8 hours) — which takes longer?'. Visual + verbal anchors for time-duration concepts. Critical bridge from time-vocabulary (days, months) to time-measurement (duration). Connects naturally to Arc 14 Phase 4 sibling compare-by-capacity (both packages exercise comparison work in different measurement dimensions). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + time-duration introduction. Teacher
      displays 2 contrasting picture pairs: (1) blowing out a
      candle vs sleeping at night; (2) tying shoes vs going to
      school for a whole day. "Which takes LONGER? Sleeping all
      night takes much LONGER than blowing out a candle. Going
      to school for a day takes much LONGER than tying shoes."
      Class repeats vocabulary: SHORT TIME / LONG TIME / LONGER /
      SHORTER. Teacher introduces unit-language: "Some things take
      SECONDS (snap fingers). Some take MINUTES (eat breakfast).
      Some take HOURS (school day). Some take DAYS or WEEKS or
      MONTHS!" Visual + verbal anchor for time-duration comparison.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + duration-comparison routine. Each pair receives
      a worksheet with 6 paired-event pictures: (e.g., brushing
      teeth vs sleeping; eating snack vs eating dinner; reading a
      page vs reading a book; walking to door vs walking to school;
      saying name vs telling a story; clapping once vs whole
      birthday party). Pair takes turns: kid A points to the
      LONGER-duration event; kid B explains. Recast errors with
      lived-experience anchors ("which takes longer — brushing
      teeth or sleeping? Brushing teeth is FAST, sleeping is a
      LONG time").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: more-less worksheet (compare 2
      events; pick which takes LONGER). Station 2: matching
      worksheet (event picture to time-unit label: seconds /
      minutes / hours / days). Station 3: pattern-train worksheet
      (order 3-4 events by duration). Station 4: vocabulary-
      tracing-strips for time-duration vocabulary (short, long,
      longer, shorter, second, minute, hour, day, week, month).
  closure:
    durationMinutes: 5
    body: |
      Whole-class duration review. Teacher displays final picture
      pairs; class identifies longer-duration event + estimates
      time-unit. "Sneeze (seconds) vs lunch (minutes) vs weekend
      (days)." Forward-pointer: "Today we compared how LONG things
      take. When we come back next, we can use CLOCKS to measure
      time exactly — hours and minutes on a clock face!"

