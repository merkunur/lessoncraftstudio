compositionalRationale:
  en: |
    Primary strand: early-literacy / spelling-and-encoding (CVC word
    spelling). Secondary strand: phonological awareness (kids segment
    phonemes for spelling). Tertiary strand: vocabulary acquisition.

    **Architectural significance: STRAND-FIRST in spelling-and-encoding
    (0/5 → 1/5).** Productive-encoding sibling to Arc 12 read-cvc-words
    (Phase 2). Reading + spelling are reciprocal skills — kids who
    READ CVC words benefit from also WRITING them; kids who spell
    transfer skill to reading new words.

    Distinctive composition: 2 word-scramble exercises (positions 2
    + 4) + 1 word-guess + 2 matching. Spelling-emphasis throughout —
    word-scramble is foundational spelling-from-pattern; word-guess
    fills in letters from picture clues.

    Cross-strand integration: spelling-and-encoding + phonics-decoding
    (sibling Phase 2 read-cvc-words) + phonological-awareness (Arc 11
    count-syllables; Arc 10 identify-rhyming-pairs) + vocabulary.

    Class B FLEXIBLE substrate: composes against CVC-rich themes.

    K-3 multilingual classroom relevance: spelling is target-language-
    specific. CVC pattern is en-foundational; locale-variant sparse-
    overrides per Phase 3 handle locale-specific spelling patterns.

