thematicCoherence:
  en: |
    All 5 packages cohere around the occupations theme + form a
    cross-strand bundle demonstrating how community-role vocabulary
    can anchor diverse pedagogical work.

    **Pedagogical sequencing:**
    1. **identify-community-helpers** — Foundational occupations
       vocabulary (firefighter, teacher, doctor, police officer, mail
       carrier, etc.). Anchor for the bundle.
    2. **identify-and-name-action-verbs** — Action-verb vocabulary
       paired with occupations (heal, teach, drive, deliver, build).
       Connects what-each-occupation-does to communicative practice.
    3. **name-this-object-in-two-languages** — Multilingual exposure
       using occupation-tools (stethoscope, ladder, blackboard, etc.)
       across two languages. Particularly relevant in dual-language
       classrooms where students see careers across cultures.
    4. **use-spatial-position-words** — Spatial vocabulary (in, on,
       under, behind) practiced in occupation-context settings (the
       firefighter is ON the ladder; the doctor is IN the office).
    5. **follow-1-step-oral-instruction** — Listening + instruction
       following using occupation-themed prompts (e.g., "Point to the
       firefighter's helmet"). Bridges receptive-listening to social
       interaction with community helpers.

    **Strand spread:** 1 vocabulary-acquisition (community helpers) +
    1 vocabulary-acquisition (action verbs) + 1 multilingual + 1
    spatial-vocabulary + 1 instruction-following. **5 distinct strands
    in single bundle** — broadest cross-strand pattern (cf. fruits-
    bundle 4-strand spread).

    **Suggested unit duration:** 5 weeks (1 package per week) OR
    flexible 4-week unit with action-verbs + community-helpers paired
    in same week.

    **Multilingual classroom relevance:** occupation vocabulary
    moderate-cognate Romance (médecin / medico / doctor) but more
    distinct Germanic (Arzt / dokter / läkare) + Finnic (lääkäri).
    Multilingual exposure package particularly valuable here for
    dual-language teachers introducing professional vocabulary.

    **Pillar 2 architectural pattern:** occupations-bundle exemplifies
    broadest-cross-strand bundle composition — single theme (community
    roles) anchoring 5 distinct pedagogical strands. Contrasts with
    farm-animals-bundle (3-strand tight composition); both architectural
    patterns valid per Pillar 2 pluralism.
