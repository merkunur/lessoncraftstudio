<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Zuordnungs-Arbeitsbl&auml;tter - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #E8F5E9 0%, #F1F8E9 50%, #FFF9C4 100%); overflow: hidden;">

        <!-- Subtle dot pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image: radial-gradient(circle, #2E7D32 1px, transparent 1px); background-size: 30px 30px;"></div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 25px; left: 28px; z-index: 100;">
            <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #FDD835 0%, #F9A825 100%); border-radius: 50%; box-shadow: 0 8px 28px rgba(249,168,37,0.5), inset 0 -4px 10px rgba(0,0,0,0.12), inset 0 4px 8px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #3E2723; text-shadow: 0 1px 2px rgba(255,255,255,0.4);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 32px; right: 30px; background: rgba(255,255,255,0.95); padding: 10px 20px; border-radius: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); border: 3px solid #2E7D32;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: #2E7D32; letter-spacing: 1px;">KLASSE K-2</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 95px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 64px; color: #1B5E20; margin: 0; text-shadow: 3px 3px 0 rgba(27,94,32,0.08);">ZUORDNUNG</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 36px; color: #4CAF50; margin: 4px 0 0 0;">Schritt f&uuml;r Schritt</h2>
        </div>

        <!-- SVG Winding S-Curve Path -->
        <svg style="position: absolute; top: 200px; left: 0; width: 1000px; height: 520px; z-index: 5;" viewBox="0 0 1000 520">
            <!-- Thick path background -->
            <path d="M 140 60 C 140 60, 300 60, 380 120 C 460 180, 500 220, 620 220 C 740 220, 760 180, 860 260 C 960 340, 860 420, 720 420 C 580 420, 540 380, 420 380" stroke="#A5D6A7" stroke-width="50" fill="none" stroke-linecap="round" opacity="0.5"/>
            <!-- Inner path -->
            <path d="M 140 60 C 140 60, 300 60, 380 120 C 460 180, 500 220, 620 220 C 740 220, 760 180, 860 260 C 960 340, 860 420, 720 420 C 580 420, 540 380, 420 380" stroke="#4CAF50" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.7"/>
            <!-- Dashed center line -->
            <path d="M 140 60 C 140 60, 300 60, 380 120 C 460 180, 500 220, 620 220 C 740 220, 760 180, 860 260 C 960 340, 860 420, 720 420 C 580 420, 540 380, 420 380" stroke="white" stroke-width="3" fill="none" stroke-dasharray="12 8" opacity="0.6"/>

            <!-- Footprint icons along the path -->
            <circle cx="220" cy="55" r="5" fill="#2E7D32" opacity="0.4"/>
            <circle cx="230" cy="48" r="3.5" fill="#2E7D32" opacity="0.4"/>
            <circle cx="450" cy="190" r="5" fill="#2E7D32" opacity="0.4"/>
            <circle cx="460" cy="183" r="3.5" fill="#2E7D32" opacity="0.4"/>
            <circle cx="800" cy="300" r="5" fill="#2E7D32" opacity="0.4"/>
            <circle cx="810" cy="293" r="3.5" fill="#2E7D32" opacity="0.4"/>
            <circle cx="600" cy="400" r="5" fill="#2E7D32" opacity="0.4"/>
            <circle cx="610" cy="393" r="3.5" fill="#2E7D32" opacity="0.4"/>
        </svg>

        <!-- Milestone 1: Einfach (left, at start of path) -->
        <div style="position: absolute; top: 215px; left: 50px; z-index: 20; text-align: center;">
            <div style="width: 160px; height: 207px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #4CAF50; overflow: hidden;">
                <img src="https://www.lessoncraftstudio.com/samples/german/matching/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Einfache Zuordnung">
            </div>
            <div style="margin-top: 10px;">
                <span style="display: inline-block; background: #4CAF50; color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; padding: 6px 18px; border-radius: 20px; box-shadow: 0 3px 10px rgba(76,175,80,0.4);">Einfach</span>
            </div>
            <div style="margin-top: 6px;">
                <span style="display: inline-block; background: rgba(255,255,255,0.9); color: #2E7D32; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; padding: 4px 12px; border-radius: 12px; border: 2px solid #A5D6A7;">Visuelle Zuordnung</span>
            </div>
        </div>

        <!-- Milestone 2: Mittel (center-right, middle of path) -->
        <div style="position: absolute; top: 340px; left: 380px; z-index: 20; text-align: center;">
            <div style="width: 170px; height: 220px; background: white; border-radius: 10px; box-shadow: 0 12px 35px rgba(0,0,0,0.2), 0 0 0 4px #FF8F00; overflow: hidden;">
                <img src="https://www.lessoncraftstudio.com/samples/german/matching/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Mittlere Zuordnung">
            </div>
            <div style="margin-top: 10px;">
                <span style="display: inline-block; background: #FF8F00; color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; padding: 6px 18px; border-radius: 20px; box-shadow: 0 3px 10px rgba(255,143,0,0.4);">Mittel</span>
            </div>
            <div style="margin-top: 6px;">
                <span style="display: inline-block; background: rgba(255,255,255,0.9); color: #E65100; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; padding: 4px 12px; border-radius: 12px; border: 2px solid #FFE0B2;">Wort-Bild-Verbindung</span>
            </div>
        </div>

        <!-- Milestone 3: Fortgeschritten (right, end of path) -->
        <div style="position: absolute; top: 230px; right: 65px; z-index: 20; text-align: center;">
            <div style="width: 160px; height: 207px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #E53935; overflow: hidden;">
                <img src="https://www.lessoncraftstudio.com/samples/german/matching/sample-5.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Fortgeschrittene Zuordnung">
            </div>
            <div style="margin-top: 10px;">
                <span style="display: inline-block; background: #E53935; color: white; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; padding: 6px 18px; border-radius: 20px; box-shadow: 0 3px 10px rgba(229,57,53,0.4);">Fortgeschritten</span>
            </div>
            <div style="margin-top: 6px;">
                <span style="display: inline-block; background: rgba(255,255,255,0.9); color: #C62828; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; padding: 4px 12px; border-radius: 12px; border: 2px solid #FFCDD2;">Kognitive F&ouml;rderung</span>
            </div>
        </div>

        <!-- Decorative sparkles -->
        <div style="position: absolute; top: 240px; left: 280px; width: 8px; height: 8px; background: #FDD835; border-radius: 50%; box-shadow: 0 0 14px 4px rgba(253,216,53,0.5);"></div>
        <div style="position: absolute; top: 370px; right: 280px; width: 6px; height: 6px; background: #4CAF50; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(76,175,80,0.4);"></div>
        <div style="position: absolute; top: 310px; left: 560px; width: 7px; height: 7px; background: #FF8F00; border-radius: 50%; box-shadow: 0 0 13px 4px rgba(255,143,0,0.4);"></div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 105px; left: 0; right: 0; background: linear-gradient(90deg, rgba(46,125,50,0.93) 0%, rgba(27,94,32,0.93) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.08), 0 4px 20px rgba(0,0,0,0.08);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 27px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); letter-spacing: 1.5px;">Vom Erkennen zum Verstehen!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;">
            <div style="background: white; padding: 11px 18px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); border: 3px solid #4CAF50;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #2E7D32;">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: white; padding: 11px 18px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); border: 3px solid #FF8F00;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #E65100;">Ohne Vorbereitung</span>
            </div>
            <div style="background: white; padding: 11px 18px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); border: 3px solid #E53935;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #C62828;">F&ouml;rderung</span>
            </div>
        </div>

    </div>
</body>
</html>
