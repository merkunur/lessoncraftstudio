<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Word Guess Challenge - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(180deg, #FFFFFF 0%, #FAF5FF 50%, #F5F3FF 100%);">

        <!-- Colorful blurred circle splashes -->
        <div style="position: absolute; top: 100px; left: 60px; width: 140px; height: 140px; background: rgba(107,33,168,0.12); border-radius: 50%; filter: blur(35px);"></div>
        <div style="position: absolute; top: 220px; right: 70px; width: 160px; height: 160px; background: rgba(236,72,153,0.12); border-radius: 50%; filter: blur(40px);"></div>
        <div style="position: absolute; bottom: 250px; left: 80px; width: 180px; height: 180px; background: rgba(56,189,248,0.10); border-radius: 50%; filter: blur(50px);"></div>
        <div style="position: absolute; bottom: 350px; right: 50px; width: 150px; height: 150px; background: rgba(249,115,22,0.12); border-radius: 50%; filter: blur(35px);"></div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 20px; left: 20px;">
            <div style="width: 85px; height: 85px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(249,115,22,0.5); transform: rotate(-10deg);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 26px; font-weight: 700; color: white;">FREE</span>
            </div>
        </div>

        <!-- Main GUESS! title - large rainbow gradient -->
        <div style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%); text-align: center;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 130px; font-weight: 700; background: linear-gradient(90deg, #6B21A8 0%, #EC4899 20%, #F97316 40%, #FBBF24 60%, #22C55E 80%, #38BDF8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -3px;">GUESS!</h1>
            <p style="margin: -10px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 42px; font-weight: 600; color: #6B21A8;">The Word Challenge!</p>
        </div>

        <!-- Exploding letter tiles -->
        <!-- Letter C -->
        <div style="position: absolute; top: 210px; left: 55px; width: 65px; height: 65px; background: linear-gradient(145deg, #6B21A8 0%, #4C1D95 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); transform: rotate(-18deg);">
            <span style="font-size: 42px; font-weight: 700; color: white;">C</span>
        </div>

        <!-- Letter A -->
        <div style="position: absolute; top: 195px; right: 65px; width: 62px; height: 62px; background: linear-gradient(145deg, #22C55E 0%, #16A34A 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); transform: rotate(14deg);">
            <span style="font-size: 40px; font-weight: 700; color: white;">A</span>
        </div>

        <!-- Letter T -->
        <div style="position: absolute; top: 380px; left: 40px; width: 58px; height: 58px; background: linear-gradient(145deg, #38BDF8 0%, #0EA5E9 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); transform: rotate(-10deg);">
            <span style="font-size: 38px; font-weight: 700; color: white;">T</span>
        </div>

        <!-- Letter ? -->
        <div style="position: absolute; top: 410px; right: 45px; width: 60px; height: 60px; background: linear-gradient(145deg, #EC4899 0%, #DB2777 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); transform: rotate(12deg);">
            <span style="font-size: 40px; font-weight: 700; color: white;">?</span>
        </div>

        <!-- Letter B -->
        <div style="position: absolute; bottom: 230px; left: 75px; width: 55px; height: 55px; background: linear-gradient(145deg, #FBBF24 0%, #D97706 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); transform: rotate(20deg);">
            <span style="font-size: 36px; font-weight: 700; color: white;">B</span>
        </div>

        <!-- Letter ! -->
        <div style="position: absolute; bottom: 210px; right: 80px; width: 58px; height: 58px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); transform: rotate(-15deg);">
            <span style="font-size: 38px; font-weight: 700; color: white;">!</span>
        </div>

        <!-- Letter _ (underscore/blank) -->
        <div style="position: absolute; top: 310px; left: 110px; width: 52px; height: 52px; background: linear-gradient(145deg, #8B5CF6 0%, #7C3AED 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); transform: rotate(8deg);">
            <span style="font-size: 36px; font-weight: 700; color: white;">_</span>
        </div>

        <!-- Letter ? (second) -->
        <div style="position: absolute; top: 300px; right: 110px; width: 50px; height: 50px; background: linear-gradient(145deg, #DC2626 0%, #B91C1C 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 4px 4px 0 rgba(0,0,0,0.2); transform: rotate(-6deg);">
            <span style="font-size: 34px; font-weight: 700; color: white;">?</span>
        </div>

        <!-- Center worksheet -->
        <div style="position: absolute; top: 270px; left: 50%; transform: translateX(-50%); z-index: 10;">
            <div style="width: 320px; height: 416px; background: white; border-radius: 15px; box-shadow: 0 15px 50px rgba(0,0,0,0.25), 0 0 0 5px #F97316; overflow: hidden;">
                <img src="https://www.lessoncraftstudio.com/samples/english/word%20guess/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Fun Worksheet">
            </div>
        </div>

        <!-- Speech bubble - I GOT IT! -->
        <div style="position: absolute; top: 310px; right: 95px; z-index: 15;">
            <div style="background: #22C55E; padding: 14px 22px; border-radius: 20px; position: relative; box-shadow: 0 4px 15px rgba(34,197,94,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 700; color: white;">I GOT IT!</span>
                <div style="position: absolute; bottom: -12px; left: 25px; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 14px solid #22C55E;"></div>
            </div>
        </div>

        <!-- Circular burst - SO FUN! -->
        <div style="position: absolute; top: 520px; left: 80px; z-index: 15;">
            <div style="width: 105px; height: 105px; background: linear-gradient(145deg, #F97316 0%, #FBBF24 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 20px rgba(249,115,22,0.5); transform: rotate(-10deg);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; color: white; text-align: center; line-height: 1.1;">SO<br>FUN!</span>
            </div>
        </div>

        <!-- Confetti and sparkles -->
        <div style="position: absolute; top: 170px; left: 180px; font-size: 28px;">✨</div>
        <div style="position: absolute; top: 250px; right: 175px; font-size: 24px;">🎉</div>
        <div style="position: absolute; top: 460px; left: 165px; font-size: 22px;">⭐</div>
        <div style="position: absolute; bottom: 290px; right: 175px; font-size: 26px;">✨</div>
        <div style="position: absolute; top: 360px; left: 125px; font-size: 20px;">💫</div>
        <div style="position: absolute; bottom: 360px; right: 145px; font-size: 22px;">🌟</div>

        <!-- Hearts -->
        <div style="position: absolute; top: 290px; left: 195px; font-size: 24px; transform: rotate(15deg);">❤️</div>
        <div style="position: absolute; bottom: 310px; right: 195px; font-size: 20px; transform: rotate(-10deg);">💖</div>
        <div style="position: absolute; top: 510px; right: 205px; font-size: 18px; transform: rotate(8deg);">💕</div>

        <!-- Bottom pill - Kids LOVE This! -->
        <div style="position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);">
            <div style="background: linear-gradient(145deg, #EC4899 0%, #DB2777 100%); padding: 16px 45px; border-radius: 40px; box-shadow: 0 6px 25px rgba(236,72,153,0.5);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 34px; font-weight: 700; color: white;">Kids LOVE This!</span>
            </div>
        </div>

        <!-- Grade badge - bottom corner -->
        <div style="position: absolute; bottom: 25px; right: 25px;">
            <div style="background: #4C1D95; padding: 10px 20px; border-radius: 20px;">
                <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; color: white;">GRADES K-1</span>
            </div>
        </div>

    </div>
</body>
</html>
