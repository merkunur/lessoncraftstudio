# Teaching package — spell tier-1 high-frequency sight words
# Arc 13 Phase 2 (Option G CONTINUATION; spelling-and-encoding 1/5 → 2/5).
# Resolves Arc 12 spell-cvc-words forward-pointer.

targetSlug: spell-high-frequency-sight-words-tier-1
language: en
title:
  en: "Sight Words — spell the, is, and, I, a"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching tier-1 sight word spelling. Builds on Arc 12 spell-cvc-words. RESOLVES Arc 12 forward-pointer ('spell HIGH-FREQUENCY SIGHT WORDS — common short words like the, is, and, I that don't follow CVC patterns + need to be memorized'). Tier-1 sight words: the, is, and, I, a, to, of, you, for, in. These 10 words appear in ~25% of K-3 reading text; rapid sight-recognition is foundational reading fluency. 5 exercises + 7 materials over 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class sight-word display. Teacher writes 10 tier-1 sight
      words on cards; says + spells each. 'These words appear A LOT
      in reading. We don't sound them out — we MEMORIZE them so we
      can read them quickly. THE: T-H-E. IS: I-S. AND: A-N-D.' Class
      chants spellings.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sight-word drill routine. Each pair receives 10
      sight-word flashcards. Pair takes turns: kid A flashes a card;
      kid B reads + spells. Aim for INSTANT recognition, no sounding-
      out. Recast errors with explanation ('you spelled THE as T-H —
      missing the e at the end. THE has 3 letters: T, H, E. Practice:
      T-H-E, the').
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: vocabulary-tracing-strips with
      sight words. Station 2: word-scramble (sight word letters).
      Station 3: manipulative cut-outs sight-word construction.
      Station 4: matching worksheet (image-context-with-sight-word).
  closure:
    durationMinutes: 5
    body: |
      Whole-class sight-word quiz. Teacher dictates 5 sight words;
      class writes each. Forward-pointer: 'Today we learned tier-1
      sight words. When we come back next, we will learn TIER-2
      sight words — go, see, was, like, said — adding to our growing
      sight-word bank.'

