compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial / visual-discrimination.
    Secondary strand: vocabulary acquisition (vocab-anchored — naming
    the colored image before matching to shadow). Tertiary strand:
    spatial-reasoning (silhouette recognition requires holding shape
    in mind independent of color/texture).

    Vocab-anchor framing: same Phase 2 interpretation. Visual-
    discrimination domain target is the architectural shape; vocabulary-
    anchor is the pedagogical thread. Kids practice match-name-and-find-
    shadow — three skills in one task.

    Distinctive composition: 4 shadow-match exercises (positions 1, 3, 4,
    5) across 4 theme contexts (animals, vehicles, shapes, fruits) + 1
    matching at position 2. Higher app-density reflects the visual-
    discrimination depth — kids practice silhouette recognition across
    diverse object categories. matching at position 2 reinforces
    vocabulary anchor.

    Cross-package thematic complement: match-image-to-shadow pairs with
    Arc 5 Phase 2's identify-2d-shapes-basic + identify-3d-shapes —
    kids match shapes (clean silhouette work) before matching theme-
    object silhouettes (more complex shapes; same architectural
    pattern).

    Class B FLEXIBLE substrate: composes against image-library breadth
    via shadow-match app's themeSelect parameter. Substrate-readiness
    measured by theme-coverage diversity (4 themes used here all CLEAN
    per Arc 1-5 work).

    K-3 multilingual classroom relevance: silhouette-recognition is a
    universal pre-literacy / visual-perception skill. Vocab-anchor makes
    the package contribute to language acquisition simultaneously —
    high-leverage time use in K-3 multilingual classrooms.

curriculumStandards:
  - EYFS.ELG.M
  - EYFS.ELG.UW
  - IB-PYP.HowTheWorldWorks

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Match colored images to their shadows in 8 of 10 trials.
      - Name the colored image before matching in 8 of 10 trials
        (vocabulary-anchor verification).
      - Articulate the rule ("the shadow has the same shape as the
        object") when prompted.

    Differentiation:
    - Pre-K: 4-image sets with clear shape contrasts.
    - K: 6-8 image sets with subtler shape distinctions (e.g.,
      cat-vs-dog silhouettes share more shape than cat-vs-airplane).
    - Grade 1+: extend to match-image-piece-to-whole + find-missing-
      piece (Phase 2 companions) — visual-discrimination depth.

