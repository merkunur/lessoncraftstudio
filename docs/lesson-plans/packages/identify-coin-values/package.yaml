assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify all 5 USD coin types (penny, nickel,
        dime, quarter, dollar bill) by name when shown
        the coin image in 8 of 10 trials.
      - State the value of each coin (1¢ / 5¢ / 10¢ /
        25¢ / $1) when shown the coin image in 7 of 10
        trials.
      - Distinguish appearance-vs-size paradox (recognize
        that dime is smaller but worth more than nickel)
        in 6 of 10 trials.
      - Count by coin value (count by 1s with 5 pennies;
        count by 5s with 5 nickels; count by 10s with 5
        dimes; count by 25s with 4 quarters) in 5 of 10
        trials.
      - Use vocabulary 'penny' / 'nickel' / 'dime' /
        'quarter' / 'dollar' / 'cent' / 'worth' / 'value'
        correctly in 5 of 10 productive-language trials.

    Differentiation:
    - Pre-K: skip coin-value identification entirely;
      review number-value recognition first (per Arc 12
      count-objects-1-to-20).
    - K: introduce penny + nickel + dime only (skip
      quarter + dollar bill); focus on the 1¢ / 5¢ / 10¢
      values which align with K-level skip-counting work.
    - Grade 1: full 5-coin identification but limited
      counting fluency (count by 5s with nickels OK;
      count by 25s with quarters is hard at Grade 1).
    - Grade 2: full 5-coin identification + skip-counting
      by coin values + bridge to pair-partner recognize-
      money-amounts-up-to-1-unit for word-problem work.
    - Grade 3+: extend to coin combinations + making
      change + comparing prices + introducing dollar
      bills $5 / $10 / $20 (beyond the K-3 scope of
      this package).

