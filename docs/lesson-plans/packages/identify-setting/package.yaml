assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the setting of a familiar read-aloud
        story in 8 of 10 trials.
      - Identify the setting of a NEW story (with teacher
        read-aloud) in 6 of 10 trials.
      - Distinguish indoor settings (home, school,
        supermarket) from outdoor settings (park, farm,
        beach) in 8 of 10 trials.
      - Articulate the identification reasoning ('I know
        the story happens at the farm because the pictures
        show a barn + animals + fields') in 5 of 10
        productive-language trials.
      - Use vocabulary 'setting' / 'place' / 'where' /
        'background' correctly in 6 of 10 productive-
        language trials.

    Differentiation:
    - Pre-K: read-aloud + picture-cue setting spotting
      (no formal setting distinction); kids simply name
      'where the story happens'.
    - K: full setting identification with familiar
      stories + simple new stories; teacher read-aloud
      heavily supported; indoor-vs-outdoor sorting
      practiced.
    - Grade 1: independent setting identification in
      simple new stories; bridge to character-vs-setting
      distinction with pair-partner identify-main-
      character; introduce setting-shift recognition
      (stories where characters travel between places).
    - Grade 2+: setting-shift recognition; abstract
      settings (historical times; imaginary worlds);
      distinguishing physical setting from cultural/
      temporal setting; bridge to identify-problem-and-
      solution (Grade 1+ Arc 18+ candidate; the
      problem-and-solution work depends on understanding
      both who is there + where they are).

