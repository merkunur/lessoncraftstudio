compositionalRationale:
  en: |
    Primary strand: math / numeral-recognition (numerals 21-100;
    deepens Phase 1 foundation 1/4 → 2/4). Secondary strand:
    numeracy (extended counting + hundreds-chart navigation).
    Tertiary strand: cognitive-and-executive-function / pattern-
    recognition (extending numeral-recognition from 1-20 to 21-
    100 leverages tens-pattern).

    Architectural significance: deepens numeral-recognition strand
    from 1/4 to 2/4. Builds directly on Arc 15 Phase 1 recognize-
    numerals-1-to-20 foundation. Critical scaling work — extends
    numeral-recognition from one-and-two-digit range to full two-
    digit range. Foundation for hundred-chart navigation +
    extended-counting + place-value-aware reading.

    Distinctive composition: 1 matching + 2 pattern-train + 1
    missing-pieces + 1 more-less. Pattern-recognition emphasized;
    hundreds-chart context anchored throughout.

    Class B FLEXIBLE substrate: composes against miscellaneous
    theme; numeral-recognition uses abstract numerical
    representation. Hundreds-chart-mat material is the canonical
    extended-range substrate.

    K-3 multilingual classroom relevance: numeral SYMBOLS are
    universal across 11 platform locales (Hindu-Arabic). Number
    WORDS for 21-100 vary significantly: en (twenty-one to one-
    hundred); es (veintiuno-veinticuatro; treinta-cuarenta-
    cincuenta-sesenta...); de (einundzwanzig...; reverse-decade
    pattern); fi (kaksikymmentäyksi...; agglutinative). Locale-
    variant work at Phase 3+ adapts to each locale's number-word
    system in the 21-100 range.

