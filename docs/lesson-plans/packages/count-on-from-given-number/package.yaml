# Teaching package — count on from a given number
# Arc 4 Phase 3 numeracy package. Continue counting from any number within
# range without restarting from 1; bridges to addition. CCSS.K.CC.A.2 alignment.
# Prerequisite: count-objects-1-to-20 (kid must already have 1-20 fluency).

targetSlug: count-on-from-given-number
language: en

title:
  en: "Count On From a Given Number"
description:
  en: "Kindergarten numeracy package teaching count-on (continue counting from any starting number 1-20 without restarting from 1). Bridges from counting (count-objects-1-to-20) to addition (add-within-10). chart-count + addition app heavy; manipulative-cut-outs for concrete continuation drill. 5 exercises + 6 materials over a 1-2 week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class chant. Teacher claps and starts counting from a non-1 number:
      "Five... six... seven..." Class joins in chorally. Re-start from a new
      number: "Eight... nine... ten... eleven..." Teach kids that counting can
      START anywhere — they don't have to rewind to 1 every time. Reinforce:
      "Where do we start? Where do we stop?"
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("Start at 4. Count: 5, 6, 7.
      We added 3 more. Now we have 7."). Choral reading of count-on patterns.
      Pair work: kid A names a starting number (say 6); kid B counts on by
      3 ("seven, eight, nine"). Then trade roles. Recast errors via finger
      counting from the start number.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: chart-count worksheet (kid counts a
      pictured group, writes the total). Station 2: addition image-number
      worksheet (kid sees N + M with M as a small number; kid counts on
      from N). Station 3: manipulative cut-outs count-on game — kid lays
      down N items, partner adds M more one at a time while saying the
      running total.
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names a starting number and a step
      size ("Start at 5, count on 4"); kids show the final number on
      fingers. Forward-pointer: "Today we counted on without starting from
      1. When we come back to numbers next, this will help us add — count-on
      IS adding."

