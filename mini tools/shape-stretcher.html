<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Shape Stretcher — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- TOOL #57 - THE SHAPE STRETCHER. A tilt and a skew look alike and
       are not alike: both make a square lean, one costs nothing, the
       other destroys a defining property and hands you a different
       shape. Everything else on this platform DEALS a shape already
       transformed and asks the child to classify it; nothing lets the
       child perform the transformation and cross the boundary.

       Three tracks over one integer ladder, reachable by drag, by tap
       and by keyboard. The tags - all-sides-equal, and the little square
       at a right angle - are computed from the FORM alone. Rotation is
       an input to the renderer and to nothing else, which is why the
       turn dial carries no notches: the detent set is the set of values
       where crossing flips a tag, and for rotation that set is empty.
       The apparatus says so in its own furniture before anyone touches
       it. It loads NO ART and NO AUDIO beyond the shell's own pop. -->

  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/shape-stretcher.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    LCS.mount(ShapeStretcher, { mount: '#lcs-root' });
  </script>
</body>
</html>
