# Teaching package — navigate complex multi-route mazes
# Arc 10 Phase 1 (Path B; fine-motor-and-visual-spatial / spatial-reasoning
# strand depth). Class B FLEXIBLE; vocab-anchored. Builds on Arc 8 Phase 1
# navigate-simple-maze. RESOLVES Arc 8 navigate-simple-maze forward-pointer
# ("when we come back to mazes next, we'll explore mazes with MULTIPLE
# PATHS — kids choose between paths").

targetSlug: navigate-complex-maze
language: en
title:
  en: "Maze Choices — pick the right path through complex mazes"
description:
  en: "Grade 1+ fine-motor-and-visual-spatial package teaching complex maze navigation with multiple-route decisions. RESOLVES Arc 8 navigate-simple-maze forward-pointer to multi-path mazes. Builds on simple-maze classic-maze foundation — kids now navigate mazes with multiple possible routes + choose the optimal path (shortest, treasure-collecting, etc.). Develops spatial-reasoning + executive-function (path-comparison, planning-ahead-multiple-steps) + fine-motor (longer pencil-traced paths). Uses picture-path app choose-path mode. Vocab-anchored — kids name objects at start/end + describe path direction. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class multi-route routine. Teacher draws a simple maze with
      TWO paths from Start to Finish on the board. Class observes both
      paths. "Which path is SHORTER?" Kids count steps on each path.
      Teacher narrates: "Path A has 7 steps; Path B has 9 steps. Path
      A is shorter." Reinforces multi-path framing — when there's more
      than one path, we choose which one to take + we have a REASON
      for the choice.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + path-decision routine. Each kid receives a multi-
      route maze. Kid traces both paths with a finger, then chooses
      one to draw with pencil. Partner verifies. Teacher circulates:
      recasts errors with explanation ("you drew the longer path —
      let's look at the shorter one. Trace path A — it has fewer
      cells. Now trace path B — it has more cells. Path A is
      shorter"). Optional extension: kids design treasure-trail mazes
      where one path collects more treasures than the other; partner
      decides which path is BEST given the treasure-collection goal.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-path choose-path worksheet
      (kids navigate multi-route mazes; reinforces path-decision).
      Station 2: picture-path classic-maze worksheet (single-path
      mazes as bridge from Arc 8). Station 3: manipulative cut-outs
      hands-on multi-route maze construction (kids build mazes with
      2 paths + label which is shorter). Station 4: matching worksheet
      (image-name reinforces start/finish vocabulary).
  closure:
    durationMinutes: 5
    body: |
      Whole-class maze-choice quiz. Teacher displays a final multi-
      route maze; class collectively traces both paths + picks the
      shorter (or treasure-richest) one. Forward-pointer: "Today we
      navigated mazes with multiple choices. When we come back to
      spatial work next, we'll learn to give DIRECTIONS through mazes
      to a partner — productive-language counterpart to today's
      receptive maze-solving."

