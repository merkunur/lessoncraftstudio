thematicCoherence:
  en: |
    All 5 packages cohere around the things-that-fly theme + bridge
    vehicles-cluster (flying machines) with biological-classification
    (flying creatures) through dual-flying-context anchor.

    **Pedagogical sequencing:**
    1. **identify-and-name-vehicles** — Foundational vehicle vocabulary
       extended to flying-machine subset (airplane, helicopter, rocket,
       hot-air-balloon, paper-airplane). Same shared package with
       vehicles-bundle (cluster reuse — broader vehicle vocab; things-
       that-fly-bundle anchors at flying subset).
    2. **identify-living-vs-nonliving** — Biological-classification
       work applied to things-that-fly (distinguish flying-machines vs
       flying-creatures: birds + butterflies + bats vs airplanes +
       helicopters + rockets). Same shared package with 9 animal-cluster
       bundles; things-that-fly-context bridges biology + vehicle clusters.
    3. **count-objects-1-to-10** — Counting practice using flying items
       as countable subjects (5 airplanes in the sky; 3 helicopters in
       formation; 7 hot-air-balloons at the festival; 8 birds in a flock).
       Same shared package across many bundles; flying-context engaging
       for K-3 imagination + observation.
    4. **sort-by-category** — Category-classification work
       distinguishing flying-machines (airplane, helicopter, rocket,
       hot-air-balloon) vs flying-animals (bird, butterfly, bat,
       dragonfly) vs flying-toys (kite, paper-airplane, frisbee,
       drone). Same shared package; flying-context enables multi-axis
       categorization (mechanical vs biological vs toy; powered vs
       wind-driven; manned vs unmanned).
    5. **use-size-comparison-words** — Comparison work using flying-
       size contrasts (big jumbo-jet vs small paper-airplane; tall
       hot-air-balloon vs short kite; heavy helicopter vs light
       butterfly; fast jet vs slow blimp). Same shared package; flying-
       size variation provides vivid contrast substrate.

    **Strand spread:** 1 vocabulary-acquisition (vehicles extended to
    flying subset) + 1 living-things (classification) + 1 numeracy + 1
    cognitive-sorting + 1 comparison. **5 distinct strands.** Cross-
    strand vehicles-cluster + biology crossover bundle pattern parallel
    to hospital-bundle (community-context + emotion-regulation crossover)
    + tools-bundle (home-context + occupations crossover).

    **Suggested unit duration:** 4-5 weeks (1 package per week).
    Natural fit alongside transportation + nature units. Particularly
    engaging for K-3 — flying-things have high imagination + observable-
    sky appeal; classroom-window observation week works year-round.

    **Multilingual classroom relevance:** flying vocabulary cognate-rich
    Romance (volar / voler / volare / voar); Germanic-distinct (fliegen
    / vliegen / flyga / lentää). Specific flying-machine vocabulary
    varies (airplane / Flugzeug / avión / avion / aereo / avião / flygplan
    / lentokone). Universal sky-observation relevance — every K-3 kid
    encounters flying things daily.

    **Pillar 2 architectural pattern:** things-that-fly-bundle exemplifies
    cross-cluster crossover bundle (vehicles + biology). Theme-axis-key
    vehicles-cluster-flying (vs vehicles-bundle at broader land+air+sea
    anchor). Precedent for similar cross-cluster crossover bundles where
    a theme spans multiple natural clusters (things-that-swim, things-
    that-climb candidates).
