description:
  en: "K-3 bundle centered on bakery as daily-life cluster anchor — extends breakfast-bundle + at-the-supermarket-bundle into baking-specific context. 5 packages span vocabulary-acquisition (identify-and-name-foods — breads, cakes, cookies, pastries, donuts, muffins, croissants) + numeracy (count-objects-1-to-10 — counting cupcakes, loaves of bread, cookies) + comparison (compare-quantities-more-fewer — more cookies than donuts in the case?) + cognitive-sorting (sort-by-category — sweet baked goods vs savory baked goods; or by flour-type) + sensory-properties (describe-physical-properties-of-objects — soft bread, crispy crust, sweet pastry, warm donut). Cross-strand daily-life cluster bundle with strong sensory-rich classroom experience extensions (smelling, touching, optionally tasting). Suitable for a 4-5 week classroom unit; supports K-3 multilingual classrooms with cultural-bakery + family-recipe extensions."

