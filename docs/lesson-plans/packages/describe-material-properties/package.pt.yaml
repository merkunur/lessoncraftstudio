# Teaching package — describe material properties (pt sparse-override)
# Arc 18 Phase 1.4 (22nd-consecutive pt cadence per Arc 7+ convention). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF01CI01 (identificar materiais usados no dia a dia + suas propriedades — propriedades observáveis) — BNCC Ciências da Natureza. Pair-package partner of identify-common-materials (Arc 18 P1.3). Together saturates materials-and-properties em 2/2 SAT (18º strand SAT).

targetSlug: describe-material-properties
language: pt

title:
  pt: "Duro ou Macio? Liso ou Áspero? — descrever propriedades de materiais"

description:
  pt: "Pacote de conhecimento-de-mundo para a educação infantil / 1.º ano do ensino fundamental, ensinando crianças a DESCREVER as PROPRIEDADES observáveis dos materiais comuns que já aprenderam a identificar (pré-requisito Arc 18 Fase 1.3 identify-common-materials). Pares de propriedades introduzidos: DURO vs MACIO (um bloco de madeira é DURO; uma almofada de tecido é MACIA), LISO vs ÁSPERO (o vidro é LISO; a casca de árvore é ÁSPERA), FLEXÍVEL vs RÍGIDO (papel dobra — FLEXÍVEL; metal não dobra facilmente — RÍGIDO), TRANSPARENTE vs OPACO (vidro deixa a luz passar — TRANSPARENTE; madeira bloqueia a luz — OPACA). Apoia-se DIRETAMENTE em identify-common-materials (crianças que sabem identificar os 6 materiais canônicos — madeira, plástico, metal, papel, tecido, vidro — agora descrevem como esses materiais SÃO AO TOQUE e À VISTA). Pacote de FECHAMENTO da saturação do strand: completa o strand world-knowledge / materials-and-properties em 2/2 SAT (o 18º strand parent-class SATISFEITO no catálogo; fecha o último strand zero-coverage no domínio world-knowledge). Por §A.13.30 enquadramento informal K-1: trabalho de propriedades de materiais no K é DESCRIÇÃO CONCRETA DE PROPRIEDADES OBSERVÁVEIS — as crianças tocam um material → nomeiam uma palavra de propriedade do conjunto canônico de 8 palavras organizadas em 4 pares binários. NÃO classificação formal de propriedades de materiais (que é trabalho do 2.º ano EF em diante per progressão NGSS 2-PS1). Alinhamento BNCC: EF01CI01 (identificar materiais + suas propriedades observáveis no dia a dia). 5 exercícios + 7 materiais imprimíveis ao longo de 1 semana."

structure:
  warmup:
    body: |
      Introdução de propriedades de materiais com toda a
      turma + manipulação prática de materiais. Você
      mostra 6 objetos cotidianos da sala de aula, um
      por material a partir do trabalho de identify-
      common-materials: bloco de madeira (madeira); copo
      de plástico (plástico); colher de metal (metal);
      folha de papel (papel); lenço de tecido (tecido);
      pote de vidro (vidro). Você passa um objeto pela
      roda: "Toquem o bloco de madeira. Como ELE PARECE
      AO TOQUE? DURO! Conseguem dobrar? NÃO — a madeira
      é RÍGIDA. A madeira não dobra." Repete com cada
      material introduzindo pares de propriedades:
      plástico ("DURO ou MACIO? DURO! Liso ou áspero?
      LISO! Conseguem dobrar um pouquinho? Sim — o
      plástico é FLEXÍVEL."), metal ("DURO! LISO!
      RÍGIDO! Frio ao toque."), papel ("Macio? É FINO —
      conseguem dobrar? SIM, muito FLEXÍVEL. Conseguem
      rasgar? Sim — papel RASGA fácil."), tecido
      ("MACIO! MUITO FLEXÍVEL — o tecido dobra e amassa!
      Liso? Alguns tecidos lisos, outros ásperos."),
      vidro ("DURO! LISO! E — conseguem VER ATRAVÉS
      dele? SIM — o vidro é TRANSPARENTE. A luz passa
      pelo vidro."). Ênfase do padrão: "Todo material
      tem PROPRIEDADES que podemos observar. As
      propriedades nos dizem POR QUE cada material é
      usado da forma que é. Hoje aprendemos 4 pares de
      propriedades: DURO vs MACIO; LISO vs ÁSPERO;
      FLEXÍVEL vs RÍGIDO; TRANSPARENTE vs OPACO."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de descrição de
      propriedade. Cada dupla recebe uma bandeja-de-
      descrição com 6 pequenos objetos (um por material:
      bloquinho de madeira, ficha de plástico, anel de
      metal, quadradinho de papel, retalho de tecido,
      bolinha de vidro) + 8 cartões de propriedade
      (DURO, MACIO, LISO, ÁSPERO, FLEXÍVEL, RÍGIDO,
      TRANSPARENTE, OPACO). A dupla se reveza: a criança
      A pega um objeto; a criança B toca o objeto +
      nomeia 2 propriedades em voz alta + coloca os
      cartões de propriedade correspondentes ao lado do
      objeto. Ambas as crianças dizem: "Este [material]
      é [propriedade] e [propriedade]." Recapture erros
      com comparação lado a lado ("você disse que o
      papel é RÍGIDO — mas olhem, quando eu empurro,
      ele DOBRA. Então o papel é FLEXÍVEL. O metal é
      RÍGIDO — vejam como o anel de metal não dobra mesmo
      eu empurrando forte."). Extensão opcional: a dupla
      anda pela sala + encontra um objeto mostrando cada
      propriedade; relata de volta com "Eu encontrei um
      [objeto] que é [propriedade]." Nota para o
      professor: crianças K às vezes confundem flexível/
      macio (ambos parecem "amolecidos" mas flexível
      significa DOBRA-SEM-QUEBRAR enquanto macio
      significa AFUNDA-QUANDO-PRESSIONA) e liso/
      transparente (ambos parecem "sem ondulações" mas
      liso é TEXTURA enquanto transparente é VER-
      ATRAVÉS). Trabalho explícito de comparação lado a
      lado de propriedades apoia a desambiguação. Alguns
      objetos mostram VÁRIAS propriedades (uma bolinha
      de vidro é DURA + LISA + TRANSPARENTE — três
      propriedades de uma vez!) — para o trabalho K,
      nomeiem 1-2 propriedades por objeto inicialmente;
      construa para descrições de múltiplas propriedades
      até o 1.º ano.
  scaffold:
    body: |
      Rotação por estações. Estação 1: atividade de
      correspondência — combinar cada palavra de
      propriedade (DURO, MACIO, LISO, ÁSPERO, FLEXÍVEL,
      RÍGIDO, TRANSPARENTE, OPACO) à imagem de um objeto
      mostrando essa propriedade. Estação 2: atividade
      picture-sort — separar cartões de objetos em caixas
      de pares de propriedade (caixa DURO vs caixa
      MACIO; caixa LISO vs caixa ÁSPERO); revela a
      habilidade de classificação binária de propriedade.
      Estação 3: odd-one-out — encontrar o objeto que
      NÃO mostra a propriedade nomeada (3 objetos duros
      + 1 objeto macio; a criança identifica o macio
      fora do lugar). Estação 4: atividade de
      correspondência na consolidação (imagem de objeto
      ao par de palavras de propriedade; reforça o
      pareamento canônico material-propriedade).
  closure:
    body: |
      Recapitulação rápida de propriedades + celebração
      do fechamento do strand com toda a turma. Você
      nomeia objetos cotidianos; a turma identifica uma
      propriedade de cada em coro. "Travesseiro? MACIO!
      Janela? TRANSPARENTE! Casca de árvore? ÁSPERA!
      Moeda? DURA! Jornal? FLEXÍVEL! Parede de tijolos?
      RÍGIDA! Espelho? LISO! Cortina? MACIA e FLEXÍVEL!"
      Você faz perguntas de raciocínio sobre propriedade:
      "POR QUE as janelas são feitas de VIDRO?" (Turma:
      porque o vidro é TRANSPARENTE — a luz entra!)
      "POR QUE os cobertores são feitos de TECIDO?"
      (Turma: porque o tecido é MACIO — confortável para
      dormir!) "POR QUE os garfos são feitos de METAL?"
      (Turma: porque o metal é DURO e RÍGIDO — não
      quebra nem dobra!) Aponte adiante: "Hoje FECHAMOS
      nosso trabalho com materiais! Aprendemos do que os
      materiais são feitos (na semana passada) E quais
      propriedades cada material tem (hoje). Agora
      sabemos POR QUE cada material é usado da forma
      que é — janelas de VIDRO pela transparência,
      cobertores de TECIDO pela maciez, garfos de METAL
      pela dureza. Quando olharmos para qualquer objeto
      agora, podemos perguntar DUAS coisas: 'Do que é
      FEITO?' e 'Que PROPRIEDADES esse material tem?'
      É assim que cientistas pensam sobre materiais.
      Quando voltarmos ao trabalho com materiais no 2.º
      ano EF, faremos INVESTIGAÇÕES — testando materiais
      para ver qual flutua, qual é magnético, qual é
      impermeável. Hoje construímos a fundação; as
      investigações vêm depois."

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Descrever 1-2 propriedades de 6 materiais comuns
        a partir do conjunto canônico de 6 palavras-
        vocabulário (madeira, plástico, metal, papel,
        tecido, vidro) usando o vocabulário das 8
        propriedades corretamente em 7 de 10 tentativas.
      - Identificar o par de propriedades correspondente
        (DURO-MACIO, LISO-ÁSPERO, FLEXÍVEL-RÍGIDO,
        TRANSPARENTE-OPACO) para uma palavra de
        propriedade dada em 6 de 10 tentativas.
      - Separar 12 cartões de objetos de propriedades
        mistas em 4 caixas de pares binários de
        propriedade corretamente em 5 de 10 tentativas.
      - Raciocinar sobre uso-de-material ("Por que a
        janela é de vidro? Porque o vidro é
        TRANSPARENTE.") em 5 de 8 prompts.
      - Usar o vocabulário 'propriedade' / 'duro' /
        'macio' / 'liso' / 'áspero' / 'flexível' /
        'rígido' / 'transparente' / 'opaco' corretamente
        em 5 de 10 tentativas de produção verbal.

    Diferenciação:
    - Pré-escola: pular a descrição de propriedades;
      revisar identify-common-materials (Arc 18 Fase
      1.3) para a fundação de identificação de
      materiais primeiro.
    - Educação infantil (5-7 anos): 4 pares de
      propriedades (duro/macio, liso/áspero, flexível/
      rígido, transparente/opaco) com 1-propriedade-
      por-objeto na nomeação; rotinas de comparação de
      propriedades conduzidas pela professora.
    - 1.º ano: estender a descrições de múltiplas
      propriedades ("A bolinha de vidro é DURA E LISA E
      TRANSPARENTE — três propriedades!"); introduzir
      raciocínio MATERIAL-PROPRIEDADE-USO ("Por que X é
      usado para Y?"); ponte para pensamento de
      materiais-e-engenharia.
    - 2.º ano em diante: trabalho completo NGSS 2-PS1-1
      de investigação de propriedades de materiais
      (projetar experimentos para testar propriedades:
      flutua-vs-afunda, magnético-vs-não, transparente-
      vs-opaco, absorve-água-vs-resistente-a-água);
      ponte para materiais-engenharia (quais materiais
      usar para quais trabalhos; o strand canônico de
      design de engenharia do 3.º + 4.º ano EF que
      depende dessa fundação de vocabulário de
      propriedade).

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en).
    Os campos materials, composedExercises,
    curriculumStandards e learningObjectives são herdados
    do package.yaml via merge sparse-override e não são
    repetidos aqui per a convenção Arc 7+.

    Vocabulário pt-BR canônico para descrição de
    propriedades de materiais:
    - 'propriedade' / 'propriedades' (property /
      properties) — pt-BR canônico para o conceito
      científico
    - 4 pares binários canônicos K-1:
      - 'duro' / 'macio' (hard / soft) — concordância
        de gênero variável conforme o substantivo
      - 'liso' / 'áspero' (smooth / rough)
      - 'flexível' / 'rígido' (flexible / rigid)
      - 'transparente' / 'opaco' (transparent / opaque)
    - 'observar' / 'observação' (to observe /
      observation) — vocabulário científico introduzido
      naturalmente na rotina
    - 'tocar' / 'sentir' (to touch / to feel) —
      verbos de exploração sensorial
    - 'pode dobrar' (can bend); 'não dobra' (does not
      bend); 'pode rasgar' (can tear) — verbos de teste
      de propriedade
    - 'ver através' (see through) — locução para
      transparência
    - 'duro como pedra' / 'macio como algodão' —
      expressões pt-BR populares que apoiam a fixação
      do conceito

    Convenção pt-BR vs pt-PT: ambas as variantes usam
    o conjunto canônico K-1 identicamente. Algumas
    pequenas divergências (pt-PT 'flexível' = 'flexível'
    idêntico; ambos os locales preferem 'rígido' a
    'duro' para a propriedade-de-não-dobrar — 'duro' é
    a propriedade-tátil-de-resistência-à-pressão; mas
    no registro K-1 BR ambos os termos são intercambiáveis
    em alguns contextos).

    Particularidade pt-BR para o framework de
    classificação por propriedade:
    Crianças brasileiras K-1 frequentemente conhecem
    propriedades táteis (duro/macio/liso/áspero) ANTES
    do trabalho formal de ciência (família + cuidadores
    naturalmente usam essas palavras nas interações
    cotidianas: "esse travesseiro é macio", "essa
    pedra é dura"). Este pacote sistematiza esse
    conhecimento prévio em um framework explícito de 4
    pares binários. As propriedades visuais
    (transparente/opaco) são geralmente menos
    familiares e exigem mais andaimes pedagógicos.

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF01CI01 ('Comparar características de diferentes
    materiais presentes em objetos de uso cotidiano,
    discutindo sua origem, os modos como são descartados
    e como podem ser usados de forma mais consciente')
    cobre tanto a identificação de materiais (pacote-
    parceiro identify-common-materials) quanto a
    descrição de suas propriedades (este pacote). A
    BNCC do 1.º ano EF Ciências da Natureza coloca a
    descrição de propriedades como base para o trabalho
    posterior em transformações de materiais (EF02CI01-
    04 no 2.º ano EF) + materiais e fenômenos físicos
    + reciclagem (EF03CI04 no 3.º ano EF). Este pacote
    (junto com o pacote-parceiro identify-common-
    materials) cobre o anchor EF01CI01 fundamental
    completamente.

    Ciência de materiais brasileira K-1: o currículo
    brasileiro K-1 frequentemente integra a descrição
    de propriedades com observações sensoriais
    (vista/tato) + comparação direta entre materiais.
    Este pacote alinha com essa abordagem multissensorial
    da BNCC ('os 5 sentidos como ferramentas de
    investigação científica').

    Por §A.13.30 enquadramento informal K-1: este
    pacote NÃO ensina classificação científica formal
    de materiais nem investigação experimental — apenas
    descrição observacional de propriedades. Famílias
    brasileiras às vezes perguntam por trabalho mais
    avançado (testes científicos; experimentos
    formais); o parent-take-home-letter explicita que
    o objetivo do 1.º ano EF é a descrição
    observacional fundamental, com investigação
    experimental emergindo no 2.º ano EF.

    SAT-CLOSING status: este pacote FECHA o strand
    materials-and-properties (1/2 → 2/2 SAT). É o **18º
    strand parent-class SATISFEITO no catálogo**.
    Pacote-parceiro identify-common-materials (Arc 18
    P1.3) abriu o strand; este pacote o fecha. Junto, o
    par cobre o anchor BNCC EF01CI01 completamente.
    Este é o último strand zero-coverage do domínio
    world-knowledge a ser fechado; world-knowledge
    avança 4/6 → 5/6 SAT (apenas PSED permanece parcial
    no domínio world-knowledge depois desta Fase 1.4 —
    e PSED é o Slot 4 desta mesma Fase 1.4 avançando
    3/8 → 4/8).

    **CARRY-FORWARD DE SUBSTRATO P2 per §A.13.32 sub-
    doctrine (d):** O substrato de imagem das
    vocabKeys (madeira / plástico / metal / papel /
    tecido / vidro em image library + entradas em
    image-vocabulary.js) NÃO existe ainda no Phase 1.4
    ship; a criação do substrato é adiada para o
    ciclo de fechamento P2 do Pillar 5 per §A.13.38
    decoupled-ship discipline. **Este pacote
    COMPARTILHA o substrato-gap dos materiais com o
    seu pacote-parceiro identify-common-materials**
    (Arc 18 P1.3 carry-forward). A criação do substrato
    no fechamento P2 cobre AMBOS os pacotes em uma
    única ação de criação-de-substrato (mesmas 6
    vocabKeys, mesmas necessidades de imagem).
