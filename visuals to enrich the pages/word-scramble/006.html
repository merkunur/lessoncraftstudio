<!DOCTYPE html>
<html lang="de">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">

            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.15);">U</span>

            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: #C2185B; text-shadow: none;">C</span>

            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.15);">H</span>

        <!-- S tile -->
        <div style="position: absolute; bottom: 200px; left: 55px; width: 50px; height: 50px; background: linear-gradient(145deg, #FFB300, #FFA000); border-radius: 9px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 14px rgba(255,179,0,0.3), inset 0 2px 0 rgba(255,255,255,0.25); transform: rotate(-12deg);">

            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #AD1457;">T</span>
        </div>

        <!-- Tiny sparkle dots -->
        <div style="position: absolute; top: 155px; left: 230px; width: 7px; height: 7px; background: #FFB300; border-radius: 50%; box-shadow: 0 0 10px rgba(255,179,0,0.5); opacity: 0.6;"></div>
        <div style="position: absolute; top: 290px; right: 160px; width: 5px; height: 5px; background: #FFB300; border-radius: 50%; box-shadow: 0 0 8px rgba(255,179,0,0.4); opacity: 0.5;"></div>
        <div style="position: absolute; top: 440px; left: 150px; width: 6px; height: 6px; background: #7CB342; border-radius: 50%; box-shadow: 0 0 8px rgba(124,179,66,0.4); opacity: 0.5;"></div>
        <div style="position: absolute; bottom: 350px; right: 170px; width: 5px; height: 5px; background: white; border-radius: 50%; box-shadow: 0 0 8px rgba(255,255,255,0.3); opacity: 0.4;"></div>

                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white; text-shadow: 0 2px 6px rgba(0,0,0,0.2);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 44px; right: 44px; z-index: 100; background: rgba(255,255,255,0.15); padding: 11px 22px; border-radius: 28px; border: 2px solid rgba(255,255,255,0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);">

        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 115px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 72px; margin: 0; line-height: 1.05;">
                <span style="color: #FFFFFF; text-shadow: 0 3px 20px rgba(0,0,0,0.2), 2px 2px 0 rgba(0,0,0,0.1);">BUCHSTABEN</span>
            </h1>
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 72px; margin: 2px 0 0 0; line-height: 1.05;">
                <span style="color: #FFB300; text-shadow: 0 3px 20px rgba(255,179,0,0.3), 2px 2px 0 rgba(0,0,0,0.1);">SALAT</span>

        </div>

        <!-- Tagline -->
        <div style="position: absolute; top: 282px; left: 0; right: 0; text-align: center; z-index: 40;">
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 22px; color: rgba(255,248,225,0.85); margin: 0; letter-spacing: 0.5px;">Buchstaben entwirren &mdash; mit Bildhinweisen!</p>
        </div>

        <!-- 5-Worksheet fan arrangement -->
        <div style="position: absolute; top: 330px; left: 50%; transform: translateX(-50%); width: 880px; height: 420px; z-index: 20;">

            <!-- Far-left worksheet -->

                <div style="width: 155px; height: 201px; background: white; border-radius: 7px; box-shadow: 0 6px 22px rgba(0,0,0,0.35); overflow: hidden; opacity: 0.8;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/word%20scramble/sample-4.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Buchstabensalat Arbeitsblatt">

            </div>

                    <img src="https://www.lessoncraftstudio.com/samples/german/word%20scramble/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Buchstabensalat Arbeitsblatt">
                </div>
            </div>

            <!-- Center worksheet (hero) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 20;">
                <div style="width: 235px; height: 305px; background: white; border-radius: 10px; box-shadow: 0 14px 45px rgba(0,0,0,0.4), 0 0 0 3px rgba(255,179,0,0.5), 0 0 35px rgba(255,179,0,0.12); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/word%20scramble/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Buchstabensalat Arbeitsblatt">
                </div>
            </div>

            <!-- Right worksheet -->
            <div style="position: absolute; right: 155px; top: 40px; z-index: 10;">
                <div style="width: 180px; height: 233px; background: white; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.38); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/word%20scramble/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Buchstabensalat Arbeitsblatt">
                </div>
            </div>

            <!-- Far-right worksheet -->
            <div style="position: absolute; right: 30px; top: 70px; z-index: 5;">
                <div style="width: 155px; height: 201px; background: white; border-radius: 7px; box-shadow: 0 6px 22px rgba(0,0,0,0.35); overflow: hidden; opacity: 0.8;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/word%20scramble/sample-5.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Buchstabensalat Arbeitsblatt">
                </div>
            </div>
        </div>

        <!-- Bottom ribbon banner -->
        <div style="position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <div style="position: relative; background: linear-gradient(90deg, #7CB342, #689F38); padding: 14px 55px; border-radius: 6px; box-shadow: 0 6px 22px rgba(124,179,66,0.4);">
                <!-- Left ribbon tail -->
                <div style="position: absolute; left: -18px; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 24px solid transparent; border-bottom: 24px solid transparent; border-right: 18px solid #7CB342;"></div>
                <!-- Right ribbon tail -->
                <div style="position: absolute; right: -18px; top: 50%; transform: translateY(-50%); width: 0; height: 0; border-top: 24px solid transparent; border-bottom: 24px solid transparent; border-left: 18px solid #689F38;"></div>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 21px; color: white; text-shadow: 0 1px 4px rgba(0,0,0,0.15);">W&ouml;rter entdecken, Lesen lernen!</span>
            </div>
        </div>

        <!-- Bottom feature pills -->
        <div style="position: absolute; bottom: 38px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; z-index: 50;">
            <div style="background: rgba(255,255,255,0.15); padding: 9px 20px; border-radius: 22px; border: 1.5px solid rgba(255,255,255,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: rgba(255,248,225,0.9);">Bildhinweise</span>
            </div>
            <div style="background: rgba(255,255,255,0.15); padding: 9px 20px; border-radius: 22px; border: 1.5px solid rgba(255,255,255,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: rgba(255,248,225,0.9);">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: rgba(255,255,255,0.15); padding: 9px 20px; border-radius: 22px; border: 1.5px solid rgba(255,255,255,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: rgba(255,248,225,0.9);">Sofort drucken</span>
            </div>
            <div style="background: rgba(255,255,255,0.15); padding: 9px 20px; border-radius: 22px; border: 1.5px solid rgba(255,255,255,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: rgba(255,248,225,0.9);">Farbcodiert</span>
            </div>
        </div>

    </div>
</body>
</html>
