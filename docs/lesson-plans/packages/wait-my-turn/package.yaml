compositionalRationale:
  en: |
    Primary strand: world-knowledge / personal-social-
    emotional-development (PSED; wait-my-turn — strand
    4/8 → 5/8; 50.0% → 62.5%). Secondary strand:
    cognitive-and-executive-function / memory-and-
    attention (impulse-control + delayed-gratification
    + waiting are core executive-function operations
    underlying turn-taking + line-waiting + raise-
    hand routines). Tertiary strand: early-literacy /
    speaking-and-listening (waiting-strategy narration
    + feeling-naming are productive-language work).

    Architectural significance: pair-coherent with
    Phase 1.4 Slot 4 identify-classroom-rules
    (immediate predecessor; advances PSED 3/8 → 4/8
    → 5/8 over Phase 1.4 → Phase 1.5 sequence) +
    Arc 17 P1.1 share-and-take-turns (SEL-class
    composition pattern; waiting is the EXECUTIVE-
    FUNCTION SUBSTRATE that turn-taking depends on —
    you have to be able to wait before you can take
    turns fairly). SEL emotions-bundle anchor cluster
    grows to 5-package shape post-Phase-1.5: name-
    and-describe-feelings-detailed + show-
    perspective-taking + share-and-take-turns +
    identify-classroom-rules + wait-my-turn. Cross-
    bundle reuse density advancement opportunity at
    Arc 18 P2 close-out per §A.13.25 paired-cluster
    pattern emergence at scale.

    PSED strand state-bookkeeping note: per Phase 1.4
    Round 2 audit-trail filing, share-and-take-turns
    (Arc 17 P1.1) compositionalRationale at lines
    200-220 claims "PSED strand SAT close: 7/8 → 8/8"
    (PSED fully saturated). This claim is incompatible
    with learning-targets.json PSED 8-target
    enumeration at lines 354-363 (which includes
    wait-my-turn + identify-classroom-rules + identify-
    safe-vs-unsafe-situations + make-and-name-a-friend
    + name-things-i-can-do-myself among unsatisfied
    targets at Arc 17 P1.1 ship time). The state-
    bookkeeping defect was filed as separate [FIX]
    [DOCS] commission stub at Phase 1.4 Round 2. This
    package's 4/8 → 5/8 framing aligns with learning-
    targets.json canonical state + Phase 1.4 Slot 4
    identify-classroom-rules accurate 3/8 → 4/8
    framing.

    Per §A.13.30 K-1 informal framing: K-1 impulse-
    control work is CONCRETE WAITING-STRATEGY
    RECOGNITION + APPLICATION. Kids learn that
    impatience is a NORMAL feeling (not a behavior
    problem) and that the 4 waiting-strategies are
    TOOLS for managing the feeling so the body stays
    calm. The pedagogy uses everyday classroom
    waiting-contexts (line for slide, line for
    snack, raise-hand-and-wait, waiting-for-help)
    BEFORE encountering formal executive-function
    terms ('self-regulation' / 'inhibitory control'
    / 'delayed gratification' are Grade 2+ academic
    terms; this package uses 'wait your turn' / 'be
    patient' / 'use a waiting-strategy' as K-1-
    accessible language). Formal executive-function
    pedagogy (Grade 2+) extends to inhibitory-control
    measurement + self-regulation interventions; this
    package establishes the foundation waiting-as-
    active-work pattern that later self-regulation
    work depends on.

    Multilingual / international-school context
    emphasis: cultural norms around waiting-time and
    patience vary significantly across school
    cultures globally. Some cultures expect kids to
    wait silently and motionlessly for extended
    periods; other cultures expect more
    spontaneous-call-out + active-physical-waiting.
    Some kids' home-cultural backgrounds emphasize
    waiting-as-respect-for-elders; others emphasize
    waiting-as-individual-self-discipline. The
    package deliberately frames CO-CREATED
    CLASSROOM WAITING-AGREEMENTS (some contexts
    need quiet waiting; some allow gentle activity-
    while-waiting; the strategies adapt to context)
    rather than absolute universal rules about
    how-long-to-wait-quietly. This framing aligns
    with EYFS.ELG.PSED.M.R (managing self) +
    CASEL.SELF_MANAGEMENT (managing emotions +
    delayed gratification) + IB-PYP.WhoWeAre
    (identity-and-community work).

    Cross-reference to Arc 17 P1.1 share-and-take-
    turns (SEL-class composition pattern; pair-
    coherence): that package established the SEL-
    class 6-material composition pattern at the Arc
    16 §A.13.6-firing-corrected disposition (REMOVE
    matching-mat + vocabulary-tracing-strips; KEEP
    flashcards + picture-cards + sentence-strips +
    manipulative-cut-outs + parent-take-home-letter
    + answer-key). **This package MIRRORS share-and-
    take-turns SEL-class composition exactly** +
    inherits the Phase 1.4 Slot 4 identify-classroom-
    rules word-guess Path B abstraction layer:
    composedExercises ship as cluster-theme puzzle-
    format practice (emotions vocabulary); waiting-
    strategy scaffolding lives at the lesson-body
    level (specifically station-2 strategy-to-
    scenario matching + station-3 counting-as-
    waiting-strategy + the contentActivity pair-
    routine). The two roles are layered, not
    conflated.

    Pair-coherent extension of identify-classroom-
    rules (Phase 1.4 Slot 4): that package taught
    classroom rules + reasons (the SHARED
    AGREEMENTS that let many kids learn together).
    This package teaches the EXECUTIVE-FUNCTION
    SUBSTRATE that lets kids follow those rules —
    waiting (specifically raise-hand-and-wait,
    line-wait, wait-for-help, wait-for-snack). The
    cognitive progression: KNOW the rules → WAIT
    while following them → APPLY behaviorally in
    routine contexts. Phase 1.4 Slot 4 established
    rules-knowledge; this package establishes
    waiting-behavior that lets rules-knowledge
    become rules-following.

    Distinctive composition: 5 exercises across 4
    apps — picture-sort (position 1) surfaces
    waiting-calmly-vs-not-waiting scenario sorting;
    matching (positions 2 + 5) builds scenario-to-
    strategy pairing; math-worksheet (position 3)
    introduces counting-as-waiting-strategy (the
    count-to-10 strategy through numeracy work +
    fairness-as-counting); word-guess (position 4)
    provides cluster-theme puzzle-format practice
    in the emotions vocabulary domain. Same
    composition shape as share-and-take-turns +
    identify-classroom-rules precedents EXACTLY —
    preserves cross-package SEL-class coherence
    within the growing emotions-bundle anchor.

    Materials note: 6-material SEL class-conditional
    composition per §A.13.37 + share-and-take-turns
    + identify-classroom-rules precedent. SEL class
    is case-by-case per §A.13.37 row; the share-
    and-take-turns precedent established the 6-
    material SEL-typical pattern (REMOVE matching-
    mat + vocabulary-tracing-strips because
    waiting-strategy work doesn't anchor on image-
    to-word pairing or single-word-tracing
    reinforcement; KEEP flashcards + picture-cards
    + sentence-strips + manipulative-cut-outs +
    parent-take-home-letter + answer-key). This
    package inherits the 6-material SEL composition
    exactly. Sentence-strips at position 3 with
    framePreset 'i-feel' (the i-feel frame
    accommodates BOTH emotion-naming AND waiting-
    register work via feeling-anchored frames: "I
    feel impatient when I wait for snack." / "I
    feel calm when I count to 10." — connecting
    waiting-strategy to felt classroom-experience).
    Manipulative-cut-outs at position 4 emits
    canonical-correct `mode: single-repeat` per
    §A.13.35 + share-and-take-turns + identify-
    classroom-rules precedent (same configuration:
    itemCount 24 + itemSize small-1in + theme
    emotions for cluster continuity).

    Class B FLEXIBLE substrate: composes against
    emotions theme. The Arc 16 + Arc 17 + Arc 18
    SEL package cluster (name-and-describe-feelings
    + show-perspective-taking + share-and-take-
    turns + identify-classroom-rules) used emotions
    theme; wait-my-turn continues the theme to
    preserve cross-package cluster coherence.
    emotions-bundle becomes the 5-package SEL
    anchor bundle post-Arc-18 Phase 1.5 (cross-
    bundle reuse density advancement opportunity
    for Arc 18 P2 close-out cycle per §A.13.25
    paired-cluster pattern emergence at scale).

    K-3 multilingual classroom relevance: waiting +
    patience are universal K-3 prosocial skills with
    K-3-relevant cross-cultural divergence in
    expression-norms. Cross-locale waiting-vocabulary
    varies: en 'wait / patient / impatient / your
    turn / my turn'; de 'warten / geduldig /
    ungeduldig / dein Mal / mein Mal'; es 'esperar /
    paciente / impaciente / tu turno / mi turno';
    pt 'esperar / paciente / impaciente / sua vez /
    minha vez'; fr 'attendre / patient / impatient
    / ton tour / mon tour'; nordic locales use
    shorter verb-forms matching local communication
    style. Cross-cultural classroom-norm awareness
    is universally relevant for international
    schools + dual-language programs where kids'
    home-school-cultural defaults around waiting-
    quietness diverge significantly.

    Cross-cultural affirmation discipline: package
    affirms cultural variation in waiting
    expression ('some kids are good at waiting
    silently; some kids are good at waiting while
    moving their bodies gently; both are okay if
    they don't disturb other kids') rather than
    prescribing one waiting-register. Particularly
    load-bearing for international school + dual-
    language program contexts where kids' home-
    school-cultural backgrounds diverge
    significantly in expectations around how-to-
    wait.

