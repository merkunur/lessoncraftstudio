compositionalRationale:
  en: |
    Primary strand: number sense / comparison (target compare-quantities-more-fewer).
    Secondary strand: counting (counting both groups is required to compare).
    Tertiary strand: comparative-language vocabulary (more / fewer / equal —
    integrates with the comparison task; introduces lexical comparators).

curriculumStandards:
  - CCSS.K.CC.C.6
  - CCSS.1.NBT.B.3
  - EYFS.ELG.M

assessmentCriteria:
  en: |
    By end of 1-2 week unit:
      - Identify which of two groups has more / fewer / equal in 8 of 10 trials.
      - Use comparison vocabulary (more / fewer / equal) productively.
      - Compare via image-to-number mode (count one group vs. given numeral) in
        5 of 5 trials.

    Differentiation:
    - K: image-to-image only; range 1-5.
    - Grade 1: full range 1-10; image-to-number; introduce 'equal'.
    - Grade 1+: extend to use-greater-less-equal-symbols (next adjacent target).

