# Teaching package — write own name (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 12 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# pt sparse-override for early-literacy / writing-composition strand
# (FIRST writing-composition pt sparse-override). Pt-BR naming
# conventions distinct: multiple-given-names common; surname conventions
# include both maternal + paternal surnames (cultural specificity).

title:
  pt: "Escreva Seu Nome — sua primeira palavra"
description:
  pt: "Pacote de letramento inicial para a Educação Infantil que ensina crianças a escrever o próprio nome. **PRIMEIRO sparse-override pt do fio writing-composition.** Habilidade fundamental de escrita-com-significado: o NOME PRÓPRIO da criança é o alvo canônico de primeira-palavra-escrita — significativo, motivador, auto-anclado. Constrói sobre Arc 11 trace-straight-lines + Arc 12 trace-curved-lines (fundação motora) + Arc 11 identify-uppercase-letters + Arc 12 identify-lowercase-letters (reconhecimento de letras). Especificidade pt-BR: convenções de nomeação brasileiras incluem múltiplos prenomes (frequentemente 2: 'Maria Eduarda' / 'João Pedro') + sobrenomes maternos + paternos."

structure:
  warmup:
    body: |
      Rotina de compartilhamento-de-nome com toda a turma. A professora
      ou o professor escreve o próprio nome no quadro: "Meu nome é
      [Nome do Professor/a]. Olhe enquanto eu escrevo: [letra-por-
      letra]." A turma observa cada letra se formando. A professora
      ou o professor então pergunta: "Qual é o seu nome? Você sabe
      soletrar cada letra?" As crianças soletram seus nomes em voz
      alta. Reforça nome-como-letras + introduz o conceito de que
      escrever o próprio nome é A habilidade fundamental de escrita.
      Especificidade pt-BR: muitas crianças brasileiras têm 2 prenomes
      (Maria Eduarda; João Pedro; Ana Beatriz) — o pacote pode focar
      no PRIMEIRO prenome para K-3 inicial; nome completo vem depois.
  contentActivity:
    body: |
      Trabalho em duplas + rotina de escrita-de-nome. Cada criança
      recebe uma folha-de-traçado-de-nome impressa com seu PRÓPRIO
      NOME (a professora ou o professor preparou em antecedência) —
      versão letra-tracejada + versão linha-branca. A criança traça
      o nome tracejado 3 vezes + escreve o próprio nome na linha-
      branca. O parceiro verifica. Refraseie os erros com explicação
      ("você escreveu 'M' mas seu nome começa com 'N' — vamos olhar
      o nome tracejado: N-N-A-M — linhas retas em ambos os lados +
      uma diagonal conectando-as. M tem linhas retas + uma forma de
      'V' dentro — diferente"). Especificidade pt-BR: ensine atenção
      a letras com diacríticos no nome — Ângela (Â com circunflexo),
      João (ã com til), Conceição (ç + ã), André (é com agudo). Estas
      são parte legítima do nome em pt-BR. Extensão opcional: as
      crianças escrevem seus NOMES em obras-de-arte que criam como
      etiqueta de propriedade.
  scaffold:
    body: |
      Rotação de estações. Estação 1: tiras de traçado de vocabulário
      com nomes-curtos-comuns brasileiros (estendendo além do nome
      próprio para nome-comum tracejado para prática motora adicional;
      exemplos: Ana, João, Maria, Pedro, Lucas, Júlia). Estação 2:
      folha de exercícios alphabet-train (as crianças identificam
      letras no próprio nome). Estação 3: construção prática de nome
      com recortes manipulativos (as crianças montam o próprio nome
      a partir de letra-tile recortes). Estação 4: folha de exercícios
      de emparelhamento (pares imagem-nome reforçam vocabulário de
      nome-de-letra).
  closure:
    body: |
      Exibição de nome com toda a turma. Cada criança compartilha
      seu trabalho de escrita-de-nome + diz o próprio nome em voz
      alta. A professora ou o professor afixa o nome-escrito de cada
      criança na sala de aula (etiquetas de nome em armários ou
      exibição na parede). Indicador adiante: "Hoje escrevemos
      nossos PRÓPRIOS nomes — nossa primeira palavra escrita. Quando
      voltarmos a escrita na próxima vez, vamos ETIQUETAR figuras
      com uma palavra — um passo além do nosso nome em direção a
      escrever significado em nossos desenhos."

assessmentCriteria:
  pt: |
    Traçar próprio nome corretamente (legível) em 8 de 10 tentativas.
    Escrever próprio nome independentemente (sem ajuda de traçado)
    em 6 de 10 tentativas. Identificar próprio nome impresso entre
    nomes de colegas em 8 de 10 tentativas.

    Diferenciação:
      - Pré-K: traçar próprio nome com apoio mão-sobre-mão da professora
        ou do professor; reconhecimento receptivo de nome.
      - K: escrita independente de nome; legível mesmo se não
        perfeitamente formado. Foco no PRIMEIRO PRENOME apenas para
        crianças com nomes longos.
      - Primeiro ano em diante: estender para NOME COMPLETO (prenome
        + sobrenomes maternos + paternos); ponte para label-a-picture-
        with-1-word (candidato Arco 13+) + escrita-de-frases-simples.

compositionalRationale:
  pt: |
    Fio principal: letramento inicial / writing-composition (escrita-
    de-nome-próprio). Fio secundário: motor + visual-espacial (drawing-
    and-tracing como fundação motora). Fio terciário: identidade +
    propriedade (nome da criança = auto-âncora para letramento inicial).

    Significância arquitetural: PRIMEIRO sparse-override pt do fio
    writing-composition. Escrever o próprio nome é o alvo canônico de
    primeira-palavra-escrita em qualquer locale; pacote pt-BR adapta
    para convenções de nomeação brasileiras.

    **Especificidade cultural pt-BR — convenções de nomeação:**
    - **Múltiplos prenomes comuns:** muitas crianças brasileiras têm
      2 prenomes ("Maria Eduarda", "João Pedro", "Ana Beatriz", "Lucas
      Gabriel"). K-3 trabalho de nome-próprio tipicamente foca no
      PRIMEIRO PRENOME para tornar tarefa gerenciável; nome completo
      vem em arcos posteriores.
    - **Sobrenomes maternos + paternos:** convenção brasileira inclui
      sobrenome materno seguido do paterno ("João Silva Souza" =
      Silva é da mãe, Souza é do pai). Diferente de en (sobrenome
      paterno apenas tipicamente). Crianças em escolas internacionais
      brasileiras precisam navegar AMBAS as convenções (brasileira
      em casa; internacional em formulários escolares).
    - **Letras especiais pt-BR em nomes:** muitos nomes pt-BR usam
      diacríticos canonicamente — Ângela (Â), João (ã), Conceição
      (ç+ã), André (é), Vinícius (í), Fátima (á+í), Vitória (ó),
      Augusto (sem diacrítico mas comum). Estes diacríticos são
      LETRAS LEGÍTIMAS no alfabeto pt-BR; pacote pt-BR enfatiza isso.
    - **Apelidos cotidianos:** crianças brasileiras frequentemente
      são chamadas por apelido (Maria Eduarda → Duda; João Pedro →
      Pedrinho ou JP; Ana Beatriz → Bia ou Aninha). Distinguir nome
      formal (escrito) vs apelido (falado) é parte da consciência
      de nome.

    **Per-kid customization required.** Cada nome de criança é único;
    a professora ou o professor prepara folha-de-traçado-de-nome por
    criança em antecedência. Em sala-de-aula brasileira, isso pode
    significar preparar nomes com diacríticos (impressão precisa de
    Â, ã, ç, é, í, ó). Composição de material apoia prática motora
    geral; material específico de traçado-de-nome é trabalho de
    preparação por-criança da professora ou do professor.

    Substrato Class B FLEXIBLE: composta contra a amplitude da
    biblioteca de imagens + customização por-criança de nome.
    Substrato-prontidão universal.
