assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Match 8 of 10 complex emotions to appropriate scenario
        prompts.
      - Use at least 3 complex emotion-words productively (saying
        "I feel ___") in 5 of 10 conversational trials.
      - Distinguish complex emotions from basic 4 (e.g., "this
        is FRUSTRATED, not just ANGRY — frustrated has the
        tried-and-failed part") in 4 of 6 trials.
      - Identify emotion-family groupings (happy-cluster vs sad-
        cluster vs angry-cluster vs scared-cluster) accurately
        in 5 of 8 picture-sort trials.

    Differentiation:
    - Pre-K: focus on basic 4 emotions; introduce only 2-3
      complex emotions (proud + excited + frustrated as most-
      accessible).
    - K: full 10-emotion vocabulary; scenario-anchoring
      emphasized; productive-language pressure low (recognition
      first, expression as it emerges).
    - Grade 1: full vocabulary + productive-language target;
      emotion-family groupings introduced.
    - Grade 2+: extend to 15-20 emotion-words; introduce mixed-
      emotions ("I feel proud AND embarrassed at the same
      time") + emotional-context-of-others work (empathy strand).

