compositionalRationale:
  en: |
    Primary strand: early-literacy / reading-comprehension (sentence-
    to-picture matching). Secondary strand: phonics-decoding (kids must
    read sentence to match it). Tertiary strand: vocabulary acquisition
    (vocab-anchored).

    **Architectural significance: STRAND-FIRST in reading-comprehension
    (0/10 → 1/10).** Foundational comprehension skill bridging word-
    reading (Arc 12 read-cvc-words) into meaning-extraction. Reading-
    comprehension strand opens with this package; future arcs author
    sibling targets (answer-who-what-where-questions, predict-from-
    picture-cue, sequence-3-event-story, identify-main-character + 5
    more unauthored).

    Distinctive composition: 3 matching exercises (sentence-picture
    practice repeated across themes) + 1 prepositions (positional
    sentences) + 1 word-guess. Multi-app composition spans recognition
    + sentence-construction + recall.

    Cross-strand integration: reading-comprehension + phonics-decoding
    (sibling Phase 2 read-cvc-words) + vocabulary acquisition + speaking-
    and-listening (productive sentence-explanation).

    Class B FLEXIBLE substrate: composes against vocabulary-rich themes
    + sentence-strips material capability. Universal substrate-readiness.

    K-3 multilingual classroom relevance: comprehension is target-
    language-specific but conceptually universal. Locale-variant sparse-
    overrides per Phase 3 handle locale-specific sentence patterns
    (Romance: SVO with gender-agreement; German: V2 word-order;
    Finnish: SVO with case-marking).

