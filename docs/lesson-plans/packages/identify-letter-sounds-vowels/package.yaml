# Teaching package — identify vowel letter sounds
# Arc 14 Phase 1 (early-literacy / letter-recognition 5/6 → 6/6 SATURATE).
# Resolves Arc 13 identify-letter-sounds-consonants forward-pointer.

targetSlug: identify-letter-sounds-vowels
language: en
title:
  en: "Vowel Sounds — short and long sounds for A, E, I, O, U"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching vowel letter sounds. Builds directly on Arc 13 identify-letter-sounds-consonants foundation. RESOLVES Arc 13 consonant-sounds forward-pointer ('VOWEL SOUNDS — A, E, I, O, U — which work differently because each vowel has TWO sounds, short + long'). Kids associate each vowel letter with its short sound (A = /a/ as in apple; E = /e/ as in egg; I = /i/ as in igloo; O = /o/ as in octopus; U = /u/ as in umbrella) AND its long sound (A = /ay/ as in cake; E = /ee/ as in see; I = /eye/ as in bike; O = /oh/ as in boat; U = /yoo/ as in cute). Saturating package for letter-recognition strand (6/6); critical phonics-decoding bridge enabling CVC + CVCe word-reading. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class vowel-sound routine. Teacher displays A + says
      'A makes TWO sounds. Short A is /a/ — apple. Long A is /ay/ —
      cake. /a/, apple. /ay/, cake.' Class chants. Repeat with E, I,
      O, U covering both short + long for each. Anchors words for
      each sound establish memorable handles ('apple-A' vs 'cake-A').
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + sound-and-find routine. Each pair receives 10
      picture cards (5 short-vowel anchor words: apple/egg/igloo/
      octopus/umbrella + 5 long-vowel anchor words: cake/see/bike/
      boat/cute). Pair takes turns: kid A says a vowel sound (/a/
      short OR /ay/ long); kid B finds the picture matching that
      sound. Recast errors with explanation ('you picked cake — let's
      hear it: cake-/ay/. Find a /a/ picture — apple, ant, alligator').
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: alphabet-train worksheet (vowel
      letters A-E-I-O-U). Station 2: matching worksheet (vowel-letter
      to short-vowel-anchor-picture). Station 3: word-guess (kids
      fill vowel letters in CVC frames — c_t = cat /a/; b_t = bit
      /i/). Station 4: vocabulary-tracing-strips for vowel-anchor words.
  closure:
    durationMinutes: 5
    body: |
      Whole-class vowel-quiz. Teacher names a vowel letter; class
      makes BOTH sounds (short + long) + names anchor word for each.
      Forward-pointer: "Today we learned vowel sounds — short AND
      long. When we come back next, we'll start blending consonants
      AND vowels together to read REAL words like CAT, DOG, BIG."

