assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compute subtraction within 20 correctly in 7 of 10 trials.
      - Use at least 2 subtraction strategies when solving problems
        in 6 of 10 trials.
      - Solve simple missing-operand problems (20-?=8; ?-7=12) in
        5 of 10 trials.
      - Compare subtraction results (which is greater: 18-9 or 17-7?)
        in 5 of 10 trials.

    Differentiation:
    - Pre-K: review subtraction within 10; no within-20 work.
    - K: subtraction within 15; strategy support emphasized.
    - Grade 1: subtraction within 20 fluent; multiple strategies.
    - Grade 2+: extend to two-digit subtraction with regrouping;
      bridge to subtract-within-100.

