# Teaching package — use 10 color words
# Arc 2 Phase 3c. Vocab keys verified: red, blue, yellow, green, purple, pink,
# black, white, brown, gray (10/10). Note: "orange" (color) not in IMAGE_VOCABULARY
# (only "orange" the fruit exists); substituted gray. K-3 color set is universal
# across 11 platform locales.

targetSlug: use-color-words
language: en

title:
  en: "Color Words — identify and use 10"
description:
  en: "Pre-K / K vocabulary-acquisition package for 10 color words: red, blue, yellow, green, purple, pink, black, white, brown, gray. 5 worksheet exercises + 7 printable materials. Lower duration appropriate for early-acquisition vocabulary; high kinesthetic engagement (kids point to colors in classroom)."

durationMinutes: 25

structure:
  warmup:
    durationMinutes: 4
    body: |
      Whole-class introduction. Teacher holds up color flashcards (or color cards
      printed from any color palette), names each color in target language, class
      repeats chorally. Optional: "Touch something {color}" routine — kids touch
      a classroom object matching the named color. Pin cards to "Colors" word
      wall cluster.
  contentActivity:
    durationMinutes: 10
    body: |
      Pocket-chart routine with sentence strips ("The {item} is {color}"). Choral
      reading with substituted theme images. Pair work: kids hold a color card,
      partner names color in target language. Recast errors in target frame.
      Color-attribute task: teacher names color, kids find matching item in
      classroom + name it ("the table is brown").
  scaffold:
    durationMinutes: 7
    body: |
      Station rotation. Station 1: image-letter matching (matching app, letter
      mode). Station 2: color-by-instruction worksheet — kids color images
      following target-language color directions. Station 3: picture-card
      sorting on the carpet (sort objects by color attribute).
  closure:
    durationMinutes: 4
    body: |
      Whole-class share-out. Final challenge: teacher names a color, kids touch
      something matching color. Forward-pointer: "Today we learned 10 color
      words. When we come back to colors next, this same set will be here."

