assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Trace 9 of 11 numerals recognizably on the dotted-
        line template in 8 of 10 trials.
      - Independently form 8 of 11 numerals recognizably
        (not perfectly — recognizably) in 7 of 10 trials.
      - Form the closed-loop numerals (0, 6, 8, 9) with
        proper loop-closure in 6 of 10 trials.
      - Form numeral 10 as the SEQUENCE 1-then-0 (not as
        a single shape) in 7 of 10 trials.
      - Distinguish visually-similar numerals (6 vs 9
        rotation; 3 vs E backwards; 2 vs Z) correctly in
        formation in 5 of 8 trials.
      - Use vocabulary 'numeral' / 'number' / 'shape' /
        'curve' / 'line' correctly in 5 of 10
        productive-language trials.

    Differentiation:
    - Pre-K: skip independent formation; tracing-only
      work on numerals 1-5 (the most-frequent K-level
      numerals + the simplest shapes). Pencil-grip
      development remains the primary motor goal at this
      age.
    - K: full numeral 0-10 tracing fluency; independent
      formation on numerals 1-5 + 10 (the most-common
      numerals in K texts).
    - Grade 1: full numeral 0-10 independent formation
      fluency; recognizability the load-bearing goal
      (not calligraphic perfection); visually-similar
      numeral disambiguation explicitly assessed.
    - Grade 2+: extend to numerals 11-20 + place-value
      writing (tens place vs ones place); bridge to
      multi-digit number writing (CCSS.2.NBT.A.3 'Read
      and write numbers to 1000 using base-ten
      numerals'). By Grade 2 most kids transition to
      print-write fluency across the full numeric range
      they encounter in word problems.

