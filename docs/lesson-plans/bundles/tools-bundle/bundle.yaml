description:
  en: "K-3 bundle centered on tools as home-context + occupations-adjacent cluster anchor bridging home-environment with adult-work-context. 5 packages span vocabulary-acquisition (identify-and-name-action-verbs — hammer, screw, drill, measure, build, fix + tool-specific action verbs) + community-roles (identify-community-helpers — carpenter, plumber, electrician, gardener, mechanic as tool-using workers) + numeracy (count-objects-1-to-10 — counting nails, screws, hammers, wrenches in toolboxes) + cognitive-sorting (sort-by-category — hammers vs saws vs measuring-tools OR by use: gardening vs carpentry vs auto-repair) + comparison (use-size-comparison-words — big hammer vs small hammer; long screwdriver vs short screwdriver; heavy wrench vs light wrench). Cross-strand home-context + occupations bridging bundle — kids see tools in family-home-garage + classroom-art-corner + community-context-worker. Suitable for a 4-5 week classroom unit; supports K-3 multilingual classrooms with home-school-bridge + occupations-awareness + practical-life-skills extensions."

