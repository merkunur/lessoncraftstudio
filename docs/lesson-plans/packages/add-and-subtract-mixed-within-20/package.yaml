compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (mixed-operation
    fluency within 20). Secondary strand: numeracy (rapid mental
    arithmetic; inverse-operation understanding). Tertiary strand:
    cognitive-and-executive-function / operation-selection
    (choosing right operation per problem).

    Architectural significance: extends Arc 12 add-within-5/10/20
    + Arc 14 Phase 4 subtract-within-5/10 + Arc 15 Phase 1
    subtract-within-20 foundations. Critical fluency bridge —
    once add and subtract are independently established, kids need
    practice CHOOSING the right operation. Inverse-operation
    understanding (knowing 7+5=12 helps with 12-5=7 + 12-7=5).

    Distinctive composition: 2 math-worksheet (vertical-mixed) + 1
    math-puzzle (missing-operand) + 1 code-addition (cross-
    challenge) + 1 matching. Mixed-operation emphasis throughout;
    code-addition introduces problem-solving variety beyond pure
    arithmetic.

    Class B FLEXIBLE substrate: composes against animals theme
    (countable; cross-arc with Arc 12-15 addition/subtraction
    themes).

    K-3 multilingual classroom relevance: mixed addition/subtraction
    fluency universally K-3 math content across 11 platform
    locales. Operation vocabulary (plus / minus / add / subtract /
    equals) Romance cognate (más/menos / plus/moins / più/meno)
    + Germanic distinct (plus / minus). Universal mathematical
    symbols (+ / - / =) cross-locale transparent.

