compositionalRationale:
  en: |
    Primary strand: early-literacy / phonological-awareness
    (isolate-final-phoneme — strand 4/9 → 5/9). Pair-coherent
    with Phase 1.1 Slot 3 isolate-initial-phoneme (reverse-end
    skill) + Phase 1.2 Slots 3+4 isolate-medial-phoneme +
    blend-phonemes-cvc (cluster completion + synthesis-side
    opening). The Phase 1.2 phonological-awareness triad
    advances the strand 4/9 → 7/9 (77.8%), positioning Phase
    1.3 for strand SAT-closure. Per §A.13.31 per-instance
    content-awareness: `isolate-initial-phoneme/package.yaml`
    (Phase 1.1 Slot 3) is the canonical Literacy 8-material
    phonological-awareness precedent — this package mirrors
    its materials + composedExercises shape with final-position
    pedagogical adaptation.

    Architectural significance: extends Phase 1.1 phoneme-
    isolation work to the word-ending position. Cognitive
    progression: initial-phoneme isolation (Phase 1.1 Slot 3;
    word-start) → final-phoneme isolation (this package;
    word-end) → medial-phoneme isolation (Phase 1.2 Slot 3;
    word-middle vowel). The 3-position phoneme-isolation
    cluster bracketing-then-filling completes when isolate-
    medial-phoneme ships next (Phase 1.2 Slot 3). The cluster
    sets up Phase 1.3 candidate segment-cvc-into-phonemes
    (full 3-phoneme decomposition) + Phase 1.2 Slot 4
    blend-phonemes-cvc (3-phoneme synthesis; reverse
    operation).

    Per §A.13.30 K-1 informal framing: K final-phoneme
    isolation work is CONCRETE SOUND-RECOGNITION at the
    word-ending position. Kids hear a word + slow it down +
    name the last sound + match it to an ending-sound picture
    or letter. The pedagogy uses everyday language ('last
    sound' / 'ending sound' / 'final sound') + introduces the
    /sound/ notation only as the SOUND-vs-LETTER distinction
    becomes load-bearing. K kids often hear the stressed
    VOWEL clearly + miss the unstressed FINAL consonant — the
    pedagogical move documented in contentActivity is SLOW-
    PRONUNCIATION with extra-stress on the final consonant
    + consonant-emphasis recasting. Some kids benefit from
    hand-cupping-the-ear to focus on word-end audition.
    Bracket-the-word framing (first + last bracket the word;
    middle fills in) makes the 3-position phoneme structure
    visible.

    **Phonological-awareness pedagogy is LOCALE-SPECIFIC.**
    Phoneme inventories + word-end syllabic structure differ
    per language. English CVC words end with consonants (cat
    /t/, dog /g/, sun /n/); the final-phoneme is typically a
    consonant. pt-BR words frequently end with vowels
    (gato /u/, perro /u/ — actually pt-BR is gato /u/ in BR
    register; the final-phoneme is typically a vowel sound
    representing word-end open syllable). This en package
    uses the English consonant-final pattern; pt variant
    requires per-locale adaptation per §A.13.34 locale-
    canonical-curriculum-divergence sub-class (FULL-OVERRIDE
    candidate; SPARSE-OVERRIDE locked at this commission per
    minimal-amendment principle).

    Per §A.13.29 ground-truth source-citation: composedExercises
    cite `REFERENCE APPS/matching.html` (imgname mode for
    picture-letter pairing) + `REFERENCE APPS/word-guess.html`
    (clue-density mode for fill-in-missing-letter work) +
    `REFERENCE APPS/picture-sort.html` (theme mode for
    ending-sound categorization) + `REFERENCE APPS/word-
    scramble.html` (unified mode for sound-letter-mapping
    word-level reinforcement).

    Cross-reference to isolate-initial-phoneme (Phase 1.1 Slot
    3; prerequisite per learning-targets.json line 38): kids
    must master initial-phoneme isolation before final-phoneme
    isolation. The skill progression is pedagogically natural:
    word-start is the most salient phoneme position (first-
    perception); word-end is the second-most-salient (last-
    perception); word-middle vowel is the LEAST salient (the
    hardest of the three; addressed in Phase 1.2 Slot 3).

    Cross-reference to identify-rhyming-pairs (Arc 10 P1):
    rhyme-family clustering surfaces naturally during final-
    phoneme isolation — words sharing an ending sound also
    rhyme (cat / hat / bat / mat share /at/ final-rime). The
    final-phoneme isolation skill connects back to earlier
    rhyme work + forward to systematic phonics decoding (word
    families: -at, -an, -in, -ot, -un).

    Materials note: 8-material Literacy class stack per
    §A.13.37 + Phase 1.1 Slot 3 canonical precedent. Materials
    structure mirrors isolate-initial-phoneme verbatim (theme:
    animals provides familiar CVC vocabulary for phoneme-
    isolation work — cat / dog / cow / pig / rat / bat / hen
    / fox give clean final-phoneme variety across common K-1
    phonemes /t/ /g/ /au/ /g/ /t/ /t/ /n/ /ks/). Manipulative-
    cut-outs at position 6 emits canonical-correct `mode:
    single-repeat` per §A.13.35.

    Distinctive composition: matching ×2 (positions 1+5) +
    word-guess (position 2) + picture-sort (position 3) +
    word-scramble (position 4). Same composition shape as
    Phase 1.1 Slot 3 isolate-initial-phoneme — phoneme-
    isolation work uses identical exercise affordances
    regardless of word-position (initial / final / medial);
    the pedagogical surface adapts via teacher framing
    + worksheet text emphasis.

    Class B FLEXIBLE substrate: composes against animals
    theme (vocab-anchored with familiar K-1 vocabulary;
    cross-arc theme consistency with Phase 1.1 Slot 3 +
    Arc 10+ phonological-awareness theme pattern). No
    substrate gaps; ships clean.

    K-3 multilingual classroom relevance: final-phoneme
    isolation is universal K early-literacy content BUT
    word-end phonemic structure differs per language.
    Languages with consonant-cluster word-endings (English,
    German) emphasize final-consonant isolation; languages
    with predominantly vowel-final open-syllable structure
    (Italian, Portuguese-BR, Spanish vowel-final words)
    require different per-locale framing. The cognitive
    operation (hear word → name last sound → match to
    representation) is universal; the canonical phoneme
    targets vary per locale.

