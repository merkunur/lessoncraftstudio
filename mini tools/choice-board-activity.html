<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Choice Board — Activity — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=16">
  <!-- v7 cascade: activity-page parent forces iframe height to 66.67vh
       and renders a sage field around the iframe. These per-wrapper
       rules make the iframe body transparent (so the field shows through)
       and cascade height: 100% down to .lcs-app so the card fills the
       iframe. Shared activity-card sizing/padding/header rules live in
       lcs-shell.css scoped to .lcs-app.activity. -->
  <style>
    html, body { background: transparent !important; }
    html, body, #lcs-root { height: 100% !important; }

    /* v7.2 mobile: shrink subject (image + group items) so the 2×2 tile
       grid fits vertically. Subject 96px floor + 283px grid + prompt +
       gaps = 440px in ~376px vertical budget — overflow by 64px forces
       tile aspect-ratio break or clipping. Subject 56-80px frees ~40px;
       group items 48px (was 64px) free another ~10px. */
    @media (max-width: 599px) {
      /* !important needed: engine injects its CSS via JS at runtime (after
         this inline <style>) — equal specificity, later cascade wins. */
      .cb-subject-img { height: clamp(73px, 16vmin, 104px) !important; }
      .cb-subject--group { max-width: 240px !important; }
      .cb-subject--group .cb-group-item { max-width: 48px !important; }
      .cb-wrap { gap: clamp(10px, 2.4vmin, 16px) !important; }
      /* v7.12: cb-board grid cols → auto (size to tile) + justify-content
         center → cluster centered with only explicit gap between tiles
         (was: huge empty space because columns were 1fr but tiles content-
         sized after v7.11 place-self:center). */
      .cb-cols-2 { grid-template-columns: repeat(2, auto) !important; justify-content: center !important; }
      .cb-cols-4 { grid-template-columns: repeat(4, auto) !important; justify-content: center !important; }
      /* v7.12: WIDTH (not max-width) for uniform tile sizing regardless of
         content — fixes Which-group-has-more where 5-item tile was 241px
         while 3-item tile was 170px. Now all tiles same size; cb-group
         items scale to fit inside fixed tile width. */
      .cb-cols-2 .cb-tile { width: 76px !important; max-width: 76px !important; max-height: 76px !important; }
      .cb-cols-4 .cb-tile { width: clamp(40px, 13vw, 56px) !important; max-width: 56px !important; max-height: 56px !important; }
      /* Pin phones to the original no-wrap behaviour so the core's
         overflow-wrap (which covers the 600-767 gap + wide widths) cannot
         alter phone rendering — phones stay byte-identical. */
      .cb-tile-text { font-size: clamp(14px, 4.5vmin, 22px) !important; overflow-wrap: normal !important; hyphens: none !important; }
    }

    @media (min-width: 768px) {
      .cb-subject-img { height: clamp(156px, 21vmin, 234px) !important; }
      .cb-board { max-width: 720px !important; }
      .cb-tile { padding: clamp(16px, 2.4vmin, 24px) !important; }
      /* v7.12: same gap-reduction pattern as mobile. */
      .cb-cols-2 { grid-template-columns: repeat(2, auto) !important; justify-content: center !important; }
      .cb-cols-4 { grid-template-columns: repeat(4, auto) !important; justify-content: center !important; }
      .cb-cols-2 .cb-tile { width: 220px !important; max-width: 220px !important; max-height: 220px !important; }
      .cb-cols-4 .cb-tile { width: 150px !important; max-width: 150px !important; max-height: 150px !important; }
      .cb-wrap { gap: clamp(16px, 2.6vmin, 24px) !important; }
      /* v7.13: split tile-text font per cb-cols class. cb-cols-2 has
         220px tiles — operator wants ~2× font (44→~80) for digit
         activities (Which-Number-Bigger/Smaller). Cap at 88 so longest
         5-char word ("Solid") still fits 220px tile (≈217 width at
         80px). cb-cols-4 has 150px tiles — keep v7.11 font (44px max)
         since smaller tile + 4-tile word activities could overflow. */
      /* v7.13 capped at 88 assuming a 5-char-max word ("Solid"); that clipped
         the real long labels (even-odd "Ungerade"/"Parillinen", flat-solid
         "Lichaam"/"Kappale") on the 220px tile. Cap 64 so a 10-char word wraps
         to <=2 even lines inside the 220px-tall tile; overflow-wrap + hyphens
         break the word cleanly instead of clipping. Digits stay large (64). */
      .cb-cols-2 .cb-tile-text { font-size: clamp(44px, 11vmin, 64px) !important; overflow-wrap: anywhere !important; hyphens: auto !important; line-height: 1.06 !important; }
      .cb-cols-4 .cb-tile-text { font-size: clamp(22px, 4vmin, 44px) !important; overflow-wrap: anywhere !important; hyphens: auto !important; }
    }

    /* v7.11 universal: center cb-tile within its grid column. */
    .cb-tile { place-self: center !important; }
  </style>
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then the shared choice-board core, then this activity wrapper. -->
  <script src="/mini-tools/lcs-shell.js?v=3"></script>
  <script src="/mini-tools/choice-board-core.js?v=8"></script>
  <script src="/mini-tools/choice-board-activity.js?v=49"></script>
  <script>
    LCS.mount(ChoiceBoardActivity, { mount: '#lcs-root' });
  </script>
</body>
</html>
