# Teaching package — answer who, what, where questions about a scene
# Arc 18 Phase 1.3 (language-and-communication / reading-comprehension 5/10 → 6/10). Pair-coherent ship pattern with infer-character-feeling-from-picture-cue (slot 2 of Phase 1.3; advances strand to 7/10). Together with Arc 17 P1.5 identify-main-character + Arc 18 P1.2 identify-setting, forms the K→Grade-1 character-knowledge cluster. Builds on Arc 12 Phase 2 match-sentence-to-picture (the strand-FIRST 0/10 → 1/10 reading-comp foundation).

targetSlug: answer-who-what-where-questions
language: en
title:
  en: "Answer Who, What, Where — find the answers in the picture"

description:
  en: "Kindergarten reading-comprehension package teaching kids to identify and answer the three foundational question-words about a scene: WHO is in the picture? WHAT are they doing? WHERE are they? Builds on Arc 12 Phase 2 match-sentence-to-picture (strand-FIRST 0/10 → 1/10 reading-comp foundation; kids who can match a sentence to a picture can now extract specific elements from that picture). Reading-comprehension strand advances 5/10 → 6/10. Pair-coherent ship with infer-character-feeling-from-picture-cue (Slot 2 of Phase 1.3) and pair-coherent with Arc 17 P1.5 identify-main-character (the WHO-identification precedent) + Arc 18 P1.2 identify-setting (the WHERE-identification precedent) — together these four packages form the K→Grade-1 character-knowledge cluster. Per §A.13.30 K-1-informal framing: K work is question-answering in TEACHER-LED READ-ALOUD or PICTURE-SUPPORTED text, NOT independent decoding fluency. Kids look at a picture + listen to a question; they point to or name the WHO, WHAT, or WHERE answer. The question-words 'who' (asks about a person/character), 'what' (asks about an action or object), and 'where' (asks about a place) form the foundational triad of receptive comprehension. CCSS.RL.K.1 primary anchor ('With prompting and support, ask and answer questions about key details in a text'); CCSS.K.RL.7 visual-extension anchor. 5 worksheet exercises + 8 printable materials over a 1-week unit. Load-bearing material: sentence-strips with this-is-a framePreset (story-element anchor frames: 'This is the WHO. This is the WHAT. This is the WHERE.')."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class question-word introduction with a scene
      picture. Teacher displays a single scene picture
      featuring 1 character doing 1 action in 1 place
      (e.g., a girl playing with a ball at a park; a boy
      eating an apple at the table; a dog running in the
      forest). After the class observes: "Let me ask you
      three questions about this picture. WHO is in the
      picture?" Class names the character (the girl).
      "WHAT is she doing?" Class names the action (playing
      with a ball; OR playing). "WHERE is she?" Class
      names the place (the park). Teacher emphasizes:
      "Three question-words tell us most of a story —
      WHO, WHAT, WHERE. WHO asks about people or
      characters or animals. WHAT asks about what they're
      doing or what's there. WHERE asks about the PLACE."
      Teacher repeats with a second scene (different
      character, action, and place). Class chants the
      pattern: "WHO is in the picture? WHAT are they
      doing? WHERE are they?" Pattern emphasis: "When you
      look at a picture, ASK these three questions. The
      answers tell you what's happening."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + scene-and-question routine. Each pair
      receives 6 scene cards (each card shows a single
      character doing a single action in a single
      place — picture-supported with 1-sentence caption)
      + 18 answer cards (6 WHO cards + 6 WHAT cards + 6
      WHERE cards). Pair takes turns: kid A picks a scene
      card; kid B answers all three questions aloud
      ("Who is in the picture? The boy. What is he doing?
      Eating an apple. Where is he? At the kitchen
      table.") and finds the matching WHO + WHAT + WHERE
      answer cards. Both kids verify by laying the 3
      cards next to the scene. Then swap. Recast errors
      with question-word cues ("you answered 'a ball' for
      WHO — but 'ball' is a THING, not a PERSON. WHO asks
      about a person or animal. Look again: who is in the
      picture?"). Note for the teacher: K kids often
      conflate WHAT and WHERE (a kid playing AT THE PARK:
      'what is the kid doing? at the park' — that's a
      WHERE answer for a WHAT question). Recast with the
      action-cue ("WHAT asks about an ACTION word — a
      verb. The girl is PLAYING. Playing is the WHAT.
      The PARK is the WHERE.").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity
      (kids match each scene image to its WHO-answer
      card; the foundational who-identification
      exercise). Station 2: picture-sort activity (kids
      sort answer cards into 3 piles: WHO answers vs WHAT
      answers vs WHERE answers — surfaces the categorical
      distinction between the three question-word types).
      Station 3: missing-pieces (complete a partial scene
      by selecting the missing element — a missing
      character makes the WHO answer the load-bearing
      identification; a missing object makes WHAT;
      missing background makes WHERE). Station 4:
      matching activity at consolidation (scene to
      WHAT-answer card; reinforces action-extraction).
  closure:
    durationMinutes: 5
    body: |
      Whole-class question-word quick-recall. Teacher
      displays 3 scenes; class chorally answers all three
      questions for each. "Scene 1: who's in the picture?
      THE GIRL! What is she doing? READING! Where is she?
      THE LIBRARY!" "Scene 2: who? THE BABY! What? CRYING!
      Where? THE CRIB!" "Scene 3: who? THE CAT! What?
      SLEEPING! Where? ON THE PILLOW!" Teacher then poses
      the question-word diagnostic: "If I ask WHO, what
      kind of answer do you give?" (Class: A PERSON or
      ANIMAL!) "If I ask WHAT?" (Class: AN ACTION or
      THING!) "If I ask WHERE?" (Class: A PLACE!)
      Forward-pointer: "Today we learned three question-
      words that help us understand pictures + stories.
      WHO, WHAT, WHERE. Tomorrow we add a fourth question
      — how does the character FEEL? When we know WHO is
      in the story + WHERE they are + WHAT they're doing
      + HOW they feel, we know almost everything about
      what's happening. Reading is asking questions +
      finding the answers in the words + pictures."

