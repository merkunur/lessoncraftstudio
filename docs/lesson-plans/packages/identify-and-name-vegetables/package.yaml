# Teaching package — identify and name 10 vegetables
# Arc 5 Phase 2 (early-literacy / vocabulary-acquisition strand). 10-key
# cluster: carrot, tomato, potato, onion, lettuce, broccoli, cucumber, pepper,
# corn, pea. CLEAN against IMAGE_VOCABULARY (10/10 with full 11-locale
# entries). Vegetables-cluster is universal-recognition across the 11
# platform locales; thematic-distinct from Arc 4's foods package (which
# included composed meals + drinks).

targetSlug: identify-and-name-vegetables
language: en
title:
  en: "Vegetables — identify and name 10 common vegetables"
description:
  en: "K-Grade 1 vocabulary-acquisition package for 10 common vegetables: carrot, tomato, potato, onion, lettuce, broccoli, cucumber, pepper, corn, pea. 5 worksheet exercises + 8 printable materials. Theme-agnostic; operator selects target instruction language at material-render time. Universal-recognition vegetables prioritized for cross-cultural relevance."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up flashcards, names each
      vegetable in target language, class repeats chorally. Optional: bring
      real vegetables (or their pictures) for sensory engagement — kids
      touch, smell, examine colors and textures. Pin cards to "Vegetables"
      word wall cluster, separate from "Foods" cluster (encourages kids
      to notice category distinctions: foods we eat vs vegetables that
      grow).
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("I see a {item}"). Choral
      reading first, then individual reads. Pair work: kids hold a picture-
      card, partner names the vegetable. Recast errors in the target frame.
      Optional extension: kids share a vegetable they like ("I like
      {item}") — taps preference + family-food conversation.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: image-letter matching (matching app,
      letter mode). Station 2: picture-card sorting on the carpet (grow-
      under-ground vs grow-above-ground attribute sort — carrot/potato/
      onion vs tomato/lettuce/broccoli/cucumber/pepper/corn/pea). Station 3:
      manipulative cut-outs counting ("count out 4 carrots").
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Final challenge: teacher names a vegetable;
      kids point to flashcard. Forward-pointer: "Today we learned 10
      vegetable words. When we come back to vegetables next, we'll think
      about which colors vegetables come in — red tomatoes, orange carrots,
      green lettuce."

