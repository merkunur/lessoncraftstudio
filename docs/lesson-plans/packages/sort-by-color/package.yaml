assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Sort 8-10 mixed objects into 2 color categories with 90%+ accuracy.
      - Sort 12-15 mixed objects into 4 color categories with 75%+ accuracy.
      - Name the dominant color of each object when prompted ("What color
        is this?") in 9 of 10 trials.

    Differentiation:
    - Pre-K: 2-color sorting only (red vs blue; yellow vs green).
    - K: 4-color sorting; mixed-object substrate.
    - Grade 1+: extend to sort-by-shape + sort-by-size (Phase 3 + later)
      and to sort-by-multiple-attributes (sort by color AND shape
      simultaneously; Grade 1+ cognitive-load).

