# Teaching package — read and follow 2-sentence instruction (pt sparse-override)
# Arc 19 Phase 1.1 Slot 2 (24th-consecutive arc pt cadence per Arc 7+ convention; pt cadence increments per-arc, not per-package; all 4 Phase 1.1 pt variants share the same Arc-19 cadence anchor). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF01LP17 (compreensão de instruções escritas curtas) + EF02LP14 (leitura para ação no 2.º ano EF). STRAND-SAT-CLOSING package: completa reading-comprehension em 10/10 SAT (20º strand de classe-pai SAT).

targetSlug: read-and-follow-2-sentence-instruction
language: pt

title:
  pt: "Ler e Fazer — colocando a leitura em ação com instruções de 2 frases"

description:
  pt: "Pacote de compreensão leitora para o 1.º / 2.º ano do ensino fundamental, ensinando crianças a LER uma instrução curta de 2 frases e FAZER o que ela diz. Ponte crítica de decodificação para ação: crianças que sabem decodificar palavras CVC agora aplicam essa leitura para seguir direções simples de múltiplos passos ('Pinte o gato de azul. Desenhe um chapéu no gato.' / 'Coloque 3 estrelas no seu papel. Depois circule a estrela maior.'). Pacote STRAND-SAT-CLOSING: completa reading-comprehension em 10/10 SAT — alvo canônico final per learning-targets.json. **20º strand de classe-pai SATISFEITO no catálogo** (avança saturação agregada 25/30 → 26/30 = 86,7%). Apoia-se no pré-requisito read-cvc-words + cluster de compreensão leitora Arc 17/18. Por §A.13.30 enquadramento informal K-3: trabalho de ler-e-fazer é LEITURA-COMO-AÇÃO CONCRETA — as crianças leem uma instrução curta + IMEDIATAMENTE a executam em rotinas de sala concretas (pintar, desenhar, classificar, encontrar, apontar). Alinhamento BNCC: EF01LP17 (compreensão de instruções escritas curtas) + EF02LP14 (leitura para ação no 2.º ano EF). 5 exercícios + 8 materiais imprimíveis ao longo de 1 semana."

structure:
  warmup:
    body: |
      Atividade ler-e-fazer com toda a turma. Você escreve
      uma instrução curta de 2 frases no quadro: "Levante-
      se. Toque seu nariz." Lê em voz alta primeiro, depois
      pede à turma para ler + fazer. As crianças se levantam
      + tocam o nariz. Você escreve outra: "Sente-se. Acene
      para um amigo." As crianças fazem. Ênfase do padrão:
      "Quando LEMOS instruções, não apenas dizemos as palavras
      — nós FAZEMOS o que as palavras nos dizem. Ler é para
      FAZER coisas, não apenas para dizer sons." Você
      introduz o enquadramento sequência-de-2: "Essas
      instruções têm DUAS PARTES. Primeira frase: o que fazer.
      Segunda frase: o que fazer depois. Leiam AS DUAS
      partes. Façam AS DUAS partes em ordem."
  contentActivity:
    body: |
      Trabalho em duplas + rotina ler-e-executar. Cada dupla
      recebe 6 cartões-de-instrução (2 frases cada) + materiais
      para executar. Exemplos: "Pinte a maçã de vermelho.
      Desenhe uma folha em cima." A dupla se reveza: a
      criança A lê a instrução em voz alta; a criança B (ou
      as duas juntas) executa ambas as frases em ordem.
      Movimento pedagógico crítico: RELER em vez de corrigir
      — erros de seguir-instrução geralmente significam que
      a criança não processou completamente a frase 2; a
      releitura revela o passo perdido pedagogicamente
      enquanto reforça o hábito ler-depois-fazer. Extensão
      opcional: a dupla escreve sua própria instrução de 2
      frases + testa na outra dupla (as crianças ADORAM
      criar instruções para colegas; o trabalho de linguagem
      produtiva reforça o trabalho de leitura).
  scaffold:
    body: |
      Rotação por estações. Estação 1: folha pattern-train
      (sequenciar instruções de 2 passos em ordem). Estação 2:
      folha de emparelhamento (texto-de-instrução → imagem-
      de-resultado). Estação 3: folha missing-pieces (completar
      uma instrução parcial de 2 frases com o passo faltante).
      Estação 4: vocabulary-tracing-strips para vocabulário-de-
      ação (pintar, desenhar, circular, apontar, encontrar,
      colocar, escrever).
  closure:
    body: |
      Celebração STRAND-SAT-CLOSING + rodada-rápida ler-e-
      fazer com toda a turma. Você dá 3 instruções rápidas;
      a turma executa cada uma. "Bata palmas duas vezes.
      Depois sente-se." Você então faz o anúncio STRAND-SAT-
      CLOSING: "Hoje FECHAMOS nosso strand de compreensão
      leitora! Começamos na pré-escola com match-sentence-
      to-picture, depois identify-rhyming-pairs, depois read-
      cvc-words... e através de muitos pacotes construímos
      o conjunto COMPLETO de habilidades K-3 de compreensão
      leitora. 10 de 10 alvos PRONTOS — esse é o strand
      COMPLETO de compreensão leitora para K-3. Ler não é
      apenas pronunciar palavras; ler é para SABER e FAZER
      coisas." Aponte adiante: "Quando voltarmos ao trabalho
      de leitura, vamos avançar para consciência fonológica
      mais avançada (ouvir todos os sons nas palavras) e
      decodificação fônica (associar letras a sons em
      palavras mais longas). Esses são os fundamentos da
      leitura independente do 2.º ano em diante."

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Ler uma instrução de 2 frases de forma independente +
        executar os dois passos em ordem em 7 de 10
        tentativas.
      - Usar a estratégia de releitura quando a primeira
        execução omite um passo em 5 de 8 instâncias
        observadas.
      - Identificar o verbo de ação em cada frase de uma
        instrução de 2 passos em 6 de 10 tentativas.
      - Escrever uma instrução de 2 frases independentemente
        para um colega em 4 de 6 tentativas.
      - Usar o vocabulário 'instrução' / 'direção' / 'passo'
        / 'primeiro' / 'depois' / 'seguir' corretamente em
        5 de 10 tentativas de produção verbal.

    Diferenciação:
    - Pré-escola: pular instruções de 2 passos; revisar
      read-cvc-words + comandos de uma palavra primeiro.
    - Educação infantil (5-7 anos): apenas instruções de 1
      passo com suporte de imagem; adiar 2 passos para o 1.º
      ano+.
    - 1.º ano EF: leitura + execução completa de instrução
      de 2 passos; ênfase na estratégia de releitura; ponte
      para escrita-de-instrução-para-colega (linguagem
      produtiva).
    - 2.º ano EF em diante: estender para instruções de 3
      passos + frases multi-cláusula; introduzir consciência
      de feições-de-texto-instrucional.
    - 3.º ano EF em diante: pedagogia completa de leitura
      procedimental.

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en). Os
    campos materials, composedExercises, curriculumStandards
    e learningObjectives são herdados do package.yaml via
    merge sparse-override e não são repetidos aqui per a
    convenção Arc 7+.

    Vocabulário pt-BR canônico para ler-e-seguir-instrução K-1
    EF:
    - 'instrução' (instruction) — pt-BR canônico para texto
      curto que orienta uma ação
    - 'direção' (direction) — sinônimo de 'instrução'
    - 'passo' (step) — pt-BR canônico para parte-de-sequência
    - 'primeiro' / 'depois' / 'em seguida' (first / next /
      then) — locuções de sequenciamento K-1
    - 'seguir' (follow) — verbo canônico para
      execução-de-instrução
    - 'ler' / 'leitura' / 'leitor' (read / reading / reader)
    - 'fazer' / 'executar' (do / execute) — pt-BR canônico
    - Verbos de ação K-1: 'pintar' / 'desenhar' / 'circular'
      / 'apontar' / 'encontrar' / 'colocar' / 'escrever'
    - Frases-modelo K-1: "Primeiro... Depois..." / "Faça
      isso. Depois faça aquilo." / "Eu li, e fiz."

    Particularidade pt-BR para imperativo K-1:
    Português-BR K-1 usa duas formas imperativas distintas
    para instrução escrita:
    - Imperativo afirmativo do 'você' (mais frequente em
      contextos escolares K-1 + materiais didáticos
      brasileiros): "Pinte o gato. Desenhe um chapéu." (3.ª
      pessoa subjuntiva usada como imperativo de 'você')
    - Imperativo do 'tu' (raro em pt-BR; comum em pt-PT):
      "Pinta o gato."
    Este pacote usa CONSISTENTEMENTE imperativo do 'você'
    per convenção BR-MEC anos-iniciais. Crianças
    brasileiras K-1 reconhecem este registro como
    instruções-formais-de-sala-de-aula.

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF01LP17 ('Identificar e reproduzir, em textos
    instrucionais e prescritivos, a formatação própria
    desses textos: vocativos, lista de ingredientes ou
    materiais, instruções de execução') é o anchor BNCC do
    1.º ano EF para o trabalho de compreensão de instruções
    escritas. EF02LP14 ('Ler e compreender textos
    instrucionais, identificando a sequência de passos a
    serem seguidos para realizar um experimento, uma receita
    etc.') cobre a extensão do 2.º ano EF para sequência-de-
    passos. Junto, EF01LP17 + EF02LP14 cobrem a progressão
    1.º → 2.º ano para leitura-procedimental.

    Currículo brasileiro K-1 EF para leitura procedimental:
    A BNCC brasileira EF Língua Portuguesa Anos Iniciais
    coloca a compreensão de textos instrucionais entre os
    gêneros textuais nucleares de K-1. Este pacote alinha
    com essa abordagem. Escolas brasileiras frequentemente
    integram receitas-de-cozinha-simples + instruções-de-
    jogo + receitas-de-experiência-científica como gêneros
    instrucionais K-1.

    Por §A.13.30 enquadramento informal K-3: este pacote
    NÃO ensina pedagogia formal de leitura procedimental
    (instruções técnicas + receitas elaboradas + procedimentos
    sequenciados são trabalho do 3.º ano EF em diante). A
    ênfase do 1.º-2.º ano é leitura-em-ação como ponte
    entre fluência-de-decodificação + leitura-funcional.

    Pacote pair-coherent + STRAND-SAT-CLOSING: junto com
    Phase 1.1 Slot 1 distinguish-fiction-from-nonfiction,
    este pacote SAT-fecha o strand reading-comprehension em
    10/10 — o 20º strand de classe-pai SATISFEITO no
    catálogo.

    Per §A.13.36 cadência de cooperação CC↔assistant: o
    pacote pt herda materials, composedExercises,
    curriculumStandards via sparse-override per convenção
    Arc 7+; quaisquer emendas en (se Round 2 surgir) se
    propagam automaticamente para esta variante pt.
