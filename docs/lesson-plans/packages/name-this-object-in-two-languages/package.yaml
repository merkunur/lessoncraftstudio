assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 6 of 8 common objects in school language productively in 8
        of 10 trials.
      - Name at least 4 of 8 common objects in home language productively
        (where the kid has home-language vocabulary for the object).
      - Recognize that one object can have multiple legitimate names
        across languages (meta-linguistic awareness; demonstrated by
        accepting classmates' home-language names without correction).

    Differentiation:
    - Pre-K: receptive recognition in school language; home-language
      naming where natural.
    - K: school-language productive + home-language productive (where
      home-language vocabulary exists for the object).
    - Grade 1+: extend to notice-cognate-word-pairs (next multilingual-
      language-awareness target) — kids notice that some words are
      similar across languages (Spanish "elefante" / English "elephant"
      / German "Elefant" all share Latin root).

    Multilingual classroom note: assessment is celebratory, not graded.
    Kids who cannot produce home-language names (because the home
    language hasn't been transmitted, or because they're embarrassed in
    a multilingual classroom context) are not penalized; the package
    creates space for bilingual-identity work without compulsion.

