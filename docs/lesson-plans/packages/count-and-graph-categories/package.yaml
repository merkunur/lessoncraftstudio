compositionalRationale:
  en: |
    Primary strand: early-numeracy / data-and-graphs (chart construction).
    Secondary strand: counting-and-cardinality (kids count categories
    as input to graphing). Tertiary strand: comparison + spatial
    representation (column heights as visual count proxy).

    Architectural significance: deepens data-and-graphs strand from
    1/4 → 2/4 packages. Builds on Arc 9 Phase 1 sort-objects-by-attribute
    (sort-then-count framing). Now extends sequence to chart-construction
    — sort-then-count-then-GRAPH. Visual data-representation is
    foundational for later interpretation work (Arc 11+ candidates:
    interpret-simple-bar-graph, interpret-simple-pictograph).

    Distinctive composition: alternating picture-sort + chart-count
    rhythm (positions 1, 2, 3, 4) reinforces the sort-count-graph
    sequence pedagogically. matching at position 5 reinforces vocab
    base. The 2 picture-sort exercises across 2 different theme
    contexts demonstrate that data-graphing works across domains.

    Cross-strand integration: connects cognitive sorting strand (Arc
    5+7+8) + counting strand (Arc 1+3+8+9) + emerging data strand
    (Arc 9+10). Future data-and-graphs packages can build on the
    visual-representation foundation: interpret-simple-bar-graph,
    interpret-simple-pictograph (Arc 11+ candidates).

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Sort-and-graph works with any theme that supports meaningful
    sorting; substrate-readiness universal.

    K-3 multilingual classroom relevance: graph + data vocabulary
    (more, less, equal, most, least, taller, shorter, same as) is
    high-frequency K-3 target. Productive-language frames ('the red
    column is taller than the blue column') give structured comparative
    grammatical practice. Visual-data-representation skills are
    cross-locale universal — math + science contexts use bar graphs
    in all 11 platform locales.

