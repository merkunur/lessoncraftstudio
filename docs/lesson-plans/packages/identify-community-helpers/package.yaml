  - CCSS.K.SL.4

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 6 of 8 community helpers in 8 of 10 trials.
      - Match a helper to their tool/uniform in 7 of 10 trials.
      - Articulate what 4 of 8 helpers do ('the firefighter puts out
        fires') in 7 of 10 productive-language trials.

    Differentiation:
    - Pre-K: 4 most-familiar helpers (firefighter, police officer,
      doctor, teacher); receptive identification only.
    - K: 6-8 helpers; matching + verbal description.
    - Grade 1+: extend to identify-community-places (Arc 12+
      candidate); bridge to community-as-system thinking.

