thematicCoherence:
  en: |
    All 5 packages cohere around the accessories theme + extend clothing-
    bundle's wardrobe-vocabulary work to seasonal + cultural-fashion
    dimensions through accessory variation.

    **Pedagogical sequencing:**
    1. **identify-and-name-clothing** — Foundational wardrobe vocabulary
       extended to accessory subset (hat, scarf, belt, gloves, mittens,
       sunglasses, watch, necklace, bracelet, earrings, bag, purse).
       Same shared package with clothing-bundle (cluster reuse — pkg
       focuses on broader wardrobe; accessories-bundle anchors at
       accessory subset).
    2. **count-objects-1-to-10** — Counting practice using accessory
       items as countable subjects (5 hats in the closet; 3 scarves on
       the rack; 7 pairs of sunglasses; 8 watches in the display). Same
       shared package across many bundles; accessories-context engages
       fashion-curious K-3 students.
    3. **sort-by-category** — Category-classification work
       distinguishing head-accessories (hat, sunglasses, earrings) vs
       neck-accessories (scarf, necklace, tie) vs hand-accessories
       (gloves, mittens, watch, bracelet) vs bag-accessories (purse,
       backpack, tote) OR sorting by season (winter: scarf, mittens,
       beanie vs summer: sunglasses, sandals, sun-hat). Same shared
       package; accessory-categorization is intuitive multi-axis work.
    4. **sort-by-color** — Color-cognition work using colored-accessory
       contexts (red scarves, blue hats, green sunglasses, multi-color
       bags). Same shared package; accessory color variation provides
       vivid + concentrated color-sorting substrate.
    5. **use-size-comparison-words** — Comparison work using accessory-
       size contrasts (big hat vs small hat; long scarf vs short scarf;
       heavy bag vs light bag; wide belt vs narrow belt). Same shared
       package; accessory size variation supports practical kinesthetic
       size-estimation work.

    **Strand spread:** 1 vocabulary-acquisition (clothing extended to
    accessories) + 1 numeracy + 2 cognitive-sorting (category + color) + 1
    comparison. **4 distinct strands.** Cross-strand clothing-cluster
    extension pattern parallel to home-context cluster pattern (furniture
    + around-the-house).

    **Suggested unit duration:** 4-5 weeks (1 package per week). Natural
    fit alongside seasonal-clothing units (winter accessories week;
    summer accessories week). Particularly engaging for K-3 — accessories
    are concrete + tactile + culturally varied.

    **Multilingual classroom relevance:** accessory vocabulary cognate-
    rich Romance (accesorios / accessoires / accessori / acessórios);
    Germanic-distinct (Accessoires / accessoires / tillbehör / tilbehør /
    asusteet). Cultural-fashion variation rich: hijab + turban + kippah
    + tilak + bindi + lei vary by cultural context; bundle materials
    welcome diverse cultural-fashion traditions. Particularly load-
    bearing for international school + dual-language program contexts.

    **Pillar 2 architectural pattern:** accessories-bundle exemplifies
    cluster-pair extension — second bundle in clothing cluster extends
    wardrobe-vocabulary work to specific subset (accessories). Theme-
    axis-key clothing-cluster-accessories (vs clothing-bundle at broader
    wardrobe anchor). Precedent for similar wardrobe-subset bundles
    (footwear-bundle + outerwear-bundle candidates).
