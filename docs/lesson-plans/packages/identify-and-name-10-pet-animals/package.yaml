compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition. Secondary strand: phonics
    (matching letter mode). Tertiary strand: sorting + categorization
    (biological-class sort + housing-context sort).

    Cultural-variation acknowledgment (Arc 4 Phase 1 spec discipline): pet
    keeping varies substantially across cultures. The "pet" concept itself —
    keeping animals as companions in household space rather than as
    livestock or working animals — is a Western convention that many
    cultures share but with different species emphasis. cat/dog are
    near-universal pet referents across the 11 platform locales. The
    cage-pet cluster (rabbit/hamster/guinea-pig/gerbil) is common in
    Western European + American households; some locales may emphasize
    rabbits-as-livestock or other working-animal categories. parrot/canary
    are common in Mediterranean (Spanish, Italian, Portuguese) + Latin
    households. fish/turtle are universal aquarium pets across cultures.
    Operator-side teachers can swap region-specific pet conventions by
    editing the vocabKeys arrays.

    Sentence-strips frame variant for week 2: i-have-a ("I have a cat")
    grows from i-see-a (week 1) toward personal-experience declarative
    that connects vocabulary to lived family life. Strong K-3 home-school
    bridge — kids enthusiastically share their pet stories.

curriculumStandards:
  - EYFS.ELG.UW
  - IB-PYP.WhoWeAre

assessmentCriteria:
  en: |
    Receptive 10/10; productive 8/10; frame use 6/10.

    Differentiation:
    - Pre-K: receptive only (point-to-named-pet).
    - K / Grade 1: full productive + sentence-frame use.
    - Grade 2+: extend to pet-care vocabulary ("the dog needs water /
      the fish needs a tank") + simple comparative ("which pet is
      smaller, the hamster or the guinea-pig?") + personal-narrative
      writing ("I have a {pet}. My pet is {color/feature}.").

