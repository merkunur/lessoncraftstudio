compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (two-digit
    subtraction without borrowing — deepens strand 10/14 →
    11/14; paired inverse of Arc 17 Phase 1.2 add-2-digit-
    without-regrouping). Secondary strand: math / place-value
    (column-subtraction makes tens-and-ones structure
    operationally explicit; the no-borrow constraint keeps
    the place-value invariant clean — tens-place and ones-
    place subtraction are two independent moves, no cross-
    column traffic). Tertiary strand: numeracy (strategy-
    based subtraction: column-subtract, decomposition,
    count-back, place-value-mat enactment).

    Architectural significance: bridges Arc 15 Phase 1
    subtract-within-20 foundation → Arc 16 Phase 1.1
    subtract-within-100 (borrowing introduced there). This
    package isolates the two-digit column-subtraction
    mechanic in the no-borrow case, so kids meet place-
    value-aware subtraction + the column routine WITHOUT
    also having to manage borrowing. Once the column-
    subtraction routine is familiar, borrowing at subtract-
    within-100 becomes an addition to an existing routine
    rather than a whole new procedure. Pedagogical
    sequencing matches the standard K-3 curriculum
    progression (no-borrowing before borrowing introduces
    the algorithm in stages).

    Paired inverse companion: add-2-digit-without-regrouping
    (same arc phase) — kids meet column-addition in the no-
    carry case in parallel. The two packages share place-
    value-mat infrastructure + base-ten manipulatives +
    column-operation format, differing only in operation
    direction (combining vs. taking apart). Together they
    prepare the ground for the regrouping/borrowing
    introduction at add-within-100 + subtract-within-100;
    this paired structure mirrors the Arc 16 Phase 1.1
    pairing of add-within-100 + subtract-within-100.

    Distinctive composition: 1 subtraction (vertical format)
    + 2 math-worksheet (vertical subtraction with no-borrow
    operands) + 1 math-puzzle (missing-operand) + 1 more-
    less (compare subtraction results). Vertical format
    emphasized — column alignment is the load-bearing visual
    structure; kids learn to align tens-under-tens and ones-
    under-ones BEFORE they have to manage borrow-marks. The
    math-puzzle missing-operand work at position 3
    introduces inverse-thinking (67-?=44) which complements
    the same package's straightforward subtraction.

    Class B FLEXIBLE substrate: composes against animals
    theme (countable for subtraction work; cross-arc with
    Arc 12-16 addition/subtraction themes for consistency;
    pair-coherence with add-2-digit-without-regrouping
    which uses the same theme).

    K-3 multilingual classroom relevance: two-digit
    subtraction universal K-3 content. Two-digit number-
    word naming carries cross-locale irregularities as
    described in add-2-digit-without-regrouping (en regular;
    de reverse-decade; fr 70-99 irregular; fi agglutinative).
    The no-borrowing constraint keeps the cross-locale work
    focused on number-word fluency without simultaneously
    introducing borrow-vocabulary (which lands at subtract-
    within-100). Borrowing vocabulary varies across locales:
    en "borrow"; de "borgen"; es "pedir prestado"; pt
    "emprestar"; fr "emprunter" — that complexity stays out
    of this package's scope. Locale-variant work at Phase
    3+ adapts to each locale's two-digit number-word
    register without borrowing-vocabulary complexity.

