# Teaching package — add three numbers with sum within 20
# Arc 18 Phase 1.5 Slot 2 (math / addition-subtraction strand 13/14 → 14/14 SAT — STRAND-SAT-CLOSING; 19th parent-class strand SAT). Pair-coherent with Phase 1.3 Slot 3 add-2-digit-numbers + Phase 1.4 Slot 3 subtract-2-digit-numbers numeracy cluster. Closes the addition-subtraction strand at 14/14 — final canonical target. Per learning-targets.json, prerequisites: [add-within-20].

targetSlug: add-3-numbers-within-20
language: en
title:
  en: "Add Three Numbers Within 20 — find pairs, use 'make-10', combine all three"

description:
  en: "Grade 1 math package teaching the canonical 3-addend addition skill: kids solve a+b+c = ? problems where the sum stays within 20 (e.g., 4+5+6 = 15, 2+8+7 = 17, 3+3+4 = 10). STRAND-SAT-CLOSING package: completes addition-subtraction at 14/14 SAT — final canonical target per learning-targets.json. 19th parent-class strand SAT in the catalog (advances aggregate strand-saturation 18/30 → 19/30 = 63.3%). Builds DIRECTLY on add-within-20 (Arc 12-15 prerequisite chain) by adding a THIRD addend to the addition pattern. Critical Grade 1 numeracy skill: 3-addend addition surfaces strategy-flexibility because kids can choose WHICH TWO to add first (commutative + associative property work: 3+7+5 can be solved as (3+7)+5 = 10+5 = 15 OR as 3+(7+5) = 3+12 = 15 OR as (3+5)+7 = 8+7 = 15). The 'make-10' strategy (find two addends that make 10 first, then add the third) is the load-bearing pedagogical move: in 4+6+7, find that 4+6=10 first, then add 7 to get 17. This makes 3-addend work CONCEPTUALLY DIFFERENT from 2-addend work — the strategic choice of pair-ordering becomes the cognitive load-bearing skill. Per §A.13.30 K-3 informal framing: Grade 1 3-addend addition is STRATEGY-AWARE FLUENCY — kids understand that you can ADD IN ANY ORDER (associative property) and that some orders are EASIER than others (find-the-10 strategy). NOT formal property-naming pedagogy (terms 'commutative' / 'associative' are Grade 2+ vocabulary); the Grade 1 emphasis is strategic flexibility through multiple-strategy practice. CCSS.1.OA.A.2 primary anchor ('Solve word problems that call for addition of three whole numbers whose sum is less than or equal to 20'). 5 worksheet exercises + 7 printable materials over a 1-week unit. Load-bearing materials: matching-mat at position 3 for 3-addend-expression-to-sum pairing (kids match a+b+c expressions like 4+5+6 to their sums like 15; reinforces add-fact fluency + strategic-pair-recognition) + manipulative-cut-outs at position 5 in `mode: single-repeat` (canonical-correct per §A.13.35) with themeName: animals + itemCount 20 (enough discrete tokens for kids to physically model a+b+c with sum ≤ 20). Position 3 does NOT use place-value-mat (place-value column structure is NOT load-bearing for within-20 single-digit work — different pedagogical surface from the 2-digit cluster). Position 5 does NOT use base-ten vocabKeys (within-20 work uses discrete counting tokens, not ten-stick + ones-counter; the base-ten substrate is for 2-digit pedagogy)."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class 3-addend introduction with strategy-
      flexibility hook. Teacher writes 3+7+5 on the
      board. "Today we add THREE numbers together.
      Three plus seven plus five. What's a good FIRST
      STEP?" Class brainstorms: add 3+7 first (= 10),
      then add 5 (= 15); OR add 7+5 first (= 12),
      then add 3 (= 15); OR add 3+5 first (= 8), then
      add 7 (= 15). Teacher emphasizes: "ALL THREE
      ORDERS give the same answer — 15. But notice:
      3+7 makes 10, which is EASY to add 5 to. That's
      the 'MAKE-10' strategy — find two addends that
      make 10 first, then add the third. Make-10
      makes the work EASIER." Teacher repeats with
      4+6+7 (find 4+6=10 first, then +7 = 17); with
      2+8+9 (find 2+8=10 first, then +9 = 19); with
      6+5+4 (find 6+4=10 first, then +5 = 15). Pattern
      emphasis: "When you have THREE numbers to add,
      LOOK FOR A PAIR THAT MAKES 10 FIRST. Then add
      the third number. Make-10 is your friend for
      3-addend problems."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + strategy-flexibility addition
      routine. Each pair receives a worksheet with 8
      3-addend problems (4+6+5, 3+7+8, 2+8+6, 5+5+4,
      9+1+7, 4+4+6, 6+3+7, 2+5+8) + counting tokens
      (20 animal cut-outs per kid). Pair takes turns:
      kid A picks a problem; kid B identifies the
      make-10 pair (or alternative pair if no make-10
      pair exists) + verbalizes strategy: "I'll add
      [a]+[b] first because they make 10 (or a number
      easier to count from). Then I'll add [c]."
      Then they switch. For problems where NO pair
      makes exactly 10 (e.g., 3+4+5 = 12 no make-10
      pair), kids find the 'find-doubles' pair (5+5
      doesn't exist here; closest is 4+4 if present;
      otherwise just use any pair). Strategy diversity
      is encouraged: count-on (start at largest, count
      up by smaller two), find-doubles (look for pairs
      like 3+3, 4+4, 5+5 which are easy to recall),
      decompose (5 = 4+1; use 1 to make-10 elsewhere
      in expression). Recast errors with strategy
      reasoning ("you added 4+6+5 by going 4+6=10,
      then 10+5=15. That's the make-10 strategy.
      But you could also have done 6+5=11, then
      11+4=15. Same answer, different path. Which
      felt easier?"). Optional extension: pair invents
      a 3-addend problem with sum ≤ 20 + asks the
      other pair to solve using two different
      strategies. Teacher note: Grade 1 kids sometimes
      add LEFT-TO-RIGHT mechanically without
      strategy-awareness (4+6+5 always done as
      ((4+6)+5) even when other orderings would be
      easier). Help kids see: addition is FLEXIBLE —
      you can pick ANY ORDER, and choosing wisely
      makes the work easier. This is associative-
      property work in K-1-accessible form. Some kids
      may also struggle to recognize make-10 pairs
      quickly. Build make-10 pair fluency first (1+9,
      2+8, 3+7, 4+6, 5+5 — the 5 canonical make-10
      pairs); then make-10 strategy becomes automatic
      pattern-recognition.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity —
      match 3-addend expressions (e.g., 4+6+5) to
      their sums (15). Station 2: chart-count
      activity — count by 1s + 2s + 5s up to 20;
      reinforces count-on strategies. Station 3:
      math-puzzle (missing-addend in 3-addend: 4+?+5
      = 15; ?+6+3 = 15; identify which addend is
      missing). Station 4: math-worksheet (3-addend
      practice with mix of make-10-possible problems
      + no-make-10 problems requiring alternative
      strategies).
  closure:
    durationMinutes: 5
    body: |
      Whole-class 3-addend quick-recall + STRAND-SAT-
      CLOSING celebration. Teacher presents 5 fast
      problems; class collectively answers + names
      the strategy used. "4+6+5?" (Class works it:
      15; make-10 with 4+6.) "3+7+9?" (19; make-10
      with 3+7.) "5+5+8?" (18; doubles+8.) "2+9+8?"
      (19; make-10 with 2+8 OR with 9+1 wait 1 isn't
      here — use count-on from 9.) "6+4+10?" (20;
      make-10 with 6+4, then +10.) Teacher then
      makes the STRAND-SAT-CLOSING announcement:
      "Today we CLOSED our addition-subtraction
      work! We started in Pre-K with add-within-5,
      then add-within-10, then add-within-20, then
      add-2-digit + subtract-2-digit, and TODAY
      we finished with add-three-numbers-within-20.
      14 of 14 targets DONE — that's the complete
      addition-subtraction strand for K-3.
      Everything from here on extends what you
      learned. Multiplication next year builds on
      addition (multiplication IS repeated addition).
      Subtraction with regrouping you already
      mastered. You are READY for Grade 2 math."
      Forward-pointer: "When we come back to math
      work, we'll start MULTIPLICATION — adding the
      same number many times. 3 + 3 + 3 + 3 is just
      4 groups of 3 = 4 × 3 = 12. Multiplication
      builds DIRECTLY on the 3-addend work we did
      today. Three numbers added → many numbers
      added → multiplication shortcut."

