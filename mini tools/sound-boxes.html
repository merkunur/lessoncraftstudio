<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sound Boxes — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=18">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then this tool. Absolute /mini-tools/ paths so embeds +
       cross-context loads resolve identically. The tool fetches its word
       bank from /mini-tools/sound-boxes-bank-<lang>.json at runtime. -->
  <script src="/mini-tools/lcs-shell.js?v=3"></script>
  <script src="/mini-tools/sound-boxes.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=sv  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    // Tool-specific deep links: ?list=<stageId|custom>&word=<wordId>
    LCS.mount(SoundBoxes, { mount: '#lcs-root' });
  </script>
</body>
</html>
