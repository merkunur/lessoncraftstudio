compositionalRationale:
  en: |
    Primary strand: early-literacy / spelling-and-encoding (consonant-
    blend word encoding; canonical strand-advancement 2 → 3 toward
    strand-SAT). Secondary strand: phonics-decoding (kids leverage
    read-consonant-blends from Phase 1.3 to spell what they have
    learned to read). Tertiary strand: vocabulary acquisition (blend-
    anchor words drawn from familiar K-3 vocabulary).

    Architectural significance: spelling-and-encoding strand-
    advancement (2 → 3 canonical; near-SAT trajectory — 1 more
    package + spell-words-with-digraphs at Phase 1.5 closes the
    canonical 5-target strand at SAT = 4-5/5).

    **Phonetic-reciprocity pair with read-consonant-blends** (Phase
    1.3 Slot 3): decoding-encoding canonical pair. The kid first
    learned to READ blend words at Phase 1.3 (recognize bl-/br-/
    cl- patterns in print + sound them out). This package teaches
    the WRITING side — the kid hears a blend word + reproduces
    the spelling. Reciprocal pairs are the structural shape of
    phonics-decoding ↔ spelling-and-encoding work; kids consolidate
    by working both directions.

    Pair-coherent ship pattern (per Arc 19 cadence): this package
    is the cross-strand single-strand slot at Phase 1.4 in the
    spelling-and-encoding strand, complementing the phonics-decoding
    pair (read-vowel-teams + read-r-controlled-vowels) + the
    speaking-and-listening single (respond-to-greeting-in-target-
    language).

    Distinctive composition: 2 word-scramble + 2 word-guess + 1
    matching. Word-scramble is the canonical spelling-encoding
    practice — kids rearrange letters to form the target blend
    word, reinforcing the cluster-ordering. Word-guess fills the
    blend in cloze context.

    Class B FLEXIBLE substrate: composes against animals + foods
    image-library themes (blend-rich vocabulary: frog / snake /
    tree / train / bread / grapes / plums / spoon / glass / blanket
    / brown bear).

    K-3 multilingual classroom relevance: consonant-blend spelling
    is largely English-specific, though Romance + Germanic locales
    have their own consonant-cluster systems (Spanish: tr-/pr-/cr-
    common in initial position; Portuguese: tr-/pr-/br-/cr- common
    + with /h/ realization for R; German: schl-/schn-/spr-/str-
    in initial position; Dutch: schr-/spl-/str-). Locale-variant
    sparse-overrides per Phase 3 reframe per locale's canonical
    cluster set.

