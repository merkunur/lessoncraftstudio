compositionalRationale:
  en: |
    Primary strand: early-literacy / phonological-awareness
    (isolate-medial-phoneme — strand 5/9 → 6/9). Completes the
    3-position phoneme-isolation cluster: initial (Phase 1.1
    Slot 3) + final (Phase 1.2 Slot 2) + medial (this package).
    Pair-coherent with Phase 1.2 Slot 4 blend-phonemes-cvc
    which opens phoneme-synthesis work (combining isolated
    phonemes into CVC words). Per §A.13.31 per-instance
    content-awareness: `isolate-initial-phoneme/package.yaml`
    (Phase 1.1 Slot 3) + `isolate-final-phoneme/package.yaml`
    (Phase 1.2 Slot 2) are the canonical Literacy 8-material
    phonological-awareness precedents — this package mirrors
    their materials + composedExercises shape with medial-
    vowel pedagogical adaptation.

    Architectural significance: COMPLETES the 3-position
    phoneme-isolation cluster + ships the MOST COGNITIVELY-
    DEMANDING of the three isolation positions. Cognitive
    progression: initial-phoneme isolation (word-start; most
    salient; Phase 1.1) → final-phoneme isolation (word-end;
    second-most salient; Phase 1.2 Slot 2) → medial-vowel
    isolation (word-middle; LEAST salient; this package).
    The medial-vowel position is least salient because: (a)
    K-1 kids perceive consonants as 'edges' + vowels as
    'glue'; (b) the middle vowel is sandwiched between two
    consonant 'edges'; (c) English short-vowel quality is
    perceptually subtle (cat/cot/cut differ ONLY in mid-
    vowel; high cognitive load to perceive the distinction).
    Closing the cluster here sets up Phase 1.2 Slot 4 blend-
    phonemes-cvc (synthesis; reverse-of-isolation) + Phase
    1.3 segment-cvc-into-phonemes (full 3-phoneme
    decomposition).

    Per §A.13.30 K-1 informal framing: K-1 medial-vowel
    isolation work is CONCRETE VOWEL-DISCRIMINATION via
    minimal-pair contrasts. Kids hear minimal-pair word sets
    (cat/cot/cut; pen/pin/pun; map/mop/mug) + name the middle
    vowel for each. The pedagogy uses everyday language
    ('middle sound' / 'middle vowel' / 'short vowel sound')
    + anchor-word imagery (/a/ as in APPLE, /e/ as in
    ELEPHANT) + mouth-shape imitation (for /a/ mouth opens
    wide; for /o/ round shape; for /u/ push forward). NOT
    formal vowel-phonology pedagogy — IPA vowel chart, tongue-
    position diagrams + acoustic-phonetics terminology are
    post-Grade-3 academic work. Critical pedagogical move
    documented in contentActivity: VOWEL-STRETCHING during
    slow-pronunciation. K-1 kids often perceive the medial
    vowel as a brief transition + miss its distinct quality;
    stretching makes it acoustically prominent.

    **Phonological-awareness pedagogy is LOCALE-SPECIFIC —
    medial-vowel pedagogy especially so.** Vowel inventories
    differ structurally per language: English has 5 short
    vowels (/a/ /e/ /i/ /o/ /u/ in cat/pen/pig/cot/cup) + 5
    long vowels + ~7 reduced-vowels + diphthongs. pt-BR has
    7 oral vowels + 5 nasal vowels (vs English 5 short
    vowels). Italian has 7 vowels. Finnish has 8 vowels +
    vowel-length contrasts. The cognitive operation (hear
    word → name middle vowel → match to representation) is
    universal; the canonical vowel targets vary structurally
    per locale. This en package uses the English 5-short-
    vowel inventory; pt variant per §A.13.34 sub-class uses
    pt-BR vowel inventory (locked SPARSE-OVERRIDE this
    commission; FULL-OVERRIDE future-arc candidate).

    Per §A.13.29 ground-truth source-citation: composedExercises
    cite `REFERENCE APPS/matching.html` (imgname mode for
    picture-vowel pairing) + `REFERENCE APPS/word-guess.html`
    (clue-density mode for fill-in-missing-middle-letter work)
    + `REFERENCE APPS/picture-sort.html` (theme mode for
    vowel-quality categorization) + `REFERENCE APPS/word-
    scramble.html` (unified mode for sound-letter-mapping
    word-level reinforcement at middle-vowel position).

    Cross-reference to isolate-initial-phoneme + isolate-final-
    phoneme (prerequisites per learning-targets.json line 39):
    kids must master both bracket-the-word skills before medial-
    vowel isolation. The skill progression is pedagogically
    natural: bracket the word first (first + last) → fill in
    the middle (medial vowel). This package operationalizes
    the cluster-completion via explicit minimal-pair contrast
    methodology.

    Cross-reference to identify-letter-sounds-vowels (Arc 5):
    that package established the 5 short-vowel letter-sound
    correspondences (a/e/i/o/u → vowel sounds). This package
    surfaces those vowel sounds at the WORD-MIDDLE position
    via CVC minimal-pair work. Cross-arc skill integration:
    letter-sound knowledge (Arc 5) + medial-vowel isolation
    (this package) = vowel-substitution decoding skill (read
    cat → swap vowel → read cot → swap → read cut). This is
    the canonical word-family decoding foundation.

    Materials note: 8-material Literacy class stack per
    §A.13.37 + Phase 1.1 Slot 3 + Phase 1.2 Slot 2 canonical
    precedents. Materials structure mirrors isolate-initial-
    phoneme + isolate-final-phoneme verbatim (theme: animals
    provides familiar CVC vocabulary for vowel-isolation work
    — cat /a/ + cow /au/ + dog /o/ + pig /i/ + fox /o/ +
    hen /e/ give clean middle-vowel variety across common
    K-1 short-vowel phonemes). Manipulative-cut-outs at
    position 6 emits canonical-correct `mode: single-repeat`
    per §A.13.35.

    Distinctive composition: matching ×2 (positions 1+5) +
    word-guess (position 2) + picture-sort (position 3) +
    word-scramble (position 4). Same composition shape as
    Phase 1.1 Slot 3 + Phase 1.2 Slot 2 — phoneme-isolation
    work uses identical exercise affordances regardless of
    word-position; the pedagogical surface adapts via
    teacher framing + worksheet text emphasis at the
    middle-vowel position.

    Class B FLEXIBLE substrate: composes against animals
    theme (vocab-anchored with familiar K-1 vocabulary;
    cross-arc theme consistency with Phase 1.1 Slot 3 +
    Phase 1.2 Slot 2 + Arc 10+ phonological-awareness
    theme pattern). No substrate gaps; ships clean.

    K-3 multilingual classroom relevance: medial-vowel
    isolation is universal K-1 early-literacy content BUT
    vowel inventories differ structurally per language.
    Multilingual K-3 classrooms benefit from explicit medial-
    vowel work in the language-of-instruction + awareness
    that home-language vowel inventories may differ
    structurally (e.g., pt-BR-speaking kids in English-medium
    classrooms must learn 5 English short vowels distinct
    from their pt-BR 7+5 vowel inventory). The cognitive
    operation is universal; the canonical vowel targets are
    per-locale.

