assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Spell 18 of 25 Tier 2 sight words from memory in 8 of 10
        trials.
      - Read 25 of 25 Tier 2 sight words on flashcard in 9 of 10
        trials.
      - Use 6 Tier 2 sight words correctly in single sentences in
        7 of 10 trials.

    Differentiation:
    - Pre-K: read-only Tier 1 + Tier 2 review (no spelling).
    - K: spell 13 Tier 1 + read 25 Tier 2.
    - Grade 1: spell 13 Tier 1 + spell 18 of 25 Tier 2 (first
      pass).
    - Grade 2+: spell all Tier 1 + Tier 2 + bridge to Tier 3
      sight words + sentence-level use.

