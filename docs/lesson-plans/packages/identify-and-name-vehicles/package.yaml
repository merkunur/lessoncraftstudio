compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (target identify-and-name-vehicles).
    Secondary strand: phonics / letter recognition (matching letter mode).
    Tertiary strand: categorization (land/water/air sorting) + counting (find-and-count
    + manipulative-cut-outs + there-are-count-plural sentence frame). Mirrors
    Arc 1 farm-animals 3-strand integration.

curriculumStandards:
  - EYFS.ELG.UW
  - IB-PYP.HowOrganizeOurselves

assessmentCriteria:
  en: |
    Receptive 10/10; productive 8/10; frame use 6/10.

    Differentiation:
    - Pre-K: receptive only.
    - K / Grade 1: full productive + sentence-frame use; vehicle-sound matching
      as engagement bonus.
    - Grade 2+: extend to land/water/air categorization with multi-clause
      sentences ("The bus goes on land. The boat goes on water.").

