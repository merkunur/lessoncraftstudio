compositionalRationale:
  en: |
    Primary strand: early-literacy / letter-recognition (uppercase-
    lowercase pairing). Secondary strand: vocabulary acquisition (vocab-
    anchored). Tertiary strand: visual-discrimination (case-pair
    similarity-vs-distinctness reasoning).

    Architectural significance: deepens letter-recognition strand 3/6
    → 4/6 packages. RESOLVES Arc 11 identify-lowercase-letters
    forward-pointer. Letter-recognition cohort: identify-letter-by-
    image-clue (Arc 9) + identify-uppercase-letters (Arc 10) + identify-
    lowercase-letters (Arc 11) + match-uppercase-lowercase (this
    package). 4-package set covers initial-letter via image, uppercase
    set, lowercase set, case-pairing — strand approaching saturation
    at 4/6 (2 unauthored: identify-letter-sounds-consonants + identify-
    letter-sounds-vowels).

    Distinctive composition: Title Case label-case parameter throughout
    (combining uppercase + lowercase in same word). 2 alphabet-train
    + 2 matching letter-mode + 1 word-guess. Multi-app composition
    spans recognition + pairing + recall.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Universal substrate-readiness.

    K-3 multilingual classroom relevance: case-pairing is target-
    language-specific but cognitively universal. Most platform locales
    use Latin alphabet with uppercase + lowercase distinction; locale-
    specific letters (pt-BR ç/Ç; de ä/Ä, ö/Ö, ü/Ü, ß/SS) handled in
    Phase 3 sparse-overrides.

curriculumStandards:
  - CCSS.K.RF.1.D
  - EYFS.ELG.LIT
