<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Parcours d'Images — Miniature Professionnel</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(170deg, #FFF8E1 0%, #FFF3E0 60%, #FFE0B2 100%); overflow: hidden;">

        <!-- Gold border frame -->
        <div style="position: absolute; inset: 15px; border: 3px solid #D4A843; border-radius: 4px; opacity: 0.3;"></div>

        <!-- FREE badge (top center) -->
        <div style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%); z-index: 20;">
            <div style="background: #D32F2F; padding: 14px 40px; border-radius: 30px; box-shadow: 0 6px 20px rgba(211,47,47,0.35);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; color: white;">GRATUIT</span>
            </div>
        </div>

        <!-- Title -->
        <div style="position: absolute; top: 110px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 50px; color: #333; margin: 0;">Parcours d'Images</h1>
            <h2 style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 28px; color: #888; margin: 4px 0 0 0; letter-spacing: 3px;">SANS PRÉPARATION</h2>
        </div>

        <!-- Subtle divider -->
        <div style="position: absolute; top: 210px; left: 50%; transform: translateX(-50%); width: 100px; height: 3px; background: linear-gradient(90deg, transparent, #D4A843, transparent);"></div>

        <!-- Feature badges row -->
        <div style="position: absolute; top: 235px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px;">
            <div style="background: #263238; padding: 12px 22px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 16px;">🖨️</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white; text-transform: uppercase; letter-spacing: 1px;">Prêt à imprimer</span>
            </div>
            <div style="background: #263238; padding: 12px 22px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 16px;">✓</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white; text-transform: uppercase; letter-spacing: 1px;">Corrigés</span>
            </div>
            <div style="background: #263238; padding: 12px 22px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 16px;">⚡</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white; text-transform: uppercase; letter-spacing: 1px;">Téléchargement instantané</span>
            </div>
        </div>

        <!-- Floating tags (left side) -->
        <div style="position: absolute; top: 400px; left: 55px; background: white; padding: 10px 18px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px; z-index: 10;">
            <div style="width: 28px; height: 28px; background: #D4A843; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><span style="font-size: 14px;">🎨</span></div>
            <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #555;">Images mignonnes</span>
        </div>

        <div style="position: absolute; top: 580px; left: 55px; background: white; padding: 10px 18px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px; z-index: 10;">
            <div style="width: 28px; height: 28px; background: #D4A843; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><span style="font-size: 14px;">📄</span></div>
            <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #555;">Format PDF</span>
        </div>

        <!-- Floating tag (right side) -->
        <div style="position: absolute; top: 490px; right: 55px; background: white; padding: 10px 18px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 8px; z-index: 10;">
            <div style="width: 28px; height: 28px; background: #D4A843; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><span style="font-size: 14px;">🎓</span></div>
            <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #555;">MS GS CP CE1</span>
        </div>

        <!-- Center worksheet with golden frame -->
        <div style="position: absolute; top: 320px; left: 50%; transform: translateX(-50%); z-index: 5;">
            <div style="padding: 8px; background: linear-gradient(145deg, #D4A843 0%, #C4982F 100%); border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.2);">
                <div style="width: 360px; height: 440px; background: white; border-radius: 10px; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/french/picture%20path/Chemin%20d'Images%201.webp" style="width: 100%; height: 100%; object-fit: cover;" alt="Fiche parcours images professionnelle">
                </div>
            </div>
        </div>

        <!-- Bottom dark bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 85px; background: #263238; display: flex; align-items: center; justify-content: center; gap: 50px;">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">GRATUIT</span><br>
                <span style="font-family: 'Nunito', sans-serif; font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 1px;">TÉLÉCHARGEMENT</span>
            </div>
            <div style="width: 1px; height: 40px; background: rgba(255,255,255,0.2);"></div>
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white;">✓</span><br>
                <span style="font-family: 'Nunito', sans-serif; font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 1px;">LOT COMPLET</span>
            </div>
            <div style="width: 1px; height: 40px; background: rgba(255,255,255,0.2);"></div>
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white;">PDF</span><br>
                <span style="font-family: 'Nunito', sans-serif; font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 1px;">FORMAT</span>
            </div>
            <div style="width: 1px; height: 40px; background: rgba(255,255,255,0.2);"></div>
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 18px; color: white;">0 Prépa</span><br>
                <span style="font-family: 'Nunito', sans-serif; font-size: 11px; color: rgba(255,255,255,0.6); letter-spacing: 1px;">NÉCESSAIRE</span>
            </div>
        </div>

    </div>
</body>
</html>
