# Teaching package — use direction vocabulary
# Arc 8 Phase 2 (Option A vocab-acquisition continuation; fine-motor-and-
# visual-spatial / spatial-reasoning strand). Class B FLEXIBLE; cross-strand
# vocab-anchored. Builds on Arc 5 use-spatial-position-words + Arc 7 follow-
# directions-on-grid + Arc 8 Phase 1 navigate-simple-maze. Direction
# vocabulary (left, right, up, down, forward, backward, north, south, east,
# west) connects spatial-reasoning to language-acquisition.

targetSlug: use-direction-vocabulary
language: en
title:
  en: "Direction Words — left, right, up, down, and beyond"
description:
  en: "Kindergarten / Grade 1 fine-motor-and-visual-spatial package teaching direction vocabulary. Builds on Arc 5 use-spatial-position-words (positional vocab: on, under, next to) — direction vocab is the MOTION counterpart to position vocab. Bridges Arc 7 follow-directions-on-grid + Arc 8 Phase 1 navigate-simple-maze where direction vocab is implicitly used; this package makes direction vocabulary explicit. Productive-language target: kids narrate movement using direction words. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher stands at the front of the
      class. Calls out direction commands: "Take 2 steps LEFT. Now 3
      steps FORWARD. Now turn RIGHT." Class follows directions
      physically. Reinforces direction-word-to-movement mapping
      kinesthetically — kids feel the direction in their bodies as
      they hear the word. Repeat with 8-10 direction commands.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + Simon-Says variant. Each pair has a printed grid +
      a small token. Kid A calls direction commands ("Move RIGHT 2
      cells. Move DOWN 3 cells."); kid B moves the token. After 5
      commands, kids compare token position with kid A's intended
      destination. Recast errors with explanation ("you said RIGHT
      but moved LEFT — RIGHT is this way (gestures), LEFT is this
      way"). Optional extension: kids navigate from start to a target
      using direction words — productive-language version of follow-
      directions-on-grid.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: follow-directions-on-grid
      worksheet (kids navigate following directions; reinforces
      receptive direction-vocab). Station 2: matching worksheet
      (image-name pairs for direction concepts). Station 3:
      manipulative cut-outs hands-on direction practice (kids place
      arrows + label them with direction words). Station 4:
      sentence-strips (kids construct full direction sentences:
      "Walk forward. Turn right. Walk forward.").
  closure:
    durationMinutes: 5
    body: |
      Whole-class direction-narration. Teacher displays a path on a
      grid; class collectively narrates the path using direction
      words ("First go RIGHT, then DOWN, then RIGHT again"). Forward-
      pointer: "Today we used direction words to describe motion. When
      we come back to direction vocab next, we'll use COMPASS
      directions — north, south, east, west — for maps."

