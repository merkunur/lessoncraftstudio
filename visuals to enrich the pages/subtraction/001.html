<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Subtraction Worksheets - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(155deg, #F3E5F5 0%, #FCE4EC 50%, #FFF3E0 100%); overflow: hidden;">

        <!-- Subtle dot pattern overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.06; background-image: radial-gradient(circle, #C2185B 1px, transparent 1px); background-size: 28px 28px;"></div>

        <!-- Warm radial glow behind worksheets -->
        <div style="position: absolute; top: 55%; left: 50%; width: 700px; height: 700px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(194,24,91,0.08) 0%, rgba(179,157,219,0.06) 40%, transparent 70%); border-radius: 50%;"></div>

        <!-- Floating minus-sign shapes -->
        <div style="position: absolute; top: 170px; left: 55px; width: 40px; height: 12px; background: #B39DDB; border-radius: 6px; transform: rotate(-20deg); opacity: 0.5;"></div>
        <div style="position: absolute; top: 320px; left: 30px; width: 32px; height: 10px; background: #C2185B; border-radius: 5px; transform: rotate(15deg); opacity: 0.35;"></div>
        <div style="position: absolute; top: 240px; right: 55px; width: 36px; height: 11px; background: #FFE082; border-radius: 6px; transform: rotate(-30deg); opacity: 0.5;"></div>
        <div style="position: absolute; top: 420px; right: 35px; width: 28px; height: 9px; background: #B39DDB; border-radius: 5px; transform: rotate(25deg); opacity: 0.4;"></div>
        <div style="position: absolute; bottom: 340px; left: 70px; width: 34px; height: 10px; background: #FFE082; border-radius: 5px; transform: rotate(-10deg); opacity: 0.45;"></div>
        <div style="position: absolute; bottom: 290px; right: 65px; width: 38px; height: 11px; background: #C2185B; border-radius: 6px; transform: rotate(18deg); opacity: 0.3;"></div>

        <!-- Sparkle dots -->
        <div style="position: absolute; top: 195px; left: 120px; width: 8px; height: 8px; background: #FFE082; border-radius: 50%; box-shadow: 0 0 16px 5px rgba(255,224,130,0.6);"></div>
        <div style="position: absolute; top: 360px; right: 100px; width: 6px; height: 6px; background: #B39DDB; border-radius: 50%; box-shadow: 0 0 14px 5px rgba(179,157,219,0.5);"></div>
        <div style="position: absolute; top: 280px; left: 200px; width: 5px; height: 5px; background: #C2185B; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(194,24,91,0.4);"></div>
        <div style="position: absolute; bottom: 350px; right: 180px; width: 7px; height: 7px; background: #FFE082; border-radius: 50%; box-shadow: 0 0 15px 5px rgba(255,224,130,0.5);"></div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 25px; left: 28px; z-index: 100;">
            <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #FFE082 0%, #FFD54F 50%, #FFCA28 100%); border-radius: 50%; box-shadow: 0 8px 28px rgba(255,202,40,0.5), inset 0 -4px 10px rgba(0,0,0,0.12), inset 0 4px 8px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: #4A0E4E; text-shadow: 0 1px 2px rgba(255,255,255,0.4);">FREE</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: rgba(255,255,255,0.95); padding: 11px 22px; border-radius: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #C2185B;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #C2185B; letter-spacing: 1px;">GRADES K-2</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 100px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 78px; color: #4A0E4E; margin: 0; text-shadow: 3px 3px 0 rgba(194,24,91,0.15), 0 0 40px rgba(194,24,91,0.1);">SUBTRACTION</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 44px; color: #B39DDB; margin: 6px 0 0 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.08);">Worksheets</h2>
        </div>

        <!-- 3-Worksheet Staggered Display -->
        <div style="position: absolute; top: 260px; left: 50%; transform: translateX(-50%); width: 800px; height: 450px;">

            <!-- Left worksheet -->
            <div style="position: absolute; left: 85px; top: 60px; z-index: 10;">
                <div style="width: 200px; height: 259px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #B39DDB; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/subtraction/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Cross Out worksheet">
                </div>
            </div>

            <!-- Center worksheet (largest, prominent) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 20;">
                <div style="position: relative;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/subtraction/sample-1.jpeg" style="width: 260px; height: 336px; object-fit: cover; border-radius: 12px; border: 6px solid white; box-shadow: 0 18px 50px rgba(0,0,0,0.3), 0 0 30px rgba(194,24,91,0.15);">
                    <!-- Glow behind center -->
                    <div style="position: absolute; inset: -25px; background: radial-gradient(ellipse, rgba(194,24,91,0.1) 0%, transparent 65%); z-index: -1; border-radius: 30px;"></div>
                </div>
            </div>

            <!-- Right worksheet -->
            <div style="position: absolute; right: 85px; top: 60px; z-index: 10;">
                <div style="width: 200px; height: 259px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #B39DDB; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/subtraction/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Image Number worksheet">
                </div>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 110px; left: 0; right: 0; background: linear-gradient(90deg, rgba(194,24,91,0.95) 0%, rgba(136,14,79,0.95) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.15), 0 4px 20px rgba(0,0,0,0.15);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.25); letter-spacing: 2px;">Visual Subtraction with Cute Images!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #C2185B;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #C2185B;">Cross Out</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #B39DDB;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #7B1FA2;">Themed Images</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #FFE082;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #F57F17;">Answer Keys</span>
            </div>
        </div>

    </div>
</body>
</html>
