<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Make 10 — Number Bond Activity — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
  <style>
    html, body { background: transparent !important; }
    html, body, #lcs-root { height: 100% !important; }

    /* Fold fix (2026-06-27): story-problem (2.OA.A.1) rides a long two-step
       word problem on the shell prompt (48px → ~9 lines = ~478px!) above the
       bond + keypad + Check → far past a 900-tall window (operator: "cut off,
       Check not visible"). Cap the prompt + the bond figure. .nb-wrap .nb-svg
       (0,2,0) beats the core's runtime .nb-svg!important. Bond numbers are SVG
       text (no TINY-img risk). Shared by the 6 number-bond activities (the
       other 5 have SHORT prompts → unaffected); all re-verified. Cores
       untouched — html @media override pattern. */
    @media (min-width: 768px) {
      .lcs-activity-prompt { font-size: clamp(20px, 3vmin, 28px) !important; }
      .nb-wrap .nb-svg { width: clamp(150px, 26vmin, 220px) !important; }
    }
    @media (max-width: 599px) {
      .lcs-activity-prompt { font-size: clamp(14px, 3.6vw, 19px) !important; line-height: 1.2 !important; }
      .nb-wrap .nb-svg { width: clamp(120px, 40vw, 188px) !important; }
    }
  </style>
</head>
<body>
  <div id="lcs-root"></div>
  <!-- NOTE: bump ?v=N on EVERY change to number-bond-core.js or
       number-bond-activity.js (§A.13.42 cache-buster discipline). -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/number-bond-core.js?v=6"></script>
  <script src="/mini-tools/number-bond-activity.js?v=6"></script>
  <script>
    LCS.mount(NumberBondActivity, { mount: '#lcs-root' });
  </script>
</body>
</html>
