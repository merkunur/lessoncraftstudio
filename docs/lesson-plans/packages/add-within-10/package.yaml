compositionalRationale:
  en: |
    Primary strand: early-numeracy / addition-subtraction (sums to 10).
    Secondary strand: counting-and-cardinality (count-on strategy
    builds on counting fluency). Tertiary strand: number-sense
    (part-whole reasoning).

    Architectural significance: deepens addition-subtraction strand
    from 1/14 → 2/14 packages. Builds on Arc 1 add-within-5. Bridges
    counting (Arc 1+3+8+9) into formal addition with symbolic notation
    (3 + 2 = 5). Foundational K-3 arithmetic substrate.

    Distinctive composition: 2 math-worksheet exercises (positions 1, 3)
    + math-puzzle at position 2 + chart-count at position 4 + matching
    at position 5. Multi-app composition spans symbolic addition
    (math-worksheet) + concrete addition (math-puzzle) + count-with-
    chart (chart-count) + vocabulary-anchor (matching).

    Class B FLEXIBLE substrate: composes against image-library breadth
    + numerals 1-10. Substrate-readiness universal across countable
    themes.

    K-3 multilingual classroom relevance: addition vocabulary (more,
    plus, equals, sum, total, altogether) is high-frequency K-3 math
    target. Cross-locale: number names + addition terminology vary;
    locale-variant sparse-overrides handle locale-specific arithmetic
    vocabulary.

