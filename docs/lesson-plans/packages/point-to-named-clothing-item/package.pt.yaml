# Teaching package — point to named clothing item (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 13 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# pt sparse-override for vocabulary-acquisition strand.
# Brazilian climate-relevant clothing — bermudas + camisetas + chinelos
# predominate over heavy-coat-default. BR-MEC educação infantil register
# per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Palavras de Roupas — aponte para a camiseta, o short, o boné"
description:
  pt: "Pacote de letramento inicial para a educação infantil que ensina vocabulário receptivo de roupas. SATURA o fio de aquisição-de-vocabulário em 24/24. Counterpart receptivo de identify-and-name-clothing (produtivo). As crianças respondem a indicações ('aponte para a camiseta') identificando o item de roupa nomeado entre imagens exibidas. Trabalho fundamental de vocabulário receptivo — compreensão receptiva precede nomeação produtiva na aquisição da linguagem. Especificidade pt-BR: vocabulário de roupas adaptado ao clima tropical brasileiro — bermudas + camisetas + chinelos + boné + havaianas predominam sobre casacos pesados que dominam currículos europeus + norte-americanos."

structure:
  warmup:
    body: |
      Rotina de aponte-e-nomeie com toda a turma. A professora ou o
      professor exibe imagens grandes de 8-10 itens de roupa
      brasileira-canônica: camiseta, bermuda, vestido, short, boné,
      meias, tênis, chinelo, havaianas, jaqueta-leve. A professora ou
      o professor nomeia uma: "Aponte para a camiseta." A turma aponta
      para a imagem da camiseta. Repita com cada item. Reforça o
      mapeamento de vocabulário receptivo (palavra ouvida →
      identificação do item). Especificidade pt-BR: 9 de 10 itens
      escolhidos refletem o guarda-roupa brasileiro K-3 típico (clima
      quente predomina); apenas jaqueta-leve representa frio
      ocasional.
  contentActivity:
    body: |
      Trabalho em duplas + rotina de ouvir-e-identificar. Cada dupla
      recebe 8 cartas de imagem de roupa espalhadas. A professora ou
      a criança A nomeia um item; a criança B toca a imagem
      correspondente. Refraseie os erros com explicação ("você tocou
      o boné — vamos ouvir de novo: 'jaqueta' começa com /j/; o boné
      começa com /b/. Vamos achar a jaqueta"). Extensão opcional:
      as crianças nomeiam roupas que estão usando hoje. Especificidade
      pt-BR: ênfase em palavras de uso diário no Brasil — bermuda
      (não shorts), tênis (não sapato), chinelo (não sandália de
      praia), havaianas (palavra-canônica brasileira para chinelo de
      borracha).
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios de
      emparelhamento (imagem-para-nome-de-roupa). Estação 2: folha
      de exercícios de emparelhamento (roupa-para-parte-do-corpo —
      camiseta/torso; bermuda/pernas; boné/cabeça). Estação 3:
      recortes manipulativos prático vista-o-bonequinho (as crianças
      colocam recortes de roupa em moldes de bonequinho-de-papel;
      reforça vocabulário-de-roupa em contexto-do-corpo). Estação 4:
      word-guess (as crianças preenchem letras de nomes de roupas a
      partir de pistas de imagem).
  closure:
    body: |
      Rotina de aponte-e-quiz com toda a turma. A professora ou o
      professor nomeia 5-6 itens de roupa; a turma aponta
      coletivamente para cada imagem. Indicador adiante: "Hoje
      APRENDEMOS palavras de roupa apontando. Quando voltarmos a
      roupas na próxima vez, falaremos sobre QUANDO usar o quê —
      bermudas + camisetas no calor brasileiro, jaqueta + meias
      mais grossas no frio do sul + serra — conectando roupa ao
      CLIMA + ESTAÇÕES que já conhecemos."

assessmentCriteria:
  pt: |
    Identificar 8 de 10 itens de roupa apontando em 9 de 10
    tentativas. Nomear 6 de 10 itens de roupa produtivamente em 7 de
    10 tentativas. Articular conexões roupa-rotina ('Eu uso bermuda
    hoje porque está calor') em 6 de 10 tentativas.

    Diferenciação:
      - Pré-K (3-5 anos): 6 itens de roupa mais frequentes; somente
        receptivo.
      - Educação infantil (5-7 anos): 10 itens de roupa; receptivo +
        produtivo.
      - 1º ano em diante: estender para conexão roupa-clima (jaqueta
        para frio; bermuda para calor); ponte para classificação
        sazonal de roupas. Estender também para diferenças regionais
        brasileiras (Norte/Nordeste predominantemente quente o ano
        todo; Sul tem inverno mais frio com necessidade de
        agasalhos).

compositionalRationale:
  pt: |
    Fio principal: letramento inicial / aquisição de vocabulário
    (vocabulário receptivo de roupas). Fio secundário: fala-e-escuta
    (compreensão receptiva). Fio terciário: rotina de sala-de-aula
    (vocabulário de roupas se aplica diariamente — as crianças
    nomeiam o que estão usando).

    **Significância arquitetural: FECHA-SATURAÇÃO para o fio de
    aquisição-de-vocabulário (23/24 → 24/24).** Primeiro fio a
    alcançar saturação pós-substrato-de-completude do Arco 12.
    Counterpart receptivo de identify-and-name-clothing (já criado).

    Especificidade pt-BR: o vocabulário de roupas reflete o contexto
    climático brasileiro. A maioria do Brasil tem clima tropical ou
    subtropical — guarda-roupas K-3 típicos enfatizam:
    - **Bermuda** (não 'shorts' anglicismo; bermuda é palavra
      portuguesa estabelecida)
    - **Camiseta** (mais frequente que camisa-formal em K-3)
    - **Chinelo** + **havaianas** (calçado-padrão no calor)
    - **Tênis** (calçado escolar mais comum)
    - **Boné** (proteção solar)

    Em contraste, currículos K-3 europeus + norte-americanos
    enfatizam casacos + cachecóis + luvas + gorros — vocabulário
    aparente apenas no inverno do Sul brasileiro (Rio Grande do Sul,
    Santa Catarina, serras de Minas + São Paulo).

    Crianças brasileiras em escolas internacionais devem aprender
    AMBOS os conjuntos de vocabulário; o pacote pt-BR começa com o
    guarda-roupa familiar (bermuda + camiseta) + estende para
    vocabulário sazonal regional.

    Currículo BNCC EI03ET05: as crianças classificam objetos +
    figuras de acordo com semelhanças + diferenças, incluindo
    classificação de roupas adequadas para diferentes contextos
    (calor/frio; escola/casa; festa/dia-a-dia).

    Substrato Class B FLEXIBLE: composta contra o tema de roupas.
    Substrato-prontidão universal.
