assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Count sides + corners on basic 2D shapes (triangle, square,
        rectangle) in 8 of 10 trials.
      - Articulate 2D shape attributes ('a square has 4 sides and 4
        corners') in 7 of 10 productive-language attempts.
      - Identify a shape from attribute description alone (without
        seeing the shape) in 6 of 10 trials.

    Differentiation:
    - Pre-K: count sides only (skip corners); 3 basic shapes (triangle,
      square, circle).
    - K: count sides + corners; 5 shapes (triangle, square, rectangle,
      circle, oval).
    - Grade 1+: extend to 3D shape attributes (faces, edges, vertices);
      bridge to property-based shape classification (Arc 10+ candidate).

