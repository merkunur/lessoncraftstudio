assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name a 2-equal-parts partition as 'halves' (the
        partition) or 'half' (one piece) in 8 of 10 trials.
      - Name a 3-equal-parts partition as 'thirds' or
        'third' in 7 of 10 trials.
      - Name a 4-equal-parts partition as 'quarters',
        'quarter', 'fourths', or 'fourth' in 8 of 10
        trials.
      - Distinguish equal-parts partition (named: halves /
        thirds / quarters) from unequal-parts partition
        (unnamed: just pieces) in 7 of 10 trials.
      - Count the equal pieces in a partitioned shape to
        determine the partition name (2 → halves; 3 →
        thirds; 4 → quarters) in 7 of 10 trials.
      - Use vocabulary 'half' / 'third' / 'quarter' /
        'fourth' / 'equal parts' / 'shaded' correctly in 6
        of 10 productive-language trials.

    Differentiation:
    - Pre-K: skip fraction-naming entirely; review whole-
      shape recognition first (per Arc 9 identify-2d-
      shapes-basic).
    - K: introduce halves only (skip thirds + quarters);
      use the pair-partner partition-shape-halves-quarters
      slot 1 as primary K-aligned coverage of halves +
      quarters together.
    - Grade 1: full halves + quarters fraction-naming
      fluency; thirds introduced informally but not
      assessed.
    - Grade 2: full halves + thirds + quarters fraction-
      naming fluency per CCSS.2.G.A.3.
    - Grade 3+: bridge to CCSS.3.NF.A 'understand a
      fraction 1/b as the quantity formed by 1 part when a
      whole is partitioned into b equal parts'; formal
      symbolic fraction notation (1/2 + 1/3 + 1/4 + 2/3 +
      3/4) begins here.

