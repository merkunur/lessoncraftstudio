compositionalRationale:
  en: |
    Primary strand: world-knowledge / living-things (living-vs-nonliving
    classification). Secondary strand: vocabulary acquisition (vocab-
    anchored — living + non-living examples). Tertiary strand:
    classification + scientific-reasoning (kids reason about
    distinguishing properties of life: growth, nutrition, reproduction).

    Architectural significance: deepens living-things strand from
    3/6 → 4/6. Sub-strand cohort: classify-animals-by-diet (Arc 5) +
    classify-animals-by-habitat (Arc 5) + describe-plant-life-cycle
    (Arc 10) + identify-living-vs-nonliving (this package). 4 of 6
    targets authored — strand approaching saturation (2 unauthored
    remaining: identify-plant-parts, describe-butterfly-life-cycle).

    Distinctive composition: 2 picture-sort exercises + 2 matching
    exercises + 1 odd-one-out. Sort-rhythm reinforces the categorical
    nature of living-vs-nonliving classification. Multi-app composition
    spans recognition (matching) + classification (picture-sort) +
    exclusion (odd-one-out).

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Living + non-living examples readily available across themes
    (animals + plants/fruits = living; vehicles + furniture = non-
    living). Substrate-readiness universal.

    K-3 multilingual classroom relevance: living-vs-nonliving is
    foundational science vocabulary across all 11 platform locales.
    Productive-language frames ('the cat is living because it eats
    and grows') exercise scientific-explanation grammar.

