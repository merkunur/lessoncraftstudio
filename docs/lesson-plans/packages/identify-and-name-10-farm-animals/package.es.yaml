# Teaching package — identify and name 10 farm animals (Spanish locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 3 Phase 1 migration).
# Migrated from full standalone (Arc 2 Phase 2) to sparse-override pattern.
# Validator at frontend/scripts/author-teaching-package.ts detects this file by
# filename pattern (package.<locale>.yaml), finds canonical sibling (package.yaml),
# deep-merges (override-wins per field; arrays REPLACE entirely), and validates
# the merged result.
#
# Spanish CLIL register: formal USTED per CLAUDE.md §17.9 cross-locale teacher-
# address-register lock. K-3-natural; constructive (not corrective).
#
# CC ADJUDICATION (Arc 3 Phase 1): sparse override carries only locale-bound
# TEXT fields (title.es, description.es, structure bodies, assessmentCriteria.es,
# compositionalRationale.es). composedExercises + materials INHERIT from canonical
# (with English language: en / languageSelect: en customizationParameters).
# Render-time substitution (future Arc 4+) can replace canonical's language
# field with package.language automatically; current Phase 1 validator passes
# either way because customizationParameters language is structurally valid.
#
# Authoring note: language is force-set by validator merge logic to the
# locale-from-filename ('es' here); no need to declare here.

title:
  es: "Animales de granja — identifica y nombra 10"
description:
  es: "Paquete de adquisición de vocabulario para K-Primer Grado sobre 10 animales de granja universales: vaca, oveja, cerdo, gallina, gallo, caballo, pato, cabra, conejo, burro. Compone 5 ejercicios de hoja de trabajo y 8 materiales imprimibles a lo largo de una unidad de 1-2 semanas. Diseñado para aulas K-3 multilingües — el operador selecciona el idioma de instrucción al renderizar los materiales; el vocabulario se resuelve automáticamente a través de los datos IMAGE_VOCABULARY de 11 locales."

# Override structure section bodies with Spanish CLIL text. durationMinutes per
# section inherited from canonical (5/12/8/5 = 30 min total).
structure:
  warmup:
    body: |
      Reúna a los niños en la alfombra. Levante las tarjetas didácticas una por una,
      diga el nombre de cada animal en español, la clase repite a coro. Después
      de la introducción, fije las tarjetas en el muro de palabras agrupadas en
      "Animales de granja".
  contentActivity:
    body: |
      Rutina del bolsillo de pared con tiras de oraciones ("Veo una vaca", "Veo un
      cerdo", etc.). Primero lectura coral, luego lecturas individuales. Trabajo
      en parejas: los niños sujetan una tarjeta de imagen, el compañero nombra el
      animal en español. Reformule los errores en la estructura modelo (si el niño
      dice "es vaca", reformule a "veo una vaca").
  scaffold:
    body: |
      Rotación de estaciones. Estación 1: hoja de emparejamiento imagen-letra
      (aplicación matching, modo letra) — los niños emparejan cada animal con
      su letra inicial. Estación 2: clasificación de tarjetas de imagen en la
      alfombra (animales de granja vs otros animales). Estación 3: recortes
      manipulables para contar (cuente N animales de granja).
  closure:
    body: |
      Puesta en común con toda la clase. Un último desafío: la maestra o el maestro
      nombra un animal, los niños señalan la tarjeta correspondiente. Nombre el
      patrón: "Hoy aprendimos los nombres de 10 animales de granja. Cuando
      volvamos a los animales de granja la próxima vez, este mismo conjunto
      estará aquí para nosotros."

assessmentCriteria:
  es: |
    Al final de la unidad de 1-2 semanas, los niños deben poder:
      - Identificar receptivamente los 10 animales de granja cuando la maestra
        o el maestro los nombra en español (objetivo point-to-named-farm-animal).
      - Producir el nombre de al menos 8 de 10 animales de granja al ver una
        tarjeta de imagen (objetivo identify-and-name-10-farm-animals).
      - Usar la estructura "Veo un/una {item}" de forma autónoma en español con
        al menos 6 de los 10 animales.

    Diferenciación:
      - Pre-K / K temprano: evalúe solo receptivamente (point-to-named); evite
        la presión de producción.
      - K / Primer grado: producción completa de nombres + uso de la estructura.
      - Segundo grado en adelante: extienda a formas plurales ("Tengo 3 cerdos"),
        descripciones de color ("el gato es negro"), o narrativas en oraciones
        compuestas.

compositionalRationale:
  es: |
    Hilo principal: adquisición de vocabulario (objetivo
    identify-and-name-10-farm-animals).
    Hilo secundario: fonética / reconocimiento de letras (matching modo letra en
    la posición 2).
    Hilo terciario: contar + categorización (find-and-count posición 3,
    odd-one-out posición 4, picture-sort posición 5; recortes manipulables;
    tira de oraciones de la semana 2 con la estructura there-are-count-plural).

    La integración entre hilos es intencional. El trabajo de vocabulario K-Primer
    grado se beneficia de la revisión en espiral a través de contextos de
    fonética + contar + categorización; aislar a un solo hilo desaprovecharía
    el catálogo de materiales. Los paquetes futuros en hilos no de vocabulario
    deberían diseñar su propia forma de integración; no copien esta extensión
    de 3 hilos a ciegas.
