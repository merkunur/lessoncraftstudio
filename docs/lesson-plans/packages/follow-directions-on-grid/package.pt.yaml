# Teaching package — follow simple directions on a grid (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 7 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# FIRST pt sparse-override for fine-motor-and-visual-spatial / spatial-reasoning
# strand. BR Portuguese register per CLAUDE.md §6 + §17.9. Direction vocabulary in
# pt: esquerda/direita/cima/baixo (universal directional terms).

title:
  pt: "Segue direções na grade — navegação esquerda, direita, cima, baixo"
description:
  pt: "Pacote para K que ensina a seguir direções em grade. As crianças ouvem direções simples ('vá para a esquerda, vá para cima, vá para a direita') e executam-nas em uma grade para alcançar um alvo. Faz ponte do vocabulário de posição espacial (use-position-vocabulary + use-spatial-position-words) para o raciocínio espacial de movimento direcional. Ancorado em vocabulário."

structure:
  warmup:
    body: |
      Rotina de ação para toda a turma. A professora ou o professor coloca
      uma grade de fita adesiva no chão da sala de aula (grade 3×3 ou
      4×4). As crianças ficam em pé nas células da grade. A professora
      ou o professor dá direções: "Dê 1 passo para a ESQUERDA. Agora dê
      1 passo para CIMA. Agora dê 1 passo para a DIREITA." As crianças
      seguem fisicamente. Reforça vocabulário de direção (esquerda /
      direita / cima / baixo) + a habilidade de raciocínio espacial
      corporificado de navegação relativa de posição. Repita com
      diferentes células de partida.
  contentActivity:
    body: |
      Rotina de mural de bolso. A professora ou o professor exibe um desenho
      de grade com a célula de partida marcada. Dá direções sequenciais
      ("vá para a direita, vá para a direita, vá para cima"); a turma
      coletivamente marca o caminho na grade + identifica a célula final.
      Trabalho em duplas: a criança A dá direções; a criança B traça o
      caminho em uma grade de papel. Refraseie os erros. Extensão opcional:
      as crianças descrevem caminhos uma para a outra em português ("Daqui,
      vá para baixo 2, depois para a direita 3") — desenvolve a produção
      de vocabulário direcional.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios picture-path
      (as crianças traçam linhas em grades seguindo sequências de direção
      escritas-ou-faladas). Estação 2: emparelhamento (palavras de direção
      a setas de direção — reforço de vocabulário). Estação 3: navegação
      em grade com recortes manipulativos (as crianças colocam uma figura
      pequena recortada em uma grade impressa; o parceiro dá direções; a
      criança move a figura célula a célula; verifica a posição final).
  closure:
    body: |
      Recordação rápida com toda a turma. A professora ou o professor dá
      uma sequência curta de direções; a turma coletivamente traça-a em
      uma grade projetada. Indicador adiante: "Hoje navegamos grades com
      direções. Quando voltarmos a quebra-cabeças espaciais próxima vez,
      faremos LABIRINTOS — caminhos através de paredes e obstáculos."

assessmentCriteria:
  pt: |
    Seguir sequências de 3 passos de direção em grade 3×3 em 8 de 10
    tentativas. Seguir sequências de 4-5 passos em grade 4×4 em 6 de 10
    tentativas. Usar vocabulário de direção (esquerda/direita/cima/baixo)
    produtivamente em 8 de 10 tarefas de navegação.

    Diferenciação:
      - Pré-K: sequências de 1-2 passos em grade 3×3; forte apoio de
        adulto.
      - K: sequências de 3 passos em grade 3×3; prática em duplas.
      - Primeiro ano em diante: sequências de 4-5+ passos em grade 4×4;
        ponte para navigate-simple-maze (profundidade futura do domínio
        fine-motor-and-visual-spatial).

compositionalRationale:
  pt: |
    Fio principal: motricidade fina e visual-espacial / raciocínio
    espacial. Fio secundário: aquisição de vocabulário (vocabulário de
    direção: esquerda/direita/cima/baixo). Fio terciário: seguimento de
    sequência (as crianças retêm uma sequência de direções na memória
    de trabalho enquanto executam).

    Significância arquitetural: profundidade do fio de raciocínio
    espacial (4º pacote após use-position-vocabulary do Arco 5 Fase 2 +
    use-spatial-position-words do Arco 6 Fase 1). Valida arquitetura de
    raciocínio espacial através de 4 superfícies distintas: vocabulário-
    de-posição (4 preposições) → posição-expandida (8 preposições) →
    navegação-direcional (este pacote).

    Padrão de pareamento com pacotes pré-requisito: use-position-
    vocabulary + use-spatial-position-words estabelecem vocabulário de
    PREPOSIÇÃO (em, sobre, debaixo, entre, atrás, etc.); follow-
    directions-on-grid adiciona vocabulário de DIREÇÃO (esquerda,
    direita, cima, baixo) — camadas de linguagem espacial diferentes
    mas complementares. Cadeia de pré-requisito sequencial.

    Relevância para sala de aula multilíngue K-3 + nuances pt-BR: o
    vocabulário de direção em português usa formas analíticas
    "esquerda/direita/cima/baixo" — diretas e sem morfologia complexa;
    canonicamente compreensível em K-3. Em algumas regiões do Brasil,
    "esquerda" pode coexistir com "canhota" (mão esquerda) ou expressões
    regionais. Para K-3, o vocabulário canônico é suficiente. Vocabulário-
    âncora preservado.
