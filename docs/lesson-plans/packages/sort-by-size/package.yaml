assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Sort 8-10 mixed objects by size into 2 size categories (big vs
        small) with 90%+ accuracy.
      - Sort 12-15 mixed objects into 3 size categories (big / medium /
        small) with 75%+ accuracy.
      - Use size-vocabulary spontaneously when sorting (vocabulary-anchor
        verification).

    Differentiation:
    - Pre-K: 2-size sorting only (big vs small).
    - K: 3-size sorting; mixed-object substrate.
    - Grade 1+: extend to sort-by-multiple-attributes (sort by color AND
      size; or shape AND size simultaneously) — combines basic-attribute
      trilogy work into multi-attribute reasoning.

