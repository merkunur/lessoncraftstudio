# Teaching package — identify and name 10 clothing items (Portuguese locale variant)
# SPARSE-OVERRIDE FORMAT (Arc 3 Phase 2). Brazilian Portuguese register; formal "você".

title:
  pt: "Roupas — identifica e nomeia 10"
description:
  pt: "Pacote de aquisição de vocabulário para K-Primeiro Ano sobre 10 itens de roupa universais: camisa, calça, vestido, sapatos, chapéu, casaco, jaqueta, cachecol, suéter, botas. 5 exercícios + 8 materiais imprimíveis. Tema-agnóstico; o operador seleciona o idioma de instrução ao renderizar os materiais."

structure:
  warmup:
    body: |
      Introdução com toda a turma. Levante os cartões didáticos um por um, diga
      o nome de cada item de roupa em português, a turma repete em coro.
      Opcional: as crianças tocam no item de roupa correspondente em seu próprio
      corpo se estiverem usando. Fixe os cartões no agrupamento "Roupas" do
      mural de palavras.
  contentActivity:
    body: |
      Rotina de mural de bolso com tiras de frases ("Vejo uma {item}"). Primeiro
      leitura coral, depois leituras individuais. Trabalho em duplas: as crianças
      seguram um cartão de imagem, o colega nomeia o item em português. Refraseie
      os erros na estrutura modelo.
  scaffold:
    body: |
      Rotação de estações. Estação 1: emparelhamento imagem-letra (matching, modo
      letra). Estação 2: classificação de cartões de imagem no tapete (roupas
      de inverno vs roupas de verão — categorização + vocabulário sazonal).
      Estação 3: jogo da memória com 6 pares de cartões.
  closure:
    body: |
      Compartilhamento com toda a turma. Desafio final: a professora nomeia um
      item, as crianças apontam no próprio corpo ou no mural. Aponte adiante:
      "Hoje aprendemos 10 palavras de roupa. Quando voltarmos a roupas, este
      mesmo conjunto estará aqui para nós."

assessmentCriteria:
  pt: |
    Receptiva 10/10 (apontar para a roupa nomeada no corpo ou na imagem);
    produtiva 8/10 (nomear a partir da imagem); uso da estrutura 6/10
    ("Vejo uma {item}").

    Diferenciação:
    - Pré-K: apenas receptiva; toque na roupa correspondente no próprio corpo.
    - K / Primeiro ano: produção completa + uso da estrutura.
    - Segundo ano em diante: estenda para emparelhamento clima-roupa
      ("Está frio. Eu uso um casaco.").

compositionalRationale:
  pt: |
    Fio principal: aquisição de vocabulário (objetivo identify-and-name-clothing).
    Fio secundário: fonética / reconhecimento de letras.
    Fio terciário: categorização (odd-one-out + picture-sort + classificação
    sazonal na estação 2 do scaffold). Espelha a integração de 3 fios do
    Arc 1 farm-animals.
