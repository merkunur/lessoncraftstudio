assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Answer WHO questions about a scene picture
        correctly in 8 of 10 trials.
      - Answer WHAT questions about a scene picture
        correctly in 7 of 10 trials.
      - Answer WHERE questions about a scene picture
        correctly in 7 of 10 trials.
      - Distinguish the three question-word types when
        sorting answer cards (a 'park' card is a WHERE
        answer, not a WHO answer) in 7 of 10 trials.
      - Articulate complete-sentence answers using the
        sentence-strips framework ('The girl is reading.
        She is at the library.') in 5 of 10 productive-
        language trials.
      - Use vocabulary 'who' / 'what' / 'where' /
        'question' / 'answer' correctly in 6 of 10
        productive-language trials.

    Differentiation:
    - Pre-K: read-aloud + picture-cue element-spotting
      (no formal question-word distinction); kids
      simply name 'who is in the picture' without
      categorizing question-types.
    - K: full WHO/WHAT/WHERE question-answering with
      familiar scenes + simple new scenes; teacher read-
      aloud heavily supported.
    - Grade 1: independent question-answering in simple
      new scenes; bridge to WHEN + WHY questions (Grade
      1+ candidates); introduce 5-W framework (WHO +
      WHAT + WHERE + WHEN + WHY).
    - Grade 2+: 5-W question framework with HOW (the
      6-question journalism framework); question-
      formation work (kids ask their own questions
      about a scene); bridge to identify-problem-and-
      solution (Phase 1.4 candidate; problem-solution
      work depends on WHO+WHERE+WHAT extraction
      foundation).

