assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Solve sums-within-20 problems in 7 of 10 trials.
      - Use make-10 strategy ('break the second number; add to make 10
        first; add remainder') in 6 of 10 trials.
      - Articulate make-10 reasoning ('I broke 5 into 2 plus 3; 8 plus
        2 makes 10; 10 plus 3 is 13') in 5 of 10 productive-language
        trials.

    Differentiation:
    - Grade K (advanced): sums to 15 with make-10 support.
    - Grade 1: sums to 20 with make-10 strategy + 20-frame
      manipulative.
    - Grade 2+: extend to subtract-within-20 (Arc 13+ candidate);
      bridge to mental addition fluency.

