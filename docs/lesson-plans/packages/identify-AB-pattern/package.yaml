# Teaching package — identify and continue AB patterns
# Arc 7 Phase 1 (Path B; cognitive-and-executive-function / pattern-recognition
# strand FIRST package). Class B FLEXIBLE; substrate-flexible against image-
# library breadth (any 2 distinct objects work). Vocab-anchored: kids name the
# objects in the pattern as they identify and continue.

targetSlug: identify-AB-pattern
language: en
title:
  en: "AB Patterns — identify and continue alternating patterns"
description:
  en: "Pre-K to Kindergarten cognitive-and-executive-function package teaching AB pattern recognition. Foundational pattern-recognition skill: kids identify the alternating rule (cat-dog-cat-dog-?) and predict the next item. Vocab-anchored — naming objects in the pattern reinforces vocabulary. FIRST pattern-recognition strand package; opens pattern depth across Arc 7 Phase 1+2. Composes against pattern-train app + image-library breadth. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher creates a physical AB pattern on
      the carpet using paper-cut-out objects: cat, dog, cat, dog, cat,
      dog. "What's next? Cat or dog?" Class answers chorally. Repeat with
      different object pairs (red, blue, red, blue → red; or apple,
      banana, apple, banana → apple). Reinforces the AB-pattern concept
      + vocabulary (kids name the alternating items aloud). Pin pattern
      cards to "Patterns" word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine. Teacher displays 5-6 AB pattern strips with
      different object pairs; class collaboratively continues each. Pair
      work: kid A creates an AB pattern with paper-cut objects; kid B
      continues it. Recast errors with explanation ("the pattern goes
      cat, dog, cat, dog — so the next one must be... cat!"). Optional
      extension: kids create AB patterns using their own bodies (stand,
      sit, stand, sit, stand, sit — AB action pattern) — embodied
      pattern-recognition.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet AB mode (kids
      identify and complete AB patterns; train-themed visual). Station 2:
      matching worksheet (image-name reinforces object vocabulary used
      in patterns). Station 3: manipulative cut-outs hands-on pattern
      construction (kids build AB patterns with cut-out objects on a
      printed pattern-strip template; describe the pattern aloud).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays an AB pattern with
      blanks; class collectively fills in the missing items. Forward-
      pointer: "Today we learned AB patterns. When we come back to
      patterns next, we'll learn more complex patterns — AAB, ABB, ABC
      — keeping a different rule in mind."

