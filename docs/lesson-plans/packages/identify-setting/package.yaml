compositionalRationale:
  en: |
    Primary strand: language-and-communication / reading-
    comprehension (identify the setting — advances strand
    4/10 → 5/10). Secondary strand: vocabulary-acquisition
    (setting-vocabulary + place-vocabulary: 'setting',
    'place', 'where', 'background', 'scene'). Tertiary
    strand: speaking-and-listening (the productive-language
    work of articulating WHERE the story happens +
    retelling stories with setting framing).

    Architectural significance: continues reading-
    comprehension strand expansion. Per learning-targets.
    json the strand has 10 canonical targets; current
    state at Arc 18 P1.2 commencement is 4 authored
    (match-sentence-to-picture from Arc 12 P2 as the
    strand-opener + predict-from-picture-cue + sequence-
    3-event-story + identify-main-character from Arc 17
    P1.5); identify-setting is the fifth package, bringing
    the strand to 5/10. Per learning-targets.json
    prerequisite: match-sentence-to-picture is the
    prerequisite — kids must be able to connect a sentence
    to a picture before they can extract a setting from
    a sentence-and-picture-paired story.

    Pair-coherent ship pattern with Arc 17 P1.5 identify-
    main-character. The two packages teach complementary
    pedagogical aspects of the same observable activity
    (reading a story + extracting story-element):
    - identify-main-character: kids extract WHO the
      story is about (the character; the agent of
      narrative actions). Pedagogy anchors on character-
      cues (appearance frequency, title naming, agent of
      important actions).
    - identify-setting (this package): kids extract WHERE
      the story happens (the place; the location of
      narrative actions). Pedagogy anchors on setting-
      cues (background imagery, opening-sentence naming,
      location of character actions).
    Together they form the K-level character+setting
    dual-extraction module — kids learn that a story has
    a WHO + a WHERE, and both can be identified from
    picture-supported text. This pair establishes the
    foundational story-element vocabulary kids extend in
    Grade 1+ work (identify-problem-and-solution +
    sequence-3-event-story + infer-character-feeling).

    Reading-comprehension strand future (Arc 18+
    candidates per learning-targets.json residual):
    answer-who-what-where-questions, identify-problem-and-
    solution, distinguish-fiction-from-nonfiction, read-
    and-follow-2-sentence-instruction, infer-character-
    feeling-from-picture-cue. Together these 5 + this
    package + the 4 existing siblings will close the
    strand at 10/10 SAT at projected Arc 19+.

    Per §A.13.30 K-1-informal framing: K-1 work is
    setting-identification in TEACHER-LED READ-ALOUD
    or PICTURE-SUPPORTED text. Kids do NOT need to be
    independent readers to identify a setting — they
    can identify the place from picture cues + teacher
    reading aloud + opening-sentence cues. The K-1
    identifier signals are deliberately simple:
    - WHAT IS THE BACKGROUND of the pictures?
    - WHAT PLACE IS NAMED in the opening sentence?
    - WHERE DO THE CHARACTERS DO THEIR ACTIONS?
    These signals make the setting identification
    accessible at K-1 ages without requiring formal
    literary-analysis vocabulary or independent decoding
    fluency. Grade 2+ work extends to settings that
    SHIFT during a story (a character traveling between
    places), settings that are MORE ABSTRACT (the
    'olden days' as a time-setting), distinguishing
    physical setting from cultural/historical setting —
    all beyond K-1 scope.

    Cross-reference to match-sentence-to-picture
    (prerequisite): that package established sentence-
    to-picture connection (kids read a sentence + match
    it to the image it describes). This package extends
    that connection: now kids read a SHORT STORY (3-4
    sentences with picture support) + identify the
    SETTING (the place shown across the sentences). The
    sentence-to-picture skill grounds the multi-sentence
    setting-tracking skill.

    Cross-reference to identify-main-character (pair
    partner): both packages use the same composition
    shape (3 matching + 1 picture-sort + 1 missing-
    pieces); same Literacy 8 class disposition (per
    §A.13.37); same sentence-strips framePreset
    'this-is-a'. The pair's structural symmetry surfaces
    the parallel pedagogy. Teachers using both packages
    in sequence (identify-main-character first, then
    identify-setting) get a coherent two-week character+
    setting introduction.

    Distinctive composition: 3 matching exercises
    (canonical reading-comp pattern — match story-card to
    setting-card across multiple practice slots) + 1
    picture-sort (setting categorization: indoor vs
    outdoor places via house theme vs farm theme contrast)
    + 1 missing-pieces (setting-image completion
    supporting setting-recognition). Multi-matching
    weighting surfaces the setting-identification skill
    as the package's load-bearing exercise pattern; the
    picture-sort + missing-pieces variation prevents
    pure-repetition fatigue while reinforcing the
    underlying setting-recognition substrate.

    Materials note: 8-material Literacy class stack per
    §A.13.37. Sentence-strips at position 4 with
    framePreset 'this-is-a' (story-setting anchor frames:
    "This is a [setting]. The story happens at the
    [setting].") is the load-bearing material — the
    literal story-frame substrate kids work with.
    Vocabulary-tracing-strips at position 5 with
    `traceStyle: dotted` traces setting-vocabulary words
    ('setting', 'place', 'home', 'school'). The
    combination of sentence-strips + vocabulary-tracing-
    strips surfaces both the read-aloud / picture-
    supported text work AND the setting-vocabulary
    acquisition work that ground the comprehension skill.

    Class B FLEXIBLE substrate: composes against
    miscellaneous theme (settings span home / school /
    park / playground / forest / beach / farm / city —
    no single semantic theme captures the breadth of
    possible settings; miscellaneous is the appropriate
    abstract theme choice). The picture-sort exercise
    uses house + farm themes as the indoor-vs-outdoor
    contrast (the foundational K-1 setting-type
    distinction).

    K-3 multilingual classroom relevance: setting
    identification is universal K-3 comprehension content.
    The narrative concept of 'setting' is locale-portable;
    only the vocabulary varies. Cross-locale setting-
    vocabulary: en 'setting' / 'place' / 'where'; de
    'Schauplatz' / 'Ort' / 'Ortsangabe'; es 'escenario' /
    'lugar' / 'ambiente'; pt 'cenário' / 'lugar' /
    'ambiente'; fr 'cadre' / 'lieu' / 'décor'; it
    'ambientazione' / 'luogo' / 'scenario'; nl 'plek' /
    'omgeving' / 'plaats'; fi 'paikka' / 'tapahtuma-
    paikka' / 'ympäristö'; sv 'plats' / 'miljö'; da
    'sted' / 'miljø'; no 'sted' / 'miljø'. The setting-
    vocabulary register varies: en 'setting' is the
    canonical narrative-analysis term but K-1 kids
    typically use simpler 'place' / 'where'; Romance
    languages have 'cenário' / 'escenario' / 'cadre' as
    the formal term + 'lugar' / 'lieu' as the
    accessible-vocabulary term. Locale-variant work at
    Phase 3+ adapts to each locale's setting-vocabulary
    register + locally-appropriate read-aloud story
    selections with culturally-familiar settings.

