compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (RECEPTIVE — pointing to named
    color, not naming it). Secondary strand: visual discrimination + cross-
    domain integration (kids identify colors on objects from various theme
    clusters: animals can be brown/black/white; fruits can be red/yellow/
    purple; clothing can be all colors).

    Pairing pattern with productive package: use-color-words (Arc 2)
    provides the productive surface (kids USE color words to describe
    objects). This receptive variant uses the same 10-key cluster but
    composes against receptive-surface exercises emphasizing recognition
    rather than production. The receptive-then-productive pedagogical
    arc applies cleanly to colors.

    Distinctive composition: 4th picture-sort exercise (position 5) uses
    color/shapes contrast — kids sort by COLOR vs SHAPE attribute,
    bridges to Arc 5 Phase 3's sort-by-color and sort-by-shape work.
    This is cross-arc-package integration: the receptive package layers
    onto the cognitive sorting work for richer attribute-discrimination
    reasoning.

    Sentence-strips at material 4: this-is-a frame ("This is red") gives
    kids productive scaffold for the 8 most-common colors when they're
    ready to transition from receptive to productive.

    K-3 multilingual classroom relevance: color-naming is universally
    early-acquired across all 11 platform locales; some locales have
    minor color-name distinctions (e.g., Russian distinguishes 2 blues
    that English fuses into one — though Russian isn't a platform locale,
    the principle generalizes; some platform locales may have subtle
    color-distinction patterns). Operator-side teachers can layer in
    locale-specific color-vocabulary nuances at Grade 1+ extension.

