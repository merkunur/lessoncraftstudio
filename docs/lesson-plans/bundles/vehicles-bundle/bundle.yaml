title:
  en: "Vehicles — Complete K-3 Bundle"

description:
  en: "Comprehensive K-3 bundle centered on vehicle vocabulary + transportation classification + cross-strand work. 4 packages span vocabulary-acquisition (identify-and-name-vehicles + point-to-named-vehicle for receptive sibling) + world-knowledge classification (identify-transportation-types) + visual-discrimination (find-hidden-target-in-busy-scene composes against vehicles in busy-scene context). Suitable for a 3-4 week classroom unit on vehicles + transportation."

