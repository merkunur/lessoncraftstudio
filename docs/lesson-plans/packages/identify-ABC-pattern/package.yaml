compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / pattern-recognition.
    Secondary strand: vocabulary acquisition (vocab-anchored). Tertiary
    strand: working-memory + sequencing (3-distinct-item patterns require
    holding more vocabulary in mind than AAB/ABB doubled-element forms).

    Pairing pattern with prereq packages: identify-AB-pattern + identify-
    AAB-ABB-patterns (both Arc 7 Phase 1) provide foundational pattern-
    recognition. ABC extends to 3-distinct-items (no doubling shortcut).
    Sequential prereq-chain: kids who completed Phase 1 patterns ready
    for ABC.

    Cognitive-load progression vs Phase 1 patterns: ABC > AAB/ABB > AB.
    Reflected in differentiation thresholds (Pre-K: NOT appropriate;
    K: introductory). Pattern-recognition strand thus has graduated
    complexity ladder across Phase 1+2.

    Distinctive composition: 3 pattern-train ABC exercises (positions 1,
    3, 5) across animals/fruits/vehicles + 1 matching at position 2 +
    1 pattern-worksheet mixed at position 4. Mixed pattern-worksheet
    explicitly tests cognitive flexibility (kids switch between AB /
    AAB / ABB / ABC patterns mid-worksheet).

    K-3 multilingual classroom relevance: same as AB + AAB/ABB. Pattern-
    recognition is language-portable; vocabulary-anchored time use is
    high-leverage.

