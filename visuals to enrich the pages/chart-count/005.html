<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Bilddiagramm Arbeitsbl&auml;tter - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #2E5339 0%, #234530 40%, #1B3B2A 100%); overflow: hidden;">

        <!-- Chalkboard texture overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.06; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, transparent 1px, transparent 3px), repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0px, transparent 1px, transparent 3px);"></div>

        <!-- Chalk dust smudges -->
        <div style="position: absolute; top: 80px; left: 60px; width: 180px; height: 8px; background: rgba(245,240,230,0.06); border-radius: 4px; transform: rotate(-2deg);"></div>
        <div style="position: absolute; top: 520px; right: 40px; width: 140px; height: 6px; background: rgba(245,240,230,0.05); border-radius: 3px; transform: rotate(3deg);"></div>
        <div style="position: absolute; bottom: 260px; left: 30px; width: 100px; height: 5px; background: rgba(245,240,230,0.04); border-radius: 3px; transform: rotate(-1deg);"></div>

        <!-- Chalk tally marks (left side) -->
        <div style="position: absolute; top: 200px; left: 45px; display: flex; gap: 6px; opacity: 0.2; transform: rotate(-3deg);">
            <div style="width: 3px; height: 28px; background: #F5F0E6; border-radius: 1px;"></div>
            <div style="width: 3px; height: 28px; background: #F5F0E6; border-radius: 1px;"></div>
            <div style="width: 3px; height: 28px; background: #F5F0E6; border-radius: 1px;"></div>
            <div style="width: 3px; height: 28px; background: #F5F0E6; border-radius: 1px;"></div>
            <div style="width: 28px; height: 3px; background: #F5F0E6; border-radius: 1px; position: absolute; top: 12px; left: -2px; transform: rotate(-20deg);"></div>
        </div>
        <div style="position: absolute; top: 420px; left: 35px; display: flex; gap: 6px; opacity: 0.15; transform: rotate(2deg);">
            <div style="width: 3px; height: 24px; background: #F5F0E6; border-radius: 1px;"></div>
            <div style="width: 3px; height: 24px; background: #F5F0E6; border-radius: 1px;"></div>
            <div style="width: 3px; height: 24px; background: #F5F0E6; border-radius: 1px;"></div>
        </div>

        <!-- Chalk dots scattered -->
        <div style="position: absolute; top: 310px; left: 70px; width: 6px; height: 6px; background: rgba(245,240,230,0.2); border-radius: 50%;"></div>
        <div style="position: absolute; top: 350px; left: 55px; width: 5px; height: 5px; background: rgba(245,240,230,0.15); border-radius: 50%;"></div>
        <div style="position: absolute; top: 280px; right: 55px; width: 7px; height: 7px; background: rgba(245,240,230,0.18); border-radius: 50%;"></div>
        <div style="position: absolute; top: 460px; right: 65px; width: 5px; height: 5px; background: rgba(245,240,230,0.12); border-radius: 50%;"></div>
        <div style="position: absolute; top: 380px; right: 45px; width: 4px; height: 4px; background: rgba(245,240,230,0.15); border-radius: 50%;"></div>

        <!-- Chalk tally marks (right side) -->
        <div style="position: absolute; top: 390px; right: 40px; display: flex; gap: 5px; opacity: 0.18; transform: rotate(1deg);">
            <div style="width: 3px; height: 22px; background: #F5F0E6; border-radius: 1px;"></div>
            <div style="width: 3px; height: 22px; background: #F5F0E6; border-radius: 1px;"></div>
        </div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 22px; left: 25px; z-index: 100;">
            <div style="width: 98px; height: 98px; background: linear-gradient(145deg, #FDD835 0%, #F9A825 100%); border-radius: 50%; box-shadow: 0 8px 30px rgba(249,168,37,0.55), inset 0 -4px 10px rgba(0,0,0,0.12), inset 0 4px 8px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: #3E2723; text-shadow: 0 1px 2px rgba(255,255,255,0.4);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 32px; right: 32px; background: rgba(255,255,255,0.95); padding: 11px 22px; border-radius: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); border: 3px solid #E8842A;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #E8842A; letter-spacing: 1px;">KLASSE K-2</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 108px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 68px; color: #F5F0E6; margin: 0; letter-spacing: 4px; text-shadow: 3px 3px 0 rgba(0,0,0,0.25), 0 0 40px rgba(245,240,230,0.1);">BILDDIAGRAMM</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 40px; color: #F5C842; margin: 6px 0 0 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">Arbeitsbl&auml;tter</h2>
        </div>

        <!-- 3-Worksheet Staggered Display -->
        <div style="position: absolute; top: 270px; left: 50%; transform: translateX(-50%); width: 860px; height: 440px;">

            <!-- Left worksheet (smaller) -->
            <div style="position: absolute; left: 55px; top: 80px; z-index: 10;">
                <div style="width: 220px; height: 170px; background: white; border-radius: 8px; box-shadow: 0 12px 35px rgba(0,0,0,0.35), 0 0 0 3px rgba(255,255,255,0.3); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/chart%20count/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Bilddiagramm Arbeitsblatt">
                </div>
            </div>

            <!-- Center worksheet (hero - largest) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 20;">
                <div style="position: relative;">
                    <!-- Red magnets -->
                    <div style="position: absolute; top: -10px; left: 40px; width: 28px; height: 28px; background: radial-gradient(circle at 40% 35%, #EF5350, #C62828); border-radius: 50%; box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3); z-index: 5;"></div>
                    <div style="position: absolute; top: -10px; right: 40px; width: 28px; height: 28px; background: radial-gradient(circle at 40% 35%, #EF5350, #C62828); border-radius: 50%; box-shadow: 0 3px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.3); z-index: 5;"></div>
                    <img src="https://www.lessoncraftstudio.com/samples/german/chart%20count/sample-1.jpeg" style="width: 300px; height: 232px; object-fit: cover; border-radius: 10px; border: 5px solid white; box-shadow: 0 18px 50px rgba(0,0,0,0.4), 0 0 25px rgba(245,200,66,0.15);">
                </div>
            </div>

            <!-- Right worksheet (answer key) -->
            <div style="position: absolute; right: 55px; top: 60px; z-index: 10;">
                <div style="position: relative; width: 210px; height: 162px; background: white; border-radius: 8px; box-shadow: 0 12px 35px rgba(0,0,0,0.35), 0 0 0 3px rgba(255,255,255,0.3); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/chart%20count/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="L&ouml;sungsblatt">
                </div>
                <div style="position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); background: #66BB6A; padding: 4px 14px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.25);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: white; white-space: nowrap;">L&Ouml;SUNG</span>
                </div>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 108px; left: 0; right: 0; background: linear-gradient(90deg, rgba(232,132,42,0.95) 0%, rgba(210,100,20,0.95) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.2), 0 4px 20px rgba(0,0,0,0.2);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 27px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); letter-spacing: 2px;">Z&auml;hlen, ausmalen &amp; lernen!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: rgba(255,255,255,0.95); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); border: 3px solid #E8842A;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #E8842A;">Viele Themen</span>
            </div>
            <div style="background: rgba(255,255,255,0.95); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); border: 3px solid #F5C842;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #C6960A;">Mit L&ouml;sungsblatt</span>
            </div>
            <div style="background: rgba(255,255,255,0.95); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); border: 3px solid #2E5339;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #2E5339;">Druckfertig</span>
            </div>
        </div>

    </div>
</body>
</html>
