assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Match an emotion-face to a situation in 8 of 10 emotion-
        situation cards.
      - Articulate own emotion in a given situation ('I would feel ___
        if ___') in 7 of 10 trials.
      - Use at least 5 of 7 emotion vocabulary items (happy, sad,
        scared, surprised, proud, frustrated, excited) in productive-
        language attempts.

    Differentiation:
    - Pre-K: 4 core emotions (happy, sad, scared, angry); receptive
      face-matching only.
    - K: 7 emotions; situation-emotion matching + productive language
      frames.
    - Grade 1+: extend to other-people emotion-recognition (identify-
      emotions-of-others-from-faces Arc 11+ candidate); bridge to
      empathy-and-response work.

