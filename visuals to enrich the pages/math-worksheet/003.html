<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPT Thumbnail - Variety</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(180deg, #F0FDF4 0%, #F3E8FF 50%, #FEF3C7 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Decorative elements -->
        <div style="position: absolute; top: 20px; left: 30px; font-size: 40px; opacity: 0.3;">⭐</div>
        <div style="position: absolute; top: 60px; right: 60px; font-size: 30px; opacity: 0.3;">✨</div>
        <div style="position: absolute; bottom: 120px; left: 50px; font-size: 35px; opacity: 0.3;">🌟</div>
        <div style="position: absolute; bottom: 80px; right: 40px; font-size: 28px; opacity: 0.3;">⭐</div>

        <!-- Title Section -->
        <div style="
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 56px;
                color: #5B21B6;
                margin: 0;
                text-shadow: 0 3px 6px rgba(91, 33, 182, 0.12);
            ">FROM EASY TO CHALLENGING</h1>
            <p style="
                font-family: 'Nunito', sans-serif;
                font-weight: 600;
                font-size: 28px;
                color: #7C3AED;
                margin: 10px 0 0 0;
            ">Differentiation Ready</p>
        </div>

        <!-- Difficulty Labels -->
        <div style="
            position: absolute;
            top: 170px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 180px;
        ">
            <!-- Easy Label -->
            <div style="
                background: linear-gradient(135deg, #22C55E, #16A34A);
                padding: 10px 30px;
                border-radius: 25px;
                box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 24px;
                    color: white;
                ">EASY</span>
            </div>

            <!-- Medium Label -->
            <div style="
                background: linear-gradient(135deg, #EAB308, #CA8A04);
                padding: 10px 30px;
                border-radius: 25px;
                box-shadow: 0 4px 15px rgba(234, 179, 8, 0.35);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 24px;
                    color: white;
                ">MEDIUM</span>
            </div>

            <!-- Challenge Label -->
            <div style="
                background: linear-gradient(135deg, #7C3AED, #6D28D9);
                padding: 10px 30px;
                border-radius: 25px;
                box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 24px;
                    color: white;
                ">CHALLENGE</span>
            </div>
        </div>

        <!-- Connecting Lines Container -->
        <div style="
            position: absolute;
            top: 230px;
            left: 0;
            right: 0;
            height: 40px;
            display: flex;
            justify-content: center;
            gap: 180px;
        ">
            <div style="width: 4px; height: 40px; background: linear-gradient(180deg, #22C55E, #22C55E80);"></div>
            <div style="width: 4px; height: 40px; background: linear-gradient(180deg, #EAB308, #EAB30880);"></div>
            <div style="width: 4px; height: 40px; background: linear-gradient(180deg, #7C3AED, #7C3AED80);"></div>
        </div>

        <!-- Three Worksheets -->
        <div style="
            position: absolute;
            top: 280px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            gap: 40px;
            align-items: flex-start;
        ">
            <!-- Easy Worksheet -->
            <div style="
                background: white;
                border-radius: 12px;
                padding: 8px;
                box-shadow: 0 10px 30px rgba(34, 197, 94, 0.25);
                border: 4px solid #22C55E;
                transform: rotate(-3deg);
            ">
                <img src="https://www.lessoncraftstudio.com/samples/english/math%20worksheet/sample-2.jpeg"
                     alt="Easy Worksheet"
                     style="width: 220px; height: 280px; object-fit: cover; border-radius: 6px;">
            </div>

            <!-- Medium Worksheet -->
            <div style="
                background: white;
                border-radius: 12px;
                padding: 8px;
                box-shadow: 0 12px 35px rgba(234, 179, 8, 0.25);
                border: 4px solid #EAB308;
                transform: translateY(-10px);
            ">
                <img src="https://www.lessoncraftstudio.com/samples/english/math%20worksheet/sample-12.jpeg"
                     alt="Medium Worksheet"
                     style="width: 220px; height: 280px; object-fit: cover; border-radius: 6px;">
            </div>

            <!-- Challenge Worksheet -->
            <div style="
                background: white;
                border-radius: 12px;
                padding: 8px;
                box-shadow: 0 10px 30px rgba(124, 58, 237, 0.25);
                border: 4px solid #7C3AED;
                transform: rotate(3deg);
            ">
                <img src="https://www.lessoncraftstudio.com/samples/english/math%20worksheet/sample-20.jpeg"
                     alt="Challenge Worksheet"
                     style="width: 220px; height: 280px; object-fit: cover; border-radius: 6px;">
            </div>
        </div>

        <!-- Progress Path -->
        <div style="
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        ">
            <!-- START dot -->
            <div style="
                width: 50px;
                height: 50px;
                background: linear-gradient(135deg, #22C55E, #16A34A);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            ">
                <span style="color: white; font-size: 24px;">▶</span>
            </div>

            <!-- Path line segment 1 -->
            <div style="flex: 1; height: 8px; background: linear-gradient(90deg, #22C55E, #EAB308); border-radius: 4px; margin: 0 -5px;"></div>

            <!-- Middle dot 1 -->
            <div style="
                width: 30px;
                height: 30px;
                background: linear-gradient(135deg, #84CC16, #65A30D);
                border-radius: 50%;
                box-shadow: 0 3px 10px rgba(132, 204, 22, 0.4);
            "></div>

            <!-- Path line segment 2 -->
            <div style="flex: 1; height: 8px; background: linear-gradient(90deg, #EAB308, #EAB308); border-radius: 4px; margin: 0 -5px;"></div>

            <!-- Middle dot 2 -->
            <div style="
                width: 30px;
                height: 30px;
                background: linear-gradient(135deg, #EAB308, #CA8A04);
                border-radius: 50%;
                box-shadow: 0 3px 10px rgba(234, 179, 8, 0.4);
            "></div>

            <!-- Path line segment 3 -->
            <div style="flex: 1; height: 8px; background: linear-gradient(90deg, #EAB308, #7C3AED); border-radius: 4px; margin: 0 -5px;"></div>

            <!-- Middle dot 3 -->
            <div style="
                width: 30px;
                height: 30px;
                background: linear-gradient(135deg, #A855F7, #9333EA);
                border-radius: 50%;
                box-shadow: 0 3px 10px rgba(168, 85, 247, 0.4);
            "></div>

            <!-- Path line segment 4 -->
            <div style="flex: 1; height: 8px; background: linear-gradient(90deg, #7C3AED, #7C3AED); border-radius: 4px; margin: 0 -5px;"></div>

            <!-- SUCCESS dot -->
            <div style="
                width: 50px;
                height: 50px;
                background: linear-gradient(135deg, #7C3AED, #5B21B6);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            ">
                <span style="color: white; font-size: 24px;">⭐</span>
            </div>
        </div>

        <!-- Path Labels -->
        <div style="
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            display: flex;
            justify-content: space-between;
        ">
            <span style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 20px;
                color: #16A34A;
            ">START</span>
            <span style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 20px;
                color: #5B21B6;
            ">SUCCESS!</span>
        </div>

        <!-- Bottom Tagline -->
        <div style="
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
        ">
            <div style="
                display: inline-block;
                background: linear-gradient(135deg, #7C3AED, #3B82F6);
                padding: 15px 40px;
                border-radius: 30px;
                box-shadow: 0 6px 20px rgba(124, 58, 237, 0.3);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 26px;
                    color: white;
                ">Perfect for Mixed-Ability Classes</span>
            </div>
        </div>
    </div>
</body>
</html>
