<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Zeichnen und Ausmalen - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #E8F5E9 0%, #F1F8E9 40%, #FFFFFF 100%); overflow: hidden;">

        <!-- Subtle dot pattern overlay -->
        <div style="position: absolute; inset: 0; background: radial-gradient(circle, rgba(0,105,92,0.04) 1px, transparent 1px); background-size: 25px 25px;"></div>

        <!-- Sparkle accents -->
        <div style="position: absolute; top: 85px; left: 200px; font-size: 20px; color: #FFD600; transform: rotate(15deg);">&#10022;</div>
        <div style="position: absolute; top: 60px; right: 180px; font-size: 16px; color: #FFD600; transform: rotate(-10deg);">&#10022;</div>
        <div style="position: absolute; bottom: 230px; left: 60px; font-size: 18px; color: #FFD600; transform: rotate(25deg);">&#10022;</div>
        <div style="position: absolute; bottom: 240px; right: 55px; font-size: 14px; color: #FFD600; transform: rotate(-20deg);">&#10022;</div>

        <!-- Confetti dots -->
        <div style="position: absolute; top: 110px; left: 100px; width: 12px; height: 12px; background: #00695C; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; top: 80px; right: 120px; width: 10px; height: 10px; background: #FF6B6B; border-radius: 50%; opacity: 0.4;"></div>
        <div style="position: absolute; top: 140px; left: 300px; width: 9px; height: 9px; background: #FFD600; border-radius: 50%; opacity: 0.6;"></div>
        <div style="position: absolute; bottom: 260px; right: 100px; width: 11px; height: 11px; background: #6A1B9A; border-radius: 50%; opacity: 0.4;"></div>

        <!-- GRATIS Badge - Purple Circle -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(145deg, #7B1FA2 0%, #6A1B9A 100%); box-shadow: 0 6px 25px rgba(106,27,154,0.5), inset 0 -3px 10px rgba(0,0,0,0.15), inset 0 3px 6px rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">GRATIS</span>
            </div>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 28px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 58px; color: #00695C; margin: 0; text-shadow: 3px 3px 0 rgba(255,255,255,0.8);">Das steckt drin!</h1>
            <div style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 22px; color: #6A1B9A; margin-top: 5px; letter-spacing: 1px;">P&auml;dagogisch wertvoll</div>
        </div>

        <!-- 2x2 Feature Card Grid -->
        <div style="position: absolute; top: 155px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: 1fr 1fr; gap: 22px; width: 860px;">

            <!-- Card 1: Rastermethode (teal) -->
            <div style="background: linear-gradient(145deg, #E0F2F1 0%, #B2DFDB 100%); border-radius: 20px; padding: 22px; border: 3px solid #00897B; box-shadow: 0 8px 30px rgba(0,150,136,0.25); display: flex; gap: 18px; align-items: center;">
                <div style="flex-shrink: 0;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/draw%20and%20color/sample-6.jpeg" style="width: 140px; height: 108px; object-fit: cover; border-radius: 12px; border: 3px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
                </div>
                <div>
                    <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #00695C;">Rastermethode</div>
                    <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: #00796B; margin-top: 4px; line-height: 1.4;">Schritt f&uuml;r Schritt zeichnen lernen</div>
                </div>
            </div>

            <!-- Card 2: Feinmotorik (coral) -->
            <div style="background: linear-gradient(145deg, #FFEBEE 0%, #FFCDD2 100%); border-radius: 20px; padding: 22px; border: 3px solid #EF5350; box-shadow: 0 8px 30px rgba(244,67,54,0.2); display: flex; gap: 18px; align-items: center;">
                <div style="flex-shrink: 0;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/draw%20and%20color/sample-2.jpeg" style="width: 140px; height: 108px; object-fit: cover; border-radius: 12px; border: 3px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
                </div>
                <div>
                    <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #C62828;">Feinmotorik</div>
                    <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: #D32F2F; margin-top: 4px; line-height: 1.4;">Stiftkontrolle spielerisch &uuml;ben</div>
                </div>
            </div>

            <!-- Card 3: Konzentration (amber) -->
            <div style="background: linear-gradient(145deg, #FFF8E1 0%, #FFECB3 100%); border-radius: 20px; padding: 22px; border: 3px solid #FFB300; box-shadow: 0 8px 30px rgba(255,179,0,0.25); display: flex; gap: 18px; align-items: center;">
                <div style="flex-shrink: 0;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/draw%20and%20color/sample-3.jpeg" style="width: 140px; height: 108px; object-fit: cover; border-radius: 12px; border: 3px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
                </div>
                <div>
                    <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #E65100;">Konzentration</div>
                    <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: #F57C00; margin-top: 4px; line-height: 1.4;">Genaues Beobachten trainieren</div>
                </div>
            </div>

            <!-- Card 4: Kreativit&auml;t (purple) -->
            <div style="background: linear-gradient(145deg, #F3E5F5 0%, #E1BEE7 100%); border-radius: 20px; padding: 22px; border: 3px solid #AB47BC; box-shadow: 0 8px 30px rgba(171,71,188,0.25); display: flex; gap: 18px; align-items: center;">
                <div style="flex-shrink: 0;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/draw%20and%20color/sample-5.jpeg" style="width: 140px; height: 108px; object-fit: cover; border-radius: 12px; border: 3px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.15);">
                </div>
                <div>
                    <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #7B1FA2;">Kreativit&auml;t</div>
                    <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: #8E24AA; margin-top: 4px; line-height: 1.4;">Eigene Bilder gestalten</div>
                </div>
            </div>
        </div>

        <!-- Bottom Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;">
            <div style="background: #00695C; padding: 12px 22px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,105,92,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Rastermethode</span>
            </div>
            <div style="background: #6A1B9A; padding: 12px 22px; border-radius: 25px; box-shadow: 0 4px 15px rgba(106,27,154,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Vorschule &ndash; 2. Klasse</span>
            </div>
            <div style="background: #E65100; padding: 12px 22px; border-radius: 25px; box-shadow: 0 4px 15px rgba(230,81,0,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Sofort einsetzbar</span>
            </div>
        </div>

    </div>
</body>
</html>
