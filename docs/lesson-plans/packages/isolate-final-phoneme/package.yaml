# Teaching package — isolate final phoneme
# Arc 19 Phase 1.2 Slot 2 (early-literacy / phonological-awareness strand 4/9 → 5/9). Pair-coherent with Phase 1.1 Slot 3 isolate-initial-phoneme + Phase 1.2 Slots 3+4 isolate-medial-phoneme + blend-phonemes-cvc. Reverse-end skill of isolate-initial-phoneme: kids identify the LAST SOUND in spoken CVC words (cat → /t/; dog → /g/; mom → /m/). Prerequisite per learning-targets.json line 38: isolate-initial-phoneme (Phase 1.1 Slot 3).

targetSlug: isolate-final-phoneme
language: en
title:
  en: "Last Sounds — what sound does the word END with?"
description:
  en: "Kindergarten early-literacy package teaching kids to isolate the FINAL PHONEME (last sound) in spoken CVC words. Direct extension of isolate-initial-phoneme (Phase 1.1 Slot 3) to the word-ending position. Phonological-awareness strand advances 4/9 → 5/9 (pair-coherent with Slots 3+4 advancing 5/9 → 7/9). Per learning-targets.json line 38 prerequisite: isolate-initial-phoneme (Phase 1.1 Slot 3 ✓ SHIPPED). Critical phoneme-isolation pair: initial-phoneme (Phase 1.1) + final-phoneme (this package) bracket the word; together they prepare kids for medial-phoneme work (Phase 1.2 Slot 3) + full CVC phoneme-segmentation (Phase 1.3 candidate). Per §A.13.30 K-1 informal framing: K final-phoneme isolation work is CONCRETE SOUND-RECOGNITION at the word-end position — kids hear a word, slow it down, name the last sound, match it to an ending-sound picture or letter. The pedagogy uses everyday language ('last sound' / 'ending sound' / 'final sound'). NOT formal phonetics-theory pedagogy (consonant-class taxonomy + IPA transcription is post-Grade-3 academic work). CCSS.RF.K.2d primary anchor ('Isolate and pronounce the initial, medial vowel, and final sounds (phonemes) in three-phoneme CVC words'). 5 worksheet exercises + 8 printable materials over a 1-week unit. **Phonological-awareness pedagogy is locale-specific because phoneme inventories differ per language.** This en package uses the English phoneme set; pt variant uses the Brazilian Portuguese phoneme set per BR-MEC framework. Materials list mirrors isolate-initial-phoneme (Phase 1.1 Slot 3) Literacy 8-material canonical."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class last-sound hook. Teacher says a word slowly,
      EXTRA-stressing the final consonant: "C-a-T. What sound does
      CAT END with?" Class: /t/! Teacher writes the letter T + a
      cat picture on the board. "Yes — CAT ends with the /t/ sound."
      Repeats with: "D-o-G. Last sound?" Class: /g/! "M-o-M. Last
      sound?" /m/! "S-u-N. Last sound?" /n/! Pattern emphasis:
      "Every word ENDS with a sound too — not just starts. The
      last sound is the ENDING SOUND. We can hear it if we say
      the word slowly + listen for the FINAL part." Critical
      pedagogical framing — bracket the word: "Last week we
      learned the FIRST sound. This week we're learning the LAST
      sound. CAT starts with /k/ + ends with /t/. The middle
      sound /a/ we'll learn next time. The first + last sounds
      bracket the word."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + last-sound recognition routine. Each pair
      receives 8 picture cards + 4 letter cards. Pair takes
      turns: kid A names a picture (cat); kid B identifies the
      last sound (/t/) + places the picture under the matching
      ending-letter card (T). Repeats with hat, bat, mat all
      going under T (rhyme-family clustering: kids notice that
      words sharing an ending sound also rhyme — this is the
      bridge from final-phoneme isolation back to rhyme work).
      Critical pedagogical move: SLOW-PRONUNCIATION with extra
      stress on the final consonant. K kids often hear the
      stressed VOWEL clearly + miss the unstressed FINAL
      consonant. Recast errors with consonant-emphasis ("you
      said BUS ends with /u/ — that's the MIDDLE sound. Let's
      say it slowly with extra stress on the last sound: B-u-SSS.
      What's the FINAL sound? /s/, the hissing sound at the
      end."). Some kids may benefit from hand-cupping the ear
      to focus on the word-end. Build final-phoneme fluency
      with single-consonant final sounds; defer consonant-blend
      codas (/st/, /nd/, /mp/) to later phonological-awareness
      work.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (picture →
      final letter; kids match pictures to the letter representing
      their last sound). Station 2: word-guess (kids fill in the
      missing FINAL letter of a picture's name). Station 3:
      picture-sort (kids sort pictures into groups by ending
      sound — rhyme-family clustering surfaces naturally). Station
      4: word-scramble (kids unscramble simple CVC words; reinforces
      sound-letter mapping at word level including the final-
      letter position).
  closure:
    durationMinutes: 5
    body: |
      Whole-class last-sound quick-recall. Teacher names a word;
      class shouts the last sound. "Sun!" /n/! "Tree!" /e/! "Pop!"
      /p/! "Fish!" /sh/! Teacher closes: "Every word has a first
      sound AND a last sound. Hearing the LAST sound is the
      SECOND step in reading — the first step was first-sound
      isolation last week. Next we'll learn the MIDDLE sound —
      the vowel between the first and last. Three sounds in CVC
      words: first, middle, last. We've learned first + last;
      middle comes next."

