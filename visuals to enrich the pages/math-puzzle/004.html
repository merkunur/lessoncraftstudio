<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Math Puzzles - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(150deg, #E91E63 0%, #F06292 50%, #FF8A80 100%); overflow: hidden;">

        <!-- Confetti pieces scattered -->
        <div style="position: absolute; top: 80px; left: 60px; width: 20px; height: 20px; background: #FFD600; transform: rotate(45deg);"></div>
        <div style="position: absolute; top: 150px; left: 120px; width: 15px; height: 15px; background: #00BCD4; border-radius: 50%;"></div>
        <div style="position: absolute; top: 100px; right: 80px; width: 18px; height: 18px; background: #7B1FA2; transform: rotate(30deg);"></div>
        <div style="position: absolute; top: 200px; right: 60px; width: 12px; height: 12px; background: #4CAF50; border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 300px; left: 40px; width: 16px; height: 16px; background: #FFD600; transform: rotate(60deg);"></div>
        <div style="position: absolute; bottom: 350px; right: 50px; width: 14px; height: 14px; background: #00BCD4; border-radius: 50%;"></div>
        <div style="position: absolute; top: 300px; left: 30px; width: 22px; height: 8px; background: #7B1FA2; border-radius: 4px; transform: rotate(-20deg);"></div>
        <div style="position: absolute; top: 250px; right: 40px; width: 22px; height: 8px; background: #4CAF50; border-radius: 4px; transform: rotate(25deg);"></div>
        <div style="position: absolute; bottom: 220px; left: 80px; width: 10px; height: 10px; background: white; border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 250px; right: 90px; width: 10px; height: 10px; background: white; border-radius: 50%;"></div>

        <!-- FREE Badge as balloon -->
        <div style="position: absolute; top: 20px; left: 30px; z-index: 100;">
            <!-- Balloon string -->
            <div style="position: absolute; top: 95px; left: 50%; width: 2px; height: 40px; background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.3)); transform: translateX(-50%) rotate(5deg);"></div>
            <!-- Balloon -->
            <div style="width: 100px; height: 110px; background: linear-gradient(145deg, #FFD600 0%, #FFC107 100%); box-shadow: 0 8px 25px rgba(255,214,0,0.5), inset -15px -15px 30px rgba(0,0,0,0.1), inset 15px 15px 30px rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%; position: relative;">
                <!-- Balloon knot -->
                <div style="position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; background: #FFC107; clip-path: polygon(50% 100%, 0% 0%, 100% 0%);"></div>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #7B1FA2; text-shadow: 1px 1px 2px rgba(255,255,255,0.5);">FREE</span>
            </div>
        </div>

        <!-- Heart badge -->
        <div style="position: absolute; top: 30px; right: 30px; background: white; padding: 12px 20px; border-radius: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 20px;">❤️</span>
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: #E91E63;">KIDS LOVE IT!</span>
        </div>

        <!-- Main Title - bouncy 3D style -->
        <div style="position: absolute; top: 100px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 90px; color: white; margin: 0; text-shadow: 6px 6px 0 #7B1FA2, 10px 10px 0 rgba(0,0,0,0.2); letter-spacing: -2px;">PUZZLE</h1>
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 90px; color: #FFD600; margin: -25px 0 0 0; text-shadow: 6px 6px 0 #E65100, 10px 10px 0 rgba(0,0,0,0.2); letter-spacing: -2px;">PARTY!</h1>
        </div>

        <!-- Subtitle -->
        <div style="position: absolute; top: 285px; left: 0; right: 0; text-align: center;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); background: rgba(123,31,162,0.7); padding: 8px 25px; border-radius: 25px;">Math Practice in Disguise!</span>
        </div>

        <!-- Worksheet with puzzle piece characters around it -->
        <div style="position: absolute; top: 340px; left: 50%; transform: translateX(-50%); width: 700px; height: 380px;">

            <!-- Main worksheet -->
            <div style="position: absolute; left: 50%; top: 20px; transform: translateX(-50%); z-index: 20;">
                <img src="https://www.lessoncraftstudio.com/samples/english/math%20puzzle/sample-2.jpeg" style="width: 240px; height: 310px; object-fit: cover; border-radius: 14px; border: 6px solid white; box-shadow: 0 15px 45px rgba(0,0,0,0.35);">
            </div>

            <!-- Puzzle piece character 1 (orange, left) with googly eyes -->
            <div style="position: absolute; left: 60px; top: 40px; transform: rotate(-12deg);">
                <div style="width: 90px; height: 90px; background: linear-gradient(145deg, #FF8C42 0%, #E65100 100%); border-radius: 14px; box-shadow: 0 10px 30px rgba(255,140,66,0.45); position: relative;">
                    <!-- Tab -->
                    <div style="position: absolute; right: -14px; top: 50%; transform: translateY(-50%); width: 20px; height: 30px; background: linear-gradient(145deg, #FF8C42 0%, #E65100 100%); border-radius: 0 15px 15px 0;"></div>
                    <!-- Googly eyes -->
                    <div style="position: absolute; top: 22px; left: 18px; width: 24px; height: 24px; background: white; border-radius: 50%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);">
                        <div style="position: absolute; top: 8px; left: 10px; width: 10px; height: 10px; background: #1a1a1a; border-radius: 50%;"></div>
                    </div>
                    <div style="position: absolute; top: 22px; right: 18px; width: 24px; height: 24px; background: white; border-radius: 50%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);">
                        <div style="position: absolute; top: 8px; left: 6px; width: 10px; height: 10px; background: #1a1a1a; border-radius: 50%;"></div>
                    </div>
                    <!-- Smile -->
                    <div style="position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: 35px; height: 18px; border-bottom: 4px solid white; border-radius: 0 0 20px 20px;"></div>
                </div>
            </div>

            <!-- Puzzle piece character 2 (purple, right) -->
            <div style="position: absolute; right: 70px; top: 60px; transform: rotate(10deg);">
                <div style="width: 85px; height: 85px; background: linear-gradient(145deg, #7B1FA2 0%, #4A148C 100%); border-radius: 13px; box-shadow: 0 10px 30px rgba(123,31,162,0.45); position: relative;">
                    <!-- Tab -->
                    <div style="position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%); width: 28px; height: 20px; background: linear-gradient(145deg, #7B1FA2 0%, #4A148C 100%); border-radius: 0 0 14px 14px;"></div>
                    <!-- Googly eyes -->
                    <div style="position: absolute; top: 18px; left: 14px; width: 22px; height: 22px; background: white; border-radius: 50%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);">
                        <div style="position: absolute; top: 6px; left: 4px; width: 10px; height: 10px; background: #1a1a1a; border-radius: 50%;"></div>
                    </div>
                    <div style="position: absolute; top: 18px; right: 14px; width: 22px; height: 22px; background: white; border-radius: 50%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);">
                        <div style="position: absolute; top: 6px; right: 4px; width: 10px; height: 10px; background: #1a1a1a; border-radius: 50%;"></div>
                    </div>
                    <!-- Excited open mouth -->
                    <div style="position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: 28px; height: 20px; background: #FF5252; border-radius: 50%; border: 3px solid white;"></div>
                </div>
            </div>

            <!-- Puzzle piece character 3 (cyan, bottom left) -->
            <div style="position: absolute; left: 100px; bottom: 20px; transform: rotate(8deg);">
                <div style="width: 80px; height: 80px; background: linear-gradient(145deg, #00BCD4 0%, #0097A7 100%); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,188,212,0.45); position: relative;">
                    <!-- Tab -->
                    <div style="position: absolute; left: -13px; top: 50%; transform: translateY(-50%); width: 18px; height: 26px; background: linear-gradient(145deg, #00BCD4 0%, #0097A7 100%); border-radius: 13px 0 0 13px;"></div>
                    <!-- Winking eyes -->
                    <div style="position: absolute; top: 20px; left: 12px; width: 20px; height: 20px; background: white; border-radius: 50%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);">
                        <div style="position: absolute; top: 7px; left: 7px; width: 8px; height: 8px; background: #1a1a1a; border-radius: 50%;"></div>
                    </div>
                    <!-- Wink (closed eye) -->
                    <div style="position: absolute; top: 28px; right: 12px; width: 18px; height: 4px; background: #1a1a1a; border-radius: 2px; transform: rotate(-5deg);"></div>
                    <!-- Smile -->
                    <div style="position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: 30px; height: 15px; border-bottom: 4px solid white; border-radius: 0 0 18px 18px;"></div>
                </div>
            </div>

            <!-- Puzzle piece character 4 (green, bottom right) -->
            <div style="position: absolute; right: 90px; bottom: 40px; transform: rotate(-6deg);">
                <div style="width: 75px; height: 75px; background: linear-gradient(145deg, #4CAF50 0%, #388E3C 100%); border-radius: 11px; box-shadow: 0 10px 30px rgba(76,175,80,0.45); position: relative;">
                    <!-- Tab -->
                    <div style="position: absolute; top: -13px; left: 50%; transform: translateX(-50%); width: 24px; height: 18px; background: linear-gradient(145deg, #4CAF50 0%, #388E3C 100%); border-radius: 12px 12px 0 0;"></div>
                    <!-- Googly eyes -->
                    <div style="position: absolute; top: 16px; left: 10px; width: 20px; height: 20px; background: white; border-radius: 50%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);">
                        <div style="position: absolute; top: 5px; left: 8px; width: 8px; height: 8px; background: #1a1a1a; border-radius: 50%;"></div>
                    </div>
                    <div style="position: absolute; top: 16px; right: 10px; width: 20px; height: 20px; background: white; border-radius: 50%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);">
                        <div style="position: absolute; top: 5px; left: 4px; width: 8px; height: 8px; background: #1a1a1a; border-radius: 50%;"></div>
                    </div>
                    <!-- Big grin -->
                    <div style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: 32px; height: 16px; background: white; border-radius: 0 0 16px 16px;"></div>
                </div>
            </div>

            <!-- Speech bubble -->
            <div style="position: absolute; left: 155px; top: 5px; background: white; padding: 10px 16px; border-radius: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #E91E63;">Let's solve it!</span>
                <!-- Speech bubble tail -->
                <div style="position: absolute; bottom: -8px; left: 20px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 12px solid white;"></div>
            </div>

            <!-- Peeking eyes from bottom edge -->
            <div style="position: absolute; bottom: -15px; left: 30px;">
                <div style="display: flex; gap: 12px;">
                    <div style="width: 28px; height: 20px; background: white; border-radius: 50% 50% 0 0; display: flex; align-items: center; justify-content: center; padding-top: 3px;">
                        <div style="width: 12px; height: 12px; background: #1a1a1a; border-radius: 50%;"></div>
                    </div>
                    <div style="width: 28px; height: 20px; background: white; border-radius: 50% 50% 0 0; display: flex; align-items: center; justify-content: center; padding-top: 3px;">
                        <div style="width: 12px; height: 12px; background: #1a1a1a; border-radius: 50%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 100px; left: 0; right: 0; background: linear-gradient(90deg, rgba(123,31,162,0.95) 0%, rgba(74,20,140,0.95) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.2), 0 4px 20px rgba(0,0,0,0.2);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); letter-spacing: 2px;">CLASSROOM FUN TIME!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;">
            <div style="background: white; padding: 12px 18px; border-radius: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 3px solid #FFD600;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #F57F17;">Perfect for Centers!</span>
            </div>
            <div style="background: white; padding: 12px 18px; border-radius: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 3px solid #00BCD4;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #00838F;">Brain Breaks!</span>
            </div>
            <div style="background: white; padding: 12px 18px; border-radius: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 3px solid #4CAF50;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #2E7D32;">Early Finishers!</span>
            </div>
        </div>

    </div>
</body>
</html>
