# Teaching package — identify a line of symmetry (informal)
# Arc 17 Phase 1.4 (geometry 6/8 → 7/8). K-Grade 2 informal anchor for noticing bilateral symmetry in simple shapes. Formal axis-of-symmetry standard (CCSS.4.G.A.3) lives outside K-3 scope; this package teaches the K-3-appropriate noticing skill via folding + matching activities.

targetSlug: identify-symmetry-line
language: en
title:
  en: "Notice Lines of Symmetry — fold and match the two halves"

description:
  en: "K-Grade 2 math/geometry package teaching kids to notice when a shape has a line of symmetry — a line that lets you fold the shape so the two halves MATCH. A circle has many such lines; a square has 4; a rectangle has 2; an equilateral triangle has 3; the letter A has 1 (vertical); the letter B has 1 (horizontal); the letter F has none. Builds on the Arc 5 identify-2d-shapes-basic foundation; extends geometry strand from shape-recognition + composition (Phase 1.3 compose-shapes-from-parts) into spatial-relation noticing. The K-3 framing is NOTICING / SPOTTING symmetry — kids fold paper shapes and see whether the halves overlap, or look at pictures and spot the fold line that would make halves match. The FORMAL axis-of-symmetry identification (counting exact lines on irregular shapes, identifying rotational symmetry, distinguishing reflective from rotational) is the Grade 4 standard (CCSS.4.G.A.3) and lives outside K-3 scope. EYFS.ELG.UW partial fit at K-2 level for the noticing skill. Geometry strand 5/8 → 6/8 with Phase 1.3 compose-shapes-from-parts already shipped; this package brings the strand to 6/8 → 7/8 (1 remaining canonical target: partition-shape-halves-quarters). 5 worksheet exercises + 7 printable materials over a 1-week unit. Manipulative-cut-outs in single-repeat mode is load-bearing — kids physically fold paper shapes to discover symmetry."

durationMinutes: 25

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + symmetry-fold introduction. Teacher
      holds up a paper heart. "Watch what happens when I
      fold this heart down the middle." Teacher folds the
      heart along its vertical center. "The two halves
      MATCH! They overlap exactly. We say this heart has a
      LINE OF SYMMETRY — a fold line that makes the two
      halves match." Teacher unfolds the heart + traces the
      fold line with a finger. Then a non-symmetric shape:
      teacher holds up a paper leaf with one large lobe +
      one small lobe (asymmetric leaf). "Watch this leaf —
      can I fold it so the halves match?" Teacher tries
      several fold directions; none produce matching
      halves. "This leaf has NO line of symmetry. The two
      sides don't match no matter where I fold." Teacher
      repeats with familiar shapes: a square (4 fold lines
      — vertical, horizontal, and the two diagonals); a
      rectangle (2 fold lines — vertical + horizontal,
      but NOT the diagonals because the halves are
      different shapes); a circle (many fold lines — you
      can fold any way through the center); a triangle
      (depends — equilateral has 3, isoceles has 1, scalene
      has 0). Pattern emphasis: "A SYMMETRY LINE is a fold
      line that makes the two halves MATCH. Some shapes
      have many; some have one; some have NONE."
  contentActivity:
    durationMinutes: 10
    body: |
      Pair work + paper-folding routine. Each pair receives
      a stack of paper shape cut-outs (8-10 shapes per pair:
      circle, square, rectangle, equilateral triangle,
      isoceles triangle, scalene triangle, heart, star,
      letter A, letter F, butterfly outline, leaf outline).
      Pair plays the symmetry-discovery game: kid A picks a
      shape; both kids physically try to fold it different
      ways to find symmetry lines. They draw each fold line
      on the shape with a pencil. After exploring all
      shapes, they record: how many symmetry lines does
      each shape have? (circle: many — kids might say 'lots'
      or 'so many'; square: 4; rectangle: 2; equilateral
      triangle: 3; scalene triangle: 0; heart: 1; letter A:
      1; letter F: 0; butterfly: 1.) Recast errors by
      folding alongside: "you said the rectangle has 4
      lines like the square — let's try folding diagonally.
      See how the two halves are different shapes? That
      diagonal isn't a symmetry line for the rectangle."
  scaffold:
    durationMinutes: 7
    body: |
      Station rotation. Station 1: matching activity — match
      each shape to its symmetry-line count (circle → many;
      square → 4; rectangle → 2; equilateral triangle → 3;
      heart → 1; letter F → 0). Station 2: picture-sort —
      sort shapes into 'has symmetry' / 'no symmetry'
      categories. Station 3: missing-pieces — given the
      left half of a symmetric shape, complete the right
      half (kids reason about what the matching half would
      look like). Station 4: matching variant — pair each
      symmetric shape with its mirror-image partner.
  closure:
    durationMinutes: 3
    body: |
      Whole-class symmetry-noticing quick-recall. Teacher
      shows shapes; class chorally responds. "Heart? — YES,
      one symmetry line!" "Letter F? — NO, no symmetry!"
      "Circle? — YES, lots of lines!" "Scalene triangle? —
      NO!" "Equilateral triangle? — YES, three!" "Letter
      A? — YES, one (down the middle)!" Forward-pointer:
      "Today we noticed symmetry — when shapes fold so the
      halves match. Symmetry shows up everywhere — in
      flowers, butterflies, our own bodies (one eye on
      each side; one arm on each side), in many letters of
      the alphabet, in many road signs. When you grow older
      you'll learn more PRECISE symmetry — exact angles
      and rotation symmetry — but the NOTICING you learned
      today is the foundation. Next time in geometry we'll
      meet PARTITIONING SHAPES INTO EQUAL PARTS (halves
      and quarters)."

