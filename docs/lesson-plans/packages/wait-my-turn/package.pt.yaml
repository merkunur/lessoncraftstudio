# Teaching package — wait my turn (impulse control) (pt sparse-override)
# Arc 18 Phase 1.5 Slot 1 (23rd-consecutive pt cadence per Arc 7+ convention). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EI03EO01 + EI03EO02 (Educação Infantil 4-5 anos, eixo "O eu, o outro e o nós") + EF01ER01 + EF01ER02 (Ensino Religioso 1.º ano EF, respeito mútuo + autoconhecimento). Cross-cultural-sensitivity discipline preserved per BR context (escolas brasileiras frequentemente abordam o esperar-a-sua-vez como autorregulação coletiva da turma; o trabalho de paciência integra a rotina-de-grupo).

targetSlug: wait-my-turn
language: pt

title:
  pt: "Esperar a Minha Vez — controle do impulso e paciência nas rotinas da sala de aula"

description:
  pt: "Pacote socioemocional para a educação infantil / 1.º ano do ensino fundamental, ensinando crianças a esperar a sua vez — segurar a ação até o momento apropriado. Habilidade fundamental de função executiva subjacente ao revezamento de turnos, espera-na-fila, levantar-a-mão-em-vez-de-falar-em-voz-alta, e esperar-ser-atendido. Por learning-targets.json, wait-my-turn não tem pré-requisitos; é um alvo fundacional de controle-do-impulso cujo domínio apoia todo o trabalho comportamental SEL subsequente (revezamento de turnos, resolução de conflitos, seguir-regras-da-sala). Trabalho pró-social crítico no K-1: as crianças aprendem a reconhecer o SENTIMENTO de impaciência (quando esperar é difícil), usar ESTRATÉGIAS INTERNAS para gerenciar esse sentimento (contar até 10, respiração profunda, mãos no colo, olhar para um amigo que também está esperando), e confiar que SUA VEZ VAI CHEGAR. Por §A.13.30 enquadramento informal K-1: trabalho de controle-do-impulso no K-1 é RECONHECIMENTO + APLICAÇÃO DE ESTRATÉGIA-DE-ESPERA CONCRETA — as crianças nomeiam o sentimento, nomeiam uma estratégia, aplicam a estratégia em um contexto específico de espera. NÃO pedagogia formal de função executiva (que é trabalho do 2.º ano EF em diante introduzindo termos como 'autorregulação', 'controle inibitório', 'gratificação postergada'); a pedagogia K-1 usa linguagem cotidiana ('espere a sua vez' / 'tenha paciência' / 'primeiro vem a Maria, depois você') para revelar o padrão de controle-do-impulso subjacente. Alinhamento BNCC: EI03EO01 ('Demonstrar empatia pelos outros, percebendo que as pessoas têm diferentes sentimentos, necessidades e maneiras de pensar e agir') + EI03EO02 ('Agir de maneira independente, com confiança em suas capacidades, reconhecendo suas conquistas e limitações') — BNCC Educação Infantil 4-5 anos eixo 'O eu, o outro e o nós'. EF01ER01 + EF01ER02 (1.º ano EF Ensino Religioso, respeito mútuo + autoconhecimento) cobrem a transição K → 1.º ano EF para autorregulação. Ênfase no contexto multilíngue / escola internacional: normas culturais sobre tempo-de-espera e paciência variam significativamente entre culturas escolares globalmente; o pacote enquadra ACORDOS DE ESPERA CO-CRIADOS DA SALA DE AULA em vez de regras universais absolutas sobre quanto-tempo-esperar-em-silêncio. O strand PSED avança 4/8 → 5/8 (50,0% → 62,5%; avanço pair-coherent seguindo Fase 1.4 Slot 4 identify-classroom-rules que avançou 3/8 → 4/8). 5 exercícios + 6 materiais imprimíveis (composição classe-SEL per §A.13.37 + precedente Arc 17 P1.1 share-and-take-turns: REMOVE matching-mat + vocabulary-tracing-strips; MANTÉM flashcards + picture-cards + sentence-strips + manipulative-cut-outs + parent-take-home-letter + answer-key). Manipulative-cut-outs em `mode: single-repeat` (canonical-correct per §A.13.35) com tema: emoções (continuidade do cluster)."

structure:
  warmup:
    body: |
      Introdução de estratégias-de-espera com toda a
      turma + gancho de rotina-de-sala. Você pergunta:
      "Quando fica DIFÍCIL esperar? Me contem uma vez
      que esperar foi difícil." A turma faz uma chuva
      de ideias: esperar na fila do escorregador,
      esperar para ser chamado, esperar pelo lanche,
      esperar um colega terminar a vez dele, esperar
      pelo banheiro. Você então introduz 4 estratégias
      de espera: (1) MÃOS NO COLO — as crianças
      colocam as mãos no colo enquanto esperam para
      evitar que as mãos peguem coisas; (2) CONTAR
      ATÉ 10 — contagem silenciosa-até-10 enquanto
      espera ajuda o tempo passar; (3) RESPIRAÇÃO
      PROFUNDA — a respiração lenta acalma o
      sentimento impaciente no corpo; (4) OLHAR
      PARA UM AMIGO QUE ESPERA — encontrar outra
      criança que também está esperando; lembrar-se
      de que todo mundo tem sua vez. Você narra a
      conexão com os sentimentos: "Quando esperar é
      difícil, você pode sentir IMPACIÊNCIA (você
      quer AGORA), CIÚME (outra pessoa tem o que
      você quer), FRUSTRAÇÃO (está demorando muito).
      Esses sentimentos são NORMAIS — todo mundo
      sente isso às vezes. As estratégias nos ajudam
      a ESPERAR MESMO QUANDO OS SENTIMENTOS SÃO
      FORTES. Hoje praticamos as 4 estratégias-de-
      espera para que estejam prontas quando esperar
      ficar difícil."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de prática de
      estratégia-de-espera. Cada dupla recebe 4
      cartões de estratégia (MÃOS NO COLO / CONTAR
      ATÉ 10 / RESPIRAÇÃO PROFUNDA / OLHAR PARA UM
      AMIGO) + 6 cartões de cenário de espera
      (criança esperando na fila do escorregador;
      criança esperando para ser chamada para falar;
      criança esperando o lanche ser servido;
      criança esperando um amigo terminar a vez com
      um brinquedo; criança esperando você terminar
      de ajudar outro colega; criança esperando a
      família vir buscar). A dupla se reveza: a
      criança A pega um cartão de cenário; a
      criança B pega um dos 4 cartões de estratégia
      que ajudaria naquele cenário + narra em voz
      alta "Eu usaria [estratégia] porque [razão]."
      Depois trocam. Recapture erros com raciocínio
      estratégia-cenário ("você disse CONTAR ATÉ 10
      para esperar o banheiro — mas contar até 10
      não faz o banheiro vir mais rápido.
      RESPIRAÇÃO PROFUNDA pode ajudar porque o
      sentimento de precisar-urgentemente-ir é
      desconfortável; respiração profunda acalma o
      corpo. Ou OLHAR PARA UM AMIGO ajuda se você
      pode ver outra criança esperando também —
      lembra você que todo mundo tem que esperar às
      vezes."). Extensão opcional: a dupla pratica
      uma estratégia em tempo real — a criança A
      finge que está esperando algo; a criança B
      lembra a criança A de qual estratégia usar.
      Nota para você: crianças K-1 às vezes aplicam
      estratégias mecanicamente sem conectá-las ao
      estado-do-sentimento. Ajude as crianças a
      verem: estratégias são FERRAMENTAS para
      gerenciar SENTIMENTOS DE IMPACIÊNCIA. O
      objetivo não é PARAR DE SENTIR IMPACIÊNCIA
      (impaciência é normal); o objetivo é MANTER O
      CORPO CALMO enquanto o sentimento passa.
      Algumas crianças também podem confundir
      ESPERAR com PASSIVIDADE (não fazer nada =
      tedioso). Ajude as crianças a verem: esperar
      é ATIVO — você está ativamente usando uma
      estratégia, ativamente respirando, ativamente
      contando. Esperar é TRABALHO DIFÍCIL, não só
      sentar parado.
  scaffold:
    body: |
      Rotação por estações. Estação 1: folha de
      exercícios picture-sort (as crianças
      classificam imagens de cenário em "esperando
      calmamente" vs "não esperando" — criança
      sentada de pernas-cruzadas com mãos no colo
      enquanto espera vai em esperando-calmamente;
      criança puxando brinquedo da mão de outra
      criança vai em não-esperando). Estação 2:
      folha de emparelhamento (imagem de cenário-
      de-espera → texto de estratégia; ex.: criança
      esperando na fila do escorregador ↔ "mãos no
      colo e contar até 10"). Estação 3: folha
      math-worksheet (contar-como-estratégia-de-
      espera: contar de 1 a 10 várias vezes;
      reforça a estratégia de contar-até-10 através
      do trabalho numérico; também introduz
      justiça-como-contagem: se 3 crianças
      compartilham um escorregador e cada uma tem
      5 voltas, quantas voltas no total? = 15).
      Estação 4: folha word-guess (prática de
      quebra-cabeças do tema-cluster usando
      vocabulário de emoções; o trabalho de
      andaime de vocabulário-de-espera acontece
      nas atividades das estações 2 + 3 do corpo
      da aula, NÃO neste composedExercise per
      §A.13.36 precedente Fase 1.4 Slot 4
      camada-de-abstração Path B).
  closure:
    body: |
      Prática de estratégia-de-espera com toda a
      turma + enquadramento de cluster SEL. A turma
      nomeia coletivamente as 4 estratégias-de-
      espera (MÃOS NO COLO / CONTAR ATÉ 10 /
      RESPIRAÇÃO PROFUNDA / OLHAR PARA UM AMIGO).
      Você faz a pergunta de conexão-do-cluster:
      "Como esperar se conecta com o que aprendemos
      sobre REGRAS na semana passada (identify-
      classroom-rules) e COMPARTILHAR (share-and-
      take-turns)?" A turma reflete: regras nos
      dizem QUANDO esperar (levantar a mão e
      esperar para ser chamado); compartilhar
      significa deixar OUTRAS crianças terem sua
      vez enquanto você espera a sua; esperar é o
      TRABALHO que fazemos enquanto esperamos
      nossa vez chegar. Você encerra com: "Esperar
      é difícil. Adultos ainda sentem impaciência
      às vezes. As estratégias não FAZEM você
      parar de sentir impaciência — elas AJUDAM
      VOCÊ A ESPERAR mesmo quando o sentimento é
      forte. Quanto mais você pratica, mais fácil
      esperar fica. Sua vez VAI chegar — essa é a
      coisa mais importante de lembrar quando
      esperar parece para sempre." Aponte adiante:
      "Quando voltarmos ao trabalho socioemocional
      na próxima vez, aprenderemos o que fazer
      quando SUA VEZ finalmente chegar depois de
      uma longa espera — estar pronto para
      participar sem pressa ou estar muito
      animado. Candidatos do próximo alvo:
      regulate-emotions-with-strategies +
      identify-safe-vs-unsafe-situations
      (candidatos do Arco 18+ + Arco 19)."

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Nomear 4 estratégias-de-espera (mãos no
        colo / contar até 10 / respiração profunda
        / olhar para um amigo) em 7 de 10
        tentativas.
      - Combinar um cenário-de-espera a uma
        estratégia apropriada em 6 de 8 tentativas.
      - Demonstrar pelo menos uma estratégia-de-
        espera em 4 de 6 momentos observados de
        rotina-de-sala-com-espera durante a
        semana (rubrica da professora: espera-na-
        fila, levantar-mão-e-esperar, esperar-
        lanche, esperar-ajuda).
      - Autodefender-se "estou esperando" ou
        "minha vez depois" sem conflito em 3 de
        5 observações de tempo-livre (métrica de
        aplicação-de-script).
      - Usar o vocabulário 'esperar' / 'paciente'
        / 'impaciente' / 'vez' / 'estratégia'
        corretamente em 5 de 10 tentativas de
        produção verbal.

    Diferenciação:
    - Pré-escola: conjunto inicial de 2
      estratégias (mãos no colo + respiração
      profunda); modelagem receptiva primeiro
      (as crianças respondem a estratégias
      promovidas por você); linguagem produtiva
      surge como surge sem pressão.
    - Educação infantil (5-7 anos): conjunto
      completo de 4 estratégias; uso produtivo
      de estratégias durante atividades em duplas
      + rotinas de sala; rubrica da professora
      em observações de tempo-livre + rotina
      durante a semana.
    - 1.º ano em diante: estender para CO-CRIAÇÃO
      DE ESTRATÉGIAS (crianças propõem novas
      estratégias-de-espera; a turma decide
      coletivamente quais adicionar à caixa-de-
      ferramentas-de-espera da sala); ponte para
      trabalho de de-escalonamento-de-conflito
      (candidatos do Arco 18+: o que fazer
      quando esperar parece impossível, como
      pedir-ajuda-do-adulto quando esperar se
      torna avassalador); ponte para regulate-
      emotions-with-strategies (candidato de
      avanço-do-strand PSED; o trabalho mais
      amplo de regulação-de-emoções que usa
      estratégias-de-espera como uma ferramenta
      entre muitas).
    - 2.º ano em diante: vocabulário completo de
      função executiva (autorregulação /
      controle inibitório / gratificação
      postergada); ponte para trabalho de
      assembleia-de-turma liderada por crianças
      onde elas praticam esperar-respeitosamente
      durante discussão em grupo; 3.º ano+
      estende para práticas formais de mindfulness
      + trabalho de consciência-corporal como
      ferramentas-de-espera.

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en).
    Os campos materials, composedExercises,
    curriculumStandards e learningObjectives são herdados
    do package.yaml via merge sparse-override e não são
    repetidos aqui per a convenção Arc 7+.

    Vocabulário pt-BR canônico para esperar-a-sua-vez
    K-1:
    - 'esperar' (to wait) — pt-BR canônico
    - 'vez' / 'minha vez' / 'sua vez' (turn / my
      turn / your turn) — pt-BR canônico para o
      revezamento
    - 'paciente' / 'paciência' (patient / patience)
    - 'impaciente' / 'impaciência' (impatient /
      impatience)
    - 'estratégia' (strategy) — pt-BR canônico
    - 'mãos no colo' (hands in lap) — locução
      pt-BR canônica para a estratégia física
    - 'contar até 10' (count to 10) — locução
      pt-BR canônica
    - 'respiração profunda' (deep breath) —
      locução pt-BR canônica
    - 'olhar para um amigo' (look at a friend) —
      locução pt-BR canônica para a estratégia
      social
    - Frases-modelo K-1: "Eu estou esperando" /
      "Minha vez vai chegar" / "Eu uso [estratégia]
      para esperar"
    - Vocabulário de sentimentos durante a espera:
      'ansioso' / 'frustrado' / 'inquieto' /
      'animado' (registros K-1 brasileiros para o
      espectro de sentimentos durante espera)

    Convenção pt-BR vs pt-PT: ambas as variantes
    usam 'esperar' + 'vez' + 'paciência'
    identicamente. Algumas pequenas divergências
    regionais (pt-PT pode usar 'aguardar' mais
    formalmente; pt-BR usa 'esperar' canonicamente
    em registro K-1).

    Particularidade pt-BR para esperar-a-sua-vez
    K-1:
    Crianças brasileiras K-1 frequentemente
    aprendem sobre esperar-a-sua-vez através das
    RODAS-DE-CONVERSA da educação infantil
    brasileira — uma rotina canônica onde as
    crianças sentam em círculo e se revezam para
    falar (você pergunta, uma criança fala, as
    outras esperam silenciosamente). Esta rotina
    estabelece um modelo coletivo de esperar-a-
    sua-vez que é culturalmente reconhecido em
    educação infantil brasileira. O 'esperar a
    sua vez na roda' é canônico em sequências
    didáticas brasileiras K-1 para o trabalho de
    autorregulação coletiva. Este pacote alinha
    naturalmente com essa abordagem pedagógica
    brasileira.

    Alinhamento BNCC (Base Nacional Comum
    Curricular):
    EI03EO01 ('Demonstrar empatia pelos outros,
    percebendo que as pessoas têm diferentes
    sentimentos, necessidades e maneiras de
    pensar e agir') é o anchor BNCC Educação
    Infantil 4-5 anos para o trabalho de
    autorregulação social que esperar-a-sua-vez
    requer (entender que outros têm necessidades
    + esperar honra essas necessidades). EI03EO02
    ('Agir de maneira independente, com confiança
    em suas capacidades, reconhecendo suas
    conquistas e limitações') cobre o aspecto de
    autonomia-com-paciência. EF01ER01 + EF01ER02
    (1.º ano EF Ensino Religioso, respeito
    mútuo + autoconhecimento) cobrem a transição
    para o 1.º ano EF onde o trabalho de espera
    se torna parte de uma prática mais formal de
    respeito-pelo-outro e autoconhecimento. Junto,
    BNCC EI + EF cobrem a progressão Pré-escola
    (4-5) → Educação Infantil (5-7) → 1.º ano EF
    para o desenvolvimento de função executiva +
    paciência + auto-controle.

    Currículo brasileiro K-1 para autorregulação:
    A BNCC brasileira Educação Infantil estabelece
    autorregulação (no eixo 'O eu, o outro e o nós')
    como competência fundamental K-1. Este pacote
    alinha com essa abordagem. Escolas brasileiras
    frequentemente integram autorregulação com
    vivência-coletiva-da-turma (rotina-de-roda,
    fila-coletiva-para-banheiro, espera-do-lanche-
    compartilhado) — diferindo de modelos mais
    individualistas de autorregulação. Este pacote
    aproveita esse contexto cultural-pedagógico
    naturalmente.

    Por §A.13.30 enquadramento informal K-1: este
    pacote NÃO ensina vocabulário formal de função
    executiva (autorregulação / controle inibitório
    / gratificação postergada são termos acadêmicos
    do 2.º ano EF em diante). Famílias brasileiras
    às vezes perguntam por mais terapia
    comportamental ou treino de autocontrole;
    o parent-take-home-letter explicita que o
    objetivo do K-1 EF é o reconhecimento +
    aplicação de 4 estratégias-de-espera concretas,
    com vocabulário formal de função executiva
    emergindo no 2.º + 3.º ano EF.

    Pacote-precedente Arc 17 P1.1 share-and-take-
    turns + Phase 1.4 Slot 4 identify-classroom-
    rules (mesmo cluster SEL emotions-bundle):
    este pacote ESPELHA share-and-take-turns +
    identify-classroom-rules na composição SEL-
    class de 6 materiais (REMOVE matching-mat +
    vocabulary-tracing-strips; MANTÉM flashcards +
    picture-cards + sentence-strips + manipulative-
    cut-outs + parent-take-home-letter + answer-
    key). Junto com share-and-take-turns + name-
    and-describe-feelings + show-perspective-
    taking + identify-classroom-rules, wait-my-
    turn forma o cluster SEL emotions-bundle
    expandido para 5 pacotes (oportunidade de
    avanço de densidade-de-reuso cross-bundle no
    fechamento Arco 18 P2 per §A.13.25
    paired-cluster pattern).

    Nota de bookkeeping do strand PSED: per
    auditoria-trail da Rodada 2 da Fase 1.4,
    share-and-take-turns (Arc 17 P1.1) clama PSED
    SAT fechado em 8/8 — clamação inconsistente
    com a enumeração canônica de 8 alvos PSED em
    learning-targets.json. O defeito de
    bookkeeping foi arquivado como commission stub
    separado [FIX][DOCS]. Este pacote alinha 4/8
    → 5/8 com o estado canônico learning-targets.
    json + a estrutura accurate 3/8 → 4/8 da
    identify-classroom-rules da Fase 1.4 Slot 4.

    Disciplina de afirmação cross-cultural: o
    pacote afirma a variação cultural na expressão
    de espera ('algumas crianças são boas em
    esperar silenciosamente; algumas crianças são
    boas em esperar enquanto movem o corpo
    gentilmente; ambas são OK se não atrapalharem
    outras crianças') em vez de prescrever um
    registro-de-espera universal. Particularmente
    determinante para contextos de escola
    internacional + programa bilíngue brasileiro
    onde os históricos culturais-escolares das
    crianças divergem significativamente em
    expectativas sobre como-esperar.

    Per §A.13.36 cadência de cooperação CC↔
    assistant: o pacote pt herda materials,
    composedExercises, curriculumStandards via
    sparse-override per convenção Arc 7+;
    quaisquer emendas en (se Round 2 surgir) se
    propagam automaticamente para esta variante
    pt.
