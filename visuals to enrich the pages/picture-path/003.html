<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Picture Path - Progression Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(180deg, #E3F2FD 0%, #90CAF9 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Cloud decorations -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 1000 1000">
            <!-- Cloud 1 -->
            <g opacity="0.5">
                <ellipse cx="100" cy="120" rx="50" ry="30" fill="white"/>
                <ellipse cx="140" cy="110" rx="40" ry="25" fill="white"/>
                <ellipse cx="70" cy="115" rx="35" ry="22" fill="white"/>
            </g>
            <!-- Cloud 2 -->
            <g opacity="0.4">
                <ellipse cx="800" cy="80" rx="60" ry="35" fill="white"/>
                <ellipse cx="850" cy="70" rx="45" ry="28" fill="white"/>
                <ellipse cx="760" cy="75" rx="40" ry="25" fill="white"/>
            </g>
            <!-- Cloud 3 -->
            <g opacity="0.35">
                <ellipse cx="500" cy="60" rx="55" ry="32" fill="white"/>
                <ellipse cx="545" cy="50" rx="42" ry="26" fill="white"/>
                <ellipse cx="460" cy="55" rx="38" ry="24" fill="white"/>
            </g>
        </svg>

        <!-- Main Title - Top -->
        <div style="
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 62px;
                color: #1A237E;
                margin: 0;
                text-shadow: 0 3px 10px rgba(0,0,0,0.1);
                letter-spacing: -1px;
            ">PICK YOUR LEVEL!</h1>
        </div>

        <!-- Three ascending platforms -->
        <!-- Platform 1: Easy (Green) - Left, lowest -->
        <div style="
            position: absolute;
            left: 60px;
            bottom: 150px;
            z-index: 10;
        ">
            <!-- Platform base -->
            <div style="
                background: linear-gradient(180deg, #4CAF50 0%, #388E3C 100%);
                padding: 15px 25px;
                border-radius: 12px 12px 0 0;
                text-align: center;
                box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 22px;
                    color: white;
                ">12×12 EASY</span>
            </div>
            <!-- Worksheet card -->
            <div style="
                background: white;
                padding: 10px;
                border-radius: 0 0 12px 12px;
                box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/picture%20path/sample-2.jpeg"
                    alt="Easy Maze"
                    style="
                        width: 180px;
                        height: 233px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 6px;
                        display: block;
                    "
                />
            </div>
            <!-- Star rating -->
            <div style="
                display: flex;
                justify-content: center;
                margin-top: 12px;
            ">
                <svg width="40" height="40" viewBox="0 0 100 100">
                    <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FFD600" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
                </svg>
            </div>
        </div>

        <!-- Platform 2: Medium (Orange) - Center, middle height -->
        <div style="
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 250px;
            z-index: 11;
        ">
            <!-- Platform base -->
            <div style="
                background: linear-gradient(180deg, #FF9800 0%, #F57C00 100%);
                padding: 15px 25px;
                border-radius: 12px 12px 0 0;
                text-align: center;
                box-shadow: 0 8px 20px rgba(255, 152, 0, 0.4);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 24px;
                    color: white;
                ">13×13 MEDIUM</span>
            </div>
            <!-- Worksheet card -->
            <div style="
                background: white;
                padding: 12px;
                border-radius: 0 0 12px 12px;
                box-shadow: 0 18px 40px rgba(0,0,0,0.25);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/picture%20path/sample-6.jpeg"
                    alt="Medium Maze"
                    style="
                        width: 220px;
                        height: 285px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 6px;
                        display: block;
                    "
                />
            </div>
            <!-- Star rating -->
            <div style="
                display: flex;
                justify-content: center;
                gap: 5px;
                margin-top: 12px;
            ">
                <svg width="35" height="35" viewBox="0 0 100 100">
                    <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FFD600" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
                </svg>
                <svg width="35" height="35" viewBox="0 0 100 100">
                    <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FFD600" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
                </svg>
            </div>
        </div>

        <!-- Platform 3: Challenge (Red) - Right, highest -->
        <div style="
            position: absolute;
            right: 60px;
            bottom: 360px;
            z-index: 12;
        ">
            <!-- Crown on top -->
            <div style="
                display: flex;
                justify-content: center;
                margin-bottom: -5px;
            ">
                <svg width="60" height="50" viewBox="0 0 100 80">
                    <path d="M 10 70 L 20 25 L 35 45 L 50 10 L 65 45 L 80 25 L 90 70 Z" fill="#FFD600" stroke="#FFC107" stroke-width="3"/>
                    <circle cx="20" cy="25" r="6" fill="#FFD600"/>
                    <circle cx="50" cy="10" r="8" fill="#FFD600"/>
                    <circle cx="80" cy="25" r="6" fill="#FFD600"/>
                </svg>
            </div>
            <!-- Platform base -->
            <div style="
                background: linear-gradient(180deg, #F44336 0%, #D32F2F 100%);
                padding: 15px 25px;
                border-radius: 12px 12px 0 0;
                text-align: center;
                box-shadow: 0 8px 20px rgba(244, 67, 54, 0.4);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 22px;
                    color: white;
                ">15×15 CHALLENGE</span>
            </div>
            <!-- Worksheet card -->
            <div style="
                background: white;
                padding: 10px;
                border-radius: 0 0 12px 12px;
                box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/picture%20path/sample-12.jpeg"
                    alt="Challenge Maze"
                    style="
                        width: 190px;
                        height: 246px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 6px;
                        display: block;
                    "
                />
            </div>
            <!-- Star rating -->
            <div style="
                display: flex;
                justify-content: center;
                gap: 4px;
                margin-top: 12px;
            ">
                <svg width="30" height="30" viewBox="0 0 100 100">
                    <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FFD600" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
                </svg>
                <svg width="30" height="30" viewBox="0 0 100 100">
                    <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FFD600" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
                </svg>
                <svg width="30" height="30" viewBox="0 0 100 100">
                    <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FFD600" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
                </svg>
            </div>
        </div>

        <!-- Curved arrows connecting levels -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8;" viewBox="0 0 1000 1000">
            <!-- Arrow from Easy to Medium -->
            <path d="M 280 600 Q 350 500 420 550" stroke="#1A237E" stroke-width="5" fill="none" stroke-dasharray="15 8" opacity="0.6"/>
            <polygon points="420,550 400,540 405,560" fill="#1A237E" opacity="0.6" transform="rotate(30 420 550)"/>
            <!-- Arrow from Medium to Challenge -->
            <path d="M 620 480 Q 700 400 750 450" stroke="#1A237E" stroke-width="5" fill="none" stroke-dasharray="15 8" opacity="0.6"/>
            <polygon points="750,450 730,440 735,460" fill="#1A237E" opacity="0.6" transform="rotate(40 750 450)"/>
        </svg>

        <!-- Decorative elements -->
        <div style="
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
        ">
            <div style="
                background: white;
                padding: 14px 30px;
                border-radius: 30px;
                box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            ">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 22px; color: #1A237E;">Perfect for Differentiation!</span>
            </div>
        </div>
    </div>
</body>
</html>
