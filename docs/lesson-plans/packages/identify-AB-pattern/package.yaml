assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify and complete AB patterns with 2-3 missing items in 8 of
        10 trials.
      - Create a 6-item AB pattern from manipulatives in 7 of 10 attempts.
      - Name the alternating objects in 8 of 10 patterns (vocabulary-
        anchor verification).

    Differentiation:
    - Pre-K: 4-item AB patterns; manipulative-supported.
    - K: 6-item patterns; independent worksheet completion.
    - Grade 1+: extend to AAB/ABB/ABC/AABB patterns (Arc 7 Phase 1+2
      companions) + create-original-pattern (open-ended pattern creation).

