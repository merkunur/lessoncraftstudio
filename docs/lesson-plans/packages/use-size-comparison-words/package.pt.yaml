# Teaching package — use size-comparison vocabulary (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 6 Phase 3 per Arc 3 Phase 1 sparse-override
# pattern). Validator deep-merges with package.yaml canonical at validation
# time.
#
# Brazilian Portuguese register per CLAUDE.md §6 (pt = BR canonical).
# Formal "você" address per §17.9 cross-locale teacher-address-register lock.
# Comparative morphology in pt: "maior" (bigger) / "menor" (smaller) — analytic
# pattern with "mais X que" also acceptable; pacote uses "maior/menor" as
# the BR-canonical primary form.

title:
  pt: "Palavras de comparação de tamanho — usando grande/pequeno, maior/menor, alto/baixo"
description:
  pt: "Pacote de aquisição de vocabulário para K-Primeiro Ano sobre o uso de vocabulário de comparação de tamanho: grande, pequeno, maior, menor, o maior, o menor, alto, baixo, comprido. Faz ponte da percepção espacial à linguagem comparativa. Composto contra a renderização de comparação de tamanho do aplicativo big-small mais materiais de emparelhamento + tiras de frases."

structure:
  warmup:
    body: |
      Rotina de ação para toda a turma. A professora ou o professor usa
      objetos reais da sala de aula com tamanhos contrastantes (um
      brinquedo pequeno + um brinquedo grande; um lápis curto + uma régua
      comprida). Nomeia cada par de tamanhos: "O carro é GRANDE. O
      ratinho é PEQUENO. O caminhão é MAIOR que o carro. O ratinho é
      MENOR que o carro." A turma repete em coro + imita grande/pequeno
      com as mãos (braços abertos para grande; dedos beliscando para
      pequeno). Fixe palavras de tamanho no mural de palavras de
      linguagem matemática.
  contentActivity:
    body: |
      Rotina de mural de bolso com tiras de frases ("O {item} é {tamanho}").
      A turma lê em coro + atua cada tira (as crianças se esticam altas
      para "alto"; agacham-se para "baixo"). Trabalho em duplas: a criança
      A pega dois objetos de tamanhos diferentes; a criança B compara-os
      em voz alta usando a palavra de tamanho alvo. Refraseie os erros.
      Extensão opcional: jogo comparativo-superlativo ("o maior animal
      do zoológico é o {elefante}; o menor bichinho de estimação é o
      {hamster}") — conecta o vocabulário de tamanho a outros clusters
      de vocabulário que as crianças já conhecem.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios big-small (a
      criança identifica qual de 2 objetos é o maior/menor). Estação 2:
      folha de emparelhamento (palavra de tamanho emparelhada com sua
      representação visual — "o maior" emparelhado com uma fila de 3
      ursos com o maior urso). Estação 3: classificação de tamanho com
      recortes manipulativos (as crianças classificam fisicamente
      objetos recortados do menor para o maior, depois descrevem a
      sequência em voz alta).
  closure:
    body: |
      Recordação rápida com toda a turma. A professora ou o professor
      nomeia dois objetos da sala de aula; as crianças respondem em
      coro com maior/menor. Indicador adiante: "Hoje aprendemos
      palavras de tamanho. Quando voltarmos a matemática próxima vez,
      usaremos estas palavras para comparar números — números maiores,
      números menores e qual é o maior."

assessmentCriteria:
  pt: |
    Uso correto de grande/pequeno em pares de objetos 8/10; uso correto
    de maior/menor em contexto comparativo 6/10; reconhecimento receptivo
    de vocabulário de tamanho 9/10.

    Diferenciação:
      - Pré-K: apenas grande/pequeno (contraste binário); meta de
        compreensão receptiva.
      - K: grande/pequeno + maior/menor; uso produtivo em frases de
        comparação de objetos.
      - Primeiro ano em diante: estender para o maior/o menor (superlativo)
        + alto/baixo + comprido/curto (distinção específica de comprimento
        vs tamanho geral) + transferências para compare-by-length /
        compare-by-weight.

compositionalRationale:
  pt: |
    Fio principal: aquisição de vocabulário (adjetivos de comparação de
    tamanho como léxico de palavra-função de classe fechada). Fio
    secundário: raciocínio comparativo (as crianças formam relações de
    tamanho entre 2-3 objetos). Fio terciário: integração interdomínio
    (a comparação de tamanho aplica-se a objetos de qualquer cluster
    temático — animais, veículos, frutas, formas).

    Morfologia comparativa em português: pt-BR usa o padrão analítico
    "maior" / "menor" (forma irregular, suplética) para comparativo
    binário; "o maior" / "o menor" para superlativo. Esta morfologia
    contrasta com o padrão -er do inglês (bigger / smaller) e o padrão
    "mehr/weniger als" do alemão; pt usa formas suplétivas que crianças
    K-3 adquirem cedo. O pacote usa "maior/menor" como forma BR-canônica
    primária — também aceitável "mais grande/mais pequeno" coloquialmente
    em K-3 mas a forma suplétiva é a culta.

    Composição distintiva: 3 dos 5 exercícios compostos usam o aplicativo
    big-small (posições 1, 3, 5) — a ação mecânica do aplicativo É o
    alvo. Três contextos temáticos (animais, veículos, frutas) garantem
    que o vocabulário de comparação de tamanho generaliza-se através de
    categorias de objetos.

    Carga cognitiva comparativo-superlativo: crianças K manipulam
    grande/pequeno + maior/menor de forma limpa; o maior/o menor
    (superlativo) é território cognitivo de Primeiro Ano em diante.
    O título do pacote + critérios de avaliação refletem essa
    complexidade graduada.

    Integração entre arcos: o vocabulário de comparação de tamanho
    alimenta compare-quantities-more-fewer (numeracia do Arco 3) — as
    crianças que entendem comparação de tamanho transferem a habilidade
    de raciocínio comparativo para comparação de quantidade. Loop de
    reforço com alvos de fio de medição (compare-by-length, compare-by-
    weight, compare-by-capacity da numeracia / medição do início) para
    extensão Primeiro Ano em diante.
