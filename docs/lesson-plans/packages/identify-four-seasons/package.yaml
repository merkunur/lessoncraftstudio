assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name all 4 seasons in correct cyclic order (spring → summer →
        fall → winter → spring) in 8 of 10 trials.
      - Sort 12 seasonal items into 4 season piles correctly in 7 of
        10 attempts.
      - Articulate one characteristic of each season ('summer is hot';
        'winter has snow') in 7 of 10 trials.

    Differentiation:
    - Pre-K: 2 contrasting seasons (summer vs winter); receptive
      identification only.
    - K: all 4 seasons; sort + name with picture support.
    - Grade 1+: extend to month-to-season mapping (March-May = spring,
      etc.) + bridge to weather-cycle work (describe-water-cycle-basic
      Arc 11+ candidate).

