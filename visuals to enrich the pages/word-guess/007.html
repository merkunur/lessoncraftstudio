<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Bilder-Buchstaben-Safari - Variety Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #166534 0%, #0A4A22 40%, #052E16 100%); overflow: hidden;">

        <!-- Animal paw prints at low opacity -->
        <div style="position: absolute; top: 130px; left: 50px; opacity: 0.05; font-size: 50px; transform: rotate(-20deg);">&#128062;</div>
        <div style="position: absolute; top: 280px; right: 40px; opacity: 0.04; font-size: 45px; transform: rotate(15deg);">&#128062;</div>
        <div style="position: absolute; bottom: 240px; left: 80px; opacity: 0.04; font-size: 40px; transform: rotate(-10deg);">&#128062;</div>
        <div style="position: absolute; bottom: 350px; right: 100px; opacity: 0.03; font-size: 55px; transform: rotate(25deg);">&#128062;</div>

        <!-- SVG jungle vines hanging from top -->
        <svg style="position: absolute; top: 0; left: 0; width: 1000px; height: 300px; z-index: 5;" viewBox="0 0 1000 300">
            <!-- Vine 1 -->
            <path d="M 80 0 Q 85 60, 75 120 Q 65 180, 80 230" stroke="#15803D" stroke-width="5" fill="none" opacity="0.6"/>
            <ellipse cx="70" cy="100" rx="18" ry="10" fill="#22C55E" opacity="0.35" transform="rotate(-30 70 100)"/>
            <ellipse cx="85" cy="160" rx="16" ry="9" fill="#22C55E" opacity="0.3" transform="rotate(20 85 160)"/>
            <ellipse cx="72" cy="220" rx="14" ry="8" fill="#22C55E" opacity="0.25" transform="rotate(-15 72 220)"/>
            <!-- Vine 2 -->
            <path d="M 920 0 Q 915 70, 925 140 Q 935 200, 918 260" stroke="#15803D" stroke-width="5" fill="none" opacity="0.6"/>
            <ellipse cx="930" cy="90" rx="17" ry="9" fill="#22C55E" opacity="0.35" transform="rotate(25 930 90)"/>
            <ellipse cx="920" cy="170" rx="15" ry="8" fill="#22C55E" opacity="0.3" transform="rotate(-20 920 170)"/>
            <ellipse cx="925" cy="240" rx="13" ry="7" fill="#22C55E" opacity="0.25" transform="rotate(15 925 240)"/>
            <!-- Vine 3 (center decorative) -->
            <path d="M 350 0 Q 355 40, 345 80 Q 340 100, 348 120" stroke="#15803D" stroke-width="4" fill="none" opacity="0.4"/>
            <ellipse cx="342" cy="70" rx="14" ry="7" fill="#22C55E" opacity="0.25" transform="rotate(-25 342 70)"/>
            <!-- Vine 4 -->
            <path d="M 650 0 Q 645 50, 655 95 Q 660 115, 648 130" stroke="#15803D" stroke-width="4" fill="none" opacity="0.4"/>
            <ellipse cx="658" cy="80" rx="14" ry="7" fill="#22C55E" opacity="0.25" transform="rotate(20 658 80)"/>
        </svg>

        <!-- CSS flowers in corners -->
        <!-- Bottom-left flower -->
        <div style="position: absolute; bottom: 25px; left: 30px; z-index: 3;">
            <div style="width: 16px; height: 16px; background: #FB923C; border-radius: 50%; position: relative; box-shadow: 0 0 8px rgba(251,146,60,0.3);">
                <div style="position: absolute; top: -10px; left: 2px; width: 12px; height: 12px; background: #F97316; border-radius: 50% 50% 0 0; opacity: 0.6;"></div>
                <div style="position: absolute; top: 2px; left: -10px; width: 12px; height: 12px; background: #F97316; border-radius: 50% 0 0 50%; opacity: 0.6;"></div>
                <div style="position: absolute; top: 2px; right: -10px; width: 12px; height: 12px; background: #F97316; border-radius: 0 50% 50% 0; opacity: 0.6;"></div>
                <div style="position: absolute; bottom: -10px; left: 2px; width: 12px; height: 12px; background: #F97316; border-radius: 0 0 50% 50%; opacity: 0.6;"></div>
            </div>
        </div>
        <!-- Bottom-right flower -->
        <div style="position: absolute; bottom: 30px; right: 35px; z-index: 3;">
            <div style="width: 14px; height: 14px; background: #FBBF24; border-radius: 50%; position: relative; box-shadow: 0 0 6px rgba(251,191,36,0.3);">
                <div style="position: absolute; top: -8px; left: 2px; width: 10px; height: 10px; background: #F59E0B; border-radius: 50% 50% 0 0; opacity: 0.6;"></div>
                <div style="position: absolute; top: 2px; left: -8px; width: 10px; height: 10px; background: #F59E0B; border-radius: 50% 0 0 50%; opacity: 0.6;"></div>
                <div style="position: absolute; top: 2px; right: -8px; width: 10px; height: 10px; background: #F59E0B; border-radius: 0 50% 50% 0; opacity: 0.6;"></div>
                <div style="position: absolute; bottom: -8px; left: 2px; width: 10px; height: 10px; background: #F59E0B; border-radius: 0 0 50% 50%; opacity: 0.6;"></div>
            </div>
        </div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 34px; left: 38px; z-index: 100;">
            <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 22px rgba(249,115,22,0.5);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 23px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 44px; right: 44px; z-index: 100; background: #84CC16; padding: 11px 24px; border-radius: 28px; box-shadow: 0 4px 14px rgba(132,204,22,0.35);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #1A2E05; letter-spacing: 2px;">VORSCHULE</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 100px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; margin: 0; line-height: 1.1;">
                <span style="color: #FEF3C7; text-shadow: 2px 2px 0 rgba(0,0,0,0.2);">BILDER-BUCHSTABEN-</span>
            </h1>
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 64px; margin: 2px 0 0 0; line-height: 1.1;">
                <span style="color: #F97316; text-shadow: 2px 2px 0 rgba(0,0,0,0.15), 0 0 20px rgba(249,115,22,0.2);">SAFARI</span>
            </h1>
        </div>

        <!-- Tagline -->
        <div style="position: absolute; top: 252px; left: 0; right: 0; text-align: center; z-index: 40;">
            <p style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 22px; color: #84CC16; margin: 0; letter-spacing: 1px;">Entdecke W&ouml;rter in jeder Welt!</p>
        </div>

        <!-- 3 Worksheets with theme labels -->
        <div style="position: absolute; top: 300px; left: 50%; transform: translateX(-50%); width: 850px; height: 420px; z-index: 20;">

            <!-- Left worksheet - "Tiere" -->
            <div style="position: absolute; left: 40px; top: 0;">
                <!-- Theme label -->
                <div style="text-align: center; margin-bottom: 10px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #86EFAC; background: rgba(34,197,94,0.15); padding: 5px 18px; border-radius: 16px; border: 2px solid rgba(134,239,172,0.3);">&#127829; Tiere</span>
                </div>
                <div style="width: 205px; height: 265px; background: white; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.35); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/word%20guess/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="W&ouml;rter-R&auml;tsel Tiere">
                </div>
            </div>

            <!-- Center worksheet - "Essen" -->
            <div style="position: absolute; left: 50%; transform: translateX(-50%); top: 0;">
                <!-- Theme label -->
                <div style="text-align: center; margin-bottom: 10px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #FDE68A; background: rgba(251,191,36,0.15); padding: 5px 18px; border-radius: 16px; border: 2px solid rgba(253,230,138,0.3);">&#127828; Essen</span>
                </div>
                <div style="width: 205px; height: 265px; background: white; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.35); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/word%20guess/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="W&ouml;rter-R&auml;tsel Essen">
                </div>
            </div>

            <!-- Right worksheet - "Sommer" -->
            <div style="position: absolute; right: 40px; top: 0;">
                <!-- Theme label -->
                <div style="text-align: center; margin-bottom: 10px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: #FCA5A5; background: rgba(248,113,113,0.15); padding: 5px 18px; border-radius: 16px; border: 2px solid rgba(252,165,165,0.3);">&#9728;&#65039; Sommer</span>
                </div>
                <div style="width: 205px; height: 265px; background: white; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.35); overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/word%20guess/sample-5.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="W&ouml;rter-R&auml;tsel Sommer">
                </div>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 50;">
            <div style="background: rgba(132,204,22,0.12); padding: 10px 22px; border-radius: 24px; border: 2px solid rgba(132,204,22,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #BEF264;">Bilderhinweise</span>
            </div>
            <div style="background: rgba(132,204,22,0.12); padding: 10px 22px; border-radius: 24px; border: 2px solid rgba(132,204,22,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #BEF264;">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: rgba(132,204,22,0.12); padding: 10px 22px; border-radius: 24px; border: 2px solid rgba(132,204,22,0.35);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #BEF264;">Mehrere Themen</span>
            </div>
        </div>

    </div>
</body>
</html>
