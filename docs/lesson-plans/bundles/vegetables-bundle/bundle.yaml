description:
  en: "K-3 bundle centered on vegetables vocabulary + counting + plant-life science + healthy-eating awareness. 4 packages span vocabulary-acquisition (identify-and-name-vegetables) + early-numeracy counting (count-instances-of-target-in-grid using vegetables as countable subjects) + world-knowledge living-things (describe-plant-life-cycle — vegetables as edible-plant-stages) + cognitive sorting (sort-by-color — vegetables theme rich in color contrasts). Cross-strand bundle parallel to fruits-bundle pattern. Suitable for a 4-week classroom unit on vegetables + healthy-eating + plant-science."

