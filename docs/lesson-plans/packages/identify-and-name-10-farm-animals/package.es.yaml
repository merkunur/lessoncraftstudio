assessmentCriteria:
  es: |
    Al final de la unidad de 1-2 semanas, los niños deben poder:
      - Identificar receptivamente los 10 animales de granja cuando la maestra
        o el maestro los nombra en español (objetivo point-to-named-farm-animal).
      - Producir el nombre de al menos 8 de 10 animales de granja al ver una
        tarjeta de imagen (objetivo identify-and-name-10-farm-animals).
      - Usar la estructura "Veo un/una {item}" de forma autónoma en español con
        al menos 6 de los 10 animales.

    Diferenciación:
      - Pre-K / K temprano: evalúe solo receptivamente (point-to-named); evite
        la presión de producción.
      - K / Primer grado: producción completa de nombres + uso de la estructura.
      - Segundo grado en adelante: extienda a formas plurales ("Tengo 3 cerdos"),
        descripciones de color ("el gato es negro"), o narrativas en oraciones
        compuestas.

