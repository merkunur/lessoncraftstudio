compositionalRationale:
  en: |
    Primary strand: math / numeral-recognition (numeral writing —
    SATURATES strand 4/4). Secondary strand: fine-motor-and-visual-
    spatial / drawing-and-tracing (numeral formation = closed-form
    writing technique). Tertiary strand: vocabulary-acquisition
    (number-word sequence 1-20).

    Architectural significance: SATURATES numeral-recognition
    strand at 4/4 — 16th saturated strand on the platform. Builds
    on Arc 15 Phase 1 recognize-numerals-1-to-20 (recognition
    foundation) + Arc 9-12 trace-straight/curved-lines (fine-motor
    foundation). Critical bridge from numeral RECOGNITION (visual
    identification) to numeral PRODUCTION (independent writing).
    Foundation for written math + filling-in-numerical-answers
    work in later arc work.

    Distinctive composition: 2 missing-pieces (write-the-missing-
    numeral) + 2 matching + 1 pattern-train. Heavy production-
    emphasis via missing-pieces; matching reinforces recognition;
    pattern-train provides sequence-context for writing.

    Class B FLEXIBLE substrate: composes against miscellaneous
    theme; numeral-writing primarily uses abstract numerical
    representation. Vocabulary-tracing-strips with dotted-with-
    arrows trace style is the canonical numeral-formation
    substrate.

    K-3 multilingual classroom relevance: numeral SYMBOLS universal
    across 11 platform locales (Hindu-Arabic numeral formation
    identical). Stroke-direction conventions universally cognate
    (top-to-bottom + left-to-right). Locale-variant work at Phase
    3+ adapts to each locale's number-word system + pedagogical
    formation-script preferences (e.g., some locales teach
    diagonal vs straight 7 stroke).

