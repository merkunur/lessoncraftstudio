# Teaching package — skip-count by 5 to 50
# Arc 9 Phase 1 (Path B; early-numeracy / counting-and-cardinality strand
# — skip-counting trilogy continuation). Class B FLEXIBLE; vocab-anchored.
# SECOND skip-counting package after skip-count-by-2 (Arc 8 Phase 1).
# Resolves Arc 8 skip-count-by-2's forward-pointer ("count by 5s and 10s").
# Pattern-bridge: skip-counting is structurally a numerical pattern.

targetSlug: skip-count-by-5
language: en
title:
  en: "Counting by 5s — skip-count from 0 to 50"
description:
  en: "Kindergarten / Grade 1 early-numeracy package teaching skip-counting by 5s. SECOND skip-counting package (after Arc 8 skip-count-by-2). Resolves Arc 8's forward-pointer to skip-counting trilogy completion. Builds on counting-by-1s (Arc 1+3) + skip-counting-by-2s (Arc 8 Phase 1). Skip-counting by 5s is the canonical bridge to multiplication ('5×1=5, 5×2=10, 5×3=15...' is exactly skip-counting by 5s); K-3 numeracy depth depends on skip-counting fluency before formal multiplication. Composes against chart-count + math-worksheet apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class chant routine. Teacher and class chant 5, 10, 15,
      20, 25, 30, 35, 40, 45, 50 together, clapping on each number.
      Teacher displays a 100-chart with multiples of 5 highlighted
      (every 5th column), so kids see the visual pattern. Kids see
      that "counting by 5s" produces a column-pattern on the 100-chart
      — the skip-counting structure is geometric. Reinforces the
      auditory + visual pattern simultaneously.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + manipulative routine. Each pair receives 50 cut-out
      objects. Kids practice counting them by 5s — pulling out 5 at a
      time and chanting "5, 10, 15, 20...". Recast errors with
      explanation ("you said 5, 10, 15, 16 — 16 is counting by 1s.
      Counting by 5s skips 16. Let's go: 5, 10, 15, 20"). Optional
      extension: kids construct a counting-by-5s number-line strip
      using manipulatives (mark every 5th position with an object).
      Connect to fingers: "5 fingers per hand" — each hand is a
      group of 5; 2 hands = 10; 3 hands = 15...
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: chart-count worksheet (kids fill in
      missing numbers in a counting-by-5s sequence). Station 2: math-
      worksheet (kids complete number sentences: 5+5=___, 10+5=___,
      15+5=___). Station 3: manipulative cut-outs hands-on counting-
      by-5s (kids group objects into fives and chant the running
      total). Station 4: matching worksheet (numeral-to-count-by-5s
      reinforces the spelling of multiples-of-5 numbers).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays a counting-by-5s
      number-line with some numbers blanked; class fills in the blanks
      collectively. Compare to counting-by-2s from Arc 8: "Last time
      we counted by 2s up to 20. Today we counted by 5s up to 50."
      Forward-pointer: "Today we counted by 5s. When we come back to
      skip-counting next, we'll count by 10s — even faster, all the
      way to 100."

