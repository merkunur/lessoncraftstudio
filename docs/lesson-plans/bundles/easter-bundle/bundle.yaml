  en: "K-3 bundle centered on Easter as holiday-anchor for cross-strand spring-seasonal + cultural-awareness work. 5 packages span vocabulary-acquisition (identify-and-name-action-verbs — hide, find, hunt, decorate, paint, celebrate + Easter-specific verbs) + numeracy (count-objects-1-to-10 — counting Easter eggs, chocolate bunnies, baskets, jellybeans) + color-cognition (sort-by-color — decorated eggs by color: red eggs vs blue eggs vs green eggs) + cultural-awareness (compare-greeting-routines-across-cultures — Easter traditions vary widely: Spanish/Latin Pascua / German Oster-bonfires / Greek Anastasi / Brazilian chocolate eggs) + seasonal-cognition (identify-four-seasons — Easter as spring-anchored holiday). 1st holiday-themed bundle on the platform — opens holiday cluster (precedent for christmas + thanksgiving + halloween + diwali + chinese-new-year + ramadan candidates). Suitable for a 3-4 week classroom unit timed to spring season. Supports K-3 multilingual classrooms with cross-cultural-holiday + family-tradition + spring-celebration extensions."

