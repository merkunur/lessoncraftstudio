<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Christmas Coloring Pages - Professional Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(135deg, #1A237E 0%, #0D1654 50%, #1A237E 100%); overflow: hidden;">

        <!-- Subtle geometric pattern -->
        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 25% 75%, rgba(255,214,0,0.06) 0%, transparent 45%), radial-gradient(circle at 75% 25%, rgba(255,214,0,0.05) 0%, transparent 40%);"></div>

        <!-- Gold accent lines -->
        <div style="position: absolute; top: 0; left: 70px; width: 2px; height: 180px; background: linear-gradient(180deg, rgba(255,214,0,0.5), transparent);"></div>
        <div style="position: absolute; top: 0; right: 70px; width: 2px; height: 180px; background: linear-gradient(180deg, rgba(255,214,0,0.5), transparent);"></div>
        <div style="position: absolute; bottom: 0; left: 110px; width: 2px; height: 130px; background: linear-gradient(0deg, rgba(255,214,0,0.4), transparent);"></div>
        <div style="position: absolute; bottom: 0; right: 110px; width: 2px; height: 130px; background: linear-gradient(0deg, rgba(255,214,0,0.4), transparent);"></div>

        <!-- Corner brackets -->
        <div style="position: absolute; top: 28px; left: 28px; width: 55px; height: 55px; border-left: 3px solid rgba(255,214,0,0.6); border-top: 3px solid rgba(255,214,0,0.6);"></div>
        <div style="position: absolute; top: 28px; right: 28px; width: 55px; height: 55px; border-right: 3px solid rgba(255,214,0,0.6); border-top: 3px solid rgba(255,214,0,0.6);"></div>
        <div style="position: absolute; bottom: 28px; left: 28px; width: 55px; height: 55px; border-left: 3px solid rgba(255,214,0,0.6); border-bottom: 3px solid rgba(255,214,0,0.6);"></div>
        <div style="position: absolute; bottom: 28px; right: 28px; width: 55px; height: 55px; border-right: 3px solid rgba(255,214,0,0.6); border-bottom: 3px solid rgba(255,214,0,0.6);"></div>

        <!-- Premium FREE Seal -->
        <div style="position: absolute; top: 32px; left: 50%; transform: translateX(-50%); z-index: 100;">
            <div style="width: 115px; height: 115px; border-radius: 50%; background: linear-gradient(145deg, #FFD600 0%, #FF9800 50%, #E65100 100%); box-shadow: 0 8px 28px rgba(255,214,0,0.45), inset 0 -5px 15px rgba(0,0,0,0.2), inset 0 5px 10px rgba(255,255,255,0.25); display: flex; flex-direction: column; align-items: center; justify-content: center; border: 4px solid rgba(255,255,255,0.25);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">FREE</span>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 11px; color: rgba(255,255,255,0.9); letter-spacing: 1px;">PREMIUM</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 55px; right: 55px; background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 10px 20px; border-radius: 22px; border: 2px solid rgba(255,214,0,0.45);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: #FFD600;">GRADES PreK-3</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 165px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 50px; color: white; margin: 0; text-shadow: 0 4px 18px rgba(0,0,0,0.3);">Christmas Coloring</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 34px; color: #FFD600; margin: 8px 0 0 0; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">Pages Bundle</h2>
        </div>

        <!-- Large pristine card display -->
        <div style="position: absolute; top: 285px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <div style="position: relative;">
                <!-- Glow effect behind card -->
                <div style="position: absolute; top: 50%; left: 50%; width: 380px; height: 480px; transform: translate(-50%, -50%); background: radial-gradient(ellipse, rgba(255,214,0,0.12) 0%, transparent 65%); border-radius: 20px;"></div>

                <!-- Main card -->
                <div style="box-shadow: 0 25px 65px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,214,0,0.15); border-radius: 18px; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-1.jpeg" style="width: 320px; height: auto; display: block; border-radius: 16px; border: 7px solid white;">
                </div>

                <!-- Corner shine effect -->
                <div style="position: absolute; top: 12px; left: 12px; width: 90px; height: 90px; background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, transparent 50%); border-radius: 14px;"></div>
            </div>
        </div>

        <!-- Side preview - left -->
        <div style="position: absolute; top: 350px; left: 65px; transform: rotate(-8deg); z-index: 40;">
            <div style="box-shadow: 0 15px 40px rgba(0,0,0,0.35); border-radius: 12px;">
                <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-2.jpeg" style="width: 150px; height: auto; border-radius: 10px; border: 4px solid white;">
            </div>
            <div style="position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); background: rgba(255,214,0,0.92); padding: 5px 12px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 10px; color: #1A237E;">PORTRAIT</span>
            </div>
        </div>

        <!-- Side preview - right -->
        <div style="position: absolute; top: 380px; right: 65px; transform: rotate(8deg); z-index: 40;">
            <div style="box-shadow: 0 15px 40px rgba(0,0,0,0.35); border-radius: 12px;">
                <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-8.jpeg" style="width: 160px; height: auto; border-radius: 10px; border: 4px solid white;">
            </div>
            <div style="position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); background: rgba(255,214,0,0.92); padding: 5px 12px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 10px; color: #1A237E;">LANDSCAPE</span>
            </div>
        </div>

        <!-- Feature cards - glass effect -->
        <div style="position: absolute; bottom: 115px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; z-index: 60;">

            <!-- Feature 1: Print Ready -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 16px 14px; border-radius: 15px; border: 1px solid rgba(255,214,0,0.25); width: 120px; text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,0.2);">
                <div style="font-size: 26px; margin-bottom: 6px;">✓</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 13px; color: white; line-height: 1.3;">Print Ready</div>
            </div>

            <!-- Feature 2: Clean Line Art -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 16px 14px; border-radius: 15px; border: 1px solid rgba(255,214,0,0.25); width: 120px; text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,0.2);">
                <div style="font-size: 26px; margin-bottom: 6px;">✓</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 13px; color: white; line-height: 1.3;">Clean Line Art</div>
            </div>

            <!-- Feature 3: Portrait & Landscape -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 16px 14px; border-radius: 15px; border: 1px solid rgba(255,214,0,0.25); width: 120px; text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,0.2);">
                <div style="font-size: 26px; margin-bottom: 6px;">✓</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 13px; color: white; line-height: 1.3;">Two Orientations</div>
            </div>

            <!-- Feature 4: Holiday Themes -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 16px 14px; border-radius: 15px; border: 1px solid rgba(255,214,0,0.25); width: 120px; text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,0.2);">
                <div style="font-size: 26px; margin-bottom: 6px;">✓</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 13px; color: white; line-height: 1.3;">Holiday Themes</div>
            </div>

        </div>

        <!-- Bottom gold banner tagline -->
        <div style="position: absolute; bottom: 35px; left: 0; right: 0; text-align: center;">
            <div style="display: inline-block; background: linear-gradient(90deg, transparent 0%, rgba(255,214,0,0.15) 20%, rgba(255,214,0,0.2) 50%, rgba(255,214,0,0.15) 80%, transparent 100%); padding: 10px 60px; border-radius: 5px;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: #FFD600; letter-spacing: 4px;">TEACHER-READY QUALITY</span>
            </div>
        </div>

        <!-- Subtle decorative dots -->
        <div style="position: absolute; top: 280px; left: 50px; width: 8px; height: 8px; background: rgba(255,214,0,0.35); border-radius: 50%;"></div>
        <div style="position: absolute; top: 320px; left: 65px; width: 6px; height: 6px; background: rgba(255,214,0,0.25); border-radius: 50%;"></div>
        <div style="position: absolute; top: 290px; right: 55px; width: 7px; height: 7px; background: rgba(255,214,0,0.3); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 220px; right: 60px; width: 8px; height: 8px; background: rgba(255,214,0,0.35); border-radius: 50%;"></div>

    </div>
</body>
</html>
