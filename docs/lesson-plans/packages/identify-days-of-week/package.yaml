# Teaching package — identify the seven days of the week
# Arc 10 Phase 2 (Option E world-knowledge depth; world-knowledge / time-
# and-routine strand FIRST package). Class B FLEXIBLE; vocab-anchored.
# Foundational time-vocabulary: kids learn the 7 days of the week in
# order + the cyclic nature (after Saturday comes Sunday again).

targetSlug: identify-days-of-week
language: en
title:
  en: "Days of the Week — Monday through Sunday"
description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching the seven days of the week. FIRST time-and-routine strand package in the catalog. Kids learn day names in sequence + the cyclic nature (the week repeats every 7 days). Foundational time-vocabulary that connects to weekly classroom routines (different days have different schedules; specific events happen on specific days). Vocab-anchored — day names are high-frequency vocabulary across all 11 platform locales. Composes against matching + word-guess + word-scramble apps for day-name fluency. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class day-chant routine. Teacher and class chant the 7
      days in sequence: Monday, Tuesday, Wednesday, Thursday, Friday,
      Saturday, Sunday. Repeat the chant 3-4 times. Teacher displays
      a week-chart with day names + corresponding pictures (e.g.,
      Monday → school-bus icon for back-to-school day; Saturday →
      bicycle icon for park-day; etc.). Reinforces day-name sequence
      + day-as-marker-of-routine.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + day-sequence routine. Each pair receives 7 day-name
      cards in shuffled order. Pair arranges cards in correct day
      sequence (Monday → Sunday). Teacher narrates the sequence as
      kids work. Recast errors with explanation ("you put Wednesday
      after Monday — what comes between them? Tuesday! Insert Tuesday
      between Monday and Wednesday"). Optional extension: kids
      construct a personal weekly-routine chart showing what they do
      on each day.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (day name to
      day-icon image). Station 2: word-scramble (kids unscramble day
      names; reinforces spelling). Station 3: manipulative cut-outs
      hands-on day-sequence construction (kids build a circular
      week-strip showing the cyclic nature). Station 4: word-guess
      (kids fill in day-name letters from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class day-quiz routine. Teacher names a day; class names
      the day BEFORE and the day AFTER (e.g., "Wednesday" → kids:
      "Tuesday before, Thursday after"). Forward-pointer: "Today we
      learned the days of the week. When we come back to time-words
      next, we'll learn the MONTHS of the year — 12 months that
      together make one whole year."

