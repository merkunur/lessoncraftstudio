assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Use 4 of 4 core prepositions (in, on, under, next-to) correctly in
        oral position-description in 6 of 8 trials.
      - Match preposition word to position-scene picture in 6 of 6 trials
        (receptive).
      - Use prepositions in spontaneous classroom speech (e.g., "my book is
        on my desk") within the 1-week unit window.

    Differentiation:
    - Pre-K: 2 prepositions only (in, on) with concrete manipulative
      placement; receptive-only.
    - K / Grade 1: full 4-preposition core (in, on, under, next-to) +
      productive use.
    - Grade 2+: extend to use-spatial-position-words (8-preposition broader
      set including between / behind / in-front-of / above) + use-direction-
      vocabulary (left / right / up / down).

