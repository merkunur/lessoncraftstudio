# Teaching package — compare quantities (more / fewer / equal)
# Arc 3 Phase 3 numeracy package. more-less app heavy; introduces comparison
# vocabulary (more / fewer / equal) integrated with quantity comparison.

targetSlug: compare-quantities-more-fewer
language: en

title:
  en: "Compare Quantities — more / fewer / equal"
description:
  en: "K-Grade 1 numeracy package teaching quantity comparison (which group has more, which has fewer, which are equal). more-less app heavy. Introduces comparison vocabulary (more / fewer / equal) integrated with the quantity-comparison task. 5 exercises + 6 materials over a 1-2 week unit."

durationMinutes: 25

structure:
  warmup:
    durationMinutes: 4
    body: |
      Whole-class introduction. Teacher holds up two picture-cards with different
      quantities (e.g., 3 cats vs 5 dogs). "Which has more?" Kids point. Then:
      "Which has fewer?" Kids point. Cycle through 4-5 pairs. Introduce 'equal'
      with two cards of same quantity ("These are equal — both have 4 cats").
  contentActivity:
    durationMinutes: 10
    body: |
      Pocket-chart routine: place two picture-cards side-by-side with sentence
      strip "There are more {item}" or "There are fewer {item}" or "They are
      equal." Kids count both groups + complete the sentence. Pair work: kids
      generate pairs from manipulative-cut-outs and ask each other.
  scaffold:
    durationMinutes: 7
    body: |
      Station rotation. Station 1: more-less worksheet (image-to-image mode).
      Station 2: numeral-quantity matching using numeral-cards (extend
      match-numeral-to-quantity work). Station 3: manipulative-cut-out
      comparison ("show me a group with more cats than I have").
  closure:
    durationMinutes: 4
    body: |
      Whole-class share-out. Teacher shows two cards, kids name "more" /
      "fewer" / "equal." Forward-pointer: "Today we compared quantities. When
      we come back to comparison next, we'll use the symbols < and > to write
      it down." Points to adjacent target use-greater-less-equal-symbols.

