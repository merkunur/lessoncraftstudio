<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1000, height=1000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px;
    height: 1000px;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
    background: #FFF7ED;
    position: relative;
  }

  /* Soft color spots in background */
  .bg-spot {
    position: absolute;
    border-radius: 50%;
    z-index: 1;
    filter: blur(60px);
  }
  .bg1 { width: 300px; height: 300px; top: -50px; left: -50px; background: rgba(251,146,60,0.15); }
  .bg2 { width: 250px; height: 250px; top: 200px; right: -80px; background: rgba(124,58,237,0.1); }
  .bg3 { width: 280px; height: 280px; bottom: -40px; left: 200px; background: rgba(56,189,248,0.1); }
  .bg4 { width: 200px; height: 200px; bottom: 200px; right: 100px; background: rgba(251,113,133,0.08); }

  /* GRATIS badge */
  .gratis {
    position: absolute;
    top: 28px;
    left: 28px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(145deg, #F97316 0%, #EA580C 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 27px;
    color: white;
    z-index: 20;
    box-shadow: 0 6px 25px rgba(249,115,22,0.45);
    transform: rotate(-8deg);
    border: 3px solid rgba(255,255,255,0.3);
  }

  /* Grade badge */
  .grade {
    position: absolute;
    top: 38px;
    right: 30px;
    background: rgba(124,58,237,0.1);
    backdrop-filter: blur(10px);
    padding: 12px 22px;
    border-radius: 30px;
    border: 2px solid rgba(124,58,237,0.2);
    z-index: 20;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
  }
  .grade span {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: #7C3AED;
    letter-spacing: 0.5px;
  }

  /* Title area */
  .title-area {
    position: absolute;
    top: 35px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }
  .title-line1 {
    font-size: 68px;
    font-weight: 700;
    color: #F97316;
    text-shadow: 0 2px 8px rgba(249,115,22,0.15);
    letter-spacing: 3px;
    line-height: 1;
  }
  .title-line2 {
    font-size: 68px;
    font-weight: 700;
    color: #7C3AED;
    text-shadow: 0 2px 8px rgba(124,58,237,0.15);
    letter-spacing: 3px;
    line-height: 1;
    margin-top: -4px;
  }
  .subtitle {
    font-family: 'Nunito', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #78716C;
    margin-top: 8px;
    letter-spacing: 0.5px;
  }

  /* Fan arrangement of 5 worksheets */
  .fan-container {
    position: absolute;
    top: 250px;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 400px;
    z-index: 10;
  }

  .fan-card {
    position: absolute;
    background: white;
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.12);
    top: 50%;
    left: 50%;
  }
  .fan-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
  }

  /* Far left - dolphin */
  .card-far-left {
    width: 140px;
    height: 181px;
    transform: translate(-380px, -90px);
    opacity: 0.8;
    border: 3px solid #38BDF8;
  }

  /* Left-center - giraffe */
  .card-left {
    width: 170px;
    height: 220px;
    transform: translate(-260px, -110px);
    border: 3px solid #FBBF24;
    z-index: 2;
  }

  /* Center - raccoon (largest) */
  .card-center {
    width: 210px;
    height: 272px;
    transform: translate(-105px, -136px);
    border: 4px solid #F97316;
    z-index: 3;
    box-shadow: 0 10px 40px rgba(249,115,22,0.25);
  }

  /* Right-center - puppy */
  .card-right {
    width: 170px;
    height: 220px;
    transform: translate(70px, -110px);
    border: 3px solid #A78BFA;
    z-index: 2;
  }

  /* Far right - fish */
  .card-far-right {
    width: 140px;
    height: 181px;
    transform: translate(220px, -90px);
    opacity: 0.8;
    border: 3px solid #FB7185;
  }

  /* Animal name pills */
  .animal-pills {
    position: absolute;
    bottom: 168px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 15;
  }
  .animal-pill {
    padding: 7px 16px;
    border-radius: 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: white;
    letter-spacing: 0.5px;
  }
  .ap-raccoon { background: #78716C; }
  .ap-giraffe { background: #D97706; }
  .ap-dolphin { background: #0284C7; }
  .ap-puppy { background: #7C3AED; }
  .ap-fish { background: #E11D48; }

  /* Feature pills */
  .pills {
    position: absolute;
    bottom: 105px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 15;
  }
  .pill {
    background: rgba(124,58,237,0.08);
    border: 2px solid rgba(124,58,237,0.15);
    border-radius: 22px;
    padding: 8px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #7C3AED;
  }

  /* Bottom tagline */
  .tagline {
    position: absolute;
    bottom: 45px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 15;
  }
  .tagline span {
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: #A8A29E;
    font-style: italic;
  }

  /* Small decorative circles */
  .deco-circle {
    position: absolute;
    border-radius: 50%;
    border: 2px solid;
    z-index: 3;
    opacity: 0.2;
  }
  .dc1 { width: 30px; height: 30px; top: 230px; left: 60px; border-color: #F97316; }
  .dc2 { width: 20px; height: 20px; top: 280px; right: 70px; border-color: #7C3AED; }
  .dc3 { width: 25px; height: 25px; bottom: 230px; left: 120px; border-color: #38BDF8; }
  .dc4 { width: 18px; height: 18px; bottom: 250px; right: 130px; border-color: #FB7185; }
</style>
</head>
<body>

<!-- Background spots -->
<div class="bg-spot bg1"></div>
<div class="bg-spot bg2"></div>
<div class="bg-spot bg3"></div>
<div class="bg-spot bg4"></div>

<!-- Decorative circles -->
<div class="deco-circle dc1"></div>
<div class="deco-circle dc2"></div>
<div class="deco-circle dc3"></div>
<div class="deco-circle dc4"></div>

<!-- GRATIS badge -->
<div class="gratis">GRATIS</div>

<!-- Grade badge -->
<div class="grade"><span>VORSCHULE&ndash;2. KL.</span></div>

<!-- Title -->
<div class="title-area">
  <div class="title-line1">TIERISCHE</div>
  <div class="title-line2">PUZZLEWELT</div>
  <div class="subtitle">Jedes Tier ein neues Abenteuer!</div>
</div>

<!-- Fan of worksheets -->
<div class="fan-container">
  <!-- Far left: Dolphin -->
  <div class="fan-card card-far-left">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-3.jpeg" alt="Delfin Puzzlebild">
  </div>
  <!-- Left-center: Giraffe -->
  <div class="fan-card card-left">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-2.jpeg" alt="Giraffe Puzzlebild">
  </div>
  <!-- Center: Raccoon (largest) -->
  <div class="fan-card card-center">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-1.jpeg" alt="Waschb&auml;r Puzzlebild">
  </div>
  <!-- Right-center: Puppy -->
  <div class="fan-card card-right">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-4.jpeg" alt="Hund Puzzlebild">
  </div>
  <!-- Far right: Fish -->
  <div class="fan-card card-far-right">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-5.jpeg" alt="Fisch Puzzlebild">
  </div>
</div>

<!-- Animal name pills -->
<div class="animal-pills">
  <div class="animal-pill ap-raccoon">Waschb&auml;r</div>
  <div class="animal-pill ap-giraffe">Giraffe</div>
  <div class="animal-pill ap-dolphin">Delfin</div>
  <div class="animal-pill ap-puppy">Hund</div>
  <div class="animal-pill ap-fish">Fisch</div>
</div>

<!-- Feature pills -->
<div class="pills">
  <div class="pill">Abwechslungsreich</div>
  <div class="pill">Mit L&ouml;sungen</div>
  <div class="pill">Sofort einsetzbar</div>
</div>

<!-- Tagline -->
<div class="tagline">
  <span>Abwechslungsreiche Tiermotive f&uuml;r jeden Geschmack</span>
</div>

</body>
</html>
