# Teaching package — compare 2 objects by weight (heavier/lighter)
# Arc 11 Phase 2 (Option F single-package-strand deepening; early-numeracy
# / measurement strand 1/9 → 2/9). RESOLVES Arc 9 compare-by-length
# forward-pointer.

targetSlug: compare-by-weight
language: en
title:
  en: "Compare by Weight — heavier, lighter, or the same?"
description:
  en: "Preschool / Kindergarten early-numeracy package teaching weight comparison. Builds on Arc 9 compare-by-length (length-comparison foundation). RESOLVES Arc 9 forward-pointer ('compare WEIGHT next'). Foundational measurement skill: kids compare two objects by weight + use comparative vocabulary (heavier / lighter / same weight). Pre-formal measurement work using direct comparison (lifting + balancing). Vocab-anchored — comparative vocabulary reinforced from compare-by-length pattern. Composes against big-small + matching apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class direct-weight-comparison routine. Teacher holds up 2
      objects (e.g., a feather + a book). 'Which is heavier?' Class
      identifies the book. 'Which is lighter?' Class identifies the
      feather. Teacher says: 'Lifting tells us about weight — heavy
      things make our arm tired; light things feel like nothing.'
      Repeat with 4-5 pairs of varying weight difference. Reinforces
      direct-comparison-by-lifting as foundation for weight reasoning.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + lift-and-compare routine. Each pair receives 6-8
      objects of varying weight (paper-cut representations OR real
      classroom objects — feather, pencil, book, rock-shaped
      manipulative). Pair compares each item against a reference
      using the comparative frame: 'The book is heavier than the
      feather.' Recast errors with explanation ('you said the book
      is light — let's compare it to something. The book is heavier
      than what? The book is heavier than the feather. Use heavier
      WITH than X so we know what we're comparing'). Optional
      extension: kids order 3 objects lightest to heaviest using
      direct comparison.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: big-small worksheet (kids identify
      bigger/smaller — sibling concept; many physical big things are
      ALSO heavy + small things light, but exceptions exist). Station
      2: matching worksheet (image-name pairs reinforce vocabulary).
      Station 3: manipulative cut-outs hands-on weight-ordering (kids
      use object-cut-outs to order from lightest to heaviest).
      Station 4: sentence-strips (kids fill in comparative sentences
      using 'heavier' / 'lighter' / 'same weight').
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays 4 objects of varying
      weight; class collectively orders them lightest to heaviest.
      Forward-pointer: 'Today we compared 2 things by weight. When
      we come back to measuring next, we'll compare CAPACITY — which
      container holds MORE — using cups + bowls + buckets.'

