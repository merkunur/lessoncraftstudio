thematicCoherence:
  en: |
    All 5 packages cohere around the tools theme + bridge home-context
    cluster + occupations-adjacent contexts through tool-mediation —
    tools are simultaneously household-objects (in family-garage) +
    occupations-instruments (used by carpenter / plumber / etc.).

    **Pedagogical sequencing:**
    1. **identify-and-name-action-verbs** — Foundational tool-action
       vocabulary (hammer, screw, drill, measure, build, fix, cut, dig).
       Same shared package across many bundles (~12 bundles use this
       package). Tool-context substantiates verb-vocabulary with
       concrete physical-action observations.
    2. **identify-community-helpers** — Community-roles work extending
       to tool-using workers (carpenter, plumber, electrician, gardener,
       mechanic, builder). Same shared package with classroom + at-the-
       supermarket + post-office + hospital bundles. Tools-context
       bridges household-object cluster to adult-work-context cluster.
    3. **count-objects-1-to-10** — Counting practice using tool items
       as countable subjects (5 nails in a row; 3 hammers in the
       toolbox; 7 screws in the package; 8 measuring-tape markings).
       Same shared package across many bundles; tool-context authentic
       real-world counting application (measuring + sorting parts).
    4. **sort-by-category** — Category-classification work
       distinguishing hammers vs saws vs measuring-tools vs fasteners
       (nails + screws) OR by trade-use (gardening tools: rake, shovel,
       hoe; carpentry tools: hammer, saw, level; auto-repair tools:
       wrench, jack, screwdriver). Same shared package; tool-context
       enables multi-axis classification work bridging form + function.
    5. **use-size-comparison-words** — Comparison work using tool-size
       contexts (big hammer vs small hammer; long screwdriver vs short
       screwdriver; heavy wrench vs light wrench; wide saw vs narrow
       saw). Same shared package; tool-size variation supports
       kinesthetic + visual comparison work.

    **Strand spread:** 1 vocabulary-acquisition (action-verbs) + 1
    community-and-roles + 1 numeracy + 1 cognitive-sorting + 1
    comparison. **5 distinct strands.** Cross-strand home-context +
    occupations-bridging composition — distinguishes from sibling
    home-context bundles (furniture + around-the-house) by occupations-
    bridging strand inclusion. Pattern: home-context anchor with
    occupations-roles bridging extends the cluster boundary.

    **Suggested unit duration:** 4-5 weeks (1 package per week).
    Natural fit alongside family-routine + occupations-week. Particularly
    engaging for K-3 — tools have high tactile-interest + adult-mimicry
    appeal; classroom-art-corner has scissor + glue + ruler as everyday
    K-3 tools.

    **Multilingual classroom relevance:** tool vocabulary cognate-rich
    Romance (herramienta / outil / strumento / ferramenta); Germanic-
    distinct (Werkzeug / werktuig / verktyg / værktøj / työkalu).
    Specific tool vocabulary varies (hammer / Hammer / martillo / marteau
    / martello / martelo). Universal practical-life relevance — every
    K-3 kid encounters basic tools daily (scissors, ruler, hammer-like
    toys, classroom art tools).

    **Pillar 2 architectural pattern:** tools-bundle exemplifies cluster-
    bridging bundle composition — bridges home-context cluster
    (furniture + around-the-house) with occupations-adjacent context
    via tool-mediation. Theme-axis-key home-context-tools (vs furniture
    + around-the-house at static-home-object cluster). Precedent for
    cluster-bridging pattern: bundle composition can SPAN two clusters
    when the theme naturally bridges (tools bridge home + work; sports-
    equipment would bridge cultural-arts + outdoor; gardening would
    bridge plant + outdoor). 14-cluster taxonomy continues maturing.
