<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Word Guess Challenge - Theme Explorer Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(180deg, #E0F2FE 0%, #BAE6FD 30%, #7DD3FC 70%, #38BDF8 100%);">

        <!-- Subtle pattern overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.05; background-image:
            linear-gradient(to right, #1E3A5F 1px, transparent 1px),
            linear-gradient(to bottom, #1E3A5F 1px, transparent 1px);
            background-size: 40px 40px;"></div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 25px; left: 25px;">
            <div style="width: 80px; height: 80px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(249,115,22,0.5);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; color: white;">FREE</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 30px; right: 30px;">
            <div style="background: white; padding: 10px 22px; border-radius: 25px; box-shadow: 0 3px 10px rgba(0,0,0,0.15);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: #1E3A5F; letter-spacing: 1px;">GRADES K-1</span>
            </div>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%); text-align: center;">
            <p style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 50px; font-weight: 700; color: #1E3A5F; text-shadow: 0 2px 4px rgba(0,0,0,0.08);">EXPLORE EVERY</p>
            <h1 style="margin: -5px 0 0 0; font-family: 'Fredoka', sans-serif; font-size: 70px; font-weight: 700; color: #F97316; text-shadow: 0 3px 6px rgba(0,0,0,0.12);">THEME!</h1>
        </div>

        <!-- 2x2 Theme Grid -->
        <div style="position: absolute; top: 195px; left: 50%; transform: translateX(-50%); width: 820px; height: 600px;">

            <!-- Top-left: Animals (green border) -->
            <div style="position: absolute; left: 40px; top: 0; text-align: center;">
                <div style="width: 190px; height: 247px; background: white; border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); overflow: hidden; border: 4px solid #22C55E;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/word%20guess/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Animals Worksheet">
                </div>
                <div style="margin-top: 10px; background: #22C55E; padding: 6px 20px; border-radius: 15px; display: inline-block; box-shadow: 0 3px 10px rgba(34,197,94,0.3);">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600; color: white;">Animals</span>
                </div>
            </div>

            <!-- Top-right: Food (orange border) -->
            <div style="position: absolute; right: 40px; top: 0; text-align: center;">
                <div style="width: 190px; height: 247px; background: white; border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); overflow: hidden; border: 4px solid #F97316;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/word%20guess/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Food Worksheet">
                </div>
                <div style="margin-top: 10px; background: #F97316; padding: 6px 20px; border-radius: 15px; display: inline-block; box-shadow: 0 3px 10px rgba(249,115,22,0.3);">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600; color: white;">Food</span>
                </div>
            </div>

            <!-- Bottom-left: Christmas (red border) -->
            <div style="position: absolute; left: 40px; top: 305px; text-align: center;">
                <div style="width: 190px; height: 247px; background: white; border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); overflow: hidden; border: 4px solid #DC2626;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/word%20guess/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Christmas Worksheet">
                </div>
                <div style="margin-top: 10px; background: #DC2626; padding: 6px 20px; border-radius: 15px; display: inline-block; box-shadow: 0 3px 10px rgba(220,38,38,0.3);">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600; color: white;">Christmas</span>
                </div>
            </div>

            <!-- Bottom-right: Ocean (sky blue border) -->
            <div style="position: absolute; right: 40px; top: 305px; text-align: center;">
                <div style="width: 190px; height: 247px; background: white; border-radius: 10px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); overflow: hidden; border: 4px solid #38BDF8;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/word%20guess/sample-4.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Ocean Worksheet">
                </div>
                <div style="margin-top: 10px; background: #0EA5E9; padding: 6px 20px; border-radius: 15px; display: inline-block; box-shadow: 0 3px 10px rgba(14,165,233,0.3);">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600; color: white;">Ocean</span>
                </div>
            </div>

            <!-- Center connector - plus symbol -->
            <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);">
                <div style="width: 80px; height: 80px; background: linear-gradient(145deg, #4C1D95 0%, #6B21A8 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(76,29,149,0.4); border: 4px solid #FBBF24;">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 42px; font-weight: 700; color: white;">+</span>
                </div>
            </div>
        </div>

        <!-- Bottom feature bar -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: white; display: flex; align-items: center; justify-content: center; gap: 15px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1);">
            <div style="background: #22C55E; width: 12px; height: 12px; border-radius: 50%;"></div>
            <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #22C55E;">Animals</span>
            <div style="background: #F97316; width: 12px; height: 12px; border-radius: 50%;"></div>
            <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #F97316;">Food</span>
            <div style="background: #DC2626; width: 12px; height: 12px; border-radius: 50%;"></div>
            <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #DC2626;">Christmas</span>
            <div style="background: #0EA5E9; width: 12px; height: 12px; border-radius: 50%;"></div>
            <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #0EA5E9;">Ocean</span>
            <div style="background: #6B21A8; width: 12px; height: 12px; border-radius: 50%;"></div>
            <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #6B21A8;">Custom</span>
        </div>

    </div>
</body>
</html>
