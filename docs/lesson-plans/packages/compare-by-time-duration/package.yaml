assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Compare 2 events by duration in 8 of 10 trials.
      - Use vocabulary LONGER / SHORTER accurately in 7 of 10
        trials.
      - Order 3-4 events from shortest to longest duration in 6
        of 10 trials.
      - Identify which time-unit (seconds/minutes/hours/days) fits
        a given event in 5 of 10 trials.

    Differentiation:
    - Pre-K: 2-event pairs with very obvious duration contrast
      (sneeze vs sleep all night); receptive-only comparison.
    - K: 2-3 event comparisons with moderate duration contrasts.
    - Grade 1+: extend to clock-reading + analog time work + bridge
      to time-and-routine strand saturation (1 strand remaining
      for Arc 15).

