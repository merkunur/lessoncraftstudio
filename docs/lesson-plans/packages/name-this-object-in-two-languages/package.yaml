compositionalRationale:
  en: |
    Primary strand: multilingual-language-awareness. Secondary strand:
    vocabulary acquisition (kids reinforce school-language vocabulary
    while practicing home-language vocabulary). Tertiary strand:
    identity-affirmation (validating kids' bilingual identity by
    treating both languages as legitimate).

    Architectural significance: this is the FIRST multilingual-language-
    awareness domain package in the catalog. Validates that the
    architecture handles multilingual-pedagogy work as a distinct strand
    from straightforward vocabulary-acquisition. Per CLAUDE.md §1
    multilingual K-3 audience framing: multilingual-language-awareness
    targets are core to the platform's positioning, not adjunct.

    Distinctive composition: 4 of 5 composedExercises are matching across
    different theme contexts (animals, fruits, vehicles, body-parts) —
    NOT vocabulary-acquisition-as-naming work; rather the matching
    surface gives kids a structured vocabulary list to bring home-
    language names to. The implicit pedagogy: school-language matching
    happens on the worksheet; home-language matching happens orally
    during scaffold + closure activities.

    Class B FLEXIBLE substrate: composes against any image-library content
    where kids have a chance to know home-language names. The 4 theme
    contexts (animals + fruits + vehicles + body-parts) are universal
    vocabulary categories where most home languages have names; less
    likely to surface gaps where a home-language has no word for the
    object. Substrate-readiness measured by image-library theme breadth,
    not specific cluster keys.

    Cultural-variation acknowledgment: K-3 multilingual classrooms vary
    enormously in language combinations. International schools may have
    20+ home languages represented; bilingual schools may have 1-2;
    immersion schools may have a clear school-vs-home split. The
    package framework supports all of these — teachers facilitate
    sharing whatever home languages their kids bring. No hardcoded
    assumptions about which language pair the kid is bilingual in.

    Cross-strand integration: name-this-object-in-two-languages is
    pedagogically downstream of the various identify-and-name-X packages
    (kids must know objects to name them in two languages). This Phase 2
    package builds on the entire vocabulary-acquisition strand authored
    across Arc 1-5 + Arc 6 Phase 1. Future multilingual-language-
    awareness packages (notice-cognate-word-pairs, identify-language-of-
    spoken-utterance) extend further into multilingual cognition.

    Parent-take-home-letter material role: bilingual home-school bridge.
    Letter explicitly invites parents to share their home-language names
    for the depicted objects with the child — extends the classroom
    pedagogy into family conversation. This is a high-leverage parent
    engagement surface.

