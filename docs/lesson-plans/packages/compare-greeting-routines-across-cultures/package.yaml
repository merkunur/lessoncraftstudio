assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify 4 of 6 greeting gestures from different cultures in 8
        of 10 trials.
      - Use 3 of 6 greeting words from different languages
        ('hello' / 'bonjour' / 'hola' / 'konnichiwa' / 'hej' / 'olá')
        appropriately in pretend interactions in 7 of 10 trials.
      - Articulate the cultural-greeting principle ("people greet each
        other differently in different places") in 6 of 10 trials.

    Differentiation:
    - Pre-K: 3 greeting gestures + 3 greeting words; pair-noticing only.
    - K: 5-6 greetings; matching + flashcard work.
    - Grade 1+: extend to FAREWELL routines (Arc 10+ candidate) +
      everyday-cultural-rituals comparison; bridge to social-studies
      cultural-awareness work.

