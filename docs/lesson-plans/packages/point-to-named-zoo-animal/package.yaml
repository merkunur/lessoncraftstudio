assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Point to the correct zoo-animal picture-card when teacher names it
        in target language in 9 of 10 trials.
      - Point to the correct zoo-animal in a zoo-scene context (mixed
        animals visible; child finds the named one) in 8 of 10 trials.
      - Match zoo-animal pictures to zoo-animal words in 8 of 10 trials.

    Differentiation:
    - Pre-K: 6-key receptive set (subset of the 10); flashcard recognition
      only.
    - K: 10-key receptive set; flashcard + zoo-scene context.
    - Grade 1+: bridge to productive identify-and-name-10-zoo-animals
      (Arc 4) — kids transition from pointing to naming.

