compositionalRationale:
  en: |
    Primary strand: early-numeracy / data-and-graphs (graph
    interpretation). Secondary strand: counting-and-cardinality (kids
    count bar heights). Tertiary strand: comparison + subtraction
    (HOW-MUCH-MORE questions activate subtraction reasoning).

    Architectural significance: deepens data-and-graphs strand 2/4 →
    3/4. Resolves Arc 11 count-and-graph-categories forward-pointer.
    Bridges from data-construction (Arc 9+11) to data-interpretation
    (this package). Strand cohort: sort-objects-by-attribute (Arc 9)
    + count-and-graph-categories (Arc 11) + interpret-simple-bar-graph
    (this) + interpret-simple-pictograph (1 unauthored remaining).

    Class B FLEXIBLE substrate: composes against image-library breadth.

    K-3 multilingual classroom relevance: graph + comparison vocabulary
    universal K-3 target.

curriculumStandards:
  - CCSS.1.MD.C.4
  - CCSS.2.MD.D.10
