<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1000, height=1000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px;
    height: 1000px;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(160deg, #7C3AED 0%, #6D28D9 50%, #5B21B6 100%);
    position: relative;
  }

  /* Halftone dot overlay */
  .halftone {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.04) 2px, transparent 2px);
    background-size: 12px 12px;
    z-index: 1;
  }

  /* Action/speed lines radiating from center */
  .speed-lines {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1400px;
    height: 1400px;
    transform: translate(-50%, -50%);
    z-index: 2;
    overflow: hidden;
  }
  .speed-line {
    position: absolute;
    top: 50%;
    left: 50%;
    height: 2px;
    transform-origin: left center;
    background: rgba(255,255,255,0.06);
  }
  .sl1 { width: 700px; transform: rotate(0deg); }
  .sl2 { width: 700px; transform: rotate(20deg); }
  .sl3 { width: 700px; transform: rotate(40deg); }
  .sl4 { width: 700px; transform: rotate(60deg); }
  .sl5 { width: 700px; transform: rotate(80deg); }
  .sl6 { width: 700px; transform: rotate(100deg); }
  .sl7 { width: 700px; transform: rotate(120deg); }
  .sl8 { width: 700px; transform: rotate(140deg); }
  .sl9 { width: 700px; transform: rotate(160deg); }
  .sl10 { width: 700px; transform: rotate(180deg); }
  .sl11 { width: 700px; transform: rotate(200deg); }
  .sl12 { width: 700px; transform: rotate(220deg); }
  .sl13 { width: 700px; transform: rotate(240deg); }
  .sl14 { width: 700px; transform: rotate(260deg); }
  .sl15 { width: 700px; transform: rotate(280deg); }
  .sl16 { width: 700px; transform: rotate(300deg); }
  .sl17 { width: 700px; transform: rotate(320deg); }
  .sl18 { width: 700px; transform: rotate(340deg); }

  /* GRATIS badge (comic style) */
  .gratis {
    position: absolute;
    top: 24px;
    left: 24px;
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: linear-gradient(145deg, #FACC15 0%, #EAB308 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 28px;
    color: #1C1917;
    z-index: 20;
    box-shadow: 0 4px 0 #92400E, 0 6px 20px rgba(0,0,0,0.3);
    transform: rotate(-8deg);
    border: 4px solid #1C1917;
  }

  /* Grade badge */
  .grade {
    position: absolute;
    top: 34px;
    right: 28px;
    background: #FACC15;
    padding: 12px 22px;
    border-radius: 30px;
    border: 3px solid #1C1917;
    z-index: 20;
    box-shadow: 0 4px 0 #92400E;
  }
  .grade span {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: #1C1917;
    letter-spacing: 0.5px;
  }

  /* Title */
  .title-area {
    position: absolute;
    top: 35px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }
  .title-line1 {
    font-size: 74px;
    font-weight: 700;
    color: white;
    text-shadow: 0 4px 0 rgba(0,0,0,0.3);
    letter-spacing: 5px;
    line-height: 1;
  }
  .title-line2 {
    font-size: 88px;
    font-weight: 700;
    color: #FACC15;
    text-shadow: 0 4px 0 rgba(0,0,0,0.3);
    letter-spacing: 5px;
    line-height: 1;
    margin-top: -4px;
  }

  /* Starburst behind worksheet */
  .starburst {
    position: absolute;
    top: 300px;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    height: 420px;
    background: #FACC15;
    clip-path: polygon(50% 0%, 61% 15%, 76% 3%, 73% 22%, 90% 18%, 82% 35%, 100% 38%, 87% 50%, 100% 62%, 82% 65%, 90% 82%, 73% 78%, 76% 97%, 61% 85%, 50% 100%, 39% 85%, 24% 97%, 27% 78%, 10% 82%, 18% 65%, 0% 62%, 13% 50%, 0% 38%, 18% 35%, 10% 18%, 27% 22%, 24% 3%, 39% 15%);
    z-index: 4;
    opacity: 0.35;
  }

  /* Main worksheet frame */
  .main-frame {
    position: absolute;
    top: 300px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }
  .frame-inner {
    width: 250px;
    height: 323px;
    background: white;
    border-radius: 8px;
    padding: 7px;
    border: 5px solid #1C1917;
    box-shadow: 0 6px 0 #1C1917, 0 10px 30px rgba(0,0,0,0.4);
  }
  .frame-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 4px;
  }

  /* Speech bubbles */
  .speech {
    position: absolute;
    z-index: 15;
    padding: 10px 18px;
    border-radius: 18px;
    border: 3px solid #1C1917;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 16px;
    box-shadow: 0 3px 0 #1C1917;
    white-space: nowrap;
  }
  .speech::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    background: inherit;
    border: 3px solid #1C1917;
    border-top: none;
    border-left: none;
  }

  .speech-green {
    top: 290px;
    right: 60px;
    background: #84CC16;
    color: #1C1917;
    transform: rotate(6deg);
  }
  .speech-green::after {
    bottom: -10px;
    left: 20px;
    transform: rotate(45deg);
    background: #84CC16;
  }

  .speech-cyan {
    top: 430px;
    left: 40px;
    background: #06B6D4;
    color: white;
    transform: rotate(-6deg);
  }
  .speech-cyan::after {
    bottom: -10px;
    right: 25px;
    transform: rotate(45deg);
    background: #06B6D4;
  }

  .speech-yellow {
    bottom: 225px;
    right: 70px;
    background: #FACC15;
    color: #1C1917;
    transform: rotate(4deg);
  }
  .speech-yellow::after {
    top: -10px;
    left: 30px;
    transform: rotate(-135deg);
    background: #FACC15;
  }

  /* Comic stars */
  .comic-star {
    position: absolute;
    z-index: 5;
    color: rgba(255,255,255,0.3);
  }
  .cs1 { top: 260px; left: 100px; font-size: 28px; transform: rotate(-10deg); }
  .cs2 { top: 360px; right: 30px; font-size: 22px; transform: rotate(15deg); }
  .cs3 { bottom: 280px; left: 60px; font-size: 24px; transform: rotate(5deg); }
  .cs4 { top: 220px; right: 200px; font-size: 18px; transform: rotate(-20deg); }
  .cs5 { bottom: 300px; right: 180px; font-size: 20px; transform: rotate(25deg); }

  /* Feature pills */
  .pills {
    position: absolute;
    bottom: 108px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 15;
  }
  .pill {
    background: rgba(255,255,255,0.15);
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 22px;
    padding: 8px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: white;
  }

  /* Tagline */
  .tagline {
    position: absolute;
    bottom: 45px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 15;
  }
  .tagline span {
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
    font-style: italic;
  }
</style>
</head>
<body>

<!-- Halftone overlay -->
<div class="halftone"></div>

<!-- Speed lines -->
<div class="speed-lines">
  <div class="speed-line sl1"></div>
  <div class="speed-line sl2"></div>
  <div class="speed-line sl3"></div>
  <div class="speed-line sl4"></div>
  <div class="speed-line sl5"></div>
  <div class="speed-line sl6"></div>
  <div class="speed-line sl7"></div>
  <div class="speed-line sl8"></div>
  <div class="speed-line sl9"></div>
  <div class="speed-line sl10"></div>
  <div class="speed-line sl11"></div>
  <div class="speed-line sl12"></div>
  <div class="speed-line sl13"></div>
  <div class="speed-line sl14"></div>
  <div class="speed-line sl15"></div>
  <div class="speed-line sl16"></div>
  <div class="speed-line sl17"></div>
  <div class="speed-line sl18"></div>
</div>

<!-- GRATIS badge -->
<div class="gratis">GRATIS</div>

<!-- Grade badge -->
<div class="grade"><span>VORSCHULE&ndash;2. KL.</span></div>

<!-- Title -->
<div class="title-area">
  <div class="title-line1">WO FEHLT</div>
  <div class="title-line2">WAS?</div>
</div>

<!-- Starburst -->
<div class="starburst"></div>

<!-- Speech bubbles -->
<div class="speech speech-green">HIER FEHLT WAS!</div>
<div class="speech speech-cyan">SCHAU GENAU!</div>
<div class="speech speech-yellow">GESCHAFFT!</div>

<!-- Main worksheet (puppy) -->
<div class="main-frame">
  <div class="frame-inner">
    <img src="https://www.lessoncraftstudio.com/samples/german/missing%20pieces/sample-4.jpeg" alt="Hund Puzzlebild">
  </div>
</div>

<!-- Comic stars -->
<div class="comic-star cs1">&#x2605;</div>
<div class="comic-star cs2">&#x2605;</div>
<div class="comic-star cs3">&#x2605;</div>
<div class="comic-star cs4">&#x2605;</div>
<div class="comic-star cs5">&#x2605;</div>

<!-- Feature pills -->
<div class="pills">
  <div class="pill">R&auml;tselspa&szlig;</div>
  <div class="pill">Konzentration</div>
  <div class="pill">Lernstation</div>
</div>

<!-- Tagline -->
<div class="tagline">
  <span>Knobeln, suchen, einsetzen &mdash; so macht Lernen Spa&szlig;!</span>
</div>

</body>
</html>
