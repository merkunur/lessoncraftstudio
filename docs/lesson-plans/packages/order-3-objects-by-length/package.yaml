# Teaching package — order 3 objects by length
# Arc 19 Phase 1.2 Slot 1 (early-numeracy / measurement strand 8/9 → 9/9 SAT — STRAND-SAT-CLOSING; 21st parent-class strand SAT closure). Pair-coherent positioning with phonological-awareness triad (Slots 2+3+4). Final canonical target in the measurement strand. Prerequisite per learning-targets.json line 255: compare-by-length (Arc 9 P1).

targetSlug: order-3-objects-by-length
language: en
title:
  en: "Order by Length — shortest, middle, longest"
description:
  en: "Kindergarten / Grade 1 early-numeracy package teaching kids to order 3 objects by length, arranging shortest-to-longest (or longest-to-shortest). Direct extension of compare-by-length (Arc 9 P1; pairwise comparison) to the 3-object case requiring transitive reasoning ('if A is shorter than B and B is shorter than C, then A is shorter than C — so the order is A → B → C'). STRAND-SAT-CLOSING package: completes measurement strand at 9/9 SAT — final canonical target per learning-targets.json line 255. **21st parent-class strand SATISFIED in the catalog** (advances aggregate parent-class strand-saturation 20/30 → 21/30 = 70.0% per §A.13.33 parent-class methodology). Per §A.13.30 K-1 informal framing: order-3-objects work is CONCRETE PHYSICAL ORDERING — kids handle 3 objects + arrange them in a line shortest-to-longest, naming the order verbally. NOT formal measurement-unit application (rulers + numerical-unit work is Grade 1-2+; this strand stays pre-formal). CCSS.1.MD.A.1 primary anchor ('Order three objects by length; compare the lengths of two objects indirectly by using a third object'). 5 worksheet exercises + 7 printable materials over a 1-week unit. Materials list mirrors compare-by-length canonical Numeracy/Measurement 7-material shape."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class 3-object ordering hook. Teacher displays 3 objects
      of clearly different lengths (a pencil, a crayon, a ruler) on
      the floor or table. "Which is the SHORTEST? Which is the
      LONGEST?" Class identifies endpoints. Then teacher asks: "What
      about the one in the MIDDLE?" Class identifies. Teacher arranges
      the 3 objects in a line shortest-to-longest while saying: "First
      the shortest, then the middle, then the longest. SHORT — MIDDLE
      — LONG." Repeats with 3 more triplets (3 snakes of cut paper;
      3 ribbons; 3 shoes). Pattern emphasis: "When we ORDER 3 things
      by length, we find the SHORTEST first, the LONGEST last, and
      the MIDDLE one between them."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + 3-object ordering routine. Each pair receives 3 sets
      of 3 paper-cut objects each (e.g., 3 snakes; 3 worms; 3 ribbons).
      Pair takes turns: kid A scrambles a set; kid B arranges them
      shortest-to-longest + names the order out loud ("the shortest
      is the worm; the middle is the snake; the longest is the
      ribbon"). Kids verify by lining objects up side-by-side with
      bottom edges aligned (the canonical direct-comparison technique).
      Critical pedagogical move — TRANSITIVE REASONING: kids who
      mastered compare-by-length pairwise sometimes struggle to chain
      comparisons across 3 objects. Recast with explicit chaining
      ("you said the snake is shorter than the ribbon, and the worm
      is shorter than the snake. So the worm is shorter than the
      ribbon TOO — the worm must be the shortest of all three").
      Optional extension: pair orders 4 objects shortest-to-longest;
      then 5 objects. Build up object-count progressively as kids
      gain transitive-comparison fluency.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: big-small worksheet (kids identify
      biggest/smallest in a 3-item set — natural extension of pairwise
      bigger/smaller to triplet endpoints). Station 2: matching
      worksheet (vehicle-name pairs; reinforces length-relevant
      vocabulary — bus, car, motorcycle have meaningful length
      variation). Station 3: manipulative cut-outs hands-on ordering
      (kids physically arrange 3 cut-out objects by length using
      direct comparison). Station 4: sentence-strips with size
      framing (kids fill in 'the SHORTEST is the X' / 'the LONGEST
      is the Y' / 'the MIDDLE is the Z' frames).
  closure:
    durationMinutes: 5
    body: |
      Whole-class strand-SAT-CLOSING celebration + 3-object ordering
      quick-recall. Teacher displays 3 sets of 3 objects each in
      scrambled order; class collectively orders each set shortest-
      to-longest. Teacher then makes the STRAND-SAT-CLOSING
      announcement: "Today we CLOSED our measurement strand! We
      started in K with compare-by-length, then compare-by-weight,
      compare-by-capacity, tell-time-to-the-hour and -half-hour and
      -quarter-hour, identify-coin-values, recognize-money-amounts...
      and today we finished with order-3-objects-by-length. 9 of 9
      measurement targets DONE — that's the COMPLETE measurement
      strand for K-3. Measurement is comparing + ordering things by
      size, weight, capacity, time, and value. You've learned all
      five." Forward-pointer: "When we come back to measurement
      thinking later, we'll start using NUMBERS to measure (how
      many paperclips long? how many cubes high?) instead of just
      comparing things directly. That's Grade 1-2 measurement work
      that builds on the foundation you just finished."

