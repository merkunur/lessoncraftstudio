compositionalRationale:
  en: |
    Primary strand: early-literacy / written-expression (noun-phrase
    labeling). Secondary strand: vocabulary-acquisition (adjectives
    + articles for noun-phrase construction). Tertiary strand:
    fine-motor (writing the noun phrases).

    Architectural significance: forward-pointer resolution from Arc
    13 label-a-picture-with-1-word ('next we extend single-word
    labeling to 2-3-word noun phrase labeling'). Builds on Arc 12-
    13 written-expression foundation: label-1-word → label-with-
    noun-phrase (this package). Critical bridge from single-word
    labels to sentence-level writing; integrates Arc 12-13 color +
    size adjective vocabulary with established noun vocabulary
    (animals, foods, fruits, etc.).

    Distinctive composition: 2 word-scramble + 2 matching + 1
    crossword. Word-scramble + crossword emphasize correct word-
    order (article first, then adjective, then noun in English).

    Class B FLEXIBLE substrate: composes against animals + foods
    image-library themes (rich noun + adjective combinations: red
    apple, brown bear, three fish, big dog).

    K-3 multilingual classroom relevance: noun-phrase word-order
    varies across 11 platform locales — Romance + Germanic
    differ on adjective placement (en/de: red apple / der rote Apfel
    pre-noun; es/fr/it: la manzana roja / la pomme rouge / la mela
    rossa post-noun). Locale-variant sparse-overrides at Phase 3
    will need substantial syntactic adaptation per locale's
    adjective-noun ordering rules.

