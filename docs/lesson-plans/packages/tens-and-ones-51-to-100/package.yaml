compositionalRationale:
  en: |
    Primary strand: math / place-value (tens-and-ones for 51-100;
    deepens Phase 1+2 foundations 2/8 → 3/8). Secondary strand:
    numeracy (counting + number-recognition extending to 100).
    Tertiary strand: cognitive-and-executive-function / pattern-
    recognition (completing two-digit place-value pattern).

    Architectural significance: deepens place-value strand from
    2/8 to 3/8 at Phase 4 close. Completes full two-digit place-
    value range (1-20 + 21-50 + 51-100 = 1-100 covered). Builds
    directly on Arc 15 Phase 1 tens-and-ones-1-to-20 + Phase 2
    tens-and-ones-21-to-50 foundations. Foundation for full
    place-value-aware addition/subtraction + three-digit
    extension (Arc 16+ work).

    Distinctive composition: 1 matching + 2 math-puzzle
    (decomposition) + 1 pattern-train + 1 more-less. Place-value
    decomposition + comparison emphasized; sequencing reinforces
    full 0-100 pattern.

    Class B FLEXIBLE substrate: composes against miscellaneous
    theme; place-value work uses abstract numerical representation.

    K-3 multilingual classroom relevance: place-value concept
    universal across 11 platform locales. Number-word patterns
    for 51-100 vary: en regular "fifty-one through one-hundred";
    es "cincuenta-y-uno, sesenta, setenta..."; de "einundfünfzig"
    (reverse-decade); fi agglutinative. Locale-variant work at
    Phase 3+ adapts.

