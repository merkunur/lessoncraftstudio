thematicCoherence:
  en: |
    All 4 packages cohere around the birds sub-theme + form a
    cross-strand bundle anchored at bird vocabulary + observable
    biology.

    **Pedagogical sequencing:**
    1. **identify-and-name-action-verbs** — Action vocabulary
       anchored at bird-specific verbs (fly, sing, hop, perch,
       build-nest). Same shared package across occupations +
       toys + pets bundles; birds add 4th use. Bird-specific
       action verbs are particularly vivid (no other common
       animal flies).
    2. **classify-animals-by-habitat** — Cognitive classification
       using bird habitat diversity (forest-birds vs water-birds
       vs city-birds vs farm-birds). Same shared package across
       animals + farm-animals + ocean-life bundles; birds add
       4th use. Birds particularly habitat-diverse (more habitat
       types than other animal classes).
    3. **identify-living-vs-nonliving** — Biological-reasoning
       work. Birds ARE living-things; pairs with classify-by-
       habitat for whole-organism understanding. Now in 6 bundles
       (animals + farm-animals + pets + insects + ocean-life +
       birds).
    4. **find-hidden-target-in-busy-scene** — Visual-discrimination
       work in bird-watching context. Birds often camouflaged in
       foliage + nests; observation-skill work. Same shared
       package across vehicles + insects + ocean-life; birds add
       4th use.

    **Strand spread:** 1 vocabulary-acquisition + 1 cognitive-
    sorting (habitat) + 1 world-knowledge (living things) + 1
    visual-discrimination. 4 distinct strands; cross-strand
    pattern.

    **Suggested unit duration:** 4 weeks (1 package per week).
    Outdoor bird-watching extension activities natural fit;
    classroom bird-feeder observation extends through unit.

    **Multilingual classroom relevance:** bird vocabulary varied
    across 11 platform locales — Romance moderate-cognate (pájaro
    / oiseau / uccello) + Germanic distinct (Vogel / vogel /
    fågel) + Finnic distinct (lintu). Specific bird-type vocabulary
    (robin / petirrojo / rouge-gorge) more variable. Visual bird
    content translates universally; vocabulary anchor varies.

    **Pillar 2 architectural pattern:** birds-bundle exemplifies
    sub-theme bundle composition continuing pattern (animals →
    farm-animals + pets + birds = 3 sub-theme bundles at Pillar 2
    Arc 4 Phase 1 close). Demonstrates sustained sub-theme bundle
    architecture viability — theme-axis-key granularity supports
    multiple parallel animal-sub-theme bundles per audience-relevant
    context (rural farm-animals; residential pets; outdoor birds).
