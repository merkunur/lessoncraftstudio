assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Decompose 6 of 8 three-digit numbers (100-999) into correct
        hundreds-tens-ones representation.
      - Build a given three-digit number with base-ten manipulatives
        in 7 of 10 trials (including zero-in-middle + zero-at-end
        cases).
      - Compare two three-digit numbers using hierarchical comparison
        (hundreds first, then tens, then ones) correctly in 7 of 10
        trials.
      - Identify zero as place-holder (805 = "eight hundred and FIVE,
        with ZERO tens") in 6 of 8 zero-place trials.

    Differentiation:
    - Pre-K: skip three-digit work; review earlier place-value
      packages (tens-and-ones-1-to-20).
    - K: 100-300 range only with concrete manipulatives; avoid
      zero-place edge cases initially.
    - Grade 1: full 100-999 coverage; zero-as-placeholder cases
      introduced gently.
    - Grade 2+: extend to four-digit place value (thousands-
      hundreds-tens-ones) + bridge to three-digit addition/
      subtraction with regrouping (Arc 17+ candidate).

