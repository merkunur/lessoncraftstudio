# Teaching package — label a picture with a noun phrase
# Arc 14 Phase 2 (early-literacy / written-expression +1 from Arc 13).
# Resolves Arc 13 label-a-picture-with-1-word forward-pointer.

targetSlug: label-picture-with-noun-phrase
language: en
title:
  en: "Label with a Noun Phrase — the red apple, a big dog"
description:
  en: "Kindergarten / Grade 1 written-expression package teaching kids to label pictures using simple noun phrases (article + adjective + noun) instead of single-word labels. Builds on Arc 13 label-a-picture-with-1-word foundation. RESOLVES Arc 13 label-1-word forward-pointer ('next we extend single-word labeling to 2-3-word noun phrase labeling'). Examples: 'the red apple' / 'a big dog' / 'three blue cars' / 'two small fish'. Critical bridge from single-word labels to sentence-level writing; integrates color + size + number adjectives with noun-vocabulary. Uses freshly-shipped Arc 14 Phase 2 fine-motor work (trace-2d-shapes + draw-2d-shapes-freehand) implicitly — kids may draw their pictures + label them. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + noun-phrase introduction. Teacher displays
      a picture (red apple). "Last time we wrote 'apple'. Today we
      write more — 'the RED apple' or 'a SHINY apple'. We add
      describing words (color, size, number) to make our labels
      richer." Teacher shows examples: "'big dog' vs just 'dog'.
      'two cats' vs just 'cats'. 'three blue fish' vs just 'fish'."
      Visual + verbal anchor establishes adjective + article use.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + labeling routine. Each pair receives a worksheet
      with 6 pictures (e.g., a red apple, three brown cats, two
      yellow flowers, a big white dog, four small green frogs, a
      blue car). Pair takes turns: kid A points to a picture; kid B
      writes the noun phrase ('the red apple' or 'a big white dog').
      Pair checks answers together. Recast errors with prompting
      ("what color? — red. so we write 'the RED apple'. What size?
      — big. so we write 'a BIG white dog'.")
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: word-scramble worksheet
      (rearrange noun-phrase words to form correct order). Station
      2: matching worksheet (noun-phrase to picture). Station 3:
      crossword worksheet (fill noun-phrase words from picture
      clues). Station 4: vocabulary-tracing-strips for noun
      phrases ('the red apple', 'a big dog', etc.).
  closure:
    durationMinutes: 5
    body: |
      Whole-class noun-phrase review. Teacher displays new pictures;
      class collectively constructs noun phrases for each: 'a small
      yellow bird' / 'three orange cats' / 'the blue ball'.
      Forward-pointer: "Today we labeled with noun phrases. When
      we come back next, we'll write whole sentences — 'The red
      apple is shiny.' / 'A big dog runs fast.'"

