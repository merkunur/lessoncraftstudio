compositionalRationale:
  en: |
    Primary strand: addition / subtraction (target decompose-numbers-to-10 —
    learning-targets.json places this in early-numeracy / number-sense-comparison
    strand; the decomposition skill is foundational to addition fact fluency).
    Secondary strand: counting (counting decomposed groups + combined groups).
    Tertiary strand: pattern recognition (kids notice that 4+3 / 5+2 / 6+1 all
    produce 7 — the commutative-and-associative pattern is implicitly introduced).

    Distinctive material weighting: matching-mat is central (numeral ↔
    decomposition-expression pairs). manipulative-cut-outs supports concrete
    decomposition enactment. addition app composed in 3 different modes
    (image-image, find-addend, mixed) — this is the heaviest single-app load
    of any Arc 1+2+3 package, justified by the target's natural fit with
    addition as primary mechanic.

curriculumStandards:
  - CCSS.K.OA.A.3
  - CCSS.K.OA.A.4
  - CCSS.1.OA.B.3
  - EYFS.ELG.M

assessmentCriteria:
  en: |
    By end of 1-2 week unit:
      - Decompose numbers 4-10 in at least 2 different ways each in 8 of 10 trials.
      - Solve find-addend problems (n + ? = total) in 5 of 6 trials.
      - Recognize commutativity (3+4 = 4+3) implicitly via decomposition exercises.

    Differentiation:
    - K: decompose 4-7 only; introduce concept via concrete cut-outs first.
    - Grade 1: full range 4-10; written addition expressions.
    - Grade 1+: extend to add-within-10 + find-missing-addend-within-10
      (adjacent targets).

