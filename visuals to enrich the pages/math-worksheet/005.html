<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPT Thumbnail - Professional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(180deg, #FFFFFF 0%, #FAFAFA 50%, #F5F3FF 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Subtle texture overlay -->
        <div style="
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.03) 0%, transparent 50%);
            pointer-events: none;
        "></div>

        <!-- Top decorative line -->
        <div style="
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #7C3AED, #3B82F6, #7C3AED);
        "></div>

        <!-- Title Section -->
        <div style="
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            text-align: center;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 52px;
                color: #1E1B4B;
                margin: 0;
                letter-spacing: 2px;
            ">EARLY ALGEBRA FOUNDATIONS</h1>
            <p style="
                font-family: 'Nunito', sans-serif;
                font-weight: 600;
                font-size: 26px;
                color: #6366F1;
                margin: 12px 0 0 0;
                letter-spacing: 1px;
            ">Standards-Aligned</p>
        </div>

        <!-- Main Worksheet Display -->
        <div style="
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
        ">
            <div style="
                background: white;
                border-radius: 16px;
                padding: 16px;
                box-shadow:
                    0 30px 60px rgba(91, 33, 182, 0.12),
                    0 15px 30px rgba(91, 33, 182, 0.08),
                    0 0 0 1px rgba(91, 33, 182, 0.05);
            ">
                <img src="https://www.lessoncraftstudio.com/samples/english/math%20worksheet/sample-1.jpeg"
                     alt="Professional Worksheet Display"
                     style="width: 400px; height: 500px; object-fit: cover; border-radius: 10px;">
            </div>
        </div>

        <!-- Professional Feature Badge Bar -->
        <div style="
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border-radius: 16px;
            padding: 25px 50px;
            box-shadow:
                0 10px 30px rgba(91, 33, 182, 0.1),
                0 0 0 1px rgba(91, 33, 182, 0.05);
        ">
            <div style="
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 18px 50px;
            ">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="
                        width: 28px;
                        height: 28px;
                        background: linear-gradient(135deg, #7C3AED, #6D28D9);
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">
                        <span style="color: white; font-size: 14px; font-weight: bold;">✓</span>
                    </div>
                    <span style="
                        font-family: 'Nunito', sans-serif;
                        font-weight: 700;
                        font-size: 20px;
                        color: #1E1B4B;
                    ">Answer Keys</span>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="
                        width: 28px;
                        height: 28px;
                        background: linear-gradient(135deg, #3B82F6, #2563EB);
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">
                        <span style="color: white; font-size: 14px; font-weight: bold;">✓</span>
                    </div>
                    <span style="
                        font-family: 'Nunito', sans-serif;
                        font-weight: 700;
                        font-size: 20px;
                        color: #1E1B4B;
                    ">Print-Ready</span>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="
                        width: 28px;
                        height: 28px;
                        background: linear-gradient(135deg, #22C55E, #16A34A);
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">
                        <span style="color: white; font-size: 14px; font-weight: bold;">✓</span>
                    </div>
                    <span style="
                        font-family: 'Nunito', sans-serif;
                        font-weight: 700;
                        font-size: 20px;
                        color: #1E1B4B;
                    ">Self-Checking</span>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="
                        width: 28px;
                        height: 28px;
                        background: linear-gradient(135deg, #F97316, #EA580C);
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">
                        <span style="color: white; font-size: 14px; font-weight: bold;">✓</span>
                    </div>
                    <span style="
                        font-family: 'Nunito', sans-serif;
                        font-weight: 700;
                        font-size: 20px;
                        color: #1E1B4B;
                    ">Grades K-2</span>
                </div>
            </div>
        </div>

        <!-- Trust Badge -->
        <div style="
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        ">
            <div style="
                display: flex;
                align-items: center;
                gap: 12px;
                background: linear-gradient(135deg, #1E1B4B, #312E81);
                padding: 14px 35px;
                border-radius: 30px;
                box-shadow: 0 4px 15px rgba(30, 27, 75, 0.3);
            ">
                <span style="font-size: 22px;">🏆</span>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 22px;
                    color: white;
                    letter-spacing: 1px;
                ">CLASSROOM TESTED</span>
            </div>
        </div>

        <!-- Bottom decorative line -->
        <div style="
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #7C3AED, #3B82F6, #7C3AED);
        "></div>
    </div>
</body>
</html>
