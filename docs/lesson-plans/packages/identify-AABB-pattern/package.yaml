# Teaching package — identify and continue AABB patterns
# Arc 7 Phase 2 (Option A continuation; cognitive-and-executive-function /
# pattern-recognition strand). 4-element repeating pattern with double-
# pairs structure: cat-cat-dog-dog-cat-cat-dog-dog. Closes the pattern-
# train mode set (AB / AAB / ABB / ABC / AABB). Class B FLEXIBLE; vocab-
# anchored.

targetSlug: identify-AABB-pattern
language: en
title:
  en: "AABB Patterns — four-element patterns with paired doubling"
description:
  en: "Grade 1-2 cognitive-and-executive-function package teaching AABB pattern recognition. Closes the pattern-recognition strand with the most complex pattern type: 4-element pattern with paired doubling (cat-cat-dog-dog-cat-cat-dog-dog). Builds on Arc 7 Phase 1 + Phase 2 prereq pattern packages. Vocab-anchored. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher reviews Phase 1 + Phase 2
      patterns (AB / AAB / ABB / ABC). Then introduces AABB: "Now
      watch — TWO doubles: cat, cat, dog, dog, cat, cat, dog, dog,
      cat, cat, ?" Class predicts "dog" (the second pair continues
      after the first pair completes). Reinforces the AABB pattern
      type. The 4-element rule with paired doubling is the most
      cognitively-loading pattern type in pattern-train. Pin to
      "Patterns" word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine. Teacher displays AABB patterns; class
      collaboratively continues each. Pair work: kid A creates an
      AABB pattern with 2 paper-cut object pairs; kid B continues.
      Recast errors with explicit rule articulation ("the pattern is
      cat, cat, dog, dog REPEATING — so we need cat, cat, dog, dog
      again"). Discussion question: "How is AABB different from AB?"
      ("AABB has 4 items repeating; AB has 2 items repeating — and
      AABB has DOUBLES of each item.") Builds meta-cognitive pattern-
      type awareness.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: pattern-train worksheet AABB mode
      (kids complete AABB patterns). Station 2: pattern-worksheet mixed
      (kids identify and complete mixed AB / AAB / ABB / ABC / AABB
      patterns; full pattern-recognition cognitive flexibility test).
      Station 3: matching worksheet (vocabulary reinforcement).
      Station 4: manipulative cut-outs hands-on AABB construction.
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays mixed pattern-recognition
      challenges; class collectively identifies type + completes.
      Forward-pointer: "Today we learned AABB — the most complex pattern
      we've worked with. We've now learned ALL 5 pattern types: AB,
      AAB, ABB, ABC, AABB. When we come back to patterns next, we'll
      practice CREATING our own original patterns instead of just
      finishing them."

