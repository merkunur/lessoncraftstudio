compositionalRationale:
  en: |
    Primary strand: early-literacy / speaking-and-listening +
    receptive-listening (3-step oral instruction comprehension
    — strand 3/10 → 4/10). Secondary strand: cognitive-and-
    executive-function / working-memory + sequential planning
    (multi-step action execution). Tertiary strand: vocabulary-
    acquisition (connector + sequencing words: first, then,
    next, finally, last, after). Per §A.13.31 per-instance
    content-awareness: `follow-2-step-oral-instruction/
    package.yaml` (Arc 14 P4; immediate predecessor) +
    `follow-1-step-oral-instruction/package.yaml` (Arc 11;
    strand-start) + `read-and-follow-2-sentence-instruction/
    package.yaml` (Phase 1.1 Slot 2; written-equivalent
    contrast precedent) are the canonical precedents — this
    package extends Arc 11+Arc-14-P4 oral instruction-
    following + contrasts with Phase 1.1 Slot 2 written
    instruction-following.

    Architectural significance: forward-pointer resolution
    from Arc 14 P4 follow-2-step-oral-instruction ('next we
    can try 3-step instructions for kids who are ready').
    Builds on follow-2-step working-memory foundation; bridges
    to multi-step executive-function work. The follow-N-step
    instruction-following progression (1-step Arc 11 → 2-step
    Arc 14 P4 → 3-step this package) is the canonical
    speaking-and-listening scope-and-sequence for instruction-
    comprehension pedagogy.

    Per §A.13.30 K-1 informal framing: K-1 3-step instruction
    work is CONCRETE MULTI-STEP DOING. Kids hear short 3-step
    instruction + IMMEDIATELY execute all 3 steps in order
    using concrete classroom routines. The pedagogy uses
    everyday language ('first' / 'then' / 'finally' /
    'next' / 'last' as sequence-anchor vocabulary) + 3
    explicit sequence-tracking strategies (finger-counting:
    one finger per step heard; head-nod-per-step: kids nod
    once for each step; mental rehearsal: repeat the
    instruction silently before starting). NOT formal
    procedural-listening pedagogy — multi-step technical
    instructions + recipe-following are Grade 3+ work; the
    K-1 emphasis is multi-step receptive listening as bridge
    between simple oral-direction-following + complex
    procedural-listening. Critical pedagogical move
    documented in contentActivity: USE SEQUENCE-TRACKING
    STRATEGIES. 3-step instructions exceed simple working-
    memory capacity for many K kids — the scaffolds matter.
    Common error patterns addressed: skipping middle step,
    reordering steps, freezing on second step under working-
    memory overload.

    Per §A.13.29 ground-truth source-citation: composedExercises
    cite `REFERENCE APPS/pattern-train.html` (unified mode
    for 3-step action sequencing via icon-card layout) +
    `REFERENCE APPS/matching.html` (imgname mode for 3-step
    instruction text → outcome picture sequence pairing) +
    `REFERENCE APPS/missing-pieces.html` (unified mode for
    3-step sequence with one missing step pedagogy).

    Cross-reference to follow-1-step-oral-instruction (Arc
    11) + follow-2-step-oral-instruction (Arc 14 P4):
    prerequisite chain establishes the simple-to-complex
    instruction-following progression. Kids who master
    follow-1-step receptive listening + follow-2-step working-
    memory load are pedagogically ready for 3-step. This
    package operationalizes the 3-step extension via sequence-
    tracking strategies + concrete classroom-routine execution.

    Cross-reference to read-and-follow-2-sentence-instruction
    (Phase 1.1 Slot 2): written-equivalent contrast precedent.
    Phase 1.1 Slot 2 = WRITTEN 2-sentence instructions (kid
    reads printed text + executes); this package = ORAL 3-
    step instructions (kid hears spoken text + executes).
    Different modalities (visual-symbolic vs auditory-symbolic)
    but parallel cognitive operations. Future Grade 1-2 work
    extends both: written 3-sentence instructions (extension
    of Phase 1.1 Slot 2) + oral 4-step instructions (extension
    of this package). Cross-modality coherence: kids who
    handle multi-step in one modality often transfer to the
    other; explicit cross-modality framing is a Grade 2+
    candidate.

    Materials note: 8-material Literacy class stack per
    §A.13.37 + Phase 1.1 Slot 2 read-and-follow-2-sentence-
    instruction canonical precedent (NOT Arc 14 P4 follow-
    2-step which used non-canonical materials shape per
    §A.13.6 firing flagged in header comment). Materials
    structure mirrors Phase 1.1 Slot 2 verbatim (theme:
    miscellaneous provides familiar K-1 action vocabulary
    + cross-instruction-context applicability). Manipulative-
    cut-outs at position 6 emits canonical-correct `mode:
    single-repeat` per §A.13.35 (NOT `action-set` per Arc 14
    P4 pre-§A.13.35-correction; this Phase 1.3 Slot 4 is
    canonical-correct).

    Distinctive composition: 2 pattern-train (positions 1+4
    for 3-step sequencing) + 2 matching (positions 2+5 for
    instruction-to-picture pairing) + 1 missing-pieces
    (position 3 for missing-step identification). Same
    sequencing emphasis as Phase 1.1 Slot 2 read-and-follow-
    2-sentence-instruction + Arc 14 P4 follow-2-step; cross-
    package pattern coherence demonstrates sequencing as a
    foundational cross-strand capability spanning written +
    oral modalities.

    Class B FLEXIBLE substrate: composes against miscellaneous
    theme; instruction prompts span everyday classroom-routine
    contexts (stand/sit/walk/touch/clap/wave). No substrate
    gaps; ships clean.

    K-3 multilingual classroom relevance: 3-step instruction
    following is particularly valuable for multilingual
    learners — provides explicit listening + comprehension
    practice with high-frequency sequence-anchor vocabulary
    (first/then/finally/last/next). Connector words vary
    across locales (first/then = first/dann in German; first/
    then = primero/luego in Spanish; first/then = primeiro/
    depois in Portuguese; first/then = ensin/sitten in
    Finnish). Multilingual K-3 classrooms benefit from
    explicit sequence-anchor vocabulary work in the
    language-of-instruction. The cognitive operation (multi-
    step receptive listening) is universal; the language-of-
    instruction vocabulary varies. **No §A.13.34 sub-class
    firing — speaking-and-listening pedagogy structurally
    locale-invariant.**

    **§A.13.6 informational firing — Arc 14 P4 follow-2-
    step-oral-instruction materials shape:** Arc 14 P4
    `follow-2-step-oral-instruction/package.yaml` ships
    pre-§A.13.35-correction materials shape (uses non-
    canonical `instruction-cards` material slug + non-
    canonical `mode: action-set` for manipulative-cut-outs).
    Phase 1.3 Slot 4 deliberately does NOT mirror Arc 14
    P4's shape — uses canonical Literacy 8-material per
    §A.13.37 + canonical mode: single-repeat per §A.13.35.
    Arc 14 P4 retrofit is filed as separate [FIX][LESSON-
    PLANS] commission candidate; not blocking Phase 1.3
    Slot 4 ship.

