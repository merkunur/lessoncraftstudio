compositionalRationale:
  en: |
    Primary strand: math / numeral-recognition (numerals 101-500;
    deepens Phase 1+2 foundations 2/4 → 3/4). Secondary strand:
    math / place-value (three-digit place-value structure
    introduction). Tertiary strand: numeracy (extended counting
    beyond 100).

    Architectural significance: deepens numeral-recognition strand
    from 2/4 to 3/4. Builds on Arc 15 Phase 1+2 numeral-recognition
    foundation (1-20 + 21-100). Critical scaling work — first
    three-digit-numeral exposure. Foundation for full numeral-
    recognition strand work (4/4 at this Phase 4's read-and-write-
    numerals-1-to-20 sibling).

    Distinctive composition: 1 matching + 2 pattern-train + 1
    missing-pieces + 1 more-less. Pattern-recognition emphasized;
    place-value chart context anchored throughout.

    Class B FLEXIBLE substrate: composes against miscellaneous
    theme; numeral-recognition uses abstract numerical
    representation. Place-value-chart-mat material extends Arc 15
    Phase 1 hundreds-chart-mat with hundreds-place introduction.

    K-3 multilingual classroom relevance: numeral SYMBOLS are
    universal across 11 platform locales (Hindu-Arabic). Number
    WORDS for 101-500 vary significantly: en (one hundred + tens-
    and-ones); es (ciento + tens-and-ones; some irregularities);
    de (einhundert + reverse-decade structure); fi (sata +
    agglutinative). Locale-variant work at Phase 3+ adapts to each
    locale's number-word system for 101-500 range.

