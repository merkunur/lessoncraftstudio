compositionalRationale:
  en: |
    Primary strand: math / measurement (identify coin
    values — OPENS money sub-track 0/2 → 1/2 in the
    measurement strand). Secondary strand: early-numeracy
    (coin values reinforce skip-counting structure: 1s,
    5s, 10s, 25s). Tertiary strand: vocabulary-acquisition
    (currency vocabulary: penny, nickel, dime, quarter,
    dollar, cent, value, worth; symbols $ + ¢).

    Architectural significance: OPENS the money sub-track
    of the measurement strand. The measurement strand has
    9 canonical targets organized into 5 sub-tracks per
    learning-targets.json: length (compare-by-length +
    order-3-objects-by-length), weight (compare-by-
    weight), capacity (compare-by-capacity), time (tell-
    time-to-the-hour + tell-time-to-half-hour + tell-
    time-to-quarter-hour — SAT 3/3 at Arc 18 P1.1
    close), and MONEY (identify-coin-values + recognize-
    money-amounts-up-to-1-unit — THIS PACKAGE OPENS the
    sub-track). Pair-coherent ship pattern with
    recognize-money-amounts (slot 3 of Phase 1.2; CLOSES
    the sub-track 2/2 SAT). Money sub-track shape
    parallels the tell-time triple (incremental skill
    layering — identify coin values prerequisite to
    counting amounts).

    Pair partner: recognize-money-amounts-up-to-1-unit
    (slot 3 of Phase 1.2). The two packages teach
    incremental skill layers of money pedagogy:
    - identify-coin-values (this package): coin-
      recognition + value-recognition (Grade 2
      prerequisite to word-problem work).
    - recognize-money-amounts-up-to-1-unit: count coin
      combinations to make amounts up to 1 dollar (the
      CCSS.2.MD.C.8 direct word-problem anchor).
    Together they form the K-3 currency module — kids
    learn currency RECOGNITION first, then currency
    COUNTING.

    Cross-reference to count-objects-1-to-20 (Arc 12
    prerequisite) + compare-quantities-more-fewer (Arc
    12 prerequisite): the number-value recognition +
    relative-value ordering established by those K-1
    packages ground the coin-value recognition this
    package builds. Kids who can count to 20 + compare
    quantities can learn that a dime is worth 10 (count
    to 10 mentally; compare 10 to other coin values).

    **LOCALE-MONEY-SYSTEM DIVERGENCE PER OPERATOR-LOCKED
    PATH A** (per §A.13.6 + §A.13.34 + Arc 18 Phase 0
    firings batch):
    This en package authors USD canonical content (penny,
    nickel, dime, quarter, dollar bill — the K-3-relevant
    coin set in CCSS.2.MD.C.8). The pt sibling at
    package.pt.yaml authors BRL canonical content (5/10/
    25/50 centavos + R$1 real coin/banknote — the BR-MEC
    locale-authentic coin set per EF02MA20). Materials
    list is FULL-OVERRIDDEN in pt sibling (NOT inherited
    via Arc 7+ sparse-override convention). This
    convention departure is INTENTIONAL and operator-
    locked at Phase 0 — locale-authentic currency
    pedagogy requires distinct vocabKey enumeration per
    locale because the coin sets are categorically
    different. The departure applies to THIS COMMISSION
    SPECIFICALLY (slots 2+3 of Phase 1.2); other
    locale-system content (time-of-day, geometry, etc.)
    continues to use the Arc 7+ sparse-override
    convention unchanged. Future audit/refactor work that
    encounters the convention divergence here should read
    this compositionalRationale + the pt sibling's same
    section + the Arc 18 Phase 0 firings batch in the arc
    commit before proceeding. Do NOT silently align the
    pt sibling to sparse-override convention — that
    would re-introduce the pedagogical inauthenticity
    operator explicitly rejected at Phase 0.

    Per §A.13.30 K-3 informal framing: Grade 2 coin-
    recognition pedagogy is COIN-VALUE IDENTIFICATION
    (kid sees coin → kid says/writes value). The
    appearance-vs-size paradox (dime smaller but worth
    more than penny + nickel) is the canonical Grade 2
    diagnostic — kids who internalize "look at the COIN,
    not the SIZE" pass the recognition skill. Formal
    currency arithmetic (calculating change; making
    correct payment; comparing prices) is upper-
    elementary work beyond K-3 scope.

    Distinctive composition: 2 matching (intro +
    consolidation — coin-image to value-card pairing,
    canonical for coin-recognition pedagogy) + 1 chart-
    count (skip-counting by coin values: 1s, 5s, 10s,
    25s — surfaces the numeric structure underlying coin
    values) + 1 picture-sort (sort coins into value bins
    — proxies the recognition skill at the sort level) +
    1 math-worksheet (assessment — given coin, write
    value). Composition shape mirrors tell-time-to-
    quarter-hour Arc 18 P1.1 precedent on the
    measurement-strand pattern (matching + chart-count +
    pattern-app + matching + math-worksheet); content
    adjusted for coin-recognition scope.

    Materials note: 7-material Numeracy/Measurement class
    stack per §A.13.37 (mirrors tell-time-to-quarter-hour
    precedent on materials count). Manipulative-cut-outs
    at position 5 emits canonical-correct `mode: variety`
    with vocabKey enumeration of 5 USD coin types (penny,
    nickel, dime, quarter, dollar-bill) at itemCount 6.
    This is the canonical §A.13.35 mode-correct shape
    per operator adjudication at Phase 0. **SUBSTRATE
    CARRY-FORWARD TO P2:** vocabKey image substrate
    (penny / nickel / dime / quarter / dollar-bill images
    in image library + vocab entries in image-vocabulary.
    js) does NOT yet exist at Phase 1.2 ship; substrate
    creation is deferred to Pillar 5 P2 close-out cycle
    per §A.13.38 decoupled-ship discipline. This mirrors
    Arc 18 P1.1's clock-mat substrate handling precedent
    (clock-mat generator deferred + clock-piece
    vocabKeys deferred to P2; package shipped at
    filesystem with canonical vocabKey enumeration).

    Class B FLEXIBLE substrate: composes against
    miscellaneous theme on composedExercises (coins are
    abstract numeracy items lacking a natural semantic
    theme like animals or foods; aligns with tell-time +
    abstract-numerical measurement-strand precedent).
    Materials use vocabKeyList directly (NOT theme
    selection) because coin vocabulary doesn't fit any
    existing image-library theme — it requires its own
    eventual currency-theme substrate.

    K-3 multilingual classroom relevance: currency
    pedagogy is LOCALE-SYSTEM-DEPENDENT in a way other
    measurement content is not. Length / weight / capacity
    / time-of-day are universal locale-portable concepts
    (an inch / hour / liter is the same skill in every
    locale; locale just changes vocabulary). CURRENCY is
    structurally locale-system-bound — USD's penny / nickel
    / dime / quarter does not exist in BRL, EUR, GBP,
    SEK, NOK, DKK, etc. Each locale has its OWN coin set
    with its OWN values. Per operator-locked Path A at
    Arc 18 Phase 0, this en package teaches USD; the pt
    sibling teaches BRL; future locale-variant expansion
    (Phase 3+ for additional locales) will likely require
    SEPARATE materials substrates per locale-currency
    pair (EUR for de / es / pt-PT / fr / it / nl;
    Nordic currencies for sv / da / no; EUR for fi).
    The pedagogical SKILL is universal (recognize
    currency → know value); the SUBSTRATE is locale-
    specific.

