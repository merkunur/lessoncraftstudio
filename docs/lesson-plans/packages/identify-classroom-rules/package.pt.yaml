# Teaching package — identify and explain classroom rules (pt sparse-override)
# Arc 18 Phase 1.4 (22nd-consecutive pt cadence per Arc 7+ convention). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF01HI04 (identificar as diferenças entre os variados ambientes em que vive — incluindo escola — reconhecendo as especificidades dos hábitos e das regras que os regem) — BNCC História Anos Iniciais. Cross-cultural-sensitivity discipline preserved per BR context (escola brasileira frequentemente integra regras-de-sala-de-aula com regras-de-vivência-coletiva).

targetSlug: identify-classroom-rules
language: pt

title:
  pt: "As Regras da Nossa Sala de Aula — quais são e por que importam"

description:
  pt: "Pacote socioemocional para a educação infantil / 1.º ano do ensino fundamental, ensinando crianças a identificar as REGRAS da própria sala de aula + explicar por que cada regra importa. Habilidade fundamental: as crianças aprendem que salas de aula têm REGRAS (um pequeno número de acordos como 'andar, não correr' / 'usar palavras gentis' / 'levantar a mão para falar' / 'guardar os materiais') e que cada regra tem uma RAZÃO conectada à segurança, justiça, ou aprendizagem. Trabalho pró-social crítico para K-1: regras de sala de aula são os acordos compartilhados que permitem que muitas crianças aprendam juntas; entender as regras facilita segui-las (crianças que SABEM POR QUE uma regra existe seguem-na mais consistentemente do que crianças que apenas SABEM A REGRA). Por §A.13.30 enquadramento informal K-1: trabalho de regras-da-sala no K-1 é NOMEAR REGRAS + EXPLICAR REGRAS — as crianças nomeiam 4-6 regras específicas da sala de aula em suas próprias palavras + dão uma razão curta para cada uma ('andamos para não esbarrar uns nos outros' / 'usamos palavras gentis porque palavras feias machucam sentimentos'). NÃO pedagogia formal de civismo ou sistema legal (que é trabalho do 3.º ano EF em diante introduzindo conceitos de leis, direitos, governo); a pedagogia K-1 enquadra regras como ACORDOS COMPARTILHADOS DA SALA DE AULA que fazem a sala funcionar — não como lei imposta por adultos. Alinhamento BNCC: EF01HI04 (identificar diferenças entre ambientes vividos — incluindo escola — reconhecendo hábitos e regras que regem cada um) — BNCC História Anos Iniciais 1.º ano EF. Ênfase no contexto multilíngue / escola internacional: regras + normas-de-sala-de-aula variam entre culturas escolares globalmente; o pacote enquadra ACORDOS DE SALA DE AULA CO-CRIADOS em vez de regras universais absolutas. O strand PSED avança 3/8 → 4/8 (37,5% → 50,0%). 5 exercícios + 6 materiais imprimíveis (composição classe-SEL per §A.13.37 + precedente Arc 17 P1.1 share-and-take-turns: REMOVE matching-mat + vocabulary-tracing-strips porque o trabalho de nomear-regras não se ancora em emparelhamento imagem-para-palavra ou rastreamento de palavra-única; MANTÉM flashcards + picture-cards + sentence-strips + manipulative-cut-outs + parent-take-home-letter + answer-key)."

structure:
  warmup:
    body: |
      Introdução de regras com toda a turma + gancho de
      rotina-de-sala. Você pergunta: "O que SÃO regras?
      Por que temos REGRAS na nossa sala de aula?" A
      turma faz uma chuva de ideias: regras nos mantêm
      seguros, regras são justas, regras nos ajudam a
      aprender juntos. Você então introduz 4-6 regras
      específicas da sala de aula (as regras reais
      DESTA sala; você deve adaptar às suas próprias
      normas de classe — regras iniciais K-1 típicas:
      'andar, não correr' + 'usar palavras gentis' +
      'levantar a mão para falar' + 'guardar os
      materiais quando terminar' + 'escutar quando os
      outros estão falando'). Para cada regra, você
      narra a RAZÃO: "Andamos dentro da sala, não
      corremos. POR QUÊ? Porque se corremos podemos
      esbarrar em um colega ou tropeçar e nos
      machucar. Andar mantém todos SEGUROS." Repete o
      padrão para cada regra: "Usamos palavras gentis.
      POR QUÊ? Porque palavras feias machucam os
      sentimentos das pessoas, e queremos que todo
      mundo se sinta BEM-VINDO na nossa sala de aula.
      Palavras gentis ajudam todos a se sentirem
      seguros e felizes." Ênfase do padrão: "Toda
      regra tem uma RAZÃO. A razão é geralmente sobre
      SEGURANÇA (ninguém se machuca), JUSTIÇA (todo
      mundo tem sua vez), ou APRENDIZAGEM (todos
      conseguem ouvir e se concentrar). Quando vocês
      SABEM POR QUE uma regra existe, a regra faz
      sentido — não é só algo que um adulto fala, é
      algo que ajuda NOSSA SALA DE AULA A FUNCIONAR."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de emparelhamento
      regras-e-razões. Cada dupla recebe 6 cartões de
      regra (um por regra da sala: ANDAR / PALAVRAS
      GENTIS / LEVANTAR A MÃO / GUARDAR / ESCUTAR /
      PEDIR AJUDA) + 6 cartões de razão (para cada
      regra, uma razão curta: "para não esbarrar nos
      colegas" / "porque palavras feias machucam" /
      "para todos terem vez de falar" / "para
      acharmos os materiais na próxima vez" / "para
      todos ouvirem quem está falando" / "para não
      ficarmos travados ou frustrados"). A dupla se
      reveza: a criança A lê (ou nomeia da imagem) um
      cartão de regra; a criança B encontra o cartão
      de razão correspondente + diz em voz alta
      "[Regra] porque [razão]." Recapture erros com
      raciocínio regra-razão ("você combinou 'ANDAR'
      com 'para todos terem vez' — mas pense: com o
      que ANDAR ajuda? Esbarrar! Andar ajuda para
      não ESBARRAR nos colegas. A razão de 'ter vez'
      combina com LEVANTAR A MÃO, não com ANDAR.").
      Extensão opcional: a dupla identifica 1-2 regras
      AINDA NÃO na lista que acham que a sala precisa
      ("deveríamos ter uma regra sobre lavar as mãos
      antes do lanche" / "deveríamos ter uma regra
      sobre limpar a tinta"); a dupla explica a RAZÃO
      para cada nova regra. Nota para o professor:
      crianças K-1 às vezes confundem REGRAS (acordos
      gerais da sala) com INSTRUÇÕES (direções
      específicas únicas como "todo mundo pegue o
      livro de matemática"). Ajude as crianças a
      verem: regras se aplicam O TEMPO TODO em todas
      as atividades; instruções se aplicam para uma
      atividade depois mudam. Algumas crianças
      também podem confundir REGRAS com
      PREFERÊNCIAS PESSOAIS ("a regra é todo mundo
      tem que gostar de fatias de maçã"). Ajude as
      crianças a verem: regras são acordos de
      JUSTIÇA + SEGURANÇA + APRENDIZAGEM;
      preferências são escolhas pessoais que não
      obrigam os outros.
  scaffold:
    body: |
      Rotação por estações. Estação 1: folha de
      exercícios picture-sort (as crianças classificam
      imagens de cenário em "seguindo a regra" vs "não
      seguindo a regra" — criança andando vai em
      seguindo-a-regra para a regra ANDAR; criança
      correndo na sala vai em não-seguindo-a-regra).
      Estação 2: folha de emparelhamento (imagem da
      regra → texto da razão; ex.: imagem de criança
      com a mão levantada ↔ "para todos terem vez
      de falar"). Estação 3: folha word-guess (quebra-
      cabeça de vocabulário de regras: andar, gentil,
      escutar, dividir, mão, ajudar — vocabulário
      essencial que as crianças precisam para uso
      produtivo de regras). Estação 4: manipulative
      cut-outs (as crianças montam um pôster de regras
      em cardstrip: 6 cartões-de-regra com imagem +
      palavra + razão breve; as crianças decoram +
      levam para casa OU contribuem para um mural da
      sala).
  closure:
    body: |
      Promessa de regras com toda a turma + enquadramento
      de comunidade-de-sala-de-aula. A turma nomeia
      coletivamente as 4-6 regras da sala de aula +
      diz uma razão por regra. Você pergunta: "QUEM
      FEZ essas regras?" (A turma reflete: a
      professora, as crianças, a escola — as regras
      são acordos QUE NÓS compartilhamos para fazer a
      sala funcionar para todo mundo.) Você encerra
      com: "Regras não são castigos. Regras são
      ACORDOS — nós as seguimos porque elas ajudam
      NOSSA SALA DE AULA a ser segura e justa e um
      bom lugar para aprender. Toda sala de aula é
      diferente — algumas salas têm regras que a
      nossa não tem; algumas crianças têm regras
      diferentes em outras escolas porque servem a
      culturas diferentes ou jeitos diferentes de
      aprender. TODAS as regras de sala são feitas
      para ajudar todo mundo a se sentir BEM-VINDO e
      SEGURO e CAPAZ DE APRENDER. Esse é o teste de
      uma boa regra de sala de aula." Aponte adiante:
      "Quando voltarmos ao trabalho socioemocional na
      próxima vez, aprenderemos O QUE FAZER QUANDO
      UMA REGRA NÃO É SEGUIDA — quando alguém
      esquece uma regra ou ainda não a segue.
      Resolução de conflitos + pedir-ajuda-do-adulto
      (candidatos do Arco 18+) constrói sobre a
      fundação de regras de hoje."

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Identificar 4-6 regras da sala de aula em suas
        próprias palavras em 7 de 10 tentativas.
      - Dar uma razão curta para cada regra (conectada
        à segurança / justiça / aprendizagem) em 6 de
        10 tentativas.
      - Classificar imagens de cenário em seguindo-a-
        regra vs não-seguindo-a-regra corretamente em
        7 de 10 tentativas.
      - Combinar imagens-de-regra ao texto-de-razão
        correspondente em 6 de 8 tentativas.
      - Demonstrar o seguir-de-regras em 4 de 6
        momentos observados de rotina-de-sala durante
        a semana (rubrica da professora).
      - Usar o vocabulário 'regra' / 'regras' /
        'razão' / 'seguro' / 'justo' / 'acordo'
        corretamente em 5 de 10 tentativas de
        produção verbal.

    Diferenciação:
    - Pré-escola: conjunto inicial de 2 regras (andar
      + palavras gentis); modelagem receptiva
      primeiro (as crianças respondem a regras
      promovidas pela professora); linguagem
      produtiva surge como surge sem pressão.
    - Educação infantil (5-7 anos): conjunto completo
      de 4-6 regras; uso produtivo de regras-e-razões
      durante discussões em grupo; rubrica da
      professora em observações de rotina-de-sala
      durante a semana.
    - 1.º ano em diante: estender para CO-CRIAÇÃO DE
      REGRAS (as crianças propõem novas regras com
      razões; a turma vota coletivamente em quais
      regras adotar); ponte para trabalho de
      resolução-de-conflito (candidatos do Arco 18+:
      o que fazer quando uma regra é quebrada, como
      reparar depois de quebrar uma regra, como
      pedir-ajuda-do-adulto quando as regras não
      cobrem uma situação); 1.º ano+ também estende
      para trabalho de assembleia-de-turma
      (assembleias-de-turma estruturadas regulares
      para discutir o que está funcionando + o que
      poderia melhorar).
    - 2.º ano em diante: estender para REGRAS DA
      ESCOLA INTEIRA (regras que se aplicam fora da
      sala: regras do corredor + regras do
      refeitório + regras do parquinho); ponte para
      trabalho formal de comunidade-de-sala-de-aula
      (as crianças escrevem constituições de turma +
      missão da sala + expectativas de comportamento
      com colegas); 3.º ano+ estende para civismo
      formal: regras vs leis + democracia-de-sala-
      de-aula + tomada-de-decisão-comunitária.

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en).
    Os campos materials, composedExercises,
    curriculumStandards e learningObjectives são herdados
    do package.yaml via merge sparse-override e não são
    repetidos aqui per a convenção Arc 7+.

    Vocabulário pt-BR canônico para regras de sala de
    aula K-1:
    - 'regra' / 'regras' (rule / rules) — pt-BR
      canônico para acordo-da-sala-de-aula
    - 'acordo' (agreement) — pt-BR canônico para
      enquadramento co-criado de regras
    - 'razão' / 'razões' (reason / reasons) — pt-BR
      canônico
    - 'seguro' / 'segurança' (safe / safety)
    - 'justo' / 'justiça' (fair / fairness)
    - 'aprender' / 'aprendizagem' (to learn /
      learning)
    - 'seguir a regra' (follow the rule) — locução
      pt-BR canônica
    - 'quebrar a regra' (break the rule) — locução
      pt-BR canônica
    - Frases-modelo K-1: "A regra é..." / "A razão
      é..." / "Seguimos a regra para..."
    - Vocabulário de regras-iniciais típicas K-1:
      'andar' / 'palavras gentis' / 'levantar a mão'
      / 'guardar' / 'escutar' / 'pedir ajuda'

    Convenção pt-BR vs pt-PT: ambas as variantes
    usam 'regra' + 'razão' identicamente. Algumas
    pequenas divergências regionais (pt-PT pode
    preferir 'razão' = 'motivo' alternativamente; pt-
    BR usa ambos em registro K-1).

    Particularidade pt-BR para regras-de-sala-de-aula
    K-1:
    Crianças brasileiras K-1 frequentemente conhecem
    regras-de-sala-de-aula através de COMBINADOS DA
    TURMA — a tradição brasileira pedagógica
    enquadra regras como combinados (acordos
    coletivos da turma) em vez de regras impostas.
    Este pacote alinha com essa abordagem
    pedagógica brasileira: o termo 'combinado' é
    canônico em sequências didáticas brasileiras de
    educação infantil + 1.º ano EF para o conceito
    de regra-de-sala-de-aula. Algumas escolas
    brasileiras fazem a 'roda de combinados' no
    início do ano (assembleia-de-turma para co-criar
    as regras coletivamente). Este pacote aproveita
    esse contexto cultural-pedagógico naturalmente.

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF01HI04 ('Identificar as diferenças entre os
    variados ambientes em que vive (doméstico,
    escolar e da comunidade), reconhecendo as
    especificidades dos hábitos e das regras que os
    regem') é o anchor BNCC do 1.º ano EF para o
    trabalho de identificação de regras dos
    diferentes ambientes (incluindo a sala de aula).
    A BNCC EF01HI04 enquadra explicitamente o
    reconhecimento de que diferentes ambientes têm
    diferentes regras (em casa diferente da escola
    diferente da comunidade) — esse enquadramento
    cross-ambiente apoia a perspectiva multicultural
    deste pacote (escolas diferentes têm regras
    diferentes; todas as regras que ajudam todo
    mundo a se sentir seguro e capaz de aprender são
    boas regras). Anchors secundários: EF01ER02
    (Reconhecer e respeitar as características
    físicas e subjetivas de cada um) — Ensino
    Religioso/Cultura, integra educação para os
    valores; EF01HI05 (Identificar semelhanças e
    diferenças entre jogos e brincadeiras atuais e
    de outras épocas e lugares).

    Currículo brasileiro K-1 para vivência coletiva:
    A BNCC brasileira EF Anos Iniciais coloca a
    vivência coletiva (acordos-da-turma + cuidado-
    com-o-outro + responsabilidade-compartilhada)
    como eixo central do trabalho socioemocional
    K-2. Este pacote alinha com essa abordagem.
    Escolas brasileiras frequentemente integram
    regras-de-sala com regras-de-vivência-coletiva
    (como cuidar do espaço da escola, respeitar os
    funcionários, contribuir com o lanche
    compartilhado), expandindo o conceito de regra
    para além da sala individual.

    Por §A.13.30 enquadramento informal K-1: este
    pacote NÃO ensina civismo formal (terminologia
    de leis-direitos-governo é trabalho de 3.º ano
    EF em diante). Famílias brasileiras às vezes
    perguntam por trabalho mais formal de cidadania
    (eleições + governo + leis); o parent-take-home-
    letter explicita que o objetivo do 1.º ano EF é
    o reconhecimento de regras como acordos
    compartilhados que ajudam a vivência coletiva,
    com civismo formal emergindo no 3.º + 4.º ano
    EF.

    Pacote-precedente Arc 17 P1.1 share-and-take-
    turns (mesmo cluster SEL emotions-bundle): este
    pacote ESPELHA share-and-take-turns na composição
    SEL-class de 6 materiais (REMOVE matching-mat +
    vocabulary-tracing-strips; MANTÉM flashcards +
    picture-cards + sentence-strips + manipulative-
    cut-outs + parent-take-home-letter + answer-key).
    Junto com share-and-take-turns + name-and-
    describe-feelings-detailed + show-perspective-
    taking, identify-classroom-rules forma o cluster
    SEL emotions-bundle expandido (4 pacotes;
    oportunidade de avanço de densidade-de-reuso
    cross-bundle no fechamento Arco 18 P2).

    Disciplina de afirmação cross-cultural: o pacote
    afirma a variação cultural em regras-de-sala-de-
    aula ('escolas diferentes têm regras diferentes;
    todas as regras que ajudam todo mundo a se
    sentir seguro e capaz de aprender são boas
    regras') em vez de prescrever um conjunto
    universal de regras. Particularmente determinante
    para contextos de escola internacional + programa
    bilíngue brasileiro onde os históricos
    culturais-escolares das crianças divergem
    significativamente (algumas crianças vêm de
    escolas com normas muito rigorosas de levantar-
    a-mão; outras de normas espontâneas de chamar-
    em-voz-alta; outras de normas sentar-em-roda vs
    sentar-em-fileiras; o trabalho da professora é
    honrar a variedade das crianças enquanto
    estabelece acordos COMPARTILHADOS-DA-SALA-ATUAL
    que funcionem para a sala compartilhada
    presente).

    Nota de review da Rodada 1 (§A.13.6 firing +
    Path B lock per §A.13.36 cadência de cooperação):
    o composedExercise word-guess emite `themeSelect:
    emotions` (tema do cluster SEL emotions-bundle
    herdado do precedente share-and-take-turns) e
    NÃO o vocabulário-de-regras prometido pelo corpo
    do scaffold station-3. A camada de abstração é
    pedagogicamente limpa: composedExercises são
    artefatos de auto-geração para ingestão de
    catálogo dentro do tema-do-cluster
    (vocabulário-emoções); o scaffold de vocabulário-
    de-regras (andar / gentil / escutar / dividir /
    mão / ajudar) acontece no NÍVEL DO CORPO DA
    AULA — especificamente na atividade station-3 do
    scaffold (autoria do professor a partir do
    vocabulário-de-regras canônico do pacote). Os
    dois papéis são empilhados, não conflitados.
    Mesma camada de abstração do precedente Arc 17
    P1.1 share-and-take-turns (que também usa tema
    emotions para composedExercises apesar do foco em
    habilidades prósociais). Path A (parâmetro
    vocabulário-customizado para word-guess) foi
    rejeitado porque divergiria do precedente share-
    and-take-turns + o station-3 do corpo da aula já
    cobre andaime de vocabulário-de-regras sem
    capacidade de vocabulário-customizado do app.
    Path C (substituir word-guess) foi rejeitado
    porque perderia variedade de quebra-cabeças de
    palavras na mistura de exercícios.
