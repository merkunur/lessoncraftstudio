<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Subtraktion Arbeitsbl&auml;tter - Hero Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(150deg, #E0F7FA 0%, #B2EBF2 40%, #E8F5E9 100%); overflow: hidden;">

        <!-- Diagonal ice-crystal line pattern overlay -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image: repeating-linear-gradient(60deg, #01579B 0px, #01579B 1px, transparent 1px, transparent 22px), repeating-linear-gradient(-60deg, #01579B 0px, #01579B 1px, transparent 1px, transparent 22px);"></div>

        <!-- Cool radial glow behind worksheets -->
        <div style="position: absolute; top: 58%; left: 50%; width: 750px; height: 650px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(2,119,189,0.09) 0%, rgba(128,222,234,0.06) 40%, transparent 70%); border-radius: 50%;"></div>

        <!-- Floating minus-bar shapes -->
        <div style="position: absolute; top: 175px; left: 50px; width: 38px; height: 11px; background: #0277BD; border-radius: 6px; transform: rotate(-18deg); opacity: 0.45;"></div>
        <div style="position: absolute; top: 330px; left: 30px; width: 30px; height: 9px; background: #00838F; border-radius: 5px; transform: rotate(12deg); opacity: 0.35;"></div>
        <div style="position: absolute; top: 250px; right: 50px; width: 34px; height: 10px; background: #01579B; border-radius: 5px; transform: rotate(-25deg); opacity: 0.4;"></div>
        <div style="position: absolute; top: 430px; right: 40px; width: 28px; height: 8px; background: #0277BD; border-radius: 4px; transform: rotate(20deg); opacity: 0.35;"></div>
        <div style="position: absolute; bottom: 320px; left: 75px; width: 32px; height: 9px; background: #00838F; border-radius: 5px; transform: rotate(-8deg); opacity: 0.4;"></div>
        <div style="position: absolute; bottom: 290px; right: 65px; width: 36px; height: 10px; background: #01579B; border-radius: 5px; transform: rotate(15deg); opacity: 0.3;"></div>

        <!-- Frost sparkle dots -->
        <div style="position: absolute; top: 200px; left: 115px; width: 8px; height: 8px; background: #80DEEA; border-radius: 50%; box-shadow: 0 0 16px 5px rgba(128,222,234,0.6);"></div>
        <div style="position: absolute; top: 370px; right: 95px; width: 6px; height: 6px; background: #0277BD; border-radius: 50%; box-shadow: 0 0 14px 5px rgba(2,119,189,0.3);"></div>
        <div style="position: absolute; top: 285px; left: 195px; width: 5px; height: 5px; background: #00838F; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(0,131,143,0.4);"></div>
        <div style="position: absolute; bottom: 340px; right: 175px; width: 7px; height: 7px; background: #80DEEA; border-radius: 50%; box-shadow: 0 0 15px 5px rgba(128,222,234,0.5);"></div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 25px; left: 28px; z-index: 100;">
            <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #FF6F00 0%, #E65100 100%); border-radius: 50%; box-shadow: 0 8px 28px rgba(255,111,0,0.5), inset 0 -4px 10px rgba(0,0,0,0.12), inset 0 4px 8px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.7);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.25);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: rgba(255,255,255,0.95); padding: 11px 22px; border-radius: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); border: 3px solid #0277BD;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: #0277BD; letter-spacing: 1px;">KLASSE K-2</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 100px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 78px; color: #01579B; margin: 0; text-shadow: 3px 3px 0 rgba(2,119,189,0.12), 0 0 40px rgba(2,119,189,0.08);">SUBTRAKTION</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 44px; color: #00838F; margin: 6px 0 0 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.08);">Arbeitsbl&auml;tter</h2>
        </div>

        <!-- 3-Worksheet Staggered Display -->
        <div style="position: absolute; top: 260px; left: 50%; transform: translateX(-50%); width: 820px; height: 460px;">

            <!-- Left worksheet -->
            <div style="position: absolute; left: 70px; top: 100px; z-index: 10;">
                <div style="width: 200px; height: 259px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #80DEEA; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Subtraktionsarbeitsblatt">
                </div>
            </div>

            <!-- Minus circle between left and center -->
            <div style="position: absolute; left: 290px; top: 220px; z-index: 30; width: 44px; height: 44px; background: linear-gradient(145deg, #0277BD, #01579B); border-radius: 50%; box-shadow: 0 4px 12px rgba(2,119,189,0.5); display: flex; align-items: center; justify-content: center; border: 3px solid white;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white; line-height: 1;">&minus;</span>
            </div>

            <!-- Center worksheet (largest - hero) -->
            <div style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); z-index: 20;">
                <div style="position: relative;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-1.jpeg" style="width: 260px; height: 336px; object-fit: cover; border-radius: 12px; border: 6px solid white; box-shadow: 0 18px 50px rgba(0,0,0,0.28), 0 0 30px rgba(2,119,189,0.15);">
                    <div style="position: absolute; inset: -25px; background: radial-gradient(ellipse, rgba(2,119,189,0.1) 0%, transparent 65%); z-index: -1; border-radius: 30px;"></div>
                </div>
            </div>

            <!-- Minus circle between center and right -->
            <div style="position: absolute; right: 260px; top: 180px; z-index: 30; width: 44px; height: 44px; background: linear-gradient(145deg, #0277BD, #01579B); border-radius: 50%; box-shadow: 0 4px 12px rgba(2,119,189,0.5); display: flex; align-items: center; justify-content: center; border: 3px solid white;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white; line-height: 1;">&minus;</span>
            </div>

            <!-- Right worksheet -->
            <div style="position: absolute; right: 70px; top: 55px; z-index: 10;">
                <div style="width: 200px; height: 259px; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 4px #80DEEA; overflow: hidden;">
                    <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Subtraktionsarbeitsblatt">
                </div>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 110px; left: 0; right: 0; background: linear-gradient(90deg, rgba(2,119,189,0.95) 0%, rgba(0,131,143,0.95) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.12), 0 4px 20px rgba(0,0,0,0.12);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.25); letter-spacing: 2px;">Visuelles Minus-Rechnen mit Bildern!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 16px;">
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #0277BD;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #0277BD;">Durchstreichen</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #00838F;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #00838F;">Themenbilder</span>
            </div>
            <div style="background: white; padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); border: 3px solid #01579B;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #01579B;">L&ouml;sungsbl&auml;tter</span>
            </div>
        </div>

    </div>
</body>
</html>
