thematicCoherence:
  en: |
    All 7 packages cohere around the supermarket-shopping theme + form
    a cross-strand progression from food vocabulary through counting +
    comparison + category-sorting to community-roles awareness.

    **Pedagogical sequencing:**
    1. **identify-and-name-foods** — Foundational food-vocabulary
       anchor (broad food categories beyond meal-specific subsets).
       Same shared package with breakfast-bundle.
    2. **identify-and-name-fruits** — Fruit-aisle vocabulary
       (apple, banana, strawberry, orange, grape, melon, pineapple).
       Same shared package with fruits-bundle.
    3. **identify-and-name-vegetables** — Vegetable-aisle vocabulary
       (carrot, broccoli, tomato, lettuce, potato, onion, pepper).
       Same shared package with vegetables-bundle.
    4. **count-objects-1-to-10** — Counting practice using
       supermarket items as countable subjects (3 apples in the
       basket; 5 cans of soup; 2 loaves of bread; 8 eggs). Same
       shared package across many bundles; supermarket-context
       authentic real-world counting application.
    5. **compare-quantities-more-fewer** — Comparison work using
       supermarket contexts (more strawberries than blueberries?;
       fewer eggs than cookies?; equal apples and oranges?).
       Same shared package with breakfast-bundle precedent.
    6. **sort-by-category** — Category-classification work
       distinguishing supermarket aisles (produce vs dairy vs
       bakery vs frozen). Connects category-sorting strand to
       spatial classroom-trip preparation work.
    7. **identify-community-helpers** — Community-roles work
       extending to supermarket workers (cashier, baker, butcher,
       produce-stocker, customer-service-rep). Same shared package
       with classroom-bundle; supermarket-context extends community-
       helpers beyond school-staff to broader adult-role awareness.

    **Strand spread:** 3 vocabulary-acquisition + 1 numeracy + 1
    comparison + 1 cognitive-sorting + 1 community-and-roles.
    **5 distinct strands across 7 packages.** Most package-dense
    bundle in Pillar 2 catalog after Arc 5 Phase 1. Cross-strand
    daily-life bundle pattern parallel to breakfast-bundle but
    extending to community-roles strand.

    **Suggested unit duration:** 4-5 weeks (could compress to 4 weeks
    by combining vocabulary-acquisition packages into back-to-back
    weeks). Natural fit with family-shopping-routine + classroom-trip
    + math-application contexts.

    **Multilingual classroom relevance:** supermarket vocabulary
    cognate-rich Romance (supermercado / supermarché / supermercato);
    Germanic distinct (Supermarkt / supermarkt / stormarknad). Specific
    aisle vocabulary varies (produce / Obst-und-Gemüse / produits /
    prodotti). Universal daily-life relevance — supermarket-shopping
    is shared across cultures with locale-specific food choices.
    Particularly load-bearing for K-3 multilingual classrooms with
    family-economic-awareness extensions (cost, exchange, choice-
    making — all in target language).

    **Pillar 2 architectural pattern:** at-the-supermarket-bundle
    exemplifies daily-life multi-strand bundle composition. Theme-
    axis-key daily-life-supermarket-context — broader than breakfast
    (single meal) but narrower than overall food vocabulary. Companion
    bundles in daily-life cluster (breakfast-bundle + kitchen-tools-
    bundle + classroom-bundle) demonstrate pluralism of daily-life
    bundle anchors: meal-context vs tool-context vs school-context vs
    shopping-context. Most package-dense daily-life bundle to date
    (7 packages); precedent for similarly-rich community-context
    bundles (hospital-bundle, post-office-bundle, library-bundle
    candidates).
