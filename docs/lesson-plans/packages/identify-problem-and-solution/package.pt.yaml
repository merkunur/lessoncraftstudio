# Teaching package — identify the problem and solution in a story (pt sparse-override)
# Arc 18 Phase 1.4 (22nd-consecutive pt cadence per Arc 7+ convention). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF02LP26 (ler e compreender, com certa autonomia, textos literários, de gêneros variados, identificando elementos da narrativa) + EF01LP16 (ler e compreender, em colaboração com os colegas e com a ajuda do professor, quadras, quadrinhas, parlendas, trava-línguas) — BNCC Língua Portuguesa Anos Iniciais.

targetSlug: identify-problem-and-solution
language: pt

title:
  pt: "O Que Deu Errado? Como Foi Resolvido? — identificar o problema e a solução"

description:
  pt: "Pacote de compreensão narrativa para a educação infantil / 1.º ano do ensino fundamental, ensinando crianças a identificar o PROBLEMA e a SOLUÇÃO em uma história de 3 eventos. Apoia-se DIRETAMENTE no Arc 14 Fase 2 sequence-3-event-story (crianças que sabem sequenciar eventos primeiro/depois/por-último agora identificam a ESTRUTURA CAUSAL DENTRO desses eventos). Habilidade crítica de compreensão narrativa: as crianças olham uma história em 3 cartões (ex.: criança derruba copo de leite → criança fica triste → mãe ajuda a limpar + serve novo copo), identificam o que DEU ERRADO (leite derramado = problema) e COMO FOI RESOLVIDO (mãe ajuda + serve novo copo = solução). O strand de reading-comprehension avança 7/10 → 8/10. Por §A.13.30 enquadramento informal K-1: trabalho de problema-e-solução no K é RECONHECIMENTO CONCRETO DA ESTRUTURA DA HISTÓRIA — a criança vê a sequência de 3 eventos → aponta para a imagem de 'o que deu errado' → aponta para a imagem de 'como foi resolvido' → narra a estrutura em voz alta. NÃO análise formal de elementos narrativos (que é trabalho do 3.º ano EF em diante introduzindo termos como 'conflito', 'desfecho', 'clímax'); a pedagogia K-1 usa linguagem cotidiana ('o que deu errado' / 'como foi resolvido') para revelar o padrão narrativo subjacente. Alinhamento BNCC: EF02LP26 (compreensão de elementos da narrativa no 2.º ano EF) + EF01LP16 (compreensão narrativa em colaboração no 1.º ano EF). 5 exercícios + 8 materiais imprimíveis ao longo de 1 semana (composição classe-Literacy 8-material canônica per §A.13.37 + pair-coherent com identify-main-character + identify-setting; matching-mat na posição 4 para emparelhamento problema-solução; sequencing-mat na posição 1 substitui sentence-strips porque narração problema-solução é estrutura causal multi-clausal e não enquadramento descritivo de cláusula-única; manipulative-cut-outs em `mode: single-repeat` per §A.13.35 canônico)."

structure:
  warmup:
    body: |
      Atividade introdutória de problema-e-solução com
      toda a turma. Você mostra uma sequência de 3
      cartões de história (em ordem: 1. criança levando
      um copo cheio de leite; 2. criança tropeça + leite
      se espalha; 3. mãe ajuda a limpar + serve novo
      copo). "Olhem essas 3 imagens. Aprendemos a
      colocá-las em ordem — primeiro, depois, por
      último — na semana passada. Hoje vamos olhar para
      DENTRO da história. O QUE DEU ERRADO nessa
      história?" A turma identifica o problema: o leite
      derramou! "E COMO FOI RESOLVIDO? A mãe ajudou a
      limpar e deu um novo copo. O problema é o leite
      derramado. A solução é a ajuda da mãe." Você
      repete com mais 2 histórias de 3 eventos: criança
      não consegue alcançar brinquedo na prateleira →
      criança se estica mas ainda não alcança → irmã
      mais velha pega para ela (problema: não alcança;
      solução: irmã ajuda); semente plantada mas
      esquecida → semente não regada + seca → criança
      rega a semente + planta cresce (problema: esqueceu
      de regar; solução: criança rega). Ênfase do
      padrão: "Histórias frequentemente têm um PROBLEMA
      (algo dá errado, algo precisa de ajuda) e uma
      SOLUÇÃO (alguém ajuda, algo conserta). Identificar
      o problema e a solução nos ajuda a entender POR
      QUE a história acontece."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de identificação de
      problema-e-solução. Cada dupla recebe 4 conjuntos
      de cartões de história de 3 eventos (ex.: conjunto
      A: criança perde lápis de cor → criança fica triste
      → amigo divide os lápis; conjunto B: cachorro está
      com fome → cachorro chora junto à tigela vazia →
      mãe enche a tigela; conjunto C: balão estoura →
      criança chora → avô dá um novo balão; conjunto D:
      criança está com muito frio na rua → criança
      tirita → criança veste o casaco). A dupla se
      reveza: a criança A coloca um conjunto em ordem
      (usa a habilidade prévia de sequence-3-event-
      story); a criança B identifica qual imagem mostra
      o PROBLEMA + qual mostra a SOLUÇÃO, depois narra:
      "O problema é [X]. A solução é [Y]." Recapture
      erros com pistas estruturais ("você disse que a
      criança vestindo o casaco é o PROBLEMA — mas
      lembre, o problema é o que DEU ERRADO. A criança
      estava com frio — isso é o problema. Vestir o
      casaco RESOLVEU o problema — isso é a solução.").
      Extensão opcional: a dupla inventa uma nova
      história de 3 eventos com problema-e-solução
      oralmente (usa situações cotidianas da sala de
      aula: lápis perdido → triste → amigo divide; não
      conseguiu abrir o lanche → pediu ao professor →
      professor abriu). Nota para o professor: crianças
      K às vezes confundem o CENÁRIO (onde a história
      acontece) com o PROBLEMA (o que dá errado), ou
      confundem a SEQUÊNCIA-DE-EVENTOS (primeiro-depois-
      por-último) com a ESTRUTURA-CAUSAL (problema-
      solução). Perguntas explícitas ajudam a
      desambiguar: "O que deu ERRADO?" = problema; "Como
      foi RESOLVIDO?" = solução. A sequência de 3
      eventos é o VEÍCULO ESTRUTURAL; problema-e-solução
      é o PADRÃO CAUSAL dentro da sequência.
  scaffold:
    body: |
      Rotação por estações. Estação 1: folha de exercícios
      pattern-train sequenciando histórias de problema-
      solução (estende o exercício de sequence-3-event-
      story). Estação 2: folha de emparelhamento (imagem
      do problema → imagem da solução; ex.: "leite
      derramado" combina com "mãe limpa"). Estação 3:
      folha de missing-pieces (história de problema-
      solução de 3 eventos com um cartão faltando — a
      criança identifica se o cartão faltando é o
      PROBLEMA, a SOLUÇÃO, ou o evento do meio). Estação
      4: vocabulary-tracing-strips para o vocabulário
      problema + solução + ajudante + resolver (o
      substrato de linguagem para narrar estruturas
      problema-solução).
  closure:
    body: |
      Recapitulação de problema-e-solução com toda a
      turma + avanço do strand reading-comprehension.
      Você mostra uma nova história de 3 eventos (ex.:
      criança acorda atrasada → perde o ônibus escolar
      → mãe leva a criança à escola de carro). A turma
      identifica em coro: "PROBLEMA: perdeu o ônibus!
      SOLUÇÃO: mãe levou de carro!" Você faz a pergunta
      meta: "Por que é útil identificar o PROBLEMA e a
      SOLUÇÃO em uma história?" (A turma faz uma chuva
      de ideias: ajuda a entender SOBRE O QUE a história
      é; nos diz POR QUE os personagens fazem o que
      fazem; nos mostra como problemas são RESOLVIDOS
      na vida real também.) Aponte adiante: "Hoje
      aprendemos a identificar o PROBLEMA e a SOLUÇÃO em
      histórias de 3 eventos. A seguir aprenderemos a
      reconhecer quando histórias são DE FAZ-DE-CONTA
      (ficção) ou DE VERDADE (não-ficção) — distinguish-
      fiction-from-nonfiction é o próximo alvo de
      reading-comprehension. O strand de reading-
      comprehension tem 8 de 10 alvos PRONTOS depois de
      hoje; faltam 2 (distinguish-fiction-from-
      nonfiction + read-and-follow-2-sentence-
      instruction)."

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Identificar o problema em uma história de 3
        eventos apontando para o cartão-de-evento correto
        em 7 de 10 tentativas.
      - Identificar a solução em uma história de 3
        eventos apontando para o cartão-de-evento correto
        em 7 de 10 tentativas.
      - Narrar a estrutura problema-e-solução ("O
        problema é X. A solução é Y.") em 6 de 10
        tentativas.
      - Combinar uma imagem de problema à imagem de
        solução correspondente em 6 de 8 tentativas.
      - Usar o vocabulário 'problema' / 'solução' /
        'resolver' / 'consertar' / 'ajuda' / 'errado'
        corretamente em 5 de 10 tentativas de produção
        verbal.

    Diferenciação:
    - Pré-escola: pular problema-e-solução; revisar
      sequence-3-event-story (Arc 14 Fase 2) para a
      fundação de sequenciamento de 3 eventos primeiro.
    - Educação infantil (5-7 anos): histórias de
      problema-solução de 3 eventos com nomeação do
      padrão conduzida pela professora; compreensão
      receptiva primeiro (apontar para a imagem);
      narração produtiva surge como surge.
    - 1.º ano: estender a histórias de 4-5 eventos
      (problema + tentativa + tentativa melhor +
      solução); introduzir vocabulário formal ("qual é
      o problema?" / "como foi resolvido?"); ponte para
      o trabalho sentimento-do-personagem-durante-
      problema (estende o precedente infer-character-
      feeling-from-picture-cue).
    - 2.º ano em diante: análise completa de elementos
      narrativos (personagem + cenário + problema +
      solução + propósito do autor); ponte para a
      escrita de problema-solução (crianças escrevem
      suas próprias histórias de problema-solução);
      extensão CCSS.2.RL.3.

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en).
    Os campos materials, composedExercises,
    curriculumStandards e learningObjectives são herdados
    do package.yaml via merge sparse-override e não são
    repetidos aqui per a convenção Arc 7+.

    Vocabulário pt-BR canônico para problema-e-solução
    em narrativa K-1:
    - 'problema' (problem) — pt-BR canônico; usado em
      contexto narrativo significa "o que dá errado" na
      história
    - 'solução' (solution) — pt-BR canônico; "como é
      resolvido" na história
    - 'resolver' / 'consertar' (to solve / to fix) —
      pt-BR usa ambos; 'resolver' é mais formal-
      narrativo, 'consertar' é mais coloquial-prático
    - 'ajuda' / 'ajudar' (help / to help)
    - 'ajudante' (helper) — pt-BR canônico para o
      personagem que resolve o problema
    - 'deu errado' (went wrong) — locução pt-BR
      canônica para o lado-do-problema
    - 'foi resolvido' (was solved) — locução pt-BR
      canônica para o lado-da-solução
    - 'aconteceu' (happened) — verbo de evento básico
    - Frases-modelo K-1: "O problema é..." / "A
      solução é..." / "A pessoa ajudou porque..."

    Convenção pt-BR vs pt-PT: ambas as variantes usam
    'problema' + 'solução' identicamente. Algumas
    pequenas divergências na escolha de verbos (pt-PT
    pode preferir 'resolver' canonicamente; pt-BR usa
    'resolver' + 'consertar' alternadamente em registro
    K-1).

    Particularidade pt-BR para narrativa de problema-
    solução K-1:
    Crianças brasileiras K-1 frequentemente conhecem
    estruturas narrativas problema-solução através de
    contação-de-histórias familiar (avós contam
    causos; pais leem livros de bedtime; cuidadores
    contam histórias com lições morais). Este pacote
    sistematiza esse conhecimento prévio em um framework
    explícito de identificação. As histórias de
    problema-solução brasileiras frequentemente
    incluem dimensões coletivas-comunitárias (a
    família resolve juntos; o vizinho ajuda; o amigo
    divide) — o registro pt-BR reflete essa orientação
    relacional naturalmente nas histórias-exemplo.

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF02LP26 ('Ler e compreender, com certa autonomia,
    textos literários, de gêneros variados,
    desenvolvendo o gosto pela leitura') é o anchor
    BNCC do 2.º ano EF para compreensão de elementos
    narrativos. EF01LP16 ('Ler e compreender, em
    colaboração com os colegas e com a ajuda do
    professor e, mais tarde, de maneira autônoma,
    textos narrativos de maior porte como contos
    populares e contos de fadas, dentre outros') cobre
    o trabalho de compreensão narrativa K em
    colaboração. Junto, EF01LP16 + EF02LP26 cobrem a
    progressão K → 1.º ano → 2.º ano para
    identificação de elementos narrativos. Este pacote
    estabelece a base canônica problema-e-solução
    sobre a qual o trabalho posterior de elementos
    narrativos completos (personagem + cenário +
    problema + solução) se constrói.

    Currículo brasileiro K-1 para compreensão narrativa:
    A BNCC brasileira EF Língua Portuguesa Anos
    Iniciais coloca a compreensão narrativa como eixo
    central do trabalho K-2. Este pacote alinha com a
    abordagem BNCC de compreensão-de-leitura-
    colaborativa-e-pictórica antes da
    decodificação-textual-autônoma. A pergunta-padrão
    "o que deu errado? como foi resolvido?" é
    canônica em sequências didáticas brasileiras de
    compreensão narrativa K-1.

    Por §A.13.30 enquadramento informal K-1: este
    pacote NÃO ensina análise formal de elementos
    narrativos (terminologia de conflito-clímax-
    desfecho é trabalho de 3.º ano EF em diante).
    Famílias brasileiras às vezes perguntam por
    análise mais formal (estrutura de enredo
    completo); o parent-take-home-letter explicita
    que o objetivo do 1.º ano EF é o reconhecimento
    do padrão problema-solução em linguagem
    cotidiana, com análise formal emergindo no 2.º +
    3.º ano EF.

    Pacote-prerequisito Arc 14 Fase 2 sequence-3-event-
    story: este pacote estende sequence-3-event-story
    (que ensina sequenciamento estrutural primeiro/
    depois/por-último) para identificação causal
    dentro da sequência. Os 8 materiais são pair-
    coherent com identify-main-character (Arc 17 P1.5)
    + identify-setting (Arc 18 P1.2) — os precedentes
    de estrutura-narrativa que estabelecem o canônico
    Literacy 8-material per §A.13.37: flashcards +
    picture-cards + matching-mat + sentence-strips +
    vocabulary-tracing-strips + manipulative-cut-outs +
    parent-take-home-letter + answer-key. Este pacote
    DIVERGE dos precedentes em UMA dimensão:
    sequencing-mat SUBSTITUI sentence-strips na
    posição de substrato-de-quadro-linguístico.
    Sequencing-mat na posição 1 é o material
    DETERMINANTE — é o substrato estrutural (a
    sequência de 3 eventos) sobre o qual o
    reconhecimento problema-solução se assenta. A
    substituição é pedagogicamente motivada: narração
    de problema-solução é estrutura causal multi-
    clausal ("O problema é X. A solução é Y.") em vez
    de enquadramentos descritivos cláusula-única ("Isto
    é X." / "Eu vejo X." / "Eu sinto X.") que os
    modelos de sentence-strips suportam. Matching-mat
    na posição 4 fornece emparelhamento problema-para-
    solução (crianças combinam imagens-de-problema
    com imagens-de-solução-correspondentes); herda a
    posição + papel de matching-mat dos precedentes
    identify-main-character + identify-setting. Os 5
    exercícios espelham sequence-3-event-story (2
    pattern-train + 2 matching + 1 missing-pieces) —
    mesma mecânica de exercício, interpretação
    narrativa diferente. Este pacote avança o strand
    reading-comprehension para 8/10 SAT (faltam 2
    alvos para fechar o strand em 10/10 SAT —
    distinguish-fiction-from-nonfiction + read-and-
    follow-2-sentence-instruction, ambos candidatos da
    Fase 1.5+).

    Manipulative-cut-outs na posição 6 emite
    canonical-correct `mode: single-repeat` per §A.13.35
    disciplina de modo-canônico (o tipo CutOutMode em
    `frontend/scripts/lib/manipulative-cut-outs-package-
    loader.ts:30` é `'single-repeat' | 'variety'`
    apenas). A staging anterior herdara `mode: story-
    set` do precedente sequence-3-event-story (Arc 14
    P2) que precede o lock de modo-canônico §A.13.35
    em `694f9823` — story-set NÃO está no conjunto
    canônico. Review da Rodada 1 identificou isso como
    firing §A.13.6 per §A.13.32 fundamentação-de-
    artefato-canônico-no-momento-de-composição; emenda
    da Rodada 2 alinhou a single-repeat em itemCount
    24 + itemSize small-1in correspondendo à
    configuração identify-main-character + identify-
    setting.

    Per §A.13.36 cadência de cooperação CC↔assistant:
    o pacote pt herda materials, composedExercises,
    curriculumStandards via sparse-override per
    convenção Arc 7+; as emendas en Round 2 (matching-
    mat adicionado + mode story-set → single-repeat
    + renumeração para 8 materiais) propagam
    automaticamente para esta variante pt.
