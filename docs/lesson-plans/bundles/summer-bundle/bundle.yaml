title:
  en: "Summer — K-3 Themed Bundle"

description:
  en: "Comprehensive K-3 bundle centered on summer season concepts spanning weather + seasonal classification + clothing + outdoor-activity context. 5 packages span vocabulary-acquisition (identify-and-name-clothing — summer-specific clothing + identify-and-name-weather-words — summer weather vocabulary) + cognitive classification (identify-four-seasons — summer as one of 4 seasons; identify-weather-types — summer weather: sunny, hot, humid, stormy) + cycle science (describe-day-night-cycle — summer has long days and short nights). Cross-strand seasonal bundle paralleling winter-bundle precedent (Pillar 2 Arc 3 Phase 2). Suitable for a 5-week classroom unit during summer season (or summer-context unit anytime); supports K-3 multilingual classrooms in northern-hemisphere settings during June-August or southern-hemisphere settings during December-February."

