assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Decompose 6 of 8 numbers (21-50) into correct tens-and-
        ones representation.
      - Build a given number with base-ten manipulatives in 7 of
        10 trials.
      - Compare two two-digit numbers correctly in 7 of 10 trials.
      - Identify tens-place vs ones-place digit in written number
        in 9 of 10 trials.

    Differentiation:
    - Pre-K: skip multi-tens-place; review tens-and-ones-1-to-20.
    - K: 2-3 tens range only (20-30); concrete manipulatives.
    - Grade 1: full 21-50 coverage.
    - Grade 2+: extend to tens-and-ones-51-to-100 + bridge to
      hundreds-tens-ones for three-digit numbers.

