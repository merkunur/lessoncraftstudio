compositionalRationale:
  en: |
    Primary strand: early-literacy / instruction-following + receptive-
    listening (2-step oral instruction comprehension). Secondary
    strand: cognitive-and-executive-function / sequencing (sequential
    action planning). Tertiary strand: vocabulary-acquisition
    (connector words: and, first, then, after, before).

    Architectural significance: forward-pointer resolution from Arc
    11 follow-1-step-oral-instruction ('next we extend single-step
    instructions to 2-step + multi-step instructions'). Builds on
    Arc 11 follow-1-step foundation; bridges from single-step
    receptive listening to multi-step executive-function work. Pairs
    with Arc 14 Phase 2's sequence-3-event-story (narrative
    sequencing) — both packages exercise sequential thinking in
    complementary modalities (oral instructions vs visual story).

    Distinctive composition: 2 pattern-train (sequencing) + 2
    matching + 1 missing-pieces. Same sequencing emphasis as
    sequence-3-event-story; cross-package pattern coherence
    demonstrates that sequencing is a foundational cross-strand
    capability.

    Class B FLEXIBLE substrate: composes against miscellaneous +
    animals + foods themes; instruction prompts span everyday
    contexts.

    K-3 multilingual classroom relevance: 2-step instruction
    following is particularly valuable for multilingual learners
    — provides explicit listening + comprehension practice with
    high-frequency connector words. Connector words vary across
    locales (and / und / et / y / e — Romance + Germanic cognate;
    first/then sequencing varies syntactically). Locale-variant
    work at Phase 3+ adapts to each locale's connector vocabulary.

