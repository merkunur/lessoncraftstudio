compositionalRationale:
  en: |
    Primary strand: math / measurement (tell time to the
    quarter-hour on an analog clock — completes the
    canonical tell-time triple at 3/3 SAT in the measurement
    strand). Secondary strand: math / time-and-routine
    (parallel framing — see cross-reference to read-time-
    on-analog-clock below). Tertiary strand: vocabulary-
    acquisition (quarter-hour vocabulary: quarter-past,
    quarter-to, fifteen-minutes, forty-five-minutes).

    Architectural significance: completes the measurement-
    strand tell-time canonical triple opened by Arc 17
    P1.4 (tell-time-to-the-hour + tell-time-to-half-hour
    Slots 1 + 4). Per learning-targets.json `tell-time-to-
    quarter-hour` is the third of three canonical tell-time
    targets (CCSS.2.MD.C.7 anchor); this package's ship
    saturates the tell-time sub-track 3/3. The broader
    measurement strand (9 targets) continues to grow with
    elapsed-time + minute work + currency + capacity targets
    in subsequent arcs.

    Cross-reference to read-time-on-analog-clock (Arc 15
    Phase 1) per §A.13.34 parallel-strand-framing: the
    existing read-time-on-analog-clock package saturates
    the cognitive-and-executive-function / time-and-
    routine strand and ALSO covers hour + half-hour clock-
    reading pedagogically. Arc 17 P1.4 + Arc 18 P1.1's
    tell-time triple coexists with that work as parallel
    measurement-strand framing. The framing distinction
    inherits from Arc 17 P1.4 Slot 1 verbatim:
    - read-time-on-analog-clock: clock-reading as a daily-
      life skill (WHEN things happen in the day; schedule
      reading; time-and-routine awareness).
    - tell-time-to-the-hour / -half-hour / -quarter-hour
      (the canonical measurement-strand triple): clock-
      reading as quantitative measurement (TIME AS A
      MEASURABLE DIMENSION parallel to length, weight,
      capacity, duration). The clock is a measurement
      instrument that reads off the quantity 'time of day'
      at increasingly precise sub-hour increments.
    Both framings are valuable; teachers can pull whichever
    framing fits their curriculum context. The materials
    infrastructure (clock-mat, time-format flashcards) is
    shared across both strand framings.

    Pair triple completion: tell-time-to-the-hour (Arc 17
    P1.4 Slot 1; hour-only reading) + tell-time-to-half-
    hour (Arc 17 P1.4 Slot 4; +half-past reading) +
    tell-time-to-quarter-hour (THIS PACKAGE; +quarter-past
    + quarter-to reading). The triple covers all four
    canonical quarter positions of the clock face (12 / 3
    / 6 / 9). Subsequent measurement-strand work extends
    to nearest-5-minutes precision per the broader
    CCSS.2.MD.C.7 scope.

    Materials note (CRITICAL DIVERGENCE RATIFICATION per
    §A.13.6 spec-vs-shipped-contract validation +
    §A.13.34 transparency):

    THIS PACKAGE INTERNALLY DIVERGES FROM ARC 17 P1.4 PAIR
    ON ONE DIMENSION. Materials position 3 (clock-mat)
    mirrors Arc 17 P1.4 precedent verbatim — preserves
    pair-triple coherence on the materials-list shape +
    carries forward the §A.13.32 sub-doctrine (d)
    generator-executability gap consistently across all 3
    tell-time canonical packages (clock-mat generator is
    Pillar 5 (C) DEFER carry-forward; when authored,
    retro-fix applies uniformly to all 3 packages).

    HOWEVER, materials position 5 (manipulative-cut-outs)
    DIVERGES from Arc 17 P1.4 on the `mode:` dimension.
    Arc 17 P1.4 packages emit `mode: clock-pieces` (a
    non-canonical mode value that does NOT exist in the
    corrected CutOutMode type per `frontend/scripts/lib/
    manipulative-cut-outs-package-loader.ts:30` — the
    canonical set is `'single-repeat' | 'variety'` only,
    per the §A.13.35 self-firing correction shipped at
    commit 694f9823). The Arc 17 P1.4 `mode: clock-pieces`
    is pre-correction data debt.

    Per operator adjudication at Arc 18 Phase 0 §A.13.6
    firings batch (3 firings surfaced + adjudicated via
    AskUserQuestion): this package ships canonical-correct
    `mode: variety` with vocabKey enumeration of 15 clock-
    piece types (hour-hand, minute-hand, clock-face,
    number-1 through number-12) at itemCount 2. The Arc 17
    P1.4 packages stay at `mode: clock-pieces` for a
    separate retro-fix arc (Pillar 5 (C) DEFER carry-
    forward: 2-package retrofit alongside clock-mat
    generator authoring when prioritized).

    The internal-shape divergence is INTENTIONAL +
    OPERATOR-LOCKED. Future audits resolving apparent
    inconsistency should read this compositionalRationale +
    consult Arc 18 Phase 0 §A.13.6 firings batch in the
    arc commit. Do NOT silently align this package to Arc
    17 P1.4 `mode: clock-pieces` — that would re-introduce
    the §A.13.35 self-firing defect at the catalog layer.

    Distinctive composition: 2 matching + 1 chart-count +
    1 math-puzzle + 1 math-worksheet. Same shape as Arc 17
    P1.4 pair with content adjusted for quarter-hour
    scope. Chart-count at position 2 surfaces the four-
    canonical-positions sequence (1:00, 1:15, 1:30, 1:45,
    2:00, 2:15...) which visually shows quarter-hour
    positions as the midpoints between the half-hour
    canonical positions. The mixed-positions matching at
    consolidation (position 4) distinguishes all four
    canonical positions — the load-bearing diagnostic that
    tests whether kids really internalized the minute-hand-
    position distinction across all four quarter-hour
    positions.

    Class B FLEXIBLE substrate: composes against
    miscellaneous theme (clock-faces don't compose against
    animal/food themes naturally; aligns with Arc 17 P1.4
    pair-coherent theme choice + read-time-on-analog-clock
    + tens-and-ones-1-to-20 abstract-numerical package
    precedent).

    K-3 multilingual classroom relevance: quarter-hour
    reading universal across Grade 2 + locale-portable
    conceptually, but the SPOKEN time-expression varies
    substantially:
    - en 'quarter past 3' = 3:15; 'quarter to 4' = 3:45
    - de 'Viertel nach 3' = 3:15; 'Viertel vor 4' = 3:45
      (canonical en/de structural parallel)
    - es 'tres y cuarto' (lit. 'three and quarter') =
      3:15; 'cuarto para las cuatro' (lit. 'quarter to
      four') = 3:45 OR 'tres y cuarenta y cinco' (3:45
      digital read-out form)
    - pt 'três e quinze' (lit. 'three and fifteen') = 3:15;
      'quinze para as quatro' (lit. 'fifteen to four') =
      3:45. pt prefers number-form ('quinze') over
      'quarter'-form in most K-1+2 registers.
    - fr 'trois heures et quart' (lit. 'three hours and
      quarter') = 3:15; 'quatre heures moins le quart'
      (lit. 'four hours minus the quarter') = 3:45
    - fi 'varttia yli kolmen' (lit. 'quarter past three')
      = 3:15; 'varttia vaille neljä' (lit. 'quarter
      lacking four') = 3:45
    The clock-face visual is locale-portable; the verbal
    time-expression requires locale-specific adaptation.
    Notable challenge: de + fi use the upcoming-hour
    framing for 'quarter to' (Viertel VOR 4 = quarter
    BEFORE 4 — pointing at 4 not 3); some locales use
    number-form ('three and fifteen') instead of quarter-
    form, which is more transparent but loses the
    canonical 'quarter' vocabulary. Locale-variant work
    at Phase 3+ adapts to each locale's quarter-hour
    expression idiom.

