compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (subtraction
    within 100 — deepens strand 4/14 → 5/14; paired inverse
    of Arc 16 Phase 1.1 add-within-100). Secondary strand: math /
    place-value (two-digit subtraction foregrounds borrowing as
    place-value operation). Tertiary strand: numeracy (strategy-
    based subtraction: borrowing, decomposition, count-back,
    use-known-facts).

    Architectural significance: extends Arc 15 Phase 1 subtract-
    within-20 into two-digit range. Paired companion to add-
    within-100 (same arc phase). Completes the basic addition-
    subtraction sequence (5 → 10 → 20 → 100). Leverages Arc 15
    Phase 1+4 tens-and-ones place-value work as conceptual
    substrate. First package to require BORROWING (the inverse
    of regrouping/carrying introduced at add-within-100) as
    canonical subtraction strategy. Bridges single-digit subtraction
    fluency to two-digit place-value-aware subtraction.

    Distinctive composition: 1 subtraction (vertical format) +
    2 math-worksheet (vertical subtraction within 100) + 1
    math-puzzle (missing-operand) + 1 more-less (compare
    subtraction results). Vertical format emphasized — column
    alignment + borrow-mark practice critical for borrowing
    fluency.

    Class B FLEXIBLE substrate: composes against animals theme
    (countable for subtraction work; cross-arc with Arc 12-15
    addition/subtraction themes for consistency).

    K-3 multilingual classroom relevance: subtraction within 100
    universal K-3 content. Borrowing vocabulary varies across
    locales: en "borrow/regroup"; de "borgen/Übertrag"; es
    "pedir prestado/llevar"; pt "emprestar/transportar"; fr
    "emprunter/retenue"; it "prestare/riporto"; fi
    "lainata/muistinumerot". Number-word naming for 21-99 with
    same cross-locale irregularities as add-within-100 (see
    that package's rationale for detail). Locale-variant work
    at Phase 3+ adapts to each locale's number-word + borrowing-
    vocabulary register.

