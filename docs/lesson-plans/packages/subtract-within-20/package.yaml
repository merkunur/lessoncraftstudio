compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (subtraction within
    20 — extends strand by deepening subtraction coverage). Secondary
    strand: numeracy (strategy-based subtraction: count-back,
    decomposition, use-known-facts). Tertiary strand: math /
    place-value (within-20 subtraction introduces tens-place
    conceptual foundation).

    Architectural significance: extends Arc 14 Phase 4 subtract-
    within-5 + subtract-within-10 into within-20 range. Completes
    basic subtraction sequence (5 → 10 → 20). Critical bridge from
    mental subtraction (within 10) to two-digit subtraction; within-
    20 range introduces 'crossing the 10' subtraction (15-7 requires
    crossing 10) which prepares for borrowing/regrouping work in
    future place-value-aware subtraction.

    Distinctive composition: 2 math-worksheet (vertical format) + 1
    subtraction (cross-out method) + 1 math-puzzle (missing-operand)
    + 1 more-less (compare subtraction results). Strategy diversity
    emphasized in worksheet design.

    Class B FLEXIBLE substrate: composes against animals theme
    (countable for subtraction work; cross-arc with Arc 14 subtract-
    within-5 + subtract-within-10 themes).

    K-3 multilingual classroom relevance: subtraction within 20 is
    universal K-3 math content across 11 platform locales. Number
    words varied (one-to-twenty Romance partial-cognate; Germanic
    + Finnic distinct number-word systems). Strategy vocabulary
    varies — "count-back" / "decomposition" / "use-known-facts"
    translate to locale-specific math-strategy idioms. Locale-
    variant work at Phase 3+ adapts to each locale's number-word
    + strategy-vocabulary register.

