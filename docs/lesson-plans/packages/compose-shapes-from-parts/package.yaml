# Teaching package — compose shapes from smaller shapes
# Arc 17 Phase 1.3 (geometry 5/8 → 6/8). Builds on Arc 9 identify-2d-shapes-basic + Arc 14 describe-shape-attributes; extends geometry strand from shape-recognition + attribute-analysis into spatial-composition work.

targetSlug: compose-shapes-from-parts
language: en
title:
  en: "Compose Shapes from Parts — two triangles make a square"

description:
  en: "Grade 1 math + geometry package teaching kids to combine smaller 2D shape pieces into larger composite shapes. Two right triangles compose into a square; two squares compose into a rectangle; a square + a triangle composes into a pentagon (or a 'house' shape); six equilateral triangles compose into a hexagon. Builds on Arc 9 identify-2d-shapes-basic foundation; extends geometry strand from naming + attribute-analysis work to spatial-composition reasoning. Critical insight: shapes are not isolated objects — they have part-whole relationships, and many familiar shapes can be decomposed into simpler primitives OR composed from them. This is the K-3 anchor for later geometric reasoning (area calculation as sum of part areas; fraction-of-shape work as composition relationships). CCSS.1.G.A.2 primary anchor ('compose two-dimensional shapes... to create a composite shape, and compose new shapes from the composite shape'). 5 worksheet exercises + 7 printable materials over a 1-week unit. Manipulative-cut-outs in 2d-shape-pieces mode is the load-bearing material — kids physically slide pieces together to discover composition relationships."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + composition introduction with paper
      shape pieces. Teacher holds up two identical right
      triangles. "Watch what happens when I put these two
      triangles together." Teacher slides the triangles so
      their longest sides meet — they form a square. "Two
      triangles MAKE a square. A square is COMPOSED of two
      triangles." Class chants: "Two triangles make a
      square!" Teacher then composes a rectangle from two
      squares ("Two squares make a rectangle"), a hexagon
      from six equilateral triangles ("Six triangles make a
      hexagon"), and a 'house' from a square + a triangle on
      top ("A square plus a triangle makes a house shape").
      Reverse demonstration: teacher takes the house and
      separates it back into square + triangle. "And we can
      take a composite shape APART back into its pieces.
      Compose: put together. Decompose: take apart. Both
      directions work."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + free composition with paper shape pieces.
      Each pair receives a bag of cut-out 2D shape pieces
      (triangles in three sizes — small equilateral, small
      right, large right; squares in two sizes; rectangles;
      half-circles; small parallelograms). Pair plays the
      composition challenge: teacher names a target shape
      (e.g., 'house', 'flower', 'fish', 'rocket', 'castle')
      and kids compose it from their available pieces. After
      each composition, kids draw it on paper + label the
      primitives used. Recast errors by demonstrating the
      composition: 'A boat needs a long rectangle for the
      bottom + a triangle for the sail — try that.' Free
      time at end: kids invent their own composite shapes
      and challenge their partner to recreate them. The
      cut-out manipulatives are load-bearing — kids need
      hands-on time sliding pieces around to internalize the
      part-whole relationships.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity — match
      each composite shape (house, fish, rocket) to the set
      of primitives that compose it (square+triangle,
      half-circle+triangle+rectangle, rectangle+triangle).
      Station 2: missing-pieces activity — kids see a partial
      composite shape with one primitive piece missing; their
      job is to identify which piece (from a small palette
      of options) completes the shape. Station 3: picture-
      sort activity — sort shapes into 'made of triangles',
      'made of squares', 'made of mixed shapes' categories.
      Station 4: grid-match activity — fit shape pieces into
      a grid layout to form a target composite. The grid-
      match station works on spatial fit alongside
      composition.
  closure:
    durationMinutes: 5
    body: |
      Whole-class composition quick-recall. Teacher shows
      composite shapes on the board; class chorally names
      the primitive composition. "Square + triangle on top
      — house shape! Two triangles meeting — square! Six
      triangles around a point — hexagon!" Teacher then
      asks the reverse: "How can we make a rectangle?"
      (Two squares; OR one square + half a square; OR four
      smaller rectangles.) Multiple-answer recognition is
      important — most composite shapes have several valid
      decompositions. Forward-pointer: "Today we composed
      shapes from smaller shapes. Composing and decomposing
      shapes is what kids do when they build with blocks,
      do tangram puzzles, fold paper, and draw pictures.
      Next time in geometry, we'll meet PARTITIONING SHAPES
      INTO EQUAL PARTS (halves and quarters) and SYMMETRY
      (lines that split a shape into matching mirror
      halves)."

