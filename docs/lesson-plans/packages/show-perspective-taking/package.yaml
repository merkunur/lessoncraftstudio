assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Recognize that another person can feel differently from
        oneself about the same situation in 7 of 10 trials
        (RECOGNIZE-FEELINGS step).
      - Infer what another person might be thinking when they
        don't have the same information in 5 of 8 trials
        (INFER-THOUGHTS step; classic false-belief task target).
      - Predict another person's likely action based on what THEY
        know (not what YOU know) in 5 of 8 trials (PREDICT-
        ACTIONS step).
      - Use perspective-taking productive language ("I think
        they feel ___" / "Maybe they're thinking ___") in 5 of 10
        conversational trials.

    Differentiation:
    - Pre-K: focus on RECOGNIZE-FEELINGS step only; basic
      "different people have different feelings" framework.
    - K: RECOGNIZE + INFER steps; introduce classic false-belief
      scenarios with concrete props (the teddy-bear task).
    - Grade 1: full 3-step framework; perspective-vocabulary
      productive use.
    - Grade 2+: extend to more abstract perspective-taking
      (cultural-perspective, historical-perspective, fictional-
      character-perspective in stories); bridge to conflict-
      resolution + friendship work.

