<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Alphabet Train - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #64B5F6 0%, #90CAF9 40%, #FFF59D 100%); overflow: hidden;">

        <!-- Sun rays -->
        <div style="position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,245,157,0.8) 0%, transparent 70%);"></div>

        <!-- Confetti dots scattered -->
        <div style="position: absolute; top: 80px; left: 100px; width: 20px; height: 20px; background: #E91E63; border-radius: 50%;"></div>
        <div style="position: absolute; top: 150px; left: 200px; width: 15px; height: 15px; background: #9C27B0; border-radius: 50%;"></div>
        <div style="position: absolute; top: 60px; right: 150px; width: 18px; height: 18px; background: #4CAF50; border-radius: 50%;"></div>
        <div style="position: absolute; top: 200px; right: 80px; width: 12px; height: 12px; background: #FF9800; border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 300px; left: 60px; width: 16px; height: 16px; background: #00BCD4; border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 250px; right: 100px; width: 14px; height: 14px; background: #FFEB3B; border-radius: 50%;"></div>
        <div style="position: absolute; top: 300px; left: 50px; width: 10px; height: 10px; background: #FF5722; border-radius: 50%;"></div>
        <div style="position: absolute; top: 400px; right: 50px; width: 22px; height: 22px; background: #3F51B5; border-radius: 50%;"></div>

        <!-- Star bursts -->
        <div style="position: absolute; top: 120px; left: 60px; font-size: 40px; transform: rotate(-15deg);">⭐</div>
        <div style="position: absolute; top: 80px; right: 200px; font-size: 35px; transform: rotate(20deg);">✨</div>
        <div style="position: absolute; bottom: 350px; right: 60px; font-size: 45px; transform: rotate(-10deg);">⭐</div>
        <div style="position: absolute; bottom: 400px; left: 120px; font-size: 30px; transform: rotate(15deg);">✨</div>

        <!-- Flying letter blocks -->
        <div style="position: absolute; top: 100px; left: 180px; transform: rotate(-20deg);">
            <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #F44336 0%, #D32F2F 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(244,67,54,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 50px; color: white;">A</span>
            </div>
        </div>

        <div style="position: absolute; top: 60px; left: 320px; transform: rotate(15deg);">
            <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(33,150,243,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 50px; color: white;">B</span>
            </div>
        </div>

        <div style="position: absolute; top: 120px; right: 180px; transform: rotate(-10deg);">
            <div style="width: 70px; height: 70px; background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(76,175,80,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 50px; color: white;">C</span>
            </div>
        </div>

        <div style="position: absolute; top: 180px; right: 100px; transform: rotate(25deg);">
            <div style="width: 60px; height: 60px; background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(255,152,0,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 40px; color: white;">D</span>
            </div>
        </div>

        <!-- "ABC FUN!" title with rainbow gradient -->
        <div style="position: absolute; top: 230px; left: 50%; transform: translateX(-50%);">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 100px; margin: 0; background: linear-gradient(90deg, #F44336 0%, #FF9800 25%, #FFEB3B 50%, #4CAF50 75%, #2196F3 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-shadow: none; filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.1));">ABC FUN!</h1>
        </div>

        <!-- Large dynamic locomotive -->
        <div style="position: absolute; top: 340px; left: 50%; transform: translateX(-50%) rotate(5deg); width: 500px; height: 280px;">
            <!-- Locomotive body -->
            <div style="position: relative; width: 100%; height: 100%;">
                <!-- Main body -->
                <div style="position: absolute; bottom: 60px; left: 50px; width: 400px; height: 160px; background: linear-gradient(180deg, #FF9800 0%, #E65100 100%); border-radius: 20px 20px 10px 10px; box-shadow: 0 15px 50px rgba(255,152,0,0.5);">
                    <!-- Green roof -->
                    <div style="position: absolute; top: -30px; left: 20px; right: 20px; height: 40px; background: linear-gradient(180deg, #4CAF50 0%, #388E3C 100%); border-radius: 20px 20px 0 0;"></div>

                    <!-- Yellow accent stripe -->
                    <div style="position: absolute; top: 40px; left: 0; right: 0; height: 20px; background: #FFEB3B;"></div>

                    <!-- Windows -->
                    <div style="position: absolute; top: 70px; left: 30px; display: flex; gap: 25px;">
                        <div style="width: 60px; height: 50px; background: #E3F2FD; border-radius: 8px; border: 4px solid #5D4037;"></div>
                        <div style="width: 60px; height: 50px; background: #E3F2FD; border-radius: 8px; border: 4px solid #5D4037;"></div>
                        <div style="width: 60px; height: 50px; background: #E3F2FD; border-radius: 8px; border: 4px solid #5D4037;"></div>
                    </div>
                </div>

                <!-- Smokestack -->
                <div style="position: absolute; bottom: 220px; left: 80px; width: 50px; height: 70px; background: linear-gradient(180deg, #37474F 0%, #263238 100%); border-radius: 8px 8px 0 0;">
                    <div style="position: absolute; top: -20px; left: -10px; width: 70px; height: 25px; background: #37474F; border-radius: 10px;"></div>
                </div>

                <!-- Steam puffs from smokestack -->
                <div style="position: absolute; bottom: 300px; left: 70px; width: 60px; height: 60px; background: rgba(255,255,255,0.9); border-radius: 50%; filter: blur(3px);"></div>
                <div style="position: absolute; bottom: 340px; left: 100px; width: 45px; height: 45px; background: rgba(255,255,255,0.7); border-radius: 50%; filter: blur(4px);"></div>
                <div style="position: absolute; bottom: 370px; left: 130px; width: 35px; height: 35px; background: rgba(255,255,255,0.5); border-radius: 50%; filter: blur(5px);"></div>

                <!-- Cow catcher -->
                <div style="position: absolute; bottom: 30px; left: 0; width: 80px; height: 40px; background: linear-gradient(180deg, #5D4037 0%, #3E2723 100%); clip-path: polygon(100% 0, 100% 100%, 0 100%);"></div>

                <!-- Wheels -->
                <div style="position: absolute; bottom: 0; left: 100px; width: 70px; height: 70px; background: radial-gradient(circle, #78909C 0%, #37474F 50%, #263238 100%); border-radius: 50%; border: 8px solid #455A64;">
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; background: #90A4AE; border-radius: 50%;"></div>
                </div>
                <div style="position: absolute; bottom: 0; left: 220px; width: 70px; height: 70px; background: radial-gradient(circle, #78909C 0%, #37474F 50%, #263238 100%); border-radius: 50%; border: 8px solid #455A64;">
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; background: #90A4AE; border-radius: 50%;"></div>
                </div>
                <div style="position: absolute; bottom: 0; left: 340px; width: 70px; height: 70px; background: radial-gradient(circle, #78909C 0%, #37474F 50%, #263238 100%); border-radius: 50%; border: 8px solid #455A64;">
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; background: #90A4AE; border-radius: 50%;"></div>
                </div>
            </div>
        </div>

        <!-- Cute animals floating -->
        <div style="position: absolute; top: 350px; left: 60px; font-size: 60px; transform: rotate(-15deg);">🦒</div>
        <div style="position: absolute; top: 420px; right: 70px; font-size: 55px; transform: rotate(10deg);">🐘</div>
        <div style="position: absolute; bottom: 200px; left: 100px; font-size: 50px; transform: rotate(5deg);">🐱</div>

        <!-- Scissors with cut lines -->
        <div style="position: absolute; bottom: 280px; right: 150px; transform: rotate(-30deg);">
            <span style="font-size: 50px;">✂️</span>
            <div style="position: absolute; top: 25px; left: 50px; width: 80px; border-top: 3px dashed #37474F;"></div>
        </div>

        <!-- Worksheet peek -->
        <div style="position: absolute; bottom: 120px; right: 80px; transform: rotate(12deg); box-shadow: 0 10px 30px rgba(0,0,0,0.3); border-radius: 8px; overflow: hidden; border: 4px solid white;">
            <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/alphabet%20train/alphabet%20train%20portrait.jpeg" style="width: 150px; height: auto; display: block;">
        </div>

        <!-- Curved text "Choo-Choo into Learning!" -->
        <div style="position: absolute; bottom: 180px; left: 50px; transform: rotate(-8deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; color: #1A237E; text-shadow: 2px 2px 0 white;">Choo-Choo into Learning!</span>
        </div>

        <!-- Comic burst "ALL ABOARD!" -->
        <div style="position: absolute; top: 50px; left: 50%; transform: translateX(-50%);">
            <div style="background: #FFEB3B; padding: 12px 30px; border-radius: 30px; border: 4px solid #F57F17; box-shadow: 0 4px 15px rgba(255,235,59,0.5); transform: rotate(3deg);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: #E65100;">ALL ABOARD! 🚂</span>
            </div>
        </div>

        <!-- "Kids LOVE This!" badge -->
        <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);">
            <div style="background: linear-gradient(135deg, #E91E63 0%, #C2185B 100%); padding: 15px 35px; border-radius: 50px; box-shadow: 0 6px 25px rgba(233,30,99,0.4);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: white;">❤️ Kids LOVE This!</span>
            </div>
        </div>

        <!-- FREE badge -->
        <div style="position: absolute; top: 40px; left: 40px; background: #E53935; padding: 10px 25px; border-radius: 25px; box-shadow: 0 4px 15px rgba(229,57,53,0.5); transform: rotate(-8deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white;">FREE</span>
        </div>

    </div>
</body>
</html>
