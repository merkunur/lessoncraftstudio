description:
  en: "Comprehensive K-3 bundle centered on toy + play vocabulary anchoring multi-attribute sorting + reasoning + action-verb work. 5 packages span cognitive-sorting (sort-by-shape + sort-by-color + sort-by-size — toys naturally vary along all 3 attribute axes) + reasoning (identify-odd-one-out-by-attribute — toys provide rich attribute-discrimination contexts) + vocabulary-acquisition (identify-and-name-action-verbs — verbs of play: build, throw, push, roll). Theme provides high-engagement K-3 context; toys are universal across cultures + classroom-relevant + child-motivating. Suitable for a 4-5 week classroom unit on play-based learning + attribute-sorting practice; supports K-3 multilingual classrooms where play-vocabulary is high-frequency."

