<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Picture Cryptogram - Professional Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(160deg, #1a1225 0%, #1f1428 40%, #150d1c 100%);">

        <!-- Velvet texture overlay -->

        <!-- Spotlight beams -->
        <div style="position: absolute; top: -100px; left: 30%; width: 300px; height: 700px; background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%); transform: rotate(-15deg); pointer-events: none;"></div>

        <div style="position: absolute; top: -100px; right: 25%; width: 300px; height: 700px; background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%); transform: rotate(15deg); pointer-events: none;"></div>

                <div style="position: absolute; top: 50%; left: -3px; transform: translateY(-50%); width: 10px; height: 10px; background: #1a1225; border-radius: 50%;"></div>
                <div style="position: absolute; top: 50%; right: -3px; transform: translateY(-50%); width: 10px; height: 10px; background: #1a1225; border-radius: 50%;"></div>

            </div>
        </div>

        <!-- GRADES Badge -->
        <div style="position: absolute; top: 32px; right: 32px; z-index: 30;">
            <div style="background: linear-gradient(145deg, rgba(255,255,255,0.95) 0%, rgba(250,245,255,0.95) 100%); padding: 12px 24px; border-radius: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 800; color: #7C3AED; letter-spacing: 1px;">GRADES K-3</span>

        <div style="position: absolute; top: 185px; left: 50%; transform: translateX(-50%); z-index: 20;">

        <!-- Gallery Wall Display -->
        <div style="position: absolute; top: 260px; left: 50%; transform: translateX(-50%); display: flex; gap: 40px; align-items: center; z-index: 15;">

            <!-- Left Frame (smaller) -->
            <div style="position: relative;">

                    <!-- Inner frame border -->
                    <div style="width: 100%; height: 100%; background: linear-gradient(145deg, #5B21B6 0%, #7C3AED 50%, #5B21B6 100%); border-radius: 4px; padding: 8px;">

                        <div style="width: 100%; height: 100%; background: white; border-radius: 2px; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.1);">

            </div>

            <div style="position: relative;">

                    <!-- Inner frame border - purple -->
                    <div style="width: 100%; height: 100%; background: linear-gradient(145deg, #5B21B6 0%, #7C3AED 50%, #5B21B6 100%); border-radius: 6px; padding: 10px; box-shadow: inset 0 0 15px rgba(0,0,0,0.3);">
                        <!-- Image container -->
                        <div style="width: 100%; height: 100%; background: white; border-radius: 3px; overflow: hidden; box-shadow: inset 0 0 30px rgba(0,0,0,0.1);">
                            <img src="https://www.lessoncraftstudio.com/samples/english/cryptogram/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
                        </div>
                    </div>

                <!-- Spotlight on center frame -->

                <div style="position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #D4A439 0%, #8B6914 100%); padding: 10px 30px; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: #1a1225; letter-spacing: 2px;">THE ART OF CODE-BREAKING</span>
                </div>
            </div>

            <!-- Right Frame (smaller - answer key) -->
            <div style="position: relative;">
                <!-- Ornate frame -->
                <div style="width: 200px; height: 260px; background: linear-gradient(145deg, #8B6914 0%, #D4A439 20%, #8B6914 40%, #D4A439 60%, #8B6914 80%, #D4A439 100%); border-radius: 8px; padding: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);">
                    <!-- Inner frame border -->
                    <div style="width: 100%; height: 100%; background: linear-gradient(145deg, #C2410C 0%, #F97316 50%, #C2410C 100%); border-radius: 4px; padding: 8px;">
                        <!-- Image container -->
                        <div style="width: 100%; height: 100%; background: white; border-radius: 2px; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.1);">
                            <img src="https://www.lessoncraftstudio.com/samples/english/cryptogram/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover;">

                    </div>
                </div>
                <!-- Spotlight on frame -->
                <div style="position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);"></div>
                <!-- Answer key label -->
                <div style="position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); background: #F97316; padding: 4px 14px; border-radius: 10px;">
                    <span style="font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700; color: white;">ANSWER KEY</span>

            </div>
        </div>

        <!-- Glass-morphism Feature Cards -->
        <div style="position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 25;">
            <!-- Instant Download -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); padding: 18px 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 36px; height: 36px; background: linear-gradient(145deg, #7C3AED 0%, #6D28D9 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <span style="font-size: 18px;">⬇️</span>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: white;">Instant Download</span>
                </div>
            </div>

            <!-- No Prep Required -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); padding: 18px 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 36px; height: 36px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <span style="font-size: 18px;">✨</span>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: white;">No Prep Required</span>
                </div>
            </div>

            <!-- Answer Keys Included -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); padding: 18px 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 36px; height: 36px; background: linear-gradient(145deg, #7C3AED 0%, #6D28D9 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <span style="font-size: 18px;">🔑</span>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: white;">Answer Keys Included</span>
                </div>
            </div>

            <!-- Print Ready -->
            <div style="background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); padding: 18px 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 36px; height: 36px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <span style="font-size: 18px;">🖨️</span>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: white;">Print Ready</span>
                </div>
            </div>
        </div>

        <!-- Bottom accent line -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 200px; height: 3px; background: linear-gradient(90deg, transparent 0%, #D4A439 50%, transparent 100%); border-radius: 2px;"></div>

    </div>
</body>
</html>
