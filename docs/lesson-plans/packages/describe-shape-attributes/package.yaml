compositionalRationale:
  en: |
    Primary strand: early-numeracy / geometry (shape-attribute
    description). Secondary strand: vocabulary acquisition (vocab-
    anchored — geometric attribute vocabulary: sides, corners, curves,
    faces, edges, vertices). Tertiary strand: speaking-and-listening
    (productive description of geometric attributes).

    Architectural significance: bridges shape-NAMING (Arc 1+5 packages)
    to shape-DESCRIBING. The shape progression: identify-2d-shapes-
    basic (recognize basic 2D shapes) → identify-2d-shapes-extended
    (recognize variants) → identify-3d-shapes (recognize solids) →
    describe-shape-attributes (this package; articulate attributes
    productively). Each step adds cognitive depth without abandoning
    the earlier work.

    Distinctive composition: 3 matching exercises across same theme
    (shapes) — repetition reinforces shape-name fluency that
    attribute description requires. odd-one-out at position 3 shifts
    to attribute-based reasoning ("which is the odd one out by number
    of sides?"). word-guess at position 4 reinforces shape-name spelling.

    Class B FLEXIBLE substrate: composes against shapes theme +
    image-library shape-rich themes. Substrate-readiness universal —
    shape attribute description doesn't depend on specific theme
    vocabulary beyond shape-names themselves.

    K-3 multilingual classroom relevance: geometric attribute
    vocabulary (sides, corners, curves, faces, edges) varies across
    locales but maintains a consistent mathematical referent. Cross-
    locale: kids learning shape vocabulary in target language can
    transfer mathematical concepts — sides=lados (es)=Seiten (de)=
    coté (fr)=lati (it)=lados (pt). Cognate-rich vocabulary in this
    domain (Arc 8 Phase 2 cognate-awareness work composes naturally
    here). Productive-language frames ('A triangle has 3 sides and 3
    corners') give structured grammatical practice.

