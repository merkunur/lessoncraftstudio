assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Given three numbers that form a fact family (e.g., 3,
        5, 8), produce all four equations correctly in 7 of
        10 trials.
      - Identify when three numbers form a fact family versus
        when they don't (e.g., {2, 3, 6} doesn't — 2+3≠6) in
        6 of 8 trials.
      - Use the fact-family-triangle visual to recall a
        missing fact when shown three sides of the family in
        6 of 10 trials.
      - Recognize the doubles-family special case (where only
        two equations exist because both addends are the
        same: 4+4=8, 8-4=4) in 4 of 5 trials.

    Differentiation:
    - Pre-K: skip the four-equation production; build addition-
      fact recall within 5 with manipulatives instead.
    - K: introduce fact families within 5 first ({1, 2, 3},
      {2, 3, 5}); fact-family-triangle visual heavily
      scaffolded; only addition equations expected, with
      subtraction added once addition is fluent.
    - Grade 1: full fact families within 10 fluency; all four
      equations expected; triangle visual remains available
      but kids increasingly recall without it.
    - Grade 2+: extend to fact families within 20 (Arc 17 P1.4+
      candidate), then fact families within 100 + the
      multiplication/division fact-family extension (Grade 3+
      candidate). The inverse-operation insight kids meet here
      becomes the multiplication-division fact-family pattern
      later (3 x 4 = 12, 12 ÷ 3 = 4, etc.).

