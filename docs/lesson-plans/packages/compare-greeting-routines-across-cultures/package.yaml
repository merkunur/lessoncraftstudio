compositionalRationale:
  en: |
    Primary strand: early-literacy / multilingual-language-awareness
    (cross-cultural greeting-routine awareness). Secondary strand:
    vocabulary acquisition (vocab-anchored — greeting-words across
    languages: hello / bonjour / hola / konnichiwa / hej / olá).
    Tertiary strand: cultural affirmation + identity-validation
    (home-culture as classroom resource).

    Architectural significance: third multilingual-language-awareness
    strand package (after Arc 6 name-this-object-in-two-languages +
    Arc 8 notice-cognate-word-pairs). Strand depth grows from 2 → 3
    packages with this addition. Operator-strategic Option D ratification
    (2026-05-08): doubling down on multilingual-language-awareness depth
    when the strand has momentum — high marginal architectural value
    for v3 Condition 4 strand-coverage breadth + product differentiation.

    Distinctive composition: emotions theme as pedagogical proxy for
    greeting-context (greetings express emotional warmth; emotions
    vocab supports descriptive language about greeting interactions).
    The package's actual greeting-vocabulary work happens in the
    structure body (warmup + contentActivity surface bilingual greeting
    words across cultures); composedExercises reinforce vocabulary
    base that supports greeting-context discussion.

    Cross-strand integration: connects multilingual-language-awareness
    + emotions vocabulary + cultural-affirmation pedagogy. The package
    is uniquely platform-fit — multilingual K-3 audience CONTAINS
    cross-cultural classrooms where greeting-routine awareness is
    everyday social fabric.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Greeting-routine awareness is theme-agnostic at the cognitive
    level; substrate-readiness universal.

    K-3 multilingual classroom relevance: HIGH. International schools
    + dual-language programs + bilingual European schools all have
    classrooms where kids come from culturally-diverse families. A
    package that EXPLICITLY validates cultural diversity in greeting-
    routines positions home-culture as classroom asset rather than
    obstacle. Cultural-affirmation is research-validated for academic
    achievement in multilingual contexts (Cummins; Garcia + Wei
    translanguaging research).

