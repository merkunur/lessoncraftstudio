compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (target identify-and-name-body-parts).
    Secondary strand: kinesthetic / fine-motor (touch your ___ routine; tracing
    strips for handwriting integration). Tertiary strand: phonics / letter
    recognition (matching letter mode). Mirrors Arc 1 3-strand integration but
    with kinesthetic substitution for counting (counting body parts feels less
    pedagogically natural than counting animals; kinesthetic identification is
    the body-parts-distinctive engagement axis).

    Departure from farm-animals template: replaces manipulative-cut-outs (counting
    prop) with vocabulary-tracing-strips (handwriting prop). Body-parts vocabulary
    integrates better with handwriting practice (single-syllable easy-to-trace
    words) than with counting (kids don't count "5 heads" naturally).

curriculumStandards:
  - EYFS.ELG.UW
  - EYFS.ELG.PD
  - IB-PYP.WhoWeAre

assessmentCriteria:
  en: |
    Receptive 10/10 (touch named body part on own body); productive 8/10 (name
    teacher's pointed-to body part); frame use 6/10 ("This is a {item}").

    Differentiation:
    - Pre-K: receptive only via touch-your-___ routine. Body-parts is appropriate
      Pre-K vocab; many kids enter knowing 4-5 in home language.
    - K / Grade 1: full productive + tracing practice for handwriting integration.
    - Grade 2+: extend to compound body parts (eyebrow, knee, elbow, fingers) +
      possessive ("my hand, your hand").

