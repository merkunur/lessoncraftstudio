# Teaching package — trace curved lines (circles, arcs, S-curves)
# Arc 11 Phase 1 (Path B; fine-motor-and-visual-spatial / drawing-and-
# tracing strand deepening 1/4 → 2/4). RESOLVES Arc 10 trace-straight-
# lines forward-pointer.

targetSlug: trace-curved-lines
language: en
title:
  en: "Tracing Curved Lines — circles, arcs, and S-curves"
description:
  en: "Preschool / Kindergarten fine-motor-and-visual-spatial package teaching curved-line tracing. Builds on Arc 10 trace-straight-lines (foundational straight-line motor work). Kids now practice tracing curved lines: circles, half-circles (arcs), and S-curves. Curved lines are building blocks for letter formation (lowercase letters use curves: a, c, d, e, g, j, o, p, q, s, u, y; uppercase: B, C, D, G, J, O, P, Q, R, S, U). RESOLVES Arc 10 trace-straight-lines forward-pointer ('come back to CURVED lines next'). Vocab-anchored — kids name objects whose names use curve-letters as they trace. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class large-motor-to-fine-motor routine. Teacher leads
      class in tracing curves IN THE AIR with arms — first circles
      (whole), then half-circles (arcs), then S-curves (continuous
      flowing motion). Class follows. "Now we'll trace the same
      curves on paper. Curves need our hand to flow smoothly — not
      straight, not stopping." Reinforces curve-direction
      kinesthetically before pencil work.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + curve-tracing routine. Each kid receives a tracing
      strip with dotted curves (circles + arcs + S-curves) + a thick
      crayon or pencil. Kid traces each curve slowly, trying to stay
      ON the dots while flowing smoothly. Partner verifies. Recast
      errors with explanation ("you stopped mid-curve — let's flow
      smoothly. Trace from START dot through the curve to END dot
      without stopping"). Optional extension: kids progress from
      dotted-line to outline-tracing (lighter guidance) to free-hand.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: vocabulary-tracing-strips with
      curve-letter words (cat, dog, sun, cup — lowercase letters
      using curves). Station 2: alphabet-train worksheet (kids
      identify curve-letters; reinforces letter-shape awareness).
      Station 3: manipulative cut-outs hands-on curve-construction
      (kids assemble paper-cut curves into letter shapes — O = full
      circle; D = straight line + half circle; S = double curve).
      Station 4: matching worksheet (image-name pairs reinforce
      vocab base).
  closure:
    durationMinutes: 5
    body: |
      Whole-class progress-display. Kids share their curve-tracing
      work + identify which curve was hardest (most kids report
      S-curves). Teacher affirms: "S-curves are hardest because they
      change direction in the middle." Forward-pointer: "Today we
      traced curved lines. When we come back to tracing next, we'll
      trace 2D SHAPES — combining straight lines + curves to make
      circles, squares, triangles, and rectangles."

