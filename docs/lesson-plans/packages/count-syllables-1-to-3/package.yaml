compositionalRationale:
  en: |
    Primary strand: early-literacy / phonological-awareness (syllable
    counting). Secondary strand: vocabulary acquisition (vocab-anchored
    — kids practice syllable-counting on familiar vocab). Tertiary
    strand: rhythm + auditory-discrimination (syllable-as-beat is
    fundamentally rhythmic).

    Architectural significance: deepens phonological-awareness strand
    1/9 → 2/9. RESOLVES Arc 10 identify-rhyming-pairs forward-pointer.
    Phonological-awareness is research-validated as strongest predictor
    of early reading success. Strand cohort progressing: rhyme
    (Arc 10) → syllable (this package) → onset-rime + initial-phoneme
    + segment-phonemes (future arcs).

    Distinctive composition: matching + picture-sort + matching +
    word-guess + odd-one-out — multi-app composition spans recognition
    (matching), classification (sort), recall (word-guess), exclusion
    (odd-one-out) on syllable-counting target.

    Class B FLEXIBLE substrate: composes against vocabulary-rich
    image-library themes. Substrate-readiness universal across themes
    that have meaningful syllable-count diversity (animals: cat=1,
    monkey=2, elephant=3; foods: bread=1, banana=3; etc.).

    K-3 multilingual classroom relevance: syllable counting is
    cognitively universal but executed on locale-specific vocabulary.
    Cross-locale syllable patterns vary (Spanish has more open
    syllables; German has consonant-clusters; pt-BR has nasal
    syllables -ão). Locale-variant sparse-overrides handle locale-
    specific syllable inventories.

curriculumStandards:
