# Teaching package — identify the four seasons
# Arc 10 Phase 2 (Option E world-knowledge depth; world-knowledge /
# environment-and-weather strand FIRST package). Class B FLEXIBLE; vocab-
# anchored. Foundational world-knowledge: kids identify spring, summer,
# fall, and winter + name characteristics of each.

targetSlug: identify-four-seasons
language: en
title:
  en: "The Four Seasons — spring, summer, fall, winter"
description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching the four seasons. FIRST environment-and-weather strand package in the catalog. Kids identify each season + name characteristic features (spring → flowers blooming + rain; summer → hot + sunny; fall → leaves changing + harvest; winter → cold + snow). Builds on Arc 8 identify-and-name-weather-words (weather vocabulary as input for season-characteristic descriptions). Vocab-anchored — season names + characteristic vocabulary. Composes against matching + word-guess apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class season-introduction routine. Teacher displays 4 large
      pictures showing characteristic season scenes (spring meadow with
      flowers; summer beach with sun; autumn forest with colorful
      leaves; winter snowy landscape). "What do you see in each
      picture? What season is each one?" Class identifies. Teacher
      writes season names below each picture. Reinforces visual-cue-
      to-season mapping.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + season-sort routine. Each pair receives 12-16 picture
      cards showing seasonal items (umbrella, ice cream, leaf, mitten,
      flower, beach ball, pumpkin, snowman, etc.). Pair sorts cards
      into 4 season piles + names each pile. Recast errors with
      explanation ("you put the umbrella in summer — let's think:
      umbrellas keep us dry from rain. Which season has the most rain?
      Spring! So umbrellas go with spring"). Optional extension: kids
      describe their favorite season + 2-3 reasons why.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (season names
      to characteristic-image pairs). Station 2: picture-sort worksheet
      (kids sort seasonal items into 2 seasons at a time, e.g., summer
      vs winter). Station 3: manipulative cut-outs hands-on season-
      construction (kids assemble season scenes from cut-out items).
      Station 4: word-guess (kids fill in season-related vocabulary
      from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class season-share. Each kid names their favorite season +
      one reason. Teacher creates a class-favorite chart. Forward-
      pointer: "Today we learned about the four seasons. When we come
      back to environment work next, we'll explore the DAY-NIGHT
      cycle — what happens during day and night, and why we have
      both."

