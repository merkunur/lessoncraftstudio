# Teaching package — blend onset and rime into words
# Arc 19 Phase 1.3 Slot 1 (early-literacy / phonological-awareness strand 7/9 → 8/9). Pair-coherent with Phase 1.3 Slot 2 segment-cvc-into-phonemes (phonological-awareness SAT-closing pair). Mid-grain phonological synthesis: kids blend ONSET (initial consonant or consonant-blend of a syllable) + RIME (vowel + final consonants) into a spoken word: /c/ + /at/ → 'cat'; /str/ + /eet/ → 'street'. Cognitively easier than full phoneme-blending (Phase 1.2 Slot 4) because rime is a chunked unit. Prerequisites per learning-targets.json line 36: count-syllables-1-to-3 (Arc 10 P1; ✓ SHIPPED).

targetSlug: blend-onset-rime
language: en
title:
  en: "Blend Onset and Rime — sliding the start with the end"
description:
  en: "Kindergarten early-literacy package teaching kids to BLEND ONSET (initial consonant or consonant-blend of a syllable) + RIME (the rest of the syllable: vowel + any final consonants) into a spoken word. Mid-grain phonological synthesis between syllable-blending + full phoneme-blending: /c/ (onset) + /at/ (rime) → 'cat'; /b/ + /ig/ → 'big'; /str/ + /eet/ → 'street'. Phonological-awareness strand advances 7/9 → 8/9 (pair-coherent with Slot 2 segment-cvc-into-phonemes advancing 8/9 → 9/9 SAT-closing). Per learning-targets.json line 36 prerequisite: count-syllables-1-to-3 (Arc 10 P1 ✓ SHIPPED). Cognitively EASIER than full phoneme-blending (Phase 1.2 Slot 4 blend-phonemes-cvc) because the rime is a CHUNKED UNIT rather than decomposed into individual phonemes; kids who struggle with /c/+/a/+/t/ phoneme-blending often succeed at /c/+/at/ onset-rime-blending. Critical bridge skill for word-family decoding: word families share rimes (cat/hat/bat/mat share /at/; cup/pup share /up/) — kids who blend onset-rime fluently develop word-family-aware decoding strategy. Per §A.13.30 K-1 informal framing: K onset-rime work is CONCRETE SOUND-CHUNK-BLENDING via the slot-and-chunk metaphor (the onset slides into the rime slot). NOT formal syllable-structure theory pedagogy (sonority hierarchy + maximal-onset principle are post-Grade-3 academic work). CCSS.RF.K.2c primary anchor ('Blend and segment onsets and rimes of single-syllable spoken words'). 5 worksheet exercises + 8 printable materials over a 1-week unit. **Phonological-awareness pedagogy is locale-specific — onset-rime structure differs across languages (English CVC-dominant vs pt-BR CV-dominant + open-syllable structure).** Materials list mirrors Phase 1.1+1.2 phonological-awareness cluster Literacy 8-material canonical."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class onset-rime hook. Teacher writes word-family
      sets on the board: CAT — HAT — BAT — MAT. "These words all
      end with -AT. The -AT part is called the RIME. What's
      different at the beginning? C, H, B, M. That's called the
      ONSET — the start sound." Teacher demonstrates blending:
      "I'll say the ONSET, you say the RIME, then we BLEND
      together. /c/.../at/.../c-at/.../CAT/!" Repeats with: "/h/...
      /at/.../h-at/.../HAT/!" "/b/.../at/.../b-at/.../BAT/!"
      Pattern emphasis: "Onset + rime = WORD. The onset is the
      START. The rime is what comes after the start. We BLEND
      them — slide them together." Optional visualization:
      teacher holds one fist forward (onset) + one fist back
      (rime), then claps them together when saying the word.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + onset-rime word-family routine. Each pair
      receives 3 word-family card sets (-AT family: cat/hat/bat/
      mat; -IG family: big/pig/dig/fig; -UN family: sun/run/fun/
      bun). Each card has the onset letter on a small card +
      the rime on a longer card. Pair takes turns: kid A says
      onset; kid B says rime; both say the blended word. "C +
      AT = CAT!" "H + AT = HAT!" Critical pedagogical move:
      START SLOW + SPEED UP. Begin with audible separation
      between onset + rime ('/c/.../at/'); progressively reduce
      the gap until they touch ('/c-at/'); then the word
      emerges ('cat'). Critical pedagogical insight: onset-rime
      blending is the SCAFFOLD that prepares kids for full
      phoneme-blending. Kids who can't yet manage /c/+/a/+/t/
      can often manage /c/+/at/ because the rime is one chunk
      not three. Recast errors with re-modeling — NOT correction
      — because blending strengthens through repetition. Optional
      extension: pair generates NEW words in a family ("if /at/
      is the rime, what other onsets work? /r/ → rat; /f/ →
      fat; /p/ → pat; /s/ → sat; /v/ → vat"). Word-family
      generation surfaces rhyme-family awareness as the natural
      cross-skill bridge from rhyme (Arc 10 identify-rhyming-
      pairs + Phase 1.1 produce-rhyming-words) to phoneme-level
      work.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: word-guess worksheet (kids
      fill in the onset letter given a rime cue + picture).
      Station 2: matching worksheet (onset-letter card → word-
      family rime card; kids match onsets to rimes that form
      real words). Station 3: picture-sort (kids sort pictures
      into word-family groups by shared rime — -at words in one
      group, -ig in another, -un in third). Station 4: word-
      scramble (kids unscramble CVC words where the onset +
      rime structure is highlighted).
  closure:
    durationMinutes: 5
    body: |
      Whole-class onset-rime quick-recall + word-family
      generation. Teacher gives an onset + rime; class shouts
      the blended word. "/r/ + /at/" → RAT! "/p/ + /ig/" → PIG!
      "/s/ + /un/" → SUN! "/m/ + /at/" → MAT! Teacher closes:
      "Onset + rime is the MIDDLE-STEP between syllable-counting
      and full phoneme-blending. We've added one more
      phonological skill: blending at the onset-rime level.
      That's 4 of the 9 phonological-awareness skills we've
      learned this year — rhyme (Arc 10 + Phase 1.1) + syllable
      (Arc 10) + phoneme-isolation (Phase 1.1+1.2) + phoneme-
      blending (Phase 1.2) + onset-rime blending (today). Just
      ONE MORE skill to go — segmenting words into phonemes —
      and then we'll have ALL the phonological-awareness
      skills." Forward-pointer: "Tomorrow we'll learn the
      LAST phonological-awareness skill: SEGMENTING words. If
      blending puts sounds TOGETHER, segmenting pulls them
      APART. After tomorrow we'll have completed the FULL
      phonological-awareness strand!"

