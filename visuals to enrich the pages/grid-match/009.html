<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Raster-Puzzle - Bilderschatz</title>
</head>
<body style="margin:0;padding:0;width:1000px;height:1000px;overflow:hidden;font-family:'Nunito',sans-serif;">
    <div style="width:1000px;height:1000px;position:relative;background:linear-gradient(160deg,#EFEBE9 0%,#D7CCC8 40%,#BCAAA4 100%);overflow:hidden;">

        <!-- Aged paper texture (faded grid lines) -->
        <div style="position:absolute;inset:0;opacity:0.07;background-image:repeating-linear-gradient(0deg,transparent,transparent 40px,#8D6E63 40px,#8D6E63 41px),repeating-linear-gradient(90deg,transparent,transparent 40px,#8D6E63 40px,#8D6E63 41px);"></div>

        <!-- Parchment aging vignette -->
        <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(141,110,99,0.18) 100%);"></div>

        <!-- SVG dotted trail path winding through canvas -->
        <svg style="position:absolute;inset:0;width:1000px;height:1000px;z-index:5;" viewBox="0 0 1000 1000">
            <path d="M80,200 Q200,300 300,250 T500,400 T700,350 T920,480 Q870,620 720,680 T500,730 T280,790" stroke="#C62828" stroke-width="4" stroke-dasharray="12,12" fill="none" opacity="0.25"/>
        </svg>

        <!-- GRATIS badge: Wax seal style -->
        <div style="position:absolute;top:18px;left:24px;z-index:100;">
            <div style="width:100px;height:100px;background:radial-gradient(circle at 45% 40%,#E53935 0%,#C62828 50%,#8E0000 100%);border-radius:50%;box-shadow:0 6px 20px rgba(198,40,40,0.5),inset 0 -3px 8px rgba(0,0,0,0.2),inset 0 3px 6px rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;transform:rotate(-5deg);border:3px solid #8E0000;">
                <!-- Scalloped edge -->
                <div style="position:absolute;inset:-7px;border-radius:50%;border:4px dotted rgba(142,0,0,0.35);"></div>
                <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;color:#FFCDD2;text-shadow:1px 1px 3px rgba(0,0,0,0.4);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position:absolute;top:32px;right:32px;background:rgba(255,255,255,0.92);padding:10px 20px;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,0.12);border:3px solid #FFC107;z-index:100;">
            <span style="font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;color:#1A237E;letter-spacing:1px;">KLASSE K-2</span>
        </div>

        <!-- Title -->
        <div style="position:absolute;top:88px;left:0;right:0;text-align:center;z-index:40;">
            <h1 style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:64px;color:#1A237E;margin:0;text-shadow:2px 2px 0 rgba(26,35,126,0.08);">RASTER-PUZZLE</h1>
            <h2 style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:48px;color:#C62828;margin:4px 0 0 0;text-shadow:0 0 30px rgba(255,193,7,0.25),2px 2px 0 rgba(198,40,40,0.1);">Bilderschatz</h2>
        </div>

        <!-- Center: Sample 5 (Pig, portrait) in gold treasure chest frame -->
        <div style="position:absolute;left:50%;top:285px;transform:translateX(-50%);z-index:20;">
            <!-- Gold frame -->
            <div style="position:relative;padding:10px;background:linear-gradient(145deg,#FFD54F,#FFC107,#FF8F00);border-radius:14px;box-shadow:0 15px 45px rgba(255,193,7,0.35),0 5px 20px rgba(0,0,0,0.2);">
                <!-- Latch detail on top -->
                <div style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:38px;height:18px;background:linear-gradient(180deg,#FF8F00,#E65100);border-radius:9px 9px 4px 4px;box-shadow:0 2px 6px rgba(0,0,0,0.3);border:2px solid #FFD54F;"></div>
                <!-- Corner rivets -->
                <div style="position:absolute;top:6px;left:6px;width:14px;height:14px;background:radial-gradient(circle at 40% 35%,#FFE082,#FF8F00);border-radius:50%;box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3);"></div>
                <div style="position:absolute;top:6px;right:6px;width:14px;height:14px;background:radial-gradient(circle at 40% 35%,#FFE082,#FF8F00);border-radius:50%;box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3);"></div>
                <div style="position:absolute;bottom:6px;left:6px;width:14px;height:14px;background:radial-gradient(circle at 40% 35%,#FFE082,#FF8F00);border-radius:50%;box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3);"></div>
                <div style="position:absolute;bottom:6px;right:6px;width:14px;height:14px;background:radial-gradient(circle at 40% 35%,#FFE082,#FF8F00);border-radius:50%;box-shadow:inset 0 -1px 2px rgba(0,0,0,0.3);"></div>
                <img src="https://www.lessoncraftstudio.com/samples/german/grid%20match/sample-5.jpeg" style="width:220px;height:285px;object-fit:cover;border-radius:8px;display:block;">
            </div>
        </div>

        <!-- Left flanking: Sample 3 (Panda, landscape) as map fragment -->
        <div style="position:absolute;left:45px;top:355px;transform:rotate(-6deg);z-index:10;">
            <!-- X marks the spot -->
            <div style="position:absolute;top:-30px;left:50%;transform:translateX(-50%);z-index:5;">
                <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:38px;color:#C62828;text-shadow:2px 2px 4px rgba(0,0,0,0.15);">X</span>
            </div>
            <div style="width:225px;height:174px;background:white;border-radius:6px;box-shadow:0 8px 25px rgba(0,0,0,0.2);border:4px solid #D7CCC8;overflow:hidden;position:relative;">
                <img src="https://www.lessoncraftstudio.com/samples/german/grid%20match/sample-3.jpeg" style="width:100%;height:100%;object-fit:cover;" alt="Panda Raster-Puzzle">
                <!-- Aged overlay -->
                <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(215,204,200,0.12),transparent);"></div>
            </div>
        </div>

        <!-- Right flanking: Sample 4 (Elephant, landscape) as map fragment -->
        <div style="position:absolute;right:45px;top:335px;transform:rotate(5deg);z-index:10;">
            <!-- X marks the spot -->
            <div style="position:absolute;top:-30px;left:50%;transform:translateX(-50%);z-index:5;">
                <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:38px;color:#C62828;text-shadow:2px 2px 4px rgba(0,0,0,0.15);">X</span>
            </div>
            <div style="width:225px;height:174px;background:white;border-radius:6px;box-shadow:0 8px 25px rgba(0,0,0,0.2);border:4px solid #D7CCC8;overflow:hidden;position:relative;">
                <img src="https://www.lessoncraftstudio.com/samples/german/grid%20match/sample-4.jpeg" style="width:100%;height:100%;object-fit:cover;" alt="Elefant Raster-Puzzle">
                <div style="position:absolute;inset:0;background:linear-gradient(225deg,rgba(215,204,200,0.12),transparent);"></div>
            </div>
        </div>

        <!-- Gold coin circles scattered -->
        <div style="position:absolute;top:305px;left:175px;width:20px;height:20px;background:radial-gradient(circle at 40% 35%,#FFE082,#FFC107,#FF8F00);border-radius:50%;box-shadow:0 3px 8px rgba(255,193,7,0.4);border:2px solid #FFD54F;z-index:6;"></div>
        <div style="position:absolute;top:570px;right:175px;width:16px;height:16px;background:radial-gradient(circle at 40% 35%,#FFE082,#FFC107,#FF8F00);border-radius:50%;box-shadow:0 3px 8px rgba(255,193,7,0.4);border:2px solid #FFD54F;z-index:6;"></div>
        <div style="position:absolute;top:440px;left:295px;width:14px;height:14px;background:radial-gradient(circle at 40% 35%,#FFE082,#FFC107,#FF8F00);border-radius:50%;box-shadow:0 3px 8px rgba(255,193,7,0.4);border:2px solid #FFD54F;z-index:6;"></div>
        <div style="position:absolute;bottom:260px;right:295px;width:18px;height:18px;background:radial-gradient(circle at 40% 35%,#FFE082,#FFC107,#FF8F00);border-radius:50%;box-shadow:0 3px 8px rgba(255,193,7,0.4);border:2px solid #FFD54F;z-index:6;"></div>
        <div style="position:absolute;bottom:310px;left:115px;width:15px;height:15px;background:radial-gradient(circle at 40% 35%,#FFE082,#FFC107,#FF8F00);border-radius:50%;box-shadow:0 3px 8px rgba(255,193,7,0.4);border:2px solid #FFD54F;z-index:6;"></div>

        <!-- Banner with ribbon ends -->
        <div style="position:absolute;bottom:115px;left:50%;transform:translateX(-50%);z-index:40;">
            <div style="position:relative;">
                <!-- Left ribbon tail -->
                <div style="position:absolute;left:-22px;top:4px;width:0;height:0;border-top:23px solid #00838F;border-bottom:23px solid #00838F;border-left:22px solid transparent;"></div>
                <!-- Right ribbon tail -->
                <div style="position:absolute;right:-22px;top:4px;width:0;height:0;border-top:23px solid #00838F;border-bottom:23px solid #00838F;border-right:22px solid transparent;"></div>
                <div style="background:linear-gradient(90deg,#00897B,#00695C);padding:14px 42px;border-radius:4px;box-shadow:0 6px 20px rgba(0,131,143,0.35);">
                    <span style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:25px;color:white;text-shadow:1px 2px 3px rgba(0,0,0,0.2);">Welches Tier versteckt sich hier?</span>
                </div>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position:absolute;bottom:35px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:40;">
            <div style="background:white;padding:12px 20px;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,0.1);border:3px solid #00838F;">
                <span style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#00838F;">Entdecke &amp; puzzele</span>
            </div>
            <div style="background:white;padding:12px 20px;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,0.1);border:3px solid #FFC107;">
                <span style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#F9A825;">L&ouml;sungen dabei</span>
            </div>
            <div style="background:white;padding:12px 20px;border-radius:26px;box-shadow:0 4px 14px rgba(0,0,0,0.1);border:3px solid #C62828;">
                <span style="font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:#C62828;">3x3 &amp; 4x4 Raster</span>
            </div>
        </div>

    </div>
</body>
</html>
