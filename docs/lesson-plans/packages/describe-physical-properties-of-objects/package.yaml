# Teaching package — describe physical properties of objects
# Arc 15 Phase 4 (science / materials-and-properties 1/2 → 2/2 SATURATE).
# 15th saturated strand at Arc 15 close.

targetSlug: describe-physical-properties-of-objects
language: en
title:
  en: "Properties of Objects — hard or soft, smooth or rough, big or small"
description:
  en: "Kindergarten / Grade 1 science package teaching kids to describe physical properties of objects using sensory + measurable attributes: hard/soft, smooth/rough, transparent/opaque, flexible/rigid, heavy/light, large/small. Builds on Arc 15 Phase 2 identify-natural-and-manmade-materials foundation. Saturating package for materials-and-properties strand at 2/2 — 15th saturated strand on the platform. Critical bridge from material-SOURCE classification (natural/manmade) to material-PROPERTY analysis (multi-attribute descriptive vocabulary). Foundation for later matter-state classification (solid/liquid/gas) + scientific-inquiry investigations. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + properties introduction. Teacher displays
      6 contrasting object pairs: rock vs sponge (hard/soft);
      sandpaper vs silk (rough/smooth); window vs wood (transparent/
      opaque); rubber band vs stick (flexible/rigid); bowling ball
      vs feather (heavy/light); elephant photo vs ant photo (big/
      small). "Today we describe PROPERTIES — how things FEEL,
      LOOK, or are SIZED. Same object can have many properties!"
      Teacher demonstrates: "This stone is HARD + ROUGH + HEAVY +
      OPAQUE. Many properties at once!" Class chants property
      pairs. Visual + tactile + vocabulary anchor for property
      description.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + property-description routine. Each pair receives
      8 object cards + a property-checklist worksheet. Pair takes
      turns: kid A picks an object card; kid B describes 2-3
      properties ("the apple is round + smooth + medium-sized").
      Recast errors with property-prompt ("you said the bowling
      ball is small. Compare it to a marble — which is BIGGER?
      Bowling ball is BIGGER than marble, so we say HEAVY or LARGE,
      not small."). Differentiate by complexity: Pre-K kids name
      1 property per object; K-1 kids name 2-3 properties.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (sort
      objects into property-categories: HARD bin + SOFT bin).
      Station 2: matching worksheet (object to property-pair
      label). Station 3: odd-one-out worksheet (find the SOFT
      item in a group of HARD items; or vice versa). Station 4:
      vocabulary-tracing-strips for property vocabulary (hard,
      soft, smooth, rough, transparent, opaque, flexible, rigid,
      heavy, light).
  closure:
    durationMinutes: 5
    body: |
      Whole-class properties review. Teacher displays new objects;
      class collectively describes properties for each. "Sponge —
      SOFT + LIGHT + SQUISHY! Glass cup — HARD + SMOOTH +
      TRANSPARENT + FRAGILE!" Forward-pointer: "Today we described
      object PROPERTIES. When we come back next, we can sort
      MATTER by STATE — SOLID (like a rock), LIQUID (like water),
      and GAS (like air) — three states of matter that we'll
      explore next!"

