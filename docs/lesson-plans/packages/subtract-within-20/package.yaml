# Teaching package — subtract within 20
# Arc 15 Phase 1 (math / addition-subtraction +1; extends Arc 14 Phase 4's subtract-within-5/10).

targetSlug: subtract-within-20
language: en
title:
  en: "Subtract Within 20 — taking away bigger numbers"
description:
  en: "Grade 1 / Grade 2 math package teaching kids to subtract numbers within 20 (15-7=8, 18-6=12, 20-13=7, etc.). Builds on Arc 14 Phase 4 subtract-within-5 + subtract-within-10 + Arc 12 add-within-20 foundation. Extends subtraction work from within-10 range to within-20 range. Critical bridge from mental subtraction (within 10) to two-digit subtraction (within 20 introduces 'borrowing' / 'regrouping' conceptual foundation when minuend has 1 in tens place and subtrahend exceeds ones place). Completes the basic subtraction sequence (5 → 10 → 20). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + within-20 subtraction introduction.
      Teacher displays a number line 1-20. "Today we subtract
      BIGGER numbers — within 20. Let's start with 15-7. We
      START at 15 on the number line + COUNT BACK 7 jumps."
      Teacher draws 7 arc-jumps on the number line. "15-14-13-
      12-11-10-9-8. We land on 8. So 15-7=8." Class repeats
      with 3-4 problems (18-6, 16-9, 20-13, 17-5). Teacher
      introduces strategy variations: count-back; decompose
      ("15-7: take away 5 first to get 10, then 2 more = 8");
      use-known-facts ("15-7? I know 7+8=15, so 15-7=8").
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + subtraction routine. Each pair receives a
      worksheet with 6 subtraction problems within 20 (15-7,
      18-6, 16-9, 20-13, 17-5, 14-8). Pair takes turns: kid A
      reads problem; kid B chooses strategy (number-line / count-
      back / decomposition / use-known-facts) + computes answer.
      Recast errors with strategy-demo ("18-6 — let's try
      decomposition: take away 6 in two steps. 18-3=15, 15-3=12.
      So 18-6=12."). Different strategies introduced
      progressively; kids choose strategies that work for them.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: subtraction worksheet (cross-
      out method within 20 — visual countables). Station 2:
      math-worksheet (vertical subtraction within 20; no
      regrouping yet — borrowing introduced gently). Station 3:
      math-puzzle (find missing operand: 15-?=8; ?-7=12).
      Station 4: more-less worksheet (compare 2 subtraction
      results: which is greater, 18-9 or 17-7?).
  closure:
    durationMinutes: 5
    body: |
      Whole-class within-20 subtraction quiz. Teacher presents 5
      fast subtraction problems; class collectively answers using
      preferred strategy. "20-5? 18-9? 15-6? 17-10? 19-12?"
      Forward-pointer: "Today we subtracted within 20. When we
      come back next, we'll learn DOUBLE-DIGIT subtraction (25-13,
      48-29) where we sometimes need to BORROW from the tens
      place — and add-and-subtract together in mixed problems!"

