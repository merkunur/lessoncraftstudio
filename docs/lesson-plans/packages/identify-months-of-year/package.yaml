# Teaching package — identify the 12 months of the year
# Arc 12 Phase 1 (world-knowledge / time-and-routine 1/4 → 2/4 — closes
# last single-package strand from Arc 11). RESOLVES Arc 10 forward-pointer.

targetSlug: identify-months-of-year
language: en
title:
  en: "Months of the Year — January through December"
description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching the 12 months in sequence. Builds on Arc 10 identify-days-of-week (time-and-routine strand foundation). RESOLVES Arc 10 forward-pointer ('learn the MONTHS of the year — 12 months that together make one whole year'). Closes the last single-package strand from Arc 11 close (time-and-routine 1/4 → 2/4). Foundational time-vocabulary connecting daily classroom routines to yearly calendar work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class month-chant routine. Teacher and class chant the 12
      months in sequence: January, February, March, April, May, June,
      July, August, September, October, November, December. Repeat
      3-4 times. Teacher displays a year-calendar with 12 month
      blocks; class identifies their birthday-month + favorite-season-
      months. Reinforces month-name sequence + month-as-marker-of-
      seasonal-calendar.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + month-sequence routine. Each pair receives 12 month-
      name cards in shuffled order. Pair arranges cards in correct
      sequence (January → December). Teacher narrates as kids work.
      Recast errors with explanation. Optional extension: kids
      identify which months belong to which season (winter: Dec-Feb;
      spring: Mar-May; summer: Jun-Aug; fall: Sep-Nov for Northern
      Hemisphere; reverse for Southern). Connects to Arc 10
      identify-four-seasons.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (month name to
      month-icon image). Station 2: word-scramble (kids unscramble
      month names; reinforces spelling). Station 3: manipulative cut-
      outs hands-on month-sequence construction (kids build year-
      calendar with cut-out month strips). Station 4: word-guess
      (kids fill in month-name letters from picture clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class month-quiz routine. Teacher names a month; class
      names the month BEFORE and AFTER (e.g., "March" → "February
      before, April after"). Forward-pointer: "Today we learned the
      MONTHS. When we come back to time-words next, we'll connect
      months to SEASONS — which months are warmest, which are
      coldest — building the full yearly cycle."

