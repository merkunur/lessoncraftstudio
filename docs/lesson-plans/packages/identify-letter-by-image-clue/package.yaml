# Teaching package — identify letters from image clues
# Arc 9 Phase 1 (Path B; early-literacy / letter-recognition strand FIRST
# package). Class B FLEXIBLE; vocab-anchored. Foundational pre-reading
# skill: kids see an image (e.g., apple) and identify the initial letter
# (A). Builds on Arc 1+5+6+8 vocabulary-acquisition work — kids transition
# from object-naming to letter-recognition mediated by familiar vocabulary.

targetSlug: identify-letter-by-image-clue
language: en
title:
  en: "Letters from Pictures — find the letter that starts the word"
description:
  en: "Kindergarten early-literacy package teaching letter-recognition via image clues. FIRST letter-recognition strand package in the catalog. Foundational pre-reading skill: kids see a familiar object (apple) + identify the initial letter (A). Builds on Arc 1+5+6+8 vocabulary work — kids transition from object-naming to letter-name + letter-sound association mediated by familiar vocabulary. Vocab-anchored throughout: kids name objects + identify initial letters simultaneously. Composes against alphabet-train + matching apps. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class initial-letter routine. Teacher displays a picture of
      an apple. "What does this picture show?" Class names: "Apple."
      "What letter does APPLE start with?" Class identifies: "A."
      Teacher writes A on the board. Repeat with 5-6 picture-letter
      pairs across familiar themes (banana → B; cat → C; dog → D).
      Reinforces image-as-clue framing — kids use vocabulary they
      already know to access letter knowledge.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + image-and-letter routine. Each pair receives 8-10
      picture cards + an alphabet strip. Pair takes turns: kid A holds
      up a picture; kid B names the picture AND identifies the initial
      letter on the alphabet strip. Recast errors with explanation
      ("you said BIRD starts with D — let's say it slowly: B-bird —
      what's the first sound? B! So bird starts with B"). Optional
      extension: kids sort their pictures by initial letter into A,
      B, C, D, E groups.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: alphabet-train worksheet (kids
      identify initial letters of pictures; reinforces image-letter
      mapping). Station 2: matching worksheet (image-name pairs;
      reinforces vocabulary that letter-recognition depends on).
      Station 3: word-guess (kids fill in initial letters from picture
      clues). Station 4: vocabulary-tracing-strips (kids trace letters
      of words they've named).
  closure:
    durationMinutes: 5
    body: |
      Whole-class share. Teacher displays 5-6 pictures; class
      collectively names each + identifies initial letters chorally.
      Forward-pointer: "Today we found letters at the START of words.
      When we come back to letters next, we'll find letters at the
      END of words — and in the MIDDLE — building toward reading
      whole words letter by letter."

