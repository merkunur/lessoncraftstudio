  - EYFS.ELG.CL
  - IB-PYP.HowWeExpressOurselves

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Count syllables in 8 of 10 1-3-syllable words by clapping.
      - Sort 12 pictures by syllable count (1, 2, or 3) in 7 of 10
        attempts.
      - Articulate syllable-as-beat principle ('I clap once for cat
        because it has one syllable') in 6 of 10 trials.

    Differentiation:
    - Pre-K: 1-2 syllable words only; clap with teacher.
    - K: 1-3 syllable words; independent clapping.
    - Grade 1+: extend to 4+ syllable words + bridge to phoneme-
      segmentation (blend-onset-rime Arc 12+ candidate).

