# Teaching package — sort by multiple attributes (color AND shape)
# Arc 8 Phase 1 (Path B; cognitive-and-executive-function / sorting strand).
# Class B FLEXIBLE; vocab-anchored. Builds on Arc 5+7 basic-attribute trilogy
# (sort-by-color + sort-by-shape + sort-by-size — single-attribute sorting).
# Multi-attribute sorting: kids hold 2 attributes in mind simultaneously
# (e.g., "red AND round" vs "red AND square"). Grade 1+ working-memory load.

targetSlug: sort-by-multiple-attributes
language: en
title:
  en: "Sort by Multiple Attributes — group by color AND shape together"
description:
  en: "Grade 1+ cognitive-and-executive-function package teaching multi-attribute sorting. Builds on the basic-attribute trilogy (sort-by-color + sort-by-shape + sort-by-size from Arc 5+7) — kids now sort by 2 attributes simultaneously. Working-memory progression: holding 2 sort criteria in mind while categorizing requires meaningful executive-function load. Vocab-anchored — color + shape vocabulary reinforced through dual-attribute reasoning. Resolves sort-by-color's forward-pointer to multi-attribute work. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher places 8 paper-cuts on the carpet
      that vary along TWO attributes: color (red vs blue) + shape
      (circle vs square). 4 buckets: red-circle / red-square / blue-
      circle / blue-square. Teacher demonstrates: "I'll sort by COLOR
      first — reds here, blues here. Now I'll sort each color pile by
      SHAPE — circles in one bucket, squares in another." Class
      observes the 2-step sorting process. Reinforces multi-attribute
      framing — kids see that sorting by 2 attributes means TWO
      decisions per item.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine. Teacher displays 8-10 multi-attribute items;
      class collaboratively sorts into 4 buckets defined by 2 attributes.
      Pair work: kid A picks 2 attributes (e.g., color + size); sets up
      4 buckets; kid B sorts items into the correct bucket. Recast
      errors with explanation ("you put the small-red apple in the
      large-red bucket — let's check both attributes: it's RED yes, but
      is it LARGE? No — it's SMALL. So it goes in small-red"). Optional
      extension: kids construct their own 2-attribute sorting puzzles.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (single-
      attribute sort as warm-up bridge from Arc 5/7 trilogy). Station 2:
      picture-sort worksheet with custom-words (kids construct
      multi-attribute bucket labels via custom words). Station 3:
      manipulative cut-outs hands-on multi-attribute sort (kids place
      items into 4 buckets defined by 2 attributes; partner verifies).
      Station 4: matching worksheet (image-name reinforces shape +
      color vocabulary that the multi-attribute sort relies on).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays 4 buckets defined by
      2 attributes; class collectively sorts a final set of items.
      Forward-pointer: "Today we sorted by 2 attributes at once. When
      we come back to sorting next, we'll sort by 3 attributes — color
      AND shape AND size — even more decisions per item."

