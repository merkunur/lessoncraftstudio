<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1000, height=1000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1000px;
    height: 1000px;
    overflow: hidden;
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(180deg, #FFF3E0 0%, #FFE0B2 50%, #FFCC80 100%);
    position: relative;
  }

  /* GRATIS badge */
  .gratis {
    position: absolute;
    top: 22px;
    left: 22px;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(145deg, #F43F5E 0%, #E11D48 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 28px;
    color: white;
    z-index: 20;
    box-shadow: 0 6px 25px rgba(244, 63, 94, 0.5);
    transform: rotate(-8deg);
    border: 3px solid rgba(255, 255, 255, 0.3);
  }

  /* Title */
  .title-area {
    position: absolute;
    top: 30px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 15;
  }
  .title {
    font-size: 68px;
    font-weight: 700;
    color: #BF360C;
    text-shadow: 0 3px 12px rgba(191, 54, 12, 0.2);
    letter-spacing: 2px;
    line-height: 1;
  }
  .subtitle {
    font-family: 'Nunito', sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: #E65100;
    margin-top: 6px;
    letter-spacing: 0.5px;
  }

  /* Cork board */
  .cork-board {
    position: absolute;
    top: 155px;
    left: 55px;
    right: 55px;
    height: 560px;
    background: linear-gradient(145deg, #D4A574, #C48B5C);
    background-image: repeating-radial-gradient(circle at 10px 10px, transparent 0, transparent 3px, rgba(0,0,0,0.03) 3px, rgba(0,0,0,0.03) 4px);
    border-radius: 8px;
    border: 12px solid #8B5E3C;
    box-shadow: inset 0 2px 15px rgba(0,0,0,0.15), 0 8px 30px rgba(0,0,0,0.2);
    z-index: 5;
    overflow: visible;
  }
  /* Wood frame highlight */
  .cork-board::before {
    content: '';
    position: absolute;
    top: -12px;
    left: -12px;
    right: -12px;
    height: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent);
    border-radius: 8px 8px 0 0;
  }

  /* Pinned worksheets */
  .pinned-ws {
    position: absolute;
    background: white;
    border-radius: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    overflow: hidden;
    padding: 6px;
  }
  .pinned-ws img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 3px;
  }
  .ws1 { left: 28px; top: 40px; width: 230px; height: 298px; }
  .ws2 { left: 290px; top: 30px; width: 240px; height: 310px; }
  .ws3 { left: 565px; top: 40px; width: 230px; height: 298px; }

  /* CSS Pushpins */
  .pushpin {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 -2px 4px rgba(0,0,0,0.2), inset 0 2px 4px rgba(255,255,255,0.4);
  }
  .pin1 { top: 30px; left: 130px; background: linear-gradient(145deg, #F44336, #C62828); }
  .pin2 { top: 20px; left: 398px; background: linear-gradient(145deg, #4CAF50, #2E7D32); }
  .pin3 { top: 30px; left: 667px; background: linear-gradient(145deg, #2196F3, #1565C0); }
  /* Pin needle */
  .pushpin::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 6px;
    background: #999;
    border-radius: 0 0 2px 2px;
  }

  /* Sticky notes - these CAN rotate since they're decorative, not worksheets */
  .sticky {
    position: absolute;
    width: 100px;
    height: 90px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 17px;
    z-index: 8;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  .sticky-tiere {
    background: #FFF9C4;
    color: #F57F17;
    top: 360px;
    left: 35px;
    transform: rotate(-4deg);
  }
  .sticky-essen {
    background: #C8E6C9;
    color: #2E7D32;
    top: 375px;
    left: 318px;
    transform: rotate(3deg);
  }
  .sticky-insekten {
    background: #BBDEFB;
    color: #1565C0;
    top: 360px;
    left: 580px;
    transform: rotate(-2deg);
  }
  .sticky-fahrzeuge {
    background: #F8BBD0;
    color: #C2185B;
    bottom: 15px;
    right: 40px;
    transform: rotate(5deg);
    width: 110px;
  }

  /* Sticky note curl effect */
  .sticky::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 20px;
    height: 20px;
    background: linear-gradient(225deg, rgba(0,0,0,0.06) 0%, transparent 60%);
  }

  /* Pills */
  .pills {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
    white-space: nowrap;
  }
  .pill {
    background: linear-gradient(135deg, #FF6D00, #FF8F00);
    border-radius: 20px;
    padding: 8px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    color: white;
    box-shadow: 0 3px 10px rgba(255, 109, 0, 0.3);
  }

  /* Tagline */
  .tagline {
    position: absolute;
    bottom: 35px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 10;
  }
  .tagline span {
    font-family: 'Nunito', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #BF360C;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<!-- GRATIS badge -->
<div class="gratis">GRATIS</div>

<!-- Title -->
<div class="title-area">
  <div class="title">WIMMEL-WERKSTATT</div>
  <div class="subtitle">Entdecke die bunte Suchwelt!</div>
</div>

<!-- Cork board -->
<div class="cork-board">
  <!-- Pinned worksheets (NO rotation!) -->
  <div class="pinned-ws ws1">
    <img src="https://www.lessoncraftstudio.com/samples/german/find%20and%20count/sample-1.jpeg" alt="Suchbild Arbeitsblatt 1">
  </div>
  <div class="pinned-ws ws2">
    <img src="https://www.lessoncraftstudio.com/samples/german/find%20and%20count/sample-3.jpeg" alt="Suchbild Arbeitsblatt 3">
  </div>
  <div class="pinned-ws ws3">
    <img src="https://www.lessoncraftstudio.com/samples/german/find%20and%20count/sample-5.jpeg" alt="Suchbild Arbeitsblatt 5">
  </div>

  <!-- Pushpins -->
  <div class="pushpin pin1"></div>
  <div class="pushpin pin2"></div>
  <div class="pushpin pin3"></div>

  <!-- Sticky notes (decorative - rotation OK) -->
  <div class="sticky sticky-tiere">Tiere</div>
  <div class="sticky sticky-essen">Essen</div>
  <div class="sticky sticky-insekten">Insekten</div>
  <div class="sticky sticky-fahrzeuge">Fahrzeuge</div>
</div>

<!-- Pills -->
<div class="pills">
  <div class="pill">Bunte Themen</div>
  <div class="pill">Zählen & Suchen</div>
  <div class="pill">Lösungsblätter</div>
  <div class="pill">Sofort drucken</div>
</div>

<!-- Tagline -->
<div class="tagline">
  <span>Suchspaß für jedes Thema!</span>
</div>

</body>
</html>
