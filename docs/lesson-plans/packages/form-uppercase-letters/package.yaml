assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Trace 20 of 26 uppercase letters recognizably on
        the dotted-line template in 8 of 10 trials.
      - Independently form 15 of 26 uppercase letters
        recognizably (not perfectly — recognizably) in 7
        of 10 trials.
      - Use vocabulary 'trace' / 'write' / 'letter' /
        'shape' correctly in 6 of 10 productive-language
        trials.
      - Pencil-grip + paper-position stable for 5+
        minutes of continuous handwriting work in 4 of 5
        sessions.

    Differentiation:
    - Pre-K: skip independent formation; tracing-only
      work on 8-10 most-frequent letters (vowels +
      AEIOU + common consonants BCDMNST). Pencil-grip
      development is the primary motor goal.
    - K: full 26-letter tracing fluency; independent
      formation on the most-frequent 13 letters
      (AEIOUBCDMNSTR — the most commonly-used uppercase
      in K texts).
    - Grade 1: full 26-letter independent formation
      fluency; recognizability the load-bearing goal
      (not calligraphic perfection).
    - Grade 2+: brief reinforcement + bridge to form-
      lowercase-letters (Arc 18+ candidate) + form-
      numerals-0-to-10. By Grade 2 most kids transition
      to print-write fluency and the dotted-template
      scaffolding falls away.

