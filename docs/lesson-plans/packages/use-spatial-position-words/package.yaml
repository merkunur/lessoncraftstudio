compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (extended preposition set;
    closed-class function-word lexicon). Secondary strand: spatial-
    reasoning (kids extend the 4-preposition core from use-position-
    vocabulary to the 8-preposition extended set). Tertiary strand:
    language-frame production (sentence frames using extended
    prepositions).

    Pairing pattern with foundational package: use-position-vocabulary
    (Arc 5 Phase 2) provides the 4-preposition core (in/on/under/next-to);
    this Phase 1 package extends to 8 prepositions adding between/behind/
    in-front-of/above. Sequential prereq-chain: kids who learned the
    core 4 in Arc 5 are immediately ready for the extended 4 in Arc 6.

    Distinctive composition vs use-position-vocabulary: 4 of 5 composed
    exercises use the prepositions app (vs Arc 5 Phase 2's 3 of 5) —
    higher app-density reflects the extended-vocabulary scope; kids
    practice with all 8 prepositions across multiple worksheet sessions.
    Two prepositions in different modes (multiplechoice for introduction;
    fillin for production) reflect receptive-then-productive teaching arc.

    Materials note: flashcards has empty vocabKeys (consistent with use-
    position-vocabulary; prepositions are abstract function words).
    Sentence-strips at materials 3 + 4 use 16-strip count to cover
    multiple example scenes per preposition (8 prepositions × 2 example
    scenes each = 16 strips).

    Cross-strand integration: extended preposition vocabulary supports
    follow-directions-on-grid + navigate-simple-maze (fine-motor /
    spatial-reasoning) work in future arcs — kids who understand BEHIND
    and BETWEEN can follow more complex directional language.

    K-3 multilingual classroom relevance: prepositions are language-
    specific in their syntax (English "between," German "zwischen,"
    Spanish "entre" — different morphology + word-position rules). The
    package uses the existing prepositions app's 11-locale rendering;
    operator-side instruction language sets the rendered output. Per
    CLAUDE.md §17.5 NSR-flag posture, locale-specific preposition
    register may need native-speaker review at launch — particularly
    for the extended set where less-frequent prepositions have more
    locale-variation.

