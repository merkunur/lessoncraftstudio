# Teaching package — identify place value (hundreds, tens, ones for 100-999)
# Arc 16 Phase 1.1 (math / place-value 3/8 → 4/8). Extends Arc 15 Phase 4 tens-and-ones-51-to-100 to three-digit place-value range.

targetSlug: identify-place-value-hundreds
language: en
title:
  en: "Identifying Place Value to 999 — hundreds, tens, and ones"

description:
  en: "Grade 2 math package teaching three-digit place-value: hundreds, tens, and ones for numbers 100-999. Examples: 347 = 3 hundreds + 4 tens + 7 ones; 805 = 8 hundreds + 0 tens + 5 ones; 999 = 9 hundreds + 9 tens + 9 ones. Builds directly on Arc 15 Phase 4 tens-and-ones-51-to-100 (which previewed 100 = 10 tens OR 1 hundred). Critical extension from two-digit to three-digit place-value range. Establishes the place-value pattern that scales to four-digit + larger numbers (always: hundreds-tens-ones reading left-to-right). Foundation for three-digit addition + subtraction with regrouping (Arc 17+ candidate). Zero-in-middle-or-end edge cases (805, 720, 600) emphasized — kids often skip the zero or miscount the place. Place-value strand: 3/8 → 4/8 at this Phase 1.1 close. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + three-digit place-value introduction.
      Teacher displays 347 single-counters (impractical-many)
      then groups them as 3 BUNDLES-OF-100 (each bundle = 10
      ten-sticks bundled) + 4 LOOSE TEN-STICKS + 7 LOOSE COUNTERS.
      "We finished tens-and-ones up to 100. Today we go to THE
      HUNDREDS — three-digit place value! 347 = 3 HUNDREDS + 4
      TENS + 7 ONES. Same rule extends: HUNDREDS digit first
      (the BIGGEST), TENS digit second, ONES digit third
      (SMALLEST)." Teacher repeats with 805 (8 hundreds + 0 tens
      + 5 ones — emphasize the ZERO in the tens), 720 (7 hundreds
      + 2 tens + 0 ones — zero at end), 999 (9 hundreds + 9
      tens + 9 ones). Pattern emphasis: "The zero is a PLACE-
      HOLDER — it says 'no tens' or 'no ones' here. Don't skip
      it!"
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + base-ten manipulative routine. Each pair receives
      base-ten kits (hundred-flats + ten-sticks + single-counters)
      + a worksheet with 8 three-digit numbers (347, 805, 720,
      256, 600, 491, 980, 999). Pair takes turns: kid A reads a
      number aloud (in expanded place-value form: "three hundreds,
      four tens, seven ones"); kid B builds the number with
      manipulatives. Recast errors with place-value-mat demo
      ("805 — three columns: hundreds-tens-ones. Show me 8
      hundred-flats in the hundreds column. Zero in the tens
      column means NO ten-sticks. Five counters in the ones
      column. NOT 850 — that swaps tens and ones!"). Zero-place
      kids often need extra reinforcement; surface this pattern
      explicitly.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (three-digit
      number to expanded place-value representation; e.g., 347 ↔
      "3 hundreds + 4 tens + 7 ones"). Station 2: math-puzzle
      (decompose: 805 = ? hundreds + ? tens + ? ones; also reverse:
      build a number from given hundreds/tens/ones digits).
      Station 3: pattern-train (sequence: 347, 348, 349, 350...
      OR 990, 991, 992... approach to 1000). Station 4: more-less
      (compare two three-digit numbers — kids must compare
      hundreds first; then tens if hundreds tie; then ones if
      tens tie; e.g., which is greater: 347 vs 374? 805 vs 850?).
  closure:
    durationMinutes: 5
    body: |
      Whole-class three-digit place-value quiz. Teacher shows 6
      three-digit numbers (256, 478, 805, 720, 999, 600); class
      collectively names hundreds + tens + ones. "256 = 2 hundreds
      + 5 tens + 6 ones! 805 = 8 hundreds + 0 tens + 5 ones —
      the ZERO holds the tens place!" Forward-pointer: "Today we
      learned three-digit place value to 999. When we come back
      next, we'll use place value for THREE-DIGIT ADDITION +
      SUBTRACTION with regrouping (carry across multiple columns;
      borrow across multiple columns). Same rules — just more
      columns!"

