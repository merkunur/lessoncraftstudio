compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition. Secondary strand: phonics
    (matching letter mode). Tertiary strand: sorting + categorization
    (grow-under vs grow-above attribute sort).

    Cultural-variation acknowledgment (Arc 4 Phase 1 spec discipline carried
    forward to Arc 5): vegetable-list varies modestly by culture. The 10
    chosen keys prioritize universal recognition across the 11 platform
    locales — carrot/tomato/potato/onion/lettuce are near-universal in K-3
    mental imagery; broccoli/cucumber/pepper/corn/pea are common across
    European + American + many Asian K-3 contexts. Operator-side teachers
    may swap region-specific items by editing the vocabKeys arrays (e.g.,
    add eggplant for Mediterranean contexts, beet for Eastern European
    contexts where those IMAGE_VOCABULARY entries exist).

    Sentence-strips frame variant for week 2: i-like-plural ("I like
    carrots") integrates well with vegetables (kids talk about food
    preferences naturally — extends to "I like X but not Y" preference
    conversation in Grade 1+).

    Cross-package thematic complement: identify-and-name-vegetables pairs
    naturally with identify-and-name-fruits (Arc 2) for K-3 produce
    vocabulary; both packages share the produce-section thematic context.

curriculumStandards:
  - EYFS.ELG.UW
