assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the emotion of a character in a picture
        scene correctly from 8 emotion options (happy,
        sad, angry, scared, surprised, excited, proud,
        frustrated) in 7 of 10 trials.
      - Articulate the WHY of the character's emotion
        ('the character is sad because their toy broke')
        in 5 of 10 productive-language trials.
      - Distinguish similar emotions (happy vs proud;
        sad vs frustrated; angry vs scared; surprised vs
        excited) in 5 of 10 trials.
      - Use vocabulary 'feel' / 'feeling' / 'emotion' /
        'character' / 'infer' / 'because' correctly in
        5 of 10 productive-language trials.

    Differentiation:
    - Pre-K: skip inferential character-feeling work;
      use identify-and-name-emotions (Arc 4) for own-
      emotion recognition first.
    - K: introduce character-feeling inference with the
      4 simplest emotions (happy, sad, angry, scared);
      defer subtler 4 (proud, surprised, excited,
      frustrated) until Grade 1.
    - Grade 1: full 8-emotion character-feeling
      inference fluency; bridge to character-motivation
      work (WHY characters feel this way).
    - Grade 2+: character-arc work (how feelings change
      across a story); mixed-emotion recognition
      (character feels happy AND nervous); bridge to
      identify-problem-and-solution (Phase 1.4
      candidate; problem-and-solution work often
      involves character-feelings as the emotional
      signal of the narrative tension).

