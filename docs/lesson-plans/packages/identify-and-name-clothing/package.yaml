# Teaching package — identify and name 10 clothing items
# Arc 2 Phase 3a (en authoring; mirrors Arc 1 farm-animals template).
# Pedagogical learning target: identify-and-name-clothing
#   (early-literacy → vocabulary-acquisition strand)
# Generalizations applied per Arc 1 agent review:
#   - Single concept boundary (everyday wearable items; mixes seasonal so excludes
#     swim-only or formal-only items)
#   - 2 mechanic families (matching, find-and-count + picture-sort assessment)
#   - Sentence-strips × 2 frames (i-see-a + there-are-count-plural)
#   - Flashcards × 2 (4-up jumbo + 9-up take-home)
#   - compositionalRationale field
#   - Manipulative single-repeat
#   - Verified vocab keys against IMAGE_VOCABULARY (10/10 with full 11-locale entries)

targetSlug: identify-and-name-clothing
language: en

title:
  en: "Clothing — identify and name 10"
description:
  en: "K-Grade 1 vocabulary-acquisition package for 10 universal clothing items: shirt, pants, dress, shoes, hat, coat, jacket, scarf, sweater, boots. 5 worksheet exercises + 8 printable materials over a 1-2 week unit. Theme-agnostic; operator selects target instruction language at material-render time."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up flashcards one at a time, names
      each clothing item in target language, class repeats chorally. Optional
      action: kids touch the matching clothing item on their own body if wearing
      it. Pin cards to "Clothing" word wall cluster.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("I see a {item}"). Choral reading
      first, then individual reads. Pair work: kids hold a picture-card, partner
      names the clothing item. Recast errors in the target frame.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: image-letter matching (matching app, letter mode).
      Station 2: picture-card sorting on the carpet (winter clothing vs summer
      clothing — categorization + seasonal vocabulary). Station 3: flashcard
      memory game with 6 pairs.
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Final challenge: teacher names a clothing item, kids
      point to it on their body or on the word wall. Forward-pointer: "Today we
      learned 10 clothing words. When we come back to clothing next, this same
      set will be here for us."

