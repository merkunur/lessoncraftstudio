assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Use 6 direction words (left, right, up, down, forward, backward)
        correctly when narrating movement in 7 of 10 trials.
      - Follow direction commands physically (without grid-support)
        in 8 of 10 trials.
      - Construct 2-step direction sequences ("First go LEFT, then go
        UP") in 6 of 10 trials.

    Differentiation:
    - Pre-K: 4 core direction words (up, down, left, right); kinesthetic
      practice only.
    - K: 6 direction words including motion words (forward, backward);
      grid-supported practice.
    - Grade 1+: extend to compass directions (north, south, east, west);
      bridge to map-reading work (Arc 9+ candidate).

