<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Math Puzzles - Learning Value Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(150deg, #6A1B9A 0%, #4A148C 50%, #311B92 100%); overflow: hidden;">

        <!-- Subtle neural network pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.05;">
            <svg width="1000" height="1000" style="position: absolute; top: 0; left: 0;">
                <circle cx="200" cy="300" r="3" fill="white"/>
                <circle cx="400" cy="200" r="3" fill="white"/>
                <circle cx="600" cy="350" r="3" fill="white"/>
                <circle cx="800" cy="250" r="3" fill="white"/>
                <circle cx="300" cy="500" r="3" fill="white"/>
                <circle cx="700" cy="550" r="3" fill="white"/>
                <line x1="200" y1="300" x2="400" y2="200" stroke="white" stroke-width="1"/>
                <line x1="400" y1="200" x2="600" y2="350" stroke="white" stroke-width="1"/>
                <line x1="600" y1="350" x2="800" y2="250" stroke="white" stroke-width="1"/>
                <line x1="300" y1="500" x2="400" y2="200" stroke="white" stroke-width="1"/>
                <line x1="600" y1="350" x2="700" y2="550" stroke="white" stroke-width="1"/>
            </svg>
        </div>

        <!-- Glowing orbs -->
        <div style="position: absolute; top: 100px; left: 80px; width: 200px; height: 200px; background: radial-gradient(circle, rgba(255,214,0,0.15) 0%, transparent 60%); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 150px; right: 60px; width: 250px; height: 250px; background: radial-gradient(circle, rgba(77,208,225,0.12) 0%, transparent 60%); border-radius: 50%;"></div>

        <!-- FREE Badge as golden seal -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #FFD600 0%, #FFC107 50%, #FF8F00 100%); box-shadow: 0 6px 25px rgba(255,214,0,0.5), inset 0 -3px 10px rgba(0,0,0,0.15), inset 0 3px 8px rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 4px solid #B8860B; position: relative;">
                <!-- Seal points -->
                <div style="position: absolute; inset: -8px; background: repeating-conic-gradient(from 0deg, #FFD600 0deg 12deg, #FFC107 12deg 24deg); border-radius: 50%; z-index: -1; opacity: 0.6;"></div>
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #4A148C; text-shadow: 1px 1px 2px rgba(255,255,255,0.5);">FREE</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: rgba(255,255,255,0.95); padding: 12px 24px; border-radius: 28px; box-shadow: 0 4px 18px rgba(0,0,0,0.3); border: 3px solid #FFD600;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; color: #4A148C; letter-spacing: 1px;">GRADES K-2</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 90px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 64px; color: white; margin: 0; text-shadow: 4px 4px 0 rgba(0,0,0,0.3), 0 0 40px rgba(255,214,0,0.3);">BUILD BRAIN POWER</h1>
            <h2 style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 28px; color: #4DD0E1; margin: 12px 0 0 0; letter-spacing: 2px;">Addition & Subtraction | Numbers 1-20</h2>
        </div>

        <!-- Brain/Head visualization with puzzle -->
        <div style="position: absolute; top: 220px; left: 50%; transform: translateX(-50%); width: 600px; height: 450px;">
            <!-- Head silhouette (dotted outline) -->
            <div style="position: absolute; left: 50%; top: 30px; transform: translateX(-50%); width: 280px; height: 320px; border: 4px dashed rgba(255,255,255,0.4); border-radius: 50% 50% 45% 45%; display: flex; align-items: center; justify-content: center;">
                <!-- 3x3 puzzle grid inside head -->
                <div style="display: grid; grid-template-columns: repeat(3, 70px); grid-template-rows: repeat(3, 70px); gap: 6px;">
                    <div style="background: linear-gradient(145deg, #FF8C42, #E65100); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255,140,66,0.4);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">5</span>
                    </div>
                    <div style="background: linear-gradient(145deg, #4DD0E1, #00BCD4); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(77,208,225,0.4);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">12</span>
                    </div>
                    <div style="background: linear-gradient(145deg, #B388FF, #7C4DFF); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(179,136,255,0.4);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">8</span>
                    </div>
                    <div style="background: linear-gradient(145deg, #69F0AE, #00E676); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(105,240,174,0.4);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #1B5E20;">3</span>
                    </div>
                    <!-- Center piece - glowing "aha" moment -->
                    <div style="background: linear-gradient(145deg, #FFD600, #FFC107); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(255,214,0,0.6), 0 0 30px rgba(255,214,0,0.4); position: relative;">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #4A148C;">15</span>
                        <!-- Glow ring -->
                        <div style="position: absolute; inset: -4px; border: 3px solid rgba(255,214,0,0.5); border-radius: 12px; animation: pulse 2s infinite;"></div>
                    </div>
                    <div style="background: linear-gradient(145deg, #FF8A80, #FF5252); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255,138,128,0.4);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">7</span>
                    </div>
                    <div style="background: linear-gradient(145deg, #4DD0E1, #00BCD4); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(77,208,225,0.4);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">11</span>
                    </div>
                    <div style="background: linear-gradient(145deg, #FF8C42, #E65100); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(255,140,66,0.4);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">9</span>
                    </div>
                    <div style="background: linear-gradient(145deg, #B388FF, #7C4DFF); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(179,136,255,0.4);">
                        <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">6</span>
                    </div>
                </div>
            </div>

            <!-- Lightbulb above head -->
            <div style="position: absolute; left: 50%; top: -20px; transform: translateX(-50%); font-size: 60px; filter: drop-shadow(0 0 20px rgba(255,214,0,0.8));">💡</div>

            <!-- Skill badges floating around -->
            <div style="position: absolute; left: 20px; top: 80px; background: linear-gradient(145deg, #FF8C42, #E65100); padding: 10px 18px; border-radius: 22px; transform: rotate(-8deg); box-shadow: 0 6px 20px rgba(255,140,66,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Problem Solving</span>
            </div>
            <div style="position: absolute; right: 30px; top: 100px; background: linear-gradient(145deg, #4DD0E1, #00BCD4); padding: 10px 18px; border-radius: 22px; transform: rotate(6deg); box-shadow: 0 6px 20px rgba(77,208,225,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Pattern Recognition</span>
            </div>
            <div style="position: absolute; left: 40px; bottom: 80px; background: linear-gradient(145deg, #69F0AE, #00E676); padding: 10px 18px; border-radius: 22px; transform: rotate(5deg); box-shadow: 0 6px 20px rgba(105,240,174,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #1B5E20;">Number Skills</span>
            </div>
            <div style="position: absolute; right: 50px; bottom: 100px; background: linear-gradient(145deg, #B388FF, #7C4DFF); padding: 10px 18px; border-radius: 22px; transform: rotate(-4deg); box-shadow: 0 6px 20px rgba(179,136,255,0.4);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Visual Thinking</span>
            </div>
        </div>

        <!-- Small worksheet preview at bottom -->
        <div style="position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 30px;">
            <div style="position: relative;">
                <img src="https://www.lessoncraftstudio.com/samples/english/math%20puzzle/sample-5.jpeg" style="width: 130px; height: 168px; object-fit: cover; border-radius: 10px; border: 4px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.35);">
                <!-- Sparkles -->
                <div style="position: absolute; top: -15px; right: -15px; font-size: 28px; filter: drop-shadow(0 0 8px rgba(255,214,0,0.8));">✨</div>
            </div>
            <div style="text-align: left;">
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">MATH PUZZLES</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 16px; color: #4DD0E1; margin-top: 4px;">Solve equations → Reveal animals!</div>
            </div>
        </div>

    </div>
</body>
</html>
