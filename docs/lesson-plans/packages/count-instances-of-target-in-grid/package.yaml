compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / memory-and-attention.
    Secondary strand: vocabulary acquisition (vocab-anchored). Tertiary
    strand: counting + numeracy (count-instances IS counting; bridges
    cognitive-domain work with numeracy-strand work from Arc 3 +
    Arc 5).

    Vocab-anchor framing: same Phase 2 vocab-anchored interpretation as
    find-hidden-target-in-busy-scene (sibling). Cognitive-domain target
    is the architectural shape; vocabulary-anchor is the pedagogical
    thread. Distinct from sibling: this package adds a counting-axis
    (kids count instances; sibling kids find single instances).

    Distinctive composition: 4 find-and-count exercises (positions 1, 3,
    4, 5) across 4 theme contexts (animals, vegetables, vehicles, shapes)
    + 1 matching at position 2. Higher app-density than sibling reflects
    the count-axis specificity — kids practice counting in multiple
    theme contexts to generalize the count-while-scanning skill.

    Materials addition: numeral-cards at material 3. This package uses
    numeral-cards as a counting-anchor — kids count instances and place
    the matching numeral card next to each grid as they finish. Bridges
    cognitive-domain work with Arc 3's numeral-cards material introduction.

    Cross-package thematic complement: count-instances-of-target-in-grid
    pairs naturally with Arc 3's count-objects-1-to-N packages. Kids who
    completed Arc 3 counting work transfer the counting skill into
    cognitive-scanning context here.

    K-3 multilingual classroom relevance: combined search-and-count
    integrates language (target name) + cognition (visual scanning) +
    numeracy (counting) in one task. Highly leveraged for K-3 multi-
    skill development. Per the §1 SEO flywheel theme-agnosticism: count-
    instances composes against any theme axis; substrate-flexible.

