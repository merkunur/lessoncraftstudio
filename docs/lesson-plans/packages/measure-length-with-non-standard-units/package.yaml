# Teaching package — measure length with non-standard units
# Arc 15 Phase 2 (math / measurement +1; extends Arc 11/14 comparison-by-X work).

targetSlug: measure-length-with-non-standard-units
language: en
title:
  en: "Measuring Length — using paperclips, hands, footsteps"
description:
  en: "Kindergarten / Grade 1 math + measurement package teaching kids to measure length using NON-STANDARD UNITS — repeated everyday objects (paperclips, hands, footsteps, blocks). Builds on Arc 11 compare-by-length + Arc 14 Phase 4 compare-by-capacity foundation. Critical bridge from QUALITATIVE comparison (longer/shorter) to QUANTITATIVE measurement (5 paperclips long). Foundation for later standard-unit measurement (inches/feet/centimeters/meters). Examples: 'This pencil is 6 paperclips long' / 'This desk is 4 hand-widths wide' / 'My foot is 2 paperclips long'. Measurement strand: +1 package. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + non-standard-unit introduction. Teacher
      displays a pencil + a paperclip. "How LONG is this pencil?
      We can MEASURE it. Watch — I line up paperclips end-to-end
      next to the pencil. 1, 2, 3, 4, 5, 6. The pencil is 6
      PAPERCLIPS LONG." Teacher repeats with hand-width
      (measuring desk-width); footstep (measuring classroom-
      length). Visual + tactile anchor for unit-iteration
      measurement.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + measurement routine. Each pair receives paperclips
      + 5 objects to measure (pencil, eraser, book, shoe, marker).
      Pair takes turns: kid A picks an object; kid B lines up
      paperclips next to it + counts; both record measurement.
      Recast errors with technique-demo ("you have gaps between
      paperclips — let's line them up TIGHT. Now count again —
      6 paperclips, not 7."). Differentiate: smaller-objects use
      paperclips; medium-objects use blocks; large-objects use
      hand-widths.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: chart-count worksheet (count
      paperclips in a measurement diagram). Station 2: matching
      worksheet (measurement to object: "5 paperclips" ↔ pencil
      picture). Station 3: more-less worksheet (compare two
      measurements: book = 8 paperclips; pencil = 6 paperclips
      — which is LONGER?). Station 4: pattern-train worksheet
      (sequence objects from shortest to longest using paperclip
      measurements).
  closure:
    durationMinutes: 5
    body: |
      Whole-class measurement review. Teacher shows new objects;
      class collectively estimates measurements ("How many
      paperclips long do you think this banana is?"). Then
      measure to check. Forward-pointer: "Today we measured with
      paperclips and hands. When we come back next, we can use
      STANDARD units like INCHES (in) on a RULER + bridge to
      meter sticks + measuring tape!"

