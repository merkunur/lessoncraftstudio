assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Read 8 analog clock faces showing quarter-hour
        times (mix of quarter-past + quarter-to) correctly
        in 6 of 10 trials.
      - Distinguish quarter-past from quarter-to based on
        minute-hand position (3 vs 9) in 8 of 10 trials.
      - Identify the hour-hand position at quarter-to
        times (hour hand close to NEXT hour, not the
        named one — e.g., at 5:45 the hour hand is
        between 5 and 6, closer to 6) in 5 of 10 trials.
      - Set the movable-hand paper clock to a given
        quarter-hour time in 5 of 10 trials.
      - Use vocabulary 'quarter-past' / 'quarter-to' /
        'fifteen-minutes' / 'forty-five-minutes' correctly
        in 5 of 10 productive-language trials.

    Differentiation:
    - Pre-K: skip quarter-hour reading entirely; the
      Arc 17 P1.4 pair's hour + half-hour scope is the
      appropriate K coverage.
    - K: defer quarter-hour reading; focus on hour-only
      reading (Arc 17 P1.4 Slot 1).
    - Grade 1: introduce quarter-past only (minute hand at
      3); defer quarter-to until Grade 2. The quarter-to
      hour-hand-between-position is too cognitively
      demanding for most Grade 1 learners.
    - Grade 2: full quarter-past + quarter-to fluency;
      movable-hand work heavily scaffolded; the hour-
      hand-position-at-quarter-to gets explicit attention.
    - Grade 3+: brief reinforcement + bridge to nearest-
      5-minutes precision per the broader CCSS.2.MD.C.7
      scope; AM/PM distinction + digital clock format +
      elapsed-time problems.

