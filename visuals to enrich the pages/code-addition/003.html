<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Code Breaker Addition - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #0D2137 0%, #1E3A5F 40%, #2E5077 100%); overflow: hidden;">

        <!-- Stars background -->
        <div style="position: absolute; top: 50px; left: 80px; width: 4px; height: 4px; background: white; border-radius: 50%; box-shadow: 0 0 6px white;"></div>
        <div style="position: absolute; top: 100px; left: 200px; width: 3px; height: 3px; background: white; border-radius: 50%; box-shadow: 0 0 4px white;"></div>
        <div style="position: absolute; top: 80px; right: 150px; width: 5px; height: 5px; background: white; border-radius: 50%; box-shadow: 0 0 8px white;"></div>
        <div style="position: absolute; top: 150px; right: 250px; width: 3px; height: 3px; background: white; border-radius: 50%; box-shadow: 0 0 4px white;"></div>
        <div style="position: absolute; top: 200px; left: 100px; width: 4px; height: 4px; background: white; border-radius: 50%; box-shadow: 0 0 5px white;"></div>

        <!-- Main Title -->
        <div style="position: absolute; top: 30px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 56px; color: #FFD600; margin: 0; text-shadow: 3px 3px 0 rgba(0,0,0,0.4);">CODE BREAKER</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 42px; color: white; margin: 5px 0 0 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.4);">ADDITION</h2>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.95); padding: 12px 28px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 20px; color: #7B1FA2;">GRADES K-2</span>
        </div>

        <!-- Ascending Path / Mountain -->
        <div style="position: absolute; bottom: 80px; left: 0; right: 0; height: 750px;">

            <!-- Path line -->
            <svg style="position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;" viewBox="0 0 1000 750" preserveAspectRatio="none">
                <path d="M 100 650 Q 200 550 300 500 Q 400 450 500 380 Q 600 310 700 250 Q 800 190 900 120"
                      stroke="url(#pathGradient)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="20,10"/>
                <defs>
                    <linearGradient id="pathGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#43A047"/>
                        <stop offset="50%" stop-color="#00BCD4"/>
                        <stop offset="100%" stop-color="#FFD600"/>
                    </linearGradient>
                </defs>
            </svg>

            <!-- LEVEL 1: ROOKIE -->
            <div style="position: absolute; bottom: 80px; left: 50px;">
                <!-- Badge -->
                <div style="position: absolute; top: -60px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #43A047 0%, #2E7D32 100%); padding: 10px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(67,160,71,0.5); z-index: 20;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white; letter-spacing: 1px;">ROOKIE</span>
                </div>
                <!-- Worksheet -->
                <div style="box-shadow: 0 10px 35px rgba(0,0,0,0.3); transform: rotate(-5deg);">
                    <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/code addition/Code Breaker Addition 1.jpeg" style="width: 200px; height: auto; border-radius: 10px; border: 4px solid #43A047;">
                </div>
                <!-- Lock icon (unlocked) -->
                <div style="position: absolute; top: -30px; right: -20px; width: 40px; height: 40px; background: linear-gradient(145deg, #4CAF50 0%, #388E3C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.3); z-index: 25;">
                    <span style="font-size: 20px;">🔓</span>
                </div>
                <!-- Description -->
                <div style="margin-top: 15px; text-align: center;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #A5D6A7;">Simple sums</span>
                </div>
            </div>

            <!-- LEVEL 2: DETECTIVE -->
            <div style="position: absolute; bottom: 280px; left: 380px;">
                <!-- Badge -->
                <div style="position: absolute; top: -60px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #00BCD4 0%, #0097A7 100%); padding: 10px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,188,212,0.5); z-index: 20;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white; letter-spacing: 1px;">DETECTIVE</span>
                </div>
                <!-- Worksheet -->
                <div style="box-shadow: 0 12px 40px rgba(0,0,0,0.35); transform: rotate(3deg);">
                    <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/code addition/Code Breaker Addition 3.jpeg" style="width: 220px; height: auto; border-radius: 10px; border: 4px solid #00BCD4;">
                </div>
                <!-- Stars earned -->
                <div style="position: absolute; top: -25px; right: -30px; display: flex; gap: 3px; z-index: 25;">
                    <span style="font-size: 22px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">⭐</span>
                    <span style="font-size: 22px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">⭐</span>
                </div>
                <!-- Description -->
                <div style="margin-top: 15px; text-align: center;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #80DEEA;">Medium challenge</span>
                </div>
            </div>

            <!-- LEVEL 3: EXPERT -->
            <div style="position: absolute; bottom: 500px; right: 80px;">
                <!-- Badge -->
                <div style="position: absolute; top: -65px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #FFD600 0%, #FFA000 100%); padding: 12px 24px; border-radius: 25px; box-shadow: 0 6px 20px rgba(255,214,0,0.5); z-index: 20;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white; letter-spacing: 2px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);">EXPERT</span>
                </div>
                <!-- Worksheet with glow -->
                <div style="box-shadow: 0 15px 50px rgba(255,214,0,0.3), 0 15px 45px rgba(0,0,0,0.35); transform: rotate(-2deg);">
                    <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/code addition/Code Breaker Addition 4.jpeg" style="width: 240px; height: auto; border-radius: 12px; border: 5px solid #FFD600;">
                </div>
                <!-- Crown / Trophy -->
                <div style="position: absolute; top: -90px; right: 20px; font-size: 45px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));">👑</div>
                <!-- Stars earned -->
                <div style="position: absolute; top: -20px; left: -30px; display: flex; gap: 3px; z-index: 25;">
                    <span style="font-size: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">⭐</span>
                    <span style="font-size: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">⭐</span>
                    <span style="font-size: 24px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">⭐</span>
                </div>
                <!-- Description -->
                <div style="margin-top: 15px; text-align: center;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #FFE082;">Multi-step mastery</span>
                </div>
            </div>

            <!-- Floating code numbers along path -->
            <div style="position: absolute; bottom: 180px; left: 280px; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(145deg, #FFD600 0%, #FFA000 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255,214,0,0.4); opacity: 0.8;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white;">3</span>
            </div>
            <div style="position: absolute; bottom: 380px; left: 580px; width: 35px; height: 35px; border-radius: 50%; background: linear-gradient(145deg, #FFD600 0%, #FFA000 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(255,214,0,0.4); opacity: 0.7;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: white;">7</span>
            </div>
            <div style="position: absolute; bottom: 550px; right: 340px; width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(145deg, #FFD600 0%, #FFA000 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255,214,0,0.4); opacity: 0.85;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 21px; color: white;">9</span>
            </div>

        </div>

        <!-- Tagline -->
        <div style="position: absolute; bottom: 85px; left: 0; right: 0; text-align: center;">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.4);">Every Skill Level!</span>
        </div>

        <!-- Decorative sparkles -->
        <div style="position: absolute; top: 250px; left: 350px; width: 14px; height: 14px; background: white; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); opacity: 0.8;"></div>
        <div style="position: absolute; top: 180px; right: 300px; width: 12px; height: 12px; background: #FFD600; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); opacity: 0.9;"></div>

    </div>
</body>
</html>
