assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Recognize 21-100 numerals by name in 7 of 10 trials.
      - Match numeral to position on hundreds-chart in 7 of 10
        trials.
      - Identify missing numeral in sequence (44, 45, ?, 47, 48)
        in 6 of 10 trials.
      - Order 5 random two-digit numerals from smallest to
        largest in 6 of 10 trials.

    Differentiation:
    - Pre-K: skip 21-100; review numerals-1-to-20.
    - K: numerals 21-50 only.
    - Grade 1: full numerals 21-100 fluent.
    - Grade 2+: extend to numerals 100-999 + bridge to writing-
      multi-digit-numerals + place-value-aware reading.

