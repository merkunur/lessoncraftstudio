# Teaching package — recognize numerals 101 to 500
# Arc 15 Phase 4 (math / numeral-recognition 2/4 → 3/4; penultimate before saturation).

targetSlug: recognize-numerals-101-to-500
language: en
title:
  en: "Numerals 101-500 — recognizing three-digit numbers"
description:
  en: "Grade 1 / Grade 2 math package extending numeral-recognition from 1-100 (Arc 15 Phase 1+2 recognize-numerals-1-to-20 + recognize-numerals-21-to-100) to 101-500. Builds directly on Phase 1+2 foundation. Critical scaling work — first three-digit-numeral exposure. Foundation for full numeral-recognition strand work (3/4 at Phase 4 close). Kids learn the place-value structure: hundreds-place + tens-place + ones-place; read 234 as 'two hundred thirty-four'. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + three-digit introduction. Teacher
      displays a three-digit number: 234. "We already know
      numerals 1-100. Now THREE-DIGIT numerals — 100 and bigger!
      Watch — '234'. The first digit '2' means TWO HUNDREDS (200).
      The second digit '3' means THREE TENS (30). The third digit
      '4' means FOUR ONES (4). Together: TWO HUNDRED THIRTY-FOUR."
      Class repeats with 156, 308, 425, 500. Pattern emphasis:
      "Read LEFT to RIGHT: hundreds, tens, ones."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + three-digit numeral routine. Each pair receives
      16 numeral cards (random subset from 101-500) + a place-
      value chart. Pair takes turns: kid A picks a numeral card;
      kid B reads aloud + identifies hundreds/tens/ones digit.
      Recast errors with place-value reminder ("you said three
      hundred forty for 304. The middle digit is 0 — zero tens —
      so it's three hundred FOUR.").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (three-digit
      numeral to spoken-name in words). Station 2: pattern-train
      worksheet (sequence three-digit numerals in counting-by-1,
      counting-by-10, or counting-by-100 patterns). Station 3:
      missing-pieces worksheet (number sequence with one three-
      digit numeral missing). Station 4: more-less worksheet
      (compare two three-digit numerals using place-value
      ranking).
  closure:
    durationMinutes: 5
    body: |
      Whole-class numeral-quiz. Teacher displays random three-digit
      numerals 101-500; class collectively reads each. "Number 234!
      Number 408! Number 175! Number 500!" Forward-pointer: "Today
      we recognized three-digit numerals up to 500. When we come
      back next, we'll learn to READ and WRITE numerals 1-20
      using letters + writing technique — bridging recognition to
      production!"

