<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Picture Bingo - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(180deg, #64B5F6 0%, #90CAF9 40%, #BBDEFB 100%); overflow: hidden;">

        <!-- Sunburst from center -->
        <div style="position: absolute; top: 50%; left: 50%; width: 1200px; height: 1200px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.2) 30%, transparent 60%); border-radius: 50%;"></div>

        <!-- Confetti explosion - lots of colorful pieces -->
        <!-- Red confetti -->
        <div style="position: absolute; top: 50px; left: 120px; width: 18px; height: 18px; background: #E53935; border-radius: 50%; opacity: 0.9;"></div>
        <div style="position: absolute; top: 180px; left: 60px; width: 12px; height: 12px; background: #E53935; transform: rotate(45deg); opacity: 0.8;"></div>
        <div style="position: absolute; top: 300px; left: 30px; width: 20px; height: 8px; background: #E53935; border-radius: 4px; transform: rotate(-20deg); opacity: 0.7;"></div>
        <div style="position: absolute; top: 120px; right: 100px; width: 16px; height: 16px; background: #E53935; border-radius: 50%; opacity: 0.85;"></div>

        <!-- Yellow confetti -->
        <div style="position: absolute; top: 80px; left: 250px; width: 15px; height: 15px; background: #FFD600; border-radius: 50%; opacity: 0.9;"></div>
        <div style="position: absolute; top: 200px; right: 180px; width: 20px; height: 8px; background: #FFD600; border-radius: 4px; transform: rotate(30deg); opacity: 0.8;"></div>
        <div style="position: absolute; top: 350px; right: 50px; width: 14px; height: 14px; background: #FFD600; transform: rotate(60deg); opacity: 0.75;"></div>
        <div style="position: absolute; bottom: 350px; left: 80px; width: 16px; height: 16px; background: #FFD600; border-radius: 50%; opacity: 0.85;"></div>

        <!-- Purple confetti -->
        <div style="position: absolute; top: 100px; left: 400px; width: 14px; height: 14px; background: #7B1FA2; border-radius: 50%; opacity: 0.85;"></div>
        <div style="position: absolute; top: 250px; left: 100px; width: 18px; height: 8px; background: #7B1FA2; border-radius: 4px; transform: rotate(-40deg); opacity: 0.7;"></div>
        <div style="position: absolute; top: 150px; right: 250px; width: 12px; height: 12px; background: #7B1FA2; transform: rotate(15deg); opacity: 0.8;"></div>
        <div style="position: absolute; bottom: 280px; right: 100px; width: 16px; height: 16px; background: #7B1FA2; border-radius: 50%; opacity: 0.8;"></div>

        <!-- Green confetti -->
        <div style="position: absolute; top: 60px; right: 350px; width: 16px; height: 16px; background: #43A047; border-radius: 50%; opacity: 0.9;"></div>
        <div style="position: absolute; top: 220px; right: 80px; width: 14px; height: 14px; background: #43A047; transform: rotate(30deg); opacity: 0.75;"></div>
        <div style="position: absolute; bottom: 320px; left: 150px; width: 18px; height: 8px; background: #43A047; border-radius: 4px; transform: rotate(50deg); opacity: 0.8;"></div>

        <!-- Blue confetti -->
        <div style="position: absolute; top: 130px; left: 180px; width: 14px; height: 14px; background: #1565C0; border-radius: 50%; opacity: 0.85;"></div>
        <div style="position: absolute; top: 280px; right: 150px; width: 16px; height: 8px; background: #1565C0; border-radius: 4px; transform: rotate(-35deg); opacity: 0.7;"></div>
        <div style="position: absolute; bottom: 400px; right: 200px; width: 12px; height: 12px; background: #1565C0; transform: rotate(20deg); opacity: 0.8;"></div>

        <!-- Orange confetti -->
        <div style="position: absolute; top: 170px; left: 350px; width: 15px; height: 15px; background: #FF6D00; border-radius: 50%; opacity: 0.85;"></div>
        <div style="position: absolute; top: 90px; right: 200px; width: 18px; height: 8px; background: #FF6D00; border-radius: 4px; transform: rotate(45deg); opacity: 0.75;"></div>
        <div style="position: absolute; bottom: 350px; right: 30px; width: 14px; height: 14px; background: #FF6D00; transform: rotate(-25deg); opacity: 0.8;"></div>

        <!-- Floating B-I-N-G-O balls around edges -->
        <div style="position: absolute; top: 40px; left: 50px; width: 55px; height: 55px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0%, #fff 8%, #1565C0 35%, #0D47A1 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; transform: rotate(-15deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 30px; color: white;">B</span>
        </div>
        <div style="position: absolute; top: 30px; right: 150px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0%, #fff 8%, #E53935 35%, #B71C1C 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; transform: rotate(10deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white;">I</span>
        </div>
        <div style="position: absolute; top: 380px; left: 25px; width: 45px; height: 45px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0%, #fff 8%, #43A047 35%, #1B5E20 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">N</span>
        </div>
        <div style="position: absolute; top: 400px; right: 30px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0%, #fff 8%, #FFD600 35%, #F9A825 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; transform: rotate(12deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #5D4037;">G</span>
        </div>
        <div style="position: absolute; bottom: 300px; left: 60px; width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0%, #fff 8%, #7B1FA2 35%, #4A148C 100%); box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; transform: rotate(-5deg);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 25px; color: white;">O</span>
        </div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 25px; left: 130px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #FF6D00 0%, #E65100 100%); color: white; padding: 10px 24px; font-size: 24px; font-weight: 700; font-family: 'Fredoka', sans-serif; border-radius: 25px; box-shadow: 0 5px 20px rgba(255,109,0,0.5); transform: rotate(-3deg);">FREE</div>
        </div>

        <!-- "Kids LOVE This!" badge -->
        <div style="position: absolute; top: 20px; right: 25px; z-index: 100;">
            <div style="background: linear-gradient(135deg, #E91E63 0%, #C2185B 100%); color: white; padding: 10px 20px; border-radius: 25px; font-size: 18px; font-weight: 700; font-family: 'Nunito', sans-serif; box-shadow: 0 5px 18px rgba(233,30,99,0.4); display: flex; align-items: center; gap: 8px; transform: rotate(5deg);">
                <span style="font-size: 20px;">❤️</span> Kids LOVE This!
            </div>
        </div>

        <!-- Comic burst "BINGO!" -->
        <div style="position: absolute; top: 100px; left: 50%; transform: translateX(-50%); z-index: 60;">
            <div style="position: relative;">
                <!-- Burst background -->
                <div style="position: absolute; top: 50%; left: 50%; width: 400px; height: 150px; transform: translate(-50%, -50%); background: white; border-radius: 50%; box-shadow: 0 0 0 10px #FFD600, 0 10px 40px rgba(0,0,0,0.2);"></div>
                <!-- Text -->
                <div style="position: relative; z-index: 10; text-align: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 90px; color: #E53935; text-shadow: 4px 4px 0 #FFD600, 8px 8px 0 rgba(0,0,0,0.1); letter-spacing: 5px;">BINGO!</span>
                </div>
            </div>
        </div>

        <!-- Central bingo card with dauber marks -->
        <div style="position: absolute; top: 270px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <div style="position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
                <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/bingo/bingo_card_1.jpeg" style="width: 340px; height: auto; border-radius: 16px; border: 8px solid white;">

                <!-- Dauber marks overlay -->
                <div style="position: absolute; top: 60px; left: 55px; width: 45px; height: 45px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, rgba(229,57,53,0.9) 0%, rgba(183,28,28,0.7) 100%); box-shadow: 0 3px 10px rgba(229,57,53,0.4);"></div>
                <div style="position: absolute; top: 130px; left: 130px; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, rgba(229,57,53,0.9) 0%, rgba(183,28,28,0.7) 100%); box-shadow: 0 3px 10px rgba(229,57,53,0.4);"></div>
                <div style="position: absolute; top: 200px; right: 120px; width: 48px; height: 48px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, rgba(229,57,53,0.9) 0%, rgba(183,28,28,0.7) 100%); box-shadow: 0 3px 10px rgba(229,57,53,0.4);"></div>
                <div style="position: absolute; bottom: 100px; left: 80px; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, rgba(229,57,53,0.9) 0%, rgba(183,28,28,0.7) 100%); box-shadow: 0 3px 10px rgba(229,57,53,0.4);"></div>
                <div style="position: absolute; bottom: 60px; right: 70px; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, rgba(229,57,53,0.9) 0%, rgba(183,28,28,0.7) 100%); box-shadow: 0 3px 10px rgba(229,57,53,0.4);"></div>
            </div>
        </div>

        <!-- Speech bubble "WE WON!" -->
        <div style="position: absolute; top: 320px; right: 80px; z-index: 70;">
            <div style="background: white; padding: 14px 24px; border-radius: 25px; font-size: 24px; font-weight: 700; font-family: 'Fredoka', sans-serif; color: #43A047; box-shadow: 0 6px 20px rgba(0,0,0,0.15); position: relative; border: 4px solid #43A047;">
                WE WON!
                <div style="position: absolute; bottom: -18px; left: 35px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 22px solid #43A047;"></div>
                <div style="position: absolute; bottom: -10px; left: 38px; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 16px solid white;"></div>
            </div>
        </div>

        <!-- Word card peeking from corner -->
        <div style="position: absolute; bottom: 180px; left: 50px; transform: rotate(12deg); box-shadow: 0 8px 25px rgba(0,0,0,0.2); z-index: 40;">
            <img src="file:///C:/Users/rkgen/lessoncraftstudio/samples/english/bingo/bingo_card%20word.jpeg" style="width: 140px; height: auto; border-radius: 10px; border: 4px solid white;">
        </div>

        <!-- Comic burst "SO MUCH FUN!" -->
        <div style="position: absolute; bottom: 220px; right: 60px; z-index: 60;">
            <div style="background: linear-gradient(135deg, #FFD600 0%, #FF6D00 100%); padding: 18px 22px; border-radius: 50%; font-size: 16px; font-weight: 700; font-family: 'Fredoka', sans-serif; color: white; box-shadow: 0 6px 20px rgba(255,214,0,0.5); transform: rotate(8deg); text-align: center; line-height: 1.2; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">
                SO MUCH<br>FUN!
            </div>
        </div>

        <!-- Celebration emojis -->
        <div style="position: absolute; top: 220px; left: 80px; font-size: 40px; transform: rotate(-10deg);">🎉</div>
        <div style="position: absolute; top: 200px; right: 100px; font-size: 35px; transform: rotate(15deg);">🎊</div>
        <div style="position: absolute; bottom: 260px; left: 180px; font-size: 32px; transform: rotate(-5deg);">✨</div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 130px; background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.9) 40%, white 100%);">
            <div style="position: absolute; bottom: 25px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 25px;">
                <div style="background: linear-gradient(135deg, #7B1FA2 0%, #4A148C 100%); color: white; padding: 14px 28px; border-radius: 30px; font-size: 22px; font-weight: 700; font-family: 'Fredoka', sans-serif; box-shadow: 0 5px 20px rgba(123,31,162,0.4);">Classroom Game Day!</div>
                <div style="background: linear-gradient(135deg, #43A047 0%, #1B5E20 100%); color: white; padding: 14px 22px; border-radius: 30px; font-size: 18px; font-weight: 700; font-family: 'Nunito', sans-serif; box-shadow: 0 5px 18px rgba(67,160,71,0.4);">Grades K-3</div>
            </div>
        </div>

    </div>
</body>
</html>
