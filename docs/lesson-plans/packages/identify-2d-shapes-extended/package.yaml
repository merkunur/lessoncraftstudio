compositionalRationale:
  en: |
    Primary strand: geometry / spatial-reasoning. Secondary strand: vocabulary
    acquisition (extended shape names). Tertiary strand: visual discrimination
    (10-shape discrimination is harder than 4-shape; kids notice subtle shape
    distinctions like pentagon vs hexagon).

    Prereq-chain validation: this package directly builds on identify-2d-
    shapes-basic (Phase 2). The basic→extended progression within a single
    architectural shape (geometry strand) validates that prereq-chain
    architecture works: kids who completed the basic 4-shape set are
    immediately ready for the extended 10-shape set; the 4 basic shapes
    appear in this package's exercises as a vocabulary-anchor revision
    surface; the 6 new shapes are the productive learning target.

    Distinctive composition: 2 matching exercises (positions 1 + 5) reflect
    the introduction-then-assessment pedagogy with no overlap in shapes
    presented — first matching is the new-shape introduction; second is
    mixed full-10-shape assessment. Find-and-count at position 3 stress-
    tests visual-discrimination across the larger shape set.

    Cultural-variation acknowledgment: shape-name morphology varies modestly
    across the 11 platform locales; pentagon and hexagon names tend to be
    transparent across Latin-derived languages (pentagon, pentágono, pentagone,
    etc.), but locale-specific simplification may apply (e.g., "5-sided
    shape" descriptive form vs technical name). Operator-side teachers
    can layer in technical-vs-descriptive naming conventions per locale.

