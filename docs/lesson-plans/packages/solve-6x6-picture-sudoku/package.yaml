assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Solve a 6×6 picture-sudoku with 20+ given clues (easy) in 6 of 10
        attempts.
      - Solve a 6×6 picture-sudoku with 16-18 given clues (medium) in 4 of
        10 attempts.
      - Articulate the rule for 6×6 ("each picture appears once per row,
        once per column, once per 2×3 box") when asked.

    Differentiation:
    - Pre-K: NOT appropriate (use solve-4x4-picture-sudoku; Arc 5 Phase 3).
    - K: NOT appropriate; cognitive-load is Grade 1+ territory.
    - Grade 1+: 6×6 easy as introduction; medium with extended time;
      hard for Grade 2+.
    - Grade 2+: extend to 9×9 sudoku in future arc (NOT in current
      catalog scope).

