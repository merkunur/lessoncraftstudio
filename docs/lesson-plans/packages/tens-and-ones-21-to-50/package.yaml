# Teaching package — tens and ones (place value 21 to 50)
# Arc 15 Phase 2 (math / place-value 1/8 → 2/8; deepens Arc 15 Phase 1 foundation).

targetSlug: tens-and-ones-21-to-50
language: en
title:
  en: "Tens and Ones to 50 — bigger two-digit numbers"
description:
  en: "Grade 1 / Grade 2 math package extending place-value understanding from numbers 1-20 (Arc 15 Phase 1 tens-and-ones-1-to-20) to numbers 21-50. Builds directly on Phase 1 foundation. Examples: 25 = 2 tens + 5 ones; 37 = 3 tens + 7 ones; 50 = 5 tens + 0 ones. Critical scaling work — kids now understand multi-tens-place numbers + can extend pattern from 1-tens (10-20) to 2-tens-3-tens-4-tens-5-tens. Foundation for full place-value-to-100 work + later place-value-with-regrouping (addition + subtraction carrying/borrowing). Place-value strand: 1/8 → 2/8 at Phase 2 close. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + extension introduction. Teacher displays
      25 single-counters + groups them as 2 BUNDLES OF 10 + 5
      LOOSE COUNTERS. "Last time we learned tens-and-ones up to
      20. Today we go BIGGER — up to 50! When we have 25 things,
      we group as 2 tens + 5 ones. The '2' on the left means 2
      tens (20 things); the '5' on the right means 5 ones (5
      things)." Teacher repeats with 37 (3 tens + 7 ones) + 50
      (5 tens + 0 ones) + 42 (4 tens + 2 ones). Pattern emphasis:
      "First digit is the TENS count; second digit is the ONES."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + place-value routine. Each pair receives base-ten
      manipulative kits for numbers 21-50. Pair takes turns: kid
      A shows a number with manipulatives (e.g., 3 ten-sticks +
      4 ones = 34); kid B writes digital number (34). Reverse:
      kid A writes a number (e.g., 47); kid B builds it. Recast
      errors with grouping demo ("you built 32 with 2 ten-sticks
      and 12 ones. Let's regroup — 10 of those ones make another
      ten-stick. So 32 = 3 tens + 2 ones, not 2 tens + 12 ones.").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (number to
      tens-and-ones representation for 21-50 range). Station 2:
      math-puzzle (decompose a number into tens + ones: 45 = ?
      tens + ? ones). Station 3: pattern-train (sequence: 30,
      31, 32, 33...). Station 4: more-less (compare two two-digit
      numbers: 34 vs 43 — which is greater?).
  closure:
    durationMinutes: 5
    body: |
      Whole-class place-value quiz. Teacher shows 6 numbers (24,
      37, 41, 35, 49, 50); class collectively names tens + ones
      for each. "24 = 2 tens + 4 ones! 37 = 3 tens + 7 ones!
      50 = 5 tens + 0 ones!" Forward-pointer: "Today we did
      tens-and-ones up to 50. When we come back next, we can do
      tens-and-ones up to 100 + start HUNDREDS + TENS + ONES
      for three-digit numbers like 137 or 245!"

