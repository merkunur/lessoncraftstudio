<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Christmas Coloring Pages - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: #F5E6D3; overflow: hidden;">

        <!-- Subtle texture overlay -->
        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at 70% 30%, rgba(200,75,75,0.06) 0%, transparent 50%), radial-gradient(circle at 30% 70%, rgba(45,90,74,0.05) 0%, transparent 40%);"></div>

        <!-- Pine branch corner decorations -->
        <!-- Top left pine -->
        <div style="position: absolute; top: 0; left: 0; width: 180px; height: 120px; overflow: hidden;">
            <div style="position: absolute; top: -20px; left: -30px; transform: rotate(45deg);">
                <div style="width: 8px; height: 80px; background: #5D4037;"></div>
                <div style="position: absolute; top: 15px; left: -10px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 25px solid #2D5A4A; transform: rotate(-30deg);"></div>
                <div style="position: absolute; top: 30px; left: -12px; width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 30px solid #2D5A4A; transform: rotate(-35deg);"></div>
                <div style="position: absolute; top: 50px; left: -15px; width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 35px solid #2D5A4A; transform: rotate(-40deg);"></div>
            </div>
        </div>

        <!-- Bottom right pine -->
        <div style="position: absolute; bottom: 0; right: 0; width: 180px; height: 120px; overflow: hidden;">
            <div style="position: absolute; bottom: -20px; right: -30px; transform: rotate(-135deg);">
                <div style="width: 8px; height: 80px; background: #5D4037;"></div>
                <div style="position: absolute; top: 15px; left: -10px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 25px solid #2D5A4A; transform: rotate(-30deg);"></div>
                <div style="position: absolute; top: 30px; left: -12px; width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-bottom: 30px solid #2D5A4A; transform: rotate(-35deg);"></div>
                <div style="position: absolute; top: 50px; left: -15px; width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 35px solid #2D5A4A; transform: rotate(-40deg);"></div>
            </div>
        </div>

        <!-- Gold accent dots -->
        <div style="position: absolute; top: 100px; left: 140px; width: 12px; height: 12px; background: #E8B86D; border-radius: 50%; box-shadow: 0 2px 8px rgba(232,184,109,0.4);"></div>
        <div style="position: absolute; top: 80px; right: 160px; width: 10px; height: 10px; background: #E8B86D; border-radius: 50%; box-shadow: 0 2px 8px rgba(232,184,109,0.4);"></div>
        <div style="position: absolute; bottom: 180px; left: 100px; width: 8px; height: 8px; background: #E8B86D; border-radius: 50%; box-shadow: 0 2px 8px rgba(232,184,109,0.4);"></div>
        <div style="position: absolute; bottom: 200px; right: 120px; width: 10px; height: 10px; background: #E8B86D; border-radius: 50%; box-shadow: 0 2px 8px rgba(232,184,109,0.4);"></div>

        <!-- FREE Badge - Cranberry Circle -->
        <div style="position: absolute; top: 30px; left: 30px; z-index: 100;">
            <div style="width: 85px; height: 85px; border-radius: 50%; background: linear-gradient(145deg, #C84B4B 0%, #A03030 100%); box-shadow: 0 6px 20px rgba(200,75,75,0.4), inset 0 -3px 10px rgba(0,0,0,0.15), inset 0 3px 6px rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">FREE</span>
            </div>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 35px; left: 0; right: 0; text-align: center;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; color: #C84B4B; margin: 0; text-shadow: 2px 2px 0 rgba(255,255,255,0.6);">What's Inside?</h1>
        </div>

        <!-- Gift Box Visual - Spilling content -->
        <div style="position: absolute; top: 100px; left: 50%; transform: translateX(-50%); z-index: 20;">
            <!-- Gift box -->
            <div style="width: 220px; height: 180px; background: linear-gradient(180deg, #C84B4B 0%, #A03030 100%); border-radius: 10px; box-shadow: 0 15px 40px rgba(160,48,48,0.35); position: relative; transform: rotate(-5deg);">
                <!-- Ribbon vertical -->
                <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 35px; height: 100%; background: linear-gradient(90deg, #E8B86D 0%, #D4A55A 50%, #E8B86D 100%);"></div>
                <!-- Ribbon horizontal -->
                <div style="position: absolute; top: 50%; left: 0; transform: translateY(-50%); width: 100%; height: 35px; background: linear-gradient(180deg, #E8B86D 0%, #D4A55A 50%, #E8B86D 100%);"></div>
                <!-- Bow -->
                <div style="position: absolute; top: -25px; left: 50%; transform: translateX(-50%);">
                    <div style="width: 50px; height: 30px; background: #E8B86D; border-radius: 50% 50% 0 0; position: absolute; left: -30px; top: 5px; transform: rotate(-20deg);"></div>
                    <div style="width: 50px; height: 30px; background: #E8B86D; border-radius: 50% 50% 0 0; position: absolute; right: -30px; top: 5px; transform: rotate(20deg);"></div>
                    <div style="width: 25px; height: 25px; background: #D4A55A; border-radius: 50%; position: absolute; left: 50%; top: 10px; transform: translateX(-50%);"></div>
                </div>
            </div>
        </div>

        <!-- Feature Cards - Spilling from gift -->
        <!-- Card 1: Cozy Scenes -->
        <div style="position: absolute; top: 290px; left: 80px; z-index: 30;">
            <div style="background: linear-gradient(135deg, #2D5A4A 0%, #1E3D32 100%); padding: 25px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(45,90,74,0.35); transform: rotate(-5deg); width: 200px;">
                <div style="font-size: 40px; margin-bottom: 10px;">🏠</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: white;">Cozy Scenes</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: rgba(255,255,255,0.8); margin-top: 5px;">Warm & inviting</div>
            </div>
        </div>

        <!-- Card 2: Holiday Themes -->
        <div style="position: absolute; top: 280px; left: 50%; transform: translateX(-50%); z-index: 35;">
            <div style="background: linear-gradient(135deg, #C84B4B 0%, #A03030 100%); padding: 28px 35px; border-radius: 22px; box-shadow: 0 12px 35px rgba(200,75,75,0.4); width: 220px;">
                <div style="font-size: 44px; margin-bottom: 12px;">🎄</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white;">Holiday Themes</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 15px; color: rgba(255,255,255,0.85); margin-top: 6px;">Trees, gifts, stockings</div>
            </div>
        </div>

        <!-- Card 3: Two Orientations -->
        <div style="position: absolute; top: 290px; right: 80px; z-index: 30;">
            <div style="background: linear-gradient(135deg, #E8B86D 0%, #D4A55A 100%); padding: 25px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(232,184,109,0.4); transform: rotate(5deg); width: 200px;">
                <div style="font-size: 40px; margin-bottom: 10px;">🖼️</div>
                <div style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 24px; color: #5D4037;">Two Orientations</div>
                <div style="font-family: 'Nunito', sans-serif; font-weight: 600; font-size: 14px; color: rgba(93,64,55,0.85); margin-top: 5px;">Portrait & Landscape</div>
            </div>
        </div>

        <!-- Sample Pages Fanned at Bottom -->
        <div style="position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); display: flex; gap: 25px; z-index: 40;">
            <!-- Page 1 -->
            <div style="transform: rotate(-8deg); box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
                <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-1.jpeg" style="width: 180px; height: auto; border-radius: 10px; border: 5px solid white;">
            </div>
            <!-- Page 2 -->
            <div style="transform: rotate(0deg) translateY(-15px); box-shadow: 0 12px 35px rgba(0,0,0,0.25); z-index: 5;">
                <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-6.jpeg" style="width: 200px; height: auto; border-radius: 12px; border: 6px solid white;">
            </div>
            <!-- Page 3 -->
            <div style="transform: rotate(8deg); box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
                <img src="https://www.lessoncraftstudio.com/samples/english/coloring/sample-3.jpeg" style="width: 180px; height: auto; border-radius: 10px; border: 5px solid white;">
            </div>
        </div>

        <!-- Bottom Theme Pills -->
        <div style="position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;">
            <div style="background: #2D5A4A; padding: 10px 18px; border-radius: 20px; box-shadow: 0 3px 12px rgba(45,90,74,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Christmas Trees</span>
            </div>
            <div style="background: #C84B4B; padding: 10px 18px; border-radius: 20px; box-shadow: 0 3px 12px rgba(200,75,75,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Fireplaces</span>
            </div>
            <div style="background: #5D4037; padding: 10px 18px; border-radius: 20px; box-shadow: 0 3px 12px rgba(93,64,55,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Winter Cottages</span>
            </div>
            <div style="background: #E8B86D; padding: 10px 18px; border-radius: 20px; box-shadow: 0 3px 12px rgba(232,184,109,0.3);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #5D4037;">Cozy Pets</span>
            </div>
        </div>

    </div>
</body>
</html>
