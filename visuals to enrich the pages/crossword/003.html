<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Picture Crossword - Progression Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Fredoka', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; overflow: hidden; background: linear-gradient(180deg, #E0F2FE 0%, #BAE6FD 50%, #7DD3FC 100%);">

        <!-- Subtle grid pattern background -->
        <div style="position: absolute; inset: 0; opacity: 0.06; background-image:
            linear-gradient(to right, #1A365D 1px, transparent 1px),
            linear-gradient(to bottom, #1A365D 1px, transparent 1px);
            background-size: 40px 40px;"></div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 25px; left: 25px;">
            <div style="width: 80px; height: 80px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(249,115,22,0.5);">
                <span style="font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 700; color: white;">FREE</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 30px; right: 30px;">
            <div style="background: #1A365D; padding: 10px 22px; border-radius: 25px; box-shadow: 0 3px 10px rgba(0,0,0,0.15);">
                <span style="font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: #FDF5E6; letter-spacing: 1px;">GRADES K-3</span>
            </div>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 35px; left: 50%; transform: translateX(-50%); text-align: center;">
            <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-size: 62px; font-weight: 700; color: #1A365D; text-shadow: 0 3px 6px rgba(0,0,0,0.1);">Pick Your Grid Size!</h1>
        </div>

        <!-- Staircase progression -->
        <div style="position: absolute; top: 140px; left: 50%; transform: translateX(-50%); width: 920px; height: 680px;">

            <!-- Step 1 - 6x6 STARTER (lowest, left) -->
            <div style="position: absolute; left: 0; bottom: 0;">
                <!-- Step platform -->
                <div style="width: 280px; height: 180px; background: linear-gradient(145deg, #22C55E 0%, #16A34A 100%); border-radius: 15px 15px 0 0; box-shadow: 0 -5px 20px rgba(34,197,94,0.3); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 15px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 36px; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">6×6</span>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.9);">STARTER</span>
                    <div style="display: flex; gap: 5px; margin-top: 8px;">
                        <span style="font-size: 24px;">⭐</span>
                    </div>
                </div>
                <!-- Worksheet on step -->
                <div style="position: absolute; top: -220px; left: 50%; transform: translateX(-50%); width: 160px; height: 210px; background: white; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.25); overflow: hidden; border: 3px solid #22C55E;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/crossword/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="6x6 Worksheet">
                </div>
            </div>

            <!-- Step 2 - 7x7 LEVEL UP (middle) -->
            <div style="position: absolute; left: 320px; bottom: 0;">
                <!-- Step platform -->
                <div style="width: 280px; height: 300px; background: linear-gradient(145deg, #F97316 0%, #EA580C 100%); border-radius: 15px 15px 0 0; box-shadow: 0 -5px 20px rgba(249,115,22,0.3); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 15px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 40px; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">7×7</span>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.9);">LEVEL UP</span>
                    <div style="display: flex; gap: 5px; margin-top: 8px;">
                        <span style="font-size: 26px;">⭐</span>
                        <span style="font-size: 26px;">⭐</span>
                    </div>
                </div>
                <!-- Worksheet on step -->
                <div style="position: absolute; top: -240px; left: 50%; transform: translateX(-50%); width: 180px; height: 235px; background: white; border-radius: 8px; box-shadow: 0 8px 25px rgba(0,0,0,0.25); overflow: hidden; border: 3px solid #F97316;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/crossword/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="7x7 Worksheet">
                </div>
            </div>

            <!-- Step 3 - 8x8 WORD MASTER (highest, right) -->
            <div style="position: absolute; right: 0; bottom: 0;">
                <!-- Step platform -->
                <div style="width: 280px; height: 420px; background: linear-gradient(145deg, #DC2626 0%, #B91C1C 100%); border-radius: 15px 15px 0 0; box-shadow: 0 -5px 20px rgba(220,38,38,0.3); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 15px;">
                    <span style="font-family: 'Fredoka', sans-serif; font-size: 44px; font-weight: 700; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">8×8</span>
                    <span style="font-family: 'Nunito', sans-serif; font-size: 24px; font-weight: 700; color: rgba(255,255,255,0.9);">WORD MASTER</span>
                    <div style="display: flex; gap: 5px; margin-top: 8px; align-items: center;">
                        <span style="font-size: 28px;">⭐</span>
                        <span style="font-size: 28px;">⭐</span>
                        <span style="font-size: 28px;">⭐</span>
                    </div>
                </div>
                <!-- Crown above -->
                <div style="position: absolute; top: -300px; left: 50%; transform: translateX(-50%); font-size: 50px;">👑</div>
                <!-- Worksheet on step -->
                <div style="position: absolute; top: -260px; left: 50%; transform: translateX(-50%); width: 200px; height: 260px; background: white; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3), 0 0 0 4px #D4A439; overflow: hidden; border: 3px solid #DC2626;">
                    <img src="https://www.lessoncraftstudio.com/samples/english/crossword/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="8x8 Worksheet">
                </div>
            </div>

            <!-- Connecting arrows between steps -->
            <div style="position: absolute; left: 260px; bottom: 220px; font-size: 50px; color: #1A365D; transform: rotate(-20deg);">➜</div>
            <div style="position: absolute; left: 580px; bottom: 340px; font-size: 50px; color: #1A365D; transform: rotate(-20deg);">➜</div>
        </div>

        <!-- Bottom progression strip -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 70px; background: white; display: flex; align-items: center; justify-content: center; gap: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1);">
            <span style="font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 700; color: #22C55E;">Easy Start</span>
            <span style="font-size: 28px; color: #22C55E;">→</span>
            <span style="font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 700; color: #F97316;">Build Skills</span>
            <span style="font-size: 28px; color: #F97316;">→</span>
            <span style="font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 700; color: #DC2626;">Master Level</span>
            <span style="font-size: 28px; color: #DC2626;">🏆</span>
        </div>

    </div>
</body>
</html>
