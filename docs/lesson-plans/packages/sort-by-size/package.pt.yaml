# Teaching package — sort objects by size (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 7 Phase 3 per Arc 3 Phase 1 sparse-override pattern).
# Cross-arc-package integration with use-size-comparison-words.pt (Arc 6 Phase 3) —
# kids who learned size-comparison vocabulary in pt sparse-override transfer the
# skill into sorting context. BR Portuguese register per CLAUDE.md §6.

title:
  pt: "Classifica por tamanho — agrupa objetos pelo atributo tamanho"
description:
  pt: "Pacote de função executiva para Pré-K a Primeiro Ano que ensina classificação por atributo de tamanho. Fecha a trilogia de classificação por atributo básico: classifica-por-cor (Arc 5 Fase 3) + classifica-por-forma (Arc 5 Fase 3) + classifica-por-tamanho (este pacote). Superfície de transferência cognitiva: as crianças que aprenderam classificação por cor/forma agora retêm 'tamanho' como regra. Ancorado em vocabulário contra use-size-comparison-words (Arc 6 Fase 1)."

structure:
  warmup:
    body: |
      Apresentação para toda a turma. A professora ou o professor coloca
      3 objetos de tamanhos contrastantes no tapete (e.g., um grande urso
      de pelúcia, um urso de pelúcia médio, um urso de pelúcia pequeno).
      Nomeia cada um: "Este é GRANDE, este é MÉDIO, este é PEQUENO." A
      turma repete. Depois mistura mais objetos de tamanhos variados; a
      turma colaborativamente coloca cada um em tapetes rotulados
      "GRANDE / MÉDIO / PEQUENO". Reforça o vocabulário de tamanho
      (de use-size-comparison-words; Arc 6 Fase 1) + a meta-habilidade
      de "olhar através de" um grupo para um atributo (tamanho).
  contentActivity:
    body: |
      Rotina de classificação para toda a turma. A professora ou o professor
      coloca 3 cartões de tapete de tamanho (GRANDE / MÉDIO / PEQUENO) no
      tapete. Pega objetos misturados de tamanhos variados; a turma
      colaborativamente coloca cada um no tapete correspondente. Trabalho
      em duplas: a criança A pega um objeto; a criança B identifica o seu
      tamanho e coloca-o. Refraseie os erros. Extensão opcional: as
      crianças notam que o tamanho é RELATIVO (um cachorro pequeno é
      pequeno comparado com um cavalo, mas grande comparado com um
      ratinho) — discuta a dependência do contexto do atributo.
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios picture-sort
      (classifica objetos entre 2 contrastes de tamanho — grande vs
      pequeno). Estação 2: folha de exercícios big-small (as crianças
      identificam qual de 2 objetos é o maior/menor). Estação 3:
      classificação prática de tamanho com recortes manipulativos (as
      crianças colocam fisicamente 20+ recortes em 3 tapetes de tamanho;
      enfatiza atenção sustentada de classificação de múltiplos objetos).
  closure:
    body: |
      Recordação rápida com toda a turma. A professora ou o professor
      nomeia um tamanho; as crianças mostram com objetos da sala de aula
      ("encontrem todos algo PEQUENO!"). Indicador adiante: "Hoje
      classificamos por tamanho. Agora sabemos como classificar por COR,
      FORMA e TAMANHO — três maneiras diferentes de olhar para os mesmos
      objetos."

assessmentCriteria:
  pt: |
    Classificar 8-10 objetos misturados por tamanho em 2 categorias
    (grande vs pequeno) com 90%+ de precisão. Classificar 12-15 objetos
    misturados em 3 categorias (grande / médio / pequeno) com 75%+ de
    precisão. Usar vocabulário de tamanho espontaneamente ao classificar
    (verificação da âncora de vocabulário).

    Diferenciação:
      - Pré-K: classificação de apenas 2 tamanhos (grande vs pequeno).
      - K: classificação de 3 tamanhos; substrato de objetos misturados.
      - Primeiro ano em diante: estender para sort-by-multiple-attributes
        (classifica por cor E tamanho; ou forma E tamanho simultaneamente)
        — combina o trabalho de trilogia de atributo básico em raciocínio
        de múltiplos atributos.

compositionalRationale:
  pt: |
    Fio principal: função cognitiva e executiva / classificação. Fio
    secundário: aquisição de vocabulário (vocabulário de comparação de
    tamanho ancorado; depende do pacote use-size-comparison-words do
    Arco 6 Fase 1). Fio terciário: raciocínio comparativo (classificar
    por tamanho requer a mesma habilidade comparativa que compare-by-
    length / compare-by-weight do fio de medição da numeracia).

    Significância arquitetural: fecha a trilogia de classificação por
    atributo básico. O Arco 5 Fase 3 enviou sort-by-color + sort-by-
    shape; este pacote do Arco 7 Fase 1 adiciona sort-by-size. A
    trilogia valida que a arquitetura de classificação por atributo
    generaliza-se através dos 3 atributos visuais mais básicos
    (cor → forma → tamanho).

    Integração interpacotes: este pacote depende pedagogicamente de
    use-size-comparison-words (Arc 6 Fase 1) — as crianças devem
    saber vocabulário grande/pequeno/médio antes de classificar por
    tamanho. Valida cadeia de pré-requisito de arco para arco (Arc 6
    vocab → Arc 7 sorting usando vocab). Em pt-BR especificamente,
    esta integração entre arcos manifesta-se na transferência da
    morfologia comparativa "maior/menor" (use-size-comparison-words.pt
    introduziu-a; sort-by-size.pt aplica-a).

    Relevância para sala de aula multilíngue K-3: o reconhecimento de
    tamanho é universal; o vocabulário de tamanho é específico do
    locale (formas suplétivas em pt: maior/menor; sufixo -er em en:
    bigger/smaller; mehr/weniger analítico em de). O pacote utiliza a
    renderização em 11 locales do aplicativo big-small existente; o
    idioma de instrução do operador define a saída renderizada.
