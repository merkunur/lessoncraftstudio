compositionalRationale:
  en: |
    Primary strand: early-numeracy / measurement (weight comparison).
    Secondary strand: vocabulary acquisition (vocab-anchored —
    comparative vocab heavier/lighter/same-weight). Tertiary strand:
    physical-reasoning (kids develop intuition that weight is
    physically distinct from size).

    Architectural significance: deepens measurement strand from
    1/9 → 2/9. RESOLVES Arc 9 compare-by-length forward-pointer to
    weight + capacity. Measurement progression: length (Arc 9) →
    weight (this package) → capacity (Arc 12+ candidate).

    Distinctive composition: 2 big-small exercises (find-one mode) +
    2 matching exercises + 1 odd-one-out. Sibling structural template
    to Arc 9 compare-by-length — same composition pattern, different
    measurement dimension.

    Cross-strand integration: measurement + comparative grammar
    (linguistic) + physical reasoning (intuitive). The package
    leverages Arc 9 compare-by-length comparative-grammar work as
    grammatical foundation; new content is the WEIGHT dimension.

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Weight comparisons work with ANY 2 objects of distinct weight.

    K-3 multilingual classroom relevance: comparative grammar
    structures ('heavier than' / 'lighter than') are mid-frequency
    K-3 grammatical targets across all 11 platform locales. Cognate-
    rich for Romance: heavier/más pesado/mais pesado/più pesante.

