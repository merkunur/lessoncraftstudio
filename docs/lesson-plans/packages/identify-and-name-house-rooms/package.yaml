# Teaching package — identify and name 10 rooms and parts of a house
# Arc 2 Phase 3b. Vocab keys verified: bed, door, garage, garden, kitchen, lamp,
# sofa, stairs, television, window (10/10 with full 11-locale entries).
# Note: target named "house-rooms" but vocab is mixed (parts + items + 1 room
# "kitchen") per taxonomy entry "Identify and name 10 rooms and parts of a house"
# in learning-targets.json.

targetSlug: identify-and-name-house-rooms
language: en

title:
  en: "House — identify and name 10 rooms and items"
description:
  en: "K-Grade 1 vocabulary-acquisition package for 10 universal house rooms and items: bed, door, garage, garden, kitchen, lamp, sofa, stairs, television, window. 5 worksheet exercises + 8 printable materials. Mixed-category vocabulary (room + furniture + house parts) per learning-targets.json target definition. Theme-agnostic; operator selects target instruction language at material-render time."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up flashcards, names each house
      item in target language, class repeats chorally. Optional: kids point to
      similar items in the classroom (real lamp, real window, real chair near
      sofa-equivalent). Pin cards to "House" word wall cluster.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("I see a {item}" + "I have a
      {item}"). Choral reading first, then individual reads. Pair work: kids hold
      a picture-card, partner names the item AND if applicable says where in a
      house it belongs ("the lamp is in the bedroom").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: image-letter matching. Station 2: picture-card
      house-mapping on the carpet (kids arrange cards spatially as if drawing a
      house — bedroom items together, kitchen items together, etc.). Station 3:
      manipulative cut-outs counting work.
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Final challenge: teacher names a house item, kids
      point to flashcard. Forward-pointer: "Today we learned 10 house words.
      When we come back to house words next, this same set will be here."

