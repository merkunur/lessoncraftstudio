<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Subtraktion Arbeitsbl&auml;tter - Professional Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #37474F 0%, #263238 50%, #1A2327 100%); overflow: hidden;">

        <!-- Subtle grid pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.04; background-image: linear-gradient(rgba(144,164,174,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(144,164,174,0.5) 1px, transparent 1px); background-size: 50px 50px;"></div>

        <!-- Spotlight glow on center -->
        <div style="position: absolute; top: 35%; left: 50%; width: 500px; height: 500px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(120,144,156,0.08) 0%, transparent 60%); border-radius: 50%;"></div>

        <!-- Corner accents - blue steel L-shapes -->
        <!-- Top-left -->
        <div style="position: absolute; top: 20px; left: 20px;">
            <div style="width: 60px; height: 4px; background: linear-gradient(90deg, #78909C, #90A4AE); border-radius: 2px;"></div>
            <div style="width: 4px; height: 60px; background: linear-gradient(180deg, #78909C, #90A4AE); border-radius: 2px;"></div>
        </div>
        <!-- Top-right -->
        <div style="position: absolute; top: 20px; right: 20px;">
            <div style="width: 60px; height: 4px; background: linear-gradient(270deg, #78909C, #90A4AE); border-radius: 2px; margin-left: auto;"></div>
            <div style="width: 4px; height: 60px; background: linear-gradient(180deg, #78909C, #90A4AE); border-radius: 2px; margin-left: auto;"></div>
        </div>
        <!-- Bottom-left -->
        <div style="position: absolute; bottom: 20px; left: 20px;">
            <div style="width: 4px; height: 60px; background: linear-gradient(0deg, #78909C, #90A4AE); border-radius: 2px;"></div>
            <div style="width: 60px; height: 4px; background: linear-gradient(90deg, #78909C, #90A4AE); border-radius: 2px;"></div>
        </div>
        <!-- Bottom-right -->
        <div style="position: absolute; bottom: 20px; right: 20px;">
            <div style="width: 4px; height: 60px; background: linear-gradient(0deg, #78909C, #90A4AE); border-radius: 2px; margin-left: auto;"></div>
            <div style="width: 60px; height: 4px; background: linear-gradient(270deg, #78909C, #90A4AE); border-radius: 2px; margin-left: auto;"></div>
        </div>

        <!-- Title Section -->
        <div style="position: absolute; top: 55px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 68px; color: #CFD8DC; margin: 0; letter-spacing: 5px; text-shadow: 2px 2px 8px rgba(0,0,0,0.3);">SUBTRAKTION</h1>
            <div style="margin-top: 8px;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; color: #78909C; letter-spacing: 5px; text-transform: uppercase;">Professionelle Arbeitsbl&auml;tter</span>
            </div>
            <!-- Blue steel divider line -->
            <div style="width: 200px; height: 2px; background: linear-gradient(90deg, transparent, #78909C, #90A4AE, #78909C, transparent); margin: 16px auto 0 auto;"></div>
        </div>

        <!-- 3 Museum-style frames -->
        <div style="position: absolute; top: 210px; left: 50%; transform: translateX(-50%); width: 880px; height: 460px; display: flex; align-items: flex-end; justify-content: center; gap: 35px;">

            <!-- Left frame - worksheet -->
            <div style="text-align: center;">
                <div style="width: 210px; height: 272px; padding: 8px; background: linear-gradient(145deg, #546E7A, #78909C, #90A4AE, #78909C, #546E7A); border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);">
                    <div style="width: 100%; height: 100%; background: #1A2327; border-radius: 3px; overflow: hidden; padding: 4px;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover; border-radius: 2px;" alt="Durchstreichen Arbeitsblatt">
                    </div>
                </div>
                <!-- Label plaque -->
                <div style="margin-top: 12px; background: linear-gradient(145deg, #546E7A, #78909C, #90A4AE, #78909C, #546E7A); padding: 6px 18px; border-radius: 4px; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: white; letter-spacing: 2px; text-transform: uppercase;">Durchstreichen</span>
                </div>
            </div>

            <!-- Center frame - larger, hero with spotlight -->
            <div style="text-align: center; margin-bottom: 20px;">
                <!-- Spotlight glow -->
                <div style="position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 300px; height: 400px; background: radial-gradient(ellipse at top, rgba(144,164,174,0.12) 0%, transparent 60%); pointer-events: none;"></div>
                <div style="width: 250px; height: 323px; padding: 10px; background: linear-gradient(145deg, #546E7A, #78909C, #90A4AE, #B0BEC5, #90A4AE, #78909C, #546E7A); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);">
                    <div style="width: 100%; height: 100%; background: #1A2327; border-radius: 4px; overflow: hidden; padding: 5px;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover; border-radius: 3px;" alt="Subtraktions-Arbeitsblatt">
                    </div>
                </div>
                <!-- Label plaque -->
                <div style="margin-top: 12px; background: linear-gradient(145deg, #546E7A, #78909C, #90A4AE, #78909C, #546E7A); padding: 6px 18px; border-radius: 4px; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: white; letter-spacing: 2px; text-transform: uppercase;">Arbeitsblatt</span>
                </div>
            </div>

            <!-- Right frame - answer key -->
            <div style="text-align: center;">
                <div style="width: 210px; height: 272px; padding: 8px; background: linear-gradient(145deg, #546E7A, #78909C, #90A4AE, #78909C, #546E7A); border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);">
                    <div style="width: 100%; height: 100%; background: #1A2327; border-radius: 3px; overflow: hidden; padding: 4px;">
                        <img src="https://www.lessoncraftstudio.com/samples/german/subtraction/sample-1-answer.jpeg" style="width: 100%; height: 100%; object-fit: cover; border-radius: 2px;" alt="L&ouml;sungsschl&uuml;ssel">
                    </div>
                </div>
                <!-- Label plaque -->
                <div style="margin-top: 12px; background: linear-gradient(145deg, #546E7A, #78909C, #90A4AE, #78909C, #546E7A); padding: 6px 18px; border-radius: 4px; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 11px; color: white; letter-spacing: 2px; text-transform: uppercase;">L&Ouml;SUNGSSCHL&Uuml;SSEL</span>
                </div>
            </div>
        </div>

        <!-- Museum plaque - brushed metal -->
        <div style="position: absolute; bottom: 115px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, #546E7A, #78909C, #90A4AE, #B0BEC5, #90A4AE, #78909C, #546E7A); padding: 14px 48px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);">
            <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: white; letter-spacing: 2px; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">Die Kunst des Abziehens</span>
        </div>

        <!-- Feature Pills - frosted glass with blue steel borders -->
        <div style="position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px;">
            <div style="background: rgba(55,71,79,0.7); backdrop-filter: blur(4px); padding: 10px 16px; border-radius: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.2); border: 2px solid #78909C;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #CFD8DC;">Druckfertig</span>
            </div>
            <div style="background: rgba(55,71,79,0.7); backdrop-filter: blur(4px); padding: 10px 16px; border-radius: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.2); border: 2px solid #78909C;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #CFD8DC;">Keine Vorbereitung</span>
            </div>
            <div style="background: rgba(55,71,79,0.7); backdrop-filter: blur(4px); padding: 10px 16px; border-radius: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.2); border: 2px solid #78909C;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #CFD8DC;">L&ouml;sungen inklusive</span>
            </div>
            <div style="background: rgba(55,71,79,0.7); backdrop-filter: blur(4px); padding: 10px 16px; border-radius: 22px; box-shadow: 0 3px 12px rgba(0,0,0,0.2); border: 2px solid #78909C;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #CFD8DC;">Differenziert</span>
            </div>
        </div>

    </div>
</body>
</html>
