compositionalRationale:
  en: |
    Primary strand: early-literacy / vocabulary-acquisition (action-verb
    naming). Secondary strand: speaking-and-listening (productive
    action-description language). Tertiary strand: motor + kinesthetic
    integration (charades + embodied verb-action).

    **Architectural significance: SUBSTRATE-UNBLOCKED PACKAGE.** Companion
    to identify-and-name-family-members (Arc 12 Phase 1 Path A sibling).
    Action-verbs deferral chain extended Arc 4 → 11 with family-members;
    Stream A Phase 1 substrate ship at Arc 12 commencement closed both.
    This package brings vocabulary-acquisition strand from 22/24 → 23/24
    (3 packages from saturation; only point-to-named-clothing-item
    remaining unauthored).

    Distinctive composition: vocabKeyList material parameter usage
    continuing pattern from family-members package. 10 action-verb
    keys explicitly listed = exactly the action-verb vocab subset
    materializes per material. Charades + embodied learning drive
    the contentActivity.

    Verbs are sentence-engines: action-verb vocabulary is the
    foundational element for productive-language sentence
    construction. Once kids know subject-vocabulary (Arc 1+5+6+8+9+10+11
    nouns) + verb-vocabulary (this package), they can construct
    simple subject-verb sentences ("The cat sleeps." "I jump.").
    Sentence-construction work follows in future arcs.

    Class A CLEAN substrate (post-Stream-A-Phase-1-ship): action-verb
    vocabulary in IMAGE_VOCABULARY across all 11 platform locales with
    cross-locale conjugation/infinitive forms.

    K-3 multilingual classroom relevance: action verbs are high-
    frequency K-3 target across all 11 platform locales. Romance
    locales' verb-conjugation (es: corro/corres/corre = I run / you
    run / he-she runs) is grammatically complex; this package focuses
    on infinitive/base form first; conjugation work belongs in later
    arcs. Pt-BR: ar/-er/-ir verb conjugations meaningful pedagogical
    surface; sparse-override at Phase 3 can introduce conjugation
    awareness.

