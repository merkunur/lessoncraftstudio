compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial / drawing-and-
    tracing (closed-figure tracing — extends strand to 3/4).
    Secondary strand: vocabulary-acquisition (shape names: circle,
    square, triangle, rectangle, oval, diamond). Tertiary strand:
    visual-discrimination (recognizing shapes across exercises).

    Architectural significance: extends drawing-and-tracing strand
    from 2/4 to 3/4. Pairs with Arc 14 Phase 2 sibling draw-2d-
    shapes-freehand (saturates strand to 4/4). Builds on Arc 9-12
    trace-straight-lines + trace-curved-lines foundation; tracing
    closed-figures is the canonical bridge from line-tracing
    (open paths) to closed-shape drawing.

    Distinctive composition: 3 matching + 2 missing-pieces. Shape-
    recognition emphasis throughout exercise composition; tracing
    work happens primarily in the dedicated tracing-strips material.

    Class B FLEXIBLE substrate: composes against shapes image-
    library theme; tracing-strips material directly supports the
    fine-motor work.

    K-3 multilingual classroom relevance: shape vocabulary
    cognate-rich Romance (circle / círculo / cercle / cerchio) +
    Germanic (Kreis / cirkel / circle) accessibility for K-3
    multilingual classrooms. Tracing pencil-control is universally
    relevant; vocabulary anchor varies.

