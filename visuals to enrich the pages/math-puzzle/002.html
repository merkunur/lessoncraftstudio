<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Math Puzzles - Features Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(165deg, #FFF8E7 0%, #F5E6C8 50%, #EED9B6 100%); overflow: hidden;">

        <!-- Subtle dot pattern -->
        <div style="position: absolute; inset: 0; opacity: 0.08; background-image: radial-gradient(#6A1B9A 1.5px, transparent 1.5px); background-size: 30px 30px;"></div>

        <!-- Soft decorative shapes -->
        <div style="position: absolute; top: -100px; right: -100px; width: 350px; height: 350px; background: radial-gradient(circle, rgba(106,27,154,0.08) 0%, transparent 70%); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: -80px; left: -80px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(255,140,66,0.1) 0%, transparent 70%); border-radius: 50%;"></div>

        <!-- FREE Badge -->
        <div style="position: absolute; top: 28px; left: 28px; z-index: 100;">
            <div style="width: 95px; height: 95px; background: linear-gradient(145deg, #6A1B9A 0%, #4A148C 100%); box-shadow: 0 6px 25px rgba(106,27,154,0.45), inset 0 -3px 10px rgba(0,0,0,0.2), inset 0 3px 8px rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border-radius: 50%;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">FREE</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: white; padding: 12px 24px; border-radius: 28px; box-shadow: 0 4px 18px rgba(0,0,0,0.15); border: 3px solid #FF8C42;">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; color: #E65100; letter-spacing: 1px;">GRADES K-2</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 85px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 74px; color: #6A1B9A; margin: 0; text-shadow: 3px 3px 0 rgba(106,27,154,0.15);">PRINT & GO</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 40px; color: #FF8C42; margin: 8px 0 0 0;">Math Puzzle Fun</h2>
        </div>

        <!-- Feature Arc - 5 circles -->
        <div style="position: absolute; top: 240px; left: 50%; transform: translateX(-50%); width: 800px; height: 180px;">
            <!-- Self-Checking -->
            <div style="position: absolute; left: 40px; top: 60px; text-align: center;">
                <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #4CAF50 0%, #388E3C 100%); border-radius: 50%; box-shadow: 0 8px 25px rgba(76,175,80,0.4); display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                    <span style="font-size: 48px;">✓</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #2E7D32; margin-top: 10px; display: block;">Self-Checking</span>
            </div>

            <!-- Answer Keys -->
            <div style="position: absolute; left: 185px; top: 20px; text-align: center;">
                <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #00BCD4 0%, #0097A7 100%); border-radius: 50%; box-shadow: 0 8px 25px rgba(0,188,212,0.4); display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                    <span style="font-size: 48px;">🔑</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #00838F; margin-top: 10px; display: block;">Answer Keys</span>
            </div>

            <!-- Cute Animals (center, larger) -->
            <div style="position: absolute; left: 50%; transform: translateX(-50%); top: 0px; text-align: center;">
                <div style="width: 115px; height: 115px; background: linear-gradient(145deg, #FF8C42 0%, #E65100 100%); border-radius: 50%; box-shadow: 0 10px 30px rgba(255,140,66,0.45); display: flex; align-items: center; justify-content: center; margin: 0 auto; border: 4px solid white;">
                    <span style="font-size: 56px;">🐼</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 15px; color: #E65100; margin-top: 10px; display: block;">Multiple Themes</span>
            </div>

            <!-- No Prep -->
            <div style="position: absolute; right: 185px; top: 20px; text-align: center;">
                <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #6A1B9A 0%, #4A148C 100%); border-radius: 50%; box-shadow: 0 8px 25px rgba(106,27,154,0.4); display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                    <span style="font-size: 48px;">⚡</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #4A148C; margin-top: 10px; display: block;">No Prep</span>
            </div>

            <!-- Math Fun -->
            <div style="position: absolute; right: 40px; top: 60px; text-align: center;">
                <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #FFD600 0%, #FFC107 100%); border-radius: 50%; box-shadow: 0 8px 25px rgba(255,214,0,0.4); display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                    <span style="font-size: 48px;">➕</span>
                </div>
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #F57F17; margin-top: 10px; display: block;">Math Fun</span>
            </div>
        </div>

        <!-- Worksheet and Answer Key side by side -->
        <div style="position: absolute; bottom: 140px; left: 50%; transform: translateX(-50%); display: flex; gap: 50px; align-items: flex-end;">
            <!-- Worksheet -->
            <div style="text-align: center;">
                <div style="background: linear-gradient(145deg, #6A1B9A 0%, #4A148C 100%); padding: 12px; border-radius: 16px; box-shadow: 0 12px 40px rgba(106,27,154,0.35);">
                    <img src="https://www.lessoncraftstudio.com/samples/english/math%20puzzle/sample-3.jpeg" style="width: 200px; height: 259px; object-fit: cover; border-radius: 10px; border: 4px solid white;">
                </div>
                <div style="margin-top: 12px; background: #6A1B9A; padding: 8px 20px; border-radius: 20px; display: inline-block;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white; letter-spacing: 1px;">WORKSHEET</span>
                </div>
            </div>

            <!-- Answer Key -->
            <div style="text-align: center;">
                <div style="background: linear-gradient(145deg, #FF8C42 0%, #E65100 100%); padding: 12px; border-radius: 16px; box-shadow: 0 12px 40px rgba(255,140,66,0.35);">
                    <img src="https://www.lessoncraftstudio.com/samples/english/math%20puzzle/sample-3-answer.jpeg" style="width: 200px; height: 259px; object-fit: cover; border-radius: 10px; border: 4px solid white;">
                </div>
                <div style="margin-top: 12px; background: #FF8C42; padding: 8px 20px; border-radius: 20px; display: inline-block;">
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white; letter-spacing: 1px;">ANSWER KEY</span>
                </div>
            </div>
        </div>

        <!-- Bottom feature strip -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px;">
            <div style="background: white; padding: 10px 18px; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.12); border: 2px solid #4CAF50;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #388E3C;">Addition & Subtraction</span>
            </div>
            <div style="background: white; padding: 10px 18px; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.12); border: 2px solid #00BCD4;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #00838F;">Numbers 1-20</span>
            </div>
            <div style="background: white; padding: 10px 18px; border-radius: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.12); border: 2px solid #6A1B9A;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; color: #4A148C;">3x3 Picture Puzzles</span>
            </div>
        </div>

    </div>
</body>
</html>
