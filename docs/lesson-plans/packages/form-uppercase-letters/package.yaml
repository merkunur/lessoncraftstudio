# Teaching package — form uppercase letters
# Arc 17 Phase 1.5 (fine-motor-and-visual-spatial / handwriting strand-OPENER — EMPTY → 1/3). First handwriting strand package in the catalog. Builds on Arc 10 Phase 1 identify-uppercase-letters (the letter-recognition prerequisite).

targetSlug: form-uppercase-letters
language: en
title:
  en: "Form Uppercase Letters — trace and write the 26 capitals"

description:
  en: "Kindergarten / Grade 1 fine-motor + handwriting package teaching kids to FORM the 26 uppercase letters via tracing + independent writing. Builds on Arc 10 Phase 1 identify-uppercase-letters (the letter-recognition prerequisite — kids must recognize a letter before they can form it). FIRST package in the fine-motor-and-visual-spatial / handwriting strand (currently 0/3 EMPTY); Phase 1.5 opens the strand to 1/3. Kids start with letter-tracing on dotted-line templates (the canonical vocabulary-tracing-strips material with `traceStyle: dotted` + `includeIndependentLine: true`) and progress to independent letter formation alongside the dotted-trace prompt. Per §A.13.30 K-foundational-informal framing: K-1 handwriting work is BASIC LETTER-FORMATION ROUTINE — kids learn to make a letter shape recognizably, NOT formal stroke-order memorization or precise calligraphy. The stroke order may vary by teacher / curriculum; the recognizability of the letter form is the load-bearing K-1 fluency target. CCSS.L.K.1a primary anchor ('Print many upper- and lowercase letters'). 5 worksheet exercises + 8 printable materials over a 1-week unit. Load-bearing material: vocabulary-tracing-strips (the literal handwriting-pedagogy substrate) + manipulative-cut-outs letter shapes (kinesthetic letter-formation support)."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class letter-formation introduction. Teacher
      displays a large uppercase A on the board. "We know
      what an A looks like — yesterday we recognized it
      among the other letters. Today we LEARN TO MAKE A.
      Watch — two slanted lines coming together at the
      top, one horizontal line across the middle." Teacher
      traces the A in the air with one finger; class
      mirrors. Teacher then forms A on the board with
      dotted-line guides showing the strokes. Class chants
      the formation: "Down-slant, down-slant, across!"
      Teacher repeats with B (down-line, top-curve, bottom-
      curve) and O (one big circle). Pattern emphasis:
      "Every letter has a SHAPE we can recognize + a way
      to MAKE it. Today we learn to make the letters we
      already know."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + tracing-then-independent routine. Each
      pair receives vocabulary-tracing-strips with target
      letters in dotted form alongside an independent-
      writing line. Pair takes turns: kid A traces a letter
      on the dotted form; kid B watches + names the letter.
      Then kid A attempts the letter independently on the
      blank line; kid B compares the independent attempt
      to the dotted form. Recast errors with finger-guide
      ("you made the A with three lines crossing — let me
      show you again: two slanted lines coming together,
      ONE horizontal across"). The dotted-to-independent
      progression is the load-bearing fine-motor work; the
      teacher's role is to model the formation initially +
      step back as kids gain independence. Letter-shape
      manipulative-cut-outs are available as a kinesthetic
      support — kids can pick up a 3D letter cut-out + feel
      the shape with their hands while writing.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity (kids
      match each uppercase letter to its vocabulary anchor
      image — letter-recognition refresh that re-anchors
      the form they're learning to make). Station 2: chart-
      count alphabet sequence (counting through A-Z
      reinforces the letter inventory while the formation
      work continues). Station 3: math-puzzle (letter-form
      fill-in — given a partial letter outline, kid
      completes the missing strokes). Station 4: missing-
      pieces (similar gap-completion at the letter-form
      level).
  closure:
    durationMinutes: 5
    body: |
      Whole-class letter-formation quick-recall. Teacher
      names a letter; class makes the letter in the air
      with one finger + says the formation aloud. "Make
      M! — down, up-slant, down-slant, up!" "Make C! — One
      big curve!" "Make T! — Across, then down!" Forward-
      pointer: "Today we opened our HANDWRITING work —
      forming the uppercase letters we already recognize.
      Next we'll learn LOWERCASE letter forms (a, b, c, ...)
      and number formation (0, 1, 2, ..., 9). The motor
      routine you learned today — tracing on dotted form,
      then writing independently — works for every letter
      and every number going forward."

