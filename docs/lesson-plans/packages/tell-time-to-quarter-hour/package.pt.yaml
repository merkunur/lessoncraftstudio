# Teaching package — tell time to the quarter-hour (pt sparse-override)
# Arc 18 Phase 1.1 (19th-consecutive pt cadence per Arc 7+ convention). BR-MEC ensino-fundamental register; formal "você" address throughout. BNCC alignment: EF02MA18 (grandezas e medidas; ler horas em relógios analógicos e digitais) + EF01MA16 (relacionar conhecimentos sobre tempo às atividades cotidianas).

targetSlug: tell-time-to-quarter-hour
language: pt

title:
  pt: "Ler horas no quarto de hora — quando o ponteiro dos minutos aponta para o 3 ou para o 9"

description:
  pt: "Pacote de matemática + grandezas e medidas para o 2.º ano do ensino fundamental, completando o tripé canônico de leitura de horas (3/3 SAT no sub-track tell-time do strand de medidas) ensinando a leitura do quarto de hora no relógio analógico. Após o par Arc 17 P1.4 (tell-time-to-the-hour em 1:00 + tell-time-to-half-hour em 1:30), este pacote adiciona as posições do QUARTO DE HORA: 1:15 (UM QUARTO DEPOIS DE 1 — ponteiro dos minutos apontando à direita para o 3) + 1:45 (UM QUARTO PARA AS 2 — ponteiro dos minutos apontando à esquerda para o 9). A posição do ponteiro dos minutos ao redor do mostrador codifica a repartição em 4 quartos iguais: 12 (hora cheia), 3 (quarto depois, 15 minutos), 6 (meia hora, 30 minutos), 9 (quarto para, 45 minutos). Em 'um quarto depois', o ponteiro das horas fica entre a hora nomeada e a próxima; em 'um quarto para', o ponteiro das horas fica mais próximo da próxima hora do que da nomeada. CCSS.2.MD.C.7 âncora primária. Paralelo ao Arc 15 Phase 1 read-time-on-analog-clock per a mesma distinção de strand-framing measurement vs cognitive-and-executive-function/time-and-routine documentada em tell-time-to-the-hour (Arc 17 P1.4 Slot 1). Junto com o par Arc 17 P1.4, este pacote completa o tripé canônico do strand measurement 3/3 SAT. Alinhamento BNCC: EF02MA18 + EF01MA16 (grandezas e medidas; leitura de horas + relação tempo-atividades). 5 exercícios + 7 materiais imprimíveis ao longo de 1 semana."

structure:
  warmup:
    body: |
      Atividade introdutória com toda a turma + apresentação
      das posições do quarto de hora. Você mostra um grande
      relógio analógico + revisa o trabalho do par tell-time
      anterior: "Quando o ponteiro dos minutos aponta
      DIRETO PARA CIMA para o 12, a hora é exatamente cheia
      — três horas. Quando aponta DIRETO PARA BAIXO para o
      6, é a meia hora — três e meia." Depois o conteúdo
      novo: "Hoje conhecemos as OUTRAS duas posições onde o
      ponteiro dos minutos aponta para um lugar especial.
      Quando aponta DIRETO À DIREITA para o 3, dizemos UM
      QUARTO DEPOIS. Quando aponta DIRETO À ESQUERDA para o
      9, dizemos UM QUARTO PARA a próxima hora." Você
      demonstra 4:15 (ponteiro das horas logo após o 4;
      ponteiro dos minutos no 3 — "um quarto depois das 4 —
      quinze minutos depois das 4"); 7:45 (ponteiro das
      horas próximo do 8; ponteiro dos minutos no 9 — "um
      quarto para as 8 — quinze minutos antes das 8"); 2:15
      ("um quarto depois das 2"); 10:45 ("um quarto para as
      11"). Ênfase do padrão: "O mostrador tem QUATRO
      posições especiais — 12 para a hora cheia, 3 para um
      quarto depois, 6 para meia hora, 9 para um quarto
      para. O ponteiro dos minutos visita essas quatro
      posições à medida que a hora passa." Você escreve as
      formas digitais: 4:15, 7:45, 2:15, 10:45. "Um quarto
      depois quer dizer :15 na forma digital. Um quarto
      para quer dizer :45 na forma digital."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de leitura do quarto de
      hora com relógios de papel com ponteiros móveis. Cada
      dupla recebe o mesmo material clock-mat usado no par
      Arc 17 P1.4 + um conjunto de 8 cartões de tempo no
      quarto de hora (2:15, 5:15, 8:15, 11:15, 1:45, 4:45,
      7:45, 10:45). A dupla se reveza: a criança A pega um
      cartão (ex.: 5:15); a criança B ajusta o relógio de
      papel — para 'um quarto depois', ponteiro dos
      minutos direto à direita no 3, ponteiro das horas
      logo após o 5; para 'um quarto para', ponteiro dos
      minutos direto à esquerda no 9, ponteiro das horas
      próximo da PRÓXIMA hora (então 5:45 tem o ponteiro
      das horas próximo do 6). A criança A verifica a
      posição. Depois trocam. Recapture o erro do quarto-
      para com a dica da próxima hora ("7:45 quer dizer
      quase 8 — o ponteiro das horas já se moveu MUITO
      além do 7, ficando próximo do 8. O ponteiro dos
      minutos no 9 quer dizer que o 8 está chegando logo.").
      As duas posições do quarto (depois vs para) são a
      distinção visual determinante — crianças que confundem
      as duas dão respostas sistematicamente erradas. Tempo
      livre no fim: as crianças misturam todas as quatro
      posições da hora (cheia, quarto-depois, meia, quarto-
      para) no relógio móvel + nomeiam em voz alta o que
      ajustaram.
  scaffold:
    body: |
      Rotação por estações. Estação 1: atividade de
      correspondência — combinar cada mostrador analógico
      (desenhado em posições de quarto de hora) à sua hora
      digital (ex.: 1:15 — 4:45 — 9:15 — 11:45). Estação 2:
      atividade chart-count — contar pelas posições da hora
      + quartos em sequência (1:00, 1:15, 1:30, 1:45, 2:00,
      2:15...). Estação 3: math-puzzle (ajustar o relógio a
      uma hora dada no quarto: missing-element prompt).
      Estação 4: matching misto cheia/quarto-depois/meia/
      quarto-para (as crianças têm de distinguir todas as
      quatro posições com base na colocação do ponteiro dos
      minutos). O matching misto da estação 4 é o
      diagnóstico determinante — neste ponto as crianças
      devem ler fluentemente todas as quatro posições
      canônicas.
  closure:
    body: |
      Recapitulação rápida com toda a turma. Você mostra 6
      mostradores (mistura das quatro posições); a turma lê
      em coro cada um. "Três horas! Um quarto depois das 5!
      Oito e meia! Um quarto para as 11! Duas horas! Um
      quarto depois das 9!" Aponte adiante: "Hoje completamos
      as quatro posições CANÔNICAS no relógio — hora cheia
      (12), um quarto depois (3), meia hora (6), um quarto
      para (9). Com essas quatro posições, você pode ler a
      MAIORIA das horas que vê no dia a dia. A seguir, vamos
      aprender as horas INTERMEDIÁRIAS — de cinco em cinco
      minutos ao redor do mostrador (1:10, 1:20, 1:25, etc.)
      — e AM vs PM, e TEMPO DECORRIDO (quantas horas se
      passam entre dois momentos). A leitura de horas vai
      ficando cada vez mais precisa."

assessmentCriteria:
  pt: |
    Ao fim da unidade de 1 semana:
      - Ler 8 mostradores analógicos mostrando horas no
        quarto (mistura de quarto-depois + quarto-para)
        corretamente em 6 de 10 tentativas.
      - Distinguir 'um quarto depois' de 'um quarto para'
        com base na posição do ponteiro dos minutos (3 vs
        9) em 8 de 10 tentativas.
      - Identificar a posição do ponteiro das horas em
        horas de 'quarto para' (ponteiro das horas próximo
        da PRÓXIMA hora, não da nomeada — ex.: em 5:45 o
        ponteiro das horas está entre 5 e 6, mais próximo
        do 6) em 5 de 10 tentativas.
      - Ajustar o relógio de papel com ponteiros móveis a
        uma hora dada no quarto em 5 de 10 tentativas.
      - Usar o vocabulário 'um quarto depois' / 'um quarto
        para' / 'quinze minutos' / 'quarenta e cinco
        minutos' corretamente em 5 de 10 tentativas de
        produção verbal.

    Diferenciação:
    - Pré-escola: pular a leitura do quarto de hora
      inteiramente; o escopo do par Arc 17 P1.4 (hora
      cheia + meia hora) é a cobertura apropriada para a
      idade.
    - Educação infantil (5-7 anos): adiar a leitura do
      quarto de hora; focar na leitura da hora cheia (Arc
      17 P1.4 Slot 1).
    - 1.º ano: introduzir apenas 'um quarto depois'
      (ponteiro dos minutos no 3); adiar 'um quarto para'
      até o 2.º ano. A posição-entre-as-horas do ponteiro
      das horas em 'quarto para' é cognitivamente
      demandante demais para a maioria dos alunos do 1.º
      ano.
    - 2.º ano: fluência completa em 'um quarto depois' +
      'um quarto para'; trabalho com ponteiros móveis com
      muito apoio; a posição do ponteiro das horas em
      'quarto para' recebe atenção explícita.
    - 3.º ano em diante: reforço breve + ponte para a
      precisão de cinco em cinco minutos per o escopo
      mais amplo de CCSS.2.MD.C.7; distinção AM/PM +
      formato digital + problemas de tempo decorrido.

compositionalRationale:
  pt: |
    Adaptação locale-específica do pacote canônico (en).
    Os campos materials, composedExercises,
    curriculumStandards e learningObjectives são herdados
    do package.yaml via merge sparse-override e não são
    repetidos aqui per a convenção Arc 7+.

    Vocabulário pt-BR canônico para leitura de horas no
    quarto:
    - 'um quarto depois' (canônica para quarter-past;
      'depois' canônico para 'past'); alternativa 'quinze
      depois' usando forma numérica
    - 'um quarto para' (canônica para quarter-to; 'para'
      canônico para 'to'); alternativa 'quinze para'
      usando forma numérica
    - 'meia hora' (half-hour; estabelecido no pacote do
      Arc 17 P1.4 Slot 4 tell-time-to-half-hour)
    - 'hora cheia' / 'em ponto' (canônica para o'clock;
      estabelecido no pacote do Arc 17 P1.4 Slot 1)
    - 'mostrador' (clock face); 'ponteiro das horas'
      (hour hand); 'ponteiro dos minutos' (minute hand)
    - 'são X horas e quinze' / 'são X horas e quarenta e
      cinco' — formas digitais lidas em pt-BR
    - 'quinze para as Y horas' — forma para 'um quarto
      para' usando apenas a forma numérica (mais
      transparente para crianças de 2.º ano)

    Convenção pt-BR vs pt-PT para 'quarter-hour': ambas as
    variantes usam estruturas semelhantes; a divergência
    principal é fonológica + algumas escolhas lexicais
    secundárias. Para o público K-3 da Fase 1.1, 'um quarto
    depois' / 'um quarto para' são canônicos pt-BR — pt-PT
    aceita variações como 'um quarto e cinco' (quarto-para
    com hora-de-destino implícita), mas pt-BR K-1/2.º ano
    usa preferencialmente 'um quarto depois' / 'um quarto
    para' OU as formas numéricas equivalentes ('quinze
    depois' / 'quinze para').

    Forma numérica vs forma de quarto em pt-BR: pt-BR K-1
    + 2.º ano frequentemente prefere a forma numérica
    ('quinze depois das 3' = 3:15; 'quinze para as 4' =
    3:45) por ser mais transparente do que a forma de
    quarto. Tanto a forma numérica quanto a forma de
    quarto são canonicamente corretas e ambas são ensinadas
    neste pacote — a forma numérica é a ponte para a
    leitura digital (3:15 = "três e quinze") + a forma de
    quarto preserva o vocabulário tradicional.

    Alinhamento BNCC (Base Nacional Comum Curricular):
    EF02MA18 ('Indicar a duração de intervalos de tempo
    entre duas datas, como dias da semana e meses do ano,
    utilizando calendário, para planejamentos e
    organização de agenda') + EF01MA16 ('Relatar em
    linguagem verbal ou não verbal sequência de
    acontecimentos relativos a um dia, utilizando, quando
    possível, os horários dos eventos') cobrem o
    trabalho de leitura de horas + relação tempo-
    atividades. O 2.º ano introduz a leitura do mostrador
    analógico de modo formal; este pacote alinha-se com
    o ponto da BNCC onde a precisão sobre o quarto de
    hora começa a ser ensinada.

    Divergência interna documentada: este pacote diverge
    do par Arc 17 P1.4 na dimensão do modo do
    manipulative-cut-outs (canonical-correct `mode:
    variety` neste pacote vs `mode: clock-pieces` no par
    Arc 17 P1.4 — débito de dados pré-correção §A.13.35).
    A divergência é INTENCIONAL + LOCK-DE-OPERADOR per
    adjudicação na Fase 0 do Arc 18 §A.13.6 firings
    batch. Ver compositionalRationale.en para a
    documentação completa.

    Material concreto: o clock-mat (mat de relógio
    analógico com ponteiros móveis) é o material
    determinante para o trabalho do quarto de hora — as
    crianças têm de FAZER fisicamente o movimento do
    ponteiro dos minutos para o 3 (quarto-depois) ou o 9
    (quarto-para), enquanto o ponteiro das horas se move
    para a posição correspondente entre números. A
    manipulação física dos ponteiros é o caminho para
    internalizar a relação ponteiro-dos-minutos-vs-
    ponteiro-das-horas no quarto de hora — apenas ver o
    mostrador desenhado não é suficiente.
