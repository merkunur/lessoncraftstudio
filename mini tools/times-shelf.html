<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Times Shelf — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=19">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- TOOL #47 — THE TIMES SHELF. A hundred cards, each showing its
       product, with the factors on the two edges. Put away the families
       the class already owns — the 1, the 10, the 2, the 5 — and the
       shelf closes up and the cards grow: 100 -> 81 -> 64 -> 49 -> 36.
       Then put away every card below the diagonal, because its number
       is already standing on the other side: 21 left. It loads NO ART
       and NO AUDIO — rounded rectangles and numerals are the whole
       stage, so nothing here can 404 into silence or a blank frame. -->
  <script src="/mini-tools/lcs-shell.js?v=5"></script>
  <script src="/mini-tools/times-shelf.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    LCS.mount(TimesShelf, { mount: '#lcs-root' });
  </script>
</body>
</html>
