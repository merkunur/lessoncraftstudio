# Teaching package — wait my turn (impulse control)
# Arc 18 Phase 1.5 Slot 1 (world-knowledge / personal-social-emotional-development strand 4/8 → 5/8). Foundational executive-function skill: kids hold back from acting until appropriate. Pair-coherent with Phase 1.4 Slot 4 identify-classroom-rules (immediate predecessor) + Arc 17 P1.1 share-and-take-turns (SEL-class composition pattern). SEL emotions-bundle cluster grows to 4-package anchor bundle (name-and-describe-feelings + show-perspective-taking + share-and-take-turns + identify-classroom-rules + wait-my-turn = 5-package cluster).

targetSlug: wait-my-turn
language: en
title:
  en: "Wait Your Turn — impulse control and patience in classroom routines"

description:
  en: "Kindergarten / Grade 1 social-emotional package teaching kids to wait their turn — hold back from acting until appropriate. Foundation executive-function skill underlying turn-taking, line-waiting, raising-hand-instead-of-calling-out, and waiting-to-be-helped. Per learning-targets.json, wait-my-turn has no prerequisites; it stands as a foundational impulse-control target whose mastery supports all subsequent SEL behavioral work (turn-taking, conflict resolution, classroom-rule following). Critical K-1 prosocial-skills work: kids learn to recognize the FEELING of impatience (when waiting feels hard), use INTERNAL STRATEGIES to manage that feeling (count to 10, deep breath, hands in lap, look at a friend who's also waiting), and trust that THEIR TURN WILL COME. Per §A.13.30 K-1 informal framing: K-1 impulse-control work is CONCRETE WAITING-STRATEGY RECOGNITION + APPLICATION — kids name the feeling, name a strategy, apply the strategy in a specific waiting context. NOT formal executive-function pedagogy (which is Grade 2+ work introducing terms like 'self-regulation', 'inhibitory control', 'delayed gratification'); the K-1 pedagogy uses everyday language ('wait your turn' / 'be patient' / 'first comes Maria, then comes you') to surface the underlying impulse-control pattern. EYFS.ELG.PSED.M.R + CASEL.SELF_MANAGEMENT primary anchors. Multilingual / international-school context emphasis: cultural norms around waiting-time and patience vary significantly across school cultures; the package frames CO-CREATED CLASSROOM WAITING-AGREEMENTS rather than absolute universal rules about how-long-to-wait-quietly. PSED strand advances 4/8 → 5/8 (50.0% → 62.5%; pair-coherent advancement following Phase 1.4 Slot 4 identify-classroom-rules which advanced 3/8 → 4/8). 5 worksheet exercises + 6 printable materials (SEL-class composition per §A.13.37 + Arc 17 P1.1 share-and-take-turns precedent: REMOVES matching-mat + vocabulary-tracing-strips; KEEPS flashcards + picture-cards + sentence-strips + manipulative-cut-outs + parent-take-home-letter + answer-key). Manipulative-cut-outs in `mode: single-repeat` (canonical-correct per §A.13.35) with theme: emotions (cluster continuity)."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class waiting-strategy introduction with
      classroom-routine hook. Teacher asks: "When does
      it get HARD to wait? Tell me a time waiting was
      hard." Class brainstorms: waiting in line for the
      slide, waiting to be called on, waiting for snack,
      waiting for a friend to finish their turn, waiting
      for the bathroom. Teacher then introduces 4
      waiting-strategies: (1) HANDS IN LAP — kids put
      their hands in their lap when waiting to keep
      hands from grabbing; (2) COUNT TO 10 — silent
      count-to-10 while waiting helps the time pass;
      (3) DEEP BREATH — slow breathing calms the
      impatient feeling in the body; (4) LOOK AT A
      WAITING FRIEND — find another kid who's also
      waiting; remind yourself everyone takes turns.
      Teacher narrates the connection to feelings:
      "When waiting is hard, you might feel IMPATIENT
      (you want it NOW), JEALOUS (someone else has
      what you want), FRUSTRATED (it's taking too
      long). These feelings are NORMAL — everyone
      feels them sometimes. The strategies help us
      WAIT EVEN WHEN THE FEELINGS ARE STRONG. Today
      we practice the 4 waiting-strategies so we have
      them ready when waiting gets hard."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + waiting-strategy practice routine.
      Each pair receives 4 strategy cards (HANDS IN
      LAP / COUNT TO 10 / DEEP BREATH / LOOK AT A
      FRIEND) + 6 waiting-scenario cards (kid waiting
      in line for slide; kid waiting to be called on
      to speak; kid waiting for snack to be passed;
      kid waiting for a friend to finish their turn
      with a toy; kid waiting for the teacher to
      finish helping another kid; kid waiting for
      family pickup). Pair takes turns: kid A picks a
      scenario card; kid B picks one of the 4
      strategy cards that would help in that scenario
      + narrates aloud "I would use [strategy]
      because [reason]." Then they switch. Recast
      errors with strategy-fit reasoning ("you said
      COUNT TO 10 for waiting for the bathroom — but
      counting to 10 doesn't make the bathroom
      faster. DEEP BREATH might help because the
      feeling of urgently-needing-to-go is
      uncomfortable; deep breath calms the body. Or
      LOOK AT A FRIEND helps if you can see another
      kid waiting too — reminds you everyone has to
      wait sometimes."). Optional extension: pair
      practices a strategy in real-time — kid A
      pretends to wait for something; kid B reminds
      them which strategy to use. Teacher note: K-1
      kids sometimes apply strategies mechanically
      without connecting them to the feeling-state.
      Help kids see: strategies are TOOLS for
      managing IMPATIENT FEELINGS. The goal is not
      to STOP FEELING IMPATIENT (impatience is
      normal); the goal is to KEEP YOUR BODY CALM
      while the feeling passes. Some kids may also
      conflate WAITING with PASSIVITY (doing nothing
      = boring). Help kids see: waiting is ACTIVE —
      you're actively using a strategy, actively
      breathing, actively counting. Waiting is hard
      WORK, not just sitting still.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort
      worksheet (kids sort scenario pictures into
      "waiting calmly" vs "not waiting" buckets —
      kid sitting cross-legged with hands in lap
      while waiting goes in waiting-calmly; kid
      grabbing toy from another kid's hands goes in
      not-waiting). Station 2: matching worksheet
      (waiting-scenario picture → strategy text;
      e.g., kid waiting in line for slide ↔ "hands
      in lap and count to 10"). Station 3: math-
      worksheet (counting-as-waiting-strategy: count
      from 1 to 10 several times; reinforces the
      count-to-10 strategy through numeracy work;
      also introduces fairness-as-counting: if 3
      kids share one slide and each gets 5 turns,
      how many slides total? = 15). Station 4:
      word-guess worksheet (cluster-theme puzzle
      practice using emotion vocabulary; the
      waiting-strategy vocabulary work happens at
      the lesson-body station-2 + station-3
      activities, NOT at this composedExercise per
      §A.13.36 Phase 1.4 Slot 4 Path B abstraction
      layer precedent).
  closure:
    durationMinutes: 5
    body: |
      Whole-class waiting-strategy practice + SEL-
      cluster framing. Class collectively names the
      4 waiting-strategies (HANDS IN LAP / COUNT TO
      10 / DEEP BREATH / LOOK AT A FRIEND). Teacher
      poses the cluster-connection question: "How
      does waiting connect to what we learned about
      RULES last time (identify-classroom-rules) and
      SHARING (share-and-take-turns)?" Class
      reflects: rules tell us WHEN to wait (raise
      hand and wait to be called); sharing means
      letting OTHER kids have their turn while you
      wait for yours; waiting is the WORK we do
      while we wait for our turn to come. Teacher
      closes with: "Waiting is hard. Adults still
      feel impatient sometimes. The strategies don't
      MAKE you stop feeling impatient — they HELP
      YOU WAIT even when the feeling is strong. The
      more you practice, the easier waiting gets.
      Your turn WILL come — that's the most
      important thing to remember when waiting feels
      forever." Forward-pointer: "When we come back
      to social-emotional work next, we'll learn
      what to do when YOUR TURN finally comes after
      a long wait — being ready to participate
      without rushing or being too excited. Next
      target candidates: regulate-emotions-with-
      strategies + identify-safe-vs-unsafe-
      situations (Arc 18+ + Arc 19 candidates)."

