# Teaching package — solve a 6×6 picture sudoku
# Arc 7 Phase 1 (Path B; cognitive-and-executive-function / logical-reasoning
# strand). Companion to Arc 5 Phase 3's solve-4x4-picture-sudoku — same
# architecture; larger grid; more pictures to track. Class B FLEXIBLE;
# composes against any 6-key picture set.

targetSlug: solve-6x6-picture-sudoku
language: en
title:
  en: "Picture Sudoku 6×6 — solve a larger logic puzzle"
description:
  en: "Grade 1-2 cognitive-and-executive-function package teaching 6×6 picture-sudoku puzzle-solving. Builds on solve-4x4-picture-sudoku (Arc 5 Phase 3 prereq). Larger grid requires kids to hold 6 picture-types in working memory + apply the rule (each row/column/2×3 box contains each picture exactly once). Cognitive-load step-up from 4×4. Composes against any 6-key picture set in IMAGE_VOCABULARY. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 35

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher reviews the 4×4 sudoku rule from
      solve-4x4-picture-sudoku: each row/column/box contains each picture
      exactly once. Then introduces the 6×6 grid: same rule, BUT 6 picture
      types instead of 4, AND the 2×3 boxes are wider than the 4×4
      puzzle's 2×2 boxes. Class watches teacher demo a 6×6 partial
      puzzle deduction. "What's missing in this row? What CAN'T it be?"
      Class works through 1-2 deductions collaboratively.
  contentActivity:
    durationMinutes: 15
    body: |
      Whole-class guided 6×6 sudoku: teacher projects a partial 6×6 puzzle.
      Class collaboratively decides what goes in empty cells using process
      of elimination. Reinforce: "Look at the row, the column, AND the
      2×3 box — what's already there?" Pair work: kids work on simpler
      6×6 puzzles together; partners check each other's logic. Cognitive-
      load awareness: 6×6 requires significantly more sustained attention
      than 4×4; encourage breaks if needed.
  scaffold:
    durationMinutes: 10
    body: |
      Station rotation. Station 1: sudoku worksheet (6×6 medium with 18+
      given clues; kid solves alone). Station 2: matching worksheet (6
      picture vocabulary reinforcement). Station 3: manipulative cut-outs
      6×6 sudoku-construction (kids build their own 6×6 puzzle with
      cut-outs; hand to a partner to solve — peer-teaching reinforces
      both the rule AND the construction skill).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher displays a final 6×6 partial
      puzzle; class collectively decides 1-2 missing cells. Forward-
      pointer: "Today we solved 6×6 picture sudoku. We've doubled the
      grid size since 4×4 — and we kept the same rule! When we come back
      to logic puzzles next, we'll try MORE complex puzzles like
      crosswords and word puzzles."

