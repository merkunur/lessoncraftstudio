# Teaching package — trace 2D shapes
# Arc 14 Phase 2 (fine-motor-and-visual-spatial / drawing-and-tracing 2/4 → 3/4).
# Pairs with draw-2d-shapes-freehand (Phase 2 sibling) which saturates strand.

targetSlug: trace-2d-shapes
language: en
title:
  en: "Trace 2D Shapes — circles, squares, triangles, rectangles"
description:
  en: "Pre-K / Kindergarten fine-motor + visual-spatial package teaching kids to trace fundamental 2D shapes (circle, square, triangle, rectangle, oval, diamond). Builds on Arc 9-12 trace-straight-lines + trace-curved-lines pencil-control foundation; extends tracing work from line shapes to closed-figure shapes. Pairs with Arc 14 Phase 2 sibling draw-2d-shapes-freehand which saturates the drawing-and-tracing strand at 4/4. Tracing closed shapes is the canonical bridge from line-tracing (Arc 12) to freehand-shape-drawing — kids practice the closed-curve coordination on guided dotted/dashed templates before drawing freehand. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + tactile shape introduction. Teacher displays
      6 large 2D shapes: circle, square, triangle, rectangle, oval,
      diamond. "These are shapes. Today we will TRACE them — follow
      the dotted lines with our pencil from start to finish without
      lifting the pencil." Class names each shape; teacher
      demonstrates tracing a large circle in the air with a finger
      ("starts at the top + goes around back to start"). Visual +
      tactile anchor for closed-shape tracing.
  contentActivity:
    durationMinutes: 12
    body: |
      Independent tracing routine. Each kid receives a worksheet
      with 6 dotted shapes (one row per shape, 3 trace-lines per row
      = 18 traces total). Kids trace each shape carefully starting
      at the start-arrow + following the dotted path. Teacher
      circulates; recasts errors with verbal cues ("start at the
      top of the circle + go AROUND" / "the square has 4 corners —
      stop at each corner before turning"). Pencil-control feedback
      individualized per kid.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: vocabulary-tracing-strips with
      shape names + dotted shape outlines. Station 2: matching
      worksheet (shape outline to shape name). Station 3: trace-
      curved-lines worksheet (review prior arc work for kids
      needing pencil-control reinforcement). Station 4: missing-
      pieces worksheet (which shape is missing in a sequence —
      shape recognition reinforcement).
  closure:
    durationMinutes: 5
    body: |
      Whole-class review. Teacher names each shape; class traces it
      in the air with their finger. "Circle — round and round.
      Square — corner, corner, corner, corner. Triangle — three
      corners. Rectangle — two long sides + two short sides."
      Forward-pointer: "Today we TRACED shapes following dotted
      lines. When we come back next, we'll DRAW shapes by ourselves
      with no dotted lines — drawing freehand!"

