assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Chant counting by 5s from 0 to 50 with no errors in 8 of 10
        attempts.
      - Fill in missing numbers in a counting-by-5s sequence (e.g.,
        5, ___, 15, ___, 25) in 7 of 10 trials.
      - Use counting-by-5s to count a set of 50 objects (instead of
        counting by 1s) in 6 of 10 trials.

    Differentiation:
    - Pre-K: chant only; 0 to 25; manipulative-supported.
    - K: chant + fill-in 0 to 50; pencil-and-paper.
    - Grade 1+: extend to count-by-10s (skip-counting trilogy
      completion in Arc 10+); bridge to multiplication readiness.

