compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / time-and-
    routine (time-duration comparison — extends strand 2/4 → 3/4).
    Secondary strand: math / measurement (time as a measurable
    dimension parallel to length / weight / capacity). Tertiary
    strand: vocabulary-acquisition (time-duration vocabulary).

    Architectural significance: extends time-and-routine strand from
    2/4 to 3/4. Builds on Arc 9-11 time-and-routine foundation
    (identify-days-of-week + identify-months-of-year + similar).
    Pairs naturally with Arc 14 Phase 4 sibling compare-by-
    capacity — both packages exercise comparison work in different
    measurement dimensions (length/weight/capacity/time).

    Distinctive composition: 2 more-less (comparison) + 2 matching
    + 1 pattern-train. Same comparison-focused exercise pattern as
    compare-by-length + compare-by-weight + compare-by-capacity;
    consistent strand-method coherence across comparison-strand
    work.

    Class B FLEXIBLE substrate: composes against miscellaneous +
    animals themes; event-pair comparisons span everyday contexts.

    K-3 multilingual classroom relevance: time vocabulary
    universally present across 11 platform locales with varying
    cognate coverage. Short/long vocabulary moderate-cognate
    Romance + Germanic (corto/court / largo/long). Time-unit
    vocabulary (second/minute/hour) Romance highly cognate
    (segundo/seconde / minuto/minute / hora/heure); Germanic +
    Finnic distinct. Visual time-duration comparison universal;
    vocabulary anchor varies.

