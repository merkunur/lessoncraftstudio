assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Trace 5 of 6 dotted straight lines (horizontal, vertical,
        diagonal) staying on the line in 7 of 10 attempts.
      - Trace 3 of 4 outline straight lines (lighter guidance) in 6
        of 10 attempts.
      - Draw a freehand straight line approximating a target direction
        in 5 of 10 attempts.

    Differentiation:
    - Pre-K: dotted-line tracing only; horizontal + vertical only
      (skip diagonal); thick crayon.
    - K: dotted + outline tracing across 3 directions (horizontal,
      vertical, diagonal); pencil.
    - Grade 1+: free-hand straight lines + bridge to trace-curved-lines
      (Arc 11+ candidate); foundation for letter formation.

