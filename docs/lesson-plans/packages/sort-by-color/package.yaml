# Teaching package — sort objects by color
# Arc 5 Phase 3 (cognitive-and-executive-function / sorting-and-classification
# strand). FIRST cognitive-and-executive-function domain package — closes
# Condition 4 (5-of-5 domain coverage) at Arc 5 ship per §A.14 scaling-
# checkpoint discipline. Class B FLEXIBLE; composes against image-library
# breadth + colors cluster (CLEAN against IMAGE_VOCABULARY).

targetSlug: sort-by-color
language: en
title:
  en: "Sort by Color — group objects by their color"
description:
  en: "Pre-K to Grade 1 cognitive-and-executive-function package teaching color-based attribute sorting. Foundational executive-function skill: hold a sorting rule (color) in mind while categorizing mixed objects. Composes against image-library breadth — kids sort fruits, vegetables, animals, vehicles by their dominant color. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher places mixed objects (paper-cut fruits
      / vegetables / toys) on the carpet. Names a color: "Show me everything
      RED." Class points to all red items. Repeat with 3-4 colors. Reinforces
      color-vocabulary (CLEAN cluster: red/blue/yellow/green/orange/purple/
      pink/brown/black/white) AND the meta-skill of "looking through" a
      group for one attribute. Pin color cards to the math-language word
      wall.
  contentActivity:
    durationMinutes: 12
    body: |
      Whole-class sorting routine. Teacher places 4-5 large color-mat cards
      labeled with each color (or color swatches). Names mixed objects from
      a pile; class places each object onto the matching color mat
      collaboratively. Pair work: kid A picks an object; kid B says the
      color and places it on the right mat. Recast errors. Optional
      extension: kids notice that some objects could go on multiple mats
      (a green-and-orange carrot — discuss attribute-priority decisions).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (sort 8-10 objects
      between 2 color contrasts — red vs blue; yellow vs green). Station 2:
      odd-one-out worksheet (find the object in the wrong color group).
      Station 3: manipulative cut-outs hands-on color sorting (kids
      physically place 20+ cut-out objects on color mats; emphasizes
      multiple-object sustained sorting attention).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names a color; kids show with
      classroom objects ("everyone touch something blue!"). Forward-pointer:
      "Today we sorted by color. When we come back to sorting next, we'll
      sort by SHAPE — keeping a different rule in mind."

