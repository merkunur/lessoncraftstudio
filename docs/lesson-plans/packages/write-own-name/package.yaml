compositionalRationale:
  en: |
    Primary strand: early-literacy / writing-composition (own-name
    writing). Secondary strand: motor + visual-spatial (drawing-and-
    tracing as motor foundation). Tertiary strand: identity + ownership
    (kids' name = self-anchor for early literacy).

    **Architectural significance: STRAND-FIRST in writing-composition
    (0/8 → 1/8).** Foundational writing-for-meaning. Writing-composition
    strand opens with the canonical first writing target — kids' own
    name. Future arcs author sibling targets (label-a-picture-with-1-
    word, label-picture-with-noun-phrase, write-a-simple-sentence-with-
    picture-prompt + 4 more unauthored).

    Distinctive composition: tracing-heavy (2 vocabulary-tracing-strips
    materials at different traceStyle parameters; dotted + outline) +
    letter-recognition apps (alphabet-train + matching letter-mode +
    word-guess). Composition reflects writing's motor-foundation +
    letter-recognition prerequisites.

    **Per-kid customization required.** Each kid's name is unique;
    teacher prepares per-kid name-trace sheet in advance. Material
    composition supports general motor practice (vocabulary-tracing-
    strips with general vocab); specific name-trace material is teacher-
    prepared per-kid (out of materials-catalog scope; teacher-side
    preparation work).

    Cross-strand integration: writing-composition + drawing-and-tracing
    (Arc 11+12 motor work) + letter-recognition (Arc 9-12) + vocabulary.

    Class B FLEXIBLE substrate: composes against vocabulary-rich themes
    + per-kid name customization. Universal substrate-readiness.

    K-3 multilingual classroom relevance: writing one's own name is
    universal across all 11 platform locales — every K-3 classroom
    teaches this skill. Kids in dual-language contexts may have names
    in multiple scripts/locales; package supports any name regardless
    of locale.

