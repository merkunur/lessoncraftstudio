<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <title>Grid Match - Fun Thumbnail</title>
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #E91E63 0%, #F48FB1 40%, #FF8A80 100%); overflow: hidden;">

        <!-- Sunburst effect -->
        <div style="position: absolute; top: -100px; left: 50%; transform: translateX(-50%); width: 1200px; height: 1200px; background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 40%);"></div>

        <!-- Confetti pieces -->
        <div style="position: absolute; top: 80px; left: 70px; width: 25px; height: 12px; background: #FFD600; transform: rotate(25deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 140px; left: 140px; width: 20px; height: 10px; background: #00BCD4; transform: rotate(-15deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 60px; left: 250px; width: 22px; height: 11px; background: #4CAF50; transform: rotate(45deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 180px; left: 50px; width: 18px; height: 9px; background: #7B1FA2; transform: rotate(-30deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 110px; right: 90px; width: 24px; height: 12px; background: #2196F3; transform: rotate(60deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 60px; right: 180px; width: 20px; height: 10px; background: #FF6D00; transform: rotate(-45deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 160px; right: 70px; width: 22px; height: 11px; background: #E91E63; transform: rotate(15deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 200px; right: 160px; width: 18px; height: 9px; background: #00BCD4; transform: rotate(-60deg); border-radius: 2px;"></div>

        <!-- More confetti around center -->
        <div style="position: absolute; top: 350px; left: 80px; width: 20px; height: 10px; background: #FFC107; transform: rotate(30deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 450px; left: 60px; width: 22px; height: 11px; background: #4CAF50; transform: rotate(-20deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 550px; left: 100px; width: 18px; height: 9px; background: #9C27B0; transform: rotate(50deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 380px; right: 80px; width: 24px; height: 12px; background: #2196F3; transform: rotate(-35deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 480px; right: 60px; width: 20px; height: 10px; background: #FFD600; transform: rotate(40deg); border-radius: 2px;"></div>
        <div style="position: absolute; top: 560px; right: 100px; width: 22px; height: 11px; background: #00BCD4; transform: rotate(-55deg); border-radius: 2px;"></div>

        <!-- FREE Badge - Party Balloon Style -->
        <div style="position: absolute; top: 25px; left: 25px; z-index: 100;">
            <div style="position: relative;">
                <!-- Balloon string -->
                <div style="position: absolute; top: 85px; left: 45px; width: 3px; height: 30px; background: linear-gradient(180deg, #FFD600, #FF6D00); transform: rotate(5deg);"></div>
                <!-- Balloon -->
                <div style="width: 95px; height: 105px; border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%; background: linear-gradient(145deg, #FFD600 0%, #FF6D00 100%); box-shadow: 0 6px 25px rgba(255,214,0,0.5), inset -8px -8px 20px rgba(0,0,0,0.1), inset 8px 8px 20px rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">FREE</span>
                </div>
            </div>
        </div>

        <!-- Kids Love This Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: linear-gradient(145deg, #7B1FA2 0%, #4A148C 100%); padding: 10px 20px; border-radius: 25px; box-shadow: 0 4px 15px rgba(123,31,162,0.4); display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 20px;">❤️</span>
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 16px; color: white;">KIDS LOVE THIS!</span>
        </div>

        <!-- Main Title - Bouncy 3D Text -->
        <div style="position: absolute; top: 100px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 50;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 85px; color: white; margin: 0; text-shadow: 5px 5px 0 #C2185B, 8px 8px 0 rgba(0,0,0,0.2); letter-spacing: 3px;">PUZZLE</h1>
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 85px; color: #FFD600; margin: -20px 0 0 0; text-shadow: 5px 5px 0 #F9A825, 8px 8px 0 rgba(0,0,0,0.2); letter-spacing: 3px;">PARTY!</h1>
        </div>

        <!-- Animated Puzzle Piece Characters -->
        <div style="position: absolute; top: 290px; left: 50%; transform: translateX(-50%); width: 700px; height: 320px;">

            <!-- Worksheet in center -->
            <div style="position: absolute; left: 50%; top: 40px; transform: translateX(-50%); z-index: 20;">
                <img src="https://www.lessoncraftstudio.com/samples/english/grid%20match/sample-4.jpeg" style="width: 260px; height: 336px; object-fit: cover; border-radius: 14px; border: 7px solid white; box-shadow: 0 15px 50px rgba(0,0,0,0.3);">
            </div>

            <!-- Puzzle piece character 1 (left - jumping toward grid) -->
            <div style="position: absolute; left: 60px; top: 100px; transform: rotate(-10deg);">
                <div style="width: 85px; height: 85px; background: linear-gradient(145deg, #00BCD4 0%, #0097A7 100%); border-radius: 12px; box-shadow: 0 8px 25px rgba(0,188,212,0.5); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <!-- Puzzle tab -->
                    <div style="position: absolute; right: -12px; top: 50%; transform: translateY(-50%); width: 18px; height: 28px; background: linear-gradient(145deg, #00BCD4 0%, #0097A7 100%); border-radius: 0 14px 14px 0;"></div>
                    <!-- Happy eyes -->
                    <div style="display: flex; gap: 18px; margin-bottom: 8px;">
                        <div style="width: 14px; height: 14px; background: white; border-radius: 50%; position: relative;">
                            <div style="position: absolute; top: 3px; left: 5px; width: 6px; height: 6px; background: #333; border-radius: 50%;"></div>
                        </div>
                        <div style="width: 14px; height: 14px; background: white; border-radius: 50%; position: relative;">
                            <div style="position: absolute; top: 3px; left: 3px; width: 6px; height: 6px; background: #333; border-radius: 50%;"></div>
                        </div>
                    </div>
                    <!-- Happy smile -->
                    <div style="width: 25px; height: 12px; border-bottom: 4px solid white; border-radius: 0 0 15px 15px;"></div>
                </div>
                <!-- Number badge -->
                <div style="position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); background: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 16px; color: #0097A7;">1</span>
                </div>
            </div>

            <!-- Puzzle piece character 2 (right) -->
            <div style="position: absolute; right: 70px; top: 80px; transform: rotate(12deg);">
                <div style="width: 80px; height: 80px; background: linear-gradient(145deg, #FF8C42 0%, #E65100 100%); border-radius: 12px; box-shadow: 0 8px 25px rgba(255,140,66,0.5); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <!-- Puzzle tab -->
                    <div style="position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); width: 26px; height: 18px; background: linear-gradient(145deg, #FF8C42 0%, #E65100 100%); border-radius: 0 0 14px 14px;"></div>
                    <!-- Winking eyes -->
                    <div style="display: flex; gap: 16px; margin-bottom: 8px;">
                        <div style="width: 13px; height: 13px; background: white; border-radius: 50%; position: relative;">
                            <div style="position: absolute; top: 3px; left: 4px; width: 5px; height: 5px; background: #333; border-radius: 50%;"></div>
                        </div>
                        <div style="width: 12px; height: 3px; background: white; border-radius: 2px; margin-top: 5px;"></div>
                    </div>
                    <!-- Smile -->
                    <div style="width: 22px; height: 11px; border-bottom: 4px solid white; border-radius: 0 0 12px 12px;"></div>
                </div>
                <div style="position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); background: white; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.2);">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 15px; color: #E65100;">2</span>
                </div>
            </div>

            <!-- Puzzle piece character 3 (bottom left) -->
            <div style="position: absolute; left: 100px; bottom: 10px; transform: rotate(5deg);">
                <div style="width: 75px; height: 75px; background: linear-gradient(145deg, #7B1FA2 0%, #4A148C 100%); border-radius: 10px; box-shadow: 0 8px 25px rgba(123,31,162,0.5); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <div style="position: absolute; left: -10px; top: 50%; transform: translateY(-50%); width: 16px; height: 24px; background: linear-gradient(145deg, #7B1FA2 0%, #4A148C 100%); border-radius: 12px 0 0 12px;"></div>
                    <!-- Excited eyes -->
                    <div style="display: flex; gap: 14px; margin-bottom: 6px;">
                        <div style="width: 15px; height: 15px; background: white; border-radius: 50%; position: relative;">
                            <div style="position: absolute; top: 2px; left: 5px; width: 5px; height: 5px; background: #333; border-radius: 50%;"></div>
                        </div>
                        <div style="width: 15px; height: 15px; background: white; border-radius: 50%; position: relative;">
                            <div style="position: absolute; top: 2px; left: 4px; width: 5px; height: 5px; background: #333; border-radius: 50%;"></div>
                        </div>
                    </div>
                    <div style="width: 20px; height: 10px; background: white; border-radius: 0 0 10px 10px;"></div>
                </div>
                <div style="position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 14px; color: #4A148C;">3</span>
                </div>
            </div>

            <!-- Speech bubble -->
            <div style="position: absolute; left: 30px; top: 35px;">
                <div style="background: white; padding: 10px 16px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); position: relative;">
                    <span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px; color: #E91E63;">Let's solve it!</span>
                    <div style="position: absolute; bottom: -8px; right: 20px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 12px solid white;"></div>
                </div>
            </div>
        </div>

        <!-- Cartoon peeking eyes on sides -->
        <div style="position: absolute; top: 450px; left: 0;">
            <div style="display: flex; gap: 8px; transform: translateX(-20px);">
                <div style="width: 35px; height: 40px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 2px 0 10px rgba(0,0,0,0.1);">
                    <div style="width: 12px; height: 12px; background: #333; border-radius: 50%; margin-left: 8px;"></div>
                </div>
                <div style="width: 35px; height: 40px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 2px 0 10px rgba(0,0,0,0.1);">
                    <div style="width: 12px; height: 12px; background: #333; border-radius: 50%; margin-left: 8px;"></div>
                </div>
            </div>
        </div>
        <div style="position: absolute; top: 430px; right: 0;">
            <div style="display: flex; gap: 8px; transform: translateX(20px);">
                <div style="width: 35px; height: 40px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: -2px 0 10px rgba(0,0,0,0.1);">
                    <div style="width: 12px; height: 12px; background: #333; border-radius: 50%; margin-right: 8px;"></div>
                </div>
                <div style="width: 35px; height: 40px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: -2px 0 10px rgba(0,0,0,0.1);">
                    <div style="width: 12px; height: 12px; background: #333; border-radius: 50%; margin-right: 8px;"></div>
                </div>
            </div>
        </div>

        <!-- Celebration elements -->
        <div style="position: absolute; top: 280px; left: 160px; font-size: 35px; transform: rotate(-10deg);">⭐</div>
        <div style="position: absolute; top: 320px; right: 150px; font-size: 40px; transform: rotate(10deg);">🌟</div>
        <div style="position: absolute; bottom: 200px; left: 130px; font-size: 30px;">✨</div>
        <div style="position: absolute; bottom: 180px; right: 140px; font-size: 32px;">✨</div>

        <!-- Bottom Banner -->
        <div style="position: absolute; bottom: 120px; left: 0; right: 0; background: linear-gradient(90deg, #7B1FA2 0%, #4A148C 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.15), 0 4px 20px rgba(0,0,0,0.15);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); letter-spacing: 2px;">CLASSROOM FUN TIME!</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;">
            <div style="background: white; padding: 12px 18px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid #7B1FA2;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #7B1FA2;">Perfect for Centers!</span>
            </div>
            <div style="background: white; padding: 12px 18px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid #FF6D00;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #FF6D00;">Brain Breaks!</span>
            </div>
            <div style="background: white; padding: 12px 18px; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 3px solid #00BCD4;">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #0097A7;">Early Finishers!</span>
            </div>
        </div>

    </div>
</body>
</html>
