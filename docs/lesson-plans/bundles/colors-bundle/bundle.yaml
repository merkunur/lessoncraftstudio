description:
  en: "Comprehensive K-3 bundle centered on color vocabulary + identification + sorting + classification. 5 packages span vocabulary-acquisition (point-to-named-color receptive + use-color-words productive) + cognitive-sorting (sort-by-color single-attribute + sort-by-multiple-attributes including color) + odd-one-out reasoning (identify-odd-one-out-by-attribute). Suitable for a 4-5 week classroom unit on colors; supports K-3 multilingual classrooms in international + dual-language + bilingual contexts. Color vocabulary appears across all 11 platform locales — accessible cognate-rich starting point for language acquisition (rojo/red/rouge; Blau/blue/blue/blu)."

