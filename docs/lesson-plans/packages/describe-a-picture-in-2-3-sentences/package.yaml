# Teaching package — describe a picture in 2-3 sentences
# Arc 8 Phase 2 (Option A vocab-acquisition continuation; early-literacy /
# speaking-and-listening strand). Class B FLEXIBLE; cross-strand productive-
# language. Builds on Arc 1+5+6 vocabulary-acquisition packages — kids now
# DESCRIBE a picture in connected sentences rather than just naming objects.
# Productive-language target: full-sentence narrative output.

targetSlug: describe-a-picture-in-2-3-sentences
language: en
title:
  en: "Describe a Picture — speak 2-3 sentences about what you see"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching 2-3-sentence picture-description. Productive-language target: kids transition from naming objects (Arc 1+5+6 vocabulary work) to producing connected narrative ('I see a cat. The cat is sitting on a chair. The cat is orange.'). Cross-strand: leverages established vocabulary as input for narrative output. Composes against picture-cards + sentence-strips materials for scaffolding. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class modeling routine. Teacher displays a picture on the
      board (e.g., a kitchen scene). Models 2-3 sentences: "I see a
      kitchen. The kitchen has a table. There is a cup on the table."
      Class repeats each sentence. Teacher emphasizes the
      connectedness — "Notice how each sentence builds on the last:
      first the SETTING, then an OBJECT, then a DETAIL." Reinforces
      narrative-structure framing.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + describe-and-listen routine. Each kid receives a
      picture card. Pair takes turns: kid A describes their picture in
      2-3 sentences while kid B listens. After A describes, B says
      back what they heard. Recast errors with explanation ("you said
      'cat orange' — let's make it a full sentence: 'The cat is
      orange.'"). Optional extension: kids draw their own picture +
      describe it to the class — increases productive-language load.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (image-name pairs;
      reinforces vocabulary that supports picture description). Station
      2: sentence-strips work (kids fill in language-frame sentences
      to describe pictures; reinforces sentence-construction). Station
      3: manipulative cut-outs hands-on scene-construction (kids build
      a scene + describe it; builds toward describing the scenes they
      construct). Station 4: prepositions worksheet (positional
      vocabulary supports describing where things are in the picture).
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-back. 4-5 kids describe a chosen picture from
      today's set; class listens. Forward-pointer: "Today we described
      pictures in 2-3 sentences. When we come back to describing
      next, we'll describe SEQUENCES of pictures — what happens FIRST,
      NEXT, THEN — building stories from connected pictures."

