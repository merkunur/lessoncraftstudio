  en: "K-3 bundle centered on 4th of July as American-summer-holiday anchor for cross-strand cultural-awareness + seasonal work. 4th holiday-template instantiation extending the doctrine validated at 3-instance threshold (easter + christmas + thanksgivinng). 5 packages span vocabulary-acquisition (identify-and-name-action-verbs — celebrate, parade, picnic, watch, gather, light + holiday-specific verbs) + numeracy (count-objects-1-to-10 — counting fireworks, flags, sparklers, picnic items) + color-cognition (sort-by-color — red-white-blue palette: red stripes vs white stars vs blue flags) + cultural-awareness (compare-greeting-routines-across-cultures — Independence Day in US compared to other national-independence celebrations: Mexican Independence Day Sept 16; Brazilian Independence Day Sept 7; French Bastille Day Jul 14; Indian Independence Day Aug 15) + summer-seasonal (identify-four-seasons — 4th of July as summer-anchored celebration). Holiday-template inheritance per pattern locked at easter + christmas + thanksgivinng. Suitable for a 3-4 week classroom unit timed to early July. Supports K-3 multilingual classrooms with cross-cultural-national-celebration + summer-celebration extensions."

