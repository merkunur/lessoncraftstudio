<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">

</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="width: 1000px; height: 1000px; position: relative; background: linear-gradient(160deg, #1A1A2E 0%, #16213E 45%, #0F3460 100%); overflow: hidden;">

        <!-- Subtle star-field dots -->

        <div style="position: absolute; top: 200px; left: 60px; width: 2px; height: 2px; background: rgba(255,255,255,0.25); border-radius: 50%;"></div>
        <div style="position: absolute; top: 150px; right: 180px; width: 3px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 50%;"></div>
        <div style="position: absolute; top: 350px; left: 40px; width: 2px; height: 2px; background: rgba(255,255,255,0.2); border-radius: 50%;"></div>
        <div style="position: absolute; top: 450px; right: 60px; width: 3px; height: 3px; background: rgba(255,255,255,0.25); border-radius: 50%;"></div>

            <img src="https://www.lessoncraftstudio.com/samples/german/odd%20one%20out/sample-2.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="">

        <!-- Amber radial spotlight glow -->
        <div style="position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); width: 520px; height: 520px; background: radial-gradient(circle, rgba(245,158,11,0.18) 0%, rgba(251,191,36,0.08) 35%, rgba(245,158,11,0.03) 55%, transparent 75%); border-radius: 50%;"></div>

        <!-- Scattered question marks -->
        <div style="position: absolute; top: 240px; left: 75px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 52px; color: rgba(251,191,36,0.15); transform: rotate(-15deg);">?</div>
        <div style="position: absolute; top: 380px; left: 35px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; color: rgba(251,191,36,0.1); transform: rotate(10deg);">?</div>
        <div style="position: absolute; top: 290px; right: 65px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 44px; color: rgba(251,191,36,0.12); transform: rotate(20deg);">?</div>
        <div style="position: absolute; top: 470px; right: 45px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 32px; color: rgba(251,191,36,0.1); transform: rotate(-8deg);">?</div>
        <div style="position: absolute; top: 550px; left: 110px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 28px; color: rgba(255,255,255,0.08); transform: rotate(25deg);">?</div>

        <!-- GRATIS Badge -->
        <div style="position: absolute; top: 25px; left: 28px; z-index: 100;">
            <div style="width: 100px; height: 100px; background: linear-gradient(145deg, #FF6B6B 0%, #EE5A24 100%); border-radius: 50%; box-shadow: 0 8px 28px rgba(238,90,36,0.5), inset 0 -4px 10px rgba(0,0,0,0.15), inset 0 4px 8px rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; transform: rotate(-8deg); border: 4px solid rgba(255,255,255,0.6);">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 22px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">GRATIS</span>
            </div>
        </div>

        <!-- Grade Badge -->
        <div style="position: absolute; top: 35px; right: 35px; background: rgba(255,255,255,0.1); padding: 11px 22px; border-radius: 28px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); border: 2px solid rgba(251,191,36,0.4); backdrop-filter: blur(4px);">
            <span style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; color: #FBBF24; letter-spacing: 1px;">VORSCHULE &ndash; 2. KLASSE</span>
        </div>

        <!-- Main Title -->
        <div style="position: absolute; top: 105px; left: 0; right: 0; text-align: center; z-index: 40;">
            <h1 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 78px; color: white; margin: 0; text-shadow: 0 0 40px rgba(245,158,11,0.15), 3px 3px 0 rgba(0,0,0,0.2);">WAS PASST</h1>
            <h2 style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 88px; color: #FBBF24; margin: -8px 0 0 0; text-shadow: 0 0 50px rgba(251,191,36,0.35), 0 0 100px rgba(251,191,36,0.15), 3px 3px 0 rgba(0,0,0,0.2);">NICHT?</h2>
        </div>

        <!-- Spotlight circle with worksheet -->
        <div style="position: absolute; top: 340px; left: 50%; transform: translateX(-50%); z-index: 30;">
            <!-- Outer glow ring -->
            <div style="position: absolute; top: -20px; left: -20px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, rgba(245,158,11,0.2) 0%, rgba(251,191,36,0.08) 60%, transparent 80%);"></div>
            <!-- Spotlight circle -->
            <div style="width: 300px; height: 300px; border-radius: 50%; overflow: hidden; border: 5px solid rgba(251,191,36,0.6); box-shadow: 0 0 40px rgba(245,158,11,0.3), 0 0 80px rgba(245,158,11,0.15), inset 0 0 30px rgba(0,0,0,0.3); position: relative;">
                <img src="https://www.lessoncraftstudio.com/samples/german/odd%20one%20out/sample-1.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Was passt nicht Arbeitsblatt">
            </div>
            <!-- Small decorative ring -->
            <div style="position: absolute; top: -8px; left: -8px; width: 316px; height: 316px; border-radius: 50%; border: 2px solid rgba(251,191,36,0.2);"></div>
        </div>

        <!-- Second smaller sample peeking from the side -->
        <div style="position: absolute; top: 400px; right: 40px; z-index: 20; opacity: 0.85;">
            <div style="width: 130px; height: 168px; border-radius: 10px; overflow: hidden; border: 3px solid rgba(251,191,36,0.3); box-shadow: 0 8px 25px rgba(0,0,0,0.4);">
                <img src="https://www.lessoncraftstudio.com/samples/german/odd%20one%20out/sample-3.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="Was passt nicht Arbeitsblatt">
            </div>
        </div>

        <!-- Bottom amber gradient banner -->
        <div style="position: absolute; bottom: 110px; left: 0; right: 0; background: linear-gradient(90deg, rgba(245,158,11,0.95) 0%, rgba(251,191,36,0.95) 50%, rgba(245,158,11,0.95) 100%); padding: 16px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.2), 0 4px 20px rgba(0,0,0,0.2);">
            <div style="text-align: center;">
                <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; color: #1A1A2E; text-shadow: 0 1px 2px rgba(255,255,255,0.3); letter-spacing: 1.5px;">Logisches Denken spielerisch f&ouml;rdern</span>
            </div>
        </div>

        <!-- Feature Pills -->
        <div style="position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px;">
            <div style="background: rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); border: 2px solid rgba(251,191,36,0.4); backdrop-filter: blur(4px);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #FBBF24;">Kritisches Denken</span>
            </div>
            <div style="background: rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); border: 2px solid rgba(255,107,107,0.4); backdrop-filter: blur(4px);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: #FF6B6B;">L&ouml;sungsbl&auml;tter</span>
            </div>
            <div style="background: rgba(255,255,255,0.1); padding: 12px 20px; border-radius: 26px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.3); backdrop-filter: blur(4px);">
                <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: white;">Sofort drucken</span>
            </div>
        </div>

    </div>
</body>
</html>
