compositionalRationale:
  en: |
    Primary strand: world-knowledge / personal-social-emotional-
    development (other-emotion recognition from facial cues). Secondary
    strand: vocabulary acquisition (vocab-anchored — emotion vocab
    from Arc 5+10). Tertiary strand: empathic perspective-taking
    (kids develop awareness that other people have inner states).

    Architectural significance: deepens personal-social-emotional-
    development strand 1/8 → 2/8. RESOLVES Arc 10 identify-own-emotions-
    in-context forward-pointer to other-people emotion recognition.
    SEL progression: own-emotions (Arc 10; self-awareness) → other-
    emotions (this package; perspective-taking) → empathic-response
    (future arcs). CASEL-aligned framework.

    Distinctive composition: 3 matching exercises across emotions
    theme + 1 odd-one-out + 1 word-guess. Matching-rhythm reinforces
    face-emotion mapping; odd-one-out pushes recognition (one face
    that doesn't match a target emotion category).

    Cross-strand integration: world-knowledge SEL + vocabulary
    acquisition + speaking-and-listening (productive description
    of others' emotions). Builds on Arc 5+10 emotion vocabulary as
    foundation.

    Class B FLEXIBLE substrate: composes against emotions theme.
    Substrate-readiness universal — emotion vocabulary + face imagery
    universally valuable.

    K-3 multilingual classroom relevance: emotion-recognition is
    cognitively universal; emotional EXPRESSION varies culturally
    (some cultures express more openly; others more reservedly).
    Locale-variant sparse-overrides can adapt for cultural expression
    norms. SEL is increasingly emphasized globally (CASEL; BNCC
    competências socioemocionais; PSED in EYFS).

