# Teaching package — add and subtract mixed within 20
# Arc 15 Phase 2 (math / addition-subtraction +1; combines Arc 12 add + Arc 14/15 subtract).

targetSlug: add-and-subtract-mixed-within-20
language: en
title:
  en: "Add and Subtract Mixed — within 20"
description:
  en: "Grade 1 / Grade 2 math package teaching kids to fluently switch between addition and subtraction within 20 in mixed problem sets. Builds on Arc 12 add-within-5/10/20 + Arc 14 Phase 4 subtract-within-5/10 + Arc 15 Phase 1 subtract-within-20 foundations. Critical fluency bridge — once add and subtract are independently established, kids need practice CHOOSING the right operation per problem. Mixed problem sets: 7+5=? then 12-5=? then 8+6=? then 13-7=? Examples train both operations + strengthen inverse-operation understanding (knowing 7+5=12 helps with 12-5=7 and 12-7=5). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + operation-switching demonstration. Teacher
      writes 3 problems on the board: 6+4=? / 10-3=? / 7+5=?
      "Look at each problem. The first sign is PLUS (+), so we
      ADD. The second sign is MINUS (-), so we SUBTRACT. The third
      is PLUS again, so we ADD." Class chants: "Plus is ADD!
      Minus is TAKE AWAY!" Teacher emphasizes reading the SIGN
      first before computing. Visual + verbal anchor for operation-
      switching fluency.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + mixed-operation routine. Each pair receives a
      worksheet with 8 mixed problems (4 addition + 4 subtraction
      randomly interleaved; all within 20 range). Pair takes
      turns: kid A reads problem aloud + identifies operation;
      kid B computes + writes answer. Recast errors with operation-
      reread ("you wrote 8 for 12-5, but check — minus means TAKE
      AWAY. 12 take away 5 is 7, not 8."). Inverse-operation
      connection: "We know 5+7=12, so 12-5=7 and 12-7=5."
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: math-worksheet (mixed vertical
      problems; alternating signs). Station 2: math-puzzle (find
      missing operand — 8+?=15; 17-?=9). Station 3: code-addition
      worksheet (combines addition + decoding cleverly; introduces
      problem-solving variety). Station 4: matching worksheet
      (problem-to-answer matching with mixed operations).
  closure:
    durationMinutes: 5
    body: |
      Whole-class fluency quiz. Teacher presents 10 rapid mixed
      problems; class answers with thumbs-up = right or down =
      wrong. "8+7? 15-9? 6+8? 17-6? 13-7? 9+5? 14-8? 11+4?
      19-12? 6+9?" Forward-pointer: "Today we mixed addition +
      subtraction. When we come back next, we'll do BIGGER mixed
      problems within 100 + start MULTI-STEP word problems!"

