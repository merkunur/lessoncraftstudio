compositionalRationale:
  en: |
    Primary strand: vocabulary acquisition (target identify-and-name-emotions).
    Secondary strand: PSED (Personal, Social & Emotional Development per
    learning-targets.json) — emotion-naming is foundational PSED skill.
    Tertiary strand: phonics (matching letter mode).

    Sentence-frame variant: this-is-a + i-have-a (better than i-see-a for emotions
    — kids don't usually "see" abstract emotions; they "have/feel" them or
    identify them on faces. The this-is-a frame supports face-recognition register.)

    Departure from farm-animals 8-material baseline: 7 materials. Manipulative-
    cut-outs OMITTED — emotions don't compose with concrete-counting prop
    (counting "5 happys" is unnatural). Substitution: emotion-narrative drawing
    at scaffold station 2 (described in CLIL body) — kids draw their own
    emotion-context, not a printable material.

    PSED-sensitivity guidance in CLIL contentActivity: "don't correct the kid's
    INTERNAL state, only the labeling" — emotions vocabulary requires gentler
    recasting register than concrete-noun vocabulary.

curriculumStandards:
  - EYFS.ELG.PSED
  - EYFS.ELG.UW

assessmentCriteria:
  en: |
    Receptive 10/10 (identify named emotion on face card); productive 8/10 (name
    emotion from face card); frame use 6/10 ("This is happy" / "I feel happy").

    Differentiation:
    - Pre-K: receptive only via face-mimicry. Emotions vocab varies by family
      culture; Pre-K kids may not have all 10 in their home-language vocabulary.
    - K / Grade 1: full productive + sentence-frame use.
    - Grade 2+: extend to compound emotions ("I felt happy AND tired") + emotion-
      narrative writing ("Today I felt {emotion} because...").

