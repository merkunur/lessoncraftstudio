compositionalRationale:
  en: |
    Primary strand: fine-motor-and-visual-spatial /
    handwriting (form uppercase letters — STRAND-OPENER
    EMPTY → 1/3; first handwriting strand package in the
    catalog). Secondary strand: early-literacy / letter-
    recognition (the formation work reinforces letter-shape
    recognition kids established at identify-uppercase-
    letters prerequisite). Tertiary strand: fine-motor-
    control (the actual pencil-grip + stroke-control work
    that handwriting requires).

    Architectural significance: opens the fine-motor-and-
    visual-spatial / handwriting strand. This is a FIRST-
    in-strand package — handwriting work was not previously
    represented in the catalog. Phase 1.5 opens the strand
    with the foundation skill (uppercase letter formation);
    Arc 18+ continues with form-lowercase-letters + form-
    numerals-0-to-10 to bring the strand to full 3/3 SAT.
    Per learning-targets.json prerequisite chain: form-
    uppercase-letters → form-lowercase-letters (which also
    requires identify-lowercase-letters); form-numerals-0-
    to-10 is the parallel numeracy-handwriting target.

    Cross-reference to Arc 10 Phase 1 identify-uppercase-
    letters (the prerequisite): that package established
    letter-shape RECOGNITION (kids can name letters when
    shown them); this package establishes letter-shape
    FORMATION (kids can produce letters with a pencil).
    The recognition-before-formation sequence is canonical
    early-literacy pedagogy — kids cannot reliably form a
    letter whose shape they don't recognize.

    Per §A.13.30 K-foundational-informal framing: K-1
    handwriting is RECOGNIZABLE LETTER FORMATION, not
    formal stroke-order memorization or precise
    calligraphy. The vocabulary-tracing-strips material's
    dotted-line templates guide kids through canonical
    letter forms; the independent-writing line lets kids
    attempt formation without scaffolding. Both teacher
    and parent can use whichever stroke-order pedagogy
    their curriculum prefers — this package teaches the
    OUTCOME (recognizable letter shapes) without
    prescribing one PROCESS. K-1 kids physically struggle
    with precise calligraphy; the goal at this age is the
    motor-routine fluency.

    Distinctive composition: 1 matching (intro — letter-
    recognition anchor) + 1 chart-count (alphabet
    sequence work) + 1 math-puzzle (letter-form fill-in)
    + 1 matching (letter-mode at consolidation) + 1
    missing-pieces (assessment — complete the partial
    letter form). The math-puzzle + missing-pieces work
    at positions 3 + 5 surfaces the letter-form
    completion skill — kids see a partial letter outline
    + complete the missing strokes, which mirrors the
    independent-writing work at the contentActivity step.

    Materials note: 8-material literacy class stack per
    Phase 1.5 commission spec. Adds sentence-strips
    (position 4; framePreset 'i-see-a' for letter-in-
    context anchoring — kids see "I see a [letter-word]"
    sentences that contextualize the uppercase letter
    formation work) on top of the canonical 7-material
    literacy-tracing stack (precedent: identify-uppercase-
    letters at Arc 10 Phase 1). Vocabulary-tracing-strips
    at position 5 with pedagogicalRole 'handwriting-
    formation' is the load-bearing material — the dotted-
    template + independent-line shape is the literal
    handwriting-pedagogy substrate.

    Class B FLEXIBLE substrate: composes against animals
    theme (literacy-class precedent per identify-uppercase-
    letters + identify-letter-sounds-vowels; vocab-
    anchored animal-names per letter — A-Antelope, B-Bear,
    C-Cat, etc. — provide the familiar vocabulary anchor).

    K-3 multilingual classroom relevance: letter formation
    is target-language-specific. en alphabet has 26
    uppercase letters; cross-locale letter inventories
    vary: de has 30 (adds ÄÖÜß); es has 27 (adds Ñ);
    fr/it/pt have 26 (with diacritical marks on some
    letters); fi has 29 (adds ÅÄÖ); sv has 29 (adds ÅÄÖ);
    da/no have 29 (adds ÆØÅ); nl has 26 (with IJ as
    digraph). The motor-routine for letter formation is
    locale-portable; the LETTER INVENTORY varies. Locale-
    variant work at Phase 3+ adapts to each locale's
    extended letter set + diacritical-mark handling
    (German Umlauts ÄÖÜ require dotted-line templates
    above the base letter; Nordic ÅÄÖ similarly; Spanish
    Ñ requires tilde-over-N work). For the first
    locale-variant pass per Arc 17 cadence, pt uses the
    standard 26-letter inventory (Brazilian Portuguese
    does not include accent-bearing letters as separate
    alphabet entries; accents are applied to vowels at
    spelling-not-formation time).

