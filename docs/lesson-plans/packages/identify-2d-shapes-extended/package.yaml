# Teaching package — identify extended 2D shapes
# Arc 5 Phase 3 (early-numeracy / geometry strand). Prereq-chain from Phase 2's
# identify-2d-shapes-basic. 10-key cluster: circle, square, triangle, rectangle,
# oval, diamond, star, heart, pentagon, hexagon. CLEAN against IMAGE_VOCABULARY.
# Validates basic→extended progression within geometry strand.

targetSlug: identify-2d-shapes-extended
language: en
title:
  en: "Extended 2D Shapes — adding oval, diamond, star, heart, pentagon, hexagon"
description:
  en: "Kindergarten-Grade 1 geometry package extending the 4 basic 2D shapes (circle/square/triangle/rectangle from identify-2d-shapes-basic) with 6 additional shapes (oval, diamond, star, heart, pentagon, hexagon). Builds on Phase 2 geometry foundation. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher reviews the 4 basic shapes from
      identify-2d-shapes-basic (circle, square, triangle, rectangle), then
      introduces 6 new shapes one at a time with paper-cut models. "This is
      an OVAL — like a circle, but stretched. This is a DIAMOND — like a
      square, but tilted. This is a STAR — 5 points." Class repeats names
      chorally; kids trace each new shape outline in the air. Pin to the
      shapes word-wall area.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("This is a {shape}").
      Choral reading of all 10 shapes. Pair work: kid A names a shape;
      kid B finds it on a shapes-poster (or shape-flashcard set). Real-
      world shape hunt extension: kids find heart shapes (Valentine's
      decorations), star shapes (flag, cookies), hexagon shapes (honeycomb,
      bolt heads), oval shapes (eggs, egg-mirrors), diamond shapes (kite,
      baseball field), pentagon shapes (home plate, soccer ball patches).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: shadow-match worksheet (10-shape set;
      match shape to outline silhouette). Station 2: find-and-count
      worksheet (count instances of star / heart / oval in busy grid).
      Station 3: manipulative cut-outs sorting onto 10 shape category
      mats (concrete classification of all 10 shapes).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names a shape; kids draw it in the
      air with a finger. Forward-pointer: "Today we added 6 more shapes
      to our shape vocabulary. Now we can describe almost any shape we
      see in the world. When we come back to shapes next, we'll think
      about the special parts of shapes — sides, corners, points."

