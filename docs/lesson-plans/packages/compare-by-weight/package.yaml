assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify which of 2 objects is heavier/lighter in 8 of 10
        trials.
      - Use comparative frame ('the X is heavier than the Y') in 7
        of 10 productive-language attempts.
      - Order 3 objects lightest-to-heaviest in 6 of 10 attempts.

    Differentiation:
    - Pre-K: 2-object direct comparison only; productive vocab limited
      to 'heavier' / 'lighter'.
    - K: 2-3 object comparison + comparative-grammar frame.
    - Grade 1+: extend to weight-with-units (informal); bridge to
      compare-by-capacity (Arc 12+ candidate) + scale-based weight.

