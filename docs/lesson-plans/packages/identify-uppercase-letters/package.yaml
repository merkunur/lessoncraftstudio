compositionalRationale:
  en: |
    Primary strand: early-literacy / letter-recognition (uppercase letter
    naming). Secondary strand: vocabulary acquisition (vocab-anchored —
    each letter paired with familiar vocab item). Tertiary strand: visual
    discrimination (uppercase letter shapes; B vs D vs P vs R contrast).

    Architectural significance: deepens letter-recognition strand from
    1/6 → 2/6 packages. Builds on Arc 9 Phase 1 identify-letter-by-image-
    clue (initial-letter-by-image-clue mediation) — kids transition
    from image-mediated letter awareness to direct letter recognition.
    The 26-letter systematic coverage establishes uppercase as a
    foundational alphabet-knowledge target.

    Distinctive composition: uppercase-emphasis throughout — `letterCase:
    UPPERCASE` set on flashcards + matching-mat + vocabulary-tracing-
    strips materials + word-guess exercise. The case parameter gives
    consistent uppercase reinforcement. matching at position 5 uses
    letter mode (image to LETTER directly) for assessment.

    Cross-strand integration: uppercase-recognition + vocabulary
    acquisition (vocab-anchored) + visual-discrimination (uppercase
    shape contrasts). The package leverages Arc 1+5+6+8 vocabulary
    work + Arc 9 letter-recognition work as foundation.

    Class B FLEXIBLE substrate: composes against image-library breadth
    + alphabet poster materials. Universal substrate-readiness across
    vocab-rich themes that have at least one anchor per letter.

    K-3 multilingual classroom relevance: uppercase letter recognition
    is target-language-specific (the en alphabet has 26 letters; some
    locales have 27-32). Locale-variant sparse-overrides handle locale-
    specific letter inventories per Phase 3 protocol.

