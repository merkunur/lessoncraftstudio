<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Prepositions Worksheets - Hero Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(145deg, #F5F3FF 0%, #EDE9FE 40%, #FEF7ED 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Decorative soft circles in background -->
        <div style="position: absolute; top: -60px; right: -60px; width: 280px; height: 280px; background: rgba(139, 92, 246, 0.08); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: -40px; left: -40px; width: 220px; height: 220px; background: rgba(249, 112, 102, 0.08); border-radius: 50%;"></div>
        <div style="position: absolute; top: 400px; right: -30px; width: 160px; height: 160px; background: rgba(251, 191, 36, 0.1); border-radius: 50%;"></div>

        <!-- FREE Badge - Top Left -->
        <div style="
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 20;
        ">
            <div style="
                width: 90px;
                height: 90px;
                background: linear-gradient(135deg, #F97066 0%, #EF4444 100%);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 8px 25px rgba(249, 112, 102, 0.5), inset 0 2px 0 rgba(255,255,255,0.3);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 28px;
                    color: white;
                    letter-spacing: 1px;
                ">FREE</span>
            </div>
        </div>

        <!-- Grade Badge - Top Right -->
        <div style="
            position: absolute;
            top: 50px;
            right: 40px;
            background: linear-gradient(135deg, #6D28D9 0%, #7C3AED 100%);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 22px;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.4);
            z-index: 20;
        ">GRADES PreK-2</div>

        <!-- Main Title -->
        <div style="
            position: absolute;
            top: 130px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 72px;
                color: #6D28D9;
                margin: 0;
                text-shadow: 0 3px 12px rgba(109, 40, 217, 0.15);
                letter-spacing: -1px;
            ">Prepositions</h1>
            <h2 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 36px;
                color: #F97066;
                margin: -4px 0 0 0;
            ">Worksheets</h2>
        </div>

        <!-- Spatial word bubbles floating around worksheets -->
        <!-- "ON" - positioned above the worksheet stack -->
        <div style="
            position: absolute;
            top: 285px;
            left: 220px;
            background: linear-gradient(135deg, #06B6D4 0%, #0891B2 100%);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 26px;
            padding: 8px 22px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
            z-index: 25;
            transform: rotate(-6deg);
        ">ON</div>

        <!-- "UNDER" - positioned below -->
        <div style="
            position: absolute;
            bottom: 185px;
            left: 160px;
            background: linear-gradient(135deg, #F97066 0%, #EF4444 100%);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 24px;
            padding: 8px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(249, 112, 102, 0.4);
            z-index: 25;
            transform: rotate(4deg);
        ">UNDER</div>

        <!-- "BESIDE" - positioned to the right side -->
        <div style="
            position: absolute;
            top: 530px;
            right: 55px;
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            color: #1E293B;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 24px;
            padding: 8px 20px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
            z-index: 25;
            transform: rotate(5deg);
        ">BESIDE</div>

        <!-- "IN" - overlapping slightly with worksheets -->
        <div style="
            position: absolute;
            top: 420px;
            left: 105px;
            background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 26px;
            padding: 8px 24px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            z-index: 25;
            transform: rotate(-3deg);
        ">IN</div>

        <!-- Worksheet Fan - 4 worksheets -->
        <!-- Back worksheet (sample-7) - leftmost tilt -->
        <div style="
            position: absolute;
            top: 320px;
            left: 50%;
            transform: translateX(-50%) translateX(-110px) rotate(-8deg);
            z-index: 10;
        ">
            <div style="
                background: white;
                padding: 8px;
                border-radius: 8px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-7.jpeg"
                    alt="Prepositions Worksheet"
                    style="
                        width: 220px;
                        height: 285px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 4px;
                        display: block;
                    "
                />
            </div>
        </div>

        <!-- Second worksheet (sample-5) -->
        <div style="
            position: absolute;
            top: 310px;
            left: 50%;
            transform: translateX(-50%) translateX(-40px) rotate(-3deg);
            z-index: 11;
        ">
            <div style="
                background: white;
                padding: 8px;
                border-radius: 8px;
                box-shadow: 0 12px 35px rgba(0,0,0,0.18);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-5.jpeg"
                    alt="Prepositions Worksheet"
                    style="
                        width: 220px;
                        height: 285px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 4px;
                        display: block;
                    "
                />
            </div>
        </div>

        <!-- Third worksheet (sample-3) -->
        <div style="
            position: absolute;
            top: 310px;
            left: 50%;
            transform: translateX(-50%) translateX(30px) rotate(3deg);
            z-index: 12;
        ">
            <div style="
                background: white;
                padding: 8px;
                border-radius: 8px;
                box-shadow: 0 12px 35px rgba(0,0,0,0.18);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-3.jpeg"
                    alt="Prepositions Worksheet"
                    style="
                        width: 220px;
                        height: 285px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 4px;
                        display: block;
                    "
                />
            </div>
        </div>

        <!-- Front worksheet (sample-1) - rightmost tilt -->
        <div style="
            position: absolute;
            top: 320px;
            left: 50%;
            transform: translateX(-50%) translateX(100px) rotate(7deg);
            z-index: 13;
        ">
            <div style="
                background: white;
                padding: 8px;
                border-radius: 8px;
                box-shadow: 0 15px 40px rgba(0,0,0,0.22);
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/prepositions/sample-1.jpeg"
                    alt="Prepositions Worksheet"
                    style="
                        width: 220px;
                        height: 285px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 4px;
                        display: block;
                    "
                />
            </div>
        </div>

        <!-- Bottom ribbon banner -->
        <div style="
            position: absolute;
            bottom: 110px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
        ">
            <div style="
                display: inline-block;
                background: linear-gradient(135deg, #6D28D9 0%, #8B5CF6 100%);
                padding: 14px 50px;
                border-radius: 50px;
                box-shadow: 0 6px 20px rgba(109, 40, 217, 0.35);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 26px;
                    color: white;
                    letter-spacing: 2px;
                ">SPATIAL LEARNING FUN!</span>
            </div>
        </div>

        <!-- Feature pills at bottom -->
        <div style="
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 20;
        ">
            <div style="
                background: white;
                border: 2px solid #EDE9FE;
                padding: 8px 18px;
                border-radius: 20px;
                font-family: 'Nunito', sans-serif;
                font-weight: 700;
                font-size: 16px;
                color: #6D28D9;
            ">Themed</div>
            <div style="
                background: white;
                border: 2px solid #EDE9FE;
                padding: 8px 18px;
                border-radius: 20px;
                font-family: 'Nunito', sans-serif;
                font-weight: 700;
                font-size: 16px;
                color: #6D28D9;
            ">Answer Keys</div>
            <div style="
                background: white;
                border: 2px solid #EDE9FE;
                padding: 8px 18px;
                border-radius: 20px;
                font-family: 'Nunito', sans-serif;
                font-weight: 700;
                font-size: 16px;
                color: #6D28D9;
            ">Cut &amp; Paste</div>
            <div style="
                background: white;
                border: 2px solid #EDE9FE;
                padding: 8px 18px;
                border-radius: 20px;
                font-family: 'Nunito', sans-serif;
                font-weight: 700;
                font-size: 16px;
                color: #6D28D9;
            ">Print Ready</div>
        </div>

        <!-- Small decorative dots -->
        <div style="position: absolute; top: 240px; left: 80px; width: 12px; height: 12px; background: #FBBF24; border-radius: 50%; opacity: 0.6;"></div>
        <div style="position: absolute; top: 180px; right: 120px; width: 16px; height: 16px; background: #06B6D4; border-radius: 50%; opacity: 0.5;"></div>
        <div style="position: absolute; bottom: 250px; right: 80px; width: 10px; height: 10px; background: #F97066; border-radius: 50%; opacity: 0.6;"></div>
        <div style="position: absolute; top: 350px; left: 50px; width: 14px; height: 14px; background: #8B5CF6; border-radius: 50%; opacity: 0.4;"></div>
    </div>
</body>
</html>
