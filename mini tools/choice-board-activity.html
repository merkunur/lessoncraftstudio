<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Choice Board — Activity — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=12">
  <!-- v7 cascade: activity-page parent forces iframe height to 66.67vh
       and renders a sage field around the iframe. These per-wrapper
       rules make the iframe body transparent (so the field shows through)
       and cascade height: 100% down to .lcs-app so the card fills the
       iframe. Shared activity-card sizing/padding/header rules live in
       lcs-shell.css scoped to .lcs-app.activity. -->
  <style>
    html, body { background: transparent !important; }
    html, body, #lcs-root { height: 100% !important; }

    /* v7.2 mobile: shrink subject (image + group items) so the 2×2 tile
       grid fits vertically. Subject 96px floor + 283px grid + prompt +
       gaps = 440px in ~376px vertical budget — overflow by 64px forces
       tile aspect-ratio break or clipping. Subject 56-80px frees ~40px;
       group items 48px (was 64px) free another ~10px. */
    @media (max-width: 599px) {
      /* !important needed: engine injects its CSS via JS at runtime (after
         this inline <style>) — equal specificity, later cascade wins.
         v7.10: cb-subject +30% (56→73 floor, 80→104 ceiling) per operator
         spec. cb-tile capped at 76px (-30% from 108) for both 2-tile
         (Flat/Solid) and 4-tile (Count-the-Sides) layouts on mobile. */
      .cb-subject-img { height: clamp(73px, 16vmin, 104px) !important; }
      .cb-subject--group { max-width: 240px !important; }
      .cb-subject--group .cb-group-item { max-width: 48px !important; }
      .cb-wrap { gap: clamp(10px, 2.4vmin, 16px) !important; }
      .cb-tile { max-width: 76px !important; max-height: 76px !important; }
    }

    /* v7.10 desktop: cb-subject +30% (120→156 floor, 180→234 ceiling).
       cb-tile cap per cb-cols class: 2-tile Flat/Solid caps at 246
       (-30% from natural 351); 4-tile Count-the-Sides caps at 117
       (-30% from natural 167). cb-cols-2/-4 classes are added by the
       engine to .cb-board based on answer-count, so this targets the
       two named activities precisely without affecting identify-the-
       shape (which is 4-tile but already at 167, would also cap to 117). */
    @media (min-width: 768px) {
      .cb-subject-img { height: clamp(156px, 21vmin, 234px) !important; }
      .cb-board { max-width: 720px !important; }
      .cb-tile { padding: clamp(16px, 2.4vmin, 24px) !important; }
      .cb-cols-2 .cb-tile { max-width: 246px !important; max-height: 246px !important; }
      .cb-cols-4 .cb-tile { max-width: 117px !important; max-height: 117px !important; }
      .cb-wrap { gap: clamp(16px, 2.6vmin, 24px) !important; }
    }
  </style>
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell first, then the shared choice-board core, then this activity wrapper. -->
  <script src="/mini-tools/lcs-shell.js"></script>
  <script src="/mini-tools/choice-board-core.js?v=4"></script>
  <script src="/mini-tools/choice-board-activity.js?v=4"></script>
  <script>
    LCS.mount(ChoiceBoardActivity, { mount: '#lcs-root' });
  </script>
</body>
</html>
