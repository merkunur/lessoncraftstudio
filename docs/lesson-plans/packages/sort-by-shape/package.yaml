# Teaching package — sort objects by shape
# Arc 5 Phase 3 (cognitive-and-executive-function / sorting-and-classification
# strand). Companion to sort-by-color in same Phase 3. Different attribute
# (shape vs color) — same sorting-architecture pattern. Class B FLEXIBLE;
# composes against shapes cluster (CLEAN at Phase 2 from identify-2d-shapes-
# basic + identify-3d-shapes) + image-library breadth.

targetSlug: sort-by-shape
language: en
title:
  en: "Sort by Shape — group objects by their shape"
description:
  en: "Pre-K to Grade 1 cognitive-and-executive-function package teaching shape-based attribute sorting. Companion to sort-by-color (same Phase 3) but with shape as the sorting attribute. Cognitive transfer surface: kids who learned to hold 'color' as a sorting rule now hold 'shape' as the rule. Composes against shape clusters + image-library breadth. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher reviews the 4 basic shapes from
      identify-2d-shapes-basic (Phase 2): circle, square, triangle,
      rectangle. Holds up real-world objects; class names the shape
      ("clock = circle; book = rectangle; door-sign = triangle;
      window = square"). Reinforces shape-recognition + the attribute-
      identification meta-skill before sorting work begins.
  contentActivity:
    durationMinutes: 12
    body: |
      Whole-class sorting routine. Teacher places 4 shape-mat cards
      labeled (circle / square / triangle / rectangle) on the carpet.
      Holds up mixed objects; class collaboratively places each on the
      matching shape mat. Pair work: kid A picks an object; kid B
      identifies its shape and places it. Recast errors. Optional
      extension: kids notice that some objects have multiple shape parts
      (a car has rectangle body + circle wheels — discuss attribute
      complexity).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (sort objects
      between 2 shape contrasts — circle objects vs square objects).
      Station 2: shadow-match worksheet (object to its dominant-shape
      silhouette — bridges sorting with shape-identification). Station 3:
      manipulative cut-outs hands-on shape sorting (kids physically place
      cut-out objects on 4 shape mats).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names a shape; kids show with a
      classroom object ("everyone find something rectangular!"). Forward-
      pointer: "Today we sorted by shape. When we come back to sorting
      next, we'll sort by SIZE — bigger and smaller — keeping a different
      rule in mind."

