assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the main character of a familiar read-
        aloud story in 8 of 10 trials.
      - Identify the main character of a NEW story (with
        teacher read-aloud) in 6 of 10 trials.
      - Articulate the identification reasoning ('I know
        the bear is the main character because the bear
        is in every picture and the title says brown
        bear') in 5 of 10 productive-language trials.
      - Use vocabulary 'main character' / 'character' /
        'story' correctly in 6 of 10 productive-language
        trials.

    Differentiation:
    - Pre-K: read-aloud + picture-cue character spotting
      (no formal main-character distinction); kids
      simply name 'who is in the story'.
    - K: full main-character identification with familiar
      stories + simple new stories; teacher read-aloud
      heavily supported.
    - Grade 1: independent main-character identification
      in simple new stories; bridge to character-vs-
      setting distinction.
    - Grade 2+: main-vs-secondary character distinction;
      character feelings / motivations work (the Arc 18+
      candidate infer-character-feeling-from-picture-cue
      is the next reading-comp strand-target after this).

