compositionalRationale:
  en: |
    Primary strand: cognitive-and-executive-function / sorting-and-
    classification. Secondary strand: geometry (shape recognition; depends
    on Phase 2's identify-2d-shapes-basic + identify-3d-shapes work).
    Tertiary strand: visual-discrimination (object-shape vs distractor
    shapes).

    Architectural significance vs sort-by-color (Phase 3 companion): same
    sorting-architecture pattern, different attribute. The two packages
    together validate that the sorting-by-attribute architecture
    generalizes across attributes (color → shape → size in future arcs).
    Stress-tests whether picture-sort handles theme-axis variation
    cleanly.

    Distinctive composition vs sort-by-color: 2 picture-sort exercises
    (positions 2, 5) instead of 3 — shape-based sorting works well with
    shadow-match (position 1) which is shape-attribute identification +
    matching-imgname (position 3) which is shape-naming. The 5-exercise
    composition reflects that shape-attribute sorting requires more
    shape-naming skill than color-attribute sorting (color names are
    immediately apprehended; shape names take longer to learn).

    Cross-package prereq integration: this package depends pedagogically
    on Phase 2's identify-2d-shapes-basic + identify-3d-shapes (kids
    must know shape names before sorting by shape). Validates that the
    Arc 5 phase-ordering produces useful prereq-chain authoring (basic
    shapes in Phase 2; sorting-by-shape in Phase 3 builds on it).

    Cultural-variation acknowledgment: shape-recognition is universal;
    object-to-dominant-shape mapping varies modestly by region (a
    locale-specific traditional object may have a non-standard shape
    profile). Operator-side teachers can swap region-specific objects
    in the picture-sort exercise customization.

