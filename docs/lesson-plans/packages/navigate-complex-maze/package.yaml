assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify the SHORTER path through a 2-route maze in 8 of 10
        trials.
      - Trace the optimal path (shortest OR treasure-richest as
        specified) through a 3-route maze in 7 of 10 attempts.
      - Articulate path-choice reasoning ('I chose path B because
        it has more apples') in 6 of 10 productive-language attempts.

    Differentiation:
    - Pre-K: 2-route mazes only; finger-trace; teacher reads path
      lengths aloud.
    - K: 2-3 route mazes; pencil-trace; kids count path lengths.
    - Grade 1+: extend to maze-design (kids design multi-route mazes
      for partners); bridge to maze-direction-narration (productive
      sequencing of direction commands; Arc 11+ candidate).

