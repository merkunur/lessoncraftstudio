assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify 6 of 8 target-language words as cognates (or non-
        cognates) when home-language equivalents are present in
        whole-class set.
      - Articulate the cognate-pair relationship ("'tomate' and
        'tomato' look alike — they mean the same thing") in 6 of 10
        trials.
      - Use cognate-noticing as a learning strategy when encountering
        new target-language words in the unit's reading.

    Differentiation:
    - Pre-K: 4 strong-cognate words; pair-noticing routine only.
    - K: 6-8 cognate words across 2 themes; matching + flashcard work.
    - Grade 1+: extend to FALSE FRIENDS work (Arc 9+ candidate); bridge
      to morphological-awareness (recognizing shared word roots like
      'photo-' across English/Spanish/Italian/Portuguese photography
      vocabulary).

