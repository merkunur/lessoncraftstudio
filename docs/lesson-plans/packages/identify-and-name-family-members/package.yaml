compositionalRationale:
  en: |
    Primary strand: early-literacy / vocabulary-acquisition (family-
    member naming). Secondary strand: speaking-and-listening (productive
    family-introduction language). Tertiary strand: cultural affirmation
    + identity-validation (kids' diverse family structures = classroom
    asset).

    **Architectural significance: SUBSTRATE-UNBLOCKED PACKAGE.** Family-
    members deferral chain extended Arc 4 → 5 → 6 → 7 → 8 → 9 → 10 → 11
    (7 arcs). Stream A Phase 1 IMAGE_VOCABULARY extension at Arc 12
    commencement closed the chain. This package is the FIRST of the
    long-deferred family-vocabulary work + brings vocabulary-acquisition
    strand from 21/24 → 22/24 (approaching saturation; only point-to-
    named-clothing-item + identify-and-name-action-verbs remain).

    Distinctive composition: 3 matching exercises across same theme
    (family-members vocab via vocabKeyList) + 1 word-guess + 1 word-
    scramble. The vocabKeyList material parameter is FIRST package use
    — explicit vocab key list (rather than theme-name) lets materials
    pull exactly the family-vocabulary set without theme-resolution
    indirection. Pattern reusable for vocab-keyed packages with
    specific word sets.

    **Cross-cultural sensitivity load-bearing.** Multilingual K-3
    classrooms contain diverse family structures: nuclear families,
    single-parent, multi-generational, blended/stepfamily, foster/
    adoptive, two-parent same-gender families, chosen families.
    Package frames vocabulary as ROLES that kids might have in
    their family (not all kids have all 8 roles in their daily
    life; vocabulary remains useful regardless). Affirmation
    framing is research-validated for academic + emotional well-
    being (Cummins; Garcia + Wei translanguaging; CASEL framework).

    Class A CLEAN substrate (post-Stream-A-Phase-1-ship): family-
    member vocabulary in IMAGE_VOCABULARY across all 11 platform
    locales with grammatically-correct gender data. Universal
    substrate-readiness.

    K-3 multilingual classroom relevance: family vocabulary is
    high-frequency K-3 target across all 11 platform locales —
    cross-cognate-rich (mother / madre / mãe / mère / mutter / mor;
    father / padre / pai / père / vater / far). Cognate-noticing
    work from Arc 8 notice-cognate-word-pairs composes naturally —
    family vocab is one of the strongest cognate domains.

