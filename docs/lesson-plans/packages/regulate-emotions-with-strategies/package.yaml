compositionalRationale:
  en: |
    Primary strand: science / personal-social-emotional-development
    (emotion-regulation strategies — deepens strand 1/6 → 2/6).
    Secondary strand: communication (asking for help when needed).
    Tertiary strand: cognitive-and-executive-function (self-
    awareness + behavior choice).

    Architectural significance: deepens personal-social-emotional-
    development strand from 1/6 to 2/6. Builds on Arc 15 Phase 2
    express-feelings-with-words foundation (recognition + naming);
    extends to ACTIVE emotion-regulation work. Critical bridge
    from emotional-expression (Phase 2) to emotional-regulation
    (this Phase). Foundation for later conflict-resolution +
    peer-relationship work.

    Distinctive composition: 2 matching + 1 pattern-train + 1
    missing-pieces + 1 picture-sort (sort scenarios by appropriate
    strategy). Strategy-emphasis throughout; picture-sort
    introduces multi-bin classification by strategy-match.

    Class B FLEXIBLE substrate: composes against emotions theme
    (canonical for feeling + strategy imagery).

    K-3 multilingual classroom relevance: emotion-regulation
    strategies universal across cultures. Strategy vocabulary
    varies: "deep breathing" (respirar profundamente / atmen),
    "safe place" (lugar seguro / sicherer Ort), "count to ten"
    universal mathematical-counting. Cultural variations in
    accepted regulation strategies exist (some cultures favor
    movement; others favor stillness; some emphasize asking-for-
    help more than independent regulation). Bundle includes
    multiple strategies allowing locale + cultural adaptation.

