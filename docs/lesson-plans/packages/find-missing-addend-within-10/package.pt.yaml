# Teaching package — encontrar o adendo faltante até 10 (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT per Arc 7 Phase 3 + Arc 3 Phase 1 sparse-override pattern.
# Arc 17 Phase 1.2 pt-cadence continuation (15th consecutive arc).
# pt sparse-override for math / addition-subtraction strand. Conteúdo matemático
# universal — tradução direta sem reestruturação pedagógica. BR-MEC ensino
# fundamental anos iniciais register per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Encontrar o Adendo Faltante até 10 — qual número vai no espaço em branco?"

description:
  pt: "Pacote de matemática para 1º ano que ensina o formato de pergunta com adendo-faltante ('3 + ? = 8 — qual número preenche o espaço?') com somas até 10. Constrói sobre a fluência Arc 4 add-within-5 + Arc 11 add-within-10; a pergunta com adendo-faltante reutiliza fatos de adição que as crianças já conhecem mas inverte a pergunta — em vez de calcular uma soma a partir de dois adendos conhecidos, a criança encontra um adendo desconhecido dadas a soma e o outro adendo. RESOLVE o indicador-adiante de Arc 4 add-within-5 ('alvo adjacente de pensamento-inverso'). Este é o primeiro pacote de pensamento-algébrico — o formato de pergunta com desconhecido-em-um-espaço é o precursor K-3 do trabalho de resolução-de-equação que aparece no ensino fundamental dos anos finais (x + 3 = 8). Sequência concreto-pictórico-abstrato: as crianças começam contando fisicamente o intervalo em um painel-de-dez, passam para contagem-para-frente pictórica em uma reta numérica, e finalmente respondem mentalmente usando recuperação de fato-de-adição ('eu sei que 3 + 5 = 8, então o espaço é 5'). Âncora primária CCSS.1.OA.D.8; cruzamento CCSS.K.OA.A.4 ('encontre o número que faz 10'). 5 exercícios + 6 materiais imprimíveis em uma unidade de 1 semana. Companheiro emparelhado de âncora-de-fio: make-10-strategy (matemática mental de decomposição no mesmo fio de fluência em adição)."

structure:
  warmup:
    body: |
      Iniciador com toda a turma + introdução do formato de
      pergunta com adendo-faltante. A professora ou o professor
      escreve 3 + ? = 8 no quadro. "Hoje conhecemos um novo
      tipo de pergunta. Normalmente eu pergunto 'quanto é 3
      mais 5?' e você diz 8. Hoje estou perguntando algo
      diferente. Eu te digo 3 mais ALGUMA COISA é igual a 8.
      Seu trabalho é encontrar a ALGUMA COISA." A professora
      ou o professor mostra a contagem-para-frente nos dedos:
      levanta 3 dedos ("três"), conta até 8 levantando mais
      dedos ("quatro, cinco, seis, sete, oito"), depois conta
      os dedos novos ("cinco"). "Então 3 mais 5 é igual a 8.
      O número faltante é 5." Repete com 4 + ? = 9 (conte
      para frente a partir de 4: cinco, seis, sete, oito,
      nove — cinco dedos novos; resposta 5) e 6 + ? = 10
      (um par fazer-dez — o par de 6 é 4). Ênfase do padrão:
      "Nós SABEMOS um adendo. Nós SABEMOS a soma. Nós
      ENCONTRAMOS o OUTRO adendo contando para frente — ou
      sabendo o fato de adição."
  contentActivity:
    body: |
      Trabalho em duplas com painel-de-dez + contadores com
      tema fruits. Cada dupla recebe um painel-de-dez + uma
      pilha de contadores de frutas. Dupla joga o jogo de
      adendo-faltante: a professora ou o professor dá um
      problema (e.g., 3 + ? = 8); criança A coloca o adendo
      conhecido no painel-de-dez (3 maçãs nos primeiros 3
      quadrados); o trabalho da criança B é encontrar
      quantos contadores a mais preenchem até a soma (coloca
      frutas até o total ser 8 — criança B coloca 5 mais; a
      resposta é 5). Ambas dizem em voz alta: "3 mais 5 é
      8. O número faltante é 5." Depois a dupla troca +
      repete com 4 + ? = 7, 2 + ? = 9, 5 + ? = 10, 6 + ? =
      8. A estrutura em grade do painel-de-dez torna a
      contagem-para-frente visível — as crianças podem ver
      o intervalo entre o que está lá e o que é necessário.
      Refraseie erros com pista de contagem-para-frente
      ('comece em 3 — conte até 8 — quantos novos você
      colocou?'). Escolhas de estratégia: crianças podem
      contar para frente no painel, usar recuperação de
      fato-de-adição, OU usar uma reta numérica / quadro-
      de-cem como apoio; a professora ou o professor aceita
      qualquer estratégia que produza resposta correta +
      possa ser explicada.
  scaffold:
    body: |
      Rotação de estações. Estação 1: addition app modo
      find-addend (operandos até 10 — o exercício canônico
      de adendo-faltante da composição de add-within-5,
      agora escalado para somas-até-10). Estação 2: math-
      puzzle modo missing-addend (problemas visuais com um
      espaço em branco onde o adendo faltante vai). Estação
      3: math-worksheet problemas de adendo-faltante
      (formato escrito em coluna ou em sentença: 3 + __ =
      8). Estação 4: atividade matching — combine cada
      problema de adendo-faltante à sua resposta (3+?=8
      combina com 5; 4+?=10 combina com 6). Vocabulário
      pt-BR canônico para adendo-faltante: adendo / adendo-
      faltante / parcela / parcela faltante; soma / total;
      espaço em branco / lacuna; contar para frente;
      desconhecido / número faltante. Use "adendo-faltante"
      ou "parcela-faltante" — ambas formas K-3 válidas;
      "parcela" é a forma BNCC canônica para os números
      sendo somados; "adendo" é a forma escolar tradicional.
  closure:
    body: |
      Recuperação rápida de adendo-faltante com toda a
      turma. A professora ou o professor apresenta problemas;
      turma responde coletivamente + nomeia a estratégia.
      "3 + ? = 7? — Quatro! Eu contei para frente de 3 até
      7 — quatro passos." "5 + ? = 10? — Cinco! Isso é um
      par fazer-dez." "2 + ? = 9? — Sete! Eu sei que 2 mais
      7 é 9." Indicador adiante: "Hoje encontramos adendos
      faltantes até 10. O mesmo formato de pergunta cresce:
      somas maiores recebem adendos faltantes maiores
      (encontrar-adendo-faltante até 20, até 100), e
      eventualmente veremos essa mesma forma com x no
      ensino fundamental dos anos finais — x + 3 = 8. O
      espaço em branco que você encontra hoje é o mesmo
      espaço que se torna uma letra depois. A ESTRATÉGIA
      FAZER-DEZ que acabamos de aprender ajuda aqui —
      quando a soma é 10, o adendo faltante é o par
      fazer-dez."

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Resolver problemas de encontrar-adendo-faltante até
        10 (3 + ? = 8) em 7 de 10 tentativas.
      - Usar estratégia de contagem-para-frente do adendo
        conhecido até a soma em 6 de 10 tentativas quando
        solicitado a mostrar o trabalho.
      - Articular a resposta no formato de sentença de
        adição ('três mais cinco é oito; o número faltante
        é cinco') em 5 de 10 tentativas de linguagem
        produtiva.
      - Reconhecer quando a soma é 10 e aplicar
        recuperação de par fazer-dez como atalho em 6 de 8
        problemas com soma-igual-a-10.

    Diferenciação:
      - Pré-K (3-5 anos): pular o formato abstrato de
        pergunta com adendo-faltante; construir recuperação
        de fato-de-adição até 5 com manipulativos.
      - Educação infantil (5-7 anos): introduzir adendo-
        faltante até 5 primeiro ('1 + ? = 4'); suporte de
        manipulativo + painel-de-dez enfatizado; estratégia
        de contagem-para-frente fortemente apoiada.
      - 1º ano: fluência completa de adendo-faltante até
        10; contagem-para-frente + recuperação de fato-de-
        adição + estratégias de par fazer-dez em uso ativo.
      - 2º ano em diante: estender para encontrar-adendo-
        faltante até 20 (candidato Arc 13+); ponte para
        resolução de equação algébrica no ensino
        fundamental dos anos finais — o mesmo espaço em
        branco que continha '5' aqui se torna 'x' lá.

compositionalRationale:
  pt: |
    Fio principal: matemática / adição-subtração (encontrar
    adendo faltante até 10 — aprofunda fio 12/14 → 13/14).
    Fio secundário: precursor de pensamento-algébrico (o
    formato de pergunta com desconhecido-em-um-espaço é o
    precursor K-3 da resolução de equação; o mesmo espaço
    em branco que contém '5' aqui se torna 'x' no ensino
    fundamental dos anos finais). Fio terciário: numeracia
    (fluência de estratégia: contar-para-frente + recuperar-
    fato-de-adição + usar-fatos-conhecidos).

    Significância arquitetural: RESOLVE o indicador-adiante
    de Arc 4 add-within-5 ('find-missing-addend-within-10 —
    alvo adjacente de pensamento-inverso'). Primeiro pacote
    de pensamento-algébrico no catálogo. A pergunta com
    adendo-faltante reutiliza fatos de adição que as
    crianças já têm da fluência add-within-5 + add-within-
    10, mas inverte a pergunta — em vez de calcular uma
    soma a partir de adendos conhecidos, a criança
    encontra um adendo desconhecido dada a soma e um
    adendo. Esta inversão do formato de pergunta é a
    operação cognitiva que fundamenta a resolução de
    equação posterior; surgir como habilidade K-3
    discreta torna a operação algébrica legível muito
    antes de letras entrarem no vocabulário matemático.

    Companheiro emparelhado de âncora-de-fio: make-10-
    strategy (mesma fase do arco) — o trabalho de par
    fazer-dez se sobrepõe diretamente com a recuperação
    de adendo-faltante quando a soma é 10 (saber 7 + ? =
    10 É usar um par fazer-dez). Os dois pacotes
    compartilham DNA do fio de fluência em adição; o
    pacote fazer-dez constrói recuperação-do-par, este
    pacote o estende para qualquer soma-até-10.

    Especificidade pt-BR: encontrar-adendo-faltante é
    conceito universal + traduzível 1:1 do en. Vocabulário
    pt-BR canônico:
    - **"adendo"** (escolar tradicional) / **"parcela"**
      (BNCC canônica) — ambas formas K-3 válidas; "parcela"
      alinha com a terminologia BNCC oficial; "adendo"
      é mais comum em material didático histórico.
    - **"adendo faltante"** / **"parcela faltante"** /
      **"parcela desconhecida"** — formas K-3 para o
      conceito do número-em-branco.
    - **"contar para frente"** — estratégia K-3 canônica
      para a operação de count-up.
    - **"espaço em branco"** / **"lacuna"** — termos K-3
      para o slot vazio onde o adendo faltante vai;
      "espaço em branco" é a forma mais coloquial.
    - **"número faltante"** / **"número desconhecido"** —
      termos K-3 para o conceito do valor a encontrar.

    Como o português brasileiro pronuncia 'mais' (sinal +)
    da mesma forma que o adverbial 'mais' (more), a
    pergunta verbal "três mais quanto é oito?" lê
    naturalmente em pt-BR sem ambiguidade. A forma da
    sentença de adição pt-BR ('três mais cinco é oito')
    paraleliza diretamente a forma en ('three plus five
    is eight'), tornando o trabalho de adendo-faltante
    locale-portátil em termos estruturais.

    Currículo BNCC EF01MA08 (1º ano) + EF02MA05 (2º ano):
    cálculo de adição; uso de estratégias pessoais;
    composição/decomposição; reconhecer adendos faltantes
    como precursor de pensamento-algébrico (BNCC EF02MA09).

    Substrato Class B FLEXIBLE: composta contra tema
    fruits (diversificação inter-fios afastando-se de
    animals; continuidade leve com tema fruits do
    exercício mixed de add-within-5 na posição 5 — crianças
    que fizeram add-within-5 reconhecerão o contexto de
    frutas quando o formato de pergunta com adendo-faltante
    chegar).
