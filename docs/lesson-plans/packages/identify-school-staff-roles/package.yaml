  - IB-PYP.WhoWeAre

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Name 8 school-staff roles when shown role picture in 7 of
        10 trials.
      - Match school-staff role to what-they-do task in 7 of 10
        trials.
      - Identify which school-staff role helps with a given
        scenario ("I'm hungry — who do I go to?") in 6 of 10
        trials.

    Differentiation:
    - Pre-K: 4-role scope (teacher, principal, nurse, bus driver);
      receptive-only role-name vocabulary.
    - K: 8-role scope (extends to librarian, cafeteria worker,
      janitor, counselor); receptive + productive vocabulary.
    - Grade 1+: extend to community-roles outside school +
      bridge to Career-Awareness work + community-helpers integration.

