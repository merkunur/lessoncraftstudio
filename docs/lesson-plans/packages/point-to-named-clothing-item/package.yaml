compositionalRationale:
  en: |
    Primary strand: early-literacy / vocabulary-acquisition (receptive
    clothing vocab). Secondary strand: speaking-and-listening
    (receptive comprehension). Tertiary strand: classroom-routine
    (clothing vocabulary applies daily — kids name what they're
    wearing).

    **Architectural significance: SATURATION CLOSER for vocabulary-
    acquisition strand (23/24 → 24/24).** First strand to reach
    saturation post-Arc-12 substrate-completion. Receptive-language
    counterpart to identify-and-name-clothing (already authored).
    Receptive-then-productive language-development pattern continues.

    Distinctive composition: 3 matching exercises (clothing theme
    repeated; reinforces vocabulary fluency) + 1 word-guess + 1 odd-
    one-out. Heavy clothing-theme use because vocabulary-acquisition
    is theme-specific.

    Class B FLEXIBLE substrate: composes against clothing theme.
    Substrate-readiness universal.

    K-3 multilingual classroom relevance: clothing vocabulary high-
    frequency K-3 target across all 11 platform locales. Pt-BR
    sparse-override (Phase 3) handles Brazilian climate-relevant
    clothing (mais bermudas + camisetas + chinelos do que casacos
    pesados em maioria do Brasil).

