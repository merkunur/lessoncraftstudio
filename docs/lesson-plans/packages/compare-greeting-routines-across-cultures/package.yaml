# Teaching package — compare greeting routines across cultures
# Arc 9 Phase 2 (Option D multilingual-language-awareness depth; early-
# literacy / multilingual-language-awareness strand). Class B FLEXIBLE.
# Sibling pair with name-this-object-in-two-languages (Arc 6 Phase 1) and
# notice-cognate-word-pairs (Arc 8 Phase 2) — completes the strand's depth.
# Cultural-comparison framing: kids notice that greetings vary across
# cultures, validating that home-language + home-culture are CLASSROOM
# RESOURCES.

targetSlug: compare-greeting-routines-across-cultures
language: en
title:
  en: "Hello Around the World — compare greetings across cultures"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching cross-cultural greeting awareness. Multilingual-language-awareness strand depth: kids learn how people greet each other in different cultures (handshake, bow, cheek-kiss, hug, wave). Validates home-language + home-culture as classroom resources. Differentiating multilingual K-3 surface — addresses cultural diversity in international/dual-language/bilingual classrooms head-on rather than defaulting to single-culture greeting norms. Composes against matching + sentence-strips for greeting-vocabulary practice. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class greeting share-out. Teacher asks: "How do you greet
      a friend? How do you greet a teacher? How do you greet someone
      from your family?" Kids share. Teacher then introduces: "Did you
      know that in some places, people GREET differently?" Demonstrates
      a wave (US/UK common), a handshake (formal), a slight bow
      (Japanese / Korean cultural reference), a cheek-kiss (French /
      Italian / Spanish cultural reference), a salaam-style hand-to-
      heart (Middle Eastern / South Asian cultural reference). Reinforces
      that greetings carry cultural meaning + that variation is
      NATURAL, not WRONG.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + greeting-comparison routine. Each pair receives 6-8
      cards depicting different greeting gestures + greeting words
      ("Hello," "Bonjour," "Hola," "Konnichiwa," "Hej," "Olá"). Pair
      discusses: "Which greeting do you know? Which is from your
      family / culture / language?" Recast emphasizing cultural
      affirmation ("Beautiful — your family says 'Olá' when greeting.
      That's how Brazilian kids greet too. Other Portuguese-speaking
      kids might say something different at home"). Optional extension:
      kids practice greeting their classmates using each gesture +
      greeting-word combination.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (greeting-gesture
      images to greeting-word labels in target language). Station 2:
      matching worksheet (greeting-words across multiple languages).
      Station 3: manipulative cut-outs hands-on greeting-routine
      construction (kids assemble greeting cards combining gesture +
      word + flag). Station 4: sentence-strips (kids construct full
      greeting sentences: "I say 'Bonjour' to my friend.").
  closure:
    durationMinutes: 5
    body: |
      Whole-class cultural-greeting share. Each kid greets the class
      using a chosen gesture + greeting-word from their family or a
      culture they're learning about. Class observes the diversity.
      Forward-pointer: "Today we noticed how people greet each other
      differently across cultures. When we come back to language-and-
      culture next, we'll learn how people SAY GOODBYE — and other
      everyday rituals — across cultures."

