compositionalRationale:
  en: |
    Primary strand: math / addition-subtraction (add two
    2-digit numbers — deepens strand 11/14 → 12/14).
    Secondary strand: math / place-value (2-digit
    addition makes place-value column structure
    explicit). Tertiary strand: numeracy (regrouping +
    column-add + multiple-strategy work).

    Architectural significance: extends Arc 16 P1.1 add-
    within-100 (the broader within-100 computational
    fluency target) by specifically structuring 2-digit
    + 2-digit cases with explicit place-value column
    scaffolding. Per learning-targets.json, add-2-digit-
    numbers is a distinct canonical target from add-
    within-100 — they share CCSS.2.NBT.B.5 anchor but
    differ in pedagogical emphasis:
    - add-within-100 (Arc 16 P1.1): BROAD computational
      fluency across single-digit + 2-digit cases
      (45+19, 67+5, 89+11, etc.) — emphasizes mixed-
      case strategy flexibility.
    - add-2-digit-numbers (THIS PACKAGE): NARROWED to
      2-digit + 2-digit cases (45+23, 27+38, 56+44)
      — emphasizes structural place-value column work
      + regrouping mechanics.
    Together the two packages cover Grade 2 addition-
    within-100 from both strategic (mixed cases) and
    structural (canonical 2-digit pairs) angles.

    Addition-subtraction strand future: 2 unpackaged
    targets remain (subtract-2-digit-numbers + add-3-
    numbers-within-20). Phase 1.4+ candidates would
    close the strand at 14/14 SAT.

    Per §A.13.30 K-3 informal framing: Grade 2 2-digit
    addition is PLACE-VALUE-GROUNDED computational
    fluency. Kids understand the column-add procedure
    as a PHYSICAL OPERATION on tens + ones (the place-
    value-mat + base-ten manipulatives surface this
    physically); the procedure FOLLOWS from place-value
    structure (tens add to tens; ones to ones; when
    ones overflow 10 they become 1 ten = regrouping).
    Formal column-add algorithm mastery (efficiency-
    focused; pencil-and-paper fluency without
    manipulatives) is Grade 3+ work. The Grade 2 goal
    is CONCEPTUAL understanding + procedural skill +
    multiple strategies — not algorithmic automaticity.

    Cross-reference to Arc 16 P1.1 add-within-100
    (precedent + pair package): that package
    established the broader within-100 fluency. This
    package shares 5 of 7 materials with add-within-100
    (flashcards + picture-cards + place-value-mat +
    vocabulary-tracing-strips + parent-take-home-letter
    + answer-key — 6 of 7 actually; differs only on
    manipulative-cut-outs configuration). The
    materials-overlap is intentional — both packages
    share the same place-value pedagogy substrate.

    **CRITICAL DIVERGENCE RATIFICATION per §A.13.6
    spec-vs-shipped-contract validation + §A.13.34
    transparency:**

    THIS PACKAGE DIVERGES FROM ARC 16 P1.1 ADD-WITHIN-
    100 ON ONE DIMENSION. Materials position 3 (place-
    value-mat) mirrors add-within-100 precedent verbatim
    — preserves materials-list-shape coherence + carries
    forward the §A.13.32 sub-doctrine (d) generator-
    executability gap (place-value-mat generator
    DEFERRED per Pillar 5 (C) carry-forward; the same
    gap affects add-within-100 + this package
    identically).

    HOWEVER, materials position 5 (manipulative-cut-
    outs) DIVERGES from Arc 16 P1.1 on the `mode:`
    dimension. Arc 16 P1.1 add-within-100 emits
    `mode: base-ten-blocks` (a non-canonical mode value
    that does NOT exist in the corrected CutOutMode
    type per `frontend/scripts/lib/manipulative-cut-
    outs-package-loader.ts:30` — the canonical set is
    `'single-repeat' | 'variety'` only, per the
    §A.13.35 self-firing correction shipped at commit
    694f9823). The Arc 16 P1.1 `mode: base-ten-blocks`
    is pre-correction data debt of the same class as
    Arc 17 P1.4 tell-time pair's `mode: clock-pieces`
    non-canonical mode.

    Per operator-locked Phase 1.2 Slot 2 precedent
    (Arc 18 Phase 0 §A.13.6 firings batch resolution):
    canonical-correct on mode dimension. This package
    ships `mode: variety` with vocabKey enumeration of
    base-ten vocabKeys (ten-stick + ones-counter) at
    itemCount 10. The Arc 16 P1.1 add-within-100
    package stays at `mode: base-ten-blocks` data debt
    for a separate retro-fix arc (Pillar 5 (C) DEFER
    carry-forward: this brings the retro-fix queue to
    3 packages — tell-time-to-the-hour + tell-time-to-
    half-hour + add-within-100 — all requiring mode
    correction alongside generator authoring).

    The internal-shape divergence is INTENTIONAL +
    OPERATOR-LOCKED via Phase 1.2 Slot 2 precedent
    extension. Future audits resolving apparent
    inconsistency should read this compositionalRationale
    + the Arc 16 P1.1 add-within-100 retro-fix queue
    entry + the Arc 18 Phase 1.2 Slot 2 firings batch.
    Do NOT silently align this package to add-within-
    100's `mode: base-ten-blocks` — that would re-
    introduce the §A.13.35 self-firing defect at the
    catalog layer.

    Distinctive composition: 1 addition (vertical-
    addition format) + 2 math-worksheet (vertical 2-
    digit addition practice) + 1 math-puzzle (missing-
    addend) + 1 more-less (compare two 2-digit
    addition results). Composition shape mirrors Arc 16
    P1.1 add-within-100 precedent exactly; content is
    narrowed to 2-digit + 2-digit cases.

    Materials note: 7-material Numeracy class stack per
    §A.13.37. Place-value-mat at position 3 is the
    LOAD-BEARING material — the physical column-
    structure substrate that grounds 2-digit addition.
    Vocabulary-tracing-strips at position 4 traces
    place-value vocabulary ('tens', 'ones', 'regroup',
    'carry'). Manipulative-cut-outs at position 5
    emits canonical-correct `mode: variety` with
    vocabKey enumeration of 2 base-ten vocabKeys
    (ten-stick + ones-counter; itemCount 10 = 10 of
    each = enough for working through 2-digit problems
    physically).

    **SUBSTRATE CARRY-FORWARD TO P2 per §A.13.32 sub-
    doctrine (d):**
    1. place-value-mat generator DEFERRED (continuing
       carry-forward from Arc 16 + earlier; affects
       add-within-100 + this package).
    2. base-ten vocabKey image substrate (ten-stick +
       ones-counter images in image library +
       corresponding entries in image-vocabulary.js)
       does NOT yet exist at Phase 1.3 ship. Substrate
       creation is deferred to Pillar 5 P2 close-out
       cycle per §A.13.38 decoupled-ship discipline.

    Class B FLEXIBLE substrate: composes against
    animals theme (countable for addition work; cross-
    arc with Arc 12-16 addition themes for
    consistency). The animals theme is decorative for
    Grade 2 2-digit work — the COMPUTATIONAL skill is
    abstract numerical; the theme provides visual
    interest + vocabulary anchor for the flashcards +
    picture-cards.

    K-3 multilingual classroom relevance: 2-digit
    addition is universal Grade 2 content. The
    PROCEDURE (line up tens + ones + add columns +
    regroup) is locale-portable; the NUMBER-WORD
    NAMING for 2-digit numbers varies significantly:
    en regular "twenty-one through ninety-nine"; de
    reverse-decade "einundzwanzig" (one-and-twenty —
    German says the ONES BEFORE the tens, which can
    confuse non-native speakers); es "veintiuno...
    noventa-y-nueve" (regular but with elision
    patterns); fr "soixante-dix...quatre-vingt-dix-
    neuf" (French has the most striking irregularity
    with vigesimal forms 71-99); fi agglutinative
    compounds (kuusikymmentäkahdeksan = 68 in single
    word). The COLUMN-ALIGNMENT visual is locale-
    portable; the SPOKEN number-word naming requires
    locale-specific adaptation. Cross-locale regrouping
    vocabulary varies: en "carry/regroup"; de
    "umgruppieren/Übertrag"; es "agrupar/llevar"; pt
    "reagrupar/transportar"; fr "retenue"; it
    "riporto". Locale-variant work at Phase 3+ adapts
    to each locale's number-word + regrouping-
    vocabulary register.

