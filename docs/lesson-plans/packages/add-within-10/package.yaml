assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Solve addition problems with sums to 10 in 8 of 10 trials.
      - Use count-on strategy (start with larger; count up by smaller)
        in 7 of 10 trials.
      - Articulate addition sentences ('3 plus 2 equals 5') in 7 of 10
        productive-language trials.

    Differentiation:
    - Pre-K: sums to 5 only (Arc 1 add-within-5 prerequisite); concrete
      manipulatives required.
    - K: sums to 10; manipulative + symbolic notation.
    - Grade 1+: extend to add-within-20 (Arc 12+ candidate); bridge to
      mental-math addition.

