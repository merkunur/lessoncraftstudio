# Teaching package — point to a named body part (receptive)
# Arc 5 Phase 3 (early-literacy / vocabulary-acquisition strand). Receptive
# variant of identify-and-name-body-parts (Arc 2 productive package). 10-key
# cluster CLEAN against IMAGE_VOCABULARY (head/eye/ear/nose/mouth/hand/foot/
# arm/leg/finger). Validates productive↔receptive pairing pattern across
# the vocabulary-acquisition strand.

targetSlug: point-to-named-body-part
language: en
title:
  en: "Body Parts (Receptive) — point to the named body part"
description:
  en: "Pre-K to K vocabulary-acquisition package teaching receptive recognition of 10 common body parts: head, eye, ear, nose, mouth, hand, foot, arm, leg, finger. Receptive variant of identify-and-name-body-parts (Arc 2 productive). Receptive comprehension precedes productive use in K-3 multilingual classrooms — kids understand vocabulary months before they can produce it. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class action routine. Teacher names a body part in target
      language; kids touch the body part on themselves. "Touch your head.
      Touch your eyes. Touch your nose." Class follows along physically.
      Reinforces target-language → physical-action mapping (receptive
      comprehension is the primary skill — kids don't have to SAY the
      word; they show they UNDERSTAND it through action). Faster pace as
      kids gain confidence; mix in "Touch your knee. Now touch your hand"
      to build attention.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with picture cards (no sentence frames yet —
      pure pointing vocabulary). Teacher names a body part; class points
      to the matching picture-card on the chart. Pair work: kid A names
      a body part in target language; kid B points to it (own body OR
      a doll/figure in the classroom). Recast errors gently — kids who
      point wrong are still in receptive-acquisition phase; the pointing
      itself is the assessment surface.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (image-name matching
      reinforces body-part-image to body-part-word; receptive surface).
      Station 2: shadow-match worksheet (body-part to its outline).
      Station 3: simon-says-style game with manipulative cut-outs of body
      parts (kids place cut-outs onto body diagrams when teacher names
      each part — pure receptive-action surface).
  closure:
    durationMinutes: 5
    body: |
      Whole-class quick-recall. Teacher names body parts rapidly; kids
      point to themselves. Forward-pointer: "Today we practiced
      understanding body-part words. When we come back to body parts
      next, we'll start saying the words ourselves — moving from
      'pointing' to 'naming'."

