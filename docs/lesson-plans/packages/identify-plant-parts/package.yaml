# Teaching package — identify plant parts (root, stem, leaf, flower)
# Arc 13 Phase 1 (world-knowledge / living-things 4/6 → 5/6).
# Resolves Arc 10 describe-plant-life-cycle forward-pointer.

targetSlug: identify-plant-parts
language: en
title:
  en: "Plant Parts — root, stem, leaf, flower"
description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching plant-part anatomy. Builds on Arc 10 describe-plant-life-cycle + Arc 11 identify-living-vs-nonliving. RESOLVES Arc 10 forward-pointer ('learn the parts of a PLANT — root, stem, leaf, flower — and how each part helps the plant LIVE'). Foundational botany: kids identify 4 plant parts + understand each part's function (roots = water + anchor; stem = transport + support; leaf = food production via sunlight; flower = reproduction). 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class plant-display routine. Teacher shows large picture
      of a flowering plant with parts labeled (or brings a real
      plant). Class names each part: ROOT (underground); STEM (the
      tall middle part); LEAF (flat green parts); FLOWER (colorful
      top). Reinforces 4-part anatomy + that each part has a job.
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + label-the-plant routine. Each pair receives a
      blank plant outline + 4 labels (root, stem, leaf, flower).
      Pair labels each plant part. Teacher narrates each part's
      function. Recast errors with explanation ('you labeled the
      green part LEAF — yes! That's the leaf. The leaf catches
      sunlight to make food for the plant. What does the ROOT do?').
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (plant-part
      to image). Station 2: matching worksheet (plant-part to
      function: root/water-and-anchor; leaf/sunlight-food; etc.).
      Station 3: manipulative cut-outs hands-on plant assembly.
      Station 4: word-guess (kids fill plant-part letters from clues).
  closure:
    durationMinutes: 5
    body: |
      Whole-class plant-quiz. Teacher names a plant part; class names
      its function. Forward-pointer: "Today we learned plant parts.
      When we come back to plants next, we'll explore the BUTTERFLY
      LIFE CYCLE — animals also have life cycles, like plants do."

