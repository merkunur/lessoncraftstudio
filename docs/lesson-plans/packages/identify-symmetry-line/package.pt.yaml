# Teaching package — notar linhas de simetria (informal) (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT per Arc 7 Phase 3 + Arc 3 Phase 1 sparse-override pattern.
# Arc 17 Phase 1.4 pt-cadence continuation (17th consecutive arc).
# pt sparse-override for math / geometry strand. Conteúdo matemático
# universal — tradução direta sem reestruturação pedagógica. BR-MEC ensino
# fundamental anos iniciais register per CLAUDE.md §6 + formal "você" address per §17.9.

title:
  pt: "Notar Linhas de Simetria — dobre e veja se as duas metades coincidem"

description:
  pt: "Pacote de matemática/geometria para Educação Infantil até 2º ano que ensina as crianças a notar quando uma forma tem uma linha de simetria — uma linha que permite dobrar a forma para que as duas metades COINCIDAM. Um círculo tem muitas dessas linhas; um quadrado tem 4; um retângulo tem 2; um triângulo equilátero tem 3; a letra A tem 1 (vertical); a letra B tem 1 (horizontal); a letra F não tem nenhuma. Constrói sobre a base Arc 5 identify-2d-shapes-basic; estende o fio de geometria do reconhecimento-de-formas + composição (Phase 1.3 compose-shapes-from-parts) para notar-relações-espaciais. O enquadramento K-3 é NOTAR / OBSERVAR simetria — as crianças dobram formas de papel e veem se as metades se sobrepõem, ou olham fotos e identificam a linha-de-dobra que faria as metades coincidirem. A IDENTIFICAÇÃO FORMAL de eixo-de-simetria (contar linhas exatas em formas irregulares, identificar simetria rotacional, distinguir reflexiva de rotacional) é o padrão do 5º ano (BNCC EF05MA17) e fica fora do escopo K-3. Encaixe parcial EYFS.ELG.UW no nível K-2 para a habilidade de notar. Fio de geometria 5/8 → 6/8 com Phase 1.3 compose-shapes-from-parts já enviado; este pacote leva o fio para 6/8 → 7/8 (1 alvo canônico restante: partition-shape-halves-quarters). 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana. Manipulative-cut-outs em modo single-repeat é load-bearing — as crianças dobram fisicamente formas de papel para descobrir simetria."

structure:
  warmup:
    body: |
      Iniciador com toda a turma + introdução de dobra-de-
      simetria. A professora ou o professor segura um
      coração de papel. "Vejam o que acontece quando dobro
      este coração pelo meio." Dobra o coração ao longo de
      seu centro vertical. "As duas metades COINCIDEM! Elas
      se sobrepõem exatamente. Dizemos que este coração
      tem uma LINHA DE SIMETRIA — uma linha de dobra que
      faz as duas metades coincidirem." Desdobra o coração
      + traça a linha de dobra com um dedo. Depois uma
      forma não-simétrica: segura uma folha de papel com
      um lóbulo grande + um lóbulo pequeno (folha
      assimétrica). "Vejam esta folha — posso dobrá-la para
      que as metades coincidam?" Tenta várias direções de
      dobra; nenhuma produz metades coincidentes. "Esta
      folha NÃO TEM linha de simetria. Os dois lados não
      coincidem não importa onde eu dobre." Repete com
      formas familiares: um quadrado (4 linhas de dobra —
      vertical, horizontal, e as duas diagonais); um
      retângulo (2 linhas de dobra — vertical + horizontal,
      mas NÃO as diagonais porque as metades são formas
      diferentes); um círculo (muitas linhas de dobra —
      você pode dobrar de qualquer maneira pelo centro);
      um triângulo (depende — equilátero tem 3, isósceles
      tem 1, escaleno tem 0). Ênfase do padrão: "Uma LINHA
      DE SIMETRIA é uma linha de dobra que faz as duas
      metades COINCIDIREM. Algumas formas têm muitas;
      algumas têm uma; algumas NÃO TÊM NENHUMA."
  contentActivity:
    body: |
      Trabalho em duplas + rotina de dobra-de-papel. Cada
      dupla recebe uma pilha de formas de papel recortadas
      (8-10 formas por dupla: círculo, quadrado, retângulo,
      triângulo equilátero, triângulo isósceles, triângulo
      escaleno, coração, estrela, letra A, letra F,
      contorno de borboleta, contorno de folha). Dupla joga
      o jogo de descoberta-de-simetria: criança A pega uma
      forma; ambas as crianças tentam fisicamente dobrá-la
      de diferentes maneiras para encontrar linhas de
      simetria. Desenham cada linha de dobra na forma com
      um lápis. Após explorar todas as formas, registram:
      quantas linhas de simetria cada forma tem? (círculo:
      muitas — as crianças podem dizer 'muitíssimas' ou
      'um monte'; quadrado: 4; retângulo: 2; triângulo
      equilátero: 3; triângulo escaleno: 0; coração: 1;
      letra A: 1; letra F: 0; borboleta: 1.) Refraseie
      erros dobrando junto: "você disse que o retângulo
      tem 4 linhas como o quadrado — vamos tentar dobrar
      diagonalmente. Vejam como as duas metades são formas
      diferentes? Essa diagonal não é uma linha de simetria
      para o retângulo." Vocabulário pt-BR canônico para
      simetria: linha de simetria / eixo de simetria;
      dobrar; coincidir / sobrepor; metade; espelho /
      reflexo. Use "linha de simetria" e "eixo de simetria"
      como variantes K-3 válidas; "eixo" é a forma BNCC
      formal, "linha de simetria" é a forma K-3 mais
      coloquial.
  scaffold:
    body: |
      Rotação de estações. Estação 1: atividade matching —
      combine cada forma à sua contagem de linhas-de-
      simetria (círculo → muitas; quadrado → 4; retângulo
      → 2; triângulo equilátero → 3; coração → 1; letra F
      → 0). Estação 2: picture-sort — classifique as formas
      em categorias 'tem simetria' / 'não tem simetria'.
      Estação 3: missing-pieces — dada a metade esquerda
      de uma forma simétrica, complete a metade direita
      (as crianças raciocinam sobre como seria a metade
      correspondente). Estação 4: variante matching —
      emparelhe cada forma simétrica com seu parceiro
      imagem-espelho.
  closure:
    body: |
      Recuperação rápida de notar-simetria com toda a
      turma. A professora ou o professor mostra formas;
      a turma responde coletivamente. "Coração? — SIM,
      uma linha de simetria!" "Letra F? — NÃO, sem
      simetria!" "Círculo? — SIM, muitíssimas linhas!"
      "Triângulo escaleno? — NÃO!" "Triângulo equilátero?
      — SIM, três!" "Letra A? — SIM, uma (pelo meio)!"
      Indicador adiante: "Hoje notamos simetria — quando
      as formas se dobram para que as metades coincidam.
      A simetria aparece em todo lugar — em flores,
      borboletas, nossos próprios corpos (um olho de cada
      lado; um braço de cada lado), em muitas letras do
      alfabeto, em muitas placas de trânsito. Quando você
      crescer aprenderá simetria mais PRECISA — ângulos
      exatos e simetria de rotação — mas o NOTAR que você
      aprendeu hoje é a fundação. Na próxima vez em
      geometria conheceremos PARTICIONAR FORMAS EM PARTES
      IGUAIS (metades e quartos)."

assessmentCriteria:
  pt: |
    Ao final da unidade de 1 semana:
      - Notar se uma forma dada tem simetria (julgamento
        binário sim/não) em 8 de 10 tentativas.
      - Identificar a contagem de linhas de simetria para
        as formas simples mais familiares — coração (1),
        quadrado (4), retângulo (2), triângulo equilátero
        (3), círculo ('muitas' ou 'muitíssimas') — em 6 de
        10 tentativas.
      - Dobrar fisicamente formas de papel para descobrir
        linhas de simetria em 7 de 10 tentativas.
      - Completar a metade simétrica de uma forma (dada a
        metade esquerda, esboçar a metade direita para que
        as metades coincidam) em 5 de 10 tentativas.

    Diferenciação:
      - Pré-K (3-5 anos): pular a quantificação de
        contagem-de-simetria; apenas explorar dobrar
        formas de papel informalmente — a habilidade de
        notar é suficiente na Pré-K.
      - Educação infantil (5-7 anos): introduzir a
        distinção binária simetria vs sem-simetria;
        quantificação de contagem completa diferida para
        o 1º ano.
      - 1º ano: quantificação de contagem para formas
        simples familiares (coração, quadrado, retângulo,
        triângulo equilátero, letra A); ponte para notar
        em imagens do mundo real (borboletas, flores,
        rostos).
      - 2º ano em diante: estender para formas mais
        complexas (pentágonos, hexágonos); introduzir
        'simetria reflexiva' como um nome para o que as
        crianças têm feito; ponte para o trabalho formal
        de eixo-de-simetria do 5º ano BNCC EF05MA17.

compositionalRationale:
  pt: |
    Fio principal: matemática / geometria (notar linhas
    de simetria em formas simples — estende fio 5/8 →
    6/8 após Phase 1.3 compose-shapes-from-parts; leva o
    fio para 6/8 → 7/8). Fio secundário: raciocínio-
    espacial (as crianças raciocinam mental + fisicamente
    sobre se as metades coincidem sob uma dobra). Fio
    terciário: discriminação visual (notar correspondência
    exata vs correspondência aproximada entre duas
    metades).

    Significância arquitetural: estende o fio de geometria
    do trabalho de reconhecimento-de-formas + composição
    para notar-relações-espaciais. Per disciplina §A.13.30
    audience-perspective + spec da comissão: o
    enquadramento K-3 é NOTAR / OBSERVAR simetria, NÃO
    identificação formal de eixo-de-simetria. O padrão
    formal do 5º ano BNCC EF05MA17 (identificar simetria
    de reflexão em figuras e em pares de figuras
    geométricas planas e utilizá-la na construção de
    figuras congruentes) fica fora do escopo K-3; este
    pacote ensina a habilidade informal de notar-K-3-
    apropriada via atividades de dobrar + emparelhar.
    Encaixe parcial EYFS.ELG.UW no nível K-2 (o EYFS
    Understanding the World ELG inclui consciência
    espacial + observação de características).

    Notar-K-3 vs identificação-formal-5º-ano:
    - K-3 (este pacote): dobra física de formas de papel
      para ver se as metades coincidem; identificar
      linhas-de-dobra informalmente; contar linhas-de-
      dobra para formas simples familiares (coração,
      quadrado, retângulo); reconhecer 'simetria vs sem
      simetria' como distinção binária.
    - 5º ano (BNCC EF05MA17, fora do escopo K-3):
      identificar linhas de simetria em figuras mais
      complexas; distinguir simetria reflexiva de
      rotacional; desenhar linhas-de-simetria exatas
      usando réguas + transferidores.

    Contexto pair-coherent: Phase 1.3 compose-shapes-from-
    parts abriu o trabalho de composição-espacial; este
    pacote abre o notar-relação-espacial — juntos
    constroem a fundação de raciocínio-espacial K-3 que
    fundamenta o trabalho posterior de partição +
    fração-de-forma (partition-shape-halves-quarters é
    o 8º canônico de geometria; diferido para Phase
    1.5+).

    Especificidade pt-BR: notar-simetria é conceito
    universal + traduzível 1:1 do en. A atividade de
    dobrar-e-emparelhar é locale-portátil — o julgamento
    visual é o mesmo em todos os locais. Vocabulário
    pt-BR canônico:
    - **"linha de simetria"** / **"eixo de simetria"** —
      variantes K-3 válidas; "eixo de simetria" é a forma
      BNCC formal; "linha de simetria" é a forma K-3
      mais coloquial.
    - **"simetria"** — termo BNCC canônico; cognato com
      en/de/es/fr/it/pt forma 'simetria'.
    - **"dobrar"** — verbo K-3 natural para a ação de
      dobrar papel.
    - **"coincidir"** / **"sobrepor"** — verbos K-3 para
      a relação que define simetria; "coincidir" é mais
      formal, "sobrepor" é mais coloquial.
    - **"metade"** — termo K-3 cognato com en 'half';
      essencial para descrever a relação entre as duas
      partes simétricas.
    - **"espelho"** / **"reflexo"** — vocabulário K-3
      para a relação imagem-espelho que define simetria
      reflexiva; "espelho" é a forma mais coloquial.

    Currículo BNCC EF03MA15 (3º ano) + EF05MA17 (5º
    ano): classificar e comparar figuras planas; conceito
    informal de simetria; identificar simetria de reflexão
    como organização visual. O nível K-3 (este pacote)
    fica no notar informal; a identificação formal de
    eixos pertence ao 5º ano em diante.

    Substrato Class B FLEXIBLE: composta contra tema
    shapes (tema canônico do fio de geometria per Phase
    1.3 compose-shapes-from-parts + Arc 9 identify-2d-
    shapes-basic + Arc 14 describe-shape-attributes
    precedentes).
