<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Find Objects - Two Ways to Discover Features Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1000px;
            height: 1000px;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }
        .container {
            width: 1000px;
            height: 1000px;
            background: linear-gradient(135deg, #F5F3FF 0%, #ECFDF5 50%, #F0FDF4 100%);
            position: relative;
            overflow: hidden;
        }

        /* Decorative garden elements */
        .vine {
            position: absolute;
            width: 400px;
            height: 600px;
        }

        .vine-left {
            left: -50px;
            top: 100px;
            opacity: 0.15;
        }

        .vine-right {
            right: -50px;
            top: 200px;
            opacity: 0.15;
            transform: scaleX(-1);
        }

        .leaf {
            position: absolute;
            font-size: 50px;
            opacity: 0.3;
        }
        .leaf-1 { top: 80px; left: 60px; transform: rotate(-30deg); }
        .leaf-2 { top: 150px; right: 80px; transform: rotate(20deg); }
        .leaf-3 { bottom: 200px; left: 40px; transform: rotate(-15deg); }
        .leaf-4 { bottom: 280px; right: 50px; transform: rotate(35deg); }

        /* Main title */
        .title-section {
            position: absolute;
            top: 45px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 10;
        }

        .main-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            line-height: 1.0;
        }

        .two-ways {
            font-size: 58px;
            color: #EC4899;
            text-shadow:
                3px 3px 0 rgba(236,72,153,0.2);
            letter-spacing: -1px;
        }

        .to-discover {
            font-size: 58px;
            color: #14B8A6;
            text-shadow:
                3px 3px 0 rgba(20,184,166,0.2);
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 26px;
            color: #6B7280;
            font-weight: 700;
            margin-top: 8px;
        }

        /* Two mode circles */
        .modes-section {
            position: absolute;
            top: 260px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 60px;
            z-index: 10;
        }

        .mode-circle {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .mode-ispy {
            background: linear-gradient(135deg, #14B8A6 0%, #0D9488 100%);
            box-shadow:
                0 15px 40px rgba(20,184,166,0.4),
                inset 0 -5px 20px rgba(0,0,0,0.1);
        }

        .mode-oddone {
            background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%);
            box-shadow:
                0 15px 40px rgba(236,72,153,0.4),
                inset 0 -5px 20px rgba(0,0,0,0.1);
        }

        .mode-label {
            font-family: 'Fredoka', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            z-index: 2;
        }

        .mode-icon {
            font-size: 60px;
            margin-bottom: 15px;
            z-index: 2;
        }

        .mode-image {
            width: 180px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            z-index: 2;
        }

        /* Decorative flower petals around circles */
        .petal {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.3);
            border-radius: 50% 0 50% 0;
        }

        .mode-ispy .petal:nth-child(1) { top: -20px; left: 50%; transform: translateX(-50%) rotate(45deg); }
        .mode-ispy .petal:nth-child(2) { bottom: -20px; left: 50%; transform: translateX(-50%) rotate(225deg); }
        .mode-ispy .petal:nth-child(3) { left: -20px; top: 50%; transform: translateY(-50%) rotate(-45deg); }
        .mode-ispy .petal:nth-child(4) { right: -20px; top: 50%; transform: translateY(-50%) rotate(135deg); }

        .mode-oddone .petal:nth-child(1) { top: -20px; left: 50%; transform: translateX(-50%) rotate(45deg); }
        .mode-oddone .petal:nth-child(2) { bottom: -20px; left: 50%; transform: translateX(-50%) rotate(225deg); }
        .mode-oddone .petal:nth-child(3) { left: -20px; top: 50%; transform: translateY(-50%) rotate(-45deg); }
        .mode-oddone .petal:nth-child(4) { right: -20px; top: 50%; transform: translateY(-50%) rotate(135deg); }

        /* Connecting vine between circles */
        .connecting-vine {
            position: absolute;
            top: 400px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 60px;
            z-index: 5;
        }

        .vine-segment {
            position: absolute;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #22C55E 0%, #16A34A 100%);
            border-radius: 4px;
            top: 50%;
            transform: translateY(-50%);
        }

        .plus-sign {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: #22C55E;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 6;
        }

        /* Decorative bugs */
        .butterfly {
            position: absolute;
            font-size: 45px;
            z-index: 15;
        }
        .butterfly-1 { top: 200px; left: 100px; transform: rotate(-20deg); }
        .butterfly-2 { top: 250px; right: 90px; transform: rotate(15deg); }

        .ladybug {
            position: absolute;
            font-size: 35px;
            z-index: 15;
        }
        .ladybug-1 { bottom: 200px; left: 150px; }
        .ladybug-2 { bottom: 230px; right: 140px; }

        /* Grade badge */
        .grade-badge {
            position: absolute;
            top: 30px;
            left: 30px;
            background: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #14B8A6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 20;
        }

        /* FREE badge */
        .free-badge {
            position: absolute;
            top: 25px;
            right: 30px;
            background: linear-gradient(135deg, #FACC15 0%, #EAB308 100%);
            padding: 14px 24px;
            border-radius: 30px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: #92400E;
            box-shadow: 0 4px 15px rgba(234,179,8,0.4);
            z-index: 20;
        }

        /* Bottom banner */
        .bottom-banner {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
            padding: 18px 50px;
            border-radius: 40px;
            z-index: 15;
            box-shadow: 0 8px 25px rgba(34,197,94,0.4);
        }

        .banner-text {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 26px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* Small flowers */
        .flower {
            position: absolute;
            font-size: 30px;
            opacity: 0.6;
        }
        .flower-1 { top: 600px; left: 30px; }
        .flower-2 { top: 650px; right: 40px; }
        .flower-3 { top: 700px; left: 80px; }
        .flower-4 { top: 720px; right: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Decorative leaves -->
        <div class="leaf leaf-1">🍃</div>
        <div class="leaf leaf-2">🌿</div>
        <div class="leaf leaf-3">🍃</div>
        <div class="leaf leaf-4">🌿</div>

        <!-- Butterflies -->
        <div class="butterfly butterfly-1">🦋</div>
        <div class="butterfly butterfly-2">🦋</div>

        <!-- Ladybugs -->
        <div class="ladybug ladybug-1">🐞</div>
        <div class="ladybug ladybug-2">🐞</div>

        <!-- Small flowers -->
        <div class="flower flower-1">🌸</div>
        <div class="flower flower-2">🌺</div>
        <div class="flower flower-3">🌼</div>
        <div class="flower flower-4">🌷</div>

        <!-- Grade badge -->
        <div class="grade-badge">GRADES PreK-2</div>

        <!-- FREE badge -->
        <div class="free-badge">FREE</div>

        <!-- Main title -->
        <div class="title-section">
            <div class="main-title">
                <div class="two-ways">TWO WAYS</div>
                <div class="to-discover">TO DISCOVER</div>
            </div>
            <div class="subtitle">I Spy + Odd One Out Modes</div>
        </div>

        <!-- Two mode circles -->
        <div class="modes-section">
            <div class="mode-circle mode-ispy">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="mode-icon">👁️</div>
                <div class="mode-label">I SPY</div>
                <img class="mode-image" src="https://www.lessoncraftstudio.com/samples/english/find%20objects/sample-3.jpeg" alt="I Spy Mode">
            </div>

            <div class="mode-circle mode-oddone">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="mode-icon">🔍</div>
                <div class="mode-label">ODD ONE OUT</div>
                <img class="mode-image" src="https://www.lessoncraftstudio.com/samples/english/find%20objects/sample-5.jpeg" alt="Odd One Out Mode">
            </div>
        </div>

        <!-- Plus sign connector -->
        <div class="plus-sign">+</div>

        <!-- Bottom banner -->
        <div class="bottom-banner">
            <div class="banner-text">One Generator, Two Learning Modes!</div>
        </div>
    </div>
</body>
</html>
