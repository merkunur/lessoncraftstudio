<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Number Balance — LessonCraft Studio</title>
  <link rel="stylesheet" href="/mini-tools/lcs-shell.css?v=18">
</head>
<body>
  <!-- The shell mounts the whole tool into this element. -->
  <div id="lcs-root"></div>

  <!-- Shell, then this tool. Absolute /mini-tools/ paths so embeds and
       cross-context loads resolve identically. No core import and NO data
       file: numbers work in every language for free, which is why this tool
       needs no bank at all. The beam physics follows measurement-bench.js as
       a PATTERN (it is a standalone tool, not a core) and the drag follows
       sort-bins-core.js as a PATTERN — zero lines imported from either. -->
  <script src="/mini-tools/lcs-shell.js?v=4"></script>
  <script src="/mini-tools/number-balance.js?v=1"></script>
  <script>
    // URL params the shell understands:
    //   ?lang=de  ?lang=fi  (any of: en de fr it es pt nl sv da no fi)
    //   ?embed=1        — trim chrome for iframe embedding
    //   ?embed=compact  — also drop the title, for tightly-cropped iframes
    LCS.mount(NumberBalance, { mount: '#lcs-root' });
  </script>
</body>
</html>
