compositionalRationale:
  en: |
    Primary strand: early-literacy / reading-comprehension (prediction).
    Secondary strand: speaking-and-listening (productive prediction
    explanation). Tertiary strand: inference + reasoning.

    Architectural significance: deepens reading-comprehension strand
    1/10 → 2/10. Builds on Arc 12 match-sentence-to-picture.
    Prediction is research-validated comprehension strategy
    (activating inference + engagement with text).

    K-3 multilingual classroom relevance: prediction is cognitively
    universal; verbalization is language-specific. Productive-language
    explanations ('I predict ___ because ___') reinforce reasoning
    grammar.

curriculumStandards:
  - CCSS.K.RL.7
  - CCSS.K.SL.4
  - EYFS.ELG.CL
  - IB-PYP.HowWeExpressOurselves

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Predict 6 of 8 picture-cue scenarios correctly in 7 of 10
        trials.
      - Articulate prediction reasoning in 6 of 10 trials.
      - Apply prediction strategy to NEW unfamiliar picture in 5 of
        10 trials.

    Differentiation:
    - Pre-K: 4 strong-cue scenarios; teacher-supported.
    - K: 8 prediction scenarios; productive explanations.
    - Grade 1+: extend to text-based prediction; bridge to sequence-
      3-event-story (Arc 14+ candidate).

