# Teaching package — identify and name 10 school objects
# Arc 2 Phase 3b. Vocab keys verified: pencil, book, notebook, eraser, ruler,
# scissors, glue, crayon, backpack, chair (10/10 with full 11-locale entries).

targetSlug: identify-and-name-school-objects
language: en

title:
  en: "School Objects — identify and name 10"
description:
  en: "K-Grade 1 vocabulary-acquisition package for 10 universal classroom objects: pencil, book, notebook, eraser, ruler, scissors, glue, crayon, backpack, chair. 5 worksheet exercises + 8 printable materials. High-relevance vocabulary — kids encounter these in their classroom every day. Theme-agnostic; operator selects target instruction language at material-render time."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up flashcards, names each school
      object in target language, class repeats chorally. Optional: hold up the
      ACTUAL classroom item (real pencil, real book) for tangible identification.
      Pin cards to "Classroom" word wall cluster.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("I have a {item}"). Choral
      reading first, then individual reads. Pair work: kids hold a picture-card
      OR an actual classroom item, partner names it. Recast errors in the target
      frame.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: image-letter matching. Station 2: classroom
      scavenger hunt (kids find each object in the classroom — high-engagement
      kinesthetic activity; teacher checks off as found). Station 3: manipulative
      cut-outs counting work.
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Final challenge: teacher names a school object, kids
      hold up the actual item if they have one in their backpack. Forward-pointer:
      "Today we learned 10 classroom words. When we come back to classroom words
      next, this same set will be here for us."

