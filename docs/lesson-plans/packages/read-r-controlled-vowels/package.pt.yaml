# Teaching package — read r-controlled vowels (Portuguese locale variant)
#
# SPARSE-OVERRIDE FORMAT (Arc 19 Phase 1.4 per Arc 13 Phase 3 sparse-override pattern).
# pt sparse-override for early-literacy / phonics-decoding strand.
#
# §A.13.34 LOCALE-CANONICAL-CURRICULUM-DIVERGENCE — r-controlled-vowel
# phonics is English-specific; pt-BR does NOT have r-controlled vowels.
# pt-BR R-pattern work is structurally different — pt-BR distinguishes
# R-initial (rato, /h/ in SP/RJ, /R/-vibrante regionally), R-medial
# intervocálico (caro, flap /ɾ/), RR (carro, /h/ in SP/RJ, /R/-vibrante
# regionally), and R-final (mar, weakened to /R/ ou /x/ ou /h/ regionally).
# This package reframes per pt-BR canonical: R-positioning instead of
# vowel-coloring.
#
# BR-MEC educação infantil register per CLAUDE.md §6 + formal "você"
# address per §17.9. BNCC EF01LP07 + EF02LP04 crosswalk.

title:
  pt: "Sons do R em pt-BR — leia rato, caro, carro, mar"
description:
  pt: "Pacote de letramento inicial para a educação infantil / 1º-2º ano que ensina leitura de palavras com diferentes sons do R em pt-BR. Constrói sobre o trabalho de letras-sons + read-vowel-teams pt-BR-equivalente. ESPECIFICIDADE pt-BR: o conceito en de 'r-controlled vowel' (vogal-modificada-pelo-R: car /kar/) NÃO EXISTE em pt-BR. O pt-BR distingue R por POSIÇÃO na palavra: R-inicial (rato — som forte /h/ em SP/RJ; /R/-vibrante regional); R-intervocálico (caro — flap leve /ɾ/, som-de-toque); RR-medial (carro — som forte /h/ ou /R/-vibrante); R-final (mar — som-fraco /R/ ou /x/ ou /h/ regional). As crianças brasileiras aprendem a ler palavras com cada padrão de R + sentir como o R muda dependendo da posição. Trabalho fundacional porque palavras com R aparecem em ~25% do vocabulário de leitura pt-BR de 1º ano. 5 exercícios + 7 materiais imprimíveis em uma unidade de 1 semana."

structure:
  warmup:
    body: |
      Rotina de R-em-posição com toda a turma. A professora ou o
      professor escreve 4 palavras no quadro em ordem: 'rato' /
      'caro' / 'carro' / 'mar'. Sublinhe cada R. 'Olhe — em todas
      essas palavras há R. Mas o R faz um som DIFERENTE em cada
      lugar! Vamos ouvir:
      - **rato** — R no INÍCIO da palavra → som FORTE: /Ratu/
      - **caro** — R no MEIO entre vogais → som LEVE, tipo-de-toque:
        /ka-ɾu/ (notamos como a língua bate rapidinho no céu da boca)
      - **carro** — DOIS R no meio (RR) → som FORTE de novo: /kahu/
      - **mar** — R no FINAL → som FRACO: /maR/ (quase parece sumir)'
      A turma repete cada palavra prestando atenção ao R.
      Especificidade pt-BR: estes 4 padrões de R são fundacionais à
      pronúncia pt-BR + ausentes em en (en só tem r-controlled
      vowels, NÃO posição-do-R como categoria-fonológica).
  contentActivity:
    body: |
      Trabalho em duplas + rotina de classifique-o-R. Cada dupla
      recebe 12 cartas com palavras pt-BR (3 R-inicial: rato, rua,
      rolha; 3 R-medial: caro, perde, manhoso; 3 RR: carro, ferro,
      arroz; 3 R-final: mar, calor, ar, falar). A criança A diz a
      palavra; a criança B identifica em QUAL POSIÇÃO está o R + faz
      o som correto. Refraseie os erros com som-estendido ('você fez
      o som forte para 'caro' — mas neste 'caro' o R está no MEIO,
      entre duas vogais. R-medial faz som leve. Diz: ca-ɾu — a língua
      bate rapidinho'). Especificidade pt-BR: enfatize a distinção
      caro/carro — a única diferença visual é UM R vs DOIS R, mas
      muda completamente o som + o significado (caro = expensive;
      carro = car).
  scaffold:
    body: |
      Rotação de estações. Estação 1: folha de exercícios de
      emparelhamento (palavra-com-R para imagem; classificar por
      posição-do-R). Estação 2: word-guess (as crianças preenchem
      a letra R em palavras-cloze; algumas precisam de R, outras
      de RR — c_ro = caro; c__ro = carro). Estação 3: word-scramble
      com palavras-pares (caro/carro, ferro/feroz, sumido/sumiço).
      Estação 4: vocabulary-tracing-strips com palavras
      representativas de cada posição-do-R (rato / caro / carro /
      mar). As crianças praticam traçar + dizer cada palavra
      enquanto sentem o R diferente.
  closure:
    body: |
      Quiz-de-posição-do-R com toda a turma. A professora ou o
      professor exibe 5 palavras (mixed positions); a turma
      identifica + lê cada uma com o R correto. Indicador adiante:
      "Hoje aprendemos os 4 sons do R em pt-BR. Quando voltarmos
      à leitura na próxima vez, aprenderemos sobre prefixos e
      sufixos pt-BR — des- (desconhecido), re- (rever), -inho/-inha
      (gatinho/casinha), -ção (educação) — pedacinhos de palavras
      que mudam o significado."

assessmentCriteria:
  pt: |
    Identificar a posição-do-R (inicial / medial / RR / final) em 8
    de 10 palavras pt-BR + produzir o som correto em 7 de 10
    tentativas. Distinguir caro/carro auditivamente + na escrita em
    7 de 10 tentativas. Ler 6 palavras novas com R em diferentes
    posições corretamente em 6 de 10 tentativas.

    Diferenciação:
      - Pré-K (3-5 anos): apenas distinção R-inicial-forte vs R-final-
        fraco; pareamento de imagem.
      - Educação infantil (5-7 anos): 3 posições (inicial / intervocálico
        / final); leitura independente da maioria.
      - 1º-2º ano em diante: 4 posições completas (incluindo RR-medial)
        + reconhecimento de variação regional (notar que o R do
        Sudeste soa diferente do R do Sul/Nordeste); ponte para
        leitura-de-prefixos-e-sufixos pt-BR.

compositionalRationale:
  pt: |
    Fio principal: letramento inicial / phonics-decoding (leitura de
    palavras com diferentes sons de R em pt-BR — strand-advancement).
    Fio secundário: phonological awareness (distinção dos 4 sons-de-R
    + reconhecimento de variação regional). Fio terciário: aquisição
    de vocabulário (palavras pt-BR com R em todas as posições).

    Significância arquitetural: aprofunda o fio phonics-decoding pt-BR
    com o trabalho EQUIVALENTE ao r-controlled-vowels em pt-BR — porém
    com pedagogia fundamentalmente diferente.

    **§A.13.34 LOCALE-CANONICAL-CURRICULUM-DIVERGENCE**: o conceito
    en de 'r-controlled vowels' (a vogal MUDA por causa do R) NÃO
    EXISTE em pt-BR. Em pt-BR:

    - **O R é a unidade variável**, não a vogal. A vogal mantém seu som
      canônico; o R muda dependendo da posição.
    - **4 posições canônicas de R em pt-BR**:
      1. **R-inicial**: forte (/h/ em SP/RJ; /R/-vibrante em SC/RS;
         /x/ em alguns registros formais). Exemplos: rato, rua,
         rolha, rir.
      2. **R-intervocálico (entre vogais)**: flap leve /ɾ/ — som-de-
         toque-curto-no-céu-da-boca. Exemplos: caro, paro, ferida,
         caroço.
      3. **RR-medial**: forte (/h/ em SP/RJ; /R/-vibrante em SC/RS;
         idêntico ao R-inicial). Exemplos: carro, ferro, arroz,
         garrafa.
      4. **R-final**: fraco — som-quase-mudo regional (/R/ em SC/RS;
         /x/ em alguns registros formais; quase silencioso em
         Sudeste informal). Exemplos: mar, calor, falar, ar.

    - **Variação regional significativa**: A pronúncia exata do R-
      forte varia regionalmente. Crianças paulistas + cariocas dizem
      'caro' com flap /ɾ/ + 'carro' com /h/ (som-aspirado-de-h-em-
      forte). Crianças catarinenses + gaúchas dizem 'caro' com flap
      /ɾ/ + 'carro' com /R/-vibrante (rolando a língua). Ambos
      padrões são pt-BR padrão; o trabalho de letramento ensina a
      ortografia + permite que a pronúncia se ajuste ao registro
      regional do estudante.

    - **Reciprocidade leitura-escrita**: a distinção caro/carro
      (palavras-mínimas que diferem apenas por R vs RR) é o ponto-
      chave da reciprocidade ortografia-pronúncia. Crianças leem
      'caro' + escolhem o som-flap; leem 'carro' + escolhem o som-
      forte.

    Reciprocidade pedagógica: as crianças brasileiras aprendem estes
    padrões de R NA FALA antes do letramento; a tarefa do letramento
    é mapear o som-conhecido à representação ortográfica correta
    (UM R vs DOIS R).

    Em contextos de imersão pt-BR (escolas bilíngues, programas de
    imersão, escolas internacionais com pt-BR como L2), crianças
    falantes de en frequentemente confundem caro/carro porque o
    inglês não tem distinção parecida. O ensino explícito da regra
    'R no meio entre vogais = som leve; RR no meio entre vogais =
    som forte' é fundamental para letramento pt-BR.

    Currículo BNCC EF01LP07 (identificar relação grafema-fonema na
    posição-do-R): EF02LP04 (ler palavras com diferentes estruturas
    silábicas + diferentes posições do R).

    Substrato Class B FLEXIBLE: composta contra a amplitude da
    biblioteca de imagens. Vocabulário pt-BR rico em palavras com R
    em todas as posições: animais (rato, urso, peru, jacaré); meios
    de transporte (carro, trem, barco, moto); ambiente (rua, mar,
    floresta, montanha); ações (correr, andar, falar, voar).
