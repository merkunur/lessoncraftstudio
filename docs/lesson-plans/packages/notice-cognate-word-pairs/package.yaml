compositionalRationale:
  en: |
    Primary strand: early-literacy / multilingual-language-awareness.
    Secondary strand: vocabulary acquisition (vocab-anchored — cognate
    awareness directly accelerates target-language vocab acquisition by
    leveraging home-language knowledge). Tertiary strand: home-language
    affirmation (kids' home-language knowledge becomes a CLASSROOM
    ASSET rather than an obstacle).

    Architectural significance: deepens multilingual-language-awareness
    strand from Arc 5+6 (compare-greeting-routines + identify-language-
    of-spoken-utterance + name-this-object-in-two-languages). Cognate-
    awareness is a uniquely high-leverage multilingual-K-3 skill —
    kids who learn to notice cognates can transfer this skill across
    contexts and build vocabulary in target language ~3x faster than
    kids who don't (ESL research: Cummins, 1980+).

    Distinctive composition: 3 matching exercises across 3 cognate-rich
    theme contexts (animals, foods, school-objects) — these themes
    are vocabulary-rich AND have strong cognate-pair coverage across
    the platform's 11 locales. word-scramble at position 2 + word-guess
    at position 4 break up the matching rhythm + reinforce cognate
    spelling. The flashcards material's `backOfCard:
    translation-to-locale` parameter is the FIRST package use of this
    architecture — kids practice cognate awareness directly with the
    flashcard format.

    Cross-locale relevance: the multilingual-K-3 audience — international
    schools, dual-language programs, bilingual European schools — is
    DEFINED by the home-language-vs-target-language tension. Cognate-
    awareness work directly serves this tension. High platform-fit;
    differentiates LessonCraftStudio from English-only K-3 platforms.

    K-3 multilingual classroom relevance: HIGH. Cognate-awareness is
    a research-validated language-acquisition accelerator. The package's
    full-class noticing + pair-work + flashcard architectures all
    surface cognates as vocabulary BRIDGES between home and target
    language. Teachers report kids who develop cognate-awareness
    transfer the noticing-skill across new vocabulary domains
    spontaneously.

