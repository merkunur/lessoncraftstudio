description:
  en: "K-3 bundle centered on desserts as sensory-rich daily-life cluster extension. 6th daily-life cluster bundle (after breakfast + kitchen-tools + classroom + bakery + at-the-supermarket). 5 packages span vocabulary-acquisition (identify-and-name-foods — extended to dessert subset: cake, ice-cream, cookie, donut, cupcake, candy, lollipop, brownie, pie, pudding) + numeracy (count-objects-1-to-10 — counting cookies, cupcakes, candies, scoops of ice-cream) + comparison (compare-quantities-more-fewer — more cookies than donuts on the plate?) + cognitive-sorting (sort-by-category — frozen desserts vs baked desserts vs candy) + sensory-properties (describe-physical-properties-of-objects — sweet, sticky, cold, warm, soft, crispy desserts). Cross-strand daily-life cluster bundle parallel to bakery-bundle (both sensory-rich); distinguishes from bakery by sweet-only subset + frozen-dessert inclusion. Suitable for a 4-5 week classroom unit; supports K-3 multilingual classrooms with cultural-dessert-tradition + birthday-celebration extensions."

