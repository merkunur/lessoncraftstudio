assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Order 4 plant-life-cycle pictures correctly (seed → sprout →
        plant → flower) in 8 of 10 trials.
      - Name 4 of 6 plant-parts vocabulary items (seed, sprout, root,
        stem, leaf, flower) in 7 of 10 trials.
      - Articulate the cyclic nature of the life cycle ('the flower
        makes seeds that start the cycle again') in 5 of 10 productive-
        language attempts.

    Differentiation:
    - Pre-K: 3-stage cycle only (seed → plant → flower); receptive
      ordering only.
    - K: 4-stage cycle (seed → sprout → plant → flower); productive
      naming.
    - Grade 1+: extend to 5-6 stage cycle (seed → root-growth → sprout
      → plant → flower → seed-production); bridge to butterfly life
      cycle (describe-butterfly-life-cycle Arc 11+ candidate).

