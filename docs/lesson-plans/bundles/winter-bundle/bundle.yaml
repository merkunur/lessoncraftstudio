thematicCoherence:
  en: |
    All 5 packages cohere around the winter season theme + form a
    cross-strand bundle integrating clothing + weather + seasonal
    + cycle work in a unified seasonal context.

    **Pedagogical sequencing:**
    1. **identify-four-seasons** — Seasonal classification anchor.
       Winter as one of 4 seasons; visual-vocabulary establishment
       (snow, bare trees, warm clothes). Same shared package with
       clothing-bundle + weather-bundle.
    2. **identify-and-name-weather-words** — Weather vocabulary
       (snow, cold, windy, freezing, ice). Connects season to
       observable weather. Same shared package with weather-bundle.
    3. **identify-weather-types** — Weather classification
       extending vocabulary to broader weather-type recognition
       (sunny vs rainy vs snowy vs windy). Winter offers
       characteristic snowy/cold types. Same shared package with
       weather-bundle.
    4. **identify-and-name-clothing** — Winter clothing vocabulary
       (coat, hat, scarf, gloves, boots). Connects season + weather
       to wardrobe choice. Same shared package with clothing-bundle.
    5. **describe-day-night-cycle** — Cycle science: winter has
       long nights and short days (in temperate + polar contexts).
       Connects seasonal experience to broader cycle understanding.

    **Strand spread:** 2 vocabulary-acquisition (clothing + weather)
    + 2 cognitive-sorting (seasons + weather-types) + 1 world-
    knowledge living-things (day-night cycle). **5 distinct strands
    in single bundle** — broadest cross-strand pattern.

    **Suggested unit duration:** 5 weeks during winter-context
    classroom unit. Northern-hemisphere: December-February. Southern-
    hemisphere: June-August. Lower-latitude classrooms may need
    adapted approach (visual-only winter exposure without lived
    experience).

    **Multilingual classroom relevance:** winter vocabulary varied
    across 11 platform locales — Romance distinct (invierno /
    hiver / inverno) + Germanic cognate (Winter / winter / vinter).
    Climate context varies by region; some 11-platform-locale
    audiences experience minimal-winter (Mediterranean / equatorial)
    vs heavy-winter (Nordic / continental). Bundle adaptable.

    **Pillar 2 architectural pattern:** winter-bundle exemplifies
    seasonal cross-strand bundle composition. Theme-axis-key
    seasonal-narrow (vs clothing/weather/seasons broader) — single
    season as bundle anchor enables temporally-relevant classroom
    delivery. Companion bundles (spring-bundle + summer-bundle
    candidates for future Arcs) would parallel this pattern. Cross-
    bundle package sharing established (identify-four-seasons in 3
    bundles; identify-and-name-weather-words in 2 bundles).
