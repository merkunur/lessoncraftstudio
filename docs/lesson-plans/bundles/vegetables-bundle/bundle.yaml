thematicCoherence:
  en: |
    All 4 packages cohere around vegetables theme + form a cross-
    strand bundle parallel to fruits-bundle pattern.

    **Pedagogical sequencing:**
    1. **identify-and-name-vegetables** — Foundational vegetables
       vocabulary (carrot, potato, broccoli, tomato, etc.). Vocabulary
       anchor for the bundle.
    2. **count-instances-of-target-in-grid** — Counting practice using
       vegetables as canonical countable subjects (count carrots in a
       grid; count tomatoes among mixed produce). Numeracy application
       using established vocabulary.
    3. **describe-plant-life-cycle** — Science: vegetables are edible
       plant-life-cycle stages (root vegetables = roots; leafy greens
       = leaves; pumpkins = fruits-of-the-plant). Connects vocabulary +
       counting to biological understanding.
    4. **sort-by-color** — Cognitive sorting using vegetables' color-
       diversity (orange carrots vs green broccoli vs red tomatoes vs
       purple eggplant). Color-classification work using vegetables
       theme.

    **Strand spread:** 1 vocabulary-acquisition + 1 numeracy + 1 world-
    knowledge living-things + 1 cognitive sorting. **4 distinct
    strands in single bundle** mirroring fruits-bundle.

    **Suggested unit duration:** 4 weeks (1 package per week).

    **Multilingual classroom relevance:** vegetable vocabulary high-
    frequency K-3 target across all 11 platform locales; cognate-rich
    Romance (zanahoria/carotte/cenoura/carota); Germanic varied
    (Karotte/morot/gulrot/wortel/porkkana). Bundle supports cross-
    locale lesson-plan delivery.

    **Pillar 2 architectural pattern:** vegetables-bundle pairs with
    fruits-bundle as a "produce" pattern — both bundles share 2 of 4
    teaching packages (describe-plant-life-cycle + sort-by-color) but
    differ in their vocabulary anchor and counting context. The shared
    packages amortize across paired bundles, demonstrating the
    feasibility of bundle-package-overlap when pedagogically coherent.
