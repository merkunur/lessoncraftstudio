<!DOCTYPE html>

<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">

        <!-- Subtle geometric pattern overlay -->

        <div style="position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; z-index: 40;">

</body>
</html>
