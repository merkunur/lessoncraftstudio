compositionalRationale:
  en: |
    Primary strand: early-literacy / speaking-and-listening (responding
    to greetings in the target language; canonical strand-advancement
    4/10 → 5/10). Secondary strand: multilingual-language-awareness
    (kids notice that greetings differ across cultures + can
    recognize a greeting even when the words differ). Tertiary strand:
    vocabulary-acquisition (greeting vocabulary in target language).

    Architectural significance: speaking-and-listening strand-
    advancement (4/10 → 5/10 canonical). The first 4 authored
    speaking-and-listening packages (follow-1/2/3-step-oral-
    instruction + describe-a-picture-in-2-3-sentences) covered
    receptive-comprehension + productive-description work; this
    package covers the canonical conversational opening — the
    greeting routine that begins every relational exchange in a
    multilingual classroom.

    Heavy alignment with CLAUDE.md §1 platform positioning: the
    audience is multilingual K-3 educators in international schools,
    dual-language programs, bilingual European schools. Greeting-
    response is the FIRST oral interaction a kid needs to master
    when entering a target-language environment — the K-pre-K
    teacher hears 'hello' from a 4-year-old new arrival who's just
    learning to respond in the target language as the canonical
    sign of growing comfort.

    Pair-coherent ship pattern (per Arc 19 cadence): this package
    is the cross-strand single-strand slot in the Phase 1.4 pair-
    coherent shape (alongside the phonics-decoding pair read-vowel-
    teams + read-r-controlled-vowels + the spelling slot spell-
    words-with-blends).

    Distinctive composition: 3 matching + 1 prepositions + 1 word-
    guess. Matching focused on greeting-to-scene + greeting-to-
    response pairings; prepositions worksheet teaches the contextual
    vocabulary that scaffolds greeting use ('AT school' / 'WHEN we
    leave' / 'IN the morning'); word-guess reinforces greeting-word
    spelling.

    Class B FLEXIBLE substrate: composes against animals + foods
    image-library themes. Greeting routines are abstract concepts
    that don't have direct theme-anchor images (a 'hello' isn't a
    specific object); the package leans on scene-context images
    (kids saying hello to teachers / friends; family members saying
    goodbye at school drop-off) drawn from the animals theme's
    relationally-rich illustration set.

    K-3 multilingual classroom relevance: greeting routines differ
    across cultures + carry distinct register meanings. English-
    medium classrooms in non-English-home contexts (e.g., German
    family kid in an English-medium international school)
    encounter 'hello' as the first piece of target-language
    productive vocabulary. Locale-variant sparse-overrides per
    Phase 3 reframe per locale's canonical greeting set: pt-BR
    oi/olá/bom-dia/tchau; de hallo/guten-tag/auf-wiedersehen;
    es hola/buenos-días/adiós; etc.

