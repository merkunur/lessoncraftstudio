compositionalRationale:
  en: |
    Primary strand: early-literacy / multilingual-language-awareness
    (target-language response). Secondary strand: speaking-and-
    listening (productive language; appropriate target-language
    output). Tertiary strand: code-switching awareness (kids learn
    when to switch from home language to target language).

    Architectural significance: FIFTH multilingual-language-awareness
    strand package — completes the strand's available targets at
    full depth. Strand depth: 2 → 5 (more than 2× growth). Establishes
    multilingual-language-awareness as a fully-deep first-class strand
    operationalizing the platform's 11-locale identity at curriculum
    level (operator-strategic Option D ratification at Arc 9
    commencement: "doubling down where strand momentum produces
    compounding value").

    Strand cohort completion: name-this-object-in-two-languages (Arc 6;
    cross-language vocabulary) + notice-cognate-word-pairs (Arc 8;
    cognate awareness) + compare-greeting-routines-across-cultures
    (Arc 9 Phase 2; cultural-greeting awareness) + identify-language-
    of-spoken-utterance (Arc 9 Phase 2; receptive language-
    discrimination) + respond-in-target-language-when-prompted (this
    package; productive code-switching). 5-package set covers
    receptive + productive + cultural + cross-language vocabulary +
    code-switching dimensions of multilingual-language-awareness.

    Productive-language pairing: identify-language-of-spoken-utterance
    is RECEPTIVE (listen-and-detect); respond-in-target-language-when-
    prompted is PRODUCTIVE (listen-and-respond). The pairing follows
    the canonical receptive-before-productive language-development
    progression.

    Distinctive composition: 3 matching exercises across 3 vocabulary-
    rich themes (emotions, foods, body-parts) — diverse vocabulary
    surfaces give kids multiple contexts to practice prompt-response
    matching. Heavy emotions-theme bias because emotional-state
    questions ("How are you?") are canonical conversational prompts
    in K-3 contexts. prepositions at position 5 reinforces positional
    response language ("Where is the cat?" → "The cat is on the
    chair").

    Class B FLEXIBLE substrate: composes against image-library breadth.
    Target-language response works with any vocabulary-rich theme.

    K-3 multilingual classroom relevance: HIGHEST. Code-switching is
    DAILY in international/dual-language/bilingual K-3 classrooms —
    kids switch between target language (instructional medium) +
    home language (peer + family context). Explicit code-switching
    awareness empowers kids to navigate the multilingual conversational
    landscape consciously rather than reactively.

