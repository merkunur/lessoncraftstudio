# Teaching package — count objects from 1 to 10
# Arc 2 Phase 3c CROSS-STRAND PROTOTYPE.
# Pedagogical learning target: count-objects-1-to-10
#   (early-numeracy → counting-and-cardinality strand — NOT vocabulary-acquisition)
#
# This is the FIRST non-vocabulary-strand teaching package. Per operator-ratified
# Arc 2 fold (Arc 2 commission spec §1 cross-strand fold framing): if this package
# surfaces no schema/tooling issues at authoring time, Arc 3 expands cross-strand
# confidently. If it surfaces issues, fix at the Arc 2 boundary while cost is
# bounded — the §A.14 scaling-checkpoint discipline at single-package granularity.
#
# ARCHITECTURAL FINDINGS SURFACED AT AUTHORING TIME (documented for Arc 2 recon
# + operator surface gate):
#
# 1. NO NUMERAL KEYS IN IMAGE_VOCABULARY. The 11-locale entries cover lexical
#    items (animals/colors/emotions/etc.) but NOT numeral words ("one", "two",
#    "three" or "1", "2", "3"). vocabKeyList mode in materials cannot apply to
#    numeral-bearing flashcards/cards. Workaround: use theme-mode for image
#    content (counting OBJECTS in a theme); the "vocabulary" being learned is
#    the numerals themselves, surfaced through quantity exposure rather than
#    through labeled cards.
#
# 2. EXERCISE PALETTE WEIGHTING SHIFTS. Vocabulary packages compose: matching
#    (imgname + letter) + find-and-count + odd-one-out + picture-sort. Numeracy
#    package composes: find-and-count + addition (image-image small-operand) +
#    chart-count + more-less. The math-app cluster (Family A arithmetic + Family
#    C grid-tap + Family D bar-chart) is central; literacy mechanics are
#    peripheral. matching-letter mode doesn't apply (no letter-recognition target).
#
# 3. MATERIAL COUNT REDUCED. Vocabulary packages typically compose 8 materials.
#    Numeracy packages naturally compose 6 (skipping vocabulary-tracing-strips
#    + redundant flashcards/picture-cards combinations). manipulative-cut-outs
#    is the PRIMARY material; flashcards become secondary (counting-task prompts).
#
# 4. SENTENCE-FRAME SET SHIFTS. i-see-a doesn't reinforce counting. The
#    numeracy-relevant frames are there-are-count-plural ("There are 3 cats")
#    + i-have-a (counting personal possessions). this-is-a doesn't apply.
#    The framePreset menu in sentence-strips is vocabulary-shaped; works for
#    numeracy but with reduced applicable subset.
#
# 5. compositionalRationale FRAMING DIFFERS. Vocabulary packages cite
#    primary/secondary/tertiary strands integrating around a vocab-acquisition
#    target. Numeracy packages cite the inverse — counting-target as primary,
#    vocabulary-anchored-content (the chosen theme) as secondary. The strand
#    grammar of the field is general-purpose.
#
# 6. ASSESSMENT CRITERIA SHIFT FROM LEXICAL TO QUANTITATIVE. Vocab assessment:
#    "name 8 of 10 animals." Numeracy assessment: "count one-to-one to 10
#    accurately in 4 of 5 trials" + "match numeral to quantity 8/10." Schema
#    accommodates both via free-form text in assessmentCriteria.
#
# Architectural verdict: schema + materials catalog + tooling all support
# numeracy packages WITHOUT changes. Workarounds (theme-mode flashcards in
# place of numeral-flashcards) are pragmatic and don't break composition.
# Future Arc 3+ MAY add a numeral-cards material if numeracy packages
# proliferate; not gating Arc 2.

targetSlug: count-objects-1-to-10
language: en

title:
  en: "Count Objects 1 to 10 — counting and cardinality"
description:
  en: "K-Grade 1 numeracy package for one-to-one correspondence + cardinal counting from 1 to 10. Cross-strand prototype validating the teaching-package architecture for non-vocabulary-acquisition targets. Uses farm-animals theme as the visual content; the learning target is the NUMERALS 1-10 + counting skill, not the animals (operator can substitute any theme without changing the pedagogical target). 5 worksheet exercises + 6 printable materials over a 1-2 week unit."

durationMinutes: 25

structure:
  warmup:
    durationMinutes: 4
    body: |
      Whole-class introduction. Teacher holds up flashcards showing groups of
      animals (1 cow, 2 cows, ... 5 cows). For each card, count chorally with the
      class in the target language — touch each animal as you say the number
      (one-to-one correspondence: one touch per number per object). Limit to 1-5
      in warmup; extend to 6-10 in scaffold.
  contentActivity:
    durationMinutes: 10
    body: |
      Pocket-chart routine with sentence strips ("There are {count} {item:plural}").
      Choral reading first, then individual reads. Pair work: kids hold a picture-
      card showing N animals, partner counts and says "There are N cats" (or
      whatever animal). Recast errors in the target frame — if kid says "five
      cat", recast to "there are five cats" (plural marking).
  scaffold:
    durationMinutes: 7
    body: |
      Station rotation. Station 1: addition image-image worksheet (operands 1-5;
      kid counts both groups, sums). Station 2: manipulative cut-outs counting
      ("count out 7 cows"; "now show me 9"). Station 3: chart-count worksheet
      (count animals by category; fill bar graph). Each station ~2.5 min;
      teacher rotates between stations.
  closure:
    durationMinutes: 4
    body: |
      Whole-class share-out. Final challenge: teacher names a number 1-10 in the
      target language, kids hold up that many fingers AND that many cut-out
      animals. Forward-pointer (in the target language): "Today we counted to 10.
      When we come back to counting next, we'll go farther — 11, 12, 13." This
      points kids forward to the adjacent learning target count-objects-1-to-20.

composedExercises:
  # Exercise ordering revised post-agent-review: chart-count (purer cardinality
  # scaffold) precedes addition (union-counting load belongs after pure-count
  # foundation). Agent rationale: "chart-count is purer cardinality scaffold;
  # addition's union-counting belongs at slot 3 where load is justified."

  # Exercise 1: find-and-count (introduction; visual scan + count)
  - appName: find-and-count
    exerciseMode: unified
    customizationParameters: { gridRows: 4, gridCols: 4, themeSelect: animals, languageSelect: en }
    ordering: 1
    pedagogicalRole: introduction

  # Exercise 2: chart-count (practice; counting + graphing — purer cardinality
  # work than addition; right at slot 2 per agent reorder).
  # ARCHITECTURAL FINDING (Phase 3c): chart-count has EMPTY exercise-specific
  # customization_parameters in exercise-palette.json — Phase 1 audit noted
  # "minimal explicit configuration." themeSelect is NOT a valid parameter for
  # chart-count. Only universal layer parameters apply. App-side extension
  # would be required for theme control (out of scope per CLAUDE.md §3.2).
  - appName: chart-count
    exerciseMode: unified
    customizationParameters: { languageSelect: en }
    ordering: 2
    pedagogicalRole: practice

  # Exercise 3: addition image-image (practice; small operands; counting-up
  # implicit in the addition task — load justified at slot 3 after chart-count
  # established pure-cardinality foundation).
  - appName: addition
    exerciseMode: image-image
    customizationParameters:
      exerciseMode: image-image
      problemCount: 6
      minOperand: 1
      maxOperand: 5
      themeSelect: animals
      showPlusSign: true
      languageSelect: en
    ordering: 3
    pedagogicalRole: practice

  # Exercise 4: more-less image-image (consolidation; quantity comparison)
  - appName: more-less
    exerciseMode: image-image
    customizationParameters:
      comparisonMode: image-to-image
      problemCount: 5
      themeSelect: animals
      languageSelect: en
    ordering: 4
    pedagogicalRole: consolidation

  # Exercise 5: find-and-count assessment (transfer; different theme to verify
  # count-skill generalizes beyond the practice theme)
  - appName: find-and-count
    exerciseMode: unified
    customizationParameters: { gridRows: 5, gridCols: 5, themeSelect: fruits, languageSelect: en }
    ordering: 5
    pedagogicalRole: assessment

materials:
  # Material 1: flashcards (theme-mode, not vocabKeyList)
  # Used for whole-class counting routine. 10 cards, each shows 1-10 animals
  # (the operator at render time customizes to show count groups, OR the
  # generator renders one animal per card if not extended).
  # ARCHITECTURAL NOTE: this is the workaround for "numeral cards" — using
  # theme-mode flashcards. A future numeral-flashcards material would render
  # numerals 1-10 directly; not gating Arc 2.
  - materialSlug: flashcards
    customizationParameters:
      imageSource: theme
      themeName: animals
      cardCount: 10
      cardsPerPage: 4
      colorMode: color
      labelDisplay: singular
      labelCase: lowercase
      showArticle: false
      paperSize: a4
      language: en
      borderStyle: thick
      roundedCorners: true
      showCutGuides: true
    ordering: 1
    pedagogicalRole: vocabulary-anchor

  # Material 2: picture-cards (theme-mode; image-only for counting tasks)
  - materialSlug: picture-cards
    customizationParameters:
      imageSource: theme
      themeName: animals
      cardCount: 10
      cardsPerPage: 9
      colorMode: color
      paperSize: a4
      borderStyle: thin
      roundedCorners: true
      showCutGuides: true
    ordering: 2
    pedagogicalRole: production-prompt

  # Material 3: sentence-strips there-are-count-plural — THE numeracy-relevant
  # frame. Renders "There are 3 cats" / "There are 5 dogs" — connects counting
  # to language. (i-see-a, this-is-a, i-have-a frames don't reinforce counting.)
  - materialSlug: sentence-strips
    customizationParameters:
      framePreset: there-are-count-plural
      imageSource: theme
      themeName: animals
      stripCount: 10
      stripsPerPage: 4
      colorMode: color
      paperSize: a4
      language: en
      includeWritingLine: true
    ordering: 3
    pedagogicalRole: language-frame

  # Material 4: manipulative-cut-outs PRIMARY — counting prop. single-repeat
  # mode with itemCount=40 (more than vocab packages' 30 because counting-to-10
  # tasks need enough copies for "show me 10" + "show me 9" + ... in sequence).
  - materialSlug: manipulative-cut-outs
    customizationParameters:
      imageSource: theme
      themeName: animals
      mode: single-repeat
      itemCount: 40
      itemSize: medium-1.5in
      colorMode: color
      paperSize: a4
      language: en
      showCutGuides: true
    ordering: 4
    pedagogicalRole: concrete-manipulative

  # Material 5: parent-letter — numeracy framing in body
  - materialSlug: parent-take-home-letter
    customizationParameters:
      tone: warm
      imageSource: theme
      themeName: animals
      pictureCueCount: 6
      homeLanguage: en
      language: en
      colorMode: color
      signatureLine: true
      paperSize: a4
    ordering: 5
    pedagogicalRole: home-school-bridge

  # Material 6: answer-key — teacher reference
  - materialSlug: answer-key
    customizationParameters:
      includeExerciseAnswers: true
      includeMaterialReference: true
      includePedagogicalNotes: true
      paperSize: a4
      language: en
    ordering: 6
    pedagogicalRole: teacher-reference

compositionalRationale:
  en: |
    Primary strand: counting and cardinality (target count-objects-1-to-10).
    Secondary strand: vocabulary acquisition (animal names — the chosen theme
    surfaces vocabulary as a side effect of counting work, not as the primary
    target). Tertiary strand: arithmetic introduction (addition slot 2 + more-less
    slot 4 are foundational arithmetic exercises, anchored in counting-to-10).

    The strand inversion (counting primary, vocabulary secondary) is the cross-
    strand architectural marker: vocabulary packages have vocabulary primary;
    numeracy packages have numeracy primary with vocabulary instrumental.

    Theme choice (animals) is operator-substitutable WITHOUT changing the target.
    A teacher could swap to "fruits" or "vehicles" theme and the package would
    still teach count-objects-1-to-10 — only the visual content changes. This
    theme-substitutability is a property of numeracy packages that vocabulary
    packages don't share (vocabulary packages' vocab keys ARE the target).

curriculumStandards:
  - CCSS.K.CC.A.1
  - CCSS.K.CC.B.4
  - CCSS.K.CC.B.5
  - EYFS.ELG.M

assessmentCriteria:
  en: |
    By end of 1-2 week unit, kids should:
      - Count one-to-one to 10 accurately (one number per object) in 4 of 5
        trials (objective: count-objects-1-to-10 receptive — measured via
        manipulative-cut-outs counting tasks).
      - Count to 10 chorally without error in 1 of 1 trial (rote count —
        measured via warmup chant).
      - Use "There are N {item:plural}" frame productively for at least 5 counts
        (measured via sentence-strip pair-work).
      - (Adjacent target match-numeral-to-quantity-1-to-10 is NOT directly
        assessed in this package due to the numeral-cards material gap surfaced
        at Phase 3c agent review. The package teaches counting + cardinality;
        numeral-quantity matching becomes assessable when the numeral-cards
        material lands per Arc 3 commission.)

    Differentiation:
    - Pre-K: count to 5 with one-to-one correspondence; chorus to 10.
    - K: count to 10 with one-to-one; introduce numeral-quantity matching.
    - Grade 1+: extend to count-on (skip-count by 2 to 20) and within-10 addition.

