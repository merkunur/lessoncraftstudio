  - EYFS.ELG.LL
  - IB-PYP.WhoWeAre

assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Point to the correct body-part on self when teacher names it
        (target language) in 9 of 10 trials.
      - Point to the correct body-part on a body diagram in 8 of 10
        trials (transfer from self to representation).
      - Match body-part picture-cards to body-part words in 7 of 10
        trials.

    Differentiation:
    - Pre-K: 4-key receptive set only (head, eye, hand, foot); body-self
      mapping only.
    - K: 10-key receptive set; body-self + body-diagram mapping.
    - Grade 1+: bridge from receptive (this package) to productive
      (identify-and-name-body-parts; Arc 2). Productive packages assume
      the kid has receptive comprehension already.

