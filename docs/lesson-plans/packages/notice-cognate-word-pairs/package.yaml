# Teaching package — notice cognate word pairs across languages
# Arc 8 Phase 2 (Option A vocab-acquisition continuation; early-literacy /
# multilingual-language-awareness strand). Class B FLEXIBLE; cross-strand
# vocab-anchored. Differentiating multilingual K-3 surface — kids notice
# that words in their home language and target language share roots
# (e.g., en "tomato" / es "tomate" / it "pomodoro" pairs at root level).
# Builds on Arc 5+6 multilingual-language-awareness work.

targetSlug: notice-cognate-word-pairs
language: en
title:
  en: "Cognate Word Pairs — words that look or sound the same across languages"
description:
  en: "Kindergarten / Grade 1 early-literacy package teaching cognate awareness across languages. Multilingual-language-awareness strand: kids notice that some words look or sound the same across their home language and the target language (e.g., en 'family' / es 'familia' / it 'famiglia'). Recognition of cognates accelerates vocabulary acquisition because kids can leverage what they already know in their home language. Differentiating package for the platform's multilingual K-3 audience. 5 worksheet exercises + 7 printable materials over a 1-week unit."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class noticing routine. Teacher writes a target-language
      word on the board (e.g., 'family'). Asks: "Does this word sound
      like a word in YOUR home language?" Kids who recognize cognates
      raise hands and offer their home-language equivalent ('familia',
      'famiglia', 'familie', 'familj'). Teacher writes the home-language
      equivalents next to the target-language word. Highlights the
      shared letters or sounds. Reinforces: "When a word in our target
      language sounds like a word in YOUR language, you have a head
      start on remembering it."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + cognate-noticing routine. Each pair receives 6-8
      cognate-pair cards (target-language word + image of the concept).
      Pair discusses: "Does this word sound like a word in YOUR
      language?" Kids share home-language equivalents. Teacher
      circulates, noting cognate-pairs that emerged. Optional
      extension: kids draw the cognate-pair concept + write both
      words side-by-side. Recast emphasizing celebration ("YES — that's
      a cognate! 'Tomate' and 'tomato' come from the same source.").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching worksheet (cognate-pair
      images-to-target-language-words; reinforces target-language
      recognition). Station 2: word-scramble (kids unscramble target-
      language cognate words; reinforces spelling). Station 3:
      manipulative cut-outs hands-on cognate-pair construction (kids
      assemble cognate-pair displays; partner verifies). Station 4:
      sentence-strips (kids construct full sentences using cognate
      words; reinforces full-sentence productive language).
  closure:
    durationMinutes: 5
    body: |
      Whole-class share. Teacher displays 4-6 target-language words +
      asks kids to identify cognates across the whole-class home-
      language set. Forward-pointer: "Today we noticed cognates between
      our target language and our home languages. When we come back
      to language-noticing next, we'll explore FALSE FRIENDS — words
      that LOOK like cognates but actually mean different things —
      and we'll learn to be careful with them."

