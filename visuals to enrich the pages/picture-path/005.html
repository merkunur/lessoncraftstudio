<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Picture Path - Professional Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(160deg, #263238 0%, #37474F 50%, #455A64 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Subtle grid pattern background -->
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.05;" viewBox="0 0 1000 1000">
            <pattern id="profGrid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#profGrid)"/>
        </svg>

        <!-- NO PREP Ribbon - Top Left Corner -->
        <div style="
            position: absolute;
            top: 50px;
            left: -45px;
            transform: rotate(-45deg);
            z-index: 25;
        ">
            <div style="
                background: linear-gradient(135deg, #43A047 0%, #2E7D32 100%);
                color: white;
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 20px;
                padding: 10px 60px;
                box-shadow: 0 4px 15px rgba(67, 160, 71, 0.5);
                text-transform: uppercase;
                letter-spacing: 2px;
            ">NO PREP!</div>
        </div>

        <!-- Main Title - Top -->
        <div style="
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 58px;
                color: white;
                margin: 0;
                text-shadow: 0 3px 10px rgba(0,0,0,0.3);
                letter-spacing: -1px;
            ">PROFESSIONAL</h1>
            <h2 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 48px;
                color: #90CAF9;
                margin: 0;
            ">MAZE WORKSHEETS</h2>
        </div>

        <!-- Two Worksheet Display - Side by Side -->
        <div style="
            position: absolute;
            top: 210px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 50px;
            z-index: 15;
        ">
            <!-- Worksheet Card -->
            <div style="
                background: white;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            ">
                <!-- Blue header label -->
                <div style="
                    background: linear-gradient(135deg, #1976D2 0%, #2196F3 100%);
                    padding: 10px 20px;
                    text-align: center;
                ">
                    <span style="
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 600;
                        font-size: 18px;
                        color: white;
                        text-transform: uppercase;
                        letter-spacing: 1px;
                    ">Worksheet</span>
                </div>
                <div style="padding: 10px;">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/picture%20path/sample-3.jpeg"
                        alt="Worksheet"
                        style="
                            width: 240px;
                            height: 310px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 6px;
                            display: block;
                        "
                    />
                </div>
            </div>

            <!-- Answer Key Card -->
            <div style="
                background: white;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            ">
                <!-- Green header label -->
                <div style="
                    background: linear-gradient(135deg, #43A047 0%, #66BB6A 100%);
                    padding: 10px 20px;
                    text-align: center;
                ">
                    <span style="
                        font-family: 'Fredoka', sans-serif;
                        font-weight: 600;
                        font-size: 18px;
                        color: white;
                        text-transform: uppercase;
                        letter-spacing: 1px;
                    ">Answer Key</span>
                </div>
                <div style="padding: 10px;">
                    <img
                        src="https://www.lessoncraftstudio.com/samples/english/picture%20path/sample-3-answer.jpeg"
                        alt="Answer Key"
                        style="
                            width: 240px;
                            height: 310px;
                            object-fit: cover;
                            object-position: top;
                            border-radius: 6px;
                            display: block;
                        "
                    />
                </div>
            </div>
        </div>

        <!-- Quality Checklist - Bottom Left -->
        <div style="
            position: absolute;
            bottom: 130px;
            left: 80px;
            z-index: 15;
        ">
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Check item 1 -->
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="
                        width: 32px;
                        height: 32px;
                        background: #43A047;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                        </svg>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 20px; color: white;">Print-Ready PDFs</span>
                </div>
                <!-- Check item 2 -->
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="
                        width: 32px;
                        height: 32px;
                        background: #43A047;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                        </svg>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 20px; color: white;">Answer Keys Included</span>
                </div>
                <!-- Check item 3 -->
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="
                        width: 32px;
                        height: 32px;
                        background: #43A047;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                        </svg>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 20px; color: white;">Commercial License</span>
                </div>
                <!-- Check item 4 -->
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="
                        width: 32px;
                        height: 32px;
                        background: #43A047;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    ">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                        </svg>
                    </div>
                    <span style="font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 20px; color: white;">300 DPI Quality</span>
                </div>
            </div>
        </div>

        <!-- Time Badge - Bottom Right -->
        <div style="
            position: absolute;
            bottom: 150px;
            right: 80px;
            z-index: 15;
        ">
            <div style="
                background: rgba(255,255,255,0.1);
                border: 2px solid rgba(255,255,255,0.3);
                border-radius: 16px;
                padding: 20px 30px;
                text-align: center;
                backdrop-filter: blur(5px);
            ">
                <div style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 42px;
                    color: #90CAF9;
                    line-height: 1;
                ">3 min</div>
                <div style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 600;
                    font-size: 16px;
                    color: white;
                    margin-top: 5px;
                ">Print-Ready</div>
            </div>
        </div>

        <!-- Bottom Banner -->
        <div style="
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <div style="
                display: inline-block;
                background: linear-gradient(135deg, #1976D2 0%, #2196F3 100%);
                padding: 14px 40px;
                border-radius: 50px;
                box-shadow: 0 8px 25px rgba(25, 118, 210, 0.4);
            ">
                <span style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 700;
                    font-size: 22px;
                    color: white;
                    letter-spacing: 0.5px;
                ">Print-Ready in Under 3 Minutes</span>
            </div>
        </div>

        <!-- Decorative elements -->
        <div style="
            position: absolute;
            top: 180px;
            right: 60px;
            width: 40px;
            height: 40px;
            background: #1976D2;
            border-radius: 50%;
            opacity: 0.3;
        "></div>
        <div style="
            position: absolute;
            top: 250px;
            left: 50px;
            width: 25px;
            height: 25px;
            background: #43A047;
            border-radius: 50%;
            opacity: 0.4;
        "></div>
    </div>
</body>
</html>
