# Teaching package — identify and name 10 basic emotions
# Arc 2 Phase 3c. Vocab keys verified: happy, sad, angry, scared, surprised,
# tired, excited, bored, shy, confused (10/10).
# Note: "calm" not in IMAGE_VOCABULARY; substituted "confused".

targetSlug: identify-and-name-emotions
language: en

title:
  en: "Emotions — identify and name 10"
description:
  en: "K-Grade 1 vocabulary-acquisition package for 10 basic emotions: happy, sad, angry, scared, surprised, tired, excited, bored, shy, confused. 5 worksheet exercises + 7 printable materials. Cross-strand integration: vocabulary acquisition + EYFS PSED (Personal, Social & Emotional Development) per learning-targets.json strand boundary."

durationMinutes: 25

structure:
  warmup:
    durationMinutes: 4
    body: |
      Whole-class introduction. Teacher holds up emotion flashcards, names each
      emotion in target language, class repeats chorally + makes the matching
      face. The face-mimicry IS the engagement axis — kids feel the emotion
      while naming it. Pin cards to "Emotions" word wall cluster.
  contentActivity:
    durationMinutes: 10
    body: |
      Pocket-chart routine with sentence strips ("I feel {item}"). Choral reading
      first, then individual reads. Pair work: kids hold a picture-card, partner
      makes the matching face + names the emotion. Recast errors gently — emotions
      vocabulary is sensitive; don't correct the kid's INTERNAL state, only the
      labeling.
  scaffold:
    durationMinutes: 7
    body: |
      Station rotation. Station 1: image-letter matching. Station 2: emotion-
      narrative — kids draw a picture of when they felt {emotion} and label it.
      Station 3: emotion-sort by valence (positive emotions / negative / neutral).
  closure:
    durationMinutes: 4
    body: |
      Whole-class share-out. Final challenge: teacher mimes an emotion, kids name
      it. Forward-pointer: "Today we learned 10 emotion words. When we come back
      to emotions next, this same set will be here. Remember — feeling these
      emotions is okay. Naming them helps us share."

