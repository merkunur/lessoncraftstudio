assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Solve find-missing-addend-within-10 problems
        (3 + ? = 8) in 7 of 10 trials.
      - Use count-up strategy from the known addend to the
        sum in 6 of 10 trials when prompted to show work.
      - Articulate the answer in addition-sentence form
        ('three plus five is eight; the missing number is
        five') in 5 of 10 productive-language trials.
      - Recognize when the sum is 10 and apply make-10
        partner recall as a shortcut in 6 of 8 sum-equals-10
        problems.

    Differentiation:
    - Pre-K: skip the abstract missing-addend question
      form; build addition-fact recall within 5 with
      manipulatives.
    - K: introduce missing-addend within 5 first ('1 + ? =
      4'); manipulative + 10-frame support emphasized;
      count-up strategy heavily scaffolded.
    - Grade 1: full missing-addend within 10 fluency;
      count-up + addition-fact recall + make-10-partner
      strategies in active use.
    - Grade 2+: extend to find-missing-addend within 20
      (Arc 13+ candidate); bridge to algebraic equation-
      solving in later elementary — the same blank that
      held '5' here becomes 'x' there.

