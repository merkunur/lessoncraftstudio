# Teaching package — identify and name 10 foods
# Arc 4 Phase 1. Vocab keys verified: pizza, bread, milk, egg, apple, banana,
# cheese, sandwich, water, juice (10/10 with full 11-locale IMAGE_VOCABULARY
# entries). Universal-recognition prioritized per spec; meal-list varies by
# culture but these 10 are recognizable across the 11 platform locales.

targetSlug: identify-and-name-foods
language: en

title:
  en: "Foods — identify and name 10 common meals and snacks"
description:
  en: "K-Grade 1 vocabulary-acquisition package for 10 common foods: pizza, bread, milk, egg, apple, banana, cheese, sandwich, water, juice. 5 worksheet exercises + 8 printable materials. Theme-agnostic; operator selects target instruction language at material-render time. Universal-recognition prioritized for cross-cultural relevance."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up flashcards, names each food in
      target language, class repeats chorally. Optional: bring real food (or
      empty packaging — bread bag, juice carton) for sensory engagement — kids
      touch, smell, identify. Pin cards to "Foods" word wall cluster.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("I see a {item}"). Choral
      reading first, then individual reads. Pair work: kids hold a picture-card,
      partner names the food. Recast errors in the target frame. Optional
      extension: kids share a food they ate this morning ("I ate {item}").
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: image-letter matching (matching app, letter
      mode). Station 2: picture-card sorting on the carpet (foods to eat vs
      drinks — solids vs liquids attribute sort). Station 3: manipulative
      cut-outs counting ("count out 3 apples").
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Final challenge: teacher names a food, kids point
      to flashcard. Forward-pointer: "Today we learned 10 food words. When we
      come back to foods next, this same set will be here for us."

