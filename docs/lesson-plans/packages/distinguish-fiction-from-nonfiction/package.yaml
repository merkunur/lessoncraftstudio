# Teaching package — distinguish fiction from nonfiction
# Arc 19 Phase 1.1 Slot 1 (early-literacy / reading-comprehension strand 8/10 → 9/10). Pair-coherent with Phase 1.1 Slot 2 read-and-follow-2-sentence-instruction; together they SAT-close reading-comprehension at 10/10 (20th parent-class strand SAT). Foundation reading-comprehension skill: kids identify whether a story is MAKE-BELIEVE (fiction) or REAL (nonfiction).

targetSlug: distinguish-fiction-from-nonfiction
language: en
title:
  en: "Make-Believe or Real? — distinguish fiction from nonfiction"
description:
  en: "Kindergarten / Grade 1 narrative-comprehension package teaching kids to distinguish FICTION (make-believe stories) from NONFICTION (true stories about real things). Builds on Arc 17/18 reading-comprehension cluster (identify-main-character + identify-setting + identify-problem-and-solution + answer-who-what-where-questions). Critical K-1 genre-awareness skill: kids look at a story and identify cues that signal make-believe (talking animals, magic, made-up creatures) vs real (real animals doing real things, photographs of real places, factual information). Reading-comprehension strand advances 8/10 → 9/10. Per §A.13.30 K-1 informal framing: K-1 fiction-vs-nonfiction work is CONCRETE CUE RECOGNITION — kids notice signals in pictures + simple text (does this dog wear a hat and talk? fiction. Does this dog do real dog things in a real-world setting? nonfiction). NOT formal genre-theory pedagogy. CCSS.RL.K.5 + CCSS.RI.K.5 primary anchors. 5 worksheet exercises + 8 printable materials over a 1-week unit. Materials list mirrors identify-main-character + identify-setting 8-material literacy canonical."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class fiction-vs-nonfiction hook. Teacher displays
      2 contrasting picture-pairs: (1) a cartoon mouse wearing
      glasses + reading a book; (2) a photograph of a real mouse
      eating a seed. "Which is MAKE-BELIEVE? Which is REAL?"
      Class identifies: mouse-with-glasses = make-believe (real
      mice don't read books); photograph of real mouse =
      real. Teacher introduces vocabulary: "MAKE-BELIEVE stories
      are FICTION. REAL stories are NONFICTION." Repeats with
      2 more pairs: cartoon dragon vs photograph of a lizard;
      story of talking trees vs photograph of a real forest.
      Pattern emphasis: "Look for CLUES. Talking animals, magic,
      made-up creatures = fiction. Real photographs, real animals
      doing real things, facts about the world = nonfiction."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + cue-recognition routine. Each pair receives
      8 picture-story cards (mix of fiction + nonfiction). Pair
      takes turns: kid A picks a card; kid B identifies whether
      it's fiction or nonfiction + names the CUE that gave it
      away ("This is fiction because the bear is wearing pants —
      real bears don't wear pants"; "This is nonfiction because
      it's a photograph of a real fire truck"). Recast errors
      with cue-naming ("you said the rabbit family eating dinner
      at a table is real — but look: rabbits are wearing clothes
      and sitting at a table. That's a CLUE the story is make-
      believe. Real rabbits don't wear clothes or sit at tables.").
      Teacher note: K-1 kids sometimes label all animal stories
      as fiction (since some animal stories are fiction). Help kids
      see: real animal stories (a nature documentary of bears
      catching fish) are nonfiction; fiction adds make-believe
      elements (a story of a bear who runs a bakery).
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: picture-sort worksheet (kids
      sort story-cards into FICTION vs NONFICTION buckets).
      Station 2: matching worksheet (kids match a fiction cue
      to a fiction story, or a real-world fact to a nonfiction
      story). Station 3: missing-pieces worksheet (kids complete
      a fiction or nonfiction story-card from a partial picture).
      Station 4: vocabulary-tracing-strips for genre vocabulary
      (fiction, nonfiction, real, make-believe, story, fact).
  closure:
    durationMinutes: 5
    body: |
      Whole-class genre-quick-recall. Teacher names quick scenarios;
      class shouts FICTION or NONFICTION. "A monkey wearing a
      crown!" (Class: FICTION!) "A photograph of a real elephant
      in Africa!" (NONFICTION!) "A dragon eating ice cream!"
      (FICTION!) "A book about how the moon goes around the
      Earth!" (NONFICTION!) Teacher closes: "Books and stories
      come in TWO BIG TYPES. Fiction = made-up; nonfiction =
      real. Knowing the difference helps you understand WHAT
      KIND of story you're reading. Real stories teach us FACTS
      about the world. Make-believe stories use our imagination
      to explore feelings + ideas." Forward-pointer: "Next we
      learn to read INSTRUCTIONS — short directions that tell
      us what to do. That's our LAST reading-comprehension target
      before we close the whole strand!"

