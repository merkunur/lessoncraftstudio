# Teaching package — find missing addend within 10
# Arc 17 Phase 1.2 (math / addition-subtraction 12/14 → 13/14). RESOLVES Arc 4 add-within-5 forward-pointer ('find-missing-addend-within-10 — adjacent inverse-thinking target'). Algebraic-thinking precursor anchor. Paired strand-anchor: make-10-strategy (same arc phase).

targetSlug: find-missing-addend-within-10
language: en
title:
  en: "Find the Missing Addend Within 10 — what number goes in the blank?"

description:
  en: "Grade 1 math package teaching the missing-addend question form ('3 + ? = 8 — what number fills the blank?') with sums up to 10. Builds on Arc 4 add-within-5 + Arc 11 add-within-10 fluency; the missing-addend question reuses addition facts the kids already know but flips the question — instead of computing a sum from two known addends, the kid finds an unknown addend given the sum and the other addend. RESOLVES the Arc 4 add-within-5 forward-pointer ('adjacent inverse-thinking target'). This is the first algebraic-thinking package — the unknown-in-a-blank question form is the K-3 precursor to the equation-solving work that lands in middle elementary (x + 3 = 8). Concrete-pictorial-abstract sequence: kids start by physically counting the gap on a 10-frame, move to pictorial number-line counting-up, and finally answer mentally using addition-fact recall ('I know 3 + 5 = 8, so the blank is 5'). CCSS.1.OA.D.8 primary anchor; CCSS.K.OA.A.4 cross-walk ('find the number that makes 10'). 5 worksheet exercises + 6 printable materials over a 1-week unit. Paired strand-anchor companion: make-10-strategy (decomposition mental-math on the same addition-fluency strand)."

durationMinutes: 25

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class hook + missing-addend question-form
      introduction. Teacher writes 3 + ? = 8 on the board.
      "Today we meet a new kind of question. Usually I ask
      you 'what's 3 plus 5?' and you say 8. Today I'm asking
      something different. I tell you 3 plus SOMETHING equals
      8. Your job is to find the SOMETHING." Teacher shows
      counting-up on fingers: hold up 3 fingers ("three"),
      count up to 8 raising more fingers ("four, five, six,
      seven, eight"), then count the new fingers ("five"). "So
      3 plus 5 equals 8. The missing number is 5." Teacher
      repeats with 4 + ? = 9 (count up from 4: five, six,
      seven, eight, nine — five new fingers; answer 5) and
      6 + ? = 10 (a make-10 partner — 6's partner is 4).
      Pattern emphasis: "We KNOW one addend. We KNOW the sum.
      We FIND the OTHER addend by counting up — or by knowing
      the addition fact."
  contentActivity:
    durationMinutes: 10
    body: |
      Pair work with 10-frame + fruit-themed counters. Each
      pair receives a 10-frame + a stack of fruit counters.
      Pair plays the missing-addend game: teacher gives a
      problem (e.g., 3 + ? = 8); kid A places the known
      addend on the 10-frame (3 apples in the first 3
      squares); kid B's job is to find how many more counters
      fill up to the sum (place fruit until the total is 8 —
      kid B places 5 more; the answer is 5). Both say aloud:
      "3 plus 5 is 8. The missing number is 5." Then pair
      swaps + repeats with 4 + ? = 7, 2 + ? = 9, 5 + ? = 10,
      6 + ? = 8. The 10-frame's grid structure makes the
      counting-up visible — kids can see the gap between
      what's there and what's needed. Recast errors with
      count-up cue ('start at 3 — count up to 8 — how many
      new ones did you place?'). Strategy choices: kids may
      count up on the frame, use addition-fact recall, OR
      use a number-line / hundreds-chart aid; teacher
      accepts any strategy that produces correct answer +
      can be explained.
  scaffold:
    durationMinutes: 7
    body: |
      Station rotation. Station 1: addition app find-addend
      mode (operands within 10 — the canonical missing-addend
      exercise from add-within-5's composition, now scaled
      to sums-up-to-10). Station 2: math-puzzle missing-
      addend mode (visual problems with a blank where the
      missing addend goes). Station 3: math-worksheet
      missing-addend problems (written column or sentence
      format: 3 + __ = 8). Station 4: matching activity —
      match each missing-addend problem to its answer (3+?=8
      matches to 5; 4+?=10 matches to 6).
  closure:
    durationMinutes: 3
    body: |
      Whole-class missing-addend quick-recall. Teacher
      presents problems; class answers chorally + names the
      strategy. "3 + ? = 7? — Four! I counted up from 3 to
      7 — four steps." "5 + ? = 10? — Five! That's a make-
      10 partner." "2 + ? = 9? — Seven! I know 2 plus 7
      equals 9." Forward-pointer: "Today we found missing
      addends within 10. The same question form grows:
      bigger sums get bigger missing addends (find-missing-
      addend within 20, within 100), and eventually we'll
      see this same shape with x in middle elementary — x +
      3 = 8. The blank you find today is the same blank
      that becomes a letter later. The MAKE-10 STRATEGY we
      just learned helps here — when the sum is 10, the
      missing addend is the make-10 partner."

