assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Write numerals 1-20 with proper formation in 8 of 10
        trials.
      - Stay within ±3mm of dotted template in 7 of 10 traces.
      - Write requested numeral on demand (no template) in 6 of
        10 trials.
      - Identify + correct reversed numerals in 5 of 10 trials.

    Differentiation:
    - Pre-K: writing 1-5 only; thick-dotted templates; large
      formation.
    - K: writing 1-10 with templates; introduce 11-20 receptively.
    - Grade 1: writing 1-20 with reduced template support.
    - Grade 2+: extend to writing 1-100 + 100-1000 + bridge to
      arithmetic-with-handwriting work.

