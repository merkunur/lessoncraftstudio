# Teaching package — describe material properties (hard/soft, smooth/rough, flexible/rigid, transparent/opaque)
# Arc 18 Phase 1.4 (world-knowledge / materials-and-properties — STRAND-SAT-CLOSING 1/2 → 2/2). 18th parent-class strand SATISFIED. Pair partner of Arc 18 Phase 1.3 identify-common-materials (the 1st canonical target in the strand). Together the pair saturates materials-and-properties at 2/2 SAT.

targetSlug: describe-material-properties
language: en
title:
  en: "Hard or Soft? Smooth or Rough? — describe material properties"

description:
  en: "Kindergarten / Grade 1 world-knowledge package teaching kids to DESCRIBE the observable PROPERTIES of common materials they have already learned to identify (Arc 18 Phase 1.3 identify-common-materials prerequisite). Property pairs introduced: HARD vs SOFT (a wooden block is HARD; a fabric pillow is SOFT), SMOOTH vs ROUGH (glass is SMOOTH; bark is ROUGH), FLEXIBLE vs RIGID (paper bends — FLEXIBLE; metal does not bend easily — RIGID), TRANSPARENT vs OPAQUE (glass lets light through — TRANSPARENT; wood blocks light — OPAQUE). Builds DIRECTLY on identify-common-materials (kids who can identify the 6 canonical materials — wood, plastic, metal, paper, fabric, glass — now describe what those materials FEEL LIKE and LOOK LIKE). STRAND-SAT-CLOSING package: completes world-knowledge / materials-and-properties at 2/2 SAT (the 18th parent-class strand SATISFIED in the catalog; final zero-coverage strand in world-knowledge domain closes). Per §A.13.30 K-1-informal framing: K material-property work is OBSERVABLE-PROPERTY description (kid touches a material → kid names a property word from a small canonical vocabulary set). NOT formal materials-property classification (NGSS 2-PS1-1 'Plan and conduct an investigation to describe and classify different kinds of materials by their observable properties' — that's Grade 2+ work that builds on this K-level property-vocabulary foundation). NGSS K-PS3 informal anchor (kindergarten energy + property work bridges to Grade 2 materials-property investigation). 5 worksheet exercises + 7 printable materials over a 1-week unit. Load-bearing material: manipulative-cut-outs with `mode: variety` enumerating the same 6 material-type vocabKeys as identify-common-materials (wood, plastic, metal, paper, fabric, glass) — kids physically handle cut-outs of each material category and describe what they feel + see. Sentence-strips at position 4 with framePreset 'this-is-a' carrying property-anchor frames ('this wood is hard', 'this fabric is soft', 'this glass is smooth')."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class property-introduction with hands-on material
      handling. Teacher displays 6 everyday classroom objects, one
      per material from the identify-common-materials work: wooden
      block (wood); plastic cup (plastic); metal spoon (metal);
      paper sheet (paper); fabric scarf (fabric); glass jar (glass).
      Teacher passes one object around the circle: "Touch the
      wooden block. How does it FEEL? HARD! Can you bend it? NO —
      wood is RIGID. The wood does not bend." Repeats with each
      material introducing property pairs: plastic ("HARD or SOFT?
      HARD! Smooth or rough? SMOOTH! Can you bend it a little?
      Yes — plastic is FLEXIBLE."), metal ("HARD! SMOOTH! RIGID!
      Cold to touch."), paper ("Soft? It's THIN — can you bend
      it? YES, very FLEXIBLE. Can you tear it? Yes — paper TEARS
      easily."), fabric ("SOFT! VERY FLEXIBLE — fabric folds and
      bends! Smooth? Some fabrics smooth, some rough."), glass
      ("HARD! SMOOTH! And — can you SEE THROUGH it? YES — glass
      is TRANSPARENT. Light goes through glass."). Pattern
      emphasis: "Every material has PROPERTIES we can observe.
      Properties tell us WHY each material is used the way it is.
      Today we learn 4 property pairs: HARD vs SOFT; SMOOTH vs
      ROUGH; FLEXIBLE vs RIGID; TRANSPARENT vs OPAQUE."
  contentActivity:
    durationMinutes: 12
    body: |
      Pair work + property-description routine. Each pair receives
      a property-description tray with 6 small objects (one per
      material: wood block, plastic chip, metal washer, paper
      square, fabric swatch, glass marble) + 8 property cards
      (HARD, SOFT, SMOOTH, ROUGH, FLEXIBLE, RIGID, TRANSPARENT,
      OPAQUE). Pair takes turns: kid A picks an object; kid B
      touches the object + names 2 properties out loud + places
      the matching property cards next to the object. Both kids
      say: "This [material] is [property] and [property]." Recast
      errors with side-by-side comparison ("you said the paper is
      RIGID — but watch, when I push it, it BENDS. So paper is
      FLEXIBLE. Metal is RIGID — see how the metal washer doesn't
      bend even when I push hard."). Optional extension: pair
      walks around the classroom + finds one object showing each
      property; report back with "I found a [object] that is
      [property]." Teacher note: K kids sometimes confuse
      flexible/soft (both feel "give-y" but flexible means BENDS-
      WITHOUT-BREAKING while soft means SQUISHES-WHEN-PRESSED) and
      smooth/transparent (both feel like "no bumps" but smooth is
      TEXTURE while transparent is SEE-THROUGH). Explicit side-by-
      side property-comparison work supports disambiguation. Some
      objects show MULTIPLE properties (a glass marble is HARD +
      SMOOTH + TRANSPARENT — three properties at once!) — for K
      work, name 1-2 properties per object initially; build to
      multi-property descriptions by Grade 1.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: matching activity — match each
      property word (HARD, SOFT, SMOOTH, ROUGH, FLEXIBLE, RIGID,
      TRANSPARENT, OPAQUE) to a picture of an object showing that
      property. Station 2: picture-sort activity — sort object
      cards into property-pair bins (HARD bin vs SOFT bin; SMOOTH
      bin vs ROUGH bin); surfaces the property-binary-classification
      skill. Station 3: odd-one-out — find the object that does
      NOT show the named property (3 hard objects + 1 soft object;
      kid identifies the soft-out-of-place). Station 4: matching
      activity at consolidation (object image to property word
      pair; reinforces the canonical material-property pairing).
  closure:
    durationMinutes: 5
    body: |
      Whole-class property-recall + strand-closure celebration.
      Teacher names everyday objects; class chorally identifies
      one property of each. "Pillow? SOFT! Window? TRANSPARENT!
      Tree bark? ROUGH! Coin? HARD! Newspaper? FLEXIBLE! Brick
      wall? RIGID! Mirror? SMOOTH! Curtain? SOFT and FLEXIBLE!"
      Teacher then poses property-reasoning questions: "WHY are
      windows made of GLASS?" (Class: because glass is
      TRANSPARENT — light comes in!) "WHY are blankets made of
      FABRIC?" (Class: because fabric is SOFT — comfortable for
      sleeping!) "WHY are forks made of METAL?" (Class: because
      metal is HARD and RIGID — won't break or bend!) Forward-
      pointer: "Today we CLOSED our materials work! We learned
      what materials are made of (last time) AND what properties
      each material has (today). Now we know WHY each material
      is used the way it is — windows GLASS for transparency,
      blankets FABRIC for softness, forks METAL for hardness.
      When we look at any object now, we can ask TWO questions:
      'What is it MADE OF?' and 'What PROPERTIES does that
      material have?' That's how scientists think about
      materials. When we come back to materials work in Grade
      2, we'll do INVESTIGATIONS — testing materials to see
      which floats, which is magnetic, which is waterproof.
      Today we built the foundation; investigations come next."

