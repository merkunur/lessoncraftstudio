assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify ABC patterns vs AB / AAB / ABB in 7 of 10 mixed-pattern
        trials.
      - Complete ABC patterns with 2-3 missing items in 7 of 10 trials.
      - Name the 3 distinct objects in 8 of 10 patterns (vocabulary-
        anchor verification).

    Differentiation:
    - Pre-K: NOT appropriate.
    - K: ABC introductory; with manipulative support.
    - Grade 1+: full ABC fluency + extend to identify-AABB-pattern
      (Arc 7 Phase 2 companion) + create-original-pattern (open-ended).

