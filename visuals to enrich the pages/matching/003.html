<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1000, height=1000">
    <title>Matching Worksheets - Rainbow Progression Thumbnail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1000px; height: 1000px; overflow: hidden; font-family: 'Nunito', sans-serif;">
    <div style="
        width: 1000px;
        height: 1000px;
        background: linear-gradient(180deg, #E8F4FD 0%, #D4ECFD 50%, #C5E4FC 100%);
        position: relative;
        overflow: hidden;
    ">
        <!-- Rainbow Arc -->
        <svg style="position: absolute; top: 80px; left: 50%; transform: translateX(-50%); z-index: 5;" width="900" height="450" viewBox="0 0 900 450">
            <!-- Rainbow bands from outer to inner -->
            <path d="M 50 400 Q 450 -100 850 400" stroke="#FF6B6B" stroke-width="45" fill="none" stroke-linecap="round"/>
            <path d="M 80 400 Q 450 -50 820 400" stroke="#FF9A56" stroke-width="40" fill="none" stroke-linecap="round"/>
            <path d="M 110 400 Q 450 0 790 400" stroke="#FFD93D" stroke-width="38" fill="none" stroke-linecap="round"/>
            <path d="M 140 400 Q 450 50 760 400" stroke="#5DCEA8" stroke-width="35" fill="none" stroke-linecap="round"/>
            <path d="M 170 400 Q 450 95 730 400" stroke="#5BC0EB" stroke-width="32" fill="none" stroke-linecap="round"/>
            <path d="M 198 400 Q 450 135 702 400" stroke="#9B7DD4" stroke-width="28" fill="none" stroke-linecap="round"/>
        </svg>

        <!-- Cloud Left -->
        <div style="
            position: absolute;
            left: -30px;
            top: 300px;
            z-index: 6;
        ">
            <svg width="200" height="120" viewBox="0 0 200 120">
                <ellipse cx="50" cy="80" rx="45" ry="35" fill="white"/>
                <ellipse cx="100" cy="70" rx="55" ry="45" fill="white"/>
                <ellipse cx="150" cy="85" rx="40" ry="30" fill="white"/>
                <ellipse cx="75" cy="55" rx="35" ry="28" fill="white"/>
                <ellipse cx="130" cy="50" rx="40" ry="30" fill="white"/>
            </svg>
        </div>

        <!-- Cloud Right -->
        <div style="
            position: absolute;
            right: -30px;
            top: 280px;
            z-index: 6;
        ">
            <svg width="200" height="120" viewBox="0 0 200 120">
                <ellipse cx="50" cy="80" rx="45" ry="35" fill="white"/>
                <ellipse cx="100" cy="70" rx="55" ry="45" fill="white"/>
                <ellipse cx="150" cy="85" rx="40" ry="30" fill="white"/>
                <ellipse cx="75" cy="55" rx="35" ry="28" fill="white"/>
                <ellipse cx="130" cy="50" rx="40" ry="30" fill="white"/>
            </svg>
        </div>

        <!-- Main Title with Rainbow Gradient -->
        <div style="
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
        ">
            <h1 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 700;
                font-size: 68px;
                margin: 0;
                background: linear-gradient(90deg, #FF6B6B 0%, #FF9A56 20%, #FFD93D 40%, #5DCEA8 60%, #5BC0EB 80%, #9B7DD4 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                text-shadow: none;
                filter: drop-shadow(0 3px 6px rgba(0,0,0,0.1));
            ">MATCHING</h1>
            <h2 style="
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 48px;
                color: #5B4B9E;
                margin: -5px 0 0 0;
                text-shadow: 0 2px 8px rgba(255,255,255,0.8);
            ">WORKSHEETS</h2>
        </div>

        <!-- Three Worksheets Along Rainbow Base -->
        <div style="
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            z-index: 15;
        ">
            <!-- Worksheet 1 -->
            <div style="
                background: white;
                padding: 8px;
                border-radius: 10px;
                box-shadow: 0 12px 35px rgba(0,0,0,0.2);
                position: relative;
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/matching/sample-1.jpeg"
                    alt="Matching Worksheet 1"
                    style="
                        width: 150px;
                        height: 194px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 5px;
                        display: block;
                    "
                />
                <!-- Cute animal peeking - bunny -->
                <div style="
                    position: absolute;
                    top: -35px;
                    right: -15px;
                ">
                    <svg width="50" height="55" viewBox="0 0 50 55">
                        <ellipse cx="15" cy="15" rx="8" ry="18" fill="#FFB6C1"/>
                        <ellipse cx="35" cy="15" rx="8" ry="18" fill="#FFB6C1"/>
                        <ellipse cx="15" cy="15" rx="5" ry="12" fill="#FFC0CB"/>
                        <ellipse cx="35" cy="15" rx="5" ry="12" fill="#FFC0CB"/>
                        <circle cx="25" cy="40" r="18" fill="#F5F5F5"/>
                        <circle cx="19" cy="38" r="4" fill="#2D3748"/>
                        <circle cx="31" cy="38" r="4" fill="#2D3748"/>
                        <ellipse cx="25" cy="45" rx="4" ry="3" fill="#FFB6C1"/>
                    </svg>
                </div>
            </div>

            <!-- Worksheet 2 -->
            <div style="
                background: white;
                padding: 8px;
                border-radius: 10px;
                box-shadow: 0 12px 35px rgba(0,0,0,0.2);
                position: relative;
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/matching/sample-10.jpeg"
                    alt="Matching Worksheet 2"
                    style="
                        width: 150px;
                        height: 194px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 5px;
                        display: block;
                    "
                />
                <!-- Cute animal peeking - bear -->
                <div style="
                    position: absolute;
                    top: -30px;
                    left: 50%;
                    transform: translateX(-50%);
                ">
                    <svg width="50" height="50" viewBox="0 0 50 50">
                        <circle cx="10" cy="12" r="10" fill="#8B6914"/>
                        <circle cx="40" cy="12" r="10" fill="#8B6914"/>
                        <circle cx="25" cy="30" r="22" fill="#A67B2F"/>
                        <circle cx="25" cy="35" rx="12" ry="10" fill="#F5E6D3"/>
                        <circle cx="17" cy="28" r="4" fill="#2D3748"/>
                        <circle cx="33" cy="28" r="4" fill="#2D3748"/>
                        <ellipse cx="25" cy="38" rx="5" ry="4" fill="#2D3748"/>
                    </svg>
                </div>
            </div>

            <!-- Worksheet 3 -->
            <div style="
                background: white;
                padding: 8px;
                border-radius: 10px;
                box-shadow: 0 12px 35px rgba(0,0,0,0.2);
                position: relative;
            ">
                <img
                    src="https://www.lessoncraftstudio.com/samples/english/matching/sample-15.jpeg"
                    alt="Matching Worksheet 3"
                    style="
                        width: 150px;
                        height: 194px;
                        object-fit: cover;
                        object-position: top;
                        border-radius: 5px;
                        display: block;
                    "
                />
                <!-- Cute animal peeking - cat -->
                <div style="
                    position: absolute;
                    top: -35px;
                    left: -15px;
                ">
                    <svg width="50" height="55" viewBox="0 0 50 55">
                        <polygon points="8,25 2,5 18,18" fill="#FF9A56"/>
                        <polygon points="42,25 48,5 32,18" fill="#FF9A56"/>
                        <polygon points="10,23 5,10 16,18" fill="#FFBB80"/>
                        <polygon points="40,23 45,10 34,18" fill="#FFBB80"/>
                        <ellipse cx="25" cy="38" rx="20" ry="18" fill="#FF9A56"/>
                        <circle cx="18" cy="35" r="4" fill="#2D3748"/>
                        <circle cx="32" cy="35" r="4" fill="#2D3748"/>
                        <ellipse cx="25" cy="42" rx="4" ry="3" fill="#FF6B6B"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Difficulty Labels Below Worksheets -->
        <div style="
            position: absolute;
            bottom: 145px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 80px;
            z-index: 15;
        ">
            <div style="
                background: #5DCEA8;
                color: white;
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 16px;
                padding: 6px 16px;
                border-radius: 20px;
            ">Easy</div>
            <div style="
                background: #FFD93D;
                color: #5B4B9E;
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 16px;
                padding: 6px 16px;
                border-radius: 20px;
            ">Medium</div>
            <div style="
                background: #FF6B6B;
                color: white;
                font-family: 'Fredoka', sans-serif;
                font-weight: 600;
                font-size: 16px;
                padding: 6px 16px;
                border-radius: 20px;
            ">Challenge</div>
        </div>

        <!-- Bottom Banner -->
        <div style="
            position: absolute;
            bottom: 45px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 15;
        ">
            <div style="
                display: inline-flex;
                align-items: center;
                gap: 30px;
                background: white;
                padding: 15px 35px;
                border-radius: 50px;
                box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            ">
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 700;
                    font-size: 26px;
                    color: #FF6B6B;
                ">FREE</span>
                <span style="
                    width: 2px;
                    height: 30px;
                    background: #E0E0E0;
                "></span>
                <span style="
                    font-family: 'Nunito', sans-serif;
                    font-weight: 600;
                    font-size: 20px;
                    color: #5B4B9E;
                ">Answer Keys Included</span>
                <span style="
                    width: 2px;
                    height: 30px;
                    background: #E0E0E0;
                "></span>
                <span style="
                    font-family: 'Fredoka', sans-serif;
                    font-weight: 600;
                    font-size: 20px;
                    color: #5BC0EB;
                ">Grades K-2</span>
            </div>
        </div>

        <!-- Floating Stars -->
        <svg style="position: absolute; top: 180px; left: 80px; z-index: 4;" width="35" height="35" viewBox="0 0 100 100">
            <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FFD93D" opacity="0.9"/>
        </svg>
        <svg style="position: absolute; top: 220px; right: 100px; z-index: 4;" width="30" height="30" viewBox="0 0 100 100">
            <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#FF9A56" opacity="0.8"/>
        </svg>
        <svg style="position: absolute; bottom: 280px; left: 50px; z-index: 4;" width="25" height="25" viewBox="0 0 100 100">
            <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#5DCEA8" opacity="0.7"/>
        </svg>
        <svg style="position: absolute; bottom: 300px; right: 60px; z-index: 4;" width="28" height="28" viewBox="0 0 100 100">
            <polygon points="50,5 61,40 98,40 68,62 79,97 50,75 21,97 32,62 2,40 39,40" fill="#9B7DD4" opacity="0.8"/>
        </svg>

        <!-- Small clouds -->
        <div style="
            position: absolute;
            top: 350px;
            left: 220px;
            z-index: 3;
        ">
            <svg width="80" height="50" viewBox="0 0 80 50" opacity="0.6">
                <ellipse cx="20" cy="30" rx="18" ry="14" fill="white"/>
                <ellipse cx="40" cy="25" rx="22" ry="18" fill="white"/>
                <ellipse cx="60" cy="32" rx="16" ry="12" fill="white"/>
            </svg>
        </div>
        <div style="
            position: absolute;
            top: 380px;
            right: 200px;
            z-index: 3;
        ">
            <svg width="70" height="45" viewBox="0 0 70 45" opacity="0.5">
                <ellipse cx="18" cy="28" rx="16" ry="12" fill="white"/>
                <ellipse cx="35" cy="22" rx="20" ry="16" fill="white"/>
                <ellipse cx="52" cy="28" rx="14" ry="10" fill="white"/>
            </svg>
        </div>
    </div>
</body>
</html>
