assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Read a 2-sentence instruction independently + execute
        both steps in order in 7 of 10 trials.
      - Use re-reading strategy when first execution misses a
        step in 5 of 8 observed instances.
      - Identify the action verb in each sentence of a 2-step
        instruction in 6 of 10 trials.
      - Write a 2-sentence instruction independently for a peer
        in 4 of 6 trials.
      - Use vocabulary 'instruction' / 'direction' / 'step' /
        'first' / 'next' / 'follow' correctly in 5 of 10
        productive-language trials.

    Differentiation:
    - Pre-K: skip 2-step instructions; review read-cvc-words +
      single-word commands first.
    - K: 1-step instructions only with picture support; defer
      2-step to Grade 1+.
    - Grade 1: full 2-step instruction reading + execution;
      re-reading strategy emphasis; bridge to peer-instruction
      writing (productive-language).
    - Grade 2: extend to 3-step instructions + multi-clause
      sentences; introduce instructional-text-feature awareness
      (numbered lists, bullet points, sequence markers).
    - Grade 3+: full procedural-reading pedagogy (technical
      instructions + recipes + sequenced procedures); bridge
      to multi-step word problems + classroom-procedure
      authoring + simple workflow documentation.

