# Teaching package — identify and name 10 vehicles
# Arc 2 Phase 3a (en authoring; mirrors Arc 1 farm-animals template).
# Pedagogical learning target: identify-and-name-vehicles
#   (early-literacy → vocabulary-acquisition strand)
# Verified vocab keys: car, bus, train, airplane, ship, boat, bicycle, truck,
# motorcycle, taxi (10/10 with full 11-locale IMAGE_VOCABULARY entries).

targetSlug: identify-and-name-vehicles
language: en

title:
  en: "Vehicles — identify and name 10"
description:
  en: "K-Grade 1 vocabulary-acquisition package for 10 universal vehicles: car, bus, train, airplane, ship, boat, bicycle, truck, motorcycle, taxi. 5 worksheet exercises + 8 printable materials. Theme-agnostic; operator selects target instruction language at material-render time."

durationMinutes: 30

structure:
  warmup:
    durationMinutes: 5
    body: |
      Whole-class introduction. Teacher holds up flashcards, names each vehicle in
      target language, class repeats chorally. Optional sound effect: kids make the
      vehicle sound (vroom for car, choo-choo for train, etc.) — adds engagement
      + sound-symbol association. Pin cards to "Vehicles" word wall cluster.
  contentActivity:
    durationMinutes: 12
    body: |
      Pocket-chart routine with sentence strips ("I see a {item}"). Choral reading
      first, then individual reads. Pair work: kids hold a picture-card, partner
      names the vehicle. Recast errors in the target frame.
  scaffold:
    durationMinutes: 8
    body: |
      Station rotation. Station 1: image-letter matching (matching app, letter mode).
      Station 2: picture-card sorting on the carpet (land vs water vs air vehicles
      — categorization + spatial reasoning). Station 3: manipulative cut-outs for
      counting work.
  closure:
    durationMinutes: 5
    body: |
      Whole-class share-out. Final challenge: teacher names a vehicle, kids point
      to flashcard. Forward-pointer: "Today we learned 10 vehicle words. When we
      come back to vehicles next, this same set will be here."

