assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Identify turn-taking in a scenario picture from a 4-choice
        set (taking-turns / waiting-line / sharing-divided / not-
        taking-turns) in 8 of 10 trials.
      - Name 3 turn-taking phrases (\"my turn\" / \"your turn\" /
        \"we can share\") productively when prompted by scenario
        cues in 5 of 8 trials.
      - Demonstrate turn-taking in 4 of 6 observed pair-activities
        during free-play (teacher rubric across week).
      - Self-advocate \"my turn\" without conflict in 3 of 5 free-
        play observations (script-application metric).

    Differentiation:
    - Pre-K: 2-script set (\"my turn\" + \"your turn\"); receptive-
      modeling first (kids respond to teacher-prompted scripts);
      productive-language emerges as it does without pressure.
    - K: full 3-script set; productive use of scripts during pair
      activities; teacher rubric on free-play observations.
    - Grade 1+: extend to conflict-de-escalation (\"can we share?\"
      + \"can I have a turn next?\" + \"please, may I?\") + asking-
      adult-for-help when turn-taking breaks down (Arc 18+
      candidate); bridge to community-of-learners norms +
      classroom-culture work.

