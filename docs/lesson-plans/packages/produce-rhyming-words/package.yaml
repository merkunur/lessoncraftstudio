assessmentCriteria:
  en: |
    By end of 1-week unit:
      - Produce 3+ rhyming words for a target CVC word in 7
        of 10 trials.
      - Recognize the rhyming-family pattern (-at, -an, -ot,
        -ig) in 6 of 8 trials.
      - Sort 12 picture cards into rhyming-family groups (3-
        4 groups) correctly in 6 of 10 attempts.
      - Distinguish rhyming from non-rhyming pairs in 7 of 10
        trials (receptive review from identify-rhyming-pairs).
      - Use vocabulary 'rhyme' / 'rhyming' / 'sound the same'
        / 'ending sound' / 'rhyming family' correctly in 5
        of 10 productive-language trials.

    Differentiation:
    - Pre-K: focus on identify-rhyming-pairs (receptive) only;
      defer productive rhyme to K.
    - K: full CVC rhyme-family production with simple families
      (-at, -an, -ot, -ig); nonsense rhymes accepted; defer
      complex rhyme-families.
    - Grade 1: extend to complex rhyme-families (-ake, -ight,
      -ound, -ation); introduce real vs nonsense word
      distinction more formally; bridge to rhyming-poem
      writing.
    - Grade 2+: extend to slant-rhyme + near-rhyme awareness;
      bridge to poetic-form pedagogy + creative writing
      composition.

